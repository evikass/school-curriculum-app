<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C5F2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9F5A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9F5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5F2D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="url(#headerGrad)" stroke-width="3"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Заголовок класса -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <rect x="440" y="15" width="40" height="20" fill="url(#headerGrad)" rx="3"/>
  <text x="460" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Ур. 12</text>
  
  <!-- Заголовок темы -->
  <rect x="20" y="40" width="460" height="35" fill="url(#headerGrad)" rx="5"/>
  <text x="250" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Бессоюзное сложное предложение (БСП)</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Связь частей интонацией. Пунктуация.</text>
  
  <!-- Таблица знаков препинания -->
  <g transform="translate(20, 110)">
    <rect width="220" height="200" fill="url(#boxGrad)" stroke="#999" stroke-width="1" rx="5"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">Знаки препинания в БСП</text>
    
    <!-- Запятая -->
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="12" fill="#333">1. Запятая (,)</text>
    <line x1="15" y1="55" x2="205" y2="55" stroke="#999" stroke-width="1"/>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="11" fill="#555">• Между частями с разными</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="11" fill="#555">  субъектами действия</text>
    <text x="15" y="100" font-family="Arial, sans-serif" font-size="11" fill="#555">• При последовательности действий</text>
    <text x="15" y="115" font-family="Arial, sans-serif" font-size="11" fill="#555">• При однородных членах</text>
    
    <!-- Точка с запятой -->
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">2. Точка с запятой (;)</text>
    <line x1="15" y1="145" x2="205" y2="145" stroke="#999" stroke-width="1"/>
    <text x="15" y="160" font-family="Arial, sans-serif" font-size="11" fill="#555">• Между сложносочинёнными</text>
    <text x="15" y="175" font-family="Arial, sans-serif" font-size="11" fill="#555">  частями</text>
    <text x="15" y="190" font-family="Arial, sans-serif" font-size="11" fill="#555">• При перечислении БСП</text>
  </g>
  
  <!-- Таблица знаков препинания (продолжение) -->
  <g transform="translate(260, 110)">
    <rect width="220" height="200" fill="url(#boxGrad)" stroke="#999" stroke-width="1" rx="5"/>
    
    <!-- Двоеточие -->
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">3. Двоеточие (:)</text>
    <line x1="15" y1="30" x2="205" y2="30" stroke="#999" stroke-width="1"/>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="#555">• При пояснительной связи</text>
    <text x="15" y="60" font-family="Arial, sans-serif" font-size="11" fill="#555">• При следственной связи</text>
    <text x="15" y="75" font-family="Arial, sans-serif" font-size="11" fill="#555">• При изложении причины</text>
    
    <!-- Тире -->
    <text x="15" y="95" font-family="Arial, sans-serif" font-size="12" fill="#333">4. Тире (—)</text>
    <line x1="15" y1="105" x2="205" y2="105" stroke="#999" stroke-width="1"/>
    <text x="15" y="120" font-family="Arial, sans-serif" font-size="11" fill="#555">• При резком противопоставлении</text>
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="11" fill="#555">• При внезапной смене мысли</text>
    <text x="15" y="150" font-family="Arial, sans-serif" font-size="11" fill="#555">• При выводе, заключении</text>
    <text x="15" y="165" font-family="Arial, sans-serif" font-size="11" fill="#555">• При обращении</text>
    <text x="15" y="180" font-family="Arial, sans-serif" font-size="11" fill="#555">• При перечислении БСП</text>
  </g>
  
  <!-- Примеры предложений -->
  <g transform="translate(20, 320)">
    <rect width="460" height="25" fill="url(#highlightGrad)" rx="3"/>
    <text x="10" y="17" font-family="Arial, sans-serif" font-size="11" fill="#333">Примеры: </text>
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="11" fill="#333">Лес дремал, надвигалась ночь.</text>
    <text x="200" y="17" font-family="Arial, sans-serif" font-size="11" fill="#333">Я вышел на улицу; за мной закрылась дверь.</text>
    <text x="380" y="17" font-family="Arial, sans-serif" font-size="11" fill="#333">Он молчал: ему было нечего сказать.</text>
  </g>
  
  <!-- Схема БСП с запятой -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#4A9F5A" stroke-width="2" rx="3"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 1</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Я читаю</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">книгу</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C">,</text>
    <line x1="90" y1="55" x2="90" y2="65" stroke="#999" stroke-width="1"/>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 2</text>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">мальчик спит</text>
  </g>
  
  <!-- Схема БСП с точкой с запятой -->
  <g transform="translate(250, 150)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#4A9F5A" stroke-width="2" rx="3"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 1</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Шёл дождь</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">листики</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C">;</text>
    <line x1="90" y1="55" x2="90" y2="65" stroke="#999" stroke-width="1"/>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 2</text>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">ветер свистел</text>
  </g>
  
  <!-- Схема БСП с двоеточием -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#4A9F5A" stroke-width="2" rx="3"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 1</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Он знал</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">ответ</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C">:</text>
    <line x1="90" y1="55" x2="90" y2="65" stroke="#999" stroke-width="1"/>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 2</text>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">всё было просто</text>
  </g>
  
  <!-- Схема БСП с тире -->
  <g transform="translate(250, 230)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#4A9F5A" stroke-width="2" rx="3"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 1</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Хотелось</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">домой</text>
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E74C3C">—</text>
    <line x1="90" y1="55" x2="90" y2="65" stroke="#999" stroke-width="1"/>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Часть 2</text>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">но пришлось остаться</text>
  </g>
  
  <!-- Стрелки, показывающие связь -->
  <g>
    <path d="M 120 210 Q 120 220 120 230" fill="none" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 340 210 Q 340 220 340 230" fill="none" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A9F5A"/>
    </marker>
  </defs>
  
  <!-- Указатели смысла -->
  <text x="220" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">сравнение</text>
  <text x="440" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">противопоставление</text>
  <text x="120" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">объяснение</text>
  <text x="340" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">вывод</text>
  
  <!-- Декоративные элементы -->
  <circle cx="15" cy="15" r="3" fill="#4A9F5A"/>
  <circle cx="485" cy="15" r="3" fill="#4A9F5A"/>
  <circle cx="15" cy="335" r="3" fill="#4A9F5A"/>
  <circle cx="485" cy="335" r="3" fill="#4A9F5A"/>
  
  <!-- Пояснительные надписи -->
  <text x="250" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">Интонационная связь между частями БСП</text>
</svg>