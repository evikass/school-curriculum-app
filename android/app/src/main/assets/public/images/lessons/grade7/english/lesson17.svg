<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748">
    Урок 17. Present Perfect
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4a5568">
    Have you ever...?
  </text>
  
  <!-- Класс -->
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#718096" font-style="italic">
    АНГЛИЙСКИЙ · 7 КЛАСС
  </text>
  
  <!-- Основная рамка урока -->
  <rect x="30" y="110" width="440" height="220" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Раздел "Структура Present Perfect" -->
  <rect x="50" y="130" width="400" height="35" rx="5" fill="#e6fffa" stroke="#4fd1c5" stroke-width="1"/>
  <text x="60" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#234e52">
    Структура Present Perfect
  </text>
  
  <!-- Пример структуры -->
  <text x="70" y="185" font-family="Arial, sans-serif" font-size="13" fill="#2d3748">
    Подлежащее + have/has + глагол в третьей форме (V3) + ...
  </text>
  
  <!-- Раздел "Формулы" -->
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3748">
    Положительная: I have finished my homework.
  </text>
  
  <text x="70" y="230" font-family="Arial, sans-serif" font-size="13" fill="#2d3748">
    Отрицательная: She hasn't seen this film yet.
  </text>
  
  <text x="70" y="250" font-family="Arial, sans-serif" font-size="13" fill="#2d3748">
    Вопросительная: Have they ever been to London?
  </text>
  
  <!-- Раздел "Have you ever...?" -->
  <rect x="50" y="265" width="190" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="145" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">
    Have you ever...?
  </text>
  <text x="145" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">
    Используем для вопросов о жизненном опыте
  </text>
  
  <!-- Примеры вопросов -->
  <rect x="260" y="265" width="190" height="50" rx="5" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="355" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    Примеры вопросов
  </text>
  <text x="355" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b21b6">
    eaten sushi? / traveled abroad? / met a celebrity?
  </text>
  
  <!-- Значок "?!" -->
  <circle cx="430" cy="100" r="15" fill="#f87171" opacity="0.8"/>
  <text x="430" y="107" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    ?!
  </text>
  
  <!-- Маркеры -->
  <circle cx="60" cy="180" r="3" fill="#3182ce"/>
  <circle cx="60" cy="205" r="3" fill="#3182ce"/>
  <circle cx="60" cy="225" r="3" fill="#3182ce"/>
  <circle cx="60" cy="245" r="3" fill="#3182ce"/>
  
  <!-- Декоративные элементы -->
  <rect x="45" y="125" width="3" height="230" fill="#4fd1c5"/>
  <rect x="452" y="125" width="3" height="230" fill="#4fd1c5"/>
  
  <!-- Иконки -->
  <!-- Карандаш -->
  <rect x="410" y="140" width="20" height="3" fill="#718096" transform="rotate(-45 420 141.5)"/>
  <polygon points="410,140 413,137 413,143" fill="#718096" transform="rotate(-45 420 141.5)"/>
  
  <!-- Блокнот -->
  <rect x="440" y="135" width="15" height="20" fill="#a78bfa" rx="2"/>
  <line x1="443" y1="140" x2="452" y2="140" stroke="white" stroke-width="1"/>
  <line x1="443" y1="143" x2="452" y2="143" stroke="white" stroke-width="1"/>
  <line x1="443" y1="146" x2="452" y2="146" stroke="white" stroke-width="1"/>
  
  <!-- Вспомогательные слова -->
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="12" fill="#718096" font-style="italic">
    • already - уже
  </text>
  
  <!-- Дополнительные элементы -->
  <rect x="200" y="135" width="100" height="20" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="250" y="149" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4338ca">
    life experience
  </text>
  
  <!-- Стрелка указания -->
  <path d="M 180 160 L 190 155 L 190 165 Z" fill="#64748b"/>
  <line x1="190" y1="160" x2="200" y2="160" stroke="#64748b" stroke-width="2"/>
  
  <!-- Знак "V" для правильных ответов -->
  <polygon points="415,220 420,225 430,215" fill="#10b981" stroke="#047857" stroke-width="1"/>
  
  <!-- Знак "X" для неправильных ответов -->
  <g transform="translate(440, 220)">
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ef4444" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="#ef4444" stroke-width="2"/>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9ca3af">
    Запомни: Present Perfect - для завершенных действий с результатом в настоящем
  </text>
  
  <!-- Вспомогательные фигуры -->
  <ellipse cx="100" cy="320" rx="15" ry="8" fill="#fbbf24" opacity="0.6"/>
  <ellipse cx="130" cy="325" rx="10" ry="5" fill="#34d399" opacity="0.6"/>
  
  <!-- Числовой индикатор -->
  <circle cx="40" cy="340" r="15" fill="#3b82f6"/>
  <text x="40" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    17
  </text>
</svg>