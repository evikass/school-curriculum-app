<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Дефиниции градиентов -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7bc7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#4a7bc7" stroke-width="2" rx="5" ry="5"/>
  <rect x="15" y="15" width="470" height="320" fill="none" stroke="#6b9bd1" stroke-width="1" rx="3" ry="3"/>
  
  <!-- Заголовок класса -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="14" fill="#2c5aa0" text-anchor="middle" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="45" y="35" font-family="Arial, sans-serif" font-size="16" fill="#2c5aa0" font-weight="bold">Урок 12</text>
  
  <!-- Заголовок темы -->
  <rect x="50" y="50" width="400" height="40" fill="url(#headerGradient)" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Понятие о сложном предложении</text>
  
  <!-- Определение СП -->
  <rect x="50" y="100" width="430" height="60" fill="url(#boxGradient)" stroke="#4a7bc7" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="12" fill="#2c5aa0" font-weight="bold">Определение:</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="11" fill="#333">Сложное предложение (СП) — это два или более простых</text>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">пределенных предложений (ПП), соединенных между собой.</text>
  
  <!-- Признаки СП -->
  <rect x="50" y="170" width="200" height="100" fill="url(#boxGradient)" stroke="#4a7bc7" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c5aa0" font-weight="bold">Признаки СП:</text>
  <circle cx="70" cy="205" r="3" fill="#4a7bc7"/>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="10" fill="#333">Два или более предиката</text>
  <circle cx="70" cy="225" r="3" fill="#4a7bc7"/>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="10" fill="#333">Общее значение</text>
  <circle cx="70" cy="245" r="3" fill="#4a7bc7"/>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="10" fill="#333">Интонационное единство</text>
  
  <!-- Типы связи -->
  <rect x="260" y="170" width="220" height="100" fill="url(#boxGradient)" stroke="#4a7bc7" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="270" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c5aa0" font-weight="bold">Типы связи:</text>
  <rect x="280" y="200" width="90" height="25" fill="#e6f3ff" stroke="#4a7bc7" stroke-width="1" rx="3" ry="3"/>
  <text x="325" y="217" font-family="Arial, sans-serif" font-size="10" fill="#2c5aa0" text-anchor="middle">Союзная</text>
  <rect x="380" y="200" width="90" height="25" fill="#e6f3ff" stroke="#4a7bc7" stroke-width="1" rx="3" ry="3"/>
  <text x="425" y="217" font-family="Arial, sans-serif" font-size="10" fill="#2c5aa0" text-anchor="middle">Бессоюзная</text>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="10" fill="#333">Средства связи</text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="10" fill="#333">— союзы, союзные слова</text>
  
  <!-- Примеры СП -->
  <rect x="50" y="280" width="430" height="50" fill="url(#boxGradient)" stroke="#4a7bc7" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="12" fill="#2c5aa0" font-weight="bold">Примеры СП:</text>
  
  <!-- Пример 1 - Союзная связь -->
  <rect x="70" y="310" width="140" height="15" fill="#f0f8ff" stroke="#4a7bc7" stroke-width="1" rx="3" ry="3"/>
  <text x="75" y="321" font-family="Arial, sans-serif" font-size="9" fill="#333">Когда дождь прошел, дети</text>
  <text x="75" y="331" font-family="Arial, sans-serif" font-size="9" fill="#333">побежали играть во двор.</text>
  <text x="210" y="321" font-family="Arial, sans-serif" font-size="9" fill="#2c5aa0">союзная</text>
  
  <!-- Пример 2 - Бессоюзная связь -->
  <rect x="250" y="310" width="140" height="15" fill="#f0f8ff" stroke="#4a7bc7" stroke-width="1" rx="3" ry="3"/>
  <text x="255" y="321" font-family="Arial, sans-serif" font-size="9" fill="#333">Дождь прошел, дети побежали</text>
  <text x="255" y="331" font-family="Arial, sans-serif" font-size="9" fill="#333">играть во двор.</text>
  <text x="390" y="321" font-family="Arial, sans-serif" font-size="9" fill="#2c5aa0">бессоюзная</text>
  
  <!-- Средства связи -->
  <circle cx="380" cy="205" r="25" fill="#e6f3ff" stroke="#4a7bc7" stroke-width="1.5"/>
  <text x="380" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c5aa0" text-anchor="middle">Средства</text>
  <text x="380" y="213" font-family="Arial, sans-serif" font-size="10" fill="#2c5aa0" text-anchor="middle">связи</text>
  
  <!-- Стрелки к средствам связи -->
  <line x1="355" y1="205" x2="330" y2="205" stroke="#4a7bc7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="405" y1="205" x2="430" y2="205" stroke="#4a7bc7" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Средства связи подсказки -->
  <rect x="270" y="240" width="180" height="20" fill="#f0f8ff" stroke="#4a7bc7" stroke-width="1" rx="3" ry="3"/>
  <text x="360" y="253" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">интонация, союзы, союзные слова</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="120" r="3" fill="#4a7bc7"/>
  <circle cx="470" cy="120" r="3" fill="#4a7bc7"/>
  <circle cx="30" cy="220" r="3" fill="#4a7bc7"/>
  <circle cx="470" cy="220" r="3" fill="#4a7bc7"/>
  <circle cx="30" cy="320" r="3" fill="#4a7bc7"/>
  <circle cx="470" cy="320" r="3" fill="#4a7bc7"/>
  
  <!-- Линии для схемы предложения -->
  <line x1="70" y1="308" x2="210" y2="308" stroke="#2c5aa0" stroke-width="1"/>
  <line x1="250" y1="308" x2="390" y2="308" stroke="#2c5aa0" stroke-width="1"/>
  <line x1="210" y1="308" x2="210" y2="295" stroke="#2c5aa0" stroke-width="1"/>
  <line x1="390" y1="308" x2="390" y2="295" stroke="#2c5aa0" stroke-width="1"/>
  
  <!-- Схема предложения -->
  <text x="140" y="295" font-family="Arial, sans-serif" font-size="8" fill="#2c5aa0" text-anchor="middle">ПП1</text>
  <text x="180" y="295" font-family="Arial, sans-serif" font-size="8" fill="#2c5aa0" text-anchor="middle">СС</text>
  <text x="230" y="295" font-family="Arial, sans-serif" font-size="8" fill="#2c5aa0" text-anchor="middle">ПП2</text>
  <text x="320" y="295" font-family="Arial, sans-serif" font-size="8" fill="#2c5aa0" text-anchor="middle">ПП1</text>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="8" fill="#2c5aa0" text-anchor="middle">ПП2</text>
  
  <!-- Сокращения -->
  <text x="420" y="185" font-family="Arial, sans-serif" font-size="9" fill="#666">СП - сложное предложение</text>
  <text x="420" y="200" font-family="Arial, sans-serif" font-size="9" fill="#666">ПП - простое предложение</text>
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="9" fill="#666">СС - средство связи</text>
</svg>