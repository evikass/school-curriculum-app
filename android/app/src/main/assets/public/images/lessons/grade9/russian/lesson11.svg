<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ad4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec971f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9534f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9302c;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновая рамка -->
  <rect x="10" y="10" width="480" height="330" fill="url(#grad1)" rx="10" ry="10" opacity="0.1"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#4a90e2" stroke-width="2" rx="10" ry="10"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="40" fill="url(#grad2)" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Тема -->
  <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Повторение орфографии. Правописание корней</text>
  
  <!-- Раздел 1: Проверяемые гласные -->
  <rect x="30" y="100" width="210" height="110" fill="url(#grad3)" opacity="0.2" rx="5" ry="5" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="135" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">Проверяемые гласные</text>
  
  <circle cx="60" cy="140" r="20" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="60" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Гласные</text>
  
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="11" fill="#333">Проверяем ударением</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="11" fill="#333">в производном слове</text>
  
  <text x="50" y="185" font-family="Arial, sans-serif" font-size="10" fill="#555">-ел- (зелёный, желать)</text>
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="10" fill="#555">-ир- (цветок, цвести)</text>
  
  <!-- Раздел 2: Непроверяемые гласные -->
  <rect x="260" y="100" width="210" height="110" fill="url(#grad4)" opacity="0.2" rx="5" ry="5" stroke="#d9534f" stroke-width="1.5"/>
  <text x="365" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#721c24">Непроверяемые гласные</text>
  
  <circle cx="290" cy="140" r="20" fill="url(#grad4)" filter="url(#shadow)"/>
  <text x="290" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Запомни</text>
  
  <text x="330" y="145" font-family="Arial, sans-serif" font-size="11" fill="#333">Не меняются</text>
  <text x="330" y="160" font-family="Arial, sans-serif" font-size="11" fill="#333">в производных словах</text>
  
  <text x="280" y="185" font-family="Arial, sans-serif" font-size="10" fill="#555">-инк- (медицина, врач)</text>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="10" fill="#555">-тель- (учитель, учить)</text>
  
  <!-- Раздел 3: Чередующиеся корни -->
  <rect x="30" y="225" width="440" height="90" fill="url(#grad1)" opacity="0.2" rx="5" ry="5" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c5aa0">Чередующиеся корни</text>
  
  <!-- Корень -лаг-/-лож- -->
  <rect x="40" y="255" width="80" height="50" fill="white" rx="3" ry="3" filter="url(#shadow)"/>
  <text x="80" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">-лаг-/-лож-</text>
  <text x="80" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">залагать, заложить</text>
  <text x="80" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">выложить, положить</text>
  
  <!-- Стрелка -->
  <path d="M 125 280 L 145 280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  
  <!-- Корень -рос-/-раст- -->
  <rect x="150" y="255" width="80" height="50" fill="white" rx="3" ry="3" filter="url(#shadow)"/>
  <text x="190" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">-рос-/-раст-</text>
  <text x="190" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">пророс, росток</text>
  <text x="190" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">расти, выращивать</text>
  
  <!-- Стрелка -->
  <path d="M 235 280 L 255 280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Корень -кос-/-кас- -->
  <rect x="260" y="255" width="80" height="50" fill="white" rx="3" ry="3" filter="url(#shadow)"/>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">-кос-/-кас-</text>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">косой, коснуться</text>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">прикоснуться, касание</text>
  
  <!-- Стрелка -->
  <path d="M 345 280 L 365 280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Правописание согласных -->
  <rect x="370" y="255" width="90" height="50" fill="white" rx="3" ry="3" filter="url(#shadow)"/>
  <text x="415" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Согласные</text>
  <text x="415" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">двойные</text>
  <text x="415" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">-сс-, -нн-</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="480" cy="40" r="15" fill="url(#grad2)" opacity="0.5"/>
  <text x="480" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">!</text>
  
  <rect x="20" y="320" width="460" height="15" fill="url(#grad1)" opacity="0.3" rx="3" ry="3"/>
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Запомни правила орфографии корней!</text>
</svg>