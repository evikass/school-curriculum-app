<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FB709;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD10E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9013FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="50" rx="10" fill="url(#blueGrad)"/>
  <text x="250" y="52" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <rect x="20" y="80" width="150" height="35" rx="5" fill="url(#greenGrad)"/>
  <text x="95" y="102" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Урок 20</text>
  
  <!-- Тема урока -->
  <rect x="180" y="80" width="300" height="35" rx="5" fill="url(#purpleGrad)"/>
  <text x="330" y="102" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial, sans-serif">Умножение одночлена на многочлен</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="135" text-anchor="middle" fill="#333" font-size="18" font-weight="bold" font-family="Arial, sans-serif">Распределительное свойство</text>
  
  <!-- Система координат -->
  <g transform="translate(50, 200)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="150" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Метки осей -->
    <text x="155" y="5" font-size="12" fill="#333">x</text>
    <text x="-10" y="-105" font-size="12" fill="#333">y</text>
    
    <!-- Деления на оси X -->
    <line x1="30" y1="-2" x2="30" y2="2" stroke="#333" stroke-width="1"/>
    <line x1="60" y1="-2" x2="60" y2="2" stroke="#333" stroke-width="1"/>
    <line x1="90" y1="-2" x2="90" y2="2" stroke="#333" stroke-width="1"/>
    <line x1="120" y1="-2" x2="120" y2="2" stroke="#333" stroke-width="1"/>
    
    <!-- Деления на оси Y -->
    <line x1="-2" y1="-20" x2="2" y2="-20" stroke="#333" stroke-width="1"/>
    <line x1="-2" y1="-40" x2="2" y2="-40" stroke="#333" stroke-width="1"/>
    <line x1="-2" y1="-60" x2="2" y2="-60" stroke="#333" stroke-width="1"/>
    <line x1="-2" y1="-80" x2="2" y2="-80" stroke="#333" stroke-width="1"/>
    
    <!-- График функции -->
    <path d="M 0,0 L 30,-20 L 60,-40 L 90,-60 L 120,-80" stroke="url(#orangeGrad)" stroke-width="3" fill="none"/>
    
    <!-- Точки на графике -->
    <circle cx="0" cy="0" r="4" fill="#F39C12"/>
    <circle cx="30" cy="-20" r="4" fill="#F39C12"/>
    <circle cx="60" cy="-40" r="4" fill="#F39C12"/>
    <circle cx="90" cy="-60" r="4" fill="#F39C12"/>
    <circle cx="120" cy="-80" r="4" fill="#F39C12"/>
  </g>
  
  <!-- Вторая система координат -->
  <g transform="translate(250, 200)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="150" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- График функции 2 -->
    <path d="M 0,0 L 30,-40 L 60,-80 L 90,-40 L 120,0" stroke="url(#greenGrad)" stroke-width="3" fill="none"/>
    
    <!-- Точки на графике -->
    <circle cx="0" cy="0" r="4" fill="#7ED321"/>
    <circle cx="30" cy="-40" r="4" fill="#7ED321"/>
    <circle cx="60" cy="-80" r="4" fill="#7ED321"/>
    <circle cx="90" cy="-40" r="4" fill="#7ED321"/>
    <circle cx="120" cy="0" r="4" fill="#7ED321"/>
  </g>
  
  <!-- Стрелка маркера -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Формулы -->
  <rect x="20" y="310" width="460" height="30" rx="5" fill="#E8F4FD" stroke="#4A90E2" stroke-width="1"/>
  <text x="250" y="330" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif">a(b + c) = ab + ac</text>
  
  <!-- Пример 1 -->
  <rect x="20" y="150" width="220" height="40" rx="5" fill="#FFF3E0" stroke="#F39C12" stroke-width="1"/>
  <text x="130" y="175" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif">3(x + 2) = 3x + 6</text>
  
  <!-- Пример 2 -->
  <rect x="260" y="150" width="220" height="40" rx="5" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="370" y="175" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif">2(3y - 4) = 6y - 8</text>
  
  <!-- Условие -->
  <rect x="20" y="195" width="220" height="40" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif">Найдите значение выражения</text>
  
  <!-- Решение -->
  <rect x="260" y="195" width="220" height="40" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="370" y="220" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif">Примените распределительный закон</text>
  
  <!-- Примечание -->
  <rect x="20" y="250" width="460" height="25" rx="5" fill="#FFF8E1" stroke="#FFC107" stroke-width="1"/>
  <text x="250" y="267" text-anchor="middle" fill="#333" font-size="12" font-family="Arial, sans-serif">Важно: умножьте каждый член многочлена на одночлен</text>
  
  <!-- Обозначения -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="15" height="15" fill="url(#blueGrad)"/>
    <text x="20" y="12" font-size="12" fill="#666">Одночлен</text>
    
    <rect x="80" y="0" width="15" height="15" fill="url(#greenGrad)"/>
    <text x="100" y="12" font-size="12" fill="#666">Многочлен</text>
    
    <rect x="180" y="0" width="15" height="15" fill="url(#orangeGrad)"/>
    <text x="200" y="12" font-size="12" fill="#666">Результат</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="450" cy="50" r="20" fill="none" stroke="#4A90E2" stroke-width="2" opacity="0.3"/>
  <circle cx="450" cy="50" r="15" fill="none" stroke="#4A90E2" stroke-width="1" opacity="0.5"/>
  
  <!-- Дополнительные формулы -->
  <text x="50" y="280" font-size="11" fill="#666" font-family="Arial, sans-serif">• (a + b)c = ac + bc</text>
  <text x="50" y="295" font-size="11" fill="#666" font-family="Arial, sans-serif">• a(b - c) = ab - ac</text>
  
  <!-- Графическое представление -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="30" height="15" fill="url(#blueGrad)" opacity="0.7"/>
    <rect x="35" y="0" width="30" height="15" fill="url(#greenGrad)" opacity="0.7"/>
    <text x="65" y="12" font-size="10" fill="#666">=</text>
    <rect x="75" y="0" width="60" height="15" fill="url(#orangeGrad)" opacity="0.7"/>
  </g>
</svg>