<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FB709;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" fill="url(#blueGrad)" rx="5" filter="url(#shadow)"/>
  <text x="250" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ГЕОМЕТРИЯ · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <rect x="10" y="70" width="150" height="35" fill="url(#greenGrad)" rx="5" filter="url(#shadow)"/>
  <text x="85" y="92" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Урок 5</text>
  
  <!-- Тема урока -->
  <text x="180" y="92" font-family="Arial, sans-serif" font-size="16" fill="#333">Первый признак равенства треугольников</text>
  
  <!-- Триугольник 1 -->
  <g transform="translate(50, 130)">
    <polygon points="0,0 80,0 40,70" fill="none" stroke="url(#blueGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="url(#blueGrad)"/>
    <circle cx="80" cy="0" r="4" fill="url(#blueGrad)"/>
    <circle cx="40" cy="70" r="4" fill="url(#blueGrad)"/>
    <text x="-10" y="-10" font-family="Arial, sans-serif" font-size="14" fill="#333">А</text>
    <text x="85" y="5" font-family="Arial, sans-serif" font-size="14" fill="#333">В</text>
    <text x="45" y="85" font-family="Arial, sans-serif" font-size="14" fill="#333">С</text>
  </g>
  
  <!-- Триугольник 2 -->
  <g transform="translate(200, 130)">
    <polygon points="0,0 80,0 40,70" fill="none" stroke="url(#greenGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="url(#greenGrad)"/>
    <circle cx="80" cy="0" r="4" fill="url(#greenGrad)"/>
    <circle cx="40" cy="70" r="4" fill="url(#greenGrad)"/>
    <text x="-10" y="-10" font-family="Arial, sans-serif" font-size="14" fill="#333">А₁</text>
    <text x="85" y="5" font-family="Arial, sans-serif" font-size="14" fill="#333">В₁</text>
    <text x="45" y="85" font-family="Arial, sans-serif" font-size="14" fill="#333">С₁</text>
  </g>
  
  <!-- Стрелка равенства -->
  <g transform="translate(150, 165)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="url(#purpleGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="url(#purpleGrad)"/>
      </marker>
    </defs>
  </g>
  
  <!-- Условие равенства -->
  <rect x="50" y="230" width="400" height="30" fill="url(#redGrad)" rx="5" filter="url(#shadow)"/>
  <text x="250" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">АВ = А₁В₁, ∠А = ∠А₁, АС = А₁С₁</text>
  
  <!-- Вывод -->
  <text x="250" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">⇒ ΔАВС = ΔА₁В₁С₁</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="50" cy="310" r="3" fill="url(#blueGrad)"/>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="12" fill="#666">Признак: По двум сторонам и углу между ними</text>
  
  <!-- Углы -->
  <path d="M 90 130 A 20 20 0 0 1 110 145" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>
  <text x="105" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">α</text>
  
  <path d="M 240 130 A 20 20 0 0 1 260 145" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
  <text x="255" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">α₁</text>
  
  <!-- Длины сторон -->
  <text x="65" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">с</text>
  <text x="85" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">b</text>
  
  <text x="215" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">c₁</text>
  <text x="235" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">b₁</text>
  
  <!-- Название признака -->
  <rect x="300" y="120" width="180" height="80" fill="rgba(74, 144, 226, 0.1)" stroke="url(#blueGrad)" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="390" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">ПЕРВЫЙ ПРИЗНАК</text>
  <text x="390" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">РАВЕНСТВА</text>
  <text x="390" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">ТРЕУГОЛЬНИКОВ</text>
  
  <!-- Декоративные элементы -->
  <rect x="10" y="310" width="30" height="3" fill="url(#blueGrad)"/>
  <rect x="460" y="310" width="30" height="3" fill="url(#blueGrad)"/>
  
  <!-- Подписи для элементов -->
  <text x="20" y="340" font-family="Arial, sans-serif" font-size="10" fill="#999">Стороны</text>
  <text x="150" y="340" font-family="Arial, sans-serif" font-size="10" fill="#999">Углы</text>
  <text x="280" y="340" font-family="Arial, sans-serif" font-size="10" fill="#999">Условие</text>
  
  <!-- Разделительная линия -->
  <line x1="10" y1="210" x2="490" y2="210" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Указатель на угол -->
  <line x1="120" y1="155" x2="150" y2="155" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="270" y1="155" x2="300" y2="155" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
</svg>