<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="esterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фоновая область -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="3" rx="5" />
  
  <!-- Номер урока -->
  <text x="25" y="35" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Урок 15</text>
  
  <!-- Шапка -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" text-anchor="middle">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Заголовок -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50" text-anchor="middle">Карбоновые кислоты и сложные эфиры</text>
  
  <!-- Разделитель -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="#bdc3c7" stroke-width="2" />
  
  <!-- Карбоновые кислоты -->
  <text x="50" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Карбоновые кислоты</text>
  
  <!-- Функциональная группа -->
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Функциональная группа: -COOH</text>
  
  <!-- Муравьиная кислота -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Муравьиная кислота</text>
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">HCOOH</text>
  <circle cx="100" cy="185" r="8" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">H</text>
  <line x1="108" y1="185" x2="120" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="130" cy="185" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="130" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">C</text>
  <line x1="140" y1="185" x2="152" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="162" cy="185" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="162" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">O</text>
  <line x1="162" y1="175" x2="162" y2="165" stroke="#2c3e50" stroke-width="2" />
  <circle cx="162" cy="155" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="162" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">O</text>
  <line x1="170" y1="185" x2="182" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="192" cy="185" r="8" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="192" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">H</text>
  
  <!-- Уксусная кислота -->
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Уксусная кислота</text>
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">CH₃COOH</text>
  <circle cx="300" cy="185" r="8" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="300" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">H</text>
  <line x1="308" y1="185" x2="320" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="330" cy="185" r="8" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="330" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">H</text>
  <line x1="338" y1="185" x2="350" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="360" cy="185" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="360" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">C</text>
  <line x1="370" y1="185" x2="382" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="392" cy="185" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="392" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">O</text>
  <line x1="392" y1="175" x2="392" y2="165" stroke="#2c3e50" stroke-width="2" />
  <circle cx="392" cy="155" r="10" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="392" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">O</text>
  <line x1="400" y1="185" x2="412" y2="185" stroke="#2c3e50" stroke-width="2" />
  <circle cx="422" cy="185" r="8" fill="url(#atomGrad)" stroke="#2c3e50" stroke-width="1" />
  <text x="422" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">H</text>
  
  <!-- Стеариновая кислота -->
  <text x="50" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Стеариновая кислота</text>
  <text x="50" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">C₁₇H₃₅COOH</text>
  <rect x="150" y="240" width="150" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3" />
  <text x="225" y="254" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">Углеводородный радикал</text>
  
  <!-- Олеиновая кислота -->
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Олеиновая кислота</text>
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">C₁₇H₃₃COOH</text>
  <rect x="150" y="300" width="150" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3" />
  <text x="225" y="314" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">Ненасыщенная кислота</text>
  
  <!-- Сложные эфиры -->
  <text x="320" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">Сложные эфиры</text>
  
  <!-- Реакция этерификации -->
  <text x="320" y="250" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Реакция этерификации:</text>
  <text x="320" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">R-COOH + R'-OH → R-COO-R' + H₂O</text>
  
  <!-- Получение мыла -->
  <text x="320" y="295" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Получение мыла:</text>
  <text x="320" y="315" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3C₁₇H₃₅COONa + C₃H₅(OH)₃ →</text>
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(C₁₇H₃₅COO)₃C₃H₅ + 3NaOH</text>
  
  <!-- Жиры -->
  <text x="320" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Жиры — сложные эфиры глицерина</text>
  
  <!-- Дополнительные элементы для достижения 50+ -->
  <circle cx="470" cy="50" r="3" fill="#e74c3c" opacity="0.5" />
  <circle cx="475" cy="55" r="3" fill="#3498db" opacity="0.5" />
  <circle cx="470" cy="60" r="3" fill="#27ae60" opacity="0.5" />
  <circle cx="465" cy="55" r="3" fill="#f39c12" opacity="0.5" />
  
  <rect x="30" y="100" width="10" height="10" fill="#e74c3c" opacity="0.3" rx="2" />
  <rect x="230" y="100" width="10" height="10" fill="#e74c3c" opacity="0.3" rx="2" />
  <rect x="30" y="280" width="10" height="10" fill="#e74c3c" opacity="0.3" rx="2" />
  <rect x="30" y="340" width="10" height="10" fill="#e74c3c" opacity="0.3" rx="2" />
  
  <path d="M 460 100 Q 470 110 460 120 T 460 140" stroke="#3498db" stroke-width="2" fill="none" opacity="0.5" />
  <path d="M 460 150 Q 470 160 460 170 T 460 190" stroke="#27ae60" stroke-width="2" fill="none" opacity="0.5" />
  
  <line x1="460" y1="210" x2="480" y2="210" stroke="#f39c12" stroke-width="1" opacity="0.5" />
  <line x1="460" y1="220" x2="480" y2="220" stroke="#f39c12" stroke-width="1" opacity="0.5" />
  <line x1="460" y1="230" x2="480" y2="230" stroke="#f39c12" stroke-width="1" opacity="0.5" />
</svg>