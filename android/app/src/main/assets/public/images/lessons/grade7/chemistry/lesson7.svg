<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA517;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sunGrad">
      <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="60" rx="10" fill="url(#blueGrad)"/>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Урок 7. Химические уравнения</text>
  
  <!-- Тема -->
  <text x="250" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D">Тема: Уравнения, закон Ломоносова-Лавуазье</text>
  
  <!-- Атомы -->
  <!-- Водород -->
  <circle cx="80" cy="180" r="15" fill="url(#greenGrad)"/>
  <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <circle cx="110" cy="180" r="15" fill="url(#greenGrad)"/>
  <text x="110" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <!-- Кислород -->
  <circle cx="160" cy="180" r="20" fill="url(#redGrad)"/>
  <text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">O</text>
  
  <!-- Знак плюс -->
  <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#34495E">+</text>
  
  <!-- Вторая молекула воды -->
  <circle cx="240" cy="180" r="15" fill="url(#greenGrad)"/>
  <text x="240" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <circle cx="270" cy="180" r="15" fill="url(#greenGrad)"/>
  <text x="270" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <circle cx="220" cy="155" r="20" fill="url(#redGrad)"/>
  <text x="220" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">O</text>
  
  <!-- Стрелка реакции -->
  <path d="M 320 180 L 380 180" stroke="#34495E" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E"/>
    </marker>
  </defs>
  
  <!-- Стрелка вниз -->
  <path d="M 400 180 L 400 220" stroke="#34495E" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E"/>
    </marker>
  </defs>
  
  <!-- Реагенты -->
  <text x="250" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495E">Реагенты</text>
  <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495E">Продукты</text>
  
  <!-- Вторая реакция -->
  <circle cx="420" cy="260" r="15" fill="url(#greenGrad)"/>
  <text x="420" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <circle cx="450" cy="260" r="15" fill="url(#greenGrad)"/>
  <text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H</text>
  
  <circle cx="435" cy="235" r="20" fill="url(#redGrad)"/>
  <text x="435" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">O</text>
  
  <!-- Закон сохранения -->
  <rect x="50" y="280" width="400" height="50" rx="5" fill="url(#purpleGrad)" opacity="0.8"/>
  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Закон сохранения массы (Ломоносов-Лавуазье)</text>
  
  <!-- Солнце (источник энергии) -->
  <circle cx="380" cy="140" r="25" fill="url(#sunGrad)"/>
  <path d="M 380 100 L 380 110 M 380 170 L 380 180 M 350 140 L 360 140 M 400 140 L 410 140 M 355 115 L 362 122 M 398 158 L 405 165 M 405 115 L 398 122 M 362 158 L 355 165" stroke="#FFC107" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Уравнение реакции -->
  <rect x="50" y="200" width="200" height="30" rx="5" fill="#ECF0F1" stroke="#BDC3C7"/>
  <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">2H₂ + O₂ → 2H₂O</text>
  
  <!-- Буквы для объяснения -->
  <circle cx="30" cy="320" r="12" fill="url(#blueGrad)"/>
  <text x="30" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="10" fill="#34495E">Коэффициенты</text>
  
  <circle cx="130" cy="320" r="12" fill="url(#greenGrad)"/>
  <text x="130" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="10" fill="#34495E">Водород</text>
  
  <circle cx="230" cy="320" r="12" fill="url(#redGrad)"/>
  <text x="230" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="10" fill="#34495E">Кислород</text>
  
  <circle cx="330" cy="320" r="12" fill="url(#sunGrad)"/>
  <text x="330" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495E">4</text>
  <text x="350" y="325" font-family="Arial, sans-serif" font-size="10" fill="#34495E">Энергия</text>
  
  <!-- Дополнительные элементы -->
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Водород</text>
  <text x="160" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Кислород</text>
  <text x="220" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Вода</text>
  
  <!-- Углы украшения -->
  <path d="M 20 20 L 40 20 L 40 40" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>
  <path d="M 460 20 L 480 20 L 480 40" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>
  <path d="M 20 330 L 40 330 L 40 350" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>
  <path d="M 460 330 L 480 330 L 480 350" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>
  
  <!-- Пунктирная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="5,5" rx="15"/>
  
  <!-- Энергетический уровень -->
  <line x1="50" y1="150" x2="250" y2="150" stroke="#95A5A6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="153" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Уровень энергии</text>
</svg>