<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b68ee;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa726;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <!-- Декоративные элементы -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#7b68ee" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фоновый декор -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <rect width="500" height="350" fill="url(#dots)"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#grad1)" stroke-width="3" rx="10"/>
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="url(#grad2)" stroke-width="1" rx="8"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#grad3)" text-anchor="middle">ИЗЛОЖЕНИЕ НА ОГЭ</text>
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Приёмы сжатия текста</text>
  
  <!-- Раздел 1: Приёмы сжатия -->
  <text x="30" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Приёмы сжатия:</text>
  
  <!-- Приём 1: Исключение -->
  <rect x="30" y="130" width="140" height="80" fill="url(#grad4)" rx="5" opacity="0.2"/>
  <rect x="30" y="130" width="140" height="25" fill="url(#grad4)" rx="5"/>
  <text x="100" y="147" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1. Исключение</text>
  <text x="40" y="165" font-family="Arial, sans-serif" font-size="11" fill="#333">- Удаление второстепенных</text>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333">  членов предложения</text>
  <text x="40" y="191" font-family="Arial, sans-serif" font-size="11" fill="#333">- Удаление вводных слов</text>
  <text x="40" y="204" font-family="Arial, sans-serif" font-size="11" fill="#333">- Сокращение описаний</text>
  
  <!-- Приём 2: Обобщение -->
  <rect x="180" y="130" width="140" height="80" fill="url(#grad5)" rx="5" opacity="0.2"/>
  <rect x="180" y="130" width="140" height="25" fill="url(#grad5)" rx="5"/>
  <text x="250" y="147" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2. Обобщение</text>
  <text x="190" y="165" font-family="Arial, sans-serif" font-size="11" fill="#333">- Замена частного на общее</text>
  <text x="190" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333">- Использование синонимов</text>
  <text x="190" y="191" font-family="Arial, sans-serif" font-size="11" fill="#333">- Замена перечислений</text>
  <text x="190" y="204" font-family="Arial, sans-serif" font-size="11" fill="#333">  обобщённым понятием</text>
  
  <!-- Приём 3: Замена -->
  <rect x="330" y="130" width="140" height="80" fill="url(#grad1)" rx="5" opacity="0.2"/>
  <rect x="330" y="130" width="140" height="25" fill="url(#grad1)" rx="5"/>
  <text x="400" y="147" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3. Замена</text>
  <text x="340" y="165" font-family="Arial, sans-serif" font-size="11" fill="#333">- Использование односоставных</text>
  <text x="340" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333">  предложений</text>
  <text x="340" y="191" font-family="Arial, sans-serif" font-size="11" fill="#333">- Замена придаточных</text>
  <text x="340" y="204" font-family="Arial, sans-serif" font-size="11" fill="#333">  деепричастными оборотами</text>
  
  <!-- Раздел 2: Структура работы -->
  <text x="30" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Структура работы:</text>
  
  <!-- Схема структуры -->
  <rect x="30" y="245" width="440" height="80" fill="none" stroke="url(#grad2)" stroke-width="2" rx="5"/>
  
  <!-- Этапы работы -->
  <rect x="40" y="255" width="100" height="60" fill="url(#grad3)" rx="3" opacity="0.3"/>
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Чтение</text>
  <text x="90" y="285" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">и анализ</text>
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">текста</text>
  
  <rect x="170" y="255" width="100" height="60" fill="url(#grad4)" rx="3" opacity="0.3"/>
  <text x="220" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Выбор</text>
  <text x="220" y="285" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">основного</text>
  <text x="220" y="300" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">содержания</text>
  
  <rect x="300" y="255" width="100" height="60" fill="url(#grad5)" rx="3" opacity="0.3"/>
  <text x="350" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Сжатие</text>
  <text x="350" y="285" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">с использованием</text>
  <text x="350" y="300" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">приёмов</text>
  
  <!-- Стрелки -->
  <path d="M 140 285 L 170 285" stroke="url(#grad2)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 270 285 L 300 285" stroke="url(#grad2)" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Раздел 3: Критерии оценивания -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Критерии: полнота, логика, стиль, грамотность</text>
  
  <!-- Декоративные элементы -->
  <circle cx="470" cy="40" r="15" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="460" cy="50" r="8" fill="url(#grad2)" opacity="0.3"/>
  <circle cx="480" cy="50" r="10" fill="url(#grad3)" opacity="0.3"/>
  
  <!-- Примеры сжатия -->
  <rect x="30" y="60" width="440" height="60" fill="url(#grad1)" rx="5" opacity="0.1"/>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Пример сжатия:</text>
  <text x="40" y="90" font-family="Arial, sans-serif" font-size="10" fill="#333">Исходник: "Мальчик, который сидел у окна, задумчиво смотрел на падающие листья."</text>
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="10" fill="#333">Сжатие: "Мальчик у окна смотрел на падающие листья." (исключение второстепенных членов)</text>
  
  <!-- Указатель -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#grad2)"/>
    </marker>
  </defs>
</svg>