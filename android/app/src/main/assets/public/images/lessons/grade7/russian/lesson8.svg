<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="30" fill="#3b82f6" opacity="0.1"/>
  <circle cx="50" cy="300" r="40" fill="#10b981" opacity="0.1"/>
  <rect x="420" y="250" width="60" height="60" fill="#8b5cf6" opacity="0.1" transform="rotate(45 450 280)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">РУССКИЙ ЯЗЫК · 7 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <rect x="50" y="60" width="400" height="50" rx="10" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Урок 8. Причастие</text>
  
  <!-- Блок 1: Определение -->
  <rect x="50" y="130" width="200" height="80" rx="8" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Определение:</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="12" fill="#475569">Причастие — это особая форма</text>
  <text x="60" y="188" font-family="Arial, sans-serif" font-size="12" fill="#475569">глагола, которая обозначает</text>
  <text x="60" y="206" font-family="Arial, sans-serif" font-size="12" fill="#475569">признак предмета.</text>
  
  <!-- Блок 2: Признаки глагола -->
  <rect x="270" y="130" width="180" height="80" rx="8" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="280" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Признаки глагола:</text>
  <text x="280" y="170" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Образуется от глагола</text>
  <text x="280" y="188" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Изменяется по временам</text>
  <text x="280" y="206" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Отвечает на вопросы</text>
  
  <!-- Блок 3: Признаки прилагательного -->
  <rect x="50" y="230" width="200" height="80" rx="8" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Признаки прилагательного:</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Указывает на признак</text>
  <text x="60" y="288" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Изменяется по родам, числам,</text>
  <text x="60" y="306" font-family="Arial, sans-serif" font-size="12" fill="#475569">• падежам</text>
  
  <!-- Блок 4: Вопросы -->
  <rect x="270" y="230" width="180" height="80" rx="8" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Вопросы:</text>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="12" fill="#475569">Какой? Какая? Какое?</text>
  <text x="280" y="288" font-family="Arial, sans-serif" font-size="12" fill="#475569">Какие? Который?</text>
  <text x="280" y="306" font-family="Arial, sans-serif" font-size="12" fill="#475569">Каков? Какова?</text>
  
  <!-- Примеры -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#64748b">Примеры: читающий ученик, интересные книги, открытый окно</text>
  
  <!-- Иконки -->
  <circle cx="30" cy="170" r="12" fill="url(#highlightGrad)"/>
  <text x="30" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Г</text>
  
  <circle cx="430" cy="170" r="12" fill="url(#highlightGrad)"/>
  <text x="430" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">П</text>
  
  <circle cx="30" cy="270" r="12" fill="url(#highlightGrad)"/>
  <text x="30" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ПР</text>
  
  <circle cx="430" cy="270" r="12" fill="url(#highlightGrad)"/>
  <text x="430" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">В</text>
  
  <!-- Разделители -->
  <line x1="40" y1="120" x2="460" y2="120" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="220" x2="460" y2="220" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="130" x2="250" y2="310" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Декоративные элементы в углах -->
  <path d="M 10 10 L 30 10 L 10 30 Z" fill="#3b82f6" opacity="0.3"/>
  <path d="M 490 10 L 470 10 L 490 30 Z" fill="#10b981" opacity="0.3"/>
  <path d="M 10 340 L 30 340 L 10 320 Z" fill="#8b5cf6" opacity="0.3"/>
  <path d="M 490 340 L 470 340 L 490 320 Z" fill="#f59e0b" opacity="0.3"/>
</svg>