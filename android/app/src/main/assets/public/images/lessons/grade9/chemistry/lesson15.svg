<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="whitePhosphorus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redPhosphorus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="acidGradient">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.9" />
    </radialGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#475569" stroke-width="2" rx="5" ry="5" />
  <rect x="15" y="15" width="470" height="320" fill="none" stroke="#94a3b8" stroke-width="1" rx="3" ry="3" />
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Фосфор и его соединения</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">ХИМИЯ · 9 КЛАСС</text>
  <text x="470" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Урок 15</text>
  
  <!-- Белый фосфор -->
  <circle cx="100" cy="120" r="25" fill="url(#whitePhosphorus)" filter="url(#shadow)" />
  <circle cx="95" cy="115" r="3" fill="#e2e8f0" opacity="0.7" />
  <circle cx="105" cy="125" r="2" fill="#e2e8f0" opacity="0.7" />
  <circle cx="100" cy="120" r="4" fill="#cbd5e1" opacity="0.5" />
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Белый фосфор</text>
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">P₄</text>
  
  <!-- Красный фосфор -->
  <polygon points="200,95 225,105 225,135 200,145 175,135 175,105" fill="url(#redPhosphorus)" filter="url(#shadow)" />
  <polygon points="195,105 205,110 205,120 195,125 185,120 185,110" fill="#dc2626" opacity="0.7" />
  <polygon points="210,115 220,120 220,130 210,135 200,130 200,120" fill="#b91c1c" opacity="0.5" />
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Красный фосфор</text>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">P</text>
  
  <!-- Свойства белого фосфора -->
  <text x="50" y="210" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Свойства:</text>
  <text x="50" y="225" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Ядовит</text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Самовоспламеняется</text>
  <text x="50" y="255" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Хранится под водой</text>
  
  <!-- Свойства красного фосфора -->
  <text x="150" y="210" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Свойства:</text>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Нядовит</text>
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Нестабилен</text>
  <text x="150" y="255" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Применяется в спичках</text>
  
  <!-- Оксид фосфора (IV) -->
  <ellipse cx="320" cy="110" rx="30" ry="20" fill="#cbd5e1" opacity="0.8" />
  <circle cx="315" cy="105" r="3" fill="#94a3b8" />
  <circle cx="325" cy="115" r="2" fill="#94a3b8" />
  <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">P₄O₁₀</text>
  <text x="320" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Оксид фосфора(V)</text>
  
  <!-- Ортофосфорная кислота -->
  <rect x="270" y="190" width="100" height="50" rx="5" ry="5" fill="url(#acidGradient)" filter="url(#shadow)" />
  <text x="320" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">H₃PO₄</text>
  <text x="320" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Ортофосфорная кислота</text>
  
  <!-- Фосфаты -->
  <rect x="270" y="270" width="30" height="30" rx="3" ry="3" fill="#86efac" />
  <text x="285" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">PO₄³⁻</text>
  <text x="285" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Фосфат-ион</text>
  
  <!-- Минеральные удобрения -->
  <ellipse cx="380" cy="190" rx="35" ry="20" fill="#a7f3d0" />
  <text x="380" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">NH₄H₂PO₄</text>
  <text x="380" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Аммонийфосфат</text>
  
  <ellipse cx="430" cy="240" rx="30" ry="18" fill="#a7f3d0" />
  <text x="430" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Ca(H₂PO₄)₂</text>
  <text x="430" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Суперфосфат</text>
  
  <!-- Стрелки и связи -->
  <line x1="125" y1="120" x2="175" y2="120" stroke="#64748b" stroke-width="2" />
  <polygon points="170,115 180,120 170,125" fill="#64748b" />
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">нагревание</text>
  
  <line x1="225" y1="120" x2="270" y2="110" stroke="#64748b" stroke-width="2" />
  <polygon points="265,105 275,110 265,115" fill="#64748b" />
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">горение</text>
  
  <line x1="320" y1="130" x2="320" y2="190" stroke="#64748b" stroke-width="2" />
  <polygon points="315,185 320,195 325,185" fill="#64748b" />
  
  <!-- Применение -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Применение:</text>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Спички</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Удобрения</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Детерминанты</text>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="10" fill="#64748b">• Промышленность</text>
  
  <!-- Уравнение реакции -->
  <rect x="50" y="290" width="200" height="40" rx="3" ry="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
  <text x="150" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">4P + 5O₂ → P₄O₁₀</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="470" cy="330" r="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="460" cy="340" r="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="30" cy="330" r="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  
</svg>