<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7875;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4d4f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="moleculeGrad">
      <stop offset="0%" style="stop-color:#722ed1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#531dab;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#d9d9d9" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Электролитическая диссоциация</text>
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">ХИМИЯ · 9 КЛАСС</text>
  <text x="40" y="35" font-family="Arial, sans-serif" font-size="12" fill="#999">Урок 12</text>
  
  <!-- Контейнер воды -->
  <rect x="100" y="100" width="300" height="150" rx="10" ry="10" fill="url(#waterGrad)" opacity="0.7"/>
  <text x="250" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Вода (полярный растворитель)</text>
  
  <!-- Молекулы воды -->
  <g opacity="0.6">
    <circle cx="150" cy="130" r="8" fill="#1890ff"/>
    <circle cx="145" cy="125" r="5" fill="#fff"/>
    <circle cx="155" cy="125" r="5" fill="#fff"/>
    <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">H₂O</text>
    
    <circle cx="220" cy="140" r="8" fill="#1890ff"/>
    <circle cx="215" cy="135" r="5" fill="#fff"/>
    <circle cx="225" cy="135" r="5" fill="#fff"/>
    <text x="220" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">H₂O</text>
    
    <circle cx="300" cy="135" r="8" fill="#1890ff"/>
    <circle cx="295" cy="130" r="5" fill="#fff"/>
    <circle cx="305" cy="130" r="5" fill="#fff"/>
    <text x="300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">H₂O</text>
    
    <circle cx="180" cy="200" r="8" fill="#1890ff"/>
    <circle cx="175" cy="195" r="5" fill="#fff"/>
    <circle cx="185" cy="195" r="5" fill="#fff"/>
    <text x="180" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">H₂O</text>
    
    <circle cx="320" cy="210" r="8" fill="#1890ff"/>
    <circle cx="315" cy="205" r="5" fill="#fff"/>
    <circle cx="325" cy="205" r="5" fill="#fff"/>
    <text x="320" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">H₂O</text>
  </g>
  
  <!-- Электролит до диссоциации -->
  <g id="before-dissociation">
    <rect x="220" y="165" width="60" height="20" fill="url(#moleculeGrad)" rx="5" ry="5"/>
    <text x="250" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">NaCl</text>
    <text x="250" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">до диссоциации</text>
  </g>
  
  <!-- Стрелка процесса диссоциации -->
  <path d="M 200 175 L 150 175" stroke="#fa8c16" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 300 175 L 350 175" stroke="#fa8c16" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Ионы после диссоциации -->
  <g id="after-dissociation">
    <!-- Катион Na+ -->
    <circle cx="120" cy="175" r="15" fill="url(#cationGrad)"/>
    <text x="120" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Na⁺</text>
    <text x="120" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Катион</text>
    
    <!-- Анион Cl- -->
    <circle cx="380" cy="175" r="15" fill="url(#ionGrad)"/>
    <text x="380" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Cl⁻</text>
    <text x="380" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Анион</text>
  </g>
  
  <!-- Стрелка определение -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fa8c16"/>
    </marker>
  </defs>
  
  <!-- Схема процесса -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Процесс диссоциации</text>
  
  <!-- Основные положения -->
  <g transform="translate(30, 290)">
    <text font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan x="0" y="0" font-weight="bold">Основные положения:</tspan>
      <tspan x="0" y="15">1. Электролиты - вещества, диссоциирующие на ионы</tspan>
      <tspan x="0" y="30">2. Вода полярный растворитель</tspan>
      <tspan x="0" y="45">3. Ионы обособлены и движутся хаотично</tspan>
    </text>
  </g>
  
  <!-- Уравнение диссоциации -->
  <g transform="translate(250, 290)">
    <text font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan x="0" y="0" font-weight="bold">Уравнение диссоциации:</tspan>
      <tspan x="0" y="15">NaCl → Na⁺ + Cl⁻</tspan>
    </text>
  </g>
  
  <!-- Свойства ионов -->
  <g transform="translate(30, 120)">
    <rect x="-10" y="-10" width="60" height="60" fill="none" stroke="#d9d9d9" stroke-width="1" rx="3" ry="3"/>
    <text x="20" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Свойства</text>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Электропроводность</text>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Реакционная</text>
    <text x="20" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">способность</text>
  </g>
  
  <!-- Типы электролитов -->
  <g transform="translate(410, 120)">
    <rect x="-10" y="-10" width="70" height="60" fill="none" stroke="#d9d9d9" stroke-width="1" rx="3" ry="3"/>
    <text x="25" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Типы</text>
    <text x="25" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Сильные</text>
    <text x="25" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Слабые</text>
    <text x="25" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Нерастворимые</text>
  </g>
  
  <!-- Знак плюса на катионе -->
  <circle cx="120" cy="165" r="3" fill="#fff"/>
  
  <!-- Знак минуса на анионе -->
  <circle cx="380" cy="165" r="3" fill="#fff"/>
  <circle cx="380" cy="185" r="3" fill="#fff"/>
  <line x1="377" y1="165" x2="383" y2="165" stroke="#fff" stroke-width="1"/>
  <line x1="377" y1="185" x2="383" y2="185" stroke="#fff" stroke-width="1"/>
  
  <!-- Дополнительные молекулы воды вокруг ионов -->
  <g opacity="0.4">
    <circle cx="100" cy="160" r="6" fill="#1890ff"/>
    <circle cx="95" cy="157" r="4" fill="#fff"/>
    <circle cx="105" cy="157" r="4" fill="#fff"/>
    
    <circle cx="140" cy="160" r="6" fill="#1890ff"/>
    <circle cx="135" cy="157" r="4" fill="#fff"/>
    <circle cx="145" cy="157" r="4" fill="#fff"/>
    
    <circle cx="100" cy="190" r="6" fill="#1890ff"/>
    <circle cx="95" cy="187" r="4" fill="#fff"/>
    <circle cx="105" cy="187" r="4" fill="#fff"/>
    
    <circle cx="140" cy="190" r="6" fill="#1890ff"/>
    <circle cx="135" cy="187" r="4" fill="#fff"/>
    <circle cx="145" cy="187" r="4" fill="#fff"/>
    
    <circle cx="360" cy="160" r="6" fill="#1890ff"/>
    <circle cx="355" cy="157" r="4" fill="#fff"/>
    <circle cx="365" cy="157" r="4" fill="#fff"/>
    
    <circle cx="400" cy="160" r="6" fill="#1890ff"/>
    <circle cx="395" cy="157" r="4" fill="#fff"/>
    <circle cx="405" cy="157" r="4" fill="#fff"/>
    
    <circle cx="360" cy="190" r="6" fill="#1890ff"/>
    <circle cx="355" cy="187" r="4" fill="#fff"/>
    <circle cx="365" cy="187" r="4" fill="#fff"/>
    
    <circle cx="400" cy="190" r="6" fill="#1890ff"/>
    <circle cx="395" cy="187" r="4" fill="#fff"/>
    <circle cx="405" cy="187" r="4" fill="#fff"/>
  </g>
</svg>