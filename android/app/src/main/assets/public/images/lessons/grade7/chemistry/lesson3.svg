<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FB709;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD10E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9013FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" fill="url(#blueGrad)" rx="10"/>
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Урок 3. Простые и сложные вещества</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="110" x2="450" y2="110" stroke="#BDC3C7" stroke-width="2"/>
  
  <!-- Простые вещества -->
  <g id="simple-substances">
    <rect x="50" y="130" width="180" height="200" fill="url(#greenGrad)" rx="10" opacity="0.9"/>
    <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">ПРОСТЫЕ ВЕЩЕСТВА</text>
    
    <!-- Атом кислорода -->
    <circle cx="100" cy="190" r="25" fill="#E74C3C"/>
    <text x="100" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">O</text>
    <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Кислород</text>
    
    <!-- Атом водорода -->
    <circle cx="180" cy="190" r="20" fill="#3498DB"/>
    <text x="180" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">H</text>
    <text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Водород</text>
    
    <!-- Молекула кислорода -->
    <circle cx="100" cy="270" r="20" fill="#E74C3C"/>
    <circle cx="130" cy="270" r="20" fill="#E74C3C"/>
    <line x1="120" y1="270" x2="110" y2="270" stroke="#C0392B" stroke-width="3"/>
    <text x="115" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">O₂</text>
  </g>
  
  <!-- Сложные вещества -->
  <g id="complex-substances">
    <rect x="250" y="130" width="200" height="200" fill="url(#purpleGrad)" rx="10" opacity="0.9"/>
    <text x="350" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">СЛОЖНЫЕ ВЕЩЕСТВА</text>
    
    <!-- Молекула воды -->
    <circle cx="300" cy="190" r="18" fill="#E74C3C"/>
    <circle cx="330" cy="205" r="12" fill="#3498DB"/>
    <circle cx="330" cy="175" r="12" fill="#3498DB"/>
    <text x="340" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">H₂O</text>
    <text x="340" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Вода</text>
    
    <!-- Молекула NaCl -->
    <rect x="350" y="170" width="25" height="25" fill="#F39C12"/>
    <rect x="385" y="170" width="25" height="25" fill="#9B59B6"/>
    <text x="410" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">NaCl</text>
    <text x="410" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Соль</text>
  </g>
  
  <!-- Чистые вещества -->
  <g id="pure-substances">
    <rect x="80" y="250" width="340" height="60" fill="url(#orangeGrad)" rx="10" opacity="0.8"/>
    <text x="250" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">ЧИСТЫЕ ВЕЩЕСТВА</text>
    <text x="250" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">состоят из одного вида атомов или молекул</text>
  </g>
  
  <!-- Смеси -->
  <g id="mixtures">
    <rect x="80" y="330" width="340" height="60" fill="url(#redGrad)" rx="10" opacity="0.8"/>
    <text x="250" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">СМЕСИ</text>
    <text x="250" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">состоят из нескольких разных веществ</text>
  </g>
  
  <!-- Иконки молекул -->
  <g id="molecule-icons">
    <!-- Н2О молекула иконка -->
    <circle cx="30" cy="190" r="8" fill="#E74C3C"/>
    <circle cx="45" cy="200" r="5" fill="#3498DB"/>
    <circle cx="45" cy="180" r="5" fill="#3498DB"/>
    <line x1="35" y1="190" x2="40" y2="195" stroke="#C0392B" stroke-width="1"/>
    <line x1="35" y1="190" x2="40" y2="185" stroke="#C0392B" stroke-width="1"/>
    
    <!-- O2 молекула иконка -->
    <circle cx="470" cy="270" r="8" fill="#E74C3C"/>
    <circle cx="485" cy="270" r="8" fill="#E74C3C"/>
    <line x1="478" y1="270" x2="477" y2="270" stroke="#C0392B" stroke-width="1"/>
  </g>
  
  <!-- Декоративные элементы -->
  <g id="decorative">
    <!-- Атомные орбиты -->
    <ellipse cx="140" cy="100" rx="40" ry="15" fill="none" stroke="#3498DB" stroke-width="1" opacity="0.3" transform="rotate(-20 140 100)"/>
    <ellipse cx="360" cy="100" rx="40" ry="15" fill="none" stroke="#9B59B6" stroke-width="1" opacity="0.3" transform="rotate(20 360 100)"/>
    
    <!-- Точки электронов -->
    <circle cx="120" cy="95" r="2" fill="#3498DB" opacity="0.6"/>
    <circle cx="160" cy="105" r="2" fill="#3498DB" opacity="0.6"/>
    <circle cx="340" cy="95" r="2" fill="#9B59B6" opacity="0.6"/>
    <circle cx="380" cy="105" r="2" fill="#9B59B6" opacity="0.6"/>
  </g>
  
  <!-- Поясняющие стрелки -->
  <g id="arrows">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34495E"/>
      </marker>
    </defs>
    <line x1="230" y1="200" x2="250" y2="200" stroke="#34495E" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="150" y1="250" x2="230" y2="250" stroke="#34495E" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="270" y1="250" x2="350" y2="250" stroke="#34495E" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
</svg>