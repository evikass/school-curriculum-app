<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a5a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">ФИЗИКА · 7 КЛАСС</text>
  
  <!-- Урок 8 -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Урок 8. Сила упругости. Закон Гука</text>
  
  <!-- Стена -->
  <rect x="50" y="80" width="10" height="200" fill="#7f8c8d" filter="url(#shadow)"/>
  <line x1="60" y1="90" x2="60" y2="270" stroke="#95a5a6" stroke-width="2"/>
  
  <!-- Прямая пружина (нагрузка 0) -->
  <g transform="translate(70, 100)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#springGrad)" stroke-width="3"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">F = 0</text>
  </g>
  
  <!-- Слегде растянутая пружина -->
  <g transform="translate(70, 150)">
    <path d="M 0 0 Q 5 -5 10 0 T 20 0 T 30 0 T 40 0" stroke="url(#springGrad)" stroke-width="3" fill="none"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">F₁</text>
  </g>
  
  <!-- Растянутая пружина -->
  <g transform="translate(70, 200)">
    <path d="M 0 0 Q 5 -8 10 0 T 20 0 T 30 0 T 40 0 T 50 0 T 60 0" stroke="url(#springGrad)" stroke-width="3" fill="none"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">F₂</text>
  </g>
  
  <!-- Блок на пружине -->
  <g transform="translate(150, 190)">
    <rect x="-25" y="0" width="50" height="40" fill="url(#blockGrad)" filter="url(#shadow)"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">m</text>
    <!-- Сила тяжести -->
    <line x1="0" y1="40" x2="0" y2="70" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">P = mg</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Сила упругости -->
  <line x1="150" y1="190" x2="150" y2="160" stroke="#3498db" stroke-width="2" marker-end="url(#arrowblue)"/>
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="12" fill="#3498db">Fупр</text>
  
  <!-- Закон Гука формула -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="200" height="60" fill="white" stroke="#3498db" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Закон Гука:</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">Fупр = -k·x</text>
  </g>
  
  <!-- График зависимости F от x -->
  <g transform="translate(250, 180)">
    <rect x="0" y="0" width="200" height="120" fill="white" stroke="#3498db" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <!-- Оси -->
    <line x1="20" y1="100" x2="180" y2="100" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="100" x2="20" y2="20" stroke="#2c3e50" stroke-width="2"/>
    <!-- Стрелки осей -->
    <polygon points="180,100 175,95 175,105" fill="#2c3e50"/>
    <polygon points="20,20 15,25 25,25" fill="#2c3e50"/>
    <!-- Линия F = kx -->
    <line x1="20" y1="100" x2="160" y2="40" stroke="#3498db" stroke-width="2"/>
    <!-- Подписи -->
    <text x="185" y="105" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x</text>
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">F</text>
    <text x="85" y="75" font-family="Arial, sans-serif" font-size="12" fill="#3498db">F = kx</text>
  </g>
  
  <!-- Вес тела -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="150" height="50" fill="url(#weightGrad)" rx="5" filter="url(#shadow)"/>
    <text x="75" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">P = mg</text>
  </g>
  
  <!-- Сила упругости блок -->
  <g transform="translate(220, 280)">
    <rect x="0" y="0" width="150" height="50" fill="url(#springGrad)" rx="5" filter="url(#shadow)"/>
    <text x="75" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Fупр = k·Δl</text>
  </g>
  
  <!-- Подписи элементов -->
  <text x="120" y="135" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Состояние покоя</text>
  <text x="120" y="185" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Сила тяжести</text>
  <text x="120" y="225" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Растяжение</text>
  
  <!-- Кoefficient k -->
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">k - коэффициент упругости</text>
  <text x="50" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">[k] = Н/м</text>
  
  <!-- Пояснения -->
  <text x="250" y="135" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Сила упругости направлена</text>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">противоположно деформации</text>
  
  <!-- Баланс сил при равновесии -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="30" fill="white" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">P = Fупр</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">равновесие</text>
  </g>
  
  <!-- Деформация -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Δl - деформация</text>
  <line x1="390" y1="125" x2="410" y2="125" stroke="#3498db" stroke-width="2"/>
  <line x1="390" y1="123" x2="390" y2="127" stroke="#3498db" stroke-width="2"/>
  <line x1="410" y1="123" x2="410" y2="127" stroke="#3498db" stroke-width="2"/>
  
  <!-- Упругие свойства -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Упругость - способность тела</text>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">восстанавливать форму после</text>
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">устранения внешней силы</text>
</svg>