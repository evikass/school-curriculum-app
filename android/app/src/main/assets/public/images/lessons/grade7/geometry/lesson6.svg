<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D8B3D;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D58512;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7D3C98;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">ГЕОМЕТРИЯ · 7 КЛАСС</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495E">Урок 6. Второй и третий признаки равенства</text>
  
  <!-- Первый признак (для сравнения) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="80" fill="url(#blueGrad)" rx="5" filter="url(#shadow)"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Первый признак</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Если две стороны</text>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">и угол между ними</text>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">равны, то...</text>
  </g>
  
  <!-- Второй признак -->
  <g transform="translate(190, 80)">
    <rect x="0" y="0" width="120" height="80" fill="url(#greenGrad)" rx="5" filter="url(#shadow)"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Второй признак</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Если сторона и</text>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">два прилежащих</text>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">угла равны, то...</text>
  </g>
  
  <!-- Третий признак -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="120" height="80" fill="url(#orangeGrad)" rx="5" filter="url(#shadow)"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Третий признак</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Если три стороны</text>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">одного треугольника</text>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">равны трём сторонам</text>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="30" y1="180" x2="470" y2="180" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Второй признак с примером -->
  <g transform="translate(30, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Второй признак равенства треугольников</text>
    
    <!-- Треугольник ABC -->
    <g transform="translate(20, 20)">
      <polygon points="0,80 60,0 120,80" fill="none" stroke="#3498DB" stroke-width="3"/>
      <circle cx="0" cy="80" r="4" fill="#3498DB"/>
      <circle cx="60" cy="0" r="4" fill="#3498DB"/>
      <circle cx="120" cy="80" r="4" fill="#3498DB"/>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">A</text>
      <text x="60" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">B</text>
      <text x="120" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">C</text>
      
      <!-- Углы -->
      <path d="M 10,80 A 10,10 0 0,0 17,73" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <text x="25" y="75" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">α</text>
      
      <path d="M 110,80 A 10,10 0 0,0 103,73" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <text x="95" y="75" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">β</text>
    </g>
    
    <!-- Знак равенства -->
    <text x="180" y="70" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2C3E50">≅</text>
    
    <!-- Треугольник A₁B₁C₁ -->
    <g transform="translate(220, 20)">
      <polygon points="0,80 60,0 120,80" fill="none" stroke="#2ECC71" stroke-width="3"/>
      <circle cx="0" cy="80" r="4" fill="#2ECC71"/>
      <circle cx="60" cy="0" r="4" fill="#2ECC71"/>
      <circle cx="120" cy="80" r="4" fill="#2ECC71"/>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">A₁</text>
      <text x="60" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">B₁</text>
      <text x="120" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">C₁</text>
      
      <!-- Углы -->
      <path d="M 10,80 A 10,10 0 0,0 17,73" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <text x="25" y="75" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">α₁</text>
      
      <path d="M 110,80 A 10,10 0 0,0 103,73" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <text x="95" y="75" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">β₁</text>
    </g>
    
    <!-- Условие -->
    <text x="90" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">AB = A₁B₁, ∠A = ∠A₁, ∠B = ∠B₁</text>
  </g>
  
  <!-- Третий признак с примером -->
  <g transform="translate(30, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Третий признак равенства треугольников</text>
    
    <!-- Треугольник ABC -->
    <g transform="translate(20, 20)">
      <polygon points="0,60 50,0 100,60" fill="none" stroke="#9B59B6" stroke-width="3"/>
      <circle cx="0" cy="60" r="4" fill="#9B59B6"/>
      <circle cx="50" cy="0" r="4" fill="#9B59B6"/>
      <circle cx="100" cy="60" r="4" fill="#9B59B6"/>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">A</text>
      <text x="50" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">B</text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">C</text>
    </g>
    
    <!-- Знак равенства -->
    <text x="140" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2C3E50">≅</text>
    
    <!-- Треугольник A₁B₁C₁ -->
    <g transform="translate(180, 20)">
      <polygon points="0,60 50,0 100,60" fill="none" stroke="#E67E22" stroke-width="3"/>
      <circle cx="0" cy="60" r="4" fill="#E67E22"/>
      <circle cx="50" cy="0" r="4" fill="#E67E22"/>
      <circle cx="100" cy="60" r="4" fill="#E67E22"/>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">A₁</text>
      <text x="50" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">B₁</text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">C₁</text>
    </g>
    
    <!-- Условие -->
    <text x="110" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">AB = A₁B₁, BC = B₁C₁, AC = A₁C₁</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(400, 250)">
    <rect x="0" y="0" width="80" height="60" fill="url(#purpleGrad)" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Следствие:</text>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Треугольники</text>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">равны</text>
  </g>
</svg>