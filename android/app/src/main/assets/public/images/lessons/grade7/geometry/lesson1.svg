<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="pointGrad">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Сетка для фона -->
  <g stroke="#e5e7eb" stroke-width="0.5" opacity="0.5">
    <line x1="50" y1="0" x2="50" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    
    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGrad)">ГЕОМЕТРИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Урок 1. Начальные геометрические сведения</text>
  
  <!-- Точка А -->
  <circle cx="100" cy="120" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">А</text>
  
  <!-- Точка B -->
  <circle cx="200" cy="120" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">B</text>
  
  <!-- Прямая через точки A и B -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="50" y1="120" x2="250" y2="120" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  
  <!-- Подпись прямой -->
  <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">прямая AB</text>
  
  <!-- Точка C -->
  <circle cx="150" cy="200" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">C</text>
  
  <!-- Отрезок AB -->
  <line x1="100" y1="120" x2="200" y2="120" stroke="#ef4444" stroke-width="3"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ef4444">отрезок AB</text>
  
  <!-- Точка D -->
  <circle cx="300" cy="150" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="300" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">D</text>
  
  <!-- Точка E -->
  <circle cx="350" cy="200" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="350" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">E</text>
  
  <!-- Прямая через D и E -->
  <line x1="300" y1="150" x2="350" y2="200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="250" y1="120" x2="400" y2="230" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  
  <!-- Подпись прямой -->
  <text x="325" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6">прямая DE</text>
  
  <!-- Отрезок DE -->
  <line x1="300" y1="150" x2="350" y2="200" stroke="#10b981" stroke-width="3"/>
  <text x="325" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#10b981">отрезок DE</text>
  
  <!-- Пересечение прямых -->
  <circle cx="225" cy="160" r="4" fill="#dc2626"/>
  <text x="225" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">M</text>
  <text x="225" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">точка пересечения</text>
  
  <!-- Прямая через M -->
  <line x1="225" y1="160" x2="225" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="225" y1="100" x2="225" y2="300" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <text x="235" y="175" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b">прямая m</text>
  
  <!-- Луч AM -->
  <line x1="100" y1="120" x2="225" y2="160" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="12" fill="#06b6d4">луч AM</text>
  
  <!-- Стрелка для луча -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
  </defs>
  
  <!-- Точка F -->
  <circle cx="380" cy="100" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="380" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">F</text>
  
  <!-- Точка G -->
  <circle cx="420" cy="80" r="6" fill="url(#pointGrad)" filter="url(#shadow)"/>
  <text x="420" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">G</text>
  
  <!-- Отрезок FG -->
  <line x1="380" y1="100" x2="420" y2="80" stroke="#ec4899" stroke-width="3"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ec4899">отрезок FG</text>
  
  <!-- Дополнительные точки для демонстрации -->
  <circle cx="50" cy="250" r="5" fill="#6366f1"/>
  <text x="50" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">P</text>
  
  <circle cx="150" cy="250" r="5" fill="#6366f1"/>
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">Q</text>
  
  <circle cx="250" cy="250" r="5" fill="#6366f1"/>
  <text x="250" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">R</text>
  
  <!-- Прямая PQR -->
  <line x1="50" y1="250" x2="250" y2="250" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">прямая PQR</text>
  
  <!-- Вертикальная прямая -->
  <line x1="400" y1="50" x2="400" y2="300" stroke="#84cc16" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="410" y="175" font-family="Arial, sans-serif" font-size="12" fill="#84cc16">прямая n</text>
  
  <!-- Горизонтальная прямая -->
  <line x1="50" y1="300" x2="450" y2="300" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f97316">прямая k</text>
  
  <!-- Угол между прямыми -->
  <path d="M 400 300 L 420 280 L 400 260" stroke="#a855f7" stroke-width="2" fill="none"/>
  <text x="425" y="285" font-family="Arial, sans-serif" font-size="12" fill="#a855f7">угол</text>
  
  <!-- Легенда -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="150" height="80" fill="white" stroke="#e5e7eb" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Легенда:</text>
    <circle cx="15" cy="35" r="4" fill="url(#pointGrad)"/>
    <text x="25" y="39" font-family="Arial, sans-serif" font-size="10" fill="#374151">Точка</text>
    <line x1="10" y1="50" x2="20" y2="50" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="25" y="54" font-family="Arial, sans-serif" font-size="10" fill="#374151">Прямая</text>
    <line x1="10" y1="65" x2="20" y2="65" stroke="#ef4444" stroke-width="2"/>
    <text x="25" y="69" font-family="Arial, sans-serif" font-size="10" fill="#374151">Отрезок</text>
  </g>
  
  <!-- Номера страниц -->
  <text x="470" y="340" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">1/1</text>
  
  <!-- Дополнительные подписи для объяснения -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">начало отрезка</text>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">конец отрезка</text>
  <text x="225" y="210" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">точка лежит на прямой</text>
  <text x="320" y="250" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">прямые пересекаются</text>
</svg>