<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#50c878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3cb371;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9ca24;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    РУССКИЙ ЯЗЫК · 7 КЛАСС
  </text>
  
  <!-- Урок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 3. Состав слова и словообразование
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    Тема: Морфемика
  </text>
  
  <!-- Основная схема слова -->
  <g transform="translate(50, 100)">
    <!-- Основа слова -->
    <rect x="0" y="0" width="120" height="40" fill="url(#grad1)" rx="5"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ОСНОВА СЛОВА
    </text>
    
    <!-- Приставка -->
    <rect x="130" y="0" width="60" height="40" fill="url(#grad2)" rx="5"/>
    <text x="160" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ПРИВ.
    </text>
    
    <!-- Суффикс -->
    <rect x="200" y="0" width="60" height="40" fill="url(#grad3)" rx="5"/>
    <text x="230" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      СУФФ.
    </text>
    
    <!-- Окончание -->
    <rect x="270" y="0" width="60" height="40" fill="url(#grad4)" rx="5"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ОКонч.
    </text>
  </g>
  
  <!-- Пример разбора слова -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="380" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
      ПРИ-СЛОВ-А (-а)
    </text>
  </g>
  
  <!-- Стрелки и подписи -->
  <!-- Приставка -->
  <line x1="160" y1="140" x2="160" y2="155" stroke="#50c878" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#50c878">
    при- (перед)
  </text>
  
  <!-- Основа -->
  <line x1="110" y1="140" x2="110" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="110" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a90e2">
    слов- (корень)
  </text>
  
  <!-- Суффикс -->
  <line x1="230" y1="140" x2="230" y2="155" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="230" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ff6b6b">
    -а- (суффикс)
  </text>
  
  <!-- Окончание -->
  <line x1="300" y1="140" x2="300" y2="155" stroke="#ffd93d" stroke-width="2" marker-end="url(#arrowyellow)"/>
  <text x="300" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">
    (-а) окончание
  </text>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#50c878"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#f39c12"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="380" height="30" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="5"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Морфема — наименьшая значащая часть слова
    </text>
  </g>
  
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="380" height="30" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" rx="5"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Корень — общая часть родственных слов
    </text>
  </g>
  
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="380" height="30" fill="#fdf2e9" stroke="#e67e22" stroke-width="1" rx="5"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Приставка — изменяет значение слова, добавляя оттенок
    </text>
  </g>
  
  <!-- Дополнительные примеры словообразования -->
  <g transform="translate(50, 240)">
    <text x="10" y="10" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      Примеры словообразования:
    </text>
  </g>
  
  <!-- Маленькие примеры -->
  <g transform="translate(250, 250)">
    <rect x="0" y="0" width="50" height="20" fill="#3498db" rx="3"/>
    <text x="25" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      бег
    </text>
  </g>
  
  <g transform="translate(310, 250)">
    <rect x="0" y="0" width="50" height="20" fill="#2ecc71" rx="3"/>
    <text x="25" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      прибег
    </text>
  </g>
  
  <g transform="translate(370, 250)">
    <rect x="0" y="0" width="50" height="20" fill="#e74c3c" rx="3"/>
    <text x="25" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      бегун
    </text>
  </g>
  
  <!-- Стрелки для примеров -->
  <path d="M 300 260 Q 330 270 360 260" stroke="#95a5a6" stroke-width="1" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 300 260 Q 330 280 360 280" stroke="#95a5a6" stroke-width="1" fill="none" marker-end="url(#arrowgray)"/>
  
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <polygon points="0 0, 8 4, 0 8" fill="#95a5a6"/>
  </marker>
  
  <!-- Дополнительные подписи -->
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    МОРФЕМНАЯ
  </text>
  <text x="30" y="135" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    СТРУКТУРА
  </text>
  
  <!-- Разделительная линия -->
  <line x1="30" y1="210" x2="470" y2="210" stroke="#ecf0f1" stroke-width="2"/>
  
  <!-- Значки -->
  <circle cx="440" cy="30" r="15" fill="#3498db"/>
  <text x="440" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    М
  </text>
  
  <circle cx="440" cy="60" r="15" fill="#2ecc71"/>
  <text x="440" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    П
  </text>
  
  <circle cx="440" cy="90" r="15" fill="#e74c3c"/>
  <text x="440" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    С
  </text>
  
  <circle cx="440" cy="120" r="15" fill="#f39c12"/>
  <text x="440" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    О
  </text>
  
  <!-- Подписи к значкам -->
  <text x="420" y="150" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    М-морфема
  </text>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    П-приставка
  </text>
  <text x="420" y="180" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    С-суффикс
  </text>
  <text x="420" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    О-окончание
  </text>
</svg>