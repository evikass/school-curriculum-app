<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BA68C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="#F5F5F5"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1976D2">
    ХИМИЯ · 7 КЛАСС
  </text>
  
  <!-- Основная рамка -->
  <rect x="20" y="55" width="460" height="280" fill="white" stroke="#2196F3" stroke-width="2" rx="10"/>
  
  <!-- Разделитель -->
  <line x1="250" y1="90" x2="250" y2="315" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Левая часть - Соли -->
  <g id="salts">
    <!-- Заголовок раздела -->
    <rect x="40" y="70" width="200" height="30" fill="url(#blueGrad)" rx="5"/>
    <text x="140" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      СОЛИ
    </text>
    
    <!-- Ионные соединения -->
    <circle cx="80" cy="130" r="20" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="80" y="137" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1976D2">Na⁺</text>
    
    <circle cx="120" cy="130" r="20" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
    <text x="120" y="137" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#D32F2F">Cl⁻</text>
    
    <line x1="100" y1="130" x2="100" y2="130" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
    
    <text x="80" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Катион
    </text>
    
    <text x="120" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Анион
    </text>
    
    <!-- Пример соли -->
    <rect x="40" y="195" width="200" height="80" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
    <text x="140" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      Примеры солей:
    </text>
    <text x="140" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      NaCl, CaCO₃, Al₂(SO₄)₃
    </text>
    <text x="140" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
      Кислотный остаток + металл
    </text>
  </g>
  
  <!-- Правая часть - Оксиды -->
  <g id="oxides">
    <!-- Заголовок раздела -->
    <rect x="260" y="70" width="200" height="30" fill="url(#redGrad)" rx="5"/>
    <text x="360" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      ОКСИДЫ
    </text>
    
    <!-- Классификация оксидов -->
    <rect x="270" y="110" width="180" height="200" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="5"/>
    
    <!-- Основные оксиды -->
    <rect x="280" y="120" width="160" height="40" fill="url(#greenGrad)" rx="3"/>
    <text x="360" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Основные оксиды
    </text>
    <text x="360" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      CaO, Na₂O, MgO
    </text>
    
    <!-- Кислотные оксиды -->
    <rect x="280" y="170" width="160" height="40" fill="url(#yellowGrad)" rx="3"/>
    <text x="360" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Кислотные оксиды
    </text>
    <text x="360" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      CO₂, SO₂, P₂O₅
    </text>
    
    <!-- Амфотерные оксиды -->
    <rect x="280" y="220" width="160" height="40" fill="url(#purpleGrad)" rx="3"/>
    <text x="360" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Амфотерные оксиды
    </text>
    <text x="360" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      Al₂O₃, ZnO, PbO
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Химические связи -->
  <g id="bonds">
    <line x1="40" y1="130" x2="60" y2="130" stroke="#666" stroke-width="3"/>
    <line x1="140" y1="130" x2="160" y2="130" stroke="#666" stroke-width="3"/>
    
    <!-- Молекула оксида -->
    <circle cx="320" cy="130" r="15" fill="#FFCDD2" stroke="#F44336" stroke-width="2"/>
    <text x="320" y="137" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#D32F2F">O</text>
    
    <circle cx="360" cy="130" r="15" fill="#BBDEFB" stroke="#2196F3" stroke-width="2"/>
    <text x="360" y="137" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1976D2">C</text>
    
    <line x1="335" y1="130" x2="345" y2="130" stroke="#666" stroke-width="3"/>
    <line x1="330" y1="125" x2="340" y2="125" stroke="#666" stroke-width="2"/>
    <line x1="330" y1="135" x2="340" y2="135" stroke="#666" stroke-width="2"/>
    
    <text x="340" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      CO₂
    </text>
  </g>
  
  <!-- Подписи -->
  <text x="140" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    Урок 10. Соли. Оксиды. Классификация
  </text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="8" fill="#4FC3F7" opacity="0.6"/>
  <circle cx="470" cy="30" r="8" fill="#FF7043" opacity="0.6"/>
  <circle cx="30" cy="320" r="8" fill="#81C784" opacity="0.6"/>
  <circle cx="470" cy="320" r="8" fill="#FFD54F" opacity="0.6"/>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <line x1="180" y1="150" x2="260" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Вспомогательные подписи -->
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Реакция
  </text>
</svg>