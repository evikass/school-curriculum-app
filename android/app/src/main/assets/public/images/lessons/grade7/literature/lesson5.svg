<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e4ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0826d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративный узор -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="30" fill="#8e44ad" />
    <circle cx="450" cy="50" r="25" fill="#8e44ad" />
    <circle cx="50" cy="300" r="20" fill="#8e44ad" />
    <circle cx="450" cy="300" r="35" fill="#8e44ad" />
  </g>
  
  <!-- Книга -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="120" height="80" fill="url(#bookGrad)" rx="5" />
    <rect x="5" y="5" width="110" height="70" fill="#fff" opacity="0.9" />
    <line x1="10" y1="15" x2="110" y2="15" stroke="#8e44ad" stroke-width="1" />
    <line x1="10" y1="25" x2="100" y2="25" stroke="#8e44ad" stroke-width="1" />
    <line x1="10" y1="35" x2="105" y2="35" stroke="#8e44ad" stroke-width="1" />
    <line x1="10" y1="45" x2="95" y2="45" stroke="#8e44ad" stroke-width="1" />
    <text x="60" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad">Стихи</text>
  </g>
  
  <!-- Ручка -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="80" height="6" fill="url(#penGrad)" rx="3" />
    <circle cx="75" cy="3" r="5" fill="#e74c3c" />
    <line x1="5" y1="3" x2="70" y2="3" stroke="#ecf0f1" stroke-width="1" />
  </g>
  
  <!-- Основной заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">ЛИТЕРАТУРА · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8e44ad">Урок 5. Державин</text>
  
  <!-- Тема урока -->
  <rect x="150" y="85" width="200" height="25" fill="url(#textGrad)" rx="15" />
  <text x="250" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Тема: Лирика</text>
  
  <!-- Вертикальная линия разделения -->
  <line x1="50" y1="120" x2="50" y2="280" stroke="#8e44ad" stroke-width="2" opacity="0.3" />
  
  <!-- Список тем -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">1. Жизнь и творчество</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">2. Особенности лирики</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">3. Философская глубина</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">4. Канцеляризмы</text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">5. Анализ стихотворений</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">6. Наследие Державина</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.2">
    <path d="M 250 130 L 270 150 L 250 170 L 230 150 Z" fill="#8e44ad" />
    <path d="M 250 180 L 270 200 L 250 220 L 230 200 Z" fill="#8e44ad" />
    <path d="M 250 230 L 270 250 L 250 270 L 230 250 Z" fill="#8e44ad" />
  </g>
  
  <!-- Портрет Державина (упрощенный) -->
  <g transform="translate(350, 130)">
    <circle cx="30" cy="30" r="25" fill="#f4d1ae" />
    <circle cx="30" cy="30" r="20" fill="none" stroke="#8e44ad" stroke-width="2" />
    <circle cx="25" cy="25" r="2" fill="#2c3e50" />
    <circle cx="35" cy="25" r="2" fill="#2c3e50" />
    <path d="M 25 35 Q 30 40 35 35" fill="none" stroke="#2c3e50" stroke-width="1.5" />
    <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Г.Р. Державин</text>
    <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad">1743-1816</text>
  </g>
  
  <!-- Стихотворение (отрывок) -->
  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="180" height="120" fill="#fff" opacity="0.8" rx="5" />
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan x="10" dy="0">«Бог... Творец! Бог творит все,</tspan>
      <tspan x="10" dy="15">И на то воля Его, коли хочет;</tspan>
      <tspan x="10" dy="15">Зачем жаловаться? Он знает,</tspan>
      <tspan x="10" dy="15">Как и чем помочь нам»</tspan>
    </text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" font-style="italic">из «Слуга»</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="380" height="2" fill="#8e44ad" opacity="0.3" />
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#8e44ad">Ключевые слова: философия, ода, эпитет, метафора</text>
  </g>
  
  <!-- Нумерованные пункты -->
  <g transform="translate(60, 290)">
    <circle cx="10" cy="10" r="8" fill="#8e44ad" />
    <text x="10" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">1</text>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Задание: Анализировать лирическое произведение</text>
  </g>
  
  <!-- Декоративные точки -->
  <g opacity="0.3">
    <circle cx="420" cy="130" r="3" fill="#8e44ad" />
    <circle cx="420" cy="150" r="3" fill="#8e44ad" />
    <circle cx="420" cy="170" r="3" fill="#8e44ad" />
    <circle cx="420" cy="190" r="3" fill="#8e44ad" />
    <circle cx="420" cy="210" r="3" fill="#8e44ad" />
  </g>
  
  <!-- Перо для письма -->
  <g transform="translate(410, 240)">
    <path d="M 0 0 L 5 -20 L 10 0 Z" fill="url(#penGrad)" />
    <rect x="2" y="0" width="6" height="15" fill="#8e44ad" />
    <text x="5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8e44ad">Творчество</text>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad" opacity="0.7">Серебряный век русской поэзии</text>
  
  <!-- Декоративные линии -->
  <g opacity="0.2">
    <line x1="150" y1="120" x2="250" y2="120" stroke="#8e44ad" stroke-width="1" />
    <line x1="250" y1="120" x2="350" y2="120" stroke="#8e44ad" stroke-width="1" />
  </g>
  
  <!-- Надпись-маркер -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="40" height="20" fill="#e74c3c" rx="10" />
    <text x="20" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">5</text>
  </g>
</svg>