<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9e7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fdeaa7;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="url(#goldGradient)" opacity="0.8" />
  <circle cx="450" cy="50" r="3" fill="url(#goldGradient)" opacity="0.8" />
  <circle cx="50" cy="300" r="3" fill="url(#goldGradient)" opacity="0.8" />
  <circle cx="450" cy="300" r="3" fill="url(#goldGradient)" opacity="0.8" />
  
  <!-- Бумажный свиток -->
  <path d="M 100 80 Q 100 70 110 70 L 380 70 Q 390 70 390 80 L 390 270 Q 390 280 380 280 L 110 280 Q 100 280 100 270 Z" 
        fill="url(#paperGradient)" stroke="#d4ac0d" stroke-width="2" opacity="0.9" />
  
  <!-- Линии текста -->
  <line x1="120" y1="100" x2="370" y2="100" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="120" x2="370" y2="120" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="140" x2="370" y2="140" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="160" x2="370" y2="160" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="180" x2="370" y2="180" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="200" x2="370" y2="200" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="220" x2="370" y2="220" stroke="#34495e" stroke-width="1" opacity="0.3" />
  <line x1="120" y1="240" x2="370" y2="240" stroke="#34495e" stroke-width="1" opacity="0.3" />
  
  <!-- Текст урока -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)">ЛИТЕРАТУРА · 7 КЛАСС</text>
  
  <text x="120" y="100" font-family="Georgia, serif" font-size="14" fill="#2c3e50">
    <tspan x="120" dy="0">Урок 4. Ломоносов</tspan>
  </text>
  
  <text x="120" y="120" font-family="Georgia, serif" font-size="13" fill="#2c3e50">
    <tspan x="120" dy="0">Тема: Ода</tspan>
  </text>
  
  <text x="120" y="140" font-family="Georgia, serif" font-size="12" fill="#2c3e50">
    <tspan x="120" dy="0">Михаил Васильевич Ломоносов</tspan>
  </text>
  
  <text x="120" y="160" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    <tspan x="120" dy="0">1711–1765</tspan>
  </text>
  
  <text x="120" y="180" font-family="Georgia, serif" font-size="12" fill="#2c3e50">
    <tspan x="120" dy="0">"Величественный труд"</tspan>
  </text>
  
  <text x="120" y="200" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    <tspan x="120" dy="0">Гимнический жанр</tspan>
  </text>
  
  <text x="120" y="220" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    <tspan x="120" dy="0">Патриотическая ода</tspan>
  </text>
  
  <text x="120" y="240" font-family="Georgia, serif" font-size="11" fill="#2c3e50">
    <tspan x="120" dy="0">"На день восшествия"</tspan>
  </text>
  
  <!-- Портрет Ломоносова -->
  <circle cx="280" cy="140" r="25" fill="none" stroke="#d4ac0d" stroke-width="2" opacity="0.7" />
  <path d="M 280 130 Q 270 135 270 145 Q 270 155 280 160 Q 290 155 290 145 Q 290 135 280 130" 
        fill="#34495e" stroke="#d4ac0d" stroke-width="1" opacity="0.8" />
  <circle cx="275" cy="140" r="2" fill="#d4ac0d" />
  <circle cx="285" cy="140" r="2" fill="#d4ac0d" />
  
  <!-- Украшения -->
  <path d="M 120 90 L 125 85 L 130 90" fill="none" stroke="#d4ac0d" stroke-width="1.5" opacity="0.8" />
  <path d="M 370 90 L 375 85 L 380 90" fill="none" stroke="#d4ac0d" stroke-width="1.5" opacity="0.8" />
  
  <!-- Даты -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="10" 
        text-anchor="middle" fill="#bdc3c7">1711–1765</text>
  
  <!-- Акцентные элементы -->
  <rect x="110" y="70" width="280" height="3" fill="url(#goldGradient)" opacity="0.6" />
  <rect x="110" y="277" width="280" height="3" fill="url(#goldGradient)" opacity="0.6" />
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M 100 80 L 105 75 L 110 80" fill="none" stroke="#d4ac0d" stroke-width="1" opacity="0.5" />
  <path d="M 390 80 L 395 75 L 400 80" fill="none" stroke="#d4ac0d" stroke-width="1" opacity="0.5" />
  <path d="M 100 270 L 105 275 L 110 270" fill="none" stroke="#d4ac0d" stroke-width="1" opacity="0.5" />
  <path d="M 390 270 L 395 275 L 400 270" fill="none" stroke="#d4ac0d" stroke-width="1" opacity="0.5" />
  
  <!-- Ключевые слова -->
  <text x="130" y="255" font-family="Georgia, serif" font-size="10" fill="#e67e22">
    <tspan x="130" dy="0">Величие</tspan>
  </text>
  <text x="200" y="255" font-family="Georgia, serif" font-size="10" fill="#e67e22">
    <tspan x="200" dy="0">Слава</tspan>
  </text>
  <text x="250" y="255" font-family="Georgia, serif" font-size="10" fill="#e67e22">
    <tspan x="250" dy="0">Патриотизм</tspan>
  </text>
  <text x="320" y="255" font-family="Georgia, serif" font-size="10" fill="#e67e22">
    <tspan x="320" dy="0">Мощь</tspan>
  </text>
  
  <!-- Номер урока -->
  <circle cx="130" cy="85" r="12" fill="url(#goldGradient)" opacity="0.8" />
  <text x="130" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="#fff">4</text>
</svg>