<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#696969;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9A9A9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Небо -->
  <rect width="500" height="200" fill="url(#skyGrad)"/>
  
  <!-- Солнце -->
  <circle cx="450" cy="50" r="25" fill="#FFD700" opacity="0.8"/>
  
  <!-- Облака -->
  <g id="cloud1">
    <ellipse cx="100" cy="60" rx="25" ry="15" fill="white" opacity="0.7"/>
    <ellipse cx="115" cy="55" rx="20" ry="18" fill="white" opacity="0.7"/>
    <ellipse cx="130" cy="60" rx="22" ry="14" fill="white" opacity="0.7"/>
  </g>
  
  <g id="cloud2">
    <ellipse cx="250" cy="80" rx="20" ry="12" fill="white" opacity="0.6"/>
    <ellipse cx="265" cy="75" rx="18" ry="15" fill="white" opacity="0.6"/>
    <ellipse cx="280" cy="80" rx="20" ry="12" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Земля -->
  <rect y="200" width="500" height="150" fill="url(#groundGrad)"/>
  
  <!-- Пещера -->
  <path d="M 20 200 Q 50 150 80 200 L 80 350 L 20 350 Z" fill="url(#caveGrad)"/>
  <path d="M 25 200 Q 50 160 75 200" fill="none" stroke="#4A4A4A" stroke-width="2"/>
  
  <!-- Огонь в пещере -->
  <ellipse cx="50" cy="220" rx="15" ry="25" fill="url(#fireGrad)" opacity="0.8"/>
  <path d="M 40 220 Q 45 210 50 220 T 60 220" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <path d="M 42 225 Q 47 215 52 225 T 58 225" fill="none" stroke="#FF6347" stroke-width="2" opacity="0.6"/>
  
  <!-- Древние люди -->
  <g id="neanderthal1">
    <!-- Тело -->
    <ellipse cx="150" cy="250" rx="20" ry="35" fill="#8B4513"/>
    <!-- Голова -->
    <circle cx="150" cy="210" r="15" fill="#FDBCB4"/>
    <!-- Прическа -->
    <path d="M 135 205 Q 150 195 165 205 Q 160 200 150 200 Q 140 200 135 205" fill="#654321"/>
    <!-- Рука с дубиной -->
    <rect x="165" y="235" width="25" height="8" fill="#8B4513" transform="rotate(30 165 235)"/>
    <rect x="180" y="240" width="30" height="10" fill="#654321" transform="rotate(30 180 240)"/>
    <!-- Ноги -->
    <rect x="145" y="280" width="8" height="25" fill="#8B4513"/>
    <rect x="157" y="280" width="8" height="25" fill="#8B4513"/>
  </g>
  
  <g id="neanderthal2">
    <!-- Тело -->
    <ellipse cx="250" cy="260" rx="18" ry="30" fill="#8B4513"/>
    <!-- Голова -->
    <circle cx="250" cy="225" r="13" fill="#FDBCB4"/>
    <!-- Прическа -->
    <path d="M 237 221 Q 250 213 263 221 Q 258 217 250 217 Q 242 217 237 221" fill="#654321"/>
    <!-- Рука с костью -->
    <rect x="265" y="245" width="20" height="6" fill="#8B4513" transform="rotate(45 265 245)"/>
    <rect x="275" y="250" width="25" height="6" fill="#FAEBD7" transform="rotate(45 275 250)"/>
    <!-- Ноги -->
    <rect x="244" y="285" width="7" height="20" fill="#8B4513"/>
    <rect x="255" y="285" width="7" height="20" fill="#8B4513"/>
  </g>
  
  <g id="neanderthal3">
    <!-- Тело -->
    <ellipse cx="350" cy="255" rx="20" ry="32" fill="#8B4513"/>
    <!-- Голова -->
    <circle cx="350" cy="220" r="14" fill="#FDBCB4"/>
    <!-- Прическа -->
    <path d="M 336 216 Q 350 207 364 216 Q 359 212 350 212 Q 341 212 336 216" fill="#654321"/>
    <!-- Рука с камнем -->
    <rect x="335" y="240" width="22" height="7" fill="#8B4513" transform="rotate(-20 335 240)"/>
    <polygon points="320,245 325,235 330,245" fill="#696969"/>
    <!-- Ноги -->
    <rect x="345" y="282" width="8" height="23" fill="#8B4513"/>
    <rect x="357" y="282" width="8" height="23" fill="#8B4513"/>
  </g>
  
  <!-- Животные -->
  <g id="mammoth">
    <!-- Тело -->
    <ellipse cx="400" cy="300" rx="30" ry="20" fill="#8B7355"/>
    <!-- Ноги -->
    <rect x="380" y="315" width="5" height="15" fill="#4A4A4A"/>
    <rect x="390" y="315" width="5" height="15" fill="#4A4A4A"/>
    <rect x="405" y="315" width="5" height="15" fill="#4A4A4A"/>
    <rect x="415" y="315" width="5" height="15" fill="#4A4A4A"/>
    <!-- Хобот -->
    <path d="M 425 295 Q 435 300 430 310" fill="none" stroke="#4A4A4A" stroke-width="3"/>
    <!-- Глаза -->
    <circle cx="410" cy="290" r="2" fill="black"/>
  </g>
  
  <!-- Камни -->
  <ellipse cx="100" cy="330" rx="15" ry="10" fill="#696969"/>
  <ellipse cx="450" cy="325" rx="12" ry="8" fill="#808080"/>
  <ellipse cx="300" cy="340" rx="10" ry="6" fill="#A9A9A9"/>
  
  <!-- Растения -->
  <g id="grass1">
    <path d="M 80 320 Q 85 310 80 300" stroke="#228B22" stroke-width="2" fill="none"/>
    <path d="M 85 320 Q 90 310 85 300" stroke="#228B22" stroke-width="2" fill="none"/>
    <path d="M 90 320 Q 95 310 90 300" stroke="#228B22" stroke-width="2" fill="none"/>
  </g>
  
  <g id="grass2">
    <path d="M 420 330 Q 425 320 420 310" stroke="#228B22" stroke-width="2" fill="none"/>
    <path d="M 425 330 Q 430 320 425 310" stroke="#228B22" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2F4F4F">ИСТОРИЯ · 7 КЛАСС</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2F4F4F">Урок 2. Первобытное общество</text>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2F4F4F" font-style="italic">Тема: Древнейшие люди</text>
  
  <!-- Подписи к объектам -->
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Пещера</text>
  <text x="150" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Неандерталец</text>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Орудия труда</text>
  <text x="350" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Каменный топор</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Мамонт</text>
  
  <!-- Дополнительные элементы -->
  <!-- Следы -->
  <ellipse cx="180" cy="310" rx="8" ry="5" fill="#4A4A4A" opacity="0.5"/>
  <ellipse cx="200" cy="315" rx="8" ry="5" fill="#4A4A4A" opacity="0.5"/>
  <ellipse cx="220" cy="320" rx="8" ry="5" fill="#4A4A4A" opacity="0.5"/>
  
  <!-- Каменный осколок -->
  <polygon points="120,310 125,305 130,310 125,315" fill="#696969"/>
  
  <!-- Дополнительные подписи -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2F4F4F">600 тыс. лет назад</text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Огонь</text>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Камни</text>
  
  <!-- Угольки -->
  <circle cx="45" cy="225" r="2" fill="#FF4500"/>
  <circle cx="55" cy="230" r="1.5" fill="#FF6347"/>
  <circle cx="48" cy="235" r="2" fill="#FF4500"/>
  
  <!-- Дополнительные детали пещеры -->
  <rect x="30" y="180" width="3" height="10" fill="#4A4A4A"/>
  <rect x="60" y="175" width="3" height="15" fill="#4A4A4A"/>
</svg>