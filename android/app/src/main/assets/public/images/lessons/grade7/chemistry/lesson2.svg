<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFA500;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    ХИМИЯ · 7 КЛАСС
  </text>
  
  <!-- Атом водорода -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
    <text x="0" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495E">Водород</text>
    <text x="0" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">H</text>
  </g>
  
  <!-- Атом кислорода -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="30" fill="url(#atomGrad)" opacity="0.8"/>
    <circle cx="-10" cy="-5" r="10" fill="#FF6B6B"/>
    <circle cx="10" cy="-5" r="10" fill="#FF6B6B"/>
    <circle cx="0" cy="10" r="10" fill="#FF6B6B"/>
    <text x="0" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495E">Кислород</text>
    <text x="0" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">O</text>
  </g>
  
  <!-- Атом углерода -->
  <g transform="translate(280, 100)">
    <circle cx="0" cy="0" r="28" fill="url(#atomGrad)" opacity="0.8"/>
    <circle cx="-8" cy="-8" r="9" fill="#4ECDC4"/>
    <circle cx="8" cy="-8" r="9" fill="#4ECDC4"/>
    <circle cx="-8" cy="8" r="9" fill="#4ECDC4"/>
    <circle cx="8" cy="8" r="9" fill="#4ECDC4"/>
    <circle cx="0" cy="0" r="8" fill="#45B7B8"/>
    <text x="0" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495E">Углерод</text>
    <text x="0" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">C</text>
  </g>
  
  <!-- Молекула воды -->
  <g transform="translate(380, 100)">
    <line x1="-20" y1="0" x2="0" y2="0" stroke="#3498DB" stroke-width="3"/>
    <line x1="0" y1="0" x2="17" y2="-15" stroke="#3498DB" stroke-width="3"/>
    <circle cx="-20" cy="0" r="8" fill="#FFD700"/>
    <circle cx="0" cy="0" r="12" fill="#FF6B6B"/>
    <circle cx="17" cy="-15" r="8" fill="#FFD700"/>
    <text x="0" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495E">Вода</text>
    <text x="0" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">H₂O</text>
  </g>
  
  <!-- Молекула метана -->
  <g transform="translate(130, 200)">
    <circle cx="0" cy="0" r="15" fill="#45B7B8"/>
    <line x1="0" y1="0" x2="25" y2="-15" stroke="#3498DB" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="15" stroke="#3498DB" stroke-width="2"/>
    <line x1="0" y1="0" x2="-25" y2="0" stroke="#3498DB" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#3498DB" stroke-width="2"/>
    <circle cx="25" cy="-15" r="6" fill="#FFD700"/>
    <circle cx="25" cy="15" r="6" fill="#FFD700"/>
    <circle cx="-25" cy="0" r="6" fill="#FFD700"/>
    <circle cx="0" cy="-25" r="6" fill="#FFD700"/>
    <text x="0" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495E">Метан</text>
    <text x="0" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">CH₄</text>
  </g>
  
  <!-- Таблица элементов -->
  <g transform="translate(250, 200)">
    <rect x="-80" y="-20" width="160" height="120" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <text x="0" y="-5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">Химические элементы</text>
    
    <!-- Элементы в таблице -->
    <g transform="translate(-60, 10)">
      <rect x="0" y="0" width="25" height="25" fill="url(#blueGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">H</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Водород</text>
    </g>
    
    <g transform="translate(-60, 40)">
      <rect x="0" y="0" width="25" height="25" fill="url(#redGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">He</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Гелий</text>
    </g>
    
    <g transform="translate(-60, 70)">
      <rect x="0" y="0" width="25" height="25" fill="url(#greenGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Li</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Литий</text>
    </g>
    
    <g transform="translate(20, 10)">
      <rect x="0" y="0" width="25" height="25" fill="url(#orangeGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">C</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Углерод</text>
    </g>
    
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="25" height="25" fill="url(#purpleGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">N</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Азот</text>
    </g>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="25" height="25" fill="url(#blueGrad)" rx="3"/>
      <text x="12.5" y="17" font-family="Arial" font-size="12" text-anchor="middle" fill="white">O</text>
      <text x="35" y="17" font-family="Arial" font-size="11" fill="#34495E">Кислород</text>
    </g>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Электроны в орбитах -->
  <g transform="translate(80, 300)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#E74C3C" stroke-width="2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="45" ry="15" fill="none" stroke="#3498DB" stroke-width="2" opacity="0.5"/>
    <circle cx="30" cy="0" r="4" fill="#E74C3C"/>
    <circle cx="-30" cy="0" r="4" fill="#E74C3C"/>
    <circle cx="45" cy="0" r="4" fill="#3498DB"/>
    <text x="0" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#34495E">Электронные орбиты</text>
  </g>
  
  <!-- Связи между атомами -->
  <g transform="translate(380, 200)">
    <text x="0" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Химические связи</text>
    <line x1="-40" y1="0" x2="0" y2="0" stroke="#E74C3C" stroke-width="4"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="#3498DB" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#2ECC71" stroke-width="2"/>
    <text x="0" y="55" font-family="Arial" font-size="11" text-anchor="middle" fill="#34495E">Одинарная</text>
    <text x="0" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#34495E">Двойная</text>
    <text x="0" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#34495E">Тройная</text>
  </g>
  
  <!-- Надписи и пояснения -->
  <text x="250" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#7F8C8D">Урок 2. Атомы и молекулы. Химические элементы</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="50" r="3" fill="#3498DB" opacity="0.5"/>
  <circle cx="470" cy="50" r="3" fill="#E74C3C" opacity="0.5"/>
  <circle cx="30" cy="330" r="3" fill="#2ECC71" opacity="0.5"/>
  <circle cx="470" cy="330" r="3" fill="#F39C12" opacity="0.5"/>
  
  <!-- Красный градиент для гелия -->
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>