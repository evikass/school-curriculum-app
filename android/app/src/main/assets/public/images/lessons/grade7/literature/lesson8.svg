<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5a3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0522d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e5e5e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf0e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5deb3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый узор -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#cbd5e1" opacity="0.5"/>
  </pattern>
  <rect width="500" height="350" fill="url(#dots)"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="60" fill="url(#titleGrad)" rx="10" opacity="0.9"/>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ЛИТЕРАТУРА · 7 КЛАСС</text>
  <text x="250" y="65" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="normal">Урок 8. Лермонтов</text>
  
  <!-- Книга -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" fill="url(#bookGrad)" rx="5"/>
    <rect x="5" y="5" width="110" height="70" fill="none" stroke="#654321" stroke-width="2"/>
    <line x1="60" y1="5" x2="60" y2="75" stroke="#654321" stroke-width="1"/>
    <circle cx="30" cy="40" r="3" fill="#654321"/>
    <circle cx="90" cy="40" r="3" fill="#654321"/>
    <text x="60" y="40" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">КАЛАШНИКОВ</text>
  </g>
  
  <!-- Меч -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="8" height="60" fill="url(#swordGrad)"/>
    <rect x="-10" y="55" width="28" height="8" fill="#654321"/>
    <polygon points="4,-10 -8,0 8,0" fill="url(#swordGrad)"/>
    <polygon points="4,70 -6,65 -6,75" fill="#c0c0c0"/>
    <text x="4" y="85" text-anchor="middle" fill="#374151" font-family="Arial" font-size="12">Честь</text>
  </g>
  
  <!-- Свиток -->
  <g transform="translate(330, 100)">
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="url(#scrollGrad)" stroke="#8b7355" stroke-width="2"/>
    <path d="M -30,-40 Q -35,-20 -30,0 Q -35,20 -30,40" fill="none" stroke="#8b7355" stroke-width="2"/>
    <path d="M 30,-40 Q 35,-20 30,0 Q 35,20 30,40" fill="none" stroke="#8b7355" stroke-width="2"/>
    <line x1="-20" y1="-30" x2="20" y2="-30" stroke="#8b4513" stroke-width="1"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#8b4513" stroke-width="1"/>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#8b4513" stroke-width="1"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#8b4513" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" fill="#654321" font-family="Arial" font-size="10">Поэма</text>
  </g>
  
  <!-- Текстовые блоки -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="400" height="100" fill="white" stroke="#cbd5e1" stroke-width="2" rx="8" opacity="0.9"/>
    <text x="10" y="20" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Ключевые темы:</text>
    <text x="10" y="40" fill="#374151" font-family="Arial" font-size="12">• Честь и достоинство</text>
    <text x="10" y="55" fill="#374151" font-family="Arial" font-size="12">• Социальная несправедливость</text>
    <text x="10" y="70" fill="#374151" font-family="Arial" font-size="12">• Любовь и ревность</text>
    <text x="10" y="85" fill="#374151" font-family="Arial" font-size="12">• Борьба за справедливость</text>
  </g>
  
  <!-- Даты -->
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="90" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="45" y="20" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="11" font-weight="bold">1840 г.</text>
    <text x="45" y="35" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="10">Год создания</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="100" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="470" cy="120" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="450" cy="250" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="50" cy="250" r="3" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Перо -->
  <g transform="translate(420, 200)">
    <path d="M 0,0 L -3,20 L -1,25 L 2,25 L 4,20 Z" fill="#374151"/>
    <path d="M -3,5 Q -8,3 -10,0 Q -8,-2 -5,-1" fill="#374151"/>
    <path d="M 3,5 Q 8,3 10,0 Q 8,-2 5,-1" fill="#374151"/>
    <text x="0" y="40" text-anchor="middle" fill="#374151" font-family="Arial" font-size="10">Писатель</text>
  </g>
  
  <!-- Алфавитный указатель -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="30" height="25" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" rx="3"/>
    <text x="15" y="17" text-anchor="middle" fill="#374151" font-family="Arial" font-size="14" font-weight="bold">Л</text>
    <text x="15" y="32" text-anchor="middle" fill="#6b7280" font-family="Arial" font-size="9">Лермонтов</text>
  </g>
  
  <!-- Текстовые элементы -->
  <text x="180" y="220" fill="#6b7280" font-family="Arial" font-size="10">Главный герой</text>
  <text x="180" y="235" fill="#6b7280" font-family="Arial" font-size="10">Кузнец</text>
  <text x="180" y="250" fill="#6b7280" font-family="Arial" font-size="10">Отважный</text>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(350, 180)">
    <rect x="0" y="0" width="100" height="60" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" rx="5"/>
    <text x="50" y="20" text-anchor="middle" fill="#4b5563" font-family="Arial" font-size="11" font-weight="bold">Сюжет:</text>
    <text x="10" y="35" fill="#6b7280" font-family="Arial" font-size="9">Судебный поединок</text>
    <text x="10" y="48" fill="#6b7280" font-family="Arial" font-size="9">с купцом</text>
  </g>
  
  <!-- Виньетка -->
  <path d="M 0,350 Q 50,300 100,350" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 400,350 Q 450,300 500,350" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Метка жанра -->
  <g transform="translate(250, 110)">
    <rect x="-40" y="-30" width="80" height="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="12"/>
    <text x="0" y="-13" text-anchor="middle" fill="#15803d" font-family="Arial" font-size="11" font-weight="bold">РОМАНТИКА</text>
  </g>
  
  <!-- Имя автора -->
  <text x="250" y="330" text-anchor="middle" fill="#374151" font-family="Arial" font-size="12" font-style="italic">М. Ю. Лермонтов</text>
  
  <!-- Декоративные линии -->
  <line x1="30" y1="95" x2="30" y2="105" stroke="#3b82f6" stroke-width="2"/>
  <line x1="470" y1="115" x2="470" y2="125" stroke="#3b82f6" stroke-width="2"/>
  <line x1="30" y1="245" x2="30" y2="255" stroke="#3b82f6" stroke-width="2"/>
  <line x1="470" y1="245" x2="470" y2="255" stroke="#3b82f6" stroke-width="2"/>
</svg>