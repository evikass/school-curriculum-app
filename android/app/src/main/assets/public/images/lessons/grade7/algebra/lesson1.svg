<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="axisGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#495057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c757d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="40" fill="url(#headerGrad)" rx="5" />
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Урок 1. Числовые выражения</text>
  
  <!-- Порядок действий блок -->
  <rect x="20" y="85" width="220" height="120" fill="white" stroke="#3498db" stroke-width="2" rx="5" />
  <text x="130" y="105" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Порядок действий</text>
  
  <!-- Стрелки порядка действий -->
  <g fill="#3498db">
    <circle cx="40" cy="125" r="8" />
    <text x="40" y="130" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
    
    <circle cx="40" cy="150" r="8" />
    <text x="40" y="155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2</text>
    
    <circle cx="40" cy="175" r="8" />
    <text x="40" y="180" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3</text>
  </g>
  
  <!-- Текст порядка действий -->
  <text x="60" y="130" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Скобки</text>
  <text x="60" y="155" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Степени</text>
  <text x="60" y="180" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">×, ÷ (слева направо)</text>
  
  <!-- Свойства блок -->
  <rect x="260" y="85" width="220" height="120" fill="white" stroke="#e74c3c" stroke-width="2" rx="5" />
  <text x="370" y="105" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Основные свойства</text>
  
  <!-- Формулы свойств -->
  <text x="275" y="130" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">a + b = b + a</text>
  <text x="275" y="150" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">a × b = b × a</text>
  <text x="275" y="170" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">(a + b) + c = a + (b + c)</text>
  <text x="275" y="190" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">(a × b) × c = a × (b × c)</text>
  
  <!-- Координатная плоскость -->
  <rect x="20" y="220" width="220" height="110" fill="white" stroke="#95a5a6" stroke-width="1" rx="5" />
  
  <!-- Ось X -->
  <line x1="30" y1="280" x2="230" y2="280" stroke="url(#axisGrad)" stroke-width="2" />
  <polygon points="230,280 225,275 225,285" fill="#495057" />
  
  <!-- Ось Y -->
  <line x1="130" y1="230" x2="130" y2="320" stroke="url(#axisGrad)" stroke-width="2" />
  <polygon points="130,230 125,235 135,235" fill="#495057" />
  
  <!-- Шкала -->
  <text x="125" y="295" text-anchor="middle" fill="#495057" font-size="10">0</text>
  <text x="180" y="295" text-anchor="middle" fill="#495057" font-size="10">2</text>
  <text x="80" y="295" text-anchor="middle" fill="#495057" font-size="10">-2</text>
  
  <!-- График функции y = x² -->
  <path d="M 50,320 Q 80,300 100,280 T 130,260 T 160,280 T 190,310" 
        stroke="url(#formulaGrad)" stroke-width="3" fill="none" />
  
  <!-- График функции y = 2x + 1 -->
  <path d="M 50,300 L 210,240" 
        stroke="#27ae60" stroke-width="2" fill="none" />
  
  <!-- Примеры числовых выражений -->
  <rect x="260" y="220" width="220" height="110" fill="white" stroke="#9b59b6" stroke-width="2" rx="5" />
  <text x="370" y="240" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Примеры выражений</text>
  
  <!-- Примеры -->
  <text x="275" y="265" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">3 + 4 × 2 = 11</text>
  <text x="275" y="285" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">(5 - 3)² + 4 = 8</text>
  <text x="275" y="305" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">12 ÷ (2 + 4) × 3 = 6</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="5" fill="#3498db" opacity="0.3" />
  <circle cx="470" cy="30" r="5" fill="#e74c3c" opacity="0.3" />
  <circle cx="30" cy="340" r="5" fill="#27ae60" opacity="0.3" />
  <circle cx="470" cy="340" r="5" fill="#f39c12" opacity="0.3" />
  
  <!-- Точки на графике -->
  <circle cx="100" cy="280" r="3" fill="#ff6b6b" />
  <circle cx="130" cy="260" r="3" fill="#ff6b6b" />
  <circle cx="160" cy="280" r="3" fill="#ff6b6b" />
  
  <!-- Подписи к графику -->
  <text x="135" y="235" fill="#495057" font-size="10">y = x²</text>
  <text x="150" y="255" fill="#27ae60" font-size="10">y = 2x + 1</text>
  
  <!-- Дополнительные элементы оформления -->
  <rect x="240" y="90" width="20" height="100" fill="#ecf0f1" opacity="0.5" />
  <rect x="20" y="210" width="220" height="5" fill="#bdc3c7" opacity="0.3" />
  <rect x="260" y="210" width="220" height="5" fill="#bdc3c7" opacity="0.3" />
</svg>