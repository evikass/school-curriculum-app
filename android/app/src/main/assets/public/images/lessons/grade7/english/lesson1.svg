<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="500" height="60" fill="#4a90e2"/>
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Lesson title -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Урок 1. Hello!</text>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">Greetings and introductions</text>
  
  <!-- Left side - Greetings -->
  <rect x="20" y="120" width="220" height="200" rx="10" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <text x="130" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Приветствия</text>
  
  <!-- Greeting bubbles -->
  <g id="greetings">
    <ellipse cx="70" cy="170" rx="40" ry="20" fill="#3498db" opacity="0.8"/>
    <text x="70" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Hello!</text>
    
    <ellipse cx="150" cy="170" rx="45" ry="20" fill="#e74c3c" opacity="0.8"/>
    <text x="150" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Hi!</text>
    
    <ellipse cx="190" cy="170" rx="50" ry="20" fill="#2ecc71" opacity="0.8"/>
    <text x="190" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Hey!</text>
    
    <ellipse cx="80" cy="210" rx="55" ry="20" fill="#f39c12" opacity="0.8"/>
    <text x="80" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Good morning!</text>
    
    <ellipse cx="170" cy="210" rx="50" ry="20" fill="#9b59b6" opacity="0.8"/>
    <text x="170" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Good afternoon!</text>
    
    <ellipse cx="130" cy="250" rx="50" ry="20" fill="#1abc9c" opacity="0.8"/>
    <text x="130" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Good evening!</text>
    
    <ellipse cx="130" cy="290" rx="45" ry="20" fill="#34495e" opacity="0.8"/>
    <text x="130" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Hi there!</text>
  </g>
  
  <!-- Right side - Introductions -->
  <rect x="260" y="120" width="220" height="200" rx="10" fill="white" stroke="#e0e0e0" stroke-width="2"/>
  <text x="370" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Представления</text>
  
  <!-- Introduction phrases -->
  <g id="introductions">
    <rect x="280" y="160" width="180" height="30" rx="15" fill="#e74c3c" opacity="0.8"/>
    <text x="370" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">My name is...</text>
    
    <rect x="280" y="200" width="180" height="30" rx="15" fill="#3498db" opacity="0.8"/>
    <text x="370" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">I'm...</text>
    
    <rect x="280" y="240" width="180" height="30" rx="15" fill="#2ecc71" opacity="0.8"/>
    <text x="370" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Nice to meet you!</text>
    
    <rect x="280" y="280" width="180" height="30" rx="15" fill="#f39c12" opacity="0.8"/>
    <text x="370" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">How are you?</text>
  </g>
  
  <!-- Characters for demonstration -->
  <g id="characters">
    <!-- Character 1 -->
    <circle cx="60" cy="70" r="20" fill="#fdbcb4"/>
    <path d="M 40 80 Q 60 75 80 80" stroke="#333" stroke-width="2" fill="none"/>
    <circle cx="50" cy="65" r="2" fill="#333"/>
    <circle cx="70" cy="65" r="2" fill="#333"/>
    <path d="M 55 75 Q 60 78 65 75" stroke="#333" stroke-width="2" fill="none"/>
    <text x="60" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Tom</text>
    
    <!-- Character 2 -->
    <circle cx="440" cy="70" r="20" fill="#fdbcb4"/>
    <path d="M 420 80 Q 440 75 460 80" stroke="#333" stroke-width="2" fill="none"/>
    <circle cx="430" cy="65" r="2" fill="#333"/>
    <circle cx="450" cy="65" r="2" fill="#333"/>
    <path d="M 435 75 Q 440 78 445 75" stroke="#333" stroke-width="2" fill="none"/>
    <text x="440" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Anna</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="5" fill="#f39c12" opacity="0.6"/>
  <circle cx="470" cy="30" r="5" fill="#e74c3c" opacity="0.6"/>
  <circle cx="30" cy="330" r="5" fill="#2ecc71" opacity="0.6"/>
  <circle cx="470" cy="330" r="5" fill="#3498db" opacity="0.6"/>
  
  <!-- Speech bubbles with examples -->
  <g id="examples">
    <!-- Example 1 -->
    <path d="M 90 55 Q 90 45 100 45 L 140 45 Q 150 45 150 55 L 150 65 Q 150 70 145 70 L 120 70 L 115 75 L 115 70 L 100 70 Q 90 70 90 65 Z" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="120" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Hello! I'm Tom.</text>
    
    <!-- Example 2 -->
    <path d="M 350 55 Q 350 45 360 45 L 400 45 Q 410 45 410 55 L 410 65 Q 410 70 405 70 L 380 70 L 375 75 L 375 70 L 360 70 Q 350 70 350 65 Z" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="380" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Hi! I'm Anna.</text>
  </g>
  
  <!-- Arrow between characters -->
  <path d="M 85 70 L 415 70" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.5"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Additional decorative lines -->
  <line x1="20" y1="115" x2="480" y2="115" stroke="#ddd" stroke-width="1"/>
  <line x1="250" y1="120" x2="250" y2="320" stroke="#ddd" stroke-width="1"/>
</svg>