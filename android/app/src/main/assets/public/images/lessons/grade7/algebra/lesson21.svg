<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" rx="5" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <rect x="10" y="70" width="220" height="30" rx="3" fill="#E8F4FD"/>
  <text x="20" y="90" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50">Урок 21. Умножение многочленов</text>
  
  <!-- Раздел -->
  <rect x="10" y="105" width="220" height="30" rx="3" fill="#FFF3E0"/>
  <text x="20" y="125" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50">Раздел: Формулы</text>
  
  <!-- Тема -->
  <rect x="10" y="140" width="220" height="30" rx="3" fill="#E8F5E9"/>
  <text x="20" y="160" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50">Тема: Умножение многочлена</text>
  
  <!-- Система координат -->
  <g transform="translate(270, 220)">
    <!-- Ось X -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#34495E" stroke-width="2"/>
    <polygon points="60,0 55,-3 55,3" fill="#34495E"/>
    
    <!-- Ось Y -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#34495E" stroke-width="2"/>
    <polygon points="0,-80 -3,-75 3,-75" fill="#34495E"/>
    
    <!-- Подписи осей -->
    <text x="65" y="5" font-family="Arial, sans-serif" font-size="14" fill="#34495E">x</text>
    <text x="5" y="-85" font-family="Arial, sans-serif" font-size="14" fill="#34495E">y</text>
    
    <!-- Деления -->
    <g stroke="#7F8C8D" stroke-width="1">
      <line x1="-50" y1="-3" x2="-50" y2="3"/>
      <line x1="-40" y1="-3" x2="-40" y2="3"/>
      <line x1="-30" y1="-3" x2="-30" y2="3"/>
      <line x1="-20" y1="-3" x2="-20" y2="3"/>
      <line x1="-10" y1="-3" x2="-10" y2="3"/>
      <line x1="10" y1="-3" x2="10" y2="3"/>
      <line x1="20" y1="-3" x2="20" y2="3"/>
      <line x1="30" y1="-3" x2="30" y2="3"/>
      <line x1="40" y1="-3" x2="40" y2="3"/>
      <line x1="50" y1="-3" x2="50" y2="3"/>
      
      <line x1="-3" y1="-70" x2="3" y2="-70"/>
      <line x1="-3" y1="-60" x2="3" y2="-60"/>
      <line x1="-3" y1="-50" x2="3" y2="-50"/>
      <line x1="-3" y1="-40" x2="3" y2="-40"/>
      <line x1="-3" y1="-30" x2="3" y2="-30"/>
      <line x1="-3" y1="-20" x2="3" y2="-20"/>
      <line x1="-3" y1="-10" x2="3" y2="-10"/>
      <line x1="-3" y1="10" x2="3" y2="10"/>
      <line x1="-3" y1="20" x2="3" y2="20"/>
      <line x1="-3" y1="30" x2="3" y2="30"/>
      <line x1="-3" y1="40" x2="3" y2="40"/>
      <line x1="-3" y1="50" x2="3" y2="50"/>
      <line x1="-3" y1="60" x2="3" y2="60"/>
      <line x1="-3" y1="70" x2="3" y2="70"/>
    </g>
    
    <!-- График функции y = x² - 4x + 3 -->
    <path d="M -50,-117 Q -30,-87 -10,-47 Q 10,-7 30,43 Q 50,103 70,173" 
          fill="none" stroke="url(#purpleGrad)" stroke-width="3"/>
    
    <!-- График функции y = 2x + 1 -->
    <path d="M -50,-99 Q -30,-59 -10,-19 Q 10,21 30,61 Q 50,101 70,141" 
          fill="none" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Формула умножения многочленов -->
  <rect x="20" y="190" width="460" height="100" rx="5" fill="white" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Заголовок формулы -->
  <rect x="30" y="200" width="150" height="25" rx="3" fill="url(#orangeGrad)"/>
  <text x="105" y="217" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Формула:</text>
  
  <!-- Основная формула -->
  <text x="40" y="250" font-family="Times New Roman, serif" font-size="18" fill="#2C3E50">
    (ax + b)(cx + d) = ac·x² + (ad + bc)·x + bd
  </text>
  
  <!-- Пример 1 -->
  <rect x="240" y="195" width="230" height="45" rx="3" fill="#F0F8FF" stroke="#4A90E2" stroke-width="1"/>
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Пример:</text>
  <text x="250" y="232" font-family="Times New Roman, serif" font-size="16" fill="#2C3E50">(2x + 3)(x - 1) =</text>
  
  <!-- Пример 2 (результат) -->
  <rect x="240" y="245" width="230" height="40" rx="3" fill="#F0FFF0" stroke="#5CB85C" stroke-width="1"/>
  <text x="250" y="270" font-family="Times New Roman, serif" font-size="16" fill="#2C3E50">2x² + x - 3</text>
  
  <!-- Подписи элементов графика -->
  <rect x="350" y="190" width="60" height="20" rx="2" fill="#E8E8E8"/>
  <text x="380" y="204" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">y = x²-4x+3</text>
  
  <rect x="350" y="215" width="60" height="20" rx="2" fill="#E8E8E8"/>
  <text x="380" y="229" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">y = 2x+1</text>
  
  <!-- Алгоритм умножения -->
  <rect x="20" y="295" width="460" height="50" rx="5" fill="#FFF9E6" stroke="#F39C12" stroke-width="1"/>
  <text x="30" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Алгоритм умножения:</text>
  <text x="30" y="335" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">1. Умножить каждый член первого многочлена на каждый член второго</text>
  <text x="30" y="348" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">2. Сложить полученные одночлены</text>
  
  <!-- Декоративные элементы -->
  <circle cx="470" cy="30" r="15" fill="url(#blueGrad)" opacity="0.3"/>
  <circle cx="45" cy="180" r="8" fill="url(#greenGrad)" opacity="0.3"/>
  <circle cx="460" cy="280" r="10" fill="url(#purpleGrad)" opacity="0.3"/>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
  
  <line x1="200" y1="250" x2="240" y2="215" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Подписи для понимания -->
  <text x="280" y="140" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">Графики функций</text>
  <text x="280" y="155" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">произведения</text>
</svg>