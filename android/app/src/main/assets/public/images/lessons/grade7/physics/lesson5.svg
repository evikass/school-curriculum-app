<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd6b20;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#805ad5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ФИЗИКА · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="20" font-weight="600">Урок 5. Скорость, путь, время</text>
  <text x="250" y="110" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="16">Тема: Расчёты</text>
  
  <!-- Формула скорости -->
  <rect x="50" y="130" width="180" height="60" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="140" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Скорость</text>
  <text x="140" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20">v = S / t</text>
  
  <!-- Формула пути -->
  <rect x="250" y="130" width="180" height="60" rx="8" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <text x="340" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Путь</text>
  <text x="340" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20">S = v · t</text>
  
  <!-- Формула времени -->
  <rect x="150" y="210" width="180" height="60" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="240" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Время</text>
  <text x="240" y="258" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20">t = S / v</text>
  
  <!-- Единицы измерения -->
  <text x="50" y="295" fill="#2d3748" font-family="Arial, sans-serif" font-size="14">Единицы измерения:</text>
  
  <!-- Скорость единицы -->
  <circle cx="70" cy="315" r="15" fill="#4299e1" opacity="0.3"/>
  <text x="70" y="320" text-anchor="middle" fill="#2b6cb0" font-family="Arial, sans-serif" font-size="12">м/с</text>
  
  <circle cx="120" cy="315" r="15" fill="#4299e1" opacity="0.3"/>
  <text x="120" y="320" text-anchor="middle" fill="#2b6cb0" font-family="Arial, sans-serif" font-size="12">км/ч</text>
  
  <!-- Путь единицы -->
  <circle cx="170" cy="315" r="15" fill="#48bb78" opacity="0.3"/>
  <text x="170" y="320" text-anchor="middle" fill="#276749" font-family="Arial, sans-serif" font-size="12">м</text>
  
  <circle cx="220" cy="315" r="15" fill="#48bb78" opacity="0.3"/>
  <text x="220" y="320" text-anchor="middle" fill="#276749" font-family="Arial, sans-serif" font-size="12">км</text>
  
  <!-- Время единицы -->
  <circle cx="270" cy="315" r="15" fill="#ed8936" opacity="0.3"/>
  <text x="270" y="320" text-anchor="middle" fill="#c05621" font-family="Arial, sans-serif" font-size="12">с</text>
  
  <circle cx="320" cy="315" r="15" fill="#ed8936" opacity="0.3"/>
  <text x="320" y="320" text-anchor="middle" fill="#c05621" font-family="Arial, sans-serif" font-size="12">мин</text>
  
  <circle cx="370" cy="315" r="15" fill="#ed8936" opacity="0.3"/>
  <text x="370" y="320" text-anchor="middle" fill="#c05621" font-family="Arial, sans-serif" font-size="12">ч</text>
  
  <!-- Стрелки связывающие формулы -->
  <path d="M 230 160 L 250 160" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 140 190 L 140 210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 330 190 L 330 210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы оформления -->
  <rect x="40" y="120" width="410" height="170" fill="none" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="5,5" rx="10"/>
  
  <!-- Пример расчёта 1 -->
  <text x="50" y="200" fill="#2d3748" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Пример:</text>
  <text x="50" y="215" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Автомобиль проехал 180 км за 3 часа</text>
  <text x="50" y="230" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Скорость: v = 180 км / 3 ч = 60 км/ч</text>
</svg>