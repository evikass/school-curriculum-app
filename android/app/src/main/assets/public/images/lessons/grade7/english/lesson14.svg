<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Lesson Title -->
  <rect x="100" y="50" width="300" height="40" rx="20" fill="#3498db" opacity="0.8"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Урок 14. Future plans</text>
  
  <!-- Grammar boxes -->
  <!-- Going to box -->
  <rect x="30" y="110" width="210" height="180" rx="10" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="135" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Going to</text>
  
  <!-- Will box -->
  <rect x="260" y="110" width="210" height="180" rx="10" fill="#fef5e7" stroke="#f39c12" stroke-width="2"/>
  <text x="365" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Will</text>
  
  <!-- Use examples for Going to -->
  <text x="50" y="160" font-family="Arial, sans-serif" font-size="12" fill="#34495e">I am going to study</text>
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="12" fill="#34495e">tomorrow.</text>
  
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="12" fill="#34495e">She is going to visit</text>
  <text x="50" y="225" font-family="Arial, sans-serif" font-size="12" fill="#34495e">her grandparents.</text>
  
  <text x="50" y="250" font-family="Arial, sans-serif" font-size="12" fill="#34495e">They are going to play</text>
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="12" fill="#34495e">football.</text>
  
  <!-- Use examples for Will -->
  <text x="280" y="160" font-family="Arial, sans-serif" font-size="12" fill="#34495e">I will help you</text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="12" fill="#34495e">tomorrow.</text>
  
  <text x="280" y="205" font-family="Arial, sans-serif" font-size="12" fill="#34495e">She will call you</text>
  <text x="280" y="225" font-family="Arial, sans-serif" font-size="12" fill="#34495e">later.</text>
  
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="12" fill="#34495e">They will arrive</text>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="12" fill="#34495e">soon.</text>
  
  <!-- Grammar rules -->
  <rect x="50" y="305" width="400" height="35" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Going to: plans and intentions • Will: predictions, promises, decisions</text>
  
  <!-- Decorative elements -->
  <!-- Clock for Going to -->
  <circle cx="65" cy="290" r="15" fill="#3498db" opacity="0.3"/>
  <line x1="65" y1="290" x2="65" y2="280" stroke="#3498db" stroke-width="2"/>
  <line x1="65" y1="290" x2="70" y2="290" stroke="#3498db" stroke-width="2"/>
  
  <!-- Cloud for Will -->
  <ellipse cx="435" cy="285" rx="20" ry="12" fill="#f39c12" opacity="0.3"/>
  <ellipse cx="420" cy="290" rx="15" ry="10" fill="#f39c12" opacity="0.3"/>
  <ellipse cx="450" cy="290" rx="15" ry="10" fill="#f39c12" opacity="0.3"/>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Arrow from Going to to Will -->
  <line x1="240" y1="200" x2="260" y2="200" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Question marks -->
  <text x="135" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#3498db" opacity="0.5">?</text>
  <text x="365" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f39c12" opacity="0.5">?</text>
  
  <!-- Small decorative circles -->
  <circle cx="20" cy="20" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="480" cy="20" r="3" fill="#f39c12" opacity="0.5"/>
  <circle cx="20" cy="330" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="480" cy="330" r="3" fill="#27ae60" opacity="0.5"/>
  
  <!-- Additional labels -->
  <text x="135" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Planned actions</text>
  <text x="365" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Future actions</text>
  
  <!-- Grammar symbols -->
  <text x="135" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">✓</text>
  <text x="365" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">✓</text>
  
  <!-- Mini illustrations -->
  <!-- Book for study -->
  <rect x="45" y="155" width="8" height="10" fill="#3498db" opacity="0.7"/>
  <rect x="47" y="157" width="4" height="6" fill="white"/>
  
  <!-- Phone for call -->
  <rect x="275" y="200" width="6" height="10" fill="#f39c12" opacity="0.7" rx="1"/>
  <rect x="277" y="202" width="2" height="6" fill="white"/>
  
  <!-- Stick figures -->
  <circle cx="70" cy="245" r="3" fill="#3498db" opacity="0.7"/>
  <line x1="70" y1="248" x2="70" y2="255" stroke="#3498db" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="250" x2="67" y2="253" stroke="#3498db" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="250" x2="73" y2="253" stroke="#3498db" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="255" x2="67" y2="258" stroke="#3498db" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="255" x2="73" y2="258" stroke="#3498db" stroke-width="1" opacity="0.7"/>
  
  <circle cx="300" cy="240" r="3" fill="#f39c12" opacity="0.7"/>
  <line x1="300" y1="243" x2="300" y2="250" stroke="#f39c12" stroke-width="1" opacity="0.7"/>
  <line x1="300" y1="245" x2="297" y2="248" stroke="#f39c12" stroke-width="1" opacity="0.7"/>
  <line x1="300" y1="245" x2="303" y2="248" stroke="#f39c12" stroke-width="1" opacity="0.7"/>
  <line x1="300" y1="250" x2="297" y2="253" stroke="#f39c12" stroke-width="1" opacity="0.7"/>
  <line x1="300" y1="250" x2="303" y2="253" stroke="#f39c12" stroke-width="1" opacity="0.7"/>
  
  <!-- Additional text elements -->
  <text x="135" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">present continuous</text>
  <text x="365" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">simple future</text>
  
  <!-- Accent elements -->
  <rect x="40" y="305" width="2" height="25" fill="#3498db" opacity="0.5"/>
  <rect x="458" y="305" width="2" height="25" fill="#f39c12" opacity="0.5"/>
</svg>