<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="monumentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4D4D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B8B8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:0.6" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Небо -->
  <rect width="500" height="350" fill="url(#skyGradient)"/>
  
  <!-- Облака -->
  <g id="clouds">
    <ellipse cx="100" cy="50" rx="40" ry="20" fill="url(#cloudGradient)"/>
    <ellipse cx="130" cy="45" rx="35" ry="25" fill="url(#cloudGradient)"/>
    <ellipse cx="400" cy="70" rx="45" ry="22" fill="url(#cloudGradient)"/>
    <ellipse cx="430" cy="65" rx="40" ry="28" fill="url(#cloudGradient)"/>
  </g>
  
  <!-- Земля -->
  <rect x="0" y="250" width="500" height="100" fill="#90EE90"/>
  
  <!-- Памятник -->
  <g id="monument" filter="url(#shadow)">
    <!-- Основание -->
    <rect x="175" y="200" width="150" height="50" fill="url(#baseGradient)"/>
    
    <!-- Центральная колонна -->
    <rect x="200" y="120" width="100" height="80" fill="url(#monumentGradient)"/>
    
    <!-- Капитель -->
    <rect x="190" y="100" width="120" height="20" fill="url(#monumentGradient)"/>
    
    <!-- Конусная вершина -->
    <polygon points="250,50 190,100 310,100" fill="url(#monumentGradient)"/>
    
    <!-- Надпись на памятнике -->
    <text x="250" y="165" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Слово</text>
    <text x="250" y="180" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">о полку</text>
  </g>
  
  <!-- Подножие с надписью -->
  <rect x="150" y="250" width="200" height="10" fill="#696969"/>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle">Памятник Игорю</text>
  
  <!-- Деревья -->
  <g id="trees">
    <!-- Дерево 1 -->
    <rect x="50" y="220" width="15" height="30" fill="#8B4513"/>
    <circle cx="57.5" cy="210" r="25" fill="#228B22"/>
    
    <!-- Дерево 2 -->
    <rect x="420" y="215" width="18" height="35" fill="#8B4513"/>
    <circle cx="429" cy="205" r="30" fill="#228B22"/>
  </g>
  
  <!-- Солнце -->
  <circle cx="450" cy="60" r="30" fill="#FFD700" opacity="0.8"/>
  
  <!-- Указатель -->
  <g id="pointer">
    <line x1="350" y1="230" x2="380" y2="260" stroke="#333" stroke-width="2"/>
    <polygon points="380,260 375,250 385,250" fill="#333"/>
    <text x="360" y="245" font-family="Arial, sans-serif" font-size="10" fill="#333">1185 г.</text>
  </g>
  
  <!-- Титульная плашка -->
  <rect x="20" y="20" width="200" height="40" fill="#4169E1" opacity="0.9" rx="5"/>
  <text x="120" y="35" font-family="Arial, sans-serif" font-size="14" fill="#FFF" text-anchor="middle">ЛИТЕРАТУРА</text>
  <text x="120" y="50" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="middle">7 КЛАСС</text>
  
  <!-- Указатель на урок -->
  <rect x="20" y="280" width="120" height="25" fill="#FF6347" opacity="0.8" rx="3"/>
  <text x="80" y="297" font-family="Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Урок 3</text>
  
  <!-- Фигурки людей -->
  <g id="people">
    <!-- Человек 1 -->
    <circle cx="300" cy="270" r="5" fill="#FFB6C1"/>
    <rect x="297" y="275" width="6" height="15" fill="#4682B4"/>
    <line x1="300" y1="290" x2="295" y2="300" stroke="#4682B4" stroke-width="2"/>
    <line x1="300" y1="290" x2="305" y2="300" stroke="#4682B4" stroke-width="2"/>
    
    <!-- Человек 2 -->
    <circle cx="320" cy="275" r="5" fill="#FFD700"/>
    <rect x="317" y="280" width="6" height="15" fill="#8B4513"/>
    <line x1="320" y1="295" x2="315" y2="305" stroke="#8B4513" stroke-width="2"/>
    <line x1="320" y1="295" x2="325" y2="305" stroke="#8B4513" stroke-width="2"/>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <g id="decorative">
    <!-- Лента -->
    <path d="M 250 70 Q 280 60, 310 70" stroke="#DC143C" stroke-width="3" fill="none"/>
    <path d="M 250 75 Q 280 65, 310 75" stroke="#DC143C" stroke-width="3" fill="none"/>
    
    <!-- Щит -->
    <ellipse cx="250" cy="85" rx="15" ry="20" fill="#8B0000" opacity="0.7"/>
    <text x="250" y="90" font-family="Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Щит</text>
  </g>
  
  <!-- Подписи к элементам -->
  <g id="labels" font-family="Arial, sans-serif" font-size="9" fill="#333">
    <text x="250" y="340" text-anchor="middle">Памятник "Слово о полку Игореве"</text>
    <text x="57" y="190" text-anchor="middle">Дуб</text>
    <text x="429" y="190" text-anchor="middle">Липа</text>
    <text x="250" y="30" text-anchor="middle">Исторический памятник</text>
    <text x="100" y="30" text-anchor="middle">Древняя Русь</text>
    <text x="380" y="290" text-anchor="middle">Годы жизни</text>
    <text x="250" y="45" text-anchor="middle">XII век</text>
    <text x="50" y="320" text-anchor="middle">Киевская Русь</text>
    <text x="350" y="320" text-anchor="middle">Половецкая степь</text>
    <text x="20" y="320" text-anchor="middle">Земли</text>
    <text x="250" y="95" text-anchor="middle">Герб</text>
    <text x="180" y="220" text-anchor="middle">Камень</text>
    <text x="320" y="220" text-anchor="middle">Бронза</text>
    <text x="250" y="285" text-anchor="middle">Посетители</text>
    <text x="400" y="100" text-anchor="middle">Небо</text>
    <text x="50" y="80" text-anchor="middle">Облака</text>
    <text x="250" y="60" text-anchor="middle">Вершина</text>
    <text x="200" y="110" text-anchor="middle">Колонна</text>
    <text x="150" y="140" text-anchor="middle">Надпись</text>
    <text x="250" y="200" text-anchor="middle">Основа</text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <g id="extra">
    <!-- Ветер -->
    <path d="M 20 150 Q 40 140, 60 150" stroke="#4682B4" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 20 155 Q 40 145, 60 155" stroke="#4682B4" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Птицы -->
    <path d="M 150 80 Q 155 75, 160 80" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M 170 90 Q 175 85, 180 90" stroke="#333" stroke-width="1.5" fill="none"/>
    
    <!-- Цветы -->
    <g id="flowers">
      <circle cx="80" cy="280" r="3" fill="#FF69B4"/>
      <circle cx="85" cy="282" r="3" fill="#FF1493"/>
      <circle cx="83" cy="277" r="3" fill="#FFB6C1"/>
      <line x1="83" y1="280" x2="83" y2="285" stroke="#228B22" stroke-width="1"/>
      
      <circle cx="380" cy="285" r="3" fill="#9370DB"/>
      <circle cx="385" cy="287" r="3" fill="#8A2BE2"/>
      <circle cx="383" cy="282" r="3" fill="#DDA0DD"/>
      <line x1="383" y1="285" x2="383" y2="290" stroke="#228B22" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Информационный блок -->
  <g id="info">
    <rect x="350" y="20" width="130" height="80" fill="#FFF" stroke="#333" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="415" y="35" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Факты</text>
    <text x="360" y="50" font-family="Arial, sans-serif" font-size="8" fill="#333">• Создано: 1185-1187 гг.</text>
    <text x="360" y="65" font-family="Arial, sans-serif" font-size="8" fill="#333">• Автор: неизвестен</text>
    <text x="360" y="80" font-family="Arial, sans-serif" font-size="8" fill="#333">• Жанр: литературный памятник</text>
    <text x="360" y="95" font-family="Arial, sans-serif" font-size="8" fill="#333">• Язык: древнерусский</text>
  </g>
</svg>