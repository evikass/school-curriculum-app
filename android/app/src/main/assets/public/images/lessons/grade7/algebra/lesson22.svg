<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FB709;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD10E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9013FE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Урок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    Урок 22. Квадрат суммы и разности
  </text>
  
  <!-- Система координат -->
  <g transform="translate(100, 250)">
    <!-- Ось X -->
    <line x1="-50" y1="0" x2="150" y2="0" stroke="#34495e" stroke-width="2"/>
    <polygon points="150,0 145,-3 145,3" fill="#34495e"/>
    
    <!-- Ось Y -->
    <line x1="0" y1="50" x2="0" y2="-150" stroke="#34495e" stroke-width="2"/>
    <polygon points="0,-150 -3,-145 3,-145" fill="#34495e"/>
    
    <!-- Подписи осей -->
    <text x="155" y="5" font-family="Arial" font-size="14" fill="#34495e">x</text>
    <text x="5" y="-155" font-family="Arial" font-size="14" fill="#34495e">y</text>
    
    <!-- Деления -->
    <g stroke="#95a5a6" stroke-width="1">
      <line x1="25" y1="-3" x2="25" y2="3"/>
      <line x1="50" y1="-3" x2="50" y2="3"/>
      <line x1="75" y1="-3" x2="75" y2="3"/>
      <line x1="100" y1="-3" x2="100" y2="3"/>
      
      <line x1="-3" y1="-25" x2="3" y2="-25"/>
      <line x1="-3" y1="-50" x2="3" y2="-50"/>
      <line x1="-3" y1="-75" x2="3" y2="-75"/>
      <line x1="-3" y1="-100" x2="3" y2="-100"/>
    </g>
  </g>
  
  <!-- Функция (x+2)² -->
  <path d="M 100,250 Q 125,200 150,150 T 200,100 T 250,75 T 300,100 T 350,150" 
        stroke="url(#blueGrad)" stroke-width="3" fill="none" filter="url(#shadow)"/>
  <text x="360" y="155" font-family="Arial" font-size="14" fill="#4A90E2">(x+2)²</text>
  
  <!-- Функция (x-2)² -->
  <path d="M 100,250 Q 125,200 150,150 T 200,200 T 250,250 T 300,300 T 350,250" 
        stroke="url(#greenGrad)" stroke-width="3" fill="none" filter="url(#shadow)"/>
  <text x="360" y="255" font-family="Arial" font-size="14" fill="#7ED321">(x-2)²</text>
  
  <!-- Основная формула -->
  <rect x="50" y="80" width="400" height="60" rx="10" fill="url(#purpleGrad)" opacity="0.1"/>
  <text x="250" y="105" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#8e44ad">
    (a ± b)² = a² ± 2ab + b²
  </text>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="#9b59b6">
    квадрат суммы (a+b)² и квадрат разности (a-b)²
  </text>
  
  <!-- Пример 1: Квадрат суммы -->
  <rect x="30" y="170" width="220" height="70" rx="5" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="140" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3498db">
    Пример 1: (x + 3)²
  </text>
  <text x="40" y="210" font-family="Arial" font-size="13" fill="#2c3e50">
    = x² + 2·x·3 + 3²
  </text>
  <text x="40" y="230" font-family="Arial" font-size="13" fill="#27ae60">
    = x² + 6x + 9
  </text>
  
  <!-- Пример 2: Квадрат разности -->
  <rect x="250" y="170" width="220" height="70" rx="5" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="360" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">
    Пример 2: (y - 4)²
  </text>
  <text x="260" y="210" font-family="Arial" font-size="13" fill="#2c3e50">
    = y² - 2·y·4 + 4²
  </text>
  <text x="260" y="230" font-family="Arial" font-size="13" fill="#27ae60">
    = y² - 8y + 16
  </text>
  
  <!-- Визуальное представление -->
  <g transform="translate(50, 300)">
    <!-- Квадрат суммы -->
    <rect x="0" y="0" width="40" height="40" fill="url(#blueGrad)" opacity="0.7"/>
    <rect x="45" y="0" width="40" height="40" fill="url(#blueGrad)" opacity="0.7"/>
    <rect x="90" y="0" width="40" height="40" fill="url(#blueGrad)" opacity="0.7"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">a²</text>
    <text x="65" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2ab</text>
    <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">b²</text>
    
    <!-- Знак плюс -->
    <text x="150" y="25" font-family="Arial" font-size="20" fill="#3498db">+</text>
    
    <!-- Квадрат разности -->
    <rect x="180" y="0" width="40" height="40" fill="url(#greenGrad)" opacity="0.7"/>
    <rect x="225" y="0" width="40" height="40" fill="url(#greenGrad)" opacity="0.7"/>
    <rect x="270" y="0" width="40" height="40" fill="url(#greenGrad)" opacity="0.7"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">a²</text>
    <text x="245" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2ab</text>
    <text x="290" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white">b²</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="80" cy="100" r="3" fill="#e74c3c"/>
  <circle cx="120" cy="120" r="3" fill="#f39c12"/>
  <circle cx="380" cy="120" r="3" fill="#9b59b6"/>
  <circle cx="420" cy="100" r="3" fill="#1abc9c"/>
  
  <!-- Стрелки указатели -->
  <g stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <path d="M 90,110 Q 100,100 110,105"/>
    <path d="M 390,110 Q 400,100 410,105"/>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Декоративные элементы -->
  <rect x="20" y="70" width="5" height="5" fill="url(#orangeGrad)"/>
  <rect x="475" y="70" width="5" height="5" fill="url(#orangeGrad)"/>
  <rect x="20" y="280" width="5" height="5" fill="url(#orangeGrad)"/>
  <rect x="475" y="280" width="5" height="5" fill="url(#orangeGrad)"/>
</svg>