<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="castleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="churchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон неба -->
  <rect width="500" height="250" fill="url(#skyGrad)"/>
  
  <!-- Солнце -->
  <circle cx="420" cy="60" r="30" fill="#FFD700" opacity="0.9"/>
  <circle cx="420" cy="60" r="25" fill="#FFA500" opacity="0.7"/>
  
  <!-- Облака -->
  <ellipse cx="100" cy="50" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="130" cy="45" rx="35" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="150" cy="50" rx="30" ry="15" fill="white" opacity="0.8"/>
  
  <ellipse cx="300" cy="80" rx="45" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="330" cy="75" rx="35" ry="20" fill="white" opacity="0.7"/>
  
  <!-- Земля -->
  <rect y="250" width="500" height="100" fill="url(#groundGrad)"/>
  
  <!-- Кремль -->
  <rect x="50" y="150" width="200" height="100" fill="url(#castleGrad)"/>
  
  <!-- Башни Кремля -->
  <rect x="60" y="140" width="20" height="60" fill="url(#castleGrad)"/>
  <rect x="100" y="130" width="20" height="70" fill="url(#castleGrad)"/>
  <rect x="140" y="135" width="20" height="65" fill="url(#castleGrad)"/>
  <rect x="180" y="125" width="20" height="75" fill="url(#castleGrad)"/>
  <rect x="220" y="140" width="20" height="60" fill="url(#castleGrad)"/>
  
  <!-- Крыши башен -->
  <polygon points="70,140 60,120 80,120" fill="url(#roofGrad)"/>
  <polygon points="110,130 100,110 120,110" fill="url(#roofGrad)"/>
  <polygon points="150,135 140,115 160,115" fill="url(#roofGrad)"/>
  <polygon points="190,125 180,105 200,105" fill="url(#roofGrad)"/>
  <polygon points="230,140 220,120 240,120" fill="url(#roofGrad)"/>
  
  <!-- Софийский собор -->
  <rect x="300" y="180" width="80" height="70" fill="url(#churchGrad)"/>
  <polygon points="300,180 340,150 380,180" fill="url(#roofGrad)"/>
  
  <!-- Купола -->
  <circle cx="340" cy="160" r="15" fill="#FFD700"/>
  <rect x="335" y="145" width="10" height="20" fill="#8B4513"/>
  <circle cx="340" cy="145" r="8" fill="#FFD700"/>
  
  <circle cx="310" cy="170" r="12" fill="#FFD700"/>
  <rect x="307" y="158" width="6" height="15" fill="#8B4513"/>
  <circle cx="310" cy="158" r="6" fill="#FFD700"/>
  
  <circle cx="370" cy="170" r="12" fill="#FFD700"/>
  <rect x="367" y="158" width="6" height="15" fill="#8B4513"/>
  <circle cx="370" cy="158" r="6" fill="#FFD700"/>
  
  <!-- Деревья -->
  <rect x="430" y="220" width="10" height="30" fill="#8B4513"/>
  <ellipse cx="435" cy="210" rx="20" ry="25" fill="#228B22"/>
  <ellipse cx="425" cy="215" rx="15" ry="20" fill="#32CD32"/>
  <ellipse cx="445" cy="215" rx="15" ry="20" fill="#32CD32"/>
  
  <!-- Река Днепр -->
  <path d="M 0,280 Q 100,275 200,270 T 400,265" stroke="#4682B4" stroke-width="20" fill="none" opacity="0.7"/>
  <path d="M 0,280 Q 100,275 200,270 T 400,265" stroke="#87CEEB" stroke-width="15" fill="none" opacity="0.5"/>
  
  <!-- Корабль -->
  <rect x="350" y="265" width="40" height="10" fill="#8B4513"/>
  <polygon points="370,265 370,245 380,250" fill="#8B0000"/>
  <line x1="370" y1="245" x2="370" y2="265" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Ярослав Мудрый (силуэт) -->
  <circle cx="420" cy="200" r="15" fill="#333"/>
  <rect x="410" y="215" width="20" height="30" fill="#333"/>
  <rect x="415" y="245" width="3" height="20" fill="#333"/>
  <rect x="422" y="245" width="3" height="20" fill="#333"/>
  
  <!-- Книги -->
  <rect x="380" y="220" width="15" height="10" fill="#8B4513" transform="rotate(-10 387.5 225)"/>
  <rect x="385" y="222" width="15" height="10" fill="#D2691E" transform="rotate(-10 392.5 227)"/>
  <rect x="390" y="224" width="15" height="10" fill="#CD853F" transform="rotate(-10 397.5 229)"/>
  
  <!-- Текст заголовка -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2F4F4F">ИСТОРИЯ · 7 КЛАСС</text>
  
  <!-- Основные подписи -->
  <text x="150" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8B4513">ЯРОСЛАВ МУДРЫЙ</text>
  
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#654321">Киевская Русь</text>
  
  <text x="340" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#654321">Софийский собор</text>
  
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">1019-1054</text>
  
  <text x="250" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#8B4513">Расцвет Руси</text>
  
  <!-- Указатели -->
  <line x1="150" y1="130" x2="150" y2="100" stroke="#8B4513" stroke-width="1"/>
  <polygon points="150,100 145,110 155,110" fill="#8B4513"/>
  
  <line x1="340" y1="260" x2="340" y2="230" stroke="#8B4513" stroke-width="1"/>
  <polygon points="340,230 335,240 345,240" fill="#8B4513"/>
  
  <!-- Даты и события -->
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">1019 - начало правления</text>
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">1036 - победа над печенегами</text>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">1051 - создание «Русской Правды»</text>
  
  <!-- Дополнительно: города -->
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="9" fill="#654321">Новгород</text>
  <text x="250" y="305" font-family="Arial, sans-serif" font-size="9" fill="#654321">Киев</text>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="9" fill="#654321">Чернигов</text>
  
  <!-- Дополнительно: достижения -->
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="9" fill="#2F4F4F">Правосудие</text>
  <text x="420" y="295" font-family="Arial, sans-serif" font-size="9" fill="#2F4F4F">Культура</text>
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="9" fill="#2F4F4F">Торговля</text>
  
  <!-- Геральдический элемент -->
  <rect x="10" y="10" width="30" height="30" fill="none" stroke="#8B4513" stroke-width="2"/>
  <text x="25" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B4513">ЯМ</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="470" cy="330" r="5" fill="#FFD700"/>
  <circle cx="480" cy="325" r="3" fill="#FFD700"/>
  <circle cx="475" cy="340" r="4" fill="#FFD700"/>
  
  <!-- Линия времени -->
  <line x1="50" y1="340" x2="450" y2="340" stroke="#8B4513" stroke-width="2"/>
  <polygon points="50,340 60,335 60,345" fill="#8B4513"/>
  <polygon points="450,340 440,335 440,345" fill="#8B4513"/>
  <text x="250" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#654321">XI век</text>
</svg>