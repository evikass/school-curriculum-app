<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="#2563eb" stroke-width="2" rx="5" ry="5" />
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#3b82f6" stroke-width="1" rx="3" ry="3" opacity="0.5" />
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="40" fill="url(#headerGradient)" rx="5" ry="5" filter="url(#shadow)" />
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Основной заголовок -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Сочинение-рассуждение 9.3</text>
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2563eb">структура и критерии ОГЭ</text>
  
  <!-- Структура сочинения -->
  <g transform="translate(50, 120)">
    <!-- Блок тезиса -->
    <rect x="0" y="0" width="130" height="80" fill="url(#boxGradient)" rx="5" ry="5" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ТЕЗИС</text>
    <text x="65" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">Главный вывод,</text>
    <text x="65" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">основная мысль</text>
    <text x="65" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Объем: 30-40 слов</text>
    
    <!-- Стрелка -->
    <path d="M 135 40 L 165 40" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Блок аргумента -->
    <rect x="170" y="0" width="130" height="80" fill="url(#boxGradient)" rx="5" ry="5" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="235" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">АРГУМЕНТ</text>
    <text x="235" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">Доказательство,</text>
    <text x="235" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">пример</text>
    <text x="235" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Объем: 80-100 слов</text>
    
    <!-- Стрелка -->
    <path d="M 305 40 L 335 40" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Блок вывода -->
    <rect x="340" y="0" width="130" height="80" fill="url(#boxGradient)" rx="5" ry="5" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
    <text x="405" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ВЫВОД</text>
    <text x="405" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">Обобщение,</text>
    <text x="405" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">подведение итогов</text>
    <text x="405" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Объем: 30-40 слов</text>
  </g>
  
  <!-- Определение -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="430" height="60" fill="#eff6ff" rx="5" ry="5" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3" />
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Определение:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">Сочинение-рассуждение 9.3 — это текст, в котором автор выражает свою точку зрения на предложенную проблему,</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">аргументируя ее примерами из литературы, истории или личного опыта.</text>
  </g>
  
  <!-- Типичные ошибки -->
  <g transform="translate(50, 290)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Типичные ошибки:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Отсутствие тезиса или неверно сформулированная проблема</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Общие, неубедительные аргументы</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Отсутствие связи между аргументами и тезисом</text>
    
    <text x="220" y="20" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Несоблюдение объема частей сочинения</text>
    <text x="220" y="35" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Отсутствие вывода или повтор тезиса</text>
    <text x="220" y="50" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">• Речевые ошибки, недочеты в оформлении</text>
  </g>
  
  <!-- Пример клише -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="430" height="80" fill="#fef3c7" rx="5" ry="5" stroke="#f59e0b" stroke-width="1" opacity="0.8" />
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Пример клише для введения тезиса:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#78350f">«Передо мной стоит важная проблема, которая заключается в...</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#78350f">«Я полностью согласен с точкой зрения автора, утверждавшего, что...</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#78350f">«В современном мире особенно остро встает вопрос о...</text>
  </g>
  
  <!-- Оформление -->
  <g transform="translate(50, 230)">
    <rect x="350" y="0" width="80" height="80" fill="none" stroke="#8b5cf6" stroke-width="1.5" rx="3" ry="3" />
    <text x="390" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6d28d9">Оформление</text>
    <text x="390" y="40" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7c3aed">Поля:</text>
    <text x="390" y="55" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7c3aed">левое - 2 см,</text>
    <text x="390" y="70" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7c3aed">правое - 1 см</text>
  </g>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>
</svg>