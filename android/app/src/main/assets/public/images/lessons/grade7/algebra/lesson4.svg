<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43a047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="functionGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06292;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Название урока -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1565c0">
    Урок 4. Свойства действий над числами
  </text>
  
  <!-- Основные свойства -->
  <g transform="translate(20, 70)">
    <!-- Коммутативность сложения -->
    <rect x="0" y="0" width="210" height="60" fill="white" stroke="#2196f3" stroke-width="2" rx="5" opacity="0.9" />
    <text x="105" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">
      Коммутативность сложения
    </text>
    <text x="105" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#formulaGrad)">
      a + b = b + a
    </text>
  </g>
  
  <!-- Коммутативность умножения -->
  <g transform="translate(240, 70)">
    <rect x="0" y="0" width="210" height="60" fill="white" stroke="#2196f3" stroke-width="2" rx="5" opacity="0.9" />
    <text x="105" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">
      Коммутативность умножения
    </text>
    <text x="105" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#formulaGrad)">
      a · b = b · a
    </text>
  </g>
  
  <!-- Ассоциативность сложения -->
  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="210" height="60" fill="white" stroke="#2196f3" stroke-width="2" rx="5" opacity="0.9" />
    <text x="105" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">
      Ассоциативность сложения
    </text>
    <text x="105" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#formulaGrad)">
      (a + b) + c = a + (b + c)
    </text>
  </g>
  
  <!-- Ассоциативность умножения -->
  <g transform="translate(240, 140)">
    <rect x="0" y="0" width="210" height="60" fill="white" stroke="#2196f3" stroke-width="2" rx="5" opacity="0.9" />
    <text x="105" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">
      Ассоциативность умножения
    </text>
    <text x="105" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#formulaGrad)">
      (a · b) · c = a · (b · c)
    </text>
  </g>
  
  <!-- Система координат -->
  <g transform="translate(20, 220)">
    <!-- Ось X -->
    <line x1="0" y1="80" x2="210" y2="80" stroke="#424242" stroke-width="2" />
    <polygon points="210,80 205,77 205,83" fill="#424242" />
    
    <!-- Ось Y -->
    <line x1="105" y1="0" x2="105" y2="80" stroke="#424242" stroke-width="2" />
    <polygon points="105,0 102,5 108,5" fill="#424242" />
    
    <!-- Метки -->
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#424242">x</text>
    <text x="215" y="85" font-family="Arial, sans-serif" font-size="10" fill="#424242">y</text>
    
    <!-- Функция y = x -->
    <path d="M 25,60 L 50,50 L 75,40 L 100,30 L 125,20 L 150,10 L 175,0" 
          stroke="url(#functionGrad)" stroke-width="3" fill="none" />
    
    <!-- Точки функции -->
    <circle cx="25" cy="60" r="3" fill="#e91e63" />
    <circle cx="50" cy="50" r="3" fill="#e91e63" />
    <circle cx="75" cy="40" r="3" fill="#e91e63" />
    <circle cx="100" cy="30" r="3" fill="#e91e63" />
    <circle cx="125" cy="20" r="3" fill="#e91e63" />
    <circle cx="150" cy="10" r="3" fill="#e91e63" />
    <circle cx="175" cy="0" r="3" fill="#e91e63" />
    
    <!-- Подпись функции -->
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d81b60">
      y = x
    </text>
  </g>
  
  <!-- Вторая система координат -->
  <g transform="translate(240, 220)">
    <!-- Ось X -->
    <line x1="0" y1="80" x2="210" y2="80" stroke="#424242" stroke-width="2" />
    <polygon points="210,80 205,77 205,83" fill="#424242" />
    
    <!-- Ось Y -->
    <line x1="105" y1="0" x2="105" y2="80" stroke="#424242" stroke-width="2" />
    <polygon points="105,0 102,5 108,5" fill="#424242" />
    
    <!-- Метки -->
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#424242">x</text>
    <text x="215" y="85" font-family="Arial, sans-serif" font-size="10" fill="#424242">y</text>
    
    <!-- Функция y = 2x -->
    <path d="M 25,70 L 50,50 L 75,30 L 100,10 L 125,-10 L 150,-30 L 175,-50" 
          stroke="url(#functionGrad)" stroke-width="3" fill="none" />
    
    <!-- Точки функции -->
    <circle cx="25" cy="70" r="3" fill="#e91e63" />
    <circle cx="50" cy="50" r="3" fill="#e91e63" />
    <circle cx="75" cy="30" r="3" fill="#e91e63" />
    <circle cx="100" cy="10" r="3" fill="#e91e63" />
    <circle cx="125" cy="10" r="3" fill="#e91e63" />
    <circle cx="150" cy="10" r="3" fill="#e91e63" />
    <circle cx="175" cy="10" r="3" fill="#e91e63" />
    
    <!-- Подпись функции -->
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d81b60">
      y = 2x
    </text>
  </g>
  
  <!-- Дистрибутивность -->
  <g transform="translate(20, 310)">
    <rect x="0" y="0" width="460" height="35" fill="white" stroke="#ff9800" stroke-width="2" rx="5" opacity="0.9" />
    <text x="230" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f57c00">
      Дистрибутивность умножения относительно сложения
    </text>
    <text x="230" y="28" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="url(#formulaGrad)">
      a · (b + c) = a · b + a · c
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Декоративные круги -->
  <circle cx="50" cy="30" r="15" fill="#2196f3" opacity="0.3" />
  <circle cx="450" cy="30" r="15" fill="#2196f3" opacity="0.3" />
  
  <!-- Стрелки -->
  <path d="M 235 100 L 265 100" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 235 170 L 265 170" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2" />
    </marker>
  </defs>
  
  <!-- Примеры чисел -->
  <g transform="translate(50, 110)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Пример: 2 + 3 = 3 + 2
    </text>
  </g>
  
  <g transform="translate(270, 110)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Пример: 4 · 5 = 5 · 4
    </text>
  </g>
  
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Пример: (2 + 3) + 4 = 2 + (3 + 4)
    </text>
  </g>
  
  <g transform="translate(270, 180)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Пример: (2 · 3) · 4 = 2 · (3 · 4)
    </text>
  </g>
  
  <!-- Уравнение на графике -->
  <g transform="translate(30, 245)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#666">
      y = x - линейная функция
    </text>
  </g>
  
  <g transform="translate(250, 245)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#666">
      y = 2x - пропорциональность
    </text>
  </g>
</svg>