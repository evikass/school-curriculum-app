<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8"/>
      <stop offset="100%" style="stop-color:#d1e7ed"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a7a9b"/>
      <stop offset="100%" style="stop-color:#1a5c7a"/>
    </linearGradient>
    <radialGradient id="nitrogenGrad">
      <stop offset="0%" style="stop-color:#6fa8dc"/>
      <stop offset="100%" style="stop-color:#3d7ca5"/>
    </radialGradient>
    <radialGradient id="cycleGrad">
      <stop offset="0%" style="stop-color:#a8d0e6"/>
      <stop offset="100%" style="stop-color:#7fb8d6"/>
    </radialGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="url(#frameGrad)" stroke-width="3" rx="10"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="1" rx="8"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a5c7a">Урок 14. Азот и его соединения</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2a7a9b">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <circle cx="40" cy="35" r="18" fill="#3d7ca5"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">14</text>
  
  <!-- Молекула азота N₂ -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="20" fill="url(#nitrogenGrad)"/>
    <circle cx="35" cy="0" r="20" fill="url(#nitrogenGrad)"/>
    <line x1="20" y1="0" x2="15" y2="0" stroke="white" stroke-width="3"/>
    <line x1="20" y1="0" x2="15" y2="0" stroke="white" stroke-width="3"/>
    <line x1="20" y1="0" x2="15" y2="0" stroke="white" stroke-width="3"/>
    <text x="17.5" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">N</text>
    <text x="17.5" y="-10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a5c7a">N₂</text>
    <text x="17.5" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2a7a9b">Азот</text>
  </g>
  
  <!-- Круговорот азота -->
  <g transform="translate(300, 120)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#cycleGrad)" stroke-width="2"/>
    <path d="M0,-60 A60,60 0 0,1 52,-30" fill="none" stroke="#3d7ca5" stroke-width="2"/>
    <polygon points="52,-30 60,-35 58,-25" fill="#3d7ca5"/>
    <circle cx="0" cy="-60" r="8" fill="#7fb8d6"/>
    <circle cx="52" cy="-30" r="8" fill="#7fb8d6"/>
    <circle cx="52" cy="30" r="8" fill="#7fb8d6"/>
    <circle cx="0" cy="60" r="8" fill="#7fb8d6"/>
    <circle cx="-52" cy="30" r="8" fill="#7fb8d6"/>
    <circle cx="-52" cy="-30" r="8" fill="#7fb8d6"/>
    <text x="0" y="-65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">N₂</text>
    <text x="60" y="-30" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">NH₃</text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">NO₃⁻</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">Organic N</text>
    <text x="-60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">NH₄⁺</text>
    <text x="-60" y="-30" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">N₂O</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a5c7a">Круговорот азота</text>
  </g>
  
  <!-- Аммиак -->
  <g transform="translate(80, 220)">
    <polygon points="0,-20 17.3,10 -17.3,10" fill="#a8d0e6" stroke="#3d7ca5" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a5c7a">NH₃</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2a7a9b">Аммиак</text>
    <line x1="0" y1="-20" x2="0" y2="-35" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="0" y1="-35" x2="15" y2="-45" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="0" y1="-35" x2="-15" y2="-45" stroke="#3d7ca5" stroke-width="2"/>
    <circle cx="0" cy="-35" r="3" fill="#3d7ca5"/>
    <circle cx="15" cy="-45" r="3" fill="#3d7ca5"/>
    <circle cx="-15" cy="-45" r="3" fill="#3d7ca5"/>
  </g>
  
  <!-- Азотная кислота -->
  <g transform="translate(200, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a5c7a">HNO₃</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2a7a9b">Азотная кислота</text>
    <line x1="-30" y1="-10" x2="-10" y2="-10" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="10" y1="-10" x2="30" y2="-10" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="30" y1="-10" x2="30" y2="-25" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="30" y1="-25" x2="25" y2="-20" stroke="#3d7ca5" stroke-width="2"/>
    <line x1="30" y1="-25" x2="35" y2="-20" stroke="#3d7ca5" stroke-width="2"/>
    <circle cx="-30" cy="-10" r="4" fill="#e74c3c"/>
    <circle cx="-10" cy="-10" r="4" fill="#e74c3c"/>
    <circle cx="10" cy="-10" r="4" fill="#3d7ca5"/>
    <circle cx="30" cy="-10" r="4" fill="#3d7ca5"/>
    <circle cx="30" cy="-25" r="4" fill="#e74c3c"/>
  </g>
  
  <!-- Оксиды азота -->
  <g transform="translate(320, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a5c7a">NO, NO₂, N₂O, N₂O₃</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2a7a9b">Оксиды азота</text>
    <rect x="-50" y="35" width="100" height="40" rx="5" fill="#a8d0e6" stroke="#3d7ca5" stroke-width="1"/>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">Загрязняющие вещества</text>
  </g>
  
  <!-- Уравнение реакции -->
  <g transform="translate(100, 290)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a5c7a">N₂ + 3H₂ → 2NH₃</text>
  </g>
  
  <!-- Уравнение реакции -->
  <g transform="translate(250, 290)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1a5c7a">4NH₃ + 5O₂ → 4NO + 6H₂O</text>
  </g>
  
  <!-- Сол аммония -->
  <g transform="translate(400, 150)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#d4e6f1" stroke="#3d7ca5" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a5c7a">NH₄Cl</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2a7a9b">Хлорид аммония</text>
  </g>
  
  <!-- Свойства азота -->
  <g transform="translate(400, 220)">
    <rect x="-40" y="-20" width="80" height="60" rx="5" fill="none" stroke="#3d7ca5" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1a5c7a">Свойства:</text>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2a7a9b">- Бесцветный газ</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2a7a9b">- Нерастворим в воде</text>
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2a7a9b">- Инертен</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(50, 320)">
    <circle cx="0" cy="0" r="5" fill="#e74c3c"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="10" fill="#1a5c7a">Кислород</text>
    <circle cx="70" cy="0" r="5" fill="#3d7ca5"/>
    <text x="80" y="4" font-family="Arial, sans-serif" font-size="10" fill="#1a5c7a">Азот</text>
    <circle cx="140" cy="0" r="5" fill="#e8f4f8"/>
    <text x="150" y="4" font-family="Arial, sans-serif" font-size="10" fill="#1a5c7a">Водород</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <ellipse cx="450" cy="50" rx="20" ry="10" fill="#a8d0e6" opacity="0.5"/>
  <ellipse cx="50" cy="280" rx="15" ry="8" fill="#a8d0e6" opacity="0.5"/>
  
  <!-- Иконка молекулы -->
  <g transform="translate(420, 90)">
    <circle cx="0" cy="0" r="8" fill="#3d7ca5"/>
    <circle cx="15" cy="0" r="8" fill="#3d7ca5"/>
    <circle cx="7.5" cy="13" r="8" fill="#e74c3c"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="white" stroke-width="2"/>
    <line x1="7.5" y1="0" x2="7.5" y2="13" stroke="white" stroke-width="2"/>
  </g>
</svg>