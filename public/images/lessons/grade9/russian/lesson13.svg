<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c4a7c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f9ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeaea;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5fff5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eaffea;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#4a6fa5" stroke-width="2" rx="5"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="40" fill="url(#headerGrad)" rx="3"/>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Основной заголовок -->
  <text x="250" y="85" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Правописание НЕ и НИ с разными частями речи</text>
  
  <!-- Блок 1: НЕ с существительными -->
  <g transform="translate(30, 100)">
    <rect width="140" height="110" fill="url(#boxGrad1)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Существительные</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Слитно:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- несчастье, небо</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- начало, окончание</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Раздельно:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- не радость, не счастье</text>
  </g>
  
  <!-- Блок 2: НЕ с прилагательными -->
  <g transform="translate(180, 100)">
    <rect width="140" height="110" fill="url(#boxGrad2)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Прилагательные</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Слитно:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- невежливый</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- неопрятный</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Раздельно:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- не интересный, не красивый</text>
  </g>
  
  <!-- Блок 3: НЕ с глаголами -->
  <g transform="translate(330, 100)">
    <rect width="140" height="110" fill="url(#boxGrad3)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Глаголы</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Слитно:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- нести, лежать</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- любить, гнать</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Раздельно:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- не приходить, не писать</text>
  </g>
  
  <!-- Блок 4: НЕ с причастиями -->
  <g transform="translate(30, 220)">
    <rect width="140" height="110" fill="url(#boxGrad1)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Причастия</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Слитно:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- неокрашенный</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- ненастный</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Раздельно:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- не написанный, не прочитанный</text>
  </g>
  
  <!-- Блок 5: НЕ с деепричастиями -->
  <g transform="translate(180, 220)">
    <rect width="140" height="110" fill="url(#boxGrad2)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Деепричастия</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Слитно:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- неся</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- идя</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Раздельно:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- не закончив, не смотря</text>
  </g>
  
  <!-- Блок 6: НИ в отрицательных конструкциях -->
  <g transform="translate(330, 220)">
    <rect width="140" height="110" fill="url(#boxGrad3)" stroke="#4a6fa5" stroke-width="1.5" rx="3" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">НИ</text>
    <text x="10" y="40" fill="#333" font-family="Arial, sans-serif" font-size="12">Отрицание:</text>
    <text x="15" y="55" fill="#333" font-family="Arial, sans-serif" font-size="11">- ни один, ни разу</text>
    <text x="15" y="68" fill="#333" font-family="Arial, sans-serif" font-size="11">- никуда, никогда</text>
    <text x="10" y="85" fill="#333" font-family="Arial, sans-serif" font-size="12">Усиление:</text>
    <text x="15" y="100" fill="#333" font-family="Arial, sans-serif" font-size="11">- ни капли, ни на шаг</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Иконка вопросительного знака -->
  <g transform="translate(450, 30)">
    <circle cx="15" cy="15" r="12" fill="#4a6fa5" opacity="0.2"/>
    <text x="15" y="20" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">?</text>
  </g>
  
  <!-- Стрелка вниз -->
  <g transform="translate(250, 90)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#4a6fa5" stroke-width="2"/>
    <polygon points="-4,10 0,16 4,10" fill="#4a6fa5"/>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="30" y1="215" x2="470" y2="215" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Поясняющий текст внизу -->
  <text x="250" y="345" text-anchor="middle" fill="#2c4a7c" font-family="Arial, sans-serif" font-size="10" font-style="italic">Запомните: НЕ пишется слитно, если можно заменить синонимом</text>
</svg>