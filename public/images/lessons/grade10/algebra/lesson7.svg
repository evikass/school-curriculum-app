<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="450" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="300" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="450" cy="300" r="3" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Основная рамка -->
  <rect x="20" y="20" width="460" height="310" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  
  <!-- Заголовок -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">АЛГЕБРА · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#64748b">Логарифмические уравнения</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="100" x2="450" y2="100" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Пример 1 -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="400" height="40" fill="#f8fafc" stroke="#e2e8f0" rx="5"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Пример 1:</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" fill="#475569">log₂(x) + log₂(x-2) = 3</text>
  </g>
  
  <!-- Решение примера 1 -->
  <g transform="translate(50, 180)">
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Используем свойство:</text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="14" fill="#64748b">logₐb + logₐc = logₐ(bc)</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="14" fill="#64748b">log₂(x(x-2)) = 3</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="14" fill="#64748b">x(x-2) = 2³ = 8</text>
  </g>
  
  <!-- Декоративная математическая фигура -->
  <g transform="translate(380, 170)" opacity="0.1">
    <circle cx="0" cy="0" r="20" fill="#3b82f6"/>
    <path d="M-10,-10 L10,10 M10,-10 L-10,10" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Формула логарифма -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="180" height="40" fill="#dbeafe" stroke="#3b82f6" rx="5"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">logₐb = c ⇔ b = aᶜ</text>
  </g>
  
  <!-- Основное свойство -->
  <g transform="translate(250, 270)">
    <rect x="0" y="0" width="180" height="40" fill="#dcfce7" stroke="#22c55e" rx="5"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#15803d">logₐb + logₐc = logₐ(bc)</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <path d="M30,120 L35,120 L35,125" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M465,120 L470,120 L470,125" stroke="#3b82f6" stroke-width="2" fill="none"/>
  
  <!-- Точка на графике -->
  <circle cx="420" cy="150" r="4" fill="#ef4444" opacity="0.8"/>
  <text x="430" y="155" font-family="Arial, sans-serif" font-size="12" fill="#64748b">(x,y)</text>
  
  <!-- Космический элемент -->
  <g transform="translate(400, 200)" opacity="0.1">
    <polygon points="0,-15 13,7.5 -13,7.5" fill="#6366f1"/>
  </g>
  
  <!-- Дополнительные точки -->
  <circle cx="80" cy="240" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="420" cy="240" r="2" fill="#3b82f6" opacity="0.5"/>
  
  <!-- Иконка калькулятора -->
  <g transform="translate(370, 280)" opacity="0.3">
    <rect x="0" y="0" width="30" height="40" fill="#64748b" rx="3"/>
    <rect x="5" y="5" width="20" height="25" fill="white"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">∑</text>
  </g>
  
  <!-- Математический символ -->
  <text x="460" y="180" font-family="Arial, sans-serif" font-size="20" fill="#6366f1" opacity="0.5">∫</text>
  
  <!-- Декоративные волны -->
  <path d="M0,320 Q125,310 250,320 T500,320" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M0,330 Q125,320 250,330 T500,330" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.2"/>
  
  <!-- Уголок страницы -->
  <path d="M440,30 L470,30 L470,60" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <path d="M445,35 L465,35 L465,55" stroke="#cbd5e1" stroke-width="1" fill="none"/>
</svg>