<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="450" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="300" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="450" cy="300" r="3" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGrad)" filter="url(#textShadow)">АЛГЕБРА · 10 КЛАСС</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="60" x2="450" y2="60" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  
  <!-- Основной контент -->
  <g transform="translate(250, 120)">
    <!-- Форма логарифма -->
    <rect x="-120" y="-20" width="240" height="60" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="5" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af">logₐb = c</text>
  </g>
  
  <!-- Определение -->
  <g transform="translate(60, 200)">
    <text font-family="Arial, sans-serif" font-size="16" fill="#374151">
      <tspan x="0" y="0" font-weight="bold">Определение:</tspan>
      <tspan x="0" y="25">Логарифм числа b по основанию a</tspan>
      <tspan x="0" y="50">— это показатель степени, в которую</tspan>
      <tspan x="0" y="75">надо возвести основание a, чтобы</tspan>
      <tspan x="0" y="100">получить число b.</tspan>
    </text>
  </g>
  
  <!-- Графическое представление -->
  <g transform="translate(350, 180)">
    <!-- Степень -->
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e40af">aᶜ = b</text>
    <path d="M -20 20 L 20 20" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">равно</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Связи между формулами -->
  <path d="M 250 140 Q 250 160 320 180" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Пример -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="380" height="50" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="3" opacity="0.5"/>
    <text font-family="Arial, sans-serif" font-size="14" fill="#1e40af">
      <tspan x="10" y="20" font-weight="bold">Пример:</tspan>
      <tspan x="10" y="40">log₂8 = 3, потому что 2³ = 8</tspan>
    </text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  <circle cx="400" cy="100" r="40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  
  <!-- Иконки -->
  <g transform="translate(100, 90)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">a</text>
  </g>
  
  <g transform="translate(400, 90)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">b</text>
  </g>
  
  <!-- Условия для логарифма -->
  <g transform="translate(60, 240)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
      <tspan x="300" y="0">a > 0, a ≠ 1</tspan>
      <tspan x="300" y="20">b > 0</tspan>
    </text>
  </g>
  
  <!-- Вспомогательная сетка -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="500" y2="100" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="200" x2="500" y2="200" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="300" x2="500" y2="300" stroke="#3b82f6" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="350" stroke="#3b82f6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="350" stroke="#3b82f6" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="350" stroke="#3b82f6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="350" stroke="#3b82f6" stroke-width="1"/>
  </g>
</svg>