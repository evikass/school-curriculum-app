<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Паттерн для фона -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b" filter="url(#textShadow)">АЛГЕБРА</text>
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">10 КЛАСС</text>
  
  <!-- Разделительная линия -->
  <line x1="100" y1="80" x2="400" y2="80" stroke="#64748b" stroke-width="2"/>
  
  <!-- Основной заголовок темы -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af">Корень n-й степени</text>
  
  <!-- Пример записи -->
  <g transform="translate(50, 140)">
    <!-- Корень -->
    <path d="M 10 0 L 10 40 Q 10 45 15 45 L 25 45 Q 30 45 30 40 L 30 5" 
          fill="none" stroke="#1e40af" stroke-width="2"/>
    <!-- Индекс n -->
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">n</text>
    <!-- Выражение под корнем -->
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="16" fill="#334155">a</text>
    <!-- Стрелка вправо -->
    <path d="M 70 25 L 90 25" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <!-- Результат -->
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" fill="#334155">b</text>
  </g>
  
  <!-- Определение -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="400" height="40" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">
      <tspan font-weight="bold">Определение:</tspan> b = n√a ⇔ bⁿ = a, где a ≥ 0, n ∈ N, n ≥ 2
    </text>
  </g>
  
  <!-- Свойства корня -->
  <g transform="translate(50, 260)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Основные свойства:</text>
    
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      1. n√aⁿ = |a| (для четного n)
    </text>
    
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      2. n√aⁿ = a (для нечетного n)
    </text>
    
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      3. n√(a·b) = n√a · n√b
    </text>
    
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" fill="#334155">
      4. n√(a/b) = n√a / n√b
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="450" cy="50" r="30" fill="#6366f1"/>
    <circle cx="50" cy="300" r="20" fill="#8b5cf6"/>
    <rect x="420" y="280" width="40" height="40" rx="5" fill="#ec4899" transform="rotate(45 440 300)"/>
  </g>
  
  <!-- Индикаторы для примеров -->
  <g transform="translate(320, 140)">
    <circle cx="0" cy="0" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">n=2</text>
    
    <circle cx="0" cy="30" r="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">n=3</text>
    
    <circle cx="0" cy="60" r="15" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#065f46">n=4</text>
  </g>
  
  <!-- Примеры вычислений -->
  <g transform="translate(320, 230)">
    <rect x="0" y="0" width="130" height="80" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Примеры:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#64748b">√16 = 4</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#64748b">³√27 = 3</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#64748b">⁴√81 = 3</text>
  </g>
  
  <!-- Стрелка для маркера -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Математические символы -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    <text x="250" y="355" text-anchor="middle">√ ∛ ∜ ⁿ√ | |</text>
  </g>
</svg>