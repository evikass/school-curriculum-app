<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#cbd5e0"/>
    </pattern>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  <rect width="500" height="350" fill="url(#dots)" opacity="0.5"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#header)" filter="url(#shadow)"/>
  
  <!-- Текст заголовка -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">
    Урок 3: Решение задач на применение аксиом стереометрии
  </text>
  
  <!-- Геометрическая фигура - куб в изометрии -->
  <g transform="translate(100, 120)">
    <!-- Задняя грань -->
    <path d="M 0 0 L 60 0 L 60 60 L 0 60 Z" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" opacity="0.7"/>
    
    <!-- Правая грань -->
    <path d="M 60 0 L 90 15 L 90 75 L 60 60 Z" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Левая грань -->
    <path d="M 0 0 L 30 15 L 30 75 L 0 60 Z" fill="#a5b4fc" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Ребра -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#4c1d95" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="60" stroke="#4c1d95" stroke-width="2"/>
    <line x1="60" y1="60" x2="0" y2="60" stroke="#4c1d95" stroke-width="2"/>
    <line x1="0" y1="60" x2="0" y2="0" stroke="#4c1d95" stroke-width="2"/>
    <line x1="60" y1="0" x2="90" y2="15" stroke="#4c1d95" stroke-width="2"/>
    <line x1="90" y1="15" x2="90" y2="75" stroke="#4c1d95" stroke-width="2"/>
    <line x1="90" y1="75" x2="60" y2="60" stroke="#4c1d95" stroke-width="2"/>
    <line x1="30" y1="15" x2="90" y2="15" stroke="#4c1d95" stroke-width="2"/>
    <line x1="30" y1="15" x2="30" y2="75" stroke="#4c1d95" stroke-width="2"/>
    <line x1="30" y1="75" x2="90" y2="75" stroke="#4c1d95" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="15" stroke="#4c1d95" stroke-width="2"/>
    <line x1="0" y1="60" x2="30" y2="75" stroke="#4c1d95" stroke-width="2"/>
  </g>
  
  <!-- Точка A -->
  <circle cx="100" cy="120" r="4" fill="#dc2626"/>
  <text x="85" y="115" font-family="Arial" font-size="14" fill="#dc2626" font-weight="bold">A</text>
  
  <!-- Точка B -->
  <circle cx="160" cy="120" r="4" fill="#dc2626"/>
  <text x="165" y="115" font-family="Arial" font-size="14" fill="#dc2626" font-weight="bold">B</text>
  
  <!-- Точка C -->
  <circle cx="190" cy="135" r="4" fill="#dc2626"/>
  <text x="195" y="140" font-family="Arial" font-size="14" fill="#dc2626" font-weight="bold">C</text>
  
  <!-- Прямая линия через точку C -->
  <line x1="190" y1="135" x2="250" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Окружность -->
  <circle cx="280" cy="180" r="40" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="280" cy="180" r="2" fill="#10b981"/>
  <text x="285" y="185" font-family="Arial" font-size="12" fill="#10b981">O</text>
  
  <!-- Точка на окружности -->
  <circle cx="320" cy="180" r="3" fill="#10b981"/>
  <text x="325" y="185" font-family="Arial" font-size="12" fill="#10b981">P</text>
  
  <!-- Радиус -->
  <line x1="280" y1="180" x2="320" y2="180" stroke="#10b981" stroke-width="1.5"/>
  
  <!-- Перпендикуляр -->
  <line x1="280" y1="180" x2="280" y2="220" stroke="#f59e0b" stroke-width="2"/>
  <text x="285" y="210" font-family="Arial" font-size="12" fill="#f59e0b">⊥</text>
  
  <!-- Прямые углы -->
  <g transform="translate(350, 150)">
    <!-- Угол 1 -->
    <path d="M 0 0 L 20 0 L 20 20 L 0 20 Z" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 5 5 L 15 5 L 15 15 L 5 15 Z" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    
    <!-- Угол 2 -->
    <circle cx="40" cy="10" r="15" fill="none" stroke="#ec4899" stroke-width="1.5"/>
    <path d="M 40 10 L 50 10" stroke="#ec4899" stroke-width="1"/>
    <path d="M 40 10 L 45 20" stroke="#ec4899" stroke-width="1"/>
  </g>
  
  <!-- Геометрические символы -->
  <text x="50" y="280" font-family="Arial" font-size="20" fill="#4a5568">∠ABC = 90°</text>
  <text x="50" y="300" font-family="Arial" font-size="20" fill="#4a5568">AB ⊥ BC</text>
  
  <!-- Векторы -->
  <g transform="translate(200, 250)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="45" y="5" font-family="Arial" font-size="14" fill="#06b6d4">a</text>
    
    <line x1="0" y1="20" x2="0" y2="60" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="5" y="70" font-family="Arial" font-size="14" fill="#06b6d4">b</text>
    
    <line x1="0" y1="0" x2="28" y2="42" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
    <text x="30" y="45" font-family="Arial" font-size="14" fill="#f43f5e">a + b</text>
  </g>
  
  <!-- Стрелка для вектора -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4"/>
    </marker>
  </defs>
  
  <!-- Треугольник -->
  <g transform="translate(350, 250)">
    <path d="M 0 0 L 60 0 L 30 50 Z" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="15" y="25" font-family="Arial" font-size="12" fill="#7c3aed">α</text>
    <text x="45" y="25" font-family="Arial" font-size="12" fill="#7c3aed">β</text>
    <text x="25" y="45" font-family="Arial" font-size="12" fill="#7c3aed">γ</text>
  </g>
  
  <!-- Координатные оси -->
  <g transform="translate(430, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="21" y2="-21" stroke="#374151" stroke-width="1.5"/>
    <text x="32" y="5" font-family="Arial" font-size="10" fill="#374151">x</text>
    <text x="5" y="-32" font-family="Arial" font-size="10" fill="#374151">y</text>
    <text x="22" y="-22" font-family="Arial" font-size="10" fill="#374151">z</text>
  </g>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="30" cy="250" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="35" y="255" font-family="Arial" font-size="12" fill="#92400e">D</text>
  
  <rect x="30" y="270" width="20" height="20" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="35" y="285" font-family="Arial" font-size="10" fill="#6d28d9">E</text>
  
  <!-- Логотип геометрии -->
  <g transform="translate(420, 50)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M -10 0 L 0 -10 L 10 0 L 0 10 Z" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#6366f1"/>
  </g>
</svg>