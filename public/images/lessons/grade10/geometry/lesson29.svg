<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для цилиндра -->
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#63b3ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для цилиндра -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Точка -->
    <circle id="point" r="2" fill="#2d3748"/>
    
    <!-- Стрелка -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d3748"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a202c">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4a5568">Урок 29: Цилиндр</text>
  
  <!-- Цилиндр -->
  <g transform="translate(250, 200)" filter="url(#shadow)">
    <!-- Эллипс низ -->
    <ellipse cx="0" cy="60" rx="70" ry="20" fill="#2b6cb0" opacity="0.8"/>
    
    <!-- Боковая поверхность -->
    <path d="M -70,60 L -70,-60 Q -70,-80 -50,-80 L 50,-80 Q 70,-80 70,-60 L 70,60" 
          fill="url(#cylGrad)" stroke="#2b6cb0" stroke-width="2"/>
    
    <!-- Эллипс верх -->
    <ellipse cx="0" cy="-80" rx="70" ry="20" fill="#63b3ed" stroke="#2b6cb0" stroke-width="2"/>
  </g>
  
  <!-- Ось вращения -->
  <line x1="250" y1="120" x2="250" y2="280" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Радиусы в верхней окружности -->
  <g transform="translate(250, 120)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2d3748" stroke-width="1.5"/>
    <text x="35" y="-5" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">R</text>
  </g>
  
  <!-- Радиусы в нижней окружности -->
  <g transform="translate(250, 260)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2d3748" stroke-width="1.5"/>
    <text x="35" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">R</text>
  </g>
  
  <!-- Образующая -->
  <line x1="320" y1="140" x2="320" y2="240" stroke="#38a169" stroke-width="2"/>
  <text x="330" y="195" font-family="Arial, sans-serif" font-size="14" fill="#38a169">l</text>
  
  <!-- Высота цилиндра -->
  <line x1="220" y1="140" x2="220" y2="240" stroke="#805ad5" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="205" y="195" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#805ad5">h</text>
  
  <!-- Точки обозначения -->
  <circle cx="250" cy="120" r="3" fill="#e53e3e"/>
  <circle cx="320" cy="120" r="3" fill="#2d3748"/>
  <circle cx="320" cy="240" r="3" fill="#2d3748"/>
  <circle cx="250" cy="240" r="3" fill="#e53e3e"/>
  <circle cx="180" cy="240" r="3" fill="#2d3748"/>
  <circle cx="180" cy="120" r="3" fill="#2d3748"/>
  
  <!-- Боковая развертка -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="140" height="100" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2" opacity="0.7"/>
    <text x="70" y="-10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">Развертка</text>
    
    <!-- Линии развертки -->
    <line x1="0" y1="0" x2="140" y2="0" stroke="#2b6cb0" stroke-width="1"/>
    <line x1="0" y1="100" x2="140" y2="100" stroke="#2b6cb0" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2b6cb0" stroke-width="1"/>
    <line x1="140" y1="0" x2="140" y2="100" stroke="#2b6cb0" stroke-width="1"/>
    
    <!-- Размеры развертки -->
    <text x="70" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">l = 2πR</text>
    <text x="150" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">h</text>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="140" height="120" fill="#fef5e7" stroke="#d69e2e" stroke-width="2" rx="5"/>
    <text x="70" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#744210">Формулы</text>
    
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#744210">S бок = 2πRh</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="12" fill="#744210">S осн = πR²</text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="12" fill="#744210">S полн = 2πR(R+h)</text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="12" fill="#744210">V = πR²h</text>
  </g>
  
  <!-- Вспомогательные линии для построения -->
  <g transform="translate(250, 200)" opacity="0.3">
    <line x1="-70" y1="-80" x2="70" y2="60" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="70" y1="-80" x2="-70" y2="60" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Дополнительные элементы для объема -->
  <g transform="translate(250, 200)">
    <rect x="-40" y="-40" width="80" height="20" fill="#fed7d7" stroke="#e53e3e" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e53e3e">πR²</text>
  </g>
  
  <!-- Дополнительные элементы для боковой поверхности -->
  <g transform="translate(250, 200)">
    <rect x="-70" y="-60" width="140" height="5" fill="#c6f6d5" stroke="#38a169" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#38a169">2πR</text>
  </g>
  
  <!-- Пунктирные линии для проекций -->
  <line x1="180" y1="120" x2="320" y2="120" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="240" x2="320" y2="240" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Дополнительные точки и обозначения -->
  <text x="180" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">A</text>
  <text x="320" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">B</text>
  <text x="320" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">C</text>
  <text x="180" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">D</text>
  
  <!-- Дополнительные линии для визуализации -->
  <line x1="250" y1="120" x2="250" y2="240" stroke="#718096" stroke-width="1" opacity="0.5"/>
  
  <!-- Указатель на ось вращения -->
  <text x="255" y="200" font-family="Arial, sans-serif" font-size="10" fill="#e53e3e">ось</text>
</svg>