<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#titleGrad)">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Урок 8: Решение задач на параллельность</text>
  
  <!-- Координатная сетка -->
  <g stroke="#cbd5e1" stroke-width="0.5" opacity="0.5">
    <!-- Вертикальные линии -->
    <line x1="50" y1="100" x2="50" y2="320"/>
    <line x1="100" y1="100" x2="100" y2="320"/>
    <line x1="150" y1="100" x2="150" y2="320"/>
    <line x1="200" y1="100" x2="200" y2="320"/>
    <line x1="250" y1="100" x2="250" y2="320"/>
    <line x1="300" y1="100" x2="300" y2="320"/>
    <line x1="350" y1="100" x2="350" y2="320"/>
    <line x1="400" y1="100" x2="400" y2="320"/>
    <line x1="450" y1="100" x2="450" y2="320"/>
    
    <!-- Горизонтальные линии -->
    <line x1="50" y1="120" x2="450" y2="120"/>
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="50" y1="180" x2="450" y2="180"/>
    <line x1="50" y1="210" x2="450" y2="210"/>
    <line x1="50" y1="240" x2="450" y2="240"/>
    <line x1="50" y1="270" x2="450" y2="270"/>
    <line x1="50" y1="300" x2="450" y2="300"/>
  </g>
  
  <!-- Две параллельные прямые -->
  <line x1="80" y1="140" x2="420" y2="140" stroke="#1e40af" stroke-width="3"/>
  <line x1="80" y1="220" x2="420" y2="220" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Секущая -->
  <line x1="100" y1="110" x2="400" y2="280" stroke="#dc2626" stroke-width="2.5"/>
  
  <!-- Уголовые метки -->
  <g fill="#059669" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="120" y="135">α</text>
    <text x="140" y="145">β</text>
    <text x="135" y="225">γ</text>
    <text x="155" y="235">δ</text>
    <text x="320" y="255">ε</text>
    <text x="340" y="265">ζ</text>
  </g>
  
  <!-- Пересекающиеся прямые с параллельными сторонами -->
  <g transform="translate(250, 200)">
    <!-- Основание треугольника -->
    <line x1="-80" y1="30" x2="80" y2="30" stroke="#7c3aed" stroke-width="3"/>
    
    <!-- Боковые стороны -->
    <line x1="-80" y1="30" x2="-20" y2="-60" stroke="#7c3aed" stroke-width="3"/>
    <line x1="80" y1="30" x2="20" y2="-60" stroke="#7c3aed" stroke-width="3"/>
    
    <!-- Параллельная прямая -->
    <line x1="-60" y1="10" x2="60" y2="10" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,5"/>
    
    <!-- Точки деления -->
    <circle cx="-60" cy="10" r="4" fill="#059669"/>
    <circle cx="-40" cy="-10" r="4" fill="#059669"/>
    <circle cx="0" cy="-30" r="4" fill="#059669"/>
    <circle cx="40" cy="-10" r="4" fill="#059669"/>
    <circle cx="60" cy="10" r="4" fill="#059669"/>
    
    <!-- Прямоугольник внутри треугольника -->
    <rect x="-50" y="-5" width="100" height="15" fill="none" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Отмеченные углы -->
    <path d="M -60,10 L -60,20 L -50,20" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 60,10 L 60,20 L 50,20" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>
  
  <!-- Формулы и уравнения -->
  <g font-family="Arial, sans-serif" font-size="14">
    <!-- Формула параллельности прямых -->
    <rect x="20" y="290" width="200" height="40" fill="white" stroke="#94a3b8" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="120" y="315" text-anchor="middle" fill="#1e293b">k₁ = k₂</text>
    
    <!-- Условие перпендикулярности -->
    <rect x="280" y="290" width="200" height="40" fill="white" stroke="#94a3b8" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="380" y="315" text-anchor="middle" fill="#1e293b">k₁ · k₂ = -1</text>
  </g>
  
  <!-- Вспомогательные элементы -->
  <g opacity="0.7">
    <!-- Точки пересечения -->
    <circle cx="250" cy="200" r="5" fill="#dc2626"/>
    <circle cx="100" cy="140" r="4" fill="#1e40af"/>
    <circle cx="400" cy="140" r="4" fill="#1e40af"/>
    <circle cx="100" cy="220" r="4" fill="#1e40af"/>
    <circle cx="400" y="220" r="4" fill="#1e40af"/>
    
    <!-- Дополнительные линии для иллюстрации -->
    <line x1="250" y1="200" x2="250" y2="260" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="300" y2="200" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="450" cy="50" r="30" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="450" cy="50" r="20" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="450" cy="50" r="10" fill="none" stroke="#3b82f6" stroke-width="1"/>
  </g>
  
  <!-- Пунктирные линии для иллюстрации параллельных отрезков -->
  <g stroke="#059669" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6">
    <line x1="150" y1="160" x2="350" y2="160"/>
    <line x1="150" y1="180" x2="350" y2="180"/>
    <line x1="150" y1="200" x2="350" y2="200"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="60" fill="white" fill-opacity="0.9" stroke="#cbd5e1" rx="5"/>
    <line x1="10" y1="20" x2="40" y2="20" stroke="#1e40af" stroke-width="2"/>
    <text x="45" y="25" font-family="Arial" font-size="12" fill="#475569">Параллельные</text>
    <line x1="10" y1="40" x2="40" y2="40" stroke="#dc2626" stroke-width="2"/>
    <text x="45" y="45" font-family="Arial" font-size="12" fill="#475569">Секущая</text>
  </g>
  
  <!-- Геометрическая фигура для иллюстрации теорем -->
  <g transform="translate(380, 140)">
    <polygon points="0,0 40,0 40,40 0,40" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="40" stroke="#3b82f6" stroke-width="1"/>
    <line x1="40" y1="0" x2="0" y2="40" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#3b82f6"/>
  </g>
</svg>