<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    
    <!-- Градиент для плоскостей -->
    <linearGradient id="plane1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.3"/>
    </linearGradient>
    
    <linearGradient id="plane2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Сетка фона -->
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Название урока -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Заголовок урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 6: Параллельность плоскостей
  </text>
  
  <!-- Первая плоскость (синяя) -->
  <g id="plane-alpha">
    <path d="M 50 120 L 200 100 L 350 130 L 200 150 Z" fill="url(#plane1)" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1a5490">α</text>
  </g>
  
  <!-- Вторая плоскость (красная) -->
  <g id="plane-beta">
    <path d="M 50 220 L 200 200 L 350 230 L 200 250 Z" fill="url(#plane2)" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="230" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#922b21">β</text>
  </g>
  
  <!-- Параллельные линии между плоскостями -->
  <g id="parallel-lines">
    <line x1="125" y1="110" x2="125" y2="210" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
    <line x1="200" y1="110" x2="200" y2="210" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
    <line x1="275" y1="110" x2="275" y2="210" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Пересекающиеся линии (пример непараллельности) -->
  <g id="non-parallel-lines" opacity="0.5">
    <line x1="100" y1="140" x2="300" y2="180" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="300" y1="140" x2="100" y2="180" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Точка пересечения линий -->
  <circle cx="200" cy="160" r="4" fill="#e67e22"/>
  
  <!-- Вектор нормали к плоскости α -->
  <g id="normal-alpha">
    <line x1="200" y1="130" x2="200" y2="80" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="105" font-family="Arial" font-size="14" fill="#8e44ad">n₁</text>
  </g>
  
  <!-- Вектор нормали к плоскости β -->
  <g id="normal-beta">
    <line x1="200" y1="230" x2="200" y2="280" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="255" font-family="Arial" font-size="14" fill="#8e44ad">n₂</text>
  </g>
  
  <!-- Стрелка для векторов -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
  
  <!-- Дополнительная иллюстрация: параллельные плоскости в пространстве -->
  <g id="parallel-planes-3d" transform="translate(380, 120)">
    <!-- Передняя грань -->
    <path d="M 0 0 L 50 -10 L 50 40 L 0 50 Z" fill="url(#plane1)" stroke="#2980b9" stroke-width="1.5"/>
    <!-- Задняя грань -->
    <path d="M 50 -10 L 100 -20 L 100 30 L 50 40 Z" fill="url(#plane2)" stroke="#c0392b" stroke-width="1.5" opacity="0.8"/>
    <!-- Соединительные линии -->
    <line x1="0" y1="0" x2="50" y2="-10" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="0" y1="50" x2="50" y2="40" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="50" y1="40" x2="100" y2="30" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="50" y1="-10" x2="100" y2="-20" stroke="#7f8c8d" stroke-width="1"/>
  </g>
  
  <!-- Определение параллельных плоскостей -->
  <g id="definition" transform="translate(30, 300)">
    <rect x="0" y="0" width="440" height="40" fill="#ecf0f1" rx="5" opacity="0.8"/>
    <text x="10" y="15" font-family="Arial" font-size="12" fill="#2c3e50">Две плоскости называются параллельными,</text>
    <text x="10" y="30" font-family="Arial" font-size="12" fill="#2c3e50">если они не имеют общих точек.</text>
  </g>
  
  <!-- Символ параллельности -->
  <text x="230" y="175" font-family="Arial" font-size="20" fill="#27ae60">∥</text>
  
  <!-- Углы между плоскостями -->
  <g id="angles">
    <path d="M 180 160 A 20 20 0 0 0 200 140" fill="none" stroke="#34495e" stroke-width="1.5"/>
    <path d="M 220 160 A 20 20 0 0 1 200 140" fill="none" stroke="#34495e" stroke-width="1.5"/>
    <text x="170" y="150" font-family="Arial" font-size="12" fill="#34495e">φ</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g id="decorative-elements" opacity="0.3">
    <circle cx="80" cy="100" r="3" fill="#3498db"/>
    <circle cx="320" cy="110" r="3" fill="#3498db"/>
    <circle cx="80" cy="200" r="3" fill="#e74c3c"/>
    <circle cx="320" cy="210" r="3" fill="#e74c3c"/>
  </g>
  
  <!-- Маркеры для точек на плоскостях -->
  <g id="points">
    <circle cx="150" cy="125" r="3" fill="#2c3e50"/>
    <circle cx="250" cy="135" r="3" fill="#2c3e50"/>
    <circle cx="150" cy="225" r="3" fill="#2c3e50"/>
    <circle cx="250" cy="235" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Линия, параллельная плоскости -->
  <g id="parallel-line">
    <line x1="370" y1="90" x2="370" y2="260" stroke="#16a085" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="375" y="175" font-family="Arial" font-size="12" fill="#16a085">l ∥ α</text>
  </g>
  
  <!-- Условие параллельности плоскостей -->
  <g id="condition" transform="translate(30, 260)">
    <text x="0" y="15" font-family="Arial" font-size="11" fill="#7f8c8d">α ∥ β ⇔ n₁ ∥ n₂</text>
  </g>
</svg>