<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  
  <!-- Главная призма -->
  <g transform="translate(150, 120)">
    <!-- Нижнее основание -->
    <path d="M 0 80 L 100 80 L 120 60 L 20 60 Z" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <!-- Верхнее основание -->
    <path d="M 20 0 L 120 0 L 140 -20 L 40 -20 Z" fill="#d1ecf1" stroke="#3498db" stroke-width="2"/>
    <!-- Боковые грани -->
    <path d="M 0 80 L 20 60 L 40 -20 L 20 0 Z" fill="#bee5eb" stroke="#3498db" stroke-width="2"/>
    <path d="M 100 80 L 120 60 L 140 -20 L 120 0 Z" fill="#bee5eb" stroke="#3498db" stroke-width="2"/>
    <path d="M 0 80 L 100 80 L 120 0 L 40 -20 Z" fill="#74b9ff" stroke="#3498db" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Размеры призмы -->
  <g stroke="#e74c3c" stroke-width="1.5" fill="none">
    <!-- Высота -->
    <line x1="110" y1="120" x2="110" y2="200" stroke-dasharray="5,5"/>
    <line x1="105" y1="120" x2="115" y2="120"/>
    <line x1="105" y1="200" x2="115" y2="200"/>
    <text x="125" y="165" font-family="Arial" font-size="14" fill="#e74c3c">H</text>
    
    <!-- Сторона нижнего основания -->
    <line x1="150" y1="200" x2="270" y2="200" stroke-dasharray="5,5"/>
    <line x1="150" y1="195" x2="150" y2="205"/>
    <line x1="270" y1="195" x2="270" y2="205"/>
    <text x="200" y="220" font-family="Arial" font-size="14" fill="#e74c3c">a</text>
    
    <!-- Сторона верхнего основания -->
    <line x1="170" y1="100" x2="290" y2="100" stroke-dasharray="5,5"/>
    <line x1="170" y1="95" x2="170" y2="105"/>
    <line x1="290" y1="95" x2="290" y2="105"/>
    <text x="220" y="95" font-family="Arial" font-size="14" fill="#e74c3c">b</text>
  </g>
  
  <!-- Вторая призма для сравнения -->
  <g transform="translate(320, 140)">
    <!-- Нижнее основание -->
    <rect x="0" y="40" width="80" height="60" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
    <!-- Верхнее основание -->
    <rect x="0" y="0" width="80" height="60" fill="#fdcb6e" stroke="#fdcb6e" stroke-width="2"/>
    <!-- Боковые грани -->
    <rect x="0" y="0" width="10" height="100" fill="#f39c12" stroke="#fdcb6e" stroke-width="2"/>
    <rect x="70" y="0" width="10" height="100" fill="#f39c12" stroke="#fdcb6e" stroke-width="2"/>
    <rect x="10" y="40" width="60" height="60" fill="#e17055" stroke="#fdcb6e" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Формулы -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    <!-- Объем призмы -->
    <rect x="30" y="250" width="140" height="70" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="35" y="275" font-size="14">Объем призмы:</text>
    <text x="35" y="295" font-size="16" font-weight="bold">V = S<sub>осн</sub> · H</text>
    <text x="35" y="310" font-size="12" fill="#7f8c8d">S<sub>осн</sub> - площадь основания</text>
    
    <!-- Площадь поверхности -->
    <rect x="190" y="250" width="140" height="70" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="195" y="275" font-size="14">Площадь поверхности:</text>
    <text x="195" y="295" font-size="16" font-weight="bold">S = 2S<sub>осн</sub> + S<sub>бок</sub></text>
    <text x="195" y="310" font-size="12" fill="#7f8c8d">S<sub>бок</sub> - площадь боковой поверхности</text>
    
    <!-- Пример решения -->
    <rect x="350" y="250" width="140" height="70" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="355" y="275" font-size="14">Пример задачи:</text>
    <text x="355" y="295" font-size="14">Найти объем</text>
    <text x="355" y="310" font-size="14">призмы</text>
  </g>
  
  <!-- Точки и обозначения -->
  <g font-family="Arial" font-size="12" fill="#2c3e50">
    <circle cx="170" cy="120" r="3" fill="#3498db"/>
    <text x="175" y="125">A</text>
    
    <circle cx="270" cy="120" r="3" fill="#3498db"/>
    <text x="275" y="125">B</text>
    
    <circle cx="290" cy="140" r="3" fill="#3498db"/>
    <text x="295" y="145">C</text>
    
    <circle cx="170" cy="200" r="3" fill="#3498db"/>
    <text x="175" y="205">A'</text>
    
    <circle cx="270" cy="200" r="3" fill="#3498db"/>
    <text x="275" y="205">B'</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Углы -->
  <g stroke="#9b59b6" stroke-width="1.5" fill="none">
    <path d="M 170 120 A 10 10 0 0 1 180 130"/>
    <text x="180" y="135" font-family="Arial" font-size="10" fill="#9b59b6">α</text>
  </g>
  
  <!-- Вспомогательная линия -->
  <line x1="150" y1="60" x2="150" y2="200" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Штриховка для показания параллельности -->
  <g stroke="#95a5a6" stroke-width="0.5">
    <line x1="45" y1="140" x2="55" y2="140"/>
    <line x1="45" y1="145" x2="55" y2="145"/>
    <line x1="45" y1="150" x2="55" y2="150"/>
    
    <line x1="245" y1="140" x2="255" y2="140"/>
    <line x1="245" y1="145" x2="255" y2="145"/>
    <line x1="245" y1="150" x2="255" y2="150"/>
  </g>
  
  <!-- Текст урока -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e" font-weight="500">Урок 17: Решение задач на призму</text>
</svg>