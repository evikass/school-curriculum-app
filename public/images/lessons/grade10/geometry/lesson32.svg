<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для 3D эффектов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Заливка для фигур -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">
    Урок 32: Комбинации тел
  </text>
  
  <!-- Куб с усеченной вершиной (комбинация куба и пирамиды) -->
  <g transform="translate(120, 120)">
    <!-- Куб -->
    <path d="M 0 50 L 0 100 L 50 100 L 50 50 Z" fill="url(#blueGrad)" stroke="#1e40af" stroke-width="2"/>
    <path d="M 0 50 L 25 25 L 75 25 L 50 50 Z" fill="none" stroke="#1e40af" stroke-width="2"/>
    <path d="M 25 25 L 25 75 L 75 75 L 75 25 Z" fill="none" stroke="#1e40af" stroke-width="2"/>
    <path d="M 50 50 L 50 100 L 100 100 L 75 75 L 75 25 L 50 50" fill="none" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Усеченная вершина (пирамида) -->
    <path d="M 25 25 L 50 0 L 75 25 Z" fill="url(#redGrad)" stroke="#b91c1c" stroke-width="2"/>
    <path d="M 25 25 L 50 0 L 50 50 Z" fill="none" stroke="#b91c1c" stroke-width="2" opacity="0.7"/>
    <path d="M 50 0 L 75 25 L 50 50 Z" fill="none" stroke="#b91c1c" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Цилиндр с конусом сверху -->
  <g transform="translate(300, 120)">
    <!-- Цилиндр -->
    <ellipse cx="40" cy="75" rx="40" ry="10" fill="url(#blueGrad)" stroke="#1e40af" stroke-width="2"/>
    <rect x="0" y="25" width="80" height="50" fill="url(#blueGrad)" stroke="#1e40af" stroke-width="2"/>
    <ellipse cx="40" cy="25" rx="40" ry="10" fill="none" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Конус -->
    <path d="M 0 25 L 40 -10 L 80 25 Z" fill="url(#redGrad)" stroke="#b91c1c" stroke-width="2"/>
    <ellipse cx="40" cy="25" rx="40" ry="10" fill="url(#redGrad)" stroke="#b91c1c" stroke-width="2"/>
  </g>
  
  <!-- Сфера внутри куба -->
  <g transform="translate(250, 220)">
    <!-- Куб -->
    <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <rect x="-40" y="-60" width="100" height="20" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    <rect x="-60" y="-40" width="20" height="100" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
    
    <!-- Сфера -->
    <circle cx="0" cy="0" r="35" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <ellipse cx="-15" cy="-15" rx="15" ry="10" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Метки для фигур -->
  <text x="145" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Куб + пирамида
  </text>
  <text x="340" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Цилиндр + конус
  </text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Сфера в кубе
  </text>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="50" cy="100" r="3" fill="#3b82f6"/>
  <circle cx="70" cy="110" r="3" fill="#3b82f6"/>
  <circle cx="90" cy="95" r="3" fill="#3b82f6"/>
  <circle cx="110" cy="105" r="3" fill="#3b82f6"/>
  
  <circle cx="230" cy="90" r="3" fill="#ef4444"/>
  <circle cx="250" cy="80" r="3" fill="#ef4444"/>
  <circle cx="270" cy="85" r="3" fill="#ef4444"/>
  <circle cx="290" cy="75" r="3" fill="#ef4444"/>
  
  <!-- Линии соединения -->
  <line x1="195" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="190" x2="250" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Геометрические символы -->
  <text x="30" y="320" font-family="Arial, sans-serif" font-size="16" fill="#64748b">∩</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="16" fill="#64748b">∪</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="16" fill="#64748b">⊂</text>
  
  <!-- Декоративные элементы -->
  <rect x="20" y="30" width="3" height="3" fill="#3b82f6"/>
  <rect x="477" y="30" width="3" height="3" fill="#ef4444"/>
  <rect x="20" y="317" width="3" height="3" fill="#10b981"/>
  <rect x="477" y="317" width="3" height="3" fill="#f59e0b"/>
  
  <!-- Углы для декорации -->
  <path d="M 20 20 L 20 30 L 30 30" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 480 20 L 480 30 L 470 30" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 20 330 L 20 320 L 30 320" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 480 330 L 480 320 L 470 320" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>