<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для шара -->
    <radialGradient id="sphereGrad">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">
    Урок 33: Площадь поверхности и объём шара
  </text>
  
  <!-- Главный шар -->
  <g transform="translate(150, 180)">
    <!-- Тень шара -->
    <ellipse cx="0" cy="80" rx="80" ry="20" fill="#000" opacity="0.2"/>
    
    <!-- Шар -->
    <circle cx="0" cy="0" r="80" fill="url(#sphereGrad)" filter="url(#shadow)"/>
    
    <!-- Параллели на шаре -->
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="80" ry="60" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
    
    <!-- Медиана -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#1e40af" stroke-width="2" opacity="0.5"/>
    
    <!-- Радиус -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="40" y="-5" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc2626">R</text>
  </g>
  
  <!-- Стрелка для радиуса -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- Формулы -->
  <g transform="translate(300, 120)">
    <!-- Формула площади -->
    <rect x="-10" y="-10" width="180" height="60" fill="white" stroke="#94a3b8" stroke-width="1" rx="5"/>
    <text x="80" y="10" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">
      S = 4πR²
    </text>
    <text x="80" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">
      площадь поверхности
    </text>
  </g>
  
  <g transform="translate(300, 200)">
    <!-- Формула объёма -->
    <rect x="-10" y="-10" width="180" height="60" fill="white" stroke="#94a3b8" stroke-width="1" rx="5"/>
    <text x="80" y="10" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e293b">
      V = ⁴⁄₃πR³
    </text>
    <text x="80" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">
      объём шара
    </text>
  </g>
  
  <!-- Вспомогательный круг -->
  <g transform="translate(150, 320)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#10b981">Sₒₛₙ</text>
    <text x="30" y="5" text-anchor="start" font-family="Arial" font-size="12" fill="#10b981">= πR²</text>
  </g>
  
  <!-- Пример расчёта -->
  <g transform="translate(50, 280)">
    <text font-family="Arial" font-size="12" fill="#475569">
      <tspan x="0" y="0">Пример:</tspan>
      <tspan x="0" y="20">R = 5 см</tspan>
      <tspan x="0" y="40">S = 4π·5² = 100π см²</tspan>
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Точка на сфере -->
  <circle cx="230" cy="180" r="3" fill="#dc2626"/>
  <text x="240" y="185" font-family="Arial" font-size="12" fill="#dc2626">M</text>
  
  <!-- Угловые отметки -->
  <path d="M 150 180 A 30 30 0 0 1 180 150" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="185" y="145" font-family="Arial" font-size="12" fill="#f59e0b">α</text>
  
  <!-- Координатная сетка (подложка) -->
  <g opacity="0.1">
    <line x1="50" y1="0" x2="50" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="250" y1="0" x2="250" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="350" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="500" y2="50" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="500" y2="100" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="500" y2="150" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="500" y2="200" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="500" y2="250" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="500" y2="300" stroke="#94a3b8" stroke-width="0.5"/>
  </g>
  
  <!-- Дополнительные визуальные элементы -->
  <circle cx="400" cy="100" r="3" fill="#8b5cf6"/>
  <circle cx="410" cy="110" r="3" fill="#8b5cf6"/>
  <circle cx="420" cy="105" r="3" fill="#8b5cf6"/>
  <circle cx="415" cy="115" r="3" fill="#8b5cf6"/>
  <circle cx="405" cy="120" r="3" fill="#8b5cf6"/>
  
  <!-- Иконка калькулятора -->
  <g transform="translate(420, 250)">
    <rect x="0" y="0" width="30" height="40" fill="#e5e7eb" stroke="#6b7280" stroke-width="1" rx="3"/>
    <rect x="3" y="3" width="24" height="10" fill="#374151"/>
    <text x="15" y="10" text-anchor="middle" font-family="Arial" font-size="8" fill="white">π</text>
    <circle cx="7" cy="20" r="2" fill="#6b7280"/>
    <circle cx="15" cy="20" r="2" fill="#6b7280"/>
    <circle cx="23" cy="20" r="2" fill="#6b7280"/>
    <circle cx="7" cy="27" r="2" fill="#6b7280"/>
    <circle cx="15" cy="27" r="2" fill="#6b7280"/>
    <circle cx="23" cy="27" r="2" fill="#6b7280"/>
    <rect x="3" y="32" width="24" height="5" fill="#3b82f6"/>
  </g>
  
  <!-- Указатель на диаметр -->
  <g transform="translate(150, 180)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" fill="#10b981">D = 2R</text>
  </g>
</svg>