<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <!-- Градиент для пирамиды -->
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="50%" style="stop-color:#3182ce"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
    
    <!-- Тень для пирамиды -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a202c">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#4a5568">
    Урок 18: Решение задач на пирамиду
  </text>
  
  <!-- Пирамида 3D -->
  <g transform="translate(250, 180)" filter="url(#shadow)">
    <!-- Основание пирамиды -->
    <path d="M -80 40 L 80 40 L 80 60 L -80 60 Z" fill="#2d3748" opacity="0.8"/>
    
    <!-- Боковые грани -->
    <path d="M -80 40 L 0 -50 L 80 40 Z" fill="url(#pyramidGrad)"/>
    <path d="M -80 40 L -80 60 L 0 -50 Z" fill="#3182ce"/>
    <path d="M 80 40 L 80 60 L 0 -50 Z" fill="#2563eb"/>
    
    <!-- Рёбра -->
    <line x1="-80" y1="40" x2="0" y2="-50" stroke="#1e40af" stroke-width="2"/>
    <line x1="80" y1="40" x2="0" y2="-50" stroke="#1e40af" stroke-width="2"/>
    <line x1="-80" y1="40" x2="80" y2="40" stroke="#1e40af" stroke-width="2"/>
    <line x1="-80" y1="60" x2="80" y2="60" stroke="#1e40af" stroke-width="2"/>
    <line x1="-80" y1="60" x2="-80" y2="40" stroke="#1e40af" stroke-width="2"/>
    <line x1="80" y1="60" x2="80" y2="40" stroke="#1e40af" stroke-width="2"/>
  </g>
  
  <!-- Обозначения вершин -->
  <circle cx="170" cy="130" r="4" fill="#dc2626"/>
  <text x="170" y="125" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">S</text>
  
  <circle cx="170" cy="220" r="3" fill="#dc2626"/>
  <text x="160" y="225" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">A</text>
  
  <circle cx="330" cy="220" r="3" fill="#dc2626"/>
  <text x="335" y="225" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">B</text>
  
  <circle cx="250" cy="240" r="3" fill="#dc2626"/>
  <text x="255" y="245" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">C</text>
  
  <!-- Высота пирамиды -->
  <line x1="250" y1="130" x2="250" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="255" y="175" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">h</text>
  
  <!-- Угол наклона грани -->
  <path d="M 250 130 L 250 180 L 330 180" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M 245 175 L 250 180 L 255 175" stroke="#059669" stroke-width="2" fill="none"/>
  <text x="285" y="195" font-family="Arial, sans-serif" font-size="12" fill="#059669">α</text>
  
  <!-- Площадь основания -->
  <rect x="165" y="240" width="170" height="20" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7c3aed">S<sub>осн</sub></text>
  
  <!-- Формулы -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="50" fill="white" stroke="#e5e7eb" stroke-width="1" rx="5"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      V = (1/3) · S<sub>осн</sub> · h
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      S = S<sub>осн</sub> + S<sub>бок</sub>
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="50" cy="100" r="3" fill="#6b7280"/>
    <circle cx="450" cy="100" r="3" fill="#6b7280"/>
    <circle cx="50" cy="250" r="3" fill="#6b7280"/>
    <circle cx="450" cy="250" r="3" fill="#6b7280"/>
    
    <line x1="50" y1="100" x2="450" y2="100" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Пример задачи -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">
      Пример:
    </text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">
      Пирамида с
    </text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">
      квадратным основанием
    </text>
  </g>
  
  <!-- Координатная сетка (фоновая) -->
  <g opacity="0.1">
    <line x1="0" y1="200" x2="500" y2="200" stroke="#6b7280" stroke-width="0.5"/>
    <line x1="250" y1="0" x2="250" y2="350" stroke="#6b7280" stroke-width="0.5"/>
  </g>
</svg>