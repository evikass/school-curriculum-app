<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Декоративная сетка -->
  <g opacity="0.1">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000" stroke-width="0.5"/>
    </pattern>
    <rect width="500" height="350" fill="url(#grid)"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Урок 23: Скалярное произведение векторов</text>
  
  <!-- Система координат -->
  <g transform="translate(150, 200)">
    <!-- Ось X -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="105" y="5" font-family="Arial" font-size="14" fill="#333">x</text>
    
    <!-- Ось Y -->
    <line x1="0" y1="100" x2="0" y2="-100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="5" y="-105" font-family="Arial" font-size="14" fill="#333">y</text>
    
    <!-- Вектор a -->
    <g>
      <line x1="0" y1="0" x2="60" y2="-40" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead-red)"/>
      <text x="65" y="-35" font-family="Arial" font-size="16" fill="#e74c3c" font-weight="bold">a</text>
    </g>
    
    <!-- Вектор b -->
    <g>
      <line x1="0" y1="0" x2="40" y2="-60" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
      <text x="45" y="-55" font-family="Arial" font-size="16" fill="#3498db" font-weight="bold">b</text>
    </g>
    
    <!-- Угол между векторами -->
    <path d="M 30 0 A 30 30 0 0 0 21.21 -21.21" fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="35" y="-5" font-family="Arial" font-size="14" fill="#27ae60">φ</text>
    
    <!-- Проекция вектора a на b -->
    <g>
      <line x1="0" y1="0" x2="20" y2="-30" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
      <line x1="20" y1="-30" x2="60" y2="-40" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
    </g>
    
    <!-- Прямоугольник для демонстрации площади -->
    <rect x="0" y="-60" width="60" height="60" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(320, 120)">
    <!-- Формула 1 -->
    <rect x="-5" y="-5" width="160" height="30" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="75" y="15" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">a·b = |a|·|b|·cosφ</text>
    
    <!-- Формула 2 -->
    <rect x="-5" y="35" width="160" height="30" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="75" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">a·b = x₁·x₂ + y₁·y₂</text>
  </g>
  
  <!-- Свойства скалярного произведения -->
  <g transform="translate(50, 280)">
    <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Свойства:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#666">• Коммутативность: a·b = b·a</text>
    <text x="0" y="40" font-family="Arial" font-size="12" fill="#666">• Дистрибутивность: a·(b + c) = a·b + a·c</text>
  </g>
  
  <!-- Геометрическая интерпретация -->
  <g transform="translate(320, 200)">
    <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Геометрический смысл:</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#666">• Произведение длин векторов</text>
    <text x="0" y="40" font-family="Arial" font-size="12" fill="#666">• на косинус угла между ними</text>
    <text x="0" y="60" font-family="Arial" font-size="12" fill="#666">• Площадь параллелограмма</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(150, 200)">
    <!-- Вектор проекции -->
    <line x1="0" y1="0" x2="20" y2="-30" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
    <text x="25" y="-25" font-family="Arial" font-size="12" fill="#e74c3c">a_b</text>
  </g>
  
  <!-- Легенда цветов -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="15" height="15" fill="#e74c3c"/>
    <text x="20" y="12" font-family="Arial" font-size="12" fill="#666">Вектор a</text>
    
    <rect x="0" y="20" width="15" height="15" fill="#3498db"/>
    <text x="20" y="32" font-family="Arial" font-size="12" fill="#666">Вектор b</text>
  </g>
  
  <!-- Определение угла 90° -->
  <g transform="translate(150, 200)">
    <path d="M 10 0 L 0 -10 L 10 -10 Z" fill="none" stroke="#666" stroke-width="1"/>
    <text x="15" y="-5" font-family="Arial" font-size="12" fill="#666">90°</text>
  </g>
  
  <!-- Метрика расстояния -->
  <g transform="translate(320, 280)">
    <rect x="-5" y="-5" width="170" height="50" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="80" y="15" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">Расстояние между точками:</text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">d(A,B) = |AB| = √((x₂-x₁)² + (y₂-y₁)²)</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="480" cy="320" r="20" fill="#3498db" opacity="0.1"/>
  <circle cx="20" cy="330" r="15" fill="#e74c3c" opacity="0.1"/>
  
  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>