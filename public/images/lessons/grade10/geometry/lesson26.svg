<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    
    <!-- Маркер для векторов -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">
    Урок 26: Взаимное расположение прямых и плоскостей
  </text>
  
  <!-- Разделительные линии -->
  <line x1="50" y1="75" x2="450" y2="75" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Прямая a (наклонная) -->
  <g id="line-a">
    <line x1="80" y1="120" x2="380" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="390" y="185" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6">a</text>
  </g>
  
  <!-- Прямая b (параллельная) -->
  <g id="line-b">
    <line x1="80" y1="160" x2="380" y2="220" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <text x="390" y="225" font-family="Arial, sans-serif" font-size="14" fill="#10b981">b</text>
  </g>
  
  <!-- Прямая c (пересекающая) -->
  <g id="line-c">
    <line x1="280" y1="100" x2="320" y2="260" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="325" y="265" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b">c</text>
  </g>
  
  <!-- Плоскость α -->
  <g id="plane-alpha">
    <path d="M 100 220 L 300 250 L 320 280 L 120 250 Z" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" opacity="0.7"/>
    <text x="210" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6366f1">α</text>
  </g>
  
  <!-- Точка пересечения P -->
  <circle cx="300" cy="200" r="4" fill="#ef4444"/>
  <text x="305" y="205" font-family="Arial, sans-serif" font-size="12" fill="#ef4444">P</text>
  
  <!-- Перпендикуляр из точки P в плоскость α -->
  <line x1="300" y1="200" x2="300" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="305" y="230" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">h</text>
  
  <!-- Угол между прямой и плоскостью -->
  <path d="M 300 200 A 30 30 0 0 0 270 185" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="240" y="190" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6">φ</text>
  
  <!-- Дополнительная прямая d (в плоскости) -->
  <g id="line-d">
    <line x1="120" y1="250" x2="320" y2="280" stroke="#06b6d4" stroke-width="2"/>
    <text x="330" y="285" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4">d</text>
  </g>
  
  <!-- Точка Q на прямой d -->
  <circle cx="220" cy="265" r="3" fill="#ec4899"/>
  <text x="225" y="270" font-family="Arial, sans-serif" font-size="12" fill="#ec4899">Q</text>
  
  <!-- Вектор нормали к плоскости -->
  <g id="normal-vector">
    <line x1="210" y1="245" x2="210" y2="190" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="215" y="195" font-family="Arial, sans-serif" font-size="12" fill="#14b8a6">n</text>
  </g>
  
  <!-- Подписи к случаям расположения -->
  <g id="labels">
    <rect x="50" y="300" width="120" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
    <text x="110" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Случай 1:</text>
    <text x="110" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Прямая ∉ плоскости</text>
    
    <rect x="190" y="300" width="120" height="40" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
    <text x="250" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">Случай 2:</text>
    <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">Прямая ⊂ плоскости</text>
    
    <rect x="330" y="300" width="120" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
    <text x="390" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Случай 3:</text>
    <text x="390" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Прямая ∩ плоскость = {P}</text>
  </g>
  
  <!-- Условные обозначения -->
  <g id="legend" transform="translate(420, 120)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Условия:</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="9" fill="#64748b">∉ - не принадлежит</text>
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="9" fill="#64748b">⊂ - содержится</text>
    <text x="0" y="41" font-family="Arial, sans-serif" font-size="9" fill="#64748b">∩ - пересечение</text>
  </g>
  
  <!-- Дополнительные элементы для наглядности -->
  <circle cx="150" cy="140" r="2" fill="#64748b" opacity="0.5"/>
  <circle cx="200" cy="155" r="2" fill="#64748b" opacity="0.5"/>
  <circle cx="250" cy="170" r="2" fill="#64748b" opacity="0.5"/>
  
  <circle cx="100" y="235" r="2" fill="#64748b" opacity="0.5"/>
  <circle cx="150" y="242" r="2" fill="#64748b" opacity="0.5"/>
  <circle cx="200" y="249" r="2" fill="#64748b" opacity="0.5"/>
  
  <!-- Знак перпендикулярности -->
  <g id="perp-sign" transform="translate(290, 210)">
    <rect x="-5" y="-5" width="10" height="10" fill="white" stroke="#64748b" stroke-width="1"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#64748b" stroke-width="1"/>
    <line x1="-3" y1="3" x2="3" y2="-3" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Дополнительная подпись -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" font-style="italic">
    Взаимное расположение прямой и плоскости
  </text>
</svg>