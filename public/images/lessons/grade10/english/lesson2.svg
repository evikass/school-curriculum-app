<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Title background -->
  <rect x="20" y="20" width="460" height="60" rx="10" fill="#2d3748" filter="url(#shadow)"/>
  
  <!-- Title text -->
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    АНГЛИЙСКИЙ ЯЗЫК
  </text>
  <text x="250" y="65" text-anchor="middle" fill="#cbd5e0" font-family="Arial, sans-serif" font-size="16">
    10 КЛАСС
  </text>
  
  <!-- Lesson title -->
  <text x="250" y="110" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Урок 2: Passive Voice
  </text>
  
  <!-- Main content area -->
  <g transform="translate(50, 140)">
    <!-- Active Voice example -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#e6fffa" stroke="#4fd1c5" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" fill="#2c7a7b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Active Voice
    </text>
    <text x="15" y="50" fill="#2d3748" font-family="Arial, sans-serif" font-size="14">
      I write a letter.
    </text>
    <text x="15" y="75" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      (Я пишу письмо)
    </text>
    <text x="15" y="95" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      Subject → Verb → Object
    </text>
    
    <!-- Arrow -->
    <line x1="190" y1="60" x2="230" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="55" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      becomes
    </text>
    
    <!-- Passive Voice example -->
    <rect x="240" y="0" width="180" height="120" rx="8" fill="#fef5e7" stroke="#f6ad55" stroke-width="2"/>
    <text x="330" y="25" text-anchor="middle" fill="#c05621" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Passive Voice
    </text>
    <text x="255" y="50" fill="#2d3748" font-family="Arial, sans-serif" font-size="14">
      A letter is written.
    </text>
    <text x="255" y="75" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      (Письмо пишется)
    </text>
    <text x="255" y="95" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      Object → Be + V3
    </text>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
    <text x="10" y="20" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Формула:
    </text>
    <text x="10" y="38" fill="#4a5568" font-family="Arial, sans-serif" font-size="13">
      Subject + be (am/is/are/was/were) + V3 (Past Participle) + (optional) by + Agent
    </text>
  </g>
  
  <!-- Examples icons -->
  <g transform="translate(60, 160)">
    <!-- Book icon -->
    <rect x="15" y="15" width="20" height="25" rx="2" fill="#9f7aea" opacity="0.8"/>
    <rect x="17" y="17" width="16" height="21" fill="white"/>
    <line x1="20" y1="20" x2="30" y2="20" stroke="#9f7aea" stroke-width="1"/>
    <line x1="20" y1="24" x2="28" y2="24" stroke="#9f7aea" stroke-width="1"/>
    <line x1="20" y1="28" x2="30" y2="28" stroke="#9f7aea" stroke-width="1"/>
  </g>
  
  <g transform="translate(300, 160)">
    <!-- Pen icon -->
    <rect x="15" y="15" width="4" height="20" rx="2" fill="#f687b3" transform="rotate(-45 17 25)"/>
    <rect x="12" y="12" width="8" height="6" rx="1" fill="#f687b3"/>
  </g>
  
  <!-- Grammar rules -->
  <g transform="translate(60, 200)">
    <circle cx="5" cy="5" r="3" fill="#48bb78"/>
    <text x="15" y="9" fill="#2d3748" font-family="Arial, sans-serif" font-size="12">
      Зачем используется Passive Voice?
    </text>
  </g>
  
  <g transform="translate(60, 220)">
    <circle cx="5" cy="5" r="3" fill="#48bb78"/>
    <text x="15" y="9" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      Когда исполнитель действия неизвестен или неважен
    </text>
  </g>
  
  <g transform="translate(60, 240)">
    <circle cx="5" cy="5" r="3" fill="#48bb78"/>
    <text x="15" y="9" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      Для акцента на объекте действия
    </text>
  </g>
  
  <!-- Verb examples -->
  <g transform="translate(280, 200)">
    <text x="0" y="0" fill="#2d3748" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Примеры V3:
    </text>
    <text x="0" y="18" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">
      write → written
    </text>
    <text x="0" y="33" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">
      eat → eaten
    </text>
    <text x="0" y="48" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">
      see → seen
    </text>
    <text x="0" y="63" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">
      make → made
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="440" cy="50" r="15" fill="#ed8936" opacity="0.3"/>
  <circle cx="460" cy="70" r="10" fill="#9f7aea" opacity="0.3"/>
  <circle cx="30" cy="100" r="8" fill="#48bb78" opacity="0.3"/>
</svg>