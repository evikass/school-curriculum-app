<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для кнопок -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 1: Времена группы Perfect
  </text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="90" width="440" height="240" rx="10" fill="white" filter="url(#shadow)"/>
  
  <!-- Раздел Present Perfect -->
  <g>
    <rect x="50" y="110" width="180" height="90" rx="5" fill="#e8f4fd" stroke="#4a90e2" stroke-width="2"/>
    <text x="140" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Present Perfect
    </text>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="12" fill="#555">
      have/has + V3
    </text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="11" fill="#666">
      I have finished my work
    </text>
  </g>
  
  <!-- Раздел Past Perfect -->
  <g>
    <rect x="270" y="110" width="180" height="90" rx="5" fill="#fff4e6" stroke="#ff9800" stroke-width="2"/>
    <text x="360" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Past Perfect
    </text>
    <text x="280" y="160" font-family="Arial, sans-serif" font-size="12" fill="#555">
      had + V3
    </text>
    <text x="280" y="180" font-family="Arial, sans-serif" font-size="11" fill="#666">
      I had finished my work
    </text>
  </g>
  
  <!-- Раздел Future Perfect -->
  <g>
    <rect x="160" y="220" width="180" height="90" rx="5" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Future Perfect
    </text>
    <text x="170" y="270" font-family="Arial, sans-serif" font-size="12" fill="#555">
      will have + V3
    </text>
    <text x="170" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666">
      I will have finished my work
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="70" cy="130" r="8" fill="#4a90e2" opacity="0.3"/>
  <circle cx="290" cy="130" r="8" fill="#ff9800" opacity="0.3"/>
  <circle cx="180" cy="240" r="8" fill="#9c27b0" opacity="0.3"/>
  
  <!-- Стрелки между временами -->
  <path d="M 230 155 L 270 155" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 360 200 L 250 220" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  
  <!-- Кнопка "Примеры" -->
  <rect x="40" y="320" width="80" height="25" rx="12" fill="url(#btnGrad)" cursor="pointer"/>
  <text x="80" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Примеры
  </text>
  
  <!-- Кнопка "Упражнения" -->
  <rect x="130" y="320" width="80" height="25" rx="12" fill="url(#btnGrad)" cursor="pointer"/>
  <text x="170" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Упражнения
  </text>
  
  <!-- Кнопка "Теория" -->
  <rect x="220" y="320" width="80" height="25" rx="12" fill="url(#btnGrad)" cursor="pointer"/>
  <text x="260" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Теория
  </text>
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M 20 100 L 20 120 L 25 115 M 20 120 L 15 115" stroke="#4a90e2" stroke-width="2" fill="none"/>
  <path d="M 480 100 L 480 120 L 475 115 M 480 120 L 485 115" stroke="#4a90e2" stroke-width="2" fill="none"/>
  
  <!-- Малые иконки -->
  <circle cx="420" cy="125" r="3" fill="#4a90e2"/>
  <circle cx="425" cy="125" r="3" fill="#ff9800"/>
  <circle cx="430" cy="125" r="3" fill="#9c27b0"/>
  
  <!-- Временная шкала -->
  <line x1="50" y1="315" x2="450" y2="315" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="330" font-family="Arial, sans-serif" font-size="10" fill="#999">Past</text>
  <text x="230" y="330" font-family="Arial, sans-serif" font-size="10" fill="#999">Present</text>
  <text x="420" y="330" font-family="Arial, sans-serif" font-size="10" fill="#999">Future</text>
</svg>