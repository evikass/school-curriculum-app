<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Book shadow -->
    <filter id="bookShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Text highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Title background -->
  <rect x="20" y="20" width="460" height="60" rx="10" fill="#1e40af" opacity="0.9"/>
  
  <!-- Main title -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС</text>
  
  <!-- Lesson number -->
  <circle cx="50" cy="50" r="20" fill="#fbbf24"/>
  <text x="50" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">9</text>
  
  <!-- Open book icon -->
  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M0 20 Q0 0 20 0 L80 0 Q100 0 100 20 L100 80 Q100 100 80 100 L20 100 Q0 100 0 80 Z" 
          fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <!-- Right page -->
    <path d="M100 20 Q100 0 120 0 L180 0 Q200 0 200 20 L200 80 Q200 100 180 100 L120 100 Q100 100 100 80 Z" 
          fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <!-- Book spine -->
    <line x1="100" y1="0" x2="100" y2="100" stroke="#1e40af" stroke-width="3"/>
    <!-- Text lines on pages -->
    <line x1="15" y1="25" x2="85" y2="25" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="35" x2="75" y2="35" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="45" x2="80" y2="45" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="15" y1="55" x2="70" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
    
    <line x1="115" y1="25" x2="185" y2="25" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="115" y1="35" x2="175" y2="35" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="115" y1="45" x2="180" y2="45" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="115" y1="55" x2="170" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Lesson title -->
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">Урок 9: Text Analysis</text>
  
  <!-- Analysis elements -->
  <g transform="translate(50, 150)">
    <!-- Comprehension box -->
    <rect x="0" y="0" width="180" height="80" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#bookShadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Comprehension</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Main ideas</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Supporting details</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Inference skills</text>
  </g>
  
  <!-- Vocabulary box -->
  <g transform="translate(250, 150)">
    <rect x="0" y="0" width="180" height="80" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#bookShadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Vocabulary</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="#78350f">• Key terms</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="12" fill="#78350f">• Context clues</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="12" fill="#78350f">• Word forms</text>
  </g>
  
  <!-- Structure box -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="180" height="80" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="2" filter="url(#bookShadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#064e3b">Structure</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="#064e3b">• Paragraphs</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="12" fill="#064e3b">• Transitions</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="12" fill="#064e3b">• Cohesion</text>
  </g>
  
  <!-- Connecting arrows -->
  <path d="M140 190 Q200 220 250 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M310 190 Q250 220 150 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- Sample text highlighting -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="400" height="30" rx="3" fill="url(#highlightGrad)"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" font-style="italic">"Text analysis helps understand deeper meaning behind words"</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="150" r="3" fill="#3b82f6"/>
  <circle cx="470" cy="150" r="3" fill="#f59e0b"/>
  <circle cx="30" cy="290" r="3" fill="#10b981"/>
  <circle cx="470" cy="290" r="3" fill="#3b82f6"/>
  
  <!-- Magnifying glass icon -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#6b7280" stroke-width="3"/>
    <line x1="10" y1="10" x2="25" y2="25" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Pencil icon -->
  <g transform="translate(450, 120)">
    <rect x="0" y="0" width="20" height="30" rx="2" fill="#ef4444" transform="rotate(-45 10 15)"/>
    <polygon points="5,5 10,0 15,5" fill="#fbbf24" transform="rotate(-45 10 15)"/>
  </g>
  
  <!-- Clock icon -->
  <g transform="translate(30, 120)">
    <circle cx="0" cy="0" r="12" fill="#6b7280"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Progress indicator -->
  <rect x="50" y="340" width="400" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="50" y="340" width="180" height="4" rx="2" fill="#3b82f6"/>
  
  <!-- Chapter numbers -->
  <text x="100" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ch. 1</text>
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ch. 2</text>
  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ch. 3</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ch. 4</text>
  
  <!-- Small decorative stars -->
  <g fill="#fbbf24">
    <path d="M420 40 l2 6 h6 l-5 4 2 6 -5 -4 -5 4 2 -6 -5 -4 h6 z"/>
    <path d="M80 40 l2 6 h6 l-5 4 2 6 -5 -4 -5 4 2 -6 -5 -4 h6 z"/>
    <path d="M250 40 l2 6 h6 l-5 4 2 6 -5 -4 -5 4 2 -6 -5 -4 h6 z"/>
  </g>
</svg>