<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title Background -->
  <rect x="0" y="0" width="500" height="80" fill="#2c3e50"/>
  
  <!-- Main Title -->
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">АНГЛИЙСКИЙ ЯЗЫК</text>
  <text x="250" y="60" text-anchor="middle" fill="#ecf0f1" font-family="Arial, sans-serif" font-size="18">10 КЛАСС</text>
  
  <!-- Lesson Title -->
  <text x="250" y="105" text-anchor="middle" fill="#34495e" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Урок 6: Idioms</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="120" r="3" fill="#e74c3c"/>
  <circle cx="450" cy="120" r="3" fill="#e74c3c"/>
  <line x1="60" y1="120" x2="440" y2="120" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- Book icon -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="40" height="50" rx="2" fill="#3498db"/>
    <rect x="5" y="5" width="30" height="40" fill="white"/>
    <line x1="5" y1="15" x2="35" y2="15" stroke="#3498db" stroke-width="1"/>
    <line x1="5" y1="20" x2="35" y2="20" stroke="#3498db" stroke-width="1"/>
    <line x1="5" y1="25" x2="35" y2="25" stroke="#3498db" stroke-width="1"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#3498db" stroke-width="1"/>
    <line x1="5" y1="35" x2="25" y2="35" stroke="#3498db" stroke-width="1"/>
  </g>
  
  <!-- Light bulb icon -->
  <g transform="translate(430, 140)">
    <circle cx="20" cy="20" r="15" fill="#f39c12"/>
    <rect x="15" y="30" width="10" height="8" fill="#34495e"/>
    <line x1="17" y1="34" x2="23" y2="34" stroke="white" stroke-width="1"/>
    <line x1="17" y1="37" x2="23" y2="37" stroke="white" stroke-width="1"/>
    <path d="M 20 10 Q 15 15 15 20 Q 15 25 20 25 Q 25 25 25 20 Q 25 15 20 10" fill="#fff3cd"/>
  </g>
  
  <!-- Idiom cards -->
  <!-- Card 1 -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">It's raining</text>
    <text x="60" y="40" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">cats and dogs</text>
    <text x="60" y="55" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11">Льет как из ведра</text>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="white" stroke="#e74c3c" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Break the</text>
    <text x="60" y="40" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ice</text>
    <text x="60" y="55" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11">Снять напряжение</text>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(360, 200)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="white" stroke="#2ecc71" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Piece of</text>
    <text x="60" y="40" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">cake</text>
    <text x="60" y="55" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11">Легко, просто</text>
  </g>
  
  <!-- Small decorative elements -->
  <circle cx="60" cy="280" r="2" fill="#3498db"/>
  <circle cx="70" cy="280" r="2" fill="#e74c3c"/>
  <circle cx="80" cy="280" r="2" fill="#2ecc71"/>
  <circle cx="90" cy="280" r="2" fill="#f39c12"/>
  
  <!-- Arrow -->
  <g transform="translate(150, 270)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Speech bubble -->
  <g transform="translate(200, 260)">
    <ellipse cx="40" cy="20" rx="35" ry="18" fill="#ecf0f1" stroke="#34495e" stroke-width="1"/>
    <polygon points="35,35 40,40 45,35" fill="#ecf0f1" stroke="#34495e" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Learn</text>
  </g>
  
  <!-- Star decoration -->
  <g transform="translate(300, 265)">
    <polygon points="15,5 18,12 25,12 20,17 22,24 15,20 8,24 10,17 5,12 12,12" fill="#f39c12"/>
  </g>
  
  <!-- More small icons -->
  <g transform="translate(350, 265)">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#3498db" stroke-width="2"/>
    <circle cx="10" cy="10" r="3" fill="#3498db"/>
  </g>
  
  <g transform="translate(380, 265)">
    <rect x="5" y="5" width="10" height="10" fill="#e74c3c"/>
    <rect x="7" y="7" width="6" height="6" fill="white"/>
  </g>
  
  <!-- Progress bar -->
  <rect x="100" y="305" width="300" height="8" rx="4" fill="#ecf0f1"/>
  <rect x="100" y="305" width="180" height="8" rx="4" fill="#2ecc71"/>
  
  <!-- Text decoration -->
  <text x="250" y="330" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12">Lesson Progress</text>
  
  <!-- Additional decorative dots -->
  <circle cx="150" cy="130" r="1.5" fill="#bdc3c7"/>
  <circle cx="170" cy="130" r="1.5" fill="#bdc3c7"/>
  <circle cx="190" cy="130" r="1.5" fill="#bdc3c7"/>
  <circle cx="310" cy="130" r="1.5" fill="#bdc3c7"/>
  <circle cx="330" cy="130" r="1.5" fill="#bdc3c7"/>
  <circle cx="350" cy="130" r="1.5" fill="#bdc3c7"/>
  
  <!-- Small book icon 2 -->
  <g transform="translate(20, 320)">
    <rect x="0" y="0" width="15" height="20" rx="1" fill="#9b59b6"/>
    <rect x="2" y="2" width="11" height="16" fill="white"/>
    <line x1="2" y1="6" x2="13" y2="6" stroke="#9b59b6" stroke-width="0.5"/>
    <line x1="2" y1="9" x2="13" y2="9" stroke="#9b59b6" stroke-width="0.5"/>
    <line x1="2" y1="12" x2="13" y2="12" stroke="#9b59b6" stroke-width="0.5"/>
  </g>
  
  <!-- Small book icon 3 -->
  <g transform="translate(465, 320)">
    <rect x="0" y="0" width="15" height="20" rx="1" fill="#1abc9c"/>
    <rect x="2" y="2" width="11" height="16" fill="white"/>
    <line x1="2" y1="6" x2="13" y2="6" stroke="#1abc9c" stroke-width="0.5"/>
    <line x1="2" y1="9" x2="13" y2="9" stroke="#1abc9c" stroke-width="0.5"/>
    <line x1="2" y1="12" x2="13" y2="12" stroke="#1abc9c" stroke-width="0.5"/>
  </g>
  
  <!-- Musical note -->
  <g transform="translate(440, 250)">
    <ellipse cx="5" cy="15" rx="4" ry="3" fill="#e67e22"/>
    <ellipse cx="12" cy="12" rx="4" ry="3" fill="#e67e22"/>
    <rect x="7" y="5" width="2" height="10" fill="#e67e22"/>
    <rect x="14" y="2" width="2" height="10" fill="#e67e22"/>
    <path d="M 9 5 Q 12 8 16 2" stroke="#e67e22" stroke-width="2" fill="none"/>
  </g>
</svg>