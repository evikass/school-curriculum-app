<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="#2c5aa0" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Название урока -->
  <text x="250" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c5aa0">
    Урок 42: Генетика пола
  </text>
  
  <!-- Хромосома X -->
  <g transform="translate(100, 150)">
    <rect x="-15" y="-40" width="30" height="80" rx="15" fill="#ff6b9d" opacity="0.8"/>
    <circle cx="0" cy="-40" r="8" fill="#ff6b9d"/>
    <circle cx="0" cy="40" r="8" fill="#ff6b9d"/>
    <text x="0" y="-60" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">X</text>
  </g>
  
  <!-- Хромосома Y -->
  <g transform="translate(200, 150)">
    <rect x="-10" y="-40" width="20" height="80" rx="10" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="0" cy="-40" r="6" fill="#4ecdc4"/>
    <circle cx="0" cy="0" r="6" fill="#4ecdc4"/>
    <circle cx="0" cy="40" r="6" fill="#4ecdc4"/>
    <rect x="-15" y="0" width="30" height="15" rx="7" fill="#4ecdc4"/>
    <text x="0" y="-60" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#333">Y</text>
  </g>
  
  <!-- Мужчина -->
  <g transform="translate(350, 150)">
    <circle cx="0" cy="-30" r="20" fill="#4a90e2" stroke="#333" stroke-width="2"/>
    <rect x="-15" y="-10" width="30" height="40" rx="5" fill="#4a90e2" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-35" y2="-20" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="35" y2="-20" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="30" x2="-20" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="20" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">♂ Мужчина</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">XY</text>
  </g>
  
  <!-- Женщина -->
  <g transform="translate(150, 250)">
    <circle cx="0" cy="-30" r="20" fill="#e74c3c" stroke="#333" stroke-width="2"/>
    <rect x="-15" y="-10" width="30" height="40" rx="5" fill="#e74c3c" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-35" y2="-20" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="35" y2="-20" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="30" x2="-20" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="20" y2="60" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="-60" x2="5" y2="-60" stroke="#333" stroke-width="3"/>
    <line x1="0" y1="-65" x2="0" y2="-55" stroke="#333" stroke-width="3"/>
    <text x="0" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">♀ Женщина</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">XX</text>
  </g>
  
  <!-- Стрелки от хромосом к полам -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <line x1="150" y1="150" x2="170" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="150" x2="330" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Гены на X хромосоме -->
  <g transform="translate(100, 150)">
    <circle cx="-10" cy="-10" r="4" fill="#333"/>
    <circle cx="10" cy="0" r="4" fill="#333"/>
    <circle cx="-10" cy="10" r="4" fill="#333"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">гены</text>
  </g>
  
  <!-- Блок информации -->
  <rect x="250" y="180" width="200" height="120" rx="10" fill="white" stroke="#2c5aa0" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="205" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2c5aa0">
    Факты:
  </text>
  <text x="260" y="230" font-family="Arial" font-size="12" fill="#333">
    • X-хромосома содержит
  </text>
  <text x="270" y="245" font-family="Arial" font-size="12" fill="#333">
    больше генов
  </text>
  <text x="260" y="265" font-family="Arial" font-size="12" fill="#333">
    • Y-хромосома
  </text>
  <text x="270" y="280" font-family="Arial" font-size="12" fill="#333">
    определяет мужской пол
  </text>
  
  <!-- ДНК спираль (декоративная) -->
  <g transform="translate(50, 300)">
    <path d="M0,0 Q10,-10 20,0 T40,0 T60,0 T80,0 T100,0" stroke="#4ecdc4" stroke-width="3" fill="none"/>
    <path d="M0,10 Q10,20 20,10 T40,10 T60,10 T80,10 T100,10" stroke="#ff6b9d" stroke-width="3" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="10" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Ядро клетки -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="30" fill="#f39c12" opacity="0.3" stroke="#f39c12" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">ядро</text>
  </g>
  
  <!-- Молекула ДНК (декоративная) -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="15" height="80" rx="7" fill="#8e44ad" opacity="0.7"/>
    <rect x="20" y="0" width="15" height="80" rx="7" fill="#3498db" opacity="0.7"/>
    <line x1="7" y1="10" x2="28" y2="10" stroke="#666" stroke-width="1"/>
    <line x1="7" y1="25" x2="28" y2="25" stroke="#666" stroke-width="1"/>
    <line x1="7" y1="40" x2="28" y2="40" stroke="#666" stroke-width="1"/>
    <line x1="7" y1="55" x2="28" y2="55" stroke="#666" stroke-width="1"/>
    <line x1="7" y1="70" x2="28" y2="70" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Легенда:</text>
    <rect x="10" y="30" width="15" height="10" fill="#ff6b9d"/>
    <text x="30" y="38" font-family="Arial" font-size="10" fill="#333">X-хромосома</text>
    <rect x="10" y="45" width="15" height="10" fill="#4ecdc4"/>
    <text x="30" y="53" font-family="Arial" font-size="10" fill="#333">Y-хромосома</text>
  </g>
  
  <!-- Анимация пульсации для заголовка -->
  <animateTransform attributeName="transform" attributeType="XML" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" additive="sum"/>
</svg>