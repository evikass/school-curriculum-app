<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <pattern id="grassPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#228B22"/>
      <path d="M5,15 Q10,10 15,15" stroke="#32CD32" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Небо -->
  <rect x="0" y="0" width="500" height="200" fill="url(#skyGradient)"/>
  
  <!-- Солнце -->
  <circle cx="400" cy="60" r="30" fill="#FFD700" opacity="0.9"/>
  <g transform="translate(400,60)">
    <path d="M0,-40 L0,-50 M28.28,-28.28 L35.35,-35.35 M40,0 L50,0 M28.28,28.28 L35.35,35.35 M0,40 L0,50 M-28.28,28.28 L-35.35,35.35 M-40,0 L-50,0 M-28.28,-28.28 L-35.35,-35.35" 
          stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Облака -->
  <g opacity="0.8">
    <ellipse cx="100" cy="50" rx="25" ry="15" fill="white"/>
    <ellipse cx="120" cy="45" rx="30" ry="18" fill="white"/>
    <ellipse cx="140" cy="50" rx="25" ry="15" fill="white"/>
  </g>
  
  <g opacity="0.7">
    <ellipse cx="300" cy="80" rx="20" ry="12" fill="white"/>
    <ellipse cx="315" cy="77" rx="25" ry="15" fill="white"/>
    <ellipse cx="330" cy="80" rx="20" ry="12" fill="white"/>
  </g>
  
  <!-- Гора -->
  <path d="M0,200 L100,100 L200,200 Z" fill="#8B7D6B" opacity="0.7"/>
  <path d="M150,200 L250,120 L350,200 Z" fill="#A0826D" opacity="0.6"/>
  
  <!-- Земля -->
  <rect x="0" y="200" width="500" height="150" fill="url(#groundGradient)"/>
  
  <!-- Трава -->
  <rect x="0" y="200" width="500" height="20" fill="url(#grassPattern)"/>
  
  <!-- Дерево 1 -->
  <rect x="80" y="150" width="20" height="50" fill="#8B4513"/>
  <circle cx="90" cy="140" r="35" fill="#228B22"/>
  <circle cx="80" cy="130" r="25" fill="#32CD32"/>
  <circle cx="100" cy="135" r="30" fill="#228B22"/>
  
  <!-- Дерево 2 -->
  <rect x="350" y="160" width="15" height="40" fill="#8B4513"/>
  <ellipse cx="357" cy="150" rx="30" ry="40" fill="#228B22"/>
  <ellipse cx="350" cy="140" rx="20" ry="30" fill="#32CD32"/>
  
  <!-- Кустарник -->
  <ellipse cx="200" cy="190" rx="25" ry="15" fill="#228B22"/>
  <ellipse cx="190" cy="185" rx="20" ry="12" fill="#32CD32"/>
  <ellipse cx="210" cy="185" rx="20" ry="12" fill="#32CD32"/>
  
  <!-- Цветок -->
  <g transform="translate(300,185)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#228B22" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#FF69B4"/>
    <circle cx="-5" cy="-5" r="8" fill="#FFB6C1"/>
    <circle cx="5" cy="-5" r="8" fill="#FF69B4"/>
    <circle cx="-5" cy="5" r="8" fill="#FFB6C1"/>
    <circle cx="5" cy="5" r="8" fill="#FF69B4"/>
    <circle cx="0" cy="0" r="5" fill="#FFD700"/>
  </g>
  
  <!-- Животные: Заяц -->
  <g transform="translate(250,180)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#D2691E"/>
    <ellipse cx="-10" cy="-5" rx="8" ry="12" fill="#D2691E"/>
    <ellipse cx="10" cy="-5" rx="8" ry="12" fill="#D2691E"/>
    <circle cx="-5" cy="-10" r="2" fill="black"/>
    <circle cx="5" cy="-10" r="2" fill="black"/>
    <ellipse cx="0" cy="5" rx="3" ry="2" fill="black"/>
  </g>
  
  <!-- Птица -->
  <g transform="translate(150,100)">
    <path d="M0,0 Q-10,-5 -15,0 Q-10,2 0,0" fill="#4682B4"/>
    <path d="M0,0 Q10,-5 15,0 Q10,2 0,0" fill="#4682B4"/>
    <circle cx="0" cy="0" r="3" fill="#2F4F4F"/>
  </g>
  
  <!-- Насекомое: Бабочка -->
  <g transform="translate(180,120)">
    <ellipse cx="-5" cy="0" rx="8" ry="15" fill="#FF6347" opacity="0.8"/>
    <ellipse cx="5" cy="0" rx="8" ry="15" fill="#FF6347" opacity="0.8"/>
    <ellipse cx="-5" cy="-5" rx="6" ry="10" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="5" cy="-5" rx="6" ry="10" fill="#FFD700" opacity="0.8"/>
    <rect x="-1" y="-5" width="2" height="10" fill="#2F4F4F"/>
  </g>
  
  <!-- Река -->
  <path d="M0,250 Q100,240 200,250 T400,250" stroke="#4682B4" stroke-width="8" fill="none" opacity="0.7"/>
  <path d="M0,255 Q100,245 200,255 T400,255" stroke="#87CEEB" stroke-width="4" fill="none" opacity="0.5"/>
  
  <!-- Камни -->
  <ellipse cx="120" cy="210" rx="15" ry="10" fill="#808080"/>
  <ellipse cx="320" cy="215" rx="12" ry="8" fill="#A9A9A9"/>
  <ellipse cx="420" cy="208" rx="18" ry="12" fill="#696969"/>
  
  <!-- Дополнительные растения -->
  <g transform="translate(380,190)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="0" cy="-5" rx="5" ry="10" fill="#32CD32"/>
    <ellipse cx="-5" cy="-3" rx="4" ry="8" fill="#228B22"/>
    <ellipse cx="5" cy="-3" rx="4" ry="8" fill="#228B22"/>
  </g>
  
  <!-- Корни дерева -->
  <g transform="translate(90,200)">
    <path d="M0,0 Q-10,10 -15,20" stroke="#654321" stroke-width="3" fill="none"/>
    <path d="M0,0 Q5,12 10,25" stroke="#654321" stroke-width="3" fill="none"/>
    <path d="M0,0 Q0,15 0,30" stroke="#654321" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Водоросли в реке -->
  <g transform="translate(150,248)">
    <path d="M0,0 Q-5,-10 -5,-20" stroke="#228B22" stroke-width="2" fill="none"/>
    <path d="M0,0 Q5,-10 5,-20" stroke="#228B22" stroke-width="2" fill="none"/>
    <path d="M0,0 Q0,-10 0,-20" stroke="#228B22" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Муравей -->
  <g transform="translate(280,195)">
    <ellipse cx="0" cy="0" rx="5" ry="3" fill="#2F4F4F"/>
    <ellipse cx="-4" cy="-2" rx="3" ry="2" fill="#2F4F4F"/>
    <ellipse cx="4" cy="-2" rx="3" ry="2" fill="#2F4F4F"/>
    <line x1="-5" y1="0" x2="-8" y2="2" stroke="#2F4F4F" stroke-width="1"/>
    <line x1="5" y1="0" x2="8" y2="2" stroke="#2F4F4F" stroke-width="1"/>
    <circle cx="0" cy="0" r="1" fill="white"/>
  </g>
  
  <!-- Паук в паутине -->
  <g transform="translate(220,170)">
    <circle cx="0" cy="0" r="3" fill="#2F4F4F"/>
    <path d="M-10,0 L10,0 M0,-10 L0,10 M-7,-7 L7,7 M-7,7 L7,-7" stroke="#D3D3D3" stroke-width="1"/>
    <path d="M-3,-3 L0,0 M3,-3 L0,0 M-3,3 L0,0 M3,3 L0,0" stroke="#D3D3D3" stroke-width="0.5"/>
  </g>
  
  <!-- Лесная мышь -->
  <g transform="translate(50,185)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#8B4513"/>
    <ellipse cx="-5" cy="-5" rx="5" ry="8" fill="#8B4513"/>
    <circle cx="-3" cy="-8" r="2" fill="black"/>
    <circle cx="-5" cy="-8" r="2" fill="black"/>
    <ellipse cx="0" cy="5" rx="2" ry="1" fill="black"/>
  </g>
  
  <!-- Ягоды на кусте -->
  <g transform="translate(195,180)">
    <circle cx="0" cy="0" r="3" fill="#DC143C"/>
    <circle cx="5" cy="2" r="3" fill="#DC143C"/>
    <circle cx="-5" cy="2" r="3" fill="#DC143C"/>
    <circle cx="0" cy="5" r="3" fill="#DC143C"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F4F4F">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2F4F4F">Урок 58: Экосистема. Биогеоценоз</text>
  
  <!-- Солнечные лучи -->
  <g opacity="0.3">
    <path d="M400,60 L350,90" stroke="#FFD700" stroke-width="2"/>
    <path d="M400,60 L380,110" stroke="#FFD700" stroke-width="2"/>
    <path d="M400,60 L420,110" stroke="#FFD700" stroke-width="2"/>
    <path d="M400,60 L450,90" stroke="#FFD700" stroke-width="2"/>
  </g>
  
  <!-- Тени от деревьев -->
  <ellipse cx="90" cy="220" rx="25" ry="10" fill="#000000" opacity="0.2"/>
  <ellipse cx="357" cy="225" rx="20" ry="8" fill="#000000" opacity="0.2"/>
  
  <!-- Листья на земле -->
  <g transform="translate(150,215)">
    <ellipse cx="0" cy="0" rx="5" ry="3" fill="#8B4513" transform="rotate(45)"/>
    <ellipse cx="10" cy="5" rx="4" ry="2" fill="#A0522D" transform="rotate(-30)"/>
    <ellipse cx="-8" cy="3" rx="4" ry="2" fill="#CD853F" transform="rotate(60)"/>
  </g>
  
  <!-- Дополнительные детали: Птичье гнездо -->
  <g transform="translate(120,130)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#8B4513" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="#D2691E" opacity="0.5"/>
  </g>
  
  <!-- Мох на камне -->
  <g transform="translate(115,205)">
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="#006400" opacity="0.8"/>
    <ellipse cx="-3" cy="-1" rx="3" ry="2" fill="#228B22"/>
    <ellipse cx="3" cy="-1" rx="3" ry="2" fill="#228B22"/>
  </g>
  
  <!-- Бабочка на цветке -->
  <g transform="translate(305,180)">
    <ellipse cx="-3" cy="0" rx="5" ry="10" fill="#FF6347" opacity="0.8"/>
    <ellipse cx="3" cy="0" rx="5" ry="10" fill="#FF6347" opacity="0.8"/>
    <ellipse cx="-3" cy="-3" rx="4" ry="7" fill="#FFD700" opacity="0.8"/>
    <ellipse cx="3" cy="-3" rx="4" ry="7" fill="#FFD700" opacity="0.8"/>
    <rect x="-1" y="-3" width="2" height="8" fill="#2F4F4F"/>
  </g>
</svg>