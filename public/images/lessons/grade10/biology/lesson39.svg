<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- ДНК спираль градиент -->
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5ca0f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6bb0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="50" y="50" width="400" height="40" rx="20" fill="#3498db" filter="url(#shadow)"/>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="white">Урок 39: Третий закон Менделя</text>
  
  <!-- Две ДНК спирали для иллюстрации независимого наследования -->
  <g transform="translate(100, 120)">
    <!-- Левая ДНК -->
    <path d="M 0 0 Q -10 20 0 40 Q 10 60 0 80 Q -10 100 0 120" stroke="url(#dnaGrad)" stroke-width="3" fill="none"/>
    <path d="M 20 0 Q 30 20 20 40 Q 10 60 20 80 Q 30 100 20 120" stroke="url(#dnaGrad)" stroke-width="3" fill="none"/>
    <!-- Соединения -->
    <line x1="0" y1="20" x2="20" y2="20" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="60" x2="20" y2="60" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="100" x2="20" y2="100" stroke="#4a90e2" stroke-width="2"/>
    <!-- Базы -->
    <circle cx="0" cy="20" r="4" fill="#e74c3c"/>
    <circle cx="20" cy="20" r="4" fill="#3498db"/>
    <circle cx="0" cy="60" r="4" fill="#3498db"/>
    <circle cx="20" cy="60" r="4" fill="#e74c3c"/>
    <circle cx="0" cy="100" r="4" fill="#e74c3c"/>
    <circle cx="20" cy="100" r="4" fill="#3498db"/>
  </g>
  
  <!-- Стрелка наследования -->
  <path d="M 150 190 L 250 190" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Правая ДНК с комбинацией -->
  <g transform="translate(280, 120)">
    <path d="M 0 0 Q -10 20 0 40 Q 10 60 0 80 Q -10 100 0 120" stroke="url(#dnaGrad)" stroke-width="3" fill="none"/>
    <path d="M 20 0 Q 30 20 20 40 Q 10 60 20 80 Q 30 100 20 120" stroke="url(#dnaGrad)" stroke-width="3" fill="none"/>
    <!-- Новые соединения (независимое наследование) -->
    <line x1="0" y1="20" x2="20" y2="20" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="60" x2="20" y2="60" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="100" x2="20" y2="100" stroke="#4a90e2" stroke-width="2"/>
    <!-- Новые комбинации баз -->
    <circle cx="0" cy="20" r="4" fill="#e74c3c"/>
    <circle cx="20" cy="20" r="4" fill="#f39c12"/>
    <circle cx="0" cy="60" r="4" fill="#3498db"/>
    <circle cx="20" cy="60" r="4" fill="#e74c3c"/>
    <circle cx="0" cy="100" r="4" fill="#f39c12"/>
    <circle cx="20" cy="100" r="4" fill="#3498db"/>
  </g>
  
  <!-- Поясняющий текст -->
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Родительские аллели</text>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Новые комбинации</text>
  
  <!-- Центральная формула -->
  <rect x="175" y="210" width="150" height="60" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">AaBb × AaBb</text>
  <text x="250" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">→ 9:3:3:1</text>
  
  <!-- Легенда -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="15" height="15" fill="#e74c3c"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Аллель A</text>
    
    <rect x="80" y="0" width="15" height="15" fill="#3498db"/>
    <text x="100" y="12" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Аллель a</text>
    
    <rect x="160" y="0" width="15" height="15" fill="#f39c12"/>
    <text x="180" y="12" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Аллель B</text>
    
    <rect x="240" y="0" width="15" height="15" fill="#27ae60"/>
    <text x="260" y="12" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Аллель b</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="450" cy="100" r="3" fill="#3498db" opacity="0.6"/>
  <circle cx="440" cy="110" r="2" fill="#e74c3c" opacity="0.6"/>
  <circle cx="460" cy="115" r="2.5" fill="#f39c12" opacity="0.6"/>
  
  <!-- Пунктирная линия разделения -->
  <line x1="50" y1="105" x2="450" y2="105" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Мнемоническая диаграмма -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="120" height="80" rx="5" fill="#fff" stroke="#3498db" stroke-width="2" opacity="0.9"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Фенотипы:</text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">9 A_B_</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">3 A_bb</text>
    <text x="60" y="61" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">3 aaB_</text>
    <text x="60" y="74" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">1 aabb</text>
  </g>
  
  <!-- ДНК молекула сверху -->
  <g transform="translate(200, 90)">
    <ellipse cx="0" cy="0" rx="25" ry="5" fill="#5ca0f2" opacity="0.3"/>
    <ellipse cx="0" cy="10" rx="25" ry="5" fill="#5ca0f2" opacity="0.3"/>
    <ellipse cx="0" cy="20" rx="25" ry="5" fill="#5ca0f2" opacity="0.3"/>
  </g>
</svg>