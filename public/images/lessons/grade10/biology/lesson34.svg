<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e">
    Урок 34: Образование половых клеток — гаметогенез
  </text>
  
  <!-- Схема сперматогенеза -->
  <g transform="translate(50, 80)">
    <!-- Название процесса -->
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      СПЕРМАТОГЕНЕЗ
    </text>
    
    <!-- Стадии сперматогенеза -->
    <!-- Стадия 1: Сперматогония -->
    <circle cx="30" cy="40" r="20" fill="#3498db" opacity="0.8"/>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">46</text>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Сперматогония</text>
    <text x="30" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">диплоидная</text>
    
    <!-- Стадия 2: Сперматоциты -->
    <circle cx="100" cy="40" r="20" fill="#e74c3c" opacity="0.8"/>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">46</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Сперматоцит I</text>
    <text x="100" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">мейоз I</text>
    
    <circle cx="170" cy="40" r="20" fill="#e74c3c" opacity="0.8"/>
    <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">23</text>
    <text x="170" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Сперматоцит II</text>
    <text x="170" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">мейоз II</text>
    
    <!-- Стадия 3: Сперматиды -->
    <circle cx="240" cy="40" r="15" fill="#f39c12" opacity="0.8"/>
    <text x="240" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">23</text>
    <text x="240" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Сперматиды</text>
    <text x="240" y="85" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">гаплоидные</text>
    
    <!-- Стадия 4: Сперматозоиды -->
    <ellipse cx="300" cy="40" rx="12" ry="20" fill="#27ae60" opacity="0.8"/>
    <path d="M300,20 L300,0 M295,5 L300,0 L305,5" stroke="#27ae60" stroke-width="2" fill="none"/>
    <text x="300" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Сперматозоид</text>
    <text x="300" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">зрелый</text>
    
    <!-- Стрелки -->
    <path d="M50,40 L80,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M120,40 L150,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M190,40 L225,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M255,40 L285,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Деление -->
    <path d="M100,40 Q100,120 170,40" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
    <text x="135" y="85" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#e74c3c">2 клетки</text>
  </g>
  
  <!-- Схема оогенеза -->
  <g transform="translate(50, 200)">
    <!-- Название процесса -->
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      ООГЕНЕЗ
    </text>
    
    <!-- Стадии оогенеза -->
    <!-- Стадия 1: Оогония -->
    <circle cx="30" cy="40" r="20" fill="#3498db" opacity="0.8"/>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">46</text>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Оогония</text>
    <text x="30" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">диплоидная</text>
    
    <!-- Стадия 2: Ооциты -->
    <circle cx="100" cy="40" r="20" fill="#9b59b6" opacity="0.8"/>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">46</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Ооцит I</text>
    <text x="100" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">мейоз I</text>
    
    <circle cx="170" cy="40" r="20" fill="#9b59b6" opacity="0.8"/>
    <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">23</text>
    <text x="170" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Ооцит II</text>
    <text x="170" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">мейоз II</text>
    
    <!-- Стадия 3: Полярные тельца -->
    <circle cx="240" cy="20" r="8" fill="#e74c3c" opacity="0.6"/>
    <text x="240" y="24" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">23</text>
    <text x="240" y="45" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">I полярное тело</text>
    
    <circle cx="240" cy="60" r="8" fill="#e74c3c" opacity="0.6"/>
    <text x="240" y="64" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">23</text>
    <text x="240" y="80" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">II полярные тела</text>
    
    <!-- Стадия 4: Яйцеклетка -->
    <ellipse cx="300" cy="40" rx="18" ry="25" fill="#f1c40f" opacity="0.8"/>
    <ellipse cx="300" cy="35" rx="15" ry="20" fill="#f39c12" opacity="0.6"/>
    <text x="300" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Яйцеклетка</text>
    <text x="300" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">зрелая</text>
    
    <!-- Стрелки -->
    <path d="M50,40 L80,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M120,40 L150,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M190,40 L225,20" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M190,40 L225,60" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M250,40 L280,40" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Деление -->
    <path d="M100,40 Q100,120 170,40" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
    <text x="135" y="85" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#9b59b6">1 клетка + 1 тельце</text>
  </g>
  
  <!-- Объяснение -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="110" height="200" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="55" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Ключевые различия
    </text>
    
    <text x="5" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Сперматогенез:
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - 4 сперматозоида
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - 2 недели
    </text>
    
    <text x="5" y="95" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Оогенез:
    </text>
    <text x="10" y="110" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - 1 яйцеклетка
    </text>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - полярные тельца
    </text>
    <text x="10" y="140" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - 25-50 лет
    </text>
    
    <text x="5" y="165" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Общее: мейоз
    </text>
    <text x="10" y="180" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - уменьшение хромосом
    </text>
    <text x="10" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      - генетическое разнообразие
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="20" cy="20" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="480" cy="20" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="20" cy="330" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="480" cy="330" r="3" fill="#f39c12" opacity="0.5"/>
  
  <!-- Определения -->
  <g transform="translate(50, 310)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">Гаметогенез</tspan> — процесс образования половых клеток (гамет)
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">Сперматогенез</tspan> — образование сперматозоидов в семенниках
    </text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">Оогенез</tspan> — образование яйцеклеток в яичниках
    </text>
  </g>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>