<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные линии -->
  <line x1="0" y1="60" x2="500" y2="60" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="0" y1="290" x2="500" y2="290" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Заголовок -->
  <rect x="50" y="10" width="400" height="50" rx="5" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="250" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="90" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Урок 51: Макроэволюция и её доказательства</text>
  
  <!-- Основные разделы -->
  <!-- Палеонтологические доказательства -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="210" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="105" y="25" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Палеонтологические</text>
    <text x="105" y="45" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14">Доказательства</text>
    <!-- Иконка костей -->
    <path d="M 50 55 L 50 65 M 55 55 L 55 65 M 60 55 L 60 65 M 65 55 L 65 65 M 70 55 L 70 65 M 75 55 L 75 65 M 80 55 L 80 65 M 85 55 L 85 65 M 90 55 L 90 65 M 95 55 L 95 65 M 100 55 L 100 65 M 105 55 L 105 65 M 110 55 L 110 65 M 115 55 L 115 65 M 120 55 L 120 65 M 125 55 L 125 65 M 130 55 L 130 65 M 135 55 L 135 65 M 140 55 L 140 65 M 145 55 L 145 65 M 150 55 L 150 65" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="60" r="3" fill="#1e40af"/>
    <circle cx="150" cy="60" r="3" fill="#1e40af"/>
  </g>
  
  <!-- Эмбриологические доказательства -->
  <g transform="translate(260, 120)">
    <rect x="0" y="0" width="210" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="105" y="25" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Эмбриологические</text>
    <text x="105" y="45" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="14">Доказательства</text>
    <!-- Иконка эмбриона -->
    <ellipse cx="105" cy="62" rx="25" ry="10" fill="none" stroke="#166534" stroke-width="2"/>
    <circle cx="95" cy="60" r="5" fill="#166534"/>
    <circle cx="115" cy="60" r="5" fill="#166534"/>
  </g>
  
  <!-- Comparative anatomy -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="210" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="105" y="25" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Сравнительная</text>
    <text x="105" y="45" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="14">Анатомия</text>
    <!-- Иконка скелетов -->
    <path d="M 60 55 L 60 65 M 65 55 L 65 65 M 70 55 L 70 65 M 75 55 L 75 65" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 130 55 L 130 65 M 135 55 L 135 65 M 140 55 L 140 65 M 145 55 L 145 65" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 95 60 Q 105 55 115 60" stroke="#92400e" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Генетические доказательства -->
  <g transform="translate(260, 220)">
    <rect x="0" y="0" width="210" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="105" y="25" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Генетические</text>
    <text x="105" y="45" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="14">Доказательства</text>
    <!-- Иконка ДНК -->
    <path d="M 80 60 Q 90 55 100 60 Q 110 65 120 60" stroke="#831843" stroke-width="2" fill="none"/>
    <path d="M 80 65 Q 90 70 100 65 Q 110 60 120 65" stroke="#831843" stroke-width="2" fill="none"/>
    <line x1="80" y1="60" x2="80" y2="65" stroke="#831843" stroke-width="1"/>
    <line x1="90" y1="55" x2="90" y2="70" stroke="#831843" stroke-width="1"/>
    <line x1="100" y1="60" x2="100" y2="65" stroke="#831843" stroke-width="1"/>
    <line x1="110" y1="65" x2="110" y2="60" stroke="#831843" stroke-width="1"/>
    <line x1="120" y1="60" x2="120" y2="65" stroke="#831843" stroke-width="1"/>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Стрелки между блоками -->
  <path d="M 240 160 L 260 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 150 200 L 150 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 260 200 L 260 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 240 260 L 260 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определение макроэволюции -->
  <rect x="50" y="310" width="400" height="30" rx="15" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="250" y="330" text-anchor="middle" fill="#0369a1" font-family="Arial, sans-serif" font-size="12" font-style="italic">Макроэволюция - крупные эволюционные изменения, ведущие к образованию таксономических групп выше вида</text>
  
  <!-- Декоративные элементы -->
  <circle cx="20" cy="20" r="3" fill="#64748b" opacity="0.5"/>
  <circle cx="480" cy="20" r="3" fill="#64748b" opacity="0.5"/>
  <circle cx="20" cy="330" r="3" fill="#64748b" opacity="0.5"/>
  <circle cx="480" cy="330" r="3" fill="#64748b" opacity="0.5"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>