<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для ДНК -->
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4169e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Урок 44: Взаимодействие генов</text>
  
  <!-- Двойная спираль ДНК в центре -->
  <g transform="translate(250, 175)">
    <!-- Левая спираль -->
    <path d="M -30,-60 Q -25,-40 -30,-20 T -30,20 Q -25,40 -30,60" 
          stroke="url(#dnaGrad)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Правая спираль -->
    <path d="M 30,-60 Q 25,-40 30,-20 T 30,20 Q 25,40 30,60" 
          stroke="url(#dnaGrad)" stroke-width="4" fill="none" opacity="0.8"/>
    
    <!-- Поперечные связи -->
    <line x1="-25" y1="-50" x2="25" y2="-50" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="30" x2="25" y2="30" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="40" x2="30" y2="40" stroke="#666" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="50" x2="25" y2="50" stroke="#666" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Слева: Комплементарность -->
  <g transform="translate(80, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Комплементарность</text>
    <circle cx="-20" cy="10" r="8" fill="#e74c3c"/>
    <text x="-20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">→</text>
    <circle cx="20" cy="10" r="8" fill="#2ecc71"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">T</text>
  </g>
  
   <!-- Справа: Эпистаз -->
  <g transform="translate(420, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#fff" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Эпистаз</text>
    <circle cx="-20" cy="10" r="8" fill="#3498db"/>
    <text x="-20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">↓</text>
    <circle cx="20" cy="10" r="8" fill="#95a5a6"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">_</text>
  </g>
  
  <!-- Схемы взаимодействия генов -->
  <!-- Полимерия -->
  <g transform="translate(100, 250)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Полимерия</text>
    <rect x="-30" y="5" width="10" height="10" fill="#f39c12"/>
    <rect x="-15" y="5" width="10" height="10" fill="#f39c12"/>
    <rect x="0" y="5" width="10" height="10" fill="#f39c12"/>
    <rect x="15" y="5" width="10" height="10" fill="#f39c12"/>
  </g>
  
  <!-- Плеiotropия -->
  <g transform="translate(200, 250)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#fff" stroke="#16a085" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Плеiotropия</text>
    <circle cx="-15" cy="10" r="6" fill="#1abc9c"/>
    <circle cx="0" cy="10" r="6" fill="#1abc9c"/>
    <circle cx="15" cy="10" r="6" fill="#1abc9c"/>
    <line x1="-15" y1="10" x2="0" y2="10" stroke="#16a085" stroke-width="2"/>
    <line x1="0" y1="10" x2="15" y2="10" stroke="#16a085" stroke-width="2"/>
  </g>
  
  <!-- Кодоминирование -->
  <g transform="translate(300, 250)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Кодоминир.</text>
    <circle cx="-15" cy="10" r="6" fill="#e74c3c"/>
    <circle cx="15" cy="10" r="6" fill="#3498db"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">AB</text>
  </g>
  
  <!-- Взаимодействие -->
  <g transform="translate(400, 250)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Взаимод.</text>
    <rect x="-20" y="5" width="8" height="8" fill="#9b59b6"/>
    <rect x="-8" y="5" width="8" height="8" fill="#e74c3c"/>
    <rect x="4" y="5" width="8" height="8" fill="#3498db"/>
    <rect x="12" y="5" width="8" height="8" fill="#2ecc71"/>
  </g>
  
  <!-- Соединительные линии -->
  <path d="M 140 110 Q 250 130 360 110" stroke="#bdc3c7" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Легенда -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Аллели:</text>
    <circle cx="10" cy="10" r="5" fill="#e74c3c"/>
    <text x="20" y="14" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">доминантный</text>
    <circle cx="10" cy="25" r="5" fill="#95a5a6"/>
    <text x="20" y="29" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">рецессивный</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="3" fill="#3498db"/>
    <circle cx="450" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="80" cy="300" r="3" fill="#2ecc71"/>
    <circle cx="420" cy="320" r="3" fill="#f39c12"/>
    <circle cx="250" cy="300" r="3" fill="#9b59b6"/>
  </g>
  
  <!-- Стрелки указания -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Указатели -->
  <line x1="180" y1="170" x2="210" y2="175" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="170" x2="290" y2="175" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Дополнительные генетические символы -->
  <g transform="translate(250, 90)" opacity="0.5">
    <text x="-40" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Aa</text>
    <text x="-10" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Bb</text>
    <text x="20" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Cc</text>
    <text x="50" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Dd</text>
  </g>
</svg>