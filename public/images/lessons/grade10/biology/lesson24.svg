<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495e">Урок 24: Гликолиз</text>
  
  <!-- Клеточная мембрана -->
  <rect x="30" y="90" width="440" height="240" rx="10" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Цитоплазма -->
  <rect x="40" y="100" width="420" height="220" rx="8" fill="#ecf0f1" opacity="0.5"/>
  
  <!-- Ядро -->
  <ellipse cx="430" cy="200" rx="30" ry="40" fill="#e74c3c" opacity="0.3"/>
  <ellipse cx="430" cy="200" rx="25" ry="35" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  
  <!-- Глюкоза -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="0" r="15" fill="#f39c12"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="white" font-weight="bold">C₆</text>
    <text x="0" y="-25" text-anchor="middle" font-size="11" fill="#2c3e50">Глюкоза</text>
  </g>
  
  <!-- Аденозинтрифосфат (АТФ) -->
  <g transform="translate(150, 140)">
    <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#27ae60"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="white">АТФ</text>
  </g>
  
  <!-- Промежуточные соединения -->
  <g transform="translate(220, 140)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#9b59b6"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" fill="white">C₃H₄O₃</text>
    <text x="0" y="-20" text-anchor="middle" font-size="10" fill="#2c3e50">Гликолиз</text>
  </g>
  
  <!-- Пируват -->
  <g transform="translate(290, 140)">
    <rect x="-18" y="-10" width="36" height="20" rx="5" fill="#e67e22"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="white">Пируват</text>
    <text x="0" y="-25" text-anchor="middle" font-size="10" fill="#2c3e50">Пировиноградная кислота</text>
  </g>
  
  <!-- АДФ -->
  <g transform="translate(360, 140)">
    <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#16a085"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="white">АДФ</text>
  </g>
  
  <!-- Ферменты -->
  <circle cx="115" cy="190" r="8" fill="#34495e"/>
  <text x="115" y="194" text-anchor="middle" font-size="8" fill="white">1</text>
  
  <circle cx="185" cy="190" r="8" fill="#34495e"/>
  <text x="185" y="194" text-anchor="middle" font-size="8" fill="white">2</text>
  
  <circle cx="255" cy="190" r="8" fill="#34495e"/>
  <text x="255" y="194" text-anchor="middle" font-size="8" fill="white">3</text>
  
  <circle cx="325" cy="190" r="8" fill="#34495e"/>
  <text x="325" y="194" text-anchor="middle" font-size="8" fill="white">4</text>
  
  <!-- Стрелки реакции -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Стрелки между молекулами -->
  <line x1="95" y1="140" x2="135" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="165" y1="140" x2="200" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="140" x2="272" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Гликолиз внутри клетки -->
  <g transform="translate(80, 220)">
    <rect x="-5" y="-15" width="300" height="60" rx="5" fill="#3498db" opacity="0.1"/>
    <text x="145" y="5" text-anchor="middle" font-size="12" fill="#2c3e50" font-weight="bold">Гликолиз в цитоплазме клетки</text>
    <text x="145" y="20" text-anchor="middle" font-size="10" fill="#7f8c8d">Бескислородный распад глюкозы</text>
  </g>
  
  <!-- NAD+ и NADH -->
  <g transform="translate(420, 250)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#8e44ad"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" fill="white">NAD+</text>
  </g>
  
  <g transform="translate(420, 280)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#9b59b6"/>
    <text x="0" y="3" text-anchor="middle" font-size="9" fill="white">NADH</text>
  </g>
  
  <!-- Метки реакций -->
  <text x="115" y="170" text-anchor="middle" font-size="9" fill="#7f8c8d">Гексокиназа</text>
  <text x="185" y="170" text-anchor="middle" font-size="9" fill="#7f8c8d">Фосфофруктокиназа</text>
  <text x="255" y="170" text-anchor="middle" font-size="9" fill="#7f8c8d">Триозофосфатизомераза</text>
  <text x="325" y="170" text-anchor="middle" font-size="9" fill="#7f8c8d">Пируваткиназа</text>
  
  <!-- Энергетический баланс -->
  <g transform="translate(100, 80)">
    <text x="0" y="0" font-size="11" fill="#e74c3c" font-weight="bold">Энергетический баланс:</text>
    <text x="0" y="15" font-size="10" fill="#2c3e50">2 АТФ → 4 АТФ (прибыль 2 АТФ)</text>
    <text x="0" y="30" font-size="10" fill="#2c3e50">2 NADH</text>
  </g>
  
  <!-- Микрохондрия (для контекста) -->
  <ellipse cx="430" cy="130" rx="25" ry="15" fill="#95a5a6" opacity="0.3"/>
  <ellipse cx="430" cy="130" rx="20" ry="12" fill="none" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Водородные ионы -->
  <circle cx="200" cy="250" r="3" fill="#3498db"/>
  <text x="200" y="253" text-anchor="middle" font-size="6" fill="white">H+</text>
  
  <circle cx="210" cy="260" r="3" fill="#3498db"/>
  <text x="210" y="263" text-anchor="middle" font-size="6" fill="white">H+</text>
  
  <!-- Легенда -->
  <g transform="translate(30, 300)">
    <text x="0" y="0" font-size="10" fill="#7f8c8d" font-weight="bold">Легенда:</text>
    <rect x="0" y="5" width="15" height="10" fill="#f39c12"/>
    <text x="20" y="13" font-size="9" fill="#2c3e50">Сахар</text>
    
    <rect x="60" y="5" width="15" height="10" fill="#27ae60"/>
    <text x="80" y="13" font-size="9" fill="#2c3e50">АТФ</text>
    
    <rect x="120" y="5" width="15" height="10" fill="#e67e22"/>
    <text x="140" y="13" font-size="9" fill="#2c3e50">Продукт</text>
    
    <rect x="200" y="5" width="15" height="10" fill="#34495e"/>
    <text x="220" y="13" font-size="9" fill="#2c3e50">Фермент</text>
  </g>
</svg>