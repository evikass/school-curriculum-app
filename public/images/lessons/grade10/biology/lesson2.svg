<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    
    <!-- Паттерн для клетки -->
    <pattern id="cellPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#4a90e2" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e">
    Уровни организации живой материи
  </text>
  
  <!-- Основная диаграмма уровней -->
  <!-- Уровень 1: Молекулярный -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#3498db" filter="url(#shadow)"/>
    <text x="200" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
      1. Молекулярный
    </text>
  </g>
  
  <!-- Связующая линия -->
  <line x1="250" y1="115" x2="250" y2="130" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Уровень 2: Клеточный -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#2ecc71" filter="url(#shadow)"/>
    <text x="200" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
      2. Клеточный
    </text>
    <rect x="20" y="8" width="30" height="20" fill="url(#cellPattern)" opacity="0.5"/>
  </g>
  
  <!-- Связующая линия -->
  <line x1="250" y1="165" x2="250" y2="180" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Уровень 3: Тканевый -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="200" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
      3. Тканевый
    </text>
  </g>
  
  <!-- Связующая линия -->
  <line x1="250" y1="215" x2="250" y2="230" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Уровень 4: Органный -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#f39c12" filter="url(#shadow)"/>
    <text x="200" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
      4. Органный
    </text>
  </g>
  
  <!-- Связующая линия -->
  <line x1="250" y1="265" x2="250" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Уровень 5: Организменный -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#9b59b6" filter="url(#shadow)"/>
    <text x="200" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">
      5. Организменный
    </text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <!-- Молекулы -->
  <g transform="translate(100, 90)">
    <circle cx="0" cy="0" r="4" fill="#3498db"/>
    <circle cx="8" cy="3" r="4" fill="#e74c3c"/>
    <circle cx="4" cy="8" r="4" fill="#2ecc71"/>
    <line x1="0" y1="0" x2="8" y2="3" stroke="#34495e" stroke-width="1"/>
    <line x1="8" y1="3" x2="4" y2="8" stroke="#34495e" stroke-width="1"/>
    <line x1="4" y1="8" x2="0" y2="0" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <g transform="translate(380, 90)">
    <circle cx="0" cy="0" r="4" fill="#f39c12"/>
    <circle cx="8" cy="3" r="4" fill="#9b59b6"/>
    <circle cx="4" cy="8" r="4" fill="#1abc9c"/>
    <line x1="0" y1="0" x2="8" y2="3" stroke="#34495e" stroke-width="1"/>
    <line x1="8" y1="3" x2="4" y2="8" stroke="#34495e" stroke-width="1"/>
    <line x1="4" y1="8" x2="0" y2="0" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Клетки -->
  <g transform="translate(120, 140)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#2ecc71" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#27ae60"/>
  </g>
  
  <g transform="translate(380, 140)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="#2ecc71" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#27ae60"/>
  </g>
  
  <!-- Организм иконка -->
  <g transform="translate(250, 310)">
    <ellipse cx="0" cy="-5" rx="12" ry="15" fill="#9b59b6" opacity="0.7"/>
    <circle cx="0" cy="-20" r="8" fill="#9b59b6" opacity="0.7"/>
    <!-- Руки -->
    <line x1="-10" y1="-10" x2="-20" y2="-5" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="20" y2="-5" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
    <!-- Ноги -->
    <line x1="-5" y1="10" x2="-10" y2="20" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="10" x2="10" y2="20" stroke="#9b59b6" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="250" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="470" cy="100" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="450" cy="300" r="3" fill="#2ecc71" opacity="0.5"/>
  <circle cx="50" cy="200" r="3" fill="#f39c12" opacity="0.5"/>
  
  <!-- Текстовые блоки с примерами -->
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="35" height="20" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
    <text x="17.5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
      ДНК
    </text>
  </g>
  
  <g transform="translate(460, 200)">
    <rect x="0" y="0" width="35" height="20" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
    <text x="17.5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
      Мышцы
    </text>
  </g>
  
  <!-- Линии подключения -->
  <path d="M 460 150 Q 440 150 440 170" stroke="#95a5a6" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  <path d="M 460 210 Q 440 210 440 190" stroke="#95a5a6" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Дополнительные молекулярные структуры -->
  <g transform="translate(100, 140)" opacity="0.6">
    <rect x="0" y="0" width="20" height="5" fill="#3498db"/>
    <rect x="0" y="6" width="15" height="5" fill="#e74c3c"/>
    <rect x="0" y="12" width="18" height="5" fill="#2ecc71"/>
  </g>
  
  <!-- Иконка ДНК -->
  <g transform="translate(100, 200)">
    <path d="M 0 0 Q 5 -5 10 0 T 20 0" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 0 5 Q 5 10 10 5 T 20 5" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M 0 10 Q 5 5 10 10 T 20 10" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 0 15 Q 5 20 10 15 T 20 15" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#95a5a6" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="15" stroke="#95a5a6" stroke-width="1"/>
  </g>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    иерархическая система жизни
  </text>
</svg>