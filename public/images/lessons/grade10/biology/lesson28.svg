<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e8f5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Градиент для хлоропласта -->
    <radialGradient id="chloroGrad">
      <stop offset="0%" style="stop-color:#7cb342;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#558b2f;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">Урок 28: Фотосинтез: темновая фаза</text>
  
  <!-- Хлоропласт -->
  <ellipse cx="250" cy="180" rx="120" ry="80" fill="url(#chloroGrad)" filter="url(#shadow)"/>
  
  <!-- Стержень хлоропласта -->
  <rect x="240" y="100" width="20" height="160" fill="#33691e" opacity="0.6"/>
  
  <!-- Граны (стаканы) внутри хлоропласта -->
  <g id="granes">
    <rect x="180" y="140" width="8" height="60" fill="#1b5e20" opacity="0.7"/>
    <rect x="195" y="130" width="8" height="70" fill="#1b5e20" opacity="0.7"/>
    <rect x="210" y="125" width="8" height="75" fill="#1b5e20" opacity="0.7"/>
    <rect x="225" y="120" width="8" height="80" fill="#1b5e20" opacity="0.7"/>
    <rect x="240" y="118" width="8" height="82" fill="#1b5e20" opacity="0.7"/>
    <rect x="255" y="118" width="8" height="82" fill="#1b5e20" opacity="0.7"/>
    <rect x="270" y="120" width="8" height="80" fill="#1b5e20" opacity="0.7"/>
    <rect x="285" y="125" width="8" height="75" fill="#1b5e20" opacity="0.7"/>
    <rect x="300" y="130" width="8" height="70" fill="#1b5e20" opacity="0.7"/>
    <rect x="315" y="140" width="8" height="60" fill="#1b5e20" opacity="0.7"/>
  </g>
  
  <!-- АТФ (три фосфатных группы) -->
  <g id="atp" transform="translate(80, 120)">
    <circle cx="0" cy="0" r="15" fill="#ff6f00" stroke="#e65100" stroke-width="2"/>
    <circle cx="25" cy="0" r="15" fill="#ff8f00" stroke="#e65100" stroke-width="2"/>
    <circle cx="50" cy="0" r="15" fill="#ffa000" stroke="#e65100" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="white">А</text>
    <text x="25" y="5" text-anchor="middle" font-size="10" fill="white">Д</text>
    <text x="50" y="5" text-anchor="middle" font-size="10" fill="white">Ф</text>
  </g>
  
  <!-- NADPH -->
  <g id="nadph" transform="translate(370, 120)">
    <rect x="-30" y="-15" width="60" height="30" rx="15" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="white" font-weight="bold">NADPH</text>
  </g>
  
  <!-- CO2 -->
  <g id="co2" transform="translate(80, 220)">
    <circle cx="0" cy="0" r="20" fill="#37474f" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="white" font-weight="bold">CO₂</text>
  </g>
  
  <!-- Рибулозобисфосфат (RuBP) -->
  <g id="rubp" transform="translate(370, 220)">
    <rect x="-35" y="-15" width="70" height="30" rx="5" fill="#00897b" stroke="#004d40" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" fill="white" font-weight="bold">RuBP</text>
  </g>
  
  <!-- Стрелки реакций -->
  <!-- АТФ в хлоропласт -->
  <path d="M 130 120 Q 180 140 180 160" stroke="#ff6f00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  
  <!-- NADPH в хлоропласт -->
  <path d="M 340 120 Q 300 140 300 160" stroke="#7b1fa2" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  
  <!-- CO2 в хлоропласт -->
  <path d="M 100 220 Q 150 200 180 190" stroke="#37474f" stroke-width="3" fill="none" marker-end="url(#arrowGray)"/>
  
  <!-- RuBP в хлоропласт -->
  <path d="M 335 220 Q 290 200 300 190" stroke="#00897b" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>
  
  <!-- Стрелки для маркеров -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6f00"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b1fa2"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474f"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00897b"/>
    </marker>
  </defs>
  
  <!-- Гликолат (побочный продукт) -->
  <g id="glycolate" transform="translate(250, 280)">
    <rect x="-30" y="-12" width="60" height="24" rx="12" fill="#e53935" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="white">Гликолат</text>
  </g>
  
  <!-- 3-фосфоглицерат (3-PGA) -->
  <g id="3pga" transform="translate(150, 280)">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#1976d2" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="white">3-Фосфоглицерат</text>
  </g>
  
  <!-- Глицерол-3-фосфат (G3P) -->
  <g id="g3p" transform="translate(350, 280)">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#43a047" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="white">G3P</text>
  </g>
  
  <!-- Надписи процессам -->
  <text x="160" y="145" font-size="10" fill="#ff6f00" font-weight="bold">АТФ</text>
  <text x="310" y="145" font-size="10" fill="#7b1fa2" font-weight="bold">NADPH</text>
  <text x="120" y="210" font-size="10" fill="#37474f" font-weight="bold">CO₂</text>
  <text x="315" y="210" font-size="10" fill="#00897b" font-weight="bold">RuBP</text>
  
  <!-- Фаза цикла Кальвина -->
  <circle cx="250" cy="180" r="90" fill="none" stroke="#5e35b1" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="250" y="95" text-anchor="middle" font-size="12" fill="#5e35b1" font-weight="bold">Цикл Кальвина</text>
  
  <!-- Энергетические диаграммы -->
  <g id="energy-diagram" transform="translate(50, 50)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-size="9" fill="#37474f">Энергия</text>
    <rect x="10" y="20" width="60" height="3" fill="#f44336"/>
    <rect x="10" y="30" width="40" height="3" fill="#ff9800"/>
    <rect x="10" y="40" width="20" height="3" fill="#4caf50"/>
    <text x="40" y="55" text-anchor="middle" font-size="8" fill="#37474f">↑</text>
  </g>
  
  <!-- Температурный индикатор -->
  <g id="temp-indicator" transform="translate(370, 50)">
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
    <circle cx="15" cy="20" r="8" fill="#f44336"/>
    <rect x="23" y="10" width="20" height="20" fill="#f44336"/>
    <rect x="23" y="30" width="20" height="5" fill="#424242"/>
    <text x="30" y="15" text-anchor="middle" font-size="10" fill="white" font-weight="bold">25-30°C</text>
  </g>
  
  <!-- PH индикатор -->
  <g id="ph-indicator" transform="translate(50, 300)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
    <rect x="10" y="5" width="40" height="20" fill="#4caf50"/>
    <text x="30" y="18" text-anchor="middle" font-size="10" fill="white" font-weight="bold">pH 7-8</text>
  </g>
  
  <!-- Ингибиторы -->
  <g id="inhibitors" transform="translate(380, 300)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="1"/>
    <text x="30" y="12" text-anchor="middle" font-size="8" fill="#d32f2f">Ингибиторы:</text>
    <text x="30" y="22" text-anchor="middle" font-size="8" fill="#d32f2f">DCMU, O₂</text>
  </g>
  
  <!-- Легенда -->
  <g id="legend" transform="translate(250, 320)">
    <rect x="-60" y="0" width="120" height="25" rx="3" fill="white" opacity="0.8"/>
    <text x="0" y="15" text-anchor="middle" font-size="10" fill="#37474f" font-weight="bold">Темновая фаза</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="80" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="470" cy="80" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="30" cy="270" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="470" cy="270" r="3" fill="#64b5f6" opacity="0.6"/>
  
  <!-- Световые лучи (символ световой фазы) -->
  <g id="light-rays" opacity="0.3">
    <path d="M 150 50 L 180 80" stroke="#ffd54f" stroke-width="2"/>
    <path d="M 170 40 L 190 75" stroke="#ffd54f" stroke-width="2"/>
    <path d="M 190 35 L 200 70" stroke="#ffd54f" stroke-width="2"/>
    <path d="M 310 35 L 300 70" stroke="#ffd54f" stroke-width="2"/>
    <path d="M 330 40 L 310 75" stroke="#ffd54f" stroke-width="2"/>
    <path d="M 350 50 L 320 80" stroke="#ffd54f" stroke-width="2"/>
  </g>
  
  <!-- Ферменты внутри хлоропласта -->
  <g id="enzymes">
    <circle cx="200" cy="150" r="8" fill="#9c27b0" opacity="0.6"/>
    <text x="200" y="154" text-anchor="middle" font-size="6" fill="white">RuBisCO</text>
    
    <circle cx="300" cy="150" r="8" fill="#9c27b0" opacity="0.6"/>
    <text x="300" y="154" text-anchor="middle" font-size="6" fill="white">PGK</text>
    
    <circle cx="250" cy="200" r="8" fill="#9c27b0" opacity="0.6"/>
    <text x="250" y="204" text-anchor="middle" font-size="6" fill="white">GAPDH</text>
  </g>
  
  <!-- Электроны -->
  <g id="electrons">
    <circle cx="160" cy="140" r="4" fill="#ffd600">
      <animate attributeName="cx" values="160;320;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;140;140" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="160" r="4" fill="#ffd600">
      <animate attributeName="cx" values="340;180;340" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;180;160" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Уровень воды -->
  <rect x="220" y="250" width="60" height="2" fill="#2196f3" opacity="0.5"/>
  <text x="250" y="265" text-anchor="middle" font-size="8" fill="#1976d2">H₂O</text>
</svg>