<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для молекул -->
    <radialGradient id="molGrad">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:0.9" />
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Анимация пульсации -->
    <animate id="pulse" attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a237e">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3949ab">
    Урок 23: Энергетический обмен
  </text>
  
  <!-- Подзаголовок 2 -->
  <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5c6bc0">
    Подготовительный этап
  </text>
  
  <!-- Клетка с градиентом -->
  <rect x="50" y="100" width="180" height="120" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    КЛЕТОЧНАЯ МЕМБРАНА
  </text>
  
  <!-- Белки мембраны -->
  <ellipse cx="80" cy="150" rx="15" ry="8" fill="#FF5722" opacity="0.8"/>
  <ellipse cx="120" cy="160" rx="18" ry="10" fill="#FF5722" opacity="0.8"/>
  <ellipse cx="160" cy="155" rx="16" ry="9" fill="#FF5722" opacity="0.8"/>
  <ellipse cx="200" cy="165" rx="14" ry="7" fill="#FF5722" opacity="0.8"/>
  
  <!-- Липиды -->
  <path d="M 70 180 Q 90 170, 110 180 T 150 180 T 190 180 T 210 180" 
        stroke="#9C27B0" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 75 200 Q 95 190, 115 200 T 155 200 T 195 200 T 205 200" 
        stroke="#9C27B0" stroke-width="3" fill="none" opacity="0.7"/>
  
  <!-- Митохондрия -->
  <g transform="translate(280, 100)">
    <rect x="0" y="20" width="120" height="80" rx="15" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
      МИТОХОНДРИЯ
    </text>
    
    <!-- Кристы -->
    <path d="M 20 60 L 20 80 M 40 55 L 40 85 M 60 58 L 60 82 M 80 60 L 80 80 M 100 55 L 100 85" 
          stroke="#FF5722" stroke-width="2"/>
    
    <!-- Матрикс -->
    <ellipse cx="60" cy="120" rx="50" ry="20" fill="#FFCCBC" opacity="0.5"/>
  </g>
  
  <!-- Глюкоза (C6H12O6) -->
  <g transform="translate(50, 250)">
    <circle cx="0" cy="0" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="25" cy="0" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="12.5" cy="-15" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="37.5" cy="-15" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="-12.5" cy="-15" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="12.5" cy="15" r="10" fill="#795548" filter="url(#shadow)"/>
    <circle cx="37.5" cy="15" r="10" fill="#795548" filter="url(#shadow)"/>
    
    <!-- Связи -->
    <line x1="0" y1="0" x2="25" y2="0" stroke="#424242" stroke-width="2"/>
    <line x1="12.5" y1="0" x2="12.5" y2="-15" stroke="#424242" stroke-width="2"/>
    <line x1="25" y1="0" x2="37.5" y2="-15" stroke="#424242" stroke-width="2"/>
    <line x1="0" y1="0" x2="-12.5" y2="-15" stroke="#424242" stroke-width="2"/>
    <line x1="12.5" y1="0" x2="12.5" y2="15" stroke="#424242" stroke-width="2"/>
    <line x1="25" y1="0" x2="37.5" y2="15" stroke="#424242" stroke-width="2"/>
    
    <text x="12.5" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      C₆H₁₂O₆
    </text>
    <text x="12.5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
      Глюкоза
    </text>
  </g>
  
  <!-- Кислород (O2) -->
  <g transform="translate(150, 250)">
    <circle cx="0" cy="0" r="12" fill="#F44336" filter="url(#shadow)"/>
    <circle cx="25" cy="0" r="12" fill="#F44336" filter="url(#shadow)"/>
    <line x1="12" y1="0" x2="13" y2="0" stroke="#D32F2F" stroke-width="3"/>
    
    <text x="12.5" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      O₂
    </text>
    <text x="12.5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
      Кислород
    </text>
  </g>
  
  <!-- АТФ -->
  <g transform="translate(250, 250)">
    <rect x="0" y="-10" width="60" height="40" rx="5" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F57F17">
      ATP
    </text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
      Аденозин
    </text>
    <text x="30" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
      трифосфат
    </text>
  </g>
  
  <!-- Стрелки процессов -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
  </defs>
  
  <!-- Стрелка: глюкоза в клетку -->
  <path d="M 80 240 Q 100 200, 120 160" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Стрелка: кислород в клетку -->
  <path d="M 175 240 Q 180 200, 190 160" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Стрелка: АТФ из митохондрии -->
  <path d="M 340 180 Q 320 220, 300 250" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- CO2 -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="12" fill="#9E9E9E" filter="url(#shadow)"/>
    <circle cx="25" cy="0" r="12" fill="#9E9E9E" filter="url(#shadow)"/>
    <line x1="12" y1="0" x2="13" y2="0" stroke="#757575" stroke-width="3"/>
    
    <text x="12.5" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      CO₂
    </text>
    <text x="12.5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
      Углекислый газ
    </text>
  </g>
  
  <!-- Стрелка: CO2 из клетки -->
  <path d="M 220 140 Q 280 160, 350 250" stroke="#D32F2F" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7" stroke-dasharray="5,5"/>
  
  <!-- Надписи процессов -->
  <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1565C0" transform="rotate(-30 100 210)">
    Поглощение
  </text>
  
  <text x="195" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1565C0" transform="rotate(-15 195 210)">
    Диффузия
  </text>
  
  <text x="320" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1565C0" transform="rotate(45 320 220)">
    Синтез АТФ
  </text>
  
  <text x="280" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D32F2F" transform="rotate(30 280 200)">
    Выделение
  </text>
  
  <!-- Энергетические уровни -->
  <g transform="translate(420, 100)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#424242" stroke-width="2"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#424242" stroke-width="2"/>
    <line x1="-10" y1="30" x2="10" y2="30" stroke="#424242" stroke-width="2"/>
    <line x1="-10" y1="50" x2="10" y2="50" stroke="#424242" stroke-width="2"/>
    <line x1="-10" y1="70" x2="10" y2="70" stroke="#424242" stroke-width="2"/>
    
    <text x="20" y="15" font-family="Arial, sans-serif" font-size="10" fill="#424242">Высокий</text>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Средний</text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#424242">Низкий</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="10" fill="#424242">Энергия</text>
  </g>
  
  <!-- Молекулы воды -->
  <g transform="translate(50, 320)">
    <circle cx="0" cy="0" r="6" fill="#2196F3" opacity="0.7"/>
    <circle cx="15" cy="5" r="5" fill="#E3F2FD" opacity="0.8"/>
    <line x1="5" y1="2" x2="12" y2="4" stroke="#1976D2" stroke-width="2"/>
    <text x="10" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1976D2">H₂O</text>
  </g>
  
  <!-- Дополнительные молекулы для объема -->
  <circle cx="400" cy="280" r="8" fill="#4CAF50" opacity="0.6"/>
  <circle cx="420" cy="290" r="7" fill="#8BC34A" opacity="0.7"/>
  <circle cx="410" cy="270" r="9" fill="#66BB6A" opacity="0.5"/>
  
  <!-- Ионы Na+ -->
  <g transform="translate(380, 150)">
    <circle cx="0" cy="0" r="8" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">Na⁺</text>
  </g>
  
  <!-- Ионы K+ -->
  <g transform="translate(410, 170)">
    <circle cx="0" cy="0" r="8" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">K⁺</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="50" r="3" fill="#4CAF50" opacity="0.5"/>
  <circle cx="470" cy="60" r="3" fill="#2196F3" opacity="0.5"/>
  <circle cx="450" cy="40" r="2" fill="#FF5722" opacity="0.5"/>
  <circle cx="40" cy="320" r="2" fill="#9C27B0" opacity="0.5"/>
  
  <!-- Рамка урока -->
  <rect x="10" y="10" width="480" height="330" rx="5" fill="none" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
</svg>