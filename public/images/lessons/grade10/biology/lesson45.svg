<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Градиент для акцента -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="30" fill="#e8f4fd" opacity="0.6"/>
  <circle cx="50" cy="300" r="25" fill="#e8f4fd" opacity="0.5"/>
  <rect x="420" y="280" width="60" height="60" rx="10" fill="#d4e9ff" opacity="0.4" transform="rotate(45 450 310)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c5aa0" filter="url(#textShadow)">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a90e2">Урок 45: Изменчивость</text>
  
  <!-- Основной раздел - Модификационная изменчивость -->
  <rect x="40" y="90" width="420" height="60" rx="8" fill="white" stroke="#4a90e2" stroke-width="2"/>
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c5aa0">Модификационная изменчивость</text>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="13" fill="#666">Вариации признаков внутри одного генотипа</text>
  
  <!-- Демонстрация с растениями -->
  <g transform="translate(50, 170)">
    <!-- Фон для демонстрации -->
    <rect x="0" y="0" width="400" height="150" rx="5" fill="#f8fbff" stroke="#d0e4ff" stroke-width="1"/>
    
    <!-- Растение 1 - Маленькое -->
    <g transform="translate(50, 100)">
      <rect x="-5" y="0" width="10" height="30" fill="#8b4513"/>
      <ellipse cx="0" cy="0" rx="20" ry="25" fill="#90ee90"/>
      <text x="0" y="-40" text-anchor="middle" font-size="12" fill="#666">Плохие условия</text>
    </g>
    
    <!-- Растение 2 - Среднее -->
    <g transform="translate(150, 100)">
      <rect x="-5" y="0" width="10" height="40" fill="#8b4513"/>
      <ellipse cx="0" cy="0" rx="25" ry="30" fill="#7cfc00"/>
      <text x="0" y="-45" text-anchor="middle" font-size="12" fill="#666">Умеренные условия</text>
    </g>
    
    <!-- Растение 3 - Большое -->
    <g transform="translate(250, 100)">
      <rect x="-5" y="0" width="10" height="50" fill="#8b4513"/>
      <ellipse cx="0" cy="0" rx="30" ry="35" fill="#32cd32"/>
      <text x="0" y="-50" text-anchor="middle" font-size="12" fill="#666">Хорошие условия</text>
    </g>
    
    <!-- Стрелки показывающие влияние среды -->
    <path d="M 50 130 L 50 110" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 150 130 L 150 110" stroke="#ffd93d" stroke-width="2" marker-end="url(#arrowYellow)"/>
    <path d="M 250 130 L 250 110" stroke="#6bcf7f" stroke-width="2" marker-end="url(#arrowGreen)"/>
    
    <!-- Надпись -->
    <text x="200" y="25" text-anchor="middle" font-size="14" fill="#2c5aa0">Разные условия среды → Разные проявления признаков</text>
  </g>
  
  <!-- Стрелки для маркеров -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffd93d"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6bcf7f"/>
    </marker>
  </defs>
  
  <!-- Характеристики модификационной изменчивости -->
  <g transform="translate(40, 330)">
    <!-- Пункт 1 -->
    <circle cx="10" cy="10" r="3" fill="#4a90e2"/>
    <text x="20" y="14" font-size="12" fill="#333">Не наследуется</text>
    
    <!-- Пункт 2 -->
    <circle cx="120" cy="10" r="3" fill="#4a90e2"/>
    <text x="130" y="14" font-size="12" fill="#333">Обратима</text>
    
    <!-- Пункт 3 -->
    <circle cx="230" cy="10" r="3" fill="#4a90e2"/>
    <text x="240" y="14" font-size="12" fill="#333">Количественный характер</text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M 350 180 Q 380 160 410 180" stroke="#d0e4ff" stroke-width="2" fill="none"/>
  <path d="M 350 190 Q 380 170 410 190" stroke="#d0e4ff" stroke-width="2" fill="none"/>
  <path d="M 350 200 Q 380 180 410 200" stroke="#d0e4ff" stroke-width="2" fill="none"/>
  
  <!-- Иконка ДНК -->
  <g transform="translate(420, 100)">
    <path d="M 0 0 Q 5 -5 10 0 Q 15 5 20 0 Q 25 -5 30 0 Q 35 5 40 0" stroke="#4a90e2" stroke-width="2" fill="none"/>
    <path d="M 0 10 Q 5 15 10 10 Q 15 5 20 10 Q 25 15 30 10 Q 35 5 40 10" stroke="#4a90e2" stroke-width="2" fill="none"/>
    <line x1="5" y1="2" x2="5" y2="8" stroke="#4a90e2" stroke-width="1"/>
    <line x1="15" y1="2" x2="15" y2="8" stroke="#4a90e2" stroke-width="1"/>
    <line x1="25" y1="2" x2="25" y2="8" stroke="#4a90e2" stroke-width="1"/>
    <line x1="35" y1="2" x2="35" y2="8" stroke="#4a90e2" stroke-width="1"/>
  </g>
  
  <!-- Диаграмма свойств -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#e8f4fd" stroke="#4a90e2" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" fill="#2c5aa0">Генотип одинаков</text>
    <text x="60" y="35" text-anchor="middle" font-size="11" fill="#2c5aa0">Фенотип различен</text>
  </g>
</svg>