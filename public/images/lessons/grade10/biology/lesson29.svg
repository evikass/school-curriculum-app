<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 29: Биосинтез белка: транскрипция
  </text>
  
  <!-- Ядро клетки -->
  <ellipse cx="250" cy="120" rx="120" ry="80" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">ЯДРО</text>
  <text x="250" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">клетки</text>
  
  <!-- Хромосома -->
  <g transform="translate(250, 120)">
    <path d="M-60,0 Q-50,-20 -30,-20 Q-10,-20 0,-10 Q10,0 30,0 Q50,0 60,20" 
          fill="none" stroke="#8b4513" stroke-width="4"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#654321">Хромосома</text>
  </g>
  
  <!-- ДНК -->
  <g transform="translate(250, 120)">
    <path d="M-40,-5 L40,-5 M-40,5 L40,5" stroke="#ff6b6b" stroke-width="3"/>
    <circle cx="-30" cy="-5" r="4" fill="#ff6b6b"/>
    <circle cx="-10" cy="-5" r="4" fill="#4ecdc4"/>
    <circle cx="10" cy="-5" r="4" fill="#ffe66d"/>
    <circle cx="30" cy="-5" r="4" fill="#ff6b6b"/>
    
    <circle cx="-30" cy="5" r="4" fill="#4ecdc4"/>
    <circle cx="-10" cy="5" r="4" fill="#ff6b6b"/>
    <circle cx="10" cy="5" r="4" fill="#ffe66d"/>
    <circle cx="30" cy="5" r="4" fill="#4ecdc4"/>
    
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ДНК</text>
  </g>
  
  <!-- РНК-полимераза -->
  <g transform="translate(250, 120)">
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="#9b59b6" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">РНК-полимераза</text>
    <path d="M-25,0 L-50,-10 L-50,10 Z" fill="#8e44ad"/>
  </g>
  
  <!-- Стрелка транскрипции -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <path d="M250,200 Q250,220 250,240" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="260" y="225" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Транскрипция</text>
  
  <!-- МРНК -->
  <g transform="translate(250, 260)">
    <rect x="-80" y="-10" width="160" height="20" fill="#95e1d3" stroke="#3fc1c9" stroke-width="2" rx="5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">мРНК</text>
    
    <!-- Нуклеотиды мРНК -->
    <circle cx="-60" cy="0" r="4" fill="#ff6b6b"/>
    <circle cx="-40" cy="0" r="4" fill="#4ecdc4"/>
    <circle cx="-20" cy="0" r="4" fill="#ffe66d"/>
    <circle cx="0" cy="0" r="4" fill="#ff6b6b"/>
    <circle cx="20" cy="0" r="4" fill="#4ecdc4"/>
    <circle cx="40" cy="0" r="4" fill="#ffe66d"/>
    <circle cx="60" cy="0" r="4" fill="#ff6b6b"/>
  </g>
  
  <!-- Этикетки для нуклеотидов -->
  <text x="120" y="265" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">A</text>
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="9" fill="#3fc1c9">U</text>
  <text x="160" y="265" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">G</text>
  <text x="180" y="265" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">A</text>
  
  <!-- Рибосома (фрагмент) -->
  <g transform="translate(250, 310)">
    <ellipse cx="-30" cy="0" rx="20" ry="15" fill="#f39c12" opacity="0.7"/>
    <ellipse cx="30" cy="0" rx="20" ry="15" fill="#e67e22" opacity="0.7"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Рибосома</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="50" cy="100" r="3" fill="#bdc3c7" opacity="0.5"/>
  <circle cx="450" cy="150" r="3" fill="#bdc3c7" opacity="0.5"/>
  <circle cx="80" cy="200" r="3" fill="#bdc3c7" opacity="0.5"/>
  <circle cx="420" cy="280" r="3" fill="#bdc3c7" opacity="0.5"/>
  
  <!-- Указатели на процессы -->
  <line x1="150" y1="120" x2="180" y2="120" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="140" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Гены</text>
  
  <!-- Таблица азотистых оснований -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="80" height="60" fill="white" stroke="#bdc3c7" stroke-width="1" rx="3"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Основания</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">A-T</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#3fc1c9">G-C</text>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">A-U</text>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="9" fill="#3fc1c9">G-C</text>
  </g>
  
  <!-- Флажок важного этапа -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="80" height="40" fill="#f1c40f" stroke="#f39c12" stroke-width="1" rx="5"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2c3e50">Важно!</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Т-А заменяется на А-У</text>
  </g>
  
  <!-- Дополнительные молекулы -->
  <ellipse cx="380" cy="100" rx="15" ry="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" opacity="0.6"/>
  <text x="380" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#16a085">NTP</text>
  
  <!-- Движущие частицы -->
  <circle cx="200" cy="120" r="2" fill="#3498db" opacity="0.8">
    <animate attributeName="cx" values="200;300;200" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="120" r="2" fill="#e74c3c" opacity="0.8">
    <animate attributeName="cx" values="300;200;300" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Легенда -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="100" height="80" fill="white" stroke="#bdc3c7" stroke-width="1" rx="3"/>
    <text x="50" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Легенда</text>
    <circle cx="15" cy="30" r="3" fill="#ff6b6b"/>
    <text x="25" y="34" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Аденин (A)</text>
    <circle cx="15" cy="45" r="3" fill="#4ecdc4"/>
    <text x="25" y="49" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Урацил (U)</text>
    <circle cx="15" cy="60" r="3" fill="#ffe66d"/>
    <text x="25" y="64" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Гуанин (G)</text>
  </g>
</svg>