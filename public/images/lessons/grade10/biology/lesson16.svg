<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </radialGradient>
    
    <!-- Градиент для ЭПС -->
    <linearGradient id="epsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Градиент для Гольджи -->
    <linearGradient id="golgiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4834d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#686de0;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 16: Цитоплазма. Эндоплазматическая сеть и аппарат Гольджи
  </text>
  
  <!-- Клеточная мембрана -->
  <ellipse cx="250" cy="200" rx="180" ry="120" fill="none" stroke="#2c3e50" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Цитоплазма (фон) -->
  <ellipse cx="250" cy="200" rx="175" ry="115" fill="#ffeaa7" opacity="0.3"/>
  
  <!-- Ядро -->
  <circle cx="200" cy="180" r="35" fill="#74b9ff" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="200" cy="180" r="30" fill="#0984e3" opacity="0.8"/>
  <text x="200" y="185" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Ядро</text>
  
  <!-- Эндоплазматическая сеть (гладкая) -->
  <g id="rough-eps">
    <!-- Системы каналов -->
    <path d="M 320 140 Q 340 150, 350 170 T 360 200 Q 355 220, 340 230" 
          fill="none" stroke="url(#epsGrad)" stroke-width="8" opacity="0.9"/>
    <path d="M 310 160 Q 330 170, 340 190 T 350 220" 
          fill="none" stroke="url(#epsGrad)" stroke-width="6" opacity="0.8"/>
    <path d="M 330 150 Q 350 160, 360 180 T 370 210" 
          fill="none" stroke="url(#epsGrad)" stroke-width="7" opacity="0.9"/>
    
    <!-- Рибосомы на гладкой ЭПС -->
    <circle cx="325" cy="155" r="3" fill="#e17055"/>
    <circle cx="340" cy="165" r="3" fill="#e17055"/>
    <circle cx="355" cy="175" r="3" fill="#e17055"/>
    <circle cx="335" cy="185" r="3" fill="#e17055"/>
    <circle cx="345" cy="195" r="3" fill="#e17055"/>
    <circle cx="360" cy="205" r="3" fill="#e17055"/>
  </g>
  
  <!-- Эндоплазматическая сеть (гладкая) -->
  <g id="smooth-eps">
    <path d="M 300 220 Q 320 230, 330 250 T 340 280" 
          fill="none" stroke="#ff7979" stroke-width="6" opacity="0.7"/>
    <path d="M 290 240 Q 310 250, 320 270 T 330 290" 
          fill="none" stroke="#ff7979" stroke-width="5" opacity="0.6"/>
    <path d="M 310 230 Q 330 240, 340 260 T 350 280" 
          fill="none" stroke="#ff7979" stroke-width="6" opacity="0.7"/>
  </g>
  
  <!-- Аппарат Гольджи -->
  <g id="golgi-apparatus">
    <!-- Состоит из цистерн -->
    <path d="M 120 150 Q 150 140, 180 150 Q 150 160, 120 150" 
          fill="url(#golgiGrad)" stroke="#3742fa" stroke-width="2" opacity="0.9"/>
    <path d="M 125 170 Q 155 160, 185 170 Q 155 180, 125 170" 
          fill="url(#golgiGrad)" stroke="#3742fa" stroke-width="2" opacity="0.9"/>
    <path d="M 130 190 Q 160 180, 190 190 Q 160 200, 130 190" 
          fill="url(#gолgiGrad)" stroke="#3742fa" stroke-width="2" opacity="0.9"/>
    <path d="M 135 210 Q 165 200, 195 210 Q 165 220, 135 210" 
          fill="url(#golgiGrad)" stroke="#3742fa" stroke-width="2" opacity="0.9"/>
    
    <!-- Везикулы Гольджи -->
    <circle cx="160" cy="230" r="6" fill="#a29bfe" opacity="0.8"/>
    <circle cx="170" cy="235" r="5" fill="#a29bfe" opacity="0.8"/>
    <circle cx="155" cy="240" r="4" fill="#a29bfe" opacity="0.8"/>
    <circle cx="165" cy="245" r="5" fill="#a29bfe" opacity="0.8"/>
  </g>
  
  <!-- Митохондрия -->
  <g id="mitochondrion">
    <ellipse cx="380" cy="280" rx="25" ry="12" fill="#00b894" opacity="0.8"/>
    <line x1="355" y1="280" x2="405" y2="280" stroke="#00cec9" stroke-width="1"/>
    <line x1="358" y1="275" x2="402" y2="275" stroke="#00cec9" stroke-width="1"/>
    <line x1="358" y1="285" x2="402" y2="285" stroke="#00cec9" stroke-width="1"/>
    <text x="380" y="283" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Митох.</text>
  </g>
  
  <!-- Лизосома -->
  <circle cx="100" cy="270" r="15" fill="#fd79a8" opacity="0.8"/>
  <text x="100" y="274" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Лиз.</text>
  
  <!-- Микротрубочки -->
  <line x1="250" y1="100" x2="250" y2="300" stroke="#636e72" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="200" x2="350" y2="200" stroke="#636e72" stroke-width="1" opacity="0.5"/>
  
  <!-- Метки и стрелки -->
  <g id="labels">
    <!-- Стрелка к ЭПС -->
    <line x1="320" y1="250" x2="340" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="345" y="245" font-family="Arial" font-size="12" fill="#2c3e50">Эндоплазматическая сеть</text>
    
    <!-- Стрелка к Гольджи -->
    <line x1="180" y1="130" x2="160" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="190" y="125" font-family="Arial" font-size="12" fill="#2c3e50">Аппарат Гольджи</text>
    
    <!-- Стрелка к цитоплазме -->
    <line x1="280" y1="250" x2="280" y2="230" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="290" y="255" font-family="Arial" font-size="12" fill="#2c3e50">Цитоплазма</text>
  </g>
  
  <!-- Определения -->
  <g id="definitions" font-family="Arial" font-size="10" fill="#34495e">
    <text x="20" y="320">
      <tspan x="20" dy="0" font-weight="bold">Цитоплазма:</tspan>
      <tspan x="20" dy="15">Желеобразное вещество между мембраной и ядром</tspan>
    </text>
    
    <text x="250" y="320">
      <tspan x="250" dy="0" font-weight="bold">ЭПС:</tspan>
      <tspan x="250" dy="15">Система каналов для синтеза и транспорта</tspan>
    </text>
    
    <text x="20" y="340">
      <tspan x="20" dy="0" font-weight="bold">Гольджи:</tspan>
      <tspan x="20" dy="15">Модификация и упаковка веществ</tspan>
    </text>
  </g>
  
  <!-- Дополнительные мелкие элементы -->
  <!-- Везикулы -->
  <circle cx="300" cy="120" r="4" fill="#fab1a0" opacity="0.7"/>
  <circle cx="310" cy="115" r="3" fill="#fab1a0" opacity="0.7"/>
  <circle cx="290" cy="125" r="3" fill="#fab1a0" opacity="0.7"/>
  
  <!-- Пероксисомы -->
  <circle cx="350" cy="150" r="5" fill="#fdcb6e" opacity="0.8"/>
  <text x="350" y="153" text-anchor="middle" font-family="Arial" font-size="6" fill="white">P</text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Узоры для украшения -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="2" fill="#74b9ff"/>
    <circle cx="450" cy="50" r="2" fill="#74b9ff"/>
    <circle cx="50" cy="300" r="2" fill="#74b9ff"/>
    <circle cx="450" cy="300" r="2" fill="#74b9ff"/>
  </g>
</svg>