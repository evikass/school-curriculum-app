<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#81c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Двойная спираль ДНК -->
  <g transform="translate(80, 50)">
    <!-- Левая спираль -->
    <path d="M 0 0 Q -15 20 0 40 Q 15 60 0 80 Q -15 100 0 120 Q 15 140 0 160" 
          stroke="url(#dnaGrad)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Правая спираль -->
    <path d="M 30 0 Q 45 20 30 40 Q 15 60 30 80 Q 45 100 30 120 Q 15 140 30 160" 
          stroke="url(#dnaGrad)" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- Соединительные линии -->
    <line x1="0" y1="20" x2="30" y2="20" stroke="#4caf50" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="60" x2="30" y2="60" stroke="#4caf50" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="100" x2="30" y2="100" stroke="#4caf50" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="140" x2="30" y2="140" stroke="#4caf50" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Клетка -->
  <g transform="translate(350, 80)">
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#a5d6a7" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <!-- Ядро -->
    <circle cx="0" cy="0" r="15" fill="#81c784" stroke="#388e3c" stroke-width="1.5"/>
    <!-- Цитоплазма -->
    <circle cx="-10" cy="-15" r="5" fill="#c8e6c9" opacity="0.7"/>
    <circle cx="15" cy="10" r="7" fill="#c8e6c9" opacity="0.7"/>
    <circle cx="-5" cy="20" r="4" fill="#c8e6c9" opacity="0.7"/>
  </g>
  
  <!-- Микроскоп -->
  <g transform="translate(200, 200)">
    <!-- Основание -->
    <rect x="-20" y="40" width="40" height="10" fill="#5d4037" rx="2"/>
    <!-- Стойка -->
    <rect x="-3" y="0" width="6" height="40" fill="#795548"/>
    <!-- Ручка фокусировки -->
    <circle cx="-10" cy="20" r="8" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
    <circle cx="10" cy="20" r="8" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
    <!-- Окуляр -->
    <rect x="-5" y="-20" width="10" height="20" fill="#78909c" rx="2"/>
    <!-- Объектив -->
    <rect x="-8" y="40" width="16" height="15" fill="#546e7a" rx="2"/>
    <!-- Случай -->
    <path d="M -15 40 L -20 55 L 20 55 L 15 40 Z" fill="#37474f" opacity="0.8"/>
  </g>
  
  <!-- Листок -->
  <g transform="translate(100, 280)">
    <path d="M 0 0 Q -15 -20 0 -40 Q 15 -20 0 0" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#388e3c" stroke-width="1"/>
    <!-- Жилки -->
    <path d="M 0 -10 Q -5 -15 -3 -25" stroke="#388e3c" stroke-width="0.5" fill="none"/>
    <path d="M 0 -10 Q 5 -15 3 -25" stroke="#388e3c" stroke-width="0.5" fill="none"/>
    <path d="M 0 -20 Q -5 -22 -2 -30" stroke="#388e3c" stroke-width="0.5" fill="none"/>
    <path d="M 0 -20 Q 5 -22 2 -30" stroke="#388e3c" stroke-width="0.5" fill="none"/>
  </g>
  
  <!-- Гриб -->
  <g transform="translate(150, 300)">
    <!-- Шляпка -->
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#795548" stroke="#5d4037" stroke-width="1"/>
    <circle cx="-8" cy="-5" r="3" fill="#6d4c41" opacity="0.6"/>
    <circle cx="5" cy="-3" r="2" fill="#6d4c41" opacity="0.6"/>
    <circle cx="0" cy="5" r="2.5" fill="#6d4c41" opacity="0.6"/>
    <!-- Ножка -->
    <rect x="-5" y="0" width="10" height="20" fill="#8d6e63" rx="2"/>
    <ellipse cx="0" cy="20" rx="8" ry="3" fill="#6d4c41"/>
  </g>
  
  <!-- Бактерия -->
  <g transform="translate(400, 290)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#ffcc80" stroke="#ff9800" stroke-width="1" filter="url(#shadow)"/>
    <!-- Жгутики -->
    <path d="M -15 0 Q -20 -5 -25 -8" stroke="#ff9800" stroke-width="2" fill="none"/>
    <path d="M 15 0 Q 20 5 25 8" stroke="#ff9800" stroke-width="2" fill="none"/>
    <path d="M -10 -5 Q -15 -8 -18 -10" stroke="#ff9800" stroke-width="1.5" fill="none"/>
    <path d="M 10 5 Q 15 8 18 10" stroke="#ff9800" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Название урока -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#2e7d32">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" 
        text-anchor="middle" fill="#388e3c">Урок 1: Биология — наука о живом</text>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="100" r="3" fill="#4caf50" opacity="0.6"/>
  <circle cx="450" cy="120" r="3" fill="#4caf50" opacity="0.6"/>
  <circle cx="420" cy="250" r="3" fill="#4caf50" opacity="0.6"/>
  <circle cx="80" cy="320" r="3" fill="#4caf50" opacity="0.6"/>
  
  <!-- Наука истина -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="14" 
        text-anchor="middle" fill="#388e3c" font-style="italic">Наука о жизни — вечный поиск истины</text>
  
  <!-- Дополнительные молекулы -->
  <g transform="translate(300, 150)" opacity="0.7">
    <circle cx="0" cy="0" r="8" fill="#42a5f5" stroke="#1976d2" stroke-width="1"/>
    <circle cx="15" cy="5" r="6" fill="#66bb6a" stroke="#388e3c" stroke-width="1"/>
    <circle cx="-10" cy="10" r="5" fill="#ef5350" stroke="#c62828" stroke-width="1"/>
    <line x1="0" y1="0" x2="15" y2="5" stroke="#666" stroke-width="1"/>
    <line x1="0" y1="0" x2="-10" y2="10" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Хромосома -->
  <g transform="translate(420, 200)">
    <path d="M 0 0 Q 10 10 15 25 Q 20 40 15 55 Q 10 70 0 75 Q -10 70 -15 55 Q -20 40 -15 25 Q -10 10 0 0" 
          fill="#ce93d8" stroke="#8e24aa" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#6a1b9a"/>
    <circle cx="0" cy="75" r="3" fill="#6a1b9a"/>
  </g>
  
  <!-- Научный символ -->
  <g transform="translate(30, 200)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#4caf50">∞</text>
  </g>
  
  <!-- Модель атома -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="5" fill="#ff5722"/>
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#2196f3" stroke-width="1" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#2196f3" stroke-width="1" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#2196f3" stroke-width="1" transform="rotate(150)"/>
    <circle cx="20" cy="5" r="2" fill="#2196f3"/>
    <circle cx="-15" cy="-8" r="2" fill="#2196f3"/>
    <circle cx="10" cy="-15" r="2" fill="#2196f3"/>
  </g>
</svg>