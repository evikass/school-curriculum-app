<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="#2e7d32"/>
  <text x="250" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">БИОЛОГИЯ · 10 КЛАСС</text>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Урок 56: Закономерности действия экологических факторов</text>
  
  <!-- График действия факторов -->
  <g transform="translate(50, 100)">
    <!-- Оси -->
    <line x1="0" y1="150" x2="150" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#333" stroke-width="2"/>
    
    <!-- Метки осей -->
    <text x="75" y="170" text-anchor="middle" font-size="12" fill="#333">Интенсивность фактора</text>
    <text x="-40" y="75" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, -40, 75)">Рост организма</text>
    
    <!-- Кривая Либиха -->
    <path d="M 0,120 Q 20,50 40,30 T 80,20 T 120,60 T 150,120" fill="none" stroke="#4caf50" stroke-width="3"/>
    <text x="75" y="15" text-anchor="middle" font-size="11" fill="#4caf50" font-weight="bold">Кривая Либиха</text>
    
    <!-- Оптимальная зона -->
    <rect x="45" y="0" width="30" height="150" fill="#4caf50" opacity="0.2"/>
    <text x="60" y="-5" text-anchor="middle" font-size="10" fill="#4caf50">Оптимум</text>
    
    <!-- Минимальная точка -->
    <circle cx="20" cy="95" r="4" fill="#f44336"/>
    <text x="20" y="110" text-anchor="middle" font-size="9" fill="#f44336">мин.</text>
    
    <!-- Максимальная точка -->
    <circle cx="120" cy="60" r="4" fill="#f44336"/>
    <text x="120" y="75" text-anchor="middle" font-size="9" fill="#f44336">макс.</text>
  </g>
  
  <!-- Второй график - закон толерантности Шелфорда -->
  <g transform="translate(250, 100)">
    <!-- Оси -->
    <line x1="0" y1="150" x2="150" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#333" stroke-width="2"/>
    
    <!-- Кривая толерантности -->
    <path d="M 0,130 Q 30,40 60,20 T 90,30 T 120,100 T 150,130" fill="none" stroke="#ff9800" stroke-width="3"/>
    <text x="75" y="15" text-anchor="middle" font-size="11" fill="#ff9800" font-weight="bold">Закон толерантности</text>
    
    <!-- Зоны толерантности -->
    <rect x="25" y="0" width="70" height="150" fill="#ff9800" opacity="0.15"/>
    <text x="60" y="-5" text-anchor="middle" font-size="10" fill="#ff9800">Зона толерантности</text>
    
    <!-- Пределы выносливости -->
    <circle cx="25" cy="70" r="4" fill="#9c27b0"/>
    <text x="25" y="85" text-anchor="middle" font-size="9" fill="#9c27b0">нижний предел</text>
    <circle cx="95" cy="45" r="4" fill="#9c27b0"/>
    <text x="95" y="60" text-anchor="middle" font-size="9" fill="#9c27b0">верхний предел</text>
  </g>
  
  <!-- Таблица экологических факторов -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="400" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
    
    <!-- Заголовки -->
    <text x="10" y="15" font-size="12" font-weight="bold" fill="#1976d2">Факторы среды:</text>
    
    <!-- Абиотические -->
    <text x="10" y="30" font-size="11" fill="#333">Абиотические:</text>
    <text x="70" y="30" font-size="10" fill="#666">температура, свет, влажность, pH, давление</text>
    
    <!-- Биотические -->
    <text x="10" y="45" font-size="11" fill="#333">Биотические:</text>
    <text x="70" y="45" font-size="10" fill="#666">конкуренция, хищничество, симбиоз, паразитизм</text>
    
    <!-- Антропогенные -->
    <text x="250" y="30" font-size="11" fill="#333">Антропогенные:</text>
    <text x="320" y="30" font-size="10" fill="#666">загрязнение, вырубка, охота</text>
    
    <!-- Компоненты экосистемы -->
    <text x="250" y="45" font-size="11" fill="#333">Компоненты экосистем:</text>
    <text x="350" y="45" font-size="10" fill="#666">продуценты, консументы, редуценты</text>
  </g>
  
  <!-- Иконки организмов -->
  <g transform="translate(420, 120)">
    <!-- Дерево -->
    <rect x="0" y="30" width="4" height="20" fill="#8d6e63"/>
    <ellipse cx="2" cy="20" rx="12" ry="15" fill="#4caf50"/>
    <text x="20" y="35" font-size="9" fill="#333">Растение</text>
    
    <!-- Животное -->
    <ellipse cx="2" cy="70" rx="8" ry="6" fill="#ff7043"/>
    <circle cx="2" cy="65" r="3" fill="#ff7043"/>
    <text x="20" y="75" font-size="9" fill="#333">Животное</text>
  </g>
  
  <!-- Стрелки показывающие влияние -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Стрелка от фактора к организму -->
  <line x1="200" y1="175" x2="230" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="165" text-anchor="middle" font-size="9" fill="#666">влияние</text>
  
  <!-- Номера на графиках -->
  <g transform="translate(50, 100)">
    <text x="75" y="150" text-anchor="middle" font-size="10" fill="#333">0</text>
    <text x="150" y="150" text-anchor="middle" font-size="10" fill="#333">100%</text>
  </g>
  
  <g transform="translate(250, 100)">
    <text x="75" y="150" text-anchor="middle" font-size="10" fill="#333">0</text>
    <text x="150" y="150" text-anchor="middle" font-size="10" fill="#333">100%</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="70" height="50" fill="white" stroke="#999" stroke-width="1" rx="3"/>
    <text x="35" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Легенда</text>
    <line x1="5" y1="25" x2="15" y2="25" stroke="#4caf50" stroke-width="2"/>
    <text x="20" y="28" font-size="9" fill="#333">Либих</text>
    <line x1="5" y1="35" x2="15" y2="35" stroke="#ff9800" stroke-width="2"/>
    <text x="20" y="38" font-size="9" fill="#333">Шелфорд</text>
  </g>
</svg>