<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">Урок 38: Моногибридное скрещивание</text>
  
  <!-- Первая особь (Р-поколение) -->
  <g id="parent1">
    <rect x="50" y="80" width="80" height="100" fill="#3498db" rx="5"/>
    <text x="90" y="135" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">AA</text>
    <text x="90" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Р-поколение</text>
    <text x="90" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">(родители)</text>
  </g>
  
  <!-- Вторая особь (Р-поколение) -->
  <g id="parent2">
    <rect x="370" y="80" width="80" height="100" fill="#e74c3c" rx="5"/>
    <text x="410" y="135" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">aa</text>
    <text x="410" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Р-поколение</text>
    <text x="410" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">(родители)</text>
  </g>
  
  <!-- Стрелки скрещивания -->
  <g id="arrows">
    <path d="M 130 130 L 220 130" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 280 130 L 370 130" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="175" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">×</text>
    <text x="325" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">×</text>
  </g>
  
  <!-- Определение gametes -->
  <g id="gametes">
    <circle cx="90" cy="260" r="15" fill="#5dade2"/>
    <text x="90" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <circle cx="130" cy="260" r="15" fill="#5dade2"/>
    <text x="130" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <circle cx="370" cy="260" r="15" fill="#ec7063"/>
    <text x="370" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">a</text>
    
    <circle cx="410" cy="260" r="15" fill="#ec7063"/>
    <text x="410" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">a</text>
  </g>
  
  <!-- F1 поколение -->
  <g id="f1-generation">
    <rect x="175" y="280" width="150" height="50" fill="#27ae60" rx="5"/>
    <text x="250" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">F1 (Aa)</text>
    <text x="250" y="345" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Первый закон Менделя</text>
  </g>
  
  <!-- Стрелки от гамет к F1 -->
  <path d="M 105 275 L 200 295" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-small)"/>
  <path d="M 125 275 L 220 295" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-small)"/>
  <path d="M 375 275 L 280 295" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-small)"/>
  <path d="M 395 275 L 300 295" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead-small)"/>
  
  <!-- F2 поколение -->
  <g id="f2-generation">
    <text x="250" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Самоопыление F1</text>
    
    <!-- F1 гаметы -->
    <circle cx="140" cy="95" r="12" fill="#58d68d"/>
    <text x="140" y="99" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <circle cx="360" cy="95" r="12" fill="#58d68d"/>
    <text x="360" y="99" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">a</text>
    
    <!-- Таблица Пеннета -->
    <rect x="120" y="110" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="140" y="110" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="160" y="110" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="180" y="110" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    
    <rect x="120" y="130" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="140" y="130" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="160" y="130" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    <rect x="180" y="130" width="20" height="20" fill="white" stroke="#34495e" stroke-width="1"/>
    
    <!-- Генотипы F2 -->
    <text x="130" y="124" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">AA</text>
    <text x="150" y="124" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Aa</text>
    <text x="170" y="124" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Aa</text>
    <text x="190" y="124" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">aa</text>
    
    <text x="130" y="144" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Aa</text>
    <text x="150" y="144" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Aa</text>
    <text x="170" y="144" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">aa</text>
    <text x="190" y="144" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">aa</text>
    
    <!-- F2 результаты -->
    <text x="250" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">F2 (потомство)</text>
    <text x="250" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">1AA : 2Aa : 1aa</text>
    <text x="250" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">(3:1 - фенотипическое соотношение)</text>
    
    <rect x="100" y="205" width="300" height="30" fill="#f39c12" rx="3"/>
    <text x="250" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Второй закон Менделя - закон расщепления</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="legend">
    <rect x="20" y="300" width="80" height="40" fill="#ecf0f1" rx="3"/>
    <text x="60" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Гомозиготные</text>
    <text x="60" y="328" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">особи</text>
    
    <rect x="400" y="300" width="80" height="40" fill="#ecf0f1" rx="3"/>
    <text x="440" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Гетерозиготные</text>
    <text x="440" y="328" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">особи</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="250" cy="50" r="3" fill="#3498db"/>
  <circle cx="260" cy="50" r="3" fill="#e74c3c"/>
  <circle cx="240" cy="50" r="3" fill="#27ae60"/>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-small" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>