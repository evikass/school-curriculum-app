<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Название урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 26: Окислительное фосфорилирование
  </text>
  
  <!-- Митохондрия - контур -->
  <g id="mitochondria">
    <path d="M 80 80 Q 80 70, 90 70 L 380 70 Q 390 70, 390 80 L 390 280 Q 390 290, 380 290 L 90 290 Q 80 290, 80 280 Z" 
          fill="none" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Внутренние складки - кристы -->
    <path d="M 100 120 Q 150 110, 200 120 Q 250 130, 300 120 Q 350 110, 370 120" 
          fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <path d="M 100 160 Q 150 150, 200 160 Q 250 170, 300 160 Q 350 150, 370 160" 
          fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <path d="M 100 200 Q 150 190, 200 200 Q 250 210, 300 200 Q 350 190, 370 200" 
          fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <path d="M 100 240 Q 150 230, 200 240 Q 250 250, 300 240 Q 350 230, 370 240" 
          fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
  </g>
  
  <!-- Внешняя мембрана -->
  <rect x="80" y="80" width="310" height="5" fill="#3498db" opacity="0.7"/>
  
  <!-- Внутренняя мембрана -->
  <g id="inner-membrane">
    <!-- Комплекс I -->
    <rect x="100" y="100" width="40" height="180" fill="#e74c3c" opacity="0.7" rx="5"/>
    <text x="120" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">I</text>
    
    <!-- Комплекс II -->
    <rect x="160" y="100" width="40" height="180" fill="#f39c12" opacity="0.7" rx="5"/>
    <text x="180" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">II</text>
    
    <!-- Комплекс III -->
    <rect x="220" y="100" width="40" height="180" fill="#27ae60" opacity="0.7" rx="5"/>
    <text x="240" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">III</text>
    
    <!-- Комплекс IV -->
    <rect x="280" y="100" width="40" height="180" fill="#8e44ad" opacity="0.7" rx="5"/>
    <text x="300" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="white">IV</text>
  </g>
  
  <!-- Дыхательная цепь - стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Стрелки между комплексами -->
  <line x1="140" y1="140" x2="160" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="140" x2="220" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="140" x2="280" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- NADH и FADH2 -->
  <g id="electron-carriers">
    <circle cx="70" cy="140" r="15" fill="#16a085"/>
    <text x="70" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="white">NADH</text>
    
    <circle cx="70" cy="180" r="15" fill="#d35400"/>
    <text x="70" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="white">FADH₂</text>
  </g>
  
  <!-- Стрелки от переносчиков -->
  <path d="M 85 140 Q 90 140, 100 140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 85 180 Q 130 160, 160 140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- АТФ-синтаза -->
  <g id="atp-synthase">
    <ellipse cx="350" cy="190" rx="25" ry="35" fill="#3498db" opacity="0.8"/>
    <rect x="340" y="190" width="20" height="30" fill="#2980b9"/>
    <text x="350" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">АТФ-синтаза</text>
  </g>
  
  <!-- АТФ -->
  <g id="atp">
    <rect x="340" y="80" width="40" height="20" fill="#f1c40f" stroke="#f39c12" stroke-width="1" rx="3"/>
    <text x="360" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">АТФ</text>
  </g>
  
  <!-- Стрелка к АТФ -->
  <line x1="350" y1="155" x2="350" y2="100" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Кислород и вода -->
  <g id="oxygen-water">
    <circle cx="420" cy="140" r="15" fill="#e74c3c"/>
    <text x="420" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="white">O₂</text>
    
    <circle cx="420" cy="220" r="15" fill="#3498db"/>
    <text x="420" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">H₂O</text>
  </g>
  
  <!-- Стрелки к кислороду и воде -->
  <line x1="320" y1="140" x2="405" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="240" x2="405" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Матрикс -->
  <text x="235" y="310" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">Матрикс</text>
  
  <!-- Интермембранное пространство -->
  <text x="60" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d" transform="rotate(-90 60 60)">Интермембранное пространство</text>
  
  <!-- Легенда -->
  <g id="legend" transform="translate(20, 320)">
    <rect x="0" y="0" width="460" height="25" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
    <text x="10" y="17" font-family="Arial" font-size="10" fill="#2c3e50">Электронно-транспортная цепь → Протонный градиент → Хемиосмотическая теория → Синтез АТФ</text>
  </g>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="120" cy="120" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="180" cy="160" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="240" cy="200" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="300" cy="140" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="240" cy="240" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="180" cy="220" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="120" cy="260" r="3" fill="#3498db" opacity="0.5"/>
  
  <!-- H+ ионов для визуализации градиента -->
  <text x="90" y="90" font-family="Arial" font-size="8" fill="#e74c3c">H⁺</text>
  <text x="370" y="90" font-family="Arial" font-size="8" fill="#e74c3c">H⁺</text>
  <text x="90" y="280" font-family="Arial" font-size="8" fill="#3498db">H⁺</text>
  <text x="370" y="280" font-family="Arial" font-size="8" fill="#3498db">H⁺</text>
</svg>