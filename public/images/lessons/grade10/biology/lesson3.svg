<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для клетки -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для ядра -->
    <radialGradient id="nucleusGrad">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:0.9" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Основная клетка -->
  <g id="cell" filter="url(#shadow)">
    <!-- Мембрана -->
    <ellipse cx="250" cy="180" rx="80" ry="100" fill="none" stroke="#3498db" stroke-width="3" opacity="0.8"/>
    
    <!-- Цитоплазма -->
    <ellipse cx="250" cy="180" rx="78" ry="98" fill="#e8f4f8" opacity="0.6"/>
    
    <!-- Ядро -->
    <ellipse cx="250" cy="180" rx="35" ry="40" fill="url(#nucleusGrad)"/>
    <ellipse cx="250" cy="180" rx="33" ry="38" fill="none" stroke="#a61e1e" stroke-width="1"/>
    
    <!-- Ядерная оболочка -->
    <ellipse cx="250" cy="180" rx="35" ry="40" fill="none" stroke="#c92a2a" stroke-width="2"/>
    
    <!-- Ядрышко -->
    <circle cx="250" cy="175" r="8" fill="#8b0000" opacity="0.8"/>
    <circle cx="248" cy="177" r="5" fill="#ff4444" opacity="0.7"/>
  </g>
  
  <!-- Макроэлементы (большие кружки) -->
  <g id="macroElements">
    <!-- Углерод C -->
    <circle cx="100" cy="80" r="15" fill="#4CAF50" opacity="0.8"/>
    <text x="100" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">C</text>
    <text x="100" y="105" text-anchor="middle" font-size="10" fill="#2e7d32">Углерод</text>
    
    <!-- Кислород O -->
    <circle cx="150" cy="80" r="15" fill="#2196F3" opacity="0.8"/>
    <text x="150" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">O</text>
    <text x="150" y="105" text-anchor="middle" font-size="10" fill="#1565c0">Кислород</text>
    
    Водород H -->
    <circle cx="200" cy="80" r="15" fill="#FFC107" opacity="0.8"/>
    <text x="200" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">H</text>
    <text x="200" y="105" text-anchor="middle" font-size="10" fill="#f57c00">Водород</text>
    
    Азот N -->
    <circle cx="350" cy="80" r="15" fill="#9C27B0" opacity="0.8"/>
    <text x="350" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">N</text>
    <text x="350" y="105" text-anchor="middle" font-size="10" fill="#6a1b9a">Азот</text>
    
    Фосфор P -->
    <circle cx="400" cy="80" r="15" fill="#FF5722" opacity="0.8"/>
    <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">P</text>
    <text x="400" y="105" text-anchor="middle" font-size="10" fill="#d84315">Фосфор</text>
    
    Сера S -->
    <circle cx="450" cy="80" r="15" fill="#FF9800" opacity="0.8"/>
    <text x="450" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">S</text>
    <text x="450" y="105" text-anchor="middle" font-size="10" fill="#ef6c00">Сера</text>
  </g>
  
  <!-- Микроэлементы (маленькие кружки) -->
  <g id="microElements" opacity="0.7">
    <!-- Натрий Na -->
    <circle cx="120" cy="280" r="8" fill="#03A9F4"/>
    <text x="120" y="284" text-anchor="middle" font-size="9" fill="white">Na</text>
    
    <!-- Калий K -->
    <circle cx="145" cy="280" r="8" fill="#E91E63"/>
    <text x="145" y="284" text-anchor="middle" font-size="9" fill="white">K</text>
    
    <!-- Кальций Ca -->
    <circle cx="170" cy="280" r="8" fill="#795548"/>
    <text x="170" y="284" text-anchor="middle" font-size="9" fill="white">Ca</text>
    
    <!-- Магний Mg -->
    <circle cx="195" cy="280" r="8" fill="#607D8B"/>
    <text x="195" y="284" text-anchor="middle" font-size="9" fill="white">Mg</text>
    
    <!-- Железо Fe -->
    <circle cx="220" cy="280" r="8" fill="#795548"/>
    <text x="220" y="284" text-anchor="middle" font-size="9" fill="white">Fe</text>
    
    <!-- Цинк Zn -->
    <circle cx="245" cy="280" r="8" fill="#FF9800"/>
    <text x="245" y="284" text-anchor="middle" font-size="9" fill="white">Zn</text>
    
    <!-- Медь Cu -->
    <circle cx="270" cy="280" r="8" fill="#00BCD4"/>
    <text x="270" y="284" text-anchor="middle" font-size="9" fill="white">Cu</text>
    
    <!-- Марганец Mn -->
    <circle cx="295" cy="280" r="8" fill="#9C27B0"/>
    <text x="295" y="284" text-anchor="middle" font-size="9" fill="white">Mn</text>
    
    <!-- Йод I -->
    <circle cx="320" cy="280" r="8" fill="#3F51B5"/>
    <text x="320" y="284" text-anchor="middle" font-size="9" fill="white">I</text>
    
    <!-- Фтор F -->
    <circle cx="345" cy="280" r="8" fill="#00E676"/>
    <text x="345" y="284" text-anchor="middle" font-size="9" fill="white">F</text>
  </g>
  
  <!-- Надписи -->
  <text x="60" y="50" font-size="14" font-weight="bold" fill="#34495e">МАКРОЭЛЕМЕНТЫ</text>
  <text x="60" y="320" font-size="14" font-weight="bold" fill="#34495e">МИКРОЭЛЕМЕНТЫ</text>
  
  <!-- Указатели -->
  <g id="arrows" opacity="0.6">
    <path d="M 180 130 Q 200 150 220 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M 280 130 Q 260 150 240 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы внутри клетки -->
  <g id="organelles" opacity="0.5">
    <!-- Рибосомы -->
    <circle cx="200" cy="200" r="3" fill="#FFD700"/>
    <circle cx="210" cy="195" r="3" fill="#FFD700"/>
    <circle cx="220" cy="200" r="3" fill="#FFD700"/>
    <circle cx="280" cy="190" r="3" fill="#FFD700"/>
    <circle cx="290" cy="195" r="3" fill="#FFD700"/>
    <circle cx="300" cy="200" r="3" fill="#FFD700"/>
    
    <!-- Митохондрии -->
    <ellipse cx="230" cy="230" rx="15" ry="8" fill="#8B4513" transform="rotate(-20 230 230)"/>
    <ellipse cx="270" cy="220" rx="15" ry="8" fill="#8B4513" transform="rotate(30 270 220)"/>
    
    <!-- Эндоплазматическая сеть -->
    <path d="M 240 160 Q 250 170 260 160 Q 270 150 280 160" fill="none" stroke="#4682B4" stroke-width="1.5"/>
  </g>
  
  <!-- Водородные связи -->
  <g id="bonds" opacity="0.4">
    <line x1="250" y1="140" x2="240" y2="130" stroke="#00BCD4" stroke-width="1"/>
    <line x1="250" y1="140" x2="260" y2="130" stroke="#00BCD4" stroke-width="1"/>
    <line x1="250" y1="140" x2="250" y2="125" stroke="#00BCD4" stroke-width="1"/>
  </g>
  
  <!-- Сеть ДНК -->
  <g id="dna" opacity="0.6">
    <path d="M 240 180 Q 245 175 250 180 T 260 180" fill="none" stroke="#FF1493" stroke-width="2"/>
    <path d="M 240 180 Q 245 185 250 180 T 260 180" fill="none" stroke="#FF1493" stroke-width="2"/>
  </g>
  
  <!-- Водяные молекулы -->
  <g id="water" opacity="0.5">
    <g transform="translate(180, 210)">
      <circle cx="0" cy="0" r="4" fill="#2196F3"/>
      <text x="0" y="2" text-anchor="middle" font-size="8" fill="white">O</text>
      <circle cx="-6" cy="3" r="2" fill="#FFC107"/>
      <circle cx="6" cy="3" r="2" fill="#FFC107"/>
    </g>
    <g transform="translate(320, 190)">
      <circle cx="0" cy="0" r="4" fill="#2196F3"/>
      <text x="0" y="2" text-anchor="middle" font-size="8" fill="white">O</text>
      <circle cx="-6" cy="3" r="2" fill="#FFC107"/>
      <circle cx="6" cy="3" r="2" fill="#FFC107"/>
    </g>
  </g>
  
  <!-- Ионы -->
  <g id="ions" opacity="0.7">
    <text x="280" y="160" font-size="10" fill="#E91E63">Na+</text>
    <text x="220" y="160" font-size="10" fill="#2196F3">Cl-</text>
  </g>
  
  <!-- Надпись урока -->
  <text x="250" y="340" text-anchor="middle" font-size="16" font-style="italic" fill="#546E7A">
    Урок 3: Химический состав клетки
  </text>
</svg>