<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративные элементы - молекулы -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="15" fill="#3498db" />
    <circle cx="70" cy="60" r="10" fill="#2ecc71" />
    <circle cx="60" cy="75" r="12" fill="#e74c3c" />
    <line x1="50" y1="50" x2="70" y2="60" stroke="#34495e" stroke-width="2" />
    <line x1="70" y1="60" x2="60" y2="75" stroke="#34495e" stroke-width="2" />
  </g>
  
  <!-- Декоративные элементы - ДНК спираль -->
  <g transform="translate(420, 50)" opacity="0.15">
    <path d="M0,0 Q10,10 0,20 T0,40 T0,60 T0,80 T0,100" 
          stroke="#3498db" stroke-width="3" fill="none" />
    <path d="M20,0 Q10,10 20,20 T20,40 T20,60 T20,80 T20,100" 
          stroke="#2ecc71" stroke-width="3" fill="none" />
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="28" 
        font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <rect x="20" y="60" width="80" height="30" rx="15" fill="#3498db" filter="url(#shadow)" />
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="16" 
        font-weight="bold" text-anchor="middle" fill="white">
    Урок 57
  </text>
  
  <!-- Основная иллюстрация - популяция как система -->
  <g transform="translate(150, 100)">
    <!-- Центральное ядро системы -->
    <circle cx="100" cy="75" r="35" fill="#2ecc71" opacity="0.8" filter="url(#shadow)" />
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" 
          font-weight="bold" text-anchor="middle" fill="white">
      Популяция
    </text>
    
    <!-- Индивиды вокруг центра -->
    <g id="organism1">
      <circle cx="40" cy="40" r="8" fill="#e74c3c" />
      <circle cx="40" cy="35" r="4" fill="#c0392b" />
      <line x1="40" y1="42" x2="40" y2="50" stroke="#34495e" stroke-width="2" />
      <line x1="40" y1="50" x2="35" y2="55" stroke="#34495e" stroke-width="2" />
      <line x1="40" y1="50" x2="45" y2="55" stroke="#34495e" stroke-width="2" />
    </g>
    
    <g id="organism2">
      <circle cx="160" cy="40" r="8" fill="#3498db" />
      <circle cx="160" y1="35" r="4" fill="#2980b9" />
      <line x1="160" y1="42" x2="160" y2="50" stroke="#34495e" stroke-width="2" />
      <line x1="160" y1="50" x2="155" y2="55" stroke="#34495e" stroke-width="2" />
      <line x1="160" y1="50" x2="165" y2="55" stroke="#34495e" stroke-width="2" />
    </g>
    
    <g id="organism3">
      <circle cx="40" cy="110" r="8" fill="#f39c12" />
      <circle cx="40" y="105" r="4" fill="#d68910" />
      <line x1="40" y1="112" x2="40" y2="120" stroke="#34495e" stroke-width="2" />
      <line x1="40" y1="120" x2="35" y2="125" stroke="#34495e" stroke-width="2" />
      <line x1="40" y1="120" x2="45" y2="125" stroke="#34495e" stroke-width="2" />
    </g>
    
    <g id="organism4">
      <circle cx="160" cy="110" r="8" fill="#9b59b6" />
      <circle cx="160" y="105" r="4" fill="#8e44ad" />
      <line x1="160" y1="112" x2="160" y2="120" stroke="#34495e" stroke-width="2" />
      <line x1="160" y1="120" x2="155" y2="125" stroke="#34495e" stroke-width="2" />
      <line x1="160" y1="120" x2="165" y2="125" stroke="#34495e" stroke-width="2" />
    </g>
    
    <!-- Связи между индивидами и популяцией -->
    <line x1="48" y1="48" x2="75" y2="65" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="152" y1="48" x2="125" y2="65" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="48" y1="102" x2="75" y2="85" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="152" y1="102" x2="125" y2="85" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" />
    
    <!-- Связи между индивидами -->
    <line x1="48" y1="40" x2="152" y2="40" stroke="#bdc3c7" stroke-width="1" opacity="0.5" />
    <line x1="48" y1="110" x2="152" y2="110" stroke="#bdc3c7" stroke-width="1" opacity="0.5" />
    <line x1="40" y1="48" x2="40" y2="102" stroke="#bdc3c7" stroke-width="1" opacity="0.5" />
    <line x1="160" y1="48" x2="160" y2="102" stroke="#bdc3c7" stroke-width="1" opacity="0.5" />
  </g>
  
  <!-- Свойства популяции -->
  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="110" height="25" rx="5" fill="#3498db" opacity="0.8" />
    <text x="55" y="17" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="white">Численность</text>
  </g>
  
  <g transform="translate(140, 220)">
    <rect x="0" y="0" width="110" height="25" rx="5" fill="#2ecc71" opacity="0.8" />
    <text x="55" y="17" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="white">Генетический состав</text>
  </g>
  
  <g transform="translate(260, 220)">
    <rect x="0" y="0" width="110" height="25" rx="5" fill="#e74c3c" opacity="0.8" />
    <text x="55" y="17" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="white">Плотность</text>
  </g>
  
  <g transform="translate(380, 220)">
    <rect x="0" y="0" width="110" height="25" rx="5" fill="#f39c12" opacity="0.8" />
    <text x="55" y="17" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="white">Структура</text>
  </g>
  
  <!-- Факторы среды -->
  <g transform="translate(20, 260)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Факторы среды:
    </text>
    <circle cx="10" cy="20" r="3" fill="#3498db" />
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      Абиотические
    </text>
    <circle cx="100" cy="20" r="3" fill="#2ecc71" />
    <text x="110" y="24" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      Биотические
    </text>
    <circle cx="190" cy="20" r="3" fill="#e74c3c" />
    <text x="200" y="24" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      Антропогенные
    </text>
  </g>
  
  <!-- Динамические процессы -->
  <g transform="translate(20, 300)">
    <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Динамика популяции:
    </text>
    <path d="M0,20 Q10,10 20,20 T40,20 T60,20 T80,20" 
          stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
    <text x="90" y="24" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      Рост → Устойчивость → Снижение
    </text>
  </g>
  
  <!-- Стрелка для динамики -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db" />
    </marker>
  </defs>
  
  <!-- Дополнительные декоративные элементы -->
  <g opacity="0.3">
    <circle cx="470" cy="100" r="5" fill="#3498db" />
    <circle cx="480" cy="110" r="3" fill="#2ecc71" />
    <circle cx="475" cy="120" r="4" fill="#e74c3c" />
  </g>
  
  <!-- Дерево справа -->
  <g transform="translate(350, 120)" opacity="0.2">
    <rect x="48" y="60" width="4" height="40" fill="#8b4513" />
    <circle cx="50" cy="50" r="25" fill="#27ae60" />
    <circle cx="40" cy="55" r="20" fill="#2ecc71" />
    <circle cx="60" cy="55" r="20" fill="#2ecc71" />
  </g>
  
  <!-- Текст урока -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="16" 
        font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Популяция как природная система
  </text>
</svg>