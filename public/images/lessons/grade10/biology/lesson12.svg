<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 12: АТФ и другие органические соединения клетки
  </text>
  
  <!-- Молекула АТФ (центральная) -->
  <g transform="translate(250, 150)">
    <!-- Аденин -->
    <circle cx="0" cy="0" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">А</text>
    
    <!-- Рибоза -->
    <polygon points="30,0 50,-10 50,10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="40" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Р</text>
    
    <!-- Три фосфатные группы -->
    <circle cx="70" cy="0" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="70" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">P</text>
    
    <circle cx="95" cy="0" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="95" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">P</text>
    
    <circle cx="120" cy="0" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="120" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">P</text>
    
    <!-- Связи -->
    <line x1="25" y1="0" x2="30" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="50" y1="0" x2="70" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="85" y1="0" x2="95" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="110" y1="0" x2="120" y2="0" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Обозначения -->
    <text x="70" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50" font-weight="bold">АТФ</text>
  </g>
  
  <!-- Связи энергии -->
  <g transform="translate(250, 150)">
    <line x1="120" y1="0" x2="150" y2="0" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="160" y="5" font-family="Arial" font-size="12" fill="#e74c3c">~30 кДж/моль</text>
  </g>
  
  <!-- Стрелка определение -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Глюкоза -->
  <g transform="translate(80, 220)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">C₆H₁₂O₆</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">Глюкоза</text>
  </g>
  
  <!-- Липиды -->
  <g transform="translate(180, 220)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <path d="M-20,0 Q-10,-10 0,0 Q10,10 20,0" fill="none" stroke="white" stroke-width="1"/>
    <path d="M-15,0 Q-7.5,-8 0,0 Q7.5,8 15,0" fill="none" stroke="white" stroke-width="1"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">Липиды</text>
  </g>
  
  <!-- Белки -->
  <g transform="translate(280, 220)">
    <path d="M-25,0 L-15,-15 L0,-10 L15,-15 L25,0 L15,15 L0,10 L-15,15 Z" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">Белки</text>
  </g>
  
  <!-- Нуклеотиды -->
  <g transform="translate(380, 220)">
    <circle cx="0" cy="0" r="20" fill="#16a085" stroke="#138d75" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">АТФ/ГТФ</text>
    <text x="0" y="-30" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">Нуклеотиды</text>
  </g>
  
  <!-- Стрелки от АТФ к соединениям -->
  <line x1="250" y1="185" x2="80" y2="200" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="185" x2="180" y2="200" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="185" x2="280" y2="200" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="185" x2="380" y2="200" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Функции АТФ -->
  <g transform="translate(250, 280)">
    <rect x="-150" y="-15" width="300" height="30" rx="15" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">
      "Энергетическая валюта клетки"
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- РНК ДНК -->
  <g transform="translate(50, 100)">
    <rect x="-20" y="-10" width="40" height="20" fill="#3498db" opacity="0.7"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">РНК</text>
  </g>
  
  <g transform="translate(50, 130)">
    <rect x="-20" y="-10" width="40" height="20" fill="#e74c3c" opacity="0.7"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">ДНК</text>
  </g>
  
  <!-- Клеточные органеллы -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="15" fill="#f39c12" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Митохондрия</text>
  </g>
  
  <g transform="translate(420, 130)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#27ae60" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Хлоропласт</text>
  </g>
  
  <!-- Энергетические процессы -->
  <g transform="translate(250, 90)">
    <circle cx="-50" cy="0" r="15" fill="#e74c3c" opacity="0.5"/>
    <text x="-50" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Синтез</text>
    
    <circle cx="0" cy="0" r="15" fill="#f39c12" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Гидролиз</text>
    
    <circle cx="50" cy="0" r="15" fill="#27ae60" opacity="0.5"/>
    <text x="50" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Цикл</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="30" cy="320" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#f39c12" opacity="0.5"/>
  
  <!-- Атомные символы -->
  <text x="100" y="80" font-family="Arial" font-size="10" fill="#7f8c8d">C, H, O, N, P</text>
  <text x="350" y="80" font-family="Arial" font-size="10" fill="#7f8c8d">К, Na, Ca, Mg</text>
  
  <!-- Стрелки процессов -->
  <g transform="translate(250, 150)">
    <path d="M-50,-50 Q-30,-70 -10,-50" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowblue)"/>
    <path d="M-50,50 Q-30,70 -10,50" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowred)"/>
  </g>
  
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>