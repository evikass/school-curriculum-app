<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7f0;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="nucleoidGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2c5aa0;stop-opacity:0.8" />
    </radialGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a4d80">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2c5aa0">
    Урок 20: Прокариотическая клетка
  </text>
  
  <!-- Основная клетка -->
  <ellipse cx="250" cy="180" rx="120" ry="90" fill="#f0f8ff" stroke="#4a90e2" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Кapsule -->
  <path d="M 130 160 Q 120 180, 130 200 Q 140 210, 150 205 Q 145 190, 140 175 Q 135 165, 130 160" 
        fill="#e8f0ff" stroke="#7ba3d0" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Nucleoid -->
  <ellipse cx="230" cy="160" rx="40" ry="35" fill="url(#nucleoidGrad)"/>
  <text x="230" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Нуклеоид
  </text>
  
  <!-- Plasmids -->
  <ellipse cx="280" cy="140" rx="15" ry="12" fill="#87ceeb" stroke="#5a9fd4" stroke-width="1.5"/>
  <ellipse cx="300" cy="155" rx="12" ry="10" fill="#87ceeb" stroke="#5a9fd4" stroke-width="1.5"/>
  <ellipse cx="290" cy="180" rx="10" ry="8" fill="#87ceeb" stroke="#5a9fd4" stroke-width="1.5"/>
  
  <!-- Ribosomes -->
  <circle cx="200" cy="190" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="220" cy="200" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="240" cy="195" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="260" cy="205" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="280" cy="195" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="210" cy="210" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="250" cy="210" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  <circle cx="270" cy="215" r="5" fill="#ffd700" stroke="#ffa500" stroke-width="1"/>
  
  <!-- Cell membrane -->
  <ellipse cx="250" cy="180" rx="120" ry="90" fill="none" stroke="#2c5aa0" stroke-width="2.5" stroke-dasharray="5,3"/>
  
  <!-- Cytoplasm -->
  <ellipse cx="250" cy="180" rx="117" ry="87" fill="rgba(240,248,255,0.3)"/>
  
  <!-- Flagellum -->
  <path d="M 350 180 Q 380 170, 400 180 Q 420 190, 440 200" 
        fill="none" stroke="#4a90e2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 350 180 Q 380 190, 400 180 Q 420 170, 440 160" 
        fill="none" stroke="#4a90e2" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pilus -->
  <line x1="150" y1="120" x2="150" y2="90" stroke="#6b8e23" stroke-width="2"/>
  <line x1="170" y1="125" x2="170" y2="95" stroke="#6b8e23" stroke-width="2"/>
  <line x1="190" y1="130" x2="190" y2="100" stroke="#6b8e23" stroke-width="2"/>
  
  <!-- Mesosome -->
  <path d="M 320 200 Q 340 220, 320 240 Q 300 220, 320 200" 
        fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Легенда -->
  <g transform="translate(20, 260)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a4d80">
      Структуры:
    </text>
    
    <circle cx="10" cy="20" r="4" fill="#4a90e2"/>
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="12" fill="#333">Клеточная мембрана</text>
    
    <circle cx="10" cy="40" r="4" fill="#2c5aa0"/>
    <text x="20" y="44" font-family="Arial, sans-serif" font-size="12" fill="#333">Клеточная стенка</text>
    
    <circle cx="10" cy="60" r="4" fill="#4a90e2"/>
    <text x="20" y="64" font-family="Arial, sans-serif" font-size="12" fill="#333">Жгутик</text>
    
    <circle cx="150" cy="20" r="4" fill="#6b8e23"/>
    <text x="160" y="24" font-family="Arial, sans-serif" font-size="12" fill="#333">Пилий</text>
    
    <circle cx="150" cy="40" r="4" fill="#4a90e2"/>
    <text x="160" y="44" font-family="Arial, sans-serif" font-size="12" fill="#333">Капсула</text>
    
    <circle cx="150" cy="60" r="4" fill="#87ceeb"/>
    <text x="160" y="64" font-family="Arial, sans-serif" font-size="12" fill="#333">Плазмиды</text>
    
    <circle cx="280" cy="20" r="4" fill="#ffd700"/>
    <text x="290" y="24" font-family="Arial, sans-serif" font-size="12" fill="#333">Рибосомы</text>
    
    <circle cx="280" cy="40" r="4" fill="#ff6b6b"/>
    <text x="290" y="44" font-family="Arial, sans-serif" font-size="12" fill="#333">Мезосома</text>
    
    <circle cx="280" cy="60" r="4" fill="#2c5aa0"/>
    <text x="290" y="64" font-family="Arial, sans-serif" font-size="12" fill="#333">Нуклеоид</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(380, 120)">
    <!-- Маленькая бактерия для примера -->
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="#f0f8ff" stroke="#4a90e2" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="18" fill="none" stroke="#2c5aa0" stroke-width="1.5" stroke-dasharray="3,2"/>
    <ellipse cx="-5" cy="-5" rx="8" ry="7" fill="url(#nucleoidGrad)"/>
    <circle cx="5" cy="3" r="3" fill="#ffd700" stroke="#ffa500" stroke-width="0.5"/>
  </g>
  
  <!-- Указатель на структуру -->
  <line x1="230" y1="125" x2="230" y2="95" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4444"/>
    </marker>
  </defs>
  
  <!-- Надписи на клетке -->
  <text x="380" y="125" font-family="Arial, sans-serif" font-size="10" fill="#ff4444">прокариотическая клетка</text>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#87ceeb" opacity="0.5"/>
  <circle cx="450" cy="50" r="3" fill="#87ceeb" opacity="0.5"/>
  <circle cx="50" cy="300" r="3" fill="#87ceeb" opacity="0.5"/>
  <circle cx="450" cy="300" r="3" fill="#87ceeb" opacity="0.5"/>
  
  <!-- Штриховка для показания глубины -->
  <g opacity="0.3">
    <line x1="130" y1="160" x2="135" y2="175" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="135" y1="160" x2="140" y2="175" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="140" y1="160" x2="145" y2="175" stroke="#4a90e2" stroke-width="0.5"/>
  </g>
</svg>