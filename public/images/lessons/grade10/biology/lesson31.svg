<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 31: Деление клетки: митоз
  </text>
  
  <!-- Центральная линия времени -->
  <line x1="50" y1="320" x2="450" y2="320" stroke="#95a5a6" stroke-width="2"/>
  
  <!-- Фаза 1: Интерфаза -->
  <g transform="translate(80, 150)">
    <!-- Ядро -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="#3498db" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="none" stroke="#2980b9" stroke-width="2"/>
    <!-- Хромосомы -->
    <g opacity="0.6">
      <ellipse cx="-15" cy="-5" rx="8" ry="20" fill="#e74c3c"/>
      <ellipse cx="15" cy="-5" rx="8" ry="20" fill="#e74c3c"/>
      <ellipse cx="-5" cy="10" rx="8" ry="20" fill="#e74c3c"/>
      <ellipse cx="5" cy="10" rx="8" ry="20" fill="#e74c3c"/>
    </g>
    <!-- Цитоплазма -->
    <circle cx="0" cy="0" r="55" fill="#ecf0f1" opacity="0.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
    <!-- Этикетка -->
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Интерфаза</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Репликация ДНК</text>
  </g>
  
  <!-- Стрелка 1 -->
  <path d="M 140 190 L 180 190" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Фаза 2: Профаза -->
  <g transform="translate(200, 150)">
    <!-- Ядро -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="#9b59b6" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="none" stroke="#8e44ad" stroke-width="2"/>
    <!-- Хромосомы (спирализованные) -->
    <g opacity="0.8">
      <path d="M -15,-15 Q -15,-5 -15,5 Q -15,15 -15,25" stroke="#e74c3c" stroke-width="4" fill="none"/>
      <path d="M 15,-15 Q 15,-5 15,5 Q 15,15 15,25" stroke="#e74c3c" stroke-width="4" fill="none"/>
      <path d="M -5,-15 Q -5,-5 -5,5 Q -5,15 -5,25" stroke="#e74c3c" stroke-width="4" fill="none"/>
      <path d="M 5,-15 Q 5,-5 5,5 Q 5,15 5,25" stroke="#e74c3c" stroke-width="4" fill="none"/>
    </g>
    <!-- Цитоплазма -->
    <circle cx="0" cy="0" r="55" fill="#ecf0f1" opacity="0.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
    <!-- Центросомы -->
    <circle cx="-20" cy="0" r="3" fill="#f39c12"/>
    <circle cx="20" cy="0" r="3" fill="#f39c12"/>
    <!-- Этикетка -->
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Профаза</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Спирализация хромосом</text>
  </g>
  
  <!-- Стрелка 2 -->
  <path d="M 260 190 L 300 190" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Фаза 3: Метафаза -->
  <g transform="translate(320, 150)">
    <!-- Ядро (разрушается) -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="#f39c12" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="none" stroke="#d68910" stroke-width="2"/>
    <!-- Хромосомы на экваторе -->
    <g opacity="0.8">
      <g transform="translate(-15, -5) rotate(-30)">
        <rect x="-4" y="-20" width="8" height="40" fill="#e74c3c" rx="4"/>
      </g>
      <g transform="translate(15, -5) rotate(30)">
        <rect x="-4" y="-20" width="8" height="40" fill="#e74c3c" rx="4"/>
      </g>
      <g transform="translate(-5, 10) rotate(-30)">
        <rect x="-4" y="-20" width="8" height="40" fill="#e74c3c" rx="4"/>
      </g>
      <g transform="translate(5, 10) rotate(30)">
        <rect x="-4" y="-20" width="8" height="40" fill="#e74c3c" rx="4"/>
      </g>
    </g>
    <!-- Веретено деления -->
    <line x1="-30" y1="-40" x2="30" y2="40" stroke="#95a5a6" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="-40" x2="-30" y2="40" stroke="#95a5a6" stroke-width="1" opacity="0.6"/>
    <!-- Цитоплазма -->
    <circle cx="0" cy="0" r="55" fill="#ecf0f1" opacity="0.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
    <!-- Этикетка -->
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Метафаза</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Хромосомы на экваторе</text>
  </g>
  
  <!-- Стрелка 3 -->
  <path d="M 380 190 L 420 190" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Фаза 4: Анафаза и Телофаза (схематично) -->
  <g transform="translate(420, 150)">
    <!-- Две формирующиеся клетки -->
    <g opacity="0.7">
      <!-- Левая клетка -->
      <ellipse cx="-15" cy="0" rx="20" ry="25" fill="#27ae60" opacity="0.6"/>
      <ellipse cx="-15" cy="0" rx="20" ry="25" fill="none" stroke="#229954" stroke-width="2"/>
      <g transform="translate(-15, 0)">
        <rect x="-3" y="-15" width="6" height="30" fill="#e74c3c" rx="3" transform="rotate(-20)"/>
        <rect x="-3" y="-15" width="6" height="30" fill="#e74c3c" rx="3" transform="rotate(20)"/>
      </g>
      
      <!-- Правая клетка -->
      <ellipse cx="15" cy="0" rx="20" ry="25" fill="#27ae60" opacity="0.6"/>
      <ellipse cx="15" cy="0" rx="20" ry="25" fill="none" stroke="#229954" stroke-width="2"/>
      <g transform="translate(15, 0)">
        <rect x="-3" y="-15" width="6" height="30" fill="#e74c3c" rx="3" transform="rotate(-20)"/>
        <rect x="-3" y="-15" width="6" height="30" fill="#e74c3c" rx="3" transform="rotate(20)"/>
      </g>
    </g>
    <!-- Цитоплазма -->
    <circle cx="0" cy="0" r="55" fill="#ecf0f1" opacity="0.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
    <!-- Этикетка -->
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Анафаза/Телофаза</text>
    <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Разделение хромосом</text>
  </g>
  
  <!-- Дополнительно: этапы митоза -->
  <g transform="translate(50, 260)">
    <text font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan x="0" y="0">1. Интерфаза</tspan>
      <tspan x="120" y="0">2. Профаза</tspan>
      <tspan x="240" y="0">3. Метафаза</tspan>
      <tspan x="360" y="0">4. Анафаза</tspan>
    </text>
    <text font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan x="0" y="20">5. Телофаза</tspan>
      <tspan x="120" y="20">6. Цитокинез</tspan>
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="80" r="3" fill="#3498db" opacity="0.6"/>
  <circle cx="450" cy="80" r="3" fill="#e74c3c" opacity="0.6"/>
  <circle cx="50" cy="90" r="2" fill="#9b59b6" opacity="0.6"/>
  <circle cx="450" cy="90" r="2" fill="#27ae60" opacity="0.6"/>
  
  <!-- Определение митоза -->
  <rect x="100" y="290" width="300" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="250" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
    Митоз - способ деления эукариотических клеток
  </text>
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
    с сохранением хромосомного набора
  </text>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>