<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Паттерн для пластид -->
    <pattern id="starch" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1" fill="#f5deb3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#388e3c">Урок 18: Пластиды и рибосомы</text>
  
  <!-- Хлоропласта 1 -->
  <g transform="translate(80, 100)">
    <!-- Основная форма -->
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#66bb6a" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="58" ry="38" fill="#81c784"/>
    <!-- Граны -->
    <rect x="-40" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <rect x="-25" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <rect x="-10" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <rect x="5" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <rect x="20" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <rect x="35" y="-5" width="8" height="10" fill="#4caf50" transform="rotate(-15)"/>
    <!-- Строма -->
    <ellipse cx="0" cy="0" rx="50" ry="30" fill="#a5d6a7" opacity="0.6"/>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Хлоропласт</text>
  </g>
  
  <!-- Хромопласта -->
  <g transform="translate(250, 100)">
    <!-- Основная форма -->
    <path d="M -50 0 Q -50 -30, -20 -35 Q 10 -38, 40 -25 Q 50 -10, 45 10 Q 30 25, 0 30 Q -30 28, -50 10 Z" 
          fill="#ff7043" filter="url(#shadow)"/>
    <!-- Пигменты -->
    <circle cx="-20" cy="-10" r="8" fill="#ff5722" opacity="0.8"/>
    <circle cx="10" cy="-5" r="6" fill="#ff8a65" opacity="0.8"/>
    <circle cx="25" cy="5" r="7" fill="#ff7043" opacity="0.8"/>
    <circle cx="-10" cy="15" r="5" fill="#ff8a65" opacity="0.8"/>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#bf360c">Хромопласт</text>
  </g>
  
  <!-- Лейкопласта -->
  <g transform="translate(400, 100)">
    <!-- Основная форма -->
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="#eceff1" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="48" ry="33" fill="#cfd8dc"/>
    <!-- Крахмальные зерна -->
    <ellipse cx="-15" cy="-5" rx="12" ry="8" fill="url(#starch)"/>
    <ellipse cx="10" cy="5" rx="10" ry="7" fill="url(#starch)"/>
    <ellipse cx="0" cy="-10" rx="8" ry="6" fill="url(#starch)"/>
    <ellipse cx="-5" cy="10" rx="9" ry="6" fill="url(#starch)"/>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#37474f">Лейкопласт</text>
  </g>
  
  <!-- Связующая линия -->
  <path d="M 130 150 Q 190 180, 220 150" stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 300 150 Q 350 180, 370 150" stroke="#ff7043" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Рибосома 1 (свободная) -->
  <g transform="translate(80, 250)">
    <ellipse cx="-10" cy="0" rx="12" ry="8" fill="#795548" filter="url(#shadow)"/>
    <ellipse cx="10" cy="0" rx="12" ry="8" fill="#8d6e63"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">Свободная рибосома</text>
  </g>
  
  <!-- Рибосома 2 (на ЭПС) -->
  <g transform="translate(250, 250)">
    <!-- Эндоплазматическая сеть -->
    <path d="M -40 0 Q -20 -10, 0 0 Q 20 10, 40 0" stroke="#90a4ae" stroke-width="4" fill="none"/>
    <!-- Рибосомы на ЭПС -->
    <ellipse cx="-20" cy="-2" rx="8" ry="6" fill="#795548"/>
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#795548"/>
    <ellipse cx="20" cy="-2" rx="8" ry="6" fill="#795548"/>
    <!-- Дополнительные элементы -->
    <circle cx="-30" cy="-5" r="3" fill="#bcaaa4"/>
    <circle cx="30" cy="-5" r="3" fill="#bcaaa4"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37474f">Рибосома на ЭПС</text>
  </g>
  
  <!-- Рибосома 3 (митохондриальная) -->
  <g transform="translate(400, 250)">
    <!-- Митохондрия (фон) -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#ffe0b2" opacity="0.3"/>
    <path d="M -25 -10 Q -20 -15, -10 -12 Q 0 -10, 10 -12 Q 20 -15, 25 -10 Q 25 0, 20 5 Q 10 8, 0 5 Q -10 8, -20 5 Q -25 0, -25 -10" 
          fill="#ffb74d" opacity="0.3"/>
    <!-- Рибосома внутри -->
    <ellipse cx="-5" cy="0" rx="10" ry="7" fill="#795548"/>
    <ellipse cx="5" cy="0" rx="10" ry="7" fill="#8d6e63"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">Митохондриальная рибосома</text>
  </g>
  
  <!-- Дополнительные элементы для сложности -->
  <!-- Митохондрия (иллюстрация) -->
  <g transform="translate(150, 200)">
    <path d="M -20 -10 Q -25 -15, -15 -18 Q -5 -20, 5 -18 Q 15 -15, 20 -10 Q 20 0, 15 5 Q 5 8, -5 5 Q -15 8, -20 0 Z" 
          fill="#ffb74d" filter="url(#shadow)"/>
    <path d="M -15 -8 Q -10 -12, 0 -10 Q 10 -12, 15 -8" stroke="#ff9800" stroke-width="2" fill="none"/>
    <path d="M -10 -5 Q -5 -8, 0 -6 Q 5 -8, 10 -5" stroke="#ff9800" stroke-width="2" fill="none"/>
    <path d="M -5 -2 Q 0 -4, 5 -2" stroke="#ff9800" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Клеточная мембрана (фрагмент) -->
  <path d="M 350 180 Q 370 175, 390 180 Q 370 185, 350 180" stroke="#546e7a" stroke-width="3" fill="none"/>
  <circle cx="360" cy="180" r="2" fill="#78909c"/>
  <circle cx="370" cy="180" r="2" fill="#78909c"/>
  <circle cx="380" cy="180" r="2" fill="#78909c"/>
  
  <!-- Вакуоль -->
  <g transform="translate(50, 220)">
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#bbdefb" opacity="0.6" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="13" ry="23" fill="#90caf9" opacity="0.4"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Вакуоль</text>
  </g>
  
  <!-- Ядро (фрагмент) -->
  <g transform="translate(450, 220)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#ce93d8" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="18" ry="13" fill="#ba68c8" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#9c27b0" opacity="0.7"/>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a148c">Нуклеус</text>
  </g>
  
  <!-- Стрелки указания -->
  <g>
    <path d="M 80 160 L 80 190" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowgreen)"/>
    <path d="M 250 160 L 250 220" stroke="#ff7043" stroke-width="2" marker-end="url(#arroworange)"/>
    <path d="M 400 160 L 400 210" stroke="#78909c" stroke-width="2" marker-end="url(#arrowgray)"/>
  </g>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff7043"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#78909c"/>
    </marker>
  </defs>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="80" r="3" fill="#81c784" opacity="0.5"/>
  <circle cx="470" cy="80" r="3" fill="#ff7043" opacity="0.5"/>
  <circle cx="20" cy="300" r="2" fill="#795548" opacity="0.5"/>
  <circle cx="480" cy="300" r="2" fill="#795548" opacity="0.5"/>
  
  <!-- Легенда -->
  <g transform="translate(200, 310)">
    <rect x="-80" y="-15" width="160" height="30" fill="white" opacity="0.8" rx="5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#37474f">Пластиды: хлоропласты, хромопласты, лейкопласты</text>
  </g>
</svg>