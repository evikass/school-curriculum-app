<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f1e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dcc0;stop-opacity:1" />
    </linearGradient>
    <pattern id="paper" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="0.5" fill="#d4c4a8" opacity="0.3"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="350" fill="url(#bg)"/>
  <rect width="500" height="350" fill="url(#paper)" opacity="0.5"/>
  
  <!-- Title banner -->
  <rect x="50" y="30" width="400" height="60" fill="#8b4513" opacity="0.9" rx="5" filter="url(#shadow)"/>
  <text x="250" y="65" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#f9f9f9">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Lesson number -->
  <rect x="50" y="110" width="80" height="40" fill="#d2691e" opacity="0.8" rx="3"/>
  <text x="90" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">Урок 33</text>
  
  <!-- Main title -->
  <text x="250" y="135" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#5d4037">Декабристы</text>
  
  <!-- Date -->
  <rect x="370" y="110" width="80" height="40" fill="#a0522d" opacity="0.7" rx="3"/>
  <text x="410" y="135" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">1825 г.</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="200" r="15" fill="#cd853f" opacity="0.6"/>
  <circle cx="470" cy="200" r="15" fill="#cd853f" opacity="0.6"/>
  
  <!-- Central emblem -->
  <g transform="translate(250, 200)">
    <circle r="40" fill="#8b4513" opacity="0.8"/>
    <path d="M-30,0 L0,-20 L30,0 L0,20 Z" fill="#f9f9f9"/>
    <text y="5" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b4513">Δ</text>
  </g>
  
  <!-- Left column - Leaders -->
  <g transform="translate(80, 260)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5d4037">Лидеры:</text>
    <circle cx="0" cy="20" r="5" fill="#cd853f"/>
    <text y="24" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Пестель</text>
    <circle cx="0" cy="40" r="5" fill="#cd853f"/>
    <text y="44" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Рылеев</text>
    <circle cx="0" cy="60" r="5" fill="#cd853f"/>
    <text y="64" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Трубецкой</text>
  </g>
  
  <!-- Right column - Organizations -->
  <g transform="translate(320, 260)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5d4037">Организации:</text>
    <circle cx="0" cy="20" r="5" fill="#cd853f"/>
    <text y="24" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Северное общество</text>
    <circle cx="0" cy="40" r="5" fill="#cd853f"/>
    <text y="44" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Южное общество</text>
    <circle cx="0" cy="60" r="5" fill="#cd853f"/>
    <text y="64" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Общество соединенных славян</text>
  </g>
  
  <!-- Decorative lines -->
  <line x1="50" y1="180" x2="150" y2="180" stroke="#cd853f" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="180" x2="450" y2="180" stroke="#cd853f" stroke-width="2" opacity="0.6"/>
  
  <!-- Small decorative elements -->
  <g opacity="0.5">
    <rect x="60" y="170" width="20" height="2" fill="#8b4513"/>
    <rect x="420" y="170" width="20" height="2" fill="#8b4513"/>
    <rect x="240" y="160" width="2" height="20" fill="#8b4513"/>
    <rect x="240" y="220" width="2" height="20" fill="#8b4513"/>
  </g>
  
  <!-- Key dates -->
  <g transform="translate(50, 340)">
    <text font-family="Arial, sans-serif" font-size="11" fill="#5d4037">1816 - Основание Союза благоденствия</text>
    <text x="300" font-size="11" fill="#5d4037">14 декабря 1825 - Восстание на Сенатской площади</text>
  </g>
  
  <!-- Decorative corners -->
  <g opacity="0.4">
    <path d="M20,20 L40,20 L20,40 Z" fill="#8b4513"/>
    <path d="M480,20 L460,20 L480,40 Z" fill="#8b4513"/>
    <path d="M20,330 L40,330 L20,310 Z" fill="#8b4513"/>
    <path d="M480,330 L460,330 L480,310 Z" fill="#8b4513"/>
  </g>
  
  <!-- Additional decorative dots -->
  <g opacity="0.3">
    <circle cx="100" cy="300" r="2" fill="#8b4513"/>
    <circle cx="110" cy="300" r="2" fill="#8b4513"/>
    <circle cx="120" cy="300" r="2" fill="#8b4513"/>
    <circle cx="380" cy="300" r="2" fill="#8b4513"/>
    <circle cx="390" cy="300" r="2" fill="#8b4513"/>
    <circle cx="400" cy="300" r="2" fill="#8b4513"/>
  </g>
  
  <!-- Quote box -->
  <rect x="200" y="155" width="100" height="30" fill="none" stroke="#cd853f" stroke-width="1" opacity="0.5" rx="3"/>
  <text x="250" y="174" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b4513" font-style="italic">"Воля или смерть"</text>
</svg>