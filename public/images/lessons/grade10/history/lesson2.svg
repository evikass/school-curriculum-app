<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Текстурная обводка -->
    <pattern id="texture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <path d="M 0 4 L 4 0" stroke="#d1d5db" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <rect x="0" y="0" width="500" height="60" fill="#1e40af" opacity="0.9"/>
  
  <!-- Заголовок -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">ИСТОРИЯ · 10 КЛАСС</text>
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">Урок 2: Народы и государства Северного Кавказа и Причерноморья</text>
  
  <!-- Карта-фон -->
  <g transform="translate(50, 80)" opacity="0.3">
    <path d="M 0 80 Q 20 60 40 70 T 80 60 Q 100 50 120 60 T 160 50 Q 180 40 200 50 T 240 40 Q 260 30 280 40 T 320 30 Q 340 20 360 30 T 400 20" 
          fill="none" stroke="#4b5563" stroke-width="2"/>
    <path d="M 50 0 L 50 120 M 150 0 L 150 120 M 250 0 L 250 120 M 350 0 L 350 120" 
          stroke="#6b7280" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Основной блок контента -->
  <g transform="translate(60, 90)">
    <!-- Название блока -->
    <rect x="0" y="0" width="380" height="30" fill="#3b82f6" rx="5" filter="url(#shadow)"/>
    <text x="190" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Темы урока</text>
    
    <!-- Список тем -->
    <g transform="translate(10, 40)">
      <!-- Тема 1 -->
      <circle cx="5" cy="5" r="3" fill="#10b981"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">1. Древние государства Северного Кавказа</text>
      
      <!-- Тема 2 -->
      <circle cx="5" cy="25" r="3" fill="#10b981"/>
      <text x="15" y="29" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">2. Аланы и их государство</text>
      
      <!-- Тема 3 -->
      <circle cx="5" cy="45" r="3" fill="#10b981"/>
      <text x="15" y="49" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">3. Хазарский каганат и Причерноморье</text>
      
      <!-- Тема 4 -->
      <circle cx="5" cy="65" r="3" fill="#10b981"/>
      <text x="15" y="69" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">4. Византийское влияние в регионе</text>
      
      <!-- Тема 5 -->
      <circle cx="5" cy="85" r="3" fill="#10b981"/>
      <text x="15" y="89" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">5. Тюркские каганаты и их роль</text>
      
      <!-- Тема 6 -->
      <circle cx="5" cy="105" r="3" fill="#10b981"/>
      <text x="15" y="109" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">6. Культура и быт народов региона</text>
    </g>
  </g>
  
  <!-- Графическая иллюстрация -->
  <g transform="translate(320, 100)">
    <!-- Гора -->
    <path d="M 20 120 L 50 40 L 80 120 Z" fill="#6b7280" opacity="0.7"/>
    <path d="M 30 120 L 50 60 L 70 120 Z" fill="#4b5563" opacity="0.5"/>
    
    <!-- Солнце -->
    <circle cx="60" cy="30" r="15" fill="#fbbf24" opacity="0.8"/>
    <g stroke="#fbbf24" stroke-width="2" opacity="0.6">
      <line x1="60" y1="10" x2="60" y2="5"/>
      <line x1="60" y1="50" x2="60" y2="55"/>
      <line x1="40" y1="30" x2="35" y2="30"/>
      <line x1="80" y1="30" x2="85" y2="30"/>
      <line x1="47" y1="17" x2="43" y2="13"/>
      <line x1="73" y1="43" x2="77" y2="47"/>
      <line x1="73" y1="17" x2="77" y2="13"/>
      <line x1="47" y1="43" x2="43" y2="47"/>
    </g>
  </g>
  
  <!-- Дополнительная информация -->
  <g transform="translate(60, 250)">
    <!-- Подзаголовок -->
    <rect x="0" y="0" width="150" height="25" fill="#8b5cf6" rx="3" filter="url(#shadow)"/>
    <text x="75" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Хронологическая рамка</text>
    
    <!-- Линия времени -->
    <line x1="10" y1="40" x2="140" y2="40" stroke="#6b7280" stroke-width="2"/>
    <circle cx="10" cy="40" r="4" fill="#3b82f6"/>
    <circle cx="75" cy="40" r="4" fill="#3b82f6"/>
    <circle cx="140" cy="40" r="4" fill="#3b82f6"/>
    
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">III-VI вв.</text>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">VII-IX вв.</text>
    <text x="140" y="60" font-family="Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">X-XII вв.</text>
  </g>
  
  <!-- Справочная информация -->
  <g transform="translate(230, 250)">
    <rect x="0" y="0" width="210" height="80" fill="#f3f4f6" rx="5" stroke="#d1d5db" stroke-width="1"/>
    <text x="105" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Ключевые понятия</text>
    
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Кобанская культура</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Алания</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Хазарский каганат</text>
    
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Тмутаракань</text>
    <text x="110" y="55" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Древняя Албания</text>
    <text x="110" y="70" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Великая Болгария</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="30" cy="150" r="3" fill="#3b82f6"/>
    <circle cx="40" cy="160" r="2" fill="#8b5cf6"/>
    <circle cx="35" cy="170" r="2.5" fill="#10b981"/>
    
    <circle cx="460" cy="120" r="3" fill="#3b82f6"/>
    <circle cx="470" cy="130" r="2" fill="#8b5cf6"/>
    <circle cx="465" cy="140" r="2.5" fill="#10b981"/>
  </g>
  
  <!-- Подпись -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">© Учебный материал по истории 10 класса</text>
</svg>