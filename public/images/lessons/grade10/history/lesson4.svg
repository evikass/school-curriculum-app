<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c5b9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Текстура бумаги -->
    <pattern id="paper" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bgGradient)"/>
      <circle cx="20" cy="30" r="0.5" fill="#b8a090" opacity="0.3"/>
      <circle cx="80" cy="70" r="0.5" fill="#b8a090" opacity="0.3"/>
      <circle cx="50" cy="90" r="0.5" fill="#b8a090" opacity="0.3"/>
    </pattern>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#paper)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 4: Соседи восточных славян
  </text>
  
  <!-- Древо жизни -->
  <g transform="translate(250, 180)">
    <!-- Ствол -->
    <path d="M-3,0 L-2,40 L2,40 L3,0 Z" fill="#8b6f47" stroke="#6b5637" stroke-width="1"/>
    <!-- Крона -->
    <circle cx="0" cy="-10" r="25" fill="#228b22" opacity="0.8"/>
    <circle cx="-15" cy="-5" r="20" fill="#32cd32" opacity="0.7"/>
    <circle cx="15" cy="-5" r="20" fill="#32cd32" opacity="0.7"/>
    <circle cx="0" cy="-20" r="18" fill="#228b22" opacity="0.6"/>
  </g>
  
  <!-- Восточные соседи -->
  <g transform="translate(80, 180)">
    <rect x="-40" y="-30" width="80" height="60" rx="10" fill="#ff6b6b" opacity="0.3" stroke="#c92a2a" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c92a2a">
      Хазарский
    </text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c92a2a">
      каганат
    </text>
    <!-- Звезда Давида -->
    <path d="M0,-20 L3,-13 L10,-13 L4,-7 L7,0 L0,-6 L-7,0 L-4,-7 L-10,-13 L-3,-13 Z" fill="#c92a2a"/>
  </g>
  
  <!-- Западные соседи -->
  <g transform="translate(200, 120)">
    <rect x="-35" y="-25" width="70" height="50" rx="10" fill="#4dabf7" opacity="0.3" stroke="#1971c2" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1971c2">
      Варяги
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1971c2">
      (скандинавы)
    </text>
    <!-- Драккара -->
    <path d="M-15,-20 L15,-20 L12,-10 L-12,-10 Z M0,-20 L0,-25" fill="#1971c2" stroke="#1971c2" stroke-width="1"/>
  </g>
  
  <!-- Южные соседи -->
  <g transform="translate(300, 120)">
    <rect x="-35" y="-25" width="70" height="50" rx="10" fill="#ffd43b" opacity="0.3" stroke="#fab005" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fab005">
      Хазары
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fab005">
      и печенеги
    </text>
    <!-- Тент -->
    <path d="M-15,-20 L15,-20 L10,-10 L-10,-10 Z" fill="#fab005"/>
  </g>
  
  <!-- Северные соседи -->
  <g transform="translate(420, 180)">
    <rect x="-40" y="-30" width="80" height="60" rx="10" fill="#8ce99a" opacity="0.3" stroke="#2f9e44" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f9e44">
      Финно-угорские
    </text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f9e44">
      племена
    </text>
    <!-- Изба -->
    <rect x="-10" y="-20" width="20" height="15" fill="#2f9e44"/>
    <path d="M-12,-20 L0,-28 L12,-20" fill="none" stroke="#2f9e44" stroke-width="2"/>
  </g>
  
  <!-- Восточные славяне (центр) -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="35" fill="#e7a95f" opacity="0.5" stroke="#e67e22" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">
      Восточные
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">
      славяне
    </text>
    <!-- Щит -->
    <path d="M-15,-25 L-15,-15 L0,-8 L15,-15 L15,-25 Q15,-30 10,-30 L-10,-30 Q-15,-30 -15,-25 Z" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  </g>
  
  <!-- Стрелки связей -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Стрелки от восточных славян -->
  <line x1="215" y1="220" x2="120" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="215" x2="190" y2="145" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="275" y1="215" x2="310" y2="145" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="285" y1="220" x2="380" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Украшения - древнерусские символы -->
  <g transform="translate(50, 300)">
    <path d="M0,0 L5,10 L10,0 L5,5 Z" fill="#8b6f47"/>
    <circle cx="5" cy="5" r="3" fill="none" stroke="#8b6f47" stroke-width="1"/>
  </g>
  
  <g transform="translate(450, 300)">
    <path d="M0,0 L0,10 M-5,5 L5,5" stroke="#8b6f47" stroke-width="1"/>
    <circle cx="0" cy="5" r="4" fill="none" stroke="#8b6f47" stroke-width="1"/>
  </g>
  
  <!-- Древнерусский орнамент -->
  <g transform="translate(250, 320)">
    <path d="M-30,0 Q-20,-5 -10,0 Q0,-5 10,0 Q20,-5 30,0" fill="none" stroke="#8b6f47" stroke-width="1.5"/>
    <path d="M-30,5 Q-20,0 -10,5 Q0,0 10,5 Q20,0 30,5" fill="none" stroke="#8b6f47" stroke-width="1.5"/>
  </g>
  
  <!-- Даты и события -->
  <g transform="translate(100, 80)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">VII-IX вв.</text>
  </g>
  
  <g transform="translate(400, 80)">
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">IX-X вв.</text>
  </g>
  
  <!-- Компас -->
  <g transform="translate(450, 50)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#868e96" stroke-width="1.5"/>
    <path d="M0,-18 L0,18 M-18,0 L18,0" stroke="#868e96" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">С</text>
    <text x="22" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">В</text>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">Ю</text>
    <text x="-22" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">З</text>
  </g>
  
  <!-- Солнце -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="12" fill="#ffd43b" opacity="0.8"/>
    <path d="M0,-18 L0,-14 M12.7,-12.7 L9.9,-9.9 M18,0 L14,0 M12.7,12.7 L9.9,9.9 M0,18 L0,14 M-12.7,12.7 L-9.9,9.9 M-18,0 L-14,0 M-12.7,-12.7 L-9.9,-9.9" stroke="#ffd43b" stroke-width="2"/>
  </g>
  
  <!-- Река (визуализация торговли) -->
  <path d="M80,250 Q150,240 220,250" fill="none" stroke="#74c0fc" stroke-width="3" opacity="0.6"/>
  <path d="M280,250 Q350,240 420,250" fill="none" stroke="#74c0fc" stroke-width="3" opacity="0.6"/>
  
  <!-- Дополнительные элементы декора -->
  <g transform="translate(150, 280)">
    <rect x="0" y="0" width="20" height="3" fill="#8b6f47"/>
    <rect x="2" y="3" width="16" height="3" fill="#8b6f47"/>
    <rect x="4" y="6" width="12" height="3" fill="#8b6f47"/>
  </g>
  
  <g transform="translate(330, 280)">
    <rect x="0" y="0" width="20" height="3" fill="#8b6f47"/>
    <rect x="2" y="3" width="16" height="3" fill="#8b6f47"/>
    <rect x="4" y="6" width="12" height="3" fill="#8b6f47"/>
  </g>
  
  <!-- Водяные знаки -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#868e96" opacity="0.3">
    Урок истории 10 класс
  </text>
</svg>