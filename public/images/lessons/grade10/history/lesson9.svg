<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ffd700" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <rect width="500" height="350" fill="url(#dots)"/>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="3" fill="#ffd700"/>
    <circle cx="450" cy="50" r="3" fill="#ffd700"/>
    <circle cx="50" cy="300" r="3" fill="#ffd700"/>
    <circle cx="450" cy="300" r="3" fill="#ffd700"/>
  </g>
  
  <!-- Основной заголовок -->
  <text x="250" y="40" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="28" font-weight="bold" filter="url(#glow)">
    Урок 9: Расцвет Древней Руси
  </text>
  
  <text x="250" y="65" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="22" font-weight="bold" filter="url(#glow)">
    при Ярославе Мудром
  </text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  
  <!-- Подзаголовок -->
  <text x="250" y="105" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="14" opacity="0.9">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Схематичное изображение Софийского собора -->
  <g transform="translate(100, 130)">
    <rect x="0" y="20" width="80" height="60" fill="#8b7355" stroke="#d4af37" stroke-width="1"/>
    <polygon points="40,0 0,20 80,20" fill="#d4af37"/>
    <rect x="35" y="40" width="10" height="40" fill="#8b4513"/>
    <polygon points="40,0 30,15 50,15" fill="#ffd700"/>
    <circle cx="40" cy="50" r="3" fill="#ffd700"/>
  </g>
  
  <!-- Схематичное изображение княжеского трона -->
  <g transform="translate(250, 140)">
    <rect x="0" y="30" width="60" height="20" fill="#8b4513" stroke="#d4af37" stroke-width="1"/>
    <polygon points="0,30 10,10 50,10 60,30" fill="#d4af37"/>
    <rect x="20" y="0" width="20" height="15" fill="#ffd700"/>
    <circle cx="30" cy="0" r="2" fill="#fff"/>
  </g>
  
  <!-- Схематичное изображение книги -->
  <g transform="translate(350, 150)">
    <rect x="0" y="10" width="40" height="50" fill="#8b4513" stroke="#d4af37" stroke-width="1"/>
    <line x1="5" y1="20" x2="35" y2="20" stroke="#fff" stroke-width="1" opacity="0.7"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#fff" stroke-width="1" opacity="0.7"/>
    <line x1="5" y1="40" x2="35" y2="40" stroke="#fff" stroke-width="1" opacity="0.7"/>
    <line x1="5" y1="50" x2="35" y2="50" stroke="#fff" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Даты периода -->
  <g>
    <rect x="50" y="220" width="120" height="30" fill="#2c3e50" stroke="#ffd700" stroke-width="1" rx="5"/>
    <text x="110" y="240" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="14" font-weight="bold">
      1019-1054 гг.
    </text>
  </g>
  
  <!-- Ключевые достижения -->
  <g>
    <rect x="200" y="220" width="120" height="30" fill="#2c3e50" stroke="#ffd700" stroke-width="1" rx="5"/>
    <text x="260" y="240" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="14" font-weight="bold">
      Золотой век
    </text>
  </g>
  
  <!-- Столица -->
  <g>
    <rect x="350" y="220" width="100" height="30" fill="#2c3e50" stroke="#ffd700" stroke-width="1" rx="5"/>
    <text x="400" y="240" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="14" font-weight="bold">
      Киев
    </text>
  </g>
  
  <!-- Декоративный орнамент -->
  <g transform="translate(50, 270)">
    <path d="M0,0 Q10,-10 20,0 T40,0 T60,0 T80,0 T100,0" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M0,5 Q10,-5 20,5 T40,5 T60,5 T80,5 T100,5" stroke="#ffd700" stroke-width="1" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Символ мудрости -->
  <g transform="translate(200, 265)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
    <circle cx="30" cy="20" r="15" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
    <path d="M30,10 L30,30 M20,20 L40,20" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Символ справедливости -->
  <g transform="translate(320, 265)">
    <polygon points="30,10 20,30 40,30" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="10" x2="30" y2="30" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
    <circle cx="30" cy="10" r="5" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <g opacity="0.4">
    <circle cx="80" cy="130" r="2" fill="#ffd700"/>
    <circle cx="420" cy="130" r="2" fill="#ffd700"/>
    <circle cx="180" cy="280" r="2" fill="#ffd700"/>
    <circle cx="320" cy="280" r="2" fill="#ffd700"/>
  </g>
  
  <!-- Текстура пергамента -->
  <g opacity="0.1">
    <path d="M50,250 Q100,245 150,250 T250,250 T350,250 T450,250" stroke="#ffd700" stroke-width="1" fill="none"/>
    <path d="M50,260 Q100,255 150,260 T250,260 T350,260 T450,260" stroke="#ffd700" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Якорь мудрости -->
  <g transform="translate(250, 310)">
    <path d="M-10,0 Q-10,-10 0,-15 Q10,-10 10,0 Q10,10 0,15 Q-10,10 -10,0" 
          fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-15" x2="0" y2="-20" stroke="#ffd700" stroke-width="1.5" opacity="0.6"/>
    <path d="M0,-20 Q-5,-25 -5,-30 L-8,-35 M0,-20 Q5,-25 5,-30 L8,-35" 
          stroke="#ffd700" stroke-width="1" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Дополнительные символы -->
  <g opacity="0.3">
    <path d="M30,180 L35,190 L45,185 L40,195 L50,195 L42,200 L48,210 L40,205 L35,215 L30,205 L22,210 L28,200 L20,195 L30,195 L25,185 L35,190 Z" 
          fill="#ffd700" transform="translate(420, 40)"/>
    <circle cx="80" cy="180" r="8" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <path d="M80,175 L80,185 M75,180 L85,180" stroke="#ffd700" stroke-width="1.5"/>
  </g>
  
  <!-- Текстура золота -->
  <g opacity="0.2">
    <rect x="0" y="0" width="500" height="50" fill="url(#goldGrad)" mask="url(#mask)"/>
    <mask id="mask">
      <rect x="0" y="0" width="500" height="50" fill="white"/>
      <g opacity="0.3">
        <rect x="50" y="10" width="100" height="5"/>
        <rect x="200" y="15" width="80" height="5"/>
        <rect x="320" y="8" width="120" height="5"/>
      </g>
    </mask>
  </g>
</svg>