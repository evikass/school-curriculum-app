<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dcc0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Текстура бумаги -->
    <pattern id="paper" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bgGrad)"/>
      <circle cx="20" cy="20" r="0.5" fill="#d0c4a0" opacity="0.3"/>
      <circle cx="80" cy="40" r="0.5" fill="#d0c4a0" opacity="0.3"/>
      <circle cx="40" cy="80" r="0.5" fill="#d0c4a0" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#paper)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#8b4513" filter="url(#textShadow)">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" font-family="Georgia, serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#6b3410">
    Урок 35: Великие реформы Александра II
  </text>
  
  <!-- Портрет Александра II -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="80" height="100" fill="#d4c5b9" stroke="#8b6f47" stroke-width="2" rx="5"/>
    <circle cx="40" cy="35" r="20" fill="#f4d1ae" stroke="#8b6f47" stroke-width="1"/>
    <rect x="25" y="50" width="30" height="35" fill="#2c1810" stroke="#8b6f47" stroke-width="1"/>
    <path d="M 20 25 Q 40 15 60 25" fill="none" stroke="#2c1810" stroke-width="2"/>
    <circle cx="32" cy="32" r="1.5" fill="#2c1810"/>
    <circle cx="48" cy="32" r="1.5" fill="#2c1810"/>
    <path d="M 35 38 Q 40 42 45 38" fill="none" stroke="#2c1810" stroke-width="1.5"/>
    <rect x="35" y="20" width="10" height="8" fill="#2c1810"/>
    <circle cx="40" cy="50" r="8" fill="#f4d1ae" stroke="#8b6f47" stroke-width="1"/>
  </g>
  
  <!-- Надпись портрета -->
  <text x="90" y="135" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#6b3410">
    Александр II
  </text>
  <text x="90" y="150" font-family="Georgia, serif" font-size="11" fill="#8b6f47">
    1818-1881
  </text>
  
  <!-- Даты реформ -->
  <g transform="translate(160, 85)">
    <!-- Освобождение крестьян -->
    <rect x="0" y="0" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="70" y="18" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1861 г.
    </text>
    <text x="70" y="32" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Отмена крепостного права
    </text>
    
    <!-- Земская реформа -->
    <rect x="0" y="55" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="70" y="73" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1864 г.
    </text>
    <text x="70" y="87" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Земская реформа
    </text>
    
    <!-- Судебная реформа -->
    <rect x="0" y="110" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="70" y="128" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1864 г.
    </text>
    <text x="70" y="142" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Судебная реформа
    </text>
    
    <!-- Военная реформа -->
    <rect x="150" y="0" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="220" y="18" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1874 г.
    </text>
    <text x="220" y="32" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Военная реформа
    </text>
    
    <!-- Финансовая реформа -->
    <rect x="150" y="55" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="220" y="73" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1860-е гг.
    </text>
    <text x="220" y="87" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Финансовая реформа
    </text>
    
    <!-- Народное просвещение -->
    <rect x="150" y="110" width="140" height="45" fill="#e8dcc0" stroke="#8b6f47" stroke-width="1.5" rx="3"/>
    <text x="220" y="128" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b3410">
      1864 г.
    </text>
    <text x="220" y="142" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47">
      Реформа образования
    </text>
  </g>
  
  <!-- Декоративный элемент - имперская корона -->
  <g transform="translate(370, 90)">
    <path d="M 30 10 L 25 5 L 20 10 L 15 5 L 10 10 L 5 5 L 0 10 L 0 35 L 5 40 L 10 35 L 15 40 L 20 35 L 25 40 L 30 35 L 35 40 L 40 35 L 45 40 L 50 35 L 55 40 L 60 35 L 65 40 L 70 35 L 75 40 L 80 35 L 80 10 L 75 5 L 70 10 L 65 5 L 60 10 L 55 5 L 50 10 L 45 5 L 40 10 L 35 5 L 30 10" 
          fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <rect x="0" y="35" width="80" height="5" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="15" cy="20" r="3" fill="#ff6347"/>
    <circle cx="40" cy="20" r="3" fill="#4169e1"/>
    <circle cx="65" cy="20" r="3" fill="#32cd32"/>
  </g>
  
  <!-- Статистика реформ -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="400" height="80" fill="#f8f4e6" stroke="#8b6f47" stroke-width="2" rx="5" opacity="0.8"/>
    <text x="200" y="20" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b3410">
      Значение реформ
    </text>
    
    <!-- Символы значимости -->
    <g transform="translate(20, 30)">
      <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="#6b3410">1</text>
      <text x="20" y="4" font-family="Georgia, serif" font-size="10" fill="#6b3410">Экономическое развитие</text>
    </g>
    
    <g transform="translate(20, 50)">
      <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="#6b3410">2</text>
      <text x="20" y="4" font-family="Georgia, serif" font-size="10" fill="#6b3410">Социальная модернизация</text>
    </g>
    
    <g transform="translate(220, 30)">
      <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="#6b3410">3</text>
      <text x="20" y="4" font-family="Georgia, serif" font-size="10" fill="#6b3410">Правовые изменения</text>
    </g>
    
    <g transform="translate(220, 50)">
      <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="#6b3410">4</text>
      <text x="20" y="4" font-family="Georgia, serif" font-size="10" fill="#6b3410">Культурный прогресс</text>
    </g>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <path d="M 10 20 L 15 15 L 20 20" fill="none" stroke="#8b6f47" stroke-width="2"/>
    <path d="M 480 20 L 485 15 L 490 20" fill="none" stroke="#8b6f47" stroke-width="2"/>
    <path d="M 10 330 L 15 335 L 20 330" fill="none" stroke="#8b6f47" stroke-width="2"/>
    <path d="M 480 330 L 485 335 L 490 330" fill="none" stroke="#8b6f47" stroke-width="2"/>
  </g>
  
  <!-- Подпись внизу -->
  <text x="250" y="340" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#8b6f47" font-style="italic">
    "Освободить крестьян, спасти Россию"
  </text>
</svg>