<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="bgPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#f5f5dc"/>
      <circle cx="25" cy="25" r="1" fill="#8b7355"/>
    </pattern>
    
    <!-- Градиент для флага -->
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b22222;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3c3b6e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgPattern)"/>
  
  <!-- Название урока -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b0000">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#654321">Урок 17: Куликовская битва</text>
  
  <!-- Даты -->
  <rect x="50" y="80" width="400" height="30" fill="#d2691e" opacity="0.3" rx="5"/>
  <text x="250" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#654321">8 сентября 1380 г.</text>
  
  <!-- Карта битвы -->
  <g id="map">
    <rect x="50" y="120" width="400" height="150" fill="#f0e68c" stroke="#8b7355" stroke-width="2" rx="5"/>
    
    <!-- Река Дон -->
    <path d="M 100 170 Q 200 180 300 170 T 450 170" stroke="#4682b4" stroke-width="8" fill="none"/>
    <text x="275" y="165" font-family="Arial, sans-serif" font-size="12" fill="#4682b4">р. Дон</text>
    
    <!-- Лес -->
    <circle cx="120" cy="140" r="20" fill="#228b22" opacity="0.7"/>
    <circle cx="140" cy="150" r="15" fill="#228b22" opacity="0.7"/>
    <circle cx="160" cy="135" r="18" fill="#228b22" opacity="0.7"/>
    <circle cx="380" cy="140" r="25" fill="#228b22" opacity="0.7"/>
    <circle cx="400" cy="150" r="20" fill="#228b22" opacity="0.7"/>
    <circle cx="420" cy="135" r="15" fill="#228b22" opacity="0.7"/>
    
    <!-- Поле битвы -->
    <ellipse cx="250" cy="200" rx="120" ry="40" fill="#daa520" opacity="0.5"/>
    <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8b4513">Поле битвы</text>
    
    <!-- Позиции войск -->
    <!-- Русские войска -->
    <rect x="200" y="190" width="100" height="20" fill="#ff6347" opacity="0.8" rx="3"/>
    <text x="250" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Русские войска</text>
    
    <!-- Татары -->
    <rect x="150" y="160" width="80" height="20" fill="#8b0000" opacity="0.8" rx="3"/>
    <text x="190" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Татары</text>
    
    <rect x="320" y="160" width="80" height="20" fill="#8b0000" opacity="0.8" rx="3"/>
    <text x="360" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Татары</text>
  </g>
  
  <!-- Флаг Дмитрия Донского -->
  <g id="flag" transform="translate(100, 140)">
    <rect x="0" y="0" width="40" height="30" fill="url(#flagGradient)" stroke="#8b4513" stroke-width="1"/>
    <circle cx="20" cy="15" r="8" fill="#ffd700"/>
    <path d="M 20 10 L 22 18 L 16 14 L 24 14 L 18 18 Z" fill="#8b0000"/>
  </g>
  
  <!-- Доспехи -->
  <g id="armor" transform="translate(350, 150)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="-10" y="-15" width="20" height="10" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <path d="M -10 -5 L -5 5 L 0 -2 L 5 5 L 10 -5" fill="none" stroke="#808080" stroke-width="1"/>
  </g>
  
  <!-- Меч -->
  <g id="sword" transform="translate(320, 140)">
    <rect x="0" y="0" width="4" height="25" fill="#c0c0c0"/>
    <rect x="-2" y="20" width="8" height="5" fill="#8b4513"/>
    <path d="M 0 -5 L -3 0 L 3 0 Z" fill="#c0c0c0"/>
  </g>
  
  <!-- Лук -->
  <g id="bow" transform="translate(380, 145)">
    <path d="M 0 0 Q -10 5 -10 10 Q -10 15 0 20 Q 10 15 10 10 Q 10 5 0 0" fill="none" stroke="#8b4513" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="20" stroke="#654321" stroke-width="1"/>
  </g>
  
  <!-- Щит -->
  <g id="shield" transform="translate(400, 150)">
    <path d="M 0 0 L 0 15 Q 0 20 5 20 L 10 20 Q 15 20 15 15 L 15 0 Q 10 5 7.5 7.5 Q 5 5 0 0" fill="#8b0000" stroke="#654321" stroke-width="1"/>
    <line x1="7.5" y1="5" x2="7.5" y2="15" stroke="#ffd700" stroke-width="2"/>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g id="decorations">
    <!-- Колесо -->
    <circle cx="80" cy="290" r="15" fill="none" stroke="#8b4513" stroke-width="2"/>
    <circle cx="80" cy="290" r="5" fill="#8b4513"/>
    <line x1="80" y1="290" x2="80" y2="275" stroke="#8b4513" stroke-width="2"/>
    <line x1="80" y1="290" x2="95" y2="290" stroke="#8b4513" stroke-width="2"/>
    <line x1="80" y1="290" x2="80" y2="305" stroke="#8b4513" stroke-width="2"/>
    <line x1="80" y1="290" x2="65" y2="290" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Кирпичи -->
    <rect x="120" y="280" width="40" height="20" fill="#b22222" stroke="#8b0000" stroke-width="1"/>
    <line x1="140" y1="280" x2="140" y2="300" stroke="#8b0000" stroke-width="1"/>
    <line x1="120" y1="290" x2="160" y2="290" stroke="#8b0000" stroke-width="1"/>
    
    <!-- Цветок -->
    <g transform="translate(400, 280)">
      <circle cx="0" cy="0" r="5" fill="#ffd700"/>
      <circle cx="-8" cy="-5" r="5" fill="#ff69b4"/>
      <circle cx="8" cy="-5" r="5" fill="#ff69b4"/>
      <circle cx="-8" cy="5" r="5" fill="#ff69b4"/>
      <circle cx="8" cy="5" r="5" fill="#ff69b4"/>
      <line x1="0" y1="5" x2="0" y2="15" stroke="#228b22" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Текстовая информация -->
  <g id="info">
    <rect x="50" y="290" width="400" height="40" fill="#f5deb3" opacity="0.7" rx="5"/>
    <text x="70" y="305" font-family="Arial, sans-serif" font-size="11" fill="#654321">
      <tspan x="70" dy="0">Командующий: Дмитрий Донской</tspan>
      <tspan x="70" dy="15">Значение: начало освобождения русских земель от ордынского ига</tspan>
    </text>
  </g>
  
  <!-- Вензель -->
  <g id="monogram" transform="translate(450, 30)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="15" fill="#ffd700" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8b0000">ДД</text>
  </g>
</svg>