<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="bgPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#f5f3f0"/>
      <circle cx="25" cy="25" r="2" fill="#d4a574" opacity="0.3"/>
    </pattern>
    
    <!-- Градиент для фона -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8ddd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0ece5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  <rect width="500" height="350" fill="url(#bgPattern)"/>
  
  <!-- Декоративная рамка -->
  <rect x="20" y="20" width="460" height="310" fill="none" stroke="#8b6f47" stroke-width="2" opacity="0.6"/>
  <rect x="30" y="30" width="440" height="290" fill="none" stroke="#8b6f47" stroke-width="1" opacity="0.4"/>
  
  <!-- Заголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#4a3c28">
    УРОК 21
  </text>
  <text x="250" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="normal" fill="#6b5a42">
    Русская культура XIV–XV веков
  </text>
  
  <!-- Водяной знак "ИСТОРИЯ · 10 КЛАСС" -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8b6f47" opacity="0.3">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Иконка книги -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="40" height="50" fill="#8b6f47" rx="2" filter="url(#shadow)"/>
    <rect x="5" y="5" width="30" height="40" fill="#f5f3f0"/>
    <line x1="10" y1="15" x2="30" y2="15" stroke="#8b6f47" stroke-width="1"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#8b6f47" stroke-width="1"/>
    <line x1="10" y1="25" x2="25" y2="25" stroke="#8b6f47" stroke-width="1"/>
    <rect x="10" y="32" width="20" height="8" fill="#d4a574" opacity="0.5"/>
  </g>
  
  <!-- Иконка кисти -->
  <g transform="translate(150, 120)">
    <rect x="0" y="20" width="8" height="20" fill="#8b6f47"/>
    <path d="M 4 0 L 0 20 L 8 20 Z" fill="#d4a574"/>
    <circle cx="4" cy="5" r="3" fill="#8b4513" opacity="0.7"/>
    <circle cx="2" cy="8" r="2" fill="#a0522d" opacity="0.7"/>
    <circle cx="6" cy="7" r="2" fill="#8b4513" opacity="0.7"/>
  </g>
  
  <!-- Иконка собора -->
  <g transform="translate(220, 120)">
    <rect x="10" y="30" width="20" height="20" fill="#8b6f47"/>
    <path d="M 5 30 L 15 20 L 25 30 Z" fill="#8b6f47"/>
    <rect x="7" y="35" width="4" height="10" fill="#4a3c28"/>
    <rect x="19" y="35" width="4" height="10" fill="#4a3c28"/>
    <circle cx="15" cy="20" r="2" fill="#d4a574"/>
    <rect x="12" y="22" width="6" height="3" fill="#8b6f47"/>
  </g>
  
  <!-- Иконка музыка -->
  <g transform="translate(290, 120)">
    <ellipse cx="8" cy="30" rx="4" ry="6" fill="#8b6f47"/>
    <ellipse cx="22" cy="25" rx="4" ry="6" fill="#8b6f47"/>
    <rect x="8" y="15" width="2" height="15" fill="#8b6f47"/>
    <rect x="22" y="10" width="2" height="15" fill="#8b6f47"/>
    <path d="M 10 15 Q 20 10 22 10" stroke="#8b6f47" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Иконка летописи -->
  <g transform="translate(360, 120)">
    <rect x="0" y="10" width="30" height="35" fill="#f5f3f0" stroke="#8b6f47" stroke-width="2" rx="1"/>
    <line x1="5" y1="20" x2="25" y2="20" stroke="#8b6f47" stroke-width="1"/>
    <line x1="5" y1="25" x2="25" y2="25" stroke="#8b6f47" stroke-width="1"/>
    <line x1="5" y1="30" x2="25" y2="30" stroke="#8b6f47" stroke-width="1"/>
    <line x1="5" y1="35" x2="20" y2="35" stroke="#8b6f47" stroke-width="1"/>
  </g>
  
  <!-- Разделительные линии -->
  <line x1="60" y1="190" x2="440" y2="190" stroke="#8b6f47" stroke-width="1" opacity="0.4"/>
  
  <!-- Текст разделов -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a3c28">
    Литература
  </text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • «Слово о погибели Русской земли»
  </text>
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • «Задонщина»
  </text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • «Повесть о разорении Рязани Батыем»
  </text>
  
  <text x="280" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a3c28">
    Архитектура
  </text>
  <text x="280" y="240" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • Дмитровский кремль
  </text>
  <text x="280" y="255" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • Церковь Спаса на Ильине
  </text>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="12" fill="#6b5a42">
    • Покровский монастырь
  </text>
  
  <!-- Декоративные элементы -->
  <g transform="translate(50, 100)">
    <circle cx="0" cy="0" r="3" fill="#d4a574" opacity="0.5"/>
    <circle cx="10" cy="5" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="5" cy="10" r="2.5" fill="#d4a574" opacity="0.3"/>
  </g>
  
  <g transform="translate(430, 100)">
    <circle cx="0" cy="0" r="3" fill="#d4a574" opacity="0.5"/>
    <circle cx="-10" cy="5" r="2" fill="#d4a574" opacity="0.4"/>
    <circle cx="-5" cy="10" r="2.5" fill="#d4a574" opacity="0.3"/>
  </g>
  
  <!-- Орнаментальные элементы -->
  <path d="M 40 80 Q 50 70 60 80" stroke="#8b6f47" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 440 80 Q 450 70 460 80" stroke="#8b6f47" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Даты -->
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="11" fill="#8b6f47" opacity="0.7">
    XIV–XV вв.
  </text>
  <text x="440" y="310" font-family="Arial, sans-serif" font-size="11" fill="#8b6f47" opacity="0.7" text-anchor="end">
    Золотой век
  </text>
  
  <!-- Малые декоративные кружки -->
  <circle cx="120" cy="280" r="2" fill="#d4a574" opacity="0.3"/>
  <circle cx="130" cy="285" r="1.5" fill="#d4a574" opacity="0.3"/>
  <circle cx="125" cy="290" r="1" fill="#d4a574" opacity="0.3"/>
  
  <circle cx="380" cy="280" r="2" fill="#d4a574" opacity="0.3"/>
  <circle cx="370" cy="285" r="1.5" fill="#d4a574" opacity="0.3"/>
  <circle cx="375" cy="290" r="1" fill="#d4a574" opacity="0.3"/>
</svg>