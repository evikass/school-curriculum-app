<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f2e8"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#8b4513" stroke-width="3"/>
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="45" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#8b4513">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="85" font-family="Georgia, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#5d4037">Урок 27: Начало правления Петра I</text>
  
  <!-- Декоративный элемент - корона -->
  <g transform="translate(250, 105)">
    <path d="M-30,0 L-20,-10 L-15,-5 L-10,-12 L-5,-8 L0,-15 L5,-8 L10,-12 L15,-5 L20,-10 L30,0 L25,5 L15,8 L10,15 L5,10 L0,18 L-5,10 L-10,15 L-15,8 L-25,5 Z" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="0" cy="-15" r="3" fill="#b8860b"/>
  </g>
  
  <!-- Портрет Петра I -->
  <g transform="translate(100, 150)">
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="#fdbcb4"/>
    <path d="M-35,-30 Q-35,-45 -20,-48 Q0,-50 20,-48 Q35,-45 35,-30 L35,-20 Q35,-10 25,-5 L25,5 Q25,15 15,20 L-15,20 Q-25,15 -25,5 L-25,-5 Q-35,-10 -35,-20 Z" fill="#8b4513"/>
    <circle cx="-15" cy="-10" r="2" fill="#000"/>
    <circle cx="15" cy="-10" r="2" fill="#000"/>
    <path d="M-10,-5 Q0,-8 10,-5" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-25,5 Q-20,10 -15,5 M15,5 Q20,10 25,5" fill="none" stroke="#8b4513" stroke-width="2"/>
    <!-- Усы -->
    <path d="M-10,-5 Q-20,0 -25,5" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10,-5 Q20,0 25,5" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Текстовая информация о Петре -->
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5d4037">Пётр I Великий</text>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">1672-1725</text>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">Правление:</text>
  <text x="180" y="195" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">1682-1725</text>
  
  <!-- Хронологическая линия -->
  <line x1="50" y1="240" x2="450" y2="240" stroke="#8b4513" stroke-width="2"/>
  <circle cx="100" cy="240" r="5" fill="#8b4513"/>
  <circle cx="200" cy="240" r="5" fill="#8b4513"/>
  <circle cx="300" cy="240" r="5" fill="#8b4513"/>
  <circle cx="400" cy="240" r="5" fill="#8b4513"/>
  
  <!-- Даты на хронологической линии -->
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">1682</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">1689</text>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">1696</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">1700</text>
  
  <!-- События -->
  <text x="100" y="275" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#5d4037">Начало правления</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#5d4037">Стрелецкий бунт</text>
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#5d4037">Азовские походы</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#5d4037">Начало Северной войны</text>
  
  <!-- Декоративные элементы - орнаменты -->
  <g transform="translate(50, 300)">
    <path d="M0,0 L10,0 M5,-5 L5,5" stroke="#8b4513" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#8b4513"/>
    <circle cx="10" cy="0" r="2" fill="#8b4513"/>
  </g>
  
  <g transform="translate(430, 300)">
    <path d="M0,0 L10,0 M5,-5 L5,5" stroke="#8b4513" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#8b4513"/>
    <circle cx="10" cy="0" r="2" fill="#8b4513"/>
  </g>
  
  <!-- Ключевые реформы и события -->
  <g transform="translate(250, 140)">
    <rect x="-80" y="10" width="160" height="70" fill="#fff" stroke="#8b4513" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#5d4037">Ключевые события:</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">• Великое посольство</text>
    <text x="0" y="62" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">• Основание флота</text>
    <text x="0" y="76" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#5d4037">• Издание указа о брадобритии</text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <g transform="translate(380, 150)">
    <rect x="0" y="0" width="30" height="40" fill="#cd853f" stroke="#8b4513" stroke-width="1" rx="2"/>
    <rect x="5" y="5" width="20" height="5" fill="#8b4513"/>
    <rect x="5" y="15" width="20" height="5" fill="#8b4513"/>
    <rect x="5" y="25" width="20" height="5" fill="#8b4513"/>
  </g>
  
  <!-- Вензель Петра I -->
  <g transform="translate(350, 190)">
    <path d="M0,0 Q10,0 10,10 Q10,20 0,20 Q-10,20 -10,10 Q-10,0 0,0 M0,0 L0,20 M-10,10 L10,10" fill="none" stroke="#8b4513" stroke-width="2"/>
    <text x="0" y="35" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#5d4037">P I</text>
  </g>
  
  <!-- Декоративные углы -->
  <g transform="translate(30, 30)">
    <path d="M0,0 L20,0 L0,20 Z" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g transform="translate(470, 30)">
    <path d="M0,0 L-20,0 L0,20 Z" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g transform="translate(30, 320)">
    <path d="M0,0 L20,0 L0,-20 Z" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g transform="translate(470, 320)">
    <path d="M0,0 L-20,0 L0,-20 Z" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  
  <!-- Символ реформ -->
  <g transform="translate(60, 190)">
    <circle cx="0" cy="0" r="15" fill="#fff" stroke="#8b4513" stroke-width="2"/>
    <path d="M-8,-3 L-3,2 L8,-8" fill="none" stroke="#8b4513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Дополнительный текст -->
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5d4037" font-style="italic">"Великая реформа началась с малого..."</text>
</svg>