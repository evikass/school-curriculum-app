<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f2f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e2dc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тени -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Текстурная заливка для фона -->
    <pattern id="texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bgGrad)"/>
      <circle cx="25" cy="25" r="1" fill="#d0c8c0" opacity="0.3"/>
      <circle cx="75" cy="75" r="1" fill="#d0c8c0" opacity="0.3"/>
      <circle cx="75" cy="25" r="1" fill="#d0c8c0" opacity="0.3"/>
      <circle cx="25" cy="75" r="1" fill="#d0c8c0" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#texture)"/>
  
  <!-- Герб России -->
  <g transform="translate(50, 50)">
    <circle cx="30" cy="30" r="28" fill="#b22222" stroke="#8b0000" stroke-width="2"/>
    <path d="M30 10 L35 20 L45 20 L37 28 L40 38 L30 32 L20 38 L23 28 L15 20 L25 20 Z" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="30" cy="30" r="8" fill="#ffd700"/>
  </g>
  
  <!-- Основной заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#2c3e50">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#34495e">
    Урок 32
  </text>
  
  <!-- Название темы -->
  <text x="250" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#2c3e50">
    Александр I и реформы начала XIX в.
  </text>
  
  <!-- Портрет Александра I -->
  <g transform="translate(320, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="140" rx="5" fill="#fff" stroke="#8b6914" stroke-width="2"/>
    <circle cx="60" cy="50" r="35" fill="#fdbcb4" stroke="#8b6914" stroke-width="1"/>
    <path d="M60 50 Q50 60 50 70 Q50 80 60 80 Q70 80 70 70 Q70 60 60 50" fill="#fdbcb4"/>
    <circle cx="50" cy="45" r="2" fill="#2c3e50"/>
    <circle cx="70" cy="45" r="2" fill="#2c3e50"/>
    <path d="M55 55 Q60 58 65 55" stroke="#2c3e50" stroke-width="1" fill="none"/>
    <rect x="25" y="85" width="70" height="50" fill="#4169e1" stroke="#8b6914" stroke-width="1"/>
    <path d="M35 85 L45 85 L45 95 L55 95 L55 85 L65 85 L65 95 L75 95 L75 85 L85 85 L85 95 L90 95" stroke="#ffd700" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Дата правления -->
  <text x="380" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    1801-1825
  </text>
  
  <!-- Список реформ -->
  <g transform="translate(50, 180)">
    <!-- Манифест 1801 -->
    <rect x="0" y="0" width="200" height="30" rx="3" fill="#e74c3c" opacity="0.8"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" fill="#fff">
      Манифест о вольности дворянства
    </text>
    
    <!-- Сенатская реформа -->
    <rect x="0" y="40" width="200" height="30" rx="3" fill="#3498db" opacity="0.8"/>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="14" fill="#fff">
      Реформа Сената (1802)
    </text>
    
    <!-- Министерская реформа -->
    <rect x="0" y="80" width="200" height="30" rx="3" fill="#27ae60" opacity="0.8"/>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="14" fill="#fff">
      Министерская реформа (1802)
    </text>
  </g>
  
  <!-- Годы реформ -->
  <g transform="translate(270, 180)">
    <circle cx="10" cy="15" r="4" fill="#e74c3c"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1801</text>
    
    <circle cx="10" cy="55" r="4" fill="#3498db"/>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1802</text>
    
    <circle cx="10" cy="95" r="4" fill="#27ae60"/>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1803</text>
  </g>
  
  <!-- Декларация о правах -->
  <g transform="translate(260, 180)">
    <rect x="60" y="0" width="180" height="120" rx="5" fill="#fff" stroke="#8b6914" stroke-width="1" filter="url(#shadow)"/>
    <text x="70" y="25" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Декларация прав
    </text>
    <text x="70" y="45" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2c3e50">
      и состояний
    </text>
    <text x="70" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Равенство перед законом
    </text>
    <text x="70" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Право собственности
    </text>
    <text x="70" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Свобода совести
    </text>
  </g>
  
  <!-- Элементы декорации -->
  <!-- Орнамент слева -->
  <g transform="translate(20, 120)">
    <path d="M0 0 Q10 10 0 20 Q10 30 0 40" stroke="#8b6914" stroke-width="2" fill="none"/>
    <path d="M0 0 Q10 -10 0 -20 Q10 -30 0 -40" stroke="#8b6914" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Орнамент справа -->
  <g transform="translate(480, 120)">
    <path d="M0 0 Q-10 10 0 20 Q-10 30 0 40" stroke="#8b6914" stroke-width="2" fill="none"/>
    <path d="M0 0 Q-10 -10 0 -20 Q-10 -30 0 -40" stroke="#8b6914" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Геральдический щит -->
  <g transform="translate(440, 250)">
    <path d="M0 20 L0 0 L20 0 L20 20 L10 30 Z" fill="#ffd700" stroke="#8b6914" stroke-width="1"/>
    <text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8b6914">АI</text>
  </g>
  
  <!-- Клеймо -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#8b6914" opacity="0.8"/>
    <text x="40" y="17" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#fff">
      РОССИЯ
    </text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="100" cy="120" r="3" fill="#8b6914" opacity="0.5"/>
  <circle cx="400" cy="120" r="3" fill="#8b6914" opacity="0.5"/>
  <circle cx="100" cy="130" r="2" fill="#8b6914" opacity="0.5"/>
  <circle cx="400" cy="130" r="2" fill="#8b6914" opacity="0.5"/>
  
  <!-- Линии разделения -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="#8b6914" stroke-width="1" opacity="0.5"/>
  <line x1="250" y1="170" x2="250" y2="320" stroke="#8b6914" stroke-width="1" opacity="0.5"/>
</svg>