<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="riverPattern" x="0" y="0" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q25,0 50,10 T100,10" stroke="rgba(65,105,225,0.3)" stroke-width="2" fill="none"/>
    </pattern>
    
    <!-- Текстура земли -->
    <filter id="roughPaper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  <text x="250" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Планшет/книга -->
  <rect x="50" y="80" width="400" height="260" rx="5" fill="#f4e4c1" stroke="#8b6914" stroke-width="2" filter="url(#roughPaper)"/>
  
  <!-- Страницы -->
  <rect x="60" y="90" width="190" height="240" fill="#fefefe" opacity="0.9"/>
  <rect x="250" y="90" width="190" height="240" fill="#fefefe" opacity="0.9"/>
  
  <!-- Разделительная линия -->
  <line x1="250" y1="90" x2="250" y2="330" stroke="#ddd" stroke-width="1"/>
  
  <!-- Река Угра -->
  <path d="M60,200 Q120,190 180,200 T300,200 T420,200" stroke="rgba(65,105,225,0.6)" stroke-width="40" fill="none"/>
  <path d="M60,200 Q120,190 180,200 T300,200 T420,200" stroke="url(#riverPattern)" stroke-width="40" fill="none"/>
  
  <!-- Левый берег (Русь) -->
  <rect x="60" y="200" width="190" height="80" fill="#8fbc8f" opacity="0.5"/>
  
  <!-- Правый берег (Орда) -->
  <rect x="250" y="200" width="190" height="80" fill="#cd853f" opacity="0.5"/>
  
  <!-- Русские войска -->
  <g id="russianArmy">
    <!-- Знамя -->
    <rect x="100" y="150" width="40" height="30" fill="red"/>
    <path d="M100,150 Q120,140 140,150" fill="gold"/>
    
    <!-- Воины -->
    <circle cx="90" cy="240" r="8" fill="#fdbcb4"/>
    <rect x="85" y="248" width="10" height="20" fill="#4169e1"/>
    <circle cx="110" cy="245" r="8" fill="#fdbcb4"/>
    <rect x="105" y="253" width="10" height="15" fill="#8b4513"/>
    <circle cx="130" cy="242" r="8" fill="#fdbcb4"/>
    <rect x="125" y="250" width="10" height="18" fill="#2f4f4f"/>
    
    <!-- Пушка -->
    <rect x="150" y="255" width="30" height="8" fill="#333" rx="2"/>
    <circle cx="165" cy="259" r="3" fill="#666"/>
  </g>
  
  <!-- Ордынские войска -->
  <g id="tatarArmy">
    <!-- Знамя -->
    <rect x="340" y="150" width="40" height="30" fill="#8b0000"/>
    <path d="M340,150 M360,140 L360,160 M340,150 L380,150" stroke="gold" stroke-width="2" fill="none"/>
    
    <!-- Всадники -->
    <ellipse cx="320" cy="240" rx="12" ry="6" fill="#654321"/>
    <circle cx="320" cy="230" r="7" fill="#fdbcb4"/>
    <path d="M315,235 L310,245 M325,235 L330,245" stroke="#333" stroke-width="2"/>
    
    <ellipse cx="350" cy="245" rx="12" ry="6" fill="#654321"/>
    <circle cx="350" cy="235" r="7" fill="#fdbcb4"/>
    <path d="M345,240 L340,250 M355,240 L360,250" stroke="#333" stroke-width="2"/>
    
    <ellipse cx="380" cy="238" rx="12" ry="6" fill="#654321"/>
    <circle cx="380" cy="228" r="7" fill="#fdbcb4"/>
    <path d="M375,233 L370,243 M385,233 L390,243" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Год -->
  <circle cx="200" cy="180" r="20" fill="#dc143c"/>
  <text x="200" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">1480</text>
  
  <!-- Крест на русском берегу -->
  <g transform="translate(120,260)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b4513" stroke-width="3"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b4513" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  
  <!-- Меч на ордынском берегу -->
  <g transform="translate(370,255)">
    <rect x="-2" y="-15" width="4" height="20" fill="#silver"/>
    <path d="M-8,-15 L8,-15 L10,-20 L-10,-20 Z" fill="#silver"/>
    <rect x="-3" y="5" width="6" height="8" fill="#654321"/>
  </g>
  
  <!-- Даты событий -->
  <rect x="70" y="100" width="170" height="80" fill="#fff" stroke="#ddd" rx="3"/>
  <text x="80" y="120" font-family="Arial" font-size="12" font-weight="bold">Ключевые события:</text>
  <text x="80" y="140" font-family="Arial" font-size="10">• Июль 1480 - поход хана</text>
  <text x="80" y="155" font-family="Arial" font-size="10">• Август - стоянка на Угре</text>
  <text x="80" y="170" font-family="Arial" font-size="10">• 11 ноября - уход хана</text>
  
  <!-- Итоги -->
  <rect x="260" y="100" width="170" height="80" fill="#fff" stroke="#ddd" rx="3"/>
  <text x="270" y="120" font-family="Arial" font-size="12" font-weight="bold">Итоги:</text>
  <text x="270" y="140" font-family="Arial" font-size="10">• Конец ордынского ига</text>
  <text x="270" y="155" font-family="Arial" font-size="10">• Политическая независимость</text>
  <text x="270" y="170" font-family="Arial" font-size="10">• Начало самостоятельного развития</text>
  
  <!-- Указатели направления -->
  <g transform="translate(200,220)">
    <path d="M-10,0 L10,0 M5,-5 L10,0 L5,5" stroke="#333" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(300,220)">
    <path d="M-10,0 L10,0 M-5,-5 L-10,0 L-5,5" stroke="#333" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Названия берегов -->
  <text x="155" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Русь</text>
  <text x="345" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Орда</text>
  
  <!-- Название реки -->
  <text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">р. Угра</text>
  
  <!-- Дополнительные элементы для достижения размера -->
  <!-- Солнце -->
  <circle cx="430" cy="120" r="20" fill="#ffd700" opacity="0.8"/>
  <g transform="translate(430,120)">
    <path d="M0,-25 L0,-30 M18,-18 L21,-21 M25,0 L30,0 M18,18 L21,21 M0,25 L0,30 M-18,18 L-21,21 M-25,0 L-30,0 M-18,-18 L-21,-21" stroke="#ffd700" stroke-width="2"/>
  </g>
  
  <!-- Облака -->
  <g opacity="0.6">
    <ellipse cx="100" cy="110" rx="25" ry="12" fill="white"/>
    <ellipse cx="120" cy="108" rx="30" ry="15" fill="white"/>
    <ellipse cx="140" cy="110" rx="25" ry="12" fill="white"/>
  </g>
  
  <!-- Герб России -->
  <g transform="translate(400,280)">
    <circle cx="0" cy="0" r="15" fill="#b22222"/>
    <path d="M-10,-5 L0,5 L10,-5" fill="none" stroke="gold" stroke-width="2"/>
    <rect x="-8" y="-2" width="16" height="1" fill="gold"/>
  </g>
  
  <!-- Мини-карта -->
  <rect x="70" y="290" width="60" height="30" fill="#e6f3ff" stroke="#4169e1" stroke-width="1" rx="2"/>
  <path d="M75,305 Q85,300 95,305 T115,305" stroke="rgba(65,105,225,0.5)" stroke-width="3" fill="none"/>
  <text x="100" y="305" text-anchor="middle" font-family="Arial" font-size="8">Угра</text>
</svg>