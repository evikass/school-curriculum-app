<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="bgPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#f5f0e8"/>
      <circle cx="25" cy="25" r="2" fill="#d4c5b9" opacity="0.3"/>
    </pattern>
    
    <!-- Градиент для флага -->
    <linearGradient id="flagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b71c1c;stop-opacity:1" />
      <stop offset="33.33%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="66.66%" style="stop-color:#212121;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый узор -->
  <rect width="500" height="350" fill="url(#bgPattern)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2c1810">
    УРОК 31
  </text>
  
  <text x="250" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5d4037">
    ВОССТАНИЕ ПУГАЧЁВА И ВНЕШНЯЯ ПОЛИТИКА
  </text>
  
  <text x="250" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5d4037">
    ЕКАТЕРИНЫ II
  </text>
  
  <!-- Верхняя декоративная линия -->
  <path d="M 50 90 L 150 90 L 170 100 L 190 90 L 450 90" stroke="#8d6e63" stroke-width="2" fill="none"/>
  
  <!-- Левая колонка - Восстание Пугачёва -->
  <rect x="40" y="110" width="200" height="200" rx="5" fill="#fff8e1" stroke="#8d6e63" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="140" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5d4037">
    ВОССТАНИЕ ПУГАЧЁВА
  </text>
  
  <!-- Иконка Емельяна Пугачёва -->
  <circle cx="70" cy="160" r="15" fill="#d32f2f"/>
  <path d="M 60 155 Q 70 150 80 155 L 80 165 L 60 165 Z" fill="#fff"/>
  <circle cx="67" cy="158" r="2" fill="#000"/>
  <circle cx="73" cy="158" r="2" fill="#000"/>
  <path d="M 65 163 Q 70 165 75 163" stroke="#000" stroke-width="1" fill="none"/>
  
  <!-- Даты восстания -->
  <rect x="100" y="150" width="100" height="25" rx="3" fill="#ffcc80"/>
  <text x="150" y="167" text-anchor="middle" font-family="Arial" font-size="12" fill="#5d4037">
    1773-1775
  </text>
  
  <!-- Ключевые события -->
  <text x="50" y="200" font-family="Arial" font-size="12" fill="#5d4037">
    • Захват Яика
  </text>
  <text x="50" y="220" font-family="Arial" font-size="12" fill="#5d4037">
    • Осада Оренбурга
  </text>
  <text x="50" y="240" font-family="Arial" font-size="12" fill="#5d4037">
    • Битва у Казани
  </text>
  <text x="50" y="260" font-family="Arial" font-size="12" fill="#5d4037">
    Казнь Пугачёва в Москве
  </text>
  
  <!-- Правая колонка - Внешняя политика -->
  <rect x="260" y="110" width="200" height="200" rx="5" fill="#e8f5e9" stroke="#8d6e63" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="360" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#5d4037">
    ВНЕШНЯЯ ПОЛИТИКА
  </text>
  
  <!-- Герб России -->
  <g transform="translate(280, 150)">
    <circle cx="20" cy="20" r="18" fill="#d32f2f"/>
    <path d="M 20 8 L 24 16 L 16 16 Z" fill="#ffeb3b"/>
    <rect x="18" y="16" width="4" height="12" fill="#fff"/>
    <rect x="16" y="18" width="8" height="4" fill="#fff"/>
  </g>
  
  <!-- Геополитические события -->
  <text x="270" y="200" font-family="Arial" font-size="12" fill="#5d4037">
    • Русско-турецкая война
  </text>
  <text x="270" y="220" font-family="Arial" font-size="12" fill="#5d4037">
    1768-1774 гг. (Кючук-Кайнарджи)
  </text>
  <text x="270" y="240" font-family="Arial" font-size="12" fill="#5d4037">
    • Разделы Польши (1772, 1793, 1795)
  </text>
  <text x="270" y="260" font-family="Arial" font-size="12" fill="#5d4037">
    • Прибалтика под контролем
  </text>
  
  <!-- Центральный элемент - Екатерина II -->
  <g transform="translate(250, 150)">
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#c8e6c9" stroke="#8d6e63" stroke-width="2"/>
    <!-- Корона -->
    <path d="M -20 -35 L -15 -40 L -10 -35 L -5 -40 L 0 -35 L 5 -40 L 10 -35 L 15 -40 L 20 -35 L 20 -30 L -20 -30 Z" fill="#ffd54f"/>
    <circle cx="-10" cy="-38" r="3" fill="#d32f2f"/>
    <circle cx="0" cy="-40" r="3" fill="#d32f2f"/>
    <circle cx="10" cy="-38" r="3" fill="#d32f2f"/>
    <!-- Лицо -->
    <circle cx="0" cy="-10" r="15" fill="#ffdbcb"/>
    <circle cx="-5" cy="-12" r="2" fill="#000"/>
    <circle cx="5" cy="-12" r="2" fill="#000"/>
    <path d="M -5 -5 Q 0 0 5 -5" stroke="#d32f2f" stroke-width="1" fill="none"/>
    <!-- Волосы -->
    <path d="M -15 -20 Q -20 -30 -15 -35 Q -10 -38 0 -40 Q 10 -38 15 -35 Q 20 -30 15 -20" fill="#8b4513"/>
  </g>
  
  <!-- Внешние связи -->
  <path d="M 215 160 L 190 170 L 190 190" stroke="#8d6e63" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 285 160 L 310 170 L 310 190" stroke="#8d6e63" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8d6e63"/>
    </marker>
  </defs>
  
  <!-- Нижняя декоративная полоса -->
  <rect x="0" y="320" width="500" height="30" fill="#6d4c41" opacity="0.1"/>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="320" r="8" fill="#8d6e63"/>
  <circle cx="470" cy="320" r="8" fill="#8d6e63"/>
  
  <!-- Лента с текстом -->
  <path d="M 150 320 Q 250 300 350 320" stroke="#d4af37" stroke-width="2" fill="none"/>
  <text x="250" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5d4037">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Дополнительные декоративные элементы -->
  <g transform="translate(450, 50)">
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#ffcc80"/>
    <text x="15" y="14" text-anchor="middle" font-family="Arial" font-size="10" fill="#5d4037">XVIII</text>
  </g>
  
  <!-- Мини-карта России -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="60" height="40" rx="3" fill="#e1f5fe" stroke="#0277bd" stroke-width="1"/>
    <path d="M 10 15 L 20 10 L 30 15 L 40 12 L 50 18 L 40 25 L 30 22 L 20 25 L 10 20 Z" fill="#4fc3f7" stroke="#0277bd" stroke-width="0.5"/>
    <circle cx="15" cy="20" r="2" fill="#d32f2f"/>
  </g>
  
  <!-- Печать -->
  <g transform="translate(400, 280)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#8d6e63" stroke-width="2"/>
    <text x="15" y="19" text-anchor="middle" font-family="Arial" font-size="10" fill="#5d4037">ЕП</text>
  </g>
</svg>