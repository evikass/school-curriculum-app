<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c17;stop-opacity:1" />
    </linearGradient>
    
    <!-- Текстурная заливка для бумаги -->
    <pattern id="paper" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#f5f3ed"/>
      <circle cx="20" cy="20" r="0.5" fill="#e8e6df" opacity="0.3"/>
      <circle cx="80" cy="40" r="0.5" fill="#e8e6df" opacity="0.3"/>
      <circle cx="40" cy="80" r="0.5" fill="#e8e6df" opacity="0.3"/>
    </pattern>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Бумажный фон для контента -->
  <rect x="40" y="80" width="420" height="250" rx="5" fill="url(#paper)" filter="url(#shadow)"/>
  
  <!-- Заголовок -->
  <text x="250" y="45" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#8b4513">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <rect x="350" y="25" width="80" height="30" rx="15" fill="#8b4513" opacity="0.8"/>
  <text x="390" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Урок 22
  </text>
  
  <!-- Основной заголовок -->
  <text x="250" y="110" font-family="Georgia, serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c1810">
    Иван IV Грозный
  </text>
  <text x="250" y="130" font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#2c1810">
    Начало правления
  </text>
  
  <!-- Портрет Ивана Грозного -->
  <g transform="translate(60, 150)">
    <!-- Рамка портрета -->
    <rect x="0" y="0" width="100" height="120" rx="3" fill="#d4a574" stroke="#8b6914" stroke-width="2"/>
    
    <!-- Портрет -->
    <ellipse cx="50" cy="40" rx="30" ry="35" fill="#fdbcb4"/>
    <path d="M 20 65 Q 50 80 80 65 L 80 100 L 20 100 Z" fill="#4a2c17"/>
    
    <!-- Борода -->
    <path d="M 30 55 Q 50 65 70 55 L 70 75 Q 50 85 30 75 Z" fill="#8b4513"/>
    
    <!-- Корона -->
    <path d="M 25 20 L 35 10 L 45 20 L 55 10 L 65 20 L 75 15 L 75 25 L 25 25 Z" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="35" cy="15" r="2" fill="#b8860b"/>
    <circle cx="50" cy="15" r="2" fill="#b8860b"/>
    <circle cx="65" cy="15" r="2" fill="#b8860b"/>
    
    <!-- Глаза -->
    <circle cx="40" cy="40" r="2" fill="#2c1810"/>
    <circle cx="60" cy="40" r="2" fill="#2c1810"/>
    
    <!-- Брови -->
    <path d="M 35 35 Q 40 33 45 35" stroke="#2c1810" stroke-width="1.5" fill="none"/>
    <path d="M 55 35 Q 60 33 65 35" stroke="#2c1810" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Даты жизни -->
  <text x="160" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c1810">
    1530–1584
  </text>
  
  <!-- Основные блоки информации -->
  <!-- Блок 1: Ранние годы -->
  <g transform="translate(190, 150)">
    <rect x="0" y="0" width="150" height="35" rx="3" fill="#8b4513" opacity="0.2"/>
    <text x="75" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c1810">
      Ранние годы
    </text>
  </g>
  
  <!-- Блок 2: Венчание на царство -->
  <g transform="translate(190, 195)">
    <rect x="0" y="0" width="150" height="35" rx="3" fill="#8b4513" opacity="0.2"/>
    <text x="75" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c1810">
      Венчание на царство
    </text>
  </g>
  
  <!-- Блок 3: Избранная рада -->
  <g transform="translate(190, 240)">
    <rect x="0" y="0" width="150" height="35" rx="3" fill="#8b4513" opacity="0.2"/>
    <text x="75" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c1810">
      Избранная рада
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <!-- Крест на портрете -->
  <g transform="translate(60, 280)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#8b4513" stroke-width="3"/>
    <line x1="10" y1="-10" x2="10" y2="10" stroke="#8b4513" stroke-width="3"/>
  </g>
  
  <!-- Орнамент -->
  <path d="M 350 160 L 360 170 L 370 160" stroke="#8b4513" stroke-width="2" fill="none"/>
  <path d="M 350 180 L 360 190 L 370 180" stroke="#8b4513" stroke-width="2" fill="none"/>
  <path d="M 350 200 L 360 210 L 370 200" stroke="#8b4513" stroke-width="2" fill="none"/>
  
  <!-- Важные даты -->
  <g transform="translate(350, 150)">
    <rect x="0" y="0" width="90" height="20" rx="2" fill="#d4a574"/>
    <text x="45" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c1810">
      1547: первый титул
    </text>
  </g>
  
  <g transform="translate(350, 180)">
    <rect x="0" y="0" width="90" height="20" rx="2" fill="#d4a574"/>
    <text x="45" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c1810">
      1549: Земский собор
    </text>
  </g>
  
  <g transform="translate(350, 210)">
    <rect x="0" y="0" width="90" height="20" rx="2" fill="#d4a574"/>
    <text x="45" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c1810">
      1549: Судебник
    </text>
  </g>
  
  <!-- Королевский герб (упрощенный) -->
  <g transform="translate(350, 240)">
    <rect x="0" y="0" width="90" height="60" rx="3" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <path d="M 45 15 L 35 25 L 45 35 L 55 25 Z" fill="#b8860b"/>
    <circle cx="45" cy="25" r="3" fill="#ffd700"/>
    <text x="45" y="50" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c1810">
      Царь
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Вензель -->
  <g transform="translate(80, 60)">
    <path d="M 0 10 Q 10 0 20 10 Q 10 20 0 10" fill="none" stroke="#8b4513" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="2" fill="#8b4513"/>
  </g>
  
  <!-- Угловые орнаменты -->
  <g transform="translate(40, 80)">
    <path d="M 0 0 L 10 0 L 0 10" fill="#8b4513" opacity="0.3"/>
  </g>
  <g transform="translate(450, 80)">
    <path d="M 0 0 L -10 0 L 0 10" fill="#8b4513" opacity="0.3"/>
  </g>
  <g transform="translate(40, 330)">
    <path d="M 0 0 L 10 0 L 0 -10" fill="#8b4513" opacity="0.3"/>
  </g>
  <g transform="translate(450, 330)">
    <path d="M 0 0 L -10 0 L 0 -10" fill="#8b4513" opacity="0.3"/>
  </g>
  
  <!-- Текстура бумаги углы -->
  <circle cx="45" cy="85" r="1" fill="#8b4513" opacity="0.2"/>
  <circle cx="455" cy="85" r="1" fill="#8b4513" opacity="0.2"/>
  <circle cx="45" cy="325" r="1" fill="#8b4513" opacity="0.2"/>
  <circle cx="455" cy="325" r="1" fill="#8b4513" opacity="0.2"/>
</svg>