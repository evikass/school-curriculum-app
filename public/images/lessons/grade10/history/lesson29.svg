<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f3f0"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#8b4513" stroke-width="3"/>
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#d4af37" stroke-width="1"/>
  
  <!-- Заголовок -->
  <text x="250" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#2c1810">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8b4513">Урок 29: Эпоха дворцовых переворотов</text>
  
  <!-- Дворцовый силуэт -->
  <g id="palace">
    <rect x="180" y="100" width="140" height="80" fill="#8b4513"/>
    <polygon points="150,100 250,60 350,100" fill="#a0522d"/>
    <rect x="200" y="120" width="20" height="30" fill="#654321"/>
    <rect x="280" y="120" width="20" height="30" fill="#654321"/>
    <rect x="240" y="140" width="20" height="20" fill="#2c1810"/>
    <!-- Окна -->
    <rect x="190" y="110" width="15" height="15" fill="#ffd700"/>
    <rect x="220" y="110" width="15" height="15" fill="#ffd700"/>
    <rect x="250" y="110" width="15" height="15" fill="#ffd700"/>
    <rect x="280" y="110" width="15" height="15" fill="#ffd700"/>
    <rect x="310" y="110" width="15" height="15" fill="#ffd700"/>
  </g>
  
  <!-- Корона -->
  <g id="crown">
    <path d="M 220 85 L 225 75 L 230 80 L 235 70 L 240 75 L 245 80 L 250 75 L 255 70 L 260 75 L 265 80 L 270 75 L 275 85 Z" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="225" cy="75" r="3" fill="#dc143c"/>
    <circle cx="235" cy="70" r="3" fill="#dc143c"/>
    <circle cx="245" cy="75" r="3" fill="#dc143c"/>
    <circle cx="255" cy="70" r="3" fill="#dc143c"/>
    <circle cx="265" cy="75" r="3" fill="#dc143c"/>
  </g>
  
  <!-- Линия времени -->
  <line x1="50" y1="210" x2="450" y2="210" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Даты на линии времени -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#2c1810">
    <line x1="80" y1="205" x2="80" y2="215" stroke="#8b4513" stroke-width="2"/>
    <text x="80" y="230" text-anchor="middle">1725</text>
    
    <line x1="150" y1="205" x2="150" y2="215" stroke="#8b4513" stroke-width="2"/>
    <text x="150" y="230" text-anchor="middle">1727</text>
    
    <line x1="220" y1="205" x2="220" y2="215" stroke="#8b4513" stroke-width="2"/>
    <text x="220" y="230" text-anchor="middle">1730</text>
    
    <line x1="290" y1="205" x2="290" y2="215" stroke="#8b4513" stroke-width="2"/>
    <text x="290" y="230" text-anchor="middle">1740</text>
    
    <line x1="360" y1="205" x2="360" y2="215" stroke="#8b4513" stroke-width="2"/>
    <text x="360" y="230" text-anchor="middle">1762</text>
  </g>
  
  <!-- Портреты императоров -->
  <g id="portraits">
    <!-- Петр II -->
    <circle cx="80" cy="180" r="25" fill="#deb887" stroke="#8b4513" stroke-width="2"/>
    <circle cx="80" cy="170" r="12" fill="#2c1810"/>
    <path d="M 65 185 Q 80 175 95 185" fill="none" stroke="#8b4513" stroke-width="2"/>
    <text x="80" y="160" text-anchor="middle" font-size="10" font-weight="bold">Петр II</text>
    
    <!-- Анна Иоанновна -->
    <circle cx="150" cy="180" r="25" fill="#f5deb3" stroke="#8b4513" stroke-width="2"/>
    <circle cx="150" cy="170" r="12" fill="#2c1810"/>
    <path d="M 135 185 Q 150 175 165 185" fill="none" stroke="#8b4513" stroke-width="2"/>
    <ellipse cx="150" cy="165" rx="8" ry="12" fill="#8b4513"/>
    <text x="150" y="160" text-anchor="middle" font-size="10" font-weight="bold">Анна</text>
    
    <!-- Елизавета Петровна -->
    <circle cx="220" cy="180" r="25" fill="#f5deb3" stroke="#8b4513" stroke-width="2"/>
    <circle cx="220" cy="170" r="12" fill="#2c1810"/>
    <path d="M 205 185 Q 220 175 235 185" fill="none" stroke="#8b4513" stroke-width="2"/>
    <ellipse cx="220" cy="165" rx="10" ry="15" fill="#8b4513"/>
    <text x="220" y="160" text-anchor="middle" font-size="10" font-weight="bold">Елизавета</text>
    
    <!-- Петр III -->
    <circle cx="290" cy="180" r="25" fill="#deb887" stroke="#8b4513" stroke-width="2"/>
    <circle cx="290" cy="170" r="12" fill="#2c1810"/>
    <path d="M 275 185 Q 290 175 305 185" fill="none" stroke="#8b4513" stroke-width="2"/>
    <text x="290" y="160" text-anchor="middle" font-size="10" font-weight="bold">Петр III</text>
    
    <!-- Екатерина II -->
    <circle cx="360" cy="180" r="25" fill="#f5deb3" stroke="#8b4513" stroke-width="2"/>
    <circle cx="360" cy="170" r="12" fill="#2c1810"/>
    <path d="M 345 185 Q 360 175 375 185" fill="none" stroke="#8b4513" stroke-width="2"/>
    <ellipse cx="360" cy="165" rx="12" ry="18" fill="#8b4513"/>
    <text x="360" y="160" text-anchor="middle" font-size="10" font-weight="bold">Екатерина II</text>
  </g>
  
  <!-- Дворцовые интриги - стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc143c"/>
    </marker>
  </defs>
  
  <!-- Стрелки переворотов -->
  <path d="M 105 180 Q 125 150 145 180" fill="none" stroke="#dc143c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 175 180 Q 195 150 215 180" fill="none" stroke="#dc143c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 245 180 Q 265 150 285 180" fill="none" stroke="#dc143c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 315 180 Q 335 150 355 180" fill="none" stroke="#dc143c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Ключевые события -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#2c1810">
    <text x="80" y="255" text-anchor="middle">Смерть Петра I</text>
    <text x="150" y="255" text-anchor="middle">Гвардия</text>
    <text x="220" y="255" text-anchor="middle">Восстание</text>
    <text x="290" y="255" text-anchor="middle">Зверское убийство</text>
    <text x="360" y="255" text-anchor="middle">Переворот</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g id="decorations">
    <!-- Вензель -->
    <path d="M 400 80 Q 410 70 420 80 Q 430 70 440 80 Q 430 90 420 100 Q 410 90 400 80" fill="none" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Герб орла -->
    <g transform="translate(420, 280)">
      <ellipse cx="0" cy="0" rx="20" ry="15" fill="#dc143c"/>
      <path d="M -15 -5 L -5 -15 L 5 -15 L 15 -5 L 15 5 L -5 5 Z" fill="#ffd700"/>
      <circle cx="0" cy="0" r="5" fill="#8b4513"/>
    </g>
    
    <!-- Сабли -->
    <g id="sabre">
      <line x1="50" y1="280" x2="50" y2="320" stroke="#8b4513" stroke-width="3"/>
      <line x1="45" y1="280" x2="55" y2="280" stroke="#2c1810" stroke-width="2"/>
      <line x1="45" y1="285" x2="55" y2="285" stroke="#2c1810" stroke-width="1"/>
      <line x1="45" y1="290" x2="55" y2="290" stroke="#2c1810" stroke-width="1"/>
    </g>
    
    <!-- Королевские символы -->
    <rect x="430" y="320" width="15" height="15" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="437.5" cy="327.5" r="3" fill="#dc143c"/>
  </g>
  
  <!-- Угловые украшения -->
  <g id="corner-ornament" fill="#d4af37">
    <path d="M 20 20 L 40 20 L 40 30"/>
    <path d="M 480 20 L 460 20 L 460 30"/>
    <path d="M 20 340 L 40 340 L 40 330"/>
    <path d="M 480 340 L 460 340 L 460 330"/>
  </g>
  
  <!-- Надпись "Дворцовые перевороты" -->
  <text x="250" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#8b4513">Дворцовые перевороты</text>
</svg>