<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Декоративные молекулы -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="20" fill="#4a90e2"/>
    <circle cx="30" cy="70" r="15" fill="#50c878"/>
    <line x1="50" y1="50" x2="30" y2="70" stroke="#333" stroke-width="2"/>
  </g>
  
  <g opacity="0.1">
    <circle cx="450" cy="100" r="20" fill="#e74c3c"/>
    <circle cx="430" cy="80" r="15" fill="#f39c12"/>
    <line x1="450" y1="100" x2="430" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="100" x2="470" y2="90" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">Урок 8: Алкены</text>
  
  <!-- Раздел 1: Строение -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" fill="#3498db" opacity="0.2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Строение</text>
    
    <!-- Пример молекулы этилена -->
    <g transform="translate(20, 35)">
      <circle cx="0" cy="0" r="8" fill="#333"/>
      <circle cx="30" cy="0" r="8" fill="#333"/>
      <line x1="8" y1="0" x2="22" y2="0" stroke="#333" stroke-width="3"/>
      <line x1="8" y1="-2" x2="22" y2="-2" stroke="#333" stroke-width="2"/>
      <line x1="8" y1="2" x2="22" y2="2" stroke="#333" stroke-width="2"/>
      <text x="15" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">C₂H₄</text>
    </g>
  </g>
  
  <!-- Раздел 2: Свойства -->
  <g transform="translate(190, 100)">
    <rect x="0" y="0" width="120" height="80" fill="#50c878" opacity="0.2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Свойства</text>
    
    <!-- Иконки свойств -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="25" height="20" fill="#e74c3c" opacity="0.6" rx="2"/>
      <text x="12.5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Горение</text>
    </g>
    
    <g transform="translate(45, 30)">
      <rect x="0" y="0" width="25" height="20" fill="#9b59b6" opacity="0.6" rx="2"/>
      <text x="12.5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Реакции</text>
    </g>
    
    <g transform="translate(75, 30)">
      <rect x="0" y="0" width="25" height="20" fill="#f39c12" opacity="0.6" rx="2"/>
      <text x="12.5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Пропан</text>
    </g>
  </g>
  
  <!-- Раздел 3: Получение -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="120" height="80" fill="#e74c3c" opacity="0.2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Получение</text>
    
    <!-- Химическая формула получения -->
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">C₂H₅OH → C₂H₄ + H₂O</text>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(нагрев)</text>
  </g>
  
  <!-- Раздел 4: Применение -->
  <g transform="translate(120, 200)">
    <rect x="0" y="0" width="260" height="100" fill="#9b59b6" opacity="0.2" rx="5"/>
    <text x="130" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Применение</text>
    
    <!-- Иконки применения -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="40" height="30" fill="#3498db" opacity="0.7" rx="3"/>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Пластик</text>
    </g>
    
    <g transform="translate(70, 35)">
      <rect x="0" y="0" width="40" height="30" fill="#e74c3c" opacity="0.7" rx="3"/>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Резина</text>
    </g>
    
    <g transform="translate(120, 35)">
      <rect x="0" y="0" width="40" height="30" fill="#50c878" opacity="0.7" rx="3"/>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Антифриз</text>
    </g>
    
    <g transform="translate(170, 35)">
      <rect x="0" y="0" width="40" height="30" fill="#f39c12" opacity="0.7" rx="3"/>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Топливо</text>
    </g>
    
    <g transform="translate(220, 35)">
      <rect x="0" y="0" width="40" height="30" fill="#9b59b6" opacity="0.7" rx="3"/>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Синтез</text>
    </g>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g opacity="0.3">
    <path d="M 30 250 Q 50 230, 70 250" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 430 250 Q 450 230, 470 250" stroke="#e74c3c" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Вспомогательные линии -->
  <g stroke="#ddd" stroke-width="1" opacity="0.5">
    <line x1="50" y1="90" x2="450" y2="90"/>
    <line x1="50" y1="190" x2="450" y2="190"/>
  </g>
  
  <!-- Углерод-углеродная связь (двойная) -->
  <g transform="translate(250, 280)">
    <circle cx="0" cy="0" r="12" fill="#333"/>
    <circle cx="40" cy="0" r="12" fill="#333"/>
    <line x1="12" y1="0" x2="28" y2="0" stroke="#333" stroke-width="4"/>
    <line x1="12" y1="-3" x2="28" y2="-3" stroke="#333" stroke-width="2"/>
    <line x1="12" y1="3" x2="28" y2="3" stroke="#333" stroke-width="2"/>
    <text x="20" y="-20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">C=C</text>
  </g>
  
  <!-- Атомы водорода -->
  <g transform="translate(250, 280)">
    <circle cx="-20" cy="-10" r="6" fill="#50c878"/>
    <text x="-20" y="-7" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">H</text>
    
    <circle cx="-20" cy="10" r="6" fill="#50c878"/>
    <text x="-20" y="13" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">H</text>
    
    <circle cx="60" cy="-10" r="6" fill="#50c878"/>
    <text x="60" y="-7" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">H</text>
    
    <circle cx="60" cy="10" r="6" fill="#50c878"/>
    <text x="60" y="13" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">H</text>
  </g>
  
  <!-- Связи с водородом -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="238" y1="270" x2="250" y2="268"/>
    <line x1="238" y1="290" x2="250" y2="292"/>
    <line x1="262" y1="270" x2="250" y2="268"/>
    <line x1="262" y1="290" x2="250" y2="292"/>
    <line x1="278" y1="270" x2="290" y2="268"/>
    <line x1="278" y1="290" x2="290" y2="292"/>
    <line x1="302" y1="270" x2="290" y2="268"/>
    <line x1="302" y1="290" x2="290" y2="292"/>
  </g>
</svg>