<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-opacity="0.3"/>
    </filter>
    
    <!-- Свечение для молекул -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a365d" filter="url(#textShadow)">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2d3748">Урок 17: Аминокислоты</text>
  
  <!-- Молекула глицина -->
  <g transform="translate(80, 100)">
    <!-- Углерод -->
    <circle cx="0" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">C</text>
    
    <!-- Азот -->
    <circle cx="-30" cy="0" r="12" fill="#3182ce" filter="url(#glow)"/>
    <text x="-30" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">N</text>
    
    <!-- Кислород (карбоксильная группа) -->
    <circle cx="30" cy="0" r="12" fill="#e53e3e" filter="url(#glow)"/>
    <text x="30" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">O</text>
    
    <!-- Кислород (гидроксильная группа) -->
    <circle cx="30" cy="-25" r="12" fill="#e53e3e" filter="url(#glow)"/>
    <text x="30" y="-20" font-family="Arial" font-size="14" text-anchor="middle" fill="white" font-weight="bold">O</text>
    
    <!-- Водород (аминогруппа) -->
    <circle cx="-30" cy="-25" r="10" fill="#cbd5e0"/>
    <text x="-30" y="-20" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">H</text>
    
    <!-- Связи -->
    <line x1="-18" y1="0" x2="-18" y2="0" stroke="#4a5568" stroke-width="2"/>
    <line x1="12" y1="0" x2="18" y2="0" stroke="#4a5568" stroke-width="2"/>
    <line x1="30" y1="-12" x2="30" y2="-13" stroke="#4a5568" stroke-width="2"/>
    <line x1="-30" y1="-12" x2="-30" y2="-13" stroke="#4a5568" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="-25" stroke="#4a5568" stroke-width="2"/>
    <circle cx="0" cy="-25" r="8" fill="#718096"/>
    <text x="0" y="-21" font-family="Arial" font-size="12" text-anchor="middle" fill="white">H</text>
  </g>
  
  <!-- Метка глицина -->
  <text x="80" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748" font-weight="bold">Глицин</text>
  
  <!-- Общая формула аминокислоты -->
  <g transform="translate(250, 100)">
    <rect x="-60" y="-15" width="120" height="80" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="0" y="10" font-family="Arial" font-size="16" text-anchor="middle" fill="#2d3748">NH₂-CHR-COOH</text>
  </g>
  
  <!-- Стрелки свойств -->
  <g transform="translate(350, 120)">
    <!-- Кислая способность -->
    <path d="M 0 0 L 0 30" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="15" y="20" font-family="Arial" font-size="12" fill="#e53e3e">Кислая</text>
    
    <!-- Щелочная способность -->
    <path d="M 0 0 L 0 -30" stroke="#3182ce" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="15" y="-20" font-family="Arial" font-size="12" fill="#3182ce">Щелочная</text>
  </g>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53e3e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3182ce"/>
    </marker>
  </defs>
  
  <!-- Свойства аминокислот -->
  <g transform="translate(80, 200)">
    <!-- Свойство 1 -->
    <circle cx="0" cy="0" r="15" fill="#edf2f7"/>
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">1</text>
    <text x="25" y="5" font-family="Arial" font-size="14" fill="#2d3748">Амфотерность</text>
    
    <!-- Свойство 2 -->
    <circle cx="0" cy="30" r="15" fill="#edf2f7"/>
    <text x="0" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">2</text>
    <text x="25" y="35" font-family="Arial" font-size="14" fill="#2d3748">Формирование пептидов</text>
    
    <!-- Свойство 3 -->
    <circle cx="0" cy="60" r="15" fill="#edf2f7"/>
    <text x="0" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">3</text>
    <text x="25" y="65" font-family="Arial" font-size="14" fill="#2d3748">Способность к ионизации</text>
  </g>
  
  <!-- Пептидная связь (иллюстрация) -->
  <g transform="translate(300, 200)">
    <!-- Аминокислота 1 -->
    <rect x="0" y="10" width="40" height="30" fill="#bee3f8" stroke="#3182ce" stroke-width="1" rx="5"/>
    <text x="20" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">АА₁</text>
    
    <!-- Связь -->
    <line x1="40" y1="25" x2="60" y2="25" stroke="#4a5568" stroke-width="2"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#4a5568">пептид</text>
    
    <!-- Аминокислота 2 -->
    <rect x="60" y="10" width="40" height="30" fill="#bee3f8" stroke="#3182ce" stroke-width="1" rx="5"/>
    <text x="80" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">АА₂</text>
  </g>
  
  <!-- Фоновые элементы декора -->
  <circle cx="450" cy="80" r="30" fill="#e6fffa" opacity="0.5"/>
  <circle cx="50" cy="280" r="25" fill="#fef5e7" opacity="0.5"/>
  <circle cx="420" cy="300" r="20" fill="#f0fff4" opacity="0.5"/>
  
  <!-- Уравнение реакции -->
  <g transform="translate(250, 280)">
    <rect x="-100" y="-15" width="200" height="40" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748">H₂N-CH₂-COOH + H₂O</text>
  </g>
</svg>