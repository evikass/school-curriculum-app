<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для молекул -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)"/>
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">ХИМИЯ · 10 КЛАСС</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e0e6ed">Урок 6: Алканы</text>
  
  <!-- Основная формула алкана -->
  <g transform="translate(250, 120)">
    <!-- Метан CH4 -->
    <g transform="translate(-150, 0)">
      <circle cx="0" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="0" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      <circle cx="25" cy="-15" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="25" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="18" y1="-8" x2="13" y2="-12" stroke="#333" stroke-width="2"/>
      
      <circle cx="25" cy="15" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="25" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="18" y1="8" x2="13" y2="12" stroke="#333" stroke-width="2"/>
      
      <circle cx="-25" cy="-15" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-25" y="-10" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-18" y1="-8" x2="-13" y2="-12" stroke="#333" stroke-width="2"/>
      
      <circle cx="-25" cy="15" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-25" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-18" y1="8" x2="-13" y2="12" stroke="#333" stroke-width="2"/>
      
      <text x="0" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Метан (CH₄)</text>
    </g>
    
    <!-- Этан C2H6 -->
    <g transform="translate(0, 0)">
      <circle cx="-20" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="-20" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      <circle cx="20" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="20" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      <line x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="3"/>
      
      <!-- H атомы первого C -->
      <circle cx="-40" cy="-20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-40" y="-15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-28" y1="-10" x2="-28" y2="-15" stroke="#333" stroke-width="2"/>
      
      <circle cx="-40" cy="20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-40" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-28" y1="10" x2="-28" y2="15" stroke="#333" stroke-width="2"/>
      
      <circle cx="-20" cy="-35" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-20" y="-30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-20" y1="-20" x2="-20" y2="-23" stroke="#333" stroke-width="2"/>
      
      <!-- H атомы второго C -->
      <circle cx="40" cy="-20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="40" y="-15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="28" y1="-10" x2="32" y2="-15" stroke="#333" stroke-width="2"/>
      
      <circle cx="40" cy="20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="40" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="28" y1="10" x2="32" y2="15" stroke="#333" stroke-width="2"/>
      
      <circle cx="20" cy="35" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="20" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="20" y1="20" x2="20" y2="23" stroke="#333" stroke-width="2"/>
      
      <text x="0" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Этан (C₂H₆)</text>
    </g>
    
    <!-- Пропан C3H8 -->
    <g transform="translate(150, 0)">
      <circle cx="-30" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="-30" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      <circle cx="0" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="0" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      <circle cx="30" cy="0" r="20" fill="#4a90e2" filter="url(#shadow)"/>
      <text x="30" y="5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <line x1="-10" y1="0" x2="-10" y2="0" stroke="#333" stroke-width="3"/>
      <line x1="10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="3"/>
      
      <!-- H атомы -->
      <circle cx="-50" cy="-20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-50" y="-15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-40" y1="-10" x2="-38" y2="-15" stroke="#333" stroke-width="2"/>
      
      <circle cx="-30" cy="-35" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-30" y="-30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-30" y1="-20" x2="-30" y2="-23" stroke="#333" stroke-width="2"/>
      
      <circle cx="-50" cy="20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="-50" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="-40" y1="10" x2="-38" y2="15" stroke="#333" stroke-width="2"/>
      
      <circle cx="50" cy="-20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="50" y="-15" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="40" y1="-10" x2="42" y2="-15" stroke="#333" stroke-width="2"/>
      
      <circle cx="30" cy="-35" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="30" y="-30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="30" y1="-20" x2="30" y2="-23" stroke="#333" stroke-width="2"/>
      
      <circle cx="50" cy="20" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="50" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="40" y1="10" x2="42" y2="15" stroke="#333" stroke-width="2"/>
      
      <circle cx="0" cy="35" r="12" fill="#ff4444" filter="url(#shadow)"/>
      <text x="0" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">H</text>
      <line x1="0" y1="20" x2="0" y2="23" stroke="#333" stroke-width="2"/>
      
      <text x="0" y="60" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Пропан (C₃H₈)</text>
    </g>
  </g>
  
  <!-- Гомологический ряд -->
  <g transform="translate(250, 240)">
    <rect x="-200" y="-20" width="400" height="80" fill="#f0f4f8" rx="10" stroke="#d0d8e0" stroke-width="1"/>
    <text x="0" y="-5" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Гомологический ряд алканов</text>
    
    <text x="-180" y="15" font-family="Arial" font-size="14" fill="#666">CH₄</text>
    <text x="-130" y="15" font-family="Arial" font-size="14" fill="#666">C₂H₆</text>
    <text x="-80" y="15" font-family="Arial" font-size="14" fill="#666">C₃H₈</text>
    <text x="-30" y="15" font-family="Arial" font-size="14" fill="#666">C₄H₁₀</text>
    <text x="20" y="15" font-family="Arial" font-size="14" fill="#666">C₅H₁₂</text>
    <text x="70" y="15" font-family="Arial" font-size="14" fill="#666">C₆H₁₄</text>
    <text x="120" y="15" font-family="Arial" font-size="14" fill="#666">...</text>
    
    <text x="-180" y="35" font-family="Arial" font-size="12" fill="#999">метан</text>
    <text x="-130" y="35" font-family="Arial" font-size="12" fill="#999">этан</text>
    <text x="-80" y="35" font-family="Arial" font-size="12" fill="#999">пропан</text>
    <text x="-30" y="35" font-family="Arial" font-size="12" fill="#999">бутан</text>
    <text x="20" y="35" font-family="Arial" font-size="12" fill="#999">пентан</text>
    <text x="70" y="35" font-family="Arial" font-size="12" fill="#999">гексан</text>
  </g>
  
  <!-- Формула гомолога -->
  <text x="250" y="330" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Общая формула: CₙH₂ₙ₊₂</text>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="80" r="3" fill="#4a90e2" opacity="0.3"/>
  <circle cx="450" cy="80" r="3" fill="#4a90e2" opacity="0.3"/>
  <circle cx="50" cy="270" r="3" fill="#4a90e2" opacity="0.3"/>
  <circle cx="450" cy="270" r="3" fill="#4a90e2" opacity="0.3"/>
</svg>