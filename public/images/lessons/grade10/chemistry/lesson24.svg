<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Тень для элементов -->
    <filter id="elementShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a365d" filter="url(#textShadow)">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="60" width="440" height="270" rx="15" fill="white" stroke="#cbd5e0" stroke-width="2" filter="url(#elementShadow)"/>
  
  <!-- Номер урока -->
  <circle cx="60" cy="90" r="20" fill="#4299e1"/>
  <text x="60" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">24</text>
  
  <!-- Заголовок урока -->
  <text x="100" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d3748">Урок: Каучуки. Резина. Вулканизация</text>
  
  <!-- Секция: Каучуки -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#e6fffa" stroke="#38b2ac" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#234e52">Каучуки</text>
    
    <!-- Молекула каучука -->
    <g transform="translate(20, 35)">
      <line x1="0" y1="20" x2="30" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="30" y1="20" x2="40" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="40" y1="10" x2="50" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="50" y1="20" x2="80" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="80" y1="20" x2="90" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="90" y1="10" x2="100" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="100" y1="20" x2="130" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="130" y1="20" x2="140" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="140" y1="10" x2="150" y2="20" stroke="#4a5568" stroke-width="2"/>
      
      <circle cx="0" cy="20" r="4" fill="#718096"/>
      <circle cx="30" cy="20" r="4" fill="#718096"/>
      <circle cx="40" cy="10" r="4" fill="#e53e3e"/>
      <circle cx="50" cy="20" r="4" fill="#718096"/>
      <circle cx="80" cy="20" r="4" fill="#718096"/>
      <circle cx="90" cy="10" r="4" fill="#e53e3e"/>
      <circle cx="100" cy="20" r="4" fill="#718096"/>
      <circle cx="130" cy="20" r="4" fill="#718096"/>
      <circle cx="140" cy="10" r="4" fill="#e53e3e"/>
      <circle cx="150" cy="20" r="4" fill="#718096"/>
    </g>
  </g>
  
  <!-- Секция: Резина -->
  <g transform="translate(270, 130)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#fef5e7" stroke="#f6ad55" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#744210">Резина</text>
    
    <!-- Иконка шины -->
    <g transform="translate(60, 35)">
      <circle cx="30" cy="20" r="18" fill="none" stroke="#4a5568" stroke-width="3"/>
      <circle cx="30" cy="20" r="10" fill="none" stroke="#4a5568" stroke-width="2"/>
      <line x1="30" y1="2" x2="30" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="30" y1="30" x2="30" y2="38" stroke="#4a5568" stroke-width="2"/>
      <line x1="12" y1="20" x2="20" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="40" y1="20" x2="48" y2="20" stroke="#4a5568" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Секция: Вулканизация -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="400" height="80" rx="8" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22543d">Вулканизация:</text>
    
    <!-- Реакция вулканизации -->
    <g transform="translate(150, 20)">
      <!-- Молекулы каучука -->
      <line x1="0" y1="20" x2="40" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="40" y1="20" x2="50" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="50" y1="10" x2="60" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="60" y1="20" x2="100" y2="20" stroke="#4a5568" stroke-width="2"/>
      
      <!-- Сера -->
      <circle cx="130" cy="20" r="8" fill="#fbd38d" stroke="#d69e2e" stroke-width="2"/>
      <text x="130" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#744210">S</text>
      
      <!-- Стрелка реакции -->
      <path d="M 150 20 L 190 20" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="170" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">Δ</text>
      
      <!-- Молекулы резины -->
      <line x1="210" y1="20" x2="250" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="250" y1="20" x2="260" y2="10" stroke="#4a5568" stroke-width="2"/>
      <line x1="260" y1="10" x2="270" y2="20" stroke="#4a5568" stroke-width="2"/>
      <line x1="270" y1="20" x2="310" y2="20" stroke="#4a5568" stroke-width="2"/>
      
      <!-- Связи через серу -->
      <line x1="100" y1="20" x2="120" y2="20" stroke="#d69e2e" stroke-width="3" stroke-dasharray="2,2"/>
      <line x1="140" y1="20" x2="210" y2="20" stroke="#d69e2e" stroke-width="3" stroke-dasharray="2,2"/>
      
      <!-- Плюс символ -->
      <line x1="320" y1="15" x2="320" y2="25" stroke="#4a5568" stroke-width="2"/>
      <line x1="315" y1="20" x2="325" y2="20" stroke="#4a5568" stroke-width="2"/>
      
      <!-- Тепло -->
      <g transform="translate(340, 15)">
        <path d="M 0 5 Q 5 0 10 5" fill="none" stroke="#f56565" stroke-width="2"/>
        <path d="M 5 10 Q 10 5 15 10" fill="none" stroke="#f56565" stroke-width="2"/>
        <path d="M 10 15 Q 15 10 20 15" fill="none" stroke="#f56565" stroke-width="2"/>
      </g>
    </g>
  </g>
  
  <!-- Определения -->
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Полимеры с двойными связями</text>
  <text x="280" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Продукт вулканизации</text>
  
  <!-- Свойства резины -->
  <g transform="translate(290, 240)">
    <circle cx="0" cy="0" r="3" fill="#48bb78"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">Эластичность</text>
    
    <circle cx="0" cy="20" r="3" fill="#48bb78"/>
    <text x="10" y="24" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">Прочность</text>
    
    <circle cx="0" cy="40" r="3" fill="#48bb78"/>
    <text x="10" y="44" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">Водостойкость</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Атомы углерода -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="0" r="8" fill="#718096"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
  </g>
  
  <g transform="translate(190, 140)">
    <circle cx="0" cy="0" r="8" fill="#718096"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
  </g>
  
  <!-- Вспомогательные линии -->
  <line x1="50" y1="110" x2="50" y2="125" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="270" y1="110" x2="270" y2="125" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Декоративные элементы -->
  <circle cx="440" cy="90" r="15" fill="#bee3f8" opacity="0.5"/>
  <circle cx="450" cy="95" r="10" fill="#90cdf4" opacity="0.5"/>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
</svg>