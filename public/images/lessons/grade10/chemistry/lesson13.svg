<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8fafc"/>
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)"/>
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Номер урока -->
  <circle cx="30" cy="30" r="18" fill="#fbbf24"/>
  <text x="30" y="37" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">13</text>
  
  <!-- Основной блок - Альдегиды -->
  <rect x="30" y="80" width="210" height="120" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="105" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">АЛЬДЕГИДЫ</text>
  
  <!-- Формула альдегида -->
  <text x="135" y="130" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="14">R-CHO</text>
  <!-- Карбонильная группа -->
  <circle cx="100" cy="150" r="8" fill="#ef4444"/>
  <text x="100" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">O</text>
  <line x1="110" y1="150" x2="160" y2="150" stroke="#1e293b" stroke-width="2"/>
  <line x1="110" y1="145" x2="160" y2="145" stroke="#1e293b" stroke-width="2"/>
  <circle cx="170" cy="150" r="6" fill="#1e293b"/>
  <text x="170" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8">H</text>
  
  <!-- Пример формальдегида -->
  <text x="135" y="185" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">H₂C=O</text>
  
  <!-- Основной блок - Кетоны -->
  <rect x="260" y="80" width="210" height="120" rx="10" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="105" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="18" font-weight="bold">КЕТОНЫ</text>
  
  <!-- Формула кетона -->
  <text x="365" y="130" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="14">R-COR'</text>
  <!-- Карбонильная группа -->
  <circle cx="330" cy="150" r="8" fill="#ef4444"/>
  <text x="330" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">O</text>
  <line x1="340" y1="150" x2="390" y2="150" stroke="#1e293b" stroke-width="2"/>
  <line x1="340" y1="145" x2="390" y2="145" stroke="#1e293b" stroke-width="2"/>
  <circle cx="400" cy="150" r="8" fill="#6366f1"/>
  <text x="400" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">R'</text>
  
  <!-- Пример ацетона -->
  <text x="365" y="185" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">CH₃COCH₃</text>
  
  <!-- Свойства карбонильных соединений -->
  <rect x="30" y="220" width="440" height="100" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="250" y="245" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">СВОЙСТВА КАРБОНИЛЬНЫХ СОЕДИНЕНИЙ</text>
  
  <!-- Свойства список -->
  <circle cx="50" cy="265" r="3" fill="#0ea5e9"/>
  <text x="65" y="270" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Полярность связи C=O</text>
  
  <circle cx="50" cy="285" r="3" fill="#0ea5e9"/>
  <text x="65" y="290" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Реакции нуклеофильного присоединения</text>
  
  <circle cx="50" y="305" r="3" fill="#0ea5e9"/>
  <text x="65" y="310" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Восстановление до спиртов</text>
  
  <circle cx="250" cy="265" r="3" fill="#0ea5e9"/>
  <text x="265" y="270" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Окисление альдегидов</text>
  
  <circle cx="250" cy="285" r="3" fill="#0ea5e9"/>
  <text x="265" y="290" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Реакции конденсации</text>
  
  <circle cx="250" cy="305" r="3" fill="#0ea5e9"/>
  <text x="265" y="310" fill="#1e293b" font-family="Arial, sans-serif" font-size="13">Образование шиффовых оснований</text>
  
  <!-- Атомы в карбонильной группе -->
  <g transform="translate(420, 260)">
    <circle cx="0" cy="0" r="10" fill="#1e293b"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">C</text>
    <circle cx="25" cy="0" r="10" fill="#ef4444"/>
    <text x="25" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">O</text>
    <line x1="10" y1="0" x2="15" y2="0" stroke="#1e293b" stroke-width="2"/>
    <line x1="10" y1="-5" x2="15" y2="-5" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Двойная связь -->
  <g transform="translate(445, 280)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-5" x2="20" y2="-5" stroke="#1e293b" stroke-width="2"/>
    <text x="10" y="-10" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10">C=O</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="470" cy="30" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="480" cy="40" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="460" cy="45" r="3" fill="#3b82f6" opacity="0.5"/>
  
  <!-- Стрелки между классами -->
  <path d="M 240 140 Q 250 140 260 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>