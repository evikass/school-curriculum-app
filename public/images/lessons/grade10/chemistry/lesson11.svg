<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="bgPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="2" fill="#e8f4f8" opacity="0.3"/>
    </pattern>
    
    <!-- Градиент для молекул -->
    <linearGradient id="molGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:0.8"/>
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  <rect width="500" height="350" fill="url(#bgPattern)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="60" rx="10" fill="#2c5aa0" filter="url(#shadow)"/>
  <text x="250" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    ХИМИЯ · 10 КЛАСС
  </text>
  
  <!-- Урок 11 -->
  <rect x="200" y="90" width="100" height="30" rx="15" fill="#ff6b6b"/>
  <text x="250" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Урок 11
  </text>
  
  <!-- Тема -->
  <text x="250" y="140" text-anchor="middle" fill="#2c5aa0" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Спирты
  </text>
  
  <!-- Классификация -->
  <rect x="40" y="160" width="200" height="40" rx="5" fill="#4a90e2" opacity="0.8"/>
  <text x="140" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Классификация
  </text>
  
  <!-- Строение -->
  <rect x="260" y="160" width="200" height="40" rx="5" fill="#4a90e2" opacity="0.8"/>
  <text x="360" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Строение
  </text>
  
  <!-- Свойства -->
  <rect x="150" y="210" width="200" height="40" rx="5" fill="#4a90e2" opacity="0.8"/>
  <text x="250" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Свойства
  </text>
  
  <!-- Молекула метанола -->
  <g transform="translate(60, 260)">
    <!-- Атомы -->
    <circle cx="0" cy="0" r="15" fill="#ff6b6b"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="30" cy="0" r="12" fill="#feca57"/>
    <text x="30" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-30" cy="0" r="12" fill="#feca57"/>
    <text x="-30" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="0" cy="-30" r="12" fill="#feca57"/>
    <text x="0" y="-26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="0" cy="30" r="15" fill="#54a0ff"/>
    <text x="0" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">O</text>
    
    <circle cx="0" cy="60" r="12" fill="#feca57"/>
    <text x="0" y="64" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <!-- Связи -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="-30" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="60" stroke="#333" stroke-width="2"/>
    
    <!-- Надпись -->
    <text x="0" y="85" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12">CH₃OH</text>
  </g>
  
  <!-- Молекула этанола -->
  <g transform="translate(250, 260)">
    <!-- Атомы -->
    <circle cx="-30" cy="0" r="15" fill="#ff6b6b"/>
    <text x="-30" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="0" cy="0" r="15" fill="#ff6b6b"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="-60" cy="0" r="12" fill="#feca57"/>
    <text x="-60" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-30" cy="-30" r="12" fill="#feca57"/>
    <text x="-30" y="-26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-30" cy="30" r="12" fill="#feca57"/>
    <text x="-30" y="34" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="30" cy="0" r="12" fill="#feca57"/>
    <text x="30" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="0" cy="30" r="15" fill="#54a0ff"/>
    <text x="0" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">O</text>
    
    <circle cx="0" cy="60" r="12" fill="#feca57"/>
    <text x="0" y="64" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <!-- Связи -->
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-30" y1="0" x2="-60" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-30" y1="0" x2="-30" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="-30" y1="0" x2="-30" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="60" stroke="#333" stroke-width="2"/>
    
    <!-- Надпись -->
    <text x="0" y="85" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12">C₂H₅OH</text>
  </g>
  
  <!-- Молекула пропанола -->
  <g transform="translate(440, 260)">
    <!-- Атомы -->
    <circle cx="-45" cy="0" r="15" fill="#ff6b6b"/>
    <text x="-45" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="-15" cy="0" r="15" fill="#ff6b6b"/>
    <text x="-15" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="15" cy="0" r="15" fill="#ff6b6b"/>
    <text x="15" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">C</text>
    
    <circle cx="-75" cy="0" r="12" fill="#feca57"/>
    <text x="-75" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-45" cy="-30" r="12" fill="#feca57"/>
    <text x="-45" y="-26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-45" cy="30" r="12" fill="#feca57"/>
    <text x="-45" y="34" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="-15" cy="-30" r="12" fill="#feca57"/>
    <text x="-15" y="-26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="15" cy="-30" r="12" fill="#feca57"/>
    <text x="15" y="-26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="45" cy="0" r="12" fill="#feca57"/>
    <text x="45" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <circle cx="15" cy="30" r="15" fill="#54a0ff"/>
    <text x="15" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">O</text>
    
    <circle cx="15" cy="60" r="12" fill="#feca57"/>
    <text x="15" y="64" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">H</text>
    
    <!-- Связи -->
    <line x1="-45" y1="0" x2="-15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-45" y1="0" x2="-75" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-45" y1="0" x2="-45" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="-45" y1="0" x2="-45" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="0" x2="-15" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="0" x2="45" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="30" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="30" x2="15" y2="60" stroke="#333" stroke-width="2"/>
    
    <!-- Надпись -->
    <text x="15" y="85" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12">C₃H₇OH</text>
  </g>
  
  <!-- Стрелки между молекулами -->
  <path d="M 130 330 L 210 330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 320 330 L 400 330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стержень стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Подписи типов спиртов -->
  <text x="90" y="300" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">Одноатомный</text>
  <text x="250" y="300" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">Одноатомный</text>
  <text x="410" y="300" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">Одноатомный</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="330" r="3" fill="#4a90e2"/>
  <circle cx="470" cy="330" r="3" fill="#4a90e2"/>
  <circle cx="30" cy="170" r="3" fill="#ff6b6b"/>
  <circle cx="470" cy="170" r="3" fill="#ff6b6b"/>
  
  <!-- Пунктирные линии -->
  <line x1="40" y1="150" x2="40" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="460" y1="150" x2="460" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>
</svg>