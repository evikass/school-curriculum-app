<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#E8F4FD"/>
  
  <!-- Title -->
  <rect x="100" y="20" width="300" height="40" fill="#2E86AB" rx="5"/>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Lesson title -->
  <text x="250" y="85" text-anchor="middle" fill="#2E86AB" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Урок 11. Travel and transport</text>
  
  <!-- Plane -->
  <g transform="translate(80, 120)">
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="#FFD93D" stroke="#F39C12" stroke-width="2"/>
    <rect x="-50" y="-5" width="40" height="10" fill="#F39C12"/>
    <polygon points="-50,0 -70,-10 -70,10" fill="#E74C3C"/>
    <polygon points="10,-8 30,-15 30,-1" fill="#3498DB"/>
    <polygon points="10,8 30,15 30,1" fill="#3498DB"/>
    <text x="0" y="5" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">PLANE</text>
  </g>
  
  <!-- Car -->
  <g transform="translate(250, 140)">
    <rect x="-30" y="-10" width="60" height="20" fill="#E74C3C" rx="5"/>
    <rect x="-25" y="-5" width="15" height="10" fill="#3498DB"/>
    <rect x="10" y="-5" width="15" height="10" fill="#3498DB"/>
    <circle cx="-20" cy="10" r="8" fill="#2C3E50"/>
    <circle cx="20" cy="10" r="8" fill="#2C3E50"/>
    <circle cx="-20" cy="10" r="4" fill="#95A5A6"/>
    <circle cx="20" cy="10" r="4" fill="#95A5A6"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">CAR</text>
  </g>
  
  <!-- Bus -->
  <g transform="translate(400, 140)">
    <rect x="-35" y="-12" width="70" height="24" fill="#F39C12" rx="5"/>
    <rect x="-30" y="-7" width="20" height="10" fill="#3498DB"/>
    <rect x="-5" y="-7" width="20" height="10" fill="#3498DB"/>
    <rect x="20" y="-7" width="15" height="10" fill="#3498DB"/>
    <circle cx="-25" cy="12" r="7" fill="#2C3E50"/>
    <circle cx="25" cy="12" r="7" fill="#2C3E50"/>
    <circle cx="-25" cy="12" r="3" fill="#95A5A6"/>
    <circle cx="25" cy="12" r="3" fill="#95A5A6"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">BUS</text>
  </g>
  
  <!-- Train -->
  <g transform="translate(150, 220)">
    <rect x="-40" y="-15" width="80" height="30" fill="#8E44AD" rx="5"/>
    <rect x="-35" y="-10" width="25" height="15" fill="#ECF0F1"/>
    <rect x="-5" y="-10" width="25" height="15" fill="#ECF0F1"/>
    <rect x="25" y="-10" width="15" height="15" fill="#ECF0F1"/>
    <circle cx="-30" cy="15" r="6" fill="#2C3E50"/>
    <circle cx="-10" cy="15" r="6" fill="#2C3E50"/>
    <circle cx="10" cy="15" r="6" fill="#2C3E50"/>
    <circle cx="30" cy="15" r="6" fill="#2C3E50"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">TRAIN</text>
  </g>
  
  <!-- Bicycle -->
  <g transform="translate(320, 220)">
    <circle cx="-15" cy="5" r="12" fill="none" stroke="#2C3E50" stroke-width="3"/>
    <circle cx="15" cy="5" r="12" fill="none" stroke="#2C3E50" stroke-width="3"/>
    <line x1="-15" y1="5" x2="0" y2="-10" stroke="#2C3E50" stroke-width="3"/>
    <line x1="0" y1="-10" x2="15" y2="5" stroke="#2C3E50" stroke-width="3"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#2C3E50" stroke-width="3"/>
    <line x1="0" y1="-10" x2="0" y2="-20" stroke="#2C3E50" stroke-width="3"/>
    <line x1="-5" y1="-15" x2="5" y2="-15" stroke="#2C3E50" stroke-width="3"/>
    <text x="0" y="25" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">BICYCLE</text>
  </g>
  
  <!-- Ship -->
  <g transform="translate(250, 280)">
    <path d="M-40 0 L-30 -15 L30 -15 L40 0 Z" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
    <rect x="-5" y="-20" width="10" height="15" fill="#E74C3C"/>
    <polygon points="0,-20 -10,-30 10,-30" fill="#E74C3C"/>
    <rect x="-50" y="0" width="100" height="8" fill="#95A5A6" rx="2"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">SHIP</text>
  </g>
  
  <!-- Helicopter -->
  <g transform="translate(80, 280)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#E74C3C"/>
    <rect x="-5" y="-20" width="10" height="25" fill="#34495E"/>
    <rect x="-30" y="-22" width="60" height="4" fill="#95A5A6"/>
    <rect x="-2" y="-35" width="4" height="15" fill="#95A5A6"/>
    <text x="0" y="15" text-anchor="middle" fill="#2C3E50" font-size="10" font-weight="bold">HELICOPTER</text>
  </g>
  
  <!-- Rocket -->
  <g transform="translate(400, 280)">
    <polygon points="0,-25 -10,0 0,10 10,0" fill="#E74C3C"/>
    <polygon points="-5,0 -15,10 -5,15" fill="#F39C12"/>
    <polygon points="5,0 15,10 5,15" fill="#F39C12"/>
    <ellipse cx="0" cy="0" rx="8" ry="15" fill="#3498DB"/>
    <circle cx="0" cy="-5" r="3" fill="#ECF0F1"/>
    <text x="0" y="25" text-anchor="middle" fill="#2C3E50" font-size="10" font-weight="bold">ROCKET</text>
  </g>
  
  <!-- Words with arrows -->
  <text x="80" y="110" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Air</text>
  <text x="250" y="110" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Road</text>
  <text x="400" y="110" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Road</text>
  <text x="150" y="200" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Rail</text>
  <text x="320" y="200" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Personal</text>
  <text x="250" y="260" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Sea</text>
  <text x="80" y="260" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Air</text>
  <text x="400" y="260" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="bold">Space</text>
  
  <!-- Question marks -->
  <circle cx="120" cy="160" r="15" fill="#F39C12" opacity="0.3"/>
  <text x="120" y="165" text-anchor="middle" fill="#2C3E50" font-size="20" font-weight="bold">?</text>
  
  <circle cx="300" cy="180" r="15" fill="#F39C12" opacity="0.3"/>
  <text x="300" y="185" text-anchor="middle" fill="#2C3E50" font-size="20" font-weight="bold">?</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="5" fill="#3498DB" opacity="0.5"/>
  <circle cx="450" cy="50" r="5" fill="#3498DB" opacity="0.5"/>
  <circle cx="50" cy="300" r="5" fill="#E74C3C" opacity="0.5"/>
  <circle cx="450" cy="300" r="5" fill="#E74C3C" opacity="0.5"/>
  
  <!-- Transport types labels -->
  <rect x="10" y="100" width="60" height="25" fill="#ECF0F1" rx="3"/>
  <text x="40" y="117" text-anchor="middle" fill="#2C3E50" font-size="11">AIR</text>
  
  <rect x="10" y="130" width="60" height="25" fill="#ECF0F1" rx="3"/>
  <text x="40" y="147" text-anchor="middle" fill="#2C3E50" font-size="11">ROAD</text>
  
  <rect x="10" y="160" width="60" height="25" fill="#ECF0F1" rx="3"/>
  <text x="40" y="177" text-anchor="middle" fill="#2C3E50" font-size="11">RAIL</text>
  
  <rect x="430" y="100" width="60" height="25" fill="#ECF0F1" rx="3"/>
  <text x="460" y="117" text-anchor="middle" fill="#2C3E50" font-size="11">SEA</text>
  
  <rect x="430" y="130" width="60" height="25" fill="#ECF0F1" rx="3"/>
  <text x="460" y="147" text-anchor="middle" fill="#2C3E50" font-size="11">SPACE</text>
  
  <!-- Additional words -->
  <text x="180" y="260" text-anchor="middle" fill="#7F8C8D" font-size="10">passenger</text>
  <text x="180" y="272" text-anchor="middle" fill="#7F8C8D" font-size="10">transport</text>
  
  <text x="320" y="260" text-anchor="middle" fill="#7F8C8D" font-size="10">two</text>
  <text x="320" y="272" text-anchor="middle" fill="#7F8C8D" font-size="10">wheels</text>
  
  <!-- Weather indicators -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="8" fill="#F1C40F" opacity="0.8"/>
    <line x1="8" y1="0" x2="15" y2="0" stroke="#F39C12" stroke-width="2"/>
    <line x1="0" y1="8" x2="0" y2="15" stroke="#F39C12" stroke-width="2"/>
    <line x1="-8" y1="0" x2="-15" y2="0" stroke="#F39C12" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="-15" stroke="#F39C12" stroke-width="2"/>
    <line x1="5" y1="5" x2="10" y2="10" stroke="#F39C12" stroke-width="2"/>
    <line x1="5" y1="-5" x2="10" y2="-10" stroke="#F39C12" stroke-width="2"/>
    <line x1="-5" y1="5" x2="-10" y2="10" stroke="#F39C12" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="-10" y2="-10" stroke="#F39C12" stroke-width="2"/>
  </g>
  
  <!-- Compass -->
  <g transform="translate(400, 50)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#34495E" stroke-width="2"/>
    <polygon points="0,-20 5,-5 0,0 -5,-5" fill="#E74C3C"/>
    <polygon points="0,20 5,5 0,0 -5,5" fill="#3498DB"/>
    <text x="0" y="-25" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">N</text>
    <text x="0" y="30" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">S</text>
    <text x="-25" y="5" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">W</text>
    <text x="25" y="5" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="bold">E</text>
  </g>
  
  <!-- Distance scale -->
  <line x1="50" y1="320" x2="150" y2="320" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="50" y1="315" x2="50" y2="325" stroke="#7F8C8D" stroke-width="2"/>
  <line x1="150" y1="315" x2="150" y2="325" stroke="#7F8C8D" stroke-width="2"/>
  <text x="100" y="340" text-anchor="middle" fill="#7F8C8D" font-size="10">100 km</text>
  
  <!-- Speed indicators -->
  <text x="80" y="170" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">900 km/h</text>
  <text x="250" y="190" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">120 km/h</text>
  <text x="400" y="190" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">80 km/h</text>
  <text x="150" y="250" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">300 km/h</text>
  <text x="320" y="250" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">25 km/h</text>
  <text x="250" y="310" text-anchor="middle" fill="#E74C3C" font-size="12" font-weight="bold">50 km/h</text>
  
  <!-- Legend -->
  <rect x="170" y="20" width="160" height="15" fill="#ECF0F1" rx="3" opacity="0.7"/>
  <text x="250" y="30" text-anchor="middle" fill="#2C3E50" font-size="10">Transportation Vocabulary</text>
</svg>