<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">Урок 5. Hobbies and free time</text>
  
  <!-- Категории хобби -->
  <g id="categories">
    <!-- Outdoor activities -->
    <rect x="20" y="80" width="110" height="80" rx="10" fill="#3498db" opacity="0.8"/>
    <text x="75" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Outdoor</text>
    <text x="75" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Activities</text>
    
    <!-- Indoor hobbies -->
    <rect x="140" y="80" width="110" height="80" rx="10" fill="#e74c3c" opacity="0.8"/>
    <text x="195" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Indoor</text>
    <text x="195" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Hobbies</text>
    
    <!-- Creative activities -->
    <rect x="260" y="80" width="110" height="80" rx="10" fill="#9b59b6" opacity="0.8"/>
    <text x="315" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Creative</text>
    <text x="315" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Activities</text>
    
    <!-- Sports -->
    <rect x="380" y="80" width="100" height="80" rx="10" fill="#2ecc71" opacity="0.8"/>
    <text x="430" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Sports</text>
  </g>
  
  <!-- Примеры хобби -->
  <g id="hobby-examples">
    <!-- Outdoor examples -->
    <circle cx="75" cy="195" r="15" fill="#3498db"/>
    <text x="75" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Hiking</text>
    
    <circle cx="75" cy="225" r="15" fill="#3498db"/>
    <text x="75" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Camping</text>
    
    <circle cx="75" cy="255" r="15" fill="#3498db"/>
    <text x="75" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fishing</text>
    
    <circle cx="75" cy="285" r="15" fill="#3498db"/>
    <text x="75" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Cycling</text>
    
    <!-- Indoor examples -->
    <circle cx="195" cy="195" r="15" fill="#e74c3c"/>
    <text x="195" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Reading</text>
    
    <circle cx="195" cy="225" r="15" fill="#e74c3c"/>
    <text x="195" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Cooking</text>
    
    <circle cx="195" cy="255" r="15" fill="#e74c3c"/>
    <text x="195" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gaming</text>
    
    <circle cx="195" cy="285" r="15" fill="#e74c3c"/>
    <text x="195" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">TV</text>
    
    <!-- Creative examples -->
    <circle cx="315" cy="195" r="15" fill="#9b59b6"/>
    <text x="315" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Drawing</text>
    
    <circle cx="315" cy="225" r="15" fill="#9b59b6"/>
    <text x="315" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Painting</text>
    
    <circle cx="315" cy="255" r="15" fill="#9b59b6"/>
    <text x="315" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Music</text>
    
    <circle cx="315" cy="285" r="15" fill="#9b59b6"/>
    <text x="315" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Writing</text>
    
    <!-- Sports examples -->
    <circle cx="430" cy="195" r="15" fill="#2ecc71"/>
    <text x="430" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Football</text>
    
    <circle cx="430" cy="225" r="15" fill="#2ecc71"/>
    <text x="430" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Basketball</text>
    
    <circle cx="430" cy="255" r="15" fill="#2ecc71"/>
    <text x="430" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Tennis</text>
    
    <circle cx="430" cy="285" r="15" fill="#2ecc71"/>
    <text x="430" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Swimming</text>
  </g>
  
  <!-- Связующие линии -->
  <g id="lines" opacity="0.3">
    <line x1="75" y1="160" x2="75" y2="180" stroke="#3498db" stroke-width="2"/>
    <line x1="195" y1="160" x2="195" y2="180" stroke="#e74c3c" stroke-width="2"/>
    <line x1="315" y1="160" x2="315" y2="180" stroke="#9b59b6" stroke-width="2"/>
    <line x1="430" y1="160" x2="430" y2="180" stroke="#2ecc71" stroke-width="2"/>
  </g>
  
  <!-- Вопрос для обсуждения -->
  <rect x="150" y="320" width="200" height="25" rx="12" fill="#f39c12" opacity="0.8"/>
  <text x="250" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">What's your hobby?</text>
  
  <!-- Иконки -->
  <g id="icons">
    <!-- Иконка книги для reading -->
    <rect x="180" y="210" width="30" height="20" fill="#e74c3c" opacity="0.6" rx="2"/>
    <line x1="180" y1="220" x2="210" y2="220" stroke="white" stroke-width="1"/>
    
    <!-- Иконка мяча для football -->
    <circle cx="415" cy="210" r="10" fill="#2ecc71" opacity="0.6"/>
    <path d="M415 205 Q410 210 415 215 Q420 210 415 205" fill="none" stroke="white" stroke-width="1"/>
    
    <!-- Иконка кисти для painting -->
    <rect x="300" y="210" width="4" height="15" fill="#9b59b6" opacity="0.6"/>
    <ellipse cx="302" cy="207" rx="6" ry="3" fill="#9b59b6" opacity="0.6"/>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="decorative">
    <!-- Точки для украшения -->
    <circle cx="40" cy="320" r="3" fill="#3498db" opacity="0.5"/>
    <circle cx="50" cy="320" r="3" fill="#e74c3c" opacity="0.5"/>
    <circle cx="60" cy="320" r="3" fill="#9b59b6" opacity="0.5"/>
    <circle cx="70" cy="320" r="3" fill="#2ecc71" opacity="0.5"/>
    
    <circle cx="430" cy="320" r="3" fill="#3498db" opacity="0.5"/>
    <circle cx="440" cy="320" r="3" fill="#e74c3c" opacity="0.5"/>
    <circle cx="450" cy="320" r="3" fill="#9b59b6" opacity="0.5"/>
    <circle cx="460" cy="320" r="3" fill="#2ecc71" opacity="0.5"/>
  </g>
  
  <!-- Надписи на русском -->
  <g id="russian-labels">
    <text x="20" y="310" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">На свежем воздухе</text>
    <text x="140" y="310" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Домашние занятия</text>
    <text x="260" y="310" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Творчество</text>
    <text x="380" y="310" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Спорт</text>
  </g>
  
  <!-- Подписи времени -->
  <g id="time-labels">
    <text x="20" y="335" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">free time</text>
    <text x="450" y="335" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">leisure</text>
  </g>
</svg>