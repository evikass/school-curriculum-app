<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Урок 12. Comparatives and Superlatives
  </text>
  
  <!-- Class label -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
    АНГЛИЙСКИЙ · 7 КЛАСС
  </text>
  
  <!-- Main content area -->
  <g transform="translate(50, 80)">
    <!-- Comparative section -->
    <rect x="0" y="0" width="180" height="200" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Comparative
    </text>
    
    <!-- Comparative examples -->
    <g transform="translate(15, 45)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        big → bigger
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        tall → taller
      </text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        happy → happier
      </text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        beautiful → more beautiful
      </text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        difficult → more difficult
      </text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        good → better
      </text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        bad → worse
      </text>
    </g>
    
    <!-- Superlative section -->
    <rect x="200" y="0" width="180" height="200" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="290" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      Superlative
    </text>
    
    <!-- Superlative examples -->
    <g transform="translate(215, 45)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        big → the biggest
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        tall → the tallest
      </text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        happy → the happiest
      </text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        beautiful → the most beautiful
      </text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        difficult → the most difficult
      </text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        good → the best
      </text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
        bad → the worst
      </text>
    </g>
  </g>
  
  <!-- Examples section -->
  <g transform="translate(30, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
      Example: This book is 
      <tspan font-weight="bold" fill="#2196f3">more interesting</tspan> than that one.
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
      Example: She is the 
      <tspan font-weight="bold" fill="#f44336">smartest</tspan> student in our class.
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="8" fill="#3498db" opacity="0.3"/>
  <circle cx="470" cy="30" r="8" fill="#e74c3c" opacity="0.3"/>
  <circle cx="30" cy="320" r="8" fill="#2ecc71" opacity="0.3"/>
  <circle cx="470" cy="320" r="8" fill="#f39c12" opacity="0.3"/>
  
  <!-- Arrow between sections -->
  <path d="M 190 180 L 200 180" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Rules section -->
  <g transform="translate(50, 60)">
    <rect x="360" y="80" width="130" height="140" rx="5" fill="#f8bbd9" stroke="#e91e63" stroke-width="1.5" opacity="0.8"/>
    <text x="425" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#880e4f">
      Rules
    </text>
    <text x="365" y="120" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      1-syllable: + -er
    </text>
    <text x="365" y="135" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      1-syllable + e: + -r
    </text>
    <text x="365" y="150" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      CVC: double consonant
    </text>
    <text x="365" y="165" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      2+ syllables: more/less
    </text>
    <text x="365" y="180" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      Superlative: the most
    </text>
    <text x="365" y="195" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      Irregular forms
    </text>
  </g>
</svg>