<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Lesson Number -->
  <rect x="20" y="45" width="60" height="25" rx="12" fill="#3498db"/>
  <text x="50" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Урок 9</text>
  
  <!-- Main Title -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Past Simple</text>
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Regular and irregular verbs</text>
  
  <!-- Regular Verbs Section -->
  <rect x="30" y="130" width="220" height="190" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Regular Verbs</text>
  
  <!-- Regular Verb Examples -->
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Walk -->
    <rect x="45" y="170" width="60" height="20" rx="5" fill="#3498db"/>
    <text x="75" y="184" text-anchor="middle" fill="white">walk</text>
    <rect x="115" y="170" width="70" height="20" rx="5" fill="#2980b9"/>
    <text x="150" y="184" text-anchor="middle" fill="white">walked</text>
    
    <!-- Play -->
    <rect x="45" y="200" width="60" height="20" rx="5" fill="#3498db"/>
    <text x="75" y="214" text-anchor="middle" fill="white">play</text>
    <rect x="115" y="200" width="70" height="20" rx="5" fill="#2980b9"/>
    <text x="150" y="214" text-anchor="middle" fill="white">played</text>
    
    <!-- Work -->
    <rect x="45" y="230" width="60" height="20" rx="5" fill="#3498db"/>
    <text x="75" y="244" text-anchor="middle" fill="white">work</text>
    <rect x="115" y="230" width="70" height="20" rx="5" fill="#2980b9"/>
    <text x="150" y="244" text-anchor="middle" fill="white">worked</text>
    
    <!-- Live -->
    <rect x="45" y="260" width="60" height="20" rx="5" fill="#3498db"/>
    <text x="75" y="274" text-anchor="middle" fill="white">live</text>
    <rect x="115" y="260" width="70" height="20" rx="5" fill="#2980b9"/>
    <text x="150" y="274" text-anchor="middle" fill="white">lived</text>
    
    <!-- Study -->
    <rect x="45" y="290" width="60" height="20" rx="5" fill="#3498db"/>
    <text x="75" y="304" text-anchor="middle" fill="white">study</text>
    <rect x="115" y="290" width="70" height="20" rx="5" fill="#2980b9"/>
    <text x="150" y="304" text-anchor="middle" fill="white">studied</text>
  </g>
  
  <!-- Rule for regular verbs -->
  <text x="140" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">Rule: + ed</text>
  
  <!-- Irregular Verbs Section -->
  <rect x="270" y="130" width="220" height="190" rx="10" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="380" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Irregular Verbs</text>
  
  <!-- Irregular Verb Examples -->
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Go -->
    <rect x="285" y="170" width="50" height="20" rx="5" fill="#4caf50"/>
    <text x="310" y="184" text-anchor="middle" fill="white">go</text>
    <rect x="345" y="170" width="65" height="20" rx="5" fill="#388e3c"/>
    <text x="377" y="184" text-anchor="middle" fill="white">went</text>
    
    <!-- Eat -->
    <rect x="285" y="200" width="50" height="20" rx="5" fill="#4caf50"/>
    <text x="310" y="214" text-anchor="middle" fill="white">eat</text>
    <rect x="345" y="200" width="65" height="20" rx="5" fill="#388e3c"/>
    <text x="377" y="214" text-anchor="middle" fill="white">ate</text>
    
    <!-- See -->
    <rect x="285" y="230" width="50" height="20" rx="5" fill="#4caf50"/>
    <text x="310" y="244" text-anchor="middle" fill="white">see</text>
    <rect x="345" y="230" width="65" height="20" rx="5" fill="#388e3c"/>
    <text x="377" y="244" text-anchor="middle" fill="white">saw</text>
    
    <!-- Have -->
    <rect x="285" y="260" width="50" height="20" rx="5" fill="#4caf50"/>
    <text x="310" y="274" text-anchor="middle" fill="white">have</text>
    <rect x="345" y="260" width="65" height="20" rx="5" fill="#388e3c"/>
    <text x="377" y="274" text-anchor="middle" fill="white">had</text>
    
    <!-- Make -->
    <rect x="285" y="290" width="50" height="20" rx="5" fill="#4caf50"/>
    <text x="310" y="304" text-anchor="middle" fill="white">make</text>
    <rect x="345" y="290" width="65" height="20" rx="5" fill="#388e3c"/>
    <text x="377" y="304" text-anchor="middle" fill="white">made</text>
  </g>
  
  <!-- Note for irregular verbs -->
  <text x="380" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">No specific rule</text>
  
  <!-- Arrow between sections -->
  <path d="M 250 175 L 270 175" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Clock icon for past tense -->
  <circle cx="250" cy="120" r="15" fill="#e74c3c" opacity="0.8"/>
  <line x1="250" y1="120" x2="250" y2="110" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="250" y1="120" x2="255" y2="128" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="250" cy="120" r="2" fill="white"/>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="25" r="5" fill="#3498db" opacity="0.3"/>
  <circle cx="475" cy="25" r="5" fill="#4caf50" opacity="0.3"/>
  <circle cx="25" cy="325" r="5" fill="#e74c3c" opacity="0.3"/>
  <circle cx="475" cy="325" r="5" fill="#f39c12" opacity="0.3"/>
  
  <!-- Small decorative dots -->
  <circle cx="200" cy="50" r="2" fill="#95a5a6"/>
  <circle cx="210" cy="50" r="2" fill="#95a5a6"/>
  <circle cx="220" cy="50" r="2" fill="#95a5a6"/>
  <circle cx="280" cy="50" r="2" fill="#95a5a6"/>
  <circle cx="290" cy="50" r="2" fill="#95a5a6"/>
  <circle cx="300" cy="50" r="2" fill="#95a5a6"/>
  
  <!-- Past time indicator -->
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">PAST</text>
</svg>