<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Title Background -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="#2c3e50"/>
  
  <!-- Title Text -->
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    АНГЛИЙСКИЙ · 7 КЛАСС
  </text>
  
  <!-- Lesson Title -->
  <text x="250" y="90" text-anchor="middle" fill="#34495e" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Урок 10. Famous people. Biographies
  </text>
  
  <!-- Book Icon -->
  <g transform="translate(30, 25)">
    <rect width="20" height="25" rx="2" fill="#e74c3c"/>
    <rect x="2" y="2" width="16" height="21" fill="white"/>
    <line x1="10" y1="5" x2="10" y2="20" stroke="#e74c3c" stroke-width="1"/>
    <line x1="5" y1="8" x2="15" y2="8" stroke="#e74c3c" stroke-width="0.5"/>
    <line x1="5" y1="12" x2="15" y2="12" stroke="#e74c3c" stroke-width="0.5"/>
    <line x1="5" y1="16" x2="15" y2="16" stroke="#e74c3c" stroke-width="0.5"/>
  </g>
  
  <!-- Albert Einstein Circle -->
  <circle cx="120" cy="160" r="40" fill="#3498db" opacity="0.8"/>
  <circle cx="120" cy="160" r="35" fill="white"/>
  <!-- Einstein Face -->
  <circle cx="120" cy="150" r="12" fill="#2c3e50"/>
  <path d="M 105 165 Q 120 175 135 165" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <path d="M 115 155 Q 120 158 125 155" stroke="#2c3e50" stroke-width="1" fill="none"/>
  <path d="M 115 170 Q 120 173 125 170" stroke="#2c3e50" stroke-width="1" fill="none"/>
  <text x="120" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Albert Einstein</text>
  <text x="120" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">1879-1955</text>
  <text x="120" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#34495e">Physicist</text>
  
  <!-- William Shakespeare Circle -->
  <circle cx="250" cy="160" r="40" fill="#9b59b6" opacity="0.8"/>
  <circle cx="250" cy="160" r="35" fill="white"/>
  <!-- Shakespeare Face -->
  <circle cx="250" cy="150" r="12" fill="#2c3e50"/>
  <ellipse cx="250" cy="165" rx="15" ry="10" fill="#2c3e50"/>
  <rect x="245" y="160" width="10" height="8" fill="white"/>
  <text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">William Shakespeare</text>
  <text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">1564-1616</text>
  <text x="250" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#34495e">Playwright</text>
  
  <!-- Marie Curie Circle -->
  <circle cx="380" cy="160" r="40" fill="#e67e22" opacity="0.8"/>
  <circle cx="380" cy="160" r="35" fill="white"/>
  <!-- Marie Curie Face -->
  <circle cx="380" cy="150" r="12" fill="#2c3e50"/>
  <path d="M 365 165 Q 380 175 395 165" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <path d="M 375 155 Q 380 158 385 155" stroke="#2c3e50" stroke-width="1" fill="none"/>
  <path d="M 375 170 Q 380 173 385 170" stroke="#2c3e50" stroke-width="1" fill="none"/>
  <text x="380" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Marie Curie</text>
  <text x="380" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">1867-1934</text>
  <text x="380" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#34495e">Scientist</text>
  
  <!-- Connection Lines -->
  <line x1="160" y1="160" x2="210" y2="160" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="290" y1="160" x2="340" y2="160" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Icons -->
  <!-- Nobel Prize Icon -->
  <g transform="translate(120, 270)">
    <circle r="15" fill="#f39c12"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="white">N</text>
  </g>
  
  <!-- Globe Icon -->
  <g transform="translate(250, 270)">
    <circle r="15" fill="#3498db"/>
    <ellipse cx="0" cy="0" rx="10" ry="15" fill="none" stroke="white" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Book Icon 2 -->
  <g transform="translate(380, 270)">
    <rect x="-12" y="-10" width="24" height="20" rx="2" fill="#e74c3c"/>
    <rect x="-10" y="-8" width="20" height="16" fill="white"/>
    <line x1="0" y1="-6" x2="0" y2="8" stroke="#e74c3c" stroke-width="1"/>
  </g>
  
  <!-- Labels for icons -->
  <text x="120" y="300" text-anchor="middle" font-size="10" fill="#7f8c8d">Nobel Prize</text>
  <text x="250" y="300" text-anchor="middle" font-size="10" fill="#7f8c8d">World Impact</text>
  <text x="380" y="300" text-anchor="middle" font-size="10" fill="#7f8c8d">Literature</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="120" r="3" fill="#3498db"/>
  <circle cx="420" cy="120" r="3" fill="#e74c3c"/>
  <circle cx="100" cy="280" r="3" fill="#2ecc71"/>
  <circle cx="400" cy="280" r="3" fill="#f39c12"/>
  
  <!-- Quote boxes -->
  <rect x="30" y="100" width="80" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="70" y="120" text-anchor="middle" font-size="8" fill="#7f8c8d">"Imagination is more important than knowledge"</text>
  
  <rect x="390" y="100" width="80" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="430" y="120" text-anchor="middle" font-size="8" fill="#7f8c8d">"To be or not to be"</text>
  
  <!-- Achievement badges -->
  <g transform="translate(60, 200)">
    <polygon points="0,10 10,0 20,10 10,20" fill="#e74c3c"/>
    <text x="10" y="14" text-anchor="middle" font-size="8" fill="white">E=mc²</text>
  </g>
  
  <g transform="translate(190, 200)">
    <polygon points="0,10 10,0 20,10 10,20" fill="#9b59b6"/>
    <text x="10" y="14" text-anchor="middle" font-size="8" fill="white">Hamlet</text>
  </g>
  
  <g transform="translate(320, 200)">
    <polygon points="0,10 10,0 20,10 10,20" fill="#f39c12"/>
    <text x="10" y="14" text-anchor="middle" font-size="8" fill="white">Radium</text>
  </g>
  
  <!-- Additional labels -->
  <text x="50" y="340" font-size="9" fill="#95a5a6">Famous People</text>
  <text x="450" y="340" text-anchor="end" font-size="9" fill="#95a5a6">Biographies</text>
  
  <!-- Timeline marker -->
  <line x1="50" y1="330" x2="450" y2="330" stroke="#bdc3c7" stroke-width="1"/>
  <circle cx="120" cy="330" r="3" fill="#3498db"/>
  <circle cx="250" cy="330" r="3" fill="#9b59b6"/>
  <circle cx="380" cy="330" r="3" fill="#e67e22"/>
</svg>