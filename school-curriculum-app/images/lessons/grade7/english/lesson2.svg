<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Lesson 2. My family. Family members</text>
  
  <!-- Дедушка -->
  <circle cx="100" cy="120" r="25" fill="#8b6f47"/>
  <path d="M100 145 L100 165 M85 155 L115 155" stroke="#8b6f47" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 165 L90 190 L110 190 Z" fill="#8b6f47"/>
  <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Grandfather</text>
  <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Дедушка</text>
  
  <!-- Бабушка -->
  <circle cx="200" cy="120" r="25" fill="#d4a574"/>
  <path d="M200 145 L200 165 M185 155 L215 155" stroke="#d4a574" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 165 L190 190 L210 190 Z" fill="#d4a574"/>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Grandmother</text>
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Бабушка</text>
  
  <!-- Отец -->
  <circle cx="300" cy="120" r="25" fill="#3498db"/>
  <path d="M300 145 L300 165 M285 155 L315 155" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 165 L290 190 L310 190 Z" fill="#3498db"/>
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Father</text>
  <text x="300" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Отец</text>
  
  <!-- Мать -->
  <circle cx="400" cy="120" r="25" fill="#e74c3c"/>
  <path d="M400 145 L400 165 M385 155 L415 155" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M400 165 L390 190 L410 190 Z" fill="#e74c3c"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Mother</text>
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Мать</text>
  
  <!-- Сын -->
  <circle cx="150" cy="270" r="20" fill="#16a085"/>
  <path d="M150 290 L150 310 M138 302 L162 302" stroke="#16a085" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 310 L142 330 L158 330 Z" fill="#16a085"/>
  <text x="150" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Son</text>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Сын</text>
  
  <!-- Дочь -->
  <circle cx="250" cy="270" r="20" fill="#9b59b6"/>
  <path d="M250 290 L250 310 M238 302 L262 302" stroke="#9b59b6" stroke-width="2" stroke-linecap="round"/>
  <path d="M250 310 L242 330 L258 330 Z" fill="#9b59b6"/>
  <text x="250" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Daughter</text>
  <text x="250" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Дочь</text>
  
  <!-- Дядя -->
  <circle cx="350" cy="270" r="20" fill="#f39c12"/>
  <path d="M350 290 L350 310 M338 302 L362 302" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
  <path d="M350 310 L342 330 L358 330 Z" fill="#f39c12"/>
  <text x="350" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Uncle</text>
  <text x="350" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Дядя</text>
  
  <!-- Тетя -->
  <circle cx="450" cy="270" r="20" fill="#e67e22"/>
  <path d="M450 290 L450 310 M438 302 L462 302" stroke="#e67e22" stroke-width="2" stroke-linecap="round"/>
  <path d="M450 310 L442 330 L458 330 Z" fill="#e67e22"/>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Aunt</text>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Тетя</text>
  
  <!-- Соединяющие линии -->
  <line x1="100" y1="190" x2="100" y2="200" stroke="#95a5a6" stroke-width="1"/>
  <line x1="200" y1="190" x2="200" y2="200" stroke="#95a5a6" stroke-width="1"/>
  <line x1="300" y1="190" x2="300" y2="200" stroke="#95a5a6" stroke-width="1"/>
  <line x1="400" y1="190" x2="400" y2="200" stroke="#95a5a6" stroke-width="1"/>
  
  <line x1="100" y1="200" x2="400" y2="200" stroke="#95a5a6" stroke-width="1"/>
  <line x1="200" y1="200" x2="200" y2="210" stroke="#95a5a6" stroke-width="1"/>
  
  <line x1="300" y1="200" x2="300" y2="210" stroke="#95a5a6" stroke-width="1"/>
  <line x1="400" y1="200" x2="400" y2="210" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Дополнительные элементы -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Parents</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Родители</text>
  
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Children</text>
  <text x="150" y="265" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Дети</text>
  
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Relatives</text>
  <text x="370" y="265" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Родственники</text>
  
  <!-- Декоративные элементы -->
  <circle cx="20" cy="20" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="480" cy="20" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="20" cy="330" r="3" fill="#16a085" opacity="0.5"/>
  <circle cx="480" cy="330" r="3" fill="#9b59b6" opacity="0.5"/>
  
  <!-- Иконки -->
  <g transform="translate(50, 140)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#3498db" stroke-width="2"/>
    <path d="M0,-8 L0 8 M-8,0 L8,0" stroke="#3498db" stroke-width="1"/>
  </g>
  
  <g transform="translate(450, 140)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <path d="M0,-8 L0 8 M-8,0 L8,0" stroke="#e74c3c" stroke-width="1"/>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Male</text>
  <text x="470" y="130" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Female</text>
  
  <!-- Семейное дерево -->
  <rect x="220" y="85" width="60" height="25" fill="none" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="250" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Family Tree</text>
  
  <!-- Указатели -->
  <path d="M150 145 L170 140" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
  <path d="M250 145 L270 140" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
  
  <!-- Определения -->
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Nuclear family</text>
  <text x="50" y="332" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Ядерная семья</text>
  
  <text x="350" y="320" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Extended family</text>
  <text x="350" y="332" font-family="Arial, sans-serif" font-size="9" fill="#bdc3c7">Расширенная семья</text>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Дополнительные иконки -->
  <g transform="translate(100, 250)">
    <rect x="-5" y="-5" width="10" height="10" fill="#3498db" opacity="0.2"/>
    <circle cx="0" cy="0" r="2" fill="#3498db"/>
  </g>
  
  <g transform="translate(200, 250)">
    <rect x="-5" y="-5" width="10" height="10" fill="#e74c3c" opacity="0.2"/>
    <circle cx="0" cy="0" r="2" fill="#e74c3c"/>
  </g>
  
  <!-- Фоновые элементы -->
  <rect x="0" y="0" width="500" height="10" fill="#34495e" opacity="0.1"/>
  <rect x="0" y="340" width="500" height="10" fill="#34495e" opacity="0.1"/>
</svg>