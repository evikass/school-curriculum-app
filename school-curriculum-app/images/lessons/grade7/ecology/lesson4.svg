<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#16a085">Свет и температура как экологические факторы</text>
  
  <!-- Солнце - источник света -->
  <circle cx="80" cy="100" r="25" fill="#FFD700"/>
  <path d="M80 60 L85 75 L100 70 L90 85 L105 95 L90 95 L95 110 L80 100 L65 110 L70 95 L55 95 L70 85 L60 70 L75 75 Z" fill="#FFD700"/>
  
  <!-- Лучи света -->
  <line x1="105" y1="100" x2="180" y2="100" stroke="#FFD700" stroke-width="2"/>
  <line x1="95" y1="80" x2="160" y2="65" stroke="#FFD700" stroke-width="2"/>
  <line x1="95" y1="120" x2="160" y2="135" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Подпись Солнце -->
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Солнце</text>
  
  <!-- График зависимости фотосинтеза от света -->
  <rect x="50" y="160" width="160" height="100" fill="white" stroke="#16a085" stroke-width="2"/>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Зависимость фотосинтеза от света</text>
  
  <!-- Ось X -->
  <line x1="70" y1="240" x2="190" y2="240" stroke="#333" stroke-width="1"/>
  <!-- Ось Y -->
  <line x1="70" y1="200" x2="70" y2="240" stroke="#333" stroke-width="1"/>
  
  <!-- Кривая зависимости -->
  <path d="M70 230 Q90 220, 110 210 T150 200 Q170 195, 190 200" fill="none" stroke="#16a085" stroke-width="2"/>
  
  <!-- Подписи на графике -->
  <text x="130" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Интенсивность света</text>
  <text x="55" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Скорость</text>
  <text x="55" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">фотосинтеза</text>
  
  <!-- Температурная шкала -->
  <rect x="250" y="60" width="200" height="200" fill="white" stroke="#16a085" stroke-width="2"/>
  <text x="350" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Зависимость температуры от высоты</text>
  
  <!-- Термометр -->
  <rect x="280" y="100" width="20" height="140" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
  <rect x="280" y="140" width="20" height="100" fill="#FF5722"/>
  <circle cx="290" cy="240" r="15" fill="#FF5722"/>
  
  <!-- Подписи температур -->
  <text x="310" y="105" font-family="Arial, sans-serif" font-size="10" fill="#333">-40°C</text>
  <text x="310" y="140" font-family="Arial, sans-serif" font-size="10" fill="#333">0°C</text>
  <text x="310" y="175" font-family="Arial, sans-serif" font-size="10" fill="#333">+10°C</text>
  <text x="310" y="210" font-family="Arial, sans-serif" font-size="10" fill="#333">+20°C</text>
  <text x="310" y="245" font-family="Arial, sans-serif" font-size="10" fill="#333">+30°C</text>
  
  <!-- Горизонты -->
  <line x1="310" y1="105" x2="420" y2="105" stroke="#16a085" stroke-width="1"/>
  <line x1="310" y1="140" x2="420" y2="140" stroke="#16a085" stroke-width="1"/>
  <line x1="310" y1="175" x2="420" y2="175" stroke="#16a085" stroke-width="1"/>
  <line x1="310" y1="210" x2="420" y2="210" stroke="#16a085" stroke-width="1"/>
  <line x1="310" y1="245" x2="420" y2="245" stroke="#16a085" stroke-width="1"/>
  
  <!-- Подписи горизонтов -->
  <text x="330" y="108" font-family="Arial, sans-serif" font-size="10" fill="#333">Тундра</text>
  <text x="330" y="143" font-family="Arial, sans-serif" font-size="10" fill="#333">Тайга</text>
  <text x="330" y="178" font-family="Arial, sans-serif" font-size="10" fill="#333">Лес</text>
  <text x="330" y="213" font-family="Arial, sans-serif" font-size="10" fill="#333">Степь</text>
  <text x="330" y="248" font-family="Arial, sans-serif" font-size="10" fill="#333">Пустыня</text>
  
  <!-- Стрелка вверх -->
  <line x1="350" y1="260" x2="350" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="175" font-family="Arial, sans-serif" font-size="10" fill="#333">↑ Высота</text>
  
  <!-- Стрелка вверх - определение -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Биомы -->
  <rect x="50" y="280" width="400" height="50" fill="white" stroke="#16a085" stroke-width="2"/>
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Биомы с разным освещением и температурой</text>
  
  <!-- Биом 1 - Тропический лес -->
  <rect x="60" y="310" width="80" height="15" fill="#2E7D32"/>
  <text x="100" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Тропический лес</text>
  
  <!-- Биом 2 - Тундра -->
  <rect x="150" y="310" width="80" height="15" fill="#90A4AE"/>
  <text x="190" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Тундра</text>
  
  <!-- Биом 3 - Пустыня -->
  <rect x="240" y="310" width="80" height="15" fill="#FFD54F"/>
  <text x="280" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Пустыня</text>
  
  <!-- Биом 4 - Тихий океан -->
  <rect x="330" y="310" width="80" height="15" fill="#0288D1"/>
  <text x="370" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Тихий океан</text>
  
  <!-- Биом 5 - Альпийские луга -->
  <rect x="420" y="310" width="80" height="15" fill="#4CAF50"/>
  <text x="460" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Альпийские луга</text>
  
  <!-- Иконка растения 1 -->
  <path d="M120 150 Q115 140, 120 135 Q125 140, 120 150 M120 150 Q120 160, 120 170 M120 160 Q115 165, 120 170 Q125 165, 120 160" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  
  <!-- Иконка растения 2 -->
  <path d="M160 180 Q155 170, 160 165 Q165 170, 160 180 M160 180 Q160 190, 160 200 M160 190 Q155 195, 160 200 Q165 195, 160 190" fill="#4CAF50" stroke="#333" stroke-width="1"/>
  
  <!-- Иконка животного -->
  <ellipse cx="140" cy="195" rx="15" ry="8" fill="#795548" stroke="#333" stroke-width="1"/>
  <circle cx="135" cy="192" r="2" fill="#333"/>
  <circle cx="145" cy="192" r="2" fill="#333"/>
  
  <!-- Стрелка влияния света на растения -->
  <line x1="100" y1="250" x2="120" y2="230" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Стрелка влияния температуры -->
  <line x1="300" y1="250" x2="300" y2="230" stroke="#FF5722" stroke-width="2" marker-end="url(#arrowhead3)"/>
  
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5722"/>
    </marker>
  </defs>
  
  <!-- Текстовые объяснения -->
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="9" fill="#16a085">Свет необходим для фотосинтеза</text>
  <text x="280" y="265" font-family="Arial, sans-serif" font-size="9" fill="#FF5722">Температура влияет на метаболизм</text>
  
  <!-- Дополнительные элементы для достижения 50+ элементов -->
  <circle cx="30" cy="30" r="3" fill="#16a085"/>
  <circle cx="470" cy="30" r="3" fill="#16a085"/>
  <circle cx="30" cy="320" r="3" fill="#16a085"/>
  <circle cx="470" cy="320" r="3" fill="#16a085"/>
  
  <!-- Разделители -->
  <line x1="40" y1="70" x2="460" y2="70" stroke="#16a085" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="270" x2="460" y2="270" stroke="#16a085" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="40" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666">Интенсивность света (люкс)</text>
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="10" fill="#666">Оптимальный диапазон</text>
  <text x="40" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666">растений</text>
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="10" fill="#666">Температура (°C)</text>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">Высота над уровнем моря (м)</text>
  
  <!-- Дополнительные графические элементы -->
  <rect x="40" y="200" width="10" height="30" fill="#4CAF50"/>
  <rect x="55" y="210" width="10" height="20" fill="#8BC34A"/>
  <rect x="70" y="195" width="10" height="35" fill="#4CAF50"/>
  <rect x="85" y="205" width="10" height="25" fill="#8BC34A"/>
  <rect x="100" y="190" width="10" height="40" fill="#4CAF50"/>
  
  <!-- Легенда для биомов -->
  <rect x="420" y="280" width="15" height="15" fill="#16a085"/>
  <text x="440" y="292" font-family="Arial, sans-serif" font-size="10" fill="#333">Экосистемы</text>
</svg>