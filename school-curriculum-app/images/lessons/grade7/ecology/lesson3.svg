<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="40" fill="#16a085" rx="5"/>
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">Классификация экологических факторов</text>
  
  <!-- Основной контейнер для схемы -->
  <rect x="50" y="100" width="400" height="220" fill="white" stroke="#16a085" stroke-width="2" rx="10"/>
  
  <!-- Центральное слово "Экологические факторы" -->
  <circle cx="250" cy="210" r="40" fill="#16a085"/>
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Экологические</text>
  <text x="250" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">факторы</text>
  
  <!-- Линии от центра -->
  <line x1="210" y1="210" x2="100" y2="140" stroke="#16a085" stroke-width="2"/>
  <line x1="290" y1="210" x2="400" y2="140" stroke="#16a085" stroke-width="2"/>
  <line x1="250" y1="170" x2="250" y2="120" stroke="#16a085" stroke-width="2"/>
  
  <!-- Абиотические факторы -->
  <rect x="30" y="80" width="140" height="60" fill="#e8f8f5" stroke="#16a085" stroke-width="2" rx="5"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#16a085" font-weight="bold">Абиотические</text>
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">факторы</text>
  
  <!-- Иконки для абиотических факторов -->
  <circle cx="50" cy="160" r="15" fill="#d5f4e6"/>
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">☀️</text>
  <text x="50" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Свет</text>
  
  <circle cx="100" cy="160" r="15" fill="#d5f4e6"/>
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🌡️</text>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Температура</text>
  
  <circle cx="150" cy="160" r="15" fill="#d5f4e6"/>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">💧</text>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Вода</text>
  
  <line x1="30" y1="140" x2="100" y2="160" stroke="#16a085" stroke-width="1"/>
  <line x1="170" y1="140" x2="150" y2="160" stroke="#16a085" stroke-width="1"/>
  
  <!-- Биотические факторы -->
  <rect x="330" y="80" width="140" height="60" fill="#e8f8f5" stroke="#16a085" stroke-width="2" rx="5"/>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#16a085" font-weight="bold">Биотические</text>
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">факторы</text>
  
  <!-- Иконки для биотических факторов -->
  <circle cx="350" cy="160" r="15" fill="#d5f4e6"/>
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🐄</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Животные</text>
  
  <circle cx="400" cy="160" r="15" fill="#d5f4e6"/>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🌿</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Растения</text>
  
  <circle cx="450" cy="160" r="15" fill="#d5f4e6"/>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🦠</text>
  <text x="450" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Микроорганизмы</text>
  
  <line x1="330" y1="140" x2="350" y2="160" stroke="#16a085" stroke-width="1"/>
  <line x1="470" y1="140" x2="450" y2="160" stroke="#16a085" stroke-width="1"/>
  
  <!-- Антропогенные факторы -->
  <rect x="180" y="270" width="140" height="60" fill="#e8f8f5" stroke="#16a085" stroke-width="2" rx="5"/>
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#16a085" font-weight="bold">Антропогенные</text>
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">факторы</text>
  
  <!-- Иконки для антропогенных факторов -->
  <circle cx="200" cy="250" r="15" fill="#d5f4e6"/>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🏭</text>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Загрязнение</text>
  
  <circle cx="250" cy="250" r="15" fill="#d5f4e6"/>
  <text x="250" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🌳</text>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Вырубка</text>
  
  <circle cx="300" cy="250" r="15" fill="#d5f4e6"/>
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">🏗️</text>
  <text x="300" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Урбанизация</text>
  
  <line x1="210" y1="250" x2="250" y2="250" stroke="#16a085" stroke-width="1"/>
  <line x1="290" y1="250" x2="250" y2="250" stroke="#16a085" stroke-width="1"/>
  
  <!-- Дополнительные элементы -->
  <rect x="60" y="310" width="80" height="25" fill="#d5f4e6" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="100" y="327" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Климат</text>
  
  <rect x="160" y="310" width="80" height="25" fill="#d5f4e6" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="200" y="327" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Почва</text>
  
  <rect x="260" y="310" width="80" height="25" fill="#d5f4e6" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="300" y="327" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Рельеф</text>
  
  <rect x="360" y="310" width="80" height="25" fill="#d5f4e6" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="400" y="327" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Атмосфера</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="5" fill="#16a085"/>
  <circle cx="470" cy="30" r="5" fill="#16a085"/>
  <circle cx="30" cy="320" r="5" fill="#16a085"/>
  <circle cx="470" cy="320" r="5" fill="#16a085"/>
  
  <!-- Стрелки и связи -->
  <path d="M 90 200 L 90 220 L 120 220" stroke="#16a085" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 200 L 310 220 L 280 220" stroke="#16a085" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 250 L 250 270" stroke="#16a085" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Определения -->
  <text x="30" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Неорганические</text>
  <text x="30" y="205" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">условия среды</text>
  
  <text x="370" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Взаимодействие</text>
  <text x="370" y="205" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">организмов</text>
  
  <text x="255" y="265" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">Деятельность человека</text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085"/>
    </marker>
  </defs>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Влияние неживой природы</text>
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Взаимодействие живых организмов</text>
  <text x="180" y="300" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Влияние человеческой деятельности</text>
  
  <!-- Разделители -->
  <line x1="50" y1="240" x2="150" y2="240" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="350" y1="240" x2="450" y2="240" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Дополнительные иконки -->
  <circle cx="250" cy="140" r="20" fill="#d5f4e6" stroke="#16a085" stroke-width="1"/>
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#16a085">⚖️</text>
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Экосистема</text>
</svg>