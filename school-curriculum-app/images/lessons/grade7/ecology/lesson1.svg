<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="#16a085"/>
  <text x="250" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">Тема: Предмет экологии</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="100" width="460" height="230" fill="white" stroke="#16a085" stroke-width="2" rx="10"/>
  
  <!-- Дерево как символ экологии -->
  <g id="tree">
    <rect x="40" y="220" width="20" height="70" fill="#8b4513"/>
    <circle cx="50" cy="200" r="35" fill="#2ecc71"/>
    <circle cx="35" cy="210" r="25" fill="#27ae60"/>
    <circle cx="65" cy="205" r="30" fill="#27ae60"/>
    <text x="50" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Природа</text>
  </g>
  
  <!-- Человек как объект экологии -->
  <g id="human">
    <circle cx="150" cy="180" r="15" fill="#fdbcb4"/>
    <rect x="140" y="195" width="20" height="40" fill="#3498db"/>
    <rect x="135" y="200" width="10" height="30" fill="#3498db"/>
    <rect x="155" y="200" width="10" height="30" fill="#3498db"/>
    <rect x="145" y="235" width="10" height="30" fill="#2c3e50"/>
    <rect x="140" y="235" width="10" height="30" fill="#2c3e50"/>
    <text x="150" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Человек</text>
  </g>
  
  <!-- Животные как объект экологии -->
  <g id="animals">
    <ellipse cx="250" cy="210" rx="30" ry="20" fill="#e74c3c"/>
    <circle cx="235" cy="195" r="12" fill="#e74c3c"/>
    <circle cx="265" cy="195" r="12" fill="#e74c3c"/>
    <circle cx="240" cy="195" r="5" fill="white"/>
    <circle cx="260" cy="195" r="5" fill="white"/>
    <circle cx="240" cy="195" r="2" fill="black"/>
    <circle cx="260" cy="195" r="2" fill="black"/>
    <text x="250" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Животные</text>
  </g>
  
  <!-- Микроорганизмы как объект экологии -->
  <g id="microbes">
    <circle cx="340" cy="200" r="8" fill="#9b59b6"/>
    <circle cx="355" cy="195" r="10" fill="#9b59b6"/>
    <circle cx="350" cy="210" r="7" fill="#9b59b6"/>
    <circle cx="335" cy="205" r="9" fill="#9b59b6"/>
    <text x="350" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Микроорганизмы</text>
  </g>
  
  <!-- Среда обитания -->
  <g id="habitat">
    <path d="M 420 220 Q 430 200, 440 220 Q 450 240, 460 220" stroke="#16a085" stroke-width="3" fill="none"/>
    <rect x="430" y="230" width="20" height="40" fill="#3498db" opacity="0.5"/>
    <rect x="440" y="240" width="20" height="30" fill="#16a085" opacity="0.5"/>
    <text x="450" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Среда</text>
  </g>
  
  <!-- Схема взаимосвязей -->
  <line x1="50" y1="200" x2="150" y2="200" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="150" y1="200" x2="250" y2="200" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="200" x2="350" y2="200" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="350" y1="200" x2="450" y2="220" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Стрелки -->
  <polygon points="145,195 155,200 145,205" fill="#16a085"/>
  <polygon points="245,195 255,200 245,205" fill="#16a085"/>
  <polygon points="345,195 355,200 345,205" fill="#16a085"/>
  <polygon points="440,215 450,220 445,210" fill="#16a085"/>
  
  <!-- Блок "Экология как наука" -->
  <rect x="30" y="115" width="140" height="50" fill="#16a085" rx="5"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Экология</text>
  
  <!-- Блок "Объект изучения" -->
  <rect x="190" y="115" width="140" height="50" fill="#3498db" rx="5"/>
  <text x="260" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Объект изучения</text>
  
  <!-- Блок "Методы исследования" -->
  <rect x="350" y="115" width="130" height="50" fill="#9b59b6" rx="5"/>
  <text x="415" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Методы</text>
  
  <!-- Методы исследования - иконки -->
  <circle cx="370" cy="195" r="8" fill="#f39c12"/>
  <text x="370" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">1</text>
  <text x="370" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Наблюдение</text>
  
  <circle cx="415" cy="195" r="8" fill="#f39c12"/>
  <text x="415" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">2</text>
  <text x="415" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Эксперимент</text>
  
  <circle cx="460" cy="195" r="8" fill="#f39c12"/>
  <text x="460" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">3</text>
  <text x="460" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Моделирование</text>
  
  <!-- Ключевые понятия -->
  <text x="30" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Биосфера</text>
  <text x="30" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Экосистема</text>
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Популяция</text>
  <text x="30" y="215" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Биоценоз</text>
  
  <!-- Структура экологии -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Автоэкология</text>
  <text x="200" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Динамика популяций</text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Биоценология</text>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Экофизиология</text>
  
  <!-- Вклад ученых -->
  <text x="350" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Г. Тейлор</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">В. Вернадский</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Э. Геккель</text>
  <text x="350" y="215" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">А. Тенсли</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="250" r="5" fill="#16a085"/>
  <text x="40" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Взаимодействие</text>
  
  <circle cx="130" cy="250" r="5" fill="#e74c3c"/>
  <text x="140" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Конкуренция</text>
  
  <circle cx="230" cy="250" r="5" fill="#f39c12"/>
  <text x="240" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Симбиоз</text>
  
  <circle cx="330" cy="250" r="5" fill="#9b59b6"/>
  <text x="340" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Притязание</text>
  
  <circle cx="430" cy="250" r="5" fill="#3498db"/>
  <text x="440" y="255" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Адаптация</text>
  
  <!-- Разделительная линия -->
  <line x1="30" y1="265" x2="470" y2="265" stroke="#16a085" stroke-width="1"/>
  
  <!-- Значение экологии -->
  <text x="30" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Значение экологии:</text>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Сохранение биоразнообразия</text>
  <text x="30" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Рациональное использование ресурсов</text>
  
  <text x="250" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Цель изучения:</text>
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Формирование экологического мышления</text>
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Понимание взаимосвязей в природе</text>
  
  <!-- Дополнительные графические элементы -->
  <rect x="30" y="120" width="440" height="100" fill="none" stroke="#ecf0f1" stroke-width="1" rx="5" stroke-dasharray="3,3"/>
  
  <!-- Легенда -->
  <rect x="30" y="330" width="440" height="15" fill="#ecf0f1" rx="5"/>
  <text x="250" y="341" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Экология - наука о взаимодействии организмов и их среды обитания</text>
</svg>