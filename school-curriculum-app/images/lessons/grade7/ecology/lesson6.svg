<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#16a085">ЭКОЛОГИЯ · 7 КЛАСС</text>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#333">Пищевые цепи и сети</text>
  
  <!-- Экосистема в центре -->
  <rect x="150" y="80" width="200" height="180" rx="10" fill="#e8f5e9" stroke="#16a085" stroke-width="2"/>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#16a085">Экосистема</text>
  
  <!-- Солнце -->
  <circle cx="100" cy="60" r="15" fill="#ffd54f"/>
  <path d="M100 40 L100 35 M100 45 L100 40 M85 60 L80 60 M90 60 L85 60 M100 75 L100 80 M100 70 L100 75 M115 60 L120 60 M110 60 L115 60" stroke="#ffd54f" stroke-width="2"/>
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Солнце</text>
  
  <!-- Стрелка от солнца -->
  <path d="M115 60 L145 70" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Продюсеры (растения) -->
  <rect x="175" y="120" width="40" height="30" rx="5" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <text x="195" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Растения</text>
  <text x="195" y="160" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">Продюсеры</text>
  
  <rect x="285" y="120" width="40" height="30" rx="5" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <text x="305" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Трава</text>
  <text x="305" y="160" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">Продюсеры</text>
  
  <!-- Первичные потребители -->
  <ellipse cx="195" cy="200" rx="25" ry="20" fill="#ffb74d" stroke="#f57c00" stroke-width="1"/>
  <text x="195" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Заяц</text>
  <text x="195" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">1-й порядок</text>
  
  <ellipse cx="305" cy="200" rx="25" ry="20" fill="#ffb74d" stroke="#f57c00" stroke-width="1"/>
  <text x="305" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Утка</text>
  <text x="305" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">1-й порядок</text>
  
  <!-- Вторичные потребители -->
  <rect x="170" y="250" width="50" height="30" rx="5" fill="#ef5350" stroke="#d32f2f" stroke-width="1"/>
  <text x="195" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Лиса</text>
  <text x="195" y="290" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">2-й порядок</text>
  
  <rect x="280" y="250" width="50" height="30" rx="5" fill="#ef5350" stroke="#d32f2f" stroke-width="1"/>
  <text x="305" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Орёл</text>
  <text x="305" y="290" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">2-й порядок</text>
  
  <!-- Третичные потребитель -->
  <polygon points="250,270 230,310 270,310" fill="#7e57c2" stroke="#512da8" stroke-width="1"/>
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Волк</text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">3-й порядок</text>
  
  <!-- Разложители -->
  <ellipse cx="400" cy="150" rx="30" ry="20" fill="#9e9e9e" stroke="#616161" stroke-width="1"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Грибы</text>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#16a085">Разложители</text>
  
  <!-- Стрелки пищевых связей -->
  <path d="M195 170 L195 180" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M305 170 L305 180" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M195 220 L195 250" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M305 220 L305 250" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M195 250 L230 285" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M305 250 L270 285" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M170 265 L230 285" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M330 265 L270 285" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M220 250 L380 160" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M280 250 L380 160" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определения -->
  <rect x="20" y="280" width="100" height="60" rx="5" fill="#fff" stroke="#16a085" stroke-width="1"/>
  <text x="70" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#16a085">Пищевая цепь</text>
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">Последовательность</text>
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">организмов</text>
  
  <rect x="380" y="280" width="100" height="60" rx="5" fill="#fff" stroke="#16a085" stroke-width="1"/>
  <text x="430" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#16a085">Пищевая сеть</text>
  <text x="430" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">Множество</text>
  <text x="430" y="325" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">взаимосвязей</text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085"/>
    </marker>
  </defs>
  
  <!-- Иконки организмов -->
  <circle cx="175" cy="125" r="3" fill="#4caf50"/>
  <circle cx="185" cy="125" r="3" fill="#4caf50"/>
  <circle cx="295" cy="125" r="3" fill="#4caf50"/>
  <circle cx="305" cy="125" r="3" fill="#4caf50"/>
  
  <circle cx="190" cy="205" r="2" fill="#f57c00"/>
  <circle cx="200" cy="205" r="2" fill="#f57c00"/>
  <circle cx="300" cy="205" r="2" fill="#f57c00"/>
  <circle cx="310" cy="205" r="2" fill="#f57c00"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a085">Трофика</text>
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="9" fill="#333">Уровни питания</text>
  
  <text x="380" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a085">Энергия</text>
  <text x="380" y="115" font-family="Arial, sans-serif" font-size="9" fill="#333">поток</text>
  
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a085">Биомасса</text>
  <text x="50" y="215" font-family="Arial, sans-serif" font-size="9" fill="#333">Общая масса</text>
  <text x="50" y="230" font-family="Arial, sans-serif" font-size="9" fill="#333">организмов</text>
  
  <!-- Дополнительные элементы для увеличения размера -->
  <rect x="20" y="50" width="60" height="20" rx="10" fill="#16a085" opacity="0.3"/>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Природный баланс</text>
  
  <rect x="420" y="50" width="60" height="20" rx="10" fill="#16a085" opacity="0.3"/>
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Взаимодействие</text>
  
  <!-- Вспомогательные линии -->
  <line x1="50" y1="100" x2="50" y2="260" stroke="#16a085" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="100" x2="420" y2="260" stroke="#16a085" stroke-width="1" opacity="0.5"/>
  
  <!-- Дополнительные геометрические элементы -->
  <polygon points="20,140 40,140 30,160" fill="#16a085" opacity="0.2"/>
  <polygon points="460,140 440,140 450,160" fill="#16a085" opacity="0.2"/>
  
  <!-- Дополнительные текстовые элементы для достижения минимального количества -->
  <text x="130" y="120" font-family="Arial, sans-serif" font-size="8" fill="#666">Солнечная энергия</text>
  <text x="130" y="200" font-family="Arial, sans-serif" font-size="8" fill="#666">Фотосинтез</text>
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="8" fill="#666">Хищники</text>
  <text x="350" y="120" font-family="Arial, sans-serif" font-size="8" fill="#666">Аутотрофы</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="8" fill="#666">Гетеротрофы</text>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="8" fill="#666">Конкуренты</text>
</svg>