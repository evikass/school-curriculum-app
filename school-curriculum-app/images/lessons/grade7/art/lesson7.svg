<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">ИЗО · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e67e22">Импрессионизм и постимпрессионизм</text>
  
  <!-- Иконка кисти -->
  <path d="M60 70 L65 90 L70 88 L75 70 Z" fill="#e67e22" />
  <rect x="62" y="68" width="11" height="8" fill="#d35400" />
  
  <!-- Иконка палитры -->
  <ellipse cx="90" cy="78" rx="15" ry="10" fill="#e67e22" stroke="#d35400" stroke-width="1" />
  <circle cx="85" cy="78" r="2" fill="#fff" />
  <circle cx="90" cy="78" r="2" fill="#fff" />
  <circle cx="95" cy="78" r="2" fill="#fff" />
  
  <!-- Основная диаграмма -->
  <rect x="100" y="90" width="300" height="180" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2" opacity="0.9" />
  
  <!-- Заголовок диаграммы -->
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Эволюция импрессионизма</text>
  
  <!-- Временная шкала -->
  <line x1="120" y1="130" x2="380" y2="130" stroke="#e67e22" stroke-width="2" />
  
  <!-- Маркеры времени -->
  <circle cx="150" cy="130" r="5" fill="#e67e22" />
  <circle cx="250" cy="130" r="5" fill="#e67e22" />
  <circle cx="350" cy="130" r="5" fill="#e67e22" />
  
  <!-- Подписи времени -->
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">1870-е</text>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">1880-е</text>
  <text x="350" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">1890-е</text>
  
  <!-- Разделы диаграммы -->
  <rect x="120" y="145" width="110" height="100" fill="#fff3e0" stroke="#e67e22" stroke-width="1" rx="5" />
  <rect x="240" y="145" width="110" height="100" fill="#fce4ec" stroke="#e67e22" stroke-width="1" rx="5" />
  
  <!-- Разделительная линия -->
  <line x1="230" y1="145" x2="230" y2="245" stroke="#e67e22" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Заголовки разделов -->
  <text x="175" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Импрессионизм</text>
  <text x="295" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Постимпрессионизм</text>
  
  <!-- Ключевые черты импрессионизма -->
  <text x="125" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Свет и цвет</text>
  <text x="125" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Мгновенные впечатления</text>
  <text x="125" y="215" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Работают на пленэре</text>
  <text x="125" y="230" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Размытые формы</text>
  
  <!-- Ключевые черты постимпрессионизма -->
  <text x="245" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Структура и форма</text>
  <text x="245" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Символизм</text>
  <text x="245" y="215" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Эмоциональность</text>
  <text x="245" y="230" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Геометричность</text>
  
  <!-- Представители импрессионизма -->
  <text x="175" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e67e22">Представители</text>
  <circle cx="140" cy="275" r="8" fill="#e67e22" />
  <text x="140" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Моне</text>
  <circle cx="175" cy="275" r="8" fill="#e67e22" />
  <text x="175" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Ренуар</text>
  <circle cx="210" cy="275" r="8" fill="#e67e22" />
  <text x="210" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Дега</text>
  
  <!-- Представители постимпрессионизма -->
  <text x="295" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e67e22">Представители</text>
  <circle cx="260" cy="275" r="8" fill="#e67e22" />
  <text x="260" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Гоген</text>
  <circle cx="295" cy="275" r="8" fill="#e67e22" />
  <text x="295" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Сезанн</text>
  <circle cx="330" cy="275" r="8" fill="#e67e22" />
  <text x="330" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#fff">Ван Гог</text>
  
  <!-- Иконка художественной палитры -->
  <g transform="translate(50, 290)">
    <path d="M0 0 C-10 0, -10 10, 0 10 C10 10, 10 0, 0 0" fill="#e67e22" stroke="#d35400" stroke-width="1" />
    <circle cx="-5" cy="5" r="2" fill="#fff" />
    <circle cx="0" cy="5" r="2" fill="#fff" />
    <circle cx="5" cy="5" r="2" fill="#fff" />
  </g>
  
  <!-- Иконка кисточки -->
  <g transform="translate(420, 290)">
    <rect x="0" y="0" width="4" height="15" fill="#d35400" />
    <path d="M0 0 C-5 -5, 5 -5, 0 0" fill="#e67e22" />
  </g>
  
  <!-- Дополнительные элементы -->
  <line x1="420" y1="80" x2="420" y2="120" stroke="#e67e22" stroke-width="2" />
  <circle cx="420" cy="125" r="3" fill="#e67e22" />
  
  <!-- Иконка холста -->
  <rect x="430" y="90" width="20" height="25" fill="#fff" stroke="#e67e22" stroke-width="1" />
  <line x1="435" y1="95" x2="445" y2="95" stroke="#e67e22" stroke-width="0.5" />
  <line x1="435" y1="100" x2="445" y2="100" stroke="#e67e22" stroke-width="0.5" />
  <line x1="435" y1="105" x2="445" y2="105" stroke="#e67e22" stroke-width="0.5" />
  
  <!-- Стрелка эволюции -->
  <path d="M230 195 L250 195 L245 190 M250 195 L245 200" stroke="#e67e22" stroke-width="2" fill="none" />
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="200" r="3" fill="#e67e22" opacity="0.5" />
  <circle cx="60" cy="210" r="2" fill="#e67e22" opacity="0.5" />
  <circle cx="70" cy="205" r="2.5" fill="#e67e22" opacity="0.5" />
  
  <circle cx="450" cy="200" r="3" fill="#e67e22" opacity="0.5" />
  <circle cx="440" cy="210" r="2" fill="#e67e22" opacity="0.5" />
  <circle cx="430" cy="205" r="2.5" fill="#e67e22" opacity="0.5" />
  
  <!-- Подпись о современном искусстве -->
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">Современное искусство продолжает традиции импрессионизма и постимпрессионизма</text>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="10" fill="#666">Техника:</text>
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="9" fill="#888">Пуантилизм</text>
  <text x="50" y="178" font-family="Arial, sans-serif" font-size="9" fill="#888">Импасто</text>
  <text x="50" y="191" font-family="Arial, sans-serif" font-size="9" fill="#888">Светотень</text>
  
  <!-- Иконка краски -->
  <circle cx="380" cy="295" r="10" fill="#e67e22" />
  <circle cx="380" cy="295" r="6" fill="#d35400" />
  <circle cx="380" cy="295" r="3" fill="#fff" />
  
  <!-- Дополнительные линии для дизайна -->
  <line x1="100" y1="320" x2="400" y2="320" stroke="#e67e22" stroke-width="0.5" opacity="0.5" />
  <line x1="100" y1="330" x2="400" y2="330" stroke="#e67e22" stroke-width="0.5" opacity="0.5" />
  
  <!-- Небольшие декоративные элементы -->
  <rect x="120" y="325" width="15" height="3" fill="#e67e22" opacity="0.7" />
  <rect x="140" y="325" width="10" height="3" fill="#e67e22" opacity="0.5" />
  <rect x="155" y="325" width="20" height="3" fill="#e67e22" opacity="0.7" />
  
  <rect x="315" y="325" width="15" height="3" fill="#e67e22" opacity="0.7" />
  <rect x="335" y="325" width="10" height="3" fill="#e67e22" opacity="0.5" />
  <rect x="350" y="325" width="20" height="3" fill="#e67e22" opacity="0.7" />
</svg>