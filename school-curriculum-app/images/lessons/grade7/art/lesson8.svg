<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Заголовок ИЗО · 7 КЛАСС -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ИЗО · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="40" width="300" height="30" rx="15" fill="url(#accentGradient)" />
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Авангард и современное искусство</text>
  
  <!-- Центральная диаграмма - эволюция искусства -->
  <circle cx="250" cy="150" r="40" fill="#e67e22" opacity="0.8" />
  <text x="250" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">ИСКУССТВО</text>
  
  <!-- Ветви эволюции -->
  <line x1="210" y1="130" x2="150" y2="100" stroke="#e67e22" stroke-width="2" />
  <line x1="290" y1="130" x2="350" y2="100" stroke="#e67e22" stroke-width="2" />
  <line x1="210" y1="170" x2="150" y2="200" stroke="#e67e22" stroke-width="2" />
  <line x1="290" y1="170" x2="350" y2="200" stroke="#e67e22" stroke-width="2" />
  
  <!-- Направления искусства -->
  <rect x="80" y="70" width="140" height="60" rx="5" fill="white" stroke="#e67e22" stroke-width="2" />
  <text x="150" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">КЛАССИЧЕСКОЕ</text>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">ИСКУССТВО</text>
  
  <rect x="280" y="70" width="140" height="60" rx="5" fill="white" stroke="#e67e22" stroke-width="2" />
  <text x="350" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">АВАНГАРД</text>
  <text x="350" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">1900-1930</text>
  
  <rect x="80" y="170" width="140" height="60" rx="5" fill="white" stroke="#e67e22" stroke-width="2" />
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">СОВРЕМЕННОЕ</text>
  <text x="150" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">ИСКУССТВО</text>
  
  <rect x="280" y="170" width="140" height="60" rx="5" fill="white" stroke="#e67e22" stroke-width="2" />
  <text x="350" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">ПОСТМОДЕРНИЗМ</text>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">1960-наши дни</text>
  
  <!-- Ключевые направления современного искусства -->
  <line x1="50" y1="260" x2="450" y2="260" stroke="#e67e22" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Поп-арт -->
  <circle cx="100" cy="290" r="25" fill="#e67e22" opacity="0.6" />
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">ПОП-АРТ</text>
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">1960-е</text>
  
  <!-- Концептуальное искусство -->
  <rect x="170" y="275" width="60" height="30" rx="5" fill="#e67e22" opacity="0.6" />
  <text x="200" y="293" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="white">КОНЦЕПТ</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">1960-е</text>
  
  <!-- Перформанс -->
  <path d="M270 290 L280 280 L290 290 L280 300 Z" fill="#e67e22" opacity="0.6" />
  <text x="280" y="295" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">ПЕРФОРМ</text>
  <text x="280" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">1970-е</text>
  
  <!-- Инсталляция -->
  <rect x="330" y="280" width="30" height="20" fill="#e67e22" opacity="0.6" />
  <rect x="340" y="270" width="10" height="30" fill="#e67e22" opacity="0.6" />
  <text x="345" y="295" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">ИНСТ</text>
  <text x="345" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">1980-е</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="50" cy="50" r="3" fill="#e67e22" />
  <circle cx="450" cy="50" r="3" fill="#e67e22" />
  <circle cx="50" cy="300" r="3" fill="#e67e22" />
  <circle cx="450" cy="300" r="3" fill="#e67e22" />
  
  <!-- Стрелки эволюции -->
  <path d="M220 150 L180 120" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M280 150 L320 120" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M220 150 L180 180" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M280 150 L320 180" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Определения -->
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="8" fill="#555">Традиции</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="8" fill="#555">и каноны</text>
  
  <text x="360" y="100" font-family="Arial, sans-serif" font-size="8" fill="#555">Новаторство</text>
  <text x="360" y="112" font-family="Arial, sans-serif" font-size="8" fill="#555">и эксперименты</text>
  
  <text x="70" y="200" font-family="Arial, sans-serif" font-size="8" fill="#555">Отказ от</text>
  <text x="70" y="212" font-family="Arial, sans-serif" font-size="8" fill="#555">традиций</text>
  
  <text x="360" y="200" font-family="Arial, sans-serif" font-size="8" fill="#555">Ирония</text>
  <text x="360" y="212" font-family="Arial, sans-serif" font-size="8" fill="#555">и цитирование</text>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22" />
    </marker>
  </defs>
  
  <!-- Дополнительные элементы схемы -->
  <line x1="50" y1="150" x2="90" y2="150" stroke="#e67e22" stroke-width="1" />
  <line x1="410" y1="150" x2="450" y2="150" stroke="#e67e22" stroke-width="1" />
  
  <!-- Ключевые характеристики -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50" font-style="italic">Ключевые характеристики современного искусства: инновации, многообразие, глобализация</text>
</svg>