<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">ФИЗИЧЕСКАЯ КУЛЬТУРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Опорный прыжок и лазание</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="55" x2="450" y2="55" stroke="#3498db" stroke-width="2"/>
  
  <!-- Секция Опорный прыжок -->
  <g id="jump-section">
    <!-- Заголовок секции -->
    <rect x="50" y="70" width="180" height="25" rx="5" fill="#3498db"/>
    <text x="140" y="87" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Опорный прыжок</text>
    
    <!-- Маты -->
    <rect x="60" y="100" width="160" height="80" fill="#e74c3c" opacity="0.3"/>
    <line x1="60" y1="120" x2="220" y2="120" stroke="#c0392b" stroke-width="1"/>
    <line x1="60" y1="140" x2="220" y2="140" stroke="#c0392b" stroke-width="1"/>
    <line x1="60" y1="160" x2="220" y2="160" stroke="#c0392b" stroke-width="1"/>
    
    <!-- Опора -->
    <rect x="240" y="130" width="10" height="40" fill="#34495e"/>
    <rect x="235" y="125" width="20" height="10" fill="#34495e"/>
    
    <!-- Фигура спортсмена (прыжок) -->
    <circle cx="190" cy="90" r="8" fill="#3498db"/>
    <path d="M190 98 L185 110 L190 108 L195 110 Z" fill="#3498db"/>
    <path d="M190 98 L180 105 L182 108 L190 103" fill="#3498db"/>
    <path d="M190 98 L200 105 L198 108 L190 103" fill="#3498db"/>
    <path d="M190 108 L188 125 L190 123 L192 125 Z" fill="#3498db"/>
    <path d="M190 123 L185 135 L188 133 L190 125" fill="#3498db"/>
    <path d="M190 123 L195 135 L192 133 L190 125" fill="#3498db"/>
    
    <!-- Стрелки траектории -->
    <path d="M200 90 Q210 95 205 110" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Подписи к прыжку -->
    <text x="140" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">1. Подготовка</text>
    <text x="140" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">2. Разбег</text>
    <text x="140" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">3. Отталкивание</text>
    <text x="140" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">4. Полет</text>
    <text x="140" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">5. Приземление</text>
  </g>
  
  <!-- Секция Лазание -->
  <g id="climb-section">
    <!-- Заголовок секции -->
    <rect x="270" y="70" width="180" height="25" rx="5" fill="#3498db"/>
    <text x="360" y="87" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Лазание</text>
    
    <!-- Скалодром -->
    <rect x="280" y="100" width="160" height="150" fill="#95a5a6" opacity="0.3"/>
    <line x1="290" y1="110" x2="290" y2="240" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="310" y1="120" x2="310" y2="230" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="330" y1="115" x2="330" y2="235" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="350" y1="125" x2="350" y2="225" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="370" y1="130" x2="370" y2="220" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="390" y1="140" x2="390" y2="210" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="410" y1="150" x2="410" y2="200" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="430" y1="160" x2="430" y2="190" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Фигура спортсмена (лазание) -->
    <circle cx="305" cy="135" r="8" fill="#3498db"/>
    <path d="M305 143 L300 155 L305 153 L310 155 Z" fill="#3498db"/>
    <path d="M305 143 L295 150 L297 153 L305 148" fill="#3498db"/>
    <path d="M305 143 L315 150 L313 153 L305 148" fill="#3498db"/>
    <path d="M305 153 L303 170 L305 168 L307 170 Z" fill="#3498db"/>
    <path d="M305 170 L300 185 L302 183 L305 170" fill="#3498db"/>
    <path d="M305 170 L310 185 L308 183 L305 170" fill="#3498db"/>
    
    <!-- Движение вверх -->
    <path d="M300 125 L310 115 L320 125" stroke="#2ecc71" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <!-- Подписи к лазанию -->
    <text x="360" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Техника лазания:</text>
    <text x="280" y="285" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Точка опоры</text>
    <text x="280" y="298" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Равновесие</text>
    <text x="280" y="311" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Координация</text>
    
    <text x="380" y="285" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Сила рук</text>
    <text x="380" y="298" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Гибкость</text>
    <text x="380" y="311" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Выносливость</text>
  </g>
  
  <!-- Стрелки маркеры -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
  </defs>
  
  <!-- Информационные блоки -->
  <rect x="50" y="200" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="80" y="219" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Скорость</text>
  
  <rect x="50" y="235" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="80" y="254" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Сила</text>
  
  <rect x="50" y="270" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="80" y="289" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Координация</text>
  
  <rect x="120" y="200" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="150" y="219" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Равновесие</text>
  
  <rect x="120" y="235" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="150" y="254" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Гибкость</text>
  
  <rect x="120" y="270" width="60" height="30" rx="3" fill="#3498db" opacity="0.2"/>
  <text x="150" y="289" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Выносливость</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="250" cy="140" r="3" fill="#3498db"/>
  <circle cx="250" cy="160" r="3" fill="#3498db"/>
  <circle cx="250" cy="180" r="3" fill="#3498db"/>
  <circle cx="250" cy="200" r="3" fill="#3498db"/>
  
  <line x1="245" y1="140" x2="255" y2="140" stroke="#3498db" stroke-width="1"/>
  <line x1="245" y1="160" x2="255" y2="160" stroke="#3498db" stroke-width="1"/>
  <line x1="245" y1="180" x2="255" y2="180" stroke="#3498db" stroke-width="1"/>
  <line x1="245" y1="200" x2="255" y2="200" stroke="#3498db" stroke-width="1"/>
  
  <text x="250" y="135" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">←</text>
  <text x="250" y="155" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">←</text>
  <text x="250" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">←</text>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">←</text>
  
  <!-- Иконка безопасности -->
  <g id="safety-icon" transform="translate(420, 280)">
    <circle cx="0" cy="0" r="15" fill="#f39c12" opacity="0.8"/>
    <path d="M-8 0 L-3 0 L-3 -8 L3 -8 L3 0 L8 0 L0 8 Z" fill="white"/>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Безопасность</text>
  </g>
  
  <!-- Правила выполнения -->
  <rect x="440" y="100" width="50" height="80" rx="3" fill="#ecf0f1" stroke="#3498db" stroke-width="1"/>
  <text x="465" y="115" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Правила:</text>
  <text x="445" y="130" font-family="Arial, sans-serif" font-size="7" fill="#34495e">1. Разминка</text>
  <text x="445" y="143" font-family="Arial, sans-serif" font-size="7" fill="#34495e">2. Техника</text>
  <text x="445" y="156" font-family="Arial, sans-serif" font-size="7" fill="#34495e">3. Контроль</text>
  <text x="445" y="169" font-family="Arial, sans-serif" font-size="7" fill="#34495e">4. Окончание</text>
</svg>