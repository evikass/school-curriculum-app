<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый элемент -->
  <rect width="500" height="350" fill="#f5f9fc"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ФИЗИЧЕСКАЯ КУЛЬТУРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#3498db">Повороты и торможение на лыжах</text>
  
  <!-- Разделительная линия -->
  <line x1="100" y1="70" x2="400" y2="70" stroke="#3498db" stroke-width="2"/>
  
  <!-- Схема лыжника -->
  <g transform="translate(250, 180)">
    <!-- Тело -->
    <ellipse cx="0" cy="-30" rx="15" ry="25" fill="#3498db" opacity="0.8"/>
    <!-- Голова -->
    <circle cx="0" cy="-55" r="12" fill="#f39c12"/>
    <!-- Ноги -->
    <rect x="-20" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
    <rect x="12" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
    <!-- Лыжи -->
    <rect x="-30" y="30" width="60" height="5" fill="#e74c3c" rx="2"/>
    <rect x="-25" y="40" width="50" height="5" fill="#e74c3c" rx="2"/>
    <!-- Палки -->
    <line x1="-15" y1="-40" x2="-25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="-40" x2="25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <!-- Лыжные ботинки -->
    <ellipse cx="-16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
    <ellipse cx="16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
  </g>
  
  <!-- Поворот направо -->
  <g transform="translate(100, 180)">
    <text x="0" y="-70" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2c3e50">Поворот направо</text>
    <!-- Лыжник в повороте -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="-30" rx="15" ry="25" fill="#3498db" opacity="0.8"/>
      <circle cx="0" cy="-55" r="12" fill="#f39c12"/>
      <rect x="-20" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
      <rect x="12" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
      <rect x="-30" y="30" width="60" height="5" fill="#e74c3c" rx="2"/>
      <rect x="-25" y="40" width="50" height="5" fill="#e74c3c" rx="2"/>
      <line x1="-15" y1="-40" x2="-25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="-40" x2="25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
      <ellipse cx="16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
    </g>
    <!-- Стрелка направления поворота -->
    <path d="M 0,50 L 15,35 L 10,35 L 10,25 L -10,25 L -10,35 L -15,35 Z" fill="#3498db"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Наклон влево</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">передней лыжи</text>
  </g>
  
  <!-- Поворот налево -->
  <g transform="translate(400, 180)">
    <text x="0" y="-70" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2c3e50">Поворот налево</text>
    <!-- Лыжник в повороте -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="-30" rx="15" ry="25" fill="#3498db" opacity="0.8"/>
      <circle cx="0" cy="-55" r="12" fill="#f39c12"/>
      <rect x="-20" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
      <rect x="12" y="-5" width="8" height="40" fill="#3498db" opacity="0.8"/>
      <rect x="-30" y="30" width="60" height="5" fill="#e74c3c" rx="2"/>
      <rect x="-25" y="40" width="50" height="5" fill="#e74c3c" rx="2"/>
      <line x1="-15" y1="-40" x2="-25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="-40" x2="25" y2="10" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
      <ellipse cx="16" cy="35" rx="8" ry="5" fill="#2c3e50"/>
    </g>
    <!-- Стрелка направления поворота -->
    <path d="M 0,50 L -15,35 L -10,35 L -10,25 L 10,25 L 10,35 L 15,35 Z" fill="#3498db"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Наклон вправо</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">передней лыжи</text>
  </g>
  
  <!-- Торможение "ёлочкой" -->
  <g transform="translate(250, 100)">
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2c3e50">Торможение "ёлочкой"</text>
    <!-- Лыжник в торможении -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#3498db" opacity="0.8"/>
    <circle cx="0" cy="-25" r="12" fill="#f39c12"/>
    <rect x="-20" y="25" width="8" height="40" fill="#3498db" opacity="0.8"/>
    <rect x="12" y="25" width="8" height="40" fill="#3498db" opacity="0.8"/>
    
    <!-- Лыжи в форме ёлочки -->
    <g transform="rotate(-20)">
      <rect x="-30" y="65" width="60" height="5" fill="#e74c3c" rx="2"/>
    </g>
    <g transform="rotate(20)">
      <rect x="-30" y="75" width="60" height="5" fill="#e74c3c" rx="2"/>
    </g>
    
    <line x1="-15" y1="-15" x2="-25" y2="35" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="-15" x2="25" y2="35" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-16" cy="80" rx="8" ry="5" fill="#2c3e50"/>
    <ellipse cx="16" cy="80" rx="8" ry="5" fill="#2c3e50"/>
    
    <!-- Стрелки, показывающие тормозной эффект -->
    <path d="M -40,70 L -50,65 M -40,70 L -50,75" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40,70 L 50,65 M 40,70 L 50,75" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Диаграмма торможения -->
  <g transform="translate(250, 280)">
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2c3e50">Техника торможения</text>
    <rect x="-100" y="-10" width="200" height="40" fill="#ecf0f1" rx="5"/>
    
    <!-- Стадии торможения -->
    <circle cx="-80" cy="10" r="8" fill="#3498db"/>
    <text x="-80" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Исходное</text>
    <text x="-80" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">положение</text>
    
    <line x1="-70" y1="10" x2="-50" y2="10" stroke="#3498db" stroke-width="2" stroke-dasharray="2,2"/>
    
    <circle cx="-40" cy="10" r="8" fill="#3498db"/>
    <text x="-40" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Ноги</text>
    <text x="-40" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">внутрь</text>
    
    <line x1="-30" y1="10" x2="-10" y2="10" stroke="#3498db" stroke-width="2" stroke-dasharray="2,2"/>
    
    <circle cx="0" cy="10" r="8" fill="#3498db"/>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Вес</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">на пятки</text>
    
    <line x1="10" y1="10" x2="30" y2="10" stroke="#3498db" stroke-width="2" stroke-dasharray="2,2"/>
    
    <circle cx="40" cy="10" r="8" fill="#e74c3c"/>
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Торможение</text>
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">завершено</text>
  </g>
  
  <!-- Указатели и подписи -->
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Повороты</text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Повороты</text>
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">Торможение</text>
  
  <!-- Дополнительные элементы для увеличения количества -->
  <rect x="50" y="90" width="20" height="20" fill="#3498db" opacity="0.3"/>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Угол</text>
  
  <rect x="430" y="90" width="20" height="20" fill="#3498db" opacity="0.3"/>
  <text x="440" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Угол</text>
  
  <line x1="40" y1="180" x2="60" y2="180" stroke="#3498db" stroke-width="2"/>
  <text x="35" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#34495e">Направление</text>
  
  <line x1="440" y1="180" x2="460" y2="180" stroke="#3498db" stroke-width="2"/>
  <text x="465" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#34495e">Направление</text>
  
  <circle cx="30" cy="200" r="5" fill="#e74c3c"/>
  <text x="30" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Тормоз</text>
  
  <circle cx="470" cy="200" r="5" fill="#e74c3c"/>
  <text x="470" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Тормоз</text>
  
  <rect x="230" y="120" width="40" height="3" fill="#3498db"/>
  <rect x="235" y="125" width="30" height="3" fill="#3498db"/>
  <rect x="240" y="130" width="20" height="3" fill="#3498db"/>
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Ёлочка</text>
  
  <!-- Декоративные элементы -->
  <path d="M 20,20 L 30,10 L 40,20" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 460,20 L 470,10 L 480,20" stroke="#3498db" stroke-width="2" fill="none"/>
  
  <!-- Инструкции -->
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Следи за балансом!</text>
  <text x="250" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Держи руки согнутыми</text>
  
  <!-- Указатели безопасности -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="30" height="30" fill="#f39c12" rx="15"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">!</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Безопасность</text>
  </g>
  
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="30" height="30" fill="#f39c12" rx="15"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">!</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Безопасность</text>
  </g>
</svg>