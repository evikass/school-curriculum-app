<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f7fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">ФИЗИЧЕСКАЯ КУЛЬТУРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3498db">Лыжные ходы</text>
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Лыжная подготовка</text>
  
  <!-- Лыжник 1 - Основной ход -->
  <g transform="translate(100, 100)">
    <!-- Тело -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#3498db"/>
    <!-- Голова -->
    <circle cx="0" cy="-25" r="10" fill="#f9c74f"/>
    <!-- Ноги -->
    <line x1="-10" y1="15" x2="-30" y2="40" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="15" x2="30" y2="35" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <!-- Руки -->
    <line x1="-15" y1="-10" x2="-40" y2="-5" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="-10" x2="40" y2="-10" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <!-- Лыжи -->
    <rect x="-40" y="35" width="80" height="5" fill="#e74c3c" rx="2"/>
    <!-- Палки -->
    <line x1="-40" y1="-5" x2="-45" y2="25" stroke="#34495e" stroke-width="2"/>
    <line x1="40" y1="-10" x2="45" y2="30" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Лыжник 2 - Ход без палок -->
  <g transform="translate(250, 100)">
    <!-- Тело -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#3498db"/>
    <!-- Голова -->
    <circle cx="0" cy="-25" r="10" fill="#f9c74f"/>
    <!-- Ноги -->
    <line x1="-10" y1="15" x2="-30" y2="40" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="15" x2="30" y2="35" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <!-- Руки назад -->
    <line x1="-15" y1="-10" x2="-30" y2="-15" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="-10" x2="30" y2="-15" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <!-- Лыжи -->
    <rect x="-40" y="35" width="80" height="5" fill="#e74c3c" rx="2"/>
  </g>
  
  <!-- Лыжник 3 - Ход с палками вперед -->
  <g transform="translate(400, 100)">
    <!-- Тело -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#3498db"/>
    <!-- Голова -->
    <circle cx="0" cy="-25" r="10" fill="#f9c74f"/>
    <!-- Ноги -->
    <line x1="-10" y1="15" x2="-30" y2="40" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="15" x2="30" y2="35" stroke="#34495e" stroke-width="3" stroke-linecap="round"/>
    <!-- Руки вперед -->
    <line x1="-15" y1="-10" x2="-35" y2="-5" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="-10" x2="35" y2="-5" stroke="#34495e" stroke-width="2" stroke-linecap="round"/>
    <!-- Лыжи -->
    <rect x="-40" y="35" width="80" height="5" fill="#e74c3c" rx="2"/>
    <!-- Палки вперед -->
    <line x1="-35" y1="-5" x2="-40" y2="25" stroke="#34495e" stroke-width="2"/>
    <line x1="35" y1="-5" x2="40" y2="25" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Подписи к лыжникам -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Основной ход</text>
  <text x="250" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Ход без палок</text>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Ход с палками вперед</text>
  
  <!-- Схема элементов лыжного хода -->
  <g transform="translate(50, 200)">
    <!-- Заголовок схемы -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Элементы лыжного хода:</text>
    
    <!-- Схема 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
      <circle cx="15" cy="20" r="8" fill="#3498db"/>
      <text x="15" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1</text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Наклон вперед</text>
    </g>
    
    <!-- Схема 2 -->
    <g transform="translate(100, 20)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
      <circle cx="15" cy="20" r="8" fill="#3498db"/>
      <text x="15" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Отталкивание палками</text>
    </g>
    
    <!-- Схема 3 -->
    <g transform="translate(200, 20)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
      <circle cx="15" cy="20" r="8" fill="#3498db"/>
      <text x="15" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Работа ног</text>
    </g>
    
    <!-- Схема 4 -->
    <g transform="translate(300, 20)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
      <circle cx="15" cy="20" r="8" fill="#3498db"/>
      <text x="15" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">4</text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Возврат в исходное</text>
    </g>
  </g>
  
  <!-- Таблица лыжных ходов -->
  <g transform="translate(50, 280)">
    <!-- Заголовок таблицы -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Основные лыжные ходы:</text>
    
    <!-- Таблица -->
    <rect x="0" y="10" width="400" height="50" fill="none" stroke="#3498db" stroke-width="1" rx="5"/>
    
    <!-- Строка 1 -->
    <line x1="100" y1="10" x2="100" y2="60" stroke="#3498db" stroke-width="1"/>
    <line x1="200" y1="10" x2="200" y2="60" stroke="#3498db" stroke-width="1"/>
    <line x1="300" y1="10" x2="300" y2="60" stroke="#3498db" stroke-width="1"/>
    
    <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Ход</text>
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Скорость</text>
    <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Энергозатраты</text>
    <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Применимость</text>
    
    <!-- Строка 2 -->
    <line x1="0" y1="35" x2="400" y2="35" stroke="#3498db" stroke-width="1"/>
    
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Беговой</text>
    <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Высокая</text>
    <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Средние</text>
    <text x="350" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Гладкий снег</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Снежинки -->
  <g transform="translate(420, 80)">
    <path d="M0,0 L0,-10 M0,0 L-8.7,-5 M0,0 L8.7,-5 M0,0 L-5,8.7 M0,0 L5,8.7" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#3498db"/>
  </g>
  
  <g transform="translate(450, 120)">
    <path d="M0,0 L0,-8 M0,0 L-6.9,-4 M0,0 L6.9,-4 M0,0 L-4,6.9 M0,0 L4,6.9" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#3498db"/>
  </g>
  
  <g transform="translate(70, 120)">
    <path d="M0,0 L0,-8 M0,0 L-6.9,-4 M0,0 L6.9,-4 M0,0 L-4,6.9 M0,0 L4,6.9" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#3498db"/>
  </g>
  
  <!-- Иконка лыжни -->
  <g transform="translate(420, 200)">
    <path d="M0,0 Q10,-10 20,0 Q30,10 40,0" fill="none" stroke="#3498db" stroke-width="2"/>
    <path d="M0,10 Q10,0 20,10 Q30,20 40,10" fill="none" stroke="#3498db" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#3498db" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="10" stroke="#3498db" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">След лыжни</text>
  </g>
  
  <!-- Иконка палки -->
  <g transform="translate(420, 260)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#3498db" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#3498db"/>
    <rect x="-3" y="25" width="6" height="5" fill="#3498db"/>
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Палка</text>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Правильная техника</text>
  <text x="50" y="350" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">© Физическая культура 7 класс</text>
</svg>