<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f7fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#2c3e50"/>
  <text x="250" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ФИЗИЧЕСКАЯ КУЛЬТУРА · 7 КЛАСС</text>
  
  <!-- Основной контейнер -->
  <rect x="10" y="60" width="480" height="280" fill="white" rx="10"/>
  
  <!-- Название урока -->
  <text x="250" y="85" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Развитие выносливости</text>
  <line x1="150" y1="95" x2="350" y2="95" stroke="#3498db" stroke-width="2"/>
  
  <!-- Подзаголовок -->
  <text x="250" y="115" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="14">Тема: Физические качества</text>
  
  <!-- Бегущий человечек - символ выносливости -->
  <g transform="translate(50, 150)">
    <circle cx="25" cy="10" r="8" fill="#3498db"/>
    <path d="M25,18 L25,35 L20,45 L15,48 M25,18 L30,25 L35,22 M25,35 L30,45 L35,48" stroke="#3498db" stroke-width="3" fill="none"/>
    <path d="M25,22 L20,28 L15,25 M25,22 L30,28 L35,25" stroke="#3498db" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Энергия - волна -->
  <path d="M100,150 Q120,130 140,150 T180,150 T220,150" stroke="#3498db" stroke-width="3" fill="none"/>
  <path d="M100,160 Q120,140 140,160 T180,160 T220,160" stroke="#3498db" stroke-width="3" fill="none"/>
  
  <!-- График развития выносливости -->
  <g transform="translate(250, 140)">
    <!-- Ось Y -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#34495e" stroke-width="2"/>
    <!-- Ось X -->
    <line x1="0" y1="100" x2="150" y2="100" stroke="#34495e" stroke-width="2"/>
    
    <!-- Подписи осей -->
    <text x="-35" y="5" fill="#34495e" font-family="Arial, sans-serif" font-size="10">Выносливость</text>
    <text x="130" y="115" fill="#34495e" font-family="Arial, sans-serif" font-size="10">Время</text>
    
    <!-- График -->
    <path d="M10,90 L30,85 L50,75 L70,65 L90,55 L110,45 L130,35" stroke="#3498db" stroke-width="3" fill="none"/>
    
    <!-- Точки на графике -->
    <circle cx="10" cy="90" r="4" fill="#3498db"/>
    <circle cx="30" cy="85" r="4" fill="#3498db"/>
    <circle cx="50" cy="75" r="4" fill="#3498db"/>
    <circle cx="70" cy="65" r="4" fill="#3498db"/>
    <circle cx="90" cy="55" r="4" fill="#3498db"/>
    <circle cx="110" cy="45" r="4" fill="#3498db"/>
    <circle cx="130" cy="35" r="4" fill="#3498db"/>
    
    <!-- Подписи точек -->
    <text x="5" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">1 мес</text>
    <text x="25" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">2 мес</text>
    <text x="45" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">3 мес</text>
    <text x="65" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">4 мес</text>
    <text x="85" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">5 мес</text>
    <text x="105" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">6 мес</text>
    <text x="125" y="105" fill="#34495e" font-family="Arial, sans-serif" font-size="8">7 мес</text>
  </g>
  
  <!-- Круговая диаграмма компонентов выносливости -->
  <g transform="translate(100, 270)">
    <!-- Основной круг -->
    <circle cx="0" cy="0" r="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Сектор - кардиореспираторная выносливость -->
    <path d="M0,0 L0,-40 A40,40 0 0,1 34.64,-20 z" fill="#3498db" opacity="0.8"/>
    
    <!-- Сектор - мышечная выносливость -->
    <path d="M0,0 L34.64,-20 A40,40 0 0,1 40,0 z" fill="#2ecc71" opacity="0.8"/>
    
    <!-- Сектор - силовая выносливость -->
    <path d="M0,0 L40,0 A40,40 0 0,1 28.28,28.28 z" fill="#e74c3c" opacity="0.8"/>
    
    <!-- Сектор - психическая выносливость -->
    <path d="M0,0 L28.28,28.28 A40,40 0 0,1 0,40 z" fill="#f39c12" opacity="0.8"/>
    
    <!-- Сектор - общая выносливость -->
    <path d="M0,0 L0,40 A40,40 0 0,1 -40,0 z" fill="#9b59b6" opacity="0.8"/>
    
    <!-- Подписи секторов -->
    <text x="15" y="-25" fill="white" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Кардио</text>
    <text x="35" y="-5" fill="white" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Мышц.</text>
    <text x="35" y="15" fill="white" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Силовая</text>
    <text x="15" y="30" fill="white" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Псих.</text>
    <text x="-20" y="20" fill="white" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Общая</text>
  </g>
  
  <!-- Текстовые блоки с информацией -->
  <g transform="translate(200, 250)">
    <!-- Блок 1 -->
    <rect x="0" y="0" width="120" height="60" fill="#ecf0f1" rx="5"/>
    <text x="60" y="15" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Признаки выносливости</text>
    <text x="5" y="30" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Высокий пульс</text>
    <text x="5" y="42" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Легкая усталость</text>
    <text x="5" y="54" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Стабильное дыхание</text>
  </g>
  
  <!-- Блок 2 -->
  <g transform="translate(330, 250)">
    <rect x="0" y="0" width="120" height="60" fill="#ecf0f1" rx="5"/>
    <text x="60" y="15" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Упражнения</text>
    <text x="5" y="30" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Бег на время</text>
    <text x="5" y="42" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Плавание</text>
    <text x="5" y="54" fill="#34495e" font-family="Arial, sans-serif" font-size="9">• Велоэргометр</text>
  </g>
  
  <!-- Индикаторы прогресса -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="8" height="30" fill="#e74c3c"/>
    <rect x="12" y="5" width="8" height="25" fill="#e67e22"/>
    <rect x="24" y="10" width="8" height="20" fill="#f39c12"/>
    <rect x="36" y="15" width="8" height="15" fill="#2ecc71"/>
    <text x="22" y="45" text-anchor="middle" fill="#34495e" font-family="Arial, sans-serif" font-size="8">Прогресс</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Сердце - символ кардио -->
  <path d="M420,160 C420,150 410,140 400,140 C390,140 380,150 380,160 C380,150 370,140 360,140 C350,140 340,150 340,160 C340,180 380,210 380,210 C380,210 420,180 420,160 Z" fill="#e74c3c" opacity="0.8"/>
  
  <!-- Иконка часов -->
  <g transform="translate(420, 190)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Текстовые метки -->
  <text x="50" y="200" fill="#3498db" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ЭНЕРГИЯ</text>
  <text x="260" y="100" fill="#3498db" font-family="Arial, sans-serif" font-size="9">Рост показателей</text>
  <text x="120" y="320" fill="#3498db" font-family="Arial, sans-serif" font-size="9">Компоненты</text>
  <text x="220" y="320" fill="#3498db" font-family="Arial, sans-serif" font-size="9">Параметры</text>
  <text x="350" y="320" fill="#3498db" font-family="Arial, sans-serif" font-size="9">Тренировки</text>
  <text x="400" y="250" fill="#34495e" font-family="Arial, sans-serif" font-size="8">Сердце</text>
  <text x="400" y="215" fill="#34495e" font-family="Arial, sans-serif" font-size="8">Время</text>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="80" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="440" cy="90" r="2" fill="#3498db" opacity="0.5"/>
  <circle cx="460" cy="90" r="2" fill="#3498db" opacity="0.5"/>
  
  <line x1="30" y1="70" x2="30" y2="330" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="470" y1="70" x2="470" y2="330" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
</svg>