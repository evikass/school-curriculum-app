<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">ТЕХНОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Свойства и пороки древесины</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Обработка древесины</text>
  
  <!-- Дерево слева -->
  <rect x="40" y="100" width="80" height="100" fill="#8b6914" stroke="#654321" stroke-width="2"/>
  <circle cx="80" cy="90" r="30" fill="#228b22" stroke="#006400" stroke-width="2"/>
  <circle cx="60" cy="100" r="25" fill="#32cd32" stroke="#228b22" stroke-width="2"/>
  <circle cx="100" cy="100" r="25" fill="#32cd32" stroke="#228b22" stroke-width="2"/>
  <circle cx="80" cy="70" r="20" fill="#3cb371" stroke="#228b22" stroke-width="2"/>
  <text x="80" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Исходное</text>
  <text x="80" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">сырье</text>
  
  <!-- Стрелка справа -->
  <line x1="140" y1="150" x2="190" y2="150" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Опилки -->
  <path d="M200 140 L210 145 L205 155 L195 150 Z" fill="#d2b48c" stroke="#8b7355" stroke-width="1"/>
  <path d="M210 150 L220 155 L215 165 L205 160 Z" fill="#d2b48c" stroke="#8b7355" stroke-width="1"/>
  <path d="M220 145 L230 150 L225 160 L215 155 Z" fill="#d2b48c" stroke="#8b7355" stroke-width="1"/>
  <path d="M215 165 L225 170 L220 180 L210 175 Z" fill="#d2b48c" stroke="#8b7355" stroke-width="1"/>
  <path d="M205 155 L215 160 L210 170 L200 165 Z" fill="#d2b48c" stroke="#8b7355" stroke-width="1"/>
  <text x="215" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Опилки</text>
  <text x="215" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">стружки</text>
  
  <!-- Стрелка вправо -->
  <line x1="250" y1="150" x2="300" y2="150" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Готовое изделие -->
  <rect x="310" y="110" width="60" height="80" fill="#deb887" stroke="#8b6914" stroke-width="2"/>
  <line x1="320" y1="120" x2="360" y2="120" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="130" x2="360" y2="130" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="140" x2="360" y2="140" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="150" x2="360" y2="150" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="160" x2="360" y2="160" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="170" x2="360" y2="170" stroke="#8b6914" stroke-width="1"/>
  <line x1="320" y1="180" x2="360" y2="180" stroke="#8b6914" stroke-width="1"/>
  <text x="340" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Готовое</text>
  <text x="340" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">изделие</text>
  
  <!-- Свойства древесины -->
  <rect x="40" y="250" width="140" height="80" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2" rx="5"/>
  <text x="110" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Свойства</text>
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Прочность</text>
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Декоративность</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Теплопроводность</text>
  
  <!-- Пороки древесины -->
  <rect x="200" y="250" width="140" height="80" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2" rx="5"/>
  <text x="270" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Пороки</text>
  <text x="210" y="290" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Трещины</text>
  <text x="210" y="305" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Гниль</text>
  <text x="210" y="320" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Сучки</text>
  
  <!-- Инструменты -->
  <rect x="360" y="250" width="140" height="80" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2" rx="5"/>
  <text x="430" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Инструменты</text>
  <text x="370" y="290" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Пила</text>
  <text x="370" y="305" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Рубанок</text>
  <text x="370" y="320" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Стамеска</text>
  
  <!-- Маркер для стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы для достижения 50+ -->
  <!-- Значки свойств -->
  <circle cx="40" cy="95" r="5" fill="#7f8c8d"/>
  <circle cx="60" cy="95" r="5" fill="#7f8c8d"/>
  <circle cx="80" cy="95" r="5" fill="#7f8c8d"/>
  <circle cx="100" cy="95" r="5" fill="#7f8c8d"/>
  <circle cx="120" cy="95" r="5" fill="#7f8c8d"/>
  
  <!-- Разделительные линии -->
  <line x1="20" y1="240" x2="480" y2="240" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Углы обработки -->
  <path d="M50 100 L60 100 L50 110 Z" fill="#7f8c8d" stroke="none"/>
  <path d="M90 100 L100 100 L100 110 Z" fill="#7f8c8d" stroke="none"/>
  <path d="M50 200 L60 200 L50 190 Z" fill="#7f8c8d" stroke="none"/>
  <path d="M90 200 L100 200 L100 190 Z" fill="#7f8c8d" stroke="none"/>
  
  <!-- Декоративные элементы -->
  <rect x="30" y="90" width="100" height="2" fill="#7f8c8d"/>
  <rect x="30" y="208" width="100" height="2" fill="#7f8c8d"/>
  <rect x="300" y="100" width="80" height="2" fill="#7f8c8d"/>
  <rect x="300" y="188" width="80" height="2" fill="#7f8c8d"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="20" y="265" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">1</text>
  <text x="180" y="265" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2</text>
  <text x="340" y="265" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">3</text>
  
  <!-- Мелкие детали -->
  <circle cx="215" y="130" r="2" fill="#7f8c8d"/>
  <circle cx="225" y="140" r="2" fill="#7f8c8d"/>
  <circle cx="205" y="150" r="2" fill="#7f8c8d"/>
  
  <!-- Вспомогательные линии -->
  <line x1="80" y1="90" x2="80" y2="70" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="340" y1="90" x2="340" y2="70" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Уточнения -->
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Обработка включает: распиловку, строгание, фрезерование</text>
  <text x="320" y="345" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Сушка древесины перед обработкой</text>
  
  <!-- Дополнительные графические элементы -->
  <rect x="440" y="270" width="15" height="30" fill="#d2b48c" stroke="#8b6914" stroke-width="1"/>
  <rect x="460" y="280" width="15" height="20" fill="#d2b48c" stroke="#8b6914" stroke-width="1"/>
  <rect x="420" y="280" width="15" height="20" fill="#d2b48c" stroke="#8b6914" stroke-width="1"/>
  
  <!-- Маркировка -->
  <path d="M190 145 L195 145 L195 140 L200 145 L195 150 L195 145 Z" fill="#7f8c8d"/>
  <path d="M300 145 L305 145 L305 140 L310 145 L305 150 L305 145 Z" fill="#7f8c8d"/>
</svg>