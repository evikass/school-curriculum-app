<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f9f9f9"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#7f8c8d"/>
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ТЕХНОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Блюда из овощей и салаты</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="95" x2="450" y2="95" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Категория салатов -->
  <rect x="30" y="120" width="210" height="200" rx="10" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
  <text x="130" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Салаты</text>
  
  <!-- Иконка салатной тарелки -->
  <ellipse cx="80" cy="180" rx="30" ry="8" fill="#7f8c8d" transform="rotate(-10 80 180)"/>
  <path d="M60,180 Q80,160 100,180" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <circle cx="65" cy="175" r="5" fill="#e74c3c"/>
  <circle cx="75" cy="170" r="5" fill="#3498db"/>
  <circle cx="85" cy="175" r="5" fill="#2ecc71"/>
  <circle cx="95" cy="170" r="5" fill="#f39c12"/>
  
  <!-- Типы салатов -->
  <text x="50" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Салатные смеси</text>
  <rect x="40" y="215" width="20" height="15" fill="#2ecc71"/>
  <rect x="65" y="215" width="20" height="15" fill="#3498db"/>
  <rect x="90" y="215" width="20" height="15" fill="#f39c12"/>
  <rect x="115" y="215" width="20" height="15" fill="#e74c3c"/>
  
  <text x="50" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Овощные салаты</text>
  <path d="M40,265 L60,265 L55,275 L45,275 Z" fill="#f39c12"/>
  <circle cx="50" cy="268" r="3" fill="#2c3e50"/>
  
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Фруктовые салаты</text>
  <circle cx="50" cy="305" r="8" fill="#e74c3c"/>
  <circle cx="65" cy="300" r="8" fill="#3498db"/>
  <circle cx="80" cy="305" r="8" fill="#2ecc71"/>
  
  <!-- Категория блюд из овощей -->
  <rect x="260" y="120" width="210" height="200" rx="10" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
  <text x="365" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Блюда из овощей</text>
  
  <!-- Иконка кастрюли -->
  <path d="M290,170 L320,170 L315,190 L295,190 Z" fill="#7f8c8d"/>
  <path d="M295,170 L295,165 L305,165 L305,170" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <path d="M295,185 L295,195 L305,195 L305,185" fill="#e74c3c"/>
  <circle cx="300" cy="180" r="3" fill="#f39c12"/>
  <circle cx="295" cy="175" r="2" fill="#2ecc71"/>
  <circle cx="305" cy="175" r="2" fill="#3498db"/>
  
  <!-- Типы блюд -->
  <text x="280" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Гарниры</text>
  <rect x="270" y="215" width="15" height="10" fill="#f39c12"/>
  <rect x="290" y="215" width="15" height="10" fill="#2ecc71"/>
  <rect x="310" y="215" width="15" height="10" fill="#e74c3c"/>
  
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Запеканки</text>
  <rect x="270" y="255" width="50" height="15" rx="3" fill="#3498db"/>
  <path d="M270,265 L320,265" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2,2"/>
  
  <text x="280" y="290" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Овощные рагу</text>
  <path d="M270,300 L280,300 L275,310 L265,310 Z" fill="#e74c3c"/>
  <path d="M285,300 L295,300 L290,310 L280,310 Z" fill="#2ecc71"/>
  <path d="M300,300 L310,300 L305,310 L295,310 Z" fill="#3498db"/>
  
  <!-- Схема приготовления -->
  <rect x="20" y="330" width="460" height="15" rx="7" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="1"/>
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Подготовка → Нарезка → Приготовление → Подача</text>
  
  <!-- Шаги приготовления -->
  <circle cx="80" cy="337" r="5" fill="#7f8c8d"/>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">1</text>
  
  <circle cx="200" cy="337" r="5" fill="#7f8c8d"/>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">2</text>
  
  <circle cx="320" cy="337" r="5" fill="#7f8c8d"/>
  <text x="320" y="365" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">3</text>
  
  <circle cx="440" cy="337" r="5" fill="#7f8c8d"/>
  <text x="440" y="365" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">4</text>
  
  <!-- Ингредиенты -->
  <text x="50" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Ингредиенты:</text>
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Овощи, зелень, заправка</text>
  
  <text x="280" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Ингредиенты:</text>
  <text x="360" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Овощи, масло, специи</text>
  
  <!-- Значки витаминов -->
  <circle cx="180" cy="180" r="10" fill="#e74c3c"/>
  <text x="180" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">A</text>
  
  <circle cx="200" cy="180" r="10" fill="#3498db"/>
  <text x="200" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C</text>
  
  <circle cx="220" cy="180" r="10" fill="#2ecc71"/>
  <text x="220" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">B</text>
  
  <!-- Значки пользы -->
  <path d="M350,170 L360,170 L355,180 Z" fill="#f39c12"/>
  <text x="350" y="195" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Калории</text>
  
  <rect x="340" y="205" width="20" height="10" rx="2" fill="#2ecc71"/>
  <text x="350" y="225" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Польза</text>
  
  <!-- Указатели -->
  <path d="M130,155 L130,165" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M365,155 L365,165" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Определения -->
  <text x="130" y="120" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Салат - смесь продуктов</text>
  <text x="365" y="120" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Овощное блюдо - основное блюдо</text>
  
  <!-- Советы -->
  <rect x="40" y="315" width="180" height="15" rx="5" fill="#f39c12" opacity="0.7"/>
  <text x="130" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Совет: Не переваривайте овощи!</text>
  
  <rect x="270" y="315" width="180" height="15" rx="5" fill="#3498db" opacity="0.7"/>
  <text x="360" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Совет: Используйте свежие овощи!</text>
  
  <!-- Маркеры -->
  <circle cx="40" cy="210" r="3" fill="#7f8c8d"/>
  <circle cx="40" cy="250" r="3" fill="#7f8c8d"/>
  <circle cx="40" cy="290" r="3" fill="#7f8c8d"/>
  
  <circle cx="270" cy="210" r="3" fill="#7f8c8d"/>
  <circle cx="270" cy="250" r="3" fill="#7f8c8d"/>
  <circle cx="270" cy="290" r="3" fill="#7f8c8d"/>
  
  <!-- Декоративные элементы -->
  <path d="M20,330 L30,330" stroke="#7f8c8d" stroke-width="2"/>
  <path d="M470,330 L480,330" stroke="#7f8c8d" stroke-width="2"/>
  
  <circle cx="15" cy="337" r="3" fill="#7f8c8d"/>
  <circle cx="485" cy="337" r="3" fill="#7f8c8d"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">Салаты богаты витаминами</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">Овощи - полезный продукт</text>
  
  <!-- Штриховки -->
  <pattern id="stripes" patternUnits="userSpaceOnUse" width="4" height="4">
    <path d="M0,4 l4,-4 M-1,1 l2,-2 M3,5 l2,-2" stroke="#7f8c8d" stroke-width="0.5"/>
  </pattern>
  
  <rect x="280" y="255" width="50" height="15" rx="3" fill="url(#stripes)" opacity="0.3"/>
  
  <!-- Дополнительные указатели -->
  <line x1="130" y1="200" x2="130" y2="205" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="365" y1="200" x2="365" y2="205" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Определения терминов -->
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Свежесть = качество</text>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Варка = сохранение витаминов</text>
  
  <!-- Границы разделов -->
  <line x1="240" y1="120" x2="240" y2="320" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Небольшие декоративные элементы -->
  <circle cx="250" cy="220" r="2" fill="#7f8c8d"/>
  <circle cx="250" cy="240" r="2" fill="#7f8c8d"/>
  <circle cx="250" cy="260" r="2" fill="#7f8c8d"/>
  <circle cx="250" cy="280" r="2" fill="#7f8c8d"/>
  
  <!-- Дополнительные подписи -->
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Легко перевариваются</text>
  <text x="365" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Сытные и полезные</text>
  
  <!-- Счетчик калорий -->
  <rect x="170" y="315" width="40" height="15" rx="5" fill="#e74c3c" opacity="0.7"/>
  <text x="190" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">~50 ккал</text>
  
  <rect x="400" y="315" width="40" height="15" rx="5" fill="#e74c3c" opacity="0.7"/>
  <text x="420" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">~100 ккал</text>
  
  <!-- Стрелка для определений -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>