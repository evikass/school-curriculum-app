<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок класса -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f8c8d">ТЕХНОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">Свойства металлов и сплавов</text>
  
  <!-- Основной заголовок темы -->
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#7f8c8d">Обработка металла</text>
  
  <!-- Линия разделения -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Схема обработки металла - левая часть -->
  <g transform="translate(50, 100)">
    <!-- Заголовок схемы -->
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Методы обработки</text>
    
    <!-- Первый этап -->
    <circle cx="30" cy="30" r="20" fill="#3498db" opacity="0.8"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">1</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Заготовка</text>
    
    <!-- Стрелка -->
    <line x1="50" y1="30" x2="90" y2="30" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Второй этап -->
    <circle cx="120" cy="30" r="20" fill="#e74c3c" opacity="0.8"/>
    <text x="120" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">2</text>
    <text x="120" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Нагрев</text>
    
    <!-- Стрелка -->
    <line x1="140" y1="30" x2="180" y2="30" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Третий этап -->
    <circle cx="210" cy="30" r="20" fill="#f39c12" opacity="0.8"/>
    <text x="210" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">3</text>
    <text x="210" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Деформация</text>
    
    <!-- Стрелка -->
    <line x1="230" y1="30" x2="270" y2="30" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Четвертый этап -->
    <circle cx="300" cy="30" r="20" fill="#2ecc71" opacity="0.8"/>
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">4</text>
    <text x="300" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Охлаждение</text>
  </g>
  
  <!-- Свойства металла - правая часть -->
  <g transform="translate(320, 100)">
    <!-- Заголовок -->
    <text x="90" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Свойства металла</text>
    
    <!-- Таблица свойств -->
    <rect x="0" y="10" width="180" height="160" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    
    <!-- Свойство 1 -->
    <rect x="0" y="10" width="90" height="40" fill="#ecf0f1"/>
    <text x="45" y="30" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Прочность</text>
    <text x="135" y="30" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">σв = 400-600 МПа</text>
    
    <!-- Свойство 2 -->
    <rect x="0" y="50" width="90" height="40" fill="#ecf0f1"/>
    <text x="45" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Твёрдость</text>
    <text x="135" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">HB = 150-200</text>
    
    <!-- Свойство 3 -->
    <rect x="0" y="90" width="90" height="40" fill="#ecf0f1"/>
    <text x="45" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Пластичность</text>
    <text x="135" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">δ = 10-25%</text>
    
    <!-- Свойство 4 -->
    <rect x="0" y="130" width="90" height="40" fill="#ecf0f1"/>
    <text x="45" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Ударная вязкость</text>
    <text x="135" y="150" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">KCU = 50-80 Дж/см²</text>
  </g>
  
  <!-- Инструменты обработки -->
  <g transform="translate(50, 240)">
    <!-- Заголовок -->
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Инструменты для обработки металла</text>
    
    <!-- Молот -->
    <rect x="20" y="20" width="40" height="60" fill="#8b4513" rx="5"/>
    <rect x="35" y="80" width="10" height="30" fill="#654321"/>
    <text x="40" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Молот</text>
    
    <!-- Напильник -->
    <rect x="90" y="30" width="60" height="15" fill="#c0c0c0"/>
    <line x1="90" y1="37.5" x2="150" y2="37.5" stroke="#7f8c8d" stroke-width="0.5" stroke-dasharray="2,2"/>
    <rect x="115" y="45" width="10" height="20" fill="#654321"/>
    <text x="120" y="80" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Напильник</text>
    
    <!-- Стамеска -->
    <path d="M190 40 L190 60 L210 60 L210 40 Z" fill="#7f8c8d"/>
    <rect x="195" y="60" width="10" height="25" fill="#654321"/>
    <text x="200" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Стамеска</text>
    
    <!-- Пробойник -->
    <circle cx="270" cy="35" r="8" fill="#7f8c8d"/>
    <rect x="266" y="35" width="8" height="25" fill="#654321"/>
    <text x="270" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Пробойник</text>
    
    <!-- Штихель -->
    <path d="M330 40 L330 50 L335 55 L340 50 L340 40 Z" fill="#c0c0c0"/>
    <rect x="335" y="55" width="5" height="25" fill="#654321"/>
    <text x="335" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Штихель</text>
  </g>
  
  <!-- Температурная шкала -->
  <g transform="translate(50, 310)">
    <!-- Заголовок -->
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">Температура обработки металла</text>
    
    <!-- Ось шкалы -->
    <line x1="0" y1="15" x2="400" y2="15" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Точки на шкале -->
    <circle cx="0" cy="15" r="4" fill="#3498db"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">20°C</text>
    
    <circle cx="100" cy="15" r="4" fill="#e74c3c"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">700°C</text>
    
    <circle cx="200" cy="15" r="4" fill="#f39c12"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">1000°C</text>
    
    <circle cx="300" cy="15" r="4" fill="#2ecc71"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">1200°C</text>
    
    <circle cx="400" cy="15" r="4" fill="#9b59b6"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">1500°C</text>
  </g>
  
  <!-- Определения -->
  <g transform="translate(320, 240)">
    <!-- Заголовок -->
    <text x="90" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Ключевые понятия</text>
    
    <!-- Определение 1 -->
    <rect x="0" y="10" width="180" height="25" fill="#ecf0f1"/>
    <text x="5" y="25" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Обработка металлов - изменение</text>
    <text x="5" y="35" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">формы и свойств металлов</text>
    
    <!-- Определение 2 -->
    <rect x="0" y="45" width="180" height="25" fill="#ecf0f1"/>
    <text x="5" y="60" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Термическая обработка - нагрев</text>
    <text x="5" y="70" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">и охлаждение металлов</text>
    
    <!-- Определение 3 -->
    <rect x="0" y="80" width="180" height="25" fill="#ecf0f1"/>
    <text x="5" y="95" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Механическая обработка - изменение</text>
    <text x="5" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">формы без изменения структуры</text>
    
    <!-- Определение 4 -->
    <rect x="0" y="115" width="180" height="25" fill="#ecf0f1"/>
    <text x="5" y="130" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Сплав - смесь металлов с</text>
    <text x="5" y="140" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">улучшенными свойствами</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Вспомогательные линии -->
  <line x1="50" y1="200" x2="450" y2="200" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="300" y1="90" x2="300" y2="340" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Маркер для стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>