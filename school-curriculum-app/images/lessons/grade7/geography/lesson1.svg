<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ГЕОГРАФИЯ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34495e">Литосфера и рельеф Земли</text>
  
  <!-- Облако знаний -->
  <g transform="translate(100, 80)">
    <path d="M20,30 C20,10 50,0 80,10 C100,0 120,10 120,30 C130,30 140,40 140,50 C140,60 130,70 120,70 L20,70 C10,70 0,60 0,50 C0,40 10,30 20,30 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="70" y="40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Рельеф</text>
    <text x="70" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Поверхность</text>
  </g>
  
  <!-- Схема литосферы -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#27ae60" opacity="0.8"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Литосфера</text>
    <line x1="0" y1="40" x2="120" y2="40" stroke="white" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="60" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Твердая оболочка</text>
    <text x="60" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Земли</text>
  </g>
  
  <!-- Типы рельефа -->
  <g transform="translate(50, 180)">
    <!-- Горизонтальные плоскости -->
    <rect x="0" y="0" width="80" height="15" fill="#e74c3c"/>
    <text x="40" y="10" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Равнины</text>
    
    <!-- Горы -->
    <path d="M100,15 L100,0 L120,0 L140,0 L140,15 L130,5 L120,0 L110,5 Z" fill="#8e44ad"/>
    <text x="120" y="28" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Горы</text>
    
    <!-- Плато -->
    <rect x="160" y="0" width="80" height="20" fill="#3498db"/>
    <text x="200" y="13" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Плато</text>
    
    <!-- Долины -->
    <path d="M260,20 L260,0 L280,10 L300,0 L300,20 L280,10 Z" fill="#f39c12"/>
    <text x="280" y="33" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Долины</text>
  </g>
  
  <!-- Строение земной коры -->
  <g transform="translate(50, 230)">
    <!-- Основа -->
    <rect x="0" y="40" width="150" height="30" fill="#95a5a6"/>
    <text x="75" y="58" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Мантия</text>
    
    <!-- Средний слой -->
    <rect x="0" y="20" width="150" height="20" fill="#7f8c8d"/>
    <text x="75" y="33" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Верхняя кора</text>
    
    <!-- Верхний слой -->
    <rect x="0" y="0" width="150" height="20" fill="#34495e"/>
    <text x="75" y="13" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Осадочный слой</text>
    
    <!-- Разломы -->
    <line x1="75" y1="0" x2="75" y2="70" stroke="#e74c3c" stroke-width="2"/>
    <text x="155" y="35" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Тектонические разломы</text>
  </g>
  
  <!-- Схема движения плит -->
  <g transform="translate(250, 200)">
    <!-- Плитка 1 -->
    <rect x="0" y="0" width="70" height="70" fill="#27ae60" opacity="0.7"/>
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Литосферная</text>
    <text x="35" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">плита 1</text>
    
    <!-- Плитка 2 -->
    <rect x="50" y="20" width="70" height="70" fill="#3498db" opacity="0.7"/>
    <text x="85" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Литосферная</text>
    <text x="85" y="68" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">плита 2</text>
    
    <!-- Стрелка движения -->
    <path d="M120,40 L150,40 L145,35 M150,40 L145,45" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <text x="160" y="45" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Движение плит</text>
  </g>
  
  <!-- Формы рельефа -->
  <g transform="translate(350, 150)">
    <circle cx="40" cy="40" r="35" fill="#ecf0f1" stroke="#27ae60" stroke-width="2"/>
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Формы рельефа:</text>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">• Горы</text>
    <text x="40" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">• Равнины</text>
    <text x="40" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">• Плато</text>
  </g>
  
  <!-- Диаграма высот -->
  <g transform="translate(350, 220)">
    <rect x="0" y="0" width="100" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Высоты Земли</text>
    
    <!-- Гора -->
    <rect x="10" y="30" width="15" height="40" fill="#8e44ad"/>
    <text x="17.5" y="75" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Горы</text>
    
    <!-- Плато -->
    <rect x="35" y="45" width="15" height="25" fill="#3498db"/>
    <text x="42.5" y="75" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Плато</text>
    
    <!-- Равнина -->
    <rect x="60" y="60" width="15" height="10" fill="#e74c3c"/>
    <text x="67.5" y="75" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Равнины</text>
  </g>
  
  <!-- Подписи и элементы -->
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Ключевые понятия:</text>
  
  <text x="30" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Литосфера — твердая оболочка Земли</text>
  
  <text x="30" y="330" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Рельеф — совокупность неровностей земной поверхности</text>
  
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Тектонические плиты — основные части литосферы</text>
  
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Геологические процессы — создание и изменение рельефа</text>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="420" cy="120" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="430" cy="130" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="410" cy="130" r="5" fill="#27ae60" opacity="0.5"/>
  
  <rect x="30" y="70" width="3" height="30" fill="#27ae60" opacity="0.3"/>
  <rect x="220" y="70" width="3" height="30" fill="#27ae60" opacity="0.3"/>
  <rect x="370" y="70" width="3" height="30" fill="#27ae60" opacity="0.3"/>
  
  <!-- Разделительные линии -->
  <line x1="30" y1="150" x2="470" y2="150" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="30" y1="200" x2="470" y2="200" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Дополнительные иконки -->
  <g transform="translate(30, 90)">
    <path d="M0,10 C0,5 5,0 10,0 C15,0 20,5 20,10 C25,10 30,15 30,20 C30,25 25,30 20,30 L10,30 C5,30 0,25 0,20 C0,15 5,10 0,10 Z" fill="#27ae60" opacity="0.2"/>
    <circle cx="15" cy="15" r="5" fill="#27ae60"/>
  </g>
  
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="15" height="15" fill="#3498db" opacity="0.3"/>
    <rect x="2" y="2" width="11" height="11" fill="#3498db" opacity="0.5"/>
  </g>
  
  <!-- Узор для украшения -->
  <g transform="translate(400, 250)">
    <path d="M0,0 L5,0 L5,5 L0,5 Z M10,0 L15,0 L15,5 L10,5 Z M0,10 L5,10 L5,15 L0,15 Z M10,10 L15,10 L15,15 L10,15 Z" fill="#27ae60" opacity="0.2"/>
  </g>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Виды рельефа</text>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Тектоника плит</text>
  <text x="470" y="250" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Высота</text>
  
  <!-- Дополнительные точки и линии для объема -->
  <circle cx="180" cy="120" r="2" fill="#27ae60"/>
  <circle cx="320" cy="120" r="2" fill="#27ae60"/>
  <circle cx="440" cy="100" r="2" fill="#27ae60"/>
  
  <line x1="50" y1="100" x2="50" y2="120" stroke="#27ae60" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="100" x2="100" y2="120" stroke="#27ae60" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="100" x2="400" y2="120" stroke="#27ae60" stroke-width="1" opacity="0.3"/>
</svg>