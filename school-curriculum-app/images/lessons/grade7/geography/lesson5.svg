<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">ГЕОГРАФИЯ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">Океаны и материки</text>
  
  <!-- Разделительная линия -->
  <line x1="100" y1="70" x2="400" y2="70" stroke="#27ae60" stroke-width="2"/>
  
  <!-- Тихий океан -->
  <path d="M50 100 Q150 90 250 100 T450 110 Q400 130 350 140 T250 150 T150 140 Q100 130 50 100" fill="#3498db" opacity="0.7"/>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">ТИХИЙ ОКЕАН</text>
  
  <!-- Атлантический океан -->
  <path d="M50 180 Q150 170 250 180 T450 190 Q400 210 350 220 T250 230 T150 220 Q100 210 50 180" fill="#5dade2" opacity="0.7"/>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">АТЛАНТИЧЕСКИЙ ОКЕАН</text>
  
  <!-- Материк Азия -->
  <path d="M420 120 Q440 110 460 120 L470 140 L465 160 L460 180 L440 190 L420 180 L410 160 L415 140 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">АЗИЯ</text>
  
  <!-- Материк Северная Америка -->
  <path d="M80 190 Q90 180 100 185 L110 200 L105 220 L100 240 L85 245 L70 240 L65 220 L70 200 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">СЕВ. АМЕРИКА</text>
  
  <!-- Материк Южная Америка -->
  <path d="M100 230 Q110 220 115 225 L120 240 L115 260 L110 280 L95 285 L80 280 L75 260 L80 240 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="95" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">ЮЖ. АМЕРИКА</text>
  
  <!-- Материк Африка -->
  <path d="M300 200 Q310 190 320 195 L325 210 L320 230 L315 250 L305 255 L295 250 L290 230 L295 210 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="310" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">АФРИКА</text>
  
  <!-- Материк Европа -->
  <path d="M280 110 Q290 105 300 110 L305 120 L300 130 L290 132 L280 130 L275 120 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">ЕВРОПА</text>
  
  <!-- Материк Австралия -->
  <path d="M380 240 Q390 235 400 240 L405 250 L400 260 L390 262 L380 260 L375 250 Z" fill="#e74c3c" opacity="0.8"/>
  <text x="390" y="250" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">АВСТРАЛИЯ</text>
  
  <!-- Антарктида -->
  <path d="M150 300 Q200 290 250 300 T350 300 L360 320 L340 330 L250 335 L160 330 L140 320 Z" fill="#95a5a6" opacity="0.8"/>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">АНТАРКТИДА</text>
  
  <!-- Текстовая информация о Тихом океане -->
  <rect x="50" y="160" width="120" height="80" fill="#ecf0f1" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="110" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">ТИХИЙ ОКЕАН</text>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Самый большой океан</text>
  <text x="110" y="210" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Площадь: 178,7 млн км²</text>
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Глубина: до 11,022 м</text>
  
  <!-- Текстовая информация об Атлантическом океане -->
  <rect x="330" y="160" width="120" height="80" fill="#ecf0f1" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="390" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">АТЛАНТИКА</text>
  <text x="390" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Второй по величине</text>
  <text x="390" y="210" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Площадь: 106,5 млн км²</text>
  <text x="390" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Глубина: до 8,742 м</text>
  
  <!-- Иконка глубины -->
  <circle cx="250" cy="100" r="15" fill="#27ae60"/>
  <path d="M250 92 L250 108 M242 100 L258 100" stroke="#fff" stroke-width="2"/>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#27ae60">Глубина</text>
  
  <!-- Иконка площади -->
  <rect x="235" y="75" width="30" height="20" fill="#27ae60" opacity="0.7"/>
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">S</text>
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#27ae60">Площадь</text>
  
  <!-- Линия экватора -->
  <line x1="50" y1="240" x2="450" y2="240" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="460" y="245" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Экватор</text>
  
  <!-- Линия тропика Рака -->
  <line x1="50" y1="200" x2="450" y2="200" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="460" y="205" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">Тропик Рака</text>
  
  <!-- Линия тропика Козерога -->
  <line x1="50" y1="280" x2="450" y2="280" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="460" y="285" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">Тропик Козерога</text>
  
  <!-- Текст о распределении воды -->
  <rect x="180" y="260" width="140" height="60" fill="#ecf0f1" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">РАСПРЕДЕЛЕНИЕ ВОДЫ</text>
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Тихий океан - 46%</text>
  <text x="250" y="308" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Атлантический - 24%</text>
  
  <!-- Схема течений -->
  <circle cx="150" cy="120" r="3" fill="#27ae60"/>
  <path d="M150 120 Q200 110 250 120" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Северное Пассатное</text>
  
  <!-- Определение океана -->
  <rect x="50" y="50" width="120" height="50" fill="#27ae60" opacity="0.1"/>
  <text x="110" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">ОКЕАН -</text>
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">обширная часть</text>
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Мирового океана</text>
  
  <!-- Определение материка -->
  <rect x="330" y="50" width="120" height="50" fill="#27ae60" opacity="0.1"/>
  <text x="390" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">МАТЕРИК -</text>
  <text x="390" y="85" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">сушевая часть</text>
  <text x="390" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Земли</text>
  
  <!-- Статистика по океанам -->
  <circle cx="420" cy="80" r="20" fill="#27ae60" opacity="0.2"/>
  <text x="420" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">5</text>
  <text x="420" y="110" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Океанов</text>
  
  <circle cx="420" cy="140" r="20" fill="#27ae60" opacity="0.2"/>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">6</text>
  <text x="420" y="170" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Материков</text>
  
  <!-- Указатели -->
  <line x1="90" y1="215" x2="90" y2="245" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="95" y1="255" x2="95" y2="285" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="310" y1="225" x2="310" y2="255" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="390" y1="250" x2="390" y2="280" stroke="#2c3e50" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- Дополнительные элементы для увеличения размера -->
  <rect x="150" y="90" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="160" y="90" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="170" y="90" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="150" y="100" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="160" y="100" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="170" y="100" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="150" y="110" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="160" y="110" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  <rect x="170" y="110" width="10" height="10" fill="#27ae60" opacity="0.3"/>
  
  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Тихий</text>
  <text x="20" y="180" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Атлантический</text>
  <text x="20" y="300" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Антарктический</text>
  <text x="180" y="100" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Индийский</text>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Северный Ледовитый</text>
  <text x="350" y="100" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Южный</text>
  <text x="350" y="180" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Южный Ледовитый</text>
  <text x="20" y="240" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0°</text>
  <text x="20" y="200" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">23.5°N</text>
  <text x="20" y="280" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">23.5°S</text>
  
  <!-- Дополнительные геометрические фигуры -->
  <circle cx="50" cy="320" r="5" fill="#27ae60"/>
  <circle cx="60" cy="320" r="5" fill="#27ae60"/>
  <circle cx="70" cy="320" r="5" fill="#27ae60"/>
  <circle cx="80" cy="320" r="5" fill="#27ae60"/>
  <circle cx="90" cy="320" r="5" fill="#27ae60"/>
  
  <rect x="420" y="320" width="10" height="10" fill="#27ae60" opacity="0.5"/>
  <rect x="430" y="320" width="10" height="10" fill="#27ae60" opacity="0.5"/>
  <rect x="440" y="320" width="10" height="10" fill="#27ae60" opacity="0.5"/>
  <rect x="450" y="320" width="10" height="10" fill="#27ae60" opacity="0.5"/>
</svg>