<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4e9e2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для океанов -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Градиент для суши -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ГЕОГРАФИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34495e">Индийский и Северный Ледовитый океаны</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="70" x2="450" y2="70" stroke="#27ae60" stroke-width="2"/>
  
  <!-- Карта мира (упрощенная) -->
  <g transform="translate(250, 180)">
    <!-- Северный Ледовитый океан -->
    <circle cx="-120" cy="-30" r="40" fill="url(#oceanGrad)" filter="url(#shadow)"/>
    <text x="-120" y="-25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Северный</text>
    <text x="-120" y="-15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Ледовитый</text>
    
    <!-- Индийский океан -->
    <circle cx="80" cy="20" r="45" fill="url(#oceanGrad)" filter="url(#shadow)"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Индийский</text>
    
    <!-- Континенты -->
    <!-- Африка -->
    <path d="M 60,-20 C 70,-30 75,-10 70,0 C 65,10 55,15 50,10 C 45,5 50,-10 60,-20" fill="url(#landGrad)" filter="url(#shadow)"/>
    
    <!-- Азия -->
    <path d="M 90,-10 C 100,-20 110,-15 115,-5 C 120,5 115,15 105,20 C 95,25 85,20 80,10 C 75,0 80,-5 90,-10" fill="url(#landGrad)" filter="url(#shadow)"/>
    
    <!-- Северная Америка -->
    <path d="M -140,-50 C -130,-60 -120,-55 -115,-45 C -110,-35 -115,-25 -125,-20 C -135,-15 -145,-20 -150,-30 C -155,-40 -145,-45 -140,-50" fill="url(#landGrad)" filter="url(#shadow)"/>
    
    <!-- Европа -->
    <path d="M -80,-40 C -70,-45 -60,-40 -55,-35 C -50,-30 -55,-25 -65,-20 C -75,-15 -85,-20 -90,-30 C -95,-40 -85,-45 -80,-40" fill="url(#landGrad)" filter="url(#shadow)"/>
    
    <!-- Австралия -->
    <path d="M 100,40 C 110,35 120,40 125,50 C 130,60 125,70 115,75 C 105,80 95,75 90,65 C 85,55 90,45 100,40" fill="url(#landGrad)" filter="url(#shadow)"/>
    
    <!-- Южная Америка -->
    <path d="M -40,10 C -30,0 -20,5 -15,15 C -10,25 -15,35 -25,40 C -35,45 -45,40 -50,30 C -55,20 -50,10 -40,10" fill="url(#landGrad)" filter="url(#shadow)"/>
  </g>
  
  <!-- Индикаторы и подписи -->
  <!-- Индикатор для Северного Ледовитого океана -->
  <g transform="translate(80, 100)">
    <line x1="0" y1="0" x2="20" y2="20" stroke="#27ae60" stroke-width="2"/>
    <circle cx="25" cy="25" r="5" fill="#27ae60"/>
    <text x="35" y="30" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Наименьший по площади</text>
  </g>
  
  <!-- Индикатор для Индийского океана -->
  <g transform="translate(380, 150)">
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#27ae60" stroke-width="2"/>
    <circle cx="-25" cy="25" r="5" fill="#27ae60"/>
    <text x="-130" y="30" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">3-й по площади океан</text>
  </g>
  
  <!-- Диаграмма сравнения глубин -->
  <g transform="translate(50, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Средняя глубина (м):</text>
    
    <!-- Северный Ледовитый -->
    <rect x="0" y="10" width="100" height="20" fill="#3498db" rx="3"/>
    <text x="105" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1209</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Северный Ледовитый</text>
    
    <!-- Индийский -->
    <rect x="0" y="55" width="150" height="20" fill="#3498db" rx="3"/>
    <text x="155" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3892</text>
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Индийский</text>
  </g>
  
  <!-- Температура воды -->
  <g transform="translate(300, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Температура воды (°C):</text>
    
    <!-- Северный Ледовитый -->
    <circle cx="10" cy="20" r="8" fill="#5dade2"/>
    <text x="25" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-1.8 до +8</text>
    
    <!-- Индийский -->
    <circle cx="10" cy="45" r="8" fill="#e74c3c"/>
    <text x="25" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">22 до 28</text>
  </g>
  
  <!-- Схема течений -->
  <g transform="translate(250, 100)">
    <circle cx="-120" cy="-30" r="50" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
    <path d="M -170,-30 Q -120,-50 -70,-30" fill="none" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <circle cx="80" cy="20" r="60" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
    <path d="M 80,-40 Q 120,20 80,80" fill="none" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 80,80 Q 20,20 80,-40" fill="none" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Стрелка для течений -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Подписи к особенностям -->
  <g transform="translate(250, 200)">
    <text x="-180" y="0" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Постоянный лед</text>
    <text x="-180" y="10" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">покров</text>
    
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Муссонный</text>
    <text x="150" y="10" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">климат</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Компас -->
  <g transform="translate(450, 320)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#27ae60" stroke-width="1"/>
    <path d="M 0,-15 L 5,0 L 0,15 L -5,0 Z" fill="#27ae60"/>
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">С</text>
    <text x="18" y="3" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">В</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">Ю</text>
    <text x="-18" y="3" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">З</text>
  </g>
  
  <!-- Масштаб -->
  <g transform="translate(50, 320)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#27ae60" stroke-width="2"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#27ae60" stroke-width="2"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#27ae60" stroke-width="2"/>
    <text x="25" y="12" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2c3e50">5000 км</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(400, 280)">
    <rect x="0" y="0" width="15" height="15" fill="url(#landGrad)" rx="2"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Суша</text>
    
    <rect x="0" y="20" width="15" height="15" fill="url(#oceanGrad)" rx="2"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Океаны</text>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">1. Северный Ледовитый океан</text>
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">2. Индийский океан</text>
  <text x="250" y="260" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">3. Африка</text>
  <text x="250" y="275" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">4. Азия</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="120" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="470" cy="100" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="30" cy="250" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="470" cy="200" r="3" fill="#27ae60" opacity="0.5"/>
  
  <!-- Пунктирная линия для разделения -->
  <line x1="50" y1="230" x2="450" y2="230" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
</svg>