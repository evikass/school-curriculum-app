<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f9f9f9"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">ГЕОГРАФИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#27ae60">ПРИРОДА АФРИКИ</text>
  
  <!-- Контур Африки -->
  <path d="M180,100 Q200,90 220,95 Q240,100 250,110 Q270,120 280,140 Q290,160 285,180 Q280,200 270,210 Q260,220 240,225 Q220,230 200,225 Q180,220 170,200 Q160,180 165,160 Q170,140 175,120 Q180,110 180,100" 
        fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  
  <!-- Географические объекты внутри контура Африки -->
  
  <!-- Сахара -->
  <path d="M190,110 Q210,105 230,110 Q250,115 260,130 Q255,140 240,135 Q220,130 200,125 Q190,120 190,110" 
        fill="#ffcc80" stroke="#27ae60" stroke-width="1"/>
  <text x="225" y="125" text-anchor="middle" font-size="10" fill="#333">Сахара</text>
  
  <!-- Саванна -->
  <rect x="190" y="140" width="70" height="50" fill="#8bc34a" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="225" y="170" text-anchor="middle" font-size="10" fill="#333">Саванна</text>
  
  <!-- Тропические леса -->
  <circle cx="235" cy="195" r="20" fill="#4caf50" stroke="#27ae60" stroke-width="1"/>
  <text x="235" y="200" text-anchor="middle" font-size="9" fill="#fff">Леса</text>
  
  <!-- Синайский полуостров -->
  <path d="M280,120 L285,130 L280,135 L275,130 Z" fill="#ffcc80" stroke="#27ae60" stroke-width="1"/>
  <text x="280" y="145" text-anchor="middle" font-size="9" fill="#333">Синай</text>
  
  <!-- Нильская долина -->
  <line x1="250" y1="110" x2="250" y2="140" stroke="#2196f3" stroke-width="2"/>
  <text x="260" y="125" font-size="9" fill="#2196f3">Нил</text>
  
  <!-- Крупные реки -->
  <path d="M240,210 Q220,220 200,230" fill="none" stroke="#2196f3" stroke-width="2"/>
  <text x="220" y="225" font-size="9" fill="#2196f3">Нiger</text>
  
  <path d="M250,210 Q270,220 290,230" fill="none" stroke="#2196f3" stroke-width="2"/>
  <text x="270" y="225" font-size="9" fill="#2196f3">Congo</text>
  
  <!-- Озеро Виктория -->
  <ellipse cx="220" cy="190" rx="15" ry="10" fill="#2196f3" stroke="#27ae60" stroke-width="1"/>
  <text x="220" y="205" text-anchor="middle" font-size="9" fill="#333">Виктория</text>
  
  <!-- Тангањика -->
  <rect x="200" y="210" width="30" height="15" fill="#2196f3" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="215" y="230" text-anchor="middle" font-size="9" fill="#333">Танганьика</text>
  
  <!-- Калахари -->
  <ellipse cx="250" cy="240" rx="20" ry="15" fill="#ffb74d" stroke="#27ae60" stroke-width="1"/>
  <text x="250" y="250" text-anchor="middle" font-size="9" fill="#333">Калахари</text>
  
  <!-- Эверест (символ гор) -->
  <path d="M150,100 L160,80 L170,100 Z" fill="#9e9e9e" stroke="#27ae60" stroke-width="1"/>
  <path d="M155,95 L160,85 L165,95" fill="none" stroke="#fff" stroke-width="1"/>
  <text x="160" y="115" text-anchor="middle" font-size="9" fill="#333">Горы</text>
  
  <!-- Экватор -->
  <line x1="120" y1="170" x2="320" y2="170" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="330" y="175" font-size="9" fill="#f44336">Экватор</text>
  
  <!-- Тропик Рака -->
  <line x1="130" y1="140" x2="310" y2="140" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="145" font-size="9" fill="#ff9800">Тропик Рака</text>
  
  <!-- Тропик Козерога -->
  <line x1="130" y1="210" x2="310" y2="210" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="215" font-size="9" fill="#ff9800">Тропик Козерога</text>
  
  <!-- Климатические пояса -->
  <rect x="340" y="100" width="120" height="40" fill="#ffcc80" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="400" y="125" text-anchor="middle" font-size="10" fill="#333">Сухой климат</text>
  
  <rect x="340" y="150" width="120" height="40" fill="#8bc34a" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="400" y="175" text-anchor="middle" font-size="10" fill="#333">Умеренный климат</text>
  
  <rect x="340" y="200" width="120" height="40" fill="#4caf50" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="400" y="225" text-anchor="middle" font-size="10" fill="#333">Влажный климат</text>
  
  <!-- Флора и фауна -->
  <!-- Слон -->
  <circle cx="175" cy="165" r="8" fill="#9e9e9e" stroke="#27ae60" stroke-width="1"/>
  <path d="M170,165 L172,160 L174,165 M171,163 L173,163" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M176,165 L178,162 L180,165" fill="none" stroke="#333" stroke-width="1"/>
  <text x="175" y="180" text-anchor="middle" font-size="9" fill="#333">Слон</text>
  
  <!-- Жираф -->
  <path d="M265,150 Q267,140 270,145 Q272,150 270,155" fill="#ffcc80" stroke="#27ae60" stroke-width="1"/>
  <circle cx="268" cy="145" r="3" fill="#ffcc80" stroke="#27ae60" stroke-width="1"/>
  <text x="270" y="165" text-anchor="middle" font-size="9" fill="#333">Жираф</text>
  
  <!-- Баобаб -->
  <rect x="255" y="180" width="10" height="20" fill="#795548" stroke="#27ae60" stroke-width="1"/>
  <circle cx="260" cy="180" r="12" fill="#8bc34a" stroke="#27ae60" stroke-width="1"/>
  <text x="260" y="215" text-anchor="middle" font-size="9" fill="#333">Баобаб</text>
  
  <!-- Пальма -->
  <path d="M290,160 Q295,155 300,160 Q295,165 290,160" fill="#795548" stroke="#27ae60" stroke-width="1"/>
  <path d="M295,160 L295,180" stroke="#795548" stroke-width="2"/>
  <path d="M292,165 Q295,168 298,165" fill="none" stroke="#795548" stroke-width="1"/>
  <path d="M292,170 Q295,173 298,170" fill="none" stroke="#795548" stroke-width="1"/>
  <text x="295" y="190" text-anchor="middle" font-size="9" fill="#333">Пальма</text>
  
  <!-- Осадки -->
  <circle cx="240" cy="125" r="2" fill="#2196f3"/>
  <circle cx="250" cy="130" r="2" fill="#2196f3"/>
  <circle cx="245" cy="135" r="2" fill="#2196f3"/>
  <text x="260" y="130" font-size="9" fill="#2196f3">Осадки</text>
  
  <!-- Температура -->
  <path d="M150,80 L160,70 L170,80" fill="none" stroke="#f44336" stroke-width="2"/>
  <path d="M155,75 L160,70 L165,75" fill="none" stroke="#f44336" stroke-width="1"/>
  <text x="160" y="65" text-anchor="middle" font-size="9" fill="#f44336">Температура</text>
  
  <!-- Флаги стран -->
  <rect x="175" y="100" width="8" height="10" fill="#f44336" stroke="#27ae60" stroke-width="0.5"/>
  <rect x="183" y="100" width="8" height="10" fill="#fff" stroke="#27ae60" stroke-width="0.5"/>
  <rect x="191" y="100" width="8" height="10" fill="#2196f3" stroke="#27ae60" stroke-width="0.5"/>
  <text x="187" y="95" text-anchor="middle" font-size="8" fill="#333">Египет</text>
  
  <rect x="275" y="205" width="10" height="8" fill="#ffcc00" stroke="#27ae60" stroke-width="0.5"/>
  <path d="M275,209 L280,205 L285,209 L280,213 Z" fill="#000" stroke="#27ae60" stroke-width="0.5"/>
  <text x="280" y="200" text-anchor="middle" font-size="8" fill="#333">ЮАР</text>
  
  <!-- Города -->
  <circle cx="250" cy="115" r="3" fill="#333" stroke="#27ae60" stroke-width="0.5"/>
  <text x="255" y="120" font-size="9" fill="#333">Каир</text>
  
  <circle cx="235" cy="195" r="3" fill="#333" stroke="#27ae60" stroke-width="0.5"/>
  <text x="240" y="200" font-size="9" fill="#333">Кампала</text>
  
  <!-- Рельеф -->
  <path d="M150,100 Q160,95 170,100" fill="none" stroke="#9e9e9e" stroke-width="1"/>
  <path d="M150,105 Q160,100 170,105" fill="none" stroke="#9e9e9e" stroke-width="1"/>
  <text x="160" y="120" text-anchor="middle" font-size="9" fill="#333">Рельеф</text>
  
  <!-- Минералы -->
  <rect x="340" y="250" width="30" height="20" fill="#9e9e9e" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="355" y="265" text-anchor="middle" font-size="10" fill="#fff">Алмазы</text>
  <text x="355" y="285" text-anchor="middle" font-size="9" fill="#333">Минералы</text>
  
  <!-- Нефть -->
  <rect x="380" y="250" width="30" height="20" fill="#795548" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="395" y="265" text-anchor="middle" font-size="10" fill="#fff">Нефть</text>
  <text x="395" y="285" text-anchor="middle" font-size="9" fill="#333">Ресурсы</text>
  
  <!-- Пояснительная диаграмма климата -->
  <rect x="40" y="250" width="100" height="60" fill="#fff" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="90" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Климат Африки</text>
  
  <rect x="50" y="275" width="20" height="10" fill="#ffcc80" stroke="#27ae60" stroke-width="0.5"/>
  <text x="75" y="283" font-size="9" fill="#333">Сухой</text>
  
  <rect x="50" y="290" width="20" height="10" fill="#8bc34a" stroke="#27ae60" stroke-width="0.5"/>
  <text x="75" y="298" font-size="9" fill="#333">Умеренный</text>
  
  <rect x="120" y="275" width="20" height="10" fill="#4caf50" stroke="#27ae60" stroke-width="0.5"/>
  <text x="145" y="283" font-size="9" fill="#333">Влажный</text>
  
  <!-- Границы континентов -->
  <path d="M180,100 Q170,95 160,100 Q150,105 140,110 Q130,115 120,120" 
        fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="135" font-size="9" fill="#27ae60">Евразия</text>
</svg>