<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>

  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    Урок 15. Свойства степени
  </text>

  <!-- Система координат -->
  <g id="coordinate-system" transform="translate(50, 100)">
    <!-- Ось X -->
    <line x1="0" y1="100" x2="400" y2="100" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Ось Y -->
    <line x1="0" y1="200" x2="0" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Стрелки -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
      </marker>
    </defs>
    
    <!-- Подписи осей -->
    <text x="410" y="105" font-family="Arial, sans-serif" font-size="14" fill="#34495e">x</text>
    <text x="-10" y="-5" font-family="Arial, sans-serif" font-size="14" fill="#34495e">y</text>
    
    <!-- Шкала -->
    <g id="scale">
      <!-- Деления на оси X -->
      <line x1="100" y1="95" x2="100" y2="105" stroke="#34495e" stroke-width="1"/>
      <text x="95" y="120" font-family="Arial, sans-serif" font-size="12" fill="#34495e">1</text>
      
      <line x1="200" y1="95" x2="200" y2="105" stroke="#34495e" stroke-width="1"/>
      <text x="195" y="120" font-family="Arial, sans-serif" font-size="12" fill="#34495e">2</text>
      
      <line x1="300" y1="95" x2="300" y2="105" stroke="#34495e" stroke-width="1"/>
      <text x="295" y="120" font-family="Arial, sans-serif" font-size="12" fill="#34495e">3</text>
      
      <!-- Деления на оси Y -->
      <line x1="-5" y1="50" x2="5" y2="50" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495e">1</text>
      
      <line x1="-5" y1="150" x2="5" y2="150" stroke="#34495e" stroke-width="1"/>
      <text x="-25" y="155" font-family="Arial, sans-serif" font-size="12" fill="#34495e">-1</text>
    </g>
  </g>

  <!-- График функции y = x² -->
  <path d="M 50,200 Q 100,150 150,100 T 250,50 T 350,20" 
        stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.8"/>
  <text x="360" y="25" font-family="Arial, sans-serif" font-size="14" fill="#4a90e2">y = x²</text>

  <!-- График функции y = 2^x -->
  <path d="M 50,200 Q 100,180 150,150 T 250,80 T 350,20" 
        stroke="url(#grad2)" stroke-width="3" fill="none" opacity="0.8"/>
  <text x="360" y="40" font-family="Arial, sans-serif" font-size="14" fill="#f39c12">y = 2^x</text>

  <!-- Формулы свойств степеней -->
  <g id="formulas" transform="translate(20, 260)">
    <!-- Свойство 1: Умножение степеней -->
    <rect x="0" y="0" width="220" height="70" rx="5" fill="url(#grad3)" opacity="0.1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Умножение степеней:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      a^m · a^n = a^(m+n)
    </text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      (где a ≠ 0)
    </text>

    <!-- Свойство 2: Деление степеней -->
    <rect x="230" y="0" width="250" height="70" rx="5" fill="url(#grad4)" opacity="0.1"/>
    <text x="240" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Деление степеней:
    </text>
    <text x="240" y="40" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      a^m ÷ a^n = a^(m-n)
    </text>
    <text x="240" y="60" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      (где a ≠ 0, n ≠ 0)
    </text>
  </g>

  <!-- Примеры -->
  <g id="examples" transform="translate(50, 90)">
    <!-- Пример 1 -->
    <circle cx="320" cy="10" r="3" fill="#4a90e2"/>
    <text x="330" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      2³ · 2⁵ = 2³⁺⁵ = 2⁸
    </text>
    
    <!-- Пример 2 -->
    <circle cx="320" cy="30" r="3" fill="#f39c12"/>
    <text x="330" y="35" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      3⁴ ÷ 3² = 3⁴⁻² = 3²
    </text>
  </g>

  <!-- Декоративные элементы -->
  <g id="decorative">
    <!-- Круги -->
    <circle cx="30" cy="80" r="15" fill="url(#grad1)" opacity="0.3"/>
    <circle cx="470" cy="80" r="20" fill="url(#grad2)" opacity="0.3"/>
    <circle cx="450" cy="300" r="25" fill="url(#grad3)" opacity="0.3"/>
    
    <!-- Линии -->
    <line x1="40" y1="140" x2="60" y2="160" stroke="url(#grad4)" stroke-width="2" opacity="0.5"/>
    <line x1="440" y1="140" x2="420" y2="160" stroke="url(#grad1)" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Подписи координатных точек -->
  <g id="points" transform="translate(50, 100)">
    <!-- Точка (1,1) -->
    <circle cx="100" cy="100" r="4" fill="#4a90e2"/>
    <text x="105" y="95" font-family="Arial, sans-serif" font-size="11" fill="#34495e">(1,1)</text>
    
    <!-- Точка (2,4) -->
    <circle cx="200" cy="50" r="4" fill="#4a90e2"/>
    <text x="205" y="45" font-family="Arial, sans-serif" font-size="11" fill="#34495e">(2,4)</text>
    
    <!-- Точка (2,4) для экспоненты -->
    <circle cx="200" cy="50" r="4" fill="#f39c12"/>
    <text x="205" y="60" font-family="Arial, sans-serif" font-size="11" fill="#34495e">(2,4)</text>
  </g>

  <!-- Легенда -->
  <g id="legend" transform="translate(50, 220)">
    <rect x="0" y="0" width="400" height="30" rx="15" fill="#ecf0f1" opacity="0.5"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      Графики функций: квадратичная и показательная
    </text>
  </g>

  <!-- Уточнение темы -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Тема: Умножение и деление степеней
  </text>
</svg>