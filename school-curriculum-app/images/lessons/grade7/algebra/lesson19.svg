<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="url(#headerGrad)"/>
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="20" y="75" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Урок 19</text>
  <text x="20" y="95" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Сложение и вычитание многочленов</text>
  
  <!-- Система координат -->
  <g id="coordSystem">
    <!-- Ось X -->
    <line x1="50" y1="250" x2="450" y2="250" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="450,250 445,245 445,255" fill="#2c3e50"/>
    
    <!-- Ось Y -->
    <line x1="250" y1="300" x2="250" y2="100" stroke="#2c3e50" stroke-width="2"/>
    <polygon points="250,100 245,105 255,105" fill="#2c3e50"/>
    
    <!-- Деления на оси X -->
    <line x1="150" y1="245" x2="150" y2="255" stroke="#2c3e50" stroke-width="1"/>
    <line x1="350" y1="245" x2="350" y2="255" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Деления на оси Y -->
    <line x1="245" y1="200" x2="255" y2="200" stroke="#2c3e50" stroke-width="1"/>
    <line x1="245" y1="150" x2="255" y2="150" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Подписи осей -->
    <text x="455" y="255" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x</text>
    <text x="255" y="95" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">y</text>
    
    <!-- Подписи на осях -->
    <text x="145" y="270" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-2</text>
    <text x="245" y="270" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
    <text x="345" y="270" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
    <text x="255" y="205" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="255" y="155" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
  </g>
  
  <!-- График функции 1: y = x² -->
  <path d="M 150 250 Q 200 200, 250 150 T 350 250" fill="none" stroke="url(#grad1)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- График функции 2: y = -x² + 4 -->
  <path d="M 150 150 Q 200 200, 250 250 T 350 150" fill="none" stroke="url(#grad2)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Точка пересечения -->
  <circle cx="250" cy="200" r="5" fill="#e74c3c" filter="url(#shadow)"/>
  
  <!-- Формулы -->
  <rect x="50" y="110" width="180" height="60" fill="white" stroke="#34495e" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="140" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle">Сложение:</text>
  <text x="140" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">(x² + 3x + 2) + (2x² - x + 5) =</text>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">3x² + 2x + 7</text>
  
  <rect x="270" y="110" width="180" height="60" fill="white" stroke="#34495e" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="360" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle">Вычитание:</text>
  <text x="360" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">(3x² + 2x + 7) - (x² - x + 3) =</text>
  <text x="360" y="165" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">2x² + 3x + 4</text>
  
  <!-- Примеры с многочленами -->
  <rect x="20" y="180" width="460" height="40" fill="rgba(255,255,255,0.8)" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="30" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Пример 1:</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3x² + 2x - 5</text>
  <text x="180" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">+</text>
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x² - 4x + 7</text>
  <text x="300" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">= 4x² - 2x + 2</text>
  
  <text x="30" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Пример 2:</text>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">5x³ - 3x² + x</text>
  <text x="190" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">-</text>
  <text x="210" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(2x³ + x² - 4x)</text>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">= 3x³ - 4x² + 5x</text>
  
  <!-- Свойства сложения -->
  <rect x="20" y="230" width="220" height="100" fill="white" stroke="#34495e" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="130" y="250" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="bold">Свойства сложения</text>
  <text x="30" y="270" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Переместительное: A + B = B + A</text>
  <text x="30" y="285" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Сочетательное: (A + B) + C = A + (B + C)</text>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Нейтральный элемент: A + 0 = A</text>
  <text x="30" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Обратный элемент: A + (-A) = 0</text>
  
  <!-- Правила вычитания -->
  <rect x="260" y="230" width="220" height="100" fill="white" stroke="#34495e" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="bold">Правила вычитания</text>
  <text x="270" y="270" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. A - B = A + (-B)</text>
  <text x="270" y="285" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Изменение знаков:</text>
  <text x="270" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">   -(a - b + c) = -a + b - c</text>
  <text x="270" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Раскрываем скобки:</text>
  <text x="370" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">при минусе меняют знаки</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="30" cy="50" r="15" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="470" cy="50" r="15" fill="url(#grad2)" opacity="0.3"/>
  <rect x="20" y="320" width="460" height="20" fill="rgba(52, 73, 94, 0.1)"/>
  
  <!-- Маркеры для графиков -->
  <circle cx="150" cy="250" r="3" fill="#e74c3c"/>
  <circle cx="200" cy="200" r="3" fill="#e74c3c"/>
  <circle cx="250" cy="150" r="3" fill="#e74c3c"/>
  <circle cx="300" cy="200" r="3" fill="#e74c3c"/>
  <circle cx="350" cy="250" r="3" fill="#e74c3c"/>
  
  <circle cx="150" cy="150" r="3" fill="#3498db"/>
  <circle cx="200" cy="200" r="3" fill="#3498db"/>
  <circle cx="250" cy="250" r="3" fill="#3498db"/>
  <circle cx="300" cy="200" r="3" fill="#3498db"/>
  <circle cx="350" cy="150" r="3" fill="#3498db"/>
</svg>