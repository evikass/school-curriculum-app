<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый градиент -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="40" rx="5" fill="url(#blueGrad)"/>
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Урок 10. Функции и их графики</text>
  
  <!-- Система координат -->
  <g transform="translate(100, 200)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#333" stroke-width="2"/>
    
    <!-- Стрелки на осях -->
    <path d="M 300 0 L 295 -3 M 300 0 L 295 3" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M 0 -150 L -3 -145 M 0 -150 L 3 -145" stroke="#333" stroke-width="2" fill="none"/>
    
    <!-- Шкалы -->
    <g font-family="Arial, sans-serif" font-size="12" fill="#666">
      <text x="50" y="15" text-anchor="middle">1</text>
      <text x="100" y="15" text-anchor="middle">2</text>
      <text x="150" y="15" text-anchor="middle">3</text>
      <text x="200" y="15" text-anchor="middle">4</text>
      <text x="250" y="15" text-anchor="middle">5</text>
      
      <text x="-10" y="-45" text-anchor="end">1</text>
      <text x="-10" y="-95" text-anchor="end">2</text>
      <text x="-10" y="-145" text-anchor="end">3</text>
    </g>
    
    <!-- Подписи осей -->
    <text x="310" y="5" font-family="Arial, sans-serif" font-size="14" fill="#333">x</text>
    <text x="-5" y="-155" font-family="Arial, sans-serif" font-size="14" fill="#333">y</text>
    
    <!-- График функции y = x -->
    <path d="M 0 0 L 100 -100 L 200 -200" stroke="url(#greenGrad)" stroke-width="3" fill="none"/>
    
    <!-- График функции y = x² -->
    <path d="M 0 0 Q 50 -25 100 -100 T 200 -400" stroke="url(#redGrad)" stroke-width="3" fill="none"/>
    
    <!-- Точки на графике -->
    <circle cx="0" cy="0" r="4" fill="#4A90E2"/>
    <circle cx="100" cy="-100" r="4" fill="#4A90E2"/>
    <circle cx="200" cy="-200" r="4" fill="#4A90E2"/>
  </g>
  
  <!-- Подписи функций -->
  <text x="320" y="280" font-family="Arial, sans-serif" font-size="14" fill="#5CB85C">y = x</text>
  <text x="320" y="295" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C">y = x²</text>
  
  <!-- Формулы -->
  <rect x="20" y="80" width="200" height="80" rx="5" fill="white" stroke="#DDD" stroke-width="1"/>
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" fill="#333">Функция:</text>
  <text x="30" y="120" font-family="Arial, sans-serif" font-size="16" fill="#4A90E2">y = f(x)</text>
  <text x="30" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666">x - аргумент (независимая переменная)</text>
  <text x="30" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666">y - значение (зависимая переменная)</text>
  
  <!-- Примеры функций -->
  <rect x="280" y="80" width="210" height="110" rx="5" fill="white" stroke="#DDD" stroke-width="1"/>
  <text x="290" y="100" font-family="Arial, sans-serif" font-size="14" fill="#333">Примеры функций:</text>
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="14" fill="#5CB85C">1. y = 2x + 1 (линейная)</text>
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C">2. y = x² - 3 (квадратичная)</text>
  <text x="290" y="160" font-family="Arial, sans-serif" font-size="14" fill="#9B59B6">3. y = |x| (модульная)</text>
  <text x="290" y="180" font-family="Arial, sans-serif" font-size="14" fill="#F39C12">4. y = 1/x (обратная)</text>
  
  <!-- Объяснение графика -->
  <rect x="20" y="200" width="70" height="80" rx="5" fill="white" stroke="#DDD" stroke-width="1"/>
  <text x="25" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">График функции</text>
  <text x="25" y="235" font-family="Arial, sans-serif" font-size="12" fill="#333">— это множество</text>
  <text x="25" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333">всех точек (x, y)</text>
  <text x="25" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">удовлетворяющих</text>
  <text x="25" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">уравнению y = f(x)</text>
  
  <!-- Свойства функции -->
  <rect x="20" y="290" width="460" height="50" rx="5" fill="white" stroke="#DDD" stroke-width="1"/>
  <text x="30" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">• Область определения: все значения x, для которых функция определена</text>
  <text x="30" y="325" font-family="Arial, sans-serif" font-size="12" fill="#333">• Область значений: все возможные значения функции</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="450" cy="30" r="15" fill="#4A90E2" opacity="0.2"/>
  <circle cx="460" cy="40" r="10" fill="#5CB85C" opacity="0.2"/>
  <rect x="420" y="300" width="50" height="30" rx="3" fill="#E74C3C" opacity="0.2"/>
  
  <!-- Точка пересечения с осью Y -->
  <circle cx="100" cy="200" r="5" fill="#9B59B6"/>
  <text x="105" y="195" font-family="Arial, sans-serif" font-size="10" fill="#9B59B6">(0; 0)</text>
  
  <!-- Координатная сетка (тонкие линии) -->
  <g opacity="0.3">
    <line x1="100" y1="50" x2="100" y2="350" stroke="#CCC" stroke-width="0.5"/>
    <line x1="150" y1="50" x2="150" y2="350" stroke="#CCC" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="200" y2="350" stroke="#CCC" stroke-width="0.5"/>
    <line x1="250" y1="50" x2="250" y2="350" stroke="#CCC" stroke-width="0.5"/>
    <line x1="300" y1="50" x2="300" y2="350" stroke="#CCC" stroke-width="0.5"/>
    
    <line x1="50" y1="150" x2="400" y2="150" stroke="#CCC" stroke-width="0.5"/>
    <line x1="50" y1="100" x2="400" y2="100" stroke="#CCC" stroke-width="0.5"/>
    <line x1="50" y1="50" x2="400" y2="50" stroke="#CCC" stroke-width="0.5"/>
  </g>
</svg>