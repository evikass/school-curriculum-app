<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#805ad5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="url(#headerGrad)" />
  <text x="250" y="30" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <text x="20" y="80" fill="#2d3748" font-size="16" font-weight="bold" font-family="Arial">
    Урок 6. Уравнение и его корни
  </text>
  
  <!-- Основное определение -->
  <rect x="20" y="90" width="460" height="40" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="5" />
  <text x="30" y="105" fill="#2d3748" font-size="12" font-family="Arial">
    <tspan x="30" dy="0" font-weight="bold">Уравнение:</tspan>
    <tspan x="30" dy="16">Равенство с переменной, значение которой нужно найти</tspan>
  </text>
  
  <!-- Пример уравнения -->
  <text x="20" y="150" fill="#2d3748" font-size="14" font-weight="bold" font-family="Arial">
    Примеры уравнений:
  </text>
  
  <!-- Уравнение 1 -->
  <rect x="20" y="160" width="220" height="30" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" rx="3" />
  <text x="30" y="180" fill="#2d3748" font-size="13" font-family="Arial">
    2x + 3 = 7
  </text>
  
  <!-- Уравнение 2 -->
  <rect x="260" y="160" width="220" height="30" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" rx="3" />
  <text x="270" y="180" fill="#2d3748" font-size="13" font-family="Arial">
    x² - 4 = 0
  </text>
  
  <!-- Определение корня -->
  <rect x="20" y="200" width="460" height="40" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1" rx="5" />
  <text x="30" y="215" fill="#22543d" font-size="12" font-family="Arial">
    <tspan x="30" dy="0" font-weight="bold">Корень уравнения:</tspan>
    <tspan x="30" dy="16">Значение переменной, которое обращает уравнение в верное равенство</tspan>
  </text>
  
  <!-- График функции -->
  <g transform="translate(50, 250)">
    <!-- Система координат -->
    <line x1="0" y1="80" x2="200" y2="80" stroke="url(#axisGrad)" stroke-width="2" />
    <line x1="100" y1="0" x2="100" y2="80" stroke="url(#axisGrad)" stroke-width="2" />
    
    <!-- Стрелки -->
    <path d="M 200 80 L 195 75 M 200 80 L 195 85" stroke="#2d3748" stroke-width="1.5" fill="none" />
    <path d="M 100 0 L 95 5 M 100 0 L 105 5" stroke="#2d3748" stroke-width="1.5" fill="none" />
    
    <!-- Подписи осей -->
    <text x="205" y="85" fill="#2d3748" font-size="12" font-family="Arial">x</text>
    <text x="105" y="-5" fill="#2d3748" font-size="12" font-family="Arial">y</text>
    
    <!-- График функции y = x² - 4 -->
    <path d="M 20 60 Q 60 40, 100 20 T 180 60" 
          stroke="url(#formulaGrad)" stroke-width="2" fill="none" />
    
    <!-- Корни уравнения -->
    <circle cx="40" cy="60" r="3" fill="#e53e3e" />
    <circle cx="160" cy="60" r="3" fill="#e53e3e" />
    <text x="30" y="75" fill="#e53e3e" font-size="11" font-family="Arial">-2</text>
    <text x="155" y="75" fill="#e53e3e" font-size="11" font-family="Arial">2</text>
    
    <!-- Подпись функции -->
    <text x="120" y="15" fill="#6b46c1" font-size="12" font-family="Arial">y = x² - 4</text>
  </g>
  
  <!-- График 2 -->
  <g transform="translate(270, 250)">
    <!-- Система координат -->
    <line x1="0" y1="80" x2="200" y2="80" stroke="url(#axisGrad)" stroke-width="2" />
    <line x1="100" y1="0" x2="100" y2="80" stroke="url(#axisGrad)" stroke-width="2" />
    
    <!-- Стрелки -->
    <path d="M 200 80 L 195 75 M 200 80 L 195 85" stroke="#2d3748" stroke-width="1.5" fill="none" />
    <path d="M 100 0 L 95 5 M 100 0 L 105 5" stroke="#2d3748" stroke-width="1.5" fill="none" />
    
    <!-- Подписи осей -->
    <text x="205" y="85" fill="#2d3748" font-size="12" font-family="Arial">x</text>
    <text x="105" y="-5" fill="#2d3748" font-size="12" font-family="Arial">y</text>
    
    <!-- График функции y = 2x + 3 - 7 -->
    <line x1="20" y1="20" x2="180" y2="60" stroke="#3182ce" stroke-width="2" />
    
    <!-- Корень уравнения -->
    <circle cx="130" cy="50" r="3" fill="#e53e3e" />
    <text x="120" y="70" fill="#e53e3e" font-size="11" font-family="Arial">2</text>
    
    <!-- Подпись функции -->
    <text x="120" y="15" fill="#3182ce" font-size="12" font-family="Arial">y = 2x - 4</text>
  </g>
  
  <!-- Равносильные уравнения -->
  <text x="20" y="220" fill="#2d3748" font-size="14" font-weight="bold" font-family="Arial">
    Равносильные уравнения:
  </text>
  
  <!-- Связь между уравнениями -->
  <g transform="translate(150, 290)">
    <rect x="0" y="0" width="200" height="35" fill="#fef5e7" stroke="#f6e05e" stroke-width="1" rx="5" />
    <text x="10" y="20" fill="#744210" font-size="11" font-family="Arial">
      <tspan x="10" dy="0">Уравнения с одним</tspan>
      <tspan x="10" dy="15">множеством корней</tspan>
    </text>
  </g>
  
  <!-- Формула равносильности -->
  <rect x="20" y="330" width="460" height="15" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" rx="2" />
  <text x="250" y="341" text-anchor="middle" fill="#2d3748" font-size="11" font-family="Arial">
    ⇔ (знак равносильности)
  </text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="450" cy="100" r="15" fill="#bee3f8" opacity="0.3" />
  <circle cx="480" cy="120" r="10" fill="#c6f6d5" opacity="0.3" />
  <circle cx="30" cy="140" r="8" fill="#fed7d7" opacity="0.3" />
  
  <!-- Разделители -->
  <line x1="20" y1="125" x2="480" y2="125" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="20" y1="195" x2="480" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="20" y1="245" x2="480" y2="245" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- Маркеры -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="80" height="30" fill="#e6fffa" stroke="#81e6d9" stroke-width="1" rx="15" />
    <text x="40" y="20" text-anchor="middle" fill="#234e52" font-size="11" font-family="Arial">
      Определение
    </text>
  </g>
  
  <g transform="translate(400, 210)">
    <rect x="0" y="0" width="80" height="30" fill="#fef5e7" stroke="#f6e05e" stroke-width="1" rx="15" />
    <text x="40" y="20" text-anchor="middle" fill="#744210" font-size="11" font-family="Arial">
      Примеры
    </text>
  </g>
</svg>