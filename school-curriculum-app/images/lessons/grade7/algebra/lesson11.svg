<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#titleGrad)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Название урока -->
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">
    Урок 11. Линейная функция y = kx + b
  </text>
  
  <!-- Система координат -->
  <g transform="translate(80, 180)">
    <!-- Ось X -->
    <line x1="-40" y1="0" x2="280" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Ось Y -->
    <line x1="0" y1="120" x2="0" y2="-120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Стрелки -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
      </marker>
    </defs>
    
    <!-- Шкала X -->
    <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <text x="40" y="20" text-anchor="middle">1</text>
      <text x="80" y="20" text-anchor="middle">2</text>
      <text x="120" y="20" text-anchor="middle">3</text>
      <text x="160" y="20" text-anchor="middle">4</text>
      <text x="200" y="20" text-anchor="middle">5</text>
      <text x="240" y="20" text-anchor="middle">6</text>
      <text x="270" y="20" text-anchor="middle">x</text>
    </g>
    
    <!-- Шкала Y -->
    <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <text x="-10" y="-40" text-anchor="end">1</text>
      <text x="-10" y="-80" text-anchor="end">2</text>
      <text x="-10" y="-100" text-anchor="end">3</text>
      <text x="-10" y="40" text-anchor="end">-1</text>
      <text x="-10" y="80" text-anchor="end">-2</text>
      <text x="-10" y="100" text-anchor="end">y</text>
    </g>
    
    <!-- Сетка -->
    <g stroke="#cbd5e1" stroke-width="0.5" opacity="0.5">
      <line x1="40" y1="-120" x2="40" y2="120"/>
      <line x1="80" y1="-120" x2="80" y2="120"/>
      <line x1="120" y1="-120" x2="120" y2="120"/>
      <line x1="160" y1="-120" x2="160" y2="120"/>
      <line x1="200" y1="-120" x2="200" y2="120"/>
      <line x1="240" y1="-120" x2="240" y2="120"/>
      <line x1="-40" y1="-40" x2="280" y2="-40"/>
      <line x1="-40" y1="-80" x2="280" y2="-80"/>
      <line x1="-40" y1="40" x2="280" y2="40"/>
      <line x1="-40" y1="80" x2="280" y2="80"/>
    </g>
    
    <!-- Прямая y = x + 1 (k=1, b=1) -->
    <line x1="-40" y1="-80" x2="280" y2="160" stroke="url(#lineGrad1)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Прямая y = -0.5x + 3 (k=-0.5, b=3) -->
    <line x1="-40" y1="100" x2="280" y2="-20" stroke="url(#lineGrad2)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Точки на первой прямой -->
    <circle cx="0" cy="-80" r="4" fill="#3b82f6"/>
    <circle cx="40" cy="-40" r="4" fill="#3b82f6"/>
    <circle cx="80" cy="0" r="4" fill="#3b82f6"/>
    <circle cx="120" cy="40" r="4" fill="#3b82f6"/>
    
    <!-- Точки на второй прямой -->
    <circle cx="0" cy="100" r="4" fill="#10b981"/>
    <circle cx="40" cy="80" r="4" fill="#10b981"/>
    <circle cx="80" cy="60" r="4" fill="#10b981"/>
    <circle cx="120" cy="40" r="4" fill="#10b981"/>
  </g>
  
  <!-- Формулы и пояснения -->
  <g font-family="Arial, sans-serif">
    <!-- Общая формула -->
    <text x="320" y="100" font-size="14" font-weight="bold" fill="#1e293b">Линейная функция:</text>
    <text x="320" y="120" font-size="13" fill="#334155">y = kx + b</text>
    
    <!-- Параметры -->
    <text x="320" y="150" font-size="12" fill="#475569">где:</text>
    <text x="320" y="170" font-size="12" fill="#475569">k — коэффициент</text>
    <text x="320" y="190" font-size="12" fill="#475569">прямой угловой</text>
    <text x="320" y="210" font-size="12" fill="#475569">коэффициент</text>
    
    <text x="320" y="235" font-size="12" fill="#475569">b — свободный член</text>
    <text x="320" y="255" font-size="12" fill="#475569">(точка пересечения</text>
    <text x="320" y="275" font-size="12" fill="#475569">с осью Y)</text>
    
    <!-- Подписи к прямым -->
    <text x="320" y="100" font-size="11" fill="#3b82f6">y = x + 1</text>
    <text x="320" y="120" font-size="11" fill="#10b981">y = -0.5x + 3</text>
  </g>
  
  <!-- Свойства линейной функции -->
  <g transform="translate(50, 320)">
    <text font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      <tspan x="0" y="0">Свойства:</tspan>
      <tspan x="50" y="0">• Прямая линия</tspan>
      <tspan x="140" y="0">• k > 0 — возрастает</tspan>
      <tspan x="240" y="0">• k < 0 — убывает</tspan>
    </text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <rect x="40" y="280" width="420" height="2" fill="#e2e8f0" opacity="0.5"/>
  
  <!-- Угол наклона пример -->
  <g transform="translate(150, 100)">
    <rect x="-30" y="-20" width="60" height="40" fill="white" stroke="#cbd5e1" rx="5" opacity="0.9"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Угол наклона</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">α = arctg(k)</text>
  </g>
</svg>