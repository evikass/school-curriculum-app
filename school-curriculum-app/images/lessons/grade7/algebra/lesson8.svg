<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="circleGrad">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#blueGrad)"/>
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Урок 8 -->
  <text x="250" y="85" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Урок 8. Решение задач уравнениями</text>
  
  <!-- Система координат -->
  <g transform="translate(80, 120)">
    <!-- Ось X -->
    <line x1="0" y1="150" x2="200" y2="150" stroke="#333" stroke-width="2"/>
    <path d="M 200 150 L 195 145 M 200 150 L 195 155" stroke="#333" stroke-width="2" fill="none"/>
    <text x="205" y="155" fill="#333" font-size="14" font-family="Arial">x</text>
    
    <!-- Ось Y -->
    <line x1="0" y1="150" x2="0" y2="0" stroke="#333" stroke-width="2"/>
    <path d="M 0 0 L -5 5 M 0 0 L 5 5" stroke="#333" stroke-width="2" fill="none"/>
    <text x="5" y="5" fill="#333" font-size="14" font-family="Arial">y</text>
    
    <!-- Сетка -->
    <g stroke="#ddd" stroke-width="0.5">
      <line x1="40" y1="150" x2="40" y2="0"/>
      <line x1="80" y1="150" x2="80" y2="0"/>
      <line x1="120" y1="150" x2="120" y2="0"/>
      <line x1="160" y1="150" x2="160" y2="0"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="90" x2="200" y2="90"/>
      <line x1="0" y1="60" x2="200" y2="60"/>
      <line x1="0" y1="30" x2="200" y2="30"/>
    </g>
    
    <!-- График функции y = 2x + 1 -->
    <path d="M 0 90 L 40 50 L 80 10 L 120 -30 L 160 -70 L 200 -110" 
          stroke="url(#greenGrad)" stroke-width="3" fill="none"/>
    
    <!-- График функции y = -x + 80 -->
    <path d="M 0 80 L 40 40 L 80 0 L 120 -40 L 160 -80 L 200 -120" 
          stroke="url(#purpleGrad)" stroke-width="3" fill="none"/>
    
    <!-- Точка пересечения -->
    <circle cx="26" cy="52" r="5" fill="url(#circleGrad)"/>
    <text x="30" y="45" fill="#e67e22" font-size="12" font-family="Arial">x=26</text>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="170" height="80" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="10" y="20" fill="#333" font-size="14" font-family="Arial">Пример:</text>
    <text x="10" y="40" fill="#333" font-size="12" font-family="Arial">2x + 1 = y</text>
    <text x="10" y="55" fill="#333" font-size="12" font-family="Arial">-x + 80 = y</text>
    <text x="10" y="75" fill="#333" font-size="12" font-family="Arial">2x + 1 = -x + 80</text>
  </g>
  
  <!-- Текстовые задачи -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="440" height="100" fill="white" stroke="#4a90e2" stroke-width="2" rx="8"/>
    
    <!-- Задача 1 -->
    <rect x="10" y="10" width="200" height="40" fill="url(#blueGrad)" rx="5"/>
    <text x="15" y="30" fill="white" font-size="12" font-family="Arial">Задача 1</text>
    <text x="15" y="45" fill="white" font-size="11" font-family="Arial">Скорость поезда 60 км/ч</text>
    
    <!-- Задача 2 -->
    <rect x="230" y="10" width="200" height="40" fill="url(#greenGrad)" rx="5"/>
    <text x="235" y="30" fill="white" font-size="12" font-family="Arial">Задача 2</text>
    <text x="235" y="45" fill="white" font-size="11" font-family="Arial">Время движения 2 часа</text>
    
    <!-- Задача 3 -->
    <rect x="10" y="60" width="200" height="30" fill="url(#purpleGrad)" rx="5"/>
    <text x="15" y="80" fill="white" font-size="12" font-family="Arial">Задача 3: Расстояние?</text>
    
    <!-- Подсказка -->
    <text x="235" y="75" fill="#666" font-size="11" font-family="Arial">S = v · t</text>
    <text x="235" y="88" fill="#666" font-size="10" font-family="Arial">S = 60 · 2 = 120 км</text>
  </g>
  
  <!-- Уравнения -->
  <g transform="translate(100, 160)">
    <text x="0" y="0" fill="#e74c3c" font-size="14" font-weight="bold">Уравнение:</text>
    <text x="0" y="20" fill="#333" font-size="12" font-family="Arial">x + (x + 5) = 31</text>
    <text x="0" y="40" fill="#333" font-size="12" font-family="Arial">2x + 5 = 31</text>
    <text x="0" y="60" fill="#333" font-size="12" font-family="Arial">2x = 26</text>
    <text x="0" y="80" fill="#333" font-size="12" font-family="Arial">x = 13</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="180" r="15" fill="none" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
  <circle cx="450" cy="50" r="20" fill="none" stroke="#5cb85c" stroke-width="2" opacity="0.3"/>
  <polygon points="420,200 430,190 440,200 430,210" fill="url(#circleGrad)" opacity="0.5"/>
  
  <!-- Пояснения -->
  <text x="250" y="205" text-anchor="middle" fill="#666" font-size="11" font-family="Arial">Текстовые задачи решаются через составление уравнений</text>
  
  <!-- Шкала времени -->
  <g transform="translate(350, 180)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="25" y1="-5" x2="25" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="-5" x2="75" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="#333" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" fill="#333" font-size="10" font-family="Arial">0</text>
    <text x="50" y="15" text-anchor="middle" fill="#333" font-size="10" font-family="Arial">t</text>
    <text x="100" y="15" text-anchor="middle" fill="#333" font-size="10" font-family="Arial">T</text>
  </g>
  
  <!-- Вектор скорости -->
  <g transform="translate(180, 200)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="20" y="-5" text-anchor="middle" fill="#e74c3c" font-size="10" font-family="Arial">v</text>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Дополнительные формулы -->
  <text x="30" y="325" fill="#666" font-size="10" font-family="Arial">Формулы: S = vt, v = S/t, t = S/v</text>
  <text x="30" y="340" fill="#666" font-size="10" font-family="Arial">Пример: S = 120 км, t = 2 ч, v = 60 км/ч</text>
</svg>