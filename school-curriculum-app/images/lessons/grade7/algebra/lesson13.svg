<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для линий -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#95e1d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fc1c9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Фильтр для тени -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e">
    Урок 13. Взаимное расположение графиков
  </text>
  
  <!-- Система координат -->
  <g id="coordinateSystem">
    <!-- Ось X -->
    <line x1="50" y1="250" x2="450" y2="250" stroke="#34495e" stroke-width="2"/>
    <!-- Ось Y -->
    <line x1="150" y1="80" x2="150" y2="320" stroke="#34495e" stroke-width="2"/>
    
    <!-- Стрелка на оси X -->
    <polygon points="450,250 440,245 440,255" fill="#34495e"/>
    <!-- Стрелка на оси Y -->
    <polygon points="150,80 145,90 155,90" fill="#34495e"/>
    
    <!-- Шкала X -->
    <text x="50" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">-4</text>
    <text x="100" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">-3</text>
    <text x="150" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">-2</text>
    <text x="200" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">-1</text>
    <text x="250" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">0</text>
    <text x="300" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">1</text>
    <text x="350" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">2</text>
    <text x="400" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="450" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">4</text>
    
    <!-- Шкала Y -->
    <text x="135" y="255" font-family="Arial" font-size="12" text-anchor="end" fill="#7f8c8d">0</text>
    <text x="135" y="205" font-family="Arial" font-size="12" text-anchor="end" fill="#7f8c8d">1</text>
    <text x="135" y="155" font-family="Arial" font-size="12" text-anchor="end" fill="#7f8c8d">2</text>
    <text x="135" y="105" font-family="Arial" font-size="12" text-anchor="end" fill="#7f8c8d">3</text>
    <text x="135" y="85" font-family="Arial" font-size="12" text-anchor="end" fill="#7f8c8d">4</text>
    
    <!-- Подписи осей -->
    <text x="465" y="255" font-family="Arial" font-size="14" fill="#2c3e50">x</text>
    <text x="155" y="75" font-family="Arial" font-size="14" fill="#2c3e50">y</text>
  </g>
  
  <!-- Первая пара параллельных линий -->
  <g id="parallelLines1">
    <!-- Линия y = x + 1 -->
    <line x1="50" y1="200" x2="450" y2="100" stroke="url(#redGradient)" stroke-width="3" filter="url(#shadow)"/>
    <text x="420" y="95" font-family="Arial" font-size="14" fill="#ee5a6f" font-weight="bold">y = x + 1</text>
    
    <!-- Линия y = x - 1 -->
    <line x1="50" y1="300" x2="450" y2="200" stroke="url(#blueGradient)" stroke-width="3" filter="url(#shadow)"/>
    <text x="420" y="195" font-family="Arial" font-size="14" fill="#44a08d" font-weight="bold">y = x - 1</text>
    
    <!-- Подпись параллельности -->
    <text x="250" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#e74c3c">параллельные</text>
  </g>
  
  <!-- Вторая пара пересекающихся линий -->
  <g id="intersectingLines">
    <!-- Линия y = 2x -->
    <line x1="50" y1="250" x2="350" y2="50" stroke="url(#greenGradient)" stroke-width="3" filter="url(#shadow)"/>
    <text x="355" y="45" font-family="Arial" font-size="14" fill="#3fc1c9" font-weight="bold">y = 2x</text>
    
    <!-- Линия y = -x + 3 -->
    <line x1="50" y1="100" x2="350" y2="250" stroke="#9b59b6" stroke-width="3" filter="url(#shadow)"/>
    <text x="355" y="245" font-family="Arial" font-size="14" fill="#9b59b6" font-weight="bold">y = -x + 3</text>
    
    <!-- Точка пересечения -->
    <circle cx="200" cy="150" r="5" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="215" y="145" font-family="Arial" font-size="12" fill="#e74c3c">(1, 1)</text>
    
    <!-- Подпись пересечения -->
    <text x="250" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#9b59b6">пересекаются</text>
  </g>
  
  <!-- Вертикальные линии (перпендикулярные оси Y) -->
  <g id="verticalLines">
    <!-- Линия x = 2 -->
    <line x1="250" y1="80" x2="250" y2="320" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5" filter="url(#shadow)"/>
    <text x="255" y="95" font-family="Arial" font-size="14" fill="#f39c12" font-weight="bold">x = 2</text>
    
    <!-- Линия x = -1 -->
    <line x1="200" y1="80" x2="200" y2="320" stroke="#e67e22" stroke-width="3" stroke-dasharray="5,5" filter="url(#shadow)"/>
    <text x="205" y="95" font-family="Arial" font-size="14" fill="#e67e22" font-weight="bold">x = -1</text>
    
    <!-- Подпись вертикальных линий -->
    <text x="225" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#e67e22">вертикальные</text>
  </g>
  
  <!-- Горизонтальные линии -->
  <g id="horizontalLines">
    <!-- Линия y = 2 -->
    <line x1="50" y1="150" x2="450" y2="150" stroke="#16a085" stroke-width="3" stroke-dasharray="8,4" filter="url(#shadow)"/>
    <text x="455" y="155" font-family="Arial" font-size="14" fill="#16a085" font-weight="bold">y = 2</text>
    
    <!-- Линия y = -1 -->
    <line x1="50" y1="300" x2="450" y2="300" stroke="#27ae60" stroke-width="3" stroke-dasharray="8,4" filter="url(#shadow)"/>
    <text x="455" y="305" font-family="Arial" font-size="14" fill="#27ae60" font-weight="bold">y = -1</text>
    
    <!-- Подпись горизонтальных линий -->
    <text x="30" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#27ae60" transform="rotate(-90 30 225)">горизонтальные</text>
  </g>
  
  <!-- Угол между линиями -->
  <g id="angle">
    <path d="M 200 150 Q 220 130 240 130" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="260" y="125" font-family="Arial" font-size="12" fill="#e74c3c">α</text>
  </g>
  
  <!-- Стрелка для угла -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Формулы в рамке -->
  <g id="formulas">
    <rect x="20" y="20" width="460" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="250" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">
      k₁ = k₂ - параллельные, k₁ ≠ k₂ - пересекаются
    </text>
  </g>
  
  <!-- Легенда -->
  <g id="legend">
    <rect x="350" y="280" width="140" height="60" fill="#ffffff" stroke="#95a5a6" stroke-width="1" rx="3" filter="url(#shadow)"/>
    <text x="420" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">Легенда:</text>
    <line x1="360" y1="310" x2="380" y2="310" stroke="url(#redGradient)" stroke-width="3"/>
    <text x="385" y="315" font-family="Arial" font-size="10" fill="#2c3e50">прямая</text>
    <line x1="360" y1="325" x2="380" y2="325" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="385" y="330" font-family="Arial" font-size="10" fill="#2c3e50">вертикаль</text>
  </g>
  
  <!-- Номера точек на графиках -->
  <g id="points">
    <circle cx="100" cy="200" r="3" fill="#2c3e50"/>
    <text x="105" y="195" font-family="Arial" font-size="10" fill="#2c3e50">A</text>
    
    <circle cx="300" cy="150" r="3" fill="#2c3e50"/>
    <text x="305" y="145" font-family="Arial" font-size="10" fill="#2c3e50">B</text>
    
    <circle cx="150" cy="250" r="3" fill="#2c3e50"/>
    <text x="155" y="255" font-family="Arial" font-size="10" fill="#2c3e50">O</text>
  </g>
  
  <!-- Координатная сетка (тонкая) -->
  <g id="grid" opacity="0.3">
    <!-- Вертикальные линии сетки -->
    <line x1="100" y1="80" x2="100" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="200" y1="80" x2="200" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="250" y1="80" x2="250" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="300" y1="80" x2="300" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="350" y1="80" x2="350" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="400" y1="80" x2="400" y2="320" stroke="#95a5a6" stroke-width="0.5"/>
    
    <!-- Горизонтальные линии сетки -->
    <line x1="50" y1="100" x2="450" y2="100" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="50" y1="150" x2="450" y2="150" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="50" y1="200" x2="450" y2="200" stroke="#95a5a6" stroke-width="0.5"/>
    <line x1="50" y1="300" x2="450" y2="300" stroke="#95a5a6" stroke-width="0.5"/>
  </g>
</svg>