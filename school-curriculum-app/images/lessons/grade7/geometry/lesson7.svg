<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:0.5" />
    </linearGradient>
    
    <linearGradient id="medianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bisectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="heightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#805ad5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d3748">
    ГЕОМЕТРИЯ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">
    Урок 7. Медианы, биссектрисы, высоты
  </text>
  
  <!-- Треугольник ABC -->
  <g id="triangle">
    <path d="M 150 250 L 350 250 L 250 100 Z" fill="url(#triangleGrad)" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Вершины -->
    <circle cx="150" cy="250" r="5" fill="#2b6cb0"/>
    <circle cx="350" cy="250" r="5" fill="#2b6cb0"/>
    <circle cx="250" cy="100" r="5" fill="#2b6cb0"/>
    
    <!-- Обозначения вершин -->
    <text x="140" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2b6cb0">A</text>
    <text x="360" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2b6cb0">B</text>
    <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2b6cb0">C</text>
  </g>
  
  <!-- Медиана из вершины C -->
  <g id="median">
    <line x1="250" y1="100" x2="250" y2="250" stroke="url(#medianGrad)" stroke-width="3" stroke-dasharray="5,3"/>
    <circle cx="250" cy="175" r="4" fill="#e53e3e"/>
    <text x="260" y="175" font-family="Arial, sans-serif" font-size="14" fill="#e53e3e">M</text>
    <text x="260" y="190" font-family="Arial, sans-serif" font-size="12" fill="#e53e3e">точка середины</text>
    <path d="M 255 105 L 260 115 L 250 115 Z" fill="#e53e3e" opacity="0.8"/>
  </g>
  
  <!-- Биссектриса из вершины B -->
  <g id="bisector">
    <line x1="350" y1="250" x2="180" y2="160" stroke="url(#bisectorGrad)" stroke-width="3"/>
    <path d="M 345 245 L 355 245 L 350 255 Z" fill="#48bb78" opacity="0.8"/>
    <text x="320" y="220" font-family="Arial, sans-serif" font-size="14" fill="#48bb78">биссектриса</text>
    <text x="320" y="235" font-family="Arial, sans-serif" font-size="12" fill="#48bb78">∠B</text>
  </g>
  
  <!-- Высота из вершины A -->
  <g id="height">
    <line x1="150" y1="250" x2="250" y2="250" stroke="url(#heightGrad)" stroke-width="3"/>
    <rect x="195" y="245" width="10" height="10" fill="#9f7aea" opacity="0.8"/>
    <text x="120" y="270" font-family="Arial, sans-serif" font-size="14" fill="#9f7aea">высота</text>
    <text x="120" y="285" font-family="Arial, sans-serif" font-size="12" fill="#9f7aea">hₐ</text>
  </g>
  
  <!-- Середины сторон -->
  <g id="midpoints">
    <!-- Середина AB -->
    <circle cx="250" cy="250" r="3" fill="#2b6cb0"/>
    <text x="260" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">K</text>
    
    <!-- Середина AC -->
    <circle cx="200" cy="175" r="3" fill="#2b6cb0"/>
    <text x="210" y="175" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">P</text>
    
    <!-- Середина BC -->
    <circle cx="300" cy="175" r="3" fill="#2b6cb0"/>
    <text x="310" y="175" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">Q</text>
  </g>
  
  <!-- Углы -->
  <g id="angles">
    <!-- Угол A -->
    <path d="M 170 250 A 20 20 0 0 0 165 235" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="175" y="240" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">∠A</text>
    
    <!-- Угол B -->
    <path d="M 330 250 A 20 20 0 0 1 335 235" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="325" y="240" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">∠B</text>
    
    <!-- Угол C -->
    <path d="M 250 120 A 20 20 0 0 0 235 135" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="255" y="125" font-family="Arial, sans-serif" font-size="12" fill="#2b6cb0">∠C</text>
  </g>
  
  <!-- Стороны -->
  <g id="sides">
    <!-- Сторона AB -->
    <text x="250" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2b6cb0">c</text>
    
    <!-- Сторона AC -->
    <text x="190" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2b6cb0">b</text>
    
    <!-- Сторона BC -->
    <text x="310" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2b6cb0">a</text>
  </g>
  
  <!-- Вспомогательные линии -->
  <g id="auxiliary" opacity="0.5">
    <!-- Отмеченные углы для биссектрисы -->
    <path d="M 340 240 A 15 15 0 0 1 335 225" fill="none" stroke="#48bb78" stroke-width="1"/>
    <path d="M 335 225 A 15 15 0 0 1 330 240" fill="none" stroke="#48bb78" stroke-width="1"/>
    
    <!-- Прямой угол для высоты -->
    <path d="M 155 250 L 155 240 L 165 240" fill="none" stroke="#9f7aea" stroke-width="1.5"/>
    <path d="M 165 245 L 165 255" stroke="#9f7aea" stroke-width="1"/>
  </g>
  
  <!-- Легенда -->
  <g id="legend">
    <rect x="20" y="290" width="460" height="50" fill="white" opacity="0.9" rx="5" filter="url(#shadow)"/>
    
    <!-- Медиана -->
    <line x1="40" y1="305" x2="70" y2="305" stroke="#e53e3e" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="80" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Медиана — отрезок от вершины до середины противоположной стороны</text>
    
    <!-- Биссектриса -->
    <line x1="40" y1="320" x2="70" y2="320" stroke="#48bb78" stroke-width="3"/>
    <text x="80" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Биссектриса — отрезок, делящий угол пополам</text>
    
    <!-- Высота -->
    <line x1="280" y1="305" x2="310" y2="305" stroke="#9f7aea" stroke-width="3"/>
    <text x="320" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Высота — перпендикуляр из вершины на противоположную сторону</text>
  </g>
</svg>