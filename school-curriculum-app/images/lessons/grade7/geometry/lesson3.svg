<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="centerGrad">
      <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
    ГЕОМЕТРИЯ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495E">
    Урок 3. Сравнение и измерение углов
  </text>
  
  <!-- Основной угловой измеритель -->
  <g transform="translate(150, 200)">
    <!-- Дуги углов -->
    <path d="M 0,-80 A 80,80 0 0,1 56.57,-56.57" fill="none" stroke="url(#blueGrad)" stroke-width="3" opacity="0.8"/>
    <path d="M 0,-80 A 80,80 0 0,1 80,0" fill="none" stroke="url(#greenGrad)" stroke-width="3" opacity="0.8"/>
    <path d="M 0,-80 A 80,80 0 0,1 0,80" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- Радиусы -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="56.57" y2="-56.57" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Центр -->
    <circle cx="0" cy="0" r="5" fill="url(#centerGrad)" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Разметка градусов -->
    <text x="0" y="-90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">0°</text>
    <text x="65" y="-65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4A90E2">45°</text>
    <text x="90" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5CB85C">90°</text>
    <text x="5" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#F0AD4E">180°</text>
    
    <!-- Угол между 0° и 45° -->
    <path d="M 20,-20 L 20,-35 A 15,15 0 0,1 35.36,-35.36 Z" fill="#4A90E2" opacity="0.3"/>
    <text x="30" y="-28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">α</text>
  </g>
  
  <!-- Транспортир -->
  <g transform="translate(350, 200)">
    <!-- Дуги транспортира -->
    <path d="M -60,0 A 60,60 0 0,1 60,0" fill="none" stroke="#95A5A6" stroke-width="2"/>
    <path d="M -50,0 A 50,50 0 0,1 50,0" fill="none" stroke="#BDC3C7" stroke-width="1"/>
    
    <!-- Штрихи градусов -->
    <g stroke="#2C3E50" stroke-width="1">
      <line x1="-60" y1="0" x2="-55" y2="0"/>
      <line x1="-42.43" y1="-42.43" x2="-39.14" y2="-39.14"/>
      <line x1="0" y1="-60" x2="0" y2="-55"/>
      <line x1="42.43" y1="-42.43" x2="39.14" y2="-39.14"/>
      <line x1="60" y1="0" x2="55" y2="0"/>
    </g>
    
    <!-- Подписи градусов -->
    <text x="-65" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">0°</text>
    <text x="-45" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">45°</text>
    <text x="5" y="-65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">90°</text>
    <text x="45" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">135°</text>
    <text x="65" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">180°</text>
    
    <!-- Указатель угла -->
    <line x1="0" y1="0" x2="42.43" y2="-42.43" stroke="#E74C3C" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#E74C3C"/>
    <text x="25" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" font-weight="bold">75°</text>
  </g>
  
  <!-- Прямой угол -->
  <g transform="translate(100, 100)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 0,0 L 10,0 L 10,10 L 0,10 Z" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">90°</text>
    <text x="-40" y="25" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">Прямой угол</text>
  </g>
  
  <!-- Острый угол -->
  <g transform="translate(200, 100)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="43.3" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 0,0 L 0,10 L 10,10" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">60°</text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">Острый угол</text>
  </g>
  
  <!-- Тупой угол -->
  <g transform="translate(300, 100)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="-25" y2="43.3" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 0,0 L -10,0 L -10,-10" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">120°</text>
    <text x="5" y="55" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">Тупой угол</text>
  </g>
  
  <!-- Развёрнутый угол -->
  <g transform="translate(400, 100)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <line x1="0" y1="0" x2="-50" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 0,0 L -10,0 L -10,10" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">180°</text>
    <text x="-40" y="55" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">Развёрнутый</text>
  </g>
  
  <!-- Линейка с угловой разметкой -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="400" height="30" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <!-- Штрихи -->
    <g stroke="#2C3E50" stroke-width="1">
      <line x1="50" y1="5" x2="50" y2="25"/>
      <line x1="100" y1="5" x2="100" y2="25"/>
      <line x1="150" y1="5" x2="150" y2="25"/>
      <line x1="200" y1="5" x2="200" y2="25"/>
      <line x1="250" y1="5" x2="250" y2="25"/>
      <line x1="300" y1="5" x2="300" y2="25"/>
      <line x1="350" y1="5" x2="350" y2="25"/>
    </g>
    <!-- Цифры -->
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">0°</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">30°</text>
    <text x="150" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">60°</text>
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">90°</text>
    <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">120°</text>
    <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">150°</text>
    <text x="350" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">180°</text>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495E" font-weight="bold">Градусная шкала</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="250" cy="250" r="80" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <rect x="30" y="250" width="20" height="20" fill="url(#blueGrad)" opacity="0.8" transform="rotate(45 40 260)"/>
  <rect x="450" y="250" width="20" height="20" fill="url(#greenGrad)" opacity="0.8" transform="rotate(45 460 260)"/>
  
  <!-- Указатели -->
  <g>
    <line x1="250" y1="250" x2="280" y2="220" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="250" x2="220" y2="220" stroke="#3498DB" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Надписи и пояснения -->
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="11" fill="#666">Биссектриса</text>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="11" fill="#666">Стороны угла</text>
  
  <!-- Рамка оформления -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#BDC3C7" stroke-width="2" rx="10"/>
</svg>