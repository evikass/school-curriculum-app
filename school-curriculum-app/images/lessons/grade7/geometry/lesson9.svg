<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="angleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="arcGrad">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">
    Урок 9. Сумма углов треугольника
  </text>
  
  <!-- Треугольник -->
  <g transform="translate(250, 200)">
    <!-- Основной треугольник -->
    <path d="M -100 0 L 100 0 L 0 -80 Z" fill="url(#triangleGrad)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Вершины треугольника -->
    <circle cx="-100" cy="0" r="4" fill="#1e40af"/>
    <circle cx="100" cy="0" r="4" fill="#1e40af"/>
    <circle cx="0" cy="-80" r="4" fill="#1e40af"/>
    
    <!-- Обозначения вершин -->
    <text x="-100" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">A</text>
    <text x="100" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">B</text>
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">C</text>
    
    <!-- Угол при вершине A -->
    <path d="M -20 0 A 20 20 0 0 0 -20 -20" fill="none" stroke="url(#angleGrad)" stroke-width="2"/>
    <text x="-35" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">α</text>
    
    <!-- Угол при вершине B -->
    <path d="M 20 0 A 20 20 0 0 1 20 -20" fill="none" stroke="url(#angleGrad)" stroke-width="2"/>
    <text x="25" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">β</text>
    
    <!-- Угол при вершине C -->
    <path d="M 0 -60 A 20 20 0 0 1 20 -40" fill="none" stroke="url(#angleGrad)" stroke-width="2"/>
    <text x="10" y="-55" font-family="Arial, sans-serif" font-size="14" fill="#dc2626">γ</text>
    
    <!-- Сумма углов -->
    <path d="M -30 -10 A 30 30 0 0 1 30 -10" fill="none" stroke="url(#arcGrad)" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#059669">180°</text>
  </g>
  
  <!-- Формула суммы углов -->
  <g transform="translate(250, 280)">
    <rect x="-80" y="-20" width="160" height="40" fill="white" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">
      α + β + γ = 180°
    </text>
  </g>
  
  <!-- Дополнительные элементы для демонстрации -->
  <!-- Пример 1: Прямоугольный треугольник -->
  <g transform="translate(80, 200)">
    <path d="M -30 0 L 30 0 L 30 -30 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Прямоугольный</text>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">90° + α + β = 180°</text>
  </g>
  
  <!-- Пример 2: Равносторонний треугольник -->
  <g transform="translate(420, 200)">
    <path d="M -25 15 L 25 15 L 0 -15 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Равносторонний</text>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">60° + 60° + 60° = 180°</text>
  </g>
  
  <!-- Указатель на сумму углов -->
  <g transform="translate(250, 140)">
    <path d="M 0 0 L 0 -30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="10" y="-15" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Сумма углов</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Дополнительные подписи -->
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Теорема:</text>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Сумма углов любого</text>
  <text x="20" y="135" font-family="Arial, sans-serif" font-size="12" fill="#64748b">треугольника равна 180°</text>
  
  <!-- Пунктирная линия для демонстрации -->
  <line x1="100" y1="280" x2="400" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Номера страниц -->
  <text x="20" y="330" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Страница 9</text>
  <text x="470" y="330" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Геометрия 7</text>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="15" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="320" r="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Комментарий -->
  <rect x="320" y="90" width="160" height="60" fill="white" stroke="#e2e8f0" stroke-width="1" rx="5"/>
  <text x="330" y="110" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Важное замечание:</text>
  <text x="330" y="125" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Это свойство верно</text>
  <text x="330" y="140" font-family="Arial, sans-serif" font-size="11" fill="#64748b">для всех треугольников</text>
</svg>