<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый элемент -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="40" rx="5" fill="#8e44ad" opacity="0.9"/>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ИНФОРМАТИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="90" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Условия и ветвления</text>
  
  <!-- Основной контейнер -->
  <rect x="40" y="110" width="420" height="220" rx="10" fill="white" stroke="#8e44ad" stroke-width="2"/>
  
  <!-- Левая секция: Условие -->
  <rect x="60" y="130" width="180" height="180" rx="5" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Условие</text>
  
  <!-- Ромб условия -->
  <path d="M150 180 L200 220 L150 260 L100 220 Z" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="14">x > 0</text>
  
  <!-- Стрелки от условия -->
  <line x1="200" y1="220" x2="260" y2="220" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="260" x2="150" y2="280" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Надписи на стрелках -->
  <text x="230" y="215" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="12">Да</text>
  <text x="170" y="275" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="12">Нет</text>
  
  <!-- Правая секция: Ветви -->
  <rect x="260" y="130" width="180" height="80" rx="5" fill="#e8d5f2" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="350" y="155" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Ветвь 1</text>
  <text x="350" y="180" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="14">y = x * 2</text>
  <circle cx="350" cy="195" r="3" fill="#8e44ad"/>
  
  <rect x="260" y="230" width="180" height="80" rx="5" fill="#d5c4e8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="350" y="255" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Ветвь 2</text>
  <text x="350" y="280" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="14">y = -x</text>
  <circle cx="350" cy="295" r="3" fill="#8e44ad"/>
  
  <!-- Оператор if -->
  <rect x="60" y="130" width="80" height="30" rx="5" fill="#8e44ad"/>
  <text x="100" y="150" text-anchor="middle" fill="white" font-family="monospace" font-size="14">if x > 0</text>
  
  <!-- Операторы ветвей -->
  <rect x="270" y="165" width="60" height="25" rx="3" fill="#8e44ad" opacity="0.8"/>
  <text x="300" y="182" text-anchor="middle" fill="white" font-family="monospace" font-size="12">{ y = x * 2; }</text>
  
  <rect x="270" y="265" width="60" height="25" rx="3" fill="#8e44ad" opacity="0.8"/>
  <text x="300" y="282" text-anchor="middle" fill="white" font-family="monospace" font-size="12">{ y = -x; }</text>
  
  <!-- Блок-схема пример -->
  <text x="250" y="340" text-anchor="middle" fill="#8e44ad" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Пример: выбор действия в зависимости от условия</text>
  
  <!-- Иконки -->
  <!-- Лампочка (идея) -->
  <circle cx="70" cy="100" r="15" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <path d="M70 93 Q65 98 65 103 Q65 108 70 113 Q75 108 75 103 Q75 98 70 93" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="67" y="113" width="6" height="4" fill="#8e44ad"/>
  
  <!-- Кодовый блок -->
  <rect x="420" y="95" width="40" height="30" rx="3" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="440" y="115" text-anchor="middle" fill="#8e44ad" font-family="monospace" font-size="12">&lt;/&gt;</text>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="90" cy="250" r="8" fill="#e8d5f2" opacity="0.5"/>
  <circle cx="110" cy="270" r="6" fill="#d5c4e8" opacity="0.5"/>
  <circle cx="380" cy="150" r="7" fill="#e8d5f2" opacity="0.5"/>
  <circle cx="400" cy="170" r="5" fill="#d5c4e8" opacity="0.5"/>
  
  <!-- Точки для акцента -->
  <circle cx="130" cy="190" r="2" fill="#8e44ad"/>
  <circle cx="170" cy="190" r="2" fill="#8e44ad"/>
  <circle cx="130" cy="250" r="2" fill="#8e44ad"/>
  <circle cx="170" cy="250" r="2" fill="#8e44ad"/>
  
  <!-- Линии декора -->
  <line x1="220" y1="170" x2="240" y2="170" stroke="#8e44ad" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="220" y1="270" x2="240" y2="270" stroke="#8e44ad" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Ключевые понятия -->
  <text x="70" y="320" fill="#8e44ad" font-family="Arial, sans-serif" font-size="11">• условие</text>
  <text x="150" y="320" fill="#8e44ad" font-family="Arial, sans-serif" font-size="11">• ветвление</text>
  <text x="230" y="320" fill="#8e44ad" font-family="Arial, sans-serif" font-size="11">• if</text>
  <text x="290" y="320" fill="#8e44ad" font-family="Arial, sans-serif" font-size="11">• else</text>
  <text x="350" y="320" fill="#8e44ad" font-family="Arial, sans-serif" font-size="11">• блок кода</text>
  
  <!-- Примеры значений -->
  <text x="90" y="210" text-anchor="middle" fill="#8e44ad" font-family="monospace" font-size="10">x = 5</text>
  <text x="210" y="210" text-anchor="middle" fill="#8e44ad" font-family="monospace" font-size="10">x = -3</text>
  
  <!-- Иконки веток -->
  <path d="M430 140 L440 135 L440 145 Z" fill="#8e44ad"/>
  <path d="M450 140 L460 135 L460 145 Z" fill="#8e44ad"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="50" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">Основы программирования</text>
  <text x="100" y="175" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">логическое выражение</text>
  <text x="150" y="295" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">альтернативный путь</text>
  
  <!-- Дополнительные графические элементы -->
  <rect x="320" y="185" width="60" height="15" rx="2" fill="#8e44ad" opacity="0.2"/>
  <rect x="320" y="285" width="60" height="15" rx="2" fill="#8e44ad" opacity="0.2"/>
  
  <!-- Точки для структуры -->
  <circle cx="80" cy="200" r="1.5" fill="#8e44ad"/>
  <circle cx="80" cy="210" r="1.5" fill="#8e44ad"/>
  <circle cx="80" cy="220" r="1.5" fill="#8e44ad"/>
  
  <!-- Указатели -->
  <path d="M95 205 L100 205" stroke="#8e44ad" stroke-width="1.5"/>
  <path d="M95 215 L100 215" stroke="#8e44ad" stroke-width="1.5"/>
  <path d="M95 225 L100 225" stroke="#8e44ad" stroke-width="1.5"/>
</svg>