<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <rect x="10" y="10" width="480" height="330" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#8e44ad">ИНФОРМАТИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#8e44ad">Основы CSS</text>
  <text x="250" y="78" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">Создание сайтов</text>
  
  <!-- HTML структура слева -->
  <g id="html-structure">
    <rect x="30" y="100" width="180" height="200" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="120" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad">HTML</text>
    
    <rect x="50" y="140" width="140" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="157" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">&lt;html&gt;</text>
    
    <rect x="50" y="170" width="140" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="187" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">&lt;head&gt;</text>
    
    <rect x="50" y="200" width="140" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="217" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">&lt;title&gt;</text>
    
    <rect x="50" y="230" width="140" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="247" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">&lt;/title&gt;</text>
    
    <rect x="50" y="260" width="140" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="277" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">&lt;/head&gt;</text>
  </g>
  
  <!-- CSS стили справа -->
  <g id="css-styles">
    <rect x="250" y="100" width="180" height="200" fill="#f5f5f5" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="340" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8e44ad">CSS</text>
    
    <rect x="270" y="140" width="140" height="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="340" y="157" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">body {</text>
    
    <rect x="280" y="170" width="120" height="20" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="340" y="183" font-family="monospace" font-size="9" text-anchor="middle" fill="#333">color: #333;</text>
    
    <rect x="280" y="195" width="120" height="20" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="340" y="208" font-family="monospace" font-size="9" text-anchor="middle" fill="#333">font-size: 16px;</text>
    
    <rect x="270" y="220" width="140" height="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="340" y="237" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">}</text>
    
    <rect x="270" y="250" width="140" height="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="340" y="267" font-family="monospace" font-size="10" text-anchor="middle" fill="#333">h1 { color: #8e44ad; }</text>
  </g>
  
  <!-- Стрелка связи -->
  <path d="M 210 200 L 250 200" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
  
  <!-- Свойства CSS -->
  <g id="css-properties">
    <rect x="50" y="320" width="400" height="20" fill="#f0f0f0" stroke="#8e44ad" stroke-width="1" rx="3"/>
    <text x="60" y="334" font-family="Arial, sans-serif" font-size="10" fill="#333">Свойства: color, font-size, background-color, margin, padding, border, display, position</text>
  </g>
  
  <!-- Иконки -->
  <!-- Иконка HTML -->
  <rect x="30" y="90" width="30" height="30" fill="#e44d26" rx="5"/>
  <text x="45" y="109" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="white">&lt;/&gt;</text>
  
  <!-- Иконка CSS -->
  <rect x="440" y="90" width="30" height="30" fill="#1572b6" rx="5"/>
  <text x="455" y="109" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="white">{ }</text>
  
  <!-- Дополнительные элементы -->
  <!-- Круги для акцента -->
  <circle cx="60" cy="180" r="3" fill="#8e44ad"/>
  <circle cx="60" cy="210" r="3" fill="#8e44ad"/>
  <circle cx="60" cy="240" r="3" fill="#8e44ad"/>
  
  <circle cx="440" cy="180" r="3" fill="#8e44ad"/>
  <circle cx="440" cy="210" r="3" fill="#8e44ad"/>
  <circle cx="440" cy="240" r="3" fill="#8e44ad"/>
  
  <!-- Текстовые подписи -->
  <text x="45" y="145" font-family="Arial, sans-serif" font-size="9" fill="#666">Структура</text>
  <text x="45" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666">Заголовки</text>
  <text x="45" y="205" font-family="Arial, sans-serif" font-size="9" fill="#666">Стили</text>
  <text x="45" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666">Содержимое</text>
  
  <text x="365" y="145" font-family="Arial, sans-serif" font-size="9" fill="#666">Селекторы</text>
  <text x="365" y="175" font-family="Arial, sans-serif" font-size="9" fill="#666">Текст</text>
  <text x="365" y="205" font-family="Arial, sans-serif" font-size="9" fill="#666">Шрифт</text>
  <text x="365" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666">Цвет</text>
  
  <!-- Линии для разделения -->
  <line x1="50" y1="130" x2="210" y2="130" stroke="#ddd" stroke-width="1"/>
  <line x1="270" y1="130" x2="430" y2="130" stroke="#ddd" stroke-width="1"/>
  
  <!-- Подпись о связи -->
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Стилизация</text>
  
  <!-- Пример стилей -->
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8e44ad">Веб-страница = HTML + CSS</text>
  
  <!-- Дополнительные элементы для объема -->
  <rect x="50" y="75" width="10" height="15" fill="#8e44ad" rx="2"/>
  <rect x="440" y="75" width="10" height="15" fill="#8e44ad" rx="2"/>
  
  <!-- Точки для украшения -->
  <circle cx="250" y="85" r="2" fill="#8e44ad"/>
  <circle cx="240" y="85" r="2" fill="#8e44ad"/>
  <circle cx="260" y="85" r="2" fill="#8e44ad"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="120" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Контент</text>
  <text x="340" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Оформление</text>
  
  <!-- Дополнительные прямоугольники -->
  <rect x="30" y="315" width="2" height="5" fill="#8e44ad"/>
  <rect x="48" y="315" width="2" height="5" fill="#8e44ad"/>
  <rect x="450" y="315" width="2" height="5" fill="#8e44ad"/>
  <rect x="468" y="315" width="2" height="5" fill="#8e44ad"/>
  
  <!-- Еще одна подпись -->
  <text x="250" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8e44ad" font-weight="600">Каскадные таблицы стилей</text>
</svg>