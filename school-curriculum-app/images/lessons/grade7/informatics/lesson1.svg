<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Декоративные элементы -->
  <rect x="10" y="10" width="480" height="330" rx="10" fill="none" stroke="#8e44ad" stroke-width="2"/>
  <rect x="20" y="20" width="460" height="310" rx="8" fill="#fff" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8e44ad">ИНФОРМАТИКА · 7 КЛАСС</text>
  <line x1="100" y1="50" x2="400" y2="50" stroke="#8e44ad" stroke-width="2"/>
  
  <!-- Название урока -->
  <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Введение в программирование</text>
  
  <!-- Компьютер -->
  <g transform="translate(50, 100)">
    <rect x="0" y="20" width="80" height="50" rx="3" fill="#34495e"/>
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#2c3e50"/>
    <rect x="5" y="5" width="70" height="15" fill="#3498db"/>
    <rect x="30" y="70" width="20" height="15" fill="#34495e"/>
    <rect x="20" y="85" width="40" height="5" fill="#2c3e50"/>
    <text x="40" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Компьютер</text>
  </g>
  
  <!-- Стрелка -->
  <line x1="140" y1="135" x2="180" y2="135" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Программное обеспечение -->
  <g transform="translate(190, 100)">
    <rect x="0" y="20" width="80" height="50" rx="3" fill="#9b59b6"/>
    <rect x="10" y="30" width="60" height="5" fill="#8e44ad"/>
    <rect x="10" y="40" width="60" height="5" fill="#8e44ad"/>
    <rect x="10" y="50" width="60" height="5" fill="#8e44ad"/>
    <rect x="10" y="60" width="40" height="5" fill="#8e44ad"/>
    <text x="40" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ПО</text>
  </g>
  
  <!-- Стрелка -->
  <line x1="280" y1="135" x2="320" y2="135" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Программист -->
  <g transform="translate(330, 100)">
    <circle cx="40" cy="25" r="15" fill="#f39c12"/>
    <rect x="30" y="40" width="20" height="30" rx="3" fill="#3498db"/>
    <rect x="25" y="70" width="10" height="20" rx="2" fill="#2c3e50"/>
    <rect x="45" y="70" width="10" height="20" rx="2" fill="#2c3e50"/>
    <rect x="35" y="45" width="10" height="10" fill="#e74c3c"/>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Программист</text>
  </g>
  
  <!-- Стрелка вниз -->
  <line x1="370" y1="150" x2="370" y2="190" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Языки программирования -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="400" height="100" rx="5" fill="#ecf0f1" stroke="#8e44ad" stroke-width="1"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Языки программирования</text>
    
    <!-- Python -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#3776ab"/>
      <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Python</text>
      <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Интерпретируемый</text>
    </g>
    
    <!-- C++ -->
    <g transform="translate(110, 30)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#00599c"/>
      <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">C++</text>
      <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Компилируемый</text>
    </g>
    
    <!-- JavaScript -->
    <g transform="translate(200, 30)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#f7df1e"/>
      <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">JavaScript</text>
      <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Web</text>
    </g>
    
    <!-- Java -->
    <g transform="translate(290, 30)">
      <rect x="0" y="0" width="80" height="60" rx="3" fill="#007396"/>
      <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Java</text>
      <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Объектно-ориентированный</text>
    </g>
  </g>
  
  <!-- Стрелка вверх -->
  <line x1="410" y1="250" x2="410" y2="210" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Алгоритмы -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="70" height="100" rx="3" fill="#e74c3c"/>
    <rect x="10" y="10" width="50" height="10" rx="2" fill="#c0392b"/>
    <rect x="10" y="25" width="50" height="10" rx="2" fill="#c0392b"/>
    <rect x="10" y="40" width="50" height="10" rx="2" fill="#c0392b"/>
    <rect x="10" y="55" width="50" height="10" rx="2" fill="#c0392b"/>
    <rect x="10" y="70" width="50" height="10" rx="2" fill="#c0392b"/>
    <text x="35" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Алгоритмы</text>
  </g>
  
  <!-- Определение программирования -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="400" height="25" rx="3" fill="#8e44ad" opacity="0.2"/>
    <text x="200" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Программирование — процесс создания программ для компьютеров</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="30" r="5" fill="#8e44ad"/>
  <circle cx="470" cy="30" r="5" fill="#8e44ad"/>
  <circle cx="30" cy="320" r="5" fill="#8e44ad"/>
  <circle cx="470" cy="320" r="5" fill="#8e44ad"/>
  
  <!-- Декоративные линии -->
  <line x1="30" y1="30" x2="30" y2="320" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  <line x1="470" y1="30" x2="470" y2="320" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  
  <!-- Определения -->
  <text x="250" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Код</text>
  <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Синтаксис</text>
  <text x="250" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Логика</text>
  
  <!-- Блок-схема -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="60" height="30" rx="5" fill="#8e44ad" opacity="0.8"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Начало</text>
    
    <line x1="30" y1="30" x2="30" y2="45" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="30,45 25,35 35,35" fill="#8e44ad"/>
    
    <rect x="0" y="45" width="60" height="30" rx="5" fill="#9b59b6" opacity="0.8"/>
    <text x="30" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Действие</text>
    
    <line x1="30" y1="75" x2="30" y2="90" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="30,90 25,80 35,80" fill="#8e44ad"/>
    
    <rect x="0" y="90" width="60" height="30" rx="5" fill="#8e44ad" opacity="0.8"/>
    <text x="30" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Конец</text>
  </g>
  
  <!-- Иконки -->
  <g transform="translate(340, 160)">
    <circle cx="30" cy="15" r="10" fill="#8e44ad" opacity="0.8"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">i</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Информация</text>
  </g>
  
  <!-- Операторы -->
  <g transform="translate(400, 160)">
    <rect x="0" y="0" width="60" height="25" rx="3" fill="#3498db" opacity="0.8"/>
    <text x="30" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">=, +, -, *, /</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Операторы</text>
  </g>
  
  <!-- Типы данных -->
  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="60" height="25" rx="3" fill="#e74c3c" opacity="0.8"/>
    <text x="30" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">int, string, bool</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Типы данных</text>
  </g>
  
  <!-- Определения -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Алгоритм</text>
  <text x="190" y="90" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Программа</text>
  <text x="330" y="90" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Разработчик</text>
  
  <!-- Стрелка определение -->
  <line x1="50" y1="95" x2="50" y2="105" stroke="#8e44ad" stroke-width="1" marker-end="url(#arrowhead-small)"/>
  <line x1="190" y1="95" x2="190" y2="105" stroke="#8e44ad" stroke-width="1" marker-end="url(#arrowhead-small)"/>
  <line x1="330" y1="95" x2="330" y2="105" stroke="#8e44ad" stroke-width="1" marker-end="url(#arrowhead-small)"/>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
    <marker id="arrowhead-small" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>