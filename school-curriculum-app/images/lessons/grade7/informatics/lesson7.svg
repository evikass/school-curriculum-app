<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#8e44ad"/>
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">ИНФОРМАТИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#8e44ad">Создание веб-страницы</text>
  <line x1="100" y1="85" x2="400" y2="85" stroke="#8e44ad" stroke-width="2"/>
  
  <!-- Структура веб-страницы -->
  <g transform="translate(50, 100)">
    <!-- Браузер -->
    <rect x="0" y="0" width="400" height="250" rx="5" fill="white" stroke="#8e44ad" stroke-width="2"/>
    
    <!-- Заголовок браузера -->
    <rect x="0" y="0" width="400" height="30" fill="#8e44ad"/>
    <circle cx="20" cy="15" r="5" fill="#e74c3c"/>
    <circle cx="35" cy="15" r="5" fill="#f39c12"/>
    <circle cx="50" cy="15" r="5" fill="#2ecc71"/>
    <text x="200" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Моя первая веб-страница</text>
    
    <!-- Адресная строка -->
    <rect x="20" y="40" width="360" height="25" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="30" y="57" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">https://mysite.com/index.html</text>
    
    <!-- HTML теги -->
    <rect x="20" y="80" width="360" height="20" fill="#f39c12"/>
    <text x="30" y="95" font-family="monospace" font-size="14" fill="white">&lt;!DOCTYPE html&gt;</text>
    
    <rect x="20" y="105" width="360" height="20" fill="#e74c3c"/>
    <text x="30" y="120" font-family="monospace" font-size="14" fill="white">&lt;html&gt;</text>
    
    <rect x="40" y="130" width="340" height="20" fill="#3498db"/>
    <text x="50" y="145" font-family="monospace" font-size="14" fill="white">&lt;head&gt;</text>
    
    <rect x="60" y="155" width="320" height="20" fill="#2ecc71"/>
    <text x="70" y="170" font-family="monospace" font-size="14" fill="white">&lt;title&gt;Моя страница&lt;/title&gt;</text>
    
    <rect x="40" y="180" width="340" height="20" fill="#9b59b6"/>
    <text x="50" y="195" font-family="monospace" font-size="14" fill="white">&lt;body&gt;</text>
    
    <rect x="60" y="205" width="320" height="20" fill="#1abc9c"/>
    <text x="70" y="220" font-family="monospace" font-size="14" fill="white">&lt;h1&gt;Привет, мир!&lt;/h1&gt;</text>
  </g>
  
  <!-- Иконка HTML -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#e74c3c"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">HTML</text>
  </g>
  
  <!-- Иконка CSS -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#3498db"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">CSS</text>
  </g>
  
  <!-- Иконка JS -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#f39c12"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">JS</text>
  </g>
  
  <!-- Структура сайта -->
  <g transform="translate(440, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Структура сайта:</text>
    
    <rect x="0" y="10" width="40" height="30" rx="3" fill="#8e44ad"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">index</text>
    
    <line x1="20" y1="40" x2="20" y2="50" stroke="#8e44ad" stroke-width="2"/>
    
    <rect x="0" y="50" width="40" height="30" rx="3" fill="#9b59b6"/>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">about</text>
    
    <line x1="20" y1="80" x2="20" y2="90" stroke="#8e44ad" stroke-width="2"/>
    
    <rect x="0" y="90" width="40" height="30" rx="3" fill="#9b59b6"/>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">contact</text>
    
    <line x1="20" y1="120" x2="20" y2="130" stroke="#8e44ad" stroke-width="2"/>
    
    <rect x="0" y="130" width="40" height="30" rx="3" fill="#9b59b6"/>
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">gallery</text>
  </g>
  
  <!-- Элементы страницы -->
  <g transform="translate(50, 140)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Элементы:</text>
    
    <rect x="0" y="0" width="60" height="30" fill="#3498db"/>
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Заголовок</text>
    
    <rect x="70" y="0" width="60" height="30" fill="#2ecc71"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Параграф</text>
    
    <rect x="140" y="0" width="60" height="30" fill="#e74c3c"/>
    <text x="170" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Изображение</text>
    
    <rect x="210" y="0" width="60" height="30" fill="#f39c12"/>
    <text x="240" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Ссылка</text>
    
    <rect x="0" y="40" width="60" height="30" fill="#9b59b6"/>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Список</text>
    
    <rect x="70" y="40" width="60" height="30" fill="#1abc9c"/>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Таблица</text>
    
    <rect x="140" y="40" width="60" height="30" fill="#34495e"/>
    <text x="170" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Форма</text>
    
    <rect x="210" y="40" width="60" height="30" fill="#e67e22"/>
    <text x="240" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Медиа</text>
  </g>
  
  <!-- Инструменты разработки -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Инструменты:</text>
    
    <circle cx="20" cy="20" r="15" fill="#8e44ad"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">VS</text>
    
    <circle cx="50" cy="20" r="15" fill="#3498db"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Sub</text>
    
    <circle cx="80" cy="20" r="15" fill="#2ecc71"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Atom</text>
    
    <circle cx="110" cy="20" r="15" fill="#e74c3c"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Notepad</text>
  </g>
  
  <!-- Браузеры -->
  <g transform="translate(300, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Браузеры:</text>
    
    <rect x="0" y="10" width="40" height="30" rx="5" fill="#4285f4"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Chrome</text>
    
    <rect x="50" y="10" width="40" height="30" rx="5" fill="#0078d4"/>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Edge</text>
    
    <rect x="100" y="10" width="40" height="30" rx="5" fill="#ff9500"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Safari</text>
  </g>
  
  <!-- Схема создания сайта -->
  <g transform="translate(200, 280)">
    <rect x="-50" y="0" width="100" height="30" rx="15" fill="#8e44ad"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">План</text>
    
    <line x1="50" y1="15" x2="80" y2="15" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="80,10 90,15 80,20" fill="#8e44ad"/>
    
    <rect x="90" y="0" width="100" height="30" rx="15" fill="#9b59b6"/>
    <text x="140" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Дизайн</text>
    
    <line x1="190" y1="15" x2="220" y2="15" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="220,10 230,15 220,20" fill="#8e44ad"/>
    
    <rect x="230" y="0" width="100" height="30" rx="15" fill="#8e44ad"/>
    <text x="280" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Кодинг</text>
    
    <line x1="140" y1="30" x2="140" y2="50" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="135,50 140,60 145,50" fill="#8e44ad"/>
    
    <rect x="90" y="60" width="100" height="30" rx="15" fill="#8e44ad"/>
    <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Тестирование</text>
    
    <line x1="190" y1="75" x2="220" y2="75" stroke="#8e44ad" stroke-width="2"/>
    <polygon points="220,70 230,75 220,80" fill="#8e44ad"/>
    
    <rect x="230" y="60" width="100" height="30" rx="15" fill="#8e44ad"/>
    <text x="280" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Публикация</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="450" cy="50" r="10" fill="#8e44ad"/>
  <circle cx="430" cy="70" r="8" fill="#9b59b6"/>
  <circle cx="470" cy="70" r="8" fill="#9b59b6"/>
  
  <line x1="100" y1="90" x2="100" y2="330" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="330" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Маркеры списка -->
  <g transform="translate(420, 140)">
    <circle cx="0" cy="0" r="3" fill="#8e44ad"/>
    <line x1="0" y1="5" x2="0" y2="10" stroke="#8e44ad" stroke-width="1"/>
    <circle cx="0" cy="15" r="3" fill="#8e44ad"/>
    <line x1="0" y1="20" x2="0" y2="25" stroke="#8e44ad" stroke-width="1"/>
    <circle cx="0" cy="30" r="3" fill="#8e44ad"/>
    <line x1="0" y1="35" x2="0" y2="40" stroke="#8e44ad" stroke-width="1"/>
  </g>
  
  <!-- Декоративные элементы -->
  <path d="M 20 200 Q 30 190, 40 200 T 60 200" stroke="#8e44ad" stroke-width="2" fill="none"/>
  <path d="M 440 200 Q 430 190, 420 200 T 400 200" stroke="#8e44ad" stroke-width="2" fill="none"/>
</svg>