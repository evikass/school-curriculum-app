<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">ИНФОРМАТИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="45" width="300" height="35" rx="5" fill="#8e44ad"/>
  <text x="250" y="67" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Компьютерная графика</text>
  
  <!-- Растровая графика - левая часть -->
  <g id="raster">
    <!-- Заголовок растровой графики -->
    <rect x="20" y="100" width="210" height="30" rx="5" fill="#8e44ad"/>
    <text x="125" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Растровая графика</text>
    
    <!-- Иконка пикселя -->
    <rect x="40" y="140" width="10" height="10" fill="#8e44ad"/>
    <rect x="50" y="140" width="10" height="10" fill="#8e44ad"/>
    <rect x="60" y="140" width="10" height="10" fill="#8e44ad"/>
    <rect x="70" y="140" width="10" height="10" fill="#8e44ad"/>
    <rect x="80" y="140" width="10" height="10" fill="#8e44ad"/>
    
    <rect x="40" y="150" width="10" height="10" fill="#8e44ad"/>
    <rect x="50" y="150" width="10" height="10" fill="#8e44ad"/>
    <rect x="60" y="150" width="10" height="10" fill="#e74c3c"/>
    <rect x="70" y="150" width="10" height="10" fill="#e74c3c"/>
    <rect x="80" y="150" width="10" height="10" fill="#8e44ad"/>
    
    <rect x="40" y="160" width="10" height="10" fill="#8e44ad"/>
    <rect x="50" y="160" width="10" height="10" fill="#e74c3c"/>
    <rect x="60" y="160" width="10" height="10" fill="#e74c3c"/>
    <rect x="70" y="160" width="10" height="10" fill="#e74c3c"/>
    <rect x="80" y="160" width="10" height="10" fill="#8e44ad"/>
    
    <rect x="40" y="170" width="10" height="10" fill="#8e44ad"/>
    <rect x="50" y="170" width="10" height="10" fill="#8e44ad"/>
    <rect x="60" y="170" width="10" height="10" fill="#8e44ad"/>
    <rect x="70" y="170" width="10" height="10" fill="#8e44ad"/>
    <rect x="80" y="170" width="10" height="10" fill="#8e44ad"/>
    
    <!-- Пиксельный круг -->
    <rect x="120" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="130" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="140" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="150" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="160" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="170" y="140" width="5" height="5" fill="#3498db"/>
    <rect x="180" y="140" width="5" height="5" fill="#3498db"/>
    
    <rect x="120" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="130" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="140" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="150" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="160" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="170" y="150" width="5" height="5" fill="#3498db"/>
    <rect x="180" y="150" width="5" height="5" fill="#3498db"/>
    
    <rect x="120" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="130" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="140" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="150" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="160" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="170" y="160" width="5" height="5" fill="#3498db"/>
    <rect x="180" y="160" width="5" height="5" fill="#3498db"/>
    
    <rect x="120" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="130" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="140" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="150" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="160" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="170" y="170" width="5" height="5" fill="#3498db"/>
    <rect x="180" y="170" width="5" height="5" fill="#3498db"/>
    
    <!-- Свойства растровой графики -->
    <text x="40" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Изображение из пикселей</text>
    <text x="40" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Зависит от разрешения</text>
    <text x="40" y="240" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Масштабирование искажает</text>
    <text x="40" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">4. Подходит для фото</text>
    
    <!-- Пример растрового изображения -->
    <rect x="220" y="140" width="100" height="100" fill="#ecf0f1" stroke="#8e44ad" stroke-width="2"/>
    <rect x="230" y="150" width="80" height="60" fill="#e74c3c"/>
    <circle cx="270" cy="180" r="15" fill="#f1c40f"/>
    <rect x="240" y="210" width="60" height="20" fill="#2ecc71"/>
    
    <!-- Разрешение -->
    <text x="270" y="265" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">1024×768</text>
  </g>
  
  <!-- Разделитель -->
  <line x1="250" y1="90" x2="250" y2="310" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Векторная графика - правая часть -->
  <g id="vector">
    <!-- Заголовок векторной графики -->
    <rect x="270" y="100" width="210" height="30" rx="5" fill="#8e44ad"/>
    <text x="375" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Векторная графика</text>
    
    <!-- Пример векторных фигур -->
    <rect x="290" y="140" width="40" height="40" fill="#e74c3c" transform="rotate(15 310 160)"/>
    <circle cx="350" cy="160" r="20" fill="#3498db"/>
    <path d="M390,140 L410,160 L390,180 Z" fill="#2ecc71"/>
    <path d="M420,140 Q430,160 420,180" stroke="#f39c12" stroke-width="3" fill="none"/>
    
    <!-- Свойства векторной графики -->
    <text x="290" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Изображение из объектов</text>
    <text x="290" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Независит от разрешения</text>
    <text x="290" y="240" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Масштабирование без потерь</text>
    <text x="290" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">4. Подходит для иконок</text>
    
    <!-- Пример векторного изображения -->
    <rect x="400" y="140" width="60" height="60" fill="#ecf0f1" stroke="#8e44ad" stroke-width="2"/>
    
    <!-- Солнце -->
    <circle cx="430" cy="170" r="12" fill="#f1c40f"/>
    <path d="M430,150 L430,155 M430,185 L430,190 M415,170 L420,170 M440,170 L445,170 M419,159 L423,163 M437,177 L441,181 M419,181 L423,177 M437,163 L441,159" stroke="#f39c12" stroke-width="2"/>
    
    <!-- Облако -->
    <path d="M410,185 Q410,180 415,180 Q415,175 420,175 Q425,175 425,180 Q430,180 430,185 Q430,190 425,190 Q420,190 415,190 Q410,190 410,185" fill="#ecf0f1" stroke="#8e44ad" stroke-width="1"/>
    
    <!-- Масштабирование -->
    <text x="430" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Масштаб 1:1</text>
    <text x="430" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Масштаб 2:1</text>
    
    <!-- Стрелки масштабирования -->
    <path d="M380,280 L420,280" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M420,290 L380,290" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
  
  <!-- Сравнительная таблица -->
  <rect x="50" y="285" width="400" height="50" rx="5" fill="#ecf0f1" stroke="#8e44ad" stroke-width="1"/>
  <text x="70" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Сравнение:</text>
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Растровая - матрица пикселей</text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Векторная - математические формулы</text>
  
  <!-- Дополнительные элементы для достижения 50+ -->
  <circle cx="250" cy="85" r="3" fill="#8e44ad"/>
  <circle cx="240" cy="85" r="3" fill="#8e44ad"/>
  <circle cx="260" cy="85" r="3" fill="#8e44ad"/>
  
  <line x1="20" y1="280" x2="20" y2="330" stroke="#8e44ad" stroke-width="1"/>
  <line x1="480" y1="280" x2="480" y2="330" stroke="#8e44ad" stroke-width="1"/>
  
  <rect x="20" y="90" width="5" height="5" fill="#8e44ad"/>
  <rect x="475" y="90" width="5" height="5" fill="#8e44ad"/>
  
  <path d="M30,320 L40,320 L35,330 Z" fill="#8e44ad"/>
  <path d="M460,320 L470,320 L465,330 Z" fill="#8e44ad"/>
  
  <!-- Метрики -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">Количество пикселей | Координаты и уравнения</text>
</svg>