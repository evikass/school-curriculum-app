<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">ИНФОРМАТИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#8e44ad">Компьютерная графика</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="80" width="440" height="260" fill="white" stroke="#8e44ad" stroke-width="2" rx="10"/>
  
  <!-- Раздел 1: Растровая графика -->
  <rect x="50" y="100" width="190" height="110" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" rx="5"/>
  <text x="145" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">Растровая графика</text>
  
  <!-- Имитация пикселей -->
  <circle cx="80" cy="150" r="8" fill="#8e44ad"/>
  <circle cx="100" cy="150" r="8" fill="#9b59b6"/>
  <circle cx="120" cy="150" r="8" fill="#8e44ad"/>
  <circle cx="140" cy="150" r="8" fill="#9b59b6"/>
  <circle cx="160" cy="150" r="8" fill="#8e44ad"/>
  <circle cx="180" cy="150" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="150" r="8" fill="#8e44ad"/>
  
  <circle cx="80" cy="170" r="8" fill="#9b59b6"/>
  <circle cx="100" cy="170" r="8" fill="#8e44ad"/>
  <circle cx="120" cy="170" r="8" fill="#9b59b6"/>
  <circle cx="140" cy="170" r="8" fill="#8e44ad"/>
  <circle cx="160" cy="170" r="8" fill="#9b59b6"/>
  <circle cx="180" cy="170" r="8" fill="#8e44ad"/>
  <circle cx="200" cy="170" r="8" fill="#9b59b6"/>
  
  <circle cx="80" cy="190" r="8" fill="#8e44ad"/>
  <circle cx="100" cy="190" r="8" fill="#9b59b6"/>
  <circle cx="120" cy="190" r="8" fill="#8e44ad"/>
  <circle cx="140" cy="190" r="8" fill="#9b59b6"/>
  <circle cx="160" cy="190" r="8" fill="#8e44ad"/>
  <circle cx="180" cy="190" r="8" fill="#9b59b6"/>
  <circle cx="200" cy="190" r="8" fill="#8e44ad"/>
  
  <text x="145" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Пиксели</text>
  
  <!-- Раздел 2: Векторная графика -->
  <rect x="260" y="100" width="190" height="110" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" rx="5"/>
  <text x="355" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">Векторная графика</text>
  
  <!-- Векторная фигура -->
  <path d="M305,150 L325,180 L365,180 L385,150 L355,120 L325,120 Z" fill="none" stroke="#8e44ad" stroke-width="3"/>
  <circle cx="355" cy="150" r="5" fill="#8e44ad"/>
  
  <rect x="305" y="190" width="100" height="15" fill="none" stroke="#8e44ad" stroke-width="2"/>
  <circle cx="305" cy="197" r="3" fill="#8e44ad"/>
  <circle cx="405" cy="197" r="3" fill="#8e44ad"/>
  
  <text x="355" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Объекты</text>
  
  <!-- Раздел 3: Цветовые модели -->
  <rect x="50" y="230" width="190" height="100" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" rx="5"/>
  <text x="145" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">Цветовые модели</text>
  
  <!-- RGB -->
  <circle cx="85" cy="280" r="15" fill="red"/>
  <circle cx="115" cy="280" r="15" fill="green"/>
  <circle cx="145" cy="280" r="15" fill="blue"/>
  <text x="145" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">RGB</text>
  
  <!-- CMYK -->
  <circle cx="85" cy="315" r="15" fill="#0066cc"/>
  <circle cx="115" cy="315" r="15" fill="#ffcc00"/>
  <circle cx="145" cy="315" r="15" fill="#cc0000"/>
  <circle cx="175" cy="315" r="15" fill="#009933"/>
  <text x="145" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">CMYK</text>
  
  <!-- Раздел 4: Разрешение -->
  <rect x="260" y="230" width="190" height="100" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" rx="5"/>
  <text x="355" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">Разрешение</text>
  
  <!-- Масштабирование -->
  <rect x="280" y="270" width="40" height="40" fill="none" stroke="#8e44ad" stroke-width="2"/>
  <text x="300" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">1:1</text>
  
  <rect x="340" y="270" width="40" height="40" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">1:2</text>
  
  <text x="355" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">Размер файла</text>
  
  <!-- Стрелка между разделами -->
  <path d="M240,155 L260,155" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M240,285 L260,285" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M145,210 L145,230" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M355,210 L355,230" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определения -->
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="10" fill="#777">Изображение из пикселей</text>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="10" fill="#777">растровых точек</text>
  
  <text x="260" y="130" font-family="Arial, sans-serif" font-size="10" fill="#777">Изображение на основе</text>
  <text x="260" y="145" font-family="Arial, sans-serif" font-size="10" fill="#777">математических формул</text>
  
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="10" fill="#777">Модель смешения цветов</text>
  <text x="50" y="285" font-family="Arial, sans-serif" font-size="10" fill="#777">для дисплеев</text>
  
  <text x="260" y="270" font-family="Arial, sans-serif" font-size="10" fill="#777">Количество пикселей</text>
  <text x="260" y="285" font-family="Arial, sans-serif" font-size="10" fill="#777">на единицу длины</text>
  
  <!-- Ключевые термины -->
  <text x="240" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#8e44ad" font-weight="bold">Пиксель</text>
  <text x="240" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Элемент растрового изображения</text>
  
  <text x="240" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#8e44ad" font-weight="bold">DPI</text>
  <text x="240" y="315" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#555">Точки на дюйм</text>
  
  <!-- Дополнительные элементы -->
  <line x1="70" y1="160" x2="210" y2="160" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="160" x2="420" y2="160" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="70" y1="290" x2="210" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="290" x2="420" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Иконки -->
  <path d="M430,120 L430,130 L435,130 L435,135 L440,135 L440,130 L445,130 L445,120 Z" fill="#8e44ad"/>
  <path d="M430,140 L430,150 L435,150 L435,155 L440,155 L440,150 L445,150 L445,140 Z" fill="#9b59b6"/>
  
  <circle cx="430" cy="175" r="5" fill="#8e44ad"/>
  <circle cx="440" cy="175" r="5" fill="#9b59b6"/>
  <circle cx="430" cy="185" r="5" fill="#9b59b6"/>
  <circle cx="440" cy="185" r="5" fill="#8e44ad"/>
  
  <rect x="430" y="200" width="10" height="10" fill="#8e44ad"/>
  <rect x="430" y="215" width="10" height="10" fill="#9b59b6"/>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>