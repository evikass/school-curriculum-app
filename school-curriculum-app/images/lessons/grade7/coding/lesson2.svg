<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Градиент для акцентных элементов -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">ПРОГРАММИРОВАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e">Первая программа</text>
  
  <!-- Основной контейнер для урока -->
  <rect x="20" y="70" width="460" height="260" rx="10" fill="white" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Схема компиляции -->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Компиляция программы:</text>
  
  <!-- Исходный код -->
  <rect x="40" y="110" width="100" height="60" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="90" y="135" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">Исходный</text>
  <text x="90" y="150" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">код</text>
  
  <!-- Стрелка 1 -->
  <line x1="140" y1="140" x2="180" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">компилятор</text>
  
  <!-- Объектный код -->
  <rect x="180" y="110" width="100" height="60" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="230" y="135" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">Объектный</text>
  <text x="230" y="150" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">код</text>
  
  <!-- Стрелка 2 -->
  <line x1="280" y1="140" x2="320" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">линкер</text>
  
  <!-- Исполняемый файл -->
  <rect x="320" y="110" width="100" height="60" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="370" y="135" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">Исполняемый</text>
  <text x="370" y="150" font-family="monospace" font-size="12" text-anchor="middle" fill="#2c3e50">файл</text>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Структура программы -->
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Структура программы:</text>
  
  <!-- Включение заголовков -->
  <rect x="40" y="220" width="120" height="30" fill="#3498db" stroke="#2c3e50" stroke-width="1" rx="5"/>
  <text x="100" y="240" font-family="monospace" font-size="11" text-anchor="middle" fill="white">#include</text>
  
  <!-- Главная функция -->
  <rect x="170" y="220" width="120" height="30" fill="#2ecc71" stroke="#2c3e50" stroke-width="1" rx="5"/>
  <text x="230" y="240" font-family="monospace" font-size="11" text-anchor="middle" fill="white">main()</text>
  
  // Тело функции
  <rect x="300" y="220" width="120" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="1" rx="5"/>
  <text x="360" y="240" font-family="monospace" font-size="11" text-anchor="middle" fill="white">{ ... }</text>
  
  <!-- Элементы тела функции -->
  <line x1="60" y1="260" x2="60" y2="310" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="60" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">1. Объявление</text>
  <text x="60" y="295" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">переменных</text>
  
  <line x1="150" y1="260" x2="150" y2="310" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="150" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">2. Ввод данных</text>
  <text x="150" y="295" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">с клавиатуры</text>
  
  <line x1="240" y1="260" x2="240" y2="310" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="240" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">3. Вычисления</text>
  <text x="240" y="295" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">и операции</text>
  
  <line x1="330" y1="260" x2="330" y2="310" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="280" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">4. Вывод</text>
  <text x="330" y="295" font-family="monospace" font-size="10" text-anchor="middle" fill="#2c3e50">результата</text>
  
  <!-- Компьютерная иконка -->
  <g transform="translate(400, 220)">
    <rect x="0" y="0" width="60" height="40" fill="#2c3e50" rx="3"/>
    <rect x="5" y="5" width="50" height="30" fill="#3498db"/>
    <rect x="20" y="40" width="20" height="5" fill="#2c3e50"/>
    <rect x="10" y="45" width="40" height="3" fill="#2c3e50" rx="1"/>
  </g>
  <text x="430" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Выполнение</text>
  <text x="430" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">программы</text>
  
  <!-- Подписи к схеме -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Процесс компиляции</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Стандартная структура</text>
  
  <!-- Типы данных -->
  <circle cx="40" cy="190" r="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">int</text>
  
  <circle cx="70" cy="190" r="15" fill="#9b59b6" stroke="#2c3e50" stroke-width="1"/>
  <text x="70" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">float</text>
  
  <circle cx="100" cy="190" r="15" fill="#1abc9c" stroke="#2c3e50" stroke-width="1"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">char</text>
  
  <text x="120" y="195" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Типы данных</text>
  
  <!-- Операторы -->
  <rect x="180" y="180" width="30" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1" rx="2"/>
  <text x="195" y="195" font-family="monospace" font-size="12" text-anchor="middle" fill="white">+</text>
  
  <rect x="220" y="180" width="30" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1" rx="2"/>
  <text x="235" y="195" font-family="monospace" font-size="12" text-anchor="middle" fill="white">-</text>
  
  <rect x="260" y="180" width="30" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1" rx="2"/>
  <text x="275" y="195" font-family="monospace" font-size="12" text-anchor="middle" fill="white">*</text>
  
  <rect x="300" y="180" width="30" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1" rx="2"/>
  <text x="315" y="195" font-family="monospace" font-size="12" text-anchor="middle" fill="white">/</text>
  
  <text x="330" y="195" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Арифметические операторы</text>
  
  <!-- Пример простой программы -->
  <rect x="350" y="170" width="130" height="120" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1" rx="5"/>
  <text x="415" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Пример программы:</text>
  
  <text x="360" y="205" font-family="monospace" font-size="9" fill="#2c3e50">#include &lt;stdio.h&gt;</text>
  <text x="360" y="220" font-family="monospace" font-size="9" fill="#2c3e50">int main() {</text>
  <text x="370" y="235" font-family="monospace" font-size="9" fill="#2c3e50">int a = 5;</text>
  <text x="370" y="250" font-family="monospace" font-size="9" fill="#2c3e50">int b = 3;</text>
  <text x="370" y="265" font-family="monospace" font-size="9" fill="#2c3e50">printf("%d", a+b);</text>
  <text x="360" y="280" font-family="monospace" font-size="9" fill="#2c3e50">return 0;</text>
  <text x="360" y="295" font-family="monospace" font-size="9" fill="#2c3e50">}</text>
  
  <!-- Иконка лампочки -->
  <g transform="translate(40, 250)">
    <circle cx="15" cy="15" r="12" fill="#f1c40f" stroke="#2c3e50" stroke-width="1"/>
    <rect x="10" y="25" width="10" height="5" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
    <line x1="12" y1="30" x2="18" y2="30" stroke="#2c3e50" stroke-width="1"/>
    <line x1="12" y1="32" x2="18" y2="32" stroke="#2c3e50" stroke-width="1"/>
    <line x1="12" y1="34" x2="18" y2="34" stroke="#2c3e50" stroke-width="1"/>
  </g>
  <text x="55" y="265" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Идея</text>
  
  <!-- Иконка карандаша -->
  <g transform="translate(90, 250)">
    <rect x="0" y="0" width="20" height="6" fill="#3498db" transform="rotate(45 10 3)"/>
    <rect x="15" y="15" width="3" height="8" fill="#2c3e50" transform="rotate(45 16.5 19)"/>
  </g>
  <text x="105" y="265" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Код</text>
  
  <!-- Иконка выполнения -->
  <g transform="translate(140, 250)">
    <polygon points="10,0 20,10 10,20 0,10" fill="#2ecc71" stroke="#2c3e50" stroke-width="1"/>
    <polygon points="12,6 16,10 12,14 8,10" fill="white"/>
  </g>
  <text x="155" y="265" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Запуск</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="250" cy="280" r="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
  <text x="250" y="284" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">!</text>
  <text x="265" y="284" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Ошибки</text>
  
  <circle cx="310" cy="280" r="8" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
  <text x="310" y="284" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">?</text>
  <text x="325" y="284" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Вопросы</text>
  
  <!-- Разделительная линия -->
  <line x1="20" y1="190" x2="480" y2="190" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
</svg>