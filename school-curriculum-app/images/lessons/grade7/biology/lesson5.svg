<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.6" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="bubbleGrad">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <!-- Фоновый фон воды -->
  <rect width="500" height="350" fill="url(#waterGrad)" />
  
  <!-- Пузырьки воздуха -->
  <circle cx="80" cy="280" r="8" fill="url(#bubbleGrad)" />
  <circle cx="150" cy="300" r="5" fill="url(#bubbleGrad)" />
  <circle cx="420" cy="290" r="6" fill="url(#bubbleGrad)" />
  <circle cx="380" cy="310" r="4" fill="url(#bubbleGrad)" />
  
  <!-- Зеленая водоросль (многоклеточная) -->
  <g id="multicellular-algae">
    <path d="M 50 150 Q 70 140, 90 145 T 130 140 Q 150 135, 170 145 T 210 140" 
          stroke="url(#greenGrad)" stroke-width="6" fill="none" opacity="0.8" />
    <!-- Клетки -->
    <circle cx="70" cy="142" r="4" fill="#4CAF50" />
    <circle cx="90" cy="145" r="4" fill="#4CAF50" />
    <circle cx="110" cy="143" r="4" fill="#4CAF50" />
    <circle cx="130" cy="140" r="4" fill="#4CAF50" />
    <circle cx="150" cy="138" r="4" fill="#4CAF50" />
    <circle cx="170" cy="145" r="4" fill="#4CAF50" />
    <circle cx="190" cy="142" r="4" fill="#4CAF50" />
  </g>
  
  <!-- Хламидомонада (одноклеточная) -->
  <g id="chlamydomonas" transform="translate(300, 100)">
    <ellipse cx="0" cy="0" rx="25" ry="20" fill="#81C784" opacity="0.9" />
    <!-- Ядро -->
    <circle cx="0" cy="0" r="8" fill="#424242" opacity="0.6" />
    <!-- Жгутики -->
    <path d="M -20 -5 Q -30 -10, -35 -15" stroke="#388E3C" stroke-width="2" fill="none" />
    <path d="M 20 -5 Q 30 -10, 35 -15" stroke="#388E3C" stroke-width="2" fill="none" />
    <!-- Пластид -->
    <ellipse cx="0" cy="-8" rx="12" ry="8" fill="#FFD54F" opacity="0.7" />
    <!-- Вакуоль -->
    <ellipse cx="0" cy="8" rx="10" ry="6" fill="#E1F5FE" opacity="0.5" />
  </g>
  
  <!-- Сарцина (одноклеточная) -->
  <g id="sarcina" transform="translate(400, 150)">
    <circle cx="0" cy="0" r="18" fill="#66BB6A" opacity="0.8" />
    <circle cx="0" cy="0" r="10" fill="#4CAF50" opacity="0.9" />
    <!-- Митотические деления -->
    <circle cx="-8" cy="-8" r="3" fill="#388E3C" />
    <circle cx="8" cy="-8" r="3" fill="#388E3C" />
    <circle cx="-8" cy="8" r="3" fill="#388E3C" />
    <circle cx="8" cy="8" r="3" fill="#388E3C" />
  </g>
  
  <!-- Спирогина (многоклеточная) -->
  <g id="spirogyra" transform="translate(100, 200)">
    <path d="M -30 0 Q -20 -20, 0 -20 Q 20 -20, 30 0 Q 20 20, 0 20 Q -20 20, -30 0" 
          stroke="#2E7D32" stroke-width="8" fill="none" opacity="0.8" />
    <!-- Хлоропласты -->
    <ellipse cx="-20" cy="-10" rx="4" ry="15" fill="#FFEB3B" opacity="0.8" />
    <ellipse cx="0" cy="-10" rx="4" ry="15" fill="#FFEB3B" opacity="0.8" />
    <ellipse cx="20" cy="-10" rx="4" ry="15" fill="#FFEB3B" opacity="0.8" />
  </g>
  
  <!-- Ульва (многоклеточная) -->
  <g id="ulva" transform="translate(350, 220)">
    <rect x="-25" y="-40" width="50" height="80" rx="5" fill="#4CAF50" opacity="0.7" />
    <!-- Клеточная структура -->
    <line x1="-20" y1="-30" x2="20" y2="-30" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-20" y1="-35" x2="-20" y2="35" stroke="#388E3C" stroke-width="0.5" />
    <line x1="-10" y1="-35" x2="-10" y2="35" stroke="#388E3C" stroke-width="0.5" />
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#388E3C" stroke-width="0.5" />
    <line x1="10" y1="-35" x2="10" y2="35" stroke="#388E3C" stroke-width="0.5" />
    <line x1="20" y1="-35" x2="20" y2="35" stroke="#388E3C" stroke-width="0.5" />
  </g>
  
  <!-- Дивизия (размножение) -->
  <g id="division" transform="translate(250, 250)">
    <circle cx="0" cy="0" r="15" fill="#66BB6A" opacity="0.9" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#388E3C" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#4CAF50" />
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="12" fill="#333">Деление</text>
  </g>
  
  <!-- Спорогония (размножение) -->
  <g id="sporangium" transform="translate(150, 250)">
    <ellipse cx="0" cy="0" rx="12" ry="15" fill="#4CAF50" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#2E7D32" />
    <text x="-20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#333">Споры</text>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#1565C0">БИОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" 
        text-anchor="middle" fill="#1976D2">Урок 5. Водоросли</text>
  
  <!-- Подписи к водорослям -->
  <text x="130" y="125" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">Многоклеточная</text>
  <text x="130" y="138" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">водоросль</text>
  
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">Хламидомонада</text>
  <text x="300" y="157" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">(одноклеточная)</text>
  
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">Сарцина</text>
  <text x="400" y="207" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">(одноклеточная)</text>
  
  <text x="100" y="255" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">Спирогина</text>
  <text x="100" y="268" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">(многоклеточная)</text>
  
  <text x="350" y="325" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">Ульва</text>
  <text x="350" y="337" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#333">(многоклеточная)</text>
  
  <!-- Текстовое содержимое -->
  <text x="20" y="80" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan x="20" dy="0">Тема: Водоросли</tspan>
    <tspan x="20" dy="18">• Строение</tspan>
    <tspan x="20" dy="18">• Размножение</tspan>
    <tspan x="20" dy="18">• Значение</tspan>
  </text>
  
  <!-- Значение водорослей -->
  <text x="20" y="320" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan x="20" dy="0">Значение:</tspan>
    <tspan x="20" dy="15">• Кислород</tspan>
    <tspan x="20" dy="15">• Пища</tspan>
    <tspan x="20" dy="15">• Биогаз</tspan>
  </text>
  
  <!-- Указатели на структуры -->
  <line x1="300" y1="110" x2="300" y2="90" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)" />
  <line x1="400" y1="160" x2="420" y2="170" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Дополнительные элементы декора -->
  <path d="M 450 50 Q 460 60, 450 70" stroke="#81C784" stroke-width="2" fill="none" opacity="0.5" />
  <path d="M 460 55 Q 470 65, 460 75" stroke="#81C784" stroke-width="2" fill="none" opacity="0.5" />
  
  <!-- Номера клеток -->
  <circle cx="70" cy="142" r="1" fill="#fff" />
  <circle cx="90" cy="145" r="1" fill="#fff" />
  <circle cx="110" cy="143" r="1" fill="#fff" />
  <circle cx="130" cy="140" r="1" fill="#fff" />
  <circle cx="150" cy="138" r="1" fill="#fff" />
  <circle cx="170" cy="145" r="1" fill="#fff" />
  <circle cx="190" cy="142" r="1" fill="#fff" />
  
  <!-- Дополнительные пузырьки -->
  <circle cx="250" cy="290" r="3" fill="url(#bubbleGrad)" />
  <circle cx="200" cy="310" r="5" fill="url(#bubbleGrad)" />
  <circle cx="300" cy="305" r="4" fill="url(#bubbleGrad)" />
</svg>