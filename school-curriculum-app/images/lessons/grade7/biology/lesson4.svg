<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="moldGrad">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </radialGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3436">БИОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#636e72">Урок 4. Грибы. Шляпочные и плесневые</text>
  
  <!-- Шляпочный гриб -->
  <g transform="translate(100, 120)">
    <!-- Ножка -->
    <ellipse cx="0" cy="60" rx="20" ry="5" fill="url(#stemGrad)"/>
    <path d="M -20 60 L -15 100 L 15 100 L 20 60 Z" fill="url(#stemGrad)" filter="url(#shadow)"/>
    
    <!-- Шляпка -->
    <ellipse cx="0" cy="50" rx="50" ry="30" fill="url(#capGrad)" filter="url(#shadow)"/>
    
    <!-- Пластинки -->
    <g stroke="#fff" stroke-width="1" opacity="0.7">
      <path d="M -30 50 Q -15 45 0 45 Q 15 45 30 50"/>
      <path d="M -35 55 Q -17.5 50 0 50 Q 17.5 50 35 55"/>
      <path d="M -38 60 Q -20 55 0 55 Q 20 55 38 60"/>
      <path d="M -35 65 Q -17.5 60 0 60 Q 17.5 60 35 65"/>
      <path d="M -30 70 Q -15 65 0 65 Q 15 65 30 70"/>
    </g>
    
    <!-- Мицелий -->
    <g stroke="#8b4513" stroke-width="1" opacity="0.6">
      <path d="M -10 100 L -20 110 M 0 100 L -5 115 M 10 100 L 5 118 M -5 100 L -15 112 M 5 100 L 10 115"/>
    </g>
  </g>
  
  <!-- Плесень -->
  <g transform="translate(350, 100)">
    <!-- Поверхность -->
    <rect x="-50" y="80" width="100" height="80" fill="#dfe6e9" rx="5"/>
    
    <!-- Плесень -->
    <g>
      <ellipse cx="-20" cy="100" rx="15" ry="10" fill="url(#moldGrad)" opacity="0.8"/>
      <ellipse cx="10" cy="110" rx="20" ry="15" fill="url(#moldGrad)" opacity="0.8"/>
      <ellipse cx="20" cy="95" rx="12" ry="8" fill="url(#moldGrad)" opacity="0.8"/>
      <ellipse cx="-10" cy="120" rx="18" ry="12" fill="url(#moldGrad)" opacity="0.8"/>
      
      <!-- Споры -->
      <circle cx="-20" cy="100" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="10" cy="110" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="20" cy="95" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="-10" cy="120" r="2" fill="#fff" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Строение гриба - схема -->
  <g transform="translate(250, 250)">
    <!-- Надземная часть -->
    <rect x="-40" y="-30" width="80" height="20" fill="#ff6b6b" rx="5" opacity="0.7"/>
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">Шляпка</text>
    
    <!-- Ножка -->
    <rect x="-10" y="0" width="20" height="30" fill="#d4a574" rx="3" opacity="0.7"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">Ножка</text>
    
    <!-- Мицелий -->
    <g stroke="#8b4513" stroke-width="2" fill="none">
      <path d="M -10 30 L -20 40 M -5 30 L -10 45 M 0 30 L 0 50 M 5 30 L 10 45 M 10 30 L 20 40"/>
      <circle cx="-20" cy="40" r="3" fill="#8b4513"/>
      <circle cx="-10" cy="45" r="3" fill="#8b4513"/>
      <circle cx="0" cy="50" r="3" fill="#8b4513"/>
      <circle cx="10" cy="45" r="3" fill="#8b4513"/>
      <circle cx="20" cy="40" r="3" fill="#8b4513"/>
    </g>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Мицелий</text>
  </g>
  
  <!-- Питание - схема -->
  <g transform="translate(100, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">Питание:</text>
    
    <!-- Органические вещества -->
    <rect x="-10" y="10" width="80" height="25" fill="#74b9ff" rx="5" opacity="0.7"/>
    <text x="30" y="27" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">Органические вещества</text>
    
    <!-- Стрелка -->
    <path d="M 70 22 L 90 22" stroke="#2d3436" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Гриб -->
    <ellipse cx="110" cy="22" rx="15" ry="20" fill="#ff6b6b" opacity="0.7"/>
    
    <!-- Стрелка -->
    <path d="M 125 22 L 145 22" stroke="#2d3436" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Минеральные вещества -->
    <rect x="150" y="10" width="80" height="25" fill="#00b894" rx="5" opacity="0.7"/>
    <text x="190" y="27" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">Минеральные вещества</text>
  </g>
  
  <!-- Значение грибов -->
  <g transform="translate(300, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">Значение:</text>
    
    <!-- Пищевое -->
    <circle cx="20" cy="20" r="15" fill="#00b894" opacity="0.7"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Пищевое</text>
    
    <!-- Лекарственное -->
    <circle cx="60" cy="20" r="15" fill="#6c5ce7" opacity="0.7"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Лекарств.</text>
    
    <!-- Почвообразующее -->
    <circle cx="100" cy="20" r="15" fill="#fdcb6e" opacity="0.7"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Почвообр.</text>
    
    <!-- Вредное -->
    <circle cx="140" cy="20" r="15" fill="#e17055" opacity="0.7"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">Вредное</text>
  </g>
  
  <!-- Стрелка-маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3436"/>
    </marker>
  </defs>
  
  <!-- Подписи к изображениям -->
  <text x="100" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3436">Шляпочный гриб</text>
  <text x="350" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3436">Плесневый гриб</text>
  
  <!-- Дополнительные элементы оформления -->
  <g opacity="0.3">
    <circle cx="50" cy="50" r="3" fill="#74b9ff"/>
    <circle cx="450" cy="80" r="3" fill="#74b9ff"/>
    <circle cx="80" cy="200" r="3" fill="#74b9ff"/>
    <circle cx="420" cy="250" r="3" fill="#74b9ff"/>
    <circle cx="30" cy="300" r="3" fill="#74b9ff"/>
    <circle cx="470" cy="320" r="3" fill="#74b9ff"/>
  </g>
  
  <!-- Разделительные линии -->
  <line x1="20" y1="70" x2="480" y2="70" stroke="#dfe6e9" stroke-width="1"/>
  <line x1="20" y1="240" x2="480" y2="240" stroke="#dfe6e9" stroke-width="1"/>
</svg>