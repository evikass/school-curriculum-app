<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">ОБЖ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Причины пожаров и их предотвращение</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="70" width="460" height="260" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  
  <!-- Левая секция: Причины пожаров -->
  <text x="40" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">ПРИЧИНЫ ПОЖАРОВ</text>
  
  <!-- Иконка огня -->
  <path d="M 80 110 Q 75 115, 75 125 Q 75 135, 80 140 Q 85 145, 90 140 Q 95 135, 95 125 Q 95 115, 90 110 Q 85 105, 80 110" fill="#e74c3c"/>
  <path d="M 85 115 Q 82 118, 82 125 Q 82 132, 85 135 Q 88 138, 90 135 Q 92 132, 92 125 Q 92 118, 90 115 Q 88 112, 85 115" fill="#f39c12"/>
  
  <!-- Список причин -->
  <text x="110" y="120" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Неосторожное обращение с огнем</text>
  <line x1="105" y1="125" x2="400" y2="125" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="140" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Короткое замыкание электропроводки</text>
  <line x1="105" y1="145" x2="400" y2="145" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="160" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Неправильная эксплуатация отопительных приборов</text>
  <line x1="105" y1="165" x2="400" y2="165" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Неисправность газового оборудования</text>
  <line x1="105" y1="185" x2="400" y2="185" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">5. Шалости с огнем детьми</text>
  <line x1="105" y1="205" x2="400" y2="205" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <!-- Правая секция: Предотвращение -->
  <text x="40" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">ПРЕДУПРЕЖДЕНИЕ ПОЖАРОВ</text>
  
  <!-- Иконка щита -->
  <rect x="70" y="245" width="20" height="25" fill="none" stroke="#27ae60" stroke-width="2" rx="2"/>
  <path d="M 75 250 L 85 250 M 75 255 L 85 255" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Список мер предосторожности -->
  <text x="110" y="255" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Соблюдать правила пожарной безопасности</text>
  <line x1="105" y1="260" x2="400" y2="260" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="275" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Не перегружать электросети</text>
  <line x1="105" y1="280" x2="400" y2="280" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="295" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">3. Регулярно проверять электроприборы</text>
  <line x1="105" y1="300" x2="400" y2="300" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <text x="110" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">4. Знать номера телефонов экстренных служб</text>
  <line x1="105" y1="320" x2="400" y2="320" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  
  <!-- Центральная диаграмма -->
  <circle cx="250" cy="170" r="60" fill="#f39c12" opacity="0.2"/>
  <circle cx="250" cy="170" r="55" fill="none" stroke="#f39c12" stroke-width="2"/>
  
  <!-- Центральный текст -->
  <text x="250" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Пожарная</text>
  <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">безопасность</text>
  
  <!-- Лучи диаграммы -->
  <line x1="250" y1="115" x2="250" y2="95" stroke="#f39c12" stroke-width="1.5"/>
  <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Предотвращение</text>
  
  <line x1="310" y1="170" x2="330" y2="170" stroke="#f39c12" stroke-width="1.5"/>
  <text x="340" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Знания</text>
  
  <line x1="250" y1="225" x2="250" y2="245" stroke="#f39c12" stroke-width="1.5"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Действия</text>
  
  <line x1="190" y1="170" x2="170" y2="170" stroke="#f39c12" stroke-width="1.5"/>
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Осторожность</text>
  
  <!-- Телефон экстренных служб -->
  <rect x="420" y="80" width="60" height="40" fill="#e74c3c" rx="3"/>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">112</text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Телефон</text>
  
  <!-- Иконка огнетушителя -->
  <rect x="420" y="130" width="15" height="35" fill="#34495e" rx="2"/>
  <rect x="420" y="125" width="15" height="10" fill="#e74c3c" rx="2"/>
  <line x1="427" y1="125" x2="427" y2="115" stroke="#34495e" stroke-width="2"/>
  <path d="M 427 115 L 422 120 L 432 120 Z" fill="#e74c3c"/>
  <text x="440" y="150" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Огнетушитель</text>
  
  <!-- Пиктограмма "Не курить" -->
  <circle cx="450" cy="200" r="15" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <line x1="440" y1="190" x2="460" y2="210" stroke="#e74c3c" stroke-width="2"/>
  <text x="450" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Не курить</text>
  
  <!-- Пиктограмма "Выключай" -->
  <circle cx="450" cy="270" r="15" fill="none" stroke="#34495e" stroke-width="2"/>
  <line x1="445" y1="265" x2="445" y2="275" stroke="#34495e" stroke-width="2"/>
  <line x1="455" y1="265" x2="455" y2="275" stroke="#34495e" stroke-width="2"/>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Выключай</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="330" r="3" fill="#f39c12"/>
  <circle cx="40" cy="330" r="3" fill="#f39c12"/>
  <circle cx="50" cy="330" r="3" fill="#f39c12"/>
  
  <rect x="460" y="80" width="3" height="260" fill="#f39c12" opacity="0.3"/>
  
  <!-- Подписи для наглядности -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Источник: МЧС России</text>
  
  <!-- Дополнительные иконки -->
  <path d="M 60 250 L 60 265 L 65 270 L 75 270 L 80 265 L 80 250" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="70" cy="255" r="2" fill="#27ae60"/>
  <text x="85" y="265" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Эвакуация</text>
  
  <!-- Указатели -->
  <path d="M 150 100 L 150 120 L 145 115 M 150 120 L 155 115" stroke="#f39c12" stroke-width="1.5" fill="none"/>
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="8" fill="#f39c12">Опасно!</text>
  
  <path d="M 350 100 L 350 120 L 345 115 M 350 120 L 355 115" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <text x="355" y="105" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Безопасно</text>
  
  <!-- Дополнительные информационные элементы -->
  <rect x="280" y="90" width="80" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="320" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5 основных</text>
  <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">причин</text>
  
  <rect x="280" y="230" width="80" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="320" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5 правил</text>
  <text x="320" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">безопасности</text>
</svg>