<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок класса -->
  <rect x="10" y="10" width="150" height="30" rx="5" fill="#2c3e50"/>
  <text x="85" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ОБЖ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="40" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Причины ДТП и их предотвращение</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="60" width="460" height="270" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Раздел 1: Основные причины ДТП -->
  <rect x="30" y="70" width="210" height="120" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="135" y="90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Основные причины ДТП</text>
  
  <!-- Иконка скорости -->
  <circle cx="50" cy="110" r="15" fill="#f39c12"/>
  <text x="50" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">!</text>
  <text x="75" y="115" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Превышение скорости</text>
  
  <!-- Иконка телефона -->
  <rect x="45" y="135" width="10" height="15" rx="2" fill="#f39c12"/>
  <text x="75" y="145" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Использование телефона</text>
  
  <!-- Иконка алкоголя -->
  <path d="M45,165 L55,165 L55,175 L50,180 L45,175 Z" fill="#f39c12"/>
  <text x="75" y="175" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Алкоголь/наркотики</text>
  
  <!-- Раздел 2: Предотвращение ДТП -->
  <rect x="260" y="70" width="210" height="120" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="365" y="90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Предотвращение ДТП</text>
  
  <!-- Иконка ремня безопасности -->
  <rect x="275" y="105" width="20" height="3" fill="#f39c12"/>
  <rect x="275" y="115" width="20" height="3" fill="#f39c12"/>
  <line x1="285" y1="108" x2="285" y2="115" stroke="#f39c12" stroke-width="2"/>
  <text x="305" y="115" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Ремень безопасности</text>
  
  <!-- Иконка дистанции -->
  <line x1="275" y1="135" x2="295" y2="135" stroke="#f39c12" stroke-width="3"/>
  <line x1="275" y1="145" x2="295" y2="145" stroke="#2c3e50" stroke-width="2"/>
  <text x="305" y="142" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Безопасная дистанция</text>
  
  <!-- Иконка знаков -->
  <circle cx="285" cy="170" r="10" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="285" y="175" text-anchor="middle" fill="#f39c12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">!</text>
  <text x="305" y="175" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">Знаки и разметка</text>
  
  <!-- Схема причинно-следственных связей -->
  <rect x="30" y="210" width="440" height="100" rx="5" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="250" y="230" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Факторы риска</text>
  
  <!-- Центральный элемент - ДТП -->
  <circle cx="250" cy="260" r="20" fill="#e74c3c"/>
  <text x="250" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ДТП</text>
  
  <!-- Факторы риска -->
  <circle cx="120" cy="260" r="15" fill="#f39c12"/>
  <text x="120" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Человек</text>
  <line x1="135" y1="260" x2="230" y2="260" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <circle cx="380" cy="260" r="15" fill="#f39c12"/>
  <text x="380" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Техника</text>
  <line x1="365" y1="260" x2="270" y2="260" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <circle cx="250" cy="300" r="15" fill="#f39c12"/>
  <text x="250" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Дорога</text>
  <line x1="250" y1="285" x2="250" y2="275" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные элементы -->
  <rect x="50" y="80" width="5" height="5" fill="#f39c12"/>
  <rect x="280" y="80" width="5" height="5" fill="#f39c12"/>
  
  <line x1="30" y1="200" x2="470" y2="200" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#f39c12"/>
  <circle cx="470" cy="30" r="3" fill="#f39c12"/>
  <circle cx="30" cy="330" r="3" fill="#f39c12"/>
  <circle cx="470" cy="330" r="3" fill="#f39c12"/>
  
  <!-- Текстовые предупреждения -->
  <text x="250" y="330" text-anchor="middle" fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" font-style="italic">Помните: безопасность на дороге - в ваших руках!</text>
  
  <!-- Иконка часов -->
  <circle cx="430" cy="110" r="10" fill="none" stroke="#f39c12" stroke-width="2"/>
  <line x1="430" y1="110" x2="430" y2="105" stroke="#f39c12" stroke-width="2"/>
  <line x1="430" y1="110" x2="435" y2="110" stroke="#f39c12" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Время</text>
  
  <!-- Иконка внимания -->
  <polygon points="60,140 65,150 55,150" fill="#f39c12"/>
  <circle cx="60" cy="148" r="1" fill="white"/>
  <rect x="59" y="145" width="2" height="3" fill="white"/>
  
  <!-- Иконка безопасности -->
  <path d="M380,105 L385,115 L375,115 Z" fill="#f39c12"/>
  <text x="380" y="118" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">!</text>
</svg>