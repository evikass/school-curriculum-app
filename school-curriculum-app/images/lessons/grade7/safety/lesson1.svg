<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#2c3e50"/>
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">ОБЖ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Правила дорожного движения для велосипедистов</text>
  
  <!-- Иконка велосипеда -->
  <g transform="translate(50, 90)">
    <circle cx="15" cy="35" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <circle cx="45" cy="35" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <path d="M15,35 L30,15 L45,35" fill="none" stroke="#34495e" stroke-width="3"/>
    <path d="M20,35 L25,25 L40,25 L35,35" fill="none" stroke="#34495e" stroke-width="2"/>
    <path d="M30,15 L30,5" fill="none" stroke="#34495e" stroke-width="2"/>
    <path d="M25,5 L35,5" fill="none" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Заголовок "Велосипед - транспортное средство" -->
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Велосипед - транспортное средство</text>
  
  <!-- Дорожная разметка -->
  <rect x="0" y="140" width="500" height="80" fill="#7f8c8d"/>
  <line x1="0" y1="160" x2="500" y2="160" stroke="white" stroke-width="2" stroke-dasharray="10,5"/>
  <line x1="0" y1="200" x2="500" y2="200" stroke="white" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Автомобиль -->
  <g transform="translate(350, 150)">
    <rect x="0" y="10" width="50" height="20" rx="3" fill="#3498db"/>
    <rect x="5" y="5" width="15" height="10" rx="2" fill="#34495e"/>
    <rect x="30" y="5" width="15" height="10" rx="2" fill="#34495e"/>
    <circle cx="10" cy="32" r="4" fill="#2c3e50"/>
    <circle cx="40" cy="32" r="4" fill="#2c3e50"/>
  </g>
  
  <!-- Велосипедист на дороге -->
  <g transform="translate(250, 150)">
    <circle cx="15" cy="10" r="8" fill="#f39c12"/>
    <path d="M15,18 L15,28" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M15,20 L8,30" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M15,20 L22,30" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M15,28 L8,40" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M15,28 L22,40" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="15" cy="45" r="10" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="5" cy="50" r="5" fill="#34495e"/>
    <circle cx="25" cy="50" r="5" fill="#34495e"/>
  </g>
  
  <!-- Пешеход -->
  <g transform="translate(150, 150)">
    <circle cx="10" cy="8" r="6" fill="#f39c12"/>
    <path d="M10,14 L10,24" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M10,18 L5,28" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M10,18 L15,28" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M10,24 L5,34" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <path d="M10,24 L15,34" fill="none" stroke="#2c3e50" stroke-width="2"/>
  </g>
  
  <!-- Тротуар -->
  <rect x="0" y="220" width="500" height="60" fill="#ecf0f1"/>
  <rect x="0" y="220" width="500" height="5" fill="#bdc3c7"/>
  <rect x="0" y="275" width="500" height="5" fill="#bdc3c7"/>
  
  <!-- Знак "Движение на велосипеде запрещено" -->
  <g transform="translate(50, 240)">
    <circle cx="20" cy="20" r="18" fill="white" stroke="#e74c3c" stroke-width="2"/>
    <rect x="12" y="12" width="16" height="16" fill="#e74c3c"/>
    <line x1="10" y1="10" x2="30" y2="30" stroke="white" stroke-width="3"/>
  </g>
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Запрет</text>
  
  <!-- Знак "Велосипедная дорожка" -->
  <g transform="translate(100, 240)">
    <rect x="10" y="10" width="20" height="20" fill="white" stroke="#27ae60" stroke-width="2"/>
    <path d="M15,20 L25,20 M15,15 L25,25 M15,25 L25,15" fill="none" stroke="#27ae60" stroke-width="2"/>
  </g>
  <text x="120" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Дорожка</text>
  
  <!-- Знак "Пешеходная зона" -->
  <g transform="translate(150, 240)">
    <rect x="10" y="10" width="20" height="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <circle cx="20" cy="15" r="3" fill="#3498db"/>
    <path d="M20,18 L20,25 M16,22 L24,22" fill="none" stroke="#3498db" stroke-width="1.5"/>
  </g>
  <text x="170" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Пешеходная зона</text>
  
  <!-- Светофор -->
  <g transform="translate(250, 240)">
    <rect x="15" y="10" width="10" height="25" rx="2" fill="#34495e"/>
    <circle cx="20" cy="15" r="3" fill="#e74c3c"/>
    <circle cx="20" cy="20" r="3" fill="#f1c40f"/>
    <circle cx="20" cy="25" r="3" fill="#27ae60"/>
    <rect x="12" y="35" width="16" height="5" fill="#7f8c8d"/>
  </g>
  <text x="270" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Светофор</text>
  
  <!-- Схема движения велосипедиста -->
  <g transform="translate(350, 240)">
    <rect x="0" y="0" width="80" height="50" fill="none" stroke="#34495e" stroke-width="1" rx="5"/>
    <path d="M10,25 L30,10 L50,25 L70,10" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Маршрут</text>
  </g>
  
  <!-- Правила для велосипедистов -->
  <rect x="20" y="310" width="460" height="35" fill="#f39c12" rx="5"/>
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Правила: держись правее, используй сигналы поворота, носи шлем и reflective элементы</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="430" cy="100" r="5" fill="#f39c12"/>
  <circle cx="440" cy="105" r="5" fill="#f39c12"/>
  <circle cx="435" cy="115" r="5" fill="#f39c12"/>
  
  <!-- Стрелки направления -->
  <path d="M180,160 L190,155 L190,165 Z" fill="#f39c12"/>
  <path d="M220,160 L210,155 L210,165 Z" fill="#f39c12"/>
  <path d="M280,160 L290,155 L290,165 Z" fill="#f39c12"/>
  
  <!-- Разделители -->
  <line x1="30" y1="130" x2="470" y2="130" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="30" y1="210" x2="470" y2="210" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Надписи на дороге -->
  <text x="250" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">ПРЯМОЕ ДВИЖЕНИЕ</text>
  
  <!-- Иконка шлема -->
  <g transform="translate(380, 90)">
    <path d="M15,5 C10,5 5,10 5,15 C5,20 5,25 5,25 L25,25 C25,25 25,20 25,15 C25,10 20,5 15,5 Z" fill="#f39c12"/>
    <line x1="15" y1="5" x2="15" y2="2" stroke="#f39c12" stroke-width="2"/>
    <path d="M15,2 L10,7 L20,7 Z" fill="#f39c12"/>
    <circle cx="15" cy="15" r="2" fill="#34495e"/>
  </g>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Шлем</text>
  
  <!-- Иконка светоотражателя -->
  <g transform="translate(420, 90)">
    <rect x="5" y="5" width="20" height="15" rx="2" fill="#ecf0f1" stroke="#34495e" stroke-width="1"/>
    <circle cx="15" cy="12" r="5" fill="#f39c12"/>
    <line x1="10" y1="12" x2="20" y2="12" stroke="#34495e" stroke-width="1"/>
    <line x1="15" y1="7" x2="15" y2="17" stroke="#34495e" stroke-width="1"/>
  </g>
  <text x="440" y="100" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Светоотражатель</text>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="20" y="150" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Пешеход</text>
  <text x="320" y="150" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Автомобиль</text>
  <text x="240" y="150" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Велосипедист</text>
  <text x="20" y="235" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Дорожные знаки</text>
  <text x="20" y="305" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Дорожная разметка</text>
  
  <!-- Пунктирные линии для обозначения правил -->
  <line x1="30" y1="340" x2="470" y2="340" stroke="#f39c12" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Угловые элементы оформления -->
  <path d="M0,0 L20,0 L0,20 Z" fill="#f39c12"/>
  <path d="M500,0 L480,0 L500,20 Z" fill="#f39c12"/>
  <path d="M0,350 L20,350 L0,330 Z" fill="#f39c12"/>
  <path d="M500,350 L480,350 L500,330 Z" fill="#f39c12"/>
</svg>