<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#2c3e50"/>
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ОБЖ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Природные ЧС</text>
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">Чрезвычайные ситуации</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="95" x2="450" y2="95" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Основной контент -->
  
  <!-- Левая часть - Определение ЧС -->
  <rect x="40" y="110" width="180" height="220" rx="5" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="130" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Что такое ЧС?</text>
  
  <!-- Иконка предупреждения -->
  <circle cx="130" cy="165" r="20" fill="#f39c12"/>
  <path d="M130 155 L130 165 M125 175 L135 175" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Опасная ситуация,</text>
  <text x="130" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">угрожающая жизни и</text>
  <text x="130" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">здоровью людей</text>
  
  <!-- Классификация ЧС -->
  <text x="130" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Классификация:</text>
  <circle cx="70" cy="275" r="5" fill="#f39c12"/>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Природные</text>
  <circle cx="70" cy="295" r="5" fill="#3498db"/>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Техногенные</text>
  <circle cx="70" cy="315" r="5" fill="#e74c3c"/>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Социальные</text>
  
  <!-- Правая часть - Типы природных ЧС -->
  <rect x="240" y="110" width="220" height="220" rx="5" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="350" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Типы природных ЧС</text>
  
  <!-- Схема природных ЧС -->
  <circle cx="350" cy="165" r="40" fill="#f39c12" opacity="0.2"/>
  <text x="350" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Природные</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">ЧС</text>
  
  <!-- Ветви схемы -->
  <line x1="310" y1="180" x2="280" y2="210" stroke="#95a5a6" stroke-width="1"/>
  <line x1="350" y1="205" x2="350" y2="230" stroke="#95a5a6" stroke-width="1"/>
  <line x1="390" y1="180" x2="420" y2="210" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Типы ЧС -->
  <rect x="240" y="220" width="80" height="30" rx="3" fill="#3498db" opacity="0.7"/>
  <text x="280" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Геологические</text>
  
  <rect x="330" y="220" width="80" height="30" rx="3" fill="#27ae60" opacity="0.7"/>
  <text x="370" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Метеорологические</text>
  
  <rect x="420" y="220" width="40" height="30" rx="3" fill="#8e44ad" opacity="0.7"/>
  <text x="440" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Гидрологические</text>
  
  <!-- Примеры ЧС -->
  <text x="350" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Примеры:</text>
  <text x="260" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#2c3e50">• Землетрясения</text>
  <text x="260" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#2c3e50">• Ураганы</text>
  <text x="260" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#2c3e50">• Наводнения</text>
  
  <!-- Нижняя часть - Действия при ЧС -->
  <rect x="40" y="340" width="420" height="1" fill="#bdc3c7"/>
  
  <text x="250" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Действия при угрозе природной ЧС</text>
  
  <!-- Иконки действий -->
  <circle cx="100" cy="380" r="15" fill="#f39c12"/>
  <path d="M100 375 L100 385 M95 380 L105 380" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Оповестить</text>
  
  <circle cx="200" cy="380" r="15" fill="#3498db"/>
  <path d="M195 380 L200 375 L205 380 L200 385 Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="200" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Укрыться</text>
  
  <circle cx="300" cy="380" r="15" fill="#e74c3c"/>
  <rect x="295" y="375" width="10" height="10" fill="white"/>
  <text x="300" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Эвакуация</text>
  
  <circle cx="400" cy="380" r="15" fill="#27ae60"/>
  <path d="M400 375 C395 375 395 385 400 385 C405 385 405 375 400 375" fill="none" stroke="white" stroke-width="2"/>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Помощь</text>
  
  <!-- Дополнительные элементы для увеличения размера и количества -->
  <line x1="50" y1="150" x2="220" y2="150" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="250" x2="220" y2="250" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="350" x2="220" y2="350" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="150" x2="450" y2="150" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="200" x2="450" y2="200" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="260" x2="450" y2="260" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="320" x2="450" y2="320" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Критерии:</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Незапланированность</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Опасность</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Масштабность</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Необходимость</text>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">  специальных мер</text>
  
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">По времени возникновения:</text>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Медленные</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Быстрые</text>
  <text x="250" y="225" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">• Взрывные</text>
  
  <!-- Дополнительные иконки -->
  <path d="M60 360 L65 365 L70 355" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="365" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Мониторинг</text>
  
  <path d="M120 360 L125 355 L130 365" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="135" y="365" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Прогноз</text>
  
  <!-- Дополнительные круговые элементы -->
  <circle cx="420" cy="150" r="8" fill="#f39c12" opacity="0.3"/>
  <circle cx="440" cy="160" r="6" fill="#f39c12" opacity="0.5"/>
  <circle cx="430" cy="175" r="10" fill="#f39c12" opacity="0.2"/>
  
  <!-- Дополнительные прямоугольники -->
  <rect x="380" y="280" width="60" height="15" rx="2" fill="#ecf0f1"/>
  <rect x="380" y="300" width="60" height="15" rx="2" fill="#ecf0f1"/>
  <rect x="380" y="320" width="60" height="15" rx="2" fill="#ecf0f1"/>
</svg>