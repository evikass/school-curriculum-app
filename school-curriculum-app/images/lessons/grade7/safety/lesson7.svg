<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#34495e"/>
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">ОБЖ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <rect x="100" y="60" width="300" height="40" rx="5" fill="#3498db"/>
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Первая помощь при кровотечениях</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="110" width="460" height="230" rx="10" fill="white" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Разделы помощи -->
  <rect x="40" y="130" width="200" height="190" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <rect x="260" y="130" width="200" height="190" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  
  <!-- Заголовок левого блока -->
  <rect x="40" y="130" width="200" height="30" rx="5" fill="#f39c12"/>
  <text x="140" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Остановка кровотечения</text>
  
  <!-- Заголовок правого блока -->
  <rect x="260" y="130" width="200" height="30" rx="5" fill="#f39c12"/>
  <text x="360" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Методы наложения жгута</text>
  
  <!-- Рука с раной -->
  <g transform="translate(90, 180)">
    <path d="M0,40 Q-10,20 -10,0 Q-10,-20 0,-30 Q10,-40 20,-40 Q30,-40 40,-30 Q50,-20 50,0 Q50,20 40,40 Q30,50 20,50 Q10,50 0,40 Z" fill="#fdbcb4" stroke="#333" stroke-width="1"/>
    <path d="M30,10 Q40,5 45,10 Q50,15 45,20 Q40,25 30,20 Z" fill="#e74c3c" stroke="#333" stroke-width="1"/>
    <circle cx="10" cy="20" r="3" fill="#333"/>
    <circle cx="15" cy="15" r="3" fill="#333"/>
    <circle cx="20" cy="10" r="3" fill="#333"/>
    <circle cx="25" cy="15" r="3" fill="#333"/>
    <circle cx="30" cy="20" r="3" fill="#333"/>
    <circle cx="15" cy="25" r="3" fill="#333"/>
    <circle cx="20" cy="30" r="3" fill="#333"/>
    <circle cx="25" cy="25" r="3" fill="#333"/>
  </g>
  
  <!-- Капли крови -->
  <path d="M140,190 Q135,195 140,200 Q145,195 140,190" fill="#e74c3c" stroke="#333" stroke-width="0.5"/>
  <path d="M145,195 Q140,200 145,205 Q150,200 145,195" fill="#e74c3c" stroke="#333" stroke-width="0.5"/>
  <path d="M150,190 Q145,195 150,200 Q155,195 150,190" fill="#e74c3c" stroke="#333" stroke-width="0.5"/>
  
  <!-- Бинт -->
  <g transform="translate(70, 220)">
    <rect x="0" y="0" width="100" height="5" rx="2" fill="white" stroke="#333" stroke-width="0.5"/>
    <rect x="0" y="7" width="100" height="5" rx="2" fill="white" stroke="#333" stroke-width="0.5"/>
    <rect x="0" y="14" width="100" height="5" rx="2" fill="white" stroke="#333" stroke-width="0.5"/>
    <rect x="0" y="21" width="100" height="5" rx="2" fill="white" stroke="#333" stroke-width="0.5"/>
  </g>
  
  <!-- Тексты в левом блоке -->
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">1. Надавливание на рану</text>
  <text x="140" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2. Бинтование</text>
  <text x="140" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">3. Поднятие конечности</text>
  <text x="140" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4. Холод на рану</text>
  
  <!-- Иконка часов -->
  <g transform="translate(410, 180)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#f39c12" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">15 минут</text>
  </g>
  
  <!-- Жгут -->
  <g transform="translate(280, 220)">
    <rect x="0" y="0" width="120" height="3" fill="#e74c3c"/>
    <rect x="0" y="5" width="120" height="3" fill="#f39c12"/>
    <rect x="0" y="10" width="120" height="3" fill="#e74c3c"/>
    <rect x="0" y="15" width="120" height="3" fill="#f39c12"/>
    <rect x="0" y="20" width="120" height="3" fill="#e74c3c"/>
    <circle cx="60" cy="12" r="15" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Иконка жгута -->
  <g transform="translate(310, 180)">
    <rect x="-10" y="-10" width="20" height="40" rx="5" fill="#3498db"/>
    <rect x="-10" y="-5" width="20" height="8" fill="#e74c3c"/>
    <rect x="-10" y="5" width="20" height="8" fill="#f39c12"/>
    <rect x="-10" y="15" width="20" height="8" fill="#e74c3c"/>
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Надежно</text>
  </g>
  
  <!-- Тексты в правом блоке -->
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">1. Выше раны</text>
  <text x="360" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2. Между 2 и 3 костями</text>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">3. Записать время</text>
  <text x="360" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4. Не снимать 1.5 часа</text>
  
  <!-- Типы кровотечений -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#e74c3c"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Артериальное</text>
    
    <rect x="110" y="0" width="100" height="30" rx="5" fill="#3498db"/>
    <text x="160" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Венозное</text>
    
    <rect x="220" y="0" width="100" height="30" rx="5" fill="#2ecc71"/>
    <text x="270" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Капиллярное</text>
    
    <rect x="330" y="0" width="100" height="30" rx="5" fill="#9b59b6"/>
    <text x="380" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Внутреннее</text>
  </g>
  
  <!-- Разделительные линии -->
  <line x1="240" y1="120" x2="240" y2="320" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="170" x2="240" y2="170" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="170" x2="460" y2="170" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Указатели -->
  <g>
    <line x1="130" y1="210" x2="120" y2="225" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="195" x2="340" y2="210" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы для достижения размера -->
  <circle cx="60" cy="190" r="3" fill="#f39c12"/>
  <circle cx="70" cy="195" r="3" fill="#f39c12"/>
  <circle cx="80" cy="190" r="3" fill="#f39c12"/>
  <circle cx="90" cy="195" r="3" fill="#f39c12"/>
  <circle cx="100" cy="190" r="3" fill="#f39c12"/>
  <circle cx="110" cy="195" r="3" fill="#f39c12"/>
  <circle cx="120" cy="190" r="3" fill="#f39c12"/>
  <circle cx="130" cy="195" r="3" fill="#f39c12"/>
  
  <circle cx="280" cy="190" r="3" fill="#f39c12"/>
  <circle cx="290" cy="195" r="3" fill="#f39c12"/>
  <circle cx="300" cy="190" r="3" fill="#f39c12"/>
  <circle cx="310" cy="195" r="3" fill="#f39c12"/>
  <circle cx="320" cy="190" r="3" fill="#f39c12"/>
  <circle cx="330" cy="195" r="3" fill="#f39c12"/>
  <circle cx="340" cy="190" r="3" fill="#f39c12"/>
  <circle cx="350" cy="195" r="3" fill="#f39c12"/>
  <circle cx="360" cy="190" r="3" fill="#f39c12"/>
  <circle cx="370" cy="195" r="3" fill="#f39c12"/>
  <circle cx="380" cy="190" r="3" fill="#f39c12"/>
  <circle cx="390" cy="195" r="3" fill="#f39c12"/>
  <circle cx="400" cy="190" r="3" fill="#f39c12"/>
  <circle cx="410" cy="195" r="3" fill="#f39c12"/>
  <circle cx="420" cy="190" r="3" fill="#f39c12"/>
  <circle cx="430" cy="195" r="3" fill="#f39c12"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="20" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Тема урока</text>
  <text x="460" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#7f8c8d">ОБЖ 7 класс</text>
  
  <!-- Поясняющие иконки -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="15" height="15" fill="#f39c12"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="10" fill="#333">Важно</text>
  </g>
  
  <g transform="translate(90, 60)">
    <rect x="0" y="0" width="15" height="15" fill="#3498db"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="10" fill="#333">Действие</text>
  </g>
  
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="15" height="15" fill="#2ecc71"/>
    <text x="20" y="12" font-family="Arial, sans-serif" font-size="10" fill="#333">Успешно</text>
  </g>
</svg>