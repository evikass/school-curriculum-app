<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="40" fill="#34495e" rx="5"/>
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ОБЖ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="60" width="300" height="30" fill="#e74c3c" rx="5"/>
  <text x="250" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Техногенные ЧС</text>
  
  <!-- Основной блок контента -->
  <rect x="20" y="100" width="460" height="230" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  
  <!-- Определение -->
  <rect x="30" y="110" width="210" height="50" fill="#ecf0f1" rx="5"/>
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Определение:</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Чрезвычайная ситуация</text>
  <text x="40" y="158" font-family="Arial, sans-serif" font-size="11" fill="#34495e">(ЧС) - это обстановка</text>
  
  <!-- Причины -->
  <rect x="250" y="110" width="220" height="50" fill="#ecf0f1" rx="5"/>
  <text x="260" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Причины возникновения:</text>
  <text x="260" y="145" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Человеческий фактор</text>
  <text x="260" y="158" font-family="Arial, sans-serif" font-size="11" fill="#34495e">• Технические неисправности</text>
  
  <!-- Категории ЧС -->
  <text x="40" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Категории ЧС:</text>
  
  <!-- Категория 1 -->
  <rect x="30" y="200" width="100" height="60" fill="#3498db" rx="5"/>
  <text x="80" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Класс А</text>
  <text x="80" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Локальные</text>
  <text x="80" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">зоны поражения</text>
  
  <!-- Категория 2 -->
  <rect x="140" y="200" width="100" height="60" fill="#9b59b6" rx="5"/>
  <text x="190" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Класс Б</text>
  <text x="190" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Муниципальные</text>
  <text x="190" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">зоны</text>
  
  <!-- Категория 3 -->
  <rect x="250" y="200" width="100" height="60" fill="#f39c12" rx="5"/>
  <text x="300" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Класс В</text>
  <text x="300" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Региональные</text>
  <text x="300" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">зоны</text>
  
  <!-- Категория 4 -->
  <rect x="360" y="200" width="100" height="60" fill="#e74c3c" rx="5"/>
  <text x="410" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Класс Г</text>
  <text x="410" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Межрегиональные</text>
  <text x="410" y="250" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">зоны</text>
  
  <!-- Линия разделения -->
  <line x1="30" y1="270" x2="470" y2="270" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Действия при ЧС -->
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Действия при ЧС:</text>
  
  <!-- Действия 1 -->
  <circle cx="60" cy="310" r="15" fill="#27ae60"/>
  <text x="60" y="315" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
  <text x="85" y="315" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Оценить обстановку</text>
  
  <!-- Действия 2 -->
  <circle cx="220" cy="310" r="15" fill="#27ae60"/>
  <text x="220" y="315" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
  <text x="245" y="315" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Сообщить о ЧС</text>
  
  <!-- Действия 3 -->
  <circle cx="360" cy="310" r="15" fill="#27ae60"/>
  <text x="360" y="315" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
  <text x="385" y="315" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Эвакуироваться</text>
  
  <!-- Значок опасности -->
  <path d="M 170 140 L 190 170 L 150 170 Z" fill="#f39c12"/>
  <text x="170" y="162" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">!</text>
  
  <!-- Стрелки между категориями -->
  <path d="M 135 230 L 135 230" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 245 230 L 245 230" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 355 230 L 355 230" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определение масштаба -->
  <rect x="30" y="165" width="200" height="25" fill="#ecf0f1" rx="3"/>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Масшрат поражения:</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="10" fill="#34495e">от локального до регионального</text>
  
  <!-- Иконка опасности -->
  <circle cx="450" cy="140" r="20" fill="#f39c12"/>
  <text x="450" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">⚠</text>
  
  <!-- Текст предупреждения -->
  <text x="420" y="115" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">ОПАСНО</text>
  
  <!-- Статистика -->
  <rect x="260" y="165" width="200" height="25" fill="#ecf0f1" rx="3"/>
  <text x="270" y="175" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Статистика ЧС:</text>
  <text x="270" y="185" font-family="Arial, sans-serif" font-size="10" fill="#34495e">70% - человеческий фактор</text>
  
  <!-- Символ спасения -->
  <path d="M 30 290 L 40 300 L 30 310 L 20 300 Z" fill="#3498db"/>
  <text x="30" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">S</text>
  
  <!-- Символ тревоги -->
  <path d="M 470 290 L 480 300 L 470 310 L 460 300 Z" fill="#e74c3c"/>
  <text x="470" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">T</text>
  
  <!-- Дополнительные элементы для размера -->
  <rect x="40" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="100" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="160" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="220" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="280" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="340" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="400" y="100" width="3" height="20" fill="#f39c12"/>
  <rect x="460" y="100" width="3" height="20" fill="#f39c12"/>
  
  <!-- Маркеры для увеличения размера -->
  <circle cx="50" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="120" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="190" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="260" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="330" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="400" cy="130" r="2" fill="#95a5a6"/>
  <circle cx="450" cy="130" r="2" fill="#95a5a6"/>
  
  <circle cx="50" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="120" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="190" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="260" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="330" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="400" cy="150" r="2" fill="#95a5a6"/>
  <circle cx="450" cy="150" r="2" fill="#95a5a6"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>