<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="atomGrad2">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1864ab;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#e1f5fe" opacity="0.5"/>
  <circle cx="450" cy="300" r="40" fill="#e1f5fe" opacity="0.5"/>
  <circle cx="420" cy="80" r="25" fill="#e1f5fe" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">
    ХИМИЯ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1565c0">
    Урок 8. Типы химических реакций
  </text>
  
  <!-- Карточки с типами реакций -->
  
  <!-- 1. Соединение -->
  <g transform="translate(40, 90)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#90caf9" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">
      Соединение
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      A + B → AB
    </text>
    
    <!-- Атомы -->
    <circle cx="40" cy="80" r="12" fill="url(#atomGrad)"/>
    <circle cx="90" cy="80" r="12" fill="url(#atomGrad2)"/>
    <text x="40" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
    
    <!-- Стрелка -->
    <path d="M 60 95 L 100 95" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Молекула -->
    <ellipse cx="130" cy="80" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="130" cy="80" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="130" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AB</text>
  </g>
  
  <!-- 2. Разложение -->
  <g transform="translate(280, 90)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#90caf9" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">
      Разложение
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      AB → A + B
    </text>
    
    <!-- Молекула -->
    <ellipse cx="90" cy="80" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="90" cy="80" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AB</text>
    
    <!-- Стрелка -->
    <path d="M 90 95 L 90 110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Атомы -->
    <circle cx="50" cy="125" r="12" fill="url(#atomGrad)"/>
    <circle cx="130" cy="125" r="12" fill="url(#atomGrad2)"/>
    <text x="50" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">A</text>
    <text x="130" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
  </g>
  
  <!-- 3. Замещение -->
  <g transform="translate(40, 220)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#90caf9" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">
      Замещение
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      AB + C → AC + B
    </text>
    
    <!-- Реагенты -->
    <ellipse cx="40" cy="80" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="40" cy="80" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="40" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AB</text>
    
    <circle cx="90" cy="80" r="12" fill="url(#atomGrad)"/>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C</text>
    
    <!-- Стрелка -->
    <path d="M 60 95 L 100 95" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Продукты -->
    <ellipse cx="40" cy="125" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="40" cy="125" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="40" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AC</text>
    
    <circle cx="90" cy="125" r="12" fill="url(#atomGrad2)"/>
    <text x="90" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B</text>
  </g>
  
  <!-- 4. Обмен -->
  <g transform="translate(280, 220)">
    <rect width="180" height="120" rx="10" fill="url(#cardGrad)" stroke="#90caf9" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">
      Обмен
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      AB + CD → AD + CB
    </text>
    
    <!-- Реагенты -->
    <ellipse cx="40" cy="75" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="40" cy="75" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AB</text>
    
    <ellipse cx="90" cy="75" rx="20" ry="15" fill="url(#atomGrad2)" opacity="0.7"/>
    <ellipse cx="90" cy="75" rx="15" ry="20" fill="url(#atomGrad)" opacity="0.7"/>
    <text x="90" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">CD</text>
    
    <!-- Стрелка -->
    <path d="M 60 95 L 100 95" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Продукты -->
    <ellipse cx="40" cy="125" rx="20" ry="15" fill="url(#atomGrad)" opacity="0.7"/>
    <ellipse cx="40" cy="125" rx="15" ry="20" fill="url(#atomGrad2)" opacity="0.7"/>
    <text x="40" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">AD</text>
    
    <ellipse cx="90" cy="125" rx="20" ry="15" fill="url(#atomGrad2)" opacity="0.7"/>
    <ellipse cx="90" cy="125" rx="15" ry="20" fill="url(#atomGrad)" opacity="0.7"/>
    <text x="90" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">CB</text>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <!-- Молекулярная формула примера -->
  <g transform="translate(160, 270)">
    <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">
      Пример: 2H₂ + O₂ → 2H₂O
    </text>
  </g>
  
  <!-- Декоративные молекулы -->
  <g opacity="0.3">
    <circle cx="150" cy="50" r="5" fill="#42a5f5"/>
    <circle cx="160" cy="55" r="4" fill="#ef5350"/>
    <circle cx="155" cy="45" r="4" fill="#42a5f5"/>
    
    <circle cx="350" cy="320" r="6" fill="#66bb6a"/>
    <circle cx="360" cy="315" r="5" fill="#ffa726"/>
    <circle cx="355" cy="325" r="5" fill="#66bb6a"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(250, 290)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Типы реакций: 1. Соединение 2. Разложение 3. Замещение 4. Обмен
    </text>
  </g>
</svg>