<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff9800;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:0.4" />
    </radialGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="url(#atomGrad)" opacity="0.3"/>
  <circle cx="450" cy="300" r="25" fill="url(#atomGrad)" opacity="0.3"/>
  
  <!-- Атом в углу -->
  <g transform="translate(50,50)">
    <circle cx="0" cy="0" r="3" fill="#ffeb3b"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#ff9800" stroke-width="2" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#ff9800" stroke-width="2" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#ff9800" stroke-width="2" transform="rotate(150)"/>
    <circle cx="15" cy="0" r="2" fill="#f44336"/>
    <circle cx="-10" cy="10" r="2" fill="#4caf50"/>
    <circle cx="-10" cy="-10" r="2" fill="#2196f3"/>
  </g>
  
  <!-- Заголовок -->
  <rect x="150" y="20" width="200" height="40" rx="20" fill="url(#titleGrad)"/>
  <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">ФИЗИКА · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c5aa0">Урок 1. Что изучает физика</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="100" width="440" height="220" rx="10" fill="url(#boxGrad)" stroke="#b0bec5" stroke-width="2"/>
  
  <!-- Секция "Физические величины" -->
  <rect x="50" y="120" width="400" height="30" rx="5" fill="#4a90e2" opacity="0.2"/>
  <text x="250" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c5aa0">Физические величины</text>
  
  <!-- Колонки с величинами -->
  <!-- Левая колонка -->
  <g transform="translate(70, 170)">
    <!-- Длина -->
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#81c784" opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Длина</text>
    
    <!-- Масса -->
    <rect x="0" y="35" width="80" height="25" rx="3" fill="#64b5f6" opacity="0.3"/>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Масса</text>
    
    <!-- Время -->
    <rect x="0" y="70" width="80" height="25" rx="3" fill="#ffb74d" opacity="0.3"/>
    <text x="40" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ef6c00">Время</text>
    
    <!-- Сила -->
    <rect x="0" y="105" width="80" height="25" rx="3" fill="#e57373" opacity="0.3"/>
    <text x="40" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c62828">Сила</text>
  </g>
  
  <!-- Центральная колонка -->
  <g transform="translate(170, 170)">
    <!-- Скорость -->
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#ba68c8" opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Скорость</text>
    
    -- Плотность -->
    <rect x="0" y="35" width="80" height="25" rx="3" fill="#4db6ac" opacity="0.3"/>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#00695c">Плотность</text>
    
    -- Температура -->
    <rect x="0" y="70" width="80" height="25" rx="3" fill="#ff8a65" opacity="0.3"/>
    <text x="40" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d84315">Температура</text>
    
    -- Давление -->
    <rect x="0" y="105" width="80" height="25" rx="3" fill="#90caf9" opacity="0.3"/>
    <text x="40" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Давление</text>
  </g>
  
  <!-- Правая колонка -->
  <g transform="translate(270, 170)">
    -- Энергия -->
    <rect x="0" y="0" width="80" height="25" rx="3" fill="#ffd54f" opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57f17">Энергия</text>
    
    -- Мощность -->
    <rect x="0" y="35" width="80" height="25" rx="3" fill="#a1887f" opacity="0.3"/>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">Мощность</text>
    
    -- Заряд -->
    <rect x="0" y="70" width="80" height="25" rx="3" fill="#ce93d8" opacity="0.3"/>
    <text x="40" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Заряд</text>
    
    -- Напряжение -->
    <rect x="0" y="105" width="80" height="25" rx="3" fill="#80deea" opacity="0.3"/>
    <text x="40" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#00838f">Напряжение</text>
  </g>
  
  <!-- Справочная информация -->
  <g transform="translate(370, 170)">
    <!-- Единицы измерения -->
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#666">Единицы:</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="9" fill="#888">м, кг, с, Н</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="9" fill="#888">м/с, кг/м³</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="9" fill="#888">°C, Па</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="9" fill="#888">Дж, Вт</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="9" fill="#888">Кл, В</text>
    
    <!-- Инструменты -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="10" fill="#666">Инструменты:</text>
    <text x="0" y="125" font-family="Arial, sans-serif" font-size="9" fill="#888">линейка, весы</text>
  </g>
  
  <!-- Иконки измерений -->
  <!-- Линейка -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="40" height="4" fill="#4a90e2"/>
    <rect x="5" y="-2" width="1" height="8" fill="#2c5aa0"/>
    <rect x="15" y="-2" width="1" height="8" fill="#2c5aa0"/>
    <rect x="25" y="-2" width="1" height="8" fill="#2c5aa0"/>
    <rect x="35" y="-2" width="1" height="8" fill="#2c5aa0"/>
  </g>
  
  <!-- Часы -->
  <g transform="translate(160, 140)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#ff9800" stroke-width="2"/>
    <line x1="15" y1="15" x2="15" y2="8" stroke="#ff9800" stroke-width="2"/>
    <line x1="15" y1="15" x2="19" y2="15" stroke="#ff9800" stroke-width="2"/>
    <circle cx="15" cy="15" r="2" fill="#ff9800"/>
  </g>
  
  <!-- Термометр -->
  <g transform="translate(260, 140)">
    <rect x="5" y="0" width="8" height="20" rx="4" fill="#e57373"/>
    <circle cx="9" cy="22" r="4" fill="#e57373"/>
    <rect x="7" y="5" width="4" height="12" fill="#ff5722"/>
  </g>
  
  <!-- Манометр -->
  <g transform="translate(360, 140)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#64b5f6" stroke-width="2"/>
    <path d="M15 15 L20 10" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="15" y="20" text-anchor="middle" font-size="8" fill="#1565c0">P</text>
  </g>
  
  <!-- Стрелка для манометра -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64b5f6"/>
    </marker>
  </defs>
  
  <!-- Нижняя строка пояснений -->
  <text x="50" y="305" font-family="Arial, sans-serif" font-size="11" fill="#666">Физическая величина — это свойство, которое можно измерить</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="11" fill="#666">и выразить числом с помощью единиц измерения</text>
  
  <!-- Дополнительные элементы -->
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="10" fill="#999">2024</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="10" fill="#999">Урок 1</text>
</svg>