<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF4757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон неба -->
  <rect x="0" y="0" width="500" height="250" fill="url(#skyGrad)" />
  
  <!-- Облака -->
  <g id="clouds">
    <ellipse cx="100" cy="50" rx="30" ry="20" fill="white" opacity="0.8"/>
    <ellipse cx="120" cy="45" rx="35" ry="25" fill="white" opacity="0.8"/>
    <ellipse cx="140" cy="50" rx="30" ry="20" fill="white" opacity="0.8"/>
    
    <ellipse cx="350" cy="80" rx="25" ry="15" fill="white" opacity="0.7"/>
    <ellipse cx="365" cy="75" rx="30" ry="20" fill="white" opacity="0.7"/>
    <ellipse cx="380" cy="80" rx="25" ry="15" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Дорога -->
  <rect x="0" y="250" width="500" height="100" fill="url(#roadGrad)" />
  
  <!-- Разметка дороги -->
  <g id="roadLines">
    <rect x="50" y="290" width="40" height="5" fill="white"/>
    <rect x="120" y="290" width="40" height="5" fill="white"/>
    <rect x="190" y="290" width="40" height="5" fill="white"/>
    <rect x="260" y="290" width="40" height="5" fill="white"/>
    <rect x="330" y="290" width="40" height="5" fill="white"/>
    <rect x="400" y="290" width="40" height="5" fill="white"/>
  </g>
  
  <!-- Машина -->
  <g id="car">
    <!-- Кузов -->
    <rect x="80" y="220" width="120" height="40" rx="5" fill="url(#carGrad)" />
    <!-- Кабина -->
    <rect x="170" y="210" width="30" height="30" rx="3" fill="url(#carGrad)" />
    <!-- Колеса -->
    <circle cx="110" cy="265" r="12" fill="#333"/>
    <circle cx="110" cy="265" r="8" fill="#666"/>
    <circle cx="180" cy="265" r="12" fill="#333"/>
    <circle cx="180" cy="265" r="8" fill="#666"/>
    <!-- Фары -->
    <ellipse cx="210" cy="235" rx="8" ry="5" fill="#FFD93D" opacity="0.8"/>
  </g>
  
  <!-- Стрелка скорости -->
  <g id="velocityArrow">
    <line x1="150" y1="240" x2="250" y2="240" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="200" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#2C3E50">v</text>
  </g>
  
  <!-- Стрелка направления движения -->
  <g id="directionArrow">
    <line x1="220" y1="240" x2="300" y2="240" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
    <text x="260" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#E74C3C">→</text>
  </g>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGrad)" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C" />
    </marker>
  </defs>
  
  <!-- Линия времени -->
  <g id="timeLine">
    <line x1="50" y1="310" x2="450" y2="310" stroke="#34495E" stroke-width="2"/>
    <text x="30" y="315" font-family="Arial" font-size="12" fill="#34495E">t</text>
    
    <!-- Метки времени -->
    <line x1="100" y1="305" x2="100" y2="315" stroke="#34495E" stroke-width="2"/>
    <text x="100" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#34495E">t₁</text>
    
    <line x1="200" y1="305" x2="200" y2="315" stroke="#34495E" stroke-width="2"/>
    <text x="200" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#34495E">t₂</text>
    
    <line x1="300" y1="305" x2="300" y2="315" stroke="#34495E" stroke-width="2"/>
    <text x="300" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#34495E">t₃</text>
  </g>
  
  <!-- Траектория движения -->
  <path d="M 80 240 Q 150 235 220 240 T 350 240" stroke="#9B59B6" stroke-width="2" fill="none" stroke-dasharray="3,3" opacity="0.7"/>
  
  <!-- Солнце -->
  <circle cx="420" cy="60" r="30" fill="#FFD93D" opacity="0.8"/>
  <g id="sunRays">
    <line x1="420" y1="20" x2="420" y2="10" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="420" y1="100" x2="420" y2="110" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="380" y1="60" x2="370" y2="60" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="460" y1="60" x2="470" y2="60" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="395" y1="35" x2="387" y2="27" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="445" y1="85" x2="453" y2="93" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="395" y1="85" x2="387" y2="93" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
    <line x1="445" y1="35" x2="453" y2="27" stroke="#FFD93D" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- Формула скорости -->
  <g id="formula">
    <rect x="300" y="80" width="180" height="60" rx="5" fill="white" stroke="#3498DB" stroke-width="2" opacity="0.9"/>
    <text x="390" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#2C3E50">v = s/t</text>
    <text x="390" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F8C8D">скорость = путь/время</text>
  </g>
  
  <!-- Подписи элементов -->
  <text x="140" y="200" font-family="Arial" font-size="12" fill="#2C3E50">Машина</text>
  <text x="30" y="240" font-family="Arial" font-size="12" fill="#2C3E50">Начало</text>
  <text x="320" y="200" font-family="Arial" font-size="12" fill="#2C3E50">Конец</text>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#2C3E50">ФИЗИКА · 7 КЛАСС</text>
  <text x="250" y="50" text-anchor="middle" font-family="Arial" font-size="16" fill="#34495E">Урок 4. Механическое движение</text>
  <text x="250" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#7F8C8D">Движение, скорость</text>
  
  <!-- Единицы измерения -->
  <g id="units">
    <rect x="20" y="100" width="160" height="80" rx="5" fill="white" stroke="#E74C3C" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#2C3E50">Единицы измерения:</text>
    <text x="30" y="140" font-family="Arial" font-size="11" fill="#34495E">• Скорость: м/с, км/ч</text>
    <text x="30" y="155" font-family="Arial" font-size="11" fill="#34495E">• Путь: м, км</text>
    <text x="30" y="170" font-family="Arial" font-size="11" fill="#34495E">• Время: с, мин, ч</text>
  </g>
  
  <!-- Типы движения -->
  <g id="motionTypes">
    <rect x="20" y="200" width="160" height="100" rx="5" fill="white" stroke="#27AE60" stroke-width="1.5" opacity="0.9"/>
    <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#2C3E50">Типы движения:</text>
    <text x="30" y="240" font-family="Arial" font-size="11" fill="#34495E">• Равномерное</text>
    <text x="30" y="255" font-family="Arial" font-size="11" fill="#34495E">• Равнопеременное</text>
    <text x="30" y="270" font-family="Arial" font-size="11" fill="#34495E">• Прямолинейное</text>
    <text x="30" y="285" font-family="Arial" font-size="11" fill="#34495E">• Криволинейное</text>
  </g>
  
  <!-- Измерительная шкала -->
  <g id="scale">
    <line x1="50" y1="180" x2="150" y2="180" stroke="#16A085" stroke-width="2"/>
    <line x1="50" y1="175" x2="50" y2="185" stroke="#16A085" stroke-width="2"/>
    <line x1="75" y1="177" x2="75" y2="183" stroke="#16A085" stroke-width="2"/>
    <line x1="100" y1="175" x2="100" y2="185" stroke="#16A085" stroke-width="2"/>
    <line x1="125" y1="177" x2="125" y2="183" stroke="#16A085" stroke-width="2"/>
    <line x1="150" y1="175" x2="150" y2="185" stroke="#16A085" stroke-width="2"/>
    <text x="100" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="#16A085">путь (s)</text>
  </g>
  
  <!-- График скорости -->
  <g id="speedGraph">
    <rect x="300" y="150" width="180" height="80" rx="5" fill="white" stroke="#8E44AD" stroke-width="1.5" opacity="0.9"/>
    <text x="390" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#2C3E50">График скорости</text>
    <polyline points="320,210 340,200 360,200 380,190 400,190 420,180 440,180" 
              fill="none" stroke="#8E44AD" stroke-width="2"/>
    <text x="430" y="175" font-family="Arial" font-size="10" fill="#8E44AD">v(t)</text>
  </g>
</svg>