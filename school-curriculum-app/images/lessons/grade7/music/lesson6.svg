<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#9b59b6">МУЗЫКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="45" width="300" height="35" rx="5" fill="url(#accentGradient)" />
  <text x="250" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Романтизм в музыке</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Зарубежная музыка</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="110" width="460" height="220" rx="10" fill="white" stroke="#9b59b6" stroke-width="2" opacity="0.9" />
  
  <!-- Временная шкала -->
  <text x="40" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Временная шкала</text>
  <line x1="40" y1="145" x2="460" y2="145" stroke="#9b59b6" stroke-width="2" />
  
  <!-- Даты на временной шкале -->
  <line x1="80" y1="140" x2="80" y2="150" stroke="#9b59b6" stroke-width="2" />
  <text x="80" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1820</text>
  
  <line x1="180" y1="140" x2="180" y2="150" stroke="#9b59b6" stroke-width="2" />
  <text x="180" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1850</text>
  
  <line x1="280" y1="140" x2="280" y2="150" stroke="#9b59b6" stroke-width="2" />
  <text x="280" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1880</text>
  
  <line x1="380" y1="140" x2="380" y2="150" stroke="#9b59b6" stroke-width="2" />
  <text x="380" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">1900</text>
  
  <!-- Разделы урока -->
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Ключевые композиторы</text>
  
  <!-- Композитор 1 -->
  <circle cx="80" cy="220" r="15" fill="#9b59b6" opacity="0.7" />
  <text x="80" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Ф.Ш.</text>
  <text x="80" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Ф.Шуберт</text>
  
  <!-- Композитор 2 -->
  <circle cx="180" cy="220" r="15" fill="#9b59b6" opacity="0.7" />
  <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Р.В.</text>
  <text x="180" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Р.Вагнер</text>
  
  <!-- Композитор 3 -->
  <circle cx="280" cy="220" r="15" fill="#9b59b6" opacity="0.7" />
  <text x="280" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Ф.Л.</text>
  <text x="280" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Ф.Лист</text>
  
  <!-- Композитор 4 -->
  <circle cx="380" cy="220" r="15" fill="#9b59b6" opacity="0.7" />
  <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">П.Ч.</text>
  <text x="380" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">П.Чайковский</text>
  
  <!-- Жанры музыки -->
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Жанры романтизма</text>
  
  <!-- Жанр 1 -->
  <rect x="40" y="285" width="80" height="25" rx="5" fill="#9b59b6" opacity="0.5" />
  <text x="80" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Симфония</text>
  
  <!-- Жанр 2 -->
  <rect x="130" y="285" width="80" height="25" rx="5" fill="#9b59b6" opacity="0.5" />
  <text x="170" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Романс</text>
  
  <!-- Жанр 3 -->
  <rect x="220" y="285" width="80" height="25" rx="5" fill="#9b59b6" opacity="0.5" />
  <text x="260" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Программная</text>
  
  <!-- Жанр 4 -->
  <rect x="310" y="285" width="80" height="25" rx="5" fill="#9b59b6" opacity="0.5" />
  <text x="350" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Фортепианная</text>
  
  <!-- Жанр 5 -->
  <rect x="400" y="285" width="60" height="25" rx="5" fill="#9b59b6" opacity="0.5" />
  <text x="430" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Опера</text>
  
  <!-- Значки инструментов -->
  <g transform="translate(40, 200)">
    <path d="M10,0 C10,0 5,5 5,10 C5,15 10,20 10,20 C10,20 15,15 15,10 C15,5 10,0 10,0 Z" fill="#9b59b6" />
    <line x1="10" y1="20" x2="10" y2="30" stroke="#9b59b6" stroke-width="2" />
  </g>
  
  <!-- Музыкальные ноты -->
  <g transform="translate(420, 200)">
    <ellipse cx="10" cy="5" rx="5" ry="4" fill="#9b59b6" />
    <ellipse cx="25" cy="10" rx="5" ry="4" fill="#9b59b6" />
    <ellipse cx="40" cy="5" rx="5" ry="4" fill="#9b59b6" />
    <line x1="10" y1="5" x2="10" y2="20" stroke="#9b59b6" stroke-width="2" />
    <line x1="25" y1="10" x2="25" y2="25" stroke="#9b59b6" stroke-width="2" />
    <line x1="40" y1="5" x2="40" y2="20" stroke="#9b59b6" stroke-width="2" />
    <line x1="5" y1="20" x2="45" y2="20" stroke="#9b59b6" stroke-width="2" />
    <line x1="5" y1="25" x2="45" y2="25" stroke="#9b59b6" stroke-width="2" />
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#9b59b6" opacity="0.5" />
  <circle cx="470" cy="30" r="3" fill="#9b59b6" opacity="0.5" />
  <circle cx="30" cy="320" r="3" fill="#9b59b6" opacity="0.5" />
  <circle cx="470" cy="320" r="3" fill="#9b59b6" opacity="0.5" />
  
  <!-- Стрелки связи -->
  <path d="M95,220 L165,220" stroke="#9b59b6" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <path d="M195,220 L265,220" stroke="#9b59b6" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <path d="M295,220 L365,220" stroke="#9b59b6" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Определения -->
  <text x="120" y="255" font-family="Arial, sans-serif" font-size="9" fill="#666">"Зимнее путешествие"</text>
  <text x="220" y="255" font-family="Arial, sans-serif" font-size="9" fill="#666">"Кольцо нибелунга"</text>
  <text x="320" y="255" font-family="Arial, sans-serif" font-size="9" fill="#666">"Венгерская рапсодия"</text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6" />
    </marker>
  </defs>
  
  <!-- Важные даты -->
  <text x="250" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Романтизм: эпоха чувств и воображения (1820-1900)</text>
</svg>