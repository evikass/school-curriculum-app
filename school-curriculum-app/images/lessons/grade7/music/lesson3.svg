<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#9b59b6"/>
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">МУЗЫКА · 7 КЛАСС</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="50" width="460" height="280" fill="white" stroke="#9b59b6" stroke-width="2" rx="10"/>
  
  <!-- Название урока -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#9b59b6">М.И. Глинка — основоположник русской классики</text>
  
  <!-- Портрет Глинки -->
  <circle cx="100" cy="150" r="40" fill="#e8daef" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="90" cy="140" r="3" fill="#9b59b6"/>
  <circle cx="110" cy="140" r="3" fill="#9b59b6"/>
  <path d="M 85 155 Q 100 170 115 155" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">М.И. Глинка</text>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">1804-1857</text>
  
  <!-- Временная шкала -->
  <line x1="30" y1="240" x2="470" y2="240" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="100" cy="240" r="5" fill="#9b59b6"/>
  <circle cx="200" cy="240" r="5" fill="#9b59b6"/>
  <circle cx="300" cy="240" r="5" fill="#9b59b6"/>
  <circle cx="400" cy="240" r="5" fill="#9b59b6"/>
  
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1804</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1830</text>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1840</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1857</text>
  
  <!-- Ключевые произведения -->
  <text x="180" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Ключевые произведения:</text>
  
  <rect x="180" y="130" width="150" height="20" fill="#f0e6f7" stroke="#9b59b6" stroke-width="1" rx="5"/>
  <text x="255" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Жизнь за царя</text>
  
  <rect x="180" y="155" width="150" height="20" fill="#f0e6f7" stroke="#9b59b6" stroke-width="1" rx="5"/>
  <text x="255" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Руслан и Людмила</text>
  
  <rect x="340" y="130" width="150" height="20" fill="#f0e6f7" stroke="#9b59b6" stroke-width="1" rx="5"/>
  <text x="415" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Каменный гость</text>
  
  <rect x="340" y="155" width="150" height="20" fill="#f0e6f7" stroke="#9b59b6" stroke-width="1" rx="5"/>
  <text x="415" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Иван Сусанин</text>
  
  <!-- Значение Глинки -->
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">Значение:</text>
  <text x="30" y="305" font-family="Arial, sans-serif" font-size="10" fill="#333">• Создал первую русскую национальную оперу</text>
  <text x="30" y="320" font-family="Arial, sans-serif" font-size="10" fill="#333">• Ввел русский фольклор в академическую музыку</text>
  <text x="30" y="335" font-family="Arial, sans-serif" font-size="10" fill="#333">• Основоположник русского музыкального классицизма</text>
  
  <!-- Музыкальные символы -->
  <path d="M 150 110 Q 145 105 150 100 L 150 110" fill="#9b59b6"/>
  <rect x="149" y="95" width="2" height="20" fill="#9b59b6"/>
  <path d="M 152 95 L 162 95" stroke="#9b59b6" stroke-width="1"/>
  
  <circle cx="165" cy="105" r="4" fill="#9b59b6"/>
  <rect x="167" y="95" width="2" height="15" fill="#9b59b6"/>
  <path d="M 169 95 L 179 95" stroke="#9b59b6" stroke-width="1"/>
  
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="16" fill="#9b59b6">♪</text>
  <text x="420" y="100" font-family="Arial, sans-serif" font-size="16" fill="#9b59b6">♫</text>
  <text x="440" y="100" font-family="Arial, sans-serif" font-size="16" fill="#9b59b6">♬</text>
  
  <!-- Декоративные элементы -->
  <path d="M 450 200 Q 460 190 470 200" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <path d="M 450 210 Q 460 200 470 210" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <path d="M 450 220 Q 460 210 470 220" stroke="#9b59b6" stroke-width="2" fill="none"/>
  
  <rect x="350" y="195" width="50" height="30" fill="#f0e6f7" stroke="#9b59b6" stroke-width="1" rx="5"/>
  <text x="375" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">русская</text>
  <text x="375" y="222" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">опера</text>
  
  <!-- Схема влияния -->
  <text x="180" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">Влияние на后续 композиторов:</text>
  <line x1="180" y1="300" x2="180" y2="320" stroke="#9b59b6" stroke-width="1"/>
  <line x1="180" y1="305" x2="220" y2="305" stroke="#9b59b6" stroke-width="1"/>
  <line x1="180" y1="315" x2="220" y2="315" stroke="#9b59b6" stroke-width="1"/>
  <text x="225" y="308" font-family="Arial, sans-serif" font-size="10" fill="#333">Бородин</text>
  <text x="225" y="318" font-family="Arial, sans-serif" font-size="10" fill="#333">Римский-Корсаков</text>
  
  <!-- Дополнительные элементы для достижения требуемого количества -->
  <rect x="30" y="60" width="40" height="2" fill="#9b59b6"/>
  <rect x="430" y="60" width="40" height="2" fill="#9b59b6"/>
  
  <circle cx="50" cy="200" r="3" fill="#9b59b6"/>
  <circle cx="60" cy="210" r="3" fill="#9b59b6"/>
  <circle cx="70" cy="200" r="3" fill="#9b59b6"/>
  <circle cx="80" cy="210" r="3" fill="#9b59b6"/>
  
  <path d="M 350 280 L 360 290 L 370 280" stroke="#9b59b6" stroke-width="1" fill="none"/>
  <path d="M 380 280 L 390 290 L 400 280" stroke="#9b59b6" stroke-width="1" fill="none"/>
  <path d="M 410 280 L 420 290 L 430 280" stroke="#9b59b6" stroke-width="1" fill="none"/>
  
  <text x="160" y="340" font-family="Arial, sans-serif" font-size="9" fill="#666">Русская музыка XIX века</text>
  
  <rect x="340" y="270" width="30" height="15" fill="#e8daef" stroke="#9b59b6" stroke-width="1"/>
  <text x="355" y="280" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">романс</text>
  
  <line x1="40" y1="170" x2="40" y2="190" stroke="#9b59b6" stroke-width="1"/>
  <line x1="45" y1="175" x2="45" y2="185" stroke="#9b59b6" stroke-width="1"/>
  <line x1="50" y1="170" x2="50" y2="190" stroke="#9b59b6" stroke-width="1"/>
  <line x1="55" y1="175" x2="55" y2="185" stroke="#9b59b6" stroke-width="1"/>
  
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#9b59b6">"Музыка должна выражать душу народа"</text>
  
  <rect x="200" y="80" width="5" height="5" fill="#9b59b6"/>
  <rect x="210" y="80" width="5" height="5" fill="#9b59b6"/>
  <rect x="220" y="80" width="5" height="5" fill="#9b59b6"/>
  
  <path d="M 150 170 L 155 175 L 150 180 L 155 185" stroke="#9b59b6" stroke-width="1" fill="none"/>
  <path d="M 160 170 L 165 175 L 160 180 L 165 185" stroke="#9b59b6" stroke-width="1" fill="none"/>
</svg>