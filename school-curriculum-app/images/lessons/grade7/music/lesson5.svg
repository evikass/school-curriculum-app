<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#9b59b6"/>
  <text x="250" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">МУЗЫКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#9b59b6">Венская классическая школа</text>
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">Зарубежная музыка</text>
  
  <!-- Основной контейнер для иллюстрации -->
  <rect x="20" y="120" width="460" height="210" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
  
  <!-- Граница с акцентом -->
  <rect x="20" y="120" width="460" height="20" fill="#9b59b6" rx="5"/>
  <text x="250" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">XVIII - начало XIX века</text>
  
  <!-- Ключевые композиторы -->
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Ключевые композиторы:</text>
  
  <!-- Гайдн -->
  <circle cx="80" cy="200" r="30" fill="#9b59b6" opacity="0.8"/>
  <text x="80" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Гайдн</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">1732-1809</text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">"Отец симфонии"</text>
  
  <!-- Моцарт -->
  <circle cx="180" cy="200" r="30" fill="#9b59b6" opacity="0.8"/>
  <text x="180" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Моцарт</text>
  <text x="180" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">1756-1791</text>
  <text x="180" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">"Вундеркинд"</text>
  
  <!-- Бетховен -->
  <circle cx="280" cy="200" r="30" fill="#9b59b6" opacity="0.8"/>
  <text x="280" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Бетховен</text>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">1770-1827</text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">"Между классикой и романтизмом"</text>
  
  <!-- Шуберт -->
  <circle cx="380" cy="200" r="30" fill="#9b59b6" opacity="0.8"/>
  <text x="380" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Шуберт</text>
  <text x="380" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">1797-1828</text>
  <text x="380" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">"Последний классик"</text>
  
  <!-- Линии соединения -->
  <line x1="110" y1="200" x2="150" y2="200" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="210" y1="200" x2="250" y2="200" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="310" y1="200" x2="350" y2="200" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Характерные черты -->
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Характерные черты:</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="11" fill="#555">• Рациональность • Гармоническая ясность • Форма сонатного цикла • Тематическое развитие</text>
  
  <!-- Декоративные элементы -->
  <path d="M 420 170 Q 440 190, 420 210" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <path d="M 440 170 Q 460 190, 440 210" stroke="#9b59b6" stroke-width="2" fill="none"/>
  
  <!-- Музыкальные символы -->
  <g transform="translate(50, 50)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#9b59b6" transform="rotate(-20)"/>
    <rect x="6" y="-15" width="2" height="15" fill="#9b59b6"/>
    <path d="M 8 -15 Q 12 -12, 15 -8" stroke="#9b59b6" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(450, 50)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#9b59b6" transform="rotate(-20)"/>
    <rect x="6" y="-15" width="2" height="15" fill="#9b59b6"/>
    <path d="M 8 -15 Q 12 -12, 15 -8" stroke="#9b59b6" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Основные жанры -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Основные жанры:</text>
  <rect x="150" y="305" width="60" height="20" fill="#9b59b6" opacity="0.7" rx="10"/>
  <text x="180" y="318" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Симфония</text>
  <rect x="220" y="305" width="60" height="20" fill="#9b59b6" opacity="0.7" rx="10"/>
  <text x="250" y="318" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Квартет</text>
  <rect x="290" y="305" width="60" height="20" fill="#9b59b6" opacity="0.7" rx="10"/>
  <text x="320" y="318" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Концерт</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="40" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="50" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="420" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="430" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="440" cy="320" r="3" fill="#9b59b6"/>
  
  <!-- Текстовые блоки с дополнительной информацией -->
  <rect x="20" y="170" width="35" height="100" fill="#9b59b6" opacity="0.2" rx="3"/>
  <text x="37" y="185" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#9b59b6" font-weight="bold">Вена</text>
  <text x="37" y="198" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#777">Столица</text>
  <text x="37" y="208" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#777">музыки</text>
  
  <!-- Схема влияния -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="10" fill="#777">Влияние:</text>
  <path d="M 380 190 L 400 190" stroke="#9b59b6" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 380 200 L 400 210" stroke="#9b59b6" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 380 210 L 400 230" stroke="#9b59b6" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M 100 160 Q 110 150, 120 160" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 200 160 Q 210 150, 220 160" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 300 160 Q 310 150, 320 160" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 400 160 Q 410 150, 420 160" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- Ключевые термины -->
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">Классицизм</text>
  <text x="420" y="140" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6" text-anchor="end">Эпоха Просвещения</text>
  
  <!-- Разделительная линия -->
  <line x1="70" y1="290" x2="430" y2="290" stroke="#9b59b6" stroke-width="1" opacity="0.5"/>
  
  <!-- Указатель периода -->
  <text x="250" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#777">Классический период</text>
  
  <!-- Дополнительные элементы -->
  <rect x="20" y="160" width="3" height="20" fill="#9b59b6"/>
  <rect x="477" y="160" width="3" height="20" fill="#9b59b6"/>
  
  <!-- Текстовая нота внизу -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#777" font-style="italic">"Музыка должна гореть, а не мерцать" — Л. Бетховен</text>
</svg>