<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#9b59b6">МУЗЫКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#8e44ad">Электронная и популярная музыка</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">Тема: Современная музыка</text>
  
  <!-- Разделительная линия -->
  <line x1="100" y1="100" x2="400" y2="100" stroke="#9b59b6" stroke-width="2"/>
  
  <!-- Левая часть: Электронная музыка -->
  <rect x="50" y="120" width="180" height="200" rx="10" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9b59b6">Электронная музыка</text>
  
  <!-- Иконка синтезатора -->
  <rect x="100" y="160" width="80" height="50" rx="5" fill="#9b59b6"/>
  <rect x="110" y="170" width="60" height="5" fill="#fff"/>
  <rect x="110" y="180" width="60" height="5" fill="#fff"/>
  <rect x="110" y="190" width="60" height="5" fill="#fff"/>
  <circle cx="120" cy="200" r="8" fill="#fff"/>
  <circle cx="140" cy="200" r="8" fill="#fff"/>
  <circle cx="160" cy="200" r="8" fill="#fff"/>
  
  <!-- Характеристики электронной музыки -->
  <text x="140" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Звуковые волны</text>
  <text x="140" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Синтезаторы</text>
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Эффекты</text>
  <text x="140" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Диджейское оборудование</text>
  <text x="140" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Ритм-машины</text>
  
  <!-- Правая часть: Популярная музыка -->
  <rect x="270" y="120" width="180" height="200" rx="10" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9b59b6">Популярная музыка</text>
  
  <!-- Иконка микрофона -->
  <path d="M340 170 L340 200 C340 210 348 218 358 218 C368 218 376 210 376 200 L376 170 C376 160 368 152 358 152 C348 152 340 160 340 170 Z" fill="#9b59b6"/>
  <rect x="355" y="218" width="6" height="15" fill="#9b59b6"/>
  <path d="M345 233 L371 233" stroke="#9b59b6" stroke-width="2"/>
  <path d="M350 238 L366 238" stroke="#9b59b6" stroke-width="2"/>
  
  <!-- Характеристики популярной музыки -->
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Рок</text>
  <text x="360" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Поп</text>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Хип-хоп</text>
  <text x="360" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">• Рэп</text>
  
  <!-- Центральная схема взаимодействия -->
  <circle cx="250" cy="220" r="40" fill="#9b59b6" opacity="0.8"/>
  <text x="250" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">ЭВОЛЮЦИЯ</text>
  
  <!-- Стрелки связи -->
  <path d="M230 220 L190 220" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M270 220 L310 220" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определение стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>
  
  <!-- Современные технологии -->
  <rect x="50" y="340" width="400" height="8" rx="4" fill="#9b59b6"/>
  
  <!-- Точки технологий -->
  <circle cx="100" cy="344" r="6" fill="#8e44ad"/>
  <circle cx="200" cy="344" r="6" fill="#8e44ad"/>
  <circle cx="300" cy="344" r="6" fill="#8e44ad"/>
  <circle cx="400" cy="344" r="6" fill="#8e44ad"/>
  
  <!-- Подписи технологий -->
  <text x="100" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Аналог</text>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Цифровой</text>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Виртуальный</text>
  <text x="400" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">AI</text>
  
  <!-- Волновые диаграммы -->
  <path d="M60 170 Q80 160, 100 170 T140 170 T180 170" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <path d="M280 170 Q300 160, 320 170 T360 170 T400 170" stroke="#9b59b6" stroke-width="2" fill="none"/>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="60" cy="120" r="3" fill="#9b59b6"/>
  <circle cx="440" cy="120" r="3" fill="#9b59b6"/>
  <circle cx="60" cy="320" r="3" fill="#9b59b6"/>
  <circle cx="440" cy="320" r="3" fill="#9b59b6"/>
  
  <!-- Линии сетки -->
  <line x1="50" y1="150" x2="230" y2="150" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="270" y1="150" x2="450" y2="150" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Примеры жанров -->
  <text x="140" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">House</text>
  <text x="140" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Techno</text>
  <text x="140" y="334" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Trance</text>
  
  <text x="360" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Indie</text>
  <text x="360" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">EDM</text>
  <text x="360" y="334" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Jazz Fusion</text>
  
  <!-- Дополнительные информационные блоки -->
  <rect x="190" y="160" width="120" height="60" rx="5" fill="#f3e5f5" stroke="#9b59b6" stroke-width="1"/>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">Современность</text>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">• Гибридные жанры</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">• Глобальное влияние</text>
</svg>