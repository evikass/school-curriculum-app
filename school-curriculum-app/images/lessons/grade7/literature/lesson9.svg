<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#textGrad)">
    ЛИТЕРАТУРА · 7 КЛАСС
  </text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="55" x2="450" y2="55" stroke="#ecf0f1" stroke-width="2" opacity="0.5"/>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="url(#textGrad)">
    Урок 9. Гоголь. Тарас Бульба
  </text>
  
  <!-- Облако -->
  <g id="cloud" transform="translate(350, 30)">
    <ellipse cx="0" cy="20" rx="25" ry="15" fill="#ecf0f1" opacity="0.3"/>
    <ellipse cx="-15" cy="15" rx="20" ry="12" fill="#ecf0f1" opacity="0.3"/>
    <ellipse cx="15" cy="15" rx="20" ry="12" fill="#ecf0f1" opacity="0.3"/>
  </g>
  
  <!-- Солнце -->
  <circle cx="380" cy="50" r="20" fill="#f1c40f" opacity="0.6"/>
  <g transform="translate(380, 50)">
    <line x1="-30" y1="0" x2="-25" y2="0" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-30" x2="0" y2="-25" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="25" x2="0" y2="30" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Иллюстрация: казаки -->
  <g id="cossacks" transform="translate(50, 120)">
    <!-- Небо -->
    <rect width="400" height="100" fill="url(#skyGrad)"/>
    
    <!-- Земля -->
    <rect y="100" width="400" height="80" fill="#8b4513"/>
    
    <!-- Казак слева -->
    <g transform="translate(80, 90)">
      <rect x="-15" y="20" width="30" height="40" fill="#2c3e50"/>
      <circle cx="0" cy="10" r="10" fill="#fdbcb4"/>
      <rect x="-20" y="0" width="8" height="15" fill="#8b4513"/>
      <rect x="12" y="0" width="8" height="15" fill="#8b4513"/>
      <circle cx="-5" cy="10" r="2" fill="#000"/>
      <circle cx="5" cy="10" r="2" fill="#000"/>
      <path d="M-5,15 Q0,20 5,15" stroke="#000" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Казак справа -->
    <g transform="translate(250, 90)">
      <rect x="-15" y="20" width="30" height="40" fill="#2c3e50"/>
      <circle cx="0" cy="10" r="10" fill="#fdbcb4"/>
      <rect x="-20" y="0" width="8" height="15" fill="#8b4513"/>
      <rect x="12" y="0" width="8" height="15" fill="#8b4513"/>
      <circle cx="-5" cy="10" r="2" fill="#000"/>
      <circle cx="5" cy="10" r="2" fill="#000"/>
      <path d="M-5,15 Q0,20 5,15" stroke="#000" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Огонь -->
    <g transform="translate(160, 110)">
      <ellipse cx="0" cy="30" rx="30" ry="5" fill="#000" opacity="0.3"/>
      <path d="M-20,30 Q-15,10 -10,25 Q-5,5 0,25 Q5,5 10,25 Q15,10 20,30" fill="url(#fireGrad)"/>
      <path d="M-15,30 Q-12,15 -8,25 Q-5,10 0,25 Q5,10 8,25 Q12,15 15,30" fill="#f39c12" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Ключевые темы -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#textGrad)">
      Тема повести:
    </text>
    
    <circle cx="10" cy="20" r="3" fill="#e74c3c"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="url(#textGrad)">
      Любовь к Родине
    </text>
    
    <circle cx="10" cy="45" r="3" fill="#e74c3c"/>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" fill="url(#textGrad)">
      Воинская доблесть
    </text>
    
    <circle cx="10" cy="70" r="3" fill="#e74c3c"/>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" fill="url(#textGrad)">
      Отец и сыновья
    </text>
  </g>
  
  <!-- Дополнительная информация -->
  <g transform="translate(280, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="url(#textGrad)">
      <tspan x="0" dy="0">Год написания: 1835</tspan>
      <tspan x="0" dy="20">Жанр: повесть</tspan>
      <tspan x="0" dy="20">Действие: Украина</tspan>
      <tspan x="0" dy="20">Период: XVI век</tspan>
    </text>
  </g>
  
  <!-- Украшение: перо -->
  <g transform="translate(420, 150)">
    <path d="M0,0 Q5,-10 10,0 Q5,5 0,0" fill="#ecf0f1" opacity="0.5"/>
    <line x1="5" y1="-5" x2="5" y2="0" stroke="#ecf0f1" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Украшение: меч -->
  <g transform="translate(100, 180)">
    <rect x="-2" y="0" width="4" height="40" fill="#ecf0f1" opacity="0.5"/>
    <rect x="-5" y="38" width="10" height="5" fill="#ecf0f1" opacity="0.5"/>
  </g>
  
  <!-- Украшение: звезды -->
  <g fill="#f1c40f" opacity="0.6">
    <path d="M50,100 L52,106 L58,106 L53,110 L55,116 L50,112 L45,116 L47,110 L42,106 L48,106 Z" transform="scale(0.5)"/>
    <path d="M50,100 L52,106 L58,106 L53,110 L55,116 L50,112 L45,116 L47,110 L42,106 L48,106 Z" transform="translate(350, 80) scale(0.3)"/>
    <path d="M50,100 L52,106 L58,106 L53,110 L55,116 L50,112 L45,116 L47,110 L42,106 L48,106 Z" transform="translate(400, 120) scale(0.4)"/>
  </g>
  
  <!-- Украшение: узор -->
  <g transform="translate(450, 250)" stroke="#ecf0f1" stroke-width="1" fill="none" opacity="0.3">
    <path d="M0,0 L20,0 M10,0 L10,20 M0,20 L20,20 M0,10 L20,10"/>
    <circle cx="10" cy="10" r="5" fill="none"/>
  </g>
  
  <!-- Украшение: волны -->
  <g transform="translate(0, 340)" stroke="#3498db" stroke-width="2" fill="none" opacity="0.3">
    <path d="M0,0 Q25,-10 50,0 T100,0 T150,0 T200,0 T250,0 T300,0 T350,0 T400,0 T450,0 T500,0"/>
  </g>
</svg>