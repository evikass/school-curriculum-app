<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="riverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#778899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="horseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="monumentGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Небо -->
  <rect width="500" height="200" fill="url(#skyGradient)"/>
  
  <!-- Облака -->
  <ellipse cx="100" cy="50" rx="30" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="45" rx="35" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="140" cy="50" rx="25" ry="12" fill="white" opacity="0.8"/>
  
  <ellipse cx="350" cy="70" rx="40" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="375" cy="65" rx="35" ry="18" fill="white" opacity="0.7"/>
  
  <!-- Нева -->
  <path d="M 0 200 Q 250 180 500 200 L 500 350 L 0 350 Z" fill="url(#riverGradient)"/>
  
  <!-- Волны на реке -->
  <path d="M 50 220 Q 70 215 90 220" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 150 225 Q 170 220 190 225" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 250 220 Q 270 215 290 220" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 350 225 Q 370 220 390 225" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Здания Петербурга -->
  <!-- Здание 1 -->
  <rect x="50" y="120" width="60" height="80" fill="url(#buildingGradient)" filter="url(#shadow)"/>
  <rect x="55" y="125" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="70" y="125" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="85" y="125" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="55" y="140" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="70" y="140" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="85" y="140" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  
  <!-- Здание 2 -->
  <rect x="130" y="100" width="70" height="100" fill="url(#buildingGradient)" filter="url(#shadow)"/>
  <polygon points="130,100 165,80 200,100" fill="url(#buildingGradient)"/>
  <rect x="140" y="110" width="12" height="12" fill="#4169E1" opacity="0.7"/>
  <rect x="160" y="110" width="12" height="12" fill="#4169E1" opacity="0.7"/>
  <rect x="180" y="110" width="12" height="12" fill="#4169E1" opacity="0.7"/>
  
  <!-- Здание 3 -->
  <rect x="220" y="130" width="50" height="70" fill="url(#buildingGradient)" filter="url(#shadow)"/>
  <rect x="230" y="140" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="245" y="140" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="230" y="155" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  <rect x="245" y="155" width="10" height="10" fill="#4169E1" opacity="0.7"/>
  
  <!-- Медный всадник -->
  <g transform="translate(350, 150)">
    <!-- Пьедестал -->
    <rect x="-30" y="50" width="60" height="50" fill="url(#monumentGradient)" filter="url(#shadow)"/>
    <rect x="-35" y="40" width="70" height="15" fill="url(#monumentGradient)" filter="url(#shadow)"/>
    
    <!-- Конь -->
    <g transform="translate(0, 20)">
      <ellipse cx="-15" cy="25" rx="20" ry="15" fill="url(#horseGradient)"/>
      <ellipse cx="5" cy="15" rx="18" ry="20" fill="url(#horseGradient)"/>
      <path d="M -10 15 Q -5 5 0 10" stroke="url(#horseGradient)" stroke-width="3" fill="none"/>
      <path d="M 0 10 Q 5 5 10 10" stroke="url(#horseGradient)" stroke-width="3" fill="none"/>
    </g>
    
    <!-- Всадник -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="-5" r="8" fill="#F4A460"/>
      <path d="M 0 -5 L -5 5 L -3 10 L 3 10 L 5 5 Z" fill="#4682B4"/>
      <path d="M -5 5 L -10 15 M 5 5 L 10 15" stroke="#4682B4" stroke-width="2"/>
      <path d="M -3 2 Q -2 -2 0 -2 Q 2 -2 3 2" stroke="url(#horseGradient)" stroke-width="2" fill="none"/>
    </g>
  </g>
  
  <!-- Мост -->
  <rect x="280" y="190" width="80" height="8" fill="#696969" filter="url(#shadow)"/>
  <rect x="285" y="185" width="5" height="15" fill="#696969"/>
  <rect x="350" y="185" width="5" height="15" fill="#696969"/>
  
  <!-- Деревья -->
  <g transform="translate(20, 160)">
    <rect x="-5" y="30" width="10" height="20" fill="#8B4513"/>
    <circle cx="0" cy="25" r="15" fill="#228B22"/>
    <circle cx="-8" cy="20" r="12" fill="#32CD32"/>
    <circle cx="8" cy="20" r="12" fill="#32CD32"/>
  </g>
  
  <g transform="translate(450, 170)">
    <rect x="-5" y="20" width="10" height="15" fill="#8B4513"/>
    <circle cx="0" cy="15" r="12" fill="#228B22"/>
  </g>
  
  <!-- Текстовые элементы -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">ЛИТЕРАТУРА · 7 КЛАСС</text>
  
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Петербуржский</text>
  <text x="80" y="125" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">пейзаж</text>
  
  <text x="160" y="90" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Амплитуда</text>
  
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Невский</text>
  <text x="250" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">проспект</text>
  
  <text x="350" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Медный</text>
  <text x="350" y="145" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">всадник</text>
  
  <text x="320" y="230" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Аничков</text>
  <text x="320" y="245" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">мост</text>
  
  <text x="40" y="215" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Сад</text>
  
  <text x="430" y="205" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Сад</text>
  
  <text x="20" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Нева</text>
  
  <text x="420" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Нева</text>
  
  <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">А.С. Пушкин</text>
  <text x="250" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">"Медный всадник"</text>
  
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Петербург в поэме</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="150" cy="60" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="80" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="400" cy="90" r="3" fill="#FFD700" opacity="0.8"/>
  
  <!-- Надписи на зданиях -->
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Сенат</text>
  <text x="165" y="140" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Адмиралтейство</text>
  
  <!-- Указатель направления -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <path d="M 0 -10 L -5 5 L 0 0 L 5 5 Z" fill="#2C3E50"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">С</text>
  </g>
</svg>