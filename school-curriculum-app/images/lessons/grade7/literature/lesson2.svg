<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#9370DB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00CED1;stop-opacity:0.8" />
    </linearGradient>
    
    <radialGradient id="starGrad">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#skyGrad)"/>
  
  <!-- Облака -->
  <g opacity="0.7">
    <ellipse cx="80" cy="50" rx="30" ry="15" fill="white"/>
    <ellipse cx="100" cy="45" rx="35" ry="18" fill="white"/>
    <ellipse cx="120" cy="50" rx="25" ry="12" fill="white"/>
    
    <ellipse cx="350" cy="70" rx="28" ry="14" fill="white"/>
    <ellipse cx="370" cy="65" rx="32" ry="16" fill="white"/>
    <ellipse cx="390" cy="70" rx="25" ry="13" fill="white"/>
  </g>
  
  <!-- Звезды -->
  <g id="stars">
    <circle cx="50" cy="30" r="2" fill="url(#starGrad)"/>
    <circle cx="150" cy="25" r="1.5" fill="url(#starGrad)"/>
    <circle cx="250" cy="35" r="2.5" fill="url(#starGrad)"/>
    <circle cx="420" cy="20" r="2" fill="url(#starGrad)"/>
    <circle cx="450" cy="40" r="1.5" fill="url(#starGrad)"/>
  </g>
  
  <!-- Книга (справа) -->
  <g id="book" transform="translate(320, 180)">
    <rect x="0" y="0" width="120" height="100" rx="5" fill="url(#bookGrad)"/>
    <rect x="5" y="5" width="110" height="90" rx="3" fill="#FFF8DC"/>
    <rect x="15" y="15" width="90" height="70" fill="none" stroke="#8B4513" stroke-width="1"/>
    <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#8B4513">Сказки</text>
  </g>
  
  <!-- Волшебная палочка (слева) -->
  <g id="magic-wand" transform="translate(50, 150)">
    <rect x="0" y="0" width="8" height="80" rx="4" fill="#8B4513" transform="rotate(-30 4 40)"/>
    <polygon points="4,5 8,15 0,15" fill="#FFD700" transform="rotate(-30 4 10)"/>
    <g opacity="0.6">
      <circle cx="15" cy="25" r="3" fill="#FF69B4"/>
      <circle cx="25" cy="15" r="2.5" fill="#9370DB"/>
      <circle cx="20" cy="35" r="2" fill="#00CED1"/>
    </g>
  </g>
  
  <!-- Волшебный круг -->
  <g transform="translate(100, 200)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#magicGrad)" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#magicGrad)" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#magicGrad)" stroke-width="1" opacity="0.9"/>
  </g>
  
  <!-- Волшебные элементы -->
  <g id="magic-elements">
    <!-- Звезда -->
    <polygon points="180,180 182,186 188,186 183,190 185,196 180,192 175,196 177,190 172,186 178,186" fill="url(#starGrad)"/>
    
    <!-- Снежинка -->
    <g transform="translate(220, 220)">
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#87CEEB" stroke-width="2"/>
      <line x1="-8.66" y1="-5" x2="8.66" y2="5" stroke="#87CEEB" stroke-width="2"/>
      <line x1="-8.66" y1="5" x2="8.66" y2="-5" stroke="#87CEEB" stroke-width="2"/>
    </g>
    
    <!-- Сердечко -->
    <path d="M250,235 C250,230 245,225 240,225 C235,225 230,230 230,235 C230,240 240,250 250,260 C260,250 270,240 270,235 C270,230 265,225 260,225 C255,225 250,230 250,235" fill="#FF69B4" opacity="0.7"/>
  </g>
  
  <!-- Бытовые элементы (дом) -->
  <g id="house" transform="translate(200, 240)">
    <rect x="0" y="20" width="60" height="40" fill="#CD853F"/>
    <polygon points="0,20 30,0 60,20" fill="#8B4513"/>
    <rect x="20" y="35" width="15" height="20" fill="#654321"/>
    <rect x="40" y="30" width="10" height="10" fill="#87CEEB"/>
    <rect x="5" y="30" width="10" height="10" fill="#FFD700"/>
  </g>
  
  <!-- Лампочка -->
  <g transform="translate(280, 100)">
    <circle cx="0" cy="0" r="15" fill="#FFD700" opacity="0.8"/>
    <rect x="-5" y="10" width="10" height="8" fill="#696969"/>
    <line x1="-3" y1="12" x2="3" y2="12" stroke="#696969" stroke-width="1"/>
    <line x1="-3" y1="14" x2="3" y2="14" stroke="#696969" stroke-width="1"/>
    <line x1="-3" y1="16" x2="3" y2="16" stroke="#696969" stroke-width="1"/>
  </g>
  
  <!-- Часы -->
  <g transform="translate(350, 120)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#696969" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#696969" stroke-width="2"/>
    <line x1="0" y1="0" x2="8" y2="0" stroke="#696969" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#696969"/>
  </g>
  
  <!-- Текст заголовка -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">ЛИТЕРАТУРА · 7 КЛАСС</text>
  
  <!-- Тексты по теме -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
    <text x="30" y="280" font-weight="bold">Урок 2. Сказки</text>
    <text x="30" y="300">Волшебные:</text>
    <text x="50" y="318">• Волшебные предметы</text>
    <text x="50" y="335">• Волшебные существа</text>
    
    <text x="200" y="300">Бытовые:</text>
    <text x="220" y="318">• Реалистичные персонажи</text>
    <text x="220" y="335">• Бытовые ситуации</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="decorative-elements">
    <!-- Лента -->
    <path d="M 150 100 Q 170 90 190 100 T 230 100" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.6"/>
    
    <!-- Буквы -->
    <text x="160" y="95" font-family="Arial" font-size="16" fill="#9370DB">В</text>
    <text x="200" y="95" font-family="Arial" font-size="16" fill="#FF69B4">Б</text>
    
    <!-- Узор -->
    <g opacity="0.5">
      <circle cx="300" cy="250" r="3" fill="#9370DB"/>
      <circle cx="310" cy="255" r="3" fill="#FF69B4"/>
      <circle cx="290" cy="255" r="3" fill="#00CED1"/>
      <circle cx="305" cy="265" r="3" fill="#FFD700"/>
      <circle cx="295" cy="265" r="3" fill="#FF69B4"/>
    </g>
    
    <!-- Волшебная пыльца -->
    <g opacity="0.7">
      <ellipse cx="140" cy="180" rx="2" ry="4" fill="#FFD700" transform="rotate(45 140 180)"/>
      <ellipse cx="160" cy="190" rx="2" ry="4" fill="#FFD700" transform="rotate(30 160 190)"/>
      <ellipse cx="145" cy="200" rx="2" ry="4" fill="#FFD700" transform="rotate(60 145 200)"/>
    </g>
    
    <!-- Маленькие звёздочки -->
    <g fill="url(#starGrad)" opacity="0.8">
      <circle cx="170" cy="150" r="1"/>
      <circle cx="190" cy="160" r="1"/>
      <circle cx="210" cy="155" r="1"/>
      <circle cx="180" cy="170" r="1"/>
    </g>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="90" x2="450" y2="90" stroke="#B0C4DE" stroke-width="1" opacity="0.5"/>
  
  <!-- Подписи к иллюстрациям -->
  <g font-family="Arial" font-size="11" fill="#4A5568">
    <text x="60" y="250" text-anchor="middle">Волшебная палочка</text>
    <text x="100" y="250" text-anchor="middle">Магия</text>
    <text x="230" y="280" text-anchor="middle">Дом</text>
    <text x="280" y="130" text-anchor="middle">Идея</text>
    <text x="350" y="150" text-anchor="middle">Время</text>
  </g>
</svg>