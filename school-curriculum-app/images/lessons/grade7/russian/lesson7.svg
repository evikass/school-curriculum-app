<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e9fc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f6ad55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ed8936;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)"/>
  <text x="250" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    РУССКИЙ ЯЗЫК · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок урока -->
  <text x="250" y="85" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="18" font-weight="600">
    Урок 7. Прилагательное и числительное
  </text>
  
  <!-- Тема: Прилагательное -->
  <rect x="150" y="100" width="200" height="40" rx="20" fill="url(#highlightGrad)" filter="url(#shadow)"/>
  <text x="250" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="600">
    Тема: Прилагательное
  </text>
  
  <!-- Карточка 1: Определение -->
  <g transform="translate(20, 160)">
    <rect width="220" height="140" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="600">
      Что такое прилагательное?
    </text>
    <text x="10" y="50" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • Имя существительное
    </text>
    <text x="10" y="70" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • отвечает на вопросы
    </text>
    <text x="20" y="90" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      «какой? какая? какое? какие?»
    </text>
    <text x="10" y="110" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • выражает признак предмета
    </text>
    <text x="10" y="130" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • изменяется по родам, числам
    </text>
  </g>
  
  <!-- Карточка 2: Примеры -->
  <g transform="translate(260, 160)">
    <rect width="220" height="140" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="600">
      Примеры прилагательных
    </text>
    <text x="10" y="50" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • красивый дом
    </text>
    <text x="10" y="70" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • высокая гора
    </text>
    <text x="10" y="90" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • синее море
    </text>
    <text x="10" y="110" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • большие деревья
    </text>
    <text x="10" y="130" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">
      • маленький цветок
    </text>
  </g>
  
  <!-- Иконка книги -->
  <g transform="translate(40, 50)">
    <rect width="30" height="25" rx="2" fill="#3182ce"/>
    <rect x="5" y="5" width="20" height="15" fill="#e8f4fd"/>
    <line x1="8" y1="8" x2="22" y2="8" stroke="#2d3748" stroke-width="1"/>
    <line x1="8" y1="12" x2="22" y2="12" stroke="#2d3748" stroke-width="1"/>
    <line x1="8" y1="16" x2="18" y2="16" stroke="#2d3748" stroke-width="1"/>
  </g>
  
  <!-- Иконка карандаша -->
  <g transform="translate(430, 50)">
    <rect x="0" y="5" width="25" height="5" fill="#f6ad55"/>
    <polygon points="25,7.5 30,5 30,10" fill="#ed8936"/>
    <line x1="2" y1="7.5" x2="5" y2="7.5" stroke="#2d3748" stroke-width="0.5"/>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="320" r="8" fill="#3182ce" opacity="0.3"/>
  <circle cx="70" cy="330" r="5" fill="#f6ad55" opacity="0.3"/>
  <circle cx="430" cy="320" r="8" fill="#3182ce" opacity="0.3"/>
  <circle cx="450" cy="330" r="5" fill="#f6ad55" opacity="0.3"/>
  
  <!-- Линия разделения -->
  <line x1="0" y1="80" x2="500" y2="80" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- Подпись "Грамматические категории" -->
  <text x="250" y="320" text-anchor="middle" fill="#4a5568" font-family="Arial, sans-serif" font-size="12" font-style="italic">
    Грамматические категории прилагательных
  </text>
  
  <!-- Мини-иконки признаков -->
  <g transform="translate(100, 315)">
    <circle r="15" fill="#e6fffa" stroke="#38b2ac" stroke-width="2"/>
    <text text-anchor="middle" y="5" fill="#38b2ac" font-family="Arial, sans-serif" font-size="10">Род</text>
  </g>
  
  <g transform="translate(250, 315)">
    <circle r="15" fill="#fef5e7" stroke="#f39c12" stroke-width="2"/>
    <text text-anchor="middle" y="5" fill="#f39c12" font-family="Arial, sans-serif" font-size="10">Число</text>
  </g>
  
  <g transform="translate(400, 315)">
    <circle r="15" fill="#f0f9ff" stroke="#3182ce" stroke-width="2"/>
    <text text-anchor="middle" y="5" fill="#3182ce" font-family="Arial, sans-serif" font-size="10">Падеж</text>
  </g>
  
  <!-- Дополнительные декоративные линии -->
  <path d="M 0 140 L 50 140 L 50 145 L 0 145" fill="none" stroke="#cbd5e0" stroke-width="1"/>
  <path d="M 450 140 L 500 140 L 500 145 L 450 145" fill="none" stroke="#cbd5e0" stroke-width="1"/>
</svg>