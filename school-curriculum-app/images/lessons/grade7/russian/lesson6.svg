<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3cd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeaa7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1ecf1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bee5eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тени -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый узор -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <circle cx="50" cy="50" r="30" fill="#e9ecef" opacity="0.3"/>
  <circle cx="450" cy="300" r="40" fill="#e9ecef" opacity="0.3"/>
  <circle cx="400" cy="80" r="25" fill="#e9ecef" opacity="0.3"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="url(#headerGrad)"/>
  <text x="250" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">РУССКИЙ ЯЗЫК · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="150" y="70" width="200" height="40" rx="5" fill="#4a90e2" filter="url(#shadow)"/>
  <text x="250" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Урок 6. Глагол и его формы</text>
  
  <!-- Основной блок - Определение глагола -->
  <rect x="30" y="130" width="440" height="60" rx="8" fill="url(#boxGrad1)" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">Глагол — это часть речи, которая обозначает:</text>
  <text x="50" y="175" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">• действие (бежать, писать, говорить)</text>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">• состояние (спать, болеть, радоваться)</text>
  
  <!-- Блоки спряжений -->
  <rect x="30" y="210" width="210" height="110" rx="8" fill="url(#boxGrad2)" stroke="#ffc107" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">I спряжение</text>
  <text x="50" y="255" font-family="Arial, sans-serif" font-size="13" fill="#856404">Окончания:</text>
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="12" fill="#856404">-у, -ю, -ешь, -ете</text>
  <text x="50" y="295" font-family="Arial, sans-serif" font-size="12" fill="#856404">-им, -ите, -ят</text>
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="11" fill="#856404" font-style="italic">ПИСАТЬ, ГОТОВИТЬ</text>
  
  <rect x="260" y="210" width="210" height="110" rx="8" fill="url(#boxGrad3)" stroke="#17a2b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="280" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c5460">II спряжение</text>
  <text x="280" y="255" font-family="Arial, sans-serif" font-size="13" fill="#0c5460">Окончания:</text>
  <text x="280" y="275" font-family="Arial, sans-serif" font-size="12" fill="#0c5460">-у, -ю, -ишь, -ите</text>
  <text x="280" y="295" font-family="Arial, sans-serif" font-size="12" fill="#0c5460">-им, -ите, -ят</text>
  <text x="280" y="310" font-family="Arial, sans-serif" font-size="11" fill="#0c5460" font-style="italic">ЧИТАТЬ, СЛУШАТЬ</text>
  
  <!-- Стрелка между спряжениями -->
  <path d="M 240 265 L 260 265" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- Примеры глаголов -->
  <circle cx="80" cy="100" r="15" fill="#4a90e2" opacity="0.8"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">I</text>
  
  <circle cx="420" cy="100" r="15" fill="#17a2b8" opacity="0.8"/>
  <text x="420" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">II</text>
  
  <!-- Дополнительные элементы -->
  <rect x="150" y="50" width="200" height="2" fill="#dee2e6"/>
  
  <!-- Указатели на спряжения -->
  <path d="M 80 115 L 80 130" stroke="#4a90e2" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 420 115 L 420 210" stroke="#17a2b8" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Иконки -->
  <circle cx="45" cy="50" r="8" fill="#ffc107"/>
  <text x="45" y="54" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#856404">6</text>
  
  <!-- Текстовые метки -->
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c757d">Тема: Глагол, спряжение</text>
</svg>