<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="soundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orthoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)">
    РУССКИЙ ЯЗЫК · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">
    Урок 2. Фонетика и орфография
  </text>
  
  <!-- Основные блоки -->
  <!-- Звуки -->
  <rect x="30" y="80" width="210" height="240" rx="10" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="135" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#soundGrad)">
    ЗВУКИ
  </text>
  
  <!-- Звуки разделы -->
  <circle cx="60" cy="140" r="8" fill="#10b981"/>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Гласные звуки</text>
  
  <circle cx="60" cy="165" r="8" fill="#10b981"/>
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Согласные звуки</text>
  
  <circle cx="60" cy="190" r="8" fill="#10b981"/>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Твердые звуки</text>
  
  <circle cx="60" cy="215" r="8" fill="#10b981"/>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Мягкие звуки</text>
  
  <circle cx="60" cy="240" r="8" fill="#10b981"/>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Глухие звуки</text>
  
  <circle cx="60" cy="265" r="8" fill="#10b981"/>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Звонкие звуки</text>
  
  <!-- Примеры звуков -->
  <rect x="30" y="290" width="210" height="20" rx="5" fill="#ecfdf5"/>
  <text x="135" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#059669">
    Пример: [а], [б], [в], [г]
  </text>
  
  <!-- Орфограммы -->
  <rect x="260" y="80" width="210" height="240" rx="10" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="365" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#orthoGrad)">
    ОРФОГРАММЫ
  </text>
  
  <!-- Орфограммы разделы -->
  <circle cx="290" cy="140" r="8" fill="#f59e0b"/>
  <text x="310" y="145" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Безударные гласные</text>
  
  <circle cx="290" cy="165" r="8" fill="#f59e0b"/>
  <text x="310" y="170" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Согласные в корне</text>
  
  <circle cx="290" cy="190" r="8" fill="#f59e0b"/>
  <text x="310" y="195" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Чередующиеся гласные</text>
  
  <circle cx="290" cy="215" r="8" fill="#f59e0b"/>
  <text x="310" y="220" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Правописание приставок</text>
  
  <circle cx="290" cy="240" r="8" fill="#f59e0b"/>
  <text x="310" y="245" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Н и НН в суффиксах</text>
  
  <circle cx="290" cy="265" r="8" fill="#f59e0b"/>
  <text x="310" y="270" font-family="Arial, sans-serif" font-size="14" fill="#1f2937">Правописание О и Е</text>
  
  <!-- Примеры орфограмм -->
  <rect x="260" y="290" width="210" height="20" rx="5" fill="#fffbeb"/>
  <text x="365" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d97706">
    Пример: снег, дом, букв
  </text>
  
  <!-- Стрелка связи -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <path d="M 240 200 Q 250 200 260 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Дополнительные элементы -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    Звуки → Буквы → Орфограммы
  </text>
  
  <!-- Декоративные элементы -->
  <circle cx="45" cy="100" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="45" cy="280" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="455" cy="100" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="455" cy="280" r="3" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Иконки -->
  <!-- Звуковая волна -->
  <path d="M 60 320 Q 70 310, 80 320 T 100 320 T 120 320 T 140 320" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M 60 325 Q 70 315, 80 325 T 100 325 T 120 325 T 140 325" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Орфографическая точка -->
  <circle cx="290" cy="320" r="4" fill="#f59e0b"/>
  <circle cx="300" cy="320" r="4" fill="#f59e0b"/>
  <circle cx="310" cy="320" r="4" fill="#f59e0b"/>
  
  <!-- Подписи-подсказки -->
  <text x="135" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Единицы языка
  </text>
  
  <text x="365" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Правила письма
  </text>
  
  <!-- Дополнительные элементы оформления -->
  <rect x="245" y="150" width="10" height="100" rx="5" fill="#cbd5e1" opacity="0.3"/>
</svg>