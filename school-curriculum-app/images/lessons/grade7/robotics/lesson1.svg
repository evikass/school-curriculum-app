<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495e">РОБОТОТЕХНИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="50" y="50" width="400" height="40" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#34495e">Что такое робототехника</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="100" width="440" height="220" rx="10" fill="white" stroke="#34495e" stroke-width="2"/>
  
  <!-- Секция 1: Определение -->
  <rect x="50" y="120" width="180" height="80" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Определение</text>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Робототехника —</text>
  <text x="140" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">наука о созданиях</text>
  <text x="140" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">роботов и систем</text>
  
  <!-- Иконка робота -->
  <g transform="translate(350, 125)">
    <!-- Голова -->
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#34495e"/>
    <circle cx="15" cy="15" r="5" fill="#3498db"/>
    <circle cx="45" cy="15" r="5" fill="#3498db"/>
    <rect x="20" y="25" width="20" height="10" fill="#34495e"/>
    <!-- Тело -->
    <rect x="10" y="45" width="40" height="35" rx="5" fill="#34495e"/>
    <!-- Руки -->
    <rect x="-10" y="50" width="20" height="8" rx="4" fill="#34495e"/>
    <rect x="50" y="50" width="20" height="8" rx="4" fill="#34495e"/>
    <!-- Ноги -->
    <rect x="15" y="80" width="8" height="15" rx="4" fill="#34495e"/>
    <rect x="37" y="80" width="8" height="15" rx="4" fill="#34495e"/>
  </g>
  
  <!-- Секция 2: Компоненты -->
  <rect x="50" y="220" width="120" height="80" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="110" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Компоненты</text>
  
  <!-- Схема компонентов -->
  <g transform="translate(60, 255)">
    <!-- Контроллер -->
    <rect x="0" y="0" width="40" height="25" rx="3" fill="#3498db"/>
    <text x="20" y="17" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU</text>
    
    <!-- Датчики -->
    <circle cx="60" cy="12" r="12" fill="#e74c3c"/>
    <text x="60" y="16" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Датчики</text>
    
    <!-- Исполнительные механизмы -->
    <rect x="85" y="0" width="40" height="25" rx="3" fill="#2ecc71"/>
    <text x="105" y="17" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Моторы</text>
    
    <!-- Соединения -->
    <line x1="40" y1="12" x2="48" y2="12" stroke="#34495e" stroke-width="2"/>
    <line x1="72" y1="12" x2="85" y2="12" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Секция 3: Типы роботов -->
  <rect x="190" y="220" width="120" height="80" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="250" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Типы роботов</text>
  
  <!-- Иконки типов роботов -->
  <!-- Промышленный робот -->
  <g transform="translate(200, 255)">
    <rect x="0" y="0" width="15" height="20" rx="2" fill="#34495e"/>
    <rect x="20" y="5" width="15" height="15" rx="2" fill="#34495e"/>
    <circle cx="7.5" cy="10" r="3" fill="#3498db"/>
    <circle cx="27.5" cy="12" r="3" fill="#3498db"/>
    <text x="17.5" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Промышленный</text>
  </g>
  
  <!-- Домашний робот -->
  <g transform="translate(240, 255)">
    <circle cx="12.5" cy="10" r="10" fill="#34495e"/>
    <circle cx="8" cy="8" r="2" fill="white"/>
    <circle cx="17" cy="8" r="2" fill="white"/>
    <path d="M 5 15 Q 12.5 20 20 15" stroke="white" stroke-width="1.5" fill="none"/>
    <rect x="5" y="20" width="15" height="10" rx="2" fill="#34495e"/>
    <text x="12.5" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Домашний</text>
  </g>
  
  <!-- Медицинский робот -->
  <g transform="translate(280, 255)">
    <rect x="5" y="0" width="15" height="25" rx="3" fill="#34495e"/>
    <circle cx="12.5" cy="30" r="5" fill="#34495e"/>
    <path d="M 7 8 L 18 8 M 7 13 L 18 13 M 7 18 L 18 18" stroke="white" stroke-width="1"/>
    <text x="12.5" y="40" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Медицинский</text>
  </g>
  
  <!-- Секция 4: Области применения -->
  <rect x="330" y="220" width="120" height="80" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="390" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Области применения</text>
  
  <!-- Схема областей -->
  <g transform="translate(340, 255)">
    <!-- Промышленность -->
    <rect x="0" y="0" width="30" height="15" rx="2" fill="#e74c3c" opacity="0.7"/>
    <text x="15" y="11" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Пром-сть</text>
    
    <!-- Медицина -->
    <rect x="0" y="20" width="30" height="15" rx="2" fill="#3498db" opacity="0.7"/>
    <text x="15" y="31" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Медицина</text>
    
    <!-- Быт -->
    <rect x="0" y="40" width="30" height="15" rx="2" fill="#2ecc71" opacity="0.7"/>
    <text x="15" y="51" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Быт</text>
    
    <!-- Образование -->
    <rect x="35" y="0" width="30" height="15" rx="2" fill="#f39c12" opacity="0.7"/>
    <text x="50" y="11" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Образование</text>
    
    <!-- Исследования -->
    <rect x="35" y="20" width="30" height="15" rx="2" fill="#9b59b6" opacity="0.7"/>
    <text x="50" y="31" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Исследования</text>
    
    <!-- Военное дело -->
    <rect x="35" y="40" width="30" height="15" rx="2" fill="#1abc9c" opacity="0.7"/>
    <text x="50" y="51" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Военное дело</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Разделительная линия -->
  <line x1="50" y1="210" x2="450" y2="210" stroke="#34495e" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Стрелки соединения -->
  <g>
    <line x1="140" y1="200" x2="140" y2="220" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="200" x2="110" y2="220" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="200" x2="250" y2="220" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="390" y1="200" x2="390" y2="220" stroke="#34495e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e" opacity="0.7">Основные концепции робототехники</text>
  
  <!-- Декоративные элементы -->
  <circle cx="40" cy="40" r="3" fill="#3498db"/>
  <circle cx="460" cy="40" r="3" fill="#3498db"/>
  <circle cx="40" cy="310" r="3" fill="#3498db"/>
  <circle cx="460" cy="310" r="3" fill="#3498db"/>
  
  <!-- Технологии и инновации -->
  <rect x="250" y="120" width="80" height="60" rx="5" fill="#34495e" opacity="0.05"/>
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">Технологии</text>
  <text x="290" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">ИИ</text>
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Машинное обучение</text>
  
  <!-- История развития -->
  <rect x="350" y="120" width="100" height="60" rx="5" fill="#34495e" opacity="0.05"/>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">История</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">1950-е: Первые</text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">роботы</text>
  
  <!-- Этика робототехники -->
  <rect x="50" y="120" width="180" height="80" rx="5" fill="#34495e" opacity="0.1"/>
  <text x="140" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Этика и безопасность</text>
  
  <!-- Программирование -->
  <rect x="250" y="190" width="80" height="15" rx="3" fill="#3498db" opacity="0.3"/>
  <text x="290" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Программирование</text>
</svg>