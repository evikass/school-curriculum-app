<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  
  <!-- Заголовок -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">ОБЩЕСТВОЗНАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="40" width="300" height="35" rx="5" fill="#e74c3c" opacity="0.9"/>
  <text x="250" y="62" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Общество как система</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Человек и общество</text>
  
  <!-- Основной контейнер для схемы -->
  <rect x="50" y="100" width="400" height="220" rx="10" fill="white" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- Центральный элемент: Общество -->
  <circle cx="250" cy="210" r="45" fill="#e74c3c" opacity="0.8"/>
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Общество</text>
  
  <!-- Связующие линии -->
  <line x1="250" y1="165" x2="250" y2="120" stroke="#e74c3c" stroke-width="2"/>
  <line x1="205" y1="210" x2="130" y2="210" stroke="#e74c3c" stroke-width="2"/>
  <line x1="295" y1="210" x2="370" y2="210" stroke="#e74c3c" stroke-width="2"/>
  <line x1="225" y1="240" x2="170" y2="280" stroke="#e74c3c" stroke-width="2"/>
  <line x1="275" y1="240" x2="330" y2="280" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- Элементы системы -->
  <!-- Человек -->
  <circle cx="250" cy="110" r="25" fill="#3498db" opacity="0.8"/>
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Человек</text>
  
  <!-- Социальные институты -->
  <rect x="80" y="195" width="50" height="30" rx="5" fill="#2ecc71" opacity="0.8"/>
  <text x="105" y="213" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Социальные институты</text>
  
  <!-- Культура -->
  <rect x="370" y="195" width="50" height="30" rx="5" fill="#2ecc71" opacity="0.8"/>
  <text x="395" y="213" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Культура</text>
  
  <!-- Экономика -->
  <rect x="120" y="280" width="50" height="30" rx="5" fill="#2ecc71" opacity="0.8"/>
  <text x="145" y="298" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Экономика</text>
  
  <!-- Политика -->
  <rect x="330" y="280" width="50" height="30" rx="5" fill="#2ecc71" opacity="0.8"/>
  <text x="355" y="298" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Политика</text>
  
  <!-- Дополнительные элементы системы -->
  <!-- Семья -->
  <circle cx="180" cy="150" r="15" fill="#9b59b6" opacity="0.7"/>
  <text x="180" y="154" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Семья</text>
  <line x1="195" y1="150" x2="230" y2="180" stroke="#9b59b6" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Образование -->
  <circle cx="320" y="150" r="15" fill="#9b59b6" opacity="0.7"/>
  <text x="320" y="154" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Образование</text>
  <line x1="305" y1="150" x2="270" y2="180" stroke="#9b59b6" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Право -->
  <circle cx="180" cy="270" r="15" fill="#9b59b6" opacity="0.7"/>
  <text x="180" y="274" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Право</text>
  <line x1="195" y1="270" x2="220" y2="250" stroke="#9b59b6" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Религия -->
  <circle cx="320" y="270" r="15" fill="#9b59b6" opacity="0.7"/>
  <text x="320" y="274" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Религия</text>
  <line x1="305" y1="270" x2="280" y2="250" stroke="#9b59b6" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Связи между элементами -->
  <path d="M 180 150 Q 250 170 320 150" stroke="#34495e" stroke-width="1" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M 180 270 Q 250 250 320 270" stroke="#34495e" stroke-width="1" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- Свойства системы -->
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666">Свойства системы:</text>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="9" fill="#777">• Целостность</text>
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="9" fill="#777">• Структурированность</text>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="9" fill="#777">• Развитие</text>
  
  <!-- Уровни общества -->
  <text x="360" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666">Уровни:</text>
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="9" fill="#777">• Микроуровень</text>
  <text x="360" y="160" font-family="Arial, sans-serif" font-size="9" fill="#777">• Мезоуровень</text>
  <text x="360" y="175" font-family="Arial, sans-serif" font-size="9" fill="#777">• Макроуровень</text>
  
  <!-- Взаимодействие -->
  <path d="M 250 110 Q 300 90 350 110" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e74c3c">взаимодействие</text>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Иконка человека -->
  <circle cx="75" y="110" r="8" fill="#e74c3c"/>
  <circle cx="75" y="105" r="3" fill="white"/>
  <path d="M 70 110 Q 75 108 80 110 L 80 118 L 70 118 Z" fill="white"/>
  
  <!-- Иконка общества -->
  <circle cx="425" cy="210" r="8" fill="#e74c3c"/>
  <circle cx="422" cy="207" r="2" fill="white"/>
  <circle cx="428" cy="207" r="2" fill="white"/>
  <circle cx="425" cy="213" r="2" fill="white"/>
  <path d="M 420 210 Q 425 208 430 210" stroke="white" stroke-width="1" fill="none"/>
  
  <!-- Ключевые термины -->
  <rect x="60" y="330" width="380" height="15" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#555">Система · Элемент · Структура · Функция · Взаимодействие · Социальный институт · Культура</text>
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="90" cy="250" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="410" cy="250" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="90" cy="180" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="410" cy="180" r="3" fill="#e74c3c" opacity="0.5"/>
  
  <!-- Границы элементов -->
  <rect x="105" y="195" width="50" height="30" rx="5" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="370" y="195" width="50" height="30" rx="5" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="120" y="280" width="50" height="30" rx="5" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="330" y="280" width="50" height="30" rx="5" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
</svg>