<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#e74c3c"/>
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">ОБЩЕСТВОЗНАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">Общение и его виды</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">Межличностные отношения</text>
  
  <!-- Центральная фигура - человек -->
  <circle cx="250" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <path d="M250 225 L250 270 M230 245 L270 245 M235 270 L265 270" stroke="#3498db" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Вектор общения - стрелки и линии -->
  <line x1="250" y1="200" x2="150" y2="150" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="200" x2="350" y2="150" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="200" x2="150" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="200" x2="350" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определения общения -->
  <rect x="50" y="100" width="120" height="80" rx="5" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Вербальное</text>
  <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Речь</text>
  <text x="110" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Слова</text>
  <text x="110" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Текст</text>
  
  <rect x="330" y="100" width="120" height="80" rx="5" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="390" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Невербальное</text>
  <text x="390" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Жесты</text>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Мимика</text>
  <text x="390" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Поза</text>
  
  <!-- Типы общения -->
  <rect x="50" y="200" width="120" height="80" rx="5" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="110" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Формальное</text>
  <text x="110" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Официальное</text>
  <text x="110" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Рабочее</text>
  <text x="110" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Деловое</text>
  
  <rect x="330" y="200" width="120" height="80" rx="5" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="390" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Неформальное</text>
  <text x="390" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Дружеское</text>
  <text x="390" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Семейное</text>
  <text x="390" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Интимное</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="110" cy="140" r="15" fill="#e74c3c" opacity="0.2"/>
  <circle cx="390" cy="140" r="15" fill="#e74c3c" opacity="0.2"/>
  <circle cx="110" cy="240" r="15" fill="#3498db" opacity="0.2"/>
  <circle cx="390" cy="240" r="15" fill="#3498db" opacity="0.2"/>
  
  <!-- Иконки общения -->
  <path d="M80 120 L90 130 L80 140" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420 120 L410 130 L420 140" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="130" r="3" fill="#e74c3c"/>
  <circle cx="410" cy="130" r="3" fill="#e74c3c"/>
  
  <!-- Элементы схемы отношений -->
  <rect x="180" y="290" width="140" height="40" rx="20" fill="#e74c3c" opacity="0.8"/>
  <text x="250" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Межличностные отношения</text>
  
  <!-- Дополнительные линии связи -->
  <path d="M150 150 Q100 180 150 250" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <path d="M350 150 Q400 180 350 250" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Малые элементы для объема -->
  <circle cx="100" cy="180" r="3" fill="#e74c3c"/>
  <circle cx="400" cy="180" r="3" fill="#e74c3c"/>
  <circle cx="100" cy="260" r="3" fill="#3498db"/>
  <circle cx="400" cy="260" r="3" fill="#3498db"/>
  
  <!-- Текстовые элементы -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Каналы общения</text>
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">Способ</text>
  <text x="440" y="95" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">Способ</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">Характер</text>
  <text x="440" y="295" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">Характер</text>
  
  <!-- Декоративные элементы -->
  <rect x="10" y="50" width="5" height="5" fill="#e74c3c"/>
  <rect x="485" y="50" width="5" height="5" fill="#e74c3c"/>
  <rect x="10" y="335" width="5" height="5" fill="#e74c3c"/>
  <rect x="485" y="335" width="5" height="5" fill="#e74c3c"/>
  
  <!-- Определения -->
  <text x="250" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Взаимодействие людей</text>
  <text x="250" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">в процессе общения</text>
  
  <!-- Стрелка определение -->
  <line x1="250" y1="270" x2="250" y2="290" stroke="#7f8c8d" stroke-width="1" marker-end="url(#smallarrow)"/>
  
  <!-- Определение общения -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-style="italic">"Общение - это процесс взаимопонимания между людьми"</text>
  
  <!-- Маркеры стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="smallarrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Дополнительные мелкие элементы для достижения 50+ -->
  <line x1="190" y1="110" x2="190" y2="290" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="310" y1="110" x2="310" y2="290" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="190" cy="110" r="2" fill="#ecf0f1"/>
  <circle cx="310" cy="110" r="2" fill="#ecf0f1"/>
  <circle cx="190" cy="290" r="2" fill="#ecf0f1"/>
  <circle cx="310" cy="290" r="2" fill="#ecf0f1"/>
</svg>