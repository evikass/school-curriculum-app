<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок класса -->
  <rect x="10" y="10" width="480" height="40" fill="#34495e" rx="5"/>
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">ОБЩЕСТВОЗНАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle" font-weight="bold">Конфликты и их решение</text>
  <text x="250" y="95" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">Межличностные отношения</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="110" width="440" height="230" fill="white" stroke="#ddd" stroke-width="2" rx="10"/>
  
  <!-- Раздел 1: Причины конфликтов -->
  <rect x="50" y="130" width="200" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" text-anchor="middle" font-weight="bold">Причины конфликтов</text>
  
  <!-- Иконка недопонимания -->
  <circle cx="80" cy="180" r="15" fill="#e74c3c"/>
  <path d="M70,175 Q80,170 90,175" stroke="white" stroke-width="2" fill="none"/>
  <path d="M75,185 Q80,190 85,185" stroke="white" stroke-width="2" fill="none"/>
  <path d="M85,185 Q90,190 95,185" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Текст причин -->
  <text x="110" y="185" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Недопонимание</text>
  <line x1="70" y1="195" x2="190" y2="195" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Иконка разногласий -->
  <circle cx="80" cy="220" r="15" fill="#e74c3c"/>
  <path d="M70,220 L90,220 M75,210 L85,230 M85,210 L75,230" stroke="white" stroke-width="2"/>
  
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Разногласия во взглядах</text>
  <line x1="70" y1="235" x2="190" y2="235" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Иконка конкуренции -->
  <circle cx="80" cy="260" r="15" fill="#e74c3c"/>
  <path d="M75,255 L85,265 M85,255 L75,265" stroke="white" stroke-width="2"/>
  
  <text x="110" y="265" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Конкуренция</text>
  <line x1="70" y1="275" x2="190" y2="275" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Иконка эгоизма -->
  <circle cx="80" cy="290" r="15" fill="#e74c3c"/>
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Я</text>
  
  <text x="110" y="295" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Эгоизм</text>
  
  <!-- Раздел 2: Типы конфликтов -->
  <rect x="270" y="130" width="180" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="360" y="150" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" text-anchor="middle" font-weight="bold">Типы конфликтов</text>
  
  <!-- Схема типов конфликтов -->
  <circle cx="300" cy="180" r="15" fill="#3498db"/>
  <text x="300" y="185" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">1</text>
  <text x="330" y="185" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Внутриличностные</text>
  
  <circle cx="300" cy="200" r="15" fill="#3498db"/>
  <text x="300" y="205" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">2</text>
  <text x="330" y="205" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Межличностные</text>
  
  <!-- Раздел 3: Способы решения -->
  <rect x="270" y="230" width="180" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="360" y="250" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" text-anchor="middle" font-weight="bold">Способы решения</text>
  
  <!-- Иконки решения -->
  <rect x="280" y="265" width="25" height="25" fill="#27ae60" rx="3"/>
  <path d="M287,277 L293,277 M287,270 L293,270" stroke="white" stroke-width="2"/>
  <text x="315" y="280" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Переговоры</text>
  
  <rect x="280" y="295" width="25" height="25" fill="#27ae60" rx="3"/>
  <circle cx="292" cy="307" r="5" fill="white"/>
  <text x="315" y="310" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Компромисс</text>
  
  <!-- Центральная диаграмма конфликтов -->
  <circle cx="150" cy="230" r="40" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="150" cy="230" r="30" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="150" cy="230" r="20" fill="#e74c3c" opacity="0.2"/>
  
  <!-- Стрелки из конфликтов -->
  <path d="M230,200 L250,220" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M250,250 L230,270" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определения -->
  <rect x="30" y="120" width="90" height="20" fill="#e74c3c" rx="3"/>
  <text x="75" y="135" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Конфликт</text>
  
  <!-- Стрелка к определению -->
  <path d="M150,190 L75,140" stroke="#e74c3c" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Текст определений -->
  <text x="220" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">— столкновение интересов</text>
  <text x="220" y="155" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">— противоречия</text>
  <text x="220" y="170" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">— разногласия</text>
  
  <!-- Стадии конфликта -->
  <text x="50" y="330" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-weight="bold">Стадии конфликта:</text>
  <text x="140" y="330" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">1) Возникновение → 2) Развитие → 3) Пик → 4) Разрешение</text>
  
  <!-- Дополнительные элементы -->
  <rect x="380" y="160" width="60" height="40" fill="#f39c12" rx="5"/>
  <text x="410" y="185" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Риск</text>
  
  <rect x="380" y="210" width="60" height="40" fill="#9b59b6" rx="5"/>
  <text x="410" y="235" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Эмоции</text>
  
  <rect x="380" y="260" width="60" height="40" fill="#1abc9c" rx="5"/>
  <text x="410" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Коммуникация</text>
  
  <!-- Декоративные элементы -->
  <circle cx="40" cy="340" r="5" fill="#e74c3c"/>
  <circle cx="55" cy="340" r="5" fill="#3498db"/>
  <circle cx="70" cy="340" r="5" fill="#2ecc71"/>
  <circle cx="85" cy="340" r="5" fill="#f39c12"/>
  
  <!-- Определения конфликтов -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Конструктивный:</text>
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Деструктивный:</text>
  
  <!-- Разделительные линии -->
  <line x1="260" y1="130" x2="260" y2="310" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="50" y1="220" x2="230" y2="220" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Стрелка определение -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="75" y="100" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Межличностные отношения</text>
  <text x="425" y="100" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Управление конфликтами</text>
  
  <!-- Маркеры важности -->
  <circle cx="235" cy="185" r="3" fill="#e74c3c"/>
  <circle cx="235" cy="225" r="3" fill="#e74c3c"/>
  <circle cx="235" cy="265" r="3" fill="#e74c3c"/>
  
  <!-- Указатели -->
  <path d="M180,230 L210,230" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead-black)"/>
  <defs>
    <marker id="arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>