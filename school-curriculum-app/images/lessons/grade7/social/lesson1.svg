<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">ОБЩЕСТВОЗНАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e74c3c">Что такое человек</text>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">Тема: Человек и общество</text>
  
  <!-- Центральная фигура человека -->
  <g id="centralPerson" transform="translate(250, 180)">
    <!-- Голова -->
    <circle cx="0" cy="-40" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Тело -->
    <rect x="-20" y="-15" width="40" height="50" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Руки -->
    <rect x="-35" y="-10" width="15" height="35" rx="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <rect x="20" y="-10" width="15" height="35" rx="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Ноги -->
    <rect x="-15" y="35" width="12" height="30" rx="6" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <rect x="3" y="35" width="12" height="30" rx="6" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    
    <!-- Лицо -->
    <circle cx="-8" cy="-45" r="3" fill="#ffffff"/>
    <circle cx="8" cy="-45" r="3" fill="#ffffff"/>
    <path d="M -8,-35 Q 0,-30 8,-35" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Круги с понятиями -->
  <!-- Биологический аспект -->
  <g id="biological" transform="translate(120, 150)">
    <circle cx="0" cy="0" r="40" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d35400">Биологический</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d35400">аспект</text>
    
    <!-- Связь с человеком -->
    <line x1="40" y1="0" x2="80" y2="-30" stroke="#f39c12" stroke-width="2"/>
  </g>
  
  <!-- Социальный аспект -->
  <g id="social" transform="translate(380, 150)">
    <circle cx="0" cy="0" r="40" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8e44ad">Социальный</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8e44ad">аспект</text>
    
    <!-- Связь с человеком -->
    <line x1="-40" y1="0" x2="-80" y2="-30" stroke="#9b59b6" stroke-width="2"/>
  </g>
  
  <!-- Духовный аспект -->
  <g id="spiritual" transform="translate(250, 100)">
    <circle cx="0" cy="0" r="40" fill="#1abc9c" fill-opacity="0.3" stroke="#1abc9c" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">Духовный</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#16a085">аспект</text>
    
    <!-- Связь с человеком -->
    <line x1="0" y1="40" x2="0" y2="70" stroke="#1abc9c" stroke-width="2"/>
  </g>
  
  <!-- Схема общества -->
  <g id="society" transform="translate(250, 280)">
    <!-- Основной контур -->
    <rect x="-150" y="-20" width="300" height="60" rx="10" fill="#34495e" fill-opacity="0.2" stroke="#34495e" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Общество</text>
    
    <!-- Элементы общества -->
    <rect x="-140" y="-10" width="60" height="20" rx="3" fill="#e74c3c" fill-opacity="0.7"/>
    <text x="-110" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Семья</text>
    
    <rect x="-70" y="-10" width="60" height="20" rx="3" fill="#3498db" fill-opacity="0.7"/>
    <text x="-40" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Школа</text>
    
    <rect x="0" y="-10" width="60" height="20" rx="3" fill="#2ecc71" fill-opacity="0.7"/>
    <text x="30" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Гос-во</text>
    
    <rect x="70" y="-10" width="60" height="20" rx="3" fill="#f39c12" fill-opacity="0.7"/>
    <text x="100" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Культура</text>
    
    <!-- Стрелка от человека к обществу -->
    <line x1="0" y1="-70" x2="0" y2="-40" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Иконки и дополнительные элементы -->
  <!-- ДНК -->
  <g transform="translate(80, 200)">
    <path d="M 0,0 Q -5,10 0,20 Q 5,30 0,40" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M 0,0 Q 5,10 0,20 Q -5,30 0,40" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Гены</text>
  </g>
  
  <!-- Общение -->
  <g transform="translate(420, 200)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#e74c3c" fill-opacity="0.7"/>
    <path d="M 15,0 L 25,-5 L 25,5 Z" fill="#e74c3c" fill-opacity="0.7"/>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Общение</text>
  </g>
  
  <!-- Мысли -->
  <g transform="translate(250, 80)">
    <path d="M 0,0 Q -10,-15 -5,-25 Q 0,-30 5,-25 Q 10,-15 0,0" fill="#e74c3c" fill-opacity="0.7"/>
    <path d="M 5,-20 Q 0,-25 -5,-20" fill="#e74c3c" fill-opacity="0.7"/>
    <text x="0" y="-35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Мысли</text>
  </g>
  
  <!-- Определения -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="70" height="50" rx="5" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" filter="url(#shadow)"/>
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#2c3e50">Человек</text>
    <text x="35" y="28" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">Существо</text>
    <text x="35" y="40" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">разумное</text>
  </g>
  
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="70" height="50" rx="5" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" filter="url(#shadow)"/>
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" font-weight="bold" fill="#2c3e50">Общество</text>
    <text x="35" y="28" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">Группа людей</text>
    <text x="35" y="40" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">взаимодействующих</text>
  </g>
  
  <!-- Значки качеств -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="8" fill="#e74c3c" fill-opacity="0.8"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">1</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Разум</text>
  </g>
  
  <g transform="translate(130, 50)">
    <circle cx="0" cy="0" r="8" fill="#e74c3c" fill-opacity="0.8"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">2</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Свобода</text>
  </g>
  
  <g transform="translate(160, 50)">
    <circle cx="0" cy="0" r="8" fill="#e74c3c" fill-opacity="0.8"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">3</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Ответственность</text>
  </g>
  
  <!-- Разделительные линии -->
  <line x1="40" y1="100" x2="460" y2="100" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="40" y1="250" x2="460" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные элементы -->
  <rect x="50" y="300" width="100" height="30" rx="15" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1"/>
  <text x="100" y="319" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Природа человека</text>
  
  <rect x="350" y="300" width="100" height="30" rx="15" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1"/>
  <text x="400" y="319" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Воспитание</text>
  
  <!-- Малые элементы для объема -->
  <circle cx="30" cy="170" r="3" fill="#e74c3c" fill-opacity="0.6"/>
  <circle cx="470" cy="170" r="3" fill="#e74c3c" fill-opacity="0.6"/>
  <circle cx="250" cy="340" r="3" fill="#e74c3c" fill-opacity="0.6"/>
  
  <rect x="200" y="45" width="100" height="2" fill="#e74c3c" fill-opacity="0.5"/>
  <rect x="180" y="235" width="140" height="2" fill="#e74c3c" fill-opacity="0.5"/>
  
  <!-- Текстовые элементы для объема -->
  <text x="20" y="290" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Индивид</text>
  <text x="450" y="290" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Личность</text>
  <text x="240" y="340" font-family="Arial, sans-serif" font-size="8" fill="#95a5a6">Субъект</text>
  
  <!-- Дополнительные круги для визуального акцента -->
  <circle cx="250" cy="180" r="60" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" fill-opacity="0.3"/>
  <circle cx="250" cy="180" r="80" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" fill-opacity="0.2"/>
</svg>