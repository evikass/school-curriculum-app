<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#dbeafe" opacity="0.5"/>
  <circle cx="450" cy="100" r="40" fill="#dbeafe" opacity="0.4"/>
  <circle cx="400" cy="300" r="35" fill="#dbeafe" opacity="0.3"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">АЛГЕБРА · 10 КЛАСС</text>
  
  <!-- Основной заголовок темы -->
  <rect x="100" y="60" width="300" height="40" rx="20" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Степень с рациональным показателем</text>
  
  <!-- Формула 1 -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="400" height="30" rx="5" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">a^(m/n) = n√(a^m) = (n√a)^m</text>
  </g>
  
  <!-- Пример 1 -->
  <g transform="translate(50, 165)">
    <rect x="0" y="0" width="400" height="35" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Пример:</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">8^(2/3) = 3√(8²) = 3√64 = 4</text>
  </g>
  
  <!-- Правило 1 -->
  <g transform="translate(50, 215)">
    <rect x="0" y="0" width="190" height="25" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
    <text x="10" y="17" font-family="Arial, sans-serif" font-size="13" fill="#166534">a > 0, m ∈ Z, n ∈ N</text>
  </g>
  
  <!-- Правило 2 -->
  <g transform="translate(260, 215)">
    <rect x="0" y="0" width="190" height="25" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="17" font-family="Arial, sans-serif" font-size="13" fill="#92400e">n > 1, (m,n) = 1</text>
  </g>
  
  <!-- Дополнительные примеры -->
  <g transform="translate(50, 255)">
    <rect x="0" y="0" width="190" height="30" rx="5" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" fill="#be185d">16^(1/2) = √16 = 4</text>
  </g>
  
  <g transform="translate(260, 255)">
    <rect x="0" y="0" width="190" height="30" rx="5" fill="#e9d5ff" stroke="#a855f7" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed">27^(2/3) = 3√(27²) = 9</text>
  </g>
  
  <!-- Важное замечание -->
  <g transform="translate(50, 300)">
    <path d="M 0 10 L 10 0 L 350 0 L 360 10 L 350 20 L 10 20 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="180" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">Внимание: 0^(m/n) не определено при n четном</text>
  </g>
  
  <!-- Декоративные линии -->
  <line x1="30" y1="130" x2="30" y2="290" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="470" y1="130" x2="470" y2="290" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  
  <!-- Маленькие декоративные элементы -->
  <circle cx="30" cy="135" r="3" fill="#3b82f6"/>
  <circle cx="470" cy="135" r="3" fill="#3b82f6"/>
  <circle cx="30" cy="285" r="3" fill="#3b82f6"/>
  <circle cx="470" cy="285" r="3" fill="#3b82f6"/>
  
  <!-- Стрелки указатели -->
  <path d="M 80 145 L 80 160 L 75 155 M 80 160 L 85 155" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <path d="M 420 145 L 420 160 L 415 155 M 420 160 L 425 155" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  
  <!-- Дополнительные символы -->
  <text x="25" y="230" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" opacity="0.5">√</text>
  <text x="475" y="240" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" opacity="0.5">∛</text>
  <text x="25" y="260" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" opacity="0.5">n√</text>
  <text x="475" y="270" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" opacity="0.5">∜</text>
  
  <!-- Условия -->
  <text x="45" y="235" font-family="Arial, sans-serif" font-size="10" fill="#64748b">m,n - целые</text>
  <text x="385" y="255" font-family="Arial, sans-serif" font-size="10" fill="#64748b">n ≠ 0</text>
  
  <!-- Пунктирная линия -->
  <line x1="100" y1="195" x2="400" y2="195" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Маленькие кружочки для украшения -->
  <circle cx="150" cy="80" r="2" fill="#3b82f6" opacity="0.3"/>
  <circle cx="350" cy="80" r="2" fill="#3b82f6" opacity="0.3"/>
  <circle cx="200" cy="250" r="1.5" fill="#ec4899" opacity="0.4"/>
  <circle cx="300" cy="250" r="1.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="125" cy="310" r="1" fill="#ef4444" opacity="0.5"/>
  <circle cx="375" cy="310" r="1" fill="#ef4444" opacity="0.5"/>
</svg>