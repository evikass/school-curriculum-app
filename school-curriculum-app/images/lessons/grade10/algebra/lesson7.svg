<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#e0e0e0" stroke-width="2" rx="5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    АЛГЕБРА · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Логарифмические уравнения
  </text>
  
  <!-- Графическая сетка для координат -->
  <g id="grid" opacity="0.3">
    <line x1="50" y1="100" x2="50" y2="300" stroke="#999" stroke-width="1"/>
    <line x1="100" y1="100" x2="100" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="150" y1="100" x2="150" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="200" y1="100" x2="200" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="250" y1="100" x2="250" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="300" y1="100" x2="300" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="350" y1="100" x2="350" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="400" y1="100" x2="400" y2="300" stroke="#ddd" stroke-width="0.5"/>
    <line x1="450" y1="100" x2="450" y2="300" stroke="#999" stroke-width="1"/>
    
    <line x1="50" y1="100" x2="450" y2="100" stroke="#999" stroke-width="1"/>
    <line x1="50" y1="150" x2="450" y2="150" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="200" x2="450" y2="200" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="300" x2="450" y2="300" stroke="#999" stroke-width="1"/>
  </g>
  
  <!-- Ось координат -->
  <line x1="50" y1="300" x2="450" y2="300" stroke="#2c3e50" stroke-width="2"/>
  <line x1="50" y1="100" x2="50" y2="300" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Стрелки на осях -->
  <polygon points="450,300 440,295 440,305" fill="#2c3e50"/>
  <polygon points="50,100 45,110 55,110" fill="#2c3e50"/>
  
  <!-- График функции y = log₂(x) -->
  <path d="M 50,300 Q 100,280 150,240 T 250,180 Q 300,160 350,145 T 450,130" 
        fill="none" stroke="#3498db" stroke-width="3" opacity="0.8"/>
  
  <!-- Точка пересечения с осью X -->
  <circle cx="250" cy="180" r="5" fill="#e74c3c"/>
  <text x="260" y="175" font-family="Arial" font-size="14" fill="#e74c3c">(2,1)</text>
  
  <!-- Пример уравнения 1 -->
  <g transform="translate(60, 120)">
    <rect x="-10" y="-20" width="180" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
    <text x="85" y="-5" text-anchor="middle" font-family="Arial" font-size="16" fill="#2c3e50">
      log₂(x) = 3
    </text>
    <text x="85" y="15" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f8c8d">
      x = 2³ = 8
    </text>
  </g>
  
  <!-- Пример уравнения 2 -->
  <g transform="translate(260, 120)">
    <rect x="-10" y="-20" width="180" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
    <text x="85" y="-5" text-anchor="middle" font-family="Arial" font-size="16" fill="#2c3e50">
      log₅(x-2) = 1
    </text>
    <text x="85" y="15" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f8c8d">
      x-2 = 5¹
    </text>
  </g>
  
  <!-- Свойства логарифмов -->
  <g transform="translate(60, 210)">
    <rect x="-10" y="-5" width="380" height="80" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="3"/>
    <text x="180" y="15" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#856404">
      Свойства:
    </text>
    <text x="10" y="35" font-family="Arial" font-size="12" fill="#856404">
      logₐ(M·N) = logₐM + logₐN
    </text>
    <text x="10" y="55" font-family="Arial" font-size="12" fill="#856404">
      logₐ(M/N) = logₐM - logₐN  ;  logₐ(Mⁿ) = n·logₐM
    </text>
  </g>
  
  <!-- Формула перехода -->
  <g transform="translate(250, 250)">
    <path d="M -80,0 L 80,0" stroke="#2c3e50" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">
      logₐb = c
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">
      aᶜ = b
    </text>
  </g>
  
  <!-- Стрелки определение -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="420" cy="80" r="3" fill="#3498db" opacity="0.6"/>
  <circle cx="430" cy="85" r="2" fill="#3498db" opacity="0.4"/>
  <circle cx="410" cy="90" r="2" fill="#3498db" opacity="0.4"/>
  
  <rect x="350" y="70" width="60" height="20" fill="#e74c3c" opacity="0.2" rx="10"/>
  <text x="380" y="84" text-anchor="middle" font-family="Arial" font-size="11" fill="#c0392b">
    log
  </text>
  
  <!-- Запись логарифма в показательной форме -->
  <g transform="translate(60, 310)">
    <text font-family="Arial" font-size="12" fill="#7f8c8d">
      <tspan x="0" y="0">Если logₐb = c, то aᶜ = b</tspan>
      <tspan x="0" y="18">где a > 0, a ≠ 1, b > 0</tspan>
    </text>
  </g>
  
  <!-- Дополнительные графики -->
  <path d="M 300,250 Q 320,240 340,235 T 380,230" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>
  <circle cx="340" cy="235" r="3" fill="#e74c3c"/>
  
  <!-- Декоративные элементы -->
  <rect x="460" y="180" width="20" height="20" fill="#3498db" opacity="0.2" transform="rotate(45 470 190)"/>
  <rect x="20" y="280" width="15" height="15" fill="#e74c3c" opacity="0.2" transform="rotate(45 27.5 287.5)"/>
  
  <!-- Уравнение с параметром -->
  <g transform="translate(320, 210)">
    <rect x="-5" y="-15" width="120" height="40" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1" rx="3"/>
    <text x="55" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="#0c5460">
      lg(x²) = 2
    </text>
  </g>
</svg>