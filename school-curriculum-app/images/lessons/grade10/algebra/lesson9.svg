<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="8" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">АЛГЕБРА · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="95" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="18" font-style="italic">Формулы сложения</text>
  
  <!-- Основной контейнер -->
  <rect x="40" y="110" width="420" height="210" rx="10" fill="white" stroke="#ddd" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Тригонометрические формулы -->
  <g transform="translate(70, 140)">
    <!-- sin(a+b) -->
    <text x="0" y="0" fill="#2c3e50" font-family="Times New Roman, serif" font-size="16" font-weight="bold">sin(α + β) =</text>
    <text x="120" y="0" fill="#e74c3c" font-family="Times New Roman, serif" font-size="16">sinα·cosβ + cosα·sinβ</text>
    
    <!-- cos(a+b) -->
    <text x="0" y="35" fill="#2c3e50" font-family="Times New Roman, serif" font-size="16" font-weight="bold">cos(α + β) =</text>
    <text x="120" y="35" fill="#e74c3c" font-family="Times New Roman, serif" font-size="16">cosα·cosβ - sinα·sinβ</text>
    
    <!-- tg(a+b) -->
    <text x="0" y="70" fill="#2c3e50" font-family="Times New Roman, serif" font-size="16" font-weight="bold">tg(α + β) =</text>
    <text x="120" y="70" fill="#e74c3c" font-family="Times New Roman, serif" font-size="16">
      <tspan>tgα + tgβ</tspan>
      <tspan x="120" dy="20" font-size="14">1 - tgα·tgβ</tspan>
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <g transform="translate(350, 130)">
    <!-- Круг для sin -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#3498db" stroke-width="2" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="20" font-weight="bold">sin</text>
    
    <!-- Квадрат для cos -->
    <rect x="-15" y="35" width="30" height="30" fill="none" stroke="#9b59b6" stroke-width="2" opacity="0.3"/>
    <text x="0" y="55" text-anchor="middle" fill="#9b59b6" font-family="Arial" font-size="20" font-weight="bold">cos</text>
    
    <!-- Треугольник для tg -->
    <path d="M 0 85 L -15 115 L 15 115 Z" fill="none" stroke="#e67e22" stroke-width="2" opacity="0.3"/>
    <text x="0" y="105" text-anchor="middle" fill="#e67e22" font-family="Arial" font-size="20" font-weight="bold">tg</text>
  </g>
  
  <!-- Уравнение в углу -->
  <g transform="translate(60, 290)">
    <rect x="-10" y="-20" width="140" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="60" y="-5" text-anchor="middle" fill="#34495e" font-family="Arial" font-size="14">
      α = 30°, β = 45°
    </text>
  </g>
  
  <!-- Пример вычисления -->
  <g transform="translate(220, 270)">
    <text x="0" y="0" fill="#7f8c8d" font-family="Arial" font-size="12">Пример:</text>
    <text x="0" y="20" fill="#555" font-family="Times New Roman, serif" font-size="14">
      sin(75°) = sin(30° + 45°) = 
    </text>
    <text x="180" y="20" fill="#27ae60" font-family="Times New Roman, serif" font-size="14">√6 + √2 / 4</text>
  </g>
  
  <!-- Разделительные линии -->
  <line x1="40" y1="200" x2="460" y2="200" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Матрица коэффициентов -->
  <g transform="translate(350, 220)">
    <rect x="-5" y="-5" width="100" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3"/>
    <text x="45" y="10" text-anchor="middle" fill="#495057" font-family="Arial" font-size="12" font-weight="bold">Матрица</text>
    <text x="20" y="30" text-anchor="middle" fill="#495057" font-family="Times New Roman" font-size="14">[1  -1]</text>
    <text x="20" y="50" text-anchor="middle" fill="#495057" font-family="Times New Roman" font-size="14">[1   1]</text>
  </g>
  
  <!-- Историческая заметка -->
  <g transform="translate(70, 250)">
    <circle cx="0" cy="0" r="3" fill="#3498db"/>
    <text x="10" y="5" fill="#7f8c8d" font-size="11" font-style="italic">
      Формулы сложения известны с древности
    </text>
  </g>
  
  <!-- Дополнительные математические символы -->
  <g transform="translate(300, 150)" opacity="0.2">
    <text x="0" y="0" fill="#95a5a6" font-family="Times New Roman" font-size="24">∑</text>
    <text x="25" y="0" fill="#95a5a6" font-family="Times New Roman" font-size="24">∫</text>
    <text x="50" y="0" fill="#95a5a6" font-family="Times New Roman" font-size="24">∞</text>
  </g>
  
  <!-- Указатель углов -->
  <g transform="translate(100, 140)">
    <path d="M 0 0 L 15 0" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="20" y="5" fill="#e74c3c" font-size="12">α</text>
    
    <path d="M 0 0 L 0 -15" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="5" y="-20" fill="#3498db" font-size="12">β</text>
  </g>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>
</svg>