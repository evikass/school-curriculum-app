<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для графиков -->
    <linearGradient id="graphGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Сетка -->
  <g stroke="#cbd5e1" stroke-width="0.5" opacity="0.5">
    <!-- Вертикальные линии сетки -->
    <line x1="50" y1="50" x2="50" y2="300"/>
    <line x1="100" y1="50" x2="100" y2="300"/>
    <line x1="150" y1="50" x2="150" y2="300"/>
    <line x1="200" y1="50" x2="200" y2="300"/>
    <line x1="250" y1="50" x2="250" y2="300"/>
    <line x1="300" y1="50" x2="300" y2="300"/>
    <line x1="350" y1="50" x2="350" y2="300"/>
    <line x1="400" y1="50" x2="400" y2="300"/>
    <line x1="450" y1="50" x2="450" y2="300"/>
    
    <!-- Горизонтальные линии сетки -->
    <line x1="50" y1="75" x2="450" y2="75"/>
    <line x1="50" y1="100" x2="450" y2="100"/>
    <line x1="50" y1="125" x2="450" y2="125"/>
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="50" y1="175" x2="450" y2="175"/>
    <line x1="50" y1="200" x2="450" y2="200"/>
    <line x1="50" y1="225" x2="450" y2="225"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="50" y1="275" x2="450" y2="275"/>
  </g>
  
  <!-- Оси координат -->
  <g stroke="#475569" stroke-width="2">
    <line x1="50" y1="175" x2="450" y2="175" marker-end="url(#arrowhead)"/>
    <line x1="250" y1="300" x2="250" y2="50" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Стрелки для осей -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  
  <!-- Подписи осей -->
  <text x="460" y="180" font-family="Arial, sans-serif" font-size="14" fill="#475569">x</text>
  <text x="255" y="45" font-family="Arial, sans-serif" font-size="14" fill="#475569">y</text>
  
  <!-- График y = 2^x -->
  <path d="M 50,280 Q 100,270 150,250 T 200,220 Q 225,200 250,175 T 300,120 Q 350,80 400,60 L 450,50" 
        stroke="url(#graphGradient1)" stroke-width="3" fill="none"/>
  
  <!-- График y = (1/2)^x -->
  <path d="M 50,70 Q 100,80 150,100 T 200,130 Q 225,150 250,175 T 300,230 Q 350,270 400,280 L 450,290" 
        stroke="url(#graphGradient2)" stroke-width="3" fill="none"/>
  
  <!-- Точки на графике -->
  <g fill="#3b82f6">
    <circle cx="100" cy="270" r="3"/>
    <circle cx="150" cy="250" r="3"/>
    <circle cx="200" cy="220" r="3"/>
    <circle cx="250" cy="175" r="3"/>
    <circle cx="300" cy="120" r="3"/>
    <circle cx="350" cy="80" r="3"/>
    <circle cx="400" cy="60" r="3"/>
  </g>
  
  <g fill="#ef4444">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="150" cy="100" r="3"/>
    <circle cx="200" cy="130" r="3"/>
    <circle cx="250" cy="175" r="3"/>
    <circle cx="300" cy="230" r="3"/>
    <circle cx="350" cy="270" r="3"/>
    <circle cx="400" cy="280" r="3"/>
  </g>
  
  <!-- Подписи функций -->
  <text x="320" y="90" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8" font-weight="bold">y = 2ˣ</text>
  <text x="320" y="270" font-family="Arial, sans-serif" font-size="16" fill="#dc2626" font-weight="bold">y = (½)ˣ</text>
  
  <!-- Подписи на оси X -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="100" y="190">-2</text>
    <text x="150" y="190">-1</text>
    <text x="200" y="190">0</text>
    <text x="250" y="190">1</text>
    <text x="300" y="190">2</text>
    <text x="350" y="190">3</text>
    <text x="400" y="190">4</text>
  </g>
  
  <!-- Подписи на оси Y -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="240" y="75">4</text>
    <text x="240" y="125">2</text>
    <text x="240" y="180">0</text>
    <text x="240" y="230">-2</text>
    <text x="240" y="280">-4</text>
  </g>
  
  <!-- Точка пересечения с осью Y -->
  <circle cx="250" cy="175" r="4" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="260" y="170" font-family="Arial, sans-serif" font-size="12" fill="#047857">(0;1)</text>
  
  <!-- Свойства функции -->
  <g transform="translate(50, 20)">
    <rect x="0" y="0" width="400" height="25" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="200" y="17" font-family="Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="bold">Показательная функция: y = aˣ, где a > 0, a ≠ 1</text>
  </g>
  
  <!-- Название урока -->
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="bold" filter="url(#textShadow)">АЛГЕБРА · 10 КЛАСС</text>
  
  <!-- Дополнительные элементы для украшения -->
  <g opacity="0.3">
    <rect x="60" y="60" width="30" height="30" rx="5" fill="#3b82f6" opacity="0.2"/>
    <rect x="410" y="60" width="30" height="30" rx="5" fill="#ef4444" opacity="0.2"/>
    <rect x="60" y="260" width="30" height="30" rx="5" fill="#10b981" opacity="0.2"/>
    <rect x="410" y="260" width="30" height="30" rx="5" fill="#f59e0b" opacity="0.2"/>
  </g>
  
  <!-- Малые индикаторы -->
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">
    <text x="65" y="80">a>1</text>
    <text x="415" y="80">0<a<1</text>
    <text x="65" y="280">D(f)=R</text>
    <text x="415" y="280">E(f)=R+</text>
  </g>
  
  <!-- Анимация для точек -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.2;1"
    dur="2s"
    repeatCount="indefinite"
    begin="0s"
    xlink:href="#point1"/>
  
  <!-- Дополнительные декоративные элементы -->
  <g opacity="0.5">
    <circle cx="80" cy="100" r="2" fill="#3b82f6"/>
    <circle cx="90" cy="90" r="1.5" fill="#3b82f6"/>
    <circle cx="420" cy="100" r="2" fill="#ef4444"/>
    <circle cx="410" cy="90" r="1.5" fill="#ef4444"/>
  </g>
</svg>