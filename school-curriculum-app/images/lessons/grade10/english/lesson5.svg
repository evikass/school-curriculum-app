<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Анимация пульсации -->
    <animate id="pulse" attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС
  </text>
  
  <!-- Основной заголовок урока -->
  <rect x="100" y="55" width="300" height="40" rx="20" fill="#2196f3" filter="url(#shadow)"/>
  <text x="250" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Урок 5: Phrasal Verbs
  </text>
  
  <!-- Иконка книги -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="30" height="25" rx="2" fill="#1976d2"/>
    <rect x="3" y="3" width="24" height="19" fill="white"/>
    <line x1="6" y1="8" x2="24" y2="8" stroke="#1976d2" stroke-width="1"/>
    <line x1="6" y1="12" x2="24" y2="12" stroke="#1976d2" stroke-width="1"/>
    <line x1="6" y1="16" x2="20" y2="16" stroke="#1976d2" stroke-width="1"/>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="110" x2="450" y2="110" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Примеры phrasal verbs -->
  <g transform="translate(0, 120)">
    <!-- Пример 1 -->
    <rect x="50" y="0" width="140" height="50" rx="5" fill="#e1f5fe" stroke="#4fc3f7" stroke-width="1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277bd">
      look for
    </text>
    <text x="60" y="38" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
      искать
    </text>
    
    <!-- Стрелка -->
    <path d="M 200 25 L 220 25" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Пример 2 -->
    <rect x="230" y="0" width="140" height="50" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1"/>
    <text x="240" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
      find out
    </text>
    <text x="240" y="38" font-family="Arial, sans-serif" font-size="12" fill="#37474f">
      выяснить
    </text>
  </g>
  
  <!-- Определение -->
  <rect x="50" y="190" width="400" height="60" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">
    Phrasal verbs = глагол + предлог/наречие
  </text>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="12" fill="#5d4037">
    Образуют новые значения и меняют смысл исходного глагола
  </text>
  
  <!-- Дополнительные примеры -->
  <g transform="translate(0, 265)">
    <!-- Пример 3 -->
    <circle cx="70" cy="25" r="20" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">
      turn on
    </text>
    <text x="70" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6a1b9a">
      включить
    </text>
    
    <!-- Пример 4 -->
    <circle cx="150" cy="25" r="20" fill="#fce4ec" stroke="#ec407a" stroke-width="1"/>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#880e4f">
      turn off
    </text>
    <text x="150" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#880e4f">
      выключить
    </text>
    
    <!-- Пример 5 -->
    <circle cx="230" cy="25" r="20" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
    <text x="230" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#283593">
      give up
    </text>
    <text x="230" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#283593">
      сдаваться
    </text>
    
    <!-- Пример 6 -->
    <circle cx="310" cy="25" r="20" fill="#e0f2f1" stroke="#26a69a" stroke-width="1"/>
    <text x="310" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004d40">
      pick up
    </text>
    <text x="310" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#004d40">
      поднять
    </text>
    
    <!-- Пример 7 -->
    <circle cx="390" cy="25" r="20" fill="#ffebee" stroke="#ef5350" stroke-width="1"/>
    <text x="390" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b71c1c">
      put off
    </text>
    <text x="390" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c">
      откладывать
    </text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="150" r="3" fill="#64b5f6" opacity="0.6">
    <animate attributeName="cy" values="150;160;150" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="180" r="3" fill="#64b5f6" opacity="0.6">
    <animate attributeName="cy" values="180;170;180" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="280" r="2" fill="#81c784" opacity="0.6">
    <animate attributeName="cy" values="280;290;280" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Знак вопроса -->
  <g transform="translate(420, 120)">
    <circle cx="0" cy="0" r="15" fill="#ffc107" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">
      ?
    </text>
  </g>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
  </defs>
  
  <!-- Подпись "Запомни!" -->
  <rect x="350" y="190" width="90" height="25" rx="12" fill="#ff5722" filter="url(#shadow)"/>
  <text x="395" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Запомни!
  </text>
</svg>