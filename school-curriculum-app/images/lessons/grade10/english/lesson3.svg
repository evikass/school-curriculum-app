<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title Background -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  
  <!-- Main Title -->
  <text x="250" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС</text>
  <text x="250" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Урок 3: Conditionals</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="15" fill="#3498db" opacity="0.3"/>
  <circle cx="470" cy="30" r="15" fill="#e74c3c" opacity="0.3"/>
  
  <!-- Conditional Types Section -->
  <g id="conditional-types">
    <!-- Zero Conditional -->
    <g transform="translate(20, 80)">
      <rect width="220" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
      <text x="110" y="20" text-anchor="middle" fill="#2c3e50" font-family="Arial" font-size="14" font-weight="bold">Zero Conditional</text>
      <text x="110" y="40" text-anchor="middle" fill="#34495e" font-family="Arial" font-size="12">If + Present, Present</text>
      <text x="110" y="55" text-anchor="middle" fill="#7f8c8d" font-family="Arial" font-size="10">General truths</text>
    </g>
    
    <!-- First Conditional -->
    <g transform="translate(260, 80)">
      <rect width="220" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="110" y="20" text-anchor="middle" fill="#2e7d32" font-family="Arial" font-size="14" font-weight="bold">First Conditional</text>
      <text x="110" y="40" text-anchor="middle" fill="#388e3c" font-family="Arial" font-size="12">If + Present, Future</text>
      <text x="110" y="55" text-anchor="middle" fill="#689f38" font-family="Arial" font-size="10">Real possibilities</text>
    </g>
    
    <!-- Second Conditional -->
    <g transform="translate(20, 160)">
      <rect width="220" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="110" y="20" text-anchor="middle" fill="#e65100" font-family="Arial" font-size="14" font-weight="bold">Second Conditional</text>
      <text x="110" y="40" text-anchor="middle" fill="#f57c00" font-family="Arial" font-size="12">If + Past, Would</text>
      <text x="110" y="55" text-anchor="middle" fill="#ff9800" font-family="Arial" font-size="10">Unreal situations</text>
    </g>
    
    <!-- Third Conditional -->
    <g transform="translate(260, 160)">
      <rect width="220" height="60" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="5"/>
      <text x="110" y="20" text-anchor="middle" fill="#880e4f" font-family="Arial" font-size="14" font-weight="bold">Third Conditional</text>
      <text x="110" y="40" text-anchor="middle" fill="#ad1457" font-family="Arial" font-size="12">If + Past Perfect</text>
      <text x="110" y="55" text-anchor="middle" fill="#c2185b" font-family="Arial" font-size="10">Past unreal</text>
    </g>
  </g>
  
  <!-- Examples -->
  <g id="examples">
    <text x="20" y="250" fill="#2c3e50" font-family="Arial" font-size="14" font-weight="bold">Examples:</text>
    
    <!-- Zero Conditional Example -->
    <text x="20" y="275" fill="#34495e" font-family="Arial" font-size="12">If it rains, the ground gets wet.</text>
    <line x1="20" y1="280" x2="180" y2="280" stroke="#3498db" stroke-width="1" opacity="0.5"/>
    
    <!-- First Conditional Example -->
    <text x="260" y="275" fill="#388e3c" font-family="Arial" font-size="12">If I study, I will pass the exam.</text>
    <line x1="260" y1="280" x2="400" y2="280" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
    
    <!-- Second Conditional Example -->
    <text x="20" y="300" fill="#f57c00" font-family="Arial" font-size="12">If I had money, I would travel.</text>
    <line x1="20" y1="305" x2="160" y2="305" stroke="#ff9800" stroke-width="1" opacity="0.5"/>
    
    <!-- Third Conditional Example -->
    <text x="260" y="300" fill="#c2185b" font-family="Arial" font-size="12">If I had studied, I would have passed.</text>
    <line x1="260" y1="305" x2="440" y2="305" stroke="#e91e63" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Decorative elements -->
  <path d="M 100 310 Q 110 320 120 310" fill="none" stroke="#bdc3c7" stroke-width="2"/>
  <path d="M 380 310 Q 390 320 400 310" fill="none" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Small icons -->
  <g transform="translate(40, 85)">
    <circle cx="10" cy="10" r="8" fill="#3498db" opacity="0.2"/>
    <text x="10" y="14" text-anchor="middle" fill="#3498db" font-size="10" font-weight="bold">0</text>
  </g>
  
  <g transform="translate(280, 85)">
    <circle cx="10" cy="10" r="8" fill="#4caf50" opacity="0.2"/>
    <text x="10" y="14" text-anchor="middle" fill="#4caf50" font-size="10" font-weight="bold">1</text>
  </g>
  
  <g transform="translate(40, 165)">
    <circle cx="10" cy="10" r="8" fill="#ff9800" opacity="0.2"/>
    <text x="10" y="14" text-anchor="middle" fill="#ff9800" font-size="10" font-weight="bold">2</text>
  </g>
  
  <g transform="translate(280, 165)">
    <circle cx="10" cy="10" r="8" fill="#e91e63" opacity="0.2"/>
    <text x="10" y="14" text-anchor="middle" fill="#e91e63" font-size="10" font-weight="bold">3</text>
  </g>
  
  <!-- Additional decorative elements -->
  <rect x="15" y="315" width="30" height="2" fill="#95a5a6" rx="1"/>
  <rect x="455" y="315" width="30" height="2" fill="#95a5a6" rx="1"/>
  
  <!-- Corner decorations -->
  <path d="M 0 60 L 0 70 L 10 60" fill="#34495e"/>
  <path d="M 500 60 L 500 70 L 490 60" fill="#34495e"/>
</svg>