<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Title background -->
  <rect x="50" y="20" width="400" height="60" rx="10" fill="#2c3e50"/>
  
  <!-- Main title -->
  <text x="250" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС
  </text>
  
  <!-- Lesson number -->
  <circle cx="70" cy="100" r="25" fill="#e74c3c"/>
  <text x="70" y="107" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    7
  </text>
  
  <!-- Lesson title -->
  <text x="110" y="107" fill="#2c3e50" font-family="Arial, sans-serif" font-size="20" font-weight="600">
    Урок 7: Word Formation
  </text>
  
  <!-- Decorative elements -->
  <path d="M 40 130 Q 250 120 460 130" stroke="#3498db" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 40 140 Q 250 130 460 140" stroke="#3498db" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Word Formation Methods -->
  <text x="50" y="170" fill="#2c3e50" font-family="Arial, sans-serif" font-size="16" font-weight="600">
    Методы словообразования:
  </text>
  
  <!-- Prefixes -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#9b59b6" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
      Prefixes
    </text>
  </g>
  
  <!-- Suffixes -->
  <g transform="translate(170, 190)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#e67e22" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
      Suffixes
    </text>
  </g>
  
  <!-- Compounds -->
  <g transform="translate(290, 190)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#27ae60" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
      Compounds
    </text>
  </g>
  
  <!-- Examples boxes -->
  <!-- Prefix examples -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="130" height="80" rx="5" fill="#ecf0f1" stroke="#9b59b6" stroke-width="2"/>
    <text x="10" y="20" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="600">
      un- (not)
    </text>
    <text x="10" y="40" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      happy → unhappy
    </text>
    <text x="10" y="55" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      able → unable
    </text>
    <text x="10" y="70" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      fair → unfair
    </text>
  </g>
  
  <!-- Suffix examples -->
  <g transform="translate(190, 240)">
    <rect x="0" y="0" width="130" height="80" rx="5" fill="#ecf0f1" stroke="#e67e22" stroke-width="2"/>
    <text x="10" y="20" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="600">
      -able (can)
    </text>
    <text x="10" y="40" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      read → readable
    </text>
    <text x="10" y="55" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      enjoy → enjoyable
    </text>
    <text x="10" y="70" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      think → thinkable
    </text>
  </g>
  
  <!-- Compound examples -->
  <g transform="translate(330, 240)">
    <rect x="0" y="0" width="130" height="80" rx="5" fill="#ecf0f1" stroke="#27ae60" stroke-width="2"/>
    <text x="10" y="20" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="600">
      Compound words
    </text>
    <text x="10" y="40" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      sun + flower →
    </text>
    <text x="10" y="55" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      sunflower
    </text>
    <text x="10" y="70" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">
      foot + ball → football
    </text>
  </g>
  
  <!-- Connecting lines -->
  <line x1="115" y1="215" x2="115" y2="235" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="255" y1="215" x2="255" y2="235" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="395" y1="215" x2="395" y2="235" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow3)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e67e22"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Additional decorative elements -->
  <circle cx="30" cy="320" r="8" fill="#3498db" opacity="0.6"/>
  <circle cx="50" cy="330" r="5" fill="#e74c3c" opacity="0.6"/>
  <circle cx="470" cy="320" r="8" fill="#2ecc71" opacity="0.6"/>
  <circle cx="450" cy="330" r="5" fill="#f39c12" opacity="0.6"/>
  
  <!-- Practice hint -->
  <text x="250" y="325" text-anchor="middle" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" font-style="italic">
    Practice forming new words using prefixes, suffixes, and compounds
  </text>
  
  <!-- Icon decoration -->
  <g transform="translate(420, 50)">
    <path d="M 0 10 Q 10 0 20 10 Q 10 20 0 10" fill="#f39c12" opacity="0.7"/>
  </g>
  
  <!-- Border decoration -->
  <rect x="10" y="10" width="480" height="330" rx="15" fill="none" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
</svg>