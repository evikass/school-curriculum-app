<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Speech bubble gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Title background -->
  <rect x="20" y="20" width="460" height="60" rx="10" fill="#2d3748" filter="url(#shadow)"/>
  
  <!-- Title text -->
  <text x="250" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС
  </text>
  
  <!-- Lesson number -->
  <circle cx="60" cy="50" r="20" fill="#4299e1" opacity="0.8"/>
  <text x="60" y="57" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">10</text>
  
  <!-- Lesson title -->
  <rect x="140" y="100" width="220" height="40" rx="20" fill="#667eea" filter="url(#shadow)"/>
  <text x="250" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="600">
    Lesson: Discussion Skills
  </text>
  
  <!-- Main illustration - conversation people -->
  <g transform="translate(250, 180)">
    <!-- Person 1 -->
    <g transform="translate(-80, 0)">
      <circle cx="0" cy="0" r="15" fill="#4299e1"/>
      <path d="M -15 15 Q 0 10 15 15 L 15 40 L -15 40 Z" fill="#4299e1"/>
      <!-- Speech bubble 1 -->
      <rect x="-25" y="-50" width="50" height="30" rx="15" fill="url(#bubbleGrad)" opacity="0.8"/>
      <path d="M -10 -20 L -5 -10" stroke="#4299e1" stroke-width="2" fill="none"/>
      <text x="0" y="-30" text-anchor="middle" fill="white" font-size="10">I think</text>
    </g>
    
    <!-- Person 2 -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="15" fill="#48bb78"/>
      <path d="M -15 15 Q 0 10 15 15 L 15 40 L -15 40 Z" fill="#48bb78"/>
      <!-- Speech bubble 2 -->
      <rect x="-25" y="-50" width="50" height="30" rx="15" fill="#48bb78" opacity="0.8"/>
      <path d="M 5 -20 L 10 -10" stroke="#48bb78" stroke-width="2" fill="none"/>
      <text x="0" y="-30" text-anchor="middle" fill="white" font-size="10">Agree!</text>
    </g>
    
    <!-- Connection line -->
    <path d="M -65 0 Q 0 -20 65 0" stroke="#cbd5e0" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Skill boxes -->
  <!-- Expressing Opinion -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#ed8936" opacity="0.9" filter="url(#shadow)"/>
    <text x="45" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="600">Expressing</text>
    <text x="45" y="40" text-anchor="middle" fill="white" font-size="11" font-weight="600">Opinion</text>
    <circle cx="45" cy="55" r="8" fill="white" opacity="0.3"/>
    <text x="45" y="60" text-anchor="middle" fill="white" font-size="16">💭</text>
  </g>
  
  <!-- Agreeing -->
  <g transform="translate(160, 250)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#48bb78" opacity="0.9" filter="url(#shadow)"/>
    <text x="45" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="600">Agreeing</text>
    <text x="45" y="40" text-anchor="middle" fill="white" font-size="11" font-weight="600">with others</text>
    <circle cx="45" cy="55" r="8" fill="white" opacity="0.3"/>
    <text x="45" y="60" text-anchor="middle" fill="white" font-size="16">👍</text>
  </g>
  
  <!-- Disagreeing -->
  <g transform="translate(270, 250)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#e53e3e" opacity="0.9" filter="url(#shadow)"/>
    <text x="45" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="600">Disagreeing</text>
    <text x="45" y="40" text-anchor="middle" fill="white" font-size="11" font-weight="600">politely</text>
    <circle cx="45" cy="55" r="8" fill="white" opacity="0.3"/>
    <text x="45" y="60" text-anchor="middle" fill="white" font-size="16">🤔</text>
  </g>
  
  <!-- Asking Questions -->
  <g transform="translate(380, 250)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#9f7aea" opacity="0.9" filter="url(#shadow)"/>
    <text x="45" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="600">Asking</text>
    <text x="45" y="40" text-anchor="middle" fill="white" font-size="11" font-weight="600">Questions</text>
    <circle cx="45" cy="55" r="8" fill="white" opacity="0.3"/>
    <text x="45" y="60" text-anchor="middle" fill="white" font-size="16">❓</text>
  </g>
  
  <!-- Decorative elements -->
  <!-- Small circles -->
  <circle cx="30" cy="100" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="470" cy="100" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="30" cy="340" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="470" cy="340" r="3" fill="#4299e1" opacity="0.5"/>
  
  <!-- Lines -->
  <line x1="20" y1="150" x2="480" y2="150" stroke="#cbd5e0" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="230" x2="480" y2="230" stroke="#cbd5e0" stroke-width="1" opacity="0.5"/>
  
  <!-- Keywords -->
  <text x="100" y="170" fill="#718096" font-size="10" font-family="Arial, sans-serif">In my opinion...</text>
  <text x="250" y="170" fill="#718096" font-size="10" font-family="Arial, sans-serif">I agree with you</text>
  <text x="380" y="170" fill="#718096" font-size="10" font-family="Arial, sans-serif">That's interesting</text>
  
  <!-- Additional decorative stars -->
  <g transform="translate(100, 200)">
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#fbd38d" opacity="0.6"/>
  </g>
  <g transform="translate(400, 200)">
    <path d="M 0 -5 L 1.5 -1.5 L 5 0 L 1.5 1.5 L 0 5 L -1.5 1.5 L -5 0 L -1.5 -1.5 Z" fill="#fbd38d" opacity="0.6"/>
  </g>
  
  <!-- Bottom decoration -->
  <rect x="150" y="330" width="200" height="3" rx="1.5" fill="#4299e1" opacity="0.5"/>
</svg>