<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title Background -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  
  <!-- Main Title -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС</text>
  
  <!-- Lesson Title -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#2c3e50">Урок 4: Reported Speech</text>
  
  <!-- Speech bubbles decoration -->
  <g id="speech-bubbles">
    <!-- Bubble 1 -->
    <path d="M 50 110 Q 50 100 60 100 L 140 100 Q 150 100 150 110 L 150 140 Q 150 150 140 150 L 80 150 L 70 160 L 75 150 L 60 150 Q 50 150 50 140 Z" 
          fill="#3498db" opacity="0.2"/>
    
    <!-- Bubble 2 -->
    <path d="M 350 110 Q 350 100 360 100 L 440 100 Q 450 100 450 110 L 450 140 Q 450 150 440 150 L 380 150 L 370 160 L 375 150 L 360 150 Q 350 150 350 140 Z" 
          fill="#e74c3c" opacity="0.2"/>
  </g>
  
  <!-- Direct Speech Example -->
  <g id="direct-speech">
    <rect x="30" y="170" width="200" height="60" rx="10" fill="#3498db" opacity="0.1"/>
    <text x="40" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2c3e50">Direct Speech:</text>
    <text x="40" y="215" font-family="Arial, sans-serif" font-size="16" fill="#34495e">"I am happy," she said.</text>
  </g>
  
  <!-- Arrow transformation -->
  <g id="arrow">
    <path d="M 240 200 L 260 200" stroke="#7f8c8d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="260,195 270,200 260,205" fill="#7f8c8d"/>
  </g>
  
  <!-- Reported Speech Example -->
  <g id="reported-speech">
    <rect x="270" y="170" width="200" height="60" rx="10" fill="#e74c3c" opacity="0.1"/>
    <text x="280" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2c3e50">Reported Speech:</text>
    <text x="280" y="215" font-family="Arial, sans-serif" font-size="16" fill="#34495e">She said that she was happy.</text>
  </g>
  
  <!-- Rules Box -->
  <g id="rules">
    <rect x="40" y="250" width="420" height="80" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="50" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2c3e50">Правила преобразования:</text>
    
    <!-- Rule 1 -->
    <circle cx="60" cy="295" r="3" fill="#3498db"/>
    <text x="70" y="300" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Present → Past</text>
    
    <!-- Rule 2 -->
    <circle cx="180" cy="295" r="3" fill="#3498db"/>
    <text x="190" y="300" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Past → Past Perfect</text>
    
    <!-- Rule 3 -->
    <circle cx="320" cy="295" r="3" fill="#3498db"/>
    <text x="330" y="300" font-family="Arial, sans-serif" font-size="12" fill="#34495e">will → would</text>
    
    <!-- Rule 4 -->
    <circle cx="60" cy="315" r="3" fill="#3498db"/>
    <text x="70" y="320" font-family="Arial, sans-serif" font-size="12" fill="#34495e">can → could</text>
    
    <!-- Rule 5 -->
    <circle cx="180" cy="315" r="3" fill="#3498db"/>
    <text x="190" y="320" font-family="Arial, sans-serif" font-size="12" fill="#34495e">may → might</text>
  </g>
  
  <!-- Decorative elements -->
  <g id="decorations">
    <!-- Book icon -->
    <g transform="translate(450, 40)">
      <rect x="0" y="0" width="30" height="40" rx="2" fill="#f39c12" opacity="0.3"/>
      <line x1="15" y1="0" x2="15" y2="40" stroke="#e67e22" stroke-width="1"/>
      <line x1="0" y1="20" x2="15" y2="20" stroke="#e67e22" stroke-width="1"/>
    </g>
    
    <!-- Pencil icon -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="30" height="8" rx="1" fill="#e74c3c" transform="rotate(45 15 4)"/>
      <polygon points="20,0 15,5 10,0" fill="#c0392b" transform="rotate(45 15 2.5)"/>
    </g>
  </g>
  
  <!-- Example sentences with transformation -->
  <g id="examples" opacity="0.8">
    <!-- Example 1 -->
    <g transform="translate(30, 340)">
      <text font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">"I love this lesson,"</text>
      <text x="100" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">→</text>
      <text x="115" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">He said that he loved that lesson.</text>
    </g>
    
    <!-- Example 2 -->
    <g transform="translate(250, 340)">
      <text font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">"I will come tomorrow,"</text>
      <text x="105" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">→</text>
      <text x="120" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">She said that she would come the next day.</text>
    </g>
  </g>
  
  <!-- Time indicators -->
  <g id="time-indicators">
    <rect x="50" y="105" width="60" height="20" rx="10" fill="#2ecc71" opacity="0.2"/>
    <text x="80" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">NOW</text>
    
    <rect x="390" y="105" width="60" height="20" rx="10" fill="#9b59b6" opacity="0.2"/>
    <text x="420" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad">THEN</text>
  </g>
  
  <!-- Grammar symbols -->
  <g id="grammar-symbols">
    <!-- Quote marks -->
    <text x="40" y="195" font-family="Georgia, serif" font-size="20" fill="#3498db" opacity="0.5">"</text>
    <text x="190" y="195" font-family="Georgia, serif" font-size="20" fill="#3498db" opacity="0.5">"</text>
    
    <text x="280" y="195" font-family="Georgia, serif" font-size="20" fill="#e74c3c" opacity="0.5">"</text>
    <text x="440" y="195" font-family="Georgia, serif" font-size="20" fill="#e74c3c" opacity="0.5">"</text>
  </g>
</svg>