<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Декоративные линии -->
  <path d="M0 50 Q125 30 250 50 T500 50" stroke="#e3e6ea" stroke-width="2" fill="none"/>
  <path d="M0 300 Q125 320 250 300 T500 300" stroke="#e3e6ea" stroke-width="2" fill="none"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    АНГЛИЙСКИЙ ЯЗЫК · 10 КЛАСС
  </text>
  
  <!-- Основной контейнер -->
  <rect x="40" y="70" width="420" height="250" rx="15" fill="white" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Reading Strategies заголовок -->
  <rect x="60" y="90" width="380" height="40" rx="8" fill="#3498db"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">
    Lesson 8: Reading Strategies
  </text>
  
  <!-- Иконка книги -->
  <g transform="translate(90, 150)">
    <rect width="30" height="40" rx="3" fill="#e74c3c"/>
    <rect x="5" y="5" width="20" height="30" fill="white"/>
    <line x1="10" y1="10" x2="20" y2="10" stroke="#e74c3c" stroke-width="1"/>
    <line x1="10" y1="15" x2="20" y2="15" stroke="#e74c3c" stroke-width="1"/>
    <line x1="10" y1="20" x2="20" y2="20" stroke="#e74c3c" stroke-width="1"/>
  </g>
  
  <!-- Предварительное чтение -->
  <g transform="translate(130, 145)">
    <rect width="200" height="50" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2c3e50">
      Pre-reading
    </text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      Preview, predict, activate schema
    </text>
  </g>
  
  <!-- Иконка лупы -->
  <g transform="translate(340, 150)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <line x1="24" y1="24" x2="30" y2="30" stroke="#9b59b6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="6" fill="#9b59b6"/>
  </g>
  
  <!-- Во время чтения -->
  <g transform="translate(90, 210)">
    <rect width="200" height="50" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2c3e50">
      While reading
    </text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      Scan, skim, infer, question
    </text>
  </g>
  
  <!-- Иконка заметок -->
  <g transform="translate(300, 210)">
    <rect width="25" height="30" rx="2" fill="#f39c12"/>
    <rect x="5" y="5" width="15" height="20" fill="white"/>
    <line x1="8" y1="10" x2="17" y2="10" stroke="#f39c12" stroke-width="1"/>
    <line x1="8" y1="14" x2="17" y2="14" stroke="#f39c12" stroke-width="1"/>
    <line x1="8" y1="18" x2="12" y2="18" stroke="#f39c12" stroke-width="1"/>
  </g>
  
  <!-- После чтения -->
  <g transform="translate(90, 275)">
    <rect width="200" height="35" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2c3e50">
      Post-reading
    </text>
    <text x="10" y="28" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      Summarize, review, reflect
    </text>
  </g>
  
  <!-- Соединительные стрелки -->
  <path d="M250 195 L250 205" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M250 265 L250 275" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелки для определения -->
  <path d="M190 170 L190 175" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M190 230 L190 235" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Определения -->
  <g transform="translate(340, 160)">
    <rect width="140" height="80" rx="5" fill="#fff3cd" stroke="#ffeaa7" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#856404">
      <tspan x="10" dy="0">Skimming:</tspan>
      <tspan x="10" dy="15">Quick reading for</tspan>
      <tspan x="10" dy="15">main ideas</tspan>
    </text>
  </g>
  
  <g transform="translate(340, 220)">
    <rect width="140" height="80" rx="5" fill="#d1ecf1" stroke="#bee5eb" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#0c5460">
      <tspan x="10" dy="0">Scanning:</tspan>
      <tspan x="10" dy="15">Looking for specific</tspan>
      <tspan x="10" dy="15">information</tspan>
    </text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="70" cy="130" r="3" fill="#3498db"/>
  <circle cx="430" cy="130" r="3" fill="#3498db"/>
  <circle cx="70" cy="290" r="3" fill="#95a5a6"/>
  <circle cx="430" cy="290" r="3" fill="#95a5a6"/>
  
  <!-- Точки для акцента -->
  <g transform="translate(250, 170)">
    <circle cx="-2" cy="0" r="2" fill="#e74c3c"/>
    <circle cx="0" cy="0" r="2" fill="#e74c3c"/>
    <circle cx="2" cy="0" r="2" fill="#e74c3c"/>
  </g>
  
  <g transform="translate(250, 250)">
    <circle cx="-2" cy="0" r="2" fill="#f39c12"/>
    <circle cx="0" cy="0" r="2" fill="#f39c12"/>
    <circle cx="2" cy="0" r="2" fill="#f39c12"/>
  </g>
  
  <!-- Определение маркера -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6" font-style="italic">
    Effective reading strategies improve comprehension
  </text>
</svg>