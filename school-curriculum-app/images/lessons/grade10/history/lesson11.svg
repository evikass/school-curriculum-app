<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="30" fill="#e67e22" opacity="0.3"/>
  <circle cx="50" cy="300" r="25" fill="#e67e22" opacity="0.3"/>
  <circle cx="480" cy="320" r="20" fill="#e67e22" opacity="0.2"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="url(#titleGrad)" filter="url(#shadow)">
    УРОК 11
  </text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        text-anchor="middle" fill="#ecf0f1">
    Раздробленность Руси
  </text>
  
  <!-- Класс -->
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        text-anchor="middle" fill="#bdc3c7">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Временная шкала -->
  <line x1="50" y1="120" x2="450" y2="120" stroke="#7f8c8d" stroke-width="2"/>
  <circle cx="50" cy="120" r="4" fill="#e74c3c"/>
  <circle cx="150" cy="120" r="4" fill="#e74c3c"/>
  <circle cx="250" cy="120" r="4" fill="#e74c3c"/>
  <circle cx="350" cy="120" r="4" fill="#e74c3c"/>
  <circle cx="450" cy="120" r="4" fill="#e74c3c"/>
  
  <!-- Даты на временной шкале -->
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bdc3c7">
    1132
  </text>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bdc3c7">
    1169
  </text>
  <text x="250" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bdc3c7">
    1237-1240
  </text>
  <text x="350" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bdc3c7">
    1240-1242
  </text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bdc3c7">
    1242-1245
  </text>
  
  <!-- Принятие веры -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#3498db" opacity="0.8" filter="url(#shadow)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">Причины</text>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      раздробленности
    </text>
  </g>
  
  <!-- Столпы -->
  <g transform="translate(150, 170)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#9b59b6" opacity="0.8" filter="url(#shadow)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">Княжеские</text>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      междоусобицы
    </text>
  </g>
  
  <!-- Киевская Русь -->
  <g transform="translate(250, 170)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#e74c3c" opacity="0.8" filter="url(#shadow)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">Монгольское</text>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      нашествие
    </text>
  </g>
  
  <!-- Крещение Руси -->
  <g transform="translate(350, 170)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#f39c12" opacity="0.8" filter="url(#shadow)"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">Последствия</text>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      раздробленности
    </text>
  </g>
  
  <!-- Крест -->
  <g transform="translate(430, 180)">
    <path d="M0,-20 L0,20 M-10,0 L10,0" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Связующие линии -->
  <path d="M130,200 L150,200" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M230,200 L250,200" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M330,200 L350,200" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Основные княжества -->
  <g transform="translate(50, 250)">
    <circle cx="30" cy="20" r="15" fill="#2ecc71" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">В</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Владимиро-</text>
    <text x="30" y="58" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Суздальское</text>
  </g>
  
  <g transform="translate(120, 250)">
    <circle cx="30" cy="20" r="15" fill="#3498db" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">К</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Киевское</text>
  </g>
  
  <g transform="translate(190, 250)">
    <circle cx="30" cy="20" r="15" fill="#9b59b6" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Г</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Галицко-</text>
    <text x="30" y="58" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Волынское</text>
  </g>
  
  <g transform="translate(260, 250)">
    <circle cx="30" cy="20" r="15" fill="#e74c3c" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Ч</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Черниговское</text>
  </g>
  
  <g transform="translate(330, 250)">
    <circle cx="30" cy="20" r="15" fill="#f39c12" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Н</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Новгородское</text>
  </g>
  
  <g transform="translate(400, 250)">
    <circle cx="30" cy="20" r="15" fill="#1abc9c" opacity="0.7"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Р</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ecf0f1">Рязанское</text>
  </g>
  
  <!-- Декоративные элементы -->
  <path d="M20,100 Q30,90 40,100 T60,100" stroke="#7f8c8d" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M440,100 Q450,90 460,100 T480,100" stroke="#7f8c8d" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Завершающий элемент -->
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="11" font-style="italic" 
        text-anchor="middle" fill="#95a5a6">
    "Раздробленность - не упадок, а новая ступень развития"
  </text>
</svg>