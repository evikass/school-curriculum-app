<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f5f2e8"/>
  
  <!-- Декоративный узор по краям -->
  <path d="M0,0 L20,0 L10,20 Z" fill="#d4af37" opacity="0.3"/>
  <path d="M480,0 L500,0 L490,20 Z" fill="#d4af37" opacity="0.3"/>
  <path d="M0,330 L20,350 L0,350 Z" fill="#d4af37" opacity="0.3"/>
  <path d="M480,330 L500,350 L500,330 Z" fill="#d4af37" opacity="0.3"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#8b4513">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#654321">Урок 5: Образование Древнерусского государства</text>
  
  <!-- Карта контуров -->
  <g opacity="0.6">
    <!-- Волхов -->
    <path d="M150,180 Q180,160 220,170 Q260,180 280,200 Q270,220 240,230 Q200,220 170,210 Q150,195 150,180" fill="#4a90e2" stroke="#2c5aa0" stroke-width="1"/>
    <!-- Днепр -->
    <path d="M120,250 Q150,240 190,245 Q230,250 270,260 Q290,270 280,290 Q250,295 210,290 Q170,285 140,275 Q110,265 120,250" fill="#4a90e2" stroke="#2c5aa0" stroke-width="1"/>
    <!-- Западная Двина -->
    <path d="M80,150 Q100,140 120,145 Q140,150 150,170 Q145,185 125,190 Q105,185 85,175 Q70,165 80,150" fill="#4a90e2" stroke="#2c5aa0" stroke-width="1"/>
  </g>
  
  <!-- Границы государств -->
  <g stroke="#8b4513" stroke-width="2" fill="none" stroke-dasharray="5,3">
    <path d="M100,120 L100,300 L400,300 L400,120 Z"/>
    <circle cx="250" cy="210" r="80" stroke="#d4af37" stroke-dasharray="3,2"/>
  </g>
  
  <!-- Города -->
  <!-- Киев -->
  <g transform="translate(250, 210)">
    <circle r="8" fill="#8b0000" stroke="#654321" stroke-width="2"/>
    <text y="-15" text-anchor="middle" font-size="12" font-weight="bold" fill="#654321">Киев</text>
    <rect x="-15" y="-5" width="30" height="20" fill="#daa520" opacity="0.3" rx="2"/>
  </g>
  
  <!-- Новгород -->
  <g transform="translate(180, 160)">
    <circle r="6" fill="#8b0000" stroke="#654321" stroke-width="1.5"/>
    <text y="-12" text-anchor="middle" font-size="11" font-weight="bold" fill="#654321">Новгород</text>
    <rect x="-12" y="-4" width="24" height="16" fill="#daa520" opacity="0.3" rx="1.5"/>
  </g>
  
  <!-- Смоленск -->
  <g transform="translate(220, 190)">
    <circle r="5" fill="#8b0000" stroke="#654321" stroke-width="1.5"/>
    <text y="-10" text-anchor="middle" font-size="10" font-weight="bold" fill="#654321">Смоленск</text>
  </g>
  
  <!-- Чернигов -->
  <g transform="translate(280, 190)">
    <circle r="5" fill="#8b0000" stroke="#654321" stroke-width="1.5"/>
    <text y="-10" text-anchor="middle" font-size="10" font-weight="bold" fill="#654321">Чернигов</text>
  </g>
  
  <!-- Поляне -->
  <g transform="translate(250, 230)">
    <ellipse rx="25" ry="15" fill="#90ee90" opacity="0.5"/>
    <text y="5" text-anchor="middle" font-size="10" fill="#2d5016">Поляне</text>
  </g>
  
  <!-- Северяне -->
  <g transform="translate(300, 200)">
    <ellipse rx="22" ry="12" fill="#87ceeb" opacity="0.5"/>
    <text y="4" text-anchor="middle" font-size="10" fill="#1e3a5f">Северяне</text>
  </g>
  
  <!-- Древляне -->
  <g transform="translate(220, 250)">
    <ellipse rx="20" ry="12" fill="#ffb6c1" opacity="0.5"/>
    <text y="4" text-anchor="middle" font-size="10" fill="#8b0000">Древляне</text>
  </g>
  
  <!-- Кривичи -->
  <g transform="translate(180, 180)">
    <ellipse rx="20" ry="12" fill="#dda0dd" opacity="0.5"/>
    <text y="4" text-anchor="middle" font-size="10" fill="#4b0082">Кривичи</text>
  </g>
  
  <!-- Ильмень озеро -->
  <ellipse cx="160" cy="160" rx="25" ry="15" fill="#4a90e2" opacity="0.7"/>
  <text x="160" y="163" text-anchor="middle" font-size="9" fill="white" font-weight="bold">Ильмень</text>
  
  <!-- Днепр -->
  <text x="200" y="280" text-anchor="middle" font-size="11" fill="#2c5aa0" font-weight="bold">Днепр</text>
  
  <!-- Волхов -->
  <text x="180" y="195" text-anchor="middle" font-size="11" fill="#2c5aa0" font-weight="bold">Волхов</text>
  
  <!-- Легенда -->
  <g transform="translate(50, 310)">
    <rect width="400" height="30" fill="#f0e6d2" stroke="#8b4513" stroke-width="1" rx="3"/>
    <circle cx="20" cy="15" r="4" fill="#8b0000"/>
    <text x="30" y="19" font-size="11" fill="#654321">Города</text>
    <ellipse cx="90" cy="15" rx="15" ry="8" fill="#90ee90" opacity="0.5"/>
    <text x="110" y="19" font-size="11" fill="#654321">Племена</text>
    <path d="M180,15 L200,15" stroke="#8b4513" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="210" y="19" font-size="11" fill="#654321">Границы</text>
    <ellipse cx="300" cy="15" rx="15" ry="8" fill="#4a90e2" opacity="0.7"/>
    <text x="325" y="19" font-size="11" fill="#654321">Водные пути</text>
  </g>
  
  <!-- Древнерусский орнамент -->
  <g transform="translate(420, 100)" opacity="0.4">
    <path d="M0,0 Q10,5 20,0 Q30,-5 40,0 Q50,5 60,0" stroke="#d4af37" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="2" fill="#d4af37"/>
    <circle cx="20" cy="0" r="2" fill="#d4af37"/>
    <circle cx="40" cy="0" r="2" fill="#d4af37"/>
    <circle cx="60" cy="0" r="2" fill="#d4af37"/>
  </g>
  
  <!-- Солнце-символ -->
  <g transform="translate(450, 50)" opacity="0.3">
    <circle r="15" fill="#ffd700"/>
    <path d="M0,-20 L0,-25 M14,-14 L17,-17 M20,0 L25,0 M14,14 L17,17 M0,20 L0,25 M-14,14 L-17,17 M-20,0 L-25,0 M-14,-14 L-17,-17" stroke="#ffd700" stroke-width="2"/>
  </g>
  
  <!-- Древнерусские руны -->
  <g transform="translate(30, 50)" opacity="0.4" font-family="serif" font-size="14" fill="#8b4513">
    <text>ᛒ ᛞ ᚴ ᚾ</text>
  </g>
  
  <!-- Компас -->
  <g transform="translate(450, 300)">
    <circle r="20" fill="none" stroke="#8b4513" stroke-width="1"/>
    <path d="M0,-15 L5,-5 L0,0 L-5,-5 Z" fill="#8b4513"/>
    <text x="0" y="-22" text-anchor="middle" font-size="10" fill="#8b4513">С</text>
  </g>
  
  <!-- Штриховка для обозначения лесов -->
  <g opacity="0.2">
    <path d="M50,100 L55,110 L60,100 L65,110 L70,100" stroke="#228b22" stroke-width="1"/>
    <path d="M380,150 L385,160 L390,150 L395,160 L400,150" stroke="#228b22" stroke-width="1"/>
    <path d="M350,250 L355,260 L360,250 L365,260 L370,250" stroke="#228b22" stroke-width="1"/>
  </g>
</svg>