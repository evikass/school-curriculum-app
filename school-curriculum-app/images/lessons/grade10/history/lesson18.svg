<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f1e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8dcc0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Текстурный узор -->
    <pattern id="texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="1" fill="#d4c5a9" opacity="0.3"/>
    </pattern>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <rect width="500" height="350" fill="url(#texture)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#8b4513">ИСТОРИЯ · 10 КЛАСС</text>
  <line x1="150" y1="45" x2="350" y2="45" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5d4037">Урок 18: Объединение русских земель</text>
  <text x="250" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5d4037">вокруг Москвы</text>
  
  <!-- Карта русских земель -->
  <g transform="translate(50, 120)">
    <!-- Фон карты -->
    <rect x="0" y="0" width="400" height="180" fill="#f5f5dc" stroke="#8b4513" stroke-width="2" rx="5" opacity="0.8"/>
    
    <!-- Московское княжество -->
    <path d="M 150 60 L 200 50 L 220 70 L 200 90 L 160 85 Z" fill="#d32f2f" stroke="#8b0000" stroke-width="1.5"/>
    <text x="185" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">Москва</text>
    
    <!-- Новгород -->
    <circle cx="80" cy="40" r="15" fill="#1976d2" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="80" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Новг.</text>
    
    <!-- Тверь -->
    <circle cx="150" cy="40" r="12" fill="#388e3c" stroke="#1b5e20" stroke-width="1.5"/>
    <text x="150" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Тверь</text>
    
    <!-- Рязань -->
    <circle cx="280" cy="100" r="12" fill="#f57c00" stroke="#e65100" stroke-width="1.5"/>
    <text x="280" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Ряз.</text>
    
    <!-- Псков -->
    <circle cx="60" cy="90" r="10" fill="#7b1fa2" stroke="#4a148c" stroke-width="1.5"/>
    <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Псков</text>
    
    <!-- Смоленск -->
    <circle cx="120" cy="120" r="10" fill="#00796b" stroke="#004d40" stroke-width="1.5"/>
    <text x="120" y="125" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Смол.</text>
    
    <!-- Казань -->
    <circle cx="320" cy="60" r="10" fill="#6a1b9a" stroke="#4a148c" stroke-width="1.5"/>
    <text x="320" y="65" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Казань</text>
    
    <!-- Линия объединения -->
    <path d="M 185 70 Q 180 80, 150 80" stroke="#ff6b35" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <path d="M 185 70 Q 200 60, 280 100" stroke="#ff6b35" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <path d="M 185 70 Q 140 60, 80 40" stroke="#ff6b35" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    
    <!-- Стрелка -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#ff6b35"/>
      </marker>
    </defs>
    
    <!-- Легенда -->
    <text x="10" y="20" font-family="Arial" font-size="11" fill="#5d4037">Великие княжества:</text>
    <rect x="10" y="25" width="15" height="10" fill="#d32f2f"/>
    <text x="30" y="34" font-family="Arial" font-size="10" fill="#5d4037">Московское</text>
    <rect x="90" y="25" width="15" height="10" fill="#1976d2"/>
    <text x="110" y="34" font-family="Arial" font-size="10" fill="#5d4037">Новгородское</text>
    <rect x="180" y="25" width="15" height="10" fill="#388e3c"/>
    <text x="200" y="34" font-family="Arial" font-size="10" fill="#5d4037">Тверское</text>
  </g>
  
  <!-- Ключевые даты -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="120" height="30" fill="#fff3e0" stroke="#ff8f00" stroke-width="1" rx="3"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#e65100">1328-1340 гг.</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#bf360c">Иван Калита</text>
  </g>
  
  <g transform="translate(160, 310)">
    <rect x="0" y="0" width="120" height="30" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32">1380 г.</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#1b5e20">Куликовская битва</text>
  </g>
  
  <g transform="translate(290, 310)">
    <rect x="0" y="0" width="120" height="30" fill="#fce4ec" stroke="#e91e63" stroke-width="1" rx="3"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#c2185b">1480 г.</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#880e4f">Стояние на Угре</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="20" fill="#ffd54f" opacity="0.3"/>
  <circle cx="460" cy="60" r="15" fill="#ffb74d" opacity="0.3"/>
  <circle cx="40" cy="280" r="18" fill="#81c784" opacity="0.3"/>
  <circle cx="55" cy="295" r="12" fill="#4fc3f7" opacity="0.3"/>
  
  <!-- Указатель временного периода -->
  <g transform="translate(420, 150)">
    <rect x="-30" y="-15" width="60" height="30" fill="#ffecb3" stroke="#ffa000" stroke-width="1" rx="15"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="#e65100">XIV-XV вв.</text>
  </g>
  
  <!-- Иконка книги -->
  <g transform="translate(25, 35)">
    <rect x="0" y="0" width="20" height="25" fill="#8b4513" rx="2"/>
    <rect x="2" y="2" width="16" height="21" fill="#f5f5dc"/>
    <line x1="6" y1="6" x2="14" y2="6" stroke="#8b4513" stroke-width="0.5"/>
    <line x1="6" y1="10" x2="14" y2="10" stroke="#8b4513" stroke-width="0.5"/>
    <line x1="6" y1="14" x2="14" y2="14" stroke="#8b4513" stroke-width="0.5"/>
    <line x1="6" y1="18" x2="10" y2="18" stroke="#8b4513" stroke-width="0.5"/>
  </g>
</svg>