<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f1e8"/>
  
  <!-- Декоративные элементы -->
  <pattern id="pattern1" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#d4a574" opacity="0.3"/>
  </pattern>
  <rect width="500" height="350" fill="url(#pattern1)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" fill="#8b4513" opacity="0.9"/>
  <text x="250" y="50" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="24" font-weight="bold">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#5d4037" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Урок 14: Монгольское нашествие на Русь</text>
  
  <!-- Карта Руси -->
  <g transform="translate(30, 120)">
    <!-- Границы -->
    <path d="M 80,0 L 120,10 L 140,30 L 130,60 L 110,80 L 80,90 L 50,85 L 30,70 L 20,50 L 25,30 L 40,15 Z" 
          fill="#e8d5b7" stroke="#8b4513" stroke-width="2"/>
    <path d="M 140,30 L 180,35 L 200,50 L 190,75 L 160,85 L 130,60 Z" 
          fill="#e8d5b7" stroke="#8b4513" stroke-width="2"/>
    <path d="M 200,50 L 240,55 L 260,70 L 250,90 L 220,95 L 190,75 Z" 
          fill="#e8d5b7" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Города -->
    <circle cx="80" cy="45" r="4" fill="#d32f2f"/>
    <circle cx="140" cy="45" r="4" fill="#d32f2f"/>
    <circle cx="200" cy="60" r="4" fill="#d32f2f"/>
    <circle cx="120" cy="70" r="4" fill="#d32f2f"/>
    
    <!-- Названия городов -->
    <text x="80" y="40" text-anchor="middle" fill="#5d4037" font-size="10">Киев</text>
    <text x="140" y="40" text-anchor="middle" fill="#5d4037" font-size="10">Владимир</text>
    <text x="200" y="55" text-anchor="middle" fill="#5d4037" font-size="10">Рязань</text>
    <text x="120" y="85" text-anchor="middle" fill="#5d4037" font-size="10">Чернигов</text>
  </g>
  
  <!-- Монгольские всадники -->
  <g transform="translate(350, 140)">
    <!-- Всадник 1 -->
    <g transform="translate(0, 0)">
      <ellipse cx="10" cy="15" rx="8" ry="12" fill="#424242" transform="rotate(-10 10 15)"/>
      <rect x="5" y="5" width="10" height="15" fill="#795548" transform="rotate(-10 10 12)"/>
      <circle cx="10" cy="3" r="3" fill="#fdd835"/>
      <path d="M 15,5 L 25,0 L 28,5 L 25,8 Z" fill="#5d4037"/>
      <line x1="8" y1="20" x2="8" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="5" y2="40" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="15" y2="40" stroke="#424242" stroke-width="2"/>
    </g>
    
    <!-- Всадник 2 -->
    <g transform="translate(30, 10) scale(0.9)">
      <ellipse cx="10" cy="15" rx="8" ry="12" fill="#424242" transform="rotate(-10 10 15)"/>
      <rect x="5" y="5" width="10" height="15" fill="#795548" transform="rotate(-10 10 12)"/>
      <circle cx="10" cy="3" r="3" fill="#fdd835"/>
      <path d="M 15,5 L 25,0 L 28,5 L 25,8 Z" fill="#5d4037"/>
      <line x1="8" y1="20" x2="8" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="5" y2="40" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="15" y2="40" stroke="#424242" stroke-width="2"/>
    </g>
    
    <!-- Всадник 3 -->
    <g transform="translate(60, 5) scale(0.8)">
      <ellipse cx="10" cy="15" rx="8" ry="12" fill="#424242" transform="rotate(-10 10 15)"/>
      <rect x="5" y="5" width="10" height="15" fill="#795548" transform="rotate(-10 10 12)"/>
      <circle cx="10" cy="3" r="3" fill="#fdd835"/>
      <path d="M 15,5 L 25,0 L 28,5 L 25,8 Z" fill="#5d4037"/>
      <line x1="8" y1="20" x2="8" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="35" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="5" y2="40" stroke="#424242" stroke-width="2"/>
      <line x1="10" y1="35" x2="15" y2="40" stroke="#424242" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Стрелы -->
  <g transform="translate(300, 150)">
    <line x1="0" y1="0" x2="40" y2="10" stroke="#5d4037" stroke-width="1"/>
    <line x1="0" y1="5" x2="40" y2="15" stroke="#5d4037" stroke-width="1"/>
    <line x1="0" y1="10" x2="40" y2="20" stroke="#5d4037" stroke-width="1"/>
    <line x1="0" y1="15" x2="40" y2="25" stroke="#5d4037" stroke-width="1"/>
  </g>
  
  <!-- Даты -->
  <rect x="50" y="240" width="150" height="30" fill="#8d6e63" opacity="0.8" rx="5"/>
  <text x="125" y="260" text-anchor="middle" fill="#fff" font-size="14">1237-1240 гг.</text>
  
  <rect x="220" y="240" width="150" height="30" fill="#8d6e63" opacity="0.8" rx="5"/>
  <text x="295" y="260" text-anchor="middle" fill="#fff" font-size="14">1240-1480 гг.</text>
  
  <!-- Ключевые события -->
  <g transform="translate(50, 290)">
    <circle cx="10" cy="10" r="5" fill="#d32f2f"/>
    <text x="20" y="14" fill="#5d4037" font-size="12">Битва на реке Сити</text>
  </g>
  
  <g transform="translate(200, 290)">
    <circle cx="10" cy="10" r="5" fill="#d32f2f"/>
    <text x="20" y="14" fill="#5d4037" font-size="12">Разгром Киева</text>
  </g>
  
  <g transform="translate(320, 290)">
    <circle cx="10" cy="10" r="5" fill="#d32f2f"/>
    <text x="20" y="14" fill="#5d4037" font-size="12">Орденское иго</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g transform="translate(420, 180)">
    <path d="M 0,0 L 10,5 L 0,10 Z" fill="#8b4513"/>
    <path d="M 0,15 L 10,20 L 0,25 Z" fill="#8b4513"/>
    <path d="M 0,30 L 10,35 L 0,40 Z" fill="#8b4513"/>
  </g>
  
  <!-- Орнамент -->
  <g transform="translate(30, 100)">
    <path d="M 0,0 Q 5,5 10,0 T 20,0" stroke="#8b4513" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 0,10 Q 5,15 10,10 T 20,10" stroke="#8b4513" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <g transform="translate(450, 100)">
    <path d="M 0,0 Q 5,5 10,0 T 20,0" stroke="#8b4513" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 0,10 Q 5,15 10,10 T 20,10" stroke="#8b4513" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Пламя пожара -->
  <g transform="translate(100, 200)">
    <path d="M 0,20 Q 0,10 5,0 Q 10,10 10,20 Z" fill="#ff5722" opacity="0.8"/>
    <path d="M 5,20 Q 5,15 7,10 Q 9,15 9,20 Z" fill="#ffc107" opacity="0.6"/>
  </g>
  
  <g transform="translate(120, 210)">
    <path d="M 0,20 Q 0,10 5,0 Q 10,10 10,20 Z" fill="#ff5722" opacity="0.8"/>
    <path d="M 5,20 Q 5,15 7,10 Q 9,15 9,20 Z" fill="#ffc107" opacity="0.6"/>
  </g>
  
  <!-- Солнце-монгольский знак -->
  <g transform="translate(400, 60)">
    <circle cx="10" cy="10" r="8" fill="#ffd54f" opacity="0.7"/>
    <g>
      <line x1="10" y1="0" x2="10" y2="4" stroke="#8b4513" stroke-width="2"/>
      <line x1="10" y1="16" x2="10" y2="20" stroke="#8b4513" stroke-width="2"/>
      <line x1="0" y1="10" x2="4" y2="10" stroke="#8b4513" stroke-width="2"/>
      <line x1="16" y1="10" x2="20" y2="10" stroke="#8b4513" stroke-width="2"/>
      <line x1="3.5" y1="3.5" x2="6.5" y2="6.5" stroke="#8b4513" stroke-width="2"/>
      <line x1="13.5" y1="13.5" x2="16.5" y2="16.5" stroke="#8b4513" stroke-width="2"/>
      <line x1="16.5" y1="3.5" x2="13.5" y2="6.5" stroke="#8b4513" stroke-width="2"/>
      <line x1="6.5" y1="13.5" x2="3.5" y2="16.5" stroke="#8b4513" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Щиты защитников -->
  <g transform="translate(250, 180)">
    <ellipse cx="10" cy="20" rx="8" ry="12" fill="#795548" stroke="#5d4037" stroke-width="1"/>
    <line x1="10" y1="10" x2="10" y2="30" stroke="#5d4037" stroke-width="1"/>
    <line x1="5" y1="15" x2="15" y2="15" stroke="#5d4037" stroke-width="1"/>
    <line x1="5" y1="25" x2="15" y2="25" stroke="#5d4037" stroke-width="1"/>
  </g>
  
  <g transform="translate(270, 185)">
    <ellipse cx="10" cy="20" rx="8" ry="12" fill="#795548" stroke="#5d4037" stroke-width="1"/>
    <line x1="10" y1="10" x2="10" y2="30" stroke="#5d4037" stroke-width="1"/>
    <line x1="5" y1="15" x2="15" y2="15" stroke="#5d4037" stroke-width="1"/>
    <line x1="5" y1="25" x2="15" y2="25" stroke="#5d4037" stroke-width="1"/>
  </g>
  
  <!-- Геральдический элемент -->
  <g transform="translate(350, 250)">
    <rect x="0" y="0" width="30" height="30" fill="#b71c1c" opacity="0.8" rx="3"/>
    <path d="M 15,5 L 20,15 L 10,15 Z" fill="#fff"/>
    <rect x="12" y="15" width="6" height="10" fill="#fff"/>
  </g>
  
  <!-- Волнистая линия -->
  <path d="M 50,280 Q 100,270 150,280 T 250,280 T 350,280 T 450,280" 
        stroke="#8b4513" stroke-width="1" fill="none" opacity="0.5"/>
</svg>