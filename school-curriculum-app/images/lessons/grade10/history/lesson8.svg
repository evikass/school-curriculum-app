<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f4e8d0"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#8b4513" stroke-width="3"/>
  <rect x="20" y="20" width="460" height="310" fill="none" stroke="#8b4513" stroke-width="1"/>
  
  <!-- Заголовок -->
  <text x="250" y="45" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#2c1810">Урок 8: Владимир I и</text>
  <text x="250" y="70" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#2c1810">крещение Руси</text>
  
  <!-- Эмблема - крест -->
  <g transform="translate(250, 95)">
    <circle r="20" fill="#8b0000" opacity="0.8"/>
    <path d="M-8,-8 L8,-8 L8,8 L-8,8 Z" fill="white"/>
  </g>
  
  <!-- Изображение Владимира I -->
  <g transform="translate(100, 150)">
    <ellipse cx="0" cy="40" rx="35" ry="45" fill="#fdbcb4"/>
    <path d="M-30,-10 Q-30,-35 -15,-40 L15,-40 Q30,-35 30,-10 L30,20 Q30,30 20,35 L-20,35 Q-30,30 -30,20 Z" fill="#8b4513"/>
    <circle cx="-10" cy="10" r="2" fill="#333"/>
    <circle cx="10" cy="10" r="2" fill="#333"/>
    <path d="M-10,20 Q0,25 10,20" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Корона -->
    <path d="M-20,-25 L-15,-35 L-10,-30 L-5,-38 L0,-30 L5,-35 L10,-30 L15,-35 L20,-25" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <rect x="-25" y="-25" width="50" height="8" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  </g>
  
  <!-- Церковь -->
  <g transform="translate(350, 180)">
    <rect x="-20" y="0" width="40" height="30" fill="#8b4513"/>
    <path d="M-25,0 L0,-20 L25,0" fill="#b8860b"/>
    <rect x="-5" y="15" width="10" height="15" fill="#654321"/>
    <!-- Крест на куполе -->
    <g transform="translate(0,-20)">
      <rect x="-2" y="-8" width="4" height="16" fill="#ffd700"/>
      <rect x="-6" y="-2" width="12" height="4" fill="#ffd700"/>
    </g>
  </g>
  
  <!-- Волхов (река) -->
  <path d="M50,250 Q100,240 150,245 T250,240 Q300,238 350,242 T450,240" fill="none" stroke="#4682b4" stroke-width="8" opacity="0.7"/>
  <path d="M50,250 Q100,240 150,245 T250,240 Q300,238 350,242 T450,240" fill="none" stroke="#87ceeb" stroke-width="4" opacity="0.5"/>
  
  <!-- Кижи (остров) -->
  <ellipse cx="150" cy="245" rx="40" ry="15" fill="#90ee90"/>
  <rect x="130" y="240" width="40" height="5" fill="#228b22"/>
  
  <!-- Великий Новгород -->
  <g transform="translate(250, 250)">
    <rect x="-30" y="-5" width="60" height="20" fill="#8b4513" opacity="0.8"/>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">Великий Новгород</text>
  </g>
  
  <!-- Киев -->
  <g transform="translate(350, 250)">
    <rect x="-20" y="-5" width="40" height="20" fill="#8b4513" opacity="0.8"/>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">Киев</text>
  </g>
  
  <!-- Символы веры -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="80" height="100" fill="#f5f5dc" stroke="#8b4513" stroke-width="1" rx="5"/>
    <text x="40" y="20" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#2c1810">Символы веры</text>
    <text x="5" y="40" font-family="serif" font-size="7" fill="#2c1810">• Верую в Бога</text>
    <text x="5" y="55" font-family="serif" font-size="7" fill="#2c1810">• Отца Вседержителя</text>
    <text x="5" y="70" font-family="serif" font-size="7" fill="#2c1810">• Творца неба и земли</text>
    <text x="5" y="85" font-family="serif" font-size="7" fill="#2c1810">• И во единого Господа</text>
  </g>
  
  <!-- Даты -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="80" height="60" fill="#e6e6fa" stroke="#4b0082" stroke-width="1" rx="5"/>
    <text x="40" y="20" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#2c1810">Даты</text>
    <text x="40" y="40" text-anchor="middle" font-family="serif" font-size="9" fill="#2c1810">980-1015</text>
    <text x="40" y="55" text-anchor="middle" font-family="serif" font-size="9" fill="#2c1810">гг. правления</text>
  </g>
  
  <!-- Хронология -->
  <g transform="translate(200, 120)">
    <rect x="0" y="0" width="100" height="80" fill="#fff8dc" stroke="#daa520" stroke-width="1" rx="5"/>
    <text x="50" y="20" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#2c1810">988 г.</text>
    <text x="50" y="40" text-anchor="middle" font-family="serif" font-size="8" fill="#2c1810">Крещение Руси</text>
    <text x="50" y="55" text-anchor="middle" font-family="serif" font-size="8" fill="#2c1810">в Киеве</text>
    <circle cx="50" cy="65" r="3" fill="#ff6347"/>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <path d="M30,100 L35,90 L40,100" stroke="#8b4513" stroke-width="2" fill="none"/>
    <path d="M460,100 L465,90 L470,100" stroke="#8b4513" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Щит и меч -->
  <g transform="translate(100, 280)">
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#8b0000" stroke="#654321" stroke-width="1"/>
    <circle cx="0" cy="-10" r="3" fill="#ffd700"/>
    <path d="M0,-25 L0,-45" stroke="#654321" stroke-width="3"/>
    <path d="M-45,-40 L-30,-30" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Книги -->
  <g transform="translate(350, 280)">
    <rect x="-15" y="-5" width="10" height="15" fill="#8b4513" transform="rotate(-10 -10 2)"/>
    <rect x="-5" y="-5" width="10" height="15" fill="#a0522d" transform="rotate(5 0 2)"/>
    <rect x="5" y="-5" width="10" height="15" fill="#cd853f" transform="rotate(15 10 2)"/>
  </g>
  
  <!-- Подпись "ИСТОРИЯ · 10 КЛАСС" -->
  <text x="250" y="330" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#2c1810">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Орнамент -->
  <g opacity="0.5">
    <path d="M30,340 L40,335 L50,340" stroke="#8b4513" stroke-width="1" fill="none"/>
    <path d="M450,340 L460,335 L470,340" stroke="#8b4513" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="80" cy="180" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="420" cy="160" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="180" cy="200" r="2" fill="#87ceeb" opacity="0.7"/>
  <circle cx="320" cy="190" r="2" fill="#87ceeb" opacity="0.7"/>
  
  <!-- Стрелки указания -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b4513"/>
    </marker>
  </defs>
  <path d="M150,140 L180,130" stroke="#8b4513" stroke-width="1" marker-end="url(#arrowhead)" opacity="0.5"/>
  <path d="M320,140 L290,130" stroke="#8b4513" stroke-width="1" marker-end="url(#arrowhead)" opacity="0.5"/>
  
  <!-- Солнце (символ христианства) -->
  <g transform="translate(450, 50)">
    <circle r="8" fill="#ffd700"/>
    <path d="M0,-12 L0,-16 M8.5,-8.5 L11,-11 M12,0 L16,0 M8.5,8.5 L11,11 M0,12 L0,16 M-8.5,8.5 L-11,11 M-12,0 L-16,0 M-8.5,-8.5 L-11,-11" stroke="#ffd700" stroke-width="2"/>
  </g>
</svg>