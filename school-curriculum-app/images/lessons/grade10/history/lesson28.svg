<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f3f0"/>
  
  <!-- Декоративный узор -->
  <pattern id="ornament" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M10,0 L10,20 M0,10 L20,10" stroke="#d4c5b9" stroke-width="0.5"/>
  </pattern>
  <rect width="500" height="350" fill="url(#ornament)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c1810">Урок 28: Реформы Петра I</text>
  
  <!-- Основная рамка -->
  <rect x="40" y="60" width="420" height="280" fill="#faf8f5" stroke="#8b6f47" stroke-width="2" rx="5"/>
  
  <!-- Эпоха Петра -->
  <text x="250" y="90" font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a3c28">1682-1725</text>
  
  <!-- Раздел 1: Военные реформы -->
  <g id="military-reforms">
    <rect x="60" y="110" width="180" height="200" fill="#e8f0f8" stroke="#4a6fa5" stroke-width="1.5" rx="3"/>
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c4d7f">Военные реформы</text>
    
    <!-- Армия -->
    <circle cx="90" cy="160" r="3" fill="#4a6fa5"/>
    <text x="100" y="165" font-family="Arial, sans-serif" font-size="11" fill="#2c4d7f">Регулярная армия</text>
    
    <!-- Флот -->
    <circle cx="90" cy="185" r="3" fill="#4a6fa5"/>
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2c4d7f">Военный флот</text>
    
    <!-- Табель -->
    <circle cx="90" cy="210" r="3" fill="#4a6fa5"/>
    <text x="100" y="215" font-family="Arial, sans-serif" font-size="11" fill="#2c4d7f">Табель о рангах</text>
    
    <!-- Уставы -->
    <circle cx="90" cy="235" r="3" fill="#4a6fa5"/>
    <text x="100" y="240" font-family="Arial, sans-serif" font-size="11" fill="#2c4d7f">Военные уставы</text>
    
    <!-- Символ армии -->
    <path d="M220,150 L230,150 L225,160 Z" fill="#4a6fa5"/>
    <line x1="225" y1="160" x2="225" y2="175" stroke="#4a6fa5" stroke-width="2"/>
    <circle cx="225" cy="178" r="3" fill="#4a6fa5"/>
  </g>
  
  <!-- Раздел 2: Административные реформы -->
  <g id="admin-reforms">
    <rect x="260" y="110" width="180" height="200" fill="#f0e8e8" stroke="#a54a4a" stroke-width="1.5" rx="3"/>
    <text x="350" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7a3a3a">Административные реформы</text>
    
    <!-- Сенат -->
    <circle cx="290" cy="160" r="3" fill="#a54a4a"/>
    <text x="300" y="165" font-family="Arial, sans-serif" font-size="11" fill="#7a3a3a">Сенат</text>
    
    <!-- Коллегии -->
    <circle cx="290" cy="185" r="3" fill="#a54a4a"/>
    <text x="300" y="190" font-family="Arial, sans-serif" font-size="11" fill="#7a3a3a">Коллегии</text>
    
    <!-- Губернии -->
    <circle cx="290" cy="210" r="3" fill="#a54a4a"/>
    <text x="300" y="215" font-family="Arial, sans-serif" font-size="11" fill="#7a3a3a">Губернии</text>
    
    <!-- Фискалы -->
    <circle cx="290" cy="235" r="3" fill="#a54a4a"/>
    <text x="300" y="240" font-family="Arial, sans-serif" font-size="11" fill="#7a3a3a">Фискалы</text>
    
    <!-- Символ власти -->
    <rect x="410" y="150" width="15" height="20" fill="none" stroke="#a54a4a" stroke-width="1.5"/>
    <circle cx="417.5" cy="145" r="3" fill="#a54a4a"/>
  </g>
  
  <!-- Раздел 3: Экономические реформы -->
  <g id="economic-reforms">
    <rect x="60" y="110" width="180" height="60" fill="#e8f8e8" stroke="#4aa56f" stroke-width="1.5" rx="3"/>
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d7f4f">Экономические реформы</text>
    <text x="150" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2d7f4f">Промышленность • Торговля • Налоги</text>
  </g>
  
  <!-- Раздел 4: Культурные реформы -->
  <g id="cultural-reforms">
    <rect x="260" y="110" width="180" height="60" fill="#f8f0e8" stroke="#a58f4a" stroke-width="1.5" rx="3"/>
    <text x="350" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f6f2d">Культурные реформы</text>
    <text x="350" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f6f2d">Образование • Календарь • Бороды</text>
  </g>
  
  <!-- Центральный элемент: Петр I -->
  <g id="peter">
    <circle cx="250" cy="250" r="30" fill="#d4b5a0" stroke="#8b6f47" stroke-width="2"/>
    <path d="M250,235 Q245,240 245,245 Q245,250 250,250 Q255,250 255,245 Q255,240 250,235" fill="#4a3c28"/>
    <circle cx="240" cy="240" r="2" fill="#4a3c28"/>
    <circle cx="260" cy="240" r="2" fill="#4a3c28"/>
    <path d="M235,250 Q250,255 265,250" fill="none" stroke="#8b6f47" stroke-width="1.5"/>
    <text x="250" y="295" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3c28">Пётр I</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g id="decorations">
    <!-- Анкеры -->
    <path d="M50,70 L50,330" stroke="#8b6f47" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M450,70 L450,330" stroke="#8b6f47" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Корона -->
    <g transform="translate(250, 100)">
      <path d="M-10,0 L-5,-5 L0,0 L5,-5 L10,0 L10,5 L-10,5 Z" fill="#d4b5a0" stroke="#8b6f47" stroke-width="1"/>
      <circle cx="-5" cy="-2" r="1" fill="#8b6f47"/>
      <circle cx="0" cy="-5" r="1" fill="#8b6f47"/>
      <circle cx="5" cy="-2" r="1" fill="#8b6f47"/>
    </g>
  </g>
  
  <!-- Подпись -->
  <text x="250" y="325" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#8b6f47">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Даты ключевых событий -->
  <g id="events">
    <text x="70" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666">1696 - Азов</text>
    <text x="70" y="265" font-family="Arial, sans-serif" font-size="9" fill="#666">1700-1721 - Северная война</text>
    <text x="70" y="280" font-family="Arial, sans-serif" font-size="9" fill="#666">1703 - основание Санкт-Петербурга</text>
    <text x="70" y="295" font-family="Arial, sans-serif" font-size="9" fill="#666">1712 - столица перенесена в СПб</text>
    
    <text x="350" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666">1698 - Великое посольство</text>
    <text x="350" y="265" font-family="Arial, sans-serif" font-size="9" fill="#666">1709 - Полтавская битва</text>
    <text x="350" y="280" font-family="Arial, sans-serif" font-size="9" fill="#666">1721 - провозглашение империи</text>
    <text x="350" y="295" font-family="Arial, sans-serif" font-size="9" fill="#666">1724 - Учреждение Академии наук</text>
  </g>
</svg>