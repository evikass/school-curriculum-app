<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Текстура бумаги -->
    <pattern id="paper" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#f5f0e6"/>
      <circle cx="25" cy="25" r="0.5" fill="#e0d5c7" opacity="0.3"/>
      <circle cx="75" cy="75" r="0.5" fill="#e0d5c7" opacity="0.3"/>
    </pattern>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Свеча -->
    <radialGradient id="candleGlow">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff9800;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Фоновый прямоугольник с текстурой -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  <rect width="500" height="350" fill="url(#paper)" opacity="0.3"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#8b4513">ИСТОРИЯ · 10 КЛАСС</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="50" x2="450" y2="50" stroke="#8b4513" stroke-width="2" opacity="0.5"/>
  
  <!-- Заголовок урока -->
  <text x="250" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4a2c1a">Урок 16: Возвышение Москвы</text>
  
  <!-- Древо Москвы -->
  <g transform="translate(100, 120)">
    <!-- Ствол -->
    <rect x="-10" y="0" width="20" height="80" fill="#8b4513" rx="2"/>
    <!-- Крона -->
    <circle cx="0" cy="-20" r="35" fill="#228b22" opacity="0.8"/>
    <circle cx="-25" cy="-10" r="25" fill="#32cd32" opacity="0.7"/>
    <circle cx="25" cy="-10" r="25" fill="#32cd32" opacity="0.7"/>
    <!-- Листья с цифрами -->
    <text x="0" y="-15" text-anchor="middle" font-size="12" fill="white" font-weight="bold">1328</text>
    <text x="-25" y="-5" text-anchor="middle" font-size="10" fill="white">Даниил</text>
    <text x="25" y="-5" text-anchor="middle" font-size="10" fill="white">Калита</text>
  </g>
  
  <!-- Карта Руси -->
  <g transform="translate(300, 150)">
    <!-- Фоновый круг -->
    <circle cx="0" cy="0" r="70" fill="#e8dcc6" opacity="0.3"/>
    <!-- Центр - Москва -->
    <circle cx="0" cy="0" r="8" fill="#dc143c" stroke="#8b0000" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-size="10" fill="#8b4513">Москва</text>
    
    <!-- Другие города -->
    <circle cx="-40" cy="-20" r="4" fill="#4682b4"/>
    <text x="-40" y="-25" text-anchor="middle" font-size="8" fill="#4682b4">Тверь</text>
    
    <circle cx="40" cy="-30" r="4" fill="#4682b4"/>
    <text x="40" y="-35" text-anchor="middle" font-size="8" fill="#4682b4">Владимир</text>
    
    <circle cx="-50" cy="30" r="4" fill="#4682b4"/>
    <text x="-50" y="40" text-anchor="middle" font-size="8" fill="#4682b4">Рязань</text>
    
    <circle cx="45" cy="20" r="4" fill="#4682b4"/>
    <text x="45" y="30" text-anchor="middle" font-size="8" fill="#4682b4">Новгород</text>
    
    <!-- Связи -->
    <line x1="0" y1="0" x2="-40" y2="-20" stroke="#666" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <line x1="0" y1="0" x2="40" y2="-30" stroke="#666" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  </g>
  
  <!-- Значимые даты -->
  <g transform="translate(50, 230)">
    <!-- Колонки дат -->
    <rect x="0" y="0" width="80" height="60" fill="#f5deb3" opacity="0.3" rx="5"/>
    <text x="40" y="20" text-anchor="middle" font-size="12" fill="#8b4513" font-weight="bold">1328</text>
    <text x="40" y="35" text-anchor="middle" font-size="9" fill="#8b4513">Даниил</text>
    <text x="40" y="48" text-anchor="middle" font-size="9" fill="#8b4513">Алекс.</text>
    
    <rect x="100" y="0" width="80" height="60" fill="#f5deb3" opacity="0.3" rx="5"/>
    <text x="140" y="20" text-anchor="middle" font-size="12" fill="#8b4513" font-weight="bold">1328-1340</text>
    <text x="140" y="35" text-anchor="middle" font-size="9" fill="#8b4513">Иван</text>
    <text x="140" y="48" text-anchor="middle" font-size="9" fill="#8b4513">Калита</text>
    
    <rect x="200" y="0" width="80" height="60" fill="#f5deb3" opacity="0.3" rx="5"/>
    <text x="240" y="20" text-anchor="middle" font-size="12" fill="#8b4513" font-weight="bold">1340-1353</text>
    <text x="240" y="35" text-anchor="middle" font-size="9" fill="#8b4513">Симеон</text>
    <text x="240" y="48" text-anchor="middle" font-size="9" fill="#8b4513">Гордый</text>
    
    <rect x="300" y="0" width="80" height="60" fill="#f5deb3" opacity="0.3" rx="5"/>
    <text x="340" y="20" text-anchor="middle" font-size="12" fill="#8b4513" font-weight="bold">1353-1359</text>
    <text x="340" y="35" text-anchor="middle" font-size="9" fill="#8b4513">Иван</text>
    <text x="340" y="48" text-anchor="middle" font-size="9" fill="#8b4513">Красный</text>
  </g>
  
  <!-- Свеча как символ знаний -->
  <g transform="translate(420, 100)" filter="url(#shadow)">
    <!-- Свеча -->
    <rect x="-5" y="0" width="10" height="40" fill="#ffd700" rx="1"/>
    <!-- Пламя -->
    <ellipse cx="0" cy="-5" rx="6" ry="10" fill="url(#candleGlow)"/>
    <ellipse cx="0" cy="-8" rx="3" ry="5" fill="#ffeb3b"/>
  </g>
  
  <!-- Орнаментальная рамка -->
  <g transform="translate(20, 20)">
    <!-- Верхний левый угол -->
    <path d="M 0,10 L 10,10 L 10,0" stroke="#8b4513" stroke-width="2" fill="none"/>
    <circle cx="5" cy="5" r="2" fill="#8b4513"/>
    
    <!-- Верхний правый угол -->
    <path d="M 480,10 L 480,0 L 470,10" stroke="#8b4513" stroke-width="2" fill="none"/>
    <circle cx="475" cy="5" r="2" fill="#8b4513"/>
    
    <!-- Нижний левый угол -->
    <path d="M 0,330 L 10,330 L 10,340" stroke="#8b4513" stroke-width="2" fill="none"/>
    <circle cx="5" cy="335" r="2" fill="#8b4513"/>
    
    <!-- Нижний правый угол -->
    <path d="M 480,330 L 480,340 L 470,330" stroke="#8b4513" stroke-width="2" fill="none"/>
    <circle cx="475" cy="335" r="2" fill="#8b4513"/>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g transform="translate(250, 300)">
    <!-- Орнаментальная линия -->
    <path d="M -100,0 Q -50,-5 0,0 T 50,0 T 100,0" stroke="#8b4513" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Три точки -->
    <circle cx="-50" cy="0" r="2" fill="#8b4513" opacity="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#8b4513" opacity="0.5"/>
    <circle cx="50" cy="0" r="2" fill="#8b4513" opacity="0.5"/>
  </g>
  
  <!-- Малые элементы для увеличения количества -->
  <g transform="translate(60, 110)">
    <circle cx="0" cy="0" r="2" fill="#8b4513" opacity="0.3"/>
    <circle cx="10" cy="5" r="1.5" fill="#8b4513" opacity="0.3"/>
    <circle cx="20" cy="2" r="1" fill="#8b4513" opacity="0.3"/>
  </g>
  
  <g transform="translate(380, 200)">
    <circle cx="0" cy="0" r="2" fill="#8b4513" opacity="0.3"/>
    <circle cx="-10" cy="5" r="1.5" fill="#8b4513" opacity="0.3"/>
    <circle cx="-20" cy="2" r="1" fill="#8b4513" opacity="0.3"/>
  </g>
  
  <!-- Виньетки -->
  <g transform="translate(30, 180)">
    <path d="M 0,0 Q 5,-5 10,0" stroke="#8b4513" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
  
  <g transform="translate(460, 180)">
    <path d="M 10,0 Q 5,-5 0,0" stroke="#8b4513" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Водяной знак -->
  <text x="250" y="340" text-anchor="middle" font-size="10" fill="#8b4513" opacity="0.2" font-style="italic">Возвышение Москвы</text>
</svg>