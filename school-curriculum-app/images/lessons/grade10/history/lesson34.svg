<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="450" cy="80" r="4" fill="#e94560" opacity="0.6"/>
  <circle cx="420" cy="320" r="3" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="80" cy="300" r="4" fill="#e94560" opacity="0.6"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="url(#titleGrad)" filter="url(#textShadow)">
    ИСТОРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="16" 
        text-anchor="middle" fill="#f5f5f5" opacity="0.9">
    Урок 34: Николай I и консервативная модернизация
  </text>
  
  <!-- Портрет Николая I -->
  <g transform="translate(60, 100)">
    <!-- Овал для портрета -->
    <ellipse cx="40" cy="60" rx="35" ry="50" fill="#2c3e50" stroke="#e94560" stroke-width="2"/>
    
    <!-- Лицо -->
    <ellipse cx="40" cy="50" rx="25" ry="30" fill="#fdbcb4"/>
    
    <!-- Волосы -->
    <path d="M15 35 Q40 20, 65 35 Q60 30, 40 28 Q20 30, 15 35" fill="#3e2723"/>
    <path d="M18 40 Q40 35, 62 40 Q58 38, 40 37 Q22 38, 18 40" fill="#3e2723"/>
    
    <!-- Глаза -->
    <ellipse cx="30" cy="45" rx="3" ry="2" fill="#1a1a1a"/>
    <ellipse cx="50" cy="45" rx="3" ry="2" fill="#1a1a1a"/>
    
    <!-- Брови -->
    <path d="M25 40 Q30 38, 35 40" stroke="#3e2723" stroke-width="1.5" fill="none"/>
    <path d="M45 40 Q50 38, 55 40" stroke="#3e2723" stroke-width="1.5" fill="none"/>
    
    <!-- Нос -->
    <path d="M40 48 L38 55 L42 55 Z" fill="#e8a298"/>
    
    <!-- Усы -->
    <path d="M35 58 Q40 60, 45 58" stroke="#3e2723" stroke-width="1.5" fill="none"/>
    
    <!-- Рот -->
    <path d="M35 65 Q40 67, 45 65" stroke="#d46557" stroke-width="1" fill="none"/>
    
    <!-- Uniform collar -->
    <path d="M15 55 L25 70 L55 70 L65 55" fill="#e94560"/>
    
    <!-- Эполеты -->
    <rect x="25" y="45" width="30" height="8" fill="#ffd700" rx="2"/>
    <rect x="27" y="47" width="26" height="4" fill="#ff6b6b"/>
  </g>
  
  <!-- Надпись "Николай I" -->
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="14" 
        text-anchor="middle" fill="#f5f5f5" font-weight="bold">
    Николай I
  </text>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="11" 
        text-anchor="middle" fill="#b8b8b8">
    1825-1855
  </text>
  
  <!-- Центральный разделитель -->
  <line x1="180" y1="90" x2="180" y2="280" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  
  <!-- Основные концепции -->
  <g transform="translate(200, 110)">
    <!-- Контурная рамка -->
    <rect x="-10" y="-10" width="280" height="170" fill="none" stroke="#ff6b6b" 
          stroke-width="1" rx="5" opacity="0.5"/>
    
    <!-- Заголовок раздела -->
    <text x="130" y="10" font-family="Arial, sans-serif" font-size="16" 
          text-anchor="middle" fill="#e94560" font-weight="bold">
      Консервативная модернизация
    </text>
    
    <!-- Пункт 1 -->
    <circle cx="10" cy="35" r="3" fill="#ff6b6b"/>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">
      "Православие, Самодержавие, Народность"
    </text>
    
    <!-- Пункт 2 -->
    <circle cx="10" cy="60" r="3" fill="#ff6b6b"/>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">
      Укрепление центральной власти
    </text>
    
    <!-- Пункт 3 -->
    <circle cx="10" cy="85" r="3" fill="#ff6b6b"/>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">
      Развитие промышленности и транспорта
    </text>
    
    <!-- Пункт 4 -->
    <circle cx="10" cy="110" r="3" fill="#ff6b6b"/>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">
      Ужесточение цензуры и надзора
    </text>
    
    <!-- Пункт 5 -->
    <circle cx="10" cy="135" r="3" fill="#ff6b6b"/>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">
      Кодификация законов (1832-1833)
    </text>
  </g>
  
  <!-- Декоративные элементы слева -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="120" height="80" fill="none" stroke="#e94560" 
          stroke-width="1" rx="5" opacity="0.3"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="#b8b8b8">
      Основные реформы
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Финансовая
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Военная
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Административная
    </text>
  </g>
  
  <!-- Декоративные элементы справа -->
  <g transform="translate(350, 230)">
    <rect x="0" y="0" width="120" height="80" fill="none" stroke="#ff6b6b" 
          stroke-width="1" rx="5" opacity="0.3"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" 
          text-anchor="middle" fill="#b8b8b8">
      Международные отношения
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Крымская война
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Восточный вопрос
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#d4d4d4">
      • Священный союз
    </text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M200 300 L220 300 L210 310 Z" fill="#e94560" opacity="0.7"/>
  <path d="M280 300 L300 300 L290 310 Z" fill="#ff6b6b" opacity="0.7"/>
  
  <!-- Нижняя декоративная линия -->
  <line x1="50" y1="330" x2="450" y2="330" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  
  <!-- Малые декоративные кружки -->
  <circle cx="200" cy="250" r="2" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="300" cy="250" r="2" fill="#e94560" opacity="0.5"/>
  <circle cx="250" cy="320" r="3" fill="#ffd700" opacity="0.6"/>
  
  <!-- Логотип школы -->
  <g transform="translate(440, 30)">
    <rect x="0" y="0" width="40" height="30" fill="none" stroke="#e94560" 
          stroke-width="1" rx="3" opacity="0.5"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" 
          text-anchor="middle" fill="#b8b8b8">
      ИМЦ
    </text>
  </g>
</svg>