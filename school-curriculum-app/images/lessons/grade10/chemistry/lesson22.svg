<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для кнопок -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#475569">Урок 22: Нитросоединения</text>
  
  <!-- Молекула бензола с нитрогруппой -->
  <g transform="translate(100, 120)">
    <!-- Бензольное кольцо -->
    <polygon points="50,0 86.6,25 86.6,75 50,100 13.4,75 13.4,25" 
             fill="none" stroke="#374151" stroke-width="2"/>
    
    <!-- Двойные связи -->
    <line x1="50" y1="10" x2="80" y2="28" stroke="#374151" stroke-width="2"/>
    <line x1="80" y1="72" x2="50" y2="90" stroke="#374151" stroke-width="2"/>
    <line x1="20" y1="72" x2="20" y2="28" stroke="#374151" stroke-width="2"/>
    
    <!-- Нитрогруппа -->
    <line x1="50" y1="0" x2="50" y2="-30" stroke="#374151" stroke-width="2"/>
    <text x="50" y="-35" font-family="Arial" font-size="16" text-anchor="middle" fill="#dc2626">NO₂</text>
    
    <!-- Метка -->
    <text x="50" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#6b7280">Нитробензол</text>
  </g>
  
  <!-- Вторая молекула -->
  <g transform="translate(250, 120)">
    <!-- Бензольное кольцо -->
    <polygon points="50,0 86.6,25 86.6,75 50,100 13.4,75 13.4,25" 
             fill="none" stroke="#374151" stroke-width="2"/>
    
    <!-- Двойные связи -->
    <line x1="50" y1="10" x2="80" y2="28" stroke="#374151" stroke-width="2"/>
    <line x1="80" y1="72" x2="50" y2="90" stroke="#374151" stroke-width="2"/>
    <line x1="20" y1="72" x2="20" y2="28" stroke="#374151" stroke-width="2"/>
    
    <!-- Две нитрогруппы -->
    <line x1="13.4" y1="50" x2="-20" y2="50" stroke="#374151" stroke-width="2"/>
    <text x="-35" y="55" font-family="Arial" font-size="16" text-anchor="middle" fill="#dc2626">NO₂</text>
    
    <line x1="86.6" y1="50" x2="120" y2="50" stroke="#374151" stroke-width="2"/>
    <text x="135" y="55" font-family="Arial" font-size="16" text-anchor="middle" fill="#dc2626">NO₂</text>
    
    <!-- Метка -->
    <text x="50" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#6b7280">1,3-Динитробензол</text>
  </g>
  
  <!-- Свойства нитросоединений -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="400" height="70" rx="8" fill="white" filter="url(#shadow)"/>
    
    <text x="20" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Свойства:</text>
    
    <circle cx="30" cy="45" r="3" fill="#3b82f6"/>
    <text x="40" y="50" font-family="Arial" font-size="14" fill="#475569">Жёлтые кристаллы</text>
    
    <circle cx="180" cy="45" r="3" fill="#3b82f6"/>
    <text x="190" y="50" font-family="Arial" font-size="14" fill="#475569">Тяжёлые жидкости</text>
  </g>
  
  <!-- Кнопка "Узнать больше" -->
  <g transform="translate(200, 340)">
    <rect x="0" y="0" width="100" height="8" rx="4" fill="url(#btnGrad)" filter="url(#shadow)"/>
    <text x="50" y="6" font-family="Arial" font-size="10" text-anchor="middle" fill="white" font-weight="bold">Узнать больше</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="80" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="470" cy="90" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="450" cy="250" r="3" fill="#8b5cf6" opacity="0.6"/>
  
  <!-- Стрелка указания -->
  <path d="M 170 100 L 170 80 L 165 85 M 170 80 L 175 85" 
        stroke="#6b7280" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Химическая реакция (простая) -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#6b7280">C₆H₅NO₂ + 3H₂ → C₆H₅NH₂ + 2H₂O</text>
    <text x="0" y="20" font-family="Arial" font-size="11" fill="#9ca3af">(восстановление)</text>
  </g>
  
  <!-- Иконка молекулы -->
  <g transform="translate(420, 40)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#3b82f6"/>
    <circle cx="-10" cy="-8" r="3" fill="#ef4444"/>
    <circle cx="10" cy="-8" r="3" fill="#ef4444"/>
    <circle cx="0" cy="12" r="3" fill="#10b981"/>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="230" x2="450" y2="230" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
</svg>