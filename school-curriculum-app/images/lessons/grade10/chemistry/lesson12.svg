<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для молекулы фенола -->
    <radialGradient id="molGrad">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </radialGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="30" fill="#cbd5e0" opacity="0.3"/>
  <circle cx="50" cy="300" r="25" fill="#cbd5e0" opacity="0.3"/>
  
  <!-- Молекула фенола -->
  <g transform="translate(100, 150)">
    <!-- Бензольное кольцо -->
    <polygon points="0,0 30,0 45,26 30,52 0,52 -15,26" fill="none" stroke="url(#molGrad)" stroke-width="3"/>
    
    <!-- Связи внутри кольца -->
    <line x1="0" y1="0" x2="0" y2="52" stroke="#2d3748" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="0" x2="30" y2="52" stroke="#2d3748" stroke-width="2" opacity="0.5"/>
    
    <!-- Гидроксильная группа -->
    <line x1="45" y1="26" x2="65" y2="26" stroke="#2d3748" stroke-width="3"/>
    <circle cx="70" cy="26" r="8" fill="#e53e3e"/>
    <text x="73" y="30" font-family="Arial" font-size="12" fill="white">OH</text>
    
    <!-- Атомы углерода -->
    <circle cx="0" cy="0" r="4" fill="#2d3748"/>
    <circle cx="30" cy="0" r="4" fill="#2d3748"/>
    <circle cx="45" cy="26" r="4" fill="#2d3748"/>
    <circle cx="30" cy="52" r="4" fill="#2d3748"/>
    <circle cx="0" cy="52" r="4" fill="#2d3748"/>
    <circle cx="-15" cy="26" r="4" fill="#2d3748"/>
  </g>
  
  <!-- Название урока -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748" filter="url(#textShadow)">
    Урок 12: Фенолы
  </text>
  
  <!-- Заголовок курса -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a5568">
    ХИМИЯ · 10 КЛАСС
  </text>
  
  <!-- Разделы урока -->
  <g transform="translate(280, 100)">
    <!-- Строение -->
    <rect x="0" y="0" width="180" height="35" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="90" y="23" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">
      Строение фенолов
    </text>
    
    <!-- Свойства -->
    <rect x="0" y="45" width="180" height="35" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="90" y="68" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">
      Химические свойства
    </text>
    
    <!-- Применение -->
    <rect x="0" y="90" width="180" height="35" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    <text x="90" y="113" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">
      Применение в промышленности
    </text>
  </g>
  
  <!-- Свойства фенола -->
  <g transform="translate(20, 220)">
    <!-- Свойства -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748">
      Основные свойства:
    </text>
    
    <circle cx="10" cy="20" r="2" fill="#4a5568"/>
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      Слабая кислотность (pKa ≈ 10)
    </text>
    
    <circle cx="10" cy="40" r="2" fill="#4a5568"/>
    <text x="20" y="44" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      Образует феноляты с щелочами
    </text>
    
    <circle cx="10" cy="60" r="2" fill="#4a5568"/>
    <text x="20" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      Реакция электрофильного замещения
    </text>
    
    <circle cx="10" cy="80" r="2" fill="#4a5568"/>
    <text x="20" y="84" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
      Реакция с бромной водой
    </text>
  </g>
  
  <!-- Декоративные молекулы -->
  <g transform="translate(350, 240)" opacity="0.6">
    <polygon points="0,0 20,0 30,17 20,34 0,34 -10,17" fill="none" stroke="#a0aec0" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#a0aec0"/>
    <circle cx="20" cy="0" r="3" fill="#a0aec0"/>
    <circle cx="30" cy="17" r="3" fill="#a0aec0"/>
    <circle cx="20" cy="34" r="3" fill="#a0aec0"/>
    <circle cx="0" cy="34" r="3" fill="#a0aec0"/>
    <circle cx="-10" cy="17" r="3" fill="#a0aec0"/>
  </g>
  
  <!-- Линия разделения -->
  <line x1="20" y1="200" x2="480" y2="200" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Формула фенола -->
  <g transform="translate(250, 280)">
    <rect x="-60" y="-15" width="120" height="30" rx="3" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">
      C₆H₅OH
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="120" r="3" fill="#cbd5e0"/>
  <circle cx="40" cy="130" r="3" fill="#cbd5e0"/>
  <circle cx="35" cy="140" r="3" fill="#cbd5e0"/>
  
  <!-- Индикатор прогресса -->
  <rect x="20" y="320" width="460" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="20" y="320" width="120" height="4" rx="2" fill="#4299e1"/>
  
  <!-- Пиктограмма -->
  <g transform="translate(420, 310)">
    <circle cx="0" cy="0" r="12" fill="#4299e1" opacity="0.3"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0">12</text>
  </g>
</svg>