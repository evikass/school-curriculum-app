<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для молекул -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Анимация пульсации -->
    <animate id="pulse" attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a202c">
    ХИМИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">
    Урок 10: Арены. Бензол и его гомологи
  </text>
  
  <!-- Бензол - основная молекула -->
  <g id="benzene" transform="translate(150, 150)" filter="url(#shadow)">
    <!-- Шестиугольник -->
    <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" 
             fill="none" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Внутренняя окружность (обозначение ароматичности) -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2d3748" stroke-width="1.5"/>
    
    <!-- Атомы углерода -->
    <circle cx="0" cy="-40" r="4" fill="#4a5568"/>
    <circle cx="34.64" cy="-20" r="4" fill="#4a5568"/>
    <circle cx="34.64" cy="20" r="4" fill="#4a5568"/>
    <circle cx="0" cy="40" r="4" fill="#4a5568"/>
    <circle cx="-34.64" cy="20" r="4" fill="#4a5568"/>
    <circle cx="-34.64" cy="-20" r="4" fill="#4a5568"/>
    
    <!-- Водородные атомы -->
    <text x="0" y="-55" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="50" y="-20" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="50" y="25" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="0" y="55" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="-50" y="25" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="-50" y="-20" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    
    <!-- Надпись -->
    <text x="0" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">Бензол C₆H₆</text>
  </g>
  
  <!-- Толуол - гомолог -->
  <g id="toluene" transform="translate(350, 150)" filter="url(#shadow)">
    <!-- Шестиугольник -->
    <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" 
             fill="none" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Внутренняя окружность -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2d3748" stroke-width="1.5"/>
    
    <!-- Атомы углерода -->
    <circle cx="0" cy="-40" r="4" fill="#4a5568"/>
    <circle cx="34.64" cy="-20" r="4" fill="#4a5568"/>
    <circle cx="34.64" cy="20" r="4" fill="#4a5568"/>
    <circle cx="0" cy="40" r="4" fill="#4a5568"/>
    <circle cx="-34.64" cy="20" r="4" fill="#4a5568"/>
    <circle cx="-34.64" cy="-20" r="4" fill="#4a5568"/>
    
    <!-- Метильная группа -->
    <line x1="-34.64" y1="-20" x2="-55" y2="-35" stroke="#2d3748" stroke-width="2"/>
    <circle cx="-55" cy="-35" r="4" fill="#4a5568"/>
    <text x="-55" y="-45" text-anchor="middle" font-size="14" fill="#2d3748">CH₃</text>
    
    <!-- Водородные атомы -->
    <text x="0" y="-55" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="50" y="-20" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="50" y="25" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="0" y="55" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    <text x="-20" y="20" text-anchor="middle" font-size="14" fill="#2d3748">H</text>
    
    <!-- Надпись -->
    <text x="0" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d3748">Толуол C₇H₈</text>
  </g>
  
  <!-- Стрелка между молекулами -->
  <g>
    <line x1="200" y1="150" x2="280" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="240" y="140" text-anchor="middle" font-size="14" fill="#4a5568">+ CH₃</text>
  </g>
  
  <!-- Определение аренов -->
  <g transform="translate(250, 250)">
    <rect x="-100" y="-20" width="200" height="80" rx="5" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a7b">АРЕНЫ</text>
    <text x="0" y="20" text-anchor="middle" font-size="12" fill="#2d3748">Ароматические углеводороды</text>
    <text x="0" y="40" text-anchor="middle" font-size="12" fill="#2d3748">с замкнутой системой π-электронов</text>
  </g>
  
  <!-- Свойства бензола -->
  <g transform="translate(100, 300)">
    <circle cx="0" cy="0" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#92400e">Свойства</text>
  </g>
  
  <!-- Примеры гомологов -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="25" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#9f1239">Гомологи</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g opacity="0.3">
    <!-- Молекулярные орбитали -->
    <ellipse cx="150" cy="150" rx="60" ry="60" fill="none" stroke="#3182ce" stroke-width="1" stroke-dasharray="5,5">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="350" cy="150" rx="60" ry="60" fill="none" stroke="#3182ce" stroke-width="1" stroke-dasharray="5,5">
      <animateTransform attributeName="transform" type="rotate" from="0 350 150" to="360 350 150" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.5">
    <circle cx="50" cy="50" r="3" fill="#cbd5e0">
      <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="50" r="3" fill="#cbd5e0">
      <animate attributeName="r" values="3;5;3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="320" r="3" fill="#cbd5e0">
      <animate attributeName="r" values="3;5;3" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="320" r="3" fill="#cbd5e0">
      <animate attributeName="r" values="3;5;3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
</svg>