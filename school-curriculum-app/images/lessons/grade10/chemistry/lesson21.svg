<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для молекул -->
    <linearGradient id="molGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">ХИМИЯ · 10 КЛАСС</text>
  
  <!-- Урок 21 -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Урок 21: Галогенопроизводные углеводородов</text>
  
  <!-- Декоративная линия -->
  <line x1="100" y1="85" x2="400" y2="85" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Молекула метилхлорида -->
  <g transform="translate(80, 120)">
    <!-- Связи -->
    <line x1="30" y1="30" x2="50" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="70" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="50" stroke="#64748b" stroke-width="2"/>
    <!-- Атомы углерода -->
    <circle cx="30" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="50" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <text x="30" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="50" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="70" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <!-- Атом хлора -->
    <circle cx="50" cy="50" r="14" fill="#10b981" filter="url(#shadow)"/>
    <text x="50" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Cl</text>
    <!-- Атомы водорода -->
    <circle cx="30" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="30" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="70" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="70" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="85" cy="30" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="85" y="33" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="50" cy="65" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="50" y="68" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
  </g>
  
  <!-- Метка -->
  <text x="115" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Хлорпропан</text>
  
  <!-- Молекула этилбромида -->
  <g transform="translate(220, 120)">
    <!-- Связи -->
    <line x1="30" y1="30" x2="50" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="70" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="50" stroke="#64748b" stroke-width="2"/>
    <!-- Атомы углерода -->
    <circle cx="30" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="50" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <text x="30" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="50" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="70" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <!-- Атом брома -->
    <circle cx="50" cy="50" r="16" fill="#a855f7" filter="url(#shadow)"/>
    <text x="50" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Br</text>
    <!-- Атомы водорода -->
    <circle cx="30" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="30" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="70" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="70" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="85" cy="30" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="85" y="33" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="50" cy="65" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="50" y="68" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
  </g>
  
  <!-- Метка -->
  <text x="255" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Бромпропан</text>
  
  <!-- Молекула йодметана -->
  <g transform="translate(360, 120)">
    <!-- Связи -->
    <line x1="30" y1="30" x2="50" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="70" y2="30" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="50" stroke="#64748b" stroke-width="2"/>
    <!-- Атомы углерода -->
    <circle cx="30" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="50" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <circle cx="70" cy="30" r="12" fill="#374151" filter="url(#shadow)"/>
    <text x="30" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="50" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <text x="70" y="35" text-anchor="middle" fill="white" font-size="12" font-weight="bold">C</text>
    <!-- Атом йода -->
    <circle cx="50" cy="50" r="18" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="50" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">I</text>
    <!-- Атомы водорода -->
    <circle cx="30" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="30" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="70" cy="15" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="70" y="18" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="85" cy="30" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="85" y="33" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
    <circle cx="50" cy="65" r="8" fill="#ef4444" filter="url(#shadow)"/>
    <text x="50" y="68" text-anchor="middle" fill="white" font-size="10" font-weight="bold">H</text>
  </g>
  
  <!-- Метка -->
  <text x="395" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Йодпропан</text>
  
  <!-- Стрелки между молекулами -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <line x1="170" y1="150" x2="210" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="150" x2="350" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Свойства -->
  <rect x="50" y="220" width="400" height="100" rx="10" fill="white" filter="url(#shadow)"/>
  
  <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Свойства галогенопроизводных</text>
  
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Полярные молекулы (C-X диполь)</text>
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Точка кипения выше, чем у алканов</text>
  <text x="70" y="310" font-family="Arial, нанс-serif" font-size="12" fill="#475569">• Нерастворимы в воде, растворимы в органических растворителях</text>
  
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Реагируют с Mg (реакция Гриньяра)</text>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Гидролизуются в щелочной среде</text>
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="12" fill="#475569">• Восстанавливаются металлами (Na, K)</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="40" cy="320" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="460" cy="40" r="3" fill="#3b82f6" opacity="0.5"/>
</svg>