<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Свечение для молекул -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a365d" filter="url(#textShadow)">
    ХИМИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2d3748">
    Урок 23: Алкадиены. Сопряжённые системы
  </text>
  
  <!-- Декоративная линия -->
  <line x1="100" y1="65" x2="400" y2="65" stroke="#4a5568" stroke-width="2" opacity="0.3"/>
  
  <!-- Модель бутадиена -->
  <g transform="translate(100, 120)">
    <!-- Атомы углерода -->
    <circle cx="0" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="40" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="80" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="120" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    
    <!-- Связи -->
    <line x1="12" y1="0" x2="28" y2="0" stroke="#2d3748" stroke-width="3"/>
    <line x1="52" y1="0" x2="68" y2="0" stroke="#2d3748" stroke-width="3"/>
    <line x1="92" y1="0" x2="108" y2="0" stroke="#2d3748" stroke-width="3"/>
    
    <!-- Сопряжённая система (изогнутая линия) -->
    <path d="M 20 0 Q 40 -15 60 0 T 100 0" stroke="#e53e3e" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
    
    <!-- Атомы водорода -->
    <circle cx="0" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="0" cy="25" r="8" fill="#cbd5e0"/>
    <circle cx="40" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="40" cy="25" r="8" fill="#cbd5e0"/>
    <circle cx="80" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="80" cy="25" r="8" fill="#cbd5e0"/>
    <circle cx="120" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="120" cy="25" r="8" fill="#cbd5e0"/>
    
    <!-- Связи с водородом -->
    <line x1="0" y1="-12" x2="0" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="0" y1="12" x2="0" y2="17" stroke="#718096" stroke-width="1"/>
    <line x1="40" y1="-12" x2="40" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="40" y1="12" x2="40" y2="17" stroke="#718096" stroke-width="1"/>
    <line x1="80" y1="-12" x2="80" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="80" y1="12" x2="80" y2="17" stroke="#718096" stroke-width="1"/>
    <line x1="120" y1="-12" x2="120" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="120" y1="12" x2="120" y2="17" stroke="#718096" stroke-width="1"/>
    
    <!-- Название -->
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">Бутадиен-1,3</text>
  </g>
  
  <!-- Модель изопрена -->
  <g transform="translate(280, 120)">
    <!-- Атомы углерода -->
    <circle cx="0" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="40" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="80" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    <circle cx="120" cy="0" r="12" fill="#4a5568" filter="url(#glow)"/>
    
    <!-- Связи -->
    <line x1="12" y1="0" x2="28" y2="0" stroke="#2d3748" stroke-width="3"/>
    <line x1="52" y1="0" x2="68" y2="0" stroke="#2d3748" stroke-width="3"/>
    <line x1="92" y1="0" x2="108" y2="0" stroke="#2d3748" stroke-width="3"/>
    
    <!-- Сопряжённая система -->
    <path d="M 20 0 Q 40 -15 60 0 T 100 0" stroke="#e53e3e" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
    
    <!-- Атомы метильной группы -->
    <circle cx="80" cy="-35" r="10" fill="#718096"/>
    <circle cx="95" cy="-35" r="6" fill="#cbd5e0"/>
    <circle cx="65" cy="-35" r="6" fill="#cbd5e0"/>
    <circle cx="80" cy="-50" r="6" fill="#cbd5e0"/>
    
    <!-- Связи -->
    <line x1="80" y1="-12" x2="80" y2="-25" stroke="#718096" stroke-width="1"/>
    <line x1="80" y1="-35" x2="89" y2="-35" stroke="#718096" stroke-width="1"/>
    <line x1="80" y1="-35" x2="71" y2="-35" stroke="#718096" stroke-width="1"/>
    <line x1="80" y1="-35" x2="80" y2="-44" stroke="#718096" stroke-width="1"/>
    
    <!-- Атомы водорода -->
    <circle cx="0" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="0" cy="25" r="8" fill="#cbd5e0"/>
    <circle cx="40" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="40" cy="25" r="8" fill="#cbd5e0"/>
    <circle cx="120" cy="-25" r="8" fill="#cbd5e0"/>
    <circle cx="120" cy="25" r="8" fill="#cbd5e0"/>
    
    <!-- Связи с водородом -->
    <line x1="0" y1="-12" x2="0" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="0" y1="12" x2="0" y2="17" stroke="#718096" stroke-width="1"/>
    <line x1="40" y1="-12" x2="40" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="40" y1="12" x2="40" y2="17" stroke="#718096" stroke-width="1"/>
    <line x1="120" y1="-12" x2="120" y2="-17" stroke="#718096" stroke-width="1"/>
    <line x1="120" y1="12" x2="120" y2="17" stroke="#718096" stroke-width="1"/>
    
    <!-- Название -->
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2d3748">Изопрен</text>
  </g>
  
  <!-- Свойства алкадиенов -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Свойства:</text>
    
    <!-- Электронная плотность -->
    <g transform="translate(0, 20)">
      <circle cx="0" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="10" cy="-5" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="20" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="30" cy="-5" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="40" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="50" cy="-5" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="60" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="70" cy="-5" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="80" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="90" cy="-5" r="4" fill="#e53e3e" opacity="0.8"/>
      <circle cx="100" cy="0" r="4" fill="#e53e3e" opacity="0.8"/>
      
      <path d="M 0 0 Q 10 -5 20 0 T 40 0 T 60 0 T 80 0 T 100 0" stroke="#e53e3e" stroke-width="2" fill="none" opacity="0.6"/>
      
      <text x="110" y="5" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Повышенная реакционная способность</text>
    </g>
    
    <!-- Конъюгация -->
    <g transform="translate(0, 50)">
      <rect x="0" y="-10" width="120" height="20" fill="none" stroke="#4299e1" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="60" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2b6cb0">Конъюгация π-связей</text>
    </g>
    
    <!-- Уровни энергии -->
    <g transform="translate(200, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748">Энергетические уровни:</text>
      
      <!-- Орбитали -->
      <ellipse cx="30" cy="20" rx="25" ry="8" fill="none" stroke="#805ad5" stroke-width="2"/>
      <ellipse cx="30" cy="35" rx="25" ry="8" fill="none" stroke="#805ad5" stroke-width="2"/>
      <ellipse cx="30" cy="50" rx="25" ry="8" fill="none" stroke="#805ad5" stroke-width="2"/>
      
      <!-- Электроны -->
      <circle cx="20" cy="20" r="3" fill="#4299e1"/>
      <circle cx="40" cy="20" r="3" fill="#4299e1"/>
      <circle cx="20" cy="35" r="3" fill="#4299e1"/>
      <circle cx="40" cy="35" r="3" fill="#4299e1"/>
      <circle cx="20" cy="50" r="3" fill="#4299e1"/>
      <circle cx="40" cy="50" r="3" fill="#4299e1"/>
      
      <!-- Стрелка возбуждения -->
      <path d="M 70 35 L 70 15" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <text x="80" y="30" font-family="Arial, sans-serif" font-size="10" fill="#e53e3e">hν</text>
    </g>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
    </marker>
  </defs>
  
  <!-- Практическое применение -->
  <g transform="translate(250, 250)">
    <rect x="0" y="0" width="200" height="60" fill="#edf2f7" stroke="#a0aec0" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2d3748">Практическое применение:</text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">• Синтетический каучук</text>
    <text x="10" y="48" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">• Полимеры</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="100" r="3" fill="#cbd5e0" opacity="0.5"/>
  <circle cx="470" cy="80" r="3" fill="#cbd5e0" opacity="0.5"/>
  <circle cx="450" cy="300" r="3" fill="#cbd5e0" opacity="0.5"/>
  <circle cx="50" cy="300" r="3" fill="#cbd5e0" opacity="0.5"/>
  
  <!-- Уголки -->
  <path d="M 20 20 L 30 20 L 30 10" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M 480 20 L 470 20 L 470 10" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M 20 330 L 30 330 L 30 340" stroke="#4a5568" stroke-width="2" fill="none"/>
  <path d="M 480 330 L 470 330 L 470 340" stroke="#4a5568" stroke-width="2" fill="none"/>
</svg>