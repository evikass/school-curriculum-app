<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для молекул -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#dbeafe" opacity="0.5"/>
  <circle cx="450" cy="80" r="25" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="420" cy="300" r="35" fill="#dbeafe" opacity="0.5"/>
  <circle cx="80" cy="320" r="20" fill="#bfdbfe" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">
    Урок 7: Химические свойства, получение и применение алканов
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">
    ХИМИЯ · 10 КЛАСС
  </text>
  
  <!-- Молекула метана -->
  <g transform="translate(100, 100)">
    <text x="0" y="-10" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">CH₄</text>
    <circle cx="0" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="-15" cy="0" r="6" fill="#666"/>
    <circle cx="15" cy="0" r="6" fill="#666"/>
    <circle cx="0" cy="-15" r="6" fill="#666"/>
    <circle cx="0" cy="15" r="6" fill="#666"/>
    <line x1="0" y1="0" x2="-15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Молекула этана -->
  <g transform="translate(250, 100)">
    <text x="0" y="-10" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">C₂H₆</text>
    <circle cx="-10" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="10" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="-10" cy="-15" r="6" fill="#666"/>
    <circle cx="-10" cy="15" r="6" fill="#666"/>
    <circle cx="10" cy="-15" r="6" fill="#666"/>
    <circle cx="10" cy="15" r="6" fill="#666"/>
    <circle cx="10" cy="-30" r="6" fill="#666"/>
    <circle cx="10" cy="30" r="6" fill="#666"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="0" x2="-10" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="0" x2="-10" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="-30" stroke="#333" stroke-width="2"/>
    <line x1="10" y1="0" x2="10" y2="30" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Молекула пропана -->
  <g transform="translate(400, 100)">
    <text x="0" y="-10" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">C₃H₈</text>
    <circle cx="-15" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="15" cy="0" r="8" fill="#333" filter="url(#shadow)"/>
    <circle cx="-15" cy="-15" r="6" fill="#666"/>
    <circle cx="-15" cy="15" r="6" fill="#666"/>
    <circle cx="0" cy="-15" r="6" fill="#666"/>
    <circle cx="0" cy="15" r="6" fill="#666"/>
    <circle cx="15" cy="-15" r="6" fill="#666"/>
    <circle cx="15" cy="15" r="6" fill="#666"/>
    <line x1="-15" y1="0" x2="0" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="0" x2="-15" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="0" x2="-15" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="-15" stroke="#333" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="15" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="170" x2="450" y2="170" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Химические свойства -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="130" height="120" fill="#f1f5f9" rx="5" filter="url(#shadow)"/>
    <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Химические свойства</text>
    
    <!-- Свойство 1 -->
    <circle cx="15" cy="40" r="3" fill="#10b981"/>
    <text x="25" y="45" font-family="Arial" font-size="12" fill="#475569">1. Горение</text>
    <text x="10" y="60" font-family="Arial" font-size="11" fill="#64748b">CₙH₂ₙ₊₂ + O₂ → CO₂ + H₂O</text>
    
    <!-- Свойство 2 -->
    <circle cx="15" cy="75" r="3" fill="#10b981"/>
    <text x="25" y="80" font-family="Arial" font-size="12" fill="#475569">2. Галогенирование</text>
    <text x="10" y="95" font-family="Arial" font-size="11" fill="#64748b">CₙH₂ₙ₊₂ + X₂ → CₙH₂ₙ₊₁X + HX</text>
  </g>
  
  <!-- Получение -->
  <g transform="translate(190, 190)">
    <rect x="0" y="0" width="130" height="120" fill="#f1f5f9" rx="5" filter="url(#shadow)"/>
    <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Получение</text>
    
    <!-- Способ 1 -->
    <circle cx="15" cy="40" r="3" fill="#3b82f6"/>
    <text x="25" y="45" font-family="Arial" font-size="12" fill="#475569">1. Крекинг</text>
    <text x="10" y="60" font-family="Arial" font-size="11" fill="#64748b">Разложение нефти</text>
    
    <!-- Способ 2 -->
    <circle cx="15" cy="75" r="3" fill="#3b82f6"/>
    <text x="25" y="80" font-family="Arial" font-size="12" fill="#475569">2. Фишера-Тропша</text>
    <text x="10" y="95" font-family="Arial" font-size="11" fill="#64748b">CO + H₂ → Алканы</text>
  </g>
  
  <!-- Применение -->
  <g transform="translate(330, 190)">
    <rect x="0" y="0" width="130" height="120" fill="#f1f5f9" rx="5" filter="url(#shadow)"/>
    <text x="65" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Применение</text>
    
    <!-- Использование 1 -->
    <circle cx="15" cy="40" r="3" fill="#f59e0b"/>
    <text x="25" y="45" font-family="Arial" font-size="12" fill="#475569">1. Топливо</text>
    <text x="10" y="60" font-family="Arial" font-size="11" fill="#64748b">Природный газ</text>
    
    <!-- Использование 2 -->
    <circle cx="15" cy="75" r="3" fill="#f59e0b"/>
    <text x="25" y="80" font-family="Arial" font-size="12" fill="#475569">2. Сырье</text>
    <text x="10" y="95" font-family="Arial" font-size="11" fill="#64748b">Химическая промышленность</text>
  </g>
  
  <!-- Декоративные молекулы -->
  <g transform="translate(50, 280)" opacity="0.3">
    <circle cx="0" cy="0" r="5" fill="#333"/>
    <circle cx="10" cy="0" r="5" fill="#333"/>
    <circle cx="5" cy="-8" r="5" fill="#666"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="5" y2="-8" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <g transform="translate(400, 290)" opacity="0.3">
    <circle cx="0" cy="0" r="5" fill="#333"/>
    <circle cx="10" cy="0" r="5" fill="#333"/>
    <circle cx="20" cy="0" r="5" fill="#333"/>
    <circle cx="5" cy="-8" r="5" fill="#666"/>
    <circle cx="15" cy="-8" r="5" fill="#666"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="5" y2="-8" stroke="#333" stroke-width="1.5"/>
    <line x1="15" y1="0" x2="15" y2="-8" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- Формула общего вида -->
  <g transform="translate(250, 280)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">
      Общая формула: CₙH₂ₙ₊₂
    </text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <path d="M 30 310 Q 50 300 70 310" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 430 310 Q 450 300 470 310" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.5"/>
</svg>