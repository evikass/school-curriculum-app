<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#e3f2fd" opacity="0.5"/>
  <circle cx="450" cy="100" r="25" fill="#fce4ec" opacity="0.5"/>
  <circle cx="100" cy="300" r="35" fill="#e8f5e9" opacity="0.5"/>
  <circle cx="400" cy="250" r="28" fill="#fff3e0" opacity="0.5"/>
  
  <!-- Молекула белка (основная структура) -->
  <g transform="translate(250, 180)">
    <!-- Полипептидная цепь -->
    <path d="M-80,0 Q-60,-20 -40,0 Q-20,20 0,0 Q20,-20 40,0 Q60,20 80,0" 
          stroke="#1976d2" stroke-width="3" fill="none"/>
    
    <!-- Аминокислоты -->
    <g id="amino-acid">
      <circle cx="0" cy="0" r="8" fill="#2196f3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" fill="white">AA</text>
    </g>
    <use href="#amino-acid" x="-40" y="0"/>
    <use href="#amino-acid" x="-80" y="0"/>
    <use href="#amino-acid" x="40" y="0"/>
    <use href="#amino-acid" x="80" y="0"/>
    <use href="#amino-acid" x="0" y="-20"/>
    <use href="#amino-acid" x="0" y="20"/>
  </g>
  
  <!-- Вторичная структура (α-спираль) -->
  <g transform="translate(350, 150)">
    <path d="M0,0 Q10,-15 20,0 Q30,15 40,0 Q50,-15 60,0 Q70,15 80,0" 
          stroke="#4caf50" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#4caf50"/>
    <circle cx="20" cy="0" r="4" fill="#4caf50"/>
    <circle cx="40" cy="0" r="4" fill="#4caf50"/>
    <circle cx="60" cy="0" r="4" fill="#4caf50"/>
    <circle cx="80" cy="0" r="4" fill="#4caf50"/>
    <text x="40" y="-25" text-anchor="middle" font-size="12" fill="#2e7d32">α-спираль</text>
  </g>
  
  <!-- Третичная структура -->
  <g transform="translate(100, 200)">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="none" stroke="#ff5722" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="25" ry="40" fill="none" stroke="#ff5722" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="15" ry="15" fill="none" stroke="#ff5722" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" font-size="12" fill="#d84315">Третичная структура</text>
  </g>
  
  <!-- Четвертичная структура -->
  <g transform="translate(350, 250)">
    <circle cx="-20" cy="-15" r="15" fill="#9c27b0" opacity="0.7"/>
    <circle cx="20" cy="-15" r="15" fill="#9c27b0" opacity="0.7"/>
    <circle cx="-20" cy="15" r="15" fill="#9c27b0" opacity="0.7"/>
    <circle cx="20" cy="15" r="15" fill="#9c27b0" opacity="0.7"/>
    <text x="0" y="-35" text-anchor="middle" font-size="12" fill="#6a1b9a">Четвертичная структура</text>
  </g>
  
  <!-- Свойства белков -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579b">Свойства белков</text>
    <text x="10" y="40" font-size="12" fill="#0277bd">• Амфотерность</text>
    <text x="10" y="55" font-size="12" fill="#0277bd">• Коагуляция</text>
    <text x="10" y="70" font-size="12" fill="#0277bd">• Денатурация</text>
    <text x="10" y="85" font-size="12" fill="#0277bd">• Гидролиз</text>
  </g>
  
  <!-- Биологическая роль -->
  <g transform="translate(270, 50)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
    <text x="90" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">Биологическая роль</text>
    <text x="10" y="40" font-size="12" fill="#6a1b9a">• Строительная</text>
    <text x="10" y="55" font-size="12" fill="#6a1b9a">• Транспортная</text>
    <text x="10" y="70" font-size="12" fill="#6a1b9a">• Регуляторная</text>
    <text x="10" y="85" font-size="12" fill="#6a1b9a">• Защитная</text>
  </g>
  
  <!-- Химические связи -->
  <g transform="translate(200, 300)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="2"/>
    <circle cx="15" cy="0" r="3" fill="#666"/>
    <text x="15" y="-10" text-anchor="middle" font-size="10" fill="#333">пептидная</text>
  </g>
  
  <!-- Аминокислотные остатки -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="#fffde7" stroke="#f9a825" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" fill="#f57f17">Основные аминокислоты:</text>
    <text x="60" y="35" text-anchor="middle" font-size="10" fill="#f57f17">Глицин, Аланин</text>
    <text x="60" y="48" text-anchor="middle" font-size="10" fill="#f57f17">Валин, Лейцин</text>
  </g>
  
  <!-- ДНК-спираль (декоративная) -->
  <g transform="translate(250, 30)">
    <path d="M-30,0 Q-15,-10 0,0 Q15,10 30,0 Q45,-10 60,0" 
          stroke="#00bcd4" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M-30,10 Q-15,0 0,10 Q15,20 30,10 Q45,0 60,10" 
          stroke="#00bcd4" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="20" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Урок 18: Белки</text>
  <text x="250" y="40" text-anchor="middle" font-size="14" fill="#455a64">Структура, свойства, биологическая роль</text>
  
  <!-- Номер класса -->
  <g transform="translate(30, 10)">
    <rect x="0" y="0" width="80" height="30" rx="5" fill="#ff5252"/>
    <text x="40" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="white">10 КЛАСС</text>
  </g>
  
  <!-- Сетка молекул -->
  <g transform="translate(50, 250)">
    <circle cx="0" cy="0" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="20" cy="0" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="40" cy="0" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="0" cy="20" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="20" cy="20" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="40" cy="20" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="0" cy="40" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="20" cy="40" r="5" fill="#009688" opacity="0.3"/>
    <circle cx="40" cy="40" r="5" fill="#009688" opacity="0.3"/>
  </g>
  
  <!-- Углеводы (взаимодействие) -->
  <g transform="translate(400, 320)">
    <rect x="-20" y="-10" width="40" height="20" rx="3" fill="#4caf50" opacity="0.3"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="#2e7d32">глюкоза</text>
  </g>
  
  <!-- Липиды (взаимодействие) -->
  <g transform="translate(100, 320)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="#ff9800" opacity="0.3"/>
    <text x="0" y="3" text-anchor="middle" font-size="10" fill="#e65100">жиры</text>
  </g>
  
  <!-- Нуклеиновые кислоты -->
  <g transform="translate(250, 320)">
    <path d="M-15,0 Q-7.5,-5 0,0 Q7.5,5 15,0" stroke="#9c27b0" stroke-width="2" fill="none"/>
    <text x="0" y="-10" text-anchor="middle" font-size="10" fill="#6a1b9a">ДНК</text>
  </g>
  
  <!-- Водородные связи -->
  <g transform="translate(150, 180)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#03a9f4" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="10" y="-5" text-anchor="middle" font-size="9" fill="#0277bd">H-связи</text>
  </g>
  
  <!-- Энергетическая диаграмма -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="100" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1"/>
    <line x1="10" y1="70" x2="90" y2="70" stroke="#333" stroke-width="1"/>
    <line x1="10" y1="70" x2="10" y2="10" stroke="#333" stroke-width="1"/>
    <path d="M10,60 Q30,40 50,50 Q70,30 90,45" stroke="#e91e63" stroke-width="2" fill="none"/>
    <text x="50" y="80" text-anchor="middle" font-size="10" fill="#333">энергия</text>
  </g>
  
  <!-- Штриховка для фона -->
  <defs>
    <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="500" height="350" fill="url(#diagonalHatch)" opacity="0.2"/>
</svg>