<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    
    <!-- Символы для реакции -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34495e">Урок 25: Клеточное дыхание</text>
  
  <!-- Центр - цикл Кребса -->
  <circle cx="250" cy="200" r="60" fill="#3498db" filter="url(#shadow)" opacity="0.8"/>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ЦИКЛ</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">КРЕБСА</text>
  
  <!-- Ацетил-CoA -->
  <g transform="translate(100, 150)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Ацетил-CoA</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C₂H₃O-</text>
  </g>
  
  <!-- Oxaloacetate -->
  <g transform="translate(400, 150)">
    <rect x="-35" y="-20" width="70" height="40" rx="5" fill="#9b59b6" filter="url(#shadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Oxaloacetate</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C₄H₂O₄²⁻</text>
  </g>
  
  <!-- Реакции цикла -->
  <!-- 1. Citrate -->
  <g transform="translate(250, 100)">
    <circle cx="0" cy="0" r="25" fill="#f39c12" filter="url(#shadow)"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Citrate</text>
  </g>
  
  <!-- 2. Isocitrate -->
  <g transform="translate(320, 120)">
    <circle cx="0" cy="0" r="25" fill="#27ae60" filter="url(#shadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Isocitrate</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C₆H₅O₇³⁻</text>
  </g>
  
  <!-- 3. Alpha-ketoglutarate -->
  <g transform="translate(350, 200)">
    <circle cx="0" cy="0" r="25" fill="#e67e22" filter="url(#shadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">α-KG</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C₅H₄O₅²⁻</text>
  </g>
  
  <!-- 4. Succinyl-CoA -->
  <g transform="translate(320, 280)">
    <circle cx="0" cy="0" r="25" fill="#16a085" filter="url(#shadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Succ-CoA</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">C₄H₄O₄S-CoA</text>
  </g>
  
  <!-- 5. Succinate -->
  <g transform="translate(250, 300)">
    <circle cx="0" cy="0" r="25" fill="#34495e" filter="url(#shadow)"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Succinate</text>
  </g>
  
  <!-- 6. Fumarate -->
  <g transform="translate(180, 280)">
    <circle cx="0" cy="0" r="25" fill="#c0392b" filter="url(#shadow)"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Fumarate</text>
  </g>
  
  <!-- 7. Malate -->
  <g transform="translate(150, 200)">
    <circle cx="0" cy="0" r="25" fill="#8e44ad" filter="url(#shadow)"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Malate</text>
  </g>
  
  <!-- Стрелки между соединениями -->
  <path d="M 130 150 L 190 120" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 225 100 L 295 120" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 340 140 L 340 175" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 335 225 L 340 255" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 295 280 L 275 285" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 225 300 L 205 285" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 155 280 L 155 225" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 165 175 L 190 140" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 170 L 310 195" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Выделенные реакции с выделением энергии -->
  <g transform="translate(370, 100)">
    <rect x="-40" y="-15" width="80" height="30" rx="5" fill="#f1c40f" opacity="0.3"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">NADH + H⁺</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">CO₂</text>
  </g>
  
  <g transform="translate(400, 250)">
    <rect x="-40" y="-15" width="80" height="30" rx="5" fill="#f1c40f" opacity="0.3"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">NADH + H⁺</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">CO₂</text>
  </g>
  
  <g transform="translate(250, 330)">
    <rect x="-45" y="-15" width="90" height="30" rx="5" fill="#f1c40f" opacity="0.3"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">FADH₂</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d68910">ATP</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(30, 320)">
    <rect x="-5" y="-5" width="120" height="25" rx="3" fill="white" opacity="0.8"/>
    <text x="55" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">8 этапов цикла</text>
  </g>
  
  <!-- Коферменты -->
  <g transform="translate(430, 320)">
    <rect x="-40" y="-5" width="80" height="25" rx="3" fill="white" opacity="0.8"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">3 NADH, 1 FADH₂</text>
  </g>
  
  <!-- Указатели на катализаторы -->
  <circle cx="280" cy="120" r="3" fill="#e74c3c"/>
  <circle cx="340" cy="180" r="3" fill="#e74c3c"/>
  <circle cx="340" cy="260" r="3" fill="#e74c3c"/>
  <circle cx="220" cy="260" r="3" fill="#e74c3c"/>
  <circle cx="160" cy="220" r="3" fill="#e74c3c"/>
  
  <!-- Атомы и молекулы -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="8" fill="#3498db" opacity="0.7"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">O</text>
  </g>
  
  <g transform="translate(450, 50)">
    <circle cx="0" cy="0" r="8" fill="#e74c3c" opacity="0.7"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C</text>
  </g>
  
  <!-- Энергетические показатели -->
  <g transform="translate(250, 60)">
    <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#2ecc71" opacity="0.3"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">30 ATP/цикл</text>
  </g>
  
  <!-- Дополнительные метки -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Митохондрия - матрикс</text>
  
  <!-- Дополнительные молекулы -->
  <g transform="translate(80, 200)">
    <circle cx="0" cy="0" r="15" fill="#95a5a6" opacity="0.5"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">H₂O</text>
  </g>
  
  <g transform="translate(420, 200)">
    <circle cx="0" cy="0" r="15" fill="#95a5a6" opacity="0.5"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">ADP</text>
  </g>
  
  <!-- Указатели на ферменты -->
  <g transform="translate(150, 70)">
    <text font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">citrate synthase</text>
  </g>
  
  <g transform="translate(280, 70)">
    <text font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">aconitase</text>
  </g>
  
  <g transform="translate(360, 70)">
    <text font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">isocitrate DH</text>
  </g>
  
  <!-- Коферменты CoA -->
  <g transform="translate(250, 150)">
    <path d="M -10,0 L -5,-5 L 0,0 L 5,-5 L 10,0" stroke="#e67e22" stroke-width="2" fill="none"/>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e67e22">CoA</text>
  </g>
</svg>