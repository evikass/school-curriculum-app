<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">Урок 27: Фотосинтез: световая фаза</text>
  
  <!-- Хлоропласт -->
  <g id="chloroplast">
    <ellipse cx="100" cy="200" rx="80" ry="50" fill="#228b22" opacity="0.8"/>
    <ellipse cx="100" cy="200" rx="75" ry="45" fill="#32cd32" opacity="0.6"/>
    <!-- Граны -->
    <ellipse cx="90" cy="190" rx="15" ry="25" fill="#006400" opacity="0.7"/>
    <ellipse cx="110" cy="190" rx="15" ry="25" fill="#006400" opacity="0.7"/>
    <ellipse cx="100" cy="210" rx="15" ry="25" fill="#006400" opacity="0.7"/>
  </g>
  
  <!-- Фотосистема II -->
  <g id="ps2">
    <circle cx="100" cy="200" r="20" fill="#4169e1" opacity="0.8"/>
    <text x="100" y="205" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">P680</text>
  </g>
  
  <!-- Фотосистема I -->
  <g id="ps1">
    <circle cx="180" cy="200" r="20" fill="#ff6347" opacity="0.8"/>
    <text x="180" y="205" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">P700</text>
  </g>
  
  <!-- Световые стрелки -->
  <g id="light">
    <path d="M 50 100 L 150 100 L 140 90 M 150 100 L 140 110" stroke="#ffd700" stroke-width="3" fill="none"/>
    <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="14" fill="#ffd700">Свет</text>
  </g>
  
  <!-- Электронный транспорт -->
  <g id="electron-transport">
    <!-- Стрелка от ПС2 к ПС1 -->
    <path d="M 120 200 Q 140 180 160 200" stroke="#1e90ff" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="140" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e90ff">e⁻</text>
    
    <!-- Стрелка вниз -->
    <path d="M 180 220 Q 180 250 160 270" stroke="#1e90ff" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    
    <!-- Циклический поток -->
    <path d="M 200 270 Q 250 270 250 220 Q 250 170 200 170 Q 150 170 150 220" 
          stroke="#32cd32" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowgreen)"/>
    <text x="250" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#32cd32">Цикл Циглера</text>
  </g>
  
  <!-- Строма -->
  <g id="stroma">
    <ellipse cx="300" cy="200" rx="90" ry="60" fill="#90ee90" opacity="0.3"/>
    <text x="300" y="140" text-anchor="middle" font-family="Arial" font-size="14" fill="#2e7d32">Строма</text>
  </g>
  
  <!-- NADP+ → NADPH -->
  <g id="nadp-reduction">
    <rect x="270" y="220" width="60" height="25" rx="5" fill="#ff8c00" opacity="0.8"/>
    <text x="300" y="237" text-anchor="middle" font-family="Arial" font-size="11" fill="white">NADP⁺ → NADPH</text>
    <path d="M 200 270 L 270 232" stroke="#ff8c00" stroke-width="2" marker-end="url(#arroworange)"/>
  </g>
  
  <!-- Цикл Кальвина (обозначение) -->
  <g id="calvin-cycle">
    <circle cx="300" cy="280" r="30" fill="none" stroke="#8b4513" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="300" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#8b4513">Цикл К.</text>
    <path d="M 330 280 L 380 280" stroke="#8b4513" stroke-width="2" marker-end="url(#arrowbrown)"/>
  </g>
  
  <!-- Разложение воды -->
  <g id="water-splitting">
    <text x="60" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#006400">H₂O → 2H⁺ + 1/2O₂ + 2e⁻</text>
    <circle cx="100" cy="300" r="15" fill="#87ceeb" opacity="0.6"/>
    <text x="100" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#0066cc">O₂</text>
  </g>
  
  <!-- Протоны -->
  <g id="protons">
    <circle cx="140" cy="260" r="5" fill="#ff0000"/>
    <circle cx="150" cy="265" r="5" fill="#ff0000"/>
    <circle cx="145" cy="270" r="5" fill="#ff0000"/>
    <circle cx="155" cy="260" r="5" fill="#ff0000"/>
    <text x="160" y="265" font-family="Arial" font-size="10" fill="#ff0000">H⁺</text>
  </g>
  
  <!-- АТФ-синтаза -->
  <g id="atp-synthase">
    <rect x="220" y="300" width="40" height="30" rx="5" fill="#9932cc" opacity="0.8"/>
    <text x="240" y="318" text-anchor="middle" font-family="Arial" font-size="10" fill="white">АТФ</text>
    <text x="240" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#9932cc">синтаза</text>
    <path d="M 180 270 L 220 315" stroke="#9932cc" stroke-width="2" marker-end="url(#arrowpurple)"/>
  </g>
  
  <!-- Аденозинтрифосфат -->
  <g id="atp">
    <rect x="360" y="310" width="50" height="25" rx="5" fill="#9370db" opacity="0.8"/>
    <text x="385" y="327" text-anchor="middle" font-family="Arial" font-size="11" fill="white">АТФ</text>
  </g>
  
  <!-- Цитохромы -->
  <g id="cytochromes">
    <circle cx="160" cy="240" r="8" fill="#8b008b"/>
    <text x="160" y="244" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Cyt</text>
    <circle cx="170" cy="250" r="8" fill="#8b008b"/>
    <text x="170" y="254" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Cyt</text>
  </g>
  
  <!-- Ферредоксин -->
  <g id="ferredoxin">
    <ellipse cx="200" cy="270" rx="20" ry="10" fill="#daa520" opacity="0.7"/>
    <text x="200" y="274" text-anchor="middle" font-family="Arial" font-size="9" fill="white">Fd</text>
  </g>
  
  <!-- Маркеры процессов -->
  <g id="process-labels">
    <rect x="20" y="320" width="80" height="20" rx="3" fill="#4682b4" opacity="0.7"/>
    <text x="60" y="334" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Фотолиз</text>
    
    <rect x="110" y="320" width="80" height="20" rx="3" fill="#228b22" opacity="0.7"/>
    <text x="150" y="334" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Фосфор.</text>
    
    <rect x="200" y="320" width="80" height="20" rx="3" fill="#ff6347" opacity="0.7"/>
    <text x="240" y="334" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Электрон. транс.</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="molecules">
    <!-- Кислород -->
    <circle cx="40" cy="150" r="8" fill="#87ceeb" opacity="0.6"/>
    <text x="40" y="154" text-anchor="middle" font-family="Arial" font-size="10" fill="#0066cc">O₂</text>
    
    <!-- Водород -->
    <circle cx="450" cy="100" r="5" fill="#ff69b4"/>
    <circle cx="460" cy="100" r="5" fill="#ff69b4"/>
    <circle cx="455" cy="110" r="5" fill="#ff69b4"/>
    <text x="455" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff1493">H₂O</text>
  </g>
  
  <!-- Энергетические уровни -->
  <g id="energy-levels">
    <line x1="350" y1="150" x2="350" y2="250" stroke="#ff4500" stroke-width="2" opacity="0.5"/>
    <text x="355" y="170" font-family="Arial" font-size="10" fill="#ff4500">E₁</text>
    <text x="355" y="230" font-family="Arial" font-size="10" fill="#ff4500">E₂</text>
  </g>
  
  <!-- Градиент фона для глубины -->
  <defs>
    <radialGradient id="bgGradient">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:0.3"/>
    </radialGradient>
    
    <!-- Стрелки -->
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e90ff"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#32cd32"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff8c00"/>
    </marker>
    <marker id="arrowbrown" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b4513"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9932cc"/>
    </marker>
  </defs>
  
  <!-- Фоновый градиент -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
</svg>