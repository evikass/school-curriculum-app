<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для ДНК -->
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4169e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4169e1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Двойная спираль ДНК -->
  <g transform="translate(50, 50)">
    <path d="M0,0 Q20,20 0,40 T0,80 T0,120 T0,160 T0,200" 
          stroke="url(#dnaGrad)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M30,0 Q10,20 30,40 T30,80 T30,120 T30,160 T30,200" 
          stroke="url(#dnaGrad)" stroke-width="3" fill="none" opacity="0.8"/>
    
    <!-- Сцепления ДНК -->
    <line x1="0" y1="10" x2="30" y2="10" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="30" x2="30" y2="30" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="50" x2="30" y2="50" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="70" x2="30" y2="70" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="90" x2="30" y2="90" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="110" x2="30" y2="110" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="130" x2="30" y2="130" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="150" x2="30" y2="150" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="170" x2="30" y2="170" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="190" x2="30" y2="190" stroke="#4169e1" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Хромосома с генами -->
  <g transform="translate(250, 80)">
    <!-- Центромера -->
    <circle cx="0" cy="50" r="8" fill="#ff6b6b" filter="url(#shadow)"/>
    
    <!-- Два плеча хромосомы -->
    <ellipse cx="0" cy="20" rx="15" ry="30" fill="#4a90e2" filter="url(#shadow)"/>
    <ellipse cx="0" cy="80" rx="15" ry="30" fill="#4a90e2" filter="url(#shadow)"/>
    
    <!-- Гены на первом плече -->
    <circle cx="-10" cy="10" r="5" fill="#ffd93d"/>
    <circle cx="10" cy="10" r="5" fill="#ff6b6b"/>
    <text x="0" y="15" text-anchor="middle" font-size="8" fill="#333">A</text>
    <text x="0" y="25" text-anchor="middle" font-size="8" fill="#333">B</text>
    
    <!-- Гены на втором плече -->
    <circle cx="-10" cy="90" r="5" fill="#6bcf7f"/>
    <circle cx="10" cy="90" r="5" fill="#ffd93d"/>
    <text x="0" y="85" text-anchor="middle" font-size="8" fill="#333">C</text>
    <text x="0" y="95" text-anchor="middle" font-size="8" fill="#333">D</text>
  </g>
  
  <!-- Схема скрещивания -->
  <g transform="translate(350, 150)">
    <!-- Родительские организмы -->
    <rect x="0" y="0" width="40" height="60" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2" rx="5"/>
    <rect x="0" y="70" width="40" height="60" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2" rx="5"/>
    
    <!-- Гены у родителей -->
    <circle cx="20" cy="20" r="8" fill="#ffd93d" filter="url(#shadow)"/>
    <circle cx="20" cy="40" r="8" fill="#ff6b6b" filter="url(#shadow)"/>
    <text x="20" y="24" text-anchor="middle" font-size="10" fill="#333">A</text>
    <text x="20" y="44" text-anchor="middle" font-size="10" fill="#333">B</text>
    
    <circle cx="20" cy="90" r="8" fill="#6bcf7f" filter="url(#shadow)"/>
    <circle cx="20" cy="110" r="8" fill="#ffd93d" filter="url(#shadow)"/>
    <text x="20" y="94" text-anchor="middle" font-size="10" fill="#333">C</text>
    <text x="20" y="114" text-anchor="middle" font-size="10" fill="#333">D</text>
    
    <!-- Стрелка скрещивания -->
    <path d="M40,30 L70,30 M40,100 L70,100 M65,25 L70,30 L65,35 M65,95 L70,100 L65,105" 
          stroke="#666" stroke-width="2" fill="none"/>
    
    <!-- Потомки -->
    <rect x="80" y="20" width="35" height="20" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.5" rx="3"/>
    <rect x="80" y="45" width="35" height="20" fill="#fab1a0" stroke="#e17055" stroke-width="1.5" rx="3"/>
    <rect x="80" y="70" width="35" height="20" fill="#81ecec" stroke="#00cec9" stroke-width="1.5" rx="3"/>
    <rect x="80" y="95" width="35" height="20" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.5" rx="3"/>
  </g>
  
  <!-- Подписи -->
  <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Урок 41: Сцепленное наследование генов</text>
  
  <!-- Надпись "БИОЛОГИЯ · 10 КЛАСС" -->
  <text x="250" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#34495e">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Дополнительные элементы для объема -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="120" height="40" fill="#fff" stroke="#ddd" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="60" y="25" text-anchor="middle" font-size="12" fill="#555">Рецессивные аллели</text>
  </g>
  
  <g transform="translate(240, 250)">
    <rect x="0" y="0" width="120" height="40" fill="#fff" stroke="#ddd" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="60" y="25" text-anchor="middle" font-size="12" fill="#555">Доминантные аллели</text>
  </g>
  
  <!-- Дополнительные генные маркеры -->
  <g transform="translate(50, 150)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="5" y="40" font-size="10" fill="#666">Сцепленные гены</text>
  </g>
  
  <!-- Индикатор кроссинговера -->
  <g transform="translate(150, 180)">
    <path d="M0,0 Q10,-5 20,0 Q30,5 40,0" stroke="#e74c3c" stroke-width="2" fill="none" opacity="0.7"/>
    <circle cx="20" cy="0" r="3" fill="#e74c3c"/>
    <text x="20" y="-10" text-anchor="middle" font-size="9" fill="#e74c3c">Кроссинговер</text>
  </g>
  
  <!-- Дополнительные хромосомы -->
  <g transform="translate(380, 50)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="8" ry="15" fill="#95a5a6"/>
    <ellipse cx="0" cy="30" rx="8" ry="15" fill="#95a5a6"/>
    <circle cx="0" cy="15" r="3" fill="#7f8c8d"/>
  </g>
  
  <!-- Митотическое деление -->
  <g transform="translate(420, 150)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#3498db" stroke-width="2"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#3498db" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="30" text-anchor="middle" font-size="8" fill="#3498db">Мейоз</text>
  </g>
</svg>