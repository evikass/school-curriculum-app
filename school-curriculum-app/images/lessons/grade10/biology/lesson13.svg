<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    
    <!-- Паттерн ДНК -->
    <pattern id="dnaPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q5,5 10,10 T20,10" stroke="#4a90e2" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M0,10 Q5,15 10,10 T20,10" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#4a90e2" opacity="0.1"/>
  <circle cx="450" cy="300" r="40" fill="#e74c3c" opacity="0.1"/>
  <circle cx="400" cy="80" r="25" fill="#2ecc71" opacity="0.1"/>
  
  <!-- Название -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 13: Клеточная теория
  </text>
  
  <!-- Основные клетки для иллюстрации -->
  <!-- Клетка 1: Эукариотическая -->
  <g transform="translate(80, 120)">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="-10" r="25" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="5" fill="#1976d2"/>
    <path d="M-20,-10 Q-20,-30 0,-30 T20,-10" stroke="#2e7d32" stroke-width="1" fill="none"/>
    <path d="M-20,-10 Q-20,10 0,10 T20,-10" stroke="#2e7d32" stroke-width="1" fill="none"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Эукариот</text>
  </g>
  
  <!-- Клетка 2: Прокариотическая -->
  <g transform="translate(280, 120)">
    <ellipse cx="0" cy="0" rx="45" ry="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="8" fill="#f57c00"/>
    <circle cx="15" cy="-15" r="3" fill="#ff5722" opacity="0.7"/>
    <circle cx="-15" cy="10" r="2" fill="#ff5722" opacity="0.7"/>
    <circle cx="10" cy="20" r="2.5" fill="#ff5722" opacity="0.7"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Прокариот</text>
  </g>
  
  <!-- Клетка 3: Растительная -->
  <g transform="translate(420, 120)">
    <rect x="-50" y="-70" width="100" height="140" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-45" y="-65" width="90" height="130" rx="8" fill="none" stroke="#2e7d32" stroke-width="1"/>
    <ellipse cx="0" cy="-30" rx="15" ry="20" fill="#66bb6a"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#1976d2"/>
    <rect x="-5" y="30" width="10" height="20" fill="#8bc34a"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Растительная</text>
  </g>
  
  <!-- ДНК спираль -->
  <g transform="translate(150, 250)">
    <path d="M0,0 Q10,-10 20,0 T40,0 T60,0 T80,0 T100,0" stroke="#e74c3c" stroke-width="3" fill="none"/>
    <path d="M0,0 Q10,10 20,0 T40,0 T60,0 T80,0 T100,0" stroke="#3498db" stroke-width="3" fill="none"/>
    <circle cx="20" cy="0" r="4" fill="#e74c3c"/>
    <circle cx="40" cy="0" r="4" fill="#e74c3c"/>
    <circle cx="60" cy="0" r="4" fill="#e74c3c"/>
    <circle cx="80" cy="0" r="4" fill="#e74c3c"/>
    <text x="50" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">ДНК</text>
  </g>
  
  <!-- Митохондрия -->
  <g transform="translate(300, 250)">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="#ff9800" opacity="0.8" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#e65100" stroke-width="1"/>
    <path d="M-30,0 Q-20,-5 -10,0 T10,0 T30,0" stroke="#e65100" stroke-width="1" fill="none"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Митохондрия</text>
  </g>
  
  <!-- Ядро клетки -->
  <g transform="translate(250, 200)">
    <circle cx="0" cy="0" r="25" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="8" fill="#3f51b5"/>
    <circle cx="5" cy="-5" r="3" fill="#5c6bc0"/>
    <circle cx="-8" cy="3" r="2" fill="#5c6bc0"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Ядро</text>
  </g>
  
  <!-- Рибосома -->
  <g transform="translate(100, 280)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#795548" opacity="0.8" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="none" stroke="#5d4037" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Рибосома</text>
  </g>
  
  <!-- Эндоплазматическая сеть -->
  <g transform="translate(380, 280)">
    <path d="M0,0 Q10,-5 20,0 Q30,5 40,0 Q50,-5 60,0" stroke="#9c27b0" stroke-width="2" fill="none"/>
    <circle cx="10" cy="0" r="3" fill="#9c27b0"/>
    <circle cx="30" cy="0" r="3" fill="#9c27b0"/>
    <circle cx="50" cy="0" r="3" fill="#9c27b0"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">ЭПС</text>
  </g>
  
  <!-- Хлоропласты -->
  <g transform="translate(150, 320)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#8bc34a" opacity="0.8" filter="url(#shadow)"/>
    <path d="M-15,0 Q-7.5,-3 0,0 Q7.5,3 15,0" stroke="#689f38" stroke-width="1" fill="none"/>
    <circle cx="-10" cy="0" r="2" fill="#689f38"/>
    <circle cx="0" cy="0" r="2" fill="#689f38"/>
    <circle cx="10" cy="0" r="2" fill="#689f38"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Хлоропласт</text>
  </g>
  
  <!-- Лизосома -->
  <g transform="translate(350, 320)">
    <circle cx="0" cy="0" r="15" fill="#ff5722" opacity="0.7" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#d84315" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.8"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Лизосома</text>
  </g>
  
  <!-- Гольджи аппарат -->
  <g transform="translate(250, 320)">
    <rect x="-25" y="-10" width="50" height="20" rx="5" fill="#607d8b" opacity="0.8" filter="url(#shadow)"/>
    <rect x="-25" y="-5" width="50" height="20" rx="5" fill="none" stroke="#455a64" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Гольджи</text>
  </g>
  
  <!-- Вакуоль -->
  <g transform="translate(50, 200)">
    <circle cx="0" cy="0" r="20" fill="#03a9f4" opacity="0.3" stroke="#0288d1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#0288d1" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Вакуоль</text>
  </g>
  
  <!-- Цитоскелет -->
  <g transform="translate(400, 200)">
    <path d="M0,0 L10,10 L20,0 L30,10 L40,0" stroke="#ff6f00" stroke-width="2" fill="none"/>
    <path d="M0,10 L10,0 L20,10 L30,0 L40,10" stroke="#ff6f00" stroke-width="2" fill="none"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Цитоскелет</text>
  </g>
  
  <!-- Связи между клетками -->
  <line x1="140" y1="120" x2="235" y2="200" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="280" y1="180" x2="235" y2="200" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="370" y1="120" x2="265" y2="200" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="250" cy="100" r="3" fill="#3498db" opacity="0.6"/>
  <circle cx="260" cy="105" r="2" fill="#e74c3c" opacity="0.6"/>
  <circle cx="240" cy="105" r="2" fill="#2ecc71" opacity="0.6"/>
  
  <!-- Стрелки процессов -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <path d="M50,280 Q100,260 150,280" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M350,280 Q400,260 450,280" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Указатели процессов -->
  <text x="100" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#34495e">Синтез</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#34495e">Разделение</text>
  
  <!-- Дополнительные молекулы -->
  <g transform="translate(200, 150)">
    <rect x="-5" y="-5" width="10" height="10" fill="#9c27b0" opacity="0.6" transform="rotate(45)"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#34495e">АТФ</text>
  </g>
  
  <g transform="translate(320, 180)">
    <circle cx="0" cy="0" r="6" fill="#4caf50" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#2e7d32"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#34495e">Хлорофилл</text>
  </g>
  
  <!-- Дополнительные элементы фона -->
  <rect x="0" y="0" width="500" height="350" fill="url(#dnaPattern)" opacity="0.1"/>
  
  <!-- Легенда -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="120" height="60" fill="white" opacity="0.9" rx="5" filter="url(#shadow)"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Клетки:</text>
    <text x="10" y="40" font-family="Arial" font-size="10" fill="#34495e">• Эукариотические</text>
    <text x="10" y="55" font-family="Arial" font-size="10" fill="#34495e">• Прокариотические</text>
  </g>
  
  <!-- Информационный блок -->
  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="120" height="60" fill="white" opacity="0.9" rx="5" filter="url(#shadow)"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Теория:</text>
    <text x="10" y="40" font-family="Arial" font-size="10" fill="#34495e">• Шванден-Шлейден</text>
    <text x="10" y="55" font-family="Arial" font-size="10" fill="#34495e">• Вирхов</text>
  </g>
</svg>