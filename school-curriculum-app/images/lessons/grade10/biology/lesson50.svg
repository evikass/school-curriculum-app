<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Декоративные элементы фона -->
  <circle cx="50" cy="50" r="30" fill="#e8f0fe" opacity="0.5"/>
  <circle cx="450" cy="300" r="40" fill="#e8f0fe" opacity="0.5"/>
  <circle cx="400" cy="80" r="25" fill="#fce8e6" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a73e8">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6368">Урок 50: Микроэволюция и видообразование</text>
  
  <!-- Дерево эволюции - основная иллюстрация -->
  <g id="evolution-tree" transform="translate(250, 180)">
    <!-- Ствол -->
    <line x1="0" y1="80" x2="0" y2="0" stroke="#8b4513" stroke-width="8"/>
    <line x1="-10" y1="40" x2="10" y2="20" stroke="#8b4513" stroke-width="6"/>
    
    <!-- Ветви -->
    <path d="M 0,20 Q -30,10 -40,-20" stroke="#8b4513" stroke-width="4" fill="none"/>
    <path d="M 0,20 Q 30,10 40,-20" stroke="#8b4513" stroke-width="4" fill="none"/>
    <path d="M 0,40 Q -20,30 -35,0" stroke="#8b4513" stroke-width="3" fill="none"/>
    <path d="M 0,40 Q 20,30 35,0" stroke="#8b4513" stroke-width="3" fill="none"/>
    
    <!-- Организмы на ветвях -->
    <!-- Простой организм -->
    <circle cx="0" cy="70" r="8" fill="#4285f4"/>
    <circle cx="-15" cy="55" r="6" fill="#34a853"/>
    <circle cx="15" cy="55" r="6" fill="#34a853"/>
    
    <!-- Этапы микроэволюции -->
    <g id="organism1">
      <ellipse cx="-40" cy="-20" rx="12" ry="8" fill="#4285f4"/>
      <ellipse cx="-35" cy="-25" rx="6" ry="4" fill="#34a853"/>
      <text x="-40" y="-35" text-anchor="middle" font-size="10" fill="#5f6368">Вид А</text>
    </g>
    
    <g id="organism2">
      <ellipse cx="40" cy="-20" rx="12" ry="8" fill="#ea4335"/>
      <ellipse cx="45" cy="-25" rx="6" ry="4" fill="#fbbc04"/>
      <text x="40" y="-35" text-anchor="middle" font-size="10" fill="#5f6368">Вид Б</text>
    </g>
    
    <g id="organism3">
      <ellipse cx="-35" cy="0" rx="10" ry="7" fill="#4285f4"/>
      <ellipse cx="-30" cy="-3" rx="5" ry="3" fill="#34a853"/>
      <text x="-35" y="15" text-anchor="middle" font-size="10" fill="#5f6368">Подвид А1</text>
    </g>
    
    <g id="organism4">
      <ellipse cx="35" cy="0" rx="10" ry="7" fill="#ea4335"/>
      <ellipse cx="40" cy="-3" rx="5" ry="3" fill="#fbbc04"/>
      <text x="35" y="15" text-anchor="middle" font-size="10" fill="#5f6368">Подвид Б1</text>
    </g>
  </g>
  
  <!-- Стрелки показывающие микроэволюцию -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368"/>
    </marker>
  </defs>
  
  <line x1="180" y1="180" x2="140" y2="150" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="180" x2="360" y2="150" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Факторы микроэволюции -->
  <g id="factors" transform="translate(50, 280)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">Факторы</text>
    <text x="60" y="35" text-anchor="middle" font-size="10" fill="#5f6368">естественного</text>
    <text x="60" y="45" text-anchor="middle" font-size="10" fill="#5f6368">отбора</text>
  </g>
  
  <g id="mutation" transform="translate(190, 280)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea4335">Генетическая</text>
    <text x="60" y="35" text-anchor="middle" font-size="10" fill="#5f6368">мутация</text>
    <text x="60" y="45" text-anchor="middle" font-size="10" fill="#5f6368">и рекомбинация</text>
  </g>
  
  <g id="isolation" transform="translate(330, 280)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#f1f3f4" stroke="#5f6368" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">Географическая</text>
    <text x="60" y="35" text-anchor="middle" font-size="10" fill="#5f6368">репродуктивная</text>
    <text x="60" y="45" text-anchor="middle" font-size="10" fill="#5f6368">изоляция</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Хромосома -->
  <g id="chromosome" transform="translate(420, 100)">
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="#4285f4"/>
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#4285f4"/>
    <text x="0" y="35" text-anchor="middle" font-size="10" fill="#5f6368">Хромосома</text>
  </g>
  
  <!-- ДНК спираль -->
  <g id="dna" transform="translate(60, 100)">
    <path d="M 0,0 Q 5,5 0,10 Q -5,15 0,20 Q 5,25 0,30" stroke="#34a853" stroke-width="2" fill="none"/>
    <path d="M 10,0 Q 5,5 10,10 Q 15,15 10,20 Q 5,25 10,30" stroke="#34a853" stroke-width="2" fill="none"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#34a853" stroke-width="1"/>
    <line x1="0" y1="10" x2="10" y2="10" stroke="#34a853" stroke-width="1"/>
    <line x1="0" y1="20" x2="10" y2="20" stroke="#34a853" stroke-width="1"/>
    <line x1="0" y1="30" x2="10" y2="30" stroke="#34a853" stroke-width="1"/>
    <text x="5" y="45" text-anchor="middle" font-size="10" fill="#5f6368">ДНК</text>
  </g>
  
  <!-- Пиктограммы видов -->
  <g id="species-icons">
    <circle cx="30" cy="200" r="5" fill="#4285f4"/>
    <circle cx="30" cy="215" r="5" fill="#4285f4"/>
    <circle cx="30" cy="230" r="5" fill="#4285f4"/>
    
    <rect x="445" y="200" width="10" height="10" fill="#ea4335"/>
    <rect x="445" y="215" width="10" height="10" fill="#ea4335"/>
    <rect x="445" y="230" width="10" height="10" fill="#ea4335"/>
  </g>
  
  <!-- Временная шкала -->
  <g id="timeline" transform="translate(150, 320)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#5f6368" stroke-width="2"/>
    <text x="0" y="-5" font-size="10" fill="#5f6368">Т₁</text>
    <text x="100" y="-5" font-size="10" fill="#5f6368">Т₂</text>
    <text x="200" y="-5" font-size="10" fill="#5f6368">Т₃</text>
    <circle cx="0" cy="0" r="3" fill="#1a73e8"/>
    <circle cx="100" cy="0" r="3" fill="#1a73e8"/>
    <circle cx="200" cy="0" r="3" fill="#1a73e8"/>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <g id="decorative-elements">
    <path d="M 250,90 L 255,100 L 245,100 Z" fill="#fbbc04"/>
    <path d="M 100,120 L 105,130 L 95,130 Z" fill="#ea4335"/>
    <path d="M 400,250 L 405,260 L 395,260 Z" fill="#34a853"/>
    
    <circle cx="150" cy="90" r="3" fill="#4285f4"/>
    <circle cx="350" cy="90" r="3" fill="#ea4335"/>
    <circle cx="150" cy="250" r="3" fill="#34a853"/>
    <circle cx="350" cy="250" r="3" fill="#fbbc04"/>
  </g>
</svg>