<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Фильтр для тени -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1b5e20">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#388e3c">
    Урок 59: Сукцессия и динамика экосистем
  </text>
  
  <!-- Земля с травой (стадия 1) -->
  <g id="stage1">
    <rect x="30" y="280" width="60" height="70" fill="#8d6e63" rx="5"/>
    <ellipse cx="60" cy="280" rx="35" ry="8" fill="#795548"/>
    <!-- Травинки -->
    <path d="M50,280 L52,270 M60,280 L62,272 M70,280 L72,268 M55,280 L56,265 M65,280 L67,269" 
          stroke="#66bb6a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Земля с кустами (стадия 2) -->
  <g id="stage2">
    <rect x="130" y="280" width="60" height="70" fill="#8d6e63" rx="5"/>
    <ellipse cx="160" cy="280" rx="35" ry="8" fill="#795548"/>
    <!-- Трава -->
    <path d="M140,280 L142,270 M150,280 L152,272 M160,280 L162,268 M170,280 L172,269 M155,280 L156,265" 
          stroke="#66bb6a" stroke-width="2" stroke-linecap="round"/>
    <!-- Кусты -->
    <ellipse cx="150" cy="275" rx="8" ry="15" fill="#81c784"/>
    <ellipse cx="170" cy="275" rx="8" ry="15" fill="#81c784"/>
  </g>
  
  <!-- Молодые деревья (стадия 3) -->
  <g id="stage3">
    <rect x="230" y="280" width="60" height="70" fill="#8d6e63" rx="5"/>
    <ellipse cx="260" cy="280" rx="35" ry="8" fill="#795548"/>
    <!-- Трава -->
    <path d="M240,280 L242,270 M250,280 L252,272 M260,280 L262,268 M270,280 L272,269 M255,280 L256,265" 
          stroke="#66bb6a" stroke-width="2" stroke-linecap="round"/>
    <!-- Молодые деревья -->
    <rect x="245" y="265" width="6" height="15" fill="#795548"/>
    <ellipse cx="248" cy="260" rx="12" ry="20" fill="#66bb6a"/>
    <rect x="259" y="265" width="6" height="15" fill="#795548"/>
    <ellipse cx="262" cy="260" rx="12" ry="20" fill="#66bb6a"/>
    <rect x="273" y="265" width="6" height="15" fill="#795548"/>
    <ellipse cx="276" cy="260" rx="12" ry="20" fill="#66bb6a"/>
  </g>
  
  <!-- Взрослые деревья (стадия 4) -->
  <g id="stage4">
    <rect x="330" y="280" width="60" height="70" fill="#6d4c41" rx="5"/>
    <ellipse cx="360" cy="280" rx="35" ry="8" fill="#5d4037"/>
    <!-- Взрослые деревья -->
    <rect x="340" y="240" width="12" height="40" fill="#5d4037" filter="url(#shadow)"/>
    <ellipse cx="346" cy="230" rx="20" ry="35" fill="url(#treeGrad)" filter="url(#shadow)"/>
    <rect x="358" y="245" width="10" height="35" fill="#5d4037" filter="url(#shadow)"/>
    <ellipse cx="363" cy="235" rx="18" ry="30" fill="url(#treeGrad)" filter="url(#shadow)"/>
    <rect x="372" y="240" width="12" height="40" fill="#5d4037" filter="url(#shadow)"/>
    <ellipse cx="378" cy="230" rx="20" ry="35" fill="url(#treeGrad)" filter="url(#shadow)"/>
  </g>
  
  <!-- Лес (стадия 5) -->
  <g id="stage5">
    <rect x="430" y="280" width="60" height="70" fill="#5d4037" rx="5"/>
    <ellipse cx="460" cy="280" rx="35" ry="8" fill="#4e342e"/>
    <!-- Лес -->
    <rect x="435" y="220" width="15" height="60" fill="#3e2723" filter="url(#shadow)"/>
    <ellipse cx="442" cy="210" rx="25" ry="40" fill="#2e7d32" filter="url(#shadow)"/>
    <rect x="455" y="225" width="12" height="55" fill="#3e2723" filter="url(#shadow)"/>
    <ellipse cx="461" cy="215" rx="22" ry="35" fill="#388e3c" filter="url(#shadow)"/>
    <rect x="470" y="220" width="15" height="60" fill="#3e2723" filter="url(#shadow)"/>
    <ellipse cx="477" cy="210" rx="25" ry="40" fill="#2e7d32" filter="url(#shadow)"/>
  </g>
  
  <!-- Стрелки сукцессии -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <path d="M95,315 Q115,315 125,315" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M195,315 Q215,315 225,315" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M295,315 Q315,315 325,315" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M395,315 Q415,315 425,315" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Названия стадий -->
  <text x="60" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b5e20">
    Пустырь
  </text>
  <text x="160" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b5e20">
    Кустарник
  </text>
  <text x="260" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b5e20">
    Роща
  </text>
  <text x="360" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b5e20">
    Ранний лес
  </text>
  <text x="460" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b5e20">
    Зрелый лес
  </text>
  
  <!-- Дополнительные элементы: животные -->
  <g id="animals">
    <!-- Птицы -->
    <path d="M150,150 Q155,145 160,150 Q155,148 150,150" fill="#ff9800" stroke="#f57c00" stroke-width="1"/>
    <path d="M170,140 Q175,135 180,140 Q175,138 170,140" fill="#ff9800" stroke="#f57c00" stroke-width="1"/>
    <path d="M300,120 Q305,115 310,120 Q305,118 300,120" fill="#ff9800" stroke="#f57c00" stroke-width="1"/>
    <path d="M350,110 Q355,105 360,110 Q355,108 350,110" fill="#ff9800" stroke="#f57c00" stroke-width="1"/>
    
    <!-- Насекомые -->
    <ellipse cx="100" cy="200" rx="3" ry="6" fill="#ffd600" transform="rotate(30 100 200)"/>
    <ellipse cx="120" cy="195" rx="3" ry="6" fill="#ffd600" transform="rotate(-20 120 195)"/>
    <ellipse cx="200" cy="180" rx="3" ry="6" fill="#ffd600" transform="rotate(45 200 180)"/>
    <ellipse cx="380" cy="170" rx="3" ry="6" fill="#ffd600" transform="rotate(-30 380 170)"/>
    <ellipse cx="420" cy="160" rx="3" ry="6" fill="#ffd600" transform="rotate(15 420 160)"/>
    
    <!-- Мелкие животные -->
    <ellipse cx="180" cy="300" rx="8" ry="4" fill="#795548"/>
    <ellipse cx="350" cy="290" rx="6" ry="3" fill="#8d6e63"/>
    <ellipse cx="440" cy="295" rx="7" ry="3.5" fill="#6d4c41"/>
  </g>
  
  <!-- Солнце -->
  <circle cx="450" cy="80" r="25" fill="#ffd54f" opacity="0.8"/>
  <g stroke="#ffd54f" stroke-width="2" opacity="0.6">
    <line x1="450" y1="40" x2="450" y2="50"/>
    <line x1="450" y1="110" x2="450" y2="120"/>
    <line x1="410" y1="80" x2="420" y2="80"/>
    <line x1="480" y1="80" x2="490" y2="80"/>
    <line x1="425" y1="55" x2="432" y2="62"/>
    <line x1="468" y1="98" x2="475" y2="105"/>
    <line x1="425" y1="105" x2="432" y2="98"/>
    <line x1="468" y1="62" x2="475" y2="55"/>
  </g>
  
  <!-- Облака -->
  <g opacity="0.7">
    <ellipse cx="80" cy="60" rx="25" ry="15" fill="white"/>
    <ellipse cx="100" cy="58" rx="30" ry="18" fill="white"/>
    <ellipse cx="120" cy="60" rx="25" ry="15" fill="white"/>
  </g>
  
  <g opacity="0.7">
    <ellipse cx="250" cy="40" rx="20" ry="12" fill="white"/>
    <ellipse cx="265" cy="38" rx="25" ry="15" fill="white"/>
    <ellipse cx="280" cy="40" rx="20" ry="12" fill="white"/>
  </g>
  
  <!-- Влажность/осадки -->
  <g opacity="0.6">
    <line x1="180" y1="90" x2="175" y2="110" stroke="#64b5f6" stroke-width="1"/>
    <line x1="190" y1="95" x2="185" y2="115" stroke="#64b5f6" stroke-width="1"/>
    <line x1="200" y1="90" x2="195" y2="110" stroke="#64b5f6" stroke-width="1"/>
  </g>
  
  <!-- Ветер -->
  <g opacity="0.5">
    <path d="M300,100 Q310,95 320,100" stroke="#90a4ae" stroke-width="2" fill="none"/>
    <path d="M320,105 Q330,100 340,105" stroke="#90a4ae" stroke-width="2" fill="none"/>
    <path d="M340,110 Q350,105 360,110" stroke="#90a4ae" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Надпись "Сукцессия" -->
  <text x="250" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b5e20">
    СУКЦЕССИЯ
  </text>
  
  <!-- Легенда -->
  <g id="legend">
    <rect x="20" y="90" width="120" height="80" fill="white" opacity="0.9" rx="5" stroke="#81c784" stroke-width="1"/>
    <text x="30" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
      Факторы:
    </text>
    <circle cx="35" cy="125" r="3" fill="#ffd54f"/>
    <text x="45" y="130" font-family="Arial, sans-serif" font-size="10" fill="#424242">
      Свет
    </text>
    <circle cx="35" cy="145" r="3" fill="#64b5f6"/>
    <text x="45" y="150" font-family="Arial, sans-serif" font-size="10" fill="#424242">
      Вода
    </text>
    <circle cx="35" cy="165" r="3" fill="#90a4ae"/>
    <text x="45" y="170" font-family="Arial, sans-serif" font-size="10" fill="#424242">
      Воздух
    </text>
  </g>
  
  <!-- Время -->
  <text x="480" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#616161">
    t₁ → t₂ → t₃ → t₄ → t₅
  </text>
</svg>