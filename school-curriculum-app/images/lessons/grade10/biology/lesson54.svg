<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Узор ДНК -->
    <pattern id="dnaPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#4a90e2" opacity="0.3"/>
      <circle cx="15" cy="15" r="1" fill="#4a90e2" opacity="0.3"/>
      <path d="M0,10 Q10,0 20,10" stroke="#4a90e2" stroke-width="0.5" fill="none" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <rect width="500" height="350" fill="url(#dnaPattern)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="30" width="400" height="50" rx="10" fill="#2c5aa0" filter="url(#shadow)"/>
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#2c5aa0">Урок 54: Система органического мира</text>
  
  <!-- Иерархия жизни - дерево эволюции -->
  <g transform="translate(250, 200)">
    <!-- Корень -->
    <ellipse cx="0" cy="80" rx="40" ry="20" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    <text x="0" y="85" text-anchor="middle" font-size="12" fill="white">Жизнь</text>
    
    <!-- Ствол -->
    <rect x="-5" y="60" width="10" height="20" fill="#8b4513"/>
    
    <!-- Основные ветки -->
    <path d="M0,60 Q-30,40 -40,20" stroke="#8b4513" stroke-width="4" fill="none"/>
    <path d="M0,60 Q0,40 0,20" stroke="#8b4513" stroke-width="4" fill="none"/>
    <path d="M0,60 Q30,40 40,20" stroke="#8b4513" stroke-width="4" fill="none"/>
    
    <!-- Ветви организмов -->
    <!-- Прокариоты -->
    <ellipse cx="-40" cy="20" rx="25" ry="15" fill="#90ee90" stroke="#228b22" stroke-width="2"/>
    <text x="-40" y="25" text-anchor="middle" font-size="10" fill="#228b22">Прокариоты</text>
    
    <!-- Эукариоты -->
    <ellipse cx="0" cy="20" rx="25" ry="15" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
    <text x="0" y="25" text-anchor="middle" font-size="10" fill="#4682b4">Эукариоты</text>
    
    <!-- Вирусы -->
    <ellipse cx="40" cy="20" rx="25" ry="15" fill="#dda0dd" stroke="#9370db" stroke-width="2"/>
    <text x="40" y="25" text-anchor="middle" font-size="10" fill="#9370db">Вирусы</text>
    
    <!-- Подветви эукариот -->
    <path d="M0,5 Q-20,-10 -25,-25" stroke="#4682b4" stroke-width="2" fill="none"/>
    <path d="M0,5 Q0,-10 0,-25" stroke="#4682b4" stroke-width="2" fill="none"/>
    <path d="M0,5 Q20,-10 25,-25" stroke="#4682b4" stroke-width="2" fill="none"/>
    
    <!-- Растения -->
    <ellipse cx="-25" cy="-25" rx="20" ry="12" fill="#98fb98" stroke="#32cd32" stroke-width="2"/>
    <text x="-25" y="-21" text-anchor="middle" font-size="9" fill="#32cd32">Растения</text>
    
    <!-- Животные -->
    <ellipse cx="0" cy="-25" rx="20" ry="12" fill="#ffcccb" stroke="#dc143c" stroke-width="2"/>
    <text x="0" y="-21" text-anchor="middle" font-size="9" fill="#dc143c">Животные</text>
    
    <!-- Грибы -->
    <ellipse cx="25" cy="-25" rx="20" ry="12" fill="#f0e68c" stroke="#daa520" stroke-width="2"/>
    <text x="25" y="-21" text-anchor="middle" font-size="9" fill="#daa520">Грибы</text>
  </g>
  
  <!-- Угловые элементы декора -->
  <g opacity="0.6">
    <!-- Левый верхний угол -->
    <path d="M20,20 L20,40 Q20,50 30,50 L50,50" stroke="#2c5aa0" stroke-width="3" fill="none"/>
    <circle cx="30" cy="30" r="3" fill="#2c5aa0"/>
    <circle cx="40" cy="40" r="3" fill="#2c5aa0"/>
    
    <!-- Правый верхний угол -->
    <path d="M480,20 L480,40 Q480,50 470,50 L450,50" stroke="#2c5aa0" stroke-width="3" fill="none"/>
    <circle cx="470" cy="30" r="3" fill="#2c5aa0"/>
    <circle cx="460" cy="40" r="3" fill="#2c5aa0"/>
    
    <!-- Дополнительные декоративные элементы -->
    <circle cx="60" cy="280" r="4" fill="#4a90e2" opacity="0.5"/>
    <circle cx="440" cy="280" r="4" fill="#4a90e2" opacity="0.5"/>
    <circle cx="100" cy="300" r="3" fill="#4a90e2" opacity="0.5"/>
    <circle cx="400" cy="300" r="3" fill="#4a90e2" opacity="0.5"/>
  </g>
  
  <!-- ДНК спираль в углу -->
  <g transform="translate(420, 40)" opacity="0.7">
    <path d="M0,0 Q5,10 0,20 Q-5,30 0,40 Q5,50 0,60" stroke="#4a90e2" stroke-width="2" fill="none"/>
    <path d="M10,0 Q5,10 10,20 Q15,30 10,40 Q5,50 10,60" stroke="#4a90e2" stroke-width="2" fill="none"/>
    <line x1="0" y1="10" x2="10" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="0" y1="30" x2="10" y2="30" stroke="#4a90e2" stroke-width="1"/>
    <line x1="0" y1="50" x2="10" y2="50" stroke="#4a90e2" stroke-width="1"/>
  </g>
  
  <!-- Микроскоп и колбы -->
  <g transform="translate(70, 260)">
    <!-- Микроскоп -->
    <rect x="0" y="20" width="10" height="30" rx="2" fill="#696969"/>
    <rect x="5" y="10" width="15" height="15" rx="2" fill="#696969"/>
    <circle cx="12.5" cy="5" r="8" fill="#a9a9a9"/>
    <line x1="12.5" y1="0" x2="12.5" y2="-5" stroke="#696969" stroke-width="2"/>
    
    <!-- Колба 1 -->
    <path d="M25,35 L25,25 Q25,20 30,20 L35,20 Q40,20 40,25 L40,35 Q40,40 35,42 L30,42 Q25,40 25,35" fill="#87ceeb" stroke="#4682b4" stroke-width="1.5"/>
    <rect x="28" y="18" width="14" height="4" fill="#4682b4"/>
    
    <!-- Колба 2 -->
    <path d="M50,35 L50,25 Q50,20 55,20 L60,20 Q65,20 65,25 L65,35 Q65,40 60,42 L55,42 Q50,40 50,35" fill="#90ee90" stroke="#228b22" stroke-width="1.5"/>
    <rect x="53" y="18" width="14" height="4" fill="#228b22"/>
    
    <!-- Пузырьки в колбах -->
    <circle cx="30" cy="30" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="35" cy="32" r="1" fill="white" opacity="0.8"/>
    <circle cx="55" cy="28" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="60" cy="31" r="1" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Дополнительные биологические символы -->
  <g transform="translate(380, 280)" opacity="0.6">
    <!-- Лист -->
    <path d="M0,0 Q-5,10 0,20 Q5,10 0,0" fill="#32cd32"/>
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#228b22" stroke-width="1"/>
    
    <!-- Клетка -->
    <rect x="15" y="5" width="15" height="15" rx="2" fill="none" stroke="#ff6347" stroke-width="1.5"/>
    <circle cx="22.5" cy="12.5" r="3" fill="#ff6347" opacity="0.5"/>
  </g>
  
  <!-- Учебные объекты -->
  <g transform="translate(150, 270)">
    <!-- Книга -->
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#8b4513"/>
    <rect x="0" y="5" width="30" height="2" fill="#654321"/>
    <rect x="15" y="0" width="2" height="20" fill="#654321"/>
    <text x="15" y="13" text-anchor="middle" font-size="8" fill="white">Биология</text>
  </g>
</svg>