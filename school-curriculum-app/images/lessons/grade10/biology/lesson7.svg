<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для молекул -->
    <radialGradient id="molGrad1">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="molGrad2">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#44a3aa;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 7: Липиды и их функции
  </text>
  
  <!-- Молекула жира - триглицерид -->
  <g transform="translate(80, 120)">
    <!-- Глицериновый скелет -->
    <rect x="0" y="30" width="120" height="40" rx="20" fill="#95a5a6" filter="url(#shadow)"/>
    <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Глицерин</text>
    
    <!-- Связи -->
    <line x1="120" y1="40" x2="150" y2="20" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="120" y1="50" x2="150" y2="50" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="120" y1="60" x2="150" y2="80" stroke="#7f8c8d" stroke-width="3"/>
    
    <!-- Жирные кислоты -->
    <ellipse cx="180" cy="20" rx="30" ry="20" fill="url(#molGrad1)" filter="url(#shadow)"/>
    <text x="180" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="white"> ЖК1</text>
    
    <ellipse cx="180" cy="50" rx="30" ry="20" fill="url(#molGrad1)" filter="url(#shadow)"/>
    <text x="180" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="white"> ЖК2</text>
    
    <ellipse cx="180" cy="80" rx="30" ry="20" fill="url(#molGrad1)" filter="url(#shadow)"/>
    <text x="180" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="white"> ЖК3</text>
  </g>
  
  <!-- Функции липидов -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="180" height="200" rx="10" fill="white" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">
      Функции липидов
    </text>
    
    <!-- Энергетическая функция -->
    <circle cx="20" cy="50" r="8" fill="#f39c12"/>
    <text x="35" y="55" font-family="Arial" font-size="12" fill="#34495e">Энергетическая</text>
    
    <!-- Структурная функция -->
    <circle cx="20" cy="80" r="8" fill="#3498db"/>
    <text x="35" y="85" font-family="Arial" font-size="12" fill="#34495e">Структурная</text>
    
    <!-- Теплоизоляция -->
    <circle cx="20" cy="110" r="8" fill="#e74c3c"/>
    <text x="35" y="115" font-family="Arial" font-size="12" fill="#34495e">Теплоизоляция</text>
    
    <!-- Защитная -->
    <circle cx="20" cy="140" r="8" fill="#9b59b6"/>
    <text x="35" y="145" font-family="Arial" font-size="12" fill="#34495e">Защитная</text>
    
    <!-- Регуляторная -->
    <circle cx="20" cy="170" r="8" fill="#1abc9c"/>
    <text x="35" y="175" font-family="Arial" font-size="12" fill="#34495e">Регуляторная</text>
  </g>
  
  <!-- Фосфолипид -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="120" height="60" rx="10" fill="#3498db" filter="url(#shadow)"/>
    <text x="60" y="35" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Фосфолипид</text>
    <text x="60" y="50" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Биомембраны</text>
  </g>
  
  <!-- Стероиды -->
  <g transform="translate(180, 260)">
    <ellipse cx="40" cy="30" rx="40" ry="30" fill="#9b59b6" filter="url(#shadow)"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Стероиды</text>
  </g>
  
  <!-- Воски -->
  <g transform="translate(280, 260)">
    <rect x="0" y="20" width="80" height="20" rx="10" fill="#f39c12" filter="url(#shadow)"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Воски</text>
  </g>
  
  <!-- Иконка энергии -->
  <g transform="translate(390, 260)">
    <polygon points="20,10 30,30 10,30" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="20" y="50" text-anchor="middle" font-family="Arial" font-size="10" fill="#34495e">Энергия</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Холестерин -->
  <g transform="translate(420, 120)">
    <circle cx="0" cy="0" r="25" fill="#34495e" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Холестерин</text>
  </g>
  
  <!-- Вспомогательные молекулы -->
  <circle cx="50" cy="200" r="10" fill="#95a5a6" opacity="0.6"/>
  <circle cx="70" cy="190" r="8" fill="#95a5a6" opacity="0.6"/>
  <circle cx="60" cy="210" r="12" fill="#95a5a6" opacity="0.6"/>
  
  <!-- Декоративные элементы -->
  <path d="M 150 100 Q 170 80 190 100" stroke="#bdc3c7" stroke-width="2" fill="none"/>
  <path d="M 150 200 Q 170 220 190 200" stroke="#bdc3c7" stroke-width="2" fill="none"/>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <line x1="250" y1="140" x2="290" y2="140" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Место для заметок -->
  <rect x="20" y="320" width="460" height="20" rx="5" fill="#ecf0f1" opacity="0.5"/>
  <text x="250" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">
    Липиды - органические вещества, нерастворимые в воде
  </text>
</svg>