<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">Урок 9: Функции белков. Ферменты</text>
  
  <!-- Белковая молекула 1 (гемоглобин) -->
  <g transform="translate(80, 90)">
    <circle cx="0" cy="0" r="15" fill="#e74c3c" opacity="0.8"/>
    <circle cx="25" cy="0" r="15" fill="#3498db" opacity="0.8"/>
    <circle cx="50" cy="0" r="15" fill="#e74c3c" opacity="0.8"/>
    <circle cx="12.5" cy="-20" r="15" fill="#f39c12" opacity="0.8"/>
    <circle cx="37.5" cy="-20" r="15" fill="#f39c12" opacity="0.8"/>
    <line x1="0" y1="0" x2="25" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="25" y1="0" x2="50" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="12.5" y1="-20" x2="0" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="12.5" y1="-20" x2="25" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="37.5" y1="-20" x2="25" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <line x1="37.5" y1="-20" x2="50" y2="0" stroke="#2c3e50" stroke-width="2"/>
    <text x="25" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Гемоглобин</text>
    <text x="25" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Транспортная</text>
  </g>
  
  <!-- Белковая молекула 2 (инсулин) -->
  <g transform="translate(280, 90)">
    <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#9b59b6" opacity="0.8"/>
    <rect x="-25" y="-5" width="15" height="10" fill="#8e44ad"/>
    <rect x="-5" y="-5" width="15" height="10" fill="#8e44ad"/>
    <rect x="15" y="-5" width="15" height="10" fill="#8e44ad"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Инсулин</text>
    <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Регуляторная</text>
  </g>
  
  <!-- Фермент амилаза -->
  <g transform="translate(180, 180)">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#27ae60" opacity="0.8"/>
    <ellipse cx="-15" cy="-5" rx="8" ry="8" fill="#229954"/>
    <ellipse cx="15" cy="-5" rx="8" ry="8" fill="#229954"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Амилаза</text>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Катализатор</text>
  </g>
  
  <!-- Субстрат крахмал -->
  <g transform="translate(100, 250)">
    <circle cx="0" cy="0" r="8" fill="#f1c40f" opacity="0.8"/>
    <circle cx="15" cy="0" r="8" fill="#f1c40f" opacity="0.8"/>
    <circle cx="30" cy="0" r="8" fill="#f1c40f" opacity="0.8"/>
    <circle cx="7.5" cy="10" r="8" fill="#f1c40f" opacity="0.8"/>
    <circle cx="22.5" cy="10" r="8" fill="#f1c40f" opacity="0.8"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <line x1="15" y1="0" x2="30" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <line x1="7.5" y1="10" x2="0" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <line x1="7.5" y1="10" x2="15" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <line x1="22.5" y1="10" x2="15" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <line x1="22.5" y1="10" x2="30" y2="0" stroke="#d68910" stroke-width="1.5"/>
    <text x="15" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Крахмал</text>
  </g>
  
  <!-- Продукт глюкоза -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="10" fill="#e74c3c" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">C₆H₁₂O₆</text>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Глюкоза</text>
  </g>
  
  <!-- Стрелка катализа -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Стрелки реакции -->
  <path d="M 130 240 Q 180 200 160 200" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 200 200 Q 280 200 340 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Активный центр -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Активный центр</text>
  </g>
  
  <!-- Связывающийся субстрат -->
  <g transform="translate(100, 180)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Субстрат</text>
  </g>
  
  <!-- Таблица функций белков -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="130" height="100" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="65" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Функции белков:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Транспортная</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Ферментативная</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Структурная</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Регуляторная</text>
  </g>
  
  <!-- Свойства ферментов -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="120" height="100" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Свойства ферментов:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Специфичность</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Катализ</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Не расходуются</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Белковая природа</text>
  </g>
  
  <!-- Индикатор pH -->
  <g transform="translate(420, 250)">
    <rect x="0" y="0" width="60" height="15" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="7"/>
    <circle cx="20" cy="7.5" r="5" fill="#3498db"/>
    <text x="30" y="12" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">pH 7</text>
    <text x="30" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Оптимальный pH</text>
  </g>
  
  <!-- Температурная шкала -->
  <g transform="translate(30, 280)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#95a5a6" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#95a5a6" stroke-width="2"/>
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#95a5a6" stroke-width="2"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="#95a5a6" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">0°C</text>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">37°C</text>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">100°C</text>
    <circle cx="50" cy="0" r="8" fill="#e74c3c" opacity="0.8"/>
    <text x="50" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Т</text>
  </g>
  
  <!-- Дополнительные молекулы для наглядности -->
  <g transform="translate(420, 130)">
    <circle cx="0" cy="0" r="6" fill="#1abc9c" opacity="0.8"/>
    <circle cx="10" cy="0" r="6" fill="#16a085" opacity="0.8"/>
    <circle cx="5" cy="8" r="6" fill="#1abc9c" opacity="0.8"/>
    <text x="5" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Кофактор</text>
  </g>
  
  <!-- Водородные связи -->
  <g transform="translate(250, 130)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="15" y1="0" x2="30" y2="0" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="5" fill="#3498db" opacity="0.6"/>
    <circle cx="15" cy="0" r="5" fill="#2980b9" opacity="0.6"/>
    <circle cx="30" cy="0" r="5" fill="#3498db" opacity="0.6"/>
  </g>
  
  <!-- Пептидная связь -->
  <g transform="translate(180, 100)">
    <rect x="-20" y="-3" width="40" height="6" fill="#95a5a6"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Пептидная связь</text>
  </g>
  
  <!-- Энергетический барьер -->
  <g transform="translate(250, 200)">
    <path d="M 0 20 Q 20 0 40 20" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <text x="20" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Eₐ</text>
  </g>
  
  <!-- Кофермент -->
  <g transform="translate(350, 150)">
    <rect x="-10" y="-5" width="20" height="10" fill="#f39c12" opacity="0.8" rx="5"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">NAD+</text>
  </g>
</svg>