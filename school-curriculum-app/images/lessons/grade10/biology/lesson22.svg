<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="30" fill="#e3f2fd" opacity="0.5"/>
  <circle cx="450" cy="300" r="40" fill="#f3e5f5" opacity="0.5"/>
  <circle cx="150" cy="320" r="25" fill="#e8f5e9" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <rect x="20" y="20" width="80" height="30" rx="15" fill="#42a5f5"/>
  <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Урок 22
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#37474f">
    Ферменты: свойства и механизм действия
  </text>
  
  <!-- Свойства ферментов -->
  <g transform="translate(40, 100)">
    <!-- Заголовок раздела -->
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#4caf50"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Свойства ферментов
    </text>
    
    <!-- Свойство 1 -->
    <circle cx="20" cy="50" r="5" fill="#66bb6a"/>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="14" fill="#424242">
      Высокая каталитическая активность
    </text>
    
    <!-- Свойство 2 -->
    <circle cx="20" cy="75" r="5" fill="#66bb6a"/>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="14" fill="#424242">
      Специфичность действия
    </text>
    
    <!-- Свойство 3 -->
    <circle cx="20" cy="100" r="5" fill="#66bb6a"/>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="14" fill="#424242">
      Неизменяемость в реакциях
    </text>
    
    <!-- Свойство 4 -->
    <circle cx="20" cy="125" r="5" fill="#66bb6a"/>
    <text x="35" y="130" font-family="Arial, sans-serif" font-size="14" fill="#424242">
      Белковая природа
    </text>
    
    <!-- Свойство 5 -->
    <circle cx="20" cy="150" r="5" fill="#66bb6a"/>
    <text x="35" y="155" font-family="Arial, sans-serif" font-size="14" fill="#424242">
      Действие в узких условиях
    </text>
  </g>
  
  <!-- Механизм действия -->
  <g transform="translate(260, 100)">
    <!-- Заголовок раздела -->
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#ff7043"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Механизм действия
    </text>
    
    <!-- Шаг 1 -->
    <rect x="0" y="40" width="180" height="25" rx="3" fill="#ffebee"/>
    <text x="90" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c62828">
      1. Связывание с субстратом
    </text>
    
    <!-- Шаг 2 -->
    <rect x="0" y="70" width="180" height="25" rx="3" fill="#fff3e0"/>
    <text x="90" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ef6c00">
      2. Образование фермент-субстратного комплекса
    </text>
    
    <!-- Шаг 3 -->
    <rect x="0" y="100" width="180" height="25" rx="3" fill="#f3e5f5"/>
    <text x="90" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7b1fa2">
      3. Каталитическое превращение
    </text>
    
    <!-- Шаг 4 -->
    <rect x="0" y="130" width="180" height="25" rx="3" fill="#e8f5e9"/>
    <text x="90" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">
      4. Отделение продуктов
    </text>
  </g>
  
  <!-- Визуализация активного центра -->
  <g transform="translate(150, 280)">
    <!-- Фермент -->
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#81c784" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="none" stroke="#4caf50" stroke-width="2"/>
    
    <!-- Активный центр -->
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#ffd54f" opacity="0.8"/>
    
    <!-- Субстрат -->
    <rect x="-70" y="-10" width="25" height="20" rx="5" fill="#ff8a65"/>
    <text x="-57.5" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">S</text>
    
    <!-- Стрелка -->
    <path d="M -45 0 L -25 0" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Продукты -->
    <rect x="45" y="-15" width="20" height="15" rx="3" fill="#64b5f6"/>
    <text x="55" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">P1</text>
    
    <rect x="45" y="5" width="20" height="15" rx="3" fill="#ba68c8"/>
    <text x="55" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">P2</text>
    
    <!-- Стрелка к продуктам -->
    <path d="M 20 -5 L 42.5 -7.5" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 20 5 L 42.5 12.5" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Метки -->
  <text x="150" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Фермент
  </text>
  
  <!-- Факторы влияния -->
  <g transform="translate(350, 270)">
    <rect x="0" y="0" width="120" height="60" rx="5" fill="#e1f5fe" stroke="#29b6f6" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">
      Факторы
    </text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">
      Температура
    </text>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">
      pH среды
    </text>
  </g>
  
  <!-- Стрелка определение -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(30, 200)">
    <circle cx="0" cy="0" r="3" fill="#e91e63"/>
    <circle cx="10" cy="0" r="3" fill="#9c27b0"/>
    <circle cx="20" cy="0" r="3" fill="#3f51b5"/>
    <circle cx="30" cy="0" r="3" fill="#00bcd4"/>
    <circle cx="40" cy="0" r="3" fill="#4caf50"/>
    <circle cx="50" cy="0" r="3" fill="#ff9800"/>
    <circle cx="60" cy="0" r="3" fill="#f44336"/>
  </g>
  
  <!-- Температурный график -->
  <g transform="translate(250, 180)">
    <rect x="0" y="0" width="200" height="50" fill="none" stroke="#bdbdbd" stroke-width="1"/>
    <path d="M 10 40 Q 50 20, 100 15 T 190 30" fill="none" stroke="#ff5722" stroke-width="2"/>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Оптимальная температура
    </text>
    <line x1="10" y1="10" x2="10" y2="40" stroke="#757575" stroke-width="1"/>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#757575" stroke-width="1"/>
  </g>
</svg>