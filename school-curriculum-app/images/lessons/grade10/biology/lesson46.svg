<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  <rect x="0" y="0" width="500" height="60" fill="#2e5090"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e5090">Урок 46: Изменчивость</text>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#4a6fa5">Мутационная</text>
  
  <!-- ДНК спираль -->
  <g transform="translate(80, 120)">
    <path d="M0,0 Q10,10 0,20 Q-10,30 0,40 Q10,50 0,60" stroke="#ff6b6b" stroke-width="3" fill="none"/>
    <path d="M20,0 Q10,10 20,20 Q30,30 20,40 Q10,50 20,60" stroke="#4ecdc4" stroke-width="3" fill="none"/>
    <circle cx="5" cy="10" r="2" fill="#ff6b6b"/>
    <circle cx="15" cy="10" r="2" fill="#4ecdc4"/>
    <circle cx="5" cy="30" r="2" fill="#ff6b6b"/>
    <circle cx="15" cy="30" r="2" fill="#4ecdc4"/>
    <circle cx="5" cy="50" r="2" fill="#ff6b6b"/>
    <circle cx="15" cy="50" r="2" fill="#4ecdc4"/>
  </g>
  
  <!-- Мутация в ДНК -->
  <g transform="translate(95, 130)">
    <circle cx="5" cy="10" r="4" fill="#ffd93d" stroke="#f39c12" stroke-width="2"/>
    <text x="5" y="14" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">X</text>
    <path d="M10,10 L20,10" stroke="#e74c3c" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Мутация</text>
  </g>
  
  <!-- Типы мутаций -->
  <rect x="200" y="120" width="280" height="200" fill="white" stroke="#2e5090" stroke-width="2" rx="10"/>
  
  <!-- Заголовок типов -->
  <text x="340" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e5090">ТИПЫ МУТАЦИЙ</text>
  
  <!-- Генеративные мутации -->
  <g transform="translate(220, 160)">
    <rect x="0" y="0" width="120" height="50" fill="#e8f4f8" stroke="#2e5090" stroke-width="1" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e5090">Генеративные</text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4a6fa5">передаются потомству</text>
  </g>
  
  <!-- Соматические мутации -->
  <g transform="translate(360, 160)">
    <rect x="0" y="0" width="120" height="50" fill="#ffe8e8" stroke="#2e5090" stroke-width="1" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e5090">Соматические</text>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4a6fa5">не передаются</text>
  </g>
  
  <!-- Причины мутаций -->
  <text x="220" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e5090">ПРИЧИНЫ МУТАЦИЙ:</text>
  
  <!-- Физические факторы -->
  <g transform="translate(220, 255)">
    <circle cx="10" cy="10" r="8" fill="#ff6b6b" opacity="0.7"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="11" fill="#333">Физические (радиация, УФ)</text>
  </g>
  
  <!-- Химические факторы -->
  <g transform="translate(220, 275)">
    <circle cx="10" cy="10" r="8" fill="#4ecdc4" opacity="0.7"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="11" fill="#333">Химические (мутагены)</text>
  </g>
  
  <!-- Биологические факторы -->
  <g transform="translate(220, 295)">
    <circle cx="10" cy="10" r="8" fill="#95e1d3" opacity="0.7"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="11" fill="#333">Биологические (вирусы)</text>
  </g>
  
  <!-- Последствия мутаций -->
  <g transform="translate(360, 255)">
    <rect x="0" y="0" width="100" height="25" fill="#ffd93d" stroke="#f39c12" stroke-width="1" rx="3"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Полезные</text>
  </g>
  
  <g transform="translate(360, 285)">
    <rect x="0" y="0" width="100" height="25" fill="#ff7675" stroke="#d63031" stroke-width="1" rx="3"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Вредные</text>
  </g>
  
  <g transform="translate(360, 315)">
    <rect x="0" y="0" width="100" height="25" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1" rx="3"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Нейтральные</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="180" r="3" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="40" cy="200" r="3" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="35" cy="220" r="3" fill="#ffd93d" opacity="0.5"/>
  
  <!-- Стрелки указатели -->
  <path d="M150,150 L190,150" stroke="#2e5090" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M150,200 L190,180" stroke="#2e5090" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e5090"/>
    </marker>
  </defs>
  
  <!-- Дополнительные молекулярные структуры -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="60" height="30" fill="#e8f4f8" stroke="#2e5090" stroke-width="1" rx="5"/>
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e5090">ДНК</text>
  </g>
  
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="60" height="30" fill="#ffe8e8" stroke="#2e5090" stroke-width="1" rx="5"/>
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e5090">РНК</text>
  </g>
  
  <!-- Иконки мутаций -->
  <g transform="translate(420, 120)">
    <circle cx="15" cy="15" r="12" fill="#ff6b6b" opacity="0.2"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ff6b6b">!</text>
  </g>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4a6fa5" font-style="italic">Мутации - источник генетического разнообразия</text>
</svg>