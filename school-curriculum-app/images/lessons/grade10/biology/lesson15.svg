<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 15: Транспорт веществ через мембрану
  </text>
  
  <!-- Мембрана (центральный элемент) -->
  <g id="membrane">
    <!-- Верхняя часть мембраны -->
    <ellipse cx="250" cy="150" rx="150" ry="80" fill="#e74c3c" opacity="0.3"/>
    <!-- Липидный бислой -->
    <ellipse cx="250" cy="150" rx="150" ry="80" fill="none" stroke="#c0392b" stroke-width="3"/>
    <!-- Фосфолипиды -->
    <g id="phospholipids">
      <!-- Внешние фосфолипиды -->
      <circle cx="200" cy="120" r="8" fill="#3498db"/>
      <circle cx="220" cy="110" r="8" fill="#3498db"/>
      <circle cx="240" cy="105" r="8" fill="#3498db"/>
      <circle cx="260" cy="105" r="8" fill="#3498db"/>
      <circle cx="280" cy="110" r="8" fill="#3498db"/>
      <circle cx="300" cy="120" r="8" fill="#3498db"/>
      
      <!-- Внутренние фосфолипиды -->
      <circle cx="210" cy="180" r="8" fill="#e74c3c"/>
      <circle cx="230" cy="185" r="8" fill="#e74c3c"/>
      <circle cx="250" cy="188" r="8" fill="#e74c3c"/>
      <circle cx="270" cy="185" r="8" fill="#e74c3c"/>
      <circle cx="290" cy="180" r="8" fill="#e74c3c"/>
    </g>
  </g>
  
  <!-- Молекулы -->
  <!-- Крупная молекула (недиффундирует) -->
  <g id="large-molecule">
    <circle cx="100" cy="150" r="20" fill="#9b59b6" opacity="0.8"/>
    <text x="100" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="white">АТФ</text>
    <path d="M120 150 Q160 150 200 120" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.5"/>
  </g>
  
  <!-- Маленькие молекулы (диффундируют) -->
  <g id="small-molecules">
    <circle cx="80" cy="100" r="6" fill="#2ecc71"/>
    <circle cx="90" cy="110" r="6" fill="#2ecc71"/>
    <circle cx="100" cy="95" r="6" fill="#2ecc71"/>
    <circle cx="110" cy="105" r="6" fill="#2ecc71"/>
    
    <!-- Движение через мембрану -->
    <circle cx="150" cy="150" r="6" fill="#2ecc71"/>
    <circle cx="200" cy="150" r="6" fill="#2ecc71"/>
    <circle cx="250" cy="150" r="6" fill="#2ecc71"/>
    <circle cx="300" cy="150" r="6" fill="#2ecc71"/>
    <circle cx="350" cy="150" r="6" fill="#2ecc71"/>
    <circle cx="400" cy="150" r="6" fill="#2ecc71"/>
  </g>
  
  <!-- Ионы -->
  <g id="ions">
    <circle cx="120" cy="80" r="8" fill="#f39c12"/>
    <text x="120" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Na+</text>
    
    <circle cx="380" cy="220" r="8" fill="#f39c12"/>
    <text x="380" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="white">K+</text>
  </g>
  
  <!-- Белки-переносчики -->
  <g id="carrier-proteins">
    <!-- Белок 1 -->
    <ellipse cx="180" cy="150" rx="15" ry="25" fill="#34495e" transform="rotate(20 180 150)"/>
    <text x="180" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Глюкоза</text>
    
    <!-- Белок 2 -->
    <ellipse cx="320" cy="150" rx="15" ry="25" fill="#34495e" transform="rotate(-20 320 150)"/>
    <text x="320" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Аминокисл</text>
  </g>
  
  <!-- Ионные каналы -->
  <g id="ion-channels">
    <rect x="240" y="125" width="20" height="50" rx="10" fill="#16a085" opacity="0.7"/>
    <text x="250" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="white">K+</text>
    
    <rect x="140" y="130" width="15" height="40" rx="7" fill="#8e44ad" opacity="0.7"/>
    <text x="147" y="155" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Na+</text>
  </g>
  
  <!-- Активный транспорт (стрелки) -->
  <g id="active-transport">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
      </marker>
    </defs>
    
    <!-- Стрелка активного транспорта -->
    <path d="M120 200 Q160 200 200 180" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="160" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c">Активный транспорт</text>
  </g>
  
  <!-- Легенда -->
  <g id="legend" transform="translate(20, 250)">
    <rect x="0" y="0" width="460" height="80" fill="white" opacity="0.9" rx="5"/>
    
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">Типы транспорта:</text>
    
    <!-- Пассивный транспорт -->
    <circle cx="20" cy="40" r="5" fill="#2ecc71"/>
    <text x="30" y="45" font-family="Arial" font-size="11" fill="#2c3e50">Пассивный транспорт (диффузия)</text>
    
    <!-- Активный транспорт -->
    <circle cx="20" cy="60" r="5" fill="#e74c3c"/>
    <text x="30" y="65" font-family="Arial" font-size="11" fill="#2c3e50">Активный транспорт (с АТФ)</text>
    
    <!-- Белки-переносчики -->
    <ellipse cx="250" cy="40" rx="8" ry="12" fill="#34495e"/>
    <text x="265" y="45" font-family="Arial" font-size="11" fill="#2c3e50">Белки-переносчики</text>
    
    <!-- Ионные каналы -->
    <rect x="242" y="50" width="16" height="20" rx="8" fill="#16a085"/>
    <text x="265" y="65" font-family="Arial" font-size="11" fill="#2c3e50">Ионные каналы</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g id="decorations" opacity="0.3">
    <!-- Молекулы воды -->
    <circle cx="50" cy="200" r="4" fill="#3498db"/>
    <circle cx="60" cy="210" r="4" fill="#3498db"/>
    <circle cx="70" cy="195" r="4" fill="#3498db"/>
    <circle cx="80" cy="205" r="4" fill="#3498db"/>
    
    <circle cx="420" cy="100" r="4" fill="#3498db"/>
    <circle cx="430" cy="110" r="4" fill="#3498db"/>
    <circle cx="440" cy="95" r="4" fill="#3498db"/>
    <circle cx="450" cy="105" r="4" fill="#3498db"/>
  </g>
  
  <!-- Аннотации -->
  <g id="annotations">
    <line x1="180" y1="100" x2="180" y2="125" stroke="#7f8c8d" stroke-width="1"/>
    <text x="180" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Внешняя среда</text>
    
    <line x1="250" y1="100" x2="250" y2="125" stroke="#7f8c8d" stroke-width="1"/>
    <text x="250" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Мембрана</text>
    
    <line x1="320" y1="100" x2="320" y2="125" stroke="#7f8c8d" stroke-width="1"/>
    <text x="320" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">Внутренняя среда</text>
  </g>
</svg>