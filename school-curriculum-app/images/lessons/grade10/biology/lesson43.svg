<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- ДНК спираль -->
    <path id="dna" d="M0,0 Q5,-10 10,0 Q15,10 20,0 Q25,-10 30,0" fill="none" stroke="#4a90e2" stroke-width="2"/>
    
    <!-- Хромосома -->
    <g id="chromosome">
      <ellipse cx="0" cy="-5" rx="8" ry="12" fill="#6b5b95"/>
      <rect x="-8" y="-5" width="16" height="10" fill="#6b5b95"/>
      <ellipse cx="0" cy="5" rx="8" ry="12" fill="#6b5b95"/>
    </g>
    
    <!-- Стрелка -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  
  <!-- Название урока -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#34495e">Урок 43: Наследование признаков,</text>
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#34495e">сцепленных с полом</text>
  
  <!-- Мужская хромосома XY -->
  <g transform="translate(80, 120)">
    <use href="#chromosome"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">X</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Y</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Мужчина (XY)</text>
  </g>
  
  <!-- Женская хромосома XX -->
  <g transform="translate(200, 120)">
    <use href="#chromosome"/>
    <use href="#chromosome" transform="translate(30, 0)"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">X</text>
    <text x="30" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">X</text>
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Женщина (XX)</text>
  </g>
  
  <!-- Стрелки наследования -->
  <line x1="80" y1="200" x2="80" y2="220" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="200" y2="220" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- ДНК молекулы -->
  <g transform="translate(250, 220)">
    <use href="#dna" transform="translate(-40, -20)"/>
    <use href="#dna" transform="translate(40, -20)"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Гены X-хромосомы</text>
  </g>
  
  <!-- Схема наследования -->
  <g transform="translate(350, 150)">
    <!-- Отец -->
    <rect x="0" y="0" width="80" height="30" fill="#3498db" rx="5"/>
    <text x="40" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Отец</text>
    
    <!-- Мать -->
    <rect x="0" y="50" width="80" height="30" fill="#e74c3c" rx="5"/>
    <text x="40" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Мать</text>
    
    <!-- Дети -->
    <rect x="-20" y="100" width="40" height="25" fill="#3498db" rx="3"/>
    <text x="0" y="117" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">М</text>
    
    <rect x="60" y="100" width="40" height="25" fill="#e74c3c" rx="3"/>
    <text x="80" y="117" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Ж</text>
    
    <!-- Стрелки -->
    <line x1="40" y1="30" x2="0" y2="100" stroke="#333" stroke-width="1"/>
    <line x1="40" y1="80" x2="80" y2="100" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Примеры сцепленных признаков -->
  <g transform="translate(50, 260)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Примеры:</text>
    <circle cx="10" cy="15" r="3" fill="#e74c3c"/>
    <text x="20" y="19" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Гемофилия</text>
    
    <circle cx="10" y="35" r="3" fill="#f39c12"/>
    <text x="20" y="39" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Слепота на красный</text>
    
    <circle cx="10" y="55" r="3" fill="#9b59b6"/>
    <text x="20" y="59" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Синдром Ретта</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <g opacity="0.3">
    <circle cx="450" cy="50" r="20" fill="#3498db"/>
    <circle cx="40" cy="320" r="15" fill="#e74c3c"/>
    <circle cx="460" cy="300" r="10" fill="#2ecc71"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(350, 260)">
    <rect x="0" y="0" width="120" height="60" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="60" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">Характеристики:</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Рецессивные</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• У мужчин чаще</text>
  </g>
  
  <!-- Двойная спираль ДНК -->
  <g transform="translate(250, 180)" opacity="0.5">
    <path d="M-30,0 Q-25,-10 -20,0 Q-15,10 -10,0 Q-5,-10 0,0 Q5,10 10,0 Q15,-10 20,0 Q25,10 30,0" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
    <path d="M-30,10 Q-25,0 -20,10 Q-15,20 -10,10 Q-5,0 0,10 Q5,20 10,10 Q15,0 20,10 Q25,20 30,10" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
    <line x1="-30" y1="0" x2="-30" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="-20" y1="0" x2="-20" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-10" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="10" y1="0" x2="10" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="10" stroke="#4a90e2" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="10" stroke="#4a90e2" stroke-width="1"/>
  </g>
</svg>