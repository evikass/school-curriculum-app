<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Текстурная заливка -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0e8ff" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  <rect width="500" height="350" fill="url(#dots)"/>
  
  <!-- ДНК спираль как декорация -->
  <g transform="translate(50, 150)">
    <path d="M0,0 Q10,-20 20,0 T40,0 T60,0 T80,0" stroke="#4a90e2" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M0,0 Q10,20 20,0 T40,0 T60,0 T80,0" stroke="#4a90e2" stroke-width="3" fill="none" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="0" stroke="#4a90e2" stroke-width="2"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#4a90e2" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="0" stroke="#4a90e2" stroke-width="2"/>
    <line x1="60" y1="-20" x2="60" y2="20" stroke="#4a90e2" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="0" stroke="#4a90e2" stroke-width="2"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c5282">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">Урок 52: Основные закономерности эволюции</text>
  
  <!-- Центральный элемент - дерево эволюции -->
  <g transform="translate(250, 200)">
    <!-- Ствол -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#8b4513" stroke-width="8"/>
    
    <!-- Ветви -->
    <path d="M0,20 Q-30,10 -50,-10" stroke="#8b4513" stroke-width="5" fill="none"/>
    <path d="M0,30 Q20,20 35,0" stroke="#8b4513" stroke-width="5" fill="none"/>
    <path d="M0,40 Q-20,30 -40,10" stroke="#8b4513" stroke-width="5" fill="none"/>
    <path d="M0,50 Q25,40 45,25" stroke="#8b4513" stroke-width="5" fill="none"/>
    
    <!-- Листья на концах ветвей -->
    <ellipse cx="-50" cy="-10" rx="12" ry="20" fill="#228b22" transform="rotate(-30 -50 -10)"/>
    <ellipse cx="35" cy="0" rx="12" ry="20" fill="#32cd32" transform="rotate(20 35 0)"/>
    <ellipse cx="-40" cy="10" rx="12" ry="20" fill="#228b22" transform="rotate(-20 -40 10)"/>
    <ellipse cx="45" cy="25" rx="12" ry="20" fill="#32cd32" transform="rotate(25 45 25)"/>
    
    <!-- Корни -->
    <path d="M0,80 Q-20,90 -30,110" stroke="#654321" stroke-width="4" fill="none"/>
    <path d="M0,80 Q20,90 30,110" stroke="#654321" stroke-width="4" fill="none"/>
  </g>
  
  <!-- Знаки эволюции вокруг дерева -->
  <g transform="translate(150, 150)">
    <!-- Стрелка вверх -->
    <path d="M0,0 L0,-15 L-5,-10 L0,-20 L5,-10 L0,-15" fill="#ff6b6b" opacity="0.8"/>
  </g>
  
  <g transform="translate(350, 150)">
    <!-- Стрелка вверх -->
    <path d="M0,0 L0,-15 L-5,-10 L0,-20 L5,-10 L0,-15" fill="#ff6b6b" opacity="0.8"/>
  </g>
  
  <!-- Элементы перечисления -->
  <g transform="translate(50, 280)">
    <!-- 1. Наследственность -->
    <circle cx="0" cy="0" r="8" fill="#4a90e2"/>
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">1. Наследственность</text>
    
    <!-- 2. Изменчивость -->
    <circle cx="150" cy="0" r="8" fill="#4a90e2"/>
    <text x="165" y="5" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">2. Изменчивость</text>
    
    <!-- 3. Борьба за существование -->
    <circle cx="0" cy="25" r="8" fill="#4a90e2"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">3. Борьба за существование</text>
    
    <!-- 4. Естественный отбор -->
    <circle cx="150" cy="25" r="8" fill="#4a90e2"/>
    <text x="165" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">4. Естественный отбор</text>
  </g>
  
  <!-- Дополнительные декоративные элементы -->
  <!-- Птицы -->
  <g transform="translate(100, 100)">
    <path d="M0,0 Q-5,-5 -10,0 Q-5,-3 0,0" fill="#666" opacity="0.6"/>
    <path d="M0,0 Q5,-5 10,0 Q5,-3 0,0" fill="#666" opacity="0.6"/>
  </g>
  
  <g transform="translate(400, 120)">
    <path d="M0,0 Q-5,-5 -10,0 Q-5,-3 0,0" fill="#666" opacity="0.6"/>
    <path d="M0,0 Q5,-5 10,0 Q5,-3 0,0" fill="#666" opacity="0.6"/>
  </g>
  
  <!-- Молекула ДНК -->
  <g transform="translate(380, 80) scale(0.5)">
    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ffeb3b" opacity="0.7"/>
    <ellipse cx="20" cy="5" rx="15" ry="10" fill="#ffeb3b" opacity="0.7"/>
    <ellipse cx="40" cy="0" rx="15" ry="10" fill="#ffeb3b" opacity="0.7"/>
    <ellipse cx="60" cy="5" rx="15" ry="10" fill="#ffeb3b" opacity="0.7"/>
    <line x1="0" y1="0" x2="20" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="20" y1="5" x2="40" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="0" x2="60" y2="5" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Солнце -->
  <circle cx="450" cy="50" r="20" fill="#ffd700" opacity="0.8"/>
  <g transform="translate(450, 50)">
    <line x1="0" y1="-30" x2="0" y2="-25" stroke="#ffd700" stroke-width="2"/>
    <line x1="21" y1="-21" x2="18" y2="-18" stroke="#ffd700" stroke-width="2"/>
    <line x1="30" y1="0" x2="25" y2="0" stroke="#ffd700" stroke-width="2"/>
    <line x1="21" y1="21" x2="18" y2="18" stroke="#ffd700" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="25" stroke="#ffd700" stroke-width="2"/>
    <line x1="-21" y1="21" x2="-18" y2="18" stroke="#ffd700" stroke-width="2"/>
    <line x1="-30" y1="0" x2="-25" y2="0" stroke="#ffd700" stroke-width="2"/>
    <line x1="-21" y1="-21" x2="-18" y2="-18" stroke="#ffd700" stroke-width="2"/>
  </g>
  
  <!-- Группа животных - рыбы -->
  <g transform="translate(80, 250)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#4a90e2" opacity="0.7"/>
    <path d="M15,0 L20,-5 L25,0 L20,5 Z" fill="#4a90e2" opacity="0.7"/>
    <circle cx="-8" cy="-2" r="2" fill="#333"/>
  </g>
  
  <!-- Еще одна рыба -->
  <g transform="translate(120, 260)">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#5ba0f2" opacity="0.7"/>
    <path d="M12,0 L16,-4 L20,0 L16,4 Z" fill="#5ba0f2" opacity="0.7"/>
    <circle cx="-6" cy="-1" r="1.5" fill="#333"/>
  </g>
  
  <!-- Растение -->
  <g transform="translate(420, 250)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#228b22" stroke-width="3"/>
    <ellipse cx="-5" cy="-5" rx="8" ry="12" fill="#32cd32" transform="rotate(-30 -5 -5)"/>
    <ellipse cx="5" cy="-8" rx="8" ry="12" fill="#228b22" transform="rotate(30 5 -8)"/>
    <ellipse cx="0" cy="-5" rx="8" ry="12" fill="#32cd32"/>
  </g>
  
  <!-- Камни -->
  <ellipse cx="60" cy="320" rx="15" ry="8" fill="#8b7355" opacity="0.7"/>
  <ellipse cx="380" cy="330" rx="12" ry="6" fill="#a0826d" opacity="0.7"/>
  
  <!-- Вспомогательные линии -->
  <line x1="30" y1="120" x2="470" y2="120" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="30" y1="240" x2="470" y2="240" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
</svg>