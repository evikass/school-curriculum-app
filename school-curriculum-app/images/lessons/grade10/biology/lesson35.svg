<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#388e3c">
    Урок 35: Оплодотворение и его формы
  </text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="85" x2="450" y2="85" stroke="#4caf50" stroke-width="2"/>
  
  <!-- Иконка клетки -->
  <g transform="translate(80, 120)">
    <circle cx="0" cy="0" r="25" fill="#81c784" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1b5e20"/>
  </g>
  
  <!-- Яйцеклетка -->
  <g transform="translate(180, 120)">
    <ellipse cx="0" cy="0" rx="30" ry="40" fill="#ffb74d" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <ellipse cx="0" cy="0" rx="20" ry="25" fill="#ffcc02" opacity="0.6"/>
    <text x="0" y="55" text-anchor="middle" font-size="14" fill="#e65100">Яйцеклетка</text>
  </g>
  
  <!-- Стрелка -->
  <g transform="translate(250, 120)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#1976d2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
      </marker>
    </defs>
  </g>
  
  <!-- Сперматозоид -->
  <g transform="translate(320, 120)">
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="#64b5f6" stroke="#1976d2" stroke-width="2"/>
    <ellipse cx="0" cy="-15" rx="12" ry="8" fill="#42a5f5"/>
    <line x1="0" y1="0" x2="0" y2="25" stroke="#1976d2" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" font-size="14" fill="#0d47a1">Сперматозоид</text>
  </g>
  
  <!-- Иконка зиготы -->
  <g transform="translate(420, 120)">
    <circle cx="0" cy="0" r="25" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="15" fill="#ce93d8"/>
    <text x="0" y="55" text-anchor="middle" font-size="14" fill="#4a148c">Зигота</text>
  </g>
  
  <!-- Внешнее оплодотворение -->
  <g transform="translate(100, 200)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#ff8a65" stroke="#d84315" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Внешнее</text>
  </g>
  
  <!-- Иконки для внешнего оплодотворения -->
  <g transform="translate(100, 250)">
    <circle cx="-20" cy="0" r="8" fill="#ffab91" stroke="#ff5722" stroke-width="1.5"/>
    <circle cx="20" cy="0" r="8" fill="#ffab91" stroke="#ff5722" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#bf360c">В воде</text>
  </g>
  
  <!-- Внутреннее оплодотворение -->
  <g transform="translate(300, 200)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#81c784" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Внутреннее</text>
  </g>
  
  <!-- Иконки для внутреннего оплодотворения -->
  <g transform="translate(300, 250)">
    <rect x="-25" y="-10" width="50" height="20" rx="10" fill="#a5d6a7" stroke="#4caf50" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#1b5e20">В теле</text>
  </g>
  
  <!-- Связующая линия -->
  <path d="M 100 180 Q 200 160 300 180" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="50" cy="300" r="3" fill="#4caf50" opacity="0.5"/>
  <circle cx="70" cy="310" r="4" fill="#66bb6a" opacity="0.5"/>
  <circle cx="90" cy="305" r="3" fill="#81c784" opacity="0.5"/>
  
  <circle cx="410" cy="300" r="3" fill="#42a5f5" opacity="0.5"/>
  <circle cx="430" cy="310" r="4" fill="#64b5f6" opacity="0.5"/>
  <circle cx="450" cy="305" r="3" fill="#90caf9" opacity="0.5"/>
  
  <!-- Процесс оплодотворения схема -->
  <g transform="translate(250, 140)">
    <path d="M -40 0 Q -20 -10 0 0 Q 20 10 40 0" stroke="#9c27b0" stroke-width="2" fill="none" opacity="0.6"/>
    <text x="0" y="-15" text-anchor="middle" font-size="12" fill="#6a1b9a">Процесс</text>
  </g>
  
  <!-- Надписи на полях -->
  <text x="20" y="120" font-size="12" fill="#666" transform="rotate(-90 20 120)">Клеточное</text>
  <text x="20" y="180" font-size="12" fill="#666" transform="rotate(-90 20 180)">объединение</text>
</svg>