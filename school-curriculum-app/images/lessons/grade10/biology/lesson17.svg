<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый узор -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f8f9fa" opacity="0.5"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9ecef" stroke-width="0.5"/>
    </pattern>
    
    <!-- Градиент для митохондрии -->
    <linearGradient id="mitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для лизосомы -->
    <radialGradient id="lysoGrad">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a3aa;stop-opacity:1" />
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#fdfdfd"/>
  <rect width="500" height="350" fill="url(#grid)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f8c8d">
    Урок 17: Лизосомы и митохондрии
  </text>
  
  <!-- Митохондрия -->
  <g id="mitochondria" transform="translate(120, 120)">
    <!-- Внешняя оболочка -->
    <path d="M 0 0 Q 10 -5 25 0 T 50 5 Q 65 10 75 25 T 80 50 Q 75 70 60 80 T 30 85 Q 10 80 -5 65 T -10 35 Q -5 15 0 0" 
          fill="url(#mitoGrad)" filter="url(#shadow)"/>
    
    <!-- Внутренние складки (кристы) -->
    <path d="M 10 15 Q 30 20 50 15 T 70 25" fill="none" stroke="#d64545" stroke-width="2"/>
    <path d="M 15 30 Q 35 35 55 30 T 65 40" fill="none" stroke="#d64545" stroke-width="2"/>
    <path d="M 20 45 Q 40 50 60 45 T 70 55" fill="none" stroke="#d64545" stroke-width="2"/>
    <path d="M 10 60 Q 30 65 50 60 T 65 70" fill="none" stroke="#d64545" stroke-width="2"/>
    
    <!-- Ядро митохондрии -->
    <ellipse cx="35" cy="40" rx="8" ry="12" fill="#c0392b" opacity="0.7"/>
    
    <!-- Метка -->
    <rect x="-20" y="90" width="120" height="20" fill="#ecf0f1" rx="10"/>
    <text x="40" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Митохондрия
    </text>
  </g>
  
  <!-- Лизосома -->
  <g id="lysosome" transform="translate(320, 150)">
    <!-- Внешняя оболочка -->
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="url(#lysoGrad)" filter="url(#shadow)"/>
    
    <!-- Внутренние гранулы -->
    <circle cx="-15" cy="-10" r="5" fill="#3498db" opacity="0.6"/>
    <circle cx="10" cy="-5" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="-5" cy="10" r="6" fill="#3498db" opacity="0.6"/>
    <circle cx="15" cy="5" r="3" fill="#3498db" opacity="0.6"/>
    <circle cx="0" cy="20" r="5" fill="#3498db" opacity="0.6"/>
    <circle cx="-10" cy="25" r="4" fill="#3498db" opacity="0.6"/>
    
    <!-- Энзимы -->
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">
      H⁺ ATPase
    </text>
    
    <!-- Метка -->
    <rect x="-30" y="65" width="60" height="20" fill="#ecf0f1" rx="10"/>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Лизосома
    </text>
  </g>
  
  <!-- Клеточная мембрана (фон) -->
  <ellipse cx="250" cy="200" rx="200" ry="120" fill="none" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Связь между органеллами -->
  <path d="M 200 180 Q 260 160 300 180" fill="none" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка для связи -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Функции митохондрии -->
  <g id="mito-functions" transform="translate(50, 250)">
    <rect x="0" y="0" width="140" height="80" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">
      Функции:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Дыхание клетки
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • ATP синтез
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Энергетический обмен
    </text>
  </g>
  
  <!-- Функции лизосомы -->
  <g id="lyso-functions" transform="translate(310, 250)">
    <rect x="0" y="0" width="140" height="80" fill="#fff" stroke="#16a085" stroke-width="2" rx="5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">
      Функции:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Пищеварение
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Утилизация
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Защита клетки
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Молекула ATP -->
  <g id="atp" transform="translate(380, 90)">
    <circle cx="0" cy="0" r="15" fill="#f39c12" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">
      ATP
    </text>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      Аденозин
    </text>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      трифосфат
    </text>
  </g>
  
  <!-- Энзимы -->
  <g id="enzymes" transform="translate(80, 100)">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#9b59b6" opacity="0.7"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">
      Энзимы
    </text>
  </g>
  
  <!-- Водородные ионы -->
  <g id="hydrogen-ions" transform="translate(320, 120)">
    <circle cx="0" cy="0" r="5" fill="#3498db"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">H⁺</text>
    <circle cx="15" cy="10" r="5" fill="#3498db"/>
    <text x="15" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">H⁺</text>
    <circle cx="-10" cy="8" r="5" fill="#3498db"/>
    <text x="-10" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">H⁺</text>
  </g>
  
  <!-- Стрелки для процессов -->
  <path d="M 380 105 L 320 180" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f39c12"/>
    </marker>
  </defs>
  
  <!-- Цифры для обозначения -->
  <g id="numbers">
    <circle cx="120" cy="120" r="10" fill="#e74c3c"/>
    <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold">1</text>
    
    <circle cx="320" cy="150" r="10" fill="#16a085"/>
    <text x="320" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold">2</text>
  </g>
  
  <!-- Легенда -->
  <g id="legend" transform="translate(250, 30)">
    <rect x="-60" y="-15" width="120" height="25" fill="#ecf0f1" rx="5" opacity="0.8"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Клеточные органеллы
    </text>
  </g>
</svg>