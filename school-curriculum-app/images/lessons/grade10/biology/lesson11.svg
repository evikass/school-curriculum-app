<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для ДНК/РНК -->
    <linearGradient id="rnaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    УРОК 11: НУКЛЕИНОВЫЕ КИСЛОТЫ
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    РНК - РИБОНУКЛЕИНОВАЯ КИСЛОТА
  </text>
  
  <!-- Основная молекула РНК - спираль -->
  <g id="rnaSpiral" transform="translate(250, 180)">
    <!-- Ось спирали -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Звенья спирали -->
    <g id="rnaLinks">
      <!-- Левая часть спирали -->
      <path d="M -70,-30 Q -50,-40 -30,-30" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="-70" cy="-30" r="4" fill="#e74c3c"/>
      <circle cx="-50" cy="-40" r="4" fill="#3498db"/>
      <circle cx="-30" cy="-30" r="4" fill="#2ecc71"/>
      
      <path d="M -50,0 Q -30,-10 -10,0" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="-50" cy="0" r="4" fill="#f39c12"/>
      <circle cx="-30" cy="-10" r="4" fill="#9b59b6"/>
      <circle cx="-10" cy="0" r="4" fill="#1abc9c"/>
      
      <path d="M -30,30 Q -10,40 10,30" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="-30" cy="30" r="4" fill="#e74c3c"/>
      <circle cx="-10" cy="40" r="4" fill="#3498db"/>
      <circle cx="10" cy="30" r="4" fill="#2ecc71"/>
      
      <!-- Правая часть спирали -->
      <path d="M 30,-30 Q 50,-40 70,-30" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="30" cy="-30" r="4" fill="#f39c12"/>
      <circle cx="50" cy="-40" r="4" fill="#9b59b6"/>
      <circle cx="70" cy="-30" r="4" fill="#1abc9c"/>
      
      <path d="M 10,0 Q 30,-10 50,0" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="10" cy="0" r="4" fill="#e74c3c"/>
      <circle cx="30" cy="-10" r="4" fill="#3498db"/>
      <circle cx="50" cy="0" r="4" fill="#2ecc71"/>
      
      <path d="M -10,30 Q 10,40 30,30" fill="none" stroke="url(#rnaGrad)" stroke-width="3"/>
      <circle cx="-10" cy="30" r="4" fill="#f39c12"/>
      <circle cx="10" cy="40" r="4" fill="#9b59b6"/>
      <circle cx="30" cy="30" r="4" fill="#1abc9c"/>
    </g>
  </g>
  
  <!-- Нуклеотиды РНК -->
  <g id="nucleotides" transform="translate(80, 180)">
    <!-- А (Аденин) -->
    <g transform="translate(0, -60)">
      <rect x="-20" y="-25" width="40" height="50" rx="5" fill="#e74c3c" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">A</text>
      <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Аденин</text>
    </g>
    
    <!-- У (Урацил) -->
    <g transform="translate(0, 0)">
      <rect x="-20" y="-25" width="40" height="50" rx="5" fill="#3498db" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">U</text>
      <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Урацил</text>
    </g>
    
    <!-- Г (Гуанин) -->
    <g transform="translate(0, 60)">
      <rect x="-20" y="-25" width="40" height="50" rx="5" fill="#2ecc71" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">G</text>
      <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Гуанин</text>
    </g>
    
    <!-- Ц (Цитозин) -->
    <g transform="translate(0, 120)">
      <rect x="-20" y="-25" width="40" height="50" rx="5" fill="#f39c12" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">C</text>
      <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Цитозин</text>
    </g>
  </g>
  
  <!-- Связи между нуклеотидами -->
  <g id="bonds" opacity="0.7">
    <line x1="100" y1="120" x2="170" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="100" y1="180" x2="170" y2="180" stroke="#95a5a6" stroke-width="2"/>
    <line x1="100" y1="240" x2="170" y2="210" stroke="#95a5a6" stroke-width="2"/>
    <line x1="100" y1="300" x2="170" y2="240" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Типы РНК -->
  <g id="rnaTypes" transform="translate(400, 100)">
    <!-- мРНК -->
    <g transform="translate(0, 0)">
      <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#9b59b6" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="white">мРНК</text>
      <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">матричная</text>
    </g>
    
    <!-- тРНК -->
    <g transform="translate(0, 50)">
      <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#16a085" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="white">тРНК</text>
      <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">транспортная</text>
    </g>
    
    <!-- рРНК -->
    <g transform="translate(0, 100)">
      <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#e67e22" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" fill="white">рРНК</text>
      <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">рибосомная</text>
    </g>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <g id="decorative">
    <!-- ДНК спираль -->
    <g transform="translate(50, 250)" opacity="0.3">
      <path d="M 0,0 Q 10,-10 20,0 Q 30,10 40,0" fill="none" stroke="#34495e" stroke-width="2"/>
      <path d="M 0,5 Q 10,-5 20,5 Q 30,15 40,5" fill="none" stroke="#34495e" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">ДНК</text>
    </g>
    
    <!-- РНК спираль -->
    <g transform="translate(400, 250)" opacity="0.3">
      <path d="M 0,0 Q 10,-10 20,0 Q 30,10 40,0" fill="none" stroke="#34495e" stroke-width="2"/>
      <path d="M 0,5 Q 10,-5 20,5 Q 30,15 40,5" fill="none" stroke="#34495e" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">РНК</text>
    </g>
  </g>
  
  <!-- БИОЛОГИЯ · 10 КЛАСС -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Дополнительные молекулярные элементы -->
  <g id="molecular" transform="translate(250, 120)">
    <circle cx="0" cy="0" r="3" fill="#95a5a6"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="#95a5a6" stroke-width="1"/>
    <line x1="15" y1="0" x2="20" y2="-5" stroke="#95a5a6" stroke-width="1"/>
    <line x1="15" y1="0" x2="20" y2="5" stroke="#95a5a6" stroke-width="1"/>
    <line x1="15" y1="0" x2="20" y2="0" stroke="#95a5a6" stroke-width="1"/>
    <text x="25" y="5" font-family="Arial" font-size="8" fill="#7f8c8d">PO4</text>
  </g>
</svg>