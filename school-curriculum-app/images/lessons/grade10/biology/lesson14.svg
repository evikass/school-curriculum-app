<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Основной контейнер -->
  <rect x="50" y="60" width="400" height="250" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  
  <!-- Заголовок урока -->
  <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Урок 14: Плазматическая мембрана
  </text>
  
  <!-- Фосфолипидный бислой -->
  <g transform="translate(250, 160)">
    <!-- Верхний слой -->
    <ellipse cx="0" cy="-30" rx="150" ry="20" fill="#e74c3c" opacity="0.8"/>
    <ellipse cx="0" cy="-25" rx="150" ry="20" fill="#c0392b" opacity="0.8"/>
    
    <!-- Нижний слой -->
    <ellipse cx="0" cy="30" rx="150" ry="20" fill="#3498db" opacity="0.8"/>
    <ellipse cx="0" cy="25" rx="150" ry="20" fill="#2980b9" opacity="0.8"/>
    
    <!-- Фосфолипиды -->
    <g id="phospholipid">
      <ellipse cx="0" cy="0" rx="8" ry="15" fill="#f39c12"/>
      <circle cx="0" cy="-12" r="5" fill="#e67e22"/>
      <line x1="0" y1="-12" x2="0" y2="-20" stroke="#34495e" stroke-width="2"/>
      <circle cx="-3" cy="-23" r="2" fill="#e74c3c"/>
      <circle cx="3" cy="-23" r="2" fill="#e74c3c"/>
    </g>
    
    <!-- Повторить фосфолипиды -->
    <use href="#phospholipid" transform="translate(-40, 0)"/>
    <use href="#phospholipid" transform="translate(-80, 0)"/>
    <use href="#phospholipid" transform="translate(40, 0)"/>
    <use href="#phospholipid" transform="translate(80, 0)"/>
    <use href="#phospholipid" transform="translate(-120, 0)"/>
    <use href="#phospholipid" transform="translate(120, 0)"/>
    <use href="#phospholipid" transform="translate(-20, 5)"/>
    <use href="#phospholipid" transform="translate(20, -5)"/>
    <use href="#phospholipid" transform="translate(-60, 5)"/>
    <use href="#phospholipid" transform="translate(60, -5)"/>
    <use href="#phospholipid" transform="translate(-100, 0)"/>
    <use href="#phospholipid" transform="translate(100, 0)"/>
    <use href="#phospholipid" transform="translate(-40, -5)"/>
    <use href="#phospholipid" transform="translate(40, 5)"/>
    <use href="#phospholipid" transform="translate(0, 5)"/>
  </g>
  
  <!-- Белки -->
  <!-- Интегральные белки -->
  <rect x="120" y="140" width="20" height="40" rx="5" fill="#9b59b6"/>
  <rect x="360" y="140" width="20" height="40" rx="5" fill="#9b59b6"/>
  
  <!-- Периферические белки -->
  <ellipse cx="150" cy="110" rx="15" ry="10" fill="#16a085"/>
  <ellipse cx="350" cy="210" rx="15" ry="10" fill="#16a085"/>
  
  <!-- Холестерол -->
  <g transform="translate(250, 160)">
    <ellipse cx="90" cy="-10" rx="8" ry="12" fill="#f1c40f"/>
    <ellipse cx="-90" cy="10" rx="8" ry="12" fill="#f1c40f"/>
    <ellipse cx="60" cy="5" rx="6" ry="10" fill="#f39c12"/>
  </g>
  
  <!-- Гликолипиды -->
  <g transform="translate(250, 160)">
    <line x1="-130" y1="-20" x2="-130" y2="-35" stroke="#34495e" stroke-width="1.5"/>
    <circle cx="-130" cy="-38" r="5" fill="#27ae60"/>
    <circle cx="-130" cy="-45" r="3" fill="#2ecc71"/>
  </g>
  
  <!-- Гликопротеины -->
  <g transform="translate(250, 160)">
    <line x1="130" y1="20" x2="130" y2="35" stroke="#34495e" stroke-width="1.5"/>
    <circle cx="130" cy="38" r="5" fill="#e74c3c"/>
    <circle cx="130" cy="45" r="3" fill="#c0392b"/>
  </g>
  
  <!-- Метки -->
  <text x="70" y="115" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Гидрофильные</text>
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Гидрофобные</text>
  <text x="340" y="150" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Интегральные</text>
  <text x="340" y="165" font-family="Arial, sans-serif" font-size="11" fill="#34495e">белки</text>
  <text x="340" y="225" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Периферические</text>
  <text x="340" y="240" font-family="Arial, sans-serif" font-size="11" fill="#34495e">белки</text>
  <text x="320" y="175" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Холестерол</text>
  
  <!-- Стрелки указания -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <line x1="85" y1="100" x2="115" y2="110" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="85" y1="205" x2="115" y2="195" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="150" x2="345" y2="160" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="215" x2="345" y2="205" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="170" x2="330" y2="165" stroke="#34495e" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Водяные молекулы для иллюстрации гидрофобности/гидрофильности -->
  <g opacity="0.3">
    <circle cx="80" cy="130" r="4" fill="#3498db"/>
    <circle cx="85" cy="135" r="3" fill="#3498db"/>
    <circle cx="90" cy="130" r="4" fill="#3498db"/>
    <circle cx="420" cy="130" r="4" fill="#3498db"/>
    <circle cx="425" cy="135" r="3" fill="#3498db"/>
    <circle cx="430" cy="130" r="4" fill="#3498db"/>
    <circle cx="80" cy="190" r="4" fill="#3498db"/>
    <circle cx="85" cy="195" r="3" fill="#3498db"/>
    <circle cx="90" cy="190" r="4" fill="#3498db"/>
    <circle cx="420" cy="190" r="4" fill="#3498db"/>
    <circle cx="425" y="195" r="3" fill="#3498db"/>
    <circle cx="430" y="190" r="4" fill="#3498db"/>
  </g>
  
  <!-- Функции мембраны -->
  <rect x="60" y="320" width="380" height="25" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="250" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
    Барьер, транспорт, рецепторы, клеточная идентификация
  </text>
</svg>