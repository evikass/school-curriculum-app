<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">БИОЛОГИЯ · 10 КЛАСС</text>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">Урок 33: Сравнение митоза и мейоза</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="65" x2="450" y2="65" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Митоза - левая часть -->
  <g id="mitosis">
    <rect x="50" y="80" width="180" height="250" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="140" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2980b9">МИТОЗ</text>
    
    <!-- Интерфаза -->
    <g id="interphase">
      <rect x="70" y="120" width="140" height="30" fill="#fff" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="140" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Интерфаза</text>
      <text x="140" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Профаза -->
    <g id="prophase">
      <rect x="70" y="165" width="140" height="30" fill="#fff" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="140" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Профаза</text>
      <text x="140" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Метафаза -->
    <g id="metaphase">
      <rect x="70" y="210" width="140" height="30" fill="#fff" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="140" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Метафаза</text>
      <text x="140" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Анафаза -->
    <g id="anaphase">
      <rect x="70" y="255" width="140" height="30" fill="#fff" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="140" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Анафаза</text>
      <text x="140" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n → n, 4c</text>
    </g>
    
    <!-- Телофаза -->
    <g id="telophase">
      <rect x="70" y="300" width="140" height="30" fill="#fff" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="140" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Телофаза</text>
      <text x="140" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">n, 2c</text>
    </g>
  </g>
  
  <!-- Мейоза - правая часть -->
  <g id="meiosis">
    <rect x="270" y="80" width="180" height="250" fill="#fdf2e9" stroke="#e67e22" stroke-width="2" rx="5"/>
    <text x="360" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#d35400">МЕИОЗ</text>
    
    <!-- Интерфаза -->
    <g id="meiosis-interphase">
      <rect x="290" y="120" width="140" height="25" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="138" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Интерфаза</text>
      <text x="360" y="150" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Профаза I -->
    <g id="meiosis-prophase">
      <rect x="290" y="155" width="140" height="25" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="173" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Профаза I</text>
      <text x="360" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Метафаза I -->
    <g id="meiosis-metaphase">
      <rect x="290" y="190" width="140" height="25" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="208" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Метафаза I</text>
      <text x="360" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n, 4c</text>
    </g>
    
    <!-- Анафаза I -->
    <g id="meiosis-anaphase">
      <rect x="290" y="225" width="140" height="25" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="243" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Анафаза I</text>
      <text x="360" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2n → n, 4c</text>
    </g>
    
    <!-- Телофаза I -->
    <g id="meiosis-telophase">
      <rect x="290" y="260" width="140" height="20" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="274" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Телофаза I</text>
      <text x="360" y="285" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">n, 2c</text>
    </g>
    
    <!-- Второе деление -->
    <g id="meiosis-second">
      <rect x="290" y="290" width="140" height="40" fill="#fff" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="360" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Мейоз II</text>
      <text x="360" y="318" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">(Профаза-Телофаза)</text>
      <text x="360" y="328" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">n → n/2, 2c → c</text>
    </g>
  </g>
  
  <!-- Центральная стрелка сравнения -->
  <g id="comparison">
    <circle cx="250" cy="160" r="20" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <text x="250" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">VS</text>
  </g>
  
  <!-- Индикаторы хромосом -->
  <g id="chromosome-indicators">
    <!-- Митоза -->
    <g id="mitosis-chromosomes">
      <circle cx="80" cy="137" r="3" fill="#3498db"/>
      <circle cx="85" cy="137" r="3" fill="#3498db"/>
      <circle cx="90" cy="137" r="3" fill="#3498db"/>
      <circle cx="95" cy="137" r="3" fill="#3498db"/>
      <text x="105" y="140" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">46 хр.</text>
    </g>
    
    <!-- Мейоза -->
    <g id="meiosis-chromosomes">
      <circle cx="300" cy="137" r="3" fill="#e67e22"/>
      <circle cx="305" cy="137" r="3" fill="#e67e22"/>
      <circle cx="310" cy="137" r="3" fill="#e67e22"/>
      <circle cx="315" cy="137" r="3" fill="#e67e22"/>
      <text x="325" y="140" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">46 хр.</text>
    </g>
  </g>
  
  <!-- Легенда -->
  <g id="legend">
    <rect x="50" y="340" width="400" height="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="60" y="347" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">n - гаплоидный набор, 2n - диплоидный набор, c - число хроматид</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g id="decorations">
    <!-- ДНК спираль - митоз -->
    <g transform="translate(60, 200)">
      <path d="M0,0 Q5,-5 10,0 T20,0 T30,0" stroke="#3498db" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M0,5 Q5,10 10,5 T20,5 T30,5" stroke="#3498db" stroke-width="2" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Кроссинговер - мейоз -->
    <g transform="translate(280, 200)">
      <path d="M0,0 Q5,5 10,0 T20,0 T30,0" stroke="#e67e22" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M0,5 Q5,0 10,5 T20,5 T30,5" stroke="#e67e22" stroke-width="2" fill="none" opacity="0.5"/>
      <circle cx="10" cy="2.5" r="2" fill="#e74c3c" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Указатели результата -->
  <g id="results">
    <!-- Митоз результат -->
    <rect x="70" y="335" width="50" height="12" fill="#2ecc71" stroke="#27ae60" stroke-width="1" rx="2"/>
    <text x="95" y="344" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">2 клетки</text>
    
    <!-- Мейоз результат -->
    <rect x="380" y="335" width="50" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="2"/>
    <text x="405" y="344" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fff">4 клетки</text>
  </g>
</svg>