<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для молекулы воды -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0d47a1">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1565c0">
    Урок 4: Вода и её роль в клетке
  </text>
  
  <!-- Молекула воды в центре -->
  <g transform="translate(250, 150)">
    <!-- Атом кислорода -->
    <circle cx="0" cy="0" r="25" fill="#f44336" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">O</text>
    
    <!-- Атомы водорода -->
    <circle cx="-35" cy="25" r="18" fill="#e3f2fd" filter="url(#shadow)"/>
    <text x="-35" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1976d2">H</text>
    
    <circle cx="35" cy="25" r="18" fill="#e3f2fd" filter="url(#shadow)"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1976d2">H</text>
    
    <!-- Связи -->
    <line x1="-20" y1="15" x2="-17" y2="18" stroke="#424242" stroke-width="3"/>
    <line x1="20" y1="15" x2="17" y2="18" stroke="#424242" stroke-width="3"/>
  </g>
  
  <!-- Свойства воды - левая часть -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" fill-opacity="0.9" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#0d47a1">Свойства воды</text>
    
    <circle cx="15" cy="40" r="3" fill="#2196f3"/>
    <text x="25" y="45" font-family="Arial" font-size="11" fill="#424242">Высокая теплоёмкость</text>
    
    <circle cx="15" cy="60" r="3" fill="#2196f3"/>
    <text x="25" y="65" font-family="Arial" font-size="11" fill="#424242">Растворитель</text>
    
    <circle cx="15" cy="80" r="3" fill="#2196f3"/>
    <text x="25" y="85" font-family="Arial" font-size="11" fill="#424242">Водородные связи</text>
    
    <circle cx="15" cy="100" r="3" fill="#2196f3"/>
    <text x="25" y="105" font-family="Arial" font-size="11" fill="#424242">Поверхностное натяжение</text>
  </g>
  
  <!-- Роль в клетке - правая часть -->
  <g transform="translate(310, 200)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" fill-opacity="0.9" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#0d47a1">Роль в клетке</text>
    
    <circle cx="15" cy="40" r="3" fill="#4caf50"/>
    <text x="25" y="45" font-family="Arial" font-size="11" fill="#424242">Среда реакций</text>
    
    <circle cx="15" cy="60" r="3" fill="#4caf50"/>
    <text x="25" y="65" font-family="Arial" font-size="11" fill="#424242">Транспорт веществ</text>
    
    <circle cx="15" cy="80" r="3" fill="#4caf50"/>
    <text x="25" y="85" font-family="Arial" font-size="11" fill="#424242">Структурная</text>
    
    <circle cx="15" cy="100" r="3" fill="#4caf50"/>
    <text x="25" y="105" font-family="Arial" font-size="11" fill="#424242">Терморегуляция</text>
  </g>
  
  <!-- Клеточная структура -->
  <g transform="translate(100, 80)">
    <ellipse cx="50" cy="30" rx="40" ry="25" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="50" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#1976d2">Клетка</text>
  </g>
  
  <!-- Дополнительные молекулы воды -->
  <g opacity="0.6">
    <circle cx="80" cy="120" r="8" fill="url(#waterGrad)"/>
    <circle cx="420" cy="140" r="8" fill="url(#waterGrad)"/>
    <circle cx="150" cy="160" r="8" fill="url(#waterGrad)"/>
    <circle cx="350" cy="180" r="8" fill="url(#waterGrad)"/>
    <circle cx="100" cy="250" r="8" fill="url(#waterGrad)"/>
    <circle cx="400" cy="260" r="8" fill="url(#waterGrad)"/>
  </g>
  
  <!-- Водородные связи (иллюстрация) -->
  <g stroke="#90caf9" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 200 150 Q 220 140 240 150" stroke-dasharray="2,2"/>
    <path d="M 260 150 Q 280 140 300 150" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Температурная шкала -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="8" height="40" fill="#ff5722"/>
    <rect x="0" y="40" width="8" height="20" fill="#ffc107"/>
    <rect x="0" y="60" width="8" height="20" fill="#2196f3"/>
    <text x="15" y="15" font-family="Arial" font-size="9" fill="#424242">100°C</text>
    <text x="15" y="45" font-family="Arial" font-size="9" fill="#424242">50°C</text>
    <text x="15" y="75" font-family="Arial" font-size="9" fill="#424242">0°C</text>
  </g>
  
  <!-- Процентное содержание воды -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="50" height="40" rx="5" fill="white" fill-opacity="0.9"/>
    <text x="25" y="15" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1976d2">H₂O</text>
    <text x="25" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#424242">70-90%</text>
  </g>
  
  <!-- Декоративные волны -->
  <path d="M 0 320 Q 50 310 100 320 T 200 320 T 300 320 T 400 320 T 500 320" 
        stroke="#64b5f6" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 0 330 Q 50 320 100 330 T 200 330 T 300 330 T 400 330 T 500 330" 
        stroke="#42a5f5" stroke-width="2" fill="none" opacity="0.5"/>
</svg>