<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Паттерн для воды -->
    <pattern id="water" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,20 Q10,10 20,20 T40,20" stroke="#64b5f6" stroke-width="1.5" fill="none" opacity="0.5"/>
    </pattern>
    
    <!-- Паттерн для земли -->
    <pattern id="earth" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#8d6e63" opacity="0.3"/>
      <circle cx="15" cy="15" r="1.5" fill="#6d4c41" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2e7d32">
    БИОЛОГИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#388e3c">
    Урок 55: Экология как наука. Среды жизни
  </text>
  
  <!-- Солнце -->
  <g transform="translate(100, 80)">
    <circle r="25" fill="#ffd54f" filter="url(#shadow)"/>
    <g stroke="#ffb300" stroke-width="3">
      <path d="M0,-35 L0,-45" stroke-linecap="round"/>
      <path d="M25,-25 L35,-35" stroke-linecap="round"/>
      <path d="M35,0 L45,0" stroke-linecap="round"/>
      <path d="M25,25 L35,35" stroke-linecap="round"/>
      <path d="0,35 L0,45" stroke-linecap="round"/>
      <path d="M-25,25 L-35,35" stroke-linecap="round"/>
      <path d="M-35,0 L-45,0" stroke-linecap="round"/>
      <path d="M-25,-25 L-35,-35" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Облако 1 -->
  <g transform="translate(350, 90)" fill="white" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="25" ry="15"/>
    <ellipse cx="-20" cy="5" rx="20" ry="12"/>
    <ellipse cx="20" cy="5" rx="20" ry="12"/>
  </g>
  
  <!-- Облако 2 -->
  <g transform="translate(400, 120)" fill="white" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="20" ry="12"/>
    <ellipse cx="-15" cy="4" rx="15" ry="10"/>
    <ellipse cx="15" cy="4" rx="15" ry="10"/>
  </g>
  
  <!-- Среда 1: Водная -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="120" height="80" fill="#42a5f5" rx="10" filter="url(#shadow)"/>
    <rect x="0" y="0" width="120" height="80" fill="url(#water)" rx="10"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ВОДНАЯ
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
      Среда
    </text>
    <!-- Рыба -->
    <g transform="translate(30, 60)">
      <ellipse rx="15" ry="8" fill="#ff7043"/>
      <path d="M15,0 L25,5 L15,10 Z" fill="#ff7043"/>
      <circle cx="-8" cy="-2" r="2" fill="white"/>
      <circle cx="-8" cy="-2" r="1" fill="black"/>
    </g>
    <!-- Растение -->
    <g transform="translate(80, 70)">
      <path d="M0,0 Q-5,-15 0,-25 Q5,-15 0,0" fill="#66bb6a"/>
    </g>
  </g>
  
  <!-- Среда 2: Суша -->
  <g transform="translate(190, 150)">
    <rect x="0" y="0" width="120" height="80" fill="#8bc34a" rx="10" filter="url(#shadow)"/>
    <rect x="0" y="0" width="120" height="80" fill="url(#earth)" rx="10"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      СУША
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
      Среда
    </text>
    <!-- Дерево -->
    <g transform="translate(30, 50)">
      <rect x="-5" y="10" width="10" height="20" fill="#795548"/>
      <circle cx="0" cy="5" r="15" fill="#4caf50"/>
    </g>
    <!-- Трава -->
    <g transform="translate(80, 70)">
      <path d="M0,0 L-3,-8 M0,0 L0,-10 M0,0 L3,-8" stroke="#689f38" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Среда 3: Воздушная -->
  <g transform="translate(330, 150)">
    <rect x="0" y="0" width="120" height="80" fill="#90caf9" rx="10" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ВОЗДУШНАЯ
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
      Среда
    </text>
    <!-- Птица -->
    <g transform="translate(30, 60)">
      <path d="M-10,0 Q0,-5 10,0 Q0,5 -10,0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Облако внутри -->
    <g transform="translate(70, 55)" fill="white" opacity="0.8">
      <ellipse cx="0" cy="0" rx="20" ry="10"/>
      <ellipse cx="-12" cy="3" rx="15" ry="8"/>
      <ellipse cx="12" cy="3" rx="15" ry="8"/>
    </g>
  </g>
  
  <!-- Среда 4: Органическая -->
  <g transform="translate(120, 250)">
    <rect x="0" y="0" width="120" height="80" fill="#ce93d8" rx="10" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ОРГАНИЧЕСКАЯ
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
      Среда
    </text>
    <!-- Клетка -->
    <g transform="translate(30, 60)">
      <circle r="10" fill="none" stroke="white" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="white"/>
      <circle cx="5" cy="-5" r="2" fill="white"/>
      <circle cx="-5" cy="5" r="2" fill="white"/>
    </g>
    <!-- Бактерия -->
    <g transform="translate(70, 65)">
      <ellipse rx="15" ry="5" fill="white"/>
      <path d="M15,0 L20,2 M15,0 L20,-2" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Среда 5: Биогенная -->
  <g transform="translate(260, 250)">
    <rect x="0" y="0" width="120" height="80" fill="#ffab91" rx="10" filter="url(#shadow)"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      БИОГЕННАЯ
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
      Среда
    </text>
    <!-- Гриб -->
    <g transform="translate(30, 65)">
      <ellipse rx="8" ry="4" fill="white"/>
      <rect x="-2" y="0" width="4" height="15" fill="white"/>
      <circle cx="-5" cy="-3" r="2" fill="white"/>
      <circle cx="5" cy="-3" r="2" fill="white"/>
      <circle cx="0" cy="-5" r="2" fill="white"/>
    </g>
    <!-- Лишайник -->
    <g transform="translate(70, 60)">
      <circle cx="0" cy="0" r="8" fill="white"/>
      <circle cx="-6" cy="-3" r="6" fill="white" opacity="0.7"/>
      <circle cx="6" cy="-3" r="6" fill="white" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Стрелки связи -->
  <g stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
      </marker>
    </defs>
    <path d="M170,190 L190,190" stroke-dasharray="5,5"/>
    <path d="M310,190 L330,190" stroke-dasharray="5,5"/>
    <path d="M110,230 L120,250" stroke-dasharray="5,5"/>
    <path d="M250,230 L260,250" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Экосистема центр -->
  <g transform="translate(250, 140)">
    <circle r="30" fill="#4caf50" opacity="0.8" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
      ЭКОСИСТЕМА
    </text>
  </g>
  
  <!-- Дополнительные элементы украшения -->
  <g opacity="0.6">
    <!-- Листочки -->
    <g transform="translate(20, 100)">
      <path d="M0,0 Q-5,-8 0,-10 Q5,-8 0,0" fill="#66bb6a"/>
    </g>
    <g transform="translate(480, 110)">
      <path d="M0,0 Q-5,-8 0,-10 Q5,-8 0,0" fill="#66bb6a"/>
    </g>
    <g transform="translate(450, 200)">
      <path d="M0,0 Q-5,-8 0,-10 Q5,-8 0,0" fill="#66bb6a"/>
    </g>
  </g>
  
  <!-- Значок науки -->
  <g transform="translate(420, 40)">
    <circle r="15" fill="#ffc107" filter="url(#shadow)"/>
    <path d="M-8,-5 L8,-5 M-8,0 L8,0 M-8,5 L8,5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>