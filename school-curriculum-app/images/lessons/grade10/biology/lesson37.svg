<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- ДНК спираль -->
  <g id="dna-spiral" transform="translate(50, 100)">
    <path d="M0,0 Q10,20 0,40 Q-10,60 0,80 Q10,100 0,120 Q-10,140 0,160" 
          fill="none" stroke="#4a90e2" stroke-width="3" opacity="0.8"/>
    <path d="M30,0 Q20,20 30,40 Q40,60 30,80 Q20,100 30,120 Q40,140 30,160" 
          fill="none" stroke="#4a90e2" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="20" x2="30" y2="20" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="40" x2="30" y2="40" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="60" x2="30" y2="60" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="80" x2="30" y2="80" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="100" x2="30" y2="100" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="120" x2="30" y2="120" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="140" x2="30" y2="140" stroke="#4a90e2" stroke-width="2"/>
  </g>
  
  <!-- Хромосома -->
  <g id="chromosome" transform="translate(420, 150)">
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#e74c3c" opacity="0.7"/>
    <ellipse cx="0" cy="80" rx="20" ry="40" fill="#e74c3c" opacity="0.7"/>
    <rect x="-20" y="35" width="40" height="10" fill="#e74c3c" opacity="0.7"/>
  </g>
  
  <!-- Гены -->
  <g id="genes">
    <rect x="100" y="80" width="60" height="20" fill="#2ecc71" rx="10" opacity="0.8"/>
    <rect x="100" y="110" width="60" height="20" fill="#f39c12" rx="10" opacity="0.8"/>
    <rect x="100" y="140" width="60" height="20" fill="#9b59b6" rx="10" opacity="0.8"/>
    <rect x="100" y="170" width="60" height="20" fill="#e67e22" rx="10" opacity="0.8"/>
  </g>
  
  <!-- Аллели -->
  <g id="alleles">
    <circle cx="180" cy="90" r="8" fill="#3498db"/>
    <circle cx="195" cy="90" r="8" fill="#e74c3c"/>
    <circle cx="180" cy="120" r="8" fill="#2ecc71"/>
    <circle cx="195" cy="120" r="8" fill="#2ecc71"/>
    <circle cx="180" cy="150" r="8" fill="#f39c12"/>
    <circle cx="195" cy="150" r="8" fill="#3498db"/>
  </g>
  
  <!-- Название урока -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Урок 37: Генетика</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">наука о наследственности и изменчивости</text>
  
  <!-- Панель информации -->
  <rect x="250" y="90" width="230" height="160" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  
  <!-- Список тем -->
  <text x="270" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Основные темы:</text>
  <text x="270" y="140" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Ген и аллель</text>
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Генотип и фенотип</text>
  <text x="270" y="180" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Доминантные и рецессивные признаки</text>
  <text x="270" y="200" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Мендельские законы</text>
  <text x="270" y="220" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Наследственность и изменчивость</text>
  <text x="270" y="240" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Модификационная изменчивость</text>
  
  <!-- ДНК нуклеотиды -->
  <g id="nucleotides" transform="translate(320, 100)">
    <rect x="0" y="0" width="15" height="15" fill="#e74c3c" opacity="0.7"/>
    <rect x="20" y="0" width="15" height="15" fill="#3498db" opacity="0.7"/>
    <rect x="40" y="0" width="15" height="15" fill="#2ecc71" opacity="0.7"/>
    <rect x="0" y="20" width="15" height="15" fill="#f39c12" opacity="0.7"/>
    <rect x="20" y="20" width="15" height="15" fill="#9b59b6" opacity="0.7"/>
    <rect x="40" y="20" width="15" height="15" fill="#e74c3c" opacity="0.7"/>
  </g>
  
  <!-- Схема скрещивания -->
  <g id="crossing" transform="translate(50, 250)">
    <circle cx="50" cy="0" r="15" fill="#3498db" opacity="0.7"/>
    <circle cx="50" cy="30" r="15" fill="#e74c3c" opacity="0.7"/>
    <circle cx="50" cy="60" r="15" fill="#3498db" opacity="0.7"/>
    
    <circle cx="150" cy="0" r="15" fill="#e74c3c" opacity="0.7"/>
    <circle cx="150" cy="30" r="15" fill="#e74c3c" opacity="0.7"/>
    <circle cx="150" cy="60" r="15" fill="#e74c3c" opacity="0.7"/>
    
    <line x1="65" y1="30" x2="135" y2="30" stroke="#95a5a6" stroke-width="2"/>
    <line x1="65" y1="30" x2="135" y2="30" stroke="#95a5a6" stroke-width="2"/>
    <line x1="65" y1="30" x2="135" y2="30" stroke="#95a5a6" stroke-width="2"/>
    <line x1="65" y1="30" x2="135" y2="30" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Легенда -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Генотип: AA Aa aa</text>
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Фенотип: 3:1</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="30" cy="320" r="3" fill="#2ecc71" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#f39c12" opacity="0.5"/>
  
  <!-- Молекула ДНК декор -->
  <g id="dna-decor" transform="translate(400, 50) scale(0.5)">
    <path d="M0,0 Q5,10 0,20 Q-5,30 0,40" fill="none" stroke="#4a90e2" stroke-width="2"/>
    <path d="M20,0 Q15,10 20,20 Q25,30 20,40" fill="none" stroke="#4a90e2" stroke-width="2"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#4a90e2" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="20" y2="20" stroke="#4a90e2" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="20" y2="30" stroke="#4a90e2" stroke-width="1.5"/>
  </g>
  
  <!-- Биологические символы -->
  <g id="bio-symbols" opacity="0.3">
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="30" fill="#34495e">♂</text>
    <text x="220" y="200" font-family="Arial, sans-serif" font-size="30" fill="#e74c3c">♀</text>
  </g>
  
  <!-- Заголовок "БИОЛОГИЯ · 10 КЛАСС" -->
  <rect x="150" y="10" width="200" height="25" fill="#34495e" rx="12"/>
  <text x="250" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">БИОЛОГИЯ · 10 КЛАСС</text>
  
  <!-- Пунктирная линия -->
  <line x1="50" y1="230" x2="450" y2="230" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
</svg>