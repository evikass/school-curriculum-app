<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Градиент для куба -->
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    
    <!-- Градиент для пирамиды -->
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    
    <!-- Пунктирная линия -->
    <pattern id="dash" patternUnits="userSpaceOnUse" width="8" height="1">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#64748b" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" filter="url(#textShadow)">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">
    Урок 19: Симметрия в пространстве
  </text>
  
  <!-- Центральная точка -->
  <circle cx="250" cy="175" r="4" fill="#dc2626"/>
  
  <!-- Куб с плоскостями симметрии -->
  <g transform="translate(150, 150)">
    <!-- Задняя грань куба -->
    <polygon points="0,0 50,0 50,50 0,50" fill="url(#cubeGrad3)" opacity="0.7"/>
    
    <!-- Правая грань куба -->
    <polygon points="50,0 70,-20 70,30 50,50" fill="url(#cubeGrad2)"/>
    
    <!-- Верхняя грань куба -->
    <polygon points="0,0 50,0 70,-20 20,-20" fill="url(#cubeGrad1)"/>
    
    <!-- Передняя грань куба -->
    <polygon points="20,-20 70,-20 70,30 20,30" fill="url(#cubeGrad3)"/>
    
    <!-- Линия симметрии (вертикаль) -->
    <line x1="35" y1="-20" x2="35" y2="50" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Линия симметрии (горизонталь) -->
    <line x1="0" y1="15" x2="70" y2="15" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Пирамида с плоскостью симметрии -->
  <g transform="translate(320, 200)">
    <!-- Основание пирамиды -->
    <polygon points="0,0 60,0 60,30 0,30" fill="#6ee7b7" opacity="0.6"/>
    
    <!-- Боковые грани -->
    <polygon points="0,0 30,-40 60,0" fill="url(#pyramidGrad)"/>
    <polygon points="60,0 30,-40 60,30" fill="#34d399"/>
    
    <!-- Плоскость симметрии -->
    <line x1="30" y1="-40" x2="30" y2="30" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Вершина -->
    <circle cx="30" cy="-40" r="3" fill="#059669"/>
  </g>
  
  <!-- Ось симметрии - вертикальная -->
  <line x1="100" y1="100" x2="100" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="105" y="175" font-family="Arial, sans-serif" font-size="12" fill="#64748b">ось симметрии</text>
  
  <!-- Ось симметрии - горизонтальная -->
  <line x1="50" y1="175" x2="450" y2="175" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Центр симметрии -->
  <circle cx="250" cy="175" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="250" cy="175" r="2" fill="#dc2626"/>
  <text x="260" y="180" font-family="Arial, sans-serif" font-size="12" fill="#64748b">центр симметрии</text>
  
  <!-- Пример симметричных фигур -->
  <g transform="translate(100, 280)">
    <!-- Левая фигура -->
    <path d="M0,0 Q10,-10 20,0 Q10,10 0,0" fill="#f59e0b"/>
    
    <!-- Стрелка симметрии -->
    <line x1="25" y1="0" x2="35" y2="0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    
    <!-- Правая фигура (отраженная) -->
    <path d="M60,0 Q50,-10 40,0 Q50,10 60,0" fill="#f59e0b"/>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы декора -->
  <g opacity="0.3">
    <circle cx="50" cy="100" r="3" fill="#64748b"/>
    <circle cx="450" cy="100" r="3" fill="#64748b"/>
    <circle cx="50" cy="250" r="3" fill="#64748b"/>
    <circle cx="450" cy="250" r="3" fill="#64748b"/>
  </g>
  
  <!-- Угловые элементы -->
  <g stroke="#cbd5e1" stroke-width="1" fill="none">
    <path d="M10,10 L10,30 M10,10 L30,10"/>
    <path d="M490,10 L490,30 M490,10 L470,10"/>
    <path d="M10,340 L10,320 M10,340 L30,340"/>
    <path d="M490,340 L490,320 M490,340 L470,340"/>
  </g>
  
  <!-- Уравнение плоскости симметрии -->
  <g transform="translate(350, 280)">
    <rect x="-5" y="-15" width="80" height="30" fill="white" stroke="#e2e8f0" rx="3"/>
    <text x="35" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">x = 0</text>
  </g>
  
  <!-- Вектор нормали -->
  <g transform="translate(250, 175)">
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <text x="5" y="-20" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6">n</text>
  </g>
  
  <!-- Вторая стрелка -->
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
  </defs>
  
  <!-- Точки на координатных осях -->
  <g fill="#64748b">
    <circle cx="150" cy="175" r="2"/>
    <circle cx="200" cy="175" r="2"/>
    <circle cx="300" cy="175" r="2"/>
    <circle cx="350" cy="175" r="2"/>
    <circle cx="250" cy="125" r="2"/>
    <circle cx="250" cy="225" r="2"/>
  </g>
  
  <!-- Углы симметрии -->
  <g stroke="#dc2626" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 235,175 A 15,15 0 0,1 250,160"/>
    <path d="M 265,175 A 15,15 0 0,1 250,160"/>
    <path d="M 250,190 A 15,15 0 0,1 235,175"/>
    <path d="M 250,190 A 15,15 0 0,1 265,175"/>
  </g>
</svg>