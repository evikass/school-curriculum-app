<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Основной конус -->
  <g transform="translate(250, 180)">
    <!-- Осевое сечение конуса -->
    <path d="M 0,-80 L 80,100 L -80,100 Z" fill="#e8f4f8" stroke="#34495e" stroke-width="2"/>
    
    <!-- Ось вращения -->
    <line x1="0" y1="-80" x2="0" y2="100" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Радиус основания -->
    <line x1="0" y1="100" x2="80" y2="100" stroke="#3498db" stroke-width="2"/>
    <text x="40" y="115" font-family="Arial" font-size="14" fill="#3498db">r</text>
    
    <!-- Образующая -->
    <line x1="0" y1="-80" x2="80" y2="100" stroke="#9b59b6" stroke-width="2"/>
    <text x="35" y="5" font-family="Arial" font-size="14" fill="#9b59b6">l</text>
    
    <!-- Высота -->
    <line x1="0" y1="100" x2="0" y2="-80" stroke="#e74c3c" stroke-width="2"/>
    <text x="-15" y="10" font-family="Arial" font-size="14" fill="#e74c3c">h</text>
    
    <!-- Центр основания -->
    <circle cx="0" cy="100" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Вспомогательный рисунок - развертка конуса -->
  <g transform="translate(100, 280)">
    <!-- Сектор развертки -->
    <path d="M 0,0 L 60,0 A 60,60 0 0,1 -30,51.96 Z" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
    
    <!-- Радиус сектора -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#856404" stroke-width="1"/>
    <text x="30" y="-5" font-family="Arial" font-size="12" fill="#856404">l</text>
    
    <!-- Дуга окружности -->
    <path d="M 60,0 A 60,60 0 0,1 -30,51.96" fill="none" stroke="#856404" stroke-width="2"/>
    <text x="45" y="25" font-family="Arial" font-size="12" fill="#856404">2πr</text>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(350, 120)">
    <rect x="-60" y="-20" width="120" height="140" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <!-- V = (1/3)πr²h -->
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">
      V = (1/3)πr²h
    </text>
    
    <!-- S = πr² -->
    <text x="0" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">
      S = πr²
    </text>
    
    <!-- Sбок = πrl -->
    <text x="0" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">
      Sбок = πrl
    </text>
    
    <!-- l = √(h² + r²) -->
    <text x="0" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#2c3e50">
      l = √(h² + r²)
    </text>
  </g>
  
  <!-- Вспомогательные элементы -->
  <!-- Угол при вершине -->
  <g transform="translate(250, 100)">
    <path d="M -20,0 A 20,20 0 0,1 20,0" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-10" font-family="Arial" font-size="12" text-anchor="middle" fill="#e74c3c">α</text>
  </g>
  
  <!-- Точка вершины -->
  <circle cx="250" cy="100" r="4" fill="#2c3e50"/>
  
  <!-- Осевое сечение (дополнительное) -->
  <g transform="translate(380, 200)">
    <rect x="-30" y="-40" width="60" height="80" fill="none" stroke="#3498db" stroke-width="1.5"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="0" y="-45" font-family="Arial" font-size="10" text-anchor="middle" fill="#3498db">2r</text>
    <text x="10" y="0" font-family="Arial" font-size="10" fill="#e74c3c">h</text>
  </g>
  
  <!-- Вспомогательные линии -->
  <g opacity="0.5">
    <line x1="50" y1="180" x2="450" y2="180" stroke="#bdc3c7" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="250" y1="50" x2="250" y2="300" stroke="#bdc3c7" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Пометки -->
  <g font-family="Arial" font-size="11" fill="#7f8c8d">
    <text x="40" y="200">основание</text>
    <text x="40" y="220">круг</text>
    <text x="340" y="290">развертка</text>
  </g>
  
  <!-- Дополнительные геометрические элементы -->
  <!-- Угол между высотой и образующей -->
  <g transform="translate(250, 180)">
    <path d="M -10,90 A 10,10 0 0,1 -10,70" fill="none" stroke="#16a085" stroke-width="1.5"/>
    <text x="-25" y="85" font-family="Arial" font-size="10" fill="#16a085">β</text>
  </g>
  
  <!-- Точки на окружности -->
  <g transform="translate(250, 280)">
    <circle cx="80" cy="0" r="3" fill="#2c3e50"/>
    <circle cx="0" cy="0" r="3" fill="#2c3e50"/>
    <circle cx="-80" cy="0" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Дуги для обозначения углов -->
  <g opacity="0.7">
    <path d="M 170,180 A 30,30 0 0,1 200,155" fill="none" stroke="#f39c12" stroke-width="1.5"/>
    <path d="M 300,155 A 30,30 0 0,1 330,180" fill="none" stroke="#f39c12" stroke-width="1.5"/>
  </g>
  
  <!-- Сетка точек для визуализации вращения -->
  <g opacity="0.3">
    <circle cx="250" cy="100" r="1" fill="#34495e"/>
    <circle cx="230" cy="120" r="1" fill="#34495e"/>
    <circle cx="270" cy="120" r="1" fill="#34495e"/>
    <circle cx="220" cy="140" r="1" fill="#34495e"/>
    <circle cx="280" cy="140" r="1" fill="#34495e"/>
    <circle cx="210" cy="160" r="1" fill="#34495e"/>
    <circle cx="290" cy="160" r="1" fill="#34495e"/>
  </g>
  
  <!-- Стрелки для обозначения направления вращения -->
  <g opacity="0.5">
    <path d="M 200,90 A 30,30 0 0,1 230,75" fill="none" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M 300,75 A 30,30 0 0,1 330,90" fill="none" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Определение конуса -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="150" height="50" fill="#d5e8d4" stroke="#82b366" stroke-width="1" rx="3"/>
    <text x="75" y="20" font-family="Arial" font-size="11" text-anchor="middle" fill="#2c3e50">
      Конус - тело
    </text>
    <text x="75" y="35" font-family="Arial" font-size="11" text-anchor="middle" fill="#2c3e50">
      вращения
    </text>
  </g>
  
  <!-- Определение треугольника -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="150" height="50" fill="#ffe6cc" stroke="#d79b00" stroke-width="1" rx="3"/>
    <text x="75" y="20" font-family="Arial" font-size="11" text-anchor="middle" fill="#2c3e50">
      Осевое сечение -
    </text>
    <text x="75" y="35" font-family="Arial" font-size="11" text-anchor="middle" fill="#2c3e50">
      равнобедренный Δ
    </text>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
</svg>