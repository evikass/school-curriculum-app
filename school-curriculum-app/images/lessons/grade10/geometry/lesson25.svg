<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Паттерн сетки -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bg)"/>
  <rect width="500" height="350" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3748" filter="url(#textShadow)">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">
    Урок 25: Уравнение прямой в пространстве
  </text>
  
  <!-- Оси координат -->
  <g id="axes">
    <!-- Ось X -->
    <line x1="50" y1="250" x2="450" y2="250" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Ось Y -->
    <line x1="100" y1="300" x2="100" y2="100" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Ось Z -->
    <line x1="100" y1="250" x2="200" y2="150" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Стрелки -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#2d3748"/>
      </marker>
    </defs>
    
    <!-- Подписи осей -->
    <text x="460" y="255" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">x</text>
    <text x="105" y="95" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">y</text>
    <text x="210" y="145" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">z</text>
  </g>
  
  <!-- Прямая в пространстве -->
  <g id="line">
    <!-- Точка на прямой -->
    <circle cx="150" cy="220" r="4" fill="#e53e3e"/>
    <text x="155" y="215" font-family="Arial, sans-serif" font-size="12" fill="#e53e3e">M₀(x₀,y₀,z₀)</text>
    
    <!-- Вектор направления -->
    <line x1="150" y1="220" x2="250" y2="170" stroke="#3182ce" stroke-width="3" marker-end="url(#blueArrow)"/>
    
    <defs>
      <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto">
        <polygon points="0 0, 8 2, 0 4" fill="#3182ce"/>
      </marker>
    </defs>
    
    <!-- Прямая -->
    <line x1="100" y1="245" x2="300" y2="155" stroke="#e53e3e" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Вектор направления метка -->
    <text x="180" y="185" font-family="Arial, sans-serif" font-size="14" fill="#3182ce" font-weight="bold">s</text>
  </g>
  
  <!-- Уравнение прямой -->
  <g id="equation">
    <rect x="50" y="290" width="400" height="45" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2d3748">
      Уравнение прямой:
    </text>
    <text x="250" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3182ce" font-weight="bold">
      (x-x₀)/a = (y-y₀)/b = (z-z₀)/c
    </text>
  </g>
  
  <!-- Пример точки -->
  <g id="example">
    <circle cx="200" cy="195" r="3" fill="#38a169"/>
    <text x="205" y="200" font-family="Arial, sans-serif" font-size="11" fill="#38a169">M(x,y,z)</text>
    
    <!-- Соединительная линия -->
    <line x1="150" y1="220" x2="200" y2="195" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Координаты на осях -->
  <g id="coords" font-family="Arial, sans-serif" font-size="10" fill="#718096">
    <text x="150" y="265">x₀</text>
    <text x="90" y="215">y₀</text>
    <text x="120" y="190">z₀</text>
  </g>
  
  <!-- Дополнительные элементы для наглядности -->
  <g id="additional" opacity="0.6">
    <!-- Параллельные линии -->
    <line x1="120" y1="235" x2="280" y2="165" stroke="#cbd5e0" stroke-width="1"/>
    <line x1="130" y1="230" x2="290" y2="160" stroke="#cbd5e0" stroke-width="1"/>
    
    <!-- Точки на осях -->
    <circle cx="150" cy="250" r="2" fill="#718096"/>
    <circle cx="100" cy="220" r="2" fill="#718096"/>
    <circle cx="130" cy="250" r="2" fill="#718096"/>
  </g>
  
  <!-- Формулы в углу -->
  <g id="formulas" opacity="0.8">
    <text x="350" y="120" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">s = {a,b,c}</text>
    <text x="350" y="140" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">M₀(x₀,y₀,z₀)</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g id="decor">
    <circle cx="80" cy="120" r="3" fill="#667eea" opacity="0.5"/>
    <circle cx="420" cy="280" r="3" fill="#667eea" opacity="0.5"/>
    <rect x="60" y="60" width="20" height="2" fill="#667eea" opacity="0.5"/>
    <rect x="420" y="60" width="20" height="2" fill="#667eea" opacity="0.5"/>
  </g>
  
  <!-- Номер урока -->
  <g id="lesson-number">
    <circle cx="450" cy="350" r="20" fill="#3182ce" opacity="0.1"/>
    <text x="450" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3182ce">25</text>
  </g>
</svg>