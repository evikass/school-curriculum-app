<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для призмы 1 -->
    <linearGradient id="prism1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Градиент для призмы 2 -->
    <linearGradient id="prism2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Градиент для призмы 3 -->
    <linearGradient id="prism3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">
    Урок 14: Призма. Виды призм
  </text>
  
  <!-- Призма 1: Треугольная -->
  <g transform="translate(80, 120)">
    <!-- Основание -->
    <polygon points="0,80 60,0 120,80" fill="url(#prism1Grad)" stroke="#1e40af" stroke-width="2" filter="url(#shadow)"/>
    <!-- Боковые грани -->
    <polygon points="0,80 0,120 60,40 60,0" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <polygon points="60,0 60,40 120,80 120,120" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <!-- Верхнее основание -->
    <polygon points="0,120 60,40 120,120" fill="#93bbfc" stroke="#1e40af" stroke-width="2"/>
    <!-- Надпись -->
    <text x="60" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Треугольная</text>
    <text x="60" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">n = 3</text>
  </g>
  
  <!-- Призма 2: Четырехугольная -->
  <g transform="translate(220, 100)">
    <!-- Основание -->
    <polygon points="0,100 100,0 200,100 100,200" fill="url(#prism2Grad)" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
    <!-- Боковые грани -->
    <polygon points="0,100 0,140 100,40 100,0" fill="#34d399" stroke="#047857" stroke-width="2"/>
    <polygon points="100,0 100,40 200,100 200,140" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <!-- Верхнее основание -->
    <polygon points="0,140 100,40 200,140 100,200" fill="#6ee7b7" stroke="#047857" stroke-width="2"/>
    <!-- Надпись -->
    <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Четырехугольная</text>
    <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">n = 4</text>
  </g>
  
  <!-- Призма 3: Шестиугольная -->
  <g transform="translate(60, 250)">
    <!-- Основание -->
    <polygon points="30,0 90,0 120,52 90,104 30,104 0,52" fill="url(#prism3Grad)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <!-- Боковые грани -->
    <polygon points="30,0 30,48 0,52 0,104 30,104 30,0" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <polygon points="90,0 90,48 120,52 120,104 90,104 90,0" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <!-- Верхнее основание -->
    <polygon points="30,48 90,48 120,100 90,104 30,104 0,100" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <!-- Надпись -->
    <text x="60" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Шестиугольная</text>
    <text x="60" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">n = 6</text>
  </g>
  
  <!-- Дополнительные элементы -->
  
  <!-- Оси координат -->
  <g transform="translate(400, 250)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="45" y="5" font-family="Arial, sans-serif" font-size="12" fill="#475569">x</text>
    <text x="-5" y="-45" font-family="Arial, sans-serif" font-size="12" fill="#475569">y</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Формулы -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="160" height="80" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Формула площади:</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#475569">S = P × h</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#475569">где P - периметр,</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#475569">h - высота призмы</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="30" cy="320" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#3b82f6" opacity="0.5"/>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="90" x2="450" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Геометрические фигуры -->
  <g transform="translate(380, 180)">
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>
  
  <!-- Точки вершины -->
  <circle cx="140" cy="120" r="3" fill="#1e40af"/>
  <circle cx="260" cy="100" r="3" fill="#047857"/>
  <circle cx="180" cy="252" r="3" fill="#d97706"/>
  
  <!-- Векторы -->
  <g transform="translate(200, 200)">
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#ef4444" stroke-width="2" marker-end="url(#redarrow)"/>
    <defs>
      <marker id="redarrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
      </marker>
    </defs>
  </g>
</svg>