<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f7fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Указатель урока -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    Урок 12: Расстояние от точки до плоскости. Расстояние между прямыми
  </text>
  
  <!-- Плоскость α -->
  <g transform="translate(100, 150)">
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="#3498db" opacity="0.3" stroke="#2980b9" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">α</text>
  </g>
  
  <!-- Точка A -->
  <g transform="translate(250, 80)">
    <circle cx="0" cy="0" r="5" fill="#e74c3c"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">A</text>
  </g>
  
  <!-- Перпендикуляр от точки A к плоскости α -->
  <line x1="250" y1="80" x2="250" y2="150" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Точка B (основание перпендикуляра) -->
  <g transform="translate(250, 150)">
    <circle cx="0" cy="0" r="4" fill="#e74c3c"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">B</text>
  </g>
  
  <!-- Расстояние d(A, α) -->
  <g transform="translate(270, 110)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#27ae60" stroke-width="2"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#27ae60" stroke-width="2"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#27ae60" stroke-width="2"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="14" fill="#27ae60">d(A, α)</text>
  </g>
  
  <!-- Первая прямая m -->
  <line x1="80" y1="150" x2="370" y2="150" stroke="#9b59b6" stroke-width="2"/>
  <text x="375" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b59b6">m</text>
  
  <!-- Вторая прямая n -->
  <line x1="150" y1="120" x2="350" y2="180" stroke="#f39c12" stroke-width="2"/>
  <text x="355" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f39c12">n</text>
  
  <!-- Общая точка прямых m и n -->
  <g transform="translate(250, 150)">
    <circle cx="0" cy="0" r="5" fill="#e67e22"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e67e22">C</text>
  </g>
  
  <!-- Перпендикуляр между прямыми (для скрещивающихся) -->
  <g transform="translate(180, 135)">
    <line x1="0" y1="0" x2="40" y2="15" stroke="#16a085" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="45" y="15" font-family="Arial, sans-serif" font-size="12" fill="#16a085">d(m, n)</text>
  </g>
  
  <!-- Вспомогательная точка на прямой m -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
  </g>
  
  <!-- Вспомогательная точка на прямой n -->
  <g transform="translate(200, 135)">
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
  </g>
  
  <!-- Угол между прямыми -->
  <path d="M 250 150 L 280 150 A 30 30 0 0 1 271.2 171.2" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="285" y="165" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">φ</text>
  
  <!-- Формула расстояния от точки до плоскости -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      d(A, α) = |Ax₀ + By₀ + Cz₀ + D| / √(A² + B² + C²)
    </text>
    <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      (Ax + By + Cz + D = 0 — уравнение плоскости α)
    </text>
  </g>
  
  <!-- Прямоугольник для выделения формулы -->
  <rect x="45" y="275" width="410" height="60" fill="none" stroke="#3498db" stroke-width="2" rx="5" opacity="0.5"/>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="30" r="3" fill="#3498db" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#e74c3c" opacity="0.5"/>
  <circle cx="30" cy="320" r="3" fill="#27ae60" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#f39c12" opacity="0.5"/>
  
  <!-- Указатели для понимания -->
  <g transform="translate(400, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      <tspan x="0" y="0">• d(A, α) — длина перпендикуляра</tspan>
      <tspan x="0" y="20">• d(m, n) — расстояние между прямыми</tspan>
    </text>
  </g>
  
  <!-- Сетка для наглядности -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ecf0f1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="350" fill="url(#grid)" opacity="0.5"/>
</svg>