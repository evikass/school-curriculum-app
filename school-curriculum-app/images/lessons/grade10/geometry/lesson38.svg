<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <g opacity="0.1">
    <circle cx="450" cy="50" r="80" fill="#3b82f6"/>
    <circle cx="50" cy="300" r="60" fill="#8b5cf6"/>
    <polygon points="480,150 520,100 560,150" fill="#06b6d4"/>
  </g>
  
  <!-- Заголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)">
    ГЕОМЕТРИЯ
  </text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#475569">
    10 КЛАСС
  </text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="110" width="440" height="210" rx="15" fill="white" filter="url(#shadow)"/>
  
  <!-- Разделы курса -->
  <g>
    <!-- Планиметрия -->
    <rect x="50" y="130" width="130" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1e40af">
      ПЛАНИМЕТРИЯ
    </text>
    <line x1="65" y1="165" x2="165" y2="165" stroke="#3b82f6" stroke-width="1"/>
    <text x="115" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Треугольники
    </text>
    <text x="115" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Четырёхугольники
    </text>
    <text x="115" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Окружности
    </text>
  </g>
  
  <g>
    <!-- Стереометрия -->
    <rect x="200" y="130" width="130" height="80" rx="10" fill="#e0e7ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="265" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#5b21b6">
      СТЕРЕОМЕТРИЯ
    </text>
    <line x1="215" y1="165" x2="315" y2="165" stroke="#8b5cf6" stroke-width="1"/>
    <text x="265" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Многогранники
    </text>
    <text x="265" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Тела вращения
    </text>
    <text x="265" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Векторы
    </text>
  </g>
  
  <g>
    <!-- Координаты -->
    <rect x="350" y="130" width="100" height="80" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#047857">
      КООРДИНАТЫ
    </text>
    <line x1="365" y1="165" x2="435" y2="165" stroke="#10b981" stroke-width="1"/>
    <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Прямоугольные
    </text>
    <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Полярные
    </text>
    <text x="400" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Уравнения
    </text>
  </g>
  
  <!-- Темы урока -->
  <g>
    <rect x="50" y="230" width="200" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#92400e">
      УРОК 38: ИТОГОВОЕ
    </text>
    <text x="150" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#92400e">
      ПОВТОРЕНИЕ
    </text>
    <text x="150" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Формулы и теоремы
    </text>
  </g>
  
  <g>
    <rect x="270" y="230" width="160" height="70" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="350" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#831843">
      ЗАДАНИЯ ДЛЯ
    </text>
    <text x="350" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#831843">
      ПОВТОРЕНИЯ
    </text>
    <text x="350" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      • Практические задания
    </text>
  </g>
  
  <!-- Декоративные геометрические фигуры -->
  <g opacity="0.3">
    <polygon points="80,180 95,160 110,180" fill="#3b82f6"/>
    <circle cx="130" cy="175" r="10" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="230" y="165" width="15" height="15" fill="#10b981"/>
    <polygon points="380,170 385,165 390,170 385,175" fill="#f59e0b"/>
  </g>
  
  <!-- Соединительные линии -->
  <g stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 180 170 L 200 170"/>
    <path d="M 330 170 L 350 170"/>
    <path d="M 150 210 L 150 230"/>
    <path d="M 350 210 L 350 230"/>
  </g>
  
  <!-- Номер урока -->
  <text x="470" y="30" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64748b">
    Урок 38
  </text>
</svg>