<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для объёмных тел -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E57373;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F5F5F5"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1A237E">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#3949AB">Урок 35: Объёмы призмы, пирамиды, цилиндра, конуса</text>
  
  <!-- Призма -->
  <g transform="translate(60, 100)">
    <path d="M 0 80 L 30 100 L 90 100 L 120 80 L 90 20 L 30 20 Z" fill="url(#prismGrad)" stroke="#0D47A1" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 0 80 L 0 120 L 30 140 L 30 100 Z" fill="#64B5F6" stroke="#0D47A1" stroke-width="2"/>
    <path d="M 30 100 L 30 140 L 90 140 L 90 100 Z" fill="#42A5F5" stroke="#0D47A1" stroke-width="2"/>
    <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0D47A1">Призма</text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1976D2">V = S·h</text>
  </g>
  
  <!-- Пирамида -->
  <g transform="translate(200, 100)">
    <path d="M 60 120 L 10 80 L 110 80 Z" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <path d="M 60 120 L 60 40 L 10 80 Z" fill="#FFA726" stroke="#E65100" stroke-width="2"/>
    <path d="M 60 40 L 110 80 L 60 120 Z" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
    <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E65100">Пирамида</text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#F57C00">V = S·h/3</text>
  </g>
  
  <!-- Цилиндр -->
  <g transform="translate(340, 100)">
    <ellipse cx="60" cy="40" rx="40" ry="15" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
    <rect x="20" y="40" width="80" height="80" fill="url(#cylinderGrad)" stroke="#2E7D32" stroke-width="2"/>
    <ellipse cx="60" cy="120" rx="40" ry="15" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
    <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2E7D32">Цилиндр</text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#388E3C">V = πR²·h</text>
  </g>
  
  <!-- Конус -->
  <g transform="translate(120, 230)">
    <ellipse cx="60" cy="90" rx="40" ry="15" fill="#E57373" stroke="#C62828" stroke-width="2"/>
    <path d="M 60 90 L 60 20 L 20 90 Z" fill="#EF5350" stroke="#C62828" stroke-width="2"/>
    <path d="M 60 90 L 60 20 L 100 90 Z" fill="#E53935" stroke="#C62828" stroke-width="2"/>
    <text x="60" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#C62828">Конус</text>
    <text x="60" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#D32F2F">V = πR²·h/3</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Сетка на фоне -->
  <g opacity="0.1">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000" stroke-width="1"/>
    </pattern>
    <rect width="500" height="350" fill="url(#grid)"/>
  </g>
  
  <!-- Формулы в виде карточек -->
  <g transform="translate(250, 230)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#FFF" stroke="#9E9E9E" stroke-width="1" filter="url(#shadow)"/>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#424242">S - площадь основания</text>
  </g>
  
  <!-- Геометрические символы -->
  <g transform="translate(20, 200)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#673AB7" stroke-width="2"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#673AB7">α</text>
  </g>
  
  <g transform="translate(20, 220)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#673AB7" stroke-width="2"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#673AB7">β</text>
  </g>
  
  <g transform="translate(20, 240)">
    <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="#673AB7" stroke-width="2"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#673AB7">γ</text>
  </g>
  
  <!-- Углы измерения -->
  <g transform="translate(60, 300)">
    <path d="M 0 0 L 30 0 A 30 30 0 0 0 15 -26" fill="none" stroke="#9C27B0" stroke-width="2"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#9C27B0">h</text>
  </g>
  
  <!-- Дополнительная информация -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="130" height="50" rx="5" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1"/>
    <text x="65" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3F51B5">Правильная фигура:</text>
    <text x="65" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5C6BC0">все грани равны</text>
  </g>
  
  <!-- Стрелки указатели -->
  <g transform="translate(90, 140)">
    <path d="M 0 0 L 20 0" stroke="#FF6F00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#FF6F00">h</text>
  </g>
  
  <g transform="translate(240, 140)">
    <path d="M 0 0 L 20 0" stroke="#FF6F00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#FF6F00">h</text>
  </g>
  
  <g transform="translate(380, 140)">
    <path d="M 0 0 L 20 0" stroke="#FF6F00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#FF6F00">h</text>
  </g>
  
  <g transform="translate(180, 270)">
    <path d="M 0 0 L 20 0" stroke="#FF6F00" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#FF6F00">h</text>
  </g>
  
  <!-- Стрелка маркер -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6F00"/>
    </marker>
  </defs>
  
  <!-- Дополнительные линии и точки -->
  <circle cx="90" cy="100" r="3" fill="#0D47A1"/>
  <circle cx="90" cy="120" r="3" fill="#0D47A1"/>
  <circle cx="260" cy="40" r="3" fill="#E65100"/>
  <circle cx="400" cy="40" r="3" fill="#2E7D32"/>
  <circle cx="180" cy="20" r="3" fill="#C62828"/>
  
  <!-- Подписи к элементам -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0D47A1">a</text>
  <text x="260" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#E65100">b</text>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">R</text>
  <text x="180" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#C62828">l</text>
</svg>