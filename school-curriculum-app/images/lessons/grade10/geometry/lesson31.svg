<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для шара -->
    <radialGradient id="sphereGradient">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="30%" stop-color="#b8e0ed"/>
      <stop offset="60%" stop-color="#7cc7d8"/>
      <stop offset="100%" stop-color="#4a9db5"/>
    </radialGradient>
    
    <radialGradient id="highlight">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f7fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">ГЕОМЕТРИЯ · 10 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Урок 31: Сфера и шар</text>
  
  <!-- Основной шар -->
  <g transform="translate(250, 200)">
    <circle r="80" fill="url(#sphereGradient)" filter="url(#shadow)"/>
    <ellipse cx="-20" cy="-30" rx="40" ry="30" fill="url(#highlight)" transform="rotate(-20)"/>
    
    <!-- Параллели шара -->
    <ellipse cx="0" cy="0" rx="80" ry="15" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="20" rx="80" ry="15" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="-20" rx="80" ry="15" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5"/>
    
    <!-- Меридианы шара -->
    <ellipse cx="0" cy="0" rx="15" ry="80" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="56" ry="80" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="56" ry="80" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.5" transform="rotate(-45)"/>
    
    <!-- Центр шара -->
    <circle cx="0" cy="0" r="3" fill="#2c3e50"/>
    
    <!-- Радиус -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="40" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">R</text>
  </g>
  
  <!-- Сфера (развертка) -->
  <g transform="translate(400, 150)">
    <!-- Полусфера -->
    <path d="M -30 0 A 30 30 0 0 1 30 0 Z" fill="#a9cce3" opacity="0.6"/>
    <!-- Круг-основание -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#85c1e9" opacity="0.8"/>
    <!-- Выступающие точки -->
    <circle cx="-30" cy="0" r="2" fill="#2c3e50"/>
    <circle cx="30" cy="0" r="2" fill="#2c3e50"/>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    
    <!-- Формула площади поверхности шара -->
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold">Площадь поверхности шара:</tspan> S = 4πR²
    </text>
    
    <!-- Формула объема шара -->
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold">Объем шара:</tspan> V = (4/3)πR³
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Точка на сфере -->
  <g transform="translate(250, 200)">
    <circle cx="40" cy="-40" r="4" fill="#e74c3c"/>
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  </g>
  
  <!-- Угол при центре -->
  <g transform="translate(250, 200)">
    <path d="M 0 0 L 40 0 A 40 40 0 0 1 28.28 -28.28 Z" fill="#f39c12" opacity="0.3"/>
    <text x="25" y="-10" font-family="Arial, sans-serif" font-size="12" fill="#d68910">α</text>
  </g>
  
  <!-- Различные проекции шара -->
  <g transform="translate(100, 150)">
    <circle r="25" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Круг</text>
  </g>
  
  <g transform="translate(100, 220)">
    <ellipse rx="25" ry="15" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Эллипс</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="30" cy="100" r="3" fill="#3498db"/>
    <circle cx="470" cy="120" r="3" fill="#3498db"/>
    <circle cx="450" cy="300" r="3" fill="#3498db"/>
    <circle cx="50" cy="320" r="3" fill="#3498db"/>
  </g>
  
  <!-- Линии сетки -->
  <g stroke="#ecf0f1" stroke-width="0.5">
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
  </g>
</svg>