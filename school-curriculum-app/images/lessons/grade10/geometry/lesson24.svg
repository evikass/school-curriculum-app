<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <!-- Тень для текста -->
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="30" fill="#3b82f6" opacity="0.1"/>
  <circle cx="50" cy="300" r="40" fill="#10b981" opacity="0.1"/>
  <circle cx="420" cy="320" r="25" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    ГЕОМЕТРИЯ · 10 КЛАСС
  </text>
  
  <!-- Номер урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">
    Урок 24: Уравнение плоскости
  </text>
  
  <!-- Система координат -->
  <g transform="translate(100, 200)">
    <!-- Ось X -->
    <line x1="0" y1="0" x2="300" y2="0" stroke="#334155" stroke-width="2" marker-end="url(#arrowX)"/>
    <!-- Ось Y -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#334155" stroke-width="2" marker-end="url(#arrowY)"/>
    <!-- Ось Z -->
    <line x1="0" y1="0" x2="-80" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#arrowZ)"/>
    
    <!-- Метки осей -->
    <text x="310" y="5" font-family="Arial" font-size="16" fill="#334155">x</text>
    <text x="5" y="-155" font-family="Arial" font-size="16" fill="#334155">y</text>
    <text x="-85" y="95" font-family="Arial" font-size="16" fill="#334155">z</text>
    
    <!-- Плоскость -->
    <polygon points="0,-100 200,-50 150,50 -50,0" fill="#3b82f6" fill-opacity="0.3" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Нормаль к плоскости -->
    <line x1="50" y1="-25" x2="0" y2="-50" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowN)"/>
    <text x="5" y="-55" font-family="Arial" font-size="14" fill="#dc2626">n</text>
    
    <!-- Точка на плоскости -->
    <circle cx="50" cy="-25" r="4" fill="#dc2626"/>
    <text x="55" y="-20" font-family="Arial" font-size="12" fill="#dc2626">M(x₀,y₀,z₀)</text>
  </g>
  
  <!-- Уравнение плоскости -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="50" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="5"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">
      A(x - x₀) + B(y - y₀) + C(z - z₀) = 0
    </text>
  </g>
  
  <!-- Декоративные линии -->
  <line x1="20" y1="100" x2="480" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="250" x2="480" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Вектор нормали компоненты -->
  <g transform="translate(350, 150)">
    <circle cx="0" cy="0" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#92400e">
      n(A,B,C)
    </text>
  </g>
  
  <!-- Пунктирная линия от вектора к плоскости -->
  <line x1="350" y1="150" x2="200" y2="175" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="15" height="15" fill="#3b82f6" opacity="0.5"/>
    <text x="20" y="12" font-family="Arial" font-size="12" fill="#64748b">Плоскость</text>
  </g>
  
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="15" height="15" fill="#dc2626" opacity="0.5"/>
    <text x="20" y="12" font-family="Arial" font-size="12" fill="#64748b">Нормаль</text>
  </g>
  
  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrowX" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="3" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,0 L3,9 z" fill="#334155"/>
    </marker>
    <marker id="arrowZ" markerWidth="10" markerHeight="10" refX="8" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,0 L3,9 z" fill="#334155" transform="rotate(-45)"/>
    </marker>
    <marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="470" cy="80" r="4" fill="#10b981" opacity="0.3"/>
  <circle cx="450" cy="200" r="2" fill="#f59e0b" opacity="0.3"/>
  
  <!-- Геометрические фигуры для украшения -->
  <g transform="translate(400, 250)">
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#cbd5e1" stroke-width="1" transform="rotate(45)"/>
  </g>
  
  <g transform="translate(60, 200)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>
</svg>