<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="#1e3a8a" stroke-width="2" rx="10"/>
  
  <!-- Внутренняя рамка -->
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,5" rx="5"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="url(#titleGradient)" font-weight="bold">Итоговое повторение синтаксиса и пунктуации</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="75" x2="450" y2="75" stroke="#3b82f6" stroke-width="1"/>
  
  <!-- Простое предложение -->
  <g transform="translate(50, 90)">
    <rect width="180" height="80" fill="url(#boxGradient)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">ПРОСТОЕ ПРЕДЛОЖЕНИЕ</text>
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Одна грамматическая основа</text>
    <text x="90" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Одно сказуемое</text>
    <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" font-style="italic">Пример: весной прилетели птицы</text>
  </g>
  
  <!-- Сложное предложение -->
  <g transform="translate(270, 90)">
    <rect width="180" height="80" fill="url(#boxGradient)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">СЛОЖНОЕ ПРЕДЛОЖЕНИЕ</text>
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Две или более грамматические основы</text>
    <text x="90" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Два или более сказуемых</text>
    <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" font-style="italic">Пример: когда солнышко скрылось, пошел дождь</text>
  </g>
  
  <!-- Виды связи в СПП -->
  <g transform="translate(50, 190)">
    <rect width="400" height="120" fill="url(#boxGradient)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">ВИДЫ СВЯЗИ В СЛОЖНОМ ПРЕДЛОЖЕНИИ</text>
    
    <!-- Бессоюзная связь -->
    <rect x="10" y="30" width="120" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Бессоюзная связь</text>
    <text x="70" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">точка, запятая, точка с запятой</text>
    
    <!-- Сочинительная связь -->
    <rect x="140" y="30" width="120" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Сочинительная связь</text>
    <text x="200" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">и, да, а, но, зато, однако</text>
    
    <!-- Подчинительная связь -->
    <rect x="270" y="30" width="120" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="330" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Подчинительная связь</text>
    <text x="330" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">когда, если, что, чтобы</text>
    
    <!-- Примеры -->
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#4b5563">Примеры:</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">1. Бессоюзная: Шел дождь, ветер свистел.</text>
    <text x="150" y="105" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">2. Сочинительная: Он пришел, и мы пошли гулять.</text>
    <text x="290" y="105" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">3. Подчинительная: Когда он пришел, мы пошли гулять.</text>
  </g>
  
  <!-- Таблица знаков препинания -->
  <g transform="translate(50, 320)">
    <rect width="400" height="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="20" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Знаки препинания</text>
    <text x="100" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Место</text>
    <text x="200" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Пример</text>
    <text x="350" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Пояснение</text>
  </g>
  
  <!-- Дополнительные элементы для детализации -->
  <circle cx="450" cy="30" r="8" fill="#3b82f6" opacity="0.3"/>
  <circle cx="440" cy="40" r="6" fill="#60a5fa" opacity="0.3"/>
  <circle cx="460" cy="40" r="6" fill="#60a5fa" opacity="0.3"/>
  
  <!-- Иконки -->
  <path d="M30 30 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" fill="#3b82f6" opacity="0.3"/>
  <path d="M30 30 m-5,0 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0" fill="none" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="30" y1="25" x2="30" y2="35" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="25" y1="30" x2="35" y2="30" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Декоративные элементы -->
  <rect x="20" y="120" width="5" height="5" fill="#3b82f6" opacity="0.5"/>
  <rect x="475" y="120" width="5" height="5" fill="#3b82f6" opacity="0.5"/>
  <rect x="20" y="250" width="5" height="5" fill="#3b82f6" opacity="0.5"/>
  <rect x="475" y="250" width="5" height="5" fill="#3b82f6" opacity="0.5"/>
  
  <!-- Линии для связей -->
  <line x1="140" y1="130" x2="140" y2="190" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="130" x2="360" y2="190" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="250" y1="170" x2="250" y2="190" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
</svg>