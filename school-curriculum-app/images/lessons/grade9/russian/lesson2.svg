<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c4f7c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="url(#grad1)" stroke-width="3" rx="10" ry="10"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#bdc3c7" stroke-width="1" rx="8" ry="8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle" font-style="italic">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="18" fill="url(#grad1)" text-anchor="middle" font-weight="bold">Сложносочинённое предложение (ССП)</text>
  <text x="30" y="25" font-family="Arial, sans-serif" font-size="14" fill="#95a5a6">Урок 15</text>
  
  <!-- Основные части ССП -->
  <rect x="40" y="70" width="140" height="40" fill="url(#grad2)" rx="5" ry="5"/>
  <text x="110" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Часть 1</text>
  
  <rect x="320" y="70" width="140" height="40" fill="url(#grad2)" rx="5" ry="5"/>
  <text x="390" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Часть 2</text>
  
  <!-- Союз -->
  <ellipse cx="250" cy="90" rx="50" ry="25" fill="url(#grad3)"/>
  <text x="250" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Союз</text>
  
  <!-- Стрелки -->
  <path d="M180 90 L195 90" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M305 90 L320 90" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелки маркеры -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Таблица союзов -->
  <rect x="40" y="130" width="420" height="180" fill="#ecf0f1" rx="5" ry="5" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Заголовок таблицы -->
  <rect x="40" y="130" width="420" height="30" fill="url(#grad1)" rx="5" ry="5"/>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Виды союзов в ССП</text>
  
  <!-- Соединительные союзы -->
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">Соединительные:</text>
  <rect x="170" y="165" width="50" height="25" fill="url(#grad3)" rx="3" ry="3"/>
  <text x="195" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">и</text>
  <rect x="230" y="165" width="50" height="25" fill="url(#grad3)" rx="3" ry="3"/>
  <text x="255" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">а</text>
  <rect x="290" y="165" width="50" height="25" fill="url(#grad3)" rx="3" ry="3"/>
  <text x="315" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">и</text>
  <rect x="350" y="165" width="50" height="25" fill="url(#grad3)" rx="3" ry="3"/>
  <text x="375" y="182" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">даже</text>
  <text x="60" y="200" font="Arial, sans-serif" font-size="12" fill="#7f8c8d">Смысл: присоединение, сложение</text>
  
  <!-- Противительные союзы -->
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">Противительные:</text>
  <rect x="170" y="210" width="50" height="25" fill="url(#grad2)" rx="3" ry="3"/>
  <text x="195" y="227" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">но</text>
  <rect x="230" y="210" width="50" height="25" fill="url(#grad2)" rx="3" ry="3"/>
  <text x="255" y="227" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">а</text>
  <rect x="290" y="210" width="50" height="25" fill="url(#grad2)" rx="3" ry="3"/>
  <text x="315" y="227" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">однако</text>
  <rect x="350" y="210" width="50" height="25" fill="url(#grad2)" rx="3" ry="3"/>
  <text x="375" y="227" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">зато</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Смысл: противопоставление</text>
  
  <!-- Разделительные союзы -->
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">Разделительные:</text>
  <rect x="170" y="260" width="50" height="25" fill="url(#grad4)" rx="3" ry="3"/>
  <text x="195" y="277" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">или</text>
  <rect x="230" y="260" width="50" height="25" fill="url(#grad4)" rx="3" ry="3"/>
  <text x="255" y="277" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">либо</text>
  <rect x="290" y="260" width="50" height="25" fill="url(#grad4)" rx="3" ry="3"/>
  <text x="315" y="277" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">то</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Смысл: альтернатива, выбор</text>
  
  <!-- Примеры предложений -->
  <rect x="40" y="320" width="200" height="20" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3" ry="3"/>
  <text x="50" y="334" font-family="Arial, sans-serif" font-size="11" fill="#495057">Пример:天气很好，我们去公园。</text>
  
  <rect x="260" y="320" width="200" height="20" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3" ry="3"/>
  <text x="270" y="334" font-family="Arial, sans-serif" font-size="11" fill="#495057">Пример:Он устал, но продолжил работу.</text>
  
  <!-- Знаки препинания -->
  <circle cx="30" cy="90" r="8" fill="#f39c12"/>
  <text x="30" y="95" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">?</text>
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">знаки</text>
  
  <!-- Дополнительные элементы для детализации -->
  <rect x="20" y="120" width="15" height="15" fill="url(#grad5)" rx="2" ry="2"/>
  <rect x="20" y="140" width="15" height="15" fill="url(#grad5)" rx="2" ry="2"/>
  <rect x="20" y="160" width="15" height="15" fill="url(#grad5)" rx="2" ry="2"/>
  
  <!-- Указатели на виды союзов -->
  <path d="M170 177 L165 177" stroke="#3498db" stroke-width="2"/>
  <path d="M170 222 L165 222" stroke="#e74c3c" stroke-width="2"/>
  <path d="M170 272 L165 272" stroke="#2ecc71" stroke-width="2"/>
  
  <!-- Синтаксический разбор примера -->
  <rect x="470" y="130" width="25" height="180" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3" ry="3"/>
  <text x="482" y="150" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">С</text>
  <text x="482" y="170" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">С</text>
  <line x1="475" y1="160" x2="489" y2="160" stroke="#495057" stroke-width="1"/>
</svg>