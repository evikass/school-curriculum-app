<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#1e40af" stroke-width="3" rx="10"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="50" fill="url(#headerGrad)" rx="5"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="18" font-weight="600">Культура речи. Нормы русского языка</text>
  
  <!-- Основной контейнер -->
  <g transform="translate(30, 105)">
    <!-- Орфоэпические нормы -->
    <rect x="0" y="0" width="210" height="80" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="105" y="25" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Орфоэпические нормы</text>
    <text x="10" y="45" fill="#78350f" font-family="Arial, sans-serif" font-size="12">• Произношение слов</text>
    <text x="10" y="60" fill="#78350f" font-family="Arial, sans-serif" font-size="12">• Ударение</text>
    <text x="10" y="75" fill="#78350f" font-family="Arial, sans-serif" font-size="12">• Звукопроизношение</text>
    
    <!-- Лексические нормы -->
    <rect x="220" y="0" width="210" height="80" fill="url(#boxGrad2)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="325" y="25" text-anchor="middle" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Лексические нормы</text>
    <text x="230" y="45" fill="#1e40af" font-family="Arial, sans-serif" font-size="12">• Значение слов</text>
    <text x="230" y="60" fill="#1e40af" font-family="Arial, sans-serif" font-size="12">• Употребление слов</text>
    <text x="230" y="75" fill="#1e40af" font-family="Arial, sans-serif" font-size="12">• Стилистическая окраска</text>
    
    <!-- Грамматические нормы -->
    <rect x="0" y="95" width="210" height="80" fill="url(#boxGrad3)" stroke="#10b981" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="105" y="120" text-anchor="middle" fill="#064e3b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Грамматические нормы</text>
    <text x="10" y="140" fill="#065f46" font-family="Arial, sans-serif" font-size="12">• Правила согласования</text>
    <text x="10" y="155" fill="#065f46" font-family="Arial, sans-serif" font-size="12">• Порядок слов</text>
    <text x="10" y="170" fill="#065f46" font-family="Arial, sans-serif" font-size="12">• Формы слов</text>
    
    <!-- Речевые ошибки -->
    <rect x="220" y="95" width="210" height="80" fill="url(#boxGrad4)" stroke="#ec4899" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="325" y="120" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Речевые ошибки</text>
    <text x="230" y="140" fill="#9f1239" font-family="Arial, sans-serif" font-size="12">• Орфографические</text>
    <text x="230" y="155" fill="#9f1239" font-family="Arial, sans-serif" font-size="12">• Пунктуационные</text>
    <text x="230" y="170" fill="#9f1239" font-family="Arial, sans-serif" font-size="12">• Стилистические</text>
    
    <!-- Паронимы -->
    <rect x="110" y="190" width="210" height="60" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="215" y="215" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Паронимы</text>
    <text x="120" y="235" fill="#4b5563" font-family="Arial, sans-serif" font-size="12">Слова, похожие по звучанию</text>
    <text x="120" y="248" fill="#4b5563" font-family="Arial, sans-serif" font-size="12">но разные по значению</text>
    
    <!-- Синонимы -->
    <rect x="0" y="270" width="100" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="50" y="295" text-anchor="middle" fill="#78350f" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Синонимы</text>
    <text x="50" y="308" fill="#92400e" font-family="Arial, sans-serif" font-size="11">Слова с близким значением</text>
    
    <!-- Антонимы -->
    <rect x="110" y="270" width="100" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="160" y="295" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Антонимы</text>
    <text x="160" y="308" fill="#2563eb" font-family="Arial, sans-serif" font-size="11">Слова с противоположным значением</text>
    
    <!-- Точность речи -->
    <rect x="220" y="270" width="100" height="50" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="270" y="295" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Точность</text>
    <text x="270" y="308" fill="#047857" font-family="Arial, sans-serif" font-size="11">Соответствие смысла</text>
    
    <!-- Выразительность речи -->
    <rect x="330" y="270" width="100" height="50" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="380" y="295" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Выразительность</text>
    <text x="380" y="308" fill="#be185d" font-family="Arial, sans-serif" font-size="11">Эмоциональная окраска</text>
    
    <!-- Иконки -->
    <!-- Звуковая волна -->
    <path d="M 25 15 Q 30 10, 35 15 T 45 15" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 25 20 Q 30 15, 35 20 T 45 20" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 25 25 Q 30 20, 35 25 T 45 25" stroke="#f59e0b" stroke-width="2" fill="none"/>
    
    <!-- Словарь -->
    <rect x="245" y="35" width="15" height="20" fill="#3b82f6" rx="1"/>
    <line x1="248" y1="40" x2="257" y2="40" stroke="white" stroke-width="1"/>
    <line x1="248" y1="44" x2="257" y2="44" stroke="white" stroke-width="1"/>
    <line x1="248" y1="48" x2="253" y2="48" stroke="white" stroke-width="1"/>
    
    <!-- Грамматика -->
    <circle cx="25" cy="130" r="8" fill="#10b981"/>
    <text x="25" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Г</text>
    
    <!-- Ошибка -->
    <text x="245" y="130" fill="#ec4899" font-family="Arial, sans-serif" font-size="16" font-weight="bold">!</text>
    
    <!-- Стрелки связей -->
    <path d="M 215 80 L 215 95" stroke="#6b7280" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 105 175 L 105 190" stroke="#6b7280" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 325 175 L 325 190" stroke="#6b7280" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 50 270 L 50 260 L 160 260 L 160 270" stroke="#6b7280" stroke-width="1" fill="none"/>
    <path d="M 160 270 L 160 260 L 270 260 L 270 270" stroke="#6b7280" stroke-width="1" fill="none"/>
    <path d="M 270 270 L 270 260 L 380 260 L 380 270" stroke="#6b7280" stroke-width="1" fill="none"/>
    
    <!-- Стрелка -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
      </marker>
    </defs>
    
    <!-- Примеры паронимов -->
    <text x="85" y="200" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">наклонить/наклоняться</text>
    <text x="85" y="212" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">лакей/лагерь</text>
    <text x="85" y="224" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">погибнуть/погибать</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="480" cy="30" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="470" cy="40" r="2" fill="#10b981" opacity="0.5"/>
  <circle cx="490" cy="45" r="2.5" fill="#f59e0b" opacity="0.5"/>
  
  <text x="250" y="340" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10" font-style="italic">Культура речи — это искусство говорить и писать правильно и красиво</text>
</svg>