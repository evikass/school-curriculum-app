<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновая рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#4a90e2" stroke-width="3" rx="10"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" fill="url(#headerGrad)" rx="10 10 0 0"/>
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Основной контент -->
  <g transform="translate(30, 80)">
    <!-- Блок: Обособленные приложения -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="210" height="90" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="105" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Обособленные приложения</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#555">Тот самый, золотой,</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="12" fill="#555">лист, упал на землю.</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#777">Приложение выделено</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#777">запятыми</text>
    </g>
    
    <!-- Блок: Обособленные дополнения -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="210" height="90" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="105" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Обособленные дополнения</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#555">Я смотрел, с затаённым</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="12" fill="#555">дыханием, на закат.</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#777">Дополнение обособлено</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#777">деепричастным оборотом</text>
    </g>
    
    <!-- Блок: Уточняющие члены -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="210" height="90" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="105" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Уточняющие члены</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#555">Только вчера я узнал</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="12" fill="#555">об этом важном событии.</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#777">Уточнение выделено</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#777">вводными словами</text>
    </g>
    
    <!-- Блок: Цитирование -->
    <g transform="translate(230, 110)">
      <rect x="0" y="0" width="210" height="90" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="105" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Цитирование</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#555">Пушкин писал:</text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">«Ученье — свет, а</text>
      <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">невежество — тьма».</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#777">Кавычки и запятые</text>
    </g>
    
    <!-- Блок: Прямая речь -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="440" height="60" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="220" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Прямая речь</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#555">— Помогите мне, — попросил он.</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#777">Двоеточие, тире, кавычки</text>
    </g>
    
    <!-- Блок: Диалог -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="440" height="30" fill="url(#boxGrad)" stroke="#4a90e2" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
      <text x="220" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Диалог: Каждый новый абзац — новая реплика</text>
    </g>
    
    <!-- Декоративные элементы -->
    <circle cx="15" cy="15" r="3" fill="#4a90e2"/>
    <circle cx="405" cy="15" r="3" fill="#4a90e2"/>
    <circle cx="15" cy="285" r="3" fill="#4a90e2"/>
    <circle cx="405" cy="285" r="3" fill="#4a90e2"/>
    
    <!-- Разделители -->
    <line x1="210" y1="10" x2="210" y2="90" stroke="#4a90e2" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
    <line x1="210" y1="120" x2="210" y2="200" stroke="#4a90e2" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
    
    <!-- Иконки для каждого блока -->
    <g transform="translate(185, 35)">
      <path d="M0,5 L5,0 L10,5 L10,15 L0,15 Z" fill="#4a90e2" opacity="0.7"/>
    </g>
    <g transform="translate(415, 35)">
      <path d="M0,5 L5,0 L10,5 L10,15 L0,15 Z" fill="#4a90e2" opacity="0.7"/>
    </g>
    <g transform="translate(185, 145)">
      <path d="M0,5 L5,0 L10,5 L10,15 L0,15 Z" fill="#4a90e2" opacity="0.7"/>
    </g>
    <g transform="translate(415, 145)">
      <path d="M0,5 L5,0 L10,5 L10,15 L0,15 Z" fill="#4a90e2" opacity="0.7"/>
    </g>
    <g transform="translate(415, 245)">
      <path d="M0,5 L5,0 L10,5 L10,15 L0,15 Z" fill="#4a90e2" opacity="0.7"/>
    </g>
    
    <!-- Нижняя подпись -->
    <text x="220" y="255" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">Пунктуация в осложнённом предложении</text>
  </g>
</svg>