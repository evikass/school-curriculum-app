<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff2e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd8bf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6ffed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9f7be;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bubbleGrad">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#1890ff" stroke-width="2" rx="5"/>
  
  <!-- Заголовок класса -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="30" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1890ff">Урок 12</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1890ff" text-anchor="middle">Типы химических реакций</text>
  
  <!-- Основная формула реакции -->
  <rect x="150" y="80" width="200" height="50" fill="#f0f5ff" stroke="#1890ff" stroke-width="1.5" rx="5"/>
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="16" fill="#1890ff" text-anchor="middle">A + B → C + D</text>
  
  <!-- Стрелка реакции -->
  <path d="M 100 120 L 130 120 L 130 115 M 130 120 L 130 125" stroke="#1890ff" stroke-width="2" fill="none"/>
  <text x="115" y="140" font-family="Arial, sans-serif" font-size="12" fill="#1890ff" text-anchor="middle">реагенты</text>
  
  <path d="M 370 120 L 400 120 L 400 115 M 400 120 L 400 125" stroke="#1890ff" stroke-width="2" fill="none"/>
  <text x="385" y="140" font-family="Arial, sans-serif" font-size="12" fill="#1890ff" text-anchor="middle">продукты</text>
  
  <!-- Изменение цвета -->
  <rect x="50" y="170" width="100" height="80" fill="url(#blueGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Изменение</text>
  <text x="100" y="215" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">цвета</text>
  <circle cx="70" cy="230" r="8" fill="#1890ff"/>
  <circle cx="100" cy="230" r="8" fill="#52c41a"/>
  <circle cx="130" cy="230" r="8" fill="#ff4d4f"/>
  
  <!-- Выделение газа -->
  <rect x="170" y="170" width="100" height="80" fill="url(#blueGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="220" y="195" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Выделение</text>
  <text x="220" y="215" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">газа</text>
  <circle cx="220" cy="235" r="12" fill="url(#bubbleGrad)" stroke="#1890ff" stroke-width="1"/>
  <circle cx="200" cy="225" r="6" fill="url(#bubbleGrad)" stroke="#1890ff" stroke-width="0.5"/>
  <circle cx="240" cy="220" r="8" fill="url(#bubbleGrad)" stroke="#1890ff" stroke-width="0.5"/>
  
  <!-- Выпадение осадка -->
  <rect x="290" y="170" width="100" height="80" fill="url(#blueGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="340" y="195" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Выпадение</text>
  <text x="340" y="215" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">осадка</text>
  <rect x="310" y="230" width="60" height="15" fill="#52c41a" opacity="0.3"/>
  <rect x="315" y="235" width="50" height="10" fill="#52c41a"/>
  
  <!-- Выделение тепла -->
  <rect x="50" y="270" width="100" height="60" fill="url(#redGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Выделение</text>
  <text x="100" y="315" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">тепла</text>
  <path d="M 75 305 L 85 295 L 95 300 L 105 290 L 115 295 L 125 285" stroke="#ff4d4f" stroke-width="2" fill="none"/>
  
  <!-- Поглощение тепла -->
  <rect x="170" y="270" width="100" height="60" fill="url(#blueGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="220" y="295" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Поглощение</text>
  <text x="220" y="315" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">тепла</text>
  <path d="M 195 305 L 205 315 L 215 310 L 225 320 L 235 315 L 245 325" stroke="#1890ff" stroke-width="2" fill="none"/>
  
  <!-- Появление запаха -->
  <rect x="290" y="270" width="100" height="60" fill="url(#greenGrad)" stroke="#1890ff" stroke-width="1.5"/>
  <text x="340" y="295" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">Появление</text>
  <text x="340" y="315" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="middle">запаха</text>
  <path d="M 320 305 Q 330 295 340 305 Q 350 295 360 305" stroke="#52c41a" stroke-width="2" fill="none"/>
  <path d="M 315 310 Q 325 300 335 310 Q 345 300 355 310 Q 365 300 375 310" stroke="#52c41a" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Лабораторная колба 1 -->
  <path d="M 420 100 L 420 140 Q 420 150 410 150 L 380 150 Q 370 150 370 140 L 370 100 Z" fill="#e6f7ff" stroke="#1890ff" stroke-width="1.5"/>
  <ellipse cx="395" cy="100" rx="25" ry="5" fill="#1890ff"/>
  <text x="395" y="165" font-family="Arial, sans-serif" font-size="10" fill="#1890ff" text-anchor="middle">Колба А</text>
  
  <!-- Лабораторная колба 2 -->
  <path d="M 420 180 L 420 220 Q 420 230 410 230 L 380 230 Q 370 230 370 220 L 370 180 Z" fill="#fff2e8" stroke="#1890ff" stroke-width="1.5"/>
  <ellipse cx="395" cy="180" rx="25" ry="5" fill="#1890ff"/>
  <text x="395" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1890ff" text-anchor="middle">Колба Б</text>
  
  <!-- Молекула А -->
  <circle cx="390" cy="125" r="6" fill="#1890ff"/>
  <circle cx="405" cy="130" r="6" fill="#52c41a"/>
  <line x1="390" y1="125" x2="405" y2="130" stroke="#333" stroke-width="1"/>
  
  <!-- Молекула Б -->
  <circle cx="385" cy="205" r="6" fill="#ff4d4f"/>
  <circle cx="400" cy="200" r="6" fill="#722ed1"/>
  <circle cx="405" cy="215" r="6" fill="#fa8c16"/>
  <line x1="385" y1="205" x2="400" y2="200" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="200" x2="405" y2="215" stroke="#333" stroke-width="1"/>
  
  <!-- Стрелка между колбами -->
  <path d="M 395 155 L 395 175" stroke="#1890ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1890ff"/>
    </marker>
  </defs>
  
  <!-- Подпись к реакции -->
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Химическая реакция — это превращение одних веществ в другие</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="120" r="5" fill="#1890ff"/>
  <circle cx="470" cy="120" r="5" fill="#1890ff"/>
  
  <!-- Декоративные линии -->
  <line x1="20" y1="90" x2="480" y2="90" stroke="#1890ff" stroke-width="0.5" stroke-dasharray="5,5"/>
  <line x1="20" y1="340" x2="480" y2="340" stroke="#1890ff" stroke-width="0.5" stroke-dasharray="5,5"/>
  
  <!-- Подписи к признакам -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 1</text>
  <text x="220" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 2</text>
  <text x="340" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 3</text>
  <text x="100" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 4</text>
  <text x="220" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 5</text>
  <text x="340" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Признак 6</text>
</svg>