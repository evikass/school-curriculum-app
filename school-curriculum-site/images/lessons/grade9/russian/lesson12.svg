<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9e2ec;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="#34495e" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" fill="url(#headerGrad)" rx="3" ry="3"/>
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Заголовок темы -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Правописание приставок и суффиксов</text>
  
  <!-- Блок приставок ПРИ- и ПРЕ- -->
  <rect x="20" y="100" width="220" height="110" fill="url(#boxGrad)" stroke="#3498db" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="130" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Приставки ПРИ- и ПРЕ-</text>
  
  <rect x="30" y="135" width="100" height="30" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="3" ry="3"/>
  <text x="80" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">ПРИ-</text>
  
  <text x="140" y="150" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">близость, приближение</text>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">приближение, добавление</text>
  
  <rect x="30" y="175" width="100" height="30" fill="#fef5e7" stroke="#f39c12" stroke-width="1" rx="3" ry="3"/>
  <text x="80" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">ПРЕ-</text>
  
  <text x="140" y="190" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">высокая степень качества</text>
  <text x="140" y="205" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">близость, значение "очень"</text>
  
  <!-- Блок на З- и С- -->
  <rect x="260" y="100" width="220" height="110" fill="url(#boxGrad)" stroke="#e74c3c" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="370" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Правописание на З- и С-</text>
  
  <text x="270" y="150" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">С- пишется:</text>
  <text x="280" y="165" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• перед глухими согласными</text>
  <text x="280" y="178" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• в приставках: С-, СО-, С- (перед глухими)</text>
  
  <text x="270" y="195" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">З- пишется:</text>
  <text x="280" y="210" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• перед звонкими согласными и гласными</text>
  
  <!-- Блок суффиксов существительных -->
  <rect x="20" y="220" width="220" height="110" fill="url(#boxGrad)" stroke="#27ae60" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="130" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Суффиксы существительных</text>
  
  <text x="30" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Основные суффиксы:</text>
  <text x="40" y="280" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -ость, -от-, -ет- (отвечают на вопрос "какой?")</text>
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -ик, -ек, -ок (лица и предметы)</text>
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -ени-, -ани- (от глаголов)</text>
  <text x="40" y="325" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -ищ-, -ищ- (увеличительность)</text>
  
  <!-- Блок суффиксов прилагательных и глаголов -->
  <rect x="260" y="220" width="220" height="110" fill="url(#boxGrad)" stroke="#9b59b6" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="370" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Прилагательные и глаголы</text>
  
  <text x="270" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Прилагательные:</text>
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -н-, -нн- (причастия, отглагольные)</text>
  <text x="280" y="295" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -еньк-, -оньк- (уменьшительно-ласк.)</text>
  
  <text x="270" y="315" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Глаголы:</text>
  <text x="280" y="330" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• -ива-, -ыва- (совершенный вид)</text>
  
  <!-- Блок Н и НН -->
  <rect x="140" y="100" width="220" height="110" fill="url(#boxGrad)" stroke="#e67e22" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Н и НН в разных частях речи</text>
  
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Пишется Н:</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• в прилагательных с суффиксами -к-, -ск-</text>
  <text x="160" y="178" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• в кратких прилагательных</text>
  
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Пишется НН:</text>
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• в полных причастиях и отглагольных прилагательных</text>
  
  <!-- Декоративные элементы -->
  <circle cx="25" cy="25" r="5" fill="#3498db" opacity="0.5"/>
  <circle cx="475" cy="25" r="5" fill="#e74c3c" opacity="0.5"/>
  <circle cx="25" cy="325" r="5" fill="#27ae60" opacity="0.5"/>
  <circle cx="475" cy="325" r="5" fill="#9b59b6" opacity="0.5"/>
  
  <!-- Примеры слов -->
  <text x="130" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">примеры: прилежный, предсказать, знамение, смена</text>
</svg>