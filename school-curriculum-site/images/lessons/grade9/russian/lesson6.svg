<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5490;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d7eaa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a4365;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="3" rx="5" ry="5" />
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="1" rx="3" ry="3" />
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5282">Сложные предложения с разными видами связи</text>
  
  <!-- Блок 1: Определение -->
  <rect x="30" y="85" width="210" height="80" fill="url(#boxGrad)" stroke="#3182ce" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)" />
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5282">Многочленные СПП:</text>
  <text x="40" y="125" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">сочетание ССП, СПП и БСП</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">Пример: Когда пришла весна,</text>
  <text x="50" y="160" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">солнце светило ярко, и птицы</text>
  
  <!-- Блок 2: Виды связи -->
  <rect x="260" y="85" width="210" height="80" fill="url(#boxGrad)" stroke="#3182ce" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)" />
  <text x="270" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5282">Виды связи:</text>
  <circle cx="280" cy="125" r="3" fill="#e53e3e" />
  <text x="290" y="130" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">ССП - сочинительная</text>
  <circle cx="280" cy="145" r="3" fill="#38a169" />
  <text x="290" y="150" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">СПП - подчинительная</text>
  <circle cx="280" cy="165" r="3" fill="#3182ce" />
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">БСП - бессоюзная</text>
  
  <!-- Блок 3: Пример предложения -->
  <rect x="30" y="185" width="440" height="50" fill="url(#boxGrad)" stroke="#805ad5" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)" />
  <text x="40" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5282">Пример:</text>
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">Когда наступила ночь, </text>
  <text x="140" y="225" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">звёзды зажглись, </text>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">и луна осветила дорогу.</text>
  
  <!-- Таблица знаков препинания -->
  <rect x="30" y="245" width="440" height="80" fill="url(#boxGrad)" stroke="#805ad5" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)" />
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5282">Знаки препинания:</text>
  
  <!-- Столбцы таблицы -->
  <line x1="40" y1="275" x2="200" y2="275" stroke="#cbd5e0" stroke-width="1" />
  <line x1="200" y1="275" x2="360" y2="275" stroke="#cbd5e0" stroke-width="1" />
  <line x1="360" y1="275" x2="460" y2="275" stroke="#cbd5e0" stroke-width="1" />
  
  <!-- Строка 1 -->
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">Вводные слова</text>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">Союзные слова</text>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">Союзы</text>
  
  <!-- Строка 2 -->
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">видимо, вероятно,</text>
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">когда, чтобы, если</text>
  <text x="360" y="310" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">и, а, но</text>
  
  <!-- Схема разбора -->
  <line x1="70" y1="215" x2="70" y2="225" stroke="#e53e3e" stroke-width="1" />
  <line x1="170" y1="215" x2="170" y2="225" stroke="#38a169" stroke-width="1" />
  <line x1="250" y1="215" x2="250" y2="225" stroke="#3182ce" stroke-width="1" />
  
  <!-- Указатели -->
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="8" fill="#e53e3e" text-anchor="end">ССП</text>
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="8" fill="#38a169" text-anchor="end">СПП</text>
  <text x="240" y="210" font-family="Arial, sans-serif" font-size="8" fill="#3182ce" text-anchor="end">ССП</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="470" cy="30" r="8" fill="#e53e3e" opacity="0.7" />
  <circle cx="480" cy="40" r="6" fill="#38a169" opacity="0.7" />
  <circle cx="475" cy="50" r="5" fill="#3182ce" opacity="0.7" />
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>
  
  <!-- Синтаксическая схема -->
  <line x1="40" y1="315" x2="120" y2="315" stroke="#4a5568" stroke-width="1" marker-end="url(#arrowhead)" />
  <line x1="120" y1="315" x2="200" y2="315" stroke="#4a5568" stroke-width="1" marker-end="url(#arrowhead)" />
  <line x1="200" y1="315" x2="280" y2="315" stroke="#4a5568" stroke-width="1" marker-end="url(#arrowhead)" />
  <line x1="280" y1="315" x2="360" y2="315" stroke="#4a5568" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <!-- Текст под схемой -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">Часть 1</text>
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">Часть 2</text>
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">Часть 3</text>
  <text x="280" y="330" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">Часть 4</text>
</svg>