<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="atomGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a52;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#339af0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#495057" stroke-width="2" rx="5" />
  
  <!-- Номер урока -->
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Урок 15</text>
  
  <!-- Заголовок "ХИМИЯ · 9 КЛАСС" -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Периодический закон</text>
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">(1869 г.)</text>
  
  <!-- Портрет Менделеева -->
  <circle cx="80" cy="140" r="25" fill="#ffd43b" />
  <circle cx="80" cy="130" r="15" fill="#495057" />
  <path d="M65,145 Q80,135 95,145 L95,165 L65,165 Z" fill="#495057" />
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Д.И. Менделеев</text>
  
  <!-- Атомная модель -->
  <circle cx="250" cy="140" r="30" fill="url(#atomGrad)" />
  <circle cx="250" cy="140" r="25" fill="none" stroke="#495057" stroke-width="1" />
  <circle cx="235" cy="140" r="4" fill="#495057" />
  <circle cx="265" cy="140" r="4" fill="#495057" />
  <circle cx="250" cy="125" r="4" fill="#495057" />
  <circle cx="250" cy="155" r="4" fill="#495057" />
  <circle cx="235" cy="125" r="4" fill="#495057" />
  <circle cx="265" cy="125" r="4" fill="#495057" />
  <circle cx="235" cy="155" r="4" fill="#495057" />
  <circle cx="265" cy="155" r="4" fill="#495057" />
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Атом</text>
  
  <!-- Стрелка закона -->
  <line x1="320" y1="140" x2="400" y2="140" stroke="url(#arrowGrad)" stroke-width="3" />
  <polygon points="400,140 390,135 390,145" fill="#339af0" />
  
  <!-- Периодическая таблица (упрощенная) -->
  <rect x="100" y="210" width="300" height="100" fill="#f8f9fa" stroke="#495057" stroke-width="1" rx="5" />
  
  <!-- Первая строка таблицы -->
  <rect x="110" y="220" width="50" height="30" fill="#ffd43b" stroke="#495057" stroke-width="1" />
  <text x="135" y="240" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">Li</text>
  <text x="135" y="252" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">3</text>
  
  <rect x="170" y="220" width="50" height="30" fill="#ffd43b" stroke="#495057" stroke-width="1" />
  <text x="195" y="240" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">Na</text>
  <text x="195" y="252" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">11</text>
  
  <rect x="230" y="220" width="50" height="30" fill="#ffd43b" stroke="#495057" stroke-width="1" />
  <text x="255" y="240" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">K</text>
  <text x="255" y="252" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">19</text>
  
  <!-- Вторая строка таблицы -->
  <rect x="140" y="260" width="50" height="30" fill="#ff8787" stroke="#495057" stroke-width="1" />
  <text x="165" y="280" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">Be</text>
  <text x="165" y="292" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">4</text>
  
  <rect x="200" y="260" width="50" height="30" fill="#ff8787" stroke="#495057" stroke-width="1" />
  <text x="225" y="280" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">Mg</text>
  <text x="225" y="292" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">12</text>
  
  <!-- Подписи к таблице -->
  <text x="120" y="320" font-family="Arial, sans-serif" font-size="12" fill="#495057">Период</text>
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="12" fill="#495057">Группа</text>
  
  <!-- Вертикальная линия разделения -->
  <line x1="280" y1="220" x2="280" y2="290" stroke="#495057" stroke-width="1" stroke-dasharray="3,3" />
  
  <!-- Надпись о законе -->
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">Свойства элементов зависят</text>
  <text x="250" y="224" font-family="Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle">от их порядкового номера</text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="420" cy="100" r="3" fill="#495057" />
  <circle cx="430" cy="110" r="3" fill="#495057" />
  <circle cx="410" cy="110" r="3" fill="#495057" />
  <circle cx="425" cy="95" r="3" fill="#495057" />
  
  <!-- Указатель периода -->
  <path d="M135,250 L135,270 L165,270" stroke="#495057" stroke-width="1" fill="none" />
  <text x="125" y="265" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="end">I</text>
  
  <!-- Указатель группы -->
  <path d="M270,275 L280,275 L280,245" stroke="#495057" stroke-width="1" fill="none" />
  <text x="285" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057">IA</text>
  
  <!-- Подписи к атомам -->
  <text x="135" y="105" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Литий</text>
  <text x="195" y="105" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Натрий</text>
  <text x="255" y="105" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Калий</text>
  <text x="165" y="325" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Бериллий</text>
  <text x="225" y="325" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Магний</text>
  
  <!-- Значение атомных масс -->
  <text x="135" y="205" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">6.94</text>
  <text x="195" y="205" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">22.99</text>
  <text x="255" y="205" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">39.10</text>
  <text x="165" y="305" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">9.01</text>
  <text x="225" y="305" font-family="Arial, sans-serif" font-size="9" fill="#868e96" text-anchor="middle">24.31</text>
  
  <!-- Год открытия -->
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">1869 г.</text>
  
  <!-- Цитата Менделеева -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">"Я ожидаю, что открытие элементов</text>
  <text x="250" y="352" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">будет продолжаться"</text>
</svg>