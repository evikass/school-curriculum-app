<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="bubbleGrad">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#2C3E50" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Номер урока -->
  <rect x="20" y="20" width="40" height="30" fill="#3498DB" rx="5" ry="5"/>
  <text x="40" y="40" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">24</text>
  
  <!-- "ХИМИЯ · 9 КЛАСС" -->
  <text x="250" y="40" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="14" font-weight="bold">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="70" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="18" font-weight="bold">Массовая доля вещества в растворе</text>
  
  <!-- Колба для раствора -->
  <path d="M150 120 L150 200 Q150 250 200 250 Q250 250 250 200 L250 120 Z" fill="url(#glassGrad)" stroke="#34495E" stroke-width="2"/>
  
  <!-- Жидкость в колбе -->
  <path d="M155 200 Q155 245 200 245 Q245 245 245 200 Z" fill="url(#liquidGrad)"/>
  
  <!-- Пузырьки в жидкости -->
  <circle cx="180" cy="220" r="3" fill="url(#bubbleGrad)"/>
  <circle cx="210" cy="230" r="2" fill="url(#bubbleGrad)"/>
  <circle cx="225" cy="215" r="2.5" fill="url(#bubbleGrad)"/>
  <circle cx="190" cy="235" r="2" fill="url(#bubbleGrad)"/>
  <circle cx="215" cy="225" r="1.5" fill="url(#bubbleGrad)"/>
  
  <!-- Уровень жидкости -->
  <line x1="155" y1="200" x2="245" y2="200" stroke="#2980B9" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Лейка над колбой -->
  <path d="M130 100 L130 120 L140 120 L140 110 L150 110 L150 120 L160 120 L160 100 Z" fill="none" stroke="#34495E" stroke-width="2"/>
  <path d="M125 95 L135 95 L135 100 L155 100 L155 95 L165 95" fill="none" stroke="#34495E" stroke-width="2"/>
  
  <!-- Капли из лейки -->
  <path d="M140 125 Q142 130 140 135" fill="none" stroke="#3498DB" stroke-width="1.5"/>
  <path d="M145 125 Q147 130 145 135" fill="none" stroke="#3498DB" stroke-width="1.5"/>
  <path d="M150 125 Q152 130 150 135" fill="none" stroke="#3498DB" stroke-width="1.5"/>
  
  <!-- Весы -->
  <rect x="300" y="200" width="100" height="5" fill="#34495E"/>
  <rect x="345" y="180" width="5" height="25" fill="#34495E"/>
  <rect x="310" y="185" width="70" height="15" fill="#7F8C8D" rx="2" ry="2"/>
  
  <!-- Весы шкала -->
  <rect x="280" y="205" width="2" height="10" fill="#34495E"/>
  <rect x="418" y="205" width="2" height="10" fill="#34495E"/>
  <rect x="275" y="215" width="150" height="3" fill="#34495E"/>
  
  <!-- Весы деления -->
  <line x1="290" y1="210" x2="290" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="310" y1="210" x2="310" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="330" y1="210" x2="330" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="350" y1="210" x2="350" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="370" y1="210" x2="370" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="390" y1="210" x2="390" y2="215" stroke="#34495E" stroke-width="1"/>
  <line x1="410" y1="210" x2="410" y2="215" stroke="#34495E" stroke-width="1"/>
  
  <!-- Формула -->
  <rect x="120" y="270" width="260" height="50" fill="#ECF0F1" stroke="#34495E" stroke-width="1" rx="5" ry="5"/>
  <text x="250" y="295" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="16" font-weight="bold">ω = m(вещества) / m(раствора) × 100%</text>
  <text x="250" y="310" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="12">где ω — массовая доля</text>
  
  <!-- Подписи -->
  <text x="200" y="150" text-anchor="middle" fill="#2980B9" font-family="Arial" font-size="12">m(вещества)</text>
  <line x1="200" y1="155" x2="200" y2="195" stroke="#2980B9" stroke-width="1" stroke-dasharray="3,2"/>
  
  <text x="280" y="150" text-anchor="middle" fill="#2980B9" font-family="Arial" font-size="12">m(растворителя)</text>
  <line x1="280" y1="155" x2="240" y2="195" stroke="#2980B9" stroke-width="1" stroke-dasharray="3,2"/>
  
  <text x="200" y="260" text-anchor="middle" fill="#2980B9" font-family="Arial" font-size="12">m(раствора)</text>
  <line x1="200" y1="255" x2="200" y2="200" stroke="#2980B9" stroke-width="1" stroke-dasharray="3,2"/>
  
  <text x="350" y="190" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="12">весы</text>
  
  <text x="130" y="90" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="12">лейка</text>
  
  <text x="160" y="140" text-anchor="middle" fill="#E74C3C" font-family="Arial" font-size="10">растворяемое</text>
  <text x="160" y="152" text-anchor="middle" fill="#E74C3C" font-family="Arial" font-size="10">вещество</text>
  
  <text x="280" y="175" text-anchor="middle" fill="#16A085" font-family="Arial" font-size="10">растворитель</text>
  
  <text x="120" y="110" text-anchor="middle" fill="#9B59B6" font-family="Arial" font-size="10">добавление</text>
  <text x="120" y="122" text-anchor="middle" fill="#9B59B6" font-family="Arial" font-size="10">вещества</text>
  
  <text x="450" y="210" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">г</text>
  
  <text x="280" y="240" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">г</text>
  
  <text x="200" y="280" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">г</text>
  
  <text x="420" y="190" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">0</text>
  
  <text x="290" y="230" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">50</text>
  
  <text x="330" y="230" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">100</text>
  
  <text x="370" y="230" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">150</text>
  
  <text x="410" y="230" text-anchor="middle" fill="#34495E" font-family="Arial" font-size="10">200</text>
  
  <text x="450" y="250" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="10">масса (г)</text>
  
  <text x="250" y="250" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="10">%</text>
  
  <text x="380" y="140" text-anchor="middle" fill="#F39C12" font-family="Arial" font-size="11">ω = 25%</text>
  
  <!-- Стрелки -->
  <path d="M130 130 L140 130" stroke="#34495E" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M240 130 L250 130" stroke="#34495E" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E"/>
    </marker>
  </defs>
</svg>