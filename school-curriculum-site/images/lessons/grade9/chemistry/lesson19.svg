<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4d4d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d8d8d;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="corrosionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновая область -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#333" stroke-width="2" rx="5" />
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#666" stroke-width="1" rx="3" />
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">ЖЕЛЕЗО И СПЛАВЫ. КОРРОЗИЯ МЕТАЛЛОВ</text>
  <text x="250" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Урок 12</text>
  
  <!-- Атом железа -->
  <g transform="translate(100, 120)">
    <!-- Ядро -->
    <circle cx="0" cy="0" r="15" fill="url(#atomGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">26</text>
    
    <!-- Электронные орбиты -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="45" ry="15" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#333" stroke-width="1" opacity="0.5" />
    
    <!-- Электроны -->
    <circle cx="30" cy="0" r="3" fill="#4dabf7" />
    <circle cx="-30" cy="0" r="3" fill="#4dabf7" />
    <circle cx="0" cy="-10" r="3" fill="#4dabf7" />
    <circle cx="0" cy="10" r="3" fill="#4dabf7" />
    
    <circle cx="45" cy="0" r="3" fill="#4dabf7" />
    <circle cx="-45" cy="0" r="3" fill="#4dabf7" />
    <circle cx="0" cy="-15" r="3" fill="#4dabf7" />
    <circle cx="0" cy="15" r="3" fill="#4dabf7" />
    
    <circle cx="60" cy="0" r="3" fill="#4dabf7" />
    <circle cx="-60" cy="0" r="3" fill="#4dabf7" />
    <circle cx="0" cy="-20" r="3" fill="#4dabf7" />
    <circle cx="0" cy="20" r="3" fill="#4dabf7" />
    <circle cx="35" cy="-12" r="3" fill="#4dabf7" />
    <circle cx="-35" cy="-12" r="3" fill="#4dabf7" />
    
    <!-- Подпись -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Атом железа (Fe)</text>
    <text x="0" y="57" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Z = 26, A = 56</text>
  </g>
  
  <!-- Свойства железа -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="120" height="80" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="3" />
    <text x="60" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Свойства</text>
    
    <line x1="10" y1="22" x2="110" y2="22" stroke="#333" stroke-width="0.5" />
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="8" fill="#333">Плотность: 7.87 г/см³</text>
    <text x="10" y="47" font-family="Arial, sans-serif" font-size="8" fill="#333">Т.пл.: 1538°C</text>
    <text x="10" y="59" font-family="Arial, sans-serif" font-size="8" fill="#333">Т.кип.: 2862°C</text>
    <text x="10" y="71" font-family="Arial, sans-serif" font-size="8" fill="#333">Окисление: +2, +3</text>
  </g>
  
  <!-- Оксиды железа -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="180" height="100" fill="#fff5f5" stroke="#333" stroke-width="1" rx="3" />
    <text x="90" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Оксиды и гидроксиды</text>
    
    <line x1="10" y1="22" x2="170" y2="22" stroke="#333" stroke-width="0.5" />
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="8" fill="#333">FeO - оксид(II)железа</text>
    <text x="10" y="47" font-family="Arial, sans-serif" font-size="8" fill="#333">Fe₂O₃ - оксид(III)железа</text>
    <text x="10" y="59" font-family="Arial, sans-serif" font-size="8" fill="#333">Fe(OH)₂ - гидроксид(II)железа</text>
    <text x="10" y="71" font-family="Arial, sans-serif" font-size="8" fill="#333">Fe(OH)₃ - гидроксид(III)железа</text>
    <text x="10" y="83" font-family="Arial, sans-serif" font-size="8" fill="#333">4Fe + 3O₂ → 2Fe₂O₃</text>
  </g>
  
  <!-- Сплавы железа -->
  <g transform="translate(300, 220)">
    <rect x="0" y="0" width="180" height="100" fill="#f0f9ff" stroke="#333" stroke-width="1" rx="3" />
    <text x="90" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Сплавы железа</text>
    
    <line x1="10" y1="22" x2="170" y2="22" stroke="#333" stroke-width="0.5" />
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="8" fill="#333">Чугун: C 2-4.5%, Si 0.5-3%</text>
    <text x="10" y="47" font-family="Arial, sans-serif" font-size="8" fill="#333">Сталь: C 0.1-2.0%</text>
    <text x="10" y="59" font-family="Arial, sans-serif" font-size="8" fill="#333">Нержавейка: Cr 10-20%</text>
    <text x="10" y="71" font-family="Arial, sans-serif" font-size="8" fill="#333">Феррит: C 0.02%, Mn 0.8%</text>
    <text x="10" y="83" font-family="Arial, sans-serif" font-size="8" fill="#333">Аустенит: C 1.2%, Ni 8-25%</text>
  </g>
  
  <!-- Коррозия -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="140" height="50" fill="#fff8e1" stroke="#333" stroke-width="1" rx="3" />
    <text x="70" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Коррозия</text>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">4Fe + 3O₂ + 6H₂O →</text>
    <text x="70" y="42" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">4Fe(OH)₃</text>
  </g>
  
  <!-- Защита от коррозии -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="140" height="50" fill="#e8f5e9" stroke="#333" stroke-width="1" rx="3" />
    <text x="70" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Защита от коррозии</text>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">• Гальванопокрытие</text>
    <text x="70" y="42" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">• Лакокрасочные покрытия</text>
  </g>
  
  <!-- Изображение корродированного металла -->
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="100" height="70" fill="url(#ironGrad)" stroke="#333" stroke-width="1" rx="2" />
    <rect x="10" y="10" width="80" height="50" fill="url(#corrosionGrad)" opacity="0.7" rx="1" />
    <path d="M20,15 L30,25 L25,35 L35,45 L20,55" fill="none" stroke="#654321" stroke-width="2" opacity="0.8" />
    <path d="M40,20 L50,15 L60,25 L55,35 L65,30" fill="none" stroke="#654321" stroke-width="2" opacity="0.8" />
    <path d="M70,20 L80,15 L85,25 L75,35" fill="none" stroke="#654321" stroke-width="2" opacity="0.8" />
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="320" r="5" fill="#4dabf7" opacity="0.3" />
  <circle cx="460" cy="310" r="3" fill="#ff6b6b" opacity="0.3" />
  <circle cx="440" cy="310" r="4" fill="#51cf66" opacity="0.3" />
  
  <line x1="420" y1="300" x2="430" y2="310" stroke="#333" stroke-width="1" opacity="0.3" />
  <line x1="430" y1="300" x2="420" y2="310" stroke="#333" stroke-width="1" opacity="0.3" />
  
  <!-- Химическая формула ржавчины -->
  <g transform="translate(350, 180)">
    <rect x="0" y="0" width="120" height="25" fill="#fff3cd" stroke="#333" stroke-width="1" rx="2" />
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Fe₂O₃·nH₂O</text>
  </g>
</svg>