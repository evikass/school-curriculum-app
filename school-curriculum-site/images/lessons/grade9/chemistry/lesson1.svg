<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nucleusGradient">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" rx="10" ry="10" fill="none" stroke="#2d3436" stroke-width="2"/>
  
  <!-- Номер урока -->
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="14" fill="#636e72">Урок 3</text>
  
  <!-- ХИМИЯ · 9 КЛАСС -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="16" fill="#2d3436" text-anchor="middle" font-weight="bold">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="22" fill="#2d3436" text-anchor="middle" font-weight="bold">Строение атома</text>
  
  <!-- Атомарная орбита 1 (самая внутренняя) -->
  <ellipse cx="250" cy="200" rx="40" ry="120" fill="none" stroke="#dfe6e9" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Атомарная орбита 2 -->
  <ellipse cx="250" cy="200" rx="80" ry="80" fill="none" stroke="#dfe6e9" stroke-width="1.5" stroke-dasharray="5,5" transform="rotate(45 250 200)"/>
  
  <!-- Атомарная орбита 3 -->
  <ellipse cx="250" cy="200" rx="120" ry="60" fill="none" stroke="#dfe6e9" stroke-width="1.5" stroke-dasharray="5,5" transform="rotate(-30 250 200)"/>
  
  <!-- Ядро атома -->
  <circle cx="250" cy="200" r="35" fill="url(#nucleusGradient)" filter="url(#shadow)"/>
  
  <!-- Протоны в ядре -->
  <circle cx="235" cy="190" r="8" fill="url(#redGradient)"/>
  <circle cx="250" cy="195" r="8" fill="url(#redGradient)"/>
  <circle cx="240" cy="210" r="8" fill="url(#redGradient)"/>
  <circle cx="255" cy="210" r="8" fill="url(#redGradient)"/>
  <circle cx="265" cy="195" r="8" fill="url(#redGradient)"/>
  
  <!-- Нейтроны в ядре -->
  <circle cx="245" cy="200" r="8" fill="#636e72"/>
  <circle cx="260" cy="185" r="8" fill="#636e72"/>
  <circle cx="230" cy="205" r="8" fill="#636e72"/>
  <circle cx="265" cy="210" r="8" fill="#636e72"/>
  <circle cx="235" cy="220" r="8" fill="#636e72"/>
  <circle cx="250" cy="210" r="8" fill="#636e72"/>
  
  <!-- Электроны на орбитах -->
  <!-- Орбита 1 -->
  <circle cx="250" cy="80" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="320" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Орбита 2 -->
  <circle cx="330" cy="200" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="45 250 200" to="405 250 200" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="200" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="45 250 200" to="405 250 200" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Орбита 3 -->
  <circle cx="330" cy="170" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="-30 250 200" to="330 250 200" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="230" r="6" fill="url(#blueGradient)">
    <animateTransform attributeName="transform" type="rotate" from="-30 250 200" to="330 250 200" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Указатели на протоны -->
  <line x1="250" y1="190" x2="220" y2="170" stroke="#d63031" stroke-width="1" marker-end="url(#arrowred)"/>
  <line x1="250" y1="195" x2="280" y2="175" stroke="#d63031" stroke-width="1" marker-end="url(#arrowred)"/>
  
  <!-- Указатели на нейтроны -->
  <line x1="250" y1="210" x2="280" y2="230" stroke="#636e72" stroke-width="1" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="200" x2="220" y2="220" stroke="#636e72" stroke-width="1" marker-end="url(#arrowgray)"/>
  
  <!-- Стрелки для указателей -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d63031"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#636e72"/>
    </marker>
  </defs>
  
  <!-- Подписи к компонентам -->
  <!-- Протоны -->
  <text x="210" y="165" font-family="Arial, sans-serif" font-size="12" fill="#d63031" font-weight="bold">Протоны</text>
  <text x="210" y="180" font-family="Arial, sans-serif" font-size="10" fill="#d63031">p⁺, заряд +1</text>
  
  <!-- Нейтроны -->
  <text x="285" y="235" font-family="Arial, sans-serif" font-size="12" fill="#636e72" font-weight="bold">Нейтроны</text>
  <text x="285" y="250" font-family="Arial, sans-serif" font-size="10" fill="#636e72">n⁰, заряд 0</text>
  
  <!-- Ядро -->
  <text x="250" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2d3436" text-anchor="middle" font-weight="bold">ЯДРО</text>
  
  <!-- Электроны -->
  <text x="340" y="195" font-family="Arial, sans-serif" font-size="12" fill="#0984e3" font-weight="bold">Электроны</text>
  <text x="340" y="210" font-family="Arial, sans-serif" font-size="10" fill="#0984e3">e⁻, заряд -1</text>
  
  <!-- Орбиты -->
  <text x="360" y="320" font-family="Arial, sans-serif" font-size="11" fill="#636e72">Электронные орбиты</text>
  
  <!-- Слой 1 -->
  <text x="120" y="85" font-family="Arial, sans-serif" font-size="10" fill="#0984e3">K-слой</text>
  
  <!-- Слой 2 -->
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="10" fill="#0984e3">L-слой</text>
  
  <!-- Слой 3 -->
  <text x="360" y="235" font-family="Arial, sans-serif" font-size="10" fill="#0984e3">M-слой</text>
  
  <!-- Определение атома -->
  <rect x="20" y="270" width="460" height="60" rx="5" ry="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Атом</text>
  <text x="30" y="305" font-family="Arial, sans-serif" font-size="10" fill="#495057">— наименьшая частица химического элемента,</text>
  <text x="30" y="320" font-family="Arial, sans-serif" font-size="10" fill="#495057">сохраняющая его химические свойства.</text>
  
  <!-- Масса частиц -->
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold">Масса:</text>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="10" fill="#495057">протон ≈ 1 а.е.м.</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="10" fill="#495057">нейтрон ≈ 1 а.е.м.</text>
  
  <!-- Название элемента (пример) -->
  <text x="250" cy="155" font-family="Arial, sans-serif" font-size="14" fill="#2d3436" text-anchor="middle" font-weight="bold">Углерод (C)</text>
</svg>