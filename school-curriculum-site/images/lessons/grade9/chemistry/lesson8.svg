<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для иллюстрации -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae7ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0.9" />
    </linearGradient>
    
    <radialGradient id="ionGradient">
      <stop offset="0%" style="stop-color:#ffd666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faad14;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="moleculeGradient">
      <stop offset="0%" style="stop-color:#73d13d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#52c41a;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGradient)" stroke-width="3" rx="10" ry="10"/>
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#e6f7ff" stroke-width="1" rx="8" ry="8"/>
  
  <!-- Заголовок и класс -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#096dd9">ХИМИЯ · 9 КЛАСС</text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1890ff">Растворы. Электролитическая диссоциация</text>
  <text x="470" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#1890ff">Урок №12</text>
  
  <!-- Стакан с раствором -->
  <path d="M150 100 L160 250 L340 250 L350 100 Z" fill="url(#glassGradient)" stroke="#1890ff" stroke-width="2"/>
  <rect x="150" y="95" width="200" height="10" fill="url(#glassGradient)" stroke="#1890ff" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Вода -->
  <rect x="155" y="105" width="190" height="140" fill="url(#waterGradient)" opacity="0.7"/>
  
  <!-- Молекулы воды -->
  <circle cx="180" cy="130" r="8" fill="#52c41a" opacity="0.6"/>
  <circle cx="195" cy="135" r="6" fill="#1890ff" opacity="0.6"/>
  <circle cx="175" cy="145" r="6" fill="#1890ff" opacity="0.6"/>
  
  <circle cx="250" cy="150" r="8" fill="#52c41a" opacity="0.6"/>
  <circle cx="265" cy="155" r="6" fill="#1890ff" opacity="0.6"/>
  <circle cx="245" cy="165" r="6" fill="#1890ff" opacity="0.6"/>
  
  <circle cx="320" cy="180" r="8" fill="#52c41a" opacity="0.6"/>
  <circle cx="305" cy="185" r="6" fill="#1890ff" opacity="0.6"/>
  <circle cx="325" cy="195" r="6" fill="#1890ff" opacity="0.6"/>
  
  <!-- Электролит до диссоциации -->
  <rect x="230" y="200" width="40" height="20" fill="url(#moleculeGradient)" rx="10" ry="10"/>
  <text x="250" y="214" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">NaCl</text>
  
  <!-- Стрелка диссоциации -->
  <path d="M250 240 L250 260" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fa8c16"/>
    </marker>
  </defs>
  
  <!-- Ионы после диссоциации -->
  <circle cx="230" cy="280" r="12" fill="url(#ionGradient)"/>
  <text x="230" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Na⁺</text>
  
  <circle cx="270" cy="280" r="12" fill="url(#ionGradient)"/>
  <text x="270" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Cl⁻</text>
  
  <!-- Электрическое поле -->
  <line x1="190" y1="270" x2="190" y2="290" stroke="#ff4d4f" stroke-width="2"/>
  <line x1="195" y1="270" x2="195" y2="290" stroke="#ff4d4f" stroke-width="2"/>
  <line x1="200" y1="270" x2="200" y2="290" stroke="#ff4d4f" stroke-width="2"/>
  <text x="195" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ff4d4f">+</text>
  
  <line x1="300" y1="270" x2="300" y2="290" stroke="#1890ff" stroke-width="2"/>
  <line x1="295" y1="270" x2="295" y2="290" stroke="#1890ff" stroke-width="2"/>
  <line x1="290" y1="270" x2="290" y2="290" stroke="#1890ff" stroke-width="2"/>
  <text x="295" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1890ff">−</text>
  
  <!-- Подписи к рисунку -->
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Электролитическая диссоциация</text>
  
  <!-- Сильные электролиты -->
  <rect x="20" y="180" width="120" height="100" fill="#f0f5ff" stroke="#1890ff" stroke-width="1" rx="5" ry="5"/>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#096dd9">Сильные</text>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">электролиты</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">HCl, H₂SO₄, HNO₃,</text>
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">NaOH, KOH, NaCl</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">Диссоциация полная</text>
  
  <!-- Слабые электролиты -->
  <rect x="360" y="180" width="120" height="100" fill="#fff0f6" stroke="#ff4d4f" stroke-width="1" rx="5" ry="5"/>
  <text x="420" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#cf1322">Слабые</text>
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">электролиты</text>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">CH₃COOH, H₂CO₃,</text>
  <text x="420" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">NH₄OH, H₂S</text>
  <text x="420" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">Диссоциация обратима</text>
  
  <!-- Неэлектролиты -->
  <rect x="190" y="180" width="120" height="100" fill="#f6ffed" stroke="#52c41a" stroke-width="1" rx="5" ry="5"/>
  <text x="250" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#389e0d">Неэлектролиты</text>
  <text x="250" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">в воде не диссоциируют</text>
  <text x="250" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">C₆H₁₂O₆, C₂H₅OH,</text>
  <text x="250" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">C₁₂H₂₂O₁₁, CH₄</text>
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">Не проводят ток</text>
  
  <!-- Уравнение диссоциации -->
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">NaCl → Na⁺ + Cl⁻</text>
  
  <!-- Дополнительные молекулы воды -->
  <circle cx="200" cy="170" r="6" fill="#52c41a" opacity="0.4"/>
  <circle cx="210" cy="175" r="5" fill="#1890ff" opacity="0.4"/>
  <circle cx="195" cy="180" r="5" fill="#1890ff" opacity="0.4"/>
  
  <circle cx="300" cy="160" r="6" fill="#52c41a" opacity="0.4"/>
  <circle cx="290" cy="165" r="5" fill="#1890ff" opacity="0.4"/>
  <circle cx="305" cy="170" r="5" fill="#1890ff" opacity="0.4"/>
  
  <!-- Молекулы растворенного вещества -->
  <rect x="210" y="185" width="20" height="10" fill="#faad14" opacity="0.5" rx="5" ry="5"/>
  <rect x="270" y="175" width="20" height="10" fill="#faad14" opacity="0.5" rx="5" ry="5"/>
  <rect x="240" y="190" width="20" height="10" fill="#faad14" opacity="0.5" rx="5" ry="5"/>
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#1890ff" opacity="0.3"/>
  <circle cx="450" cy="50" r="3" fill="#1890ff" opacity="0.3"/>
  <circle cx="50" cy="300" r="3" fill="#1890ff" opacity="0.3"/>
  <circle cx="450" cy="300" r="3" fill="#1890ff" opacity="0.3"/>
  
  <line x1="30" y1="150" x2="40" y2="150" stroke="#1890ff" stroke-width="1" opacity="0.3"/>
  <line x1="460" y1="150" x2="470" y2="150" stroke="#1890ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Ионы в растворе -->
  <circle cx="180" cy="210" r="5" fill="#ffd666" opacity="0.7"/>
  <text x="180" y="213" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">⁺</text>
  
  <circle cx="320" cy="220" r="5" fill="#ffd666" opacity="0.7"/>
  <text x="320" y="223" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">⁻</text>
  
  <circle cx="220" cy="230" r="5" fill="#ffd666" opacity="0.7"/>
  <text x="220" y="233" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">⁺</text>
  
  <circle cx="280" cy="225" r="5" fill="#ffd666" opacity="0.7"/>
  <text x="280" y="228" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">⁻</text>
</svg>