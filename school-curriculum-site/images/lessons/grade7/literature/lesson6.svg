<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF5EE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="battleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6347;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:0.6" />
    </linearGradient>
    
    <radialGradient id="sunGrad">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Фон неба -->
  <rect width="500" height="350" fill="url(#skyGrad)" />
  
  <!-- Солнце -->
  <circle cx="450" cy="50" r="30" fill="url(#sunGrad)" />
  
  <!-- Облака -->
  <g id="cloud1">
    <ellipse cx="100" cy="60" rx="25" ry="15" fill="url(#cloudGrad)" />
    <ellipse cx="120" cy="55" rx="30" ry="18" fill="url(#cloudGrad)" />
    <ellipse cx="140" cy="60" rx="25" ry="15" fill="url(#cloudGrad)" />
  </g>
  
  <g id="cloud2">
    <ellipse cx="350" cy="80" rx="20" ry="12" fill="url(#cloudGrad)" />
    <ellipse cx="365" cy="75" rx="25" ry="15" fill="url(#cloudGrad)" />
    <ellipse cx="380" cy="80" rx="20" ry="12" fill="url(#cloudGrad)" />
  </g>
  
  <!-- Земля -->
  <rect x="0" y="250" width="500" height="100" fill="url(#groundGrad)" />
  
  <!-- Дерево слева -->
  <g id="tree1">
    <rect x="80" y="200" width="15" height="50" fill="#654321" />
    <circle cx="87.5" cy="190" r="30" fill="#228B22" />
    <circle cx="75" cy="200" r="25" fill="#32CD32" />
    <circle cx="100" cy="200" r="25" fill="#32CD32" />
  </g>
  
  <!-- Дерево справа -->
  <g id="tree2">
    <rect x="380" y="210" width="12" height="40" fill="#654321" />
    <circle cx="386" cy="200" r="25" fill="#228B22" />
    <circle cx="376" cy="208" r="20" fill="#32CD32" />
    <circle cx="396" cy="208" r="20" fill="#32CD32" />
  </g>
  
  <!-- Крепость Полтава -->
  <g id="krepost">
    <rect x="200" y="150" width="100" height="100" fill="#8B7D6B" />
    <rect x="210" y="160" width="80" height="80" fill="#A0826D" />
    <!-- Башни -->
    <rect x="190" y="140" width="20" height="110" fill="#696969" />
    <rect x="290" y="140" width="20" height="110" fill="#696969" />
    <polygon points="190,140 200,120 210,140" fill="#696969" />
    <polygon points="290,140 300,120 310,140" fill="#696969" />
    <!-- Флаги -->
    <line x1="200" y1="130" x2="200" y2="120" stroke="#000" stroke-width="1" />
    <polygon points="200,120 210,125 200,130" fill="#FF0000" />
    <line x1="300" y1="130" x2="300" y2="120" stroke="#000" stroke-width="1" />
    <polygon points="300,120 310,125 300,130" fill="#0000FF" />
  </g>
  
  <!-- Бой вдали -->
  <g id="battle" opacity="0.7">
    <rect x="150" y="230" width="200" height="20" fill="url(#battleGrad)" />
    <!-- Солдаты -->
    <rect x="170" y="220" width="8" height="10" fill="#4169E1" />
    <rect x="185" y="220" width="8" height="10" fill="#DC143C" />
    <rect x="200" y="220" width="8" height="10" fill="#4169E1" />
    <rect x="215" y="220" width="8" height="10" fill="#DC143C" />
    <rect x="230" y="220" width="8" height="10" fill="#4169E1" />
    <!-- Кони -->
    <ellipse cx="174" cy="230" rx="6" ry="4" fill="#8B4513" />
    <ellipse cx="189" cy="230" rx="6" ry="4" fill="#8B4513" />
    <ellipse cx="204" cy="230" rx="6" ry="4" fill="#8B4513" />
  </g>
  
  <!-- Титр -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2F4F4F">ЛИТЕРАТУРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#8B4513">Урок 6. Пушкин. Полтава</text>
  
  <!-- Тема -->
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#696969">Тема: Поэма</text>
  
  <!-- Ключевые слова -->
  <text x="50" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">1812 год</text>
  <text x="50" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">Полтавская битва</text>
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">Петр I</text>
  
  <!-- Стихотворная строка -->
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#4B0082">
    «Полтава» — поэма о славе русского оружия
  </text>
  
  <!-- Даты -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">1828-1829</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">год создания</text>
  
  <!-- Основные образы -->
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="11" fill="#4B0082">
    Кочубей, Мазепа, Мария
  </text>
  
  <!-- Художественные особенности -->
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Историзм • Романтический стиль • Героика
  </text>
  
  <!-- Значение поэмы -->
  <text x="50" y="330" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Восхваление подвига Петра I и русской армии
  </text>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="50" cy="280" r="3" fill="#FFD700" />
  <circle cx="70" cy="280" r="3" fill="#FFD700" />
  <circle cx="90" cy="280" r="3" fill="#FFD700" />
  
  <!-- Рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#8B4513" stroke-width="2" rx="5" />
  
  <!-- Орнамент -->
  <g id="ornament">
    <path d="M 20,20 Q 30,15 40,20 T 60,20" fill="none" stroke="#8B4513" stroke-width="1" />
    <path d="M 440,20 Q 450,15 460,20 T 480,20" fill="none" stroke="#8B4513" stroke-width="1" />
    <path d="M 20,330 Q 30,335 40,330 T 60,330" fill="none" stroke="#8B4513" stroke-width="1" />
    <path d="M 440,330 Q 450,335 460,330 T 480,330" fill="none" stroke="#8B4513" stroke-width="1" />
  </g>
  
  <!-- Указатель на крепость -->
  <line x1="250" y1="100" x2="250" y2="140" stroke="#8B4513" stroke-width="1" stroke-dasharray="2,2" />
  <polygon points="250,140 245,135 255,135" fill="#8B4513" />
  
  <!-- Надпись на крепости -->
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFF">ПОЛТАВА</text>
  
  <!-- Копья солдат -->
  <line x1="172" y1="220" x2="172" y2="210" stroke="#8B4513" stroke-width="1" />
  <line x1="187" y1="220" x2="187" y2="210" stroke="#8B4513" stroke-width="1" />
  <line x1="202" y1="220" x2="202" y2="210" stroke="#8B4513" stroke-width="1" />
  
  <!-- Дым от боя -->
  <ellipse cx="250" cy="225" rx="15" ry="5" fill="#696969" opacity="0.5" />
  <ellipse cx="240" cy="220" rx="10" ry="4" fill="#696969" opacity="0.4" />
  <ellipse cx="260" cy="220" rx="10" ry="4" fill="#696969" opacity="0.4" />
  
  <!-- Тень от деревьев -->
  <ellipse cx="87.5" cy="250" rx="35" ry="8" fill="#000" opacity="0.2" />
  <ellipse cx="386" cy="250" rx="28" ry="6" fill="#000" opacity="0.2" />
</svg>