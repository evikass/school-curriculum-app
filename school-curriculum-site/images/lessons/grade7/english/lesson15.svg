<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#E8F5E9"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1B5E20">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#388E3C">Урок 15. Environment and nature</text>
  
  <!-- Sun -->
  <circle cx="80" cy="80" r="25" fill="#FFD600" opacity="0.9"/>
  <path d="M80,45 L80,35 M105,80 L115,80 M80,115 L80,125 M55,80 L45,80" stroke="#FFD600" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cloud 1 -->
  <ellipse cx="150" cy="70" rx="25" ry="15" fill="white" opacity="0.9"/>
  <ellipse cx="135" cy="75" rx="20" ry="12" fill="white" opacity="0.9"/>
  <ellipse cx="165" cy="75" rx="20" ry="12" fill="white" opacity="0.9"/>
  
  <!-- Cloud 2 -->
  <ellipse cx="380" cy="60" rx="30" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="365" cy="65" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="395" cy="65" rx="25" ry="15" fill="white" opacity="0.8"/>
  
  <!-- Tree 1 -->
  <rect x="45" y="120" width="15" height="40" fill="#795548"/>
  <circle cx="52" cy="115" r="20" fill="#4CAF50"/>
  <circle cx="42" cy="110" r="15" fill="#66BB6A"/>
  <circle cx="62" cy="110" r="15" fill="#66BB6A"/>
  
  <!-- Tree 2 -->
  <rect x="120" y="130" width="12" height="35" fill="#795548"/>
  <circle cx="126" cy="125" r="18" fill="#4CAF50"/>
  <circle cx="118" cy="120" r="14" fill="#66BB6A"/>
  <circle cx="134" cy="120" r="14" fill="#66BB6A"/>
  
  <!-- Mountain -->
  <path d="M300,180 L350,120 L400,180 Z" fill="#8D6E63"/>
  <path d="M310,180 L350,140 L390,180 Z" fill="#A1887F"/>
  
  <!-- River -->
  <path d="M200,200 Q250,210 300,200 Q350,190 400,200" stroke="#2196F3" stroke-width="8" fill="none" opacity="0.7"/>
  
  <!-- Grass -->
  <path d="M0,200 Q10,190 20,200 Q30,190 40,200 Q50,190 60,200 Q70,190 80,200 Q90,190 100,200 Q110,190 120,200 Q130,190 140,200 Q150,190 160,200 Q170,190 180,200 Q190,190 200,200 Q210,190 220,200 Q230,190 240,200 Q250,190 260,200 Q270,190 280,200 Q290,190 300,200 Q310,190 320,200 Q330,190 340,200 Q350,190 360,200 Q370,190 380,200 Q390,190 400,200 Q410,190 420,200 Q430,190 440,200 Q450,190 460,200 Q470,190 480,200 Q490,190 500,200" stroke="#4CAF50" stroke-width="2" fill="none"/>
  
  <!-- House -->
  <rect x="320" y="160" width="50" height="40" fill="#D32F2F"/>
  <path d="M315,160 L345,130 L375,160 Z" fill="#D32F2F"/>
  <rect x="330" y="175" width="15" height="20" fill="#FFD600"/>
  <rect x="345" y="170" width="8" height="8" fill="#81D4FA"/>
  
  <!-- Butterfly -->
  <g transform="translate(250, 100)">
    <ellipse cx="-10" cy="0" rx="8" ry="15" fill="#E91E63" transform="rotate(-20)"/>
    <ellipse cx="10" cy="0" rx="8" ry="15" fill="#E91E63" transform="rotate(20)"/>
    <ellipse cx="-10" cy="5" rx="6" ry="10" fill="#F06292" transform="rotate(-20)"/>
    <ellipse cx="10" cy="5" rx="6" ry="10" fill="#F06292" transform="rotate(20)"/>
    <rect x="-2" y="-5" width="4" height="10" fill="#795548"/>
  </g>
  
  <!-- Flower -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="0" r="8" fill="#FFD600"/>
    <circle cx="-10" cy="-5" r="6" fill="#FF4081"/>
    <circle cx="10" cy="-5" r="6" fill="#FF4081"/>
    <circle cx="-10" cy="5" r="6" fill="#FF4081"/>
    <circle cx="10" cy="5" r="6" fill="#FF4081"/>
    <rect x="-2" y="0" width="4" height="20" fill="#4CAF50"/>
  </g>
  
  <!-- Bush -->
  <ellipse cx="420" cy="190" rx="25" ry="15" fill="#4CAF50"/>
  <ellipse cx="410" cy="195" rx="20" ry="12" fill="#66BB6A"/>
  <ellipse cx="430" cy="195" rx="20" ry="12" fill="#66BB6A"/>
  
  <!-- Bird -->
  <g transform="translate(120, 50)">
    <path d="M0,0 Q-10,-5 -15,0 Q-10,5 0,0" fill="#424242"/>
    <path d="M0,0 Q10,-5 15,0 Q10,5 0,0" fill="#424242"/>
  </g>
  
  <!-- Rocks -->
  <ellipse cx="250" cy="210" rx="20" ry="10" fill="#78909C"/>
  <ellipse cx="280" cy="215" rx="15" ry="8" fill="#90A4AE"/>
  
  <!-- Labels -->
  <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Sun</text>
  <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Cloud</text>
  <text x="52" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Tree</text>
  <text x="350" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Mountain</text>
  <text x="300" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">River</text>
  <text x="345" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">House</text>
  <text x="250" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Butterfly</text>
  <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Flower</text>
  <text x="420" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Bush</text>
  <text x="120" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Bird</text>
  <text x="265" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Rock</text>
  <text x="50" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1B5E20" font-weight="bold">Environment</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1B5E20" font-weight="bold">Nature</text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1B5E20" font-weight="bold">Pollution</text>
  
  <!-- Additional elements for complexity -->
  <circle cx="300" cy="250" r="3" fill="#FF5722"/>
  <circle cx="310" cy="255" r="3" fill="#FF5722"/>
  <circle cx="290" cy="255" r="3" fill="#FF5722"/>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Trash</text>
  
  <!-- Small flowers -->
  <g transform="translate(350, 180)">
    <circle cx="0" cy="0" r="4" fill="#FFD600"/>
    <circle cx="-5" cy="-3" r="3" fill="#FF4081"/>
    <circle cx="5" cy="-3" r="3" fill="#FF4081"/>
    <circle cx="-5" cy="3" r="3" fill="#FF4081"/>
    <circle cx="5" cy="3" r="3" fill="#FF4081"/>
  </g>
  
  <g transform="translate(380, 185)">
    <circle cx="0" cy="0" r="4" fill="#FFD600"/>
    <circle cx="-5" cy="-3" r="3" fill="#FF4081"/>
    <circle cx="5" cy="-3" r="3" fill="#FF4081"/>
    <circle cx="-5" cy="3" r="3" fill="#FF4081"/>
    <circle cx="5" cy="3" r="3" fill="#FF4081"/>
  </g>
  
  <!-- Additional labels -->
  <text x="50" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Clean</text>
  <text x="150" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Green</text>
  <text x="250" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Fresh air</text>
  <text x="350" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Beautiful</text>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Danger</text>
  
  <!-- Wind indicator -->
  <path d="M200,40 Q210,35 220,40" stroke="#757575" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M210,45 Q220,40 230,45" stroke="#757575" stroke-width="2" fill="none" opacity="0.6"/>
  <text x="215" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Wind</text>
  
  <!-- Water droplet -->
  <path d="M450,120 C450,115 455,110 460,115 C465,110 470,115 470,120 C470,125 460,135 460,135 C460,135 450,125 450,120 Z" fill="#2196F3" opacity="0.8"/>
  <text x="460" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Water</text>
  
  <!-- Additional decorative elements -->
  <circle cx="30" cy="50" r="2" fill="#FFC107"/>
  <circle cx="40" cy="45" r="2" fill="#FFC107"/>
  <circle cx="35" cy="55" r="2" fill="#FFC107"/>
  <circle cx="470" cy="100" r="2" fill="#FFC107"/>
  <circle cx="460" cy="105" r="2" fill="#FFC107"/>
  <circle cx="475" cy="105" r="2" fill="#FFC107"/>
</svg>