<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Lesson Title -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#34495e">Урок 4. Daily routine. Telling the time</text>
  
  <!-- Clock 1 - 7:00 -->
  <g transform="translate(80, 120)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">7:00</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">wake up</text>
  </g>
  
  <!-- Clock 2 - 8:00 -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">8:00</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">breakfast</text>
  </g>
  
  <!-- Clock 3 - 9:00 -->
  <g transform="translate(280, 120)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">9:00</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">school</text>
  </g>
  
  <!-- Clock 4 - 13:00 -->
  <g transform="translate(380, 120)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">1:00 PM</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">lunch</text>
  </g>
  
  <!-- Clock 5 - 15:00 -->
  <g transform="translate(130, 250)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">3:00 PM</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">homework</text>
  </g>
  
  <!-- Clock 6 - 18:00 -->
  <g transform="translate(230, 250)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">6:00 PM</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">dinner</text>
  </g>
  
  <!-- Clock 7 - 21:00 -->
  <g transform="translate(330, 250)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#34495e" stroke-width="3"/>
    <circle cx="0" cy="0" r="3" fill="#34495e"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>
    <!-- Numbers -->
    <text x="0" y="-35" font-size="10" text-anchor="middle" fill="#7f8c8d">12</text>
    <text x="35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">3</text>
    <text x="0" y="38" font-size="10" text-anchor="middle" fill="#7f8c8d">6</text>
    <text x="-35" y="3" font-size="10" text-anchor="middle" fill="#7f8c8d">9</text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="#2c3e50">9:00 PM</text>
    <text x="0" y="70" font-size="10" text-anchor="middle" fill="#7f8c8d">sleep</text>
  </g>
  
  <!-- Connecting arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Arrow from clock 1 to clock 2 -->
  <line x1="120" y1="120" x2="140" y2="120" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 2 to clock 3 -->
  <line x1="220" y1="120" x2="240" y2="120" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 3 to clock 4 -->
  <line x1="320" y1="120" x2="340" y2="120" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 4 to clock 5 -->
  <path d="M 380 160 Q 380 200 170 210" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 5 to clock 6 -->
  <line x1="170" y1="250" x2="190" y2="250" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 6 to clock 7 -->
  <line x1="270" y1="250" x2="290" y2="250" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow from clock 7 back to clock 1 -->
  <path d="M 330 210 Q 330 80 120 80" stroke="#95a5a6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Time expressions -->
  <text x="50" y="95" font-size="12" fill="#7f8c8d">seven o'clock</text>
  <text x="150" y="95" font-size="12" fill="#7f8c8d">eight o'clock</text>
  <text x="250" y="95" font-size="12" fill="#7f8c8d">nine o'clock</text>
  <text x="350" y="95" font-size="12" fill="#7f8c8d">one o'clock PM</text>
  <text x="100" y="225" font-size="12" fill="#7f8c8d">three o'clock PM</text>
  <text x="200" y="225" font-size="12" fill="#7f8c8d">six o'clock PM</text>
  <text x="300" y="225" font-size="12" fill="#7f8c8d">nine o'clock PM</text>
  
  <!-- Activities labels -->
  <text x="80" y="195" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">wake up</text>
  <text x="180" y="195" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">have breakfast</text>
  <text x="280" y="195" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">go to school</text>
  <text x="380" y="195" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">have lunch</text>
  <text x="130" y="325" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">do homework</text>
  <text x="230" y="325" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">have dinner</text>
  <text x="330" y="325" font-size="11" text-anchor="middle" fill="#2c3e50" font-style="italic">go to bed</text>
  
  <!-- Small clock examples -->
  <g transform="translate(420, 300)">
    <circle cx="0" cy="0" r="15" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="0" stroke="#3498db" stroke-width="1" stroke-linecap="round"/>
    <text x="0" y="25" font-size="8" text-anchor="middle" fill="#7f8c8d">quarter past</text>
  </g>
  
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="15" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="0" x2="6" y2="0" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#3498db" stroke-width="1" stroke-linecap="round"/>
    <text x="0" y="25" font-size="8" text-anchor="middle" fill="#7f8c8d">half past</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="3" fill="#3498db" opacity="0.3"/>
  <circle cx="470" cy="50" r="3" fill="#e74c3c" opacity="0.3"/>
  <circle cx="30" cy="320" r="3" fill="#2ecc71" opacity="0.3"/>
  <circle cx="470" cy="320" r="3" fill="#f39c12" opacity="0.3"/>
  
  <!-- Additional time expressions -->
  <text x="30" y="340" font-size="10" fill="#7f8c8d">a.m.</text>
  <text x="470" y="340" font-size="10" fill="#7f8c8d">p.m.</text>
</svg>