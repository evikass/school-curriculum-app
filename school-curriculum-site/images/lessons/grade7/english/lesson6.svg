<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#e8f4f8"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="#2c5aa0"/>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c5aa0" text-anchor="middle">Lesson 6. Sports and games</text>
  
  <!-- Футбольное поле -->
  <rect x="30" y="110" width="150" height="120" rx="5" fill="#4a7c59" stroke="#2d5016" stroke-width="2"/>
  <rect x="30" y="110" width="150" height="120" rx="5" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="105" cy="170" r="25" fill="none" stroke="white" stroke-width="2"/>
  <rect x="70" y="140" width="70" height="60" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Футболка -->
  <rect x="200" y="140" width="40" height="50" fill="white" stroke="#333" stroke-width="1"/>
  <rect x="205" y="135" width="30" height="8" fill="#e74c3c"/>
  
  <!-- Баскетбольный мяч -->
  <circle cx="300" cy="170" r="25" fill="#d2691e" stroke="#333" stroke-width="1"/>
  <path d="M275 170 Q300 150, 325 170" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M300 145 L300 195" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M285 155 Q300 170, 315 155" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M285 185 Q300 170, 315 185" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Теннисная ракетка -->
  <ellipse cx="380" cy="160" rx="20" ry="30" fill="#f0e68c" stroke="#333" stroke-width="1"/>
  <rect x="375" y="185" width="10" height="30" fill="#8b4513"/>
  <rect x="370" y="190" width="20" height="5" fill="#654321"/>
  
  <!-- Волейбольный мяч -->
  <circle cx="420" cy="170" r="18" fill="#fff" stroke="#333" stroke-width="1"/>
  <path d="M402 170 Q420 160, 438 170" fill="none" stroke="#333" stroke-width="1"/>
  <path d="Q420 160, 420 180" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Беговые дорожки -->
  <rect x="30" y="250" width="180" height="60" rx="5" fill="#f4a460" stroke="#333" stroke-width="1"/>
  <line x1="30" y1="270" x2="210" y2="270" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="30" y1="290" x2="210" y2="290" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Баскетбольное кольцо -->
  <rect x="250" y="240" width="60" height="5" fill="#ff6347"/>
  <rect x="275" y="245" width="10" height="30" fill="#8b4513"/>
  <circle cx="280" cy="240" r="15" fill="none" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Лыжи -->
  <rect x="350" y="250" width="80" height="5" fill="#ff8c00" rx="2"/>
  <rect x="370" y="250" width="5" height="40" fill="#8b4513"/>
  <rect x="405" y="250" width="5" height="40" fill="#8b4513"/>
  <ellipse cx="390" cy="290" rx="15" ry="5" fill="#333"/>
  
  <!-- Клубок ниток -->
  <circle cx="420" cy="280" r="15" fill="#ff69b4" stroke="#333" stroke-width="1"/>
  <path d="M420 265 Q410 270, 415 280 Q420 290, 425 280 Q430 270, 420 265" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Метатель копья -->
  <line x1="30" y1="320" x2="80" y2="280" stroke="#333" stroke-width="3"/>
  <polygon points="80,280 75,285 85,285" fill="#333"/>
  <circle cx="40" cy="330" r="10" fill="#fdbcb4"/>
  <line x1="40" y1="330" x2="50" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="45" y1="320" x2="35" y2="315" stroke="#333" stroke-width="2"/>
  <line x1="45" y1="325" x2="35" y2="325" stroke="#333" stroke-width="2"/>
  <line x1="45" y1="330" x2="35" y2="335" stroke="#333" stroke-width="2"/>
  <rect x="35" y="330" width="10" height="20" fill="#4169e1"/>
  
  <!-- Футбольный мяч в полете -->
  <circle cx="150" cy="200" r="12" fill="#fff" stroke="#333" stroke-width="1"/>
  <path d="M138 200 Q150 190, 162 200" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M150 188 L150 212" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Гимнастическая лента -->
  <path d="M300 280 Q320 260, 340 280 Q360 300, 380 280" fill="none" stroke="#ff1493" stroke-width="3"/>
  <circle cx="300" cy="280" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="380" cy="280" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
  
  <!-- Лыжа в воздухе -->
  <rect x="450" y="200" width="60" height="4" fill="#ff8c00" rx="2" transform="rotate(30 480 202)"/>
  
  <!-- Теннисный корт -->
  <rect x="200" y="110" width="100" height="80" fill="#90ee90" stroke="#333" stroke-width="1"/>
  <rect x="200" y="110" width="100" height="80" fill="none" stroke="white" stroke-width="2"/>
  <line x1="250" y1="110" x2="250" y2="190" stroke="white" stroke-width="2"/>
  <circle cx="230" cy="150" r="3" fill="#333"/>
  <circle cx="270" cy="150" r="3" fill="#333"/>
  
  <!-- Боксерские перчатки -->
  <ellipse cx="100" cy="320" rx="15" ry="20" fill="#dc143c" stroke="#333" stroke-width="1"/>
  <ellipse cx="130" cy="320" rx="15" ry="20" fill="#dc143c" stroke="#333" stroke-width="1"/>
  <text x="115" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">boxing</text>
  
  <!-- Лыжа на земле -->
  <rect x="250" y="310" width="70" height="4" fill="#ff8c00" rx="2"/>
  
  <!-- Гиря -->
  <circle cx="350" cy="330" r="15" fill="#696969" stroke="#333" stroke-width="1"/>
  <rect x="345" y="315" width="10" height="15" fill="#696969"/>
  <text x="350" y="355" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">weightlifting</text>
  
  <!-- Надписи на английском -->
  <text x="105" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">football</text>
  <text x="220" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">jersey</text>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">basketball</text>
  <text x="380" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">tennis</text>
  <text x="420" y="205" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">volleyball</text>
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">running</text>
  <text x="280" y="290" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">basketball</text>
  <text x="390" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">skiing</text>
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">knitting</text>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">javelin</text>
  <text x="340" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">gymnastics</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">tennis court</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="450" cy="320" r="8" fill="#ffd700" stroke="#333" stroke-width="1"/>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">medal</text>
  
  <rect x="30" y="200" width="20" height="30" fill="#ff6347" stroke="#333" stroke-width="1"/>
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">swimming</text>
  
  <ellipse cx="180" cy="320" rx="20" ry="8" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <text x="180" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">hockey</text>
  
  <!-- Дополнительные подписи -->
  <text x="150" y="230" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">soccer ball</text>
  <text x="480" y="230" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">ski jump</text>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">ball</text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">hoop</text>
  <text x="40" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">track</text>
  
  <!-- Декоративные элементы -->
  <circle cx="25" cy="25" r="3" fill="#ffd700"/>
  <circle cx="475" cy="25" r="3" fill="#ffd700"/>
  <circle cx="25" cy="325" r="3" fill="#ffd700"/>
  <circle cx="475" cy="325" r="3" fill="#ffd700"/>
</svg>