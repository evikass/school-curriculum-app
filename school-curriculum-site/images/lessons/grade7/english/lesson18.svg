<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">ENGLISH · 7 CLASS</text>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">Lesson 18: Jobs and Professions</text>
  
  <!-- Доска -->
  <rect x="20" y="80" width="460" height="240" fill="#8b4513" stroke="#654321" stroke-width="3"/>
  <rect x="30" y="90" width="440" height="220" fill="#d4e6f1"/>
  
  <!-- Профессии -->
  <!-- Учитель -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="0" r="25" fill="#f39c12"/>
    <rect x="-3" y="25" width="6" height="30" fill="#3498db"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Teacher</text>
  </g>
  
  <!-- Врач -->
  <g transform="translate(160, 120)">
    <circle cx="0" cy="0" r="25" fill="#e74c3c"/>
    <rect x="-3" y="25" width="6" height="30" fill="#ecf0f1"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Крест -->
    <rect x="-15" y="-5" width="30" height="4" fill="#ffffff"/>
    <rect x="-2" y="-12" width="4" height="24" fill="#ffffff"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Doctor</text>
  </g>
  
  <!-- Инженер -->
  <g transform="translate(260, 120)">
    <circle cx="0" cy="0" r="25" fill="#9b59b6"/>
    <rect x="-3" y="25" width="6" height="30" fill="#95a5a6"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Шапка инженера -->
    <path d="M -20 -10 L 20 -10 L 15 0 L -15 0 Z" fill="#34495e"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Engineer</text>
  </g>
  
  <!-- Повар -->
  <g transform="translate(360, 120)">
    <circle cx="0" cy="0" r="25" fill="#e67e22"/>
    <rect x="-3" y="25" width="6" height="30" fill="#d35400"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Шеф-поварская шапка -->
    <path d="M -20 -15 L 20 -15 L 20 -5 L -20 -5 Z" fill="#ffffff"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Chef</text>
  </g>
  
  <!-- Полицейский -->
  <g transform="translate(440, 120)">
    <circle cx="0" cy="0" r="25" fill="#3498db"/>
    <rect x="-3" y="25" width="6" height="30" fill="#ecf0f1"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Фуражка -->
    <rect x="-20" y="-15" width="40" height="8" fill="#2c3e50"/>
    <rect x="-15" y="-7" width="30" height="8" fill="#3498db"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Police</text>
  </g>
  
  <!-- Второй ряд -->
  <!-- Артист -->
  <g transform="translate(60, 220)">
    <circle cx="0" cy="0" r="25" fill="#e74c3c"/>
    <rect x="-3" y="25" width="6" height="30" fill="#f39c12"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Маска -->
    <ellipse cx="0" cy="-5" rx="18" ry="12" fill="#2c3e50"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Actor</text>
  </g>
  
  <!-- Программист -->
  <g transform="translate(160, 220)">
    <circle cx="0" cy="0" r="25" fill="#3498db"/>
    <rect x="-3" y="25" width="6" height="30" fill="#2c3e50"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Очки -->
    <ellipse cx="-8" cy="-5" rx="8" ry="5" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="8" cy="-5" rx="8" ry="5" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="-5" stroke="#2c3e50" stroke-width="2"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Programmer</text>
  </g>
  
  <!-- Архитектор -->
  <g transform="translate(260, 220)">
    <circle cx="0" cy="0" r="25" fill="#16a085"/>
    <rect x="-3" y="25" width="6" height="30" fill="#ecf0f1"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Линейка -->
    <rect x="-15" y="-15" width="30" height="4" fill="#2c3e50" transform="rotate(45)"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Architect</text>
  </g>
  
  <!-- Фермер -->
  <g transform="translate(360, 220)">
    <circle cx="0" cy="0" r="25" fill="#27ae60"/>
    <rect x="-3" y="25" width="6" height="30" fill="#f39c12"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Шляпа -->
    <ellipse cx="0" cy="-10" rx="20" ry="6" fill="#8b4513"/>
    <rect x="-3" y="-10" width="6" height="15" fill="#8b4513"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Farmer</text>
  </g>
  
  <!-- Пилот -->
  <g transform="translate(440, 220)">
    <circle cx="0" cy="0" r="25" fill="#f1c40f"/>
    <rect x="-3" y="25" width="6" height="30" fill="#34495e"/>
    <rect x="-15" y="40" width="30" height="4" fill="#2c3e50"/>
    <rect x="-10" y="44" width="4" height="20" fill="#2c3e50"/>
    <rect x="6" y="44" width="4" height="20" fill="#2c3e50"/>
    <!-- Шлем -->
    <circle cx="0" cy="-5" r="15" fill="#ecf0f1"/>
    <rect x="-10" y="-10" width="20" height="3" fill="#e74c3c"/>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Pilot</text>
  </g>
  
  <!-- Вопросительные знаки -->
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="210" y="105" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="310" y="105" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="410" y="105" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="110" y="205" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="210" y="205" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="310" y="205" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  <text x="410" y="205" font-family="Arial, sans-serif" font-size="14" fill="#34495e">?</text>
  
  <!-- Украшения -->
  <circle cx="40" cy="100" r="3" fill="#f39c12"/>
  <circle cx="460" cy="100" r="3" fill="#f39c12"/>
  <circle cx="40" cy="300" r="3" fill="#f39c12"/>
  <circle cx="460" cy="300" r="3" fill="#f39c12"/>
  
  <!-- Разделительная линия -->
  <line x1="40" y1="70" x2="460" y2="70" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Дополнительные элементы -->
  <rect x="30" y="310" width="440" height="20" fill="#3498db" opacity="0.3"/>
  <text x="250" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-style="italic">What job would you like to have?</text>
</svg>