<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ddd6fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тени -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="80" cy="70" r="2" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="450" cy="60" r="4" fill="#f59e0b" opacity="0.3"/>
  <circle cx="420" cy="90" r="2.5" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">ИСТОРИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#475569">Урок 1. Введение в историю</text>
  
  <!-- Основной контейнер -->
  <rect x="30" y="90" width="440" height="230" rx="10" fill="white" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Разделители -->
  <line x1="50" y1="110" x2="450" y2="110" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="250" y1="110" x2="250" y2="300" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Левая секция: Источники истории -->
  <text x="140" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">Источники истории</text>
  
  <!-- Письменные источники -->
  <g transform="translate(60, 150)">
    <rect width="80" height="100" rx="5" fill="url(#scrollGrad)" filter="url(#shadow)"/>
    <rect x="5" y="10" width="70" height="3" fill="#92400e" opacity="0.5"/>
    <rect x="5" y="20" width="50" height="2" fill="#92400e" opacity="0.5"/>
    <rect x="5" y="30" width="60" height="2" fill="#92400e" opacity="0.5"/>
    <rect x="5" y="40" width="55" height="2" fill="#92400e" opacity="0.5"/>
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">Письменные</text>
  </g>
  
  <!-- Археологические находки -->
  <g transform="translate(160, 150)">
    <rect width="80" height="100" rx="5" fill="url(#bookGrad)" filter="url(#shadow)"/>
    <path d="M20 30 L60 30 L60 70 L20 70 Z" fill="white" opacity="0.8"/>
    <circle cx="40" cy="50" r="15" fill="none" stroke="#4c1d95" stroke-width="2"/>
    <line x1="30" y1="50" x2="50" y2="50" stroke="#4c1d95" stroke-width="2"/>
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4c1d95">Археология</text>
  </g>
  
  <!-- Правая секция: Типы источников -->
  <text x="370" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">Виды источников</text>
  
  <!-- Монеты -->
  <g transform="translate(290, 150)">
    <circle cx="40" cy="40" r="35" fill="url(#coinGrad)" filter="url(#shadow)"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#92400e" stroke-width="2"/>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#78350f">$</text>
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">Монеты</text>
  </g>
  
  <!-- Иконы -->
  <g transform="translate(380, 150)">
    <rect width="60" height="80" rx="5" fill="#fbbf24" opacity="0.8" filter="url(#shadow)"/>
    <path d="M30 30 L30 50 M20 40 L40 40 M25 20 L35 20" stroke="#78350f" stroke-width="2" fill="none"/>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#78350f">Иконы</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(60, 270)">
    <rect width="160" height="25" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="80" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">Первичные источники</text>
  </g>
  
  <g transform="translate(240, 270)">
    <rect width="160" height="25" rx="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="80" y="17" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b21a8">Вторичные источники</text>
  </g>
  
  <!-- Декоративные линии -->
  <path d="M 30 100 Q 60 95 90 100" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 410 100 Q 440 95 470 100" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Маленькие иконки -->
  <g transform="translate(140, 200)">
    <rect width="20" height="20" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4338ca">📜</text>
  </g>
  
  <g transform="translate(180, 200)">
    <rect width="20" height="20" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#be185d">🏺</text>
  </g>
  
  <g transform="translate(220, 200)">
    <rect width="20" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d97706">📚</text>
  </g>
  
  <!-- Подписи элементов -->
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Исторические источники помогают нам понять прошлое</text>
  
  <!-- Угловые декорации -->
  <path d="M 20 20 L 20 30 L 30 20" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 480 20 L 480 30 L 470 20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M 20 330 L 20 320 L 30 330" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 480 330 L 480 320 L 470 330" fill="none" stroke="#10b981" stroke-width="2"/>
</svg>