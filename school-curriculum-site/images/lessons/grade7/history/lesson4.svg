<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.6" />
    </linearGradient>
    
    <linearGradient id="templeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Небо -->
  <rect width="500" height="200" fill="url(#skyGrad)"/>
  
  <!-- Горы -->
  <path d="M 0 200 L 100 120 L 200 180 L 300 100 L 400 160 L 500 140 L 500 200 Z" fill="url(#mountainGrad)" opacity="0.7"/>
  
  <!-- Море -->
  <rect x="0" y="200" width="500" height="150" fill="url(#seaGrad)"/>
  
  <!-- Волны -->
  <path d="M 0 220 Q 25 215 50 220 T 100 220 T 150 220 T 200 220 T 250 220 T 300 220 T 350 220 T 400 220 T 450 220 T 500 220" 
        stroke="#4682B4" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 0 240 Q 25 235 50 240 T 100 240 T 150 240 T 200 240 T 250 240 T 300 240 T 350 240 T 400 240 T 450 240 T 500 240" 
        stroke="#4682B4" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Храм Акрополя -->
  <g id="acropolis">
    <!-- Фундамент -->
    <rect x="180" y="160" width="140" height="20" fill="#8B7355"/>
    <!-- Колонны -->
    <rect x="195" y="140" width="8" height="40" fill="url(#templeGrad)"/>
    <rect x="210" y="135" width="8" height="45" fill="url(#templeGrad)"/>
    <rect x="225" y="130" width="8" height="50" fill="url(#templeGrad)"/>
    <rect x="240" y="128" width="8" height="52" fill="url(#templeGrad)"/>
    <rect x="255" y="130" width="8" height="50" fill="url(#templeGrad)"/>
    <rect x="270" y="135" width="8" height="45" fill="url(#templeGrad)"/>
    <rect x="285" y="140" width="8" height="40" fill="url(#templeGrad)"/>
    <rect x="300" y="140" width="8" height="40" fill="url(#templeGrad)"/>
    <!-- Фронтон -->
    <path d="M 180 128 L 250 100 L 320 128 Z" fill="url(#templeGrad)"/>
    <!-- Крыша -->
    <path d="M 175 128 L 180 120 L 320 120 L 325 128 Z" fill="#8B4513"/>
  </g>
  
  <!-- Городские стены -->
  <rect x="50" y="180" width="100" height="60" fill="none" stroke="#8B7355" stroke-width="3"/>
  <rect x="350" y="190" width="120" height="50" fill="none" stroke="#8B7355" stroke-width="3"/>
  
  <!-- Ворота -->
  <rect x="90" y="210" width="20" height="30" fill="#654321"/>
  <circle cx="105" cy="225" r="2" fill="#FFD700"/>
  
  <!-- Здания -->
  <rect x="60" y="195" width="15" height="20" fill="#D2691E"/>
  <rect x="80" y="190" width="15" height="25" fill="#CD853F"/>
  <rect x="100" y="200" width="15" height="15" fill="#DEB887"/>
  
  <rect x="360" y="205" width="20" height="20" fill="#D2691E"/>
  <rect x="385" y="200" width="20" height="25" fill="#CD853F"/>
  <rect x="410" y="210" width="15" height="15" fill="#DEB887"/>
  
  <!-- Корабли -->
  <g id="ship1">
    <path d="M 50 250 L 70 250 L 65 235 Z" fill="#8B4513"/>
    <rect x="63" y="235" width="4" height="15" fill="#654321"/>
    <polygon points="67,235 80,240 67,245" fill="#FF6347"/>
  </g>
  
  <g id="ship2">
    <path d="M 420 260 L 440 260 L 435 245 Z" fill="#8B4513"/>
    <rect x="433" y="245" width="4" height="15" fill="#654321"/>
    <polygon points="437,245 450,250 437,255" fill="#FF6347"/>
  </g>
  
  <!-- Солнце -->
  <circle cx="450" cy="60" r="25" fill="#FFD700" opacity="0.8"/>
  
  <!-- Облака -->
  <ellipse cx="80" cy="50" rx="30" ry="15" fill="white" opacity="0.7"/>
  <ellipse cx="100" cy="45" rx="25" ry="12" fill="white" opacity="0.7"/>
  <ellipse cx="120" cy="50" rx="20" ry="10" fill="white" opacity="0.7"/>
  
  <ellipse cx="300" cy="80" rx="35" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="325" cy="75" rx="30" ry="15" fill="white" opacity="0.7"/>
  
  <!-- Деревья -->
  <g id="tree1">
    <rect x="30" y="170" width="5" height="20" fill="#8B4513"/>
    <circle cx="32.5" cy="165" r="10" fill="#228B22"/>
  </g>
  
  <g id="tree2">
    <rect x="460" y="180" width="5" height="15" fill="#8B4513"/>
    <circle cx="462.5" cy="175" r="8" fill="#32CD32"/>
  </g>
  
  <!-- Столбы -->
  <rect x="250" y="210" width="5" height="30" fill="#696969"/>
  <rect x="255" y="210" width="5" height="30" fill="#696969"/>
  
  <!-- Надписи -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#textGrad)">ИСТОРИЯ · 7 КЛАСС</text>
  
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2F4F4F">Урок 4. Древняя Греция</text>
  
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8B0000">ПОЛИСЫ</text>
  
  <text x="130" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2F4F4F">Афины</text>
  
  <text x="410" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2F4F4F">Спарта</text>
  
  <text x="250" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2F4F4F">Эгейское море</text>
  
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Торговля</text>
  
  <text x="430" y="280" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Флот</text>
  
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2F4F4F">Город-государство</text>
  
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2F4F4F">самоуправление</text>
  
  <text x="20" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Акрополь</text>
  
  <text x="380" y="150" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Храм</text>
  
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="8" fill="#2F4F4F">Ворота</text>
  
  <text x="250" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">Стена</text>
  
  <text x="35" y="155" font-family="Arial, sans-serif" font-size="8" fill="#2F4F4F">Дерево</text>
  
  <text x="465" y="165" font-family="Arial, sans-serif" font-size="8" fill="#2F4F4F">Растение</text>
  
  <text x="450" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Солнце</text>
  
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2F4F4F">Облака</text>
  
  <text x="320" y="95" font-family="Arial, sans-serif" font-size="8" fill="#2F4F4F">Облака</text>
  
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">Горы</text>
  
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="12" fill="#2F4F4F">Полис - город-государство</text>
  
  <text x="30" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2F4F4F">с собственными законами</text>
  
  <!-- Дополнительные элементы для достижения 50+ -->
  <circle cx="40" cy="90" r="3" fill="#FFD700"/>
  <circle cx="60" cy="85" r="2" fill="#FFD700"/>
  <circle cx="460" cy="120" r="3" fill="#FFD700"/>
  <circle cx="440" cy="110" r="2" fill="#FFD700"/>
  
  <rect x="155" y="115" width="3" height="5" fill="#8B4513"/>
  <rect x="165" y="118" width="2" height="3" fill="#8B4513"/>
  <rect x="340" y="105" width="3" height="5" fill="#8B4513"/>
  <rect x="350" y="108" width="2" height="3" fill="#8B4513"/>
  
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2F4F4F">V-IV вв. до н.э.</text>
</svg>