<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#4a5568">
    Урок 9. Статистические характеристики
  </text>
  
  <!-- Система координат для гистограммы -->
  <g id="coordinates">
    <!-- Ось X -->
    <line x1="50" y1="250" x2="450" y2="250" stroke="#2d3748" stroke-width="2"/>
    <!-- Ось Y -->
    <line x1="50" y1="250" x2="50" y2="80" stroke="#2d3748" stroke-width="2"/>
    
    <!-- Стрелки осей -->
    <polygon points="450,250 445,247 445,253" fill="#2d3748"/>
    <polygon points="50,80 47,85 53,85" fill="#2d3748"/>
    
    <!-- Подписи осей -->
    <text x="460" y="255" font-family="Arial" font-size="12" fill="#2d3748">x</text>
    <text x="45" y="75" font-family="Arial" font-size="12" fill="#2d3748">y</text>
  </g>
  
  <!-- Гистограмма -->
  <g id="histogram">
    <!-- Прямоугольники гистограммы -->
    <rect x="70" y="200" width="40" height="50" fill="#4299e1" opacity="0.8"/>
    <rect x="120" y="170" width="40" height="80" fill="#4299e1" opacity="0.8"/>
    <rect x="170" y="140" width="40" height="110" fill="#4299e1" opacity="0.8"/>
    <rect x="220" y="110" width="40" height="140" fill="#4299e1" opacity="0.8"/>
    <rect x="270" y="130" width="40" height="120" fill="#4299e1" opacity="0.8"/>
    <rect x="320" y="180" width="40" height="70" fill="#4299e1" opacity="0.8"/>
    <rect x="370" y="210" width="40" height="40" fill="#4299e1" opacity="0.8"/>
    
    <!-- Подписи значений -->
    <text x="90" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">2</text>
    <text x="140" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">3</text>
    <text x="190" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">4</text>
    <text x="240" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">5</text>
    <text x="290" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">6</text>
    <text x="340" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">7</text>
    <text x="390" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748">8</text>
    
    <!-- Частоты -->
    <text x="90" y="195" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">5</text>
    <text x="140" y="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">8</text>
    <text x="190" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">11</text>
    <text x="240" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">14</text>
    <text x="290" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">12</text>
    <text x="340" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">7</text>
    <text x="390" y="205" font-family="Arial" font-size="10" text-anchor="middle" fill="#2d3748">4</text>
  </g>
  
  <!-- Линия медианы -->
  <line x1="240" y1="110" x2="240" y2="250" stroke="#e53e3e" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Линия моды -->
  <line x1="240" y1="110" x2="240" y2="90" stroke="#38a169" stroke-width="2"/>
  
  <!-- Подписи для медианы и моды -->
  <text x="245" y="105" font-family="Arial" font-size="12" fill="#e53e3e">Медиана</text>
  <text x="245" y="85" font-family="Arial" font-size="12" fill="#38a169">Мода</text>
  
  <!-- Формулы -->
  <g id="formulas">
    <!-- Формула среднего -->
    <rect x="50" y="285" width="180" height="50" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="140" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748">Среднее арифметическое</text>
    <text x="140" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">x̄ = (x₁ + x₂ + ... + xₙ) / n</text>
    
    <!-- Формула медианы -->
    <rect x="240" y="285" width="160" height="50" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="320" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748">Медиана</text>
    <text x="320" y="325" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Me = x((n+1)/2)</text>
    
    <!-- Формула моды -->
    <rect x="50" y="340" width="160" height="50" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
    <text x="130" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748">Мода</text>
    <text x="130" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Mo = наиболее частое</text>
  </g>
  
  <!-- График функции распределения -->
  <g id="distribution" transform="translate(300, 60)">
    <path d="M 0,100 Q 20,80 40,60 T 80,40 Q 100,35 120,40 T 160,60 Q 180,80 200,100" 
          fill="none" stroke="#805ad5" stroke-width="2"/>
    <path d="M 0,100 Q 20,80 40,60 T 80,40 Q 100,35 120,40 T 160,60 Q 180,80 200,100 L 200,100 L 0,100 Z" 
          fill="url(#graphGrad)"/>
    <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#805ad5">Функция распределения</text>
  </g>
  
  <!-- Легенда -->
  <g id="legend" transform="translate(420, 100)">
    <rect x="0" y="0" width="70" height="80" fill="white" stroke="#cbd5e0" stroke-width="1" rx="3"/>
    <text x="35" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#2d3748" font-weight="bold">Легенда</text>
    <rect x="10" y="25" width="15" height="10" fill="#4299e1" opacity="0.8"/>
    <text x="30" y="35" font-family="Arial" font-size="10" fill="#2d3748">Частота</text>
    <line x1="10" y1="45" x2="25" y2="45" stroke="#e53e3e" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="30" y="50" font-family="Arial" font-size="10" fill="#2d3748">Медиана</text>
    <line x1="10" y1="60" x2="25" y2="60" stroke="#38a169" stroke-width="2"/>
    <text x="30" y="65" font-family="Arial" font-size="10" fill="#2d3748">Мода</text>
  </g>
  
  <!-- Названия статистических характеристик -->
  <g id="labels">
    <text x="25" y="170" font-family="Arial" font-size="14" fill="#4a5568" text-anchor="middle" transform="rotate(-90 25 170)">Частота</text>
    <text x="250" y="295" font-family="Arial" font-size="12" fill="#4a5568" text-anchor="middle">Значения</text>
    <text x="150" y="60" font-family="Arial" font-size="12" fill="#4a5568">Среднее = 5.2</text>
    <text x="150" y="75" font-family="Arial" font-size="12" fill="#4a5568">Размах = 6</text>
    <text x="150" y="90" font-family="Arial" font-size="12" fill="#4a5568">Вариация = 2.8</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="250" cy="250" r="3" fill="#2d3748"/>
  <rect x="40" y="40" width="420" height="2" fill="url(#titleGrad)" opacity="0.5"/>
  
  <!-- Подписи на гистограмме -->
  <text x="250" y="340" font-family="Arial" font-size="14" text-anchor="middle" fill="#2d3748" font-weight="bold">Распределение оценок</text>
  <text x="250" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#4a5568">Объем выборки: 61</text>
</svg>