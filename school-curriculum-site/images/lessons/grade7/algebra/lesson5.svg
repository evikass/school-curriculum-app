<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">
    Урок 5. Тождества
  </text>
  
  <!-- Система координат -->
  <g transform="translate(50, 150)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="120" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="2"/>
    
    <!-- Стрелки -->
    <path d="M 120 0 L 115 -3 L 115 3 Z" fill="#333"/>
    <path d="M 0 -100 L -3 -95 L 3 -95 Z" fill="#333"/>
    
    <!-- Разметка -->
    <text x="125" y="5" font-size="12" fill="#333">x</text>
    <text x="-10" y="-105" font-size="12" fill="#333">y</text>
    
    <!-- Точки сетки -->
    <circle cx="20" cy="0" r="1" fill="#999"/>
    <circle cx="40" cy="0" r="1" fill="#999"/>
    <circle cx="60" cy="0" r="1" fill="#999"/>
    <circle cx="80" cy="0" r="1" fill="#999"/>
    <circle cx="100" cy="0" r="1" fill="#999"/>
    
    <circle cx="0" cy="-20" r="1" fill="#999"/>
    <circle cx="0" cy="-40" r="1" fill="#999"/>
    <circle cx="0" cy="-60" r="1" fill="#999"/>
    <circle cx="0" cy="-80" r="1" fill="#999"/>
  </g>
  
  <!-- График функции y = x² -->
  <g transform="translate(50, 150)">
    <path d="M 0,0 Q 30,-80 60,-80 T 120,0" stroke="url(#graphGrad)" stroke-width="3" fill="none"/>
    <path d="M 0,0 Q 30,-80 60,-80 T 120,0" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- График функции y = 2x + 1 -->
  <g transform="translate(250, 150)">
    <!-- Система координат -->
    <line x1="0" y1="0" x2="120" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="2"/>
    
    <!-- График -->
    <line x1="0" y1="-20" x2="120" y2="-80" stroke="#4ecdc4" stroke-width="3"/>
    
    <!-- Подписи -->
    <text x="125" y="5" font-size="12" fill="#333">x</text>
    <text x="-10" y="-105" font-size="12" fill="#333">y</text>
  </g>
  
  <!-- Формула 1: Тождество -->
  <rect x="30" y="200" width="200" height="80" rx="10" fill="url(#formulaGrad)" stroke="#ddd" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" font-size="14" fill="#333">Тождество:</text>
  <text x="130" y="245" text-anchor="middle" font-size="16" fill="#2c5aa0">
    (a + b)² = a² + 2ab + b²
  </text>
  <text x="130" y="265" text-anchor="middle" font-size="12" fill="#666">для любых a и b</text>
  
  <!-- Формула 2: Пример -->
  <rect x="250" y="200" width="200" height="80" rx="10" fill="url(#formulaGrad)" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="220" text-anchor="middle" font-size="14" fill="#333">Пример:</text>
  <text x="350" y="245" text-anchor="middle" font-size="16" fill="#2c5aa0">
    (x + 3)² = x² + 6x + 9
  </text>
  <text x="350" y="265" text-anchor="middle" font-size="12" fill="#666">подстановка a = x, b = 3</text>
  
  <!-- Формула 3: Разность квадратов -->
  <rect x="140" y="290" width="200" height="50" rx="10" fill="url(#formulaGrad)" stroke="#ddd" stroke-width="1"/>
  <text x="240" y="310" text-anchor="middle" font-size="14" fill="#333">
    a² - b² = (a - b)(a + b)
  </text>
  
  <!-- Иконки -->
  <g transform="translate(30, 90)">
    <circle cx="0" cy="0" r="15" fill="#4a90e2" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-size="20" fill="#2c5aa0">=</text>
  </g>
  
  <g transform="translate(450, 90)">
    <circle cx="0" cy="0" r="15" fill="#ff6b6b" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-size="20" fill="#ff6b6b">≠</text>
  </g>
  
  <!-- Уравнение -->
  <text x="50" y="120" font-size="12" fill="#666">y = x²</text>
  <text x="250" y="120" font-size="12" fill="#666">y = 2x + 1</text>
  
  <!-- Подписи на графиках -->
  <text x="170" y="145" font-size="10" fill="#ff6b6b">парабола</text>
  <text x="370" y="145" font-size="10" fill="#4ecdc4">прямая</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="30" cy="280" r="3" fill="#4ecdc4"/>
  <circle cx="35" cy="285" r="2" fill="#ff6b6b"/>
  <circle cx="40" cy="280" r="3" fill="#4ecdc4"/>
  
  <circle cx="430" cy="280" r="3" fill="#ff6b6b"/>
  <circle cx="435" cy="285" r="2" fill="#4ecdc4"/>
  <circle cx="440" cy="280" r="3" fill="#ff6b6b"/>
  
  <!-- Текстовые блоки с пояснениями -->
  <text x="50" y="75" font-size="11" fill="#888">Тождественные выражения</text>
  <text x="420" y="75" font-size="11" fill="#888">Неравные выражения</text>
  
  <!-- Дополнительные формулы -->
  <g transform="translate(30, 250)">
    <text x="0" y="0" font-size="11" fill="#999">(a + b)³ = a³ + 3a²b + 3ab² + b³</text>
  </g>
  
  <g transform="translate(30, 265)">
    <text x="0" y="0" font-size="11" fill="#999">(a - b)³ = a³ - 3a²b + 3ab² - b³</text>
  </g>
  
  <!-- Обводка для выделения важного -->
  <rect x="28" y="198" width="204" height="84" rx="10" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Математический символ -->
  <text x="240" y="220" text-anchor="middle" font-size="24" fill="#2c5aa0">√</text>
  
  <!-- Нумерация элементов -->
  <circle cx="15" cy="210" r="8" fill="#4ecdc4"/>
  <text x="15" y="214" text-anchor="middle" font-size="10" fill="white" font-weight="bold">1</text>
  
  <circle cx="235" cy="210" r="8" fill="#ff6b6b"/>
  <text x="235" y="214" text-anchor="middle" font-size="10" fill="white" font-weight="bold">2</text>
</svg>