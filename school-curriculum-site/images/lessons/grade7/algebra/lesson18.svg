<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для фона -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для заголовка -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для выделения -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#titleGradient)">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <rect x="20" y="50" width="120" height="30" rx="15" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="80" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Урок 18</text>
  
  <!-- Раздел -->
  <rect x="360" y="50" width="120" height="30" rx="15" fill="#10b981" filter="url(#shadow)"/>
  <text x="420" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Раздел: Многочлены</text>
  
  <!-- Тема -->
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">Тема: Многочлен</text>
  <text x="250" y="130" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#475569">Подобные члены</text>
  
  <!-- Система координат -->
  <g transform="translate(50, 180)">
    <!-- Ось X -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#64748b" stroke-width="2"/>
    <polygon points="200,100 195,95 195,105" fill="#64748b"/>
    <text x="205" y="105" font-family="Arial, sans-serif" font-size="14" fill="#475569">x</text>
    
    <!-- Ось Y -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#64748b" stroke-width="2"/>
    <polygon points="0,0 -5,5 5,5" fill="#64748b"/>
    <text x="-10" y="-5" font-family="Arial, sans-serif" font-size="14" fill="#475569">y</text>
    
    <!-- График функции -->
    <path d="M 0,80 Q 20,40 40,60 T 80,30 T 120,50 T 160,20 T 200,40" 
          stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="0"/>
    <text x="100" y="15" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3b82f6">y = x² - 2x + 1</text>
  </g>
  
  <!-- Пример многочлена -->
  <rect x="280" y="160" width="200" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Пример многочлена:</text>
  
  <!-- Многочлен с выделением -->
  <g transform="translate(290, 200)">
    <!-- 3x² -->
    <rect x="0" y="0" width="50" height="25" rx="3" fill="url(#highlightGradient)"/>
    <text x="25" y="17" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">3x²</text>
    
    <!-- + 2x -->
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="14" fill="#475569">+ 2x</text>
    
    <!-- - 5x -->
    <rect x="100" y="0" width="50" height="25" rx="3" fill="url(#highlightGradient)"/>
    <text x="125" y="17" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">-5x</text>
    
    <!-- + 7 -->
    <text x="160" y="17" font-family="Arial, sans-serif" font-size="14" fill="#475569">+ 7</text>
    
    <!-- Стрелка вниз -->
    <path d="M 120,30 L 120,45" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Результат -->
    <rect x="75" y="50" width="90" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="120" y="67" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#16a34a">3x² - 3x + 7</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Определения -->
  <g transform="translate(20, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#475569">Многочлен — это сумма одночленов</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#475569">Подобные члены — одночлены с одинаковой переменной частью</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="250" cy="90" r="3" fill="#3b82f6"/>
  <circle cx="240" cy="90" r="3" fill="#10b981"/>
  <circle cx="260" cy="90" r="3" fill="#f59e0b"/>
  
  <!-- Декоративные линии -->
  <line x1="250" y1="95" x2="250" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Условие -->
  <rect x="20" y="150" width="200" height="60" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="170" font-family="Arial, sans-serif" font-size="12" fill="#475569">Сократить подобные члены:</text>
  <text x="30" y="190" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">4x² - 3x + 5x² - 2x + 7</text>
  
  <!-- Ответ -->
  <rect x="20" y="220" width="200" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="30" y="245" font-family="Arial, sans-serif" font-size="14" fill="#16a34a">9x² - 5x + 7</text>
  
  <!-- Пояснение -->
  <g transform="translate(20, 270)">
    <circle cx="5" cy="5" r="3" fill="#3b82f6"/>
    <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#64748b">4x² + 5x² = 9x²</text>
  </g>
  <g transform="translate(20, 285)">
    <circle cx="5" cy="5" r="3" fill="#10b981"/>
    <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#64748b">-3x - 2x = -5x</text>
  </g>
  
  <!-- Дополнительные формулы -->
  <rect x="280" y="290" width="200" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="290" y="310" font-family="Arial, sans-serif" font-size="12" fill="#475569">Коэффициент при x²: 9</text>
  <text x="290" y="330" font-family="Arial, sans-serif" font-size="12" fill="#475569">Коэффициент при x: -5</text>
</svg>