<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D9534F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9302C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Основная тема -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#34495E">
    Линейное уравнение ax = b
  </text>
  
  <!-- Система координат -->
  <g transform="translate(100, 200)">
    <!-- Ось X -->
    <line x1="-50" y1="0" x2="150" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <polygon points="150,0 145,-3 145,3" fill="#2C3E50"/>
    <text x="155" y="5" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">x</text>
    
    <!-- Ось Y -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#2C3E50" stroke-width="2"/>
    <polygon points="0,-80 -3,-75 3,-75" fill="#2C3E50"/>
    <text x="5" y="-75" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">y</text>
    
    <!-- Сетка -->
    <g stroke="#E0E0E0" stroke-width="0.5">
      <line x1="-50" y1="-40" x2="150" y2="-40"/>
      <line x1="-50" y1="40" x2="150" y2="40"/>
      <line x1="-25" y1="-80" x2="-25" y2="80"/>
      <line x1="25" y1="-80" x2="25" y2="80"/>
      <line x1="50" y1="-80" x2="50" y2="80"/>
      <line x1="75" y1="-80" x2="75" y2="80"/>
      <line x1="100" y1="-80" x2="100" y2="80"/>
      <line x1="125" y1="-80" x2="125" y2="80"/>
    </g>
    
    <!-- График y = 2x -->
    <line x1="-50" y1="-100" x2="75" y2="150" stroke="url(#blueGrad)" stroke-width="3"/>
    
    <!-- График y = 6 (горизонтальная линия) -->
    <line x1="-50" y1="-60" x2="150" y2="-60" stroke="url(#redGrad)" stroke-width="3"/>
    
    <!-- Точка пересечения -->
    <circle cx="3" cy="-60" r="5" fill="#E74C3C"/>
    <text x="8" y="-55" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">(3, -60)</text>
    
    <!-- Подписи на графике -->
    <text x="80" y="-90" font-family="Arial, sans-serif" font-size="12" fill="#4A90E2">y = 2x</text>
    <text x="80" y="-70" font-family="Arial, sans-serif" font-size="12" fill="#D9534F">y = 6</text>
  </g>
  
  <!-- Формула ax = b -->
  <rect x="300" y="80" width="180" height="60" fill="url(#purpleGrad)" rx="10"/>
  <text x="390" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    ax = b
  </text>
  
  <!-- Корень уравнения -->
  <rect x="300" y="150" width="180" height="40" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1" rx="5"/>
  <text x="390" y="175" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">
    x = b/a
  </text>
  
  <!-- Примеры -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="150" height="50" fill="url(#greenGrad)" rx="8"/>
    <text x="75" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Пример 1:
    </text>
    <text x="75" y="38" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      3x = 12
    </text>
    <text x="75" y="52" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      x = 4
    </text>
  </g>
  
  <g transform="translate(220, 280)">
    <rect x="0" y="0" width="150" height="50" fill="url(#greenGrad)" rx="8"/>
    <text x="75" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Пример 2:
    </text>
    <text x="75" y="38" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      2x = -8
    </text>
    <text x="75" y="52" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      x = -4
    </text>
  </g>
  
  <g transform="translate(390, 280)">
    <rect x="0" y="0" width="100" height="50" fill="#FFA500" rx="8"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Условие:
    </text>
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      a ≠ 0
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="30" cy="30" r="8" fill="#3498DB" opacity="0.7"/>
  <circle cx="470" cy="30" r="8" fill="#E74C3C" opacity="0.7"/>
  <circle cx="30" cy="330" r="8" fill="#2ECC71" opacity="0.7"/>
  <circle cx="470" cy="330" r="8" fill="#F39C12" opacity="0.7"/>
  
  <!-- Разделительные линии -->
  <line x1="20" y1="100" x2="480" y2="100" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="20" y1="250" x2="480" y2="250" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Подписи к осям -->
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">0</text>
  <text x="70" y="205" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">1</text>
  <text x="95" y="205" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">2</text>
  <text x="120" y="205" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">3</text>
  
  <!-- Стрелки и указатели -->
  <path d="M 250 120 L 350 120" stroke="#95A5A6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Определение -->
  <rect x="300" y="200" width="180" height="70" fill="#E8F4FD" stroke="#4A90E2" stroke-width="1" rx="5"/>
  <text x="390" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2C3E50" font-weight="bold">
    Корень уравнения:
  </text>
  <text x="390" y="238" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495E">
    значение x, которое
  </text>
  <text x="390" y="252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495E">
    обращает уравнение в верное
  </text>
  <text x="390" y="266" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495E">
    равенство
  </text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95A5A6"/>
    </marker>
  </defs>
  
  <!-- Дополнительные математические символы -->
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">∑</text>
  <text x="460" y="250" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">∫</text>
  <text x="30" y="310" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">∆</text>
  <text x="460" y="310" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">∞</text>
</svg>