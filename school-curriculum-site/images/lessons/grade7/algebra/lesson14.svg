<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d9534f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9302c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Урок 14 -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">
    Урок 14. Степень с натуральным показателем
  </text>
  
  <!-- Система координат -->
  <g transform="translate(100, 180)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#666" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#666" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="200,0 195,-3 195,3" fill="#666"/>
    <polygon points="0,-120 -3,-115 3,-115" fill="#666"/>
    
    <!-- Подписи осей -->
    <text x="210" y="5" font-family="Arial" font-size="14" fill="#666">x</text>
    <text x="5" y="-125" font-family="Arial" font-size="14" fill="#666">y</text>
    
    <!-- Шкалы -->
    <g stroke="#999" stroke-width="1">
      <line x1="40" y1="-3" x2="40" y2="3"/>
      <line x1="80" y1="-3" x2="80" y2="3"/>
      <line x1="120" y1="-3" x2="120" y2="3"/>
      <line x1="160" y1="-3" x2="160" y2="3"/>
      
      <line x1="-3" y1="-30" x2="3" y2="-30"/>
      <line x1="-3" y1="-60" x2="3" y2="-60"/>
      <line x1="-3" y1="-90" x2="3" y2="-90"/>
    </g>
    
    <!-- Подписи шкал -->
    <text x="35" y="20" font-family="Arial" font-size="12" fill="#666">1</text>
    <text x="75" y="20" font-family="Arial" font-size="12" fill="#666">2</text>
    <text x="115" y="20" font-family="Arial" font-size="12" fill="#666">3</text>
    <text x="155" y="20" font-family="Arial" font-size="12" fill="#666">4</text>
    
    <!-- График функции y = x² -->
    <path d="M 0,0 Q 20,-20 40,-40 Q 60,-60 80,-80 Q 100,-100 120,-110 Q 140,-118 160,-120" 
          stroke="url(#blueGrad)" stroke-width="3" fill="none" filter="url(#shadow)"/>
    
    <!-- Точки на графике -->
    <circle cx="0" cy="0" r="4" fill="#4a90e2"/>
    <circle cx="40" cy="-40" r="4" fill="#4a90e2"/>
    <circle cx="80" cy="-80" r="4" fill="#4a90e2"/>
    <circle cx="120" cy="-110" r="4" fill="#4a90e2"/>
    
    <!-- Подпись функции -->
    <text x="130" y="-90" font-family="Arial" font-size="14" fill="#4a90e2" font-style="italic">y = x²</text>
  </g>
  
  <!-- Определение степени -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="160" height="80" fill="white" stroke="#ddd" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="10" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Степень:</text>
    <text x="10" y="45" font-family="Arial" font-size="13" fill="#34495e">aⁿ = a · a · ... · a</text>
    <text x="10" y="65" font-family="Arial" font-size="12" fill="#7f8c8d">(n раз)</text>
  </g>
  
  <!-- Примеры степеней -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Примеры:</text>
    
    <!-- 2³ -->
    <g transform="translate(0, 25)">
      <rect x="0" y="-20" width="80" height="40" fill="white" stroke="#4a90e2" stroke-width="1" rx="3"/>
      <text x="40" y="-5" text-anchor="middle" font-family="Arial" font-size="18" fill="#4a90e2">2³</text>
      <text x="40" y="12" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">= 8</text>
    </g>
    
    <!-- 5² -->
    <g transform="translate(100, 25)">
      <rect x="0" y="-20" width="80" height="40" fill="white" stroke="#5cb85c" stroke-width="1" rx="3"/>
      <text x="40" y="-5" text-anchor="middle" font-family="Arial" font-size="18" fill="#5cb85c">5²</text>
      <text x="40" y="12" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">= 25</text>
    </g>
    
    <!-- 10⁴ -->
    <g transform="translate(200, 25)">
      <rect x="0" y="-20" width="80" height="40" fill="white" stroke="#d9534f" stroke-width="1" rx="3"/>
      <text x="40" y="-5" text-anchor="middle" font-family="Arial" font-size="18" fill="#d9534f">10⁴</text>
      <text x="40" y="12" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">= 10000</text>
    </g>
  </g>
  
  <!-- Свойства степеней -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="200" height="70" fill="white" stroke="#999" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Свойства:</text>
    <text x="10" y="40" font-family="Arial" font-size="12" fill="#34495e">a¹ = a</text>
    <text x="10" y="58" font-family="Arial" font-size="12" fill="#34495e">a⁰ = 1 (a ≠ 0)</text>
  </g>
  
  <!-- Степень с основанием 2 -->
  <g transform="translate(320, 200)">
    <rect x="0" y="0" width="160" height="90" fill="white" stroke="#999" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Степень с основанием 2:</text>
    <text x="10" y="40" font-family="Arial" font-size="12" fill="#34495e">2¹ = 2</text>
    <text x="10" y="56" font-family="Arial" font-size="12" fill="#34495e">2² = 4</text>
    <text x="10" y="72" font-family="Arial" font-size="12" fill="#34495e">2³ = 8</text>
  </g>
  
  <!-- Формула для произведения степеней -->
  <g transform="translate(320, 310)">
    <rect x="0" y="0" width="160" height="30" fill="white" stroke="#999" stroke-width="1" rx="3" filter="url(#shadow)"/>
    <text x="10" y="20" font-family="Arial" font-size="12" fill="#34495e">aᵐ · aⁿ = aᵐ⁺ⁿ</text>
  </g>
  
  <!-- Обозначения -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="120" height="60" fill="white" stroke="#999" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">Обозначения:</text>
    <text x="10" y="38" font-family="Arial" font-size="12" fill="#34495e">a - основание</text>
    <text x="10" y="52" font-family="Arial" font-size="12" fill="#34495e">n - показатель</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="50" cy="330" r="3" fill="#4a90e2" opacity="0.5"/>
  <circle cx="60" cy="335" r="2" fill="#5cb85c" opacity="0.5"/>
  <circle cx="450" cy="30" r="4" fill="#d9534f" opacity="0.5"/>
  <circle cx="440" cy="40" r="3" fill="#4a90e2" opacity="0.5"/>
  
  <!-- Подписи для графика -->
  <g transform="translate(100, 180)">
    <text x="-20" y="5" font-family="Arial" font-size="12" fill="#666">0</text>
    <text x="35" y="-35" font-family="Arial" font-size="11" fill="#4a90e2">(2, 4)</text>
    <text x="75" y="-75" font-family="Arial" font-size="11" fill="#4a90e2">(3, 9)</text>
  </g>
  
  <!-- Текстовая рамка с важной информацией -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="3"/>
    <text x="10" y="20" font-family="Arial" font-size="12" fill="#856404">n ∈ N, n ≥ 1</text>
  </g>
</svg>