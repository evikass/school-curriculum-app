<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ECF0F1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#BDC3C7;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="250" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="80" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Урок 12. Прямая пропорциональность</text>
  
  <!-- Система координат -->
  <g transform="translate(100, 200)">
    <!-- Сетка -->
    <g stroke="url(#gridGrad)" stroke-width="0.5">
      <line x1="0" y1="-100" x2="0" y2="100"/>
      <line x1="-50" y1="-100" x2="-50" y2="100"/>
      <line x1="-100" y1="-100" x2="-100" y2="100"/>
      <line x1="50" y1="-100" x2="50" y2="100"/>
      <line x1="100" y1="-100" x2="100" y2="100"/>
      <line x1="-150" y1="-100" x2="-150" y2="100"/>
      <line x1="150" y1="-100" x2="150" y2="100"/>
      
      <line x1="-200" y1="-50" x2="200" y2="-50"/>
      <line x1="-200" y1="0" x2="200" y2="0"/>
      <line x1="-200" y1="50" x2="200" y2="50"/>
    </g>
    
    <!-- Ось X -->
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#34495E" stroke-width="2"/>
    <polygon points="200,0 190,-5 190,5" fill="#34495E"/>
    
    <!-- Ось Y -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#34495E" stroke-width="2"/>
    <polygon points="0,-100 -5,-90 5,-90" fill="#34495E"/>
    
    <!-- Цифры на осях -->
    <text x="45" y="15" fill="#34495E" font-family="Arial" font-size="12">1</text>
    <text x="95" y="15" fill="#34495E" font-family="Arial" font-size="12">2</text>
    <text x="-5" y="-55" fill="#34495E" font-family="Arial" font-size="12">1</text>
    <text x="-5" y="-105" fill="#34495E" font-family="Arial" font-size="12">2</text>
    
    <!-- Прямая пропорциональность y = 0.5x -->
    <line x1="-150" y1="-75" x2="150" y2="75" stroke="url(#lineGrad)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Точки на прямой -->
    <circle cx="-100" cy="-50" r="4" fill="#E74C3C"/>
    <circle cx="0" cy="0" r="4" fill="#E74C3C"/>
    <circle cx="100" cy="50" r="4" fill="#E74C3C"/>
    <circle cx="50" cy="25" r="4" fill="#E74C3C"/>
    <circle cx="-50" cy="-25" r="4" fill="#E74C3C"/>
    
    <!-- Подписи точек -->
    <text x="-100" y="-40" fill="#2C3E50" font-family="Arial" font-size="10">(-2,-1)</text>
    <text x="60" y="40" fill="#2C3E50" font-family="Arial" font-size="10">(2,1)</text>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="160" height="80" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="80" y="25" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="14" font-weight="bold">Формула:</text>
    <text x="80" y="45" text-anchor="middle" fill="#E74C3C" font-family="Arial" font-size="16">y = kx</text>
    <text x="80" y="65" text-anchor="middle" fill="#7F8C8D" font-family="Arial" font-size="12">k ≠ 0</text>
  </g>
  
  <!-- Свойства -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="60" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" fill="#2C3E50" font-family="Arial" font-size="12" font-weight="bold">Свойства функции y = kx:</text>
    <text x="10" y="35" fill="#34495E" font-family="Arial" font-size="11">• Пр проходит через начало координат</text>
    <text x="10" y="50" fill="#34495E" font-family="Arial" font-size="11">• При k > 0 - возрастающая функция</text>
    <text x="210" y="35" fill="#34495E" font-family="Arial" font-size="11">• При k < 0 - убывающая функция</text>
    <text x="210" y="50" fill="#34495E" font-family="Arial" font-size="11">• k - коэффициент пропорциональности</text>
  </g>
  
  <!-- Примеры значений -->
  <g transform="translate(50, 150)">
    <text x="0" y="0" fill="#2C3E50" font-family="Arial" font-size="12" font-weight="bold">Примеры:</text>
    <text x="0" y="20" fill="#7F8C8D" font-family="Arial" font-size="11">y = 2x</text>
    <text x="60" y="20" fill="#7F8C8D" font-family="Arial" font-size="11">x: -2, -1, 0, 1, 2</text>
    <text x="180" y="20" fill="#E74C3C" font-family="Arial" font-size="11">y: -4, -2, 0, 2, 4</text>
    
    <text x="0" y="40" fill="#7F8C8D" font-family="Arial" font-size="11">y = -0.5x</text>
    <text x="70" y="40" fill="#7F8C8D" font-family="Arial" font-size="11">x: -2, -1, 0, 1, 2</text>
    <text x="160" y="40" fill="#E74C3C" font-family="Arial" font-size="11">y: 1, 0.5, 0, -0.5, -1</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(350, 250)">
    <circle cx="0" cy="0" r="3" fill="#3498DB"/>
    <text x="10" y="4" fill="#7F8C8D" font-family="Arial" font-size="10">(0,0)</text>
  </g>
  
  <!-- Указатель k -->
  <g transform="translate(120, 180)">
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="5" y="-10" fill="#9B59B6" font-family="Arial" font-size="12">k = 0.5</text>
  </g>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9B59B6"/>
    </marker>
  </defs>
  
  <!-- Легенда -->
  <g transform="translate(320, 220)">
    <rect x="0" y="0" width="160" height="50" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <line x1="10" y1="15" x2="40" y2="15" stroke="url(#lineGrad)" stroke-width="3"/>
    <text x="45" y="19" fill="#2C3E50" font-family="Arial" font-size="11">y = 0.5x</text>
    <circle cx="25" cy="30" r="3" fill="#E74C3C"/>
    <text x="45" y="34" fill="#2C3E50" font-family="Arial" font-size="11">Точки графика</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="100" r="2" fill="#3498DB" opacity="0.5"/>
  <circle cx="470" cy="90" r="2" fill="#E74C3C" opacity="0.5"/>
  <circle cx="480" cy="320" r="2" fill="#F39C12" opacity="0.5"/>
  <circle cx="20" cy="340" r="2" fill="#27AE60" opacity="0.5"/>
</svg>