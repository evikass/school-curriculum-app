<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="functionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="functionGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGradient)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Урок 3 -->
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">
    Урок 3. Сравнение значений выражений
  </text>
  
  <!-- Тема -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">
    Тема: Сравнение, неравенства
  </text>
  
  <!-- Система координат 1 -->
  <g transform="translate(50, 100)">
    <!-- Ось X -->
    <line x1="0" y1="100" x2="150" y2="100" stroke="#374151" stroke-width="2"/>
    <!-- Ось Y -->
    <line x1="75" y1="0" x2="75" y2="150" stroke="#374151" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="150,100 145,95 145,105" fill="#374151"/>
    <polygon points="75,0 70,5 80,5" fill="#374151"/>
    
    <!-- Подписи осей -->
    <text x="155" y="105" font-family="Arial, sans-serif" font-size="12" fill="#374151">x</text>
    <text x="80" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#374151">y</text>
    
    <!-- Цифры на осях -->
    <text x="70" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">0</text>
    <text x="120" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
    <text x="45" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">-1</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
    <text x="80" y="75" font-family="Arial, sans-serif" font-size="10" fill="#64748b">0.5</text>
    
    <!-- Функция y = x -->
    <line x1="0" y1="125" x2="150" y2="50" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Подпись функции -->
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">y = x</text>
  </g>
  
  <!-- Система координат 2 -->
  <g transform="translate(250, 100)">
    <!-- Ось X -->
    <line x1="0" y1="100" x2="150" y2="100" stroke="#374151" stroke-width="2"/>
    <!-- Ось Y -->
    <line x1="75" y1="0" x2="75" y2="150" stroke="#374151" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="150,100 145,95 145,105" fill="#374151"/>
    <polygon points="75,0 70,5 80,5" fill="#374151"/>
    
    <!-- Подписи осей -->
    <text x="155" y="105" font-family="Arial, sans-serif" font-size="12" fill="#374151">x</text>
    <text x="80" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#374151">y</text>
    
    <!-- Цифры на осях -->
    <text x="70" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">0</text>
    <text x="120" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
    <text x="45" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b">-1</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
    
    <!-- Функция y = x² -->
    <path d="M 0 140 Q 37.5 100 75 50 Q 112.5 100 150 140" stroke="#10b981" stroke-width="2" fill="none"/>
    
    <!-- Подпись функции -->
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="12" fill="#10b981">y = x²</text>
  </g>
  
  <!-- Сравнение неравенств -->
  <g transform="translate(50, 260)">
    <!-- Прямая линия -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#374151" stroke-width="1"/>
    
    <!-- Точки A и B -->
    <circle cx="50" cy="0" r="4" fill="#dc2626"/>
    <circle cx="150" cy="0" r="4" fill="#10b981"/>
    
    <!-- Подписи точек -->
    <text x="50" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">A(-1)</text>
    <text x="150" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">B(1)</text>
    
    <!-- Знак неравенства -->
    <text x="100" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">A &lt; B</text>
    
    <!-- Подпись -->
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">-1 &lt; 1</text>
  </g>
  
  <!-- Таблица сравнения -->
  <g transform="translate(300, 260)">
    <rect x="0" y="0" width="150" height="60" fill="white" stroke="#e2e8f0" stroke-width="1" rx="5"/>
    
    <!-- Заголовок -->
    <text x="75" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">
      Свойства сравнения
    </text>
    
    <!-- Свойство 1 -->
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#374151">
      Если a &lt; b и b &lt; c,
    </text>
    <text x="10" y="42" font-family="Arial, sans-serif" font-size="10" fill="#374151">
      то a &lt; c
    </text>
    
    <!-- Свойство 2 -->
    <text x="10" y="54" font-family="Arial, sans-serif" font-size="10" fill="#374151">
      Если a &lt; b, то a + c &lt; b + c
    </text>
  </g>
  
  <!-- Примеры сравнения -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      Примеры:
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      2 + 3 &lt; 2 + 5
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      x² + 1 &gt; x² для всех x
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      |x| ≥ 0 для всех x
    </text>
  </g>
  
  <!-- График системы неравенств -->
  <g transform="translate(350, 120)">
    <!-- Область графика -->
    <rect x="0" y="0" width="100" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    
    <!-- Подпись -->
    <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">
      Область решений
    </text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="20" cy="20" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="480" cy="20" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="20" cy="330" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="480" cy="330" r="3" fill="#3b82f6" opacity="0.5"/>
  
  <!-- Декоративные линии -->
  <line x1="10" y1="90" x2="20" y2="90" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="480" y1="90" x2="490" y2="90" stroke="#cbd5e1" stroke-width="1"/>
</svg>