<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="graphGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd6b20;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)"/>
  <text x="250" y="35" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial, sans-serif">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="30" y="35" fill="white" font-size="14" font-family="Arial, sans-serif">Урок 24</text>
  
  <!-- Основной заголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#2d3748" font-size="20" font-weight="bold" font-family="Arial, sans-serif">Системы уравнений</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="115" text-anchor="middle" fill="#4a5568" font-size="16" font-family="Arial, sans-serif">Тема: Система, решение</text>
  
  <!-- Система координат -->
  <g transform="translate(100, 200)">
    <!-- Ось X -->
    <line x1="0" y1="0" x2="250" y2="0" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Ось Y -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Стрелки -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748"/>
      </marker>
    </defs>
    
    <!-- Решетки -->
    <g stroke="#cbd5e0" stroke-width="0.5">
      <!-- Вертикальные линии -->
      <line x1="50" y1="-150" x2="50" y2="10"/>
      <line x1="100" y1="-150" x2="100" y2="10"/>
      <line x1="150" y1="-150" x2="150" y2="10"/>
      <line x1="200" y1="-150" x2="200" y2="10"/>
      
      <!-- Горизонтальные линии -->
      <line x1="-10" y1="-50" x2="250" y2="-50"/>
      <line x1="-10" y1="-100" x2="250" y2="-100"/>
      <line x1="-10" y1="-150" x2="250" y2="-150"/>
    </g>
    
    <!-- Функция 1: y = x/2 + 1 -->
    <path d="M 0,0 L 50,25 L 100,50 L 150,75 L 200,100" 
          stroke="#667eea" stroke-width="3" fill="none" filter="url(#shadow)"/>
    <path d="M 0,0 L 50,25 L 100,50 L 150,75 L 200,100 L 250,125 L 250,0 Z" 
          fill="url(#graphGrad1)" opacity="0.5"/>
    
    <!-- Функция 2: y = -x + 100 -->
    <path d="M 0,0 L 50,50 L 100,100 L 150,150 L 200,200" 
          stroke="#f093fb" stroke-width="3" fill="none" filter="url(#shadow)"/>
    <path d="M 0,0 L 50,50 L 100,100 L 150,150 L 200,200 L 250,250 L 250,0 Z" 
          fill="url(#graphGrad2)" opacity="0.5"/>
    
    <!-- Точка пересечения -->
    <circle cx="66.7" cy="33.3" r="6" fill="url(#highlightGrad)" filter="url(#shadow)"/>
    <text x="76.7" y="28.3" fill="#dd6b20" font-size="12" font-weight="bold">M(2; 2)</text>
    
    <!-- Подписи осей -->
    <text x="260" y="5" fill="#2d3748" font-size="14">x</text>
    <text x="-5" y="-155" fill="#2d3748" font-size="14">y</text>
    
    <!-- Масштаб -->
    <text x="45" y="15" fill="#718096" font-size="10">1</text>
    <text x="95" y="15" fill="#718096" font-size="10">2</text>
    <text x="145" y="15" fill="#718096" font-size="10">3</text>
    <text x="195" y="15" fill="#718096" font-size="10">4</text>
    
    <text x="-15" y="-95" fill="#718096" font-size="10">1</text>
    <text x="-15" y="-45" fill="#718096" font-size="10">2</text>
    <text x="-15" y="-5" fill="#718096" font-size="10">3</text>
  </g>
  
  <!-- Формулы системы -->
  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="140" height="60" fill="white" stroke="#e2e8f0" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="10" y="25" fill="#2d3748" font-size="14" font-family="Arial, sans-serif">{ 2x + y = 4 </text>
    <text x="10" y="45" fill="#2d3748" font-size="14" font-family="Arial, sans-serif">{ x - y = 0</text>
  </g>
  
  <!-- Блок объяснения -->
  <g transform="translate(320, 150)">
    <rect x="0" y="0" width="160" height="100" fill="white" stroke="#e2e8f0" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" fill="#2d3748" font-size="12" font-weight="bold" font-family="Arial, sans-serif">Система уравнений:</text>
    <text x="10" y="40" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">1. Совокупность</text>
    <text x="10" y="55" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">   двух уравнений</text>
    <text x="10" y="70" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">2. Решение - пара</text>
    <text x="10" y="85" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">   чисел (x; y)</text>
  </g>
  
  <!-- Стрелка к решению -->
  <path d="M 155,160 Q 180,180 220,190" stroke="#ed8936" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ed8936"/>
    </marker>
  </defs>
  
  <!-- Пример решения -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="440" height="60" fill="white" stroke="#e2e8f0" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="10" y="20" fill="#2d3748" font-size="12" font-weight="bold" font-family="Arial, sans-serif">Решение:</text>
    <text x="10" y="40" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">Из второго уравнения: x = y</text>
    <text x="10" y="55" fill="#4a5568" font-size="11" font-family="Arial, sans-serif">Подставляем в первое: 2y + y = 4 ⇒ y = 4/3, x = 4/3</text>
    <text x="240" y="35" fill="#667eea" font-size="12" font-family="Arial, sans-serif">Ответ: (4/3; 4/3)</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="470" cy="30" r="15" fill="#667eea" opacity="0.3"/>
  <circle cx="450" cy="50" r="10" fill="#f093fb" opacity="0.3"/>
  <circle cx="480" cy="55" r="8" fill="#ed8936" opacity="0.3"/>
</svg>