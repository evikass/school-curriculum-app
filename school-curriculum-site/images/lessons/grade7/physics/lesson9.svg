<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#37474f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78909c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#546e7a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">ФИЗИКА · 7 КЛАСС</text>
  
  <!-- Урок 9 -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#1976d2">Урок 9. Давление</text>
  
  <!-- Книга с блоком -->
  <g transform="translate(150, 100)">
    <!-- Книга -->
    <rect x="0" y="0" width="200" height="150" rx="5" fill="url(#bookGrad)" stroke="#37474f" stroke-width="2"/>
    <rect x="10" y="10" width="180" height="130" rx="3" fill="#455a64" stroke="#263238" stroke-width="1"/>
    
    <!-- Блок на книге -->
    <rect x="70" y="60" width="60" height="60" fill="url(#blockGrad)" stroke="#37474f" stroke-width="2"/>
    
    <!-- Стрелка давления вниз -->
    <g transform="translate(100, 30)">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="url(#arrowGrad)" stroke-width="4" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Стрелка давления вверх -->
    <g transform="translate(100, 200)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="url(#arrowGrad)" stroke-width="4" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- Определение давления -->
    <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Блок</text>
    <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">F = 20 Н</text>
    <text x="100" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">S = 60 см²</text>
  </g>
  
  <!-- Стрелка вниз -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGrad)"/>
    </marker>
  </defs>
  
  <!-- Формула давления -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="140" height="50" rx="5" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">P = F/S</text>
  </g>
  
  <!-- Единица измерения -->
  <g transform="translate(190, 280)">
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">1 Па = 1 Н/м²</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">Паскаль</text>
  </g>
  
  <!-- Примеры давления -->
  <g transform="translate(330, 280)">
    <rect x="0" y="0" width="150" height="50" rx="5" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1565c0">Атмосферное:</text>
    <text x="75" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">101 325 Па</text>
  </g>
  
  <!-- Подписи к стрелкам -->
  <text x="130" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">Сила давления</text>
  <text x="130" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">Реакция опоры</text>
  
  <!-- Площадь опоры -->
  <g transform="translate(50, 150)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#4caf50" stroke-width="2" marker-end="url(#greenarrow)"/>
    <text x="20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">S</text>
  </g>
  
  <g transform="translate(310, 150)">
    <line x1="0" y1="0" x2="-40" y2="0" stroke="#4caf50" stroke-width="2" marker-start="url(#greenarrow)"/>
    <text x="-20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">S</text>
  </g>
  
  <!-- Зеленая стрелка -->
  <defs>
    <marker id="greenarrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4caf50"/>
    </marker>
  </defs>
  
  <!-- Таблица единиц давления -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="100" height="80" rx="3" fill="#fff" stroke="#757575" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#424242">Единицы давления</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#616161">Паскаль (Па)</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#616161">ГПа (10⁹)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="9" fill="#616161">МПа (10⁶)</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#616161">кПа (10³)</text>
  </g>
  
  <!-- Примечание -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="10" fill="#616161">Давление - это</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="10" fill="#616161">отношение силы</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="10" fill="#616161">к площади опоры</text>
  
  <!-- Молекуулы воздуха -->
  <circle cx="420" cy="200" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="435" cy="210" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="425" cy="220" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="440" cy="195" r="3" fill="#64b5f6" opacity="0.6"/>
  <circle cx="430" cy="230" r="3" fill="#64b5f6" opacity="0.6"/>
  
  <!-- Весы -->
  <g transform="translate(380, 250)">
    <rect x="0" y="0" width="60" height="30" rx="3" fill="#795548" stroke="#5d4037" stroke-width="1"/>
    <line x1="30" y1="0" x2="30" y2="-10" stroke="#5d4037" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Весы</text>
  </g>
  
  <!-- Цифровые значения -->
  <text x="250" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">P = 3333 Па</text>
  
  <!-- Разделительная линия -->
  <line x1="20" y1="250" x2="480" y2="250" stroke="#90a4ae" stroke-width="1" stroke-dasharray="5,5"/>
</svg>