<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="synGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="antGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">РУССКИЙ ЯЗЫК · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="600">Урок 4. Лексика и фразеология</text>
  
  <!-- Раздел Синонимы -->
  <rect x="30" y="110" width="220" height="220" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="110" width="220" height="40" rx="10" fill="url(#synGrad)"/>
  <text x="140" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">СИНОНИМЫ</text>
  
  <!-- Синонимы примеры -->
  <circle cx="60" cy="170" r="3" fill="#10b981"/>
  <text x="70" y="175" fill="#374151" font-family="Arial, sans-serif" font-size="14">быстрый - скорый</text>
  
  <circle cx="60" cy="195" r="3" fill="#10b981"/>
  <text x="70" y="200" fill="#374151" font-family="Arial, sans-serif" font-size="14">красивый - прекрасный</text>
  
  <circle cx="60" cy="220" r="3" fill="#10b981"/>
  <text x="70" y="225" fill="#374151" font-family="Arial, sans-serif" font-size="14">дом - жилище</text>
  
  <circle cx="60" cy="245" r="3" fill="#10b981"/>
  <text x="70" y="250" fill="#374151" font-family="Arial, sans-serif" font-size="14">идти - шагать</text>
  
  <circle cx="60" cy="270" r="3" fill="#10b981"/>
  <text x="70" y="275" fill="#374151" font-family="Arial, sans-serif" font-size="14">любить - обожать</text>
  
  <!-- Раздел Антонимы -->
  <rect x="250" y="110" width="220" height="220" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="250" y="110" width="220" height="40" rx="10" fill="url(#antGrad)"/>
  <text x="360" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">АНТОНИМЫ</text>
  
  <!-- Антонимы примеры -->
  <circle cx="280" cy="170" r="3" fill="#f59e0b"/>
  <text x="290" y="175" fill="#374151" font-family="Arial, sans-serif" font-size="14">боль - здоровье</text>
  
  <circle cx="280" cy="195" r="3" fill="#f59e0b"/>
  <text x="290" y="200" fill="#374151" font-family="Arial, sans-serif" font-size="14">день - ночь</text>
  
  <circle cx="280" cy="220" r="3" fill="#f59e0b"/>
  <text x="290" y="225" fill="#374151" font-family="Arial, sans-serif" font-size="14">холод - тепло</text>
  
  <circle cx="280" cy="245" r="3" fill="#f59e0b"/>
  <text x="290" y="250" fill="#374151" font-family="Arial, sans-serif" font-size="14">вверх - вниз</text>
  
  <circle cx="280" cy="270" r="3" fill="#f59e0b"/>
  <text x="290" y="275" fill="#374151" font-family="Arial, sans-serif" font-size="14">весело - грустно</text>
  
  <!-- Стрелка связи -->
  <path d="M 250 170 L 250 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 220 L 250 270" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <text x="250" y="340" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12" font-style="italic">Синонимы - слова с相近 значением</text>
  
  <!-- Декоративные элементы -->
  <circle cx="50" cy="340" r="5" fill="#10b981" opacity="0.5"/>
  <circle cx="450" cy="340" r="5" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Пояснения -->
  <rect x="40" y="165" width="200" height="115" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <rect x="260" y="165" width="200" height="115" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  
  <!-- Дополнительные подписи -->
  <text x="140" y="310" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Одинаковые понятия</text>
  <text x="360" y="310" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Противоположные понятия</text>
  
  <!-- Иконки -->
  <path d="M 140 160 L 135 155 L 140 150 L 145 155 Z" fill="white"/>
  <path d="M 360 160 L 355 155 L 360 150 L 365 155 Z" fill="white"/>
</svg>