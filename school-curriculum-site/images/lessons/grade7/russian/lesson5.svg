<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="url(#headerGrad)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">РУССКИЙ ЯЗЫК · 7 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <text x="250" y="100" text-anchor="middle" fill="url(#textGrad)" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Урок 5. Имя существительное</text>
  
  <!-- Карточки определений -->
  <!-- Карточка 1 -->
  <rect x="30" y="120" width="210" height="80" rx="8" fill="url(#cardGrad)" stroke="#cbd5e0" stroke-width="2"/>
  <text x="40" y="140" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Определение:</text>
  <text x="40" y="160" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">Имя существительное — это</text>
  <text x="40" y="178" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">часть речи, обозначающая</text>
  <text x="40" y="196" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">предмет, явление или лицо</text>
  
  <!-- Карточка 2 -->
  <rect x="260" y="120" width="210" height="80" rx="8" fill="url(#cardGrad)" stroke="#cbd5e0" stroke-width="2"/>
  <text x="270" y="140" fill="#2d3748" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Признаки:</text>
  <text x="270" y="160" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">• Имеет род</text>
  <text x="270" y="178" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">• Изменяется по падежам</text>
  <text x="270" y="196" fill="#4a5568" font-family="Arial, sans-serif" font-size="12">• Спрягается с глаголами</text>
  
  <!-- Примеры существительных -->
  <text x="250" y="230" text-anchor="middle" fill="url(#textGrad)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Примеры существительных</text>
  
  <!-- Категория 1: Предметы -->
  <circle cx="80" cy="260" r="25" fill="#f687b3" opacity="0.8"/>
  <text x="80" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Предметы</text>
  <text x="80" y="295" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="11">стол, книга, дом</text>
  
  <!-- Категория 2: Животные -->
  <circle cx="180" cy="260" r="25" fill="#48bb78" opacity="0.8"/>
  <text x="180" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Животные</text>
  <text x="180" y="295" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="11">кошка, собака, птица</text>
  
  <!-- Категория 3: Люди -->
  <circle cx="280" cy="260" r="25" fill="#4299e1" opacity="0.8"/>
  <text x="280" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Люди</text>
  <text x="280" y="295" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="11">ученик, учитель, друг</text>
  
  <!-- Категория 4: Абстракции -->
  <circle cx="380" cy="260" r="25" fill="#9f7aea" opacity="0.8"/>
  <text x="380" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Абстракции</text>
  <text x="380" y="295" text-anchor="middle" fill="#2d3748" font-family="Arial, sans-serif" font-size="11">любовь, радость, время</text>
  
  <!-- Падежные формы -->
  <text x="250" y="320" text-anchor="middle" fill="url(#textGrad)" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Падежные формы существительного</text>
  
  <!-- Указательные стрелки -->
  <path d="M 50 280 L 130 240" stroke="#cbd5e0" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 150 280 L 230 240" stroke="#cbd5e0" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 280 L 330 240" stroke="#cbd5e0" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 280 L 430 240" stroke="#cbd5e0" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e0"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <!-- Вспомогательная линия -->
  <line x1="30" y1="210" x2="470" y2="210" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Номер урока -->
  <circle cx="40" cy="45" r="15" fill="white" opacity="0.9"/>
  <text x="40" y="50" text-anchor="middle" fill="#3182ce" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
  
  <!-- Иконки -->
  <!-- Книга -->
  <rect x="340" y="25" width="20" height="15" fill="#ed8936" opacity="0.7" rx="2"/>
  <line x1="345" y1="30" x2="355" y2="30" stroke="white" stroke-width="1"/>
  <line x1="345" y1="33" x2="355" y2="33" stroke="white" stroke-width="1"/>
  
  <!-- Карандаш -->
  <rect x="380" y="28" width="2" height="12" fill="#718096" transform="rotate(45 381 34)"/>
  <polygon points="382,28 384,26 386,28" fill="#fbbf24"/>
  
  <!-- Дополнительные подписи -->
  <text x="50" y="340" fill="#718096" font-family="Arial, sans-serif" font-size="10">Имя существительное</text>
  <text x="450" y="340" text-anchor="end" fill="#718096" font-family="Arial, sans-serif" font-size="10">Часть речи</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="30" cy="340" r="3" fill="#4299e1" opacity="0.5"/>
  <circle cx="470" cy="340" r="3" fill="#4299e1" opacity="0.5"/>
</svg>