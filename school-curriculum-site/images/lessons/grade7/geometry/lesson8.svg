<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5FCF80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A6F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F5F7FA"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="5" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">ГЕОМЕТРИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Урок 8. Параллельные прямые</text>
  
  <!-- Основная система параллельных линий -->
  <g id="parallel-lines">
    <!-- Горизонтальные параллельные линии -->
    <line x1="80" y1="130" x2="420" y2="130" stroke="#34495E" stroke-width="2"/>
    <line x1="80" y1="160" x2="420" y2="160" stroke="#34495E" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="80" y1="190" x2="420" y2="190" stroke="#34495E" stroke-width="2"/>
    <line x1="80" y1="220" x2="420" y2="220" stroke="#34495E" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="80" y1="250" x2="420" y2="250" stroke="#34495E" stroke-width="2"/>
  </g>
  
  <!-- Точка пересечения с секущей -->
  <line x1="150" y1="100" x2="150" y2="280" stroke="#E74C3C" stroke-width="3"/>
  <line x1="350" y1="100" x2="350" y2="280" stroke="#E74C3C" stroke-width="3"/>
  
  <!-- Точки пересечения -->
  <circle cx="150" cy="130" r="4" fill="#3498DB"/>
  <circle cx="150" cy="160" r="4" fill="#3498DB"/>
  <circle cx="150" cy="190" r="4" fill="#3498DB"/>
  <circle cx="150" cy="220" r="4" fill="#3498DB"/>
  <circle cx="150" cy="250" r="4" fill="#3498DB"/>
  
  <circle cx="350" cy="130" r="4" fill="#3498DB"/>
  <circle cx="350" cy="160" r="4" fill="#3498DB"/>
  <circle cx="350" cy="190" r="4" fill="#3498DB"/>
  <circle cx="350" cy="220" r="4" fill="#3498DB"/>
  <circle cx="350" cy="250" r="4" fill="#3498DB"/>
  
  <!-- Углы -->
  <g id="angles">
    <!-- Углы при точке пересечения 150 -->
    <path d="M 170 130 L 170 140 A 10 10 0 0 0 160 140" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
    <path d="M 150 140 L 160 140 A 10 10 0 0 0 160 150" fill="none" stroke="url(#redGrad)" stroke-width="2"/>
    <text x="175" y="135" font-family="Arial" font-size="12" fill="#27AE60">α</text>
    <text x="150" y="165" font-family="Arial" font-size="12" fill="#E74C3C">β</text>
    
    <!-- Углы при точке пересечения 350 -->
    <path d="M 370 130 L 370 140 A 10 10 0 0 0 360 140" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
    <path d="M 350 140 L 360 140 A 10 10 0 0 0 360 150" fill="none" stroke="url(#redGrad)" stroke-width="2"/>
    <text x="375" y="135" font-family="Arial" font-size="12" fill="#27AE60">γ</text>
    <text x="350" y="165" font-family="Arial" font-size="12" fill="#E74C3C">δ</text>
  </g>
  
  <!-- Буквенные обозначения точек -->
  <text x="145" y="125" font-family="Arial" font-size="14" fill="#2C3E50">A</text>
  <text x="145" y="155" font-family="Arial" font-size="14" fill="#2C3E50">B</text>
  <text x="145" y="185" font-family="Arial" font-size="14" fill="#2C3E50">C</text>
  <text x="145" y="215" font-family="Arial" font-size="14" fill="#2C3E50">D</text>
  <text x="145" y="245" font-family="Arial" font-size="14" fill="#2C3E50">E</text>
  
  <text x="345" y="125" font-family="Arial" font-size="14" fill="#2C3E50">A'</text>
  <text x="345" y="155" font-family="Arial" font-size="14" fill="#2C3E50">B'</text>
  <text x="345" y="185" font-family="Arial" font-size="14" fill="#2C3E50">C'</text>
  <text x="345" y="215" font-family="Arial" font-size="14" fill="#2C3E50">D'</text>
  <text x="345" y="245" font-family="Arial" font-size="14" fill="#2C3E50">E'</text>
  
  <!-- Обозначения прямых -->
  <text x="90" y="125" font-family="Arial" font-size="12" fill="#7F8C8D">a₁</text>
  <text x="90" y="155" font-family="Arial" font-size="12" fill="#7F8C8D">a₂</text>
  <text x="90" y="185" font-family="Arial" font-size="12" fill="#7F8C8D">a₃</text>
  <text x="90" y="215" font-family="Arial" font-size="12" fill="#7F8C8D">a₄</text>
  <text x="90" y="245" font-family="Arial" font-size="12" fill="#7F8C8D">a₅</text>
  
  <!-- Обозначения секущих -->
  <text x="155" y="115" font-family="Arial" font-size="12" fill="#E74C3C">p₁</text>
  <text x="355" y="115" font-family="Arial" font-size="12" fill="#E74C3C">p₂</text>
  
  <!-- Параллельность -->
  <g id="parallel-symbols">
    <!-- Обозначение параллельности для a₁ и a₂ -->
    <line x1="120" y1="145" x2="130" y2="145" stroke="#2C3E50" stroke-width="2"/>
    <line x1="125" y1="140" x2="125" y2="150" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Обозначение параллельности для a₃ и a₄ -->
    <line x1="120" y1="205" x2="130" y2="205" stroke="#2C3E50" stroke-width="2"/>
    <line x1="125" y1="200" x2="125" y2="210" stroke="#2C3E50" stroke-width="2"/>
  </g>
  
  <!-- Формулы и определения -->
  <g id="definitions">
    <rect x="50" y="290" width="400" height="40" rx="5" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="250" y="305" text-anchor="middle" font-family="Arial" font-size="11" fill="#34495E">Параллельные прямые — это прямые, которые в одной плоскости</text>
    <text x="250" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#34495E">не пересекаются, как бы далеко они ни были продолжены</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="additional-elements">
    <!-- Отмеченные углы при секущей -->
    <rect x="165" y="130" width="60" height="30" fill="none" stroke="#95A5A6" stroke-width="1" rx="3" opacity="0.5"/>
    <text x="195" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#7F8C8D">∠ABP₁</text>
    
    <rect x="265" y="130" width="60" height="30" fill="none" stroke="#95A5A6" stroke-width="1" rx="3" opacity="0.5"/>
    <text x="295" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#7F8C8D">∠A'P₂</text>
  </g>
  
  <!-- Масштабная линейка -->
  <g id="ruler">
    <rect x="50" y="50" width="60" height="3" fill="#34495E"/>
    <line x1="50" y1="50" x2="50" y2="55" stroke="#34495E" stroke-width="1"/>
    <line x1="70" y1="50" x2="70" y2="55" stroke="#34495E" stroke-width="1"/>
    <line x1="90" y1="50" x2="90" y2="55" stroke="#34495E" stroke-width="1"/>
    <line x1="110" y1="50" x2="110" y2="55" stroke="#34495E" stroke-width="1"/>
  </g>
</svg>