<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="methodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="kingdomGrad">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#673AB7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="40" fill="#E8F5E9" opacity="0.5"/>
  <circle cx="50" cy="300" r="30" fill="#FFF3E0" opacity="0.5"/>
  
  <!-- Основной заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">БИОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">Урок 1. Что изучает биология. Методы</text>
  
  <!-- Секция: Что изучает биология -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="url(#bioGrad)" filter="url(#shadow)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Что изучает биология</text>
    
    <!-- Иконки организмов -->
    <circle cx="40" cy="60" r="15" fill="white" opacity="0.8"/>
    <path d="M35 55 L40 65 L45 55" stroke="#2E7D32" stroke-width="2" fill="none"/>
    
    <rect x="90" y="50" width="20" height="20" fill="white" opacity="0.8" rx="3"/>
    <circle cx="100" cy="60" r="8" fill="#2E7D32"/>
    
    <path d="M145 55 L140 65 L150 65 Z" fill="white" opacity="0.8"/>
    
    <!-- Текст -->
    <text x="110" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Живые организмы</text>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">и их взаимодействие</text>
  </g>
  
  <!-- Секция: Методы исследования -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="url(#methodGrad)" filter="url(#shadow)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Методы исследования</text>
    
    <!-- Методы -->
    <g transform="translate(20, 40)">
      <circle cx="10" cy="10" r="8" fill="white" opacity="0.8"/>
      <text x="25" y="14" font-family="Arial, sans-serif" font-size="11" fill="white">Наблюдение</text>
      
      <circle cx="10" cy="30" r="8" fill="white" opacity="0.8"/>
      <text x="25" y="34" font-family="Arial, sans-serif" font-size="11" fill="white">Эксперимент</text>
      
      <circle cx="10" cy="50" r="8" fill="white" opacity="0.8"/>
      <text x="25" y="54" font-family="Arial, sans-serif" font-size="11" fill="white">Сравнение</text>
      
      <circle cx="110" cy="10" r="8" fill="white" opacity="0.8"/>
      <text x="125" y="14" font-family="Arial, sans-serif" font-size="11" fill="white">Анализ</text>
      
      <circle cx="110" cy="30" r="8" fill="white" opacity="0.8"/>
      <text x="125" y="34" font-family="Arial, sans-serif" font-size="11" fill="white">Моделирование</text>
      
      <circle cx="110" cy="50" r="8" fill="white" opacity="0.8"/>
      <text x="125" y="54" font-family="Arial, sans-serif" font-size="11" fill="white">Измерение</text>
    </g>
  </g>
  
  <!-- Секция: Царства живой природы -->
  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="460" height="110" rx="10" fill="url(#kingdomGrad)" filter="url(#shadow)" opacity="0.9"/>
    <text x="230" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Царства живой природы</text>
    
    <!-- Иконки царств -->
    <g transform="translate(30, 40)">
      <!-- Бактерии -->
      <ellipse cx="20" cy="20" rx="15" ry="8" fill="white" opacity="0.8"/>
      <text x="20" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Бактерии</text>
      
      <!-- Грибы -->
      <path d="M80 10 L85 25 L75 25 Z" fill="white" opacity="0.8"/>
      <rect x="75" y="25" width="10" height="10" fill="white" opacity="0.8"/>
      <text x="80" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Грибы</text>
      
      <!-- Растения -->
      <circle cx="140" cy="20" r="8" fill="white" opacity="0.8"/>
      <line x1="140" y1="28" x2="140" y2="35" stroke="white" stroke-width="2" opacity="0.8"/>
      <text x="140" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Растения</text>
      
      <!-- Животные -->
      <path d="M200 15 L195 25 L205 25 Z" fill="white" opacity="0.8"/>
      <circle cx="195" cy="18" r="2" fill="#1565C0"/>
      <circle cx="205" cy="18" r="2" fill="#1565C0"/>
      <text x="200" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Животные</text>
      
      <!-- Вирусы -->
      <path d="M260 20 L255 10 L265 10 Z" fill="white" opacity="0.8"/>
      <line x1="260" y1="10" x2="260" y2="5" stroke="white" stroke-width="2" opacity="0.8"/>
      <text x="260" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Вирусы</text>
      
      <!-- Прокариоты -->
      <rect x="315" y="15" width="15" height="10" rx="5" fill="white" opacity="0.8"/>
      <circle cx="322" cy="20" r="2" fill="#1565C0"/>
      <text x="322" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Прокариоты</text>
      
      <!-- Эукариоты -->
      <circle cx="380" cy="20" r="10" fill="white" opacity="0.8"/>
      <circle cx="380" cy="20" r="5" fill="#1565C0"/>
      <text x="380" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Эукариоты</text>
      
      <!-- Археи -->
      <path d="M440 15 L435 25 L445 25 Z" fill="white" opacity="0.8"/>
      <line x1="440" y1="15" x2="435" y2="20" stroke="white" stroke-width="1" opacity="0.8"/>
      <line x1="440" y1="15" x2="445" y2="20" stroke="white" stroke-width="1" opacity="0.8"/>
      <text x="440" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Археи</text>
    </g>
  </g>
  
  <!-- Дополнительные элементы -->
  <path d="M150 210 L150 220" stroke="#4CAF50" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M390 210 L390 220" stroke="#FF9800" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Угловые украшения -->
  <path d="M10 10 L20 10 L10 20" fill="none" stroke="#673AB7" stroke-width="2"/>
  <path d="M490 10 L480 10 L490 20" fill="none" stroke="#673AB7" stroke-width="2"/>
  <path d="M10 340 L20 340 L10 330" fill="none" stroke="#673AB7" stroke-width="2"/>
  <path d="M490 340 L480 340 L490 330" fill="none" stroke="#673AB7" stroke-width="2"/>
</svg>