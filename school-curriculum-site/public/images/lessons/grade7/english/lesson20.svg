<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="350" fill="#f8f9fa" rx="8"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="500" height="50" fill="#e74c3c" rx="8"/>
  <rect x="0" y="42" width="500" height="8" fill="#e74c3c"/>
  <text x="250" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">АНГЛИЙСКИЙ · 7 КЛАСС</text>

  <!-- Lesson number circle -->
  <circle cx="60" cy="100" r="35" fill="#e74c3c" opacity="0.15"/>
  <circle cx="60" cy="100" r="30" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="60" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e74c3c">20</text>

  <!-- Lesson title -->
  <text x="110" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Final Review</text>
  <text x="110" y="108" font-family="Arial, sans-serif" font-size="13" fill="#34495e">Review and final test</text>
  <text x="110" y="125" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Повторение и итоговый тест</text>

  <!-- Topic badge -->
  <rect x="110" y="140" width="120" height="24" fill="#e74c3c" opacity="0.1" rx="12"/>
  <text x="170" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">Итоговый тест</text>

  <!-- Content area -->
  <rect x="30" y="180" width="440" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="6"/>

  <!-- Star/award icon -->
  <g transform="translate(60, 200)">
    <polygon points="30,0 37,20 58,20 41,33 47,54 30,42 13,54 19,33 2,20 23,20" fill="#e74c3c" opacity="0.3"/>
    <text x="30" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Review</text>
  </g>

  <!-- Checkmark list -->
  <g transform="translate(130, 195)">
    <circle cx="8" cy="10" r="6" fill="#e74c3c" opacity="0.2"/>
    <text x="8" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✓</text>
    <text x="22" y="14" font-family="Arial, sans-serif" font-size="11" fill="#555">Greetings</text>

    <circle cx="8" cy="35" r="6" fill="#e74c3c" opacity="0.2"/>
    <text x="8" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✓</text>
    <text x="22" y="39" font-family="Arial, sans-serif" font-size="11" fill="#555">Present Simple</text>

    <circle cx="8" cy="60" r="6" fill="#e74c3c" opacity="0.2"/>
    <text x="8" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✓</text>
    <text x="22" y="64" font-family="Arial, sans-serif" font-size="11" fill="#555">Past Simple</text>

    <circle cx="8" cy="85" r="6" fill="#e74c3c" opacity="0.2"/>
    <text x="8" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✓</text>
    <text x="22" y="89" font-family="Arial, sans-serif" font-size="11" fill="#555">Future Simple</text>

    <circle cx="8" cy="110" r="6" fill="#e74c3c" opacity="0.2"/>
    <text x="8" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✓</text>
    <text x="22" y="114" font-family="Arial, sans-serif" font-size="11" fill="#555">Present Perfect</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(280, 200)">
    <text x="80" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">Progress</text>
    <rect x="10" y="10" width="140" height="12" fill="#e0e0e0" rx="6"/>
    <rect x="10" y="10" width="140" height="12" fill="#e74c3c" opacity="0.4" rx="6"/>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e74c3c">100%</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#777">20/20 lessons</text>
  </g>

  <g transform="translate(280, 280)">
    <rect x="10" y="0" width="140" height="20" fill="#e74c3c" opacity="0.1" rx="4"/>
    <text x="80" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Final Test Ready</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="325" width="500" height="25" fill="#e74c3c" opacity="0.05"/>
  <text x="250" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Spotlight 7 · Final Review · Lesson 20</text>
</svg>