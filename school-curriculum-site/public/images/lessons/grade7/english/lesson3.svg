<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="350" fill="#f8f9fa" rx="8"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="500" height="50" fill="#3498db" rx="8"/>
  <rect x="0" y="42" width="500" height="8" fill="#3498db"/>
  <text x="250" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">АНГЛИЙСКИЙ · 7 КЛАСС</text>

  <!-- Lesson number circle -->
  <circle cx="60" cy="100" r="35" fill="#3498db" opacity="0.15"/>
  <circle cx="60" cy="100" r="30" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="60" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#3498db">3</text>

  <!-- Lesson title -->
  <text x="110" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Lesson 3</text>
  <text x="110" y="108" font-family="Arial, sans-serif" font-size="13" fill="#34495e">School life. School subjects</text>
  <text x="110" y="125" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Школьная жизнь. Школьные предметы</text>

  <!-- Topic badge -->
  <rect x="110" y="140" width="68" height="24" fill="#3498db" opacity="0.1" rx="12"/>
  <text x="120" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3498db">School</text>

  <!-- Content area - decorative elements -->
  <rect x="30" y="180" width="440" height="140" fill="white" stroke="#e0e0e0" stroke-width="1" rx="6"/>

  <!-- School icon -->
  <g transform="translate(50, 200)">
    <rect x="0" y="20" width="60" height="50" fill="#3498db" opacity="0.2" rx="3"/>
    <polygon points="0,20 30,0 60,20" fill="#3498db" opacity="0.3"/>
    <rect x="25" y="40" width="10" height="30" fill="#3498db" opacity="0.4"/>
    <rect x="10" y="35" width="10" height="15" fill="#3498db" opacity="0.3"/>
    <rect x="40" y="35" width="10" height="15" fill="#3498db" opacity="0.3"/>
    <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555">School</text>
  </g>

  <!-- Book icon -->
  <g transform="translate(150, 200)">
    <rect x="0" y="0" width="50" height="65" fill="#3498db" opacity="0.15" rx="2"/>
    <rect x="0" y="0" width="50" height="65" fill="none" stroke="#3498db" stroke-width="1" rx="2"/>
    <line x1="25" y1="0" x2="25" y2="65" stroke="#3498db" stroke-width="1" opacity="0.3"/>
    <line x1="5" y1="15" x2="20" y2="15" stroke="#3498db" stroke-width="1" opacity="0.3"/>
    <line x1="5" y1="25" x2="20" y2="25" stroke="#3498db" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="15" x2="45" y2="15" stroke="#3498db" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="25" x2="45" y2="25" stroke="#3498db" stroke-width="1" opacity="0.3"/>
    <text x="25" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555">Books</text>
  </g>

  <!-- Clock icon -->
  <g transform="translate(240, 200)">
    <circle cx="25" cy="30" r="25" fill="#3498db" opacity="0.1"/>
    <circle cx="25" cy="30" r="25" fill="none" stroke="#3498db" stroke-width="2"/>
    <line x1="25" y1="30" x2="25" y2="12" stroke="#3498db" stroke-width="2"/>
    <line x1="25" y1="30" x2="38" y2="30" stroke="#3498db" stroke-width="2"/>
    <text x="25" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555">Time</text>
  </g>

  <!-- Subject labels -->
  <g transform="translate(320, 195)">
    <rect x="0" y="0" width="80" height="20" fill="#3498db" opacity="0.1" rx="4"/>
    <text x="40" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Mathematics</text>
    <rect x="0" y="25" width="80" height="20" fill="#3498db" opacity="0.1" rx="4"/>
    <text x="40" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Science</text>
    <rect x="0" y="50" width="80" height="20" fill="#3498db" opacity="0.1" rx="4"/>
    <text x="40" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">History</text>
    <rect x="0" y="75" width="80" height="20" fill="#3498db" opacity="0.1" rx="4"/>
    <text x="40" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">English</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="430" cy="200" r="3" fill="#3498db" opacity="0.3"/>
  <circle cx="445" cy="210" r="2" fill="#3498db" opacity="0.2"/>
  <circle cx="420" cy="215" r="2" fill="#3498db" opacity="0.2"/>

  <!-- Footer -->
  <rect x="0" y="325" width="500" height="25" fill="#3498db" opacity="0.05"/>
  <text x="250" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">Spotlight 7 · Module 1 · Lesson 3</text>
</svg>