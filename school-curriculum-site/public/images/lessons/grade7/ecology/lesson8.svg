<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f9f8"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#16a085">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">Круговорот кислорода и азота</text>
  
  <!-- Солнце (источник энергии) -->
  <circle cx="450" cy="80" r="25" fill="#f39c12"/>
  <path d="M450,55 L450,35 M425,80 L405,80 M475,80 M450,105 L450,125 M435,65 L420,50 M465,65 L480,50 M435,95 L420,110 M465,95 L480,110" stroke="#f39c12" stroke-width="2"/>
  
  <!-- Атмосфера -->
  <ellipse cx="250" cy="120" rx="200" ry="40" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#16a085">АТМОСФЕРА</text>
  
  <!-- Растения (продуценты) -->
  <rect x="180" y="180" width="10" height="40" fill="#8b4513"/>
  <ellipse cx="185" cy="170" rx="25" ry="30" fill="#27ae60"/>
  <ellipse cx="175" cy="175" rx="20" ry="25" fill="#2ecc71"/>
  <ellipse cx="195" cy="175" rx="20" ry="25" fill="#2ecc71"/>
  <text x="185" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Растения</text>
  <text x="185" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#16a085">Продуценты</text>
  
  <!-- Животные (консументы) -->
  <circle cx="120" cy="200" r="15" fill="#e74c3c"/>
  <circle cx="115" cy="195" r="3" fill="white"/>
  <circle cx="125" cy="195" r="3" fill="white"/>
  <path d="M110,205 Q120,210 130,205" stroke="white" stroke-width="2" fill="none"/>
  <text x="120" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Животные</text>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#16a085">Консументы</text>
  
  <!-- Почва (редуценты) -->
  <rect x="320" y="190" width="60" height="40" fill="#7f8c8d"/>
  <rect x="325" y="195" width="10" height="10" fill="#95a5a6"/>
  <rect x="340" y="195" width="10" height="10" fill="#95a5a6"/>
  <rect x="355" y="195" width="10" height="10" fill="#95a5a6"/>
  <rect x="325" y="210" width="10" height="10" fill="#95a5a6"/>
  <rect x="340" y="210" width="10" height="10" fill="#95a5a6"/>
  <rect x="355" y="210" width="10" height="10" fill="#95a5a6"/>
  <text x="350" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Почва</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#16a085">Редуценты</text>
  
  <!-- Округ Земли -->
  <circle cx="250" cy="280" r="50" fill="#3498db" opacity="0.3"/>
  <circle cx="250" cy="280" r="45" fill="#2980b9" opacity="0.3"/>
  
  <!-- Стрелки процессов -->
  <!-- Фотосинтез -->
  <path d="M170,180 L170,150" stroke="#16a085" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Фотосинтез</text>
  <text x="140" y="178" font-family="Arial, sans-serif" font-size="10" fill="#16a085">CO₂ → O₂</text>
  
  <!-- Дыхание -->
  <path d="M150,200 L170,200" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Дыхание</text>
  <text x="100" y="208" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">O₂ → CO₂</text>
  
  <!-- Разложение -->
  <path d="M320,210 L250,210" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="270" y="205" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Разложение</text>
  <text x="270" y="218" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Органика → N₂</text>
  
  <!-- Фиксация азота -->
  <path d="M380,190 L380,160" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <text x="390" y="175" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">Фиксация азота</text>
  <text x="390" y="188" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">N₂ → NO₃⁻</text>
  
  <!-- Утилизация азота растениями -->
  <path d="M350,190 L200,190" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <text x="275" y="185" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Поглощение N</text>
  <text x="275" y="198" font-family="Arial, sans-serif" font-size="10" fill="#3498db">растениями</text>
  
  <!-- Метаболизм азота -->
  <path d="M320,200 L140,200" stroke="#16a085" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  <text x="230" y="220" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Метаболизм азота</text>
  
  <!-- Определители стрелок -->
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a085"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b59b6"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f39c12"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Значения кислорода -->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="10" fill="#16a085">O₂ в атмосфере:</text>
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="10" fill="#16a085">~21%</text>
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="10" fill="#16a085">~1.2×10¹⁸ кг</text>
  
  <!-- Значения азота -->
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="10" fill="#16a085">N₂ в атмосфере:</text>
  <text x="40" y="165" font-family="Arial, sans-serif" font-size="10" fill="#16a085">~78%</text>
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="10" fill="#16a085">~4×10¹⁸ кг</text>
  
  <!-- Важность круговорота -->
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Круговорот веществ</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">обеспечивает:</text>
  <text x="40" y="280" font-family="Arial, sans-serif" font-size="10" fill="#16a085">• Стабильность экосистем</text>
  <text x="40" y="295" font-family="Arial, sans-serif" font-size="10" fill="#16a085">• Поддержание жизни</text>
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="10" fill="#16a085">• Баланс газов</text>
  
  <!-- Легенда процессов -->
  <text x="380" y="250" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Процессы:</text>
  <line x1="380" y1="260" x2="400" y2="260" stroke="#16a085" stroke-width="2"/>
  <text x="405" y="265" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Фотосинтез</text>
  <line x1="380" y1="275" x2="400" y2="275" stroke="#e74c3c" stroke-width="2"/>
  <text x="405" y="280" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Дыхание</text>
  <line x1="380" y1="290" x2="400" y2="290" stroke="#9b59b6" stroke-width="2"/>
  <text x="405" y="295" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Разложение</text>
  <line x1="380" y1="305" x2="400" y2="305" stroke="#f39c12" stroke-width="2"/>
  <text x="405" y="310" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Фиксация азота</text>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="220" cy="190" r="3" fill="#e74c3c"/>
  <circle cx="230" cy="195" r="3" fill="#e74c3c"/>
  <circle cx="240" cy="190" r="3" fill="#e74c3c"/>
  <circle cx="250" cy="195" r="3" fill="#e74c3c"/>
  
  <circle cx="330" cy="200" r="3" fill="#7f8c8d"/>
  <circle cx="340" cy="205" r="3" fill="#7f8c8d"/>
  <circle cx="350" cy="200" r="3" fill="#7f8c8d"/>
  <circle cx="360" cy="205" r="3" fill="#7f8c8d"/>
  
  <path d="M185,160 Q175,150 165,160" stroke="#27ae60" stroke-width="1" fill="none"/>
  <path d="M185,160 Q195,150 205,160" stroke="#27ae60" stroke-width="1" fill="none"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50" font-style="italic">Круговорот веществ - основа существования жизни на Земле</text>
</svg>