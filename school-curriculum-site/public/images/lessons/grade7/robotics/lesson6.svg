<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый элемент -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="40" fill="#34495e" rx="5"/>
  <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">РОБОТОТЕХНИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#34495e" font-weight="bold">Управление моторами</text>
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495e">Программирование Arduino</text>
  
  <!-- Arduino Uno -->
  <rect x="50" y="130" width="120" height="80" fill="#00979d" stroke="#34495e" stroke-width="2" rx="3"/>
  <rect x="60" y="140" width="100" height="60" fill="#00b8c1" rx="2"/>
  
  <!-- Пины Arduino -->
  <g id="arduino-pins">
    <line x1="50" y1="150" x2="30" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="50" y1="160" x2="30" y2="160" stroke="#34495e" stroke-width="1"/>
    <line x1="50" y1="170" x2="30" y2="170" stroke="#34495e" stroke-width="1"/>
    <line x1="50" y1="180" x2="30" y2="180" stroke="#34495e" stroke-width="1"/>
    <line x1="50" y1="190" x2="30" y2="190" stroke="#34495e" stroke-width="1"/>
    
    <line x1="170" y1="150" x2="190" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="170" y1="160" x2="190" y2="160" stroke="#34495e" stroke-width="1"/>
    <line x1="170" y1="170" x2="190" y2="170" stroke="#34495e" stroke-width="1"/>
    <line x1="170" y1="180" x2="190" y2="180" stroke="#34495e" stroke-width="1"/>
    <line x1="170" y1="190" x2="190" y2="190" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Подписи пинов -->
  <text x="25" y="154" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">5V</text>
  <text x="25" y="164" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">GND</text>
  <text x="25" y="174" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">D9</text>
  <text x="25" y="184" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">D10</text>
  <text x="25" y="194" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">D11</text>
  
  <text x="195" y="154" font-family="Arial, sans-serif" font-size="10" fill="#34495e">A0</text>
  <text x="195" y="164" font-family="Arial, sans-serif" font-size="10" fill="#34495e">A1</text>
  <text x="195" y="174" font-family="Arial, sans-serif" font-size="10" fill="#34495e">A2</text>
  <text x="195" y="184" font-family="Arial, sans-serif" font-size="10" fill="#34495e">A3</text>
  <text x="195" y="194" font-family="Arial, sans-serif" font-size="10" fill="#34495e">A4</text>
  
  <!-- Текст над Arduino -->
  <text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-weight="bold">Arduino Uno</text>
  
  <!-- Motor Driver L298N -->
  <rect x="220" y="140" width="100" height="70" fill="#95a5a6" stroke="#34495e" stroke-width="2" rx="3"/>
  <rect x="230" y="150" width="80" height="50" fill="#bdc3c7" rx="2"/>
  
  <!-- Пины Motor Driver -->
  <line x1="220" y1="155" x2="200" y2="155" stroke="#34495e" stroke-width="1"/>
  <line x1="220" y1="165" x2="200" y2="165" stroke="#34495e" stroke-width="1"/>
  <line x1="220" y1="175" x2="200" y2="175" stroke="#34495e" stroke-width="1"/>
  <line x1="220" y1="185" x2="200" y2="185" stroke="#34495e" stroke-width="1"/>
  <line x1="220" y1="195" x2="200" y2="195" stroke="#34495e" stroke-width="1"/>
  
  <line x1="320" y1="155" x2="340" y2="155" stroke="#34495e" stroke-width="1"/>
  <line x1="320" y1="165" x2="340" y2="165" stroke="#34495e" stroke-width="1"/>
  <line x1="320" y1="175" x2="340" y2="175" stroke="#34495e" stroke-width="1"/>
  <line x1="320" y1="185" x2="340" y2="185" stroke="#34495e" stroke-width="1"/>
  <line x1="320" y1="195" x2="340" y2="195" stroke="#34495e" stroke-width="1"/>
  
  <!-- Подписи Motor Driver -->
  <text x="195" y="159" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">IN1</text>
  <text x="195" y="169" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">IN2</text>
  <text x="195" y="179" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">IN3</text>
  <text x="195" y="189" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">IN4</text>
  <text x="195" y="199" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">ENA</text>
  
  <text x="345" y="159" font-family="Arial, sans-serif" font-size="10" fill="#34495e">OUT1</text>
  <text x="345" y="169" font-family="Arial, sans-serif" font-size="10" fill="#34495e">OUT2</text>
  <text x="345" y="179" font-family="Arial, sans-serif" font-size="10" fill="#34495e">OUT3</text>
  <text x="345" y="189" font-family="Arial, sans-serif" font-size="10" fill="#34495e">OUT4</text>
  <text x="345" y="199" font-family="Arial, sans-serif" font-size="10" fill="#34495e">ENB</text>
  
  <!-- Текст над Motor Driver -->
  <text x="270" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-weight="bold">Motor Driver L298N</text>
  
  <!-- Соединения Arduino и Motor Driver -->
  <line x1="190" y1="170" x2="200" y2="170" stroke="#34495e" stroke-width="2"/>
  <line x1="190" y1="180" x2="200" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="190" y1="190" x2="200" y2="190" stroke="#34495e" stroke-width="2"/>
  <line x1="190" y1="150" x2="200" y2="150" stroke="#34495e" stroke-width="2"/>
  
  <!-- Двигатели -->
  <g id="motors">
    <circle cx="380" cy="165" r="25" fill="#e74c3c" stroke="#34495e" stroke-width="2"/>
    <circle cx="380" cy="185" r="25" fill="#3498db" stroke="#34495e" stroke-width="2"/>
    
    <line x1="340" y1="165" x2="355" y2="165" stroke="#34495e" stroke-width="2"/>
    <line x1="340" y1="185" x2="355" y2="185" stroke="#34495e" stroke-width="2"/>
    
    <!-- Иконки двигателей -->
    <path d="M370,165 L375,155 L380,165 L385,155 L390,165 Z" fill="white"/>
    <path d="M370,185 L375,175 L380,185 L385,175 L390,185 Z" fill="white"/>
  </g>
  
  <!-- Подписи двигателей -->
  <text x="380" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Двигатель 1</text>
  <text x="380" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Двигатель 2</text>
  
  <!-- Код Arduino -->
  <rect x="50" y="240" width="420" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
  
  <!-- Заголовок секции кода -->
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-weight="bold">Пример кода:</text>
  
  <!-- Код -->
  <text x="60" y="280" font-family="monospace" font-size="11" fill="#34495e">void setup() {</text>
  <text x="80" y="295" font-family="monospace" font-size="11" fill="#34495e">pinMode(9, OUTPUT);  // Управление мотором 1</text>
  <text x="80" y="310" font-family="monospace" font-size="11" fill="#34495e">pinMode(10, OUTPUT); // Управление мотором 2</text>
  <text x="60" y="325" font-family="monospace" font-size="11" fill="#34495e">}</text>
  
  <text x="260" y="280" font-family="monospace" font-size="11" fill="#34495e">void loop() {</text>
  <text x="280" y="295" font-family="monospace" font-size="11" fill="#34495e">analogWrite(9, 200); // Скорость мотора 1</text>
  <text x="280" y="310" font-family="monospace" font-size="11" fill="#34495e">analogWrite(10, 100); // Скорость мотора 2</text>
  <text x="260" y="325" font-family="monospace" font-size="11" fill="#34495e">delay(1000);</text>
  <text x="260" y="340" font-family="monospace" font-size="11" fill="#34495e">}</text>
  
  <!-- Объяснение -->
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Цифровой пин Arduino управляет направлением вращения</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="12" fill="#34495e">ШИМ-пин (PWM) управляет скоростью вращения мотора</text>
  
  <!-- Дополнительные элементы -->
  <!-- Иконка скорости -->
  <circle cx="450" cy="165" r="15" fill="#34495e"/>
  <path d="M440,165 L460,165 M445,155 L455,175" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Иконка направления -->
  <circle cx="450" cy="185" r="15" fill="#34495e"/>
  <path d="M445,185 L455,185 M450,180 L450,190" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Легенда -->
  <rect x="350" y="240" width="120" height="80" fill="#ffffff" stroke="#34495e" stroke-width="1" rx="3"/>
  <text x="410" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">Легенда</text>
  
  <rect x="360" y="270" width="15" height="10" fill="#e74c3c"/>
  <text x="380" y="280" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Двигатель 1</text>
  
  <rect x="360" y="290" width="15" height="10" fill="#3498db"/>
  <text x="380" y="300" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Двигатель 2</text>
  
  <rect x="360" y="310" width="15" height="10" fill="#95a5a6"/>
  <text x="380" y="320" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Motor Driver</text>
</svg>