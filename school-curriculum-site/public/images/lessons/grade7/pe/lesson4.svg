<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#3498db"/>
  <text x="250" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ФИЗИЧЕСКАЯ КУЛЬТУРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#3498db">Волейбол: техника и тактика</text>
  
  <!-- Заголовок секции "Основные удары" -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Основные удары</text>
  
  <!-- Иконка верхнего удара -->
  <circle cx="80" cy="130" r="20" fill="#3498db" opacity="0.2"/>
  <path d="M80,115 L75,125 L85,125 Z" fill="#3498db"/>
  <text x="80" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Верхний удар</text>
  
  <!-- Иконка нижнего удара -->
  <circle cx="180" cy="130" r="20" fill="#3498db" opacity="0.2"/>
  <path d="M175,125 L185,125 L180,140 Z" fill="#3498db"/>
  <text x="180" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Нижний удар</text>
  
  <!-- Иконка подача -->
  <circle cx="280" cy="130" r="20" fill="#3498db" opacity="0.2"/>
  <path d="M280,115 L275,125 L285,125 L280,140 Z" fill="#3498db"/>
  <text x="280" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Подача</text>
  
  <!-- Иконка блок -->
  <circle cx="380" cy="130" r="20" fill="#3498db" opacity="0.2"/>
  <rect x="375" y="125" width="10" height="15" fill="#3498db"/>
  <text x="380" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Блок</text>
  
  <!-- Разделительная линия -->
  <line x1="40" y1="180" x2="460" y2="180" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Заголовок секции "Тактика игры" -->
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Тактика игры</text>
  
  <!-- Схема расположения игроков -->
  <rect x="40" y="220" width="420" height="100" fill="#ecf0f1" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Расположение игроков на площадке</text>
  
  <!-- Линия сетки -->
  <line x1="250" y1="245" x2="250" y2="305" stroke="#3498db" stroke-width="2"/>
  
  <!-- Игроки левой стороны -->
  <circle cx="100" cy="270" r="8" fill="#e74c3c"/>
  <circle cx="150" cy="270" r="8" fill="#e74c3c"/>
  <circle cx="200" cy="270" r="8" fill="#e74c3c"/>
  <circle cx="100" cy="295" r="8" fill="#e74c3c"/>
  <circle cx="150" cy="295" r="8" fill="#e74c3c"/>
  <circle cx="200" cy="295" r="8" fill="#e74c3c"/>
  
  <!-- Игроки правой стороны -->
  <circle cx="300" cy="270" r="8" fill="#2ecc71"/>
  <circle cx="350" cy="270" r="8" fill="#2ecc71"/>
  <circle cx="400" cy="270" r="8" fill="#2ecc71"/>
  <circle cx="300" cy="295" r="8" fill="#2ecc71"/>
  <circle cx="350" cy="295" r="8" fill="#2ecc71"/>
  <circle cx="400" cy="295" r="8" fill="#2ecc71"/>
  
  <!-- Подписи позиций -->
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ЛБ</text>
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ЦБ</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ПБ</text>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ЛБ</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ЦБ</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">ПБ</text>
  
  <!-- Подписи -->
  <text x="100" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Линейный</text>
  <text x="150" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Центральный</text>
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Приемущий</text>
  <text x="300" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2ecc71">Линейный</text>
  <text x="350" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2ecc71">Центральный</text>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2ecc71">Приемущий</text>
  
  <!-- Схема передачи мяча -->
  <text x="50" y="340" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Схема передачи:</text>
  <path d="M140,335 L180,325 L220,335" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M280,335 L320,325 L360,335" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка для схемы передачи -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Техника исполнения удара - диаграмма -->
  <rect x="40" y="90" width="30" height="60" fill="#3498db" opacity="0.3"/>
  <rect x="80" y="70" width="30" height="80" fill="#3498db" opacity="0.5"/>
  <rect x="120" y="50" width="30" height="100" fill="#3498db"/>
  <rect x="160" y="70" width="30" height="80" fill="#3498db" opacity="0.5"/>
  <rect x="200" y="90" width="30" height="60" fill="#3498db" opacity="0.3"/>
  <text x="155" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Фаза подготовки</text>
  <text x="135" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Фаза удара</text>
  <text x="175" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Фаза завершения</text>
  
  <!-- Советы по технике -->
  <rect x="350" y="90" width="130" height="80" fill="#ecf0f1" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="415" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Советы по технике</text>
  <text x="360" y="130" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Правильная постановка ног</text>
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Контроль мяча</text>
  <text x="360" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Своевременное перемещение</text>
  
  <!-- Правила игры -->
  <rect x="350" y="180" width="130" height="100" fill="#ecf0f1" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="415" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Основные правила</text>
  <text x="360" y="220" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• 3 касания за команду</text>
  <text x="360" y="235" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Мяч не может касаться сетки</text>
  <text x="360" y="250" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Зона подачи позади линии</text>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Счет до 25 очков</text>
</svg>