<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень для элементов -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">ПРОГРАММИРОВАНИЕ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Цикл while</text>
  
  <!-- Основная схема цикла while -->
  <g transform="translate(50, 90)">
    <!-- Начало -->
    <ellipse cx="40" cy="30" rx="30" ry="20" fill="#3498db" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Начало</text>
    
    <!-- Стрелка вниз -->
    <line x1="40" y1="50" x2="40" y2="70" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Условие -->
    <rect x="10" y="70" width="60" height="30" rx="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <text x="40" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Условие?</text>
    
    <!-- Стрелка вправо (да) -->
    <line x1="70" y1="85" x2="100" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="85" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Да</text>
    
    <!-- Действия -->
    <rect x="100" y="70" width="60" height="30" rx="5" fill="#2ecc71" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Действия</text>
    
    <!-- Стрелка вниз от действий -->
    <line x1="130" y1="100" x2="130" y2="120" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Стрелка влево к условию -->
    <line x1="130" y1="130" x2="130" y2="150" stroke="#2c3e50" stroke-width="2" />
    <line x1="130" y1="150" x2="40" y2="150" stroke="#2c3e50" stroke-width="2" />
    <line x1="40" y1="150" x2="40" y2="100" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
    
    <!-- Стрелка влево (нет) -->
    <line x1="10" y1="85" x2="-20" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="-15" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Нет</text>
    
    <!-- Конец -->
    <ellipse cx="-20" cy="85" rx="30" ry="20" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <text x="-20" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Конец</text>
  </g>
  
  <!-- Стрелка определитель -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  
  <!-- Пример кода -->
  <g transform="translate(250, 90)">
    <rect x="0" y="0" width="230" height="150" rx="5" fill="white" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)" />
    <text x="10" y="20" font-family="monospace" font-size="12" fill="#2c3e50">int i = 0;</text>
    <text x="10" y="40" font-family="monospace" font-size="12" fill="#2c3e50">while (i &lt; 5) {</text>
    <text x="20" y="60" font-family="monospace" font-size="12" fill="#2c3e50">console.log(i);</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#2c3e50">i++;</text>
    <text x="10" y="100" font-family="monospace" font-size="12" fill="#2c3e50">}</text>
    <text x="10" y="130" font-family="monospace" font-size="11" fill="#7f8c8d">// Выведет: 0, 1, 2, 3, 4</text>
  </g>
  
  <!-- Компоненты цикла -->
  <g transform="translate(50, 260)">
    <!-- Заголовок секции -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Компоненты цикла while:</text>
    
    <!-- Компонент 1 -->
    <rect x="0" y="10" width="120" height="40" rx="5" fill="#3498db" fill-opacity="0.2" stroke="#2c3e50" stroke-width="1" />
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">while (условие)</text>
    <text x="10" y="42" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Ключевое слово</text>
    
    <!-- Компонент 2 -->
    <rect x="130" y="10" width="120" height="40" rx="5" fill="#e74c3c" fill-opacity="0.2" stroke="#2c3e50" stroke-width="1" />
    <text x="140" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">условие</text>
    <text x="140" y="42" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Логическое выражение</text>
    
    <!-- Компонент 3 -->
    <rect x="260" y="10" width="120" height="40" rx="5" fill="#2ecc71" fill-opacity="0.2" stroke="#2c3e50" stroke-width="1" />
    <text x="270" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">{ ... }</text>
    <text x="270" y="42" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Тело цикла</text>
  </g>
  
  <!-- Примечания -->
  <g transform="translate(50, 320)">
    <!-- Примечание 1 -->
    <circle cx="10" cy="10" r="5" fill="#f39c12" />
    <text x="20" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Цикл выполняется, пока условие истинно</text>
    
    <!-- Примечание 2 -->
    <circle cx="200" cy="10" r="5" fill="#f39c12" />
    <text x="210" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Условие проверяется перед каждой итерацией</text>
    
    <!-- Примечание 3 -->
    <circle cx="420" cy="10" r="5" fill="#f39c12" />
    <text x="430" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Бесконечный цикл при условии = true</text>
  </g>
  
  <!-- Дополнительные элементы для достижения требований -->
  <!-- Иконка цикла -->
  <g transform="translate(220, 200)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#3498db" stroke-width="2" />
    <path d="M 15 3 A 12 12 0 0 1 27 15" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="35" y="20" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Итерация</text>
  </g>
  
  <!-- Точки процесса -->
  <g transform="translate(50, 170)">
    <circle cx="0" cy="0" r="4" fill="#3498db" />
    <circle cx="20" cy="0" r="4" fill="#3498db" />
    <circle cx="40" cy="0" r="4" fill="#3498db" />
    <circle cx="60" cy="0" r="4" fill="#3498db" />
    <circle cx="80" cy="0" r="4" fill="#3498db" />
  </g>
  
  <!-- Разделители -->
  <line x1="240" y1="80" x2="240" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Примеры использования:</text>
  <text x="250" y="295" font-family="monospace" font-size="9" fill="#7f8c8d">while (count > 0) { ... }</text>
  <text x="250" y="305" font-family="monospace" font-size="9" fill="#7f8c8d">while (true) { ... }</text>
  <text x="250" y="315" font-family="monospace" font-size="9" fill="#7f8c8d">while (i < array.length) { ... }</text>
  
  <!-- Дополнительные графические элементы -->
  <rect x="450" y="80" width="30" height="150" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" />
  <text x="465" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Вход</text>
  <text x="465" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Выход</text>
  
  <!-- Маркеры для выделения ключевых моментов -->
  <g>
    <circle cx="290" cy="130" r="3" fill="#e74c3c" />
    <circle cx="300" cy="130" r="3" fill="#e74c3c" />
    <circle cx="310" cy="130" r="3" fill="#e74c3c" />
  </g>
</svg>