<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f5f6fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">ПРОГРАММИРОВАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34495e">Переменные в Python</text>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">Переменные и типы данных</text>
  
  <!-- Блок объяснения переменных -->
  <rect x="20" y="90" width="460" height="60" rx="5" fill="#ecf0f1" stroke="#34495e" stroke-width="1"/>
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Переменная — это именованное место для хранения данных</text>
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">В Python тип переменной определяется автоматически при присвоении значения</text>
  
  <!-- Иконка переменной -->
  <circle cx="60" cy="180" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">X</text>
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Имя</text>
  
  <rect x="40" y="215" width="40" height="25" rx="3" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">10</text>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Значение</text>
  
  <line x1="60" y1="200" x2="60" y2="215" stroke="#34495e" stroke-width="2"/>
  <polygon points="55,210 60,220 65,210" fill="#34495e"/>
  
  <!-- Типы данных - заголовок -->
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Типы данных:</text>
  
  <!-- Целые числа -->
  <rect x="150" y="195" width="120" height="80" rx="5" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
  <text x="210" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Целые числа</text>
  <text x="210" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">int</text>
  <rect x="165" y="245" width="90" height="20" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="210" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">x = 42</text>
  
  <!-- Вещественные числа -->
  <rect x="280" y="195" width="120" height="80" rx="5" fill="#ecf0f1" stroke="#e67e22" stroke-width="2"/>
  <text x="340" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Вещественные</text>
  <text x="340" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">float</text>
  <rect x="295" y="245" width="90" height="20" rx="3" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <text x="340" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">x = 3.14</text>
  
  <!-- Строки -->
  <rect x="150" y="285" width="120" height="80" rx="5" fill="#ecf0f1" stroke="#2ecc71" stroke-width="2"/>
  <text x="210" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Строки</text>
  <text x="210" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">str</text>
  <rect x="165" y="335" width="90" height="20" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="210" y="348" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">x = "Привет"</text>
  
  <!-- Логические -->
  <rect x="280" y="285" width="120" height="80" rx="5" fill="#ecf0f1" stroke="#9b59b6" stroke-width="2"/>
  <text x="340" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Логические</text>
  <text x="340" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">bool</text>
  <rect x="295" y="335" width="90" height="20" rx="3" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
  <text x="340" y="348" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">x = True</text>
  
  <!-- Декоративные элементы -->
  <circle cx="420" cy="180" r="8" fill="#3498db" opacity="0.7"/>
  <circle cx="440" cy="190" r="6" fill="#e74c3c" opacity="0.7"/>
  <circle cx="430" cy="210" r="10" fill="#2ecc71" opacity="0.7"/>
  
  <path d="M 410 230 Q 430 220, 450 230 T 490 230" stroke="#34495e" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Схема работы с переменными -->
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Как работает:</text>
  
  <!-- Шаг 1 -->
  <rect x="30" y="305" width="100" height="30" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="80" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">1. Объявление</text>
  
  <!-- Стрелка -->
  <line x1="130" y1="320" x2="150" y2="320" stroke="#34495e" stroke-width="2"/>
  <polygon points="145,315 155,320 145,325" fill="#34495e"/>
  
  <!-- Шаг 2 -->
  <rect x="150" y="305" width="100" height="30" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="200" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">2. Присвоение</text>
  
  <!-- Стрелка -->
  <line x1="250" y1="320" x2="270" y2="320" stroke="#34495e" stroke-width="2"/>
  <polygon points="265,315 275,320 265,325" fill="#34495e"/>
  
  <!-- Шаг 3 -->
  <rect x="270" y="305" width="100" height="30" rx="5" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="320" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">3. Использование</text>
  
  <!-- Пример кода -->
  <rect x="30" y="340" width="340" height="40" rx="3" fill="#2c3e50"/>
  <text x="35" y="355" font-family="Consolas, monospace" font-size="9" fill="#3498db">x = 42</text>
  <text x="35" y="370" font-family="Consolas, monospace" font-size="9" fill="#e67e22">y = 3.14</text>
  <text x="110" y="355" font-family="Consolas, monospace" font-size="9" fill="#2ecc71">name = "Python"</text>
  <text x="210" y="355" font-family="Consolas, monospace" font-size="9" fill="#9b59b6">is_active = True</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="450" cy="250" r="15" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Python</text>
  
  <rect x="410" y="270" width="80" height="20" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="450" y="283" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Динамическая</text>
  
  <rect x="410" y="295" width="80" height="20" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="450" y="308" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">типизация</text>
  
  <!-- Вспомогательные линии -->
  <line x1="100" y1="180" x2="130" y2="180" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="180" x2="290" y2="180" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="285" x2="130" y2="285" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="285" x2="290" y2="285" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
</svg>