<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">ПРОГРАММИРОВАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Условия и ветвления</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="70" x2="450" y2="70" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Иконка условия -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">IF</text>
  </g>
  
  <!-- Стрелка от условия -->
  <path d="M 160 130 L 200 130" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Два пути ветвления -->
  <g transform="translate(200, 100)">
    <!-- Ветвление вверх -->
    <path d="M 0 30 L 0 0 L 40 0" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <rect x="40" y="-20" width="80" height="40" rx="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ИСТИНА</text>
    
    <!-- Ветвление вниз -->
    <path d="M 0 30 L 0 60 L 40 60" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <rect x="40" y="40" width="80" height="40" rx="5" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ЛОЖЬ</text>
  </g>
  
  <!-- Логические операторы -->
  <g transform="translate(350, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Логические операторы:</text>
    
    <!-- AND -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="120" height="30" rx="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">AND (И)</text>
    </g>
    
    <!-- OR -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="120" height="30" rx="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">OR (ИЛИ)</text>
    </g>
    
    <!-- NOT -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="120" height="30" rx="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">NOT (НЕ)</text>
    </g>
  </g>
  
  <!-- Таблица истинности -->
  <g transform="translate(50, 200)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Таблица истинности</text>
    
    <!-- Таблица -->
    <rect x="0" y="20" width="200" height="120" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Заголовки -->
    <rect x="0" y="20" width="66" height="30" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
    <text x="33" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <rect x="66" y="20" width="66" height="30" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
    <text x="99" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <rect x="132" y="20" width="68" height="30" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
    <text x="166" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">A AND B</text>
    
    <!-- Строки таблицы -->
    <rect x="0" y="50" width="200" height="23" fill="white" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="33" y="67" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    <text x="99" y="67" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    <text x="166" y="67" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    
    <rect x="0" y="73" width="200" height="23" fill="#ecf0f1" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="33" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    <text x="99" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
    <text x="166" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    
    <rect x="0" y="96" width="200" height="23" fill="white" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="33" y="113" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
    <text x="99" y="113" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    <text x="166" y="113" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">0</text>
    
    <rect x="0" y="119" width="200" height="21" fill="#ecf0f1" stroke="#2c3e50" stroke-width="0.5"/>
    <text x="33" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
    <text x="99" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
    <text x="166" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
  </g>
  
  <!-- Пример кода -->
  <g transform="translate(280, 200)">
    <text x="70" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Пример кода</text>
    
    <!-- Фон для кода -->
    <rect x="0" y="20" width="190" height="120" fill="#2c3e50" rx="5"/>
    
    <!-- Строки кода -->
    <text x="10" y="40" font-family="Consolas, monospace" font-size="12" fill="#3498db">if (x > 5</text>
    <text x="10" y="60" font-family="Consolas, monospace" font-size="12" fill="#3498db">    &amp;&amp; y < 10) {</text>
    <text x="10" y="80" font-family="Consolas, monospace" font-size="12" fill="#2ecc71">    // выполняется</text>
    <text x="10" y="100" font-family="Consolas, monospace" font-size="12" fill="#ecf0f1">} else {</text>
    <text x="10" y="120" font-family="Consolas, monospace" font-size="12" fill="#e74c3c">    // не выполняется</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(50, 340)">
    <circle cx="10" cy="0" r="5" fill="#3498db"/>
    <text x="20" y="4" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Условие</text>
    
    <circle cx="100" cy="0" r="5" fill="#e74c3c"/>
    <text x="110" y="4" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Истинно</text>
    
    <circle cx="190" cy="0" r="5" fill="#2ecc71"/>
    <text x="200" y="4" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Ложно</text>
  </g>
  
  <!-- Дополнительные иконки -->
  <g transform="translate(350, 240)">
    <rect x="0" y="0" width="30" height="30" rx="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">?</text>
    
    <rect x="40" y="0" width="30" height="30" rx="5" fill="#9b59b6" stroke="#2c3e50" stroke-width="1"/>
    <text x="55" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">=</text>
  </g>
  
  <!-- Стрелка определение -->
  <g transform="translate(320, 140)">
    <path d="M 0 0 L 0 -20" stroke="#2c3e50" stroke-width="1" fill="none"/>
    <text x="5" y="-5" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">выражение</text>
  </g>
  
  <!-- Схема ветвления -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <line x1="15" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <text x="27" y="-5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">AND</text>
    
    <circle cx="55" cy="0" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="55" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <line x1="70" y1="0" x2="95" y2="0" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <text x="82" y="-5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">=</text>
    
    <circle cx="110" cy="0" r="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <text x="110" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">C</text>
  </g>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Начало</text>
  <text x="140" y="95" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Проверка</text>
  <text x="250" y="95" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Ветвление</text>
  <text x="250" y="185" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Результат</text>
  
  <!-- Маркер для стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>