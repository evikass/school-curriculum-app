<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="40" fill="#e67e22" rx="5"/>
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">ИЗО · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Натюрморт и другие жанры</text>
  
  <!-- Основной раздел: Жанры живописи -->
  <rect x="20" y="85" width="460" height="250" fill="white" stroke="#e67e22" stroke-width="2" rx="10"/>
  
  <!-- Заголовок раздела -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">ЖАНРЫ ЖИВОПИСИ</text>
  
  <!-- Круговая диаграмма жанров -->
  <circle cx="150" cy="200" r="60" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M 150 140 A 60 60 0 0 1 210 200" fill="#e67e22" opacity="0.3"/>
  <path d="M 210 200 A 60 60 0 0 1 150 260" fill="#3498db" opacity="0.3"/>
  <path d="M 150 260 A 60 60 0 0 1 90 200" fill="#2ecc71" opacity="0.3"/>
  <path d="M 90 200 A 60 60 0 0 1 150 140" fill="#9b59b6" opacity="0.3"/>
  
  <!-- Центр круга -->
  <circle cx="150" cy="200" r="20" fill="#e67e22"/>
  <text x="150" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ЖАНРЫ</text>
  
  <!-- Надписи на круговой диаграмме -->
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">Бытовой</text>
  <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498db">Исторический</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71">Пейзаж</text>
  <text x="120" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">Портрет</text>
  <text x="90" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">Натюрморт</text>
  
  <!-- Иконки жанров -->
  <!-- Натюрморт -->
  <rect x="280" y="140" width="30" height="40" fill="#e67e22" rx="5"/>
  <circle cx="295" cy="155" r="5" fill="white"/>
  <rect x="285" y="165" width="20" height="10" fill="white"/>
  <text x="295" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Натюрморт</text>
  
  <!-- Портрет -->
  <circle cx="295" cy="220" r="10" fill="#e67e22"/>
  <path d="M 285 235 Q 295 230 305 235 L 305 245 L 285 245 Z" fill="#e67e22"/>
  <text x="295" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Портрет</text>
  
  <!-- Пейзаж -->
  <path d="M 280 260 L 280 230 L 310 230 L 310 260 Z" fill="#2ecc71"/>
  <circle cx="295" cy="220" r="8" fill="#f1c40f"/>
  <text x="295" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Пейзаж</text>
  
  <!-- Исторический -->
  <rect x="350" y="150" width="30" height="35" fill="#3498db"/>
  <path d="M 355 160 L 375 160 M 355 170 L 375 170 M 355 180 L 375 180" stroke="white" stroke-width="2"/>
  <text x="365" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Истор.</text>
  
  <!-- Бытовой -->
  <rect x="350" y="220" width="30" height="25" fill="#e67e22"/>
  <rect x="355" y="215" width="20" height="10" fill="#e67e22"/>
  <text x="365" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Бытовой</text>
  
  <!-- Определения -->
  <rect x="40" y="280" width="420" height="45" fill="#ecf0f1" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="50" y="295" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Натюрморт — изображение неодушевленных предметов</text>
  <text x="50" y="310" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Портрет — изображение человека</text>
  <text x="250" y="295" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Пейзаж — изображение природы</text>
  <text x="250" y="310" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Исторический — события прошлого</text>
  
  <!-- Указатели -->
  <line x1="210" y1="200" x2="280" y2="160" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="210" y1="200" x2="280" y2="220" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="180" y1="260" x2="280" y2="240" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="240" x2="350" y2="225" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="90" y1="200" x2="350" y2="155" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Дополнительные элементы -->
  <circle cx="420" cy="100" r="15" fill="#e67e22" opacity="0.3"/>
  <circle cx="440" cy="120" r="10" fill="#3498db" opacity="0.3"/>
  <circle cx="410" cy="130" r="8" fill="#2ecc71" opacity="0.3"/>
  
  <!-- Разделительные линии -->
  <line x1="30" y1="125" x2="470" y2="125" stroke="#e67e22" stroke-width="1"/>
  <line x1="270" y1="130" x2="270" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  
  <!-- Подписи на иконках -->
  <text x="365" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Исторический</text>
  <text x="365" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Бытовой</text>
  
  <!-- Декоративные элементы -->
  <rect x="30" y="90" width="15" height="15" fill="#e67e22" opacity="0.3"/>
  <rect x="455" y="90" width="15" height="15" fill="#e67e22" opacity="0.3"/>
  <rect x="30" y="320" width="15" height="15" fill="#e67e22" opacity="0.3"/>
  <rect x="455" y="320" width="15" height="15" fill="#e67e22" opacity="0.3"/>
  
  <!-- Надписи для акцента -->
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="9" fill="#e67e22" font-weight="bold">КЛЮЧЕВЫЕ ЖАНРЫ:</text>
  <text x="370" y="130" font-family="Arial, sans-serif" font-size="9" fill="#e67e22" font-weight="bold">ПРИМЕРЫ:</text>
  
  <!-- Дополнительные мелкие элементы -->
  <circle cx="60" cy="200" r="3" fill="#e67e22"/>
  <circle cx="70" cy="210" r="3" fill="#3498db"/>
  <circle cx="60" cy="220" r="3" fill="#2ecc71"/>
  <circle cx="70" cy="230" r="3" fill="#9b59b6"/>
  <circle cx="60" cy="240" r="3" fill="#e67e22"/>
  
  <!-- Линии для связи -->
  <line x1="80" y1="210" x2="90" y2="200" stroke="#e67e22" stroke-width="1"/>
  <line x1="80" y1="230" x2="90" y2="200" stroke="#3498db" stroke-width="1"/>
  <line x1="80" y1="250" x2="90" y2="200" stroke="#2ecc71" stroke-width="1"/>
</svg>