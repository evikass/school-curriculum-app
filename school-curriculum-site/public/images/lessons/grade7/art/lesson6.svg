<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f9f6f2"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">ИЗО · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <rect x="150" y="45" width="200" height="30" rx="15" fill="#e67e22"/>
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Русское искусство</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Передвижники</text>
  
  <!-- Линия разделения -->
  <line x1="50" y1="100" x2="450" y2="100" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Основной контейнер контента -->
  <rect x="40" y="110" width="420" height="230" rx="10" fill="white" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Иконка художника -->
  <circle cx="80" cy="140" r="15" fill="#e67e22"/>
  <path d="M80 145 L80 155 M75 150 L85 150 M80 150 L80 140" stroke="white" stroke-width="2" fill="none"/>
  <text x="80" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Художник</text>
  
  <!-- Иконка кисти -->
  <rect x="115" y="132" width="10" height="20" rx="5" fill="#e67e22"/>
  <circle cx="120" cy="130" r="6" fill="#e67e22"/>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Кисть</text>
  
  <!-- Иконка палитры -->
  <ellipse cx="155" cy="140" rx="12" ry="8" fill="#e67e22"/>
  <circle cx="152" cy="138" r="2" fill="white"/>
  <circle cx="158" cy="138" r="2" fill="white"/>
  <circle cx="155" cy="142" r="2" fill="white"/>
  <text x="155" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Палитра</text>
  
  <!-- Текстовое поле "Передвижники" -->
  <rect x="190" y="125" width="100" height="25" rx="5" fill="#e67e22"/>
  <text x="240" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Передвижники</text>
  
  <!-- Основные характеристики -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Ключевые черты:</text>
  
  <!-- Характеристика 1 -->
  <circle cx="70" cy="215" r="3" fill="#e67e22"/>
  <text x="80" y="219" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Реализм в искусстве</text>
  
  <!-- Характеристика 2 -->
  <circle cx="70" cy="230" r="3" fill="#e67e22"/>
  <text x="80" y="234" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Темы из народной жизни</text>
  
  <!-- Характеристика 3 -->
  <circle cx="70" cy="245" r="3" fill="#e67e22"/>
  <text x="80" y="249" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Социальная направленность</text>
  
  <!-- Характеристика 4 -->
  <circle cx="70" cy="260" r="3" fill="#e67e22"/>
  <text x="80" y="264" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Доступность искусства</text>
  
  <!-- Характеристика 5 -->
  <circle cx="70" cy="275" r="3" fill="#e67e22"/>
  <text x="80" y="279" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Передвижные выставки</text>
  
  <!-- Дерево искусств -->
  <text x="320" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Направления:</text>
  
  <!-- Ствол дерева -->
  <line x1="350" y1="210" x2="350" y2="280" stroke="#e67e22" stroke-width="3"/>
  
  <!-- Ветви -->
  <line x1="350" y1="220" x2="310" y2="230" stroke="#e67e22" stroke-width="2"/>
  <line x1="350" y1="235" x2="390" y2="245" stroke="#e67e22" stroke-width="2"/>
  <line x1="350" y1="250" x2="330" y2="270" stroke="#e67e22" stroke-width="2"/>
  <line x1="350" y1="260" x2="370" y2="280" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Листья/направления -->
  <ellipse cx="310" cy="230" rx="15" ry="8" fill="#e67e22"/>
  <text x="310" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Пейзаж</text>
  
  <ellipse cx="390" cy="245" rx="15" ry="8" fill="#e67e22"/>
  <text x="390" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Быт</text>
  
  <ellipse cx="330" cy="270" rx="15" ry="8" fill="#e67e22"/>
  <text x="330" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">История</text>
  
  <ellipse cx="370" cy="280" rx="15" ry="8" fill="#e67e22"/>
  <text x="370" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Портрет</text>
  
  <!-- Хронология -->
  <text x="320" y="320" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1870-1923</text>
  
  <!-- Основные художники -->
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Известные художники:</text>
  
  <!-- Имена художников -->
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Репин, Крамской, Левитан, Суриков, Шишкин</text>
  
  <!-- Дополнительные элементы -->
  <rect x="190" y="190" width="80" height="20" rx="3" fill="#e67e22" opacity="0.3"/>
  <text x="230" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">ТРПХ (1870)</text>
  
  <rect x="190" y="215" width="80" height="20" rx="3" fill="#e67e22" opacity="0.3"/>
  <text x="230" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">АХПХ (1923)</text>
  
  <!-- Декоративные элементы -->
  <path d="M420 130 L430 130 L425 120 Z" fill="#e67e22"/>
  <path d="M420 145 L430 145 L425 155 Z" fill="#e67e22"/>
  
  <circle cx="100" cy="125" r="3" fill="#e67e22"/>
  <circle cx="105" cy="125" r="3" fill="#e67e22"/>
  <circle cx="110" cy="125" r="3" fill="#e67e22"/>
  
  <!-- Схема влияний -->
  <text x="320" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Влияния:</text>
  
  <!-- Влияние 1 -->
  <circle cx="340" cy="165" r="8" fill="#e67e22" opacity="0.7"/>
  <text x="340" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Запад</text>
  
  <!-- Влияние 2 -->
  <circle cx="370" cy="165" r="8" fill="#e67e22" opacity="0.7"/>
  <text x="370" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Фольклор</text>
  
  <!-- Стрелки влияний -->
  <line x1="345" y1="170" x2="350" y2="180" stroke="#e67e22" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="170" x2="355" y2="180" stroke="#e67e22" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Определение -->
  <rect x="60" y="130" width="120" height="50" rx="5" fill="#f9f6f2" stroke="#e67e22" stroke-width="1"/>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Передвижники —</text>
  <text x="70" y="157" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">художники-реалисты,</text>
  <text x="70" y="169" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">члены Товарищества</text>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
</svg>