<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок ОБЖ -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">ОБЖ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="45" width="300" height="30" rx="15" fill="#f39c12"/>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Действия при пожаре</text>
  
  <!-- Иконка огня -->
  <path d="M 90 100 C 90 85, 105 75, 115 85 C 120 75, 135 75, 140 85 C 150 75, 165 85, 165 100 C 165 120, 140 135, 127.5 150 C 115 135, 90 120, 90 100 Z" fill="#e74c3c"/>
  <path d="M 105 105 C 105 95, 115 90, 120 95 C 125 90, 135 90, 140 95 C 145 90, 155 95, 155 105 C 155 115, 140 125, 127.5 135 C 115 125, 105 115, 105 105 Z" fill="#f39c12"/>
  
  <!-- Первый шаг: Вызов пожарных -->
  <rect x="180" y="85" width="140" height="60" rx="5" fill="white" stroke="#34495e" stroke-width="2"/>
  <text x="250" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">1. Вызов пожарных</text>
  <text x="250" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">112 или 101</text>
  
  <!-- Телефон -->
  <rect x="195" y="95" width="20" height="30" rx="2" fill="#3498db"/>
  <rect x="197" y="97" width="16" height="24" fill="#ecf0f1"/>
  <circle cx="205" cy="125" r="3" fill="#3498db"/>
  
  <!-- Второй шаг: Эвакуация -->
  <rect x="340" y="85" width="140" height="60" rx="5" fill="white" stroke="#34495e" stroke-width="2"/>
  <text x="410" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">2. Эвакуация</text>
  <text x="410" y="130" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Быстро и спокойно</text>
  
  <!-- Человек бегущий -->
  <circle cx="370" cy="100" r="5" fill="#3498db"/>
  <path d="M 365 105 L 365 120 M 370 105 L 370 120 M 365 108 L 370 105 L 375 108" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 365 115 L 370 118 L 375 115" stroke="#3498db" stroke-width="2" fill="none"/>
  
  <!-- Третий шаг: Предупреждение -->
  <rect x="180" y="160" width="140" height="60" rx="5" fill="white" stroke="#34495e" stroke-width="2"/>
  <text x="250" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">3. Предупреждение</text>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Оповестить других</text>
  
  <!-- Тревога -->
  <circle cx="205" cy="185" r="10" fill="#e74c3c"/>
  <text x="205" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">!</text>
  
  <!-- Четвертый шаг: Помощь -->
  <rect x="340" y="160" width="140" height="60" rx="5" fill="white" stroke="#34495e" stroke-width="2"/>
  <text x="410" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">4. Помощь</text>
  <text x="410" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">Если возможно</text>
  
  <!-- Перевязь -->
  <rect x="370" y="175" width="20" height="4" fill="#e74c3c"/>
  <rect x="379" y="171" width="4" height="12" fill="#e74c3c"/>
  
  <!-- Стрелки между шагами -->
  <line x1="320" y1="115" x2="340" y2="115" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="145" x2="250" y2="160" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="190" x2="340" y2="190" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Опасности -->
  <rect x="30" y="240" width="440" height="80" rx="5" fill="#ecf0f1" stroke="#34495e" stroke-width="1"/>
  <text x="250" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Опасности при пожаре</text>
  
  <!-- Опасность 1: Дым -->
  <circle cx="80" cy="290" r="15" fill="#7f8c8d"/>
  <path d="M 75 290 C 75 285, 85 285, 85 290 C 85 285, 95 285, 95 290" stroke="#95a5a6" stroke-width="2" fill="none"/>
  <text x="80" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Дым</text>
  
  <!-- Опасность 2: Высокая температура -->
  <path d="M 160 280 L 160 300 M 155 285 L 165 285 M 155 295 L 165 295" stroke="#e74c3c" stroke-width="3"/>
  <path d="M 170 280 L 170 300 M 165 285 L 175 285 M 165 295 L 175 295" stroke="#e74c3c" stroke-width="3"/>
  <text x="170" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Жар</text>
  
  <!-- Опасность 3: Паника -->
  <path d="M 250 275 C 245 275, 245 285, 250 285 C 255 285, 255 275, 250 275 M 250 280 L 250 290" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 240 285 C 240 275, 260 275, 260 285 C 260 295, 240 295, 240 285" stroke="#3498db" stroke-width="2" fill="none"/>
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Паника</text>
  
  <!-- Опасность 4: Обрушение -->
  <rect x="310" y="280" width="30" height="5" fill="#7f8c8d"/>
  <line x1="315" y1="280" x2="315" y2="270" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="335" y1="280" x2="335" y2="270" stroke="#7f8c8d" stroke-width="2"/>
  <text x="325" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Обрушение</text>
  
  <!-- Опасность 5: Отравление -->
  <circle cx="400" cy="285" r="10" fill="#e74c3c"/>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">!</text>
  <path d="M 390 295 L 410 295" stroke="#e74c3c" stroke-width="2"/>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Ядовитые газы</text>
  
  <!-- Важные правила -->
  <rect x="30" y="170" width="140" height="60" rx="5" fill="#fff5e6" stroke="#f39c12" stroke-width="2"/>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Важно!</text>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Не паниковать</text>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Быстро действовать</text>
  
  <!-- Стрелка определения -->
  <path d="M 170 200 L 190 190" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  
  <!-- Эвакуационный план -->
  <rect x="30" y="85" width="140" height="60" rx="5" fill="#e6f7ff" stroke="#3498db" stroke-width="2"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Эвакуационный</text>
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">путь</text>
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Знать наизусть</text>
  
  <!-- Стрелка к плану -->
  <path d="M 180 115 L 170 115" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  
  <!-- Маркеры для списка -->
  <circle cx="50" cy="115" r="3" fill="#f39c12"/>
  <circle cx="50" cy="190" r="3" fill="#f39c12"/>
  <circle cx="50" cy="290" r="3" fill="#f39c12"/>
  
  <!-- Определения -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">Пожар - неконтролируемое горение, представляющее опасность для людей и наносящее материальный ущерб</text>
  
  <!-- Стрелка определений -->
  <path d="M 90 330 L 90 305" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Дополнительные элементы -->
  <rect x="250" y="240" width="220" height="2" fill="#f39c12"/>
  <line x1="250" y1="340" x2="470" y2="340" stroke="#ecf0f1" stroke-width="1"/>
  
  <!-- Ключевые термины -->
  <text x="260" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Ключевые термины:</text>
  <text x="260" y="280" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Эвакуация - спасение людей из опасной зоны</text>
  <text x="260" y="295" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Тревога - сигнал об опасности</text>
  <text x="260" y="310" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Пожарный гидрант - источник воды для тушения</text>
  <text x="260" y="325" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Самоспасение - действия по спасению собственной жизни</text>
  
  <!-- Опасный знак -->
  <path d="M 460 270 L 480 290 L 440 290 Z" fill="#e74c3c"/>
  <text x="460" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">!</text>
  
  <!-- Маркеры для важных моментов -->
  <path d="M 100 85 L 100 75" stroke="#f39c12" stroke-width="2"/>
  
  <!-- Дополнительные линии для объема -->
  <line x1="50" y1="100" x2="50" y2="320" stroke="#ecf0f1" stroke-width="1"/>
  <line x1="470" y1="100" x2="470" y2="320" stroke="#ecf0f1" stroke-width="1"/>
  
  <!-- Декоративные элементы -->
  <circle cx="40" cy="60" r="3" fill="#f39c12"/>
  <circle cx="460" cy="60" r="3" fill="#f39c12"/>
  <circle cx="40" cy="330" r="3" fill="#f39c12"/>
  <circle cx="460" cy="330" r="3" fill="#f39c12"/>
  
  <!-- Определители для стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>