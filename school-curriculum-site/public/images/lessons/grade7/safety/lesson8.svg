<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect x="0" y="0" width="500" height="350" fill="#f8f9fa" />
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="40" fill="#2c3e50" />
  <text x="250" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">ОБЖ · 7 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Первая помощь при переломах и ожогах</text>
  
  <!-- Разделитель -->
  <line x1="50" y1="85" x2="450" y2="85" stroke="#f39c12" stroke-width="3" />
  
  <!-- Секция переломов -->
  <rect x="30" y="100" width="210" height="220" rx="10" fill="white" stroke="#f39c12" stroke-width="2" />
  <text x="130" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Переломы</text>
  
  <!-- Иконка кости -->
  <ellipse cx="130" cy="150" rx="25" ry="10" fill="#f39c12" />
  <rect x="125" y="150" width="10" height="40" fill="#f39c12" />
  <ellipse cx="130" cy="190" rx="25" ry="10" fill="#f39c12" />
  <line x1="105" y1="155" x2="105" y2="185" stroke="#f39c12" stroke-width="3" />
  <line x1="155" y1="155" x2="155" y2="185" stroke="#f39c12" stroke-width="3" />
  
  <!-- Шаги при переломе -->
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Остановить кровотечение</text>
  <circle cx="35" cy="235" r="3" fill="#f39c12" />
  <text x="40" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Наложить шину</text>
  <circle cx="35" cy="265" r="3" fill="#f39c12" />
  <text x="40" y="280" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Зафиксировать повязкой</text>
  <circle cx="35" cy="295" r="3" fill="#f39c12" />
  <text x="40" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">4. Обеспечить покой</text>
  
  <!-- Иконка шины -->
  <rect x="170" y="200" width="40" height="8" fill="#7f8c8d" />
  <rect x="175" y="195" width="5" height="18" fill="#7f8c8d" />
  <rect x="200" y="195" width="5" height="18" fill="#7f8c8d" />
  
  <!-- Секция ожогов -->
  <rect x="260" y="100" width="210" height="220" rx="10" fill="white" stroke="#f39c12" stroke-width="2" />
  <text x="365" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Ожоги</text>
  
  <!-- Иконка ожога -->
  <circle cx="365" cy="160" r="20" fill="#e74c3c" />
  <path d="M 355 150 Q 365 140, 375 150 Q 370 160, 365 155 Q 360 160, 355 150" fill="white" />
  <path d="M 360 165 Q 365 160, 370 165 Q 367 170, 365 168 Q 363 170, 360 165" fill="white" />
  
  <!-- Степени ожогов -->
  <text x="340" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Степени:</text>
  <rect x="340" y="210" width="15" height="10" fill="#ffeb3b" />
  <text x="360" y="218" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">I - покраснение</text>
  <rect x="340" y="225" width="15" height="10" fill="#ff9800" />
  <text x="360" y="233" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">II - пузыри</text>
  <rect x="340" y="240" width="15" height="10" fill="#e74c3c" />
  <text x="360" y="248" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">III - некроз</text>
  
  <!-- Шаги при ожоге -->
  <text x="270" y="280" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Охладить водой 15-20 мин</text>
  <circle cx="265" cy="295" r="3" fill="#f39c12" />
  <text x="270" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Наложить стерильную повязку</text>
  
  <!-- Центральная диаграмма -->
  <circle cx="250" cy="175" r="40" fill="#f39c12" opacity="0.2" />
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Первая</text>
  <text x="250" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">помощь</text>
  
  <!-- Стрелки к секциям -->
  <line x1="230" y1="175" x2="190" y2="175" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="270" y1="175" x2="310" y2="175" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Определение стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>
  
  <!-- Значок телефона -->
  <rect x="220" y="90" width="60" height="40" rx="5" fill="#3498db" />
  <rect x="235" y="100" width="30" height="20" rx="3" fill="white" />
  <text x="250" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#3498db">103</text>
  
  <!-- Предупреждение -->
  <circle cx="450" cy="325" r="12" fill="#e74c3c" />
  <text x="450" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">!</text>
  
  <!-- Дополнительные иконки -->
  <path d="M 180 240 L 190 230 L 200 240 L 190 250 Z" fill="#f39c12" />
  <text x="190" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Шина</text>
  
  <path d="M 410 240 L 420 230 L 430 240 L 420 250 Z" fill="#f39c12" />
  <text x="420" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Охлаждение</text>
  
  <!-- Текстовые подсказки -->
  <text x="130" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Не двигайте пострадавшего</text>
  <text x="365" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Не применяйте жир и масло</text>
  
  <!-- Дополнительные элементы для объема -->
  <circle cx="80" cy="120" r="3" fill="#f39c12" />
  <circle cx="90" cy="125" r="2" fill="#f39c12" />
  <circle cx="85" cy="130" r="2.5" fill="#f39c12" />
  
  <circle cx="420" cy="120" r="3" fill="#f39c12" />
  <circle cx="430" cy="125" r="2" fill="#f39c12" />
  <circle cx="425" cy="130" r="2.5" fill="#f39c12" />
  
  <!-- Линии для украшения -->
  <line x1="40" y1="140" x2="220" y2="140" stroke="#ecf0f1" stroke-width="1" />
  <line x1="270" y1="140" x2="460" y2="140" stroke="#ecf0f1" stroke-width="1" />
  
  <!-- Дополнительные текстовые элементы -->
  <text x="130" y="160" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Признаки: боль, отек, деформация</text>
  <text x="365" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Признаки: боль, покраснение, волдыри</text>
  
  <!-- Телефонная линия -->
  <path d="M 250 130 Q 250 120, 240 115 L 235 115" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="3,3" />
  
  <!-- Дополнительные информационные блоки -->
  <rect x="40" y="300" width="180" height="15" rx="5" fill="#f39c12" opacity="0.2" />
  <text x="130" y="310" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Не пытайтесь вправить кость!</text>
  
  <rect x="280" y="300" width="180" height="15" rx="5" fill="#f39c12" opacity="0.2" />
  <text x="370" y="310" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2c3e50">Не прокалывайте пузыри!</text>
  
  <!-- Дополнительные диагональные линии -->
  <line x1="30" y1="90" x2="40" y2="100" stroke="#f39c12" stroke-width="1" />
  <line x1="460" y1="90" x2="470" y2="100" stroke="#f39c12" stroke-width="1" />
  
  <!-- Дополнительные точки -->
  <circle cx="50" cy="310" r="2" fill="#f39c12" />
  <circle cx="55" cy="305" r="2" fill="#f39c12" />
  <circle cx="60" cy="310" r="2" fill="#f39c12" />
  
  <circle cx="440" cy="310" r="2" fill="#f39c12" />
  <circle cx="445" cy="305" r="2" fill="#f39c12" />
  <circle cx="450" cy="310" r="2" fill="#f39c12" />
</svg>