<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C92A2A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A535C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="forceArrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Небо -->
  <rect width="500" height="250" fill="url(#skyGradient)"/>
  
  <!-- Солнце -->
  <circle cx="420" cy="60" r="30" fill="#FFD93D" opacity="0.9"/>
  <g opacity="0.6">
    <line x1="420" y1="10" x2="420" y2="20" stroke="#FFD93D" stroke-width="3"/>
    <line x1="420" y1="100" x2="420" y2="110" stroke="#FFD93D" stroke-width="3"/>
    <line x1="370" y1="60" x2="380" y2="60" stroke="#FFD93D" stroke-width="3"/>
    <line x1="460" y1="60" x2="470" y2="60" stroke="#FFD93D" stroke-width="3"/>
  </g>
  
  <!-- Земля -->
  <rect y="250" width="500" height="100" fill="url(#groundGradient)"/>
  
  <!-- Дерево -->
  <rect x="50" y="200" width="20" height="50" fill="#8B4513"/>
  <ellipse cx="60" cy="190" rx="40" ry="30" fill="#228B22"/>
  <ellipse cx="60" cy="180" rx="35" ry="25" fill="#32CD32"/>
  
  <!-- Дом -->
  <rect x="300" y="180" width="80" height="70" fill="#DEB887"/>
  <polygon points="300,180 340,150 380,180" fill="#8B4513"/>
  <rect x="320" y="210" width="20" height="30" fill="#654321"/>
  <rect x="340" y="200" width="15" height="15" fill="#87CEEB"/>
  
  <!-- Падающий шар -->
  <circle cx="150" cy="150" r="25" fill="url(#ballGradient)" stroke="#A02020" stroke-width="2"/>
  <ellipse cx="150" cy="155" rx="20" ry="5" fill="#FF9999" opacity="0.5"/>
  
  <!-- Сила тяжести на шаре -->
  <line x1="150" y1="175" x2="150" y2="220" stroke="url(#forceArrow)" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="160" y="200" font-family="Arial, sans-serif" font-size="14" fill="#333">Fтяж</text>
  
  <!-- Книга на столе -->
  <rect x="250" y="240" width="60" height="40" fill="url(#bookGradient)" stroke="#0F4C5C" stroke-width="2" rx="2"/>
  <line x1="250" y1="250" x2="310" y2="250" stroke="#0F4C5C" stroke-width="1"/>
  <line x1="250" y1="260" x2="310" y2="260" stroke="#0F4C5C" stroke-width="1"/>
  
  <!-- Сила тяжести на книге -->
  <line x1="280" y1="280" x2="280" y2="320" stroke="url(#forceArrow)" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="290" y="305" font-family="Arial, sans-serif" font-size="14" fill="#333">Fтяж</text>
  
  <!-- Сила реакции опоры на книге -->
  <line x1="260" y1="240" x2="260" y2="200" stroke="#4ECDC4" stroke-width="3" marker-end="url(#arrowhead2)"/>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" fill="#333">N</text>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#FF6B6B"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4ECDC4"/>
    </marker>
  </defs>
  
  <!-- Формула F = mg -->
  <rect x="350" y="40" width="120" height="60" fill="white" stroke="#333" stroke-width="2" rx="5"/>
  <text x="410" y="65" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">F = mg</text>
  <text x="410" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Fтяж = mg</text>
  
  <!-- Обозначения -->
  <text x="370" y="55" font-family="Arial, sans-serif" font-size="10" fill="#666">F - сила</text>
  <text x="370" y="70" font-family="Arial, sans-serif" font-size="10" fill="#666">m - масса</text>
  <text x="370" y="85" font-family="Arial, sans-serif" font-size="10" fill="#666">g = 9.8 м/с²</text>
  
  <!-- Надписи на русском -->
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">ФИЗИКА · 7 КЛАСС</text>
  
  <text x="20" y="340" font-family="Arial, sans-serif" font-size="14" fill="#333">Урок 7. Силы. Сила тяжести</text>
  
  <text x="20" y="170" font-family="Arial, sans-serif" font-size="12" fill="#333">Падающий шар</text>
  
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">Книга на столе</text>
  
  <text x="20" y="130" font-family="Arial, sans-serif" font-size="11" fill="#555">Сила тяжести всегда направлена</text>
  <text x="20" y="145" font-family="Arial, sans-serif" font-size="11" fill="#555">к центру Земли</text>
  
  <text x="20" y="310" font-family="Arial, sans-serif" font-size="11" fill="#555">Сила реакции опоры уравновешивает</text>
  <text x="20" y="325" font-family="Arial, sans-serif" font-size="11" fill="#555">силу тяжести</text>
  
  <!-- Гравитационное поле -->
  <g opacity="0.3">
    <path d="M 100 100 Q 120 120 100 140" stroke="#666" stroke-width="1" fill="none"/>
    <path d="M 200 100 Q 220 120 200 140" stroke="#666" stroke-width="1" fill="none"/>
    <path d="M 300 100 Q 320 120 300 140" stroke="#666" stroke-width="1" fill="none"/>
    <path d="M 400 100 Q 420 120 400 140" stroke="#666" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Вспомогательные линии -->
  <line x1="40" y1="250" x2="460" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Положения векторов -->
  <text x="130" y="230" font-family="Arial, sans-serif" font-size="10" fill="#666">вертикально вниз</text>
  <text x="320" y="340" font-family="Arial, sans-serif" font-size="10" fill="#666">вертикально вверх</text>
  
  <!-- Физические величины -->
  <rect x="20" y="200" width="80" height="30" fill="#F0F0F0" stroke="#999" stroke-width="1" rx="3"/>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">g = 9.8 м/с²</text>
  
  <!-- Вес тела -->
  <rect x="20" y="80" width="100" height="30" fill="#E8F4F8" stroke="#4ECDC4" stroke-width="1" rx="3"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">P = mg</text>
  
  <!-- Точка опоры -->
  <circle cx="280" cy="280" r="3" fill="#333"/>
  <line x1="275" y1="285" x2="285" y2="285" stroke="#333" stroke-width="2"/>
  <text x="295" y="290" font-family="Arial, sans-serif" font-size="10" fill="#333">точка опоры</text>
</svg>