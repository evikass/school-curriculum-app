<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для молекул -->
    <radialGradient id="blueGrad">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="redGrad">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D84315;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="greenGrad">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="purpleGrad">
      <stop offset="0%" style="stop-color:#BA68C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </radialGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F5F5F5"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A237E">
    ФИЗИКА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3949AB">
    Строение вещества. Молекулы
  </text>
  
  <!-- Молекула воды -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="25" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="white" font-weight="bold">O</text>
    <circle cx="-35" cy="20" r="18" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="-35" y="25" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <circle cx="35" cy="20" r="18" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="35" y="25" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <line x1="-20" y1="10" x2="-25" y2="15" stroke="#666" stroke-width="3"/>
    <line x1="20" y1="10" x2="25" y2="15" stroke="#666" stroke-width="3"/>
    <text x="0" y="65" text-anchor="middle" font-size="14" fill="#333">Молекула воды</text>
    <text x="0" y="80" text-anchor="middle" font-size="12" fill="#666">H₂O</text>
  </g>
  
  <!-- Молекула метана -->
  <g transform="translate(250, 150)">
    <circle cx="0" cy="0" r="25" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="white" font-weight="bold">C</text>
    <circle cx="0" cy="-35" r="18" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="0" y="-30" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <circle cx="30" cy="17.5" r="18" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="30" y="22.5" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <circle cx="-30" cy="17.5" r="18" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="-30" y="22.5" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <circle cx="0" cy="35" r="18" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <line x1="0" y1="-20" x2="0" y2="-25" stroke="#666" stroke-width="3"/>
    <line x1="18" y1="6" x2="22" y2="12" stroke="#666" stroke-width="3"/>
    <line x1="-18" y1="6" x2="-22" y2="12" stroke="#666" stroke-width="3"/>
    <line x1="0" y1="20" x2="0" y2="25" stroke="#666" stroke-width="3"/>
    <text x="0" y="65" text-anchor="middle" font-size="14" fill="#333">Молекула метана</text>
    <text x="0" y="80" text-anchor="middle" font-size="12" fill="#666">CH₄</text>
  </g>
  
  <!-- Молекула кислорода -->
  <g transform="translate(400, 150)">
    <circle cx="-20" cy="0" r="25" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="-20" y="5" text-anchor="middle" font-size="16" fill="white" font-weight="bold">O</text>
    <circle cx="20" cy="0" r="25" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="20" y="5" text-anchor="middle" font-size="16" fill="white" font-weight="bold">O</text>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#666" stroke-width="4"/>
    <text x="0" y="65" text-anchor="middle" font-size="14" fill="#333">Молекула кислорода</text>
    <text x="0" y="80" text-anchor="middle" font-size="12" fill="#666">O₂</text>
  </g>
  
  <!-- Атом водорода -->
  <g transform="translate(100, 280)">
    <circle cx="0" cy="0" r="20" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="white" font-weight="bold">H</text>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#333">Атом водорода</text>
    <text x="0" y="55" text-anchor="middle" font-size="12" fill="#666">Протон + электрон</text>
  </g>
  
  <!-- Атом углерода -->
  <g transform="translate(250, 280)">
    <circle cx="0" cy="0" r="25" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" fill="white" font-weight="bold">C</text>
    <circle cx="-30" cy="-30" r="8" fill="#FFC107" opacity="0.8"/>
    <circle cx="30" cy="-30" r="8" fill="#FFC107" opacity="0.8"/>
    <circle cx="-30" cy="30" r="8" fill="#FFC107" opacity="0.8"/>
    <circle cx="30" cy="30" r="8" fill="#FFC107" opacity="0.8"/>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#333">Атом углерода</text>
    <text x="0" y="55" text-anchor="middle" font-size="12" fill="#666">6 протонов, 6 электронов</text>
  </g>
  
  <!-- Свойства молекул -->
  <rect x="20" y="90" width="150" height="50" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <text x="95" y="110" text-anchor="middle" font-size="12" fill="#1565C0">Микроскопические</text>
  <text x="95" y="125" text-anchor="middle" font-size="12" fill="#1565C0">частицы</text>
  
  <rect x="180" y="90" width="150" height="50" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
  <text x="255" y="110" text-anchor="middle" font-size="12" fill="#4A148C">Сохраняют свойства</text>
  <text x="255" y="125" text-anchor="middle" font-size="12" fill="#4A148C">вещества</text>
  
  <rect x="340" y="90" width="150" height="50" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
  <text x="415" y="110" text-anchor="middle" font-size="12" fill="#1B5E20">Наименьшая</text>
  <text x="415" y="125" text-anchor="middle" font-size="12" fill="#1B5E20">частица вещества</text>
  
  <!-- Движение молекул -->
  <g transform="translate(400, 280)">
    <circle cx="0" cy="0" r="15" fill="url(#purpleGrad)" opacity="0.7"/>
    <circle cx="20" cy="10" r="12" fill="url(#blueGrad)" opacity="0.7"/>
    <circle cx="-15" cy="15" r="10" fill="url(#redGrad)" opacity="0.7"/>
    <path d="M -30 0 Q -10 -10 10 0 T 30 0" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#333">Броуновское</text>
    <text x="0" y="55" text-anchor="middle" font-size="12" fill="#666">движение</text>
  </g>
  
  <!-- Стрелки показывают связь -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Легенда -->
  <rect x="20" y="250" width="120" height="80" fill="white" stroke="#999" stroke-width="1" rx="5" opacity="0.9"/>
  <text x="80" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Легенда:</text>
  <circle cx="35" cy="285" r="8" fill="url(#blueGrad)"/>
  <text x="50" y="290" font-size="10" fill="#333">Водород (H)</text>
  <circle cx="35" cy="305" r="8" fill="url(#redGrad)"/>
  <text x="50" y="310" font-size="10" fill="#333">Кислород (O)</text>
  <circle cx="35" cy="325" r="8" fill="url(#greenGrad)"/>
  <text x="50" y="330" font-size="10" fill="#333">Углерод (C)</text>
</svg>