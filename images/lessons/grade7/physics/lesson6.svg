<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для красивого вида -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D8B3D;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D58512;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7D3C98;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ФИЗИКА · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="90" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Урок 6. Масса тела. Плотность</text>
  
  <!-- Куб воды -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="80" height="80" fill="url(#blueGrad)" opacity="0.8"/>
    <text x="40" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">H₂O</text>
    <text x="40" y="100" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">Вода</text>
    <text x="40" y="115" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="11">ρ = 1000 кг/м³</text>
  </g>
  
  <!-- Куб алюминия -->
  <g transform="translate(220, 130)">
    <rect x="0" y="0" width="80" height="80" fill="url(#greenGrad)" opacity="0.8"/>
    <text x="40" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Al</text>
    <text x="40" y="100" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">Алюминий</text>
    <text x="40" y="115" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="11">ρ = 2700 кг/м³</text>
  </g>
  
  <!-- Куб железа -->
  <g transform="translate(340, 130)">
    <rect x="0" y="0" width="80" height="80" fill="url(#orangeGrad)" opacity="0.8"/>
    <text x="40" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Fe</text>
    <text x="40" y="100" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">Железо</text>
    <text x="40" y="115" text-anchor="middle" fill="#2C3E50" font-family="Arial, sans-serif" font-size="11">ρ = 7800 кг/м³</text>
  </g>
  
  <!-- Формула плотности -->
  <g transform="translate(250, 250)">
    <rect x="-100" y="-20" width="200" height="50" rx="5" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="0" y="0" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ρ = m / V</text>
  </g>
  
  <!-- Объяснение формулы -->
  <text x="50" y="310" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">ρ - плотность</text>
  <text x="50" y="325" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">m - масса</text>
  <text x="50" y="340" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">V - объём</text>
  
  <!-- Единицы измерения -->
  <text x="250" y="310" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">[ρ] = кг/м³</text>
  <text x="250" y="325" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">[m] = кг</text>
  <text x="250" y="340" fill="#2C3E50" font-family="Arial, sans-serif" font-size="14">[V] = м³</text>
  
  <!-- Стрелки, показывающие разницу в плотности -->
  <path d="M 140 220 L 140 230" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 260 220 L 260 230" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 380 220 L 380 230" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка для формулы -->
  <path d="M 250 230 L 250 240" stroke="#2C3E50" stroke-width="3" marker-end="url(#arrowhead2)"/>
  
  <!-- Определение плотности -->
  <rect x="20" y="280" width="180" height="60" rx="5" fill="#E8F4F8" stroke="#4A90E2" stroke-width="1"/>
  <text x="30" y="300" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Плотность - это масса</text>
  <text x="30" y="315" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">вещества в единице</text>
  <text x="30" y="330" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">объёма</text>
  
  <!-- Пример расчета -->
  <rect x="300" y="280" width="180" height="60" rx="5" fill="#FFF4E6" stroke="#F0AD4E" stroke-width="1"/>
  <text x="310" y="300" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Пример:</text>
  <text x="310" y="315" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">Объём 1 м³ воды</text>
  <text x="310" y="330" fill="#2C3E50" font-family="Arial, sans-serif" font-size="12">имеет массу 1000 кг</text>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#4A90E2" opacity="0.5"/>
  <circle cx="470" cy="30" r="3" fill="#4A90E2" opacity="0.5"/>
  <circle cx="30" cy="320" r="3" fill="#4A90E2" opacity="0.5"/>
  <circle cx="470" cy="320" r="3" fill="#4A90E2" opacity="0.5"/>
  
  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2C3E50"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2C3E50"/>
    </marker>
  </defs>
  
  <!-- Линии сетки для наглядности -->
  <line x1="90" y1="120" x2="90" y2="130" stroke="#BDC3C7" stroke-width="1"/>
  <line x1="210" y1="120" x2="210" y2="130" stroke="#BDC3C7" stroke-width="1"/>
  <line x1="330" y1="120" x2="330" y2="130" stroke="#BDC3C7" stroke-width="1"/>
  <line x1="450" y1="120" x2="450" y2="130" stroke="#BDC3C7" stroke-width="1"/>
  
  <!-- Дополнительные подписи -->
  <text x="140" y="260" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">малая плотность</text>
  <text x="260" y="260" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">средняя плотность</text>
  <text x="380" y="260" text-anchor="middle" fill="#7F8C8D" font-family="Arial, sans-serif" font-size="10">большая плотность</text>
  
  <!-- Вспомогательные прямоугольники для выделения -->
  <rect x="90" y="120" width="80" height="80" fill="none" stroke="#4A90E2" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <rect x="210" y="120" width="80" height="80" fill="none" stroke="#5CB85C" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <rect x="330" y="120" width="80" height="80" fill="none" stroke="#F0AD4E" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
</svg>