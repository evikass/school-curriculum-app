<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для состояний -->
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50E3C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2BA085;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">ФИЗИКА · 7 КЛАСС</text>
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#34495E">Урок 3. Три состояния вещества</text>
  
  <!-- Твёрдое состояние -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="url(#solidGrad)" filter="url(#shadow)"/>
    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Твёрдое</text>
    
    <!-- Атомы в решётке -->
    <circle cx="30" cy="30" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="30" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="30" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <circle cx="30" cy="60" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="60" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="60" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <circle cx="30" cy="90" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="90" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="90" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <circle cx="30" cy="120" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="120" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="120" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Связи -->
    <line x1="30" y1="30" x2="60" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="30" x2="90" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="60" x2="60" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="60" x2="90" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="90" x2="60" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="90" x2="90" y2="90" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="120" x2="60" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="120" x2="90" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    
    <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Форма сохраняется</text>
    <text x="60" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Объём сохраняется</text>
  </g>
  
  <!-- Жидкое состояние -->
  <g transform="translate(190, 100)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="url(#liquidGrad)" filter="url(#shadow)"/>
    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Жидкое</text>
    
    <!-- Молекулы жидкости -->
    <circle cx="35" cy="40" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="65" cy="35" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="85" cy="50" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="45" cy="65" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="70" cy="70" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="85" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="40" cy="95" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="65" cy="100" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="85" cy="115" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="130" r="8" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Слабые связи -->
    <line x1="35" y1="40" x2="65" y2="35" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="65" y1="35" x2="85" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="45" y1="65" x2="70" y2="70" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="70" y1="70" x2="90" y2="85" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    
    <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Форма не сохраняется</text>
    <text x="60" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Объём сохраняется</text>
  </g>
  
  <!-- Газообразное состояние -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="url(#gasGrad)" filter="url(#shadow)"/>
    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Газообразное</text>
    
    <!-- Молекулы газа -->
    <circle cx="20" cy="30" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="80" cy="50" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="40" cy="80" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="90" cy="90" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="30" cy="110" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="70" cy="120" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="40" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="100" cy="70" r="6" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Движение -->
    <path d="M 15,25 Q 25,20 35,35" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
    <path d="M 75,45 Q 85,40 95,55" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
    <path d="M 35,75 Q 45,70 55,85" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
    
    <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Форма не сохраняется</text>
    <text x="60" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Объём не сохраняется</text>
  </g>
  
  <!-- Стрелки переходов -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
  
  <!-- Стрелка плавления -->
  <line x1="170" y1="175" x2="190" y2="175" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="180" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">tпл</text>
  
  <!-- Стрелка испарения -->
  <line x1="310" y1="175" x2="330" y2="175" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="320" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">tкип</text>
  
  <!-- Стрелка конденсации -->
  <line x1="310" y1="195" x2="330" y2="195" stroke="#3498DB" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="320" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498DB">Конденсация</text>
  
  <!-- Стрелка кристаллизации -->
  <line x1="170" y1="195" x2="190" y2="195" stroke="#3498DB" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498DB">Кристаллизация</text>
  
  <!-- Температура -->
  <text x="110" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Низкая температура</text>
  <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Средняя температура</text>
  <text x="390" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Высокая температура</text>
  
  <!-- Дополнительно: графика температур -->
  <g transform="translate(50, 300)">
    <line x1="0" y1="30" x2="400" y2="30" stroke="#95A5A6" stroke-width="2"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">0°C</text>
    <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">100°C</text>
    <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">200°C</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="25" cy="25" r="3" fill="#3498DB" opacity="0.5"/>
  <circle cx="475" cy="25" r="3" fill="#E74C3C" opacity="0.5"/>
  <circle cx="25" cy="325" r="3" fill="#2ECC71" opacity="0.5"/>
  <circle cx="475" cy="325" r="3" fill="#F39C12" opacity="0.5"/>
</svg>