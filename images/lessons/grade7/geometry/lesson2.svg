<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7dd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004080;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    ГЕОМЕТРИЯ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 2. Сравнение и измерение отрезков
  </text>
  
  <!-- Основная ось -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="url(#lineGrad)" stroke-width="3"/>
  
  <!-- Отметки на оси -->
  <g stroke="#666" stroke-width="1">
    <line x1="100" y1="140" x2="100" y2="160"/>
    <line x1="150" y1="140" x2="150" y2="160"/>
    <line x1="200" y1="140" x2="200" y2="160"/>
    <line x1="250" y1="140" x2="250" y2="160"/>
    <line x1="300" y1="140" x2="300" y2="160"/>
    <line x1="350" y1="140" x2="350" y2="160"/>
    <line x1="400" y1="140" x2="400" y2="160"/>
  </g>
  
  <!-- Отрезок AB -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#e74c3c" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="100" cy="150" r="4" fill="#e74c3c"/>
  <circle cx="250" cy="150" r="4" fill="#e74c3c"/>
  
  <!-- Отрезок CD -->
  <line x1="200" y1="150" x2="350" y2="150" stroke="#27ae60" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="150" r="4" fill="#27ae60"/>
  <circle cx="350" cy="150" r="4" fill="#27ae60"/>
  
  <!-- Стрелка измерения AB -->
  <g stroke="url(#arrowGrad)" stroke-width="2" fill="none">
    <line x1="100" y1="120" x2="250" y2="120"/>
    <polygon points="100,120 105,115 105,125" fill="url(#arrowGrad)"/>
    <polygon points="250,120 245,115 245,125" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- Стрелка измерения CD -->
  <g stroke="url(#arrowGrad)" stroke-width="2" fill="none">
    <line x1="200" y1="180" x2="350" y2="180"/>
    <polygon points="200,180 205,175 205,185" fill="url(#arrowGrad)"/>
    <polygon points="350,180 345,175 345,185" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- Обозначения точек -->
  <text x="95" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">A</text>
  <text x="245" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">B</text>
  <text x="195" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">C</text>
  <text x="345" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">D</text>
  
  <!-- Длины отрезков -->
  <text x="175" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">|AB| = 15 см</text>
  <text x="275" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#27ae60">|CD| = 15 см</text>
  
  <!-- Дополнительные элементы для наглядности -->
  <g opacity="0.6">
    <!-- Отрезок EF (больше) -->
    <line x1="100" y1="230" x2="300" y2="230" stroke="#9b59b6" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="100" cy="230" r="4" fill="#9b59b6"/>
    <circle cx="300" cy="230" r="4" fill="#9b59b6"/>
    <text x="95" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b59b6">E</text>
    <text x="295" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b59b6">F</text>
    
    <!-- Измерение EF -->
    <g stroke="#ff6b6b" stroke-width="2" fill="none">
      <line x1="100" y1="260" x2="300" y2="260"/>
      <polygon points="100,260 105,255 105,265" fill="#ff6b6b"/>
      <polygon points="300,260 295,255 295,265" fill="#ff6b6b"/>
    </g>
    <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9b59b6">|EF| = 20 см</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="400" height="50" fill="white" stroke="#ddd" rx="5" opacity="0.9"/>
    
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" fill="#666">Длина отрезка:</text>
    
    <!-- Примеры сравнения -->
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#34495e">|AB| = |CD|</text>
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="11" fill="#34495e">|AB| &lt; |EF|</text>
    <text x="180" y="35" font-family="Arial, sans-serif" font-size="11" fill="#34495e">|CD| &lt; |EF|</text>
    
    <!-- Единицы измерения -->
    <text x="260" y="35" font-family="Arial, sans-serif" font-size="11" fill="#666">Единицы: см, мм, м</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="450" cy="50" r="20" fill="none" stroke="#3498db" stroke-width="2"/>
    <circle cx="50" cy="300" r="15" fill="none" stroke="#e74c3c" stroke-width="2"/>
  </g>
  
  <!-- Шкала для измерения -->
  <g transform="translate(100, 150)">
    <line x1="0" y1="-40" x2="0" y2="-50" stroke="#666" stroke-width="2"/>
    <line x1="50" y1="-40" x2="50" y2="-50" stroke="#666" stroke-width="2"/>
    <line x1="100" y1="-40" x2="100" y2="-50" stroke="#666" stroke-width="2"/>
    <line x1="150" y1="-40" x2="150" y2="-50" stroke="#666" stroke-width="2"/>
    
    <text x="0" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
    <text x="50" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">5</text>
    <text x="100" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">10</text>
    <text x="150" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">15</text>
    
    <text x="75" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">см</text>
  </g>
  
  <!-- Подписи с ключевыми понятиями -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    <text x="30" y="100">Отрезок</text>
    <text x="380" y="100">Концы</text>
    <text x="370" y="130">Длина</text>
    <text x="30" y="200">Сравнение</text>
    <text x="30" y="250">Измерение</text>
  </g>
</svg>