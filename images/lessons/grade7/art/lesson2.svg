<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">ИЗО · 7 КЛАСС</text>
  
  <!-- Основной контейнер -->
  <rect x="20" y="70" width="460" height="260" fill="white" stroke="#e0e0e0" stroke-width="2" rx="10"/>
  
  <!-- Название урока -->
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="20" fill="#2c3e50" text-anchor="middle" font-weight="bold">Графика и скульптура</text>
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">Виды изобразительного искусства</text>
  
  <!-- Разделительная линия -->
  <line x1="40" y1="130" x2="460" y2="130" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Графика раздел -->
  <rect x="40" y="150" width="200" height="160" fill="#fef5e7" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="140" y="175" font-family="Arial, sans-serif" font-size="18" fill="#e67e22" text-anchor="middle" font-weight="bold">ГРАФИКА</text>
  
  <!-- Иконка кисти -->
  <path d="M80,190 L80,210 L90,220 L100,210 L100,190 Z M90,220 L90,230" fill="none" stroke="#e67e22" stroke-width="2"/>
  <circle cx="90" cy="190" r="8" fill="#e67e22"/>
  
  <!-- Иконка карандаша -->
  <path d="M120,190 L120,210 L130,215 L130,195 Z" fill="#e67e22"/>
  <path d="M120,190 L125,185 L130,195 Z" fill="#d35400"/>
  
  <!-- Иконка ластика -->
  <rect x="150" y="190" width="15" height="20" fill="#ecf0f1" stroke="#e67e22" stroke-width="1"/>
  
  <!-- Подписи к графике -->
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Черно-белая</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">графика</text>
  
  <text x="120" y="235" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Цветная</text>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">графика</text>
  
  <text x="160" y="235" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Линейная</text>
  <text x="160" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">графика</text>
  
  <!-- Виды графики -->
  <circle cx="60" cy="275" r="3" fill="#e67e22"/>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Декоративная</text>
  
  <circle cx="140" cy="275" r="3" fill="#e67e22"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Орнаментальная</text>
  
  <circle cx="230" cy="275" r="3" fill="#e67e22"/>
  <text x="240" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Книжная</text>
  
  <!-- Скульптура раздел -->
  <rect x="260" y="150" width="200" height="160" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="360" y="175" font-family="Arial, sans-serif" font-size="18" fill="#3498db" text-anchor="middle" font-weight="bold">СКУЛЬПТУРА</text>
  
  <!-- Иконка статуи -->
  <ellipse cx="300" cy="205" rx="10" ry="15" fill="#3498db"/>
  <rect x="295" y="220" width="10" height="20" fill="#3498db"/>
  <rect x="292" y="240" width="16" height="5" fill="#3498db"/>
  
  <!-- Иконка бюста -->
  <ellipse cx="340" cy="210" rx="12" ry="15" fill="#3498db"/>
  <rect x="328" y="220" width="24" height="15" fill="#3498db"/>
  
  <!-- Иконка рельефа -->
  <rect x="380" y="200" width="30" height="25" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
  <path d="M385,210 L390,205 L395,210 L400,205" fill="none" stroke="#3498db" stroke-width="2"/>
  
  <!-- Подписи к скульптуре -->
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Полноценная</text>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">скульптура</text>
  
  <text x="340" y="255" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Бюст</text>
  <text x="340" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">горельеф</text>
  
  <text x="395" y="255" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">Барельеф</text>
  <text x="395" y="270" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle">рельеф</text>
  
  <!-- Виды скульптуры -->
  <circle cx="280" cy="295" r="3" fill="#3498db"/>
  <text x="290" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Монументальная</text>
  
  <circle cx="360" cy="295" r="3" fill="#3498db"/>
  <text x="370" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Парковая</text>
  
  <circle cx="440" cy="295" r="3" fill="#3498db"/>
  <text x="450" y="300" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Малая</text>
  
  <!-- Стрелка соединения -->
  <path d="M240,230 L260,230" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="260,230 255,227 255,233" fill="#95a5a6"/>
  
  <!-- Дополнительные элементы для объема -->
  <rect x="30" y="65" width="440" height="5" fill="#e67e22"/>
  <rect x="30" y="325" width="440" height="5" fill="#e67e22"/>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="60" r="5" fill="#e67e22"/>
  <circle cx="470" cy="60" r="5" fill="#e67e22"/>
  <circle cx="30" cy="330" r="5" fill="#e67e22"/>
  <circle cx="470" cy="330" r="5" fill="#e67e22"/>
  
  <!-- Уточняющие подписи -->
  <text x="250" y="345" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">Виды изобразительного искусства: плоскостное и объемное</text>
</svg>