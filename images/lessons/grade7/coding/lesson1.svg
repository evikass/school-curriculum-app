<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">ПРОГРАММИРОВАНИЕ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">Что такое программирование</text>
  
  <!-- Компьютерная иконка -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#2c3e50" filter="url(#shadow)"/>
    <rect x="5" y="5" width="70" height="45" rx="3" fill="#ecf0f1"/>
    <rect x="30" y="60" width="20" height="10" fill="#2c3e50"/>
    <rect x="15" y="70" width="50" height="5" rx="2" fill="#2c3e50"/>
    
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">КОМПЬЮТЕР</text>
  </g>
  
  <!-- Стрелка от компьютера -->
  <path d="M 130 110 L 170 110" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Программная иконка -->
  <g transform="translate(180, 80)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#3498db" filter="url(#shadow)"/>
    <rect x="10" y="10" width="60" height="5" rx="2" fill="#ecf0f1"/>
    <rect x="10" y="20" width="45" height="5" rx="2" fill="#ecf0f1"/>
    <rect x="10" y="30" width="50" height="5" rx="2" fill="#ecf0f1"/>
    <rect x="10" y="40" width="40" height="5" rx="2" fill="#ecf0f1"/>
    
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">ПРОГРАММА</text>
  </g>
  
  <!-- Стрелка от программы -->
  <path d="M 260 110 L 300 110" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Человек и иконка -->
  <g transform="translate(310, 80)">
    <circle cx="20" cy="15" r="8" fill="#e74c3c"/>
    <path d="M 20 23 L 20 45 M 8 30 L 32 30 M 20 45 L 12 55 M 20 45 L 28 55" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">ПОЛЬЗОВАТЕЛЬ</text>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Центральная диаграмма "Что такое программирование" -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="70" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">ПРОГРАММИРОВАНИЕ</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">это...</text>
  </g>
  
  <!-- Вспомогательные элементы вокруг диаграммы -->
  <!-- Код -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#f39c12" filter="url(#shadow)"/>
    <text x="30" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#2c3e50">CODE</text>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">КОД</text>
  </g>
  
  <!-- Алгоритм -->
  <g transform="translate(360, 170)">
    <rect x="0" y="0" width="60" height="40" rx="5" fill="#9b59b6" filter="url(#shadow)"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">ALGO</text>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">АЛГОРИТМ</text>
  </g>
  
  <!-- Линии соединения -->
  <line x1="140" y1="190" x2="180" y2="190" stroke="#2c3e50" stroke-width="2"/>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Языки программирования -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#3498db" filter="url(#shadow)"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">PYTHON</text>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Язык программирования</text>
  </g>
  
  <g transform="translate(170, 250)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">JAVASCRIPT</text>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Язык программирования</text>
  </g>
  
  <g transform="translate(290, 250)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#2ecc71" filter="url(#shadow)"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">HTML/CSS</text>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Языки разметки</text>
  </g>
  
  <!-- Процесс программирования -->
  <g transform="translate(100, 300)">
    <circle cx="0" cy="0" r="15" fill="#2c3e50" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">1</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Идея</text>
  </g>
  
  <g transform="translate(200, 300)">
    <circle cx="0" cy="0" r="15" fill="#2c3e50" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">2</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Планирование</text>
  </g>
  
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="15" fill="#2c3e50" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">3</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Кодирование</text>
  </g>
  
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="15" fill="#2c3e50" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Тестирование</text>
  </g>
  
  <!-- Стрелки процесса -->
  <line x1="115" y1="300" x2="185" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="215" y1="300" x2="285" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="300" x2="385" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Дополнительные элементы для увеличения размера -->
  <!-- Дополнительные точки на диаграмме -->
  <circle cx="150" cy="180" r="4" fill="#2c3e50"/>
  <circle cx="350" cy="180" r="4" fill="#2c3e50"/>
  <circle cx="180" cy="130" r="4" fill="#2c3e50"/>
  <circle cx="320" cy="130" r="4" fill="#2c3e50"/>
  
  <!-- Дополнительные линии -->
  <line x1="150" y1="180" x2="180" y2="130" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="350" y1="180" x2="320" y2="130" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Обработка</text>
  <text x="20" y="115" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">данных</text>
  
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Выполнение</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">команд</text>
  
  <text x="250" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">Язык</text>
  
  <!-- Дополнительные прямоугольники -->
  <rect x="20" y="130" width="40" height="20" rx="3" fill="#bdc3c7" opacity="0.5"/>
  <rect x="440" y="130" width="40" height="20" rx="3" fill="#bdc3c7" opacity="0.5"/>
  
  <!-- Дополнительные круги -->
  <circle cx="250" cy="80" r="3" fill="#2c3e50"/>
  <circle cx="250" cy="280" r="3" fill="#2c3e50"/>
  
  <!-- Дополнительные текстовые элементы для процесса -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">Процесс программирования</text>
</svg>