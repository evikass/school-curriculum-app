<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#ecf0f1"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="50" fill="#34495e"/>
  <text x="250" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">РОБОТОТЕХНИКА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" font-weight="bold">Arduino — платформа для роботов</text>
  <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Компоненты робота</text>
  
  <!-- Arduino Uno -->
  <g transform="translate(50, 120)">
    <rect width="120" height="80" fill="#34495e" rx="5"/>
    <rect x="10" y="10" width="100" height="60" fill="#2c3e50" rx="3"/>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Arduino</text>
    <text x="60" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Uno</text>
    <!-- Пины слева -->
    <g>
      <rect x="-5" y="15" width="8" height="3" fill="#e74c3c"/>
      <rect x="-5" y="21" width="8" height="3" fill="#e74c3c"/>
      <rect x="-5" y="27" width="8" height="3" fill="#e74c3c"/>
      <rect x="-5" y="33" width="8" height="3" fill="#3498db"/>
      <rect x="-5" y="39" width="8" height="3" fill="#3498db"/>
      <rect x="-5" y="45" width="8" height="3" fill="#3498db"/>
      <rect x="-5" y="51" width="8" height="3" fill="#3498db"/>
      <rect x="-5" y="57" width="8" height="3" fill="#3498db"/>
    </g>
    <!-- Пины справа -->
    <g>
      <rect x="117" y="15" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="21" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="27" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="33" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="39" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="45" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="51" width="8" height="3" fill="#3498db"/>
      <rect x="117" y="57" width="8" height="3" fill="#e74c3c"/>
    </g>
    <text x="60" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Контроллер</text>
  </g>
  
  <!-- Двигатели -->
  <g transform="translate(220, 130)">
    <rect width="60" height="60" fill="#e74c3c" rx="5"/>
    <circle cx="30" cy="30" r="20" fill="#c0392b"/>
    <circle cx="30" cy="30" r="10" fill="#e74c3c"/>
    <text x="30" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Двигатель</text>
  </g>
  
  <!-- Датчик расстояния -->
  <g transform="translate(320, 130)">
    <rect width="70" height="30" fill="#3498db" rx="3"/>
    <circle cx="10" cy="15" r="5" fill="#2980b9"/>
    <circle cx="60" cy="15" r="5" fill="#2980b9"/>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Датчик</text>
    <text x="35" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">расстояния</text>
  </g>
  
  <!-- Сервопривод -->
  <g transform="translate(320, 210)">
    <rect width="50" height="40" fill="#f39c12" rx="3"/>
    <circle cx="25" cy="20" r="15" fill="#d68910"/>
    <path d="M25,5 L35,20 L25,35 L15,20 Z" fill="#e67e22"/>
    <text x="25" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Сервопривод</text>
  </g>
  
  <!-- Источник питания -->
  <g transform="translate(50, 230)">
    <rect width="60" height="50" fill="#16a085" rx="5"/>
    <rect x="10" y="10" width="40" height="30" fill="#138d75" rx="3"/>
    <text x="30" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">9V</text>
    <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Источник</text>
    <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">питания</text>
  </g>
  
  <!-- Плата расширения -->
  <g transform="translate(140, 220)">
    <rect width="80" height="60" fill="#9b59b6" rx="5"/>
    <circle cx="20" cy="20" r="5" fill="#8e44ad"/>
    <circle cx="60" cy="20" r="5" fill="#8e44ad"/>
    <circle cx="20" cy="40" r="5" fill="#8e44ad"/>
    <circle cx="60" cy="40" r="5" fill="#8e44ad"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Плата</text>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">расширения</text>
  </g>
  
  <!-- Соединительные провода -->
  <line x1="170" y1="160" x2="220" y2="160" stroke="#34495e" stroke-width="2"/>
  <line x1="280" y1="160" x2="320" y2="145" stroke="#34495e" stroke-width="2"/>
  <line x1="170" y1="250" x2="220" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="220" y1="180" x2="320" y2="230" stroke="#34495e" stroke-width="2"/>
  <line x1="110" y1="250" x2="140" y2="250" stroke="#34495e" stroke-width="2"/>
  <line x1="220" y1="250" x2="320" y2="250" stroke="#34495e" stroke-width="2"/>
  
  <!-- Схема подключения -->
  <g transform="translate(30, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">Схема подключения:</text>
    <circle cx="100" cy="-5" r="3" fill="#e74c3c"/>
    <circle cx="120" cy="-5" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="-5" r="3" fill="#e74c3c"/>
    <line x1="100" y1="-5" x2="140" y2="-5" stroke="#34495e" stroke-width="1"/>
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="10" fill="#34495e">GND</text>
    
    <circle cx="100" cy="10" r="3" fill="#f39c12"/>
    <circle cx="120" cy="10" r="3" fill="#f39c12"/>
    <circle cx="140" cy="10" r="3" fill="#f39c12"/>
    <line x1="100" y1="10" x2="140" y2="10" stroke="#34495e" stroke-width="1"/>
    <text x="150" y="15" font-family="Arial, sans-serif" font-size="10" fill="#34495e">PWM</text>
    
    <circle cx="100" cy="25" r="3" fill="#3498db"/>
    <circle cx="120" cy="25" r="3" fill="#3498db"/>
    <circle cx="140" cy="25" r="3" fill="#3498db"/>
    <line x1="100" y1="25" x2="140" y2="25" stroke="#34495e" stroke-width="1"/>
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="10" fill="#34495e">VCC</text>
  </g>
  
  <!-- Иконки функций -->
  <g transform="translate(400, 120)">
    <!-- Иконка кода -->
    <rect x="0" y="0" width="60" height="30" fill="#34495e" rx="3"/>
    <text x="30" y="20" text-anchor="middle" font-family="monospace" font-size="14" fill="white">&lt;/&gt;</text>
    <text x="30" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Код</text>
    
    <!-- Иконка настроек -->
    <g transform="translate(0, 60)">
      <circle cx="30" cy="15" r="12" fill="#34495e"/>
      <circle cx="30" cy="15" r="6" fill="#ecf0f1"/>
      <path d="M30,3 L32,7 L36,7 L33,10 L35,14 L30,12 L25,14 L27,10 L24,7 L28,7 Z" fill="#34495e"/>
      <text x="30" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Настройки</text>
    </g>
  </g>
  
  <!-- Дополнительные элементы для достижения 50+ -->
  <g>
    <!-- Индикаторы состояния -->
    <circle cx="150" cy="120" r="4" fill="#2ecc71"/>
    <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">ON</text>
    
    <circle cx="150" cy="130" r="4" fill="#e74c3c"/>
    <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">OFF</text>
    
    <!-- Маркеры соединений -->
    <circle cx="195" cy="160" r="3" fill="#34495e"/>
    <circle cx="300" cy="145" r="3" fill="#34495e"/>
    <circle cx="195" cy="250" r="3" fill="#34495e"/>
    <circle cx="300" cy="230" r="3" fill="#34495e"/>
    
    <!-- Дополнительные подписи -->
    <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Входы</text>
    <text x="110" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Выходы</text>
    <text x="110" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Цифровые</text>
    <text x="110" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Аналоговые</text>
    
    <!-- Разделители -->
    <line x1="30" y1="105" x2="470" y2="105" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="30" y1="200" x2="470" y2="200" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="30" y1="290" x2="470" y2="290" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Дополнительные элементы платы Arduino -->
    <rect x="55" y="20" width="70" height="40" fill="#1a252f" rx="2"/>
    <circle cx="70" cy="35" r="3" fill="#2ecc71"/>
    <circle cx="80" cy="35" r="3" fill="#e74c3c"/>
    <circle cx="90" cy="35" r="3" fill="#f39c12"/>
    <circle cx="110" cy="35" r="3" fill="#3498db"/>
    <circle cx="70" cy="50" r="3" fill="#9b59b6"/>
    <circle cx="90" cy="50" r="3" fill="#1abc9c"/>
    <circle cx="110" cy="50" r="3" fill="#e67e22"/>
  </g>
</svg>