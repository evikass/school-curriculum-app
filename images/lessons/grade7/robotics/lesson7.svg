<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновые элементы -->
  <rect width="500" height="350" fill="#ecf0f1"/>
  <rect x="10" y="10" width="480" height="330" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495e">РОБОТОТЕХНИКА · 7 КЛАСС</text>
  
  <!-- Основной заголовок урока -->
  <rect x="100" y="50" width="300" height="40" fill="#34495e" rx="5"/>
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Ультразвуковой датчик расстояния</text>
  
  <!-- Датчик HC-SR04 -->
  <g transform="translate(50, 120)">
    <!-- Корпус датчика -->
    <rect x="0" y="0" width="120" height="60" fill="#2c3e50" rx="3"/>
    <rect x="10" y="10" width="100" height="40" fill="#34495e" rx="2"/>
    
    <!-- Пины -->
    <rect x="-5" y="15" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="25" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="35" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="45" width="5" height="5" fill="#f39c12"/>
    
    <!-- Сенсоры -->
    <circle cx="100" cy="20" r="8" fill="#3498db"/>
    <circle cx="100" cy="40" r="8" fill="#e74c3c"/>
    
    <!-- Надписи на датчике -->
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">HC-SR04</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff">ULTRASONIC</text>
  </g>
  
  <!-- Подписи к датчику -->
  <text x="110" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Ультразвуковой датчик</text>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">VCC</text>
  <text x="110" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Trig</text>
  <text x="110" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Echo</text>
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">GND</text>
  
  <!-- Схема подключения -->
  <g transform="translate(200, 120)">
    <!-- Микроконтроллер -->
    <rect x="0" y="0" width="80" height="60" fill="#34495e" rx="3"/>
    <rect x="10" y="10" width="60" height="40" fill="#2c3e50" rx="2"/>
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">Arduino</text>
    
    <!-- Пины на Arduino -->
    <rect x="-5" y="15" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="25" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="35" width="5" height="5" fill="#f39c12"/>
    <rect x="-5" y="45" width="5" height="5" fill="#f39c12"/>
    
    <!-- Соединительные провода -->
    <line x1="120" y1="20" x2="165" y2="20" stroke="#f39c12" stroke-width="2"/>
    <line x1="120" y1="30" x2="165" y2="30" stroke="#f39c12" stroke-width="2"/>
    <line x1="120" y1="40" x2="165" y2="40" stroke="#f39c12" stroke-width="2"/>
    <line x1="120" y1="50" x2="165" y2="50" stroke="#f39c12" stroke-width="2"/>
    
    <!-- Разъем на датчике -->
    <rect x="165" y="15" width="5" height="5" fill="#f39c12"/>
    <rect x="165" y="25" width="5" height="5" fill="#f39c12"/>
    <rect x="165" y="35" width="5" height="5" fill="#f39c12"/>
    <rect x="165" y="45" width="5" height="5" fill="#f39c12"/>
    
    <!-- Подписи -->
    <text x="50" y="-10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Схема подключения</text>
    <text x="125" y="15" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">5V</text>
    <text x="125" y="25" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Pin 9</text>
    <text x="125" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">Pin 8</text>
    <text x="125" y="45" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">GND</text>
  </g>
  
  <!-- Работа датчика -->
  <g transform="translate(50, 250)">
    <!-- Излучатель -->
    <circle cx="0" cy="0" r="15" fill="#3498db"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">ИЗЛ</text>
    
    <!-- Волны -->
    <path d="M 15 0 Q 25 -10, 35 0" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 15 0 Q 25 10, 35 0" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 40 0 Q 50 -15, 60 0" stroke="#3498db" stroke-width="2" fill="none"/>
    <path d="M 40 0 Q 50 15, 60 0" stroke="#3498db" stroke-width="2" fill="none"/>
    
    <!-- Препятствие -->
    <rect x="90" y="-40" width="10" height="80" fill="#95a5a6"/>
    <text x="95" y="-45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Препятствие</text>
    
    <!-- Отраженные волны -->
    <path d="M 90 0 Q 80 -10, 70 0" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M 90 0 Q 80 10, 70 0" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M 65 0 Q 55 -15, 45 0" stroke="#e74c3c" stroke-width="2" fill="none"/>
    <path d="M 65 0 Q 55 15, 45 0" stroke="#e74c3c" stroke-width="2" fill="none"/>
    
    <!-- Приемник -->
    <circle cx="30" cy="0" r="15" fill="#e74c3c"/>
    <text x="30" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">ПРИЕМ</text>
    
    <!-- Расстояние -->
    <line x1="45" y1="30" x2="85" y2="30" stroke="#34495e" stroke-width="1"/>
    <line x1="45" y1="25" x2="45" y2="35" stroke="#34495e" stroke-width="1"/>
    <line x1="85" y1="25" x2="85" y2="35" stroke="#34495e" stroke-width="1"/>
    <text x="65" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Расстояние</text>
    
    <!-- Подпись процесса -->
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Принцип работы датчика</text>
  </g>
  
  <!-- Формула расчета -->
  <g transform="translate(320, 250)">
    <rect x="0" y="0" width="150" height="70" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="3"/>
    <text x="75" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Формула расчета:</text>
    <text x="75" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">d = (t × c) / 2</text>
    <text x="75" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">d - расстояние, t - время, c - скорость звука</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g transform="translate(250, 120)">
    <!-- Таймер -->
    <rect x="0" y="0" width="40" height="30" fill="#e74c3c" rx="3"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">t</text>
    <text x="20" y="-10" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Время полета</text>
    
    <!-- Стрелка -->
    <path d="M 50 15 L 80 15" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Стрелка (маркер) -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
      </marker>
    </defs>
  </g>
  
  <!-- Технические характеристики -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="100" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="3"/>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Характеристики:</text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Диапазон: 2см - 4м</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Угол обзора: 15°</text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Частота: 40кГц</text>
  </g>
  
  <!-- Пример кода -->
  <g transform="translate(320, 160)">
    <rect x="0" y="0" width="160" height="80" fill="#2c3e50" rx="3"/>
    <text x="10" y="20" font-family="Courier, monospace" font-size="9" fill="#3498db">int trigPin = 9;</text>
    <text x="10" y="35" font-family="Courier, monospace" font-size="9" fill="#3498db">int echoPin = 8;</text>
    <text x="10" y="50" font-family="Courier, monospace" font-size="9" fill="#2ecc71">void setup() {</text>
    <text x="20" y="65" font-family="Courier, monospace" font-size="9" fill="#ffffff">pinMode(trigPin, OUTPUT);</text>
    <text x="20" y="80" font-family="Courier, monospace" font-size="9" fill="#ffffff">pinMode(echoPin, INPUT);</text>
    <text x="10" y="95" font-family="Courier, monospace" font-size="9" fill="#2ecc71">}</text>
  </g>
  
  <!-- Значение скорости звука -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="100" height="20" fill="#3498db" rx="3"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">c = 343 м/с</text>
  </g>
  
  <!-- Применение -->
  <g transform="translate(170, 320)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Применение:</text>
    <circle cx="80" cy="10" r="3" fill="#3498db"/>
    <text x="85" y="15" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Измерение расстояния</text>
    <circle cx="80" cy="25" r="3" fill="#3498db"/>
    <text x="85" y="30" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Обнаружение препятствий</text>
  </g>
</svg>