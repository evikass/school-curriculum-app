<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="15" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="470" cy="50" r="20" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="450" cy="300" r="25" fill="#fecaca" opacity="0.3"/>
  <circle cx="50" cy="320" r="18" fill="#bfdbfe" opacity="0.4"/>
  
  <!-- Основной заголовок -->
  <rect x="50" y="20" width="400" height="60" rx="10" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">РУССКИЙ ЯЗЫК · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Урок 1. Русский язык как развивающееся явление</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Тема: Развитие языка</text>
  
  <!-- Линия времени -->
  <line x1="80" y1="180" x2="420" y2="180" stroke="url(#timelineGrad)" stroke-width="4"/>
  
  <!-- Эпохи языка -->
  <g id="epochs">
    <!-- Древнерусский период -->
    <circle cx="120" cy="180" r="8" fill="#dc2626"/>
    <rect x="80" y="200" width="80" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#991b1b">Древнерусский</text>
    <text x="120" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">X-XI вв.</text>
    
    <!-- Старославянский -->
    <circle cx="200" cy="180" r="8" fill="#ea580c"/>
    <rect x="160" y="200" width="80" height="40" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#c2410c">Старославянский</text>
    <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9a3412">IX-XI вв.</text>
    
    <!-- Русский язык -->
    <circle cx="280" cy="180" r="8" fill="#d97706"/>
    <rect x="240" y="200" width="80" height="40" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="280" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#b45309">Русский язык</text>
    <text x="280" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">XIV-XVII вв.</text>
    
    <!-- Современный русский -->
    <circle cx="360" cy="180" r="8" fill="#059669"/>
    <rect x="320" y="200" width="80" height="40" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="360" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#047857">Современный</text>
    <text x="360" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">XVIII-XXI вв.</text>
  </g>
  
  <!-- Книга знаний -->
  <g transform="translate(250, 260)">
    <rect x="-40" y="-15" width="80" height="50" rx="3" fill="url(#bookGrad)" filter="url(#shadow)"/>
    <rect x="-40" y="-15" width="80" height="5" fill="#d97706"/>
    <line x1="-30" y1="-5" x2="-30" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="-20" y1="-5" x2="-20" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="-10" y1="-5" x2="-10" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="10" y1="-5" x2="10" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="20" y1="-5" x2="20" y2="20" stroke="#92400e" stroke-width="1"/>
    <line x1="30" y1="-5" x2="30" y2="20" stroke="#92400e" stroke-width="1"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#92400e">Язык в книгах</text>
  </g>
  
  <!-- Иконки развития -->
  <g id="development-icons">
    <!-- Перо -->
    <g transform="translate(100, 160)">
      <path d="M0,0 L15,15 L10,20 L5,15 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#dc2626"/>
      <text x="10" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f1d1d">Перо</text>
    </g>
    
    <!-- Типография -->
    <g transform="translate(180, 150)">
      <rect x="-5" y="-5" width="10" height="15" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
      <rect x="-7" y="-7" width="14" height="3" fill="#ea580c"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9a3412">Типография</text>
    </g>
    
    <!-- Клавиатура -->
    <g transform="translate(260, 150)">
      <rect x="-10" y="-5" width="20" height="15" fill="#d97706" stroke="#b45309" stroke-width="1"/>
      <rect x="-8" y="-3" width="3" height="2" fill="#fff"/>
      <rect x="-4" y="-3" width="3" height="2" fill="#fff"/>
      <rect x="0" y="-3" width="3" height="2" fill="#fff"/>
      <rect x="4" y="-3" width="3" height="2" fill="#fff"/>
      <rect x="-8" y="0" width="3" height="2" fill="#fff"/>
      <rect x="-4" y="0" width="3" height="2" fill="#fff"/>
      <rect x="0" y="0" width="3" height="2" fill="#fff"/>
      <rect x="4" y="0" width="3" height="2" fill="#fff"/>
      <rect x="-8" y="3" width="7" height="2" fill="#fff"/>
      <rect x="0" y="3" width="7" height="2" fill="#fff"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">Клавиатура</text>
    </g>
    
    <!-- Цифровой мир -->
    <g transform="translate(340, 150)">
      <circle cx="0" cy="0" r="8" fill="#059669" stroke="#047857" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="1.5" fill="white"/>
      <circle cx="3" cy="-3" r="1.5" fill="white"/>
      <path d="M-3,2 Q0,5 3,2" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#065f46">Цифровой</text>
    </g>
  </g>
  
  <!-- Словари -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <rect x="2" y="2" width="36" height="21" fill="white"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Словарь</text>
    <text x="20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4338ca">Словари</text>
  </g>
  
  <!-- Грамматика -->
  <g transform="translate(150, 310)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <rect x="2" y="2" width="36" height="21" fill="white"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d97706">Грамма</text>
    <text x="20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d97706">Грамматика</text>
  </g>
  
  <!-- Литература -->
  <g transform="translate(250, 310)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <rect x="2" y="2" width="36" height="21" fill="white"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#db2777">Лит-ра</text>
    <text x="20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#db2777">Литература</text>
  </g>
  
  <!-- Тексты -->
  <g transform="translate(350, 310)">
    <rect x="0" y="0" width="40" height="25" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <rect x="2" y="2" width="36" height="21" fill="white"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#16a34a">Тексты</text>
    <text x="20" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">Тексты</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <text x="250" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">История развития</text>
  
  <!-- Указатели -->
  <path d="M120,250 L120,270" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <path d="M200,250 L200,270" stroke="#ea580c" stroke-width="2" marker-end="url(#arroworange)"/>
  <path d="M280,250 L280,270" stroke="#d97706" stroke-width="2" marker-end="url(#arrowyellow)"/>
  <path d="M360,250 L360,270" stroke="#059669" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>
  
  <!-- Надписи по бокам -->
  <text x="30" y="120" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" transform="rotate(-90 30 120)">Развитие языка</text>
  <text x="470" y="120" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" transform="rotate(90 470 120)">Исторический путь</text>
</svg>