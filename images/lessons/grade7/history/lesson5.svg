<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c19660;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="eagleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd43b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fab005;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8b4513">ИСТОРИЯ · 7 КЛАСС</text>
  
  <!-- Колонна Республики -->
  <g id="republic">
    <rect x="80" y="80" width="60" height="200" fill="url(#columnGrad)" stroke="#8b4513" stroke-width="2"/>
    <rect x="70" y="70" width="80" height="15" fill="#8b4513"/>
    <rect x="70" y="275" width="80" height="15" fill="#8b4513"/>
    
    <!-- Капитель -->
    <path d="M80 80 L80 60 L140 60 L140 80 Z" fill="#8b4513"/>
    <path d="M85 75 L85 65 L135 65 L135 75 Z" fill="#d4a574"/>
    
    <!-- Символы Республики -->
    <circle cx="110" cy="120" r="15" fill="url(#shieldGrad)"/>
    <text x="110" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="white">SPQR</text>
    
    <text x="110" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b4513">РЕСПУБЛИКА</text>
    
    <!-- Сенат -->
    <rect x="90" y="200" width="40" height="30" fill="#8b4513" opacity="0.8"/>
    <text x="110" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="white">СЕНАТ</text>
    
    <!-- Магистраты -->
    <circle cx="90" cy="245" r="8" fill="#ff6b6b"/>
    <circle cx="110" cy="245" r="8" fill="#ff6b6b"/>
    <circle cx="130" cy="245" r="8" fill="#ff6b6b"/>
    <text x="110" y="265" font-family="Arial" font-size="9" text-anchor="middle" fill="#8b4513">МАГИСТРАТЫ</text>
  </g>
  
  <!-- Колонна Империи -->
  <g id="empire">
    <rect x="360" y="80" width="60" height="200" fill="url(#columnGrad)" stroke="#8b4513" stroke-width="2"/>
    <rect x="350" y="70" width="80" height="15" fill="#8b4513"/>
    <rect x="350" y="275" width="80" height="15" fill="#8b4513"/>
    
    <!-- Капитель -->
    <path d="M360 80 L360 60 L420 60 L420 80 Z" fill="#8b4513"/>
    <path d="M365 75 L365 65 L415 65 L415 75 Z" fill="#d4a574"/>
    
    <!-- Символы Империи -->
    <g transform="translate(390, 115)">
      <path d="M0 -20 L-15 -5 L-15 15 L15 15 L15 -5 Z" fill="url(#shieldGrad)"/>
      <path d="M-10 -10 L-5 -5 L-10 0 M10 -10 L5 -5 L10 0" stroke="white" stroke-width="2" fill="none"/>
      <circle cx="0" cy="5" r="3" fill="white"/>
    </g>
    
    <!-- Орел -->
    <g transform="translate(390, 150)">
      <path d="M-20 0 C-20 -10, -10 -15, 0 -15 C10 -15, 20 -10, 20 0 L20 10 L15 10 L15 5 L-15 5 L-15 10 L-20 10 Z" fill="url(#eagleGrad)"/>
      <path d="M-15 -10 L-10 -5 L-5 -10 M15 -10 L10 -5 L5 -10" stroke="#fab005" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="2" fill="#8b4513"/>
    </g>
    
    <text x="390" y="180" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b4513">ИМПЕРИЯ</text>
    
    <!-- Император -->
    <rect x="370" y="200" width="40" height="30" fill="#8b4513" opacity="0.8"/>
    <text x="390" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="white">ИМПЕРАТОР</text>
    
    <!-- Легионы -->
    <rect x="360" y="240" width="25" height="8" fill="#8b4513"/>
    <rect x="395" y="240" width="25" height="8" fill="#8b4513"/>
    <rect x="360" y="252" width="25" height="8" fill="#8b4513"/>
    <rect x="395" y="252" width="25" height="8" fill="#8b4513"/>
    <text x="390" y="275" font-family="Arial" font-size="9" text-anchor="middle" fill="#8b4513">ЛЕГИОНЫ</text>
  </g>
  
  <!-- Даты -->
  <text x="110" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#8b4513">509 г. до н.э. - 27 г. до н.э.</text>
  <text x="390" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#8b4513">27 г. до н.э. - 476 г. н.э.</text>
  
  <!-- Стрелка перехода -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b4513"/>
    </marker>
  </defs>
  <path d="M 150 180 L 350 180" stroke="#8b4513" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Надписи по бокам -->
  <text x="250" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#8b4513" transform="rotate(-5 250 160)">ПЕРЕХОД</text>
  <text x="250" y="195" font-family="Arial" font-size="12" text-anchor="middle" fill="#8b4513" transform="rotate(5 250 195)">ОТ РЕСПУБЛИКИ</text>
  <text x="250" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#8b4513" transform="rotate(5 250 210)">К ИМПЕРИИ</text>
  
  <!-- Дополнительные элементы -->
  <!-- Римский шлем -->
  <g transform="translate(30, 100)">
    <path d="M0 0 L-15 20 L-10 30 L10 30 L15 20 Z" fill="#c0c0c0" stroke="#8b4513" stroke-width="1"/>
    <circle cx="0" cy="-5" r="10" fill="none" stroke="#8b4513" stroke-width="2"/>
    <path d="M0 -5 L0 -15 M-5 -10 L5 -10" stroke="#8b4513" stroke-width="1"/>
    <text x="0" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#8b4513">ЛЕГИОНЕР</text>
  </g>
  
  <!-- Триумфальная арка -->
  <g transform="translate(450, 100)">
    <rect x="-20" y="0" width="40" height="40" fill="#d4a574" stroke="#8b4513" stroke-width="1"/>
    <rect x="-15" y="5" width="30" height="25" fill="none" stroke="#8b4513" stroke-width="1"/>
    <rect x="-10" y="10" width="20" height="15" fill="none" stroke="#8b4513" stroke-width="1"/>
    <text x="0" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#8b4513">ТРИУМФ</text>
  </g>
  
  <!-- Символы -->
  <!-- Меч -->
  <g transform="translate(250, 250)">
    <rect x="-2" y="-20" width="4" height="30" fill="#8b4513"/>
    <rect x="-5" y="-25" width="10" height="8" fill="#8b4513"/>
    <text x="0" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#8b4513">ВЛАСТЬ</text>
  </g>
  
  <!-- Свиток -->
  <g transform="translate(200, 280)">
    <rect x="-15" y="-10" width="30" height="20" fill="#f4e4c1" stroke="#8b4513" stroke-width="1"/>
    <path d="M-15 -10 Q-20 -10, -20 -5 L-20 5 Q-20 10, -15 10" fill="#f4e4c1" stroke="#8b4513" stroke-width="1"/>
    <text x="0" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#8b4513">ЗАКОНЫ</text>
  </g>
  
  <!-- Корона -->
  <g transform="translate(300, 280)">
    <path d="M-15 0 Q-10 -5, -5 0 Q0 -5, 5 0 Q10 -5, 15 0 L15 5 L-15 5 Z" fill="#ffd700" stroke="#8b4513" stroke-width="1"/>
    <circle cx="-10" cy="-3" r="2" fill="#ff6b6b"/>
    <circle cx="0" cy="-3" r="2" fill="#ff6b6b"/>
    <circle cx="10" cy="-3" r="2" fill="#ff6b6b"/>
    <text x="0" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#8b4513">ВЛАСТЬ</text>
  </g>
  
  <!-- Подписи к периодам -->
  <text x="110" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b4513">Правление сената</text>
  <text x="110" y="65" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b4513">Народные собрания</text>
  
  <text x="390" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b4513">Принципат</text>
  <text x="390" y="65" font-family="Arial" font-size="11" text-anchor="middle" fill="#8b4513">Доминат</text>
  
  <!-- Углы украшения -->
  <g id="corner-tl">
    <path d="M10 10 L10 30 L30 10" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g id="corner-tr">
    <path d="M490 10 L490 30 L470 10" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g id="corner-bl">
    <path d="M10 340 L10 320 L30 340" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  <g id="corner-br">
    <path d="M490 340 L490 320 L470 340" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
</svg>