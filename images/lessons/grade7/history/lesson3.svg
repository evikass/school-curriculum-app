<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF8DC;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#skyGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">ИСТОРИЯ · 7 КЛАСС</text>
  
  <!-- Египетская часть -->
  <g id="egypt">
    <!-- Пирамиды -->
    <polygon points="80,250 50,320 110,320" fill="url(#pyramidGrad)"/>
    <polygon points="130,220 90,320 170,320" fill="url(#pyramidGrad)"/>
    <polygon points="180,260 140,320 220,320" fill="url(#pyramidGrad)"/>
    
    <!-- Солнце -->
    <circle cx="250" cy="80" r="25" fill="#FFD700" opacity="0.8"/>
    <path d="M250,55 L250,45 M250,115 L250,105 M225,80 L215,80 M285,80 M235,65 L228,58 M272,102 L265,95 M235,95 L228,102 M272,58 L265,65" stroke="#FFD700" stroke-width="3" opacity="0.8"/>
    
    <!-- Нил -->
    <path d="M20,200 Q150,190 280,210 Q350,220 480,200" stroke="url(#riverGrad)" stroke-width="30" fill="none" opacity="0.7"/>
    
    <!-- Пальмы -->
    <line x1="100" y1="280" x2="100" y2="250" stroke="#8B4513" stroke-width="4"/>
    <path d="M90,250 Q100,230 110,250 M95,245 Q100,235 105,245 M95,255 Q100,245 105,255" stroke="#228B22" stroke-width="3" fill="none"/>
    
    <!-- Иероглифы -->
    <g transform="translate(250,280)">
      <rect x="0" y="0" width="5" height="20" fill="#8B4513"/>
      <rect x="10" y="0" width="5" height="20" fill="#8B4513"/>
      <rect x="20" y="0" width="5" height="20" fill="#8B4513"/>
      <rect x="5" y="5" width="5" height="10" fill="#8B4513"/>
      <rect x="15" y="5" width="5" height="10" fill="#8B4513"/>
    </g>
    
    <!-- Египетская подпись -->
    <text x="250" y="330" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">ЕГИПЕТ</text>
  </g>
  
  <!-- Китайская часть -->
  <g id="china">
    <!-- Великая стена -->
    <rect x="20" y="150" width="460" height="30" fill="url(#wallGrad)"/>
    <rect x="20" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="80" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="140" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="200" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="260" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="320" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="380" y="145" width="40" height="10" fill="#8B4513"/>
    <rect x="440" y="145" width="40" height="10" fill="#8B4513"/>
    
    <!-- Китайские здания -->
    <rect x="300" y="100" width="60" height="50" fill="#CD853F"/>
    <polygon points="300,100 330,70 360,100" fill="#8B4513"/>
    <rect x="310" y="110" width="10" height="10" fill="#000"/>
    <rect x="340" y="110" width="10" height="10" fill="#000"/>
    <rect x="310" y="130" width="10" height="10" fill="#000"/>
    <rect x="340" y="130" width="10" height="10" fill="#000"/>
    
    <rect x="380" y="110" width="50" height="40" fill="#DEB887"/>
    <polygon points="380,110 405,90 430,110" fill="#8B4513"/>
    <circle cx="405" cy="130" r="8" fill="#FFD700"/>
    
    <!-- Бамбук -->
    <g transform="translate(50,100)">
      <line x1="0" y1="50" x2="0" y2="0" stroke="#228B22" stroke-width="3"/>
      <line x1="0" y1="40" x2="8" y2="35" stroke="#228B22" stroke-width="2"/>
      <line x1="0" y1="30" x2="10" y2="25" stroke="#228B22" stroke-width="2"/>
      <line x1="0" y1="20" x2="8" y2="15" stroke="#228B22" stroke-width="2"/>
      <line x1="0" y1="10" x2="5" y2="8" stroke="#228B22" stroke-width="2"/>
    </g>
    
    <!-- Китайский дракон -->
    <g transform="translate(200,80) scale(0.8)">
      <ellipse cx="0" cy="0" rx="30" ry="15" fill="#DC143C"/>
      <ellipse cx="25" cy="0" rx="20" ry="12" fill="#DC143C"/>
      <ellipse cx="40" cy="0" rx="15" ry="10" fill="#DC143C"/>
      <circle cx="50" cy="0" r="8" fill="#DC143C"/>
      <circle cx="55" cy="-2" r="2" fill="#FFF"/>
      <circle cx="55" cy="2" r="2" fill="#000"/>
      <path d="M-20,0 Q-25,-10 -20,-15 Q-15,-10 -10,-5" fill="#DC143C"/>
      <path d="M-10,0 Q-5,-8 0,-10 Q5,-8 10,0" fill="#DC143C"/>
      <path d="M10,0 Q15,-5 20,-8 Q25,-5 30,0" fill="#DC143C"/>
    </g>
    
    <!-- Китайские символы -->
    <text x="150" y="130" font-family="serif" font-size="30" fill="#8B0000">龍</text>
    <text x="350" y="90" font-family="serif" font-size="20" fill="#8B0000">中</text>
    
    <!-- Китайская подпись -->
    <text x="250" y="210" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2C3E50">КИТАЙ</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Сфинкс -->
  <g transform="translate(140,250) scale(0.5)">
    <ellipse cx="20" cy="40" rx="30" ry="20" fill="#DEB887"/>
    <rect x="0" y="40" width="40" height="50" fill="#DEB887"/>
    <rect x="10" y="30" width="20" height="15" fill="#DEB887"/>
    <path d="M20,30 Q10,20 20,10 Q30,20 20,30" fill="#DEB887"/>
    <circle cx="15" cy="20" r="2" fill="#000"/>
    <circle cx="25" cy="20" r="2" fill="#000"/>
    <path d="M15,25 Q20,28 25,25" stroke="#000" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Трости -->
  <g transform="translate(420,120)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#8B4513" stroke-width="2"/>
    <path d="M0,0 Q-10,-5 -15,-10 Q-10,-15 0,-20 Q10,-15 15,-10 Q10,-5 0,0" fill="#228B22"/>
  </g>
  
  <!-- Надписи -->
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Древние цивилизации</text>
  <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#666">Нил - жизнь Египта</text>
  <text x="30" y="85" font-family="Arial, sans-serif" font-size="10" fill="#666">Хуанхэ - колыбель Китая</text>
  
  <!-- Стрелки -->
  <path d="M120,200 L140,190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M380,200 L360,190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Даты -->
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">3100-30 гг. до н.э.</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">2070-221 гг. до н.э.</text>
</svg>