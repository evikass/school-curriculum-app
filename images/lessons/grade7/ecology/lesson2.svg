<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновый градиент -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ebf0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)" />
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16a085">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <rect x="100" y="50" width="300" height="35" rx="5" fill="#16a085" opacity="0.2" />
  <text x="250" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#16a085">Методы экологических исследований</text>
  
  <!-- Центральный элемент - Земля -->
  <circle cx="250" cy="200" r="60" fill="#16a085" opacity="0.8" />
  <path d="M 210 180 Q 230 170, 250 175 T 290 185" stroke="white" stroke-width="3" fill="none" />
  <path d="M 220 200 Q 240 190, 260 195 T 280 210" stroke="white" stroke-width="3" fill="none" />
  <path d="M 215 220 Q 235 210, 255 215 T 285 225" stroke="white" stroke-width="3" fill="none" />
  <text x="250" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ЭКОСИСТЕМЫ</text>
  
  <!-- Левая секция - Методы исследований -->
  <rect x="20" y="120" width="140" height="180" rx="10" fill="white" stroke="#16a085" stroke-width="2" />
  <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">Методы</text>
  <text x="90" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">исследований</text>
  
  <!-- Метод 1 -->
  <circle cx="50" cy="180" r="15" fill="#16a085" opacity="0.6" />
  <text x="50" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">1</text>
  <text x="80" y="185" font-family="Arial, sans-serif" font-size="12" fill="#333">Наблюдение</text>
  
  <!-- Метод 2 -->
  <circle cx="50" cy="210" r="15" fill="#16a085" opacity="0.6" />
  <text x="50" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2</text>
  <text x="80" y="215" font-family="Arial, sans-serif" font-size="12" fill="#333">Эксперимент</text>
  
  <!-- Метод 3 -->
  <circle cx="50" cy="240" r="15" fill="#16a085" opacity="0.6" />
  <text x="50" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">3</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">Моделирование</text>
  
  <!-- Метод 4 -->
  <circle cx="50" cy="270" r="15" fill="#16a085" opacity="0.6" />
  <text x="50" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">4</text>
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="12" fill="#333">Анализ</text>
  
  <!-- Правая секция - Уровни организации -->
  <rect x="340" y="120" width="140" height="180" rx="10" fill="white" stroke="#16a085" stroke-width="2" />
  <text x="410" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">Уровни</text>
  <text x="410" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">организации</text>
  
  <!-- Уровень 1 -->
  <rect x="350" y="170" width="120" height="20" rx="3" fill="#16a085" opacity="0.6" />
  <text x="410" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Биосфера</text>
  
  <!-- Уровень 2 -->
  <rect x="350" y="200" width="120" height="20" rx="3" fill="#16a085" opacity="0.7" />
  <text x="410" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Экосистема</text>
  
  <!-- Уровень 3 -->
  <rect x="350" y="230" width="120" height="20" rx="3" fill="#16a085" opacity="0.8" />
  <text x="410" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Сообщество</text>
  
  <!-- Уровень 4 -->
  <rect x="350" y="260" width="120" height="20" rx="3" fill="#16a085" opacity="0.9" />
  <text x="410" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Популяция</text>
  
  <!-- Дополнительные элементы -->
  <!-- Иконка микроскопа -->
  <g transform="translate(30, 90)">
    <rect x="0" y="15" width="5" height="20" fill="#16a085" />
    <rect x="-5" y="10" width="15" height="5" fill="#16a085" />
    <circle cx="2.5" cy="5" r="8" fill="none" stroke="#16a085" stroke-width="2" />
    <line x1="2.5" y1="5" x2="2.5" y2="-5" stroke="#16a085" stroke-width="1.5" />
    <circle cx="2.5" cy="-5" r="3" fill="#16a085" />
  </g>
  
  <!-- Иконка лабораторной колбы -->
  <g transform="translate(440, 90)">
    <path d="M 5 0 L 5 15 L 2 25 L 8 25 Z" fill="none" stroke="#16a085" stroke-width="2" />
    <path d="M 5 10 L 10 12 L 15 10" fill="none" stroke="#16a085" stroke-width="1.5" />
    <circle cx="5" cy="20" r="2" fill="#16a085" opacity="0.5" />
  </g>
  
  <!-- Связующие линии -->
  <line x1="160" y1="210" x2="190" y2="210" stroke="#16a085" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="310" y1="210" x2="340" y2="210" stroke="#16a085" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Стрелки -->
  <polygon points="190,205 190,215 185,210" fill="#16a085" />
  <polygon points="340,205 340,215 335,210" fill="#16a085" />
  
  <!-- Дополнительные текстовые элементы -->
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#16a085" font-style="italic">"Наука о взаимодействии организмов с окружающей средой"</text>
  
  <!-- Малые иконки -->
  <circle cx="180" cy="140" r="8" fill="#16a085" opacity="0.5" />
  <circle cx="320" cy="140" r="8" fill="#16a085" opacity="0.5" />
  
  <!-- Разделители -->
  <line x1="20" y1="100" x2="480" y2="100" stroke="#16a085" stroke-width="1" opacity="0.3" />
  <line x1="20" y1="310" x2="480" y2="310" stroke="#16a085" stroke-width="1" opacity="0.3" />
  
  <!-- Дополнительные метки -->
  <text x="90" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a085">ОБЪЕКТ ИССЛЕДОВАНИЯ</text>
  <text x="410" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a085">МАСШТАБ</text>
  
  <!-- Малые схемы -->
  <g transform="translate(180, 250)">
    <circle cx="0" cy="0" r="15" fill="#16a085" opacity="0.3" />
    <circle cx="-10" cy="0" r="3" fill="#16a085" />
    <circle cx="0" cy="0" r="3" fill="#16a085" />
    <circle cx="10" cy="0" r="3" fill="#16a085" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#16a085" stroke-width="1" opacity="0.5" />
  </g>
  
  <g transform="translate(320, 250)">
    <rect x="-15" y="-15" width="30" height="30" fill="#16a085" opacity="0.3" />
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#16a085" stroke-width="1" />
    <circle cx="0" cy="0" r="5" fill="#16a085" opacity="0.7" />
  </g>
  
  <!-- Дополнительные текстовые элементы -->
  <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Количественные и качественные методы</text>
  <text x="410" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">От популяции к биосфере</text>
  
  <!-- Дополнительные линии для структуры -->
  <line x1="50" y1="165" x2="50" y2="175" stroke="#16a085" stroke-width="1" />
  <line x1="50" y1="195" x2="50" y2="205" stroke="#16a085" stroke-width="1" />
  <line x1="50" y1="225" x2="50" y2="235" stroke="#16a085" stroke-width="1" />
  <line x1="50" y1="255" x2="50" y2="265" stroke="#16a085" stroke-width="1" />
  
  <line x1="350" y1="165" x2="350" y2="175" stroke="#16a085" stroke-width="1" />
  <line x1="350" y1="195" x2="350" y2="205" stroke="#16a085" stroke-width="1" />
  <line x1="350" y1="225" x2="350" y2="235" stroke="#16a085" stroke-width="1" />
  <line x1="350" y1="255" x2="350" y2="265" stroke="#16a085" stroke-width="1" />
  
  <!-- Дополнительные декоративные элементы -->
  <circle cx="250" cy="100" r="3" fill="#16a085" opacity="0.5" />
  <circle cx="240" cy="100" r="3" fill="#16a085" opacity="0.5" />
  <circle cx="260" cy="100" r="3" fill="#16a085" opacity="0.5" />
  
  <!-- Поясняющие тексты -->
  <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">ОСНОВНЫЕ</text>
  <text x="250" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">ПОНЯТИЯ</text>
</svg>