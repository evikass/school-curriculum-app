<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16a085">ЭКОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Понятие экосистемы</text>
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Экосистемы и их структура</text>
  
  <!-- Основная диаграмма экосистемы -->
  <g id="ecosystem-diagram">
    <!-- Внешний круг экосистемы -->
    <circle cx="250" cy="200" r="80" fill="#e8f5f0" stroke="#16a085" stroke-width="2"/>
    
    <!-- Внутренний круг биотопа -->
    <circle cx="250" cy="200" r="60" fill="#d4f1ee" stroke="#16a085" stroke-width="1.5"/>
    
    <!-- Центр - биогеоценоз -->
    <circle cx="250" cy="200" r="40" fill="#16a085" opacity="0.2"/>
    <text x="250" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a085">БИОГЕОЦЕНОЗ</text>
    <text x="250" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a085">(экосистема)</text>
    
    <!-- Компоненты экосистемы -->
    <!-- Биотические компоненты -->
    <circle cx="200" cy="160" r="15" fill="#3498db" opacity="0.7"/>
    <text x="200" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Прод.</text>
    
    <circle cx="300" cy="160" r="15" fill="#e74c3c" opacity="0.7"/>
    <text x="300" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Конс.</text>
    
    <circle cx="250" cy="130" r="15" fill="#f39c12" opacity="0.7"/>
    <text x="250" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Ред.</text>
    
    <!-- Абиотические компоненты -->
    <rect x="170" y="220" width="30" height="20" fill="#95a5a6" opacity="0.7" rx="5"/>
    <text x="185" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Вода</text>
    
    <rect x="220" y="240" width="30" height="20" fill="#95a5a6" opacity="0.7" rx="5"/>
    <text x="235" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Почва</text>
    
    <rect x="270" y="240" width="30" height="20" fill="#95a5a6" opacity="0.7" rx="5"/>
    <text x="285" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Воздух</text>
    
    <rect x="320" y="220" width="30" height="20" fill="#95a5a6" opacity="0.7" rx="5"/>
    <text x="335" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Свет</text>
    
    <!-- Линии связей -->
    <line x1="200" y1="160" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="160" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="130" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="185" y1="220" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="235" y1="240" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="285" y1="240" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
    <line x1="335" y1="220" x2="250" y2="200" stroke="#16a085" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Подписи к компонентам -->
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Продукторы</text>
  <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">растения</text>
  
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Консументы</text>
  <text x="300" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">животные</text>
  
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Редуценты</text>
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">грибы, бактерии</text>
  
  <!-- Левая сторона - уровни организации -->
  <g id="organization-levels">
    <rect x="30" y="120" width="100" height="30" fill="#16a085" opacity="0.8" rx="5"/>
    <text x="80" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Организм</text>
    
    <rect x="30" y="160" width="100" height="30" fill="#16a085" opacity="0.7" rx="5"/>
    <text x="80" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Популяция</text>
    
    <rect x="30" y="200" width="100" height="30" fill="#16a085" opacity="0.6" rx="5"/>
    <text x="80" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Биоценоз</text>
    
    <rect x="30" y="240" width="100" height="30" fill="#16a085" opacity="0.5" rx="5"/>
    <text x="80" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Биогеоценоз</text>
    
    <!-- Стрелки между уровнями -->
    <line x1="80" y1="150" x2="80" y2="160" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="190" x2="80" y2="200" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="230" x2="80" y2="240" stroke="#16a085" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Правая сторона - примеры экосистем -->
  <g id="ecosystem-examples">
    <rect x="370" y="120" width="100" height="25" fill="#3498db" opacity="0.3" rx="5"/>
    <text x="420" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Лес</text>
    
    <rect x="370" y="150" width="100" height="25" fill="#3498db" opacity="0.3" rx="5"/>
    <text x="420" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Луг</text>
    
    <rect x="370" y="180" width="100" height="25" fill="#3498db" opacity="0.3" rx="5"/>
    <text x="420" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Озеро</text>
    
    <rect x="370" y="210" width="100" height="25" fill="#3498db" opacity="0.3" rx="5"/>
    <text x="420" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Река</text>
    
    <rect x="370" y="240" width="100" height="25" fill="#3498db" opacity="0.3" rx="5"/>
    <text x="420" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Океан</text>
  </g>
  
  <!-- Связи между компонентами -->
  <g id="connections">
    <path d="M 130 135 Q 170 170 200 160" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M 130 175 Q 170 180 200 170" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M 130 215 Q 170 210 200 190" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    
    <path d="M 370 132 Q 330 160 300 160" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M 370 162 Q 330 170 300 170" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M 370 192 Q 330 190 300 180" stroke="#16a085" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Иконки солнца -->
  <circle cx="420" cy="100" r="12" fill="#f39c12"/>
  <line x1="420" y1="85" x2="420" y2="88" stroke="#f39c12" stroke-width="2"/>
    <line x1="420" y1="112" x2="420" y2="115" stroke="#f39c12" stroke-width="2"/>
    <line x1="405" y1="100" x2="408" y2="100" stroke="#f39c12" stroke-width="2"/>
    <line x1="432" y1="100" x2="435" y2="100" stroke="#f39c12" stroke-width="2"/>
    <line x1="410" y1="90" x2="413" y2="93" stroke="#f39c12" stroke-width="2"/>
    <line x1="427" y1="107" x2="430" y2="110" stroke="#f39c12" stroke-width="2"/>
    <line x1="410" y1="110" x2="413" y2="107" stroke="#f39c12" stroke-width="2"/>
    <line x1="427" y1="93" x2="430" y2="90" stroke="#f39c12" stroke-width="2"/>
    
  <!-- Иконка воды -->
    <path d="M 80 100 Q 70 110 80 120 Q 90 110 80 100" fill="#3498db" opacity="0.7"/>
    <path d="M 80 100 Q 90 110 80 120 Q 70 110 80 100" fill="#2980b9" opacity="0.7"/>
    
  <!-- Стрелка маркер -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#16a085"/>
      </marker>
    </defs>
    
  <!-- Дополнительные текстовые элементы -->
  <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Уровни организации</text>
  <text x="420" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Примеры экосистем</text>
  
  <!-- Пояснения -->
  <text x="250" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Экосистема - это совокупность живых организмов</text>
  <text x="250" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">и их окружающей среды, связанных между собой</text>
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">вещественным и энергетическим обменом</text>
</svg>