<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" fill="url(#blueGrad)" rx="8" filter="url(#shadow)"/>
  <text x="250" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="80" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="600">Урок 4. Моль. Количество вещества</text>
  
  <!-- Основной блок информации -->
  <rect x="30" y="100" width="440" height="220" fill="white" stroke="#DDD" stroke-width="2" rx="10" filter="url(#shadow)"/>
  
  <!-- Моль -->
  <rect x="50" y="120" width="130" height="80" fill="url(#greenGrad)" rx="8"/>
  <text x="115" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">МОЛЬ</text>
  <text x="115" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">(mol)</text>
  <text x="115" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">единица количества</text>
  <text x="115" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">вещества</text>
  
  <!-- Число Авогадро -->
  <rect x="200" y="120" width="130" height="80" fill="url(#orangeGrad)" rx="8"/>
  <text x="265" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Число</text>
  <text x="265" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">АВОГАДРО</text>
  <text x="265" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Nₐ</text>
  <text x="265" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">6,022 × 10²³</text>
  
  <!-- Молярная масса -->
  <rect x="350" y="120" width="110" height="80" fill="url(#purpleGrad)" rx="8"/>
  <text x="405" y="140" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Молярная</text>
  <text x="405" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">масса</text>
  <text x="405" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">M (г/моль)</text>
  <text x="405" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">относительная</text>
  
  <!-- Формулы -->
  <text x="50" y="230" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Основные формулы:</text>
  
  <!-- Формула 1 -->
  <rect x="50" y="240" width="420" height="15" fill="#E8F4F8" rx="5"/>
  <text x="60" y="251" fill="#333" font-family="Arial, sans-serif" font-size="12">n = N / Nₐ</text>
  <text x="130" y="251" fill="#666" font-family="Arial, sans-serif" font-size="11">где n - количество вещества, N - число частиц</text>
  
  <!-- Формула 2 -->
  <rect x="50" y="260" width="420" height="15" fill="#E8F4F8" rx="5"/>
  <text x="60" y="271" fill="#333" font-family="Arial, sans-serif" font-size="12">n = m / M</text>
  <text x="130" y="271" fill="#666" font-family="Arial, sans-serif" font-size="11">где m - масса вещества, M - молярная масса</text>
  
  <!-- Атомы для иллюстрации -->
  <g transform="translate(60, 300)">
    <!-- Водород -->
    <circle cx="0" cy="0" r="8" fill="#FF6B6B" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">H</text>
    <text x="0" y="20" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">водород</text>
    
    <!-- Углерод -->
    <circle cx="60" cy="0" r="10" fill="#4ECDC4" opacity="0.8"/>
    <text x="60" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">C</text>
    <text x="60" y="20" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">углерод</text>
    
    <!-- Кислород -->
    <circle cx="120" cy="0" r="9" fill="#95E1D3" opacity="0.8"/>
    <text x="120" y="4" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">O</text>
    <text x="120" y="20" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">кислород</text>
  </g>
  
  <!-- Стрелки для связей -->
  <path d="M 180 160 L 190 160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 330 160 L 340 160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <circle cx="420" cy="250" r="3" fill="#4A90E2" opacity="0.6"/>
  <circle cx="430" cy="255" r="3" fill="#4A90E2" opacity="0.6"/>
  <circle cx="425" cy="265" r="3" fill="#4A90E2" opacity="0.6"/>
  <circle cx="415" cy="260" r="3" fill="#4A90E2" opacity="0.6"/>
  <circle cx="435" cy="245" r="3" fill="#4A90E2" opacity="0.6"/>
  
  <!-- Номер урока -->
  <text x="470" y="320" fill="#999" font-family="Arial, sans-serif" font-size="10">урок 4</text>
</svg>