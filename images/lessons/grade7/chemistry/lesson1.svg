<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGrad">
      <stop offset="0%" style="stop-color:#ECF0F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BDC3C7;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Фоновый круг -->
  <circle cx="250" cy="175" r="170" fill="url(#centerGrad)" opacity="0.3"/>
  
  <!-- Основная надпись -->
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495E">Урок 1. Введение в химию</text>
  
  <!-- Центральный элемент - молекула -->
  <g transform="translate(250, 175)">
    <!-- Атомы -->
    <circle cx="0" cy="0" r="20" fill="url(#blueGrad)"/>
    <circle cx="-30" cy="-20" r="15" fill="url(#greenGrad)"/>
    <circle cx="30" cy="-20" r="15" fill="url(#orangeGrad)"/>
    <circle cx="-25" cy="25" r="12" fill="url(#purpleGrad)"/>
    <circle cx="25" cy="25" r="12" fill="url(#blueGrad)"/>
    
    <!-- Связи -->
    <line x1="0" y1="0" x2="-30" y2="-20" stroke="#7F8C8D" stroke-width="2"/>
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#7F8C8D" stroke-width="2"/>
    <line x1="0" y1="0" x2="-25" y2="25" stroke="#7F8C8D" stroke-width="2"/>
    <line x1="0" y1="0" x2="25" y2="25" stroke="#7F8C8D" stroke-width="2"/>
    
    <!-- Центральная надпись -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">ХИМИЯ</text>
  </g>
  
  <!-- Блок "Что изучает химия" -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#blueGrad)" opacity="0.8"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Что изучает</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">химия?</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• вещества</text>
    <text x="60" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• свойства</text>
  </g>
  
  <!-- Блок "Вещества" -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#greenGrad)" opacity="0.8"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Вещества</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Простые</text>
    <text x="60" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Сложные</text>
    <text x="60" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Смеси</text>
  </g>
  
  <!-- Блок "Тела" -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#orangeGrad)" opacity="0.8"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Тела</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Твёрдые</text>
    <text x="60" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Жидкие</text>
    <text x="60" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Газообразные</text>
  </g>
  
  <!-- Блок "Явления" -->
  <g transform="translate(330, 220)">
    <rect x="0" y="0" width="120" height="80" rx="10" fill="url(#purpleGrad)" opacity="0.8"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Явления</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Физические</text>
    <text x="60" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Химические</text>
    <text x="60" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Биологические</text>
  </g>
  
  <!-- Стрелки и связи -->
  <g stroke="#7F8C8D" stroke-width="2" fill="none">
    <path d="M 170 140 L 200 175" marker-end="url(#arrowhead)"/>
    <path d="M 330 140 L 300 175" marker-end="url(#arrowhead)"/>
    <path d="M 170 260 L 200 200" marker-end="url(#arrowhead)"/>
    <path d="M 330 260 L 300 200" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7F8C8D"/>
    </marker>
  </defs>
  
  <!-- Дополнительные элементы -->
  <!-- Периодическая таблица (упрощенная) -->
  <g transform="translate(180, 280)">
    <rect x="0" y="0" width="140" height="50" rx="5" fill="#ECF0F1" stroke="#BDC3C7"/>
    <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Периодическая</text>
    <text x="70" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">система</text>
    <text x="70" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">элементов</text>
  </g>
  
  <!-- Иконки молекул -->
  <g transform="translate(80, 85)">
    <circle cx="0" cy="0" r="8" fill="#E74C3C"/>
    <circle cx="12" cy="0" r="6" fill="#3498DB"/>
    <line x1="0" y1="0" x2="12" y2="0" stroke="#34495E" stroke-width="1"/>
  </g>
  
  <g transform="translate(400, 85)">
    <circle cx="0" cy="0" r="6" fill="#F39C12"/>
    <circle cx="10" cy="0" r="6" fill="#16A085"/>
    <circle cx="5" cy="8" r="5" fill="#8E44AD"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#34495E" stroke-width="1"/>
    <line x1="5" y1="0" x2="5" y2="8" stroke="#34495E" stroke-width="1"/>
  </g>
  
  <!-- Обозначения состояний -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">
    <text x="110" y="195">Твёрдое</text>
    <text x="110" y="208">состояние</text>
    <text x="380" y="195">Жидкое</text>
    <text x="380" y="208">состояние</text>
  </g>
  
  <!-- Формулы примеров -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">
    <text x="70" y="235">H₂O</text>
    <text x="370" y="235">NaCl</text>
  </g>
  
  <!-- Декоративные элементы -->
  <g opacity="0.3">
    <circle cx="40" cy="40" r="3" fill="#3498DB"/>
    <circle cx="460" cy="40" r="3" fill="#E74C3C"/>
    <circle cx="40" cy="310" r="3" fill="#2ECC71"/>
    <circle cx="460" cy="310" r="3" fill="#F39C12"/>
  </g>
  
  <!-- Подписи к стрелкам -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">
    <text x="185" y="155">образуют</text>
    <text x="285" y="155">из состояний</text>
    <text x="185" y="230">состояний</text>
    <text x="285" y="230">наблюдаемы</text>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="250" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495E">Введение в химию. Вещества</text>
  
  <!-- Легенда -->
  <g transform="translate(20, 320)">
    <rect x="0" y="0" width="460" height="20" rx="5" fill="#ECF0F1" opacity="0.5"/>
    <text x="10" y="13" font-family="Arial, sans-serif" font-size="9" fill="#2C3E50">Химия наука о веществах, их свойствах, строении и превращениях</text>
  </g>
</svg>