<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#44a3aa"/>
    </linearGradient>
    
    <linearGradient id="neutralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9ff3"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#34495e"/>
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Урок 9 -->
  <rect x="50" y="50" width="400" height="40" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#2c3e50">Урок 9. Кислоты и основания</text>
  
  <!-- Тема -->
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Тема: Кислоты, основания, индикаторы, нейтрализация</text>
  
  <!-- Раздел: Кислоты -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="url(#acidGrad)" opacity="0.9"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">КИСЛОТЫ</text>
    
    <!-- Сульфатная кислота -->
    <circle cx="20" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="20" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ee5a24">H₂SO₄</text>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="11" fill="white">Серная</text>
    
    <!-- Соляная кислота -->
    <circle cx="70" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ee5a24">HCl</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="11" fill="white">Соляная</text>
    
    <!-- Азотная кислота -->
    <circle cx="120" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="120" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ee5a24">HNO₃</text>
    <text x="105" y="65" font-family="Arial, sans-serif" font-size="11" fill="white">Азотная</text>
  </g>
  
  <!-- Раздел: Основания -->
  <g transform="translate(310, 130)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="url(#baseGrad)" opacity="0.9"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">ОСНОВАНИЯ</text>
    
    <!-- NaOH -->
    <circle cx="20" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="20" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#44a3aa">NaOH</text>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="11" fill="white">Натрия</text>
    
    <!-- KOH -->
    <circle cx="70" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#44a3aa">KOH</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="11" fill="white">Калия</text>
    
    <!-- Ca(OH)₂ -->
    <circle cx="120" cy="45" r="15" fill="#fff" opacity="0.8"/>
    <text x="120" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#44a3aa">Ca(OH)₂</text>
    <text x="105" y="65" font-family="Arial, sans-serif" font-size="11" fill="white">Кальция</text>
  </g>
  
  <!-- Стрелка нейтрализации -->
  <g transform="translate(200, 230)">
    <path d="M 0 0 L 100 0 L 95 -5 M 100 0 L 95 5" stroke="#2c3e50" stroke-width="3" fill="none"/>
    <text x="50" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Реакция</text>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">нейтрализации</text>
  </g>
  
  <!-- Ионная формула реакции -->
  <rect x="140" y="265" width="220" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="250" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">H⁺ + OH⁻ → H₂O</text>
  
  <!-- Индикаторы -->
  <g transform="translate(50, 300)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Индикаторы:</text>
    
    <!-- Лакмус -->
    <rect x="80" y="0" width="40" height="20" rx="10" fill="#e74c3c"/>
    <text x="100" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Лакмус</text>
    
    <!-- Фенолфталеин -->
    <rect x="130" y="0" width="40" height="20" rx="10" fill="#f39c12"/>
    <text x="150" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Фенолфт.</text>
    
    <!-- Метиловый оранжевый -->
    <rect x="180" y="0" width="50" height="20" rx="10" fill="#e67e22"/>
    <text x="205" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Метил.ор.</text>
  </g>
  
  <!-- pH шкала -->
  <g transform="translate(300, 300)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">pH:</text>
    <rect x="25" y="0" width="170" height="20" rx="10" fill="url(#neutralGrad)"/>
    <text x="35" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
    <text x="85" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">7</text>
    <text x="155" y="14" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">14</text>
    <text x="60" y="14" font-family="Arial, sans-serif" font-size="9" fill="#c0392b">кислый</text>
    <text x="95" y="14" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">нейтр</text>
    <text x="120" y="14" font-family="Arial, sans-serif" font-size="9" fill="#2980b9">щелочной</text>
  </g>
  
  <!-- Дополнительные элементы декора -->
  <circle cx="30" cy="30" r="5" fill="#3498db" opacity="0.5"/>
  <circle cx="470" cy="30" r="5" fill="#e74c3c" opacity="0.5"/>
  <circle cx="30" cy="320" r="5" fill="#2ecc71" opacity="0.5"/>
  <circle cx="470" cy="320" r="5" fill="#f39c12" opacity="0.5"/>
  
  <!-- Молекулярные схемы -->
  <g transform="translate(30, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="8" fill="#ff6b6b"/>
    <circle cx="15" cy="0" r="5" fill="#333"/>
    <circle cx="30" cy="0" r="8" fill="#4ecdc4"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">H-OH</text>
  </g>
  
  <g transform="translate(440, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="8" fill="#4ecdc4"/>
    <circle cx="15" cy="0" r="5" fill="#333"/>
    <circle cx="30" cy="0" r="8" fill="#ff6b6b"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">HO-H</text>
  </g>
</svg>