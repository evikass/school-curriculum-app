<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F0FE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FBFF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="atomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="atomGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="atomGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)" filter="url(#shadow)"/>
  
  <!-- Текст заголовка -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">ХИМИЯ · 7 КЛАСС</text>
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Урок 6. Валентность. Составление формул</text>
  
  <!-- Основная карточка -->
  <rect x="20" y="80" width="460" height="250" rx="10" fill="url(#cardGrad)" filter="url(#shadow)"/>
  
  <!-- Определение -->
  <text x="30" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Валентность — это...</text>
  
  <!-- Определение текст -->
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="13" fill="#34495E">свойство атома элемента</text>
  <text x="30" y="145" font-family="Arial, sans-serif" font-size="13" fill="#34495E">образовывать определенное</text>
  <text x="30" y="165" font-family="Arial, sans-serif" font-size="13" fill="#34495E">количество химических связей</text>
  
  <!-- Разделительная линия -->
  <line x1="30" y1="175" x2="470" y2="175" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Примеры формул -->
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Определение валентности по формуле:</text>
  
  <!-- Пример 1: H2O -->
  <g transform="translate(30, 215)">
    <!-- Атомы -->
    <circle cx="15" cy="15" r="12" fill="url(#atomGrad)"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">H</text>
    
    <circle cx="15" cy="35" r="12" fill="url(#atomGrad)"/>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">H</text>
    
    <circle cx="45" cy="25" r="12" fill="url(#atomGrad2)"/>
    <text x="45" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">O</text>
    
    <!-- Связи -->
    <line x1="27" y1="20" x2="33" y2="23" stroke="#666" stroke-width="2"/>
    <line x1="27" y1="30" x2="33" y2="27" stroke="#666" stroke-width="2"/>
    
    <!-- Валентности -->
    <text x="15" y="5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FF6B6B" font-weight="bold">1</text>
    <text x="45" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4ECDC4" font-weight="bold">2</text>
    
    <!-- Формула -->
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">H₂O</text>
    <text x="130" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">H: валентность 1</text>
    <text x="130" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">O: валентность 2</text>
  </g>
  
  <!-- Пример 2: NaCl -->
  <g transform="translate(280, 215)">
    <!-- Атомы -->
    <circle cx="15" cy="25" r="12" fill="url(#atomGrad3)"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Na</text>
    
    <circle cx="45" cy="25" r="12" fill="url(#atomGrad2)"/>
    <text x="45" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Cl</text>
    
    <!-- Связь -->
    <line x1="27" y1="25" x2="33" y2="25" stroke="#666" stroke-width="2"/>
    
    <!-- Валентности -->
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#667EEA" font-weight="bold">1</text>
    <text x="45" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4ECDC4" font-weight="bold">1</text>
    
    <!-- Формула -->
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">NaCl</text>
    <text x="130" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">Na: валентность 1</text>
    <text x="130" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">Cl: валентность 1</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <g opacity="0.3">
    <circle cx="450" cy="100" r="30" fill="#4A90E2" opacity="0.2"/>
    <circle cx="50" cy="300" r="25" fill="#7B68EE" opacity="0.2"/>
    <circle cx="420" cy="280" r="20" fill="#4ECDC4" opacity="0.2"/>
  </g>
  
  <!-- Иконки -->
  <g transform="translate(30, 315)">
    <!-- Молекула H2O -->
    <circle cx="10" cy="10" r="6" fill="#FF6B6B"/>
    <circle cx="10" cy="20" r="6" fill="#FF6B6B"/>
    <circle cx="20" cy="15" r="8" fill="#4ECDC4"/>
    <line x1="16" y1="12" x2="16" y2="18" stroke="#666" stroke-width="1.5"/>
  </g>
  
  <g transform="translate(380, 315)">
    <!-- Атомы соединение -->
    <circle cx="10" cy="10" r="6" fill="#667EEA"/>
    <circle cx="25" cy="10" r="8" fill="#4ECDC4"/>
    <line x1="16" y1="10" x2="17" y2="10" stroke="#666" stroke-width="1.5"/>
  </g>
  
  <!-- Подпись "Составление формул" -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7F8C8D" font-style="italic">Составление формул</text>
</svg>