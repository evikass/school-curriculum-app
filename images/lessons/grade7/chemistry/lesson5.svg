<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="50" y="20" width="400" height="50" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">ХИМИЯ · 7 КЛАСС</text>
  
  <!-- Разделитель -->
  <line x1="50" y1="90" x2="450" y2="90" stroke="#DDD" stroke-width="2"/>
  
  <!-- Название урока -->
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Урок 5. Химические формулы</text>
  <text x="250" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Относительная масса</text>
  
  <!-- Тема -->
  <rect x="50" y="150" width="400" height="30" rx="5" fill="#E8F4FD"/>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Тема:</text>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="13" fill="#555">Формулы, Ar, Mr, расчёты по формулам</text>
  
  <!-- Ar - относительная атомная масса -->
  <g transform="translate(50, 200)">
    <rect width="140" height="80" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Ar</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Относительная</text>
    <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">атомная масса</text>
  </g>
  
  <!-- Mr - относительная молекулярная масса -->
  <g transform="translate(210, 200)">
    <rect width="140" height="80" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Mr</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Относительная</text>
    <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">молекулярная масса</text>
  </g>
  
  <!-- Формула воды H₂O -->
  <g transform="translate(370, 200)">
    <circle cx="20" cy="25" r="15" fill="white" stroke="#333" stroke-width="2"/>
    <text x="20" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">H</text>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">2</text>
    
    <line x1="35" y1="25" x2="55" y2="25" stroke="#333" stroke-width="2"/>
    
    <circle cx="70" cy="25" r="20" fill="white" stroke="#333" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">O</text>
    
    <!-- Подпись -->
    <text x="45" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Формула воды</text>
  </g>
  
  <!-- Пример расчёта Mr(H₂O) -->
  <g transform="translate(50, 300)">
    <rect width="400" height="35" rx="5" fill="#FFF9E6" stroke="#F39C12" stroke-width="1"/>
    <text x="10" y="22" font-family="Arial, sans-serif" font-size="12" fill="#333">Пример: Mr(H₂O) = 2 × Ar(H) + Ar(O) = 2 × 1 + 16 = 18</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Атомы -->
  <g transform="translate(50, 90)">
    <circle cx="10" cy="10" r="8" fill="#E74C3C" opacity="0.7"/>
    <text x="10" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">C</text>
    
    <circle cx="30" cy="10" r="8" fill="#3498DB" opacity="0.7"/>
    <text x="30" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">N</text>
    
    <circle cx="50" cy="10" r="8" fill="#2ECC71" opacity="0.7"/>
    <text x="50" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">O</text>
  </g>
  
  <!-- Стрелка вниз -->
  <path d="M 180 90 L 180 110 L 175 105 M 180 110 L 185 105" stroke="#666" stroke-width="2" fill="none"/>
  
  <!-- Значения Ar -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="#ECF0F1"/>
    <text x="30" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Ar(H)=1</text>
    
    <rect x="70" y="0" width="60" height="20" rx="3" fill="#ECF0F1"/>
    <text x="100" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Ar(C)=12</text>
    
    <rect x="140" y="0" width="60" height="20" rx="3" fill="#ECF0F1"/>
    <text x="170" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Ar(O)=16</text>
  </g>
  
  <!-- Иконка калькулятора -->
  <g transform="translate(420, 90)">
    <rect width="30" height="25" rx="3" fill="url(#orangeGrad)"/>
    <rect x="5" y="5" width="20" height="15" rx="2" fill="white" opacity="0.3"/>
    <text x="15" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">∑</text>
  </g>
  
  <!-- Дополнительная формула - CO₂ -->
  <g transform="translate(300, 285)">
    <circle cx="0" cy="0" r="10" fill="white" stroke="#333" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">C</text>
    
    <line x1="10" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1"/>
    <text x="12" y="-3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">2</text>
    
    <circle cx="35" cy="0" r="10" fill="white" stroke="#333" stroke-width="1"/>
    <text x="35" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">O</text>
  </g>
  
  <!-- Текстовые элементы оформления -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999" font-style="italic">Химические формулы и расчёты масс</text>
  
  <!-- Декоративные элементы -->
  <circle cx="450" cy="50" r="3" fill="#4A90E2" opacity="0.5"/>
  <circle cx="440" cy="60" r="2" fill="#4A90E2" opacity="0.5"/>
  <circle cx="460" cy="65" r="2" fill="#4A90E2" opacity="0.5"/>
  
  <!-- Пунктирная линия -->
  <line x1="360" y1="280" x2="435" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Маленькие элементы -->
  <rect x="30" y="85" width="3" height="3" fill="#E74C3C"/>
  <rect x="35" y="85" width="3" height="3" fill="#3498DB"/>
  <rect x="40" y="85" width="3" height="3" fill="#2ECC71"/>
</svg>