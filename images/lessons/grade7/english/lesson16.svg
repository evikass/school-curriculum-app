<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Title Background -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  
  <!-- Title Text -->
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Lesson 16. Technology and gadgets</text>
  
  <!-- Subtitle -->
  <text x="250" y="50" text-anchor="middle" fill="ecf0f1" font-family="Arial, sans-serif" font-size="14">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Smartphone -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="60" height="100" rx="5" fill="#34495e"/>
    <rect x="5" y="10" width="50" height="70" fill="#3498db"/>
    <circle cx="30" cy="90" r="5" fill="#ecf0f1"/>
    <text x="30" y="115" text-anchor="middle" fill="#2c3e50" font-size="10">Smartphone</text>
  </g>
  
  <!-- Laptop -->
  <g transform="translate(130, 110)">
    <rect x="0" y="20" width="80" height="50" fill="#7f8c8d"/>
    <rect x="5" y="25" width="70" height="40" fill="#3498db"/>
    <rect x="-10" y="70" width="100" height="5" rx="2" fill="#95a5a6"/>
    <text x="40" y="90" text-anchor="middle" fill="#2c3e50" font-size="10">Laptop</text>
  </g>
  
  <!-- Tablet -->
  <g transform="translate(230, 105)">
    <rect x="0" y="0" width="70" height="90" rx="5" fill="#34495e"/>
    <rect x="5" y="10" width="60" height="65" fill="#9b59b6"/>
    <circle cx="35" cy="80" r="3" fill="#ecf0f1"/>
    <text x="35" y="110" text-anchor="middle" fill="#2c3e50" font-size="10">Tablet</text>
  </g>
  
  <!-- Headphones -->
  <g transform="translate(320, 100)">
    <path d="M0 20 Q0 0 20 0 Q40 0 40 20 L40 40 Q40 50 30 50 L20 50 Q10 50 10 40 Z" fill="#e74c3c"/>
    <path d="M0 20 Q0 0 20 0 Q40 0 40 20" fill="none" stroke="#e74c3c" stroke-width="3"/>
    <path d="M40 20 Q40 0 60 0 Q80 0 80 20 L80 40 Q80 50 70 50 L60 50 Q50 50 50 40 Z" fill="#e74c3c"/>
    <path d="M40 20 Q40 0 60 0 Q80 0 80 20" fill="none" stroke="#e74c3c" stroke-width="3"/>
    <text x="40" y="75" text-anchor="middle" fill="#2c3e50" font-size="10">Headphones</text>
  </g>
  
  <!-- Camera -->
  <g transform="translate(420, 110)">
    <rect x="0" y="10" width="50" height="35" rx="5" fill="#2c3e50"/>
    <circle cx="25" cy="27" r="12" fill="#34495e"/>
    <circle cx="25" cy="27" r="8" fill="#1abc9c"/>
    <rect x="5" y="0" width="40" height="10" rx="2" fill="#34495e"/>
    <text x="25" y="65" text-anchor="middle" fill="#2c3e50" font-size="10">Camera</text>
  </g>
  
  <!-- Smartwatch -->
  <g transform="translate(80, 200)">
    <rect x="5" y="0" width="30" height="40" rx="5" fill="#16a085"/>
    <rect x="10" y="5" width="20" height="25" fill="#1abc9c"/>
    <rect x="0" y="10" width="5" height="15" fill="#16a085"/>
    <rect x="35" y="10" width="5" height="15" fill="#16a085"/>
    <text x="20" y="55" text-anchor="middle" fill="#2c3e50" font-size="10">Smartwatch</text>
  </g>
  
  <!-- Gaming Console -->
  <g transform="translate(150, 190)">
    <rect x="0" y="10" width="60" height="40" rx="3" fill="#8e44ad"/>
    <circle cx="15" cy="25" r="3" fill="#ecf0f1"/>
    <circle cx="45" cy="25" r="3" fill="#ecf0f1"/>
    <rect x="20" y="20" width="20" height="5" rx="2" fill="#ecf0f1"/>
    <text x="30" y="65" text-anchor="middle" fill="#2c3e50" font-size="10">Game Console</text>
  </g>
  
  <!-- Drone -->
  <g transform="translate(240, 180)">
    <ellipse cx="30" cy="30" rx="25" ry="5" fill="#34495e"/>
    <rect x="25" y="15" width="10" height="20" fill="#2c3e50"/>
    <circle cx="10" cy="25" r="8" fill="#95a5a6"/>
    <circle cx="50" cy="25" r="8" fill="#95a5a6"/>
    <line x1="10" y1="25" x2="25" y2="25" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="50" y1="25" x2="35" y2="25" stroke="#7f8c8d" stroke-width="2"/>
    <text x="30" y="55" text-anchor="middle" fill="#2c3e50" font-size="10">Drone</text>
  </g>
  
  <!-- VR Headset -->
  <g transform="translate(330, 185)">
    <rect x="0" y="15" width="50" height="30" rx="10" fill="#e67e22"/>
    <rect x="5" y="20" width="40" height="20" fill="#d35400"/>
    <rect x="0" y="10" width="15" height="10" rx="5" fill="#e67e22"/>
    <rect x="35" y="10" width="15" height="10" rx="5" fill="#e67e22"/>
    <text x="25" y="65" text-anchor="middle" fill="#2c3e50" font-size="10">VR Headset</text>
  </g>
  
  <!-- Smart Speaker -->
  <g transform="translate(100, 250)">
    <ellipse cx="25" cy="20" rx="20" ry="5" fill="#34495e"/>
    <rect x="15" y="20" width="20" height="30" rx="5" fill="#2c3e50"/>
    <circle cx="25" cy="30" r="5" fill="#1abc9c"/>
    <circle cx="25" cy="40" r="3" fill="#16a085"/>
    <text x="25" y="65" text-anchor="middle" fill="#2c3e50" font-size="10">Smart Speaker</text>
  </g>
  
  -- Electric Scooter -->
  <g transform="translate(200, 240)">
    <rect x="0" y="20" width="50" height="15" rx="3" fill="#34495e"/>
    <circle cx="10" cy="40" r="8" fill="#2c3e50"/>
    <circle cx="40" cy="40" r="8" fill="#2c3e50"/>
    <rect x="20" y="10" width="10" height="20" fill="#7f8c8d"/>
    <path d="M25 10 L20 0 L30 0 Z" fill="#e74c3c"/>
    <text x="25" y="60" text-anchor="middle" fill="#2c3e50" font-size="10">E-Scooter</text>
  </g>
  
  <!-- Fitness Tracker -->
  <g transform="translate(300, 245)">
    <rect x="0" y="10" width="40" height="20" rx="10" fill="#27ae60"/>
    <rect x="5" y="15" width="30" height="10" fill="#2ecc71"/>
    <rect x="-5" y="18" width="5" height="4" fill="#27ae60"/>
    <rect x="40" y="18" width="5" height="4" fill="#27ae60"/>
    <text x="20" y="50" text-anchor="middle" fill="#2c3e50" font-size="10">Fitness Tracker</text>
  </g>
  
  <!-- Wireless Charger -->
  <g transform="translate(380, 240)">
    <ellipse cx="25" cy="25" rx="25" ry="15" fill="#95a5a6"/>
    <circle cx="25" cy="25" r="10" fill="#7f8c8d"/>
    <text x="25" y="55" text-anchor="middle" fill="#2c3e50" font-size="10">Wireless Charger</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="320" r="3" fill="#3498db"/>
  <circle cx="50" cy="320" r="3" fill="#e74c3c"/>
  <circle cx="70" cy="320" r="3" fill="#2ecc71"/>
  <circle cx="90" cy="320" r="3" fill="#f39c12"/>
  <circle cx="110" cy="320" r="3" fill="#9b59b6"/>
  
  <!-- Connecting lines -->
  <line x1="110" y1="150" x2="170" y2="150" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="210" y1="150" x2="250" y2="150" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="300" y1="150" x2="370" y2="150" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  
  <line x1="110" y1="220" x2="150" y2="220" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="210" y1="220" x2="240" y2="220" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="290" y1="220" x2="330" y2="220" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  
  <line x1="140" y1="250" x2="200" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="250" y1="250" x2="300" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="340" y1="250" x2="380" y2="250" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Vocabulary boxes -->
  <rect x="20" y="80" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="100" y="90" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="180" y="85" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="260" y="80" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="340" y="90" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  
  <rect x="50" y="170" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="130" y="160" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="210" y="150" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="290" y="160" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  
  <rect x="70" y="220" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="150" y="210" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="230" y="220" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="310" y="210" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
  <rect x="390" y="220" width="80" height="15" fill="#ecf0f1" rx="2" opacity="0.5"/>
</svg>