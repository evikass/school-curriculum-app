<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Заголовок -->
  <rect x="10" y="10" width="480" height="50" fill="#4169e1" rx="5"/>
  <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Lesson 7. Food and Drinks</text>
  
  <!-- Категория: Fruits -->
  <g id="fruits">
    <rect x="20" y="100" width="110" height="140" fill="#ffe4e1" stroke="#ff6347" stroke-width="2" rx="5"/>
    <text x="75" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b0000">Fruits</text>
    
    <!-- Apple -->
    <circle cx="50" cy="145" r="15" fill="#ff0000"/>
    <rect x="48" y="130" width="4" height="10" fill="#8b4513"/>
    <ellipse cx="52" cy="132" rx="5" ry="3" fill="#228b22"/>
    <text x="75" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Apple</text>
    
    <!-- Banana -->
    <path d="M 90 145 Q 100 140, 105 150 Q 100 160, 90 155" fill="#ffd700"/>
    <text x="97" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Banana</text>
    
    <!-- Orange -->
    <circle cx="50" cy="195" r="15" fill="#ffa500"/>
    <text x="75" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Orange</text>
    
    <!-- Grapes -->
    <circle cx="95" cy="195" r="5" fill="#9370db"/>
    <circle cx="100" cy="195" r="5" fill="#9370db"/>
    <circle cx="105" cy="195" r="5" fill="#9370db"/>
    <circle cx="97" cy="203" r="5" fill="#9370db"/>
    <circle cx="102" cy="203" r="5" fill="#9370db"/>
    <text x="100" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Grapes</text>
  </g>
  
  <!-- Категория: Vegetables -->
  <g id="vegetables">
    <rect x="140" y="100" width="110" height="140" fill="#e6ffe6" stroke="#32cd32" stroke-width="2" rx="5"/>
    <text x="195" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#006400">Vegetables</text>
    
    <!-- Carrot -->
    <path d="M 170 145 L 175 160 L 165 160 Z" fill="#ff8c00"/>
    <rect x="168" y="160" width="4" height="8" fill="#228b22"/>
    <text x="195" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Carrot</text>
    
    <!-- Tomato -->
    <circle cx="240" cy="150" r="12" fill="#ff0000"/>
    <ellipse cx="240" cy="138" rx="5" ry="3" fill="#228b22"/>
    <text x="195" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Tomato</text>
    
    <!-- Cucumber -->
    <rect x="165" y="190" width="20" height="8" fill="#90ee90" rx="2"/>
    <line x1="165" y1="194" x2="185" y2="194" stroke="#228b22" stroke-width="1"/>
    <text x="195" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Cucumber</text>
  </g>
  
  <!-- Категория: Drinks -->
  <g id="drinks">
    <rect x="260" y="100" width="110" height="140" fill="#e6f3ff" stroke="#1e90ff" stroke-width="2" rx="5"/>
    <text x="315" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000080">Drinks</text>
    
    <!-- Glass of water -->
    <path d="M 280 145 L 285 170 L 295 170 L 300 145 Z" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
    <ellipse cx="290" cy="145" rx="10" ry="2" fill="#4682b4"/>
    <text x="315" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Water</text>
    
    <!-- Coffee cup -->
    <path d="M 330 150 L 335 170 L 345 170 L 350 150 Z" fill="#8b4513"/>
    <ellipse cx="340" cy="150" rx="10" ry="2" fill="#654321"/>
    <path d="M 350 155 Q 360 155, 360 165 Q 360 175, 350 170" fill="none" stroke="#8b4513" stroke-width="2"/>
    <text x="315" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Coffee</text>
    
    <!-- Juice -->
    <circle cx="290" cy="205" r="10" fill="#ff6347"/>
    <rect x="285" y="205" width="10" height="3" fill="#8b4513"/>
    <text x="315" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Juice</text>
  </g>
  
  <!-- Категория: Meals -->
  <g id="meals">
    <rect x="380" y="100" width="110" height="140" fill="#fff8dc" stroke="#daa520" stroke-width="2" rx="5"/>
    <text x="435" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b8860b">Meals</text>
    
    <!-- Bread -->
    <rect x="395" y="140" width="30" height="15" fill="#daa520" rx="2"/>
    <text x="435" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Bread</text>
    
    <!-- Cheese -->
    <rect x="415" y="165" width="20" height="15" fill="#ffd700" rx="2"/>
    <circle cx="420" cy="172" r="2" fill="#ff8c00"/>
    <circle cx="430" cy="172" r="2" fill="#ff8c00"/>
    <text x="435" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Cheese</text>
    
    <!-- Egg -->
    <ellipse cx="420" cy="215" rx="10" ry="12" fill="white" stroke="#ddd" stroke-width="1"/>
    <ellipse cx="420" cy="210" rx="8" ry="8" fill="#fffacd"/>
    <text x="435" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Egg</text>
  </g>
  
  <!-- Вопросы для обсуждения -->
  <g id="questions">
    <rect x="20" y="260" width="460" height="80" fill="#f5f5dc" stroke="#8b7355" stroke-width="2" rx="5"/>
    <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b4513">Questions for discussion:</text>
    
    <text x="30" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333">1. What is your favorite food?</text>
    <text x="30" y="315" font-family="Arial, sans-serif" font-size="12" fill="#333">2. Do you like vegetables?</text>
    <text x="30" y="330" font-family="Arial, sans-serif" font-size="12" fill="#333">3. What drink do you prefer?</text>
    
    <text x="250" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333">4. Do you eat fruit every day?</text>
    <text x="250" y="315" font-family="Arial, sans-serif" font-size="12" fill="#333">5. What is your favorite meal?</text>
    <text x="250" y="330" font-family="Arial, sans-serif" font-size="12" fill="#333">6. Do you like healthy food?</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Fork -->
  <g id="fork">
    <rect x="30" y="85" width="3" height="20" fill="#c0c0c0"/>
    <rect x="25" y="80" width="16" height="3" fill="#c0c0c0"/>
    <rect x="25" y="80" width="3" height="10" fill="#c0c0c0"/>
    <rect x="31" y="80" width="3" height="10" fill="#c0c0c0"/>
    <rect x="37" y="80" width="3" height="10" fill="#c0c0c0"/>
  </g>
  
  <!-- Knife -->
  <g id="knife">
    <rect x="460" y="85" width="3" height="20" fill="#c0c0c0"/>
    <rect x="457" y="80" width="9" height="8" fill="#c0c0c0" rx="1"/>
  </g>
  
  <!-- Spoon -->
  <g id="spoon">
    <rect x="430" y="85" width="3" height="20" fill="#c0c0c0"/>
    <ellipse cx="431" cy="78" rx="8" ry="6" fill="#c0c0c0"/>
  </g>
</svg>