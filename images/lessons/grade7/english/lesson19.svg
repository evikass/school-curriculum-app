<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f0f4f8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="500" height="60" fill="#2c3e50"/>
  <text x="250" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">АНГЛИЙСКИЙ · 7 КЛАСС</text>
  
  <!-- Title -->
  <text x="250" y="90" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Lesson 19. Reading</text>
  <text x="250" y="110" text-anchor="middle" fill="#34495e" font-family="Arial, sans-serif" font-size="16">British and American culture</text>
  
  <!-- UK Flag -->
  <g transform="translate(50, 140)">
    <rect width="80" height="60" fill="#1e3a8a" stroke="#333" stroke-width="2"/>
    <path d="M0,30 L80,30 M40,0 L40,60" stroke="white" stroke-width="8"/>
    <path d="M0,30 L80,30 M40,0 L40,60" stroke="#c41e3a" stroke-width="4"/>
    <path d="M20,15 L60,45 M60,15 L20,45" stroke="white" stroke-width="12"/>
    <path d="M20,15 L60,45 M60,15 L20,45" stroke="#c41e3a" stroke-width="6"/>
    <text x="40" y="75" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Great Britain</text>
  </g>
  
  <!-- US Flag -->
  <g transform="translate(170, 140)">
    <rect width="80" height="60" fill="#1e3a8a" stroke="#333" stroke-width="2"/>
    <rect width="80" height="4" fill="white"/>
    <rect y="8" width="80" height="4" fill="white"/>
    <rect y="16" width="80" height="4" fill="white"/>
    <rect y="24" width="80" height="4" fill="white"/>
    <rect y="32" width="80" height="4" fill="white"/>
    <rect y="40" width="80" height="4" fill="white"/>
    <rect y="48" width="80" height="4" fill="white"/>
    <rect y="56" width="80" height="4" fill="white"/>
    <rect width="32" height="24" fill="#c41e3a"/>
    <text x="40" y="75" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">USA</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(280, 130)">
    <rect width="200" height="140" fill="white" stroke="#ddd" stroke-width="2" rx="5"/>
    <rect width="200" height="30" fill="#3498db" rx="5 5 0 0"/>
    <text x="100" y="20" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Cultural Differences</text>
    
    <!-- Row 1 -->
    <text x="10" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">Language</text>
    <text x="100" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">British vs American</text>
    
    <!-- Row 2 -->
    <text x="10" y="70" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">Transport</text>
    <text x="100" y="70" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Underground vs Subway</text>
    
    <!-- Row 3 -->
    <text x="10" y="90" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">Money</text>
    <text x="100" y="90" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Pounds vs Dollars</text>
    
    <!-- Row 4 -->
    <text x="10" y="110" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">Food</text>
    <text x="100" y="110" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Chips vs Fries</text>
    
    <!-- Row 5 -->
    <text x="10" y="130" fill="#2c3e50" font-family="Arial, sans-serif" font-size="11">Holidays</text>
    <text x="100" y="130" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Holiday vs Vacation</text>
  </g>
  
  <!-- Icons and Labels -->
  <!-- Tea icon -->
  <g transform="translate(30, 220)">
    <ellipse cx="20" cy="15" rx="18" ry="12" fill="#8b4513" stroke="#654321" stroke-width="1"/>
    <path d="M20,15 L20,25" stroke="#654321" stroke-width="2"/>
    <path d="M15,20 Q20,18 25,20" stroke="#654321" stroke-width="2" fill="none"/>
    <text x="20" y="45" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Tea Time</text>
  </g>
  
  <!-- Coffee cup icon -->
  <g transform="translate(100, 220)">
    <path d="M10,10 L10,25 Q10,30 15,30 L25,30 Q30,30 30,25 L30,10" fill="#d2691e" stroke="#8b4513" stroke-width="1"/>
    <path d="M30,15 Q35,15 35,20 Q35,25 30,25" fill="none" stroke="#8b4513" stroke-width="1"/>
    <path d="M12,12 L28,12" stroke="#fff" stroke-width="1"/>
    <text x="20" y="45" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Coffee Break</text>
  </g>
  
  <!-- Big Ben -->
  <g transform="translate(170, 220)">
    <rect x="15" y="5" width="10" height="20" fill="#708090" stroke="#333" stroke-width="1"/>
    <rect x="10" y="0" width="20" height="8" fill="#696969"/>
    <circle cx="20" cy="4" r="2" fill="#fff"/>
    <text x="20" y="40" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Big Ben</text>
  </g>
  
  <!-- Statue of Liberty -->
  <g transform="translate(240, 220)">
    <path d="M20,30 L20,15 L18,15 L18,10 L22,10 L22,15 L20,15" fill="#4169e1" stroke="#333" stroke-width="1"/>
    <circle cx="20" cy="8" r="3" fill="#4169e1" stroke="#333" stroke-width="1"/>
    <path d="M20,5 Q15,0 10,5" fill="none" stroke="#333" stroke-width="1"/>
    <rect x="8" y="30" width="24" height="5" fill="#696969"/>
    <text x="20" y="45" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Statue of Liberty</text>
  </g>
  
  <!-- Double-decker bus -->
  <g transform="translate(320, 220)">
    <rect x="10" y="15" width="30" height="15" fill="#dc143c" stroke="#333" stroke-width="1"/>
    <rect x="10" y="5" width="30" height="10" fill="#dc143c" stroke="#333" stroke-width="1"/>
    <rect x="15" y="8" width="8" height="4" fill="#87ceeb"/>
    <rect x="27" y="8" width="8" height="4" fill="#87ceeb"/>
    <circle cx="15" cy="30" r="3" fill="#333"/>
    <circle cx="35" cy="30" r="3" fill="#333"/>
    <text x="25" y="45" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Double-decker</text>
  </g>
  
  <!-- Yellow cab -->
  <g transform="translate(380, 220)">
    <path d="M10,20 L10,28 L35,28 L35,20 L30,15 L15,15 Z" fill="#ffd700" stroke="#333" stroke-width="1"/>
    <rect x="18" y="10" width="9" height="5" fill="#87ceeb"/>
    <circle cx="17" cy="30" r="2" fill="#333"/>
    <circle cx="28" cy="30" r="2" fill="#333"/>
    <text x="22" y="45" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="10">Yellow Cab</text>
  </g>
  
  <!-- Labels section -->
  <text x="50" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">British Culture:</text>
  <text x="50" y="305" fill="#34495e" font-family="Arial, sans-serif" font-size="10">• Traditional • Polite • Royal Family</text>
  <text x="50" y="320" fill="#34495e" font-family="Arial, sans-serif" font-size="10">• Football • Tea • Weather</text>
  
  <text x="250" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">American Culture:</text>
  <text x="250" y="305" fill="#34495e" font-family="Arial, sans-serif" font-size="10">• Diverse • Informal • Fast-paced</text>
  <text x="250" y="320" fill="#34495e" font-family="Arial, sans-serif" font-size="10">• Baseball • Coffee • Innovation</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="3" fill="#3498db"/>
  <circle cx="470" cy="50" r="3" fill="#3498db"/>
  <circle cx="30" cy="330" r="3" fill="#3498db"/>
  <circle cx="470" cy="330" r="3" fill="#3498db"/>
  
  <!-- Arrow pointing to UK -->
  <path d="M150,170 L150,190" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow pointing to US -->
  <path d="M270,170 L270,190" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>