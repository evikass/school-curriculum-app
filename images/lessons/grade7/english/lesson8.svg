<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="500" height="350" fill="#f0f8ff"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    АНГЛИЙСКИЙ · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">
    Урок 8. Shopping and money
  </text>
  
  <!-- Магазин -->
  <g id="shop">
    <rect x="50" y="80" width="120" height="100" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="50" y="70" width="120" height="20" fill="#c0392b"/>
    <text x="110" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">SHOP</text>
    <rect x="65" y="110" width="25" height="25" fill="#3498db"/>
    <rect x="100" y="110" width="25" height="25" fill="#2ecc71"/>
    <rect x="135" y="110" width="25" height="25" fill="#f39c12"/>
    <circle cx="77" cy="122" r="3" fill="white"/>
    <circle cx="112" cy="122" r="3" fill="white"/>
    <circle cx="147" cy="122" r="3" fill="white"/>
  </g>
  
  <!-- Денежные купюры -->
  <g id="money">
    <rect x="200" y="90" width="40" height="25" fill="#27ae60" stroke="#229954" stroke-width="1" rx="2"/>
    <text x="220" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$10</text>
    <rect x="245" y="90" width="40" height="25" fill="#27ae60" stroke="#229954" stroke-width="1" rx="2"/>
    <text x="265" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$20</text>
    <rect x="290" y="90" width="40" height="25" fill="#27ae60" stroke="#229954" stroke-width="1" rx="2"/>
    <text x="310" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$50</text>
    
    <rect x="200" y="120" width="40" height="25" fill="#f39c12" stroke="#d68910" stroke-width="1" rx="2"/>
    <text x="220" y="137" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$1</text>
    <rect x="245" y="120" width="40" height="25" fill="#f39c12" stroke="#d68910" stroke-width="1" rx="2"/>
    <text x="265" y="137" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$5</text>
    <rect x="290" y="120" width="40" height="25" fill="#f39c12" stroke="#d68910" stroke-width="1" rx="2"/>
    <text x="310" y="137" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$10</text>
  </g>
  
  <!-- Монеты -->
  <g id="coins">
    <circle cx="350" cy="102" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="350" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">¢1</text>
    <circle cx="380" cy="102" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="380" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">¢5</text>
    <circle cx="410" cy="102" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="410" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="white">¢10</text>
    
    <circle cx="350" cy="135" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="350" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">¢25</text>
    <circle cx="380" cy="135" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="380" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">¢50</text>
    <circle cx="410" cy="135" r="12" fill="#d4af37" stroke="#b7950b" stroke-width="1"/>
    <text x="410" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="white">$1</text>
  </g>
  
  <!-- Корзина для покупок -->
  <g id="basket">
    <path d="M 70 200 L 80 240 L 160 240 L 170 200 Z" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    <rect x="85" y="195" width="70" height="10" fill="#a0522d" stroke="#8b4513" stroke-width="1"/>
    <line x1="95" y1="195" x2="95" y2="180" stroke="#654321" stroke-width="3"/>
    <line x1="145" y1="195" x2="145" y2="180" stroke="#654321" stroke-width="3"/>
    <circle cx="120" cy="220" r="3" fill="#654321"/>
    <circle cx="120" cy="230" r="3" fill="#654321"/>
  </g>
  
  <!-- Товары в корзине -->
  <g id="items">
    <rect x="75" y="210" width="20" height="15" fill="#e74c3c"/>
    <rect x="100" y="210" width="20" height="15" fill="#3498db"/>
    <rect x="125" y="210" width="20" height="15" fill="#2ecc71"/>
    <rect x="150" y="210" width="15" height="15" fill="#f39c12"/>
  </g>
  
  <!-- Касса -->
  <g id="cashier">
    <rect x="250" y="200" width="80" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <rect x="260" y="210" width="60" height="30" fill="#2c3e50"/>
    <rect x="275" y="215" width="20" height="20" fill="#3498db"/>
    <rect x="305" y="215" width="10" height="20" fill="#e74c3c"/>
    <text x="290" y="265" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">CASHIER</text>
  </g>
  
  <!-- Чек -->
  <g id="receipt">
    <rect x="350" y="200" width="60" height="80" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="210" x2="400" y2="210" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="220" x2="395" y2="220" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="230" x2="400" y2="230" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="240" x2="385" y2="240" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="250" x2="395" y2="250" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="260" x2="400" y2="260" stroke="#95a5a6" stroke-width="1"/>
    <text x="380" y="275" text-anchor="middle" font-family="Arial" font-size="8" fill="#7f8c8d">$45.50</text>
  </g>
  
  <!-- Этикетки с ценами -->
  <g id="price-tags">
    <rect x="65" y="185" width="30" height="20" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <text x="80" y="198" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">$5.99</text>
    <rect x="100" y="185" width="30" height="20" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <text x="115" y="198" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">$3.49</text>
    <rect x="135" y="185" width="30" height="20" fill="white" stroke="#95a5a6" stroke-width="1"/>
    <text x="150" y="198" text-anchor="middle" font-family="Arial" font-size="9" fill="#2c3e50">$8.99</text>
  </g>
  
  <!-- Сумма денег -->
  <g id="total-money">
    <rect x="50" y="280" width="120" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="110" y="298" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Total: $50.00</text>
    <text x="110" y="312" text-anchor="middle" font-family="Arial" font-size="10" fill="#27ae60">Paid</text>
  </g>
  
  <!-- Список покупок -->
  <g id="shopping-list">
    <rect x="200" y="280" width="150" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="275" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Shopping List:</text>
    <text x="210" y="308" font-family="Arial" font-size="9" fill="#7f8c8d">• Milk • Bread • Eggs</text>
    <text x="210" y="318" font-family="Arial" font-size="9" fill="#7f8c8d">• Apples • Cheese</text>
  </g>
  
  <!-- Карта оплаты -->
  <g id="credit-card">
    <rect x="370" y="290" width="100" height="35" fill="#2980b9" stroke="#21618c" stroke-width="1" rx="3"/>
    <rect x="375" y="295" width="90" height="20" fill="#3498db"/>
    <rect x="375" y="315" width="60" height="5" fill="#ecf0f1"/>
    <text x="420" y="308" text-anchor="middle" font-family="Arial" font-size="10" fill="white">**** **** **** 1234</text>
    <text x="420" y="330" text-anchor="middle" font-family="Arial" font-size="8" fill="#7f8c8d">Credit Card</text>
  </g>
  
  <!-- Стрелки и обозначения -->
  <g id="arrows">
    <path d="M 180 120 L 210 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 340 120 L 370 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 190 240 L 250 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 330 225 L 350 225" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 290 280 L 370 280" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Определения -->
  <g id="definitions">
    <text x="50" y="340" font-family="Arial" font-size="10" fill="#7f8c8d">Price: $ - dollar, ¢ - cent</text>
    <text x="200" y="340" font-family="Arial" font-size="10" fill="#7f8c8d">Currency: USD (US Dollar)</text>
    <text x="350" y="340" font-family="Arial" font-size="10" fill="#7f8c8d">Payment: Cash/Card</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <g id="decorations">
    <circle cx="30" cy="30" r="3" fill="#3498db"/>
    <circle cx="470" cy="30" r="3" fill="#e74c3c"/>
    <circle cx="30" cy="320" r="3" fill="#2ecc71"/>
    <circle cx="470" cy="320" r="3" fill="#f39c12"/>
    <rect x="180" y="200" width="2" height="40" fill="#95a5a6"/>
    <rect x="340" y="200" width="2" height="80" fill="#95a5a6"/>
  </g>
  
  <!-- Маркер стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>