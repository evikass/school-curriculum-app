<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.2" />
    </linearGradient>
    
    <linearGradient id="graphGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.2" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <rect x="0" y="0" width="500" height="60" fill="url(#headerGrad)"/>
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Название урока -->
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Урок 17. Умножение одночленов</text>
  
  <!-- Тема -->
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Тема: Умножение, возведение в степень</text>
  
  <!-- Система координат -->
  <g transform="translate(50, 180)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="180" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#475569" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="180,0 175,-3 175,3" fill="#475569"/>
    <polygon points="0,-120 -3,-115 3,-115" fill="#475569"/>
    
    <!-- Ось X -->
    <text x="185" y="5" font-family="Arial, sans-serif" font-size="12" fill="#475569">x</text>
    
    <!-- Ось Y -->
    <text x="5" y="-125" font-family="Arial, sans-serif" font-size="12" fill="#475569">y</text>
    
    <!-- Деления -->
    <line x1="30" y1="-2" x2="30" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="60" y1="-2" x2="60" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="90" y1="-2" x2="90" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="120" y1="-2" x2="120" y2="2" stroke="#475569" stroke-width="1"/>
    <line x1="150" y1="-2" x2="150" y2="2" stroke="#475569" stroke-width="1"/>
    
    <!-- График функции y = x² -->
    <path d="M 0,0 Q 30,-30 60,-60 T 120,-100 150,-110 180,-118" 
          fill="none" stroke="url(#graphGrad1)" stroke-width="3"/>
    <path d="M 0,0 Q 30,-30 60,-60 T 120,-100 150,-110 180,-118 L 180,0 Z" 
          fill="url(#graphGrad1)" opacity="0.3"/>
  </g>
  
  <!-- График функции y = x³ -->
  <g transform="translate(280, 180)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="170" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#475569" stroke-width="2"/>
    
    <!-- График -->
    <path d="M 0,0 Q 30,-20 60,-40 T 120,-80 150,-100 170,-115" 
          fill="none" stroke="url(#graphGrad2)" stroke-width="3"/>
    <path d="M 0,0 Q 30,-20 60,-40 T 120,-80 150,-100 170,-115 L 170,0 Z" 
          fill="url(#graphGrad2)" opacity="0.3"/>
  </g>
  
  <!-- Формулы -->
  <g transform="translate(50, 320)">
    <!-- Основное свойство умножения -->
    <rect x="0" y="-20" width="200" height="35" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="100" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">
      aᵐ · aⁿ = aᵐ⁺ⁿ
    </text>
    <text x="100" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">основное свойство</text>
  </g>
  
  <g transform="translate(270, 320)">
    <!-- Возведение в степень -->
    <rect x="0" y="-20" width="200" height="35" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="100" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">
      (aᵐ)ⁿ = aᵐⁿ
    </text>
    <text x="100" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">возведение в степень</text>
  </g>
  
  <!-- Примеры -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="140" height="25" rx="3" fill="#dbeafe"/>
    <text x="70" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">Пример 1</text>
  </g>
  
  <g transform="translate(180, 140)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#334155">2x³ · 3x² =</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="13" fill="#334155">(2·3)·(x³·x²) =</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="13" fill="#334155">6·x³⁺² = 6x⁵</text>
  </g>
  
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="140" height="25" rx="3" fill="#d1fae5"/>
    <text x="70" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#065f46">Пример 2</text>
  </g>
  
  <g transform="translate(410, 140)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#334155">(a²)³ =</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="13" fill="#334155">a²·³ = a⁶</text>
  </g>
  
  <!-- Легенда графиков -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="15" height="3" fill="#3b82f6"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="11" fill="#475569">y = x²</text>
  </g>
  
  <g transform="translate(280, 250)">
    <rect x="0" y="0" width="15" height="3" fill="#10b981"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="11" fill="#475569">y = x³</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="25" cy="25" r="3" fill="white" opacity="0.5"/>
  <circle cx="475" cy="25" r="3" fill="white" opacity="0.5"/>
  <circle cx="25" cy="325" r="3" fill="white" opacity="0.5"/>
  <circle cx="475" cy="325" r="3" fill="white" opacity="0.5"/>
  
  <!-- Разделители -->
  <line x1="20" y1="120" x2="480" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="310" x2="480" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Подписи к осям -->
  <text x="80" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
  <text x="110" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">2</text>
  <text x="140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">3</text>
  <text x="170" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">4</text>
  
  <text x="330" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">1</text>
  <text x="360" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">2</text>
  <text x="390" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">3</text>
  <text x="420" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">4</text>
  
  <!-- Учебные цели -->
  <g transform="translate(30, 70)">
    <text font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      <tspan x="0" dy="0">• научиться умножать одночлены</tspan>
      <tspan x="0" dy="15">• изучить свойства степеней</tspan>
      <tspan x="0" dy="15">• применять правила возведения в степень</tspan>
    </text>
  </g>
</svg>