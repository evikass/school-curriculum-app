<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Урок 23 -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#7F8C8D">
    Урок 23. Разность квадратов
  </text>
  
  <!-- Система координат -->
  <g transform="translate(50, 150)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#34495E" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#34495E" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="400,0 395,-3 395,3" fill="#34495E"/>
    <polygon points="0,-100 -3,-95 3,-95" fill="#34495E"/>
    
    <!-- Деления -->
    <line x1="50" y1="-2" x2="50" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="100" y1="-2" x2="100" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="150" y1="-2" x2="150" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="200" y1="-2" x2="200" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="250" y1="-2" x2="250" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="300" y1="-2" x2="300" y2="2" stroke="#34495E" stroke-width="1"/>
    <line x1="350" y1="-2" x2="350" y2="2" stroke="#34495E" stroke-width="1"/>
    
    <line x1="-2" y1="-50" x2="2" y2="-50" stroke="#34495E" stroke-width="1"/>
    <line x1="-2" y1="-100" x2="2" y2="-100" stroke="#34495E" stroke-width="1"/>
    
    <!-- Подписи осей -->
    <text x="395" y="20" font-family="Arial, sans-serif" font-size="14" fill="#34495E">x</text>
    <text x="10" y="-105" font-family="Arial, sans-serif" font-size="14" fill="#34495E">y</text>
    
    <!-- График функции y = x² -->
    <path d="M 0,0 Q 50,-12.5 100,-50 T 200,-200 T 300,-450 T 400,-800" 
          stroke="none" fill="none"/>
    
    <!-- Более точный график квадратичной функции -->
    <path d="M 0,0 
             L 20,-4 L 40,-16 L 60,-36 L 80,-64 L 100,-100
             L 120,-144 L 140,-196 L 160,-256 L 180,-324 L 200,-400"
          stroke="none" fill="none" stroke-width="3" fill="none"/>
    
    <!-- Квадратичные точки -->
    <circle cx="0" cy="0" r="3" fill="#3498DB"/>
    <circle cx="50" cy="-12.5" r="3" fill="#3498DB"/>
    <circle cx="100" cy="-50" r="3" fill="#3498DB"/>
    <circle cx="150" cy="-112.5" r="3" fill="#3498DB"/>
    <circle cx="200" cy="-200" r="3" fill="#3498DB"/>
    <circle cx="250" cy="-312.5" r="3" fill="#3498DB"/>
    <circle cx="300" cy="-450" r="3" fill="#3498DB"/>
    
    <!-- Подписи координат -->
    <text x="45" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">1</text>
    <text x="95" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">2</text>
    <text x="145" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">3</text>
    <text x="195" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">4</text>
    <text x="245" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">5</text>
    <text x="295" y="15" font-family="Arial, sans-serif" font-size="12" fill="#34495E">6</text>
    
    <text x="-10" y="-45" font-family="Arial, sans-serif" font-size="12" fill="#34495E">1</text>
    <text x="-10" y="-95" font-family="Arial, sans-serif" font-size="12" fill="#34495E">2</text>
    
    <!-- Функция y = x² -->
    <text x="320" y="-280" font-family="Arial, sans-serif" font-size="16" fill="#3498DB" font-weight="bold">
      y = x²
    </text>
  </g>
  
  <!-- Формула разности квадратов -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="400" height="50" fill="url(#blueGrad)" rx="10" filter="url(#shadow)"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">
      a² - b² = (a - b)(a + b)
    </text>
  </g>
  
  <!-- Примеры -->
  <g transform="translate(50, 260)">
    <!-- Пример 1 -->
    <rect x="0" y="0" width="180" height="70" fill="url(#greenGrad)" rx="5" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Пример 1:
    </text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
      25x² - 16 = (5x)² - 4²
    </text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
      = (5x - 4)(5x + 4)
    </text>
  </g>
  
  <!-- Пример 2 -->
  <g transform="translate(250, 260)">
    <rect x="0" y="0" width="200" height="70" fill="url(#redGrad)" rx="5" filter="url(#shadow)"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Пример 2:
    </text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
      9a² - 49b² = (3a)² - (7b)²
    </text>
    <text x="100" y="62" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
      = (3a - 7b)(3a + 7b)
    </text>
  </g>
  
  <!-- Иллюстрация геометрического смысла -->
  <g transform="translate(30, 140)">
    <!-- Большой квадрат -->
    <rect x="250" y="-50" width="100" height="100" fill="none" stroke="url(#purpleGrad)" stroke-width="2"/>
    <rect x="250" y="-50" width="100" height="100" fill="url(#purpleGrad)" opacity="0.1"/>
    
    <!-- Маленький квадрат -->
    <rect x="300" y="-50" width="50" height="50" fill="white" stroke="url(#purpleGrad)" stroke-width="2"/>
    
    <!-- Выделенная область L-образная -->
    <rect x="250" y="0" width="50" height="50" fill="url(#purpleGrad)" opacity="0.3"/>
    <rect x="300" y="-50" width="50" height="50" fill="url(#purpleGrad)" opacity="0.3"/>
    
    <!-- Подписи -->
    <text x="300" y="-55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8E44AD">a</text>
    <text x="355" y="-25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8E44AD">b</text>
    <text x="275" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8E44AD">a-b</text>
    <text x="325" y="-75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8E44AD">a-b</text>
    
    <!-- Стрелки -->
    <path d="M 250,-25 L 240,-25" stroke="#8E44AD" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 325,-100 L 325,-110" stroke="#8E44AD" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Область разности квадратов -->
    <text x="325" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD" font-weight="bold">
      a² - b²
    </text>
  </g>
  
  <!-- Дополнительные элементы -->
  <!-- Знак равенства -->
  <text x="225" y="140" font-family="Arial, sans-serif" font-size="20" fill="#34495E" font-weight="bold">=</text>
  
  <!-- Скобки -->
  <text x="235" y="140" font-family="Arial, sans-serif" font-size="24" fill="#34495E">(</text>
  <text x="275" y="140" font-family="Arial, sans-serif" font-size="24" fill="#34495E">)</text>
  
  <!-- Минус и плюс -->
  <text x="250" y="155" font-family="Arial, sans-serif" font-size="18" fill="#34495E">−</text>
  <text x="290" y="155" font-family="Arial, sans-serif" font-size="18" fill="#34495E">+</text>
  
  <!-- Пояснения -->
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">
    Разность квадратов равна произведению разности и суммы оснований
  </text>
  
  <!-- Декоративные элементы -->
  <circle cx="460" cy="30" r="15" fill="url(#blueGrad)" opacity="0.3"/>
  <circle cx="40" cy="320" r="10" fill="url(#greenGrad)" opacity="0.3"/>
  <circle cx="470" cy="330" r="8" fill="url(#redGrad)" opacity="0.3"/>
  
  <!-- Пунктирная линия для визуального разделения -->
  <line x1="50" y1="250" x2="450" y2="250" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="5,5"/>
</svg>