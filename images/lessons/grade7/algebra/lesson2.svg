<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="#F8F9FA"/>
  
  <!-- Заголовок -->
  <rect x="20" y="20" width="460" height="50" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">АЛГЕБРА · 7 КЛАСС</text>
  
  <!-- Урок -->
  <rect x="350" y="30" width="120" height="30" rx="5" fill="url(#greenGrad)"/>
  <text x="410" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Урок 2</text>
  
  <!-- Основная тема -->
  <rect x="30" y="90" width="440" height="30" rx="5" fill="#E8F4FD" stroke="#4A90E2" stroke-width="1"/>
  <text x="250" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Выражения с переменными</text>
  
  <!-- Система координат -->
  <g transform="translate(50, 150)">
    <!-- Ось X -->
    <line x1="0" y1="150" x2="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowX)"/>
    <text x="210" y="155" font-family="Arial" font-size="14" fill="#333">x</text>
    
    <!-- Ось Y -->
    <line x1="100" y1="200" x2="100" y2="0" stroke="#333" stroke-width="2" marker-end="url(#arrowY)"/>
    <text x="105" y="10" font-family="Arial" font-size="14" fill="#333">y</text>
    
    <!-- Стрелки -->
    <defs>
      <marker id="arrowX" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
      </marker>
      <marker id="arrowY" markerWidth="10" markerHeight="10" refX="3" refY="0" orient="auto" markerUnits="strokeWidth">
        <path d="M0,9 L6,9 L3,0 z" fill="#333"/>
      </marker>
    </defs>
    
    <!-- Шкалы -->
    <text x="95" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">0</text>
    <text x="145" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">1</text>
    <text x="190" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">2</text>
    <text x="50" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">-1</text>
    
    <!-- График функции y = x² -->
    <path d="M 20,190 Q 50,175 80,150 Q 100,130 120,100 Q 140,60 160,30" 
          stroke="url(#purpleGrad)" stroke-width="3" fill="none"/>
    
    <!-- График функции y = 2x -->
    <line x1="20" y1="140" x2="180" y2="50" stroke="url(#greenGrad)" stroke-width="3"/>
    
    <!-- Подписи функций -->
    <rect x="140" y="70" width="70" height="20" rx="3" fill="white" stroke="#9B59B6" stroke-width="1"/>
    <text x="175" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#9B59B6">y = x²</text>
    
    <rect x="140" y="90" width="70" height="20" rx="3" fill="white" stroke="#5CB85C" stroke-width="1"/>
    <text x="175" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#5CB85C">y = 2x</text>
  </g>
  
  <!-- Пример числового выражения -->
  <rect x="280" y="150" width="200" height="80" rx="10" fill="#FFF9E6" stroke="#F39C12" stroke-width="2"/>
  <text x="380" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#D68910">Числовое выражение</text>
  <text x="380" y="200" text-anchor="middle" font-family="Arial" font-size="18" fill="#333">3 × 5 + 7 - 2</text>
  <text x="380" y="220" text-anchor="middle" font-family="Arial" font-size="16" fill="#27AE60">= 20</text>
  
  <!-- Пример алгебраического выражения -->
  <rect x="280" y="245" width="200" height="80" rx="10" fill="#F0F8FF" stroke="#3498DB" stroke-width="2"/>
  <text x="380" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2980B9">Алгебраическое выражение</text>
  <text x="380" y="295" text-anchor="middle" font-family="Arial" font-size="18" fill="#333">2x + 3y - 5</text>
  <text x="380" y="315" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F8C8D">x,y ∈ ℝ</text>
  
  <!-- Переменные -->
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#F4E6FF" stroke="#9B59B6" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#8E44AD">Переменные</text>
    <text x="110" y="50" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">x, y, z, a, b, c</text>
    <text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F8C8D">допустимые значения</text>
  </g>
  
  <!-- Допустимые значения -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#E8F8F5" stroke="#16A085" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#138D75">Допустимые значения</text>
    <text x="110" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">x > 0</text>
    <text x="110" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">x ≠ 2</text>
  </g>
  
  <!-- Формула -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="180" height="25" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
    <text x="90" y="18" text-anchor="middle" font-family="Arial" font-size="14" fill="#C0392B">f(x) = ax² + bx + c</text>
  </g>
  
  <!-- Дополнительные элементы -->
  <circle cx="450" cy="320" r="15" fill="url(#purpleGrad)" opacity="0.3"/>
  <circle cx="470" cy="330" r="10" fill="url(#greenGrad)" opacity="0.3"/>
  <circle cx="440" cy="335" r="8" fill="url(#blueGrad)" opacity="0.3"/>
  
  <!-- Подписи на графике -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F8C8D">Графики функций с переменными</text>
</svg>