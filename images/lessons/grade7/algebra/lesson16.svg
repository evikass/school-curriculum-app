<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.2" />
    </linearGradient>
    
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a3aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фоновый градиент -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="url(#titleGrad)">
    АЛГЕБРА · 7 КЛАСС
  </text>
  
  <!-- Подзаголовок -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
    Урок 16. Одночлен. Стандартный вид
  </text>
  
  <!-- Система координат -->
  <g transform="translate(80, 200)">
    <!-- Оси -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#34495e" stroke-width="2"/>
    
    <!-- Стрелки -->
    <polygon points="200,0 195,-3 195,3" fill="#34495e"/>
    <polygon points="0,-120 -3,-115 3,-115" fill="#34495e"/>
    
    <!-- Метки осей -->
    <text x="205" y="5" font-family="Arial" font-size="14" fill="#2c3e50">x</text>
    <text x="-10" y="-125" font-family="Arial" font-size="14" fill="#2c3e50">y</text>
    
    <!-- Деления на оси X -->
    <g stroke="#7f8c8d" stroke-width="1">
      <line x1="50" y1="-3" x2="50" y2="3"/>
      <line x1="100" y1="-3" x2="100" y2="3"/>
      <line x1="150" y1="-3" x2="150" y2="3"/>
    </g>
    
    <!-- Деления на оси Y -->
    <g stroke="#7f8c8d" stroke-width="1">
      <line x1="-3" y1="-30" x2="3" y2="-30"/>
      <line x1="-3" y1="-60" x2="3" y2="-60"/>
      <line x1="-3" y1="-90" x2="3" y2="-90"/>
    </g>
    
    <!-- Метки чисел -->
    <text x="48" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">1</text>
    <text x="98" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">2</text>
    <text x="148" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">3</text>
    
    <text x="-15" y="-27" font-family="Arial" font-size="12" text-anchor="end" fill="#2c3e50">1</text>
    <text x="-15" y="-57" font-family="Arial" font-size="12" text-anchor="end" fill="#2c3e50">2</text>
    <text x="-15" y="-87" font-family="Arial" font-size="12" text-anchor="end" fill="#2c3e50">3</text>
    
    <!-- График функции y = 2x -->
    <polyline points="0,0 50,-60 100,-120 150,-180" fill="none" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- Точки на графике -->
    <circle cx="0" cy="0" r="4" fill="#c0392b"/>
    <circle cx="50" cy="-60" r="4" fill="#c0392b"/>
    <circle cx="100" cy="-120" r="4" fill="#c0392b"/>
    
    <!-- Надпись на графике -->
    <text x="160" y="-185" font-family="Arial" font-size="12" fill="#e74c3c">y = 2x</text>
  </g>
  
  <!-- Формулы и определения -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="160" height="180" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5" opacity="0.9"/>
    
    <text x="80" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Одночлен</text>
    
    <text x="10" y="50" font-family="Arial" font-size="12" fill="#34495e">Примеры:</text>
    <text x="10" y="70" font-family="Arial" font-size="12" fill="#2c3e50">5x²</text>
    <text x="10" y="90" font-family="Arial" font-size="12" fill="#2c3e50">-3xy</text>
    <text x="10" y="110" font-family="Arial" font-size="12" fill="#2c3e50">2abc³</text>
    
    <text x="10" y="135" font-family="Arial" font-size="12" fill="#34495e">Стандартный вид:</text>
    <text x="10" y="155" font-family="Arial" font-size="12" fill="#2c3e50">k·x^m·y^n·...</text>
  </g>
  
  <!-- График степени -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="150" height="100" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="75" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Степени переменных</text>
    
    <!-- Столбчатая диаграмма -->
    <rect x="20" y="60" width="20" height="30" fill="url(#barGrad)"/>
    <rect x="50" y="40" width="20" height="50" fill="url(#barGrad)"/>
    <rect x="80" y="20" width="20" height="70" fill="url(#barGrad)"/>
    <rect x="110" y="50" width="20" height="40" fill="url(#barGrad)"/>
    
    <text x="30" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">x⁰</text>
    <text x="60" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">x¹</text>
    <text x="90" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">x²</text>
    <text x="120" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">x³</text>
  </g>
  
  <!-- Примеры преобразований -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="160" height="60" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="80" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Примеры</text>
    <text x="10" y="40" font-family="Arial" font-size="11" fill="#2c3e50">3x·2x² = 6x³</text>
    <text x="10" y="55" font-family="Arial" font-size="11" fill="#2c3e50">(-2y)·(-5y²) = 10y³</text>
  </g>
  
  <!-- Свойства одночлена -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="200" height="80" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="100" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Свойства одночлена</text>
    
    <circle cx="20" cy="40" r="3" fill="#27ae60"/>
    <text x="30" y="45" font-family="Arial" font-size="11" fill="#2c3e50">Числовой коэффициент</text>
    
    <circle cx="20" cy="60" r="3" fill="#27ae60"/>
    <text x="30" y="65" font-family="Arial" font-size="11" fill="#2c3e50">Степень переменных</text>
  </g>
  
  <!-- Дополнительные элементы оформления -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="15" fill="url(#graphGrad)" opacity="0.6"/>
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" fill="#c0392b">x²</text>
  </g>
  
  <!-- Декоративные линии -->
  <line x1="30" y1="70" x2="30" y2="340" stroke="#ecf0f1" stroke-width="2"/>
  <line x1="470" y1="70" x2="470" y2="340" stroke="#ecf0f1" stroke-width="2"/>
  
  <!-- Вспомогательные формулы -->
  <g transform="translate(260, 320)">
    <text x="0" y="0" font-family="Arial" font-size="11" fill="#7f8c8d">k - коэффициент</text>
    <text x="0" y="15" font-family="Arial" font-size="11" fill="#7f8c8d">m, n - натуральные числа</text>
  </g>
</svg>