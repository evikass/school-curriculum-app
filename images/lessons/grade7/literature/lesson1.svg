<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="horseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#skyGrad)"/>
  
  <!-- Облака -->
  <ellipse cx="80" cy="50" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="95" cy="45" rx="30" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="110" cy="50" rx="25" ry="15" fill="white" opacity="0.8"/>
  
  <ellipse cx="350" cy="70" rx="20" ry="12" fill="white" opacity="0.7"/>
  <ellipse cx="365" cy="65" rx="25" ry="15" fill="white" opacity="0.7"/>
  <ellipse cx="380" cy="70" rx="20" ry="12" fill="white" opacity="0.7"/>
  
  <!-- Земля -->
  <rect x="0" y="250" width="500" height="100" fill="url(#groundGrad)"/>
  
  <!-- Деревья -->
  <g id="tree1">
    <rect x="30" y="200" width="20" height="50" fill="#654321"/>
    <circle cx="40" cy="190" r="35" fill="#228B22"/>
  </g>
  
  <g id="tree2">
    <rect x="420" y="210" width="15" height="40" fill="#654321"/>
    <circle cx="427" cy="200" r="30" fill="#228B22"/>
  </g>
  
  <!-- Илья Муромец на коне -->
  <g id="illya" transform="translate(200, 150)">
    <!-- Конь -->
    <g id="horse">
      <ellipse cx="0" cy="50" rx="40" ry="20" fill="url(#horseGrad)"/>
      <rect x="-5" y="20" width="10" height="30" fill="url(#horseGrad)"/>
      <rect x="-35" y="45" rx="5" ry="5" width="15" height="8" fill="url(#horseGrad)"/>
      <rect x="20" y="45" rx="5" ry="5" width="15" height="8" fill="url(#horseGrad)"/>
      <rect x="-35" y="25" rx="5" ry="5" width="15" height="8" fill="url(#horseGrad)"/>
      <rect x="20" y="25" rx="5" ry="5" width="15" height="8" fill="url(#horseGrad)"/>
      <path d="M-30 55 Q-30 65 -25 65" stroke="url(#horseGrad)" stroke-width="3" fill="none"/>
      <path d="M25 55 Q25 65 30 65" stroke="url(#horseGrad)" stroke-width="3" fill="none"/>
      <path d="M-30 35 Q-30 45 -25 45" stroke="url(#horseGrad)" stroke-width="3" fill="none"/>
      <path d="M25 35 Q25 45 30 45" stroke="url(#horseGrad)" stroke-width="3" fill="none"/>
    </g>
    
    <!-- Илья Муромец -->
    <g id="warrior">
      <!-- Туловище -->
      <rect x="-15" y="0" width="30" height="40" fill="url(#armorGrad)" filter="url(#shadow)"/>
      <!-- Наплечники -->
      <ellipse cx="-20" cy="10" rx="8" ry="15" fill="url(#armorGrad)"/>
      <ellipse cx="20" cy="10" rx="8" ry="15" fill="url(#armorGrad)"/>
      <!-- Шлем -->
      <path d="M-20 -10 Q0 -25 20 -10 L15 5 L-15 5 Z" fill="url(#armorGrad)" filter="url(#shadow)"/>
      <circle cx="0" cy="-10" r="8" fill="#FFD700"/>
      <!-- Щит -->
      <ellipse cx="-35" cy="15" rx="18" ry="25" fill="url(#shieldGrad)" filter="url(#shadow)"/>
      <path d="M-35 5 Q-35 15 -35 25 L-35 20 Q-35 15 -35 10" stroke="#8B4513" stroke-width="2" fill="none"/>
      <path d="M-35 20 L-45 15 L-35 10 L-25 15 Z" fill="#8B4513"/>
      <!-- Меч -->
      <rect x="20" y="-5" width="5" height="30" fill="#C0C0C0"/>
      <rect x="18" y="-8" width="9" height="6" fill="#808080"/>
      <!-- Лицо -->
      <circle cx="0" cy="-5" r="8" fill="#FDBCB4"/>
      <!-- Борода -->
      <path d="M-5 0 Q0 5 5 0" stroke="#8B4513" stroke-width="2" fill="none"/>
    </g>
  </g>
  
  <!-- Замок Киева -->
  <g id="kiev-castle" transform="translate(350, 180)">
    <rect x="0" y="0" width="100" height="70" fill="#8B4513"/>
    <rect x="10" y="10" width="80" height="50" fill="#654321"/>
    <rect x="30" y="-20" width="40" height="20" fill="#8B4513"/>
    <rect x="35" y="-25" width="30" height="5" fill="#654321"/>
    <!-- Башни -->
    <rect x="-10" y="0" width="20" height="60" fill="#8B4513"/>
    <rect x="90" y="0" width="20" height="60" fill="#8B4513"/>
    <rect x="-5" y="-25" width="10" height="25" fill="#654321"/>
    <rect x="95" y="-25" width="10" height="25" fill="#654321"/>
  </g>
  
  <!-- Текст заголовка -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    ЛИТЕРАТУРА · 7 КЛАСС
  </text>
  
  <!-- Подписи к уроку -->
  <text x="20" y="320" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Урок 1. Былины</text>
  <text x="150" y="320" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Киевский цикл</text>
  <text x="280" y="320" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Илья Муромец</text>
  
  <!-- Стилизованные элементы -->
  <g id="scroll" transform="translate(50, 280)">
    <rect x="0" y="0" width="80" height="60" fill="#F5DEB3" stroke="#8B4513" stroke-width="2"/>
    <path d="M5 10 Q5 5 10 5 L70 5 Q75 5 75 10 L75 50 Q75 55 70 55 L10 55 Q5 55 5 50" fill="none" stroke="#8B4513" stroke-width="1"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B4513">Былина</text>
  </g>
  
  <g id="sword-icon" transform="translate(420, 280)">
    <rect x="15" y="5" width="3" height="25" fill="#C0C0C0"/>
    <rect x="13" y="2" width="7" height="5" fill="#808080"/>
    <rect x="12" y="30" width="9" height="3" fill="#8B4513"/>
  </g>
  
  <!-- Узор -->
  <g id="pattern" transform="translate(200, 300)">
    <rect x="0" y="0" width="100" height="2" fill="#8B4513"/>
    <rect x="10" y="-5" width="2" height="12" fill="#8B4513"/>
    <rect x="30" y="-5" width="2" height="12" fill="#8B4513"/>
    <rect x="50" y="-5" width="2" height="12" fill="#8B4513"/>
    <rect x="70" y="-5" width="2" height="12" fill="#8B4513"/>
    <rect x="90" y="-5" width="2" height="12" fill="#8B4513"/>
  </g>
  
  <!-- Дополнительные элементы -->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Легенда</text>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Доблести</text>
  
  <text x="300" y="120" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Богатырь</text>
  <text x="300" y="135" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Защитник</text>
  
  <text x="130" y="100" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Киевская</text>
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Русь</text>
  
  <!-- Солнце -->
  <circle cx="450" cy="80" r="25" fill="#FFD700" opacity="0.8"/>
  <g stroke="#FFD700" stroke-width="2" opacity="0.6">
    <line x1="450" y1="40" x2="450" y2="30"/>
    <line x1="450" y1="130" x2="450" y2="120"/>
    <line x1="410" y1="80" x2="400" y2="80"/>
    <line x1="500" y1="80" x2="490" y2="80"/>
    <line x1="425" y1="55" x2="418" y2="48"/>
    <line x1="475" y1="105" x2="482" y2="112"/>
    <line x1="425" y1="105" x2="418" y2="112"/>
    <line x1="475" y1="55" x2="482" y2="48"/>
  </g>
  
  <!-- Птицы -->
  <g fill="#333" opacity="0.6">
    <path d="M150 80 Q155 75 160 80 Q155 78 150 80"/>
    <path d="M170 70 Q175 65 180 70 Q175 68 170 70"/>
    <path d="M190 85 Q195 80 200 85 Q195 83 190 85"/>
  </g>
  
  <!-- Дополнительные подписи -->
  <text x="250" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Киевский цикл</text>
  <text x="250" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">былин</text>
</svg>