<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="petalGrad">
      <stop offset="0%" style="stop-color:#ffb3ba;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8a95;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="centerGrad">
      <stop offset="0%" style="stop-color:#fff59d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81c784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Заголовок -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2e7d32">БИОЛОГИЯ · 7 КЛАСС</text>
  
  <!-- Основной цветок -->
  <!-- Стебель -->
  <rect x="240" y="180" width="20" height="120" fill="url(#stemGrad)" rx="10" />
  
  <!-- Листья -->
  <ellipse cx="210" cy="220" rx="30" ry="15" fill="url(#leafGrad)" transform="rotate(-30 210 220)" />
  <ellipse cx="290" cy="240" rx="30" ry="15" fill="url(#leafGrad)" transform="rotate(30 290 240)" />
  
  <!-- Чашелистики -->
  <ellipse cx="250" cy="160" rx="15" ry="25" fill="#81c784" transform="rotate(0 250 160)" />
  <ellipse cx="250" cy="160" rx="15" ry="25" fill="#81c784" transform="rotate(72 250 160)" />
  <ellipse cx="250" cy="160" rx="15" ry="25" fill="#81c784" transform="rotate(144 250 160)" />
  <ellipse cx="250" cy="160" rx="15" ry="25" fill="#81c784" transform="rotate(216 250 160)" />
  <ellipse cx="250" cy="160" rx="15" ry="25" fill="#81c784" transform="rotate(288 250 160)" />
  
  <!-- Лепестки -->
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(0 250 140)" />
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(60 250 140)" />
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(120 250 140)" />
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(180 250 140)" />
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(240 250 140)" />
  <ellipse cx="250" cy="140" rx="20" ry="35" fill="url(#petalGrad)" transform="rotate(300 250 140)" />
  
  <!-- Цветоложе -->
  <ellipse cx="250" cy="160" rx="30" ry="15" fill="#a5d6a7" />
  
  <!-- Тычинки -->
  <line x1="250" y1="160" x2="250" y2="145" stroke="#ffd54f" stroke-width="2" />
  <circle cx="250" cy="142" r="3" fill="#ff9800" />
  
  <line x1="250" y1="160" x2="262" y2="148" stroke="#ffd54f" stroke-width="2" />
  <circle cx="264" cy="146" r="3" fill="#ff9800" />
  
  <line x1="250" y1="160" x2="238" y2="148" stroke="#ffd54f" stroke-width="2" />
  <circle cx="236" cy="146" r="3" fill="#ff9800" />
  
  <!-- Пестик -->
  <ellipse cx="250" cy="165" rx="8" ry="12" fill="url(#centerGrad)" />
  <line x1="250" y1="165" x2="250" y2="155" stroke="#795548" stroke-width="2" />
  
  <!-- Подписи к цветку -->
  <text x="320" y="140" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Лепестки</text>
  <line x1="305" y1="140" x2="270" y2="140" stroke="#1b5e20" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <text x="320" y="160" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Чашелистики</text>
  <line x1="305" y1="160" x2="265" y2="160" stroke="#1b5e20" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Тычинки</text>
  <line x1="305" y1="180" x2="262" y2="170" stroke="#1b5e20" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <text x="320" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Пестик</text>
  <line x1="305" y1="200" x2="258" y2="170" stroke="#1b5e20" stroke-width="1" marker-end="url(#arrowhead)" />
  
  <!-- Стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1b5e20" />
    </marker>
  </defs>
  
  <!-- Второй цветок (обобщенный) -->
  <g transform="translate(100, 120)">
    <rect x="-10" y="40" width="20" height="60" fill="url(#stemGrad)" rx="10" />
    <ellipse cx="0" cy="30" rx="20" ry="10" fill="#a5d6a7" />
    <circle cx="0" cy="20" r="20" fill="url(#petalGrad)" />
    <circle cx="0" cy="20" r="8" fill="url(#centerGrad)" />
  </g>
  
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">Цветок</text>
  
  <!-- Плоды -->
  <!-- Яблоко -->
  <ellipse cx="400" cy="220" rx="25" ry="30" fill="#ff7043" />
  <rect x="397" y="190" width="6" height="15" fill="#4caf50" />
  <ellipse cx="400" cy="188" rx="8" ry="5" fill="#66bb6a" />
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1b5e20">Яблоко</text>
  
  <!-- Ягода -->
  <circle cx="400" cy="120" r="20" fill="#e53935" />
  <circle cx="390" cy="125" r="15" fill="#f44336" />
  <circle cx="410" cy="125" r="15" fill="#f44336" />
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1b5e20">Ягода</text>
  
  <!-- Костянка -->
  <ellipse cx="350" cy="220" rx="20" ry="25" fill="#ff5722" />
  <ellipse cx="350" cy="218" rx="8" ry="10" fill="#8d6e63" />
  <text x="350" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1b5e20">Костянка</text>
  
  <!-- Сухой плод -->
  <g transform="translate(350, 80)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#8d6e63" stroke="#6d4c41" stroke-width="1" />
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#6d4c41" stroke-width="1" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#6d4c41" stroke-width="1" />
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#6d4c41" stroke-width="1" />
  </g>
  <text x="350" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1b5e20">Семянка</text>
  
  <!-- Список классов покрытосеменных -->
  <rect x="20" y="270" width="460" height="70" fill="rgba(255,255,255,0.8)" rx="10" />
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">Классы покрытосеменных:</text>
  <text x="30" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">• Двудольные (бобовые, крестоцветные, сложноцветные)</text>
  <text x="30" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">• Однодольные (лилейные, злаки, орхидные)</text>
  
  <!-- Указатель на урок -->
  <text x="250" y="60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">Урок 8. Покрытосеменные</text>
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#388e3c">Цветок и плод</text>
  
  <!-- Дополнительные элементы -->
  <circle cx="50" cy="50" r="5" fill="#81c784" opacity="0.5" />
  <circle cx="450" cy="50" r="5" fill="#81c784" opacity="0.5" />
  <circle cx="50" cy="300" r="5" fill="#81c784" opacity="0.5" />
  <circle cx="450" cy="300" r="5" fill="#81c784" opacity="0.5" />
</svg>