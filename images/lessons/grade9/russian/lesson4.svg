<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Тень -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#1e3a8a" stroke-width="2" rx="5"/>
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#3b82f6" stroke-width="1" rx="3" stroke-dasharray="5,3"/>
  
  <!-- Заголовок класса -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Номер урока -->
  <text x="30" y="60" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" font-weight="bold">Урок 15</text>
  
  <!-- Заголовок темы -->
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="url(#titleGrad)" font-weight="bold">Виды придаточных предложений</text>
  
  <!-- Основное предложение -->
  <rect x="50" y="85" width="400" height="50" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Я прочитал книгу, которая мне очень понравилась.</text>
  <text x="250" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">где: что сделал? — прочитал (что?) — книгу</text>
  
  <!-- Стрелка к придаточному -->
  <path d="M 350 135 L 350 155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Придаточное предложение -->
  <rect x="250" y="160" width="200" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="350" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a" font-style="italic">которая мне очень понравилась</text>
  
  <!-- Маркер придаточного -->
  <circle cx="230" cy="180" r="8" fill="#3b82f6"/>
  <text x="230" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">П</text>
  
  <!-- Таблица видов придаточных -->
  <rect x="30" y="215" width="440" height="110" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
  
  <!-- Заголовок таблицы -->
  <text x="250" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Виды придаточных предложений</text>
  
  <!-- Столбцы таблицы -->
  <line x1="130" y1="240" x2="130" y2="315" stroke="#3b82f6" stroke-width="1"/>
  <line x1="280" y1="240" x2="280" y2="315" stroke="#3b82f6" stroke-width="1"/>
  <line x1="380" y1="240" x2="380" y2="315" stroke="#3b82f6" stroke-width="1"/>
  
  <!-- Строка 1 таблицы -->
  <text x="80" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">Определительные</text>
  <text x="205" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">Изъяснительные</text>
  <text x="330" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">Обстоятельственные</text>
  <text x="430" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" font-weight="bold">Знаки</text>
  
  <!-- Строка 2 таблицы -->
  <text x="80" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">отвечают на вопросы</text>
  <text x="205" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">отвечают на вопросы</text>
  <text x="330" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">отвечают на вопросы</text>
  <text x="430" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">— или ,</text>
  
  <!-- Строка 3 таблицы -->
  <text x="80" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">какой? какая? какое?</text>
  <text x="205" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">что? что делать?</text>
  <text x="330" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">где? когда? почему?</text>
  <text x="430" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">;</text>
  
  <!-- Строка 4 таблицы -->
  <text x="80" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">чей? чья? чьё?</text>
  <text x="205" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">как? откуда?</text>
  <text x="330" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">зачем? отчего?</text>
  <text x="430" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">:</text>
  
  <!-- Примеры придаточных -->
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">который</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">который</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">чей</text>
  
  <text x="160" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">что</text>
  <text x="160" y="290" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">чтобы</text>
  <text x="160" y="305" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">будто</text>
  
  <text x="290" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">где</text>
  <text x="290" y="290" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">когда</text>
  <text x="290" y="305" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">потому что</text>
  
  <!-- Стрелка маркера -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Декоративные элементы -->
  <circle cx="470" cy="30" r="5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="460" cy="40" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="30" cy="330" r="5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="40" cy="320" r="3" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Примеры предложений -->
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="9" fill="#64748b" font-style="italic">Девушка, которую я встретил вчера, была очень доброй.</text>
</svg>