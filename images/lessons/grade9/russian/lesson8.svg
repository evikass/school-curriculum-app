<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="part1Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="part2Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="part3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Декоративные элементы -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#3b82f6" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGradient)"/>
  <rect width="500" height="350" fill="url(#dots)"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#1e3a8a" stroke-width="2" rx="10" ry="10"/>
  <rect x="15" y="15" width="470" height="320" fill="none" stroke="#3b82f6" stroke-width="1" rx="8" ry="8" stroke-dasharray="5,3"/>
  
  <!-- Заголовок -->
  <rect x="50" y="30" width="400" height="40" rx="20" ry="20" fill="url(#headerGradient)"/>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  
  <!-- Основной заголовок -->
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Структура ОГЭ по русскому языку</text>
  
  <!-- Часть 1: Изложение -->
  <rect x="40" y="110" width="140" height="70" rx="8" ry="8" fill="url(#part1Gradient)"/>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Часть 1</text>
  <text x="110" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Изложение</text>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(150 слов)</text>
  
  <!-- Часть 2: Тест -->
  <rect x="200" y="110" width="140" height="70" rx="8" ry="8" fill="url(#part2Gradient)"/>
  <text x="270" y="130" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Часть 2</text>
  <text x="270" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Тест</text>
  <text x="270" y="170" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(15 заданий)</text>
  
  <!-- Часть 3: Сочинение -->
  <rect x="360" y="110" width="140" height="70" rx="8" ry="8" fill="url(#part3Gradient)"/>
  <text x="430" y="130" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Часть 3</text>
  <text x="430" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Сочинение</text>
  <text x="430" y="170" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">(150 слов)</text>
  
  <!-- Стрелки -->
  <path d="M 180 145 L 195 145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 340 145 L 355 145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Стрелки маркеры -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Критерии оценивания -->
  <rect x="40" y="200" width="460" height="80" rx="8" ry="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="50" y="220" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Критерии оценивания:</text>
  
  <!-- Критерии пункты -->
  <circle cx="60" cy="235" r="3" fill="#f59e0b"/>
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Содержание (соответствие теме, полнота раскрытия)</text>
  
  <circle cx="60" cy="250" r="3" fill="#10b981"/>
  <text x="70" y="255" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Речь (орфография, пунктуация, грамматика)</text>
  
  <circle cx="60" cy="265" r="3" fill="#8b5cf6"/>
  <text x="70" y="270" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Сочинение (композиция, стиль, аргументация)</text>
  
  <!-- Примеры заданий -->
  <rect x="40" y="300" width="460" height="40" rx="8" ry="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="50" y="315" font-family="Arial, sans-serif" font-size="11" fill="#92400e" font-weight="bold">Примеры заданий:</text>
  <text x="50" y="330" font-family="Arial, sans-serif" font-size="10" fill="#92400e">1. Найдите грамматическую основу в предложении: "Весна пришла, и природа проснулась."</text>
  <text x="50" y="342" font-family="Arial, sans-serif" font-size="10" fill="#92400e">2. Выпишите слово, в котором правописание суффикса определяется правилом: "Правописание суффиксов -чик, -щик"</text>
  
  <!-- Дополнительные элементы оформления -->
  <circle cx="460" cy="40" r="15" fill="#f59e0b" opacity="0.3"/>
  <circle cx="440" cy="50" r="10" fill="#10b981" opacity="0.3"/>
  <circle cx="470" cy="60" r="8" fill="#8b5cf6" opacity="0.3"/>
  
  <!-- Таблица баллов -->
  <rect x="200" y="185" width="100" height="12" rx="2" ry="2" fill="#e5e7eb"/>
  <text x="250" y="194" font-family="Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">Максимум 39 баллов</text>
  
  <!-- Значок времени -->
  <circle cx="440" cy="140" r="12" fill="#3b82f6" opacity="0.2"/>
  <path d="M 440 132 L 440 140 L 445 145" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <text x="440" y="160" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6" text-anchor="middle">3.5 ч</text>
</svg>