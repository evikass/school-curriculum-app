<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиенты -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c94c5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="5" y="5" width="490" height="340" fill="none" stroke="#4a6fa5" stroke-width="3" rx="10"/>
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#6c94c5" stroke-width="1" rx="5" stroke-dasharray="5,3"/>
  
  <!-- Заголовок -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">РУССКИЙ ЯЗЫК · 9 КЛАСС</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">Сложноподчинённое предложение (СПП)</text>
  <rect x="150" y="25" width="200" height="35" fill="url(#headerGrad)" rx="5"/>
  <text x="25" y="45" font-family="Arial, sans-serif" font-size="14" fill="#4a6fa5" font-weight="bold">урок 12</text>
  
  <!-- Схема СПП -->
  <rect x="30" y="80" width="440" height="70" fill="url(#boxGrad)" stroke="#4a6fa5" stroke-width="2" rx="5"/>
  <text x="250" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Структура СПП</text>
  
  <!-- Главная часть -->
  <rect x="50" y="110" width="140" height="30" fill="#ffc107" stroke="#e0a800" stroke-width="1" rx="3"/>
  <text x="120" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Главная часть</text>
  
  <!-- Стрелка связи -->
  <path d="M 190 125 L 210 125" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGrad)"/>
    </marker>
  </defs>
  
  <!-- Средство связи -->
  <rect x="215" y="115" width="70" height="20" fill="#17a2b8" stroke="#138496" stroke-width="1" rx="3"/>
  <text x="250" y="129" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">союз/слово</text>
  
  <!-- Стрелка связи -->
  <path d="M 285 125 L 305 125" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Придаточная часть -->
  <rect x="310" y="110" width="140" height="30" fill="#6f42c1" stroke="#5a2d91" stroke-width="1" rx="3"/>
  <text x="380" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Придаточная часть</text>
  
  <!-- Средства связи -->
  <rect x="30" y="170" width="440" height="80" fill="url(#boxGrad)" stroke="#4a6fa5" stroke-width="2" rx="5"/>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Средства связи</text>
  
  <!-- Подчинительные союзы -->
  <text x="50" y="215" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">Подчинительные союзы:</text>
  <rect x="50" y="225" width="60" height="20" fill="#28a745" stroke="#1e7e34" stroke-width="1" rx="3"/>
  <text x="80" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">что, чтобы</text>
  <rect x="120" y="225" width="60" height="20" fill="#28a745" stroke="#1e7e34" stroke-width="1" rx="3"/>
  <text x="150" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">который, где</text>
  <rect x="190" y="225" width="60" height="20" fill="#28a745" stroke="#1e7e34" stroke-width="1" rx="3"/>
  <text x="220" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">когда, если</text>
  
  <!-- Союзные слова -->
  <text x="280" y="215" font-family="Arial, sans-serif" font-size="12" fill="#333" font-weight="bold">Союзные слова:</text>
  <rect x="280" y="225" width="60" height="20" fill="#dc3545" stroke="#c82333" stroke-width="1" rx="3"/>
  <text x="310" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">кто, что</text>
  <rect x="350" y="225" width="60" height="20" fill="#dc3545" stroke="#c82333" stroke-width="1" rx="3"/>
  <text x="380" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">какой, где</text>
  <rect x="420" y="225" width="50" height="20" fill="#dc3545" stroke="#c82333" stroke-width="1" rx="3"/>
  <text x="445" y="239" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">куда</text>
  
  <!-- Виды придаточных -->
  <rect x="30" y="270" width="440" height="60" fill="url(#boxGrad)" stroke="#4a6fa5" stroke-width="2" rx="5"/>
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Виды придаточных</text>
  
  <!-- Придаточные определительные -->
  <rect x="40" y="300" width="90" height="25" fill="#fd7e14" stroke="#e55a00" stroke-width="1" rx="3"/>
  <text x="85" y="317" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Определительные</text>
  
  <!-- Придаточные изъяснительные -->
  <rect x="140" y="300" width="90" height="25" fill="#20c997" stroke="#17a085" stroke-width="1" rx="3"/>
  <text x="185" y="317" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Изъяснительные</text>
  
  <!-- Придаточные обстоятельственные -->
  <rect x="240" y="300" width="100" height="25" fill="#6f42c1" stroke="#5a2d91" stroke-width="1" rx="3"/>
  <text x="290" y="317" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Обстоятельственные</text>
  
  <!-- Придаточные дополнительные -->
  <rect x="350" y="300" width="90" height="25" fill="#e83e8c" stroke="#c91a76" stroke-width="1" rx="3"/>
  <text x="395" y="317" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Дополнительные</text>
  
  <!-- Пример предложения -->
  <text x="25" y="350" font-family="Arial, sans-serif" font-size="10" fill="#4a6fa5" font-style="italic">Пример: Дети, которые играли в саду, весело смеялись.</text>
</svg>