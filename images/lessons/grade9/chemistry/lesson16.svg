<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ffdd00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9900;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="electronGrad">
      <stop offset="0%" style="stop-color:#00bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="4" rx="10" ry="10" />
  
  <!-- Угловой номер урока -->
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" font-weight="bold">Урок 15</text>
  
  <!-- Заголовок -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Щелочные металлы</text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Атомы щелочных металлов -->
  <!-- Литий Li -->
  <g transform="translate(80, 130)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8" />
    <circle cx="-10" cy="-10" r="5" fill="url(#electronGrad)" />
    <circle cx="10" cy="-10" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="10" r="5" fill="url(#electronGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Li</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Литий</text>
  </g>
  
  <!-- Натрий Na -->
  <g transform="translate(180, 130)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8" />
    <circle cx="-12" cy="-12" r="5" fill="url(#electronGrad)" />
    <circle cx="12" cy="-12" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="12" r="5" fill="url(#electronGrad)" />
    <circle cx="-8" cy="0" r="5" fill="url(#electronGrad)" />
    <circle cx="8" cy="0" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="-8" r="5" fill="url(#electronGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Na</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Натрий</text>
  </g>
  
  <!-- Калий K -->
  <g transform="translate(280, 130)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8" />
    <circle cx="-14" cy="-14" r="5" fill="url(#electronGrad)" />
    <circle cx="14" cy="-14" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="14" r="5" fill="url(#electronGrad)" />
    <circle cx="-10" cy="-5" r="5" fill="url(#electronGrad)" />
    <circle cx="10" cy="-5" r="5" fill="url(#electronGrad)" />
    <circle cx="-10" cy="5" r="5" fill="url(#electronGrad)" />
    <circle cx="10" cy="5" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="-10" r="5" fill="url(#electronGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">K</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Калий</text>
  </g>
  
  <!-- Рубидий Rb -->
  <g transform="translate(380, 130)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8" />
    <circle cx="-15" cy="-15" r="5" fill="url(#electronGrad)" />
    <circle cx="15" cy="-15" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="15" r="5" fill="url(#electronGrad)" />
    <circle cx="-12" cy="-6" r="5" fill="url(#electronGrad)" />
    <circle cx="12" cy="-6" r="5" fill="url(#electronGrad)" />
    <circle cx="-12" cy="6" r="5" fill="url(#electronGrad)" />
    <circle cx="12" cy="6" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="-12" r="5" fill="url(#electronGrad)" />
    <circle cx="-6" cy="-12" r="5" fill="url(#electronGrad)" />
    <circle cx="6" cy="-12" r="5" fill="url(#electronGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Rb</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Рубидий</text>
  </g>
  
  <!-- Цезий Cs -->
  <g transform="translate(430, 130)">
    <circle cx="0" cy="0" r="25" fill="url(#atomGrad)" opacity="0.8" />
    <circle cx="-16" cy="-16" r="5" fill="url(#electronGrad)" />
    <circle cx="16" cy="-16" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="16" r="5" fill="url(#electronGrad)" />
    <circle cx="-13" cy="-7" r="5" fill="url(#electronGrad)" />
    <circle cx="13" cy="-7" r="5" fill="url(#electronGrad)" />
    <circle cx="-13" cy="7" r="5" fill="url(#electronGrad)" />
    <circle cx="13" cy="7" r="5" fill="url(#electronGrad)" />
    <circle cx="0" cy="-13" r="5" fill="url(#electronGrad)" />
    <circle cx="-7" cy="-13" r="5" fill="url(#electronGrad)" />
    <circle cx="7" cy="-13" r="5" fill="url(#electronGrad)" />
    <circle cx="-7" cy="0" r="5" fill="url(#electronGrad)" />
    <circle cx="7" cy="0" r="5" fill="url(#electronGrad)" />
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Cs</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Цезий</text>
  </g>
  
  <!-- Взаимодействие с водой -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="400" height="80" fill="#e6f7ff" stroke="#3b82f6" stroke-width="1" rx="5" ry="5" />
    <text x="200" y="20" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Взаимодействие с водой</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">2Na + 2H₂O → 2NaOH + H₂↑</text>
    <text x="100" y="65" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">Натрий реагирует бурно</text>
    
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">2K + 2H₂O → 2KOH + H₂↑</text>
    <text x="250" y="65" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">Калий реагирует очень бурно</text>
  </g>
  
  <!-- Оксиды и гидроксиды -->
  <g transform="translate(50, 320)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="bold">Оксиды: Li₂O, Na₂O, K₂O, Rb₂O, Cs₂O</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="bold">Пероксиды: Na₂O₂, K₂O₂</text>
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="bold">Гидроксиды: LiOH, NaOH, KOH, RbOH, CsOH</text>
    <text x="250" y="18" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="bold">Основания щелочных металлов</text>
  </g>
  
  <!-- Свойства -->
  <g transform="translate(100, 90)">
    <path d="M0,0 L300,0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" />
    <text x="150" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">Свойства щелочных металлов:</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Мягкие металлы с низкой температурой плавления</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Высокие химические активности</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Хорошее электропроводники</text>
  </g>
  
  <!-- Применение -->
  <g transform="translate(30, 185)">
    <circle cx="10" cy="10" r="3" fill="#ff6b6b" />
    <text x="20" y="14" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Литий - батареи</text>
    <circle cx="10" cy="30" r="3" fill="#ff6b6b" />
    <text x="20" y="34" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Натрий - лампы</text>
    <circle cx="10" cy="50" r="3" fill="#ff6b6b" />
    <text x="20" y="54" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Калий - удобрения</text>
    <circle cx="150" cy="10" r="3" fill="#ff6b6b" />
    <text x="160" y="14" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Рубидий - фотоэлементы</text>
    <circle cx="150" cy="30" r="3" fill="#ff6b6b" />
    <text x="160" y="34" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">Цезий - атомные часы</text>
  </g>
  
  <!-- Уравнение реакции с кислородом -->
  <g transform="translate(300, 195)">
    <rect x="0" y="0" width="180" height="60" fill="#fff0f5" stroke="#ff69b4" stroke-width="1" rx="3" ry="3" />
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Реакция с кислородом:</text>
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">4Na + O₂ → 2Na₂O</text>
    <text x="90" y="55" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">2Na + O₂ → Na₂O₂</text>
  </g>
  
  <!-- Декоративные элементы -->
  <path d="M20,30 Q30,20 40,30" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M460,30 Q470,20 480,30" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.5" />
  
  <!-- Электронные уровни -->
  <circle cx="80" cy="130" r="30" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" />
  <circle cx="180" cy="130" r="30" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" />
  <circle cx="280" cy="130" r="30" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" />
  <circle cx="380" cy="130" r="30" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" />
  <circle cx="430" cy="130" r="30" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" />
</svg>