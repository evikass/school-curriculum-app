<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="grad4">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#2E7D32" stroke-width="3" rx="5"/>
  
  <!-- Заголовок и класс -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2E7D32">ХИМИЯ · 9 КЛАСС</text>
  <text x="250" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1B5E20">Углеводы. Моносахариды и полисахариды</text>
  <text x="460" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B5E20">Урок 12</text>
  
  <!-- Классификация углеводов -->
  <text x="50" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Классификация углеводов</text>
  
  <!-- Дерево классификации -->
  <line x1="70" y1="110" x2="70" y2="130" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="130" x2="200" y2="130" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="130" x2="70" y2="170" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="170" x2="200" y2="170" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="170" x2="70" y2="210" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="210" x2="200" y2="210" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="210" x2="70" y2="250" stroke="#2E7D32" stroke-width="2"/>
  <line x1="70" y1="250" x2="200" y2="250" stroke="#2E7D32" stroke-width="2"/>
  
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2E7D32">Углеводы</text>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E7D32">Простые</text>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E7D32">Сложные</text>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E7D32">Моносахариды</text>
  <text x="100" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E7D32">Полисахариды</text>
  
  <!-- Моносахариды -->
  <rect x="220" y="90" width="120" height="60" fill="url(#grad1)" rx="5" opacity="0.8"/>
  <text x="280" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Глюкоза</text>
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C₆H₁₂O₆</text>
  <text x="280" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">α-D-глюкопираноза</text>
  
  <rect x="220" y="160" width="120" height="60" fill="url(#grad2)" rx="5" opacity="0.8"/>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Фруктоза</text>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C₆H₁₂O₆</text>
  <text x="280" y="215" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">β-D-фруктофураноза</text>
  
  <!-- Дисахариды -->
  <rect x="350" y="90" width="120" height="60" fill="url(#grad3)" rx="5" opacity="0.8"/>
  <text x="410" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Сахароза</text>
  <text x="410" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C₁₂H₂₂O₁₁</text>
  <text x="410" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">глюкоза + фруктоза</text>
  
  <!-- Полисахариды -->
  <rect x="350" y="160" width="120" height="60" fill="url(#grad4)" rx="5" opacity="0.8"/>
  <text x="410" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">Крахмал</text>
  <text x="410" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">(C₆H₁₀O₅)ₙ</text>
  <text x="410" y="215" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2E7D32">аминополисахарид</text>
  
  <rect x="350" y="230" width="120" height="60" fill="url(#grad4)" rx="5" opacity="0.8"/>
  <text x="410" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">Целлюлоза</text>
  <text x="410" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">(C₆H₁₀O₅)ₙ</text>
  <text x="410" y="285" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2E7D32">структурный полимер</text>
  
  <!-- Фотосинтез -->
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Фотосинтез</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">6CO₂ + 6H₂O + свет → C₆H₁₂O₆ + 6O₂</text>
  
  <!-- Реакция с оксидом серебра -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Реакция с Ag₂O</text>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">R-CHO + 2[Ag(NH₃)₂]OH → R-COONH₄ + 2Ag↓ + 3NH₃ + H₂O</text>
  
  <!-- Гидролиз -->
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">Гидролиз:</text>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆</text>
  
  <!-- Структура глюкозы -->
  <g transform="translate(30, 240)">
    <circle cx="0" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <circle cx="15" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <circle cx="30" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <circle cx="45" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <circle cx="60" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    <circle cx="75" cy="0" r="5" fill="#FFD54F" stroke="#FFA000" stroke-width="1"/>
    
    <line x1="5" y1="0" x2="10" y2="0" stroke="#FFA000" stroke-width="1"/>
    <line x1="20" y1="0" x2="25" y2="0" stroke="#FFA000" stroke-width="1"/>
    <line x1="35" y1="0" x2="40" y2="0" stroke="#FFA000" stroke-width="1"/>
    <line x1="50" y1="0" x2="55" y2="0" stroke="#FFA000" stroke-width="1"/>
    <line x1="65" y1="0" x2="70" y2="0" stroke="#FFA000" stroke-width="1"/>
    
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C1</text>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C2</text>
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C3</text>
    <text x="45" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C4</text>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C5</text>
    <text x="75" y="20" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#2E7D32">C6</text>
  </g>
  
  <!-- Углеводная цепь крахмала -->
  <g transform="translate(200, 290)">
    <rect x="0" y="0" width="40" height="20" fill="url(#grad3)" rx="2" opacity="0.7"/>
    <rect x="45" y="0" width="40" height="20" fill="url(#grad3)" rx="2" opacity="0.7"/>
    <rect x="90" y="0" width="40" height="20" fill="url(#grad3)" rx="2" opacity="0.7"/>
    <rect x="135" y="0" width="40" height="20" fill="url(#grad3)" rx="2" opacity="0.7"/>
    <text x="20" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">G</text>
    <text x="65" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">G</text>
    <text x="110" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">G</text>
    <text x="155" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">G</text>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2E7D32">(G)ₙ</text>
  </g>
  
  <!-- Мелкие декоративные элементы -->
  <circle cx="470" cy="100" r="3" fill="#FFD54F"/>
  <circle cx="480" cy="110" r="3" fill="#FFD54F"/>
  <circle cx="470" cy="120" r="3" fill="#FFD54F"/>
  
  <polygon points="30,50 40,50 35,60" fill="#4CAF50" opacity="0.7"/>
  <polygon points="460,50 470,50 465,60" fill="#4CAF50" opacity="0.7"/>
</svg>