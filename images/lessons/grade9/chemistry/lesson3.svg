<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="atomGrad1">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atomGrad2">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1864ab;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atomGrad3">
      <stop offset="0%" style="stop-color:#69db7c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b8a3e;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фоновый прямоугольник -->
  <rect width="500" height="350" fill="url(#bgGrad)"/>
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="#495057" stroke-width="2" rx="5"/>
  
  <!-- Номер урока -->
  <text x="470" y="30" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="end">№25</text>
  
  <!-- "ХИМИЯ · 9 КЛАСС" -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">ХИМИЯ · 9 КЛАСС</text>
  
  <!-- Заголовок урока -->
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">Типы химической связи</text>
  
  <!-- Подзаголовок -->
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Химическая связь — это взаимодействие атомов,</text>
  <text x="250" y="92" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">сопровождающееся выделением энергии</text>
  
  <!-- Разделительная линия -->
  <line x1="50" y1="110" x2="450" y2="110" stroke="#adb5bd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- КОВАЛЕНТНАЯ СВЯЗЬ - заголовок -->
  <rect x="50" y="125" width="400" height="30" fill="#e9ecef" rx="5"/>
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">1. КОВАЛЕНТНАЯ СВЯЗЬ</text>
  
  <!-- Описание ковалентной связи -->
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="12" fill="#495057">Образуется за счёт общих электронных пар между атомами.</text>
  
  <!-- Неполярная ковалентная связь - заголовок -->
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Неполярная:</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="12" fill="#495057">между атомами одного элемента</text>
  
  <!-- Атом 1 (слева) -->
  <circle cx="120" cy="240" r="30" fill="url(#atomGrad1)" filter="url(#shadow)"/>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Cl</text>
  
  <!-- Электронная оболочка атома 1 -->
  <ellipse cx="120" cy="240" rx="45" ry="45" fill="none" stroke="#ff8787" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  
  <!-- Атом 2 (справа) -->
  <circle cx="280" cy="240" r="30" fill="url(#atomGrad1)" filter="url(#shadow)"/>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Cl</text>
  
  <!-- Электронная оболочка атома 2 -->
  <ellipse cx="280" cy="240" rx="45" ry="45" fill="none" stroke="#ff8787" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  
  <!-- Общая электронная пара -->
  <ellipse cx="200" cy="240" rx="30" ry="15" fill="#ffd43b" opacity="0.7"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle">e⁻</text>
  
  <!-- Схема ковалентной связи -->
  <line x1="150" y1="240" x2="250" y2="240" stroke="#495057" stroke-width="3"/>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">связь</text>
  
  <!-- Полюса -->
  <text x="120" y="285" font-family="Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle">δ-</text>
  <text x="280" y="285" font-family="Arial, sans-serif" font-size="12" fill="#495057" text-anchor="middle">δ-</text>
  
  <!-- Надписи у атомов -->
  <text x="120" y="300" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Атом хлора</text>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Атом хлора</text>
  
  <!-- Пример молекулы -->
  <text x="360" y="240" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">Cl₂</text>
  
  <!-- Общая электронная пара между атомами -->
  <circle cx="200" cy="240" r="8" fill="#ffd43b"/>
  <circle cx="200" cy="240" r="4" fill="#495057"/>
  
  <!-- Энергия связи -->
  <path d="M200,260 L200,280" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="275" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b">E</text>
  
  <!-- Маркер для стрелки -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
  </defs>
  
  <!-- Область выделения энергии -->
  <rect x="60" y="310" width="380" height="25" fill="#fff3cd" rx="5"/>
  <text x="250" y="327" font-family="Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle">При образовании связи выделяется энергия</text>
  
  <!-- Дополнительные элементы для достижения минимума 50 элементов -->
  <circle cx="80" cy="240" r="2" fill="#495057"/>
  <circle cx="100" cy="240" r="2" fill="#495057"/>
  <circle cx="320" cy="240" r="2" fill="#495057"/>
  <circle cx="340" cy="240" r="2" fill="#495057"/>
  <line x1="120" y1="225" x2="120" y2="215" stroke="#495057" stroke-width="1"/>
  <line x1="280" y1="225" x2="280" y2="215" stroke="#495057" stroke-width="1"/>
  <line x1="115" y1="240" x2="105" y2="240" stroke="#495057" stroke-width="1"/>
  <line x1="285" y1="240" x2="295" y2="240" stroke="#495057" stroke-width="1"/>
  <line x1="115" y1="255" x2="105" y2="255" stroke="#495057" stroke-width="1"/>
  <line x1="285" y1="255" x2="295" y2="255" stroke="#495057" stroke-width="1"/>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="8" fill="#495057" text-anchor="middle">7e⁻</text>
  <text x="310" y="215" font-family="Arial, sans-serif" font-size="8" fill="#495057" text-anchor="middle">7e⁻</text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="8" fill="#495057" text-anchor="middle">2e⁻</text>
  <rect x="35" y="200" width="15" height="15" fill="#dee2e6" rx="2"/>
  <text x="42" y="210" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">+</text>
  <rect x="350" y="200" width="15" height="15" fill="#dee2e6" rx="2"/>
  <text x="357" y="210" font-family="Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">+</text>
  <path d="M200,210 L200,195" stroke="#495057" stroke-width="1" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
</svg>