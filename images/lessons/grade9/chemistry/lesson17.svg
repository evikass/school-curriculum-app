<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4e6f1;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="metalGrad">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#bdc3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="bubbleGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="500" height="350" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка -->
  <rect x="10" y="10" width="480" height="330" fill="none" stroke="url(#frameGrad)" stroke-width="3" />
  <rect x="15" y="15" width="470" height="330" fill="none" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="3,3" />
  
  <!-- Заголовок и номер урока -->
  <text x="250" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Щёлочноземельные металлы</text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">ХИМИЯ · 9 КЛАСС</text>
  <text x="45" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Урок 18</text>
  
  <!-- Периодическая таблица (фрагмент) -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="70" height="80" fill="url(#metalGrad)" stroke="#7f8c8d" stroke-width="1.5" rx="3" />
    <rect x="80" y="0" width="70" height="80" fill="url(#metalGrad)" stroke="#7f8c8d" stroke-width="1.5" rx="3" />
    <rect x="160" y="0" width="70" height="80" fill="url(#metalGrad)" stroke="#7f8c8d" stroke-width="1.5" rx="3" />
    <rect x="240" y="0" width="70" height="80" fill="url(#metalGrad)" stroke="#7f8c8d" stroke-width="1.5" rx="3" />
    
    <!-- Mg -->
    <text x="35" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Mg</text>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">12</text>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">24,3</text>
    
    <!-- Ca -->
    <text x="115" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Ca</text>
    <text x="115" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">20</text>
    <text x="115" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">40,1</text>
    
    <!-- Sr -->
    <text x="195" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Sr</text>
    <text x="195" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">38</text>
    <text x="195" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">87,6</text>
    
    <!-- Ba -->
    <text x="275" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Ba</text>
    <text x="275" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">56</text>
    <text x="275" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">137,3</text>
  </g>
  
  <!-- Строение атома кальция -->
  <g transform="translate(350, 120)">
    <circle cx="0" cy="0" r="25" fill="url(#metalGrad)" stroke="#34495e" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2" />
    
    <!-- Электроны -->
    <circle cx="18" cy="0" r="3" fill="#3498db" />
    <circle cx="-18" cy="0" r="3" fill="#3498db" />
    <circle cx="0" cy="18" r="3" fill="#3498db" />
    <circle cx="0" cy="-18" r="3" fill="#3498db" />
    <circle cx="12.7" cy="12.7" r="3" fill="#3498db" />
    <circle cx="-12.7" cy="12.7" r="3" fill="#3498db" />
    <circle cx="12.7" cy="-12.7" r="3" fill="#3498db" />
    <circle cx="-12.7" cy="-12.7" r="3" fill="#3498db" />
    
    <!-- Ядро -->
    <circle cx="0" cy="0" r="6" fill="#e74c3c" />
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">20</text>
  </g>
  
  <!-- Текст о строении -->
  <text x="350" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Строение атома Ca</text>
  <text x="350" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">2e⁻ 8e⁻ 8e⁻ 2e⁻</text>
  
  <!-- Жёсткая вода -->
  <g transform="translate(50, 200)">
    <path d="M0,0 Q20,-10 40,0 Q60,10 80,0" fill="url(#waterGrad)" />
    <path d="M0,20 Q20,10 40,20 Q60,30 80,20" fill="url(#waterGrad)" />
    <path d="M0,40 Q20,30 40,40 Q60,50 80,40" fill="url(#waterGrad)" />
    
    <!-- Пузырьки в воде -->
    <circle cx="25" cy="15" r="3" fill="url(#bubbleGrad)" />
    <circle cx="45" cy="35" r="4" fill="url(#bubbleGrad)" />
    <circle cx="65" cy="25" r="2.5" fill="url(#bubbleGrad)" />
    <circle cx="35" cy="50" r="3.5" fill="url(#bubbleGrad)" />
    
    <!-- CaCO3 в воде -->
    <g transform="translate(20, 10)">
      <circle cx="0" cy="0" r="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" />
      <text x="0" y="3" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#2c3e50">CaCO₃</text>
    </g>
    
    <g transform="translate(50, 30)">
      <circle cx="0" cy="0" r="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" />
      <text x="0" y="3" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#2c3e50">MgCO₃</text>
    </g>
  </g>
  
  <!-- Текст о жёсткой воде -->
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Жёсткая вода</text>
  <text x="90" y="285" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Содержит Ca²⁺, Mg²⁺</text>
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">и HCO₃⁻ ионы</text>
  
  <!-- Способы умягчения воды -->
  <g transform="translate(250, 200)">
    <!-- Первый способ -->
    <rect x="0" y="0" width="100" height="40" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" rx="5" />
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2e7d32">Кипячение:</text>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#388e3c">Ca(HCO₃)₂ → CaCO₃↓</text>
    
    <!-- Второй способ -->
    <rect x="0" y="50" width="100" height="40" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" rx="5" />
    <text x="50" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">Фильтрация:</text>
    <text x="50" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976d2">Через цеолиты</text>
  </g>
  
  <!-- Текст о свойствах металлов -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Свойства:</text>
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Активные металлы</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Восстанавливаются</text>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Реагируют с кислотами</text>
  
  <!-- Уравнение реакции -->
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Ca + 2HCl →</text>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">CaCl₂ + H₂↑</text>
  
  <!-- Применение кальция -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="80" height="20" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="3" />
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e65100">Строительство</text>
  </g>
  
  <g transform="translate(140, 320)">
    <rect x="0" y="0" width="80" height="20" fill="#fce4ec" stroke="#e91e63" stroke-width="1" rx="3" />
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#880e4f">Металлургия</text>
  </g>
  
  <g transform="translate(230, 320)">
    <rect x="0" y="0" width="80" height="20" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1" rx="3" />
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1a237e">Сельское хозяйство</text>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="30" cy="30" r="3" fill="#3498db" opacity="0.5" />
  <circle cx="470" cy="30" r="3" fill="#e74c3c" opacity="0.5" />
  <circle cx="30" cy="320" r="3" fill="#2ecc71" opacity="0.5" />
  <circle cx="470" cy="320" r="3" fill="#f39c12" opacity="0.5" />
  
  <!-- Стрелки -->
  <path d="M150,120 L180,120" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M350,120 L380,120" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d" />
    </marker>
  </defs>
</svg>