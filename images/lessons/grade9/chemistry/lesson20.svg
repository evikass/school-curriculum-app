<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1e7f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fbff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f7ff;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="atomGrad">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="atomGrad2">
      <stop offset="0%" style="stop-color:#4834d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3742fa;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Фоновая рамка -->
  <rect x="10" y="10" width="480" height="330" fill="url(#frameGrad)" stroke="#3498db" stroke-width="2" rx="8"/>
  
  <!-- Внутренняя область -->
  <rect x="20" y="20" width="460" height="310" fill="url(#bgGrad)" rx="5"/>
  
  <!-- Номер урока -->
  <text x="470" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="end" font-weight="bold">урок 12</text>
  
  <!-- Заголовок -->
  <text x="250" y="45" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="bold">ХИМИЯ · 9 КЛАСС</text>
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="22" fill="#2980b9" text-anchor="middle" font-weight="bold">Предельные углеводороды</text>
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="18" fill="#34495e" text-anchor="middle">(алканы)</text>
  
  <!-- Гомологический ряд -->
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Гомологический ряд:</text>
  
  <!-- Метан -->
  <circle cx="60" cy="150" r="15" fill="url(#atomGrad)"/>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">C</text>
  <line x1="60" y1="165" x2="60" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="55" y1="165" x2="55" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="65" y1="165" x2="65" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="60" y1="165" x2="45" y2="180" stroke="#34495e" stroke-width="2"/>
  <line x1="60" y1="165" x2="75" y2="180" stroke="#34495e" stroke-width="2"/>
  <circle cx="60" cy="190" r="12" fill="url(#atomGrad2)"/>
  <circle cx="45" cy="190" r="12" fill="url(#atomGrad2)"/>
  <circle cx="75" cy="190" r="12" fill="url(#atomGrad2)"/>
  <circle cx="50" cy="205" r="12" fill="url(#atomGrad2)"/>
  <circle cx="70" cy="205" r="12" fill="url(#atomGrad2)"/>
  <text x="45" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
  <text x="75" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
  <text x="50" y="210" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle">CH₄ метан</text>
  
  <!-- Этан -->
  <g transform="translate(130, 0)">
    <circle cx="30" cy="150" r="15" fill="url(#atomGrad)"/>
    <text x="30" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">C</text>
    <line x1="45" y1="150" x2="75" y2="150" stroke="#34495e" stroke-width="2"/>
    <circle cx="90" cy="150" r="15" fill="url(#atomGrad)"/>
    <text x="90" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">C</text>
    <line x1="30" y1="165" x2="30" y2="180" stroke="#34495e" stroke-width="2"/>
    <line x1="25" y1="165" x2="25" y2="180" stroke="#34495e" stroke-width="2"/>
    <line x1="90" y1="165" x2="90" y2="180" stroke="#34495e" stroke-width="2"/>
    <line x1="95" y1="165" x2="95" y2="180" stroke="#34495e" stroke-width="2"/>
    <line x1="30" y1="165" x2="15" y2="180" stroke="#34495e" stroke-width="2"/>
    <line x1="90" y1="165" x2="105" y2="180" stroke="#34495e" stroke-width="2"/>
    <circle cx="30" cy="190" r="12" fill="url(#atomGrad2)"/>
    <circle cx="15" cy="190" r="12" fill="url(#atomGrad2)"/>
    <circle cx="90" cy="190" r="12" fill="url(#atomGrad2)"/>
    <circle cx="105" cy="190" r="12" fill="url(#atomGrad2)"/>
    <circle cx="20" cy="205" r="12" fill="url(#atomGrad2)"/>
    <circle cx="100" cy="205" r="12" fill="url(#atomGrad2)"/>
    <text x="15" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="30" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="90" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="105" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="20" y="210" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="100" y="210" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">H</text>
    <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle">C₂H₆ этан</text>
  </g>
  
  <!-- Номенклатура -->
  <text x="30" y="270" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Номенклатура:</text>
  <text x="30" y="290" font-family="Arial, sans-serif" font-size="13" fill="#34495e">- метан, этан, пропан, бутан, пентан, гексан...</text>
  <text x="30" y="310" font-family="Arial, sans-serif" font-size="13" fill="#34495e">- общая формула: CₙH₂ₙ₊₂</text>
  
  <!-- Химические свойства -->
  <text x="280" y="125" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Свойства:</text>
  
  <!-- Горение -->
  <text x="280" y="150" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">Горение:</text>
  <text x="280" y="170" font-family="Arial, sans-serif" font-size="12" fill="#34495e">CH₄ + 2O₂ → CO₂ + 2H₂O</text>
  
  <!-- Замещение -->
  <text x="280" y="195" font-family="Arial, sans-serif" font-size="14" fill="#3498db" font-weight="bold">Замещение:</text>
  <text x="280" y="215" font-family="Arial, sans-serif" font-size="12" fill="#34495e">CH₄ + Cl₂ → CH₃Cl + HCl</text>
  
  <!-- Пиролиз -->
  <text x="280" y="240" font-family="Arial, sans-serif" font-size="14" fill="#9b59b6" font-weight="bold">Пиролиз:</text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="12" fill="#34495e">CH₄ → C + 2H₂</text>
  
  <!-- Получение -->
  <text x="280" y="285" font-family="Arial, sans-serif" font-size="14" fill="#16a085" font-weight="bold">Получение:</text>
  <text x="280" y="305" font-family="Arial, sans-serif" font-size="12" fill="#34495e">- из природного газа</text>
  <text x="280" y="325" font-family="Arial, sans-serif" font-size="12" fill="#34495e">- при разложении органики</text>
  
  <!-- Применение -->
  <text x="30" y="140" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Применение:</text>
  <circle cx="50" cy="155" r="3" fill="#f39c12"/>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="12" fill="#34495e">топливо</text>
  <circle cx="130" cy="155" r="3" fill="#f39c12"/>
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="12" fill="#34495e">сырье для химии</text>
  
  <!-- Декоративные элементы -->
  <path d="M 460 100 Q 480 100 480 120" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 460 120 Q 480 120 480 140" stroke="#3498db" stroke-width="2" fill="none"/>
  <path d="M 460 140 Q 480 140 480 160" stroke="#3498db" stroke-width="2" fill="none"/>
  
  <polygon points="460,100 470,95 480,100" fill="#3498db"/>
  <polygon points="460,120 470,115 480,120" fill="#3498db"/>
  <polygon points="460,140 470,135 480,140" fill="#3498db"/>
</svg>